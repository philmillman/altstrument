# Configuration for the /discover skill and its gather script
# (.claude/skills/discover/candidates.ts). Reviewed data: edit by hand, commit
# changes like any other catalog change.

# Default lookback window in days for feeds, GitHub searches and prior-art commits.
since_days: 14

# Sent on every feed request. lines (llllllll.co) refuses non-browser agents.
user_agent: "Mozilla/5.0 (compatible; altstrument-discover/0.1; +https://altstrument.org)"

# Case-insensitive substrings. A feed item is kept when its title or summary
# contains one of these, or names a device in the catalog. Deliberately narrow:
# "mod" and "hack" alone match too much modular-synth news.
keywords:
  - firmware
  - custom os
  - alternative os
  - alternative firmware
  - custom firmware
  - third-party firmware
  - unofficial
  - open source
  - open-source
  - hacked
  - jailbreak
  - reverse engineer
  - reverse-engineer

# RSS or Atom feeds. `prefiltered: true` means every item already matches
# (a search feed), so the keyword filter is skipped.
feeds:
  - label: CDM
    url: https://cdm.link/feed/
  - label: Matrixsynth
    url: https://www.matrixsynth.com/feeds/posts/default?alt=rss
  - label: Synthtopia
    url: https://www.synthtopia.com/feed/
  - label: Gearnews
    url: https://www.gearnews.com/feed/
  - label: Synth Anatomy
    url: https://synthanatomy.com/feed
  - label: Elektronauts
    url: https://www.elektronauts.com/latest.rss
  - label: lines
    url: https://llllllll.co/latest.rss
  - label: MOD WIGGLER
    url: https://modwiggler.com/forum/feed.php
  - label: r/synthesizers (firmware search)
    url: https://www.reddit.com/r/synthesizers/search.rss?q=firmware&sort=new&restrict_sr=on
    prefiltered: true
  - label: r/synthdiy (firmware search)
    url: https://www.reddit.com/r/synthdiy/search.rss?q=firmware&sort=new&restrict_sr=on
    prefiltered: true
  - label: r/eurorack (firmware search)
    url: https://www.reddit.com/r/eurorack/search.rss?q=firmware&sort=new&restrict_sr=on
    prefiltered: true

# GitHub repository search queries. The script appends `fork:false pushed:>DATE`.
github_queries:
  - '"custom firmware" synth'
  - '"custom firmware" sampler'
  - '"custom firmware" groovebox'
  - '"custom firmware" eurorack'
  - '"alternative firmware" synth'
  - '"alternative firmware" eurorack'
  - '"alternative firmware" module'
  - '"open source firmware" pedal'
  - '"open source firmware" midi controller'
  - 'topic:eurorack firmware'
  - 'topic:synthesizer firmware'
  - 'topic:synth firmware'

# One search per device in src/content/devices. {name} is the device display
# name, {manufacturer} the manufacturer. Requiring the manufacturer keeps
# generic names (Force, Tracker, Arc) from pulling in unrelated projects.
device_query_template: '{manufacturer} "{name}" firmware'

# Categories whose devices need different searches, one per template. Consoles
# and handhelds only matter for music software, and "<console> firmware" mostly
# finds general custom firmware, so they search for music terms instead.
# GitHub repository search treats OR as top level, so each term is its own query.
# A bare "tracker" also matches expense and task trackers, so trackers are
# searched as "music tracker" and chiptune.
category_query_templates:
  handheld:
    - '"{name}" chiptune'
    - '"{name}" "music tracker"'
    - '"{name}" synth'
    - '"{name}" midi'

# Per device slug, the names to search for instead of the display name (which
# can be too long or too generic). Default: the display name before any " / ".
device_search_names:
  anbernic-rg35xx: [RG35XX]
  anbernic-rg-nano: [RG Nano]
  atari-lynx: [Atari Lynx]
  m5stack-cardputer: [Cardputer]
  miyoo-miyoo-mini: [Miyoo Mini]
  nintendo-3ds: [Nintendo 3DS]
  nintendo-game-boy-advance: [Game Boy Advance, GBA]
  portmaster-compatible-handhelds: [PortMaster]
  sega-master-system-game-gear: [Master System, Game Gear]
  sega-mega-drive: [Mega Drive, Sega Genesis]
  sony-ps-vita: [PS Vita]
  zynthian: [Zynthian]

# Per device slug, exact queries that replace the templates. "NES" also matches
# words like "Nest", so it is only searched together with chiptune terms.
device_queries:
  nintendo-nes:
    - '"NES" chiptune'
    - '"NES" "music tracker"'
    - '"Famicom" chiptune'

# Other catalogs of music-gear firmware. Recent commits here often mean a new project.
prior_art_repos:
  - Lapin/awesome-music-gear-firmware
  - aroum/fm1-custom-fw
  - Maxhodges/noise-engineering-firmware-index
  - pichenettes/mutable-instruments-documentation

