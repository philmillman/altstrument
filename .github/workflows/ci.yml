name: CI

# Keep this `pull_request`, never `pull_request_target`: PRs from forks run
# their own code here, and must get no secrets and a read-only token.
on:
  pull_request:
  push:
    branches: [main]
  # Hotlinked media rot without a commit; PRs only check their own files, so a
  # daily run on main checks every link. Outside PRs broken links are warnings
  # listed in the job summary, never a failure (cleaned up during /discover).
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so the daily run and a push to main don't cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out its merge commit; HEAD^1 is the base branch tip.
          fetch-depth: 2
          persist-credentials: false

      # Only the PR's own files get their hotlinked media checked (see
      # scripts/validate.ts). The list goes to a file at a fixed path: paths
      # come from the PR, so none of them is ever written to $GITHUB_ENV.
      - name: List files this PR changes
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse --verify -q HEAD^2 > /dev/null || { echo "::error::expected a PR merge commit"; exit 1; }
          list="$RUNNER_TEMP/changed-files"
          git diff -z --no-renames --name-only HEAD^1 HEAD > "$list"
          echo "ALTSTRUMENT_CHANGED_FILES=$list" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The runner image can lag behind the newest 22.x; Astro 7.4 needs >=22.23.4.
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro incremental build cache and content data store (node_modules/.astro).
      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # strict on PRs (their own files' media must resolve); soft on main and
      # the daily run, where a link that rotted upstream is reported, not fatal.
      - run: pnpm validate
        env:
          ALTSTRUMENT_MEDIA_CHECK: ${{ github.event_name == 'pull_request' && 'strict' || 'soft' }}
      - run: pnpm check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # CI builds are not deployed; any absolute URL will do.
          SITE_URL: https://example.com
          # The validate step above already checked hotlinked media.
          ALTSTRUMENT_MEDIA_CHECK: 'off'
