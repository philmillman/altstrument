name: Metrics weekly refresh

# Refreshes the GitHub metrics snapshot for every entry (see src/lib/repo-metrics.ts),
# uploads it to the `metrics` release and opens (or updates) a PR with the new
# lock, listing the entries whose public rating changes. Also deletes release
# assets that no lock on main has referenced in the last 60 days.
#
# `--full` checks every repo with a light GraphQL query and only refetches
# history, forks and contributors for repos pushed since their last fetch, with
# conditional contributor requests, so a weekly run fits the GITHUB_TOKEN
# budget (1,000 REST requests an hour); the fetch waits for the reset if not.
#
# The token: a one-hour token from the metrics GitHub App when vars.METRICS_APP_ID
# and secrets.METRICS_APP_PRIVATE_KEY are set, else GITHUB_TOKEN. It is handed only
# to the steps that call GitHub (fetch/publish, push, PR and asset calls), never to
# install or build steps, and checkout does not store it in .git/config. Actions
# are pinned to commit SHAs. A PR opened with
# GITHUB_TOKEN gets no CI run until someone pushes to it; with the app token it
# does, and it waits for your approval like any other PR.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics-weekly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: metrics-refresh
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # A one-hour token from the altstrument metrics GitHub App (vars.METRICS_APP_ID,
      # secrets.METRICS_APP_PRIVATE_KEY), limited to this repo's contents and PRs. The
      # app is not on main's bypass list, so it can't push to main or merge without
      # approval. Without the app, steps fall back to GITHUB_TOKEN.
      - id: app-token
        if: vars.METRICS_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.METRICS_APP_ID }}
          private-key: ${{ secrets.METRICS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The repo is public: clone without credentials and keep the token out of
          # .git/config, where install and build steps could read it.
          persist-credentials: false
          # Asset pruning reads the lock's history on main.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm metrics:fetch --full --prune --publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      - name: Ratings that change
        run: |
          {
            echo "Weekly refresh of the GitHub metrics snapshot (\`pnpm metrics:fetch --full --prune\`)."
            echo
            pnpm -s metrics:report --diff "origin/$BASE"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          lock=src/data/repo-metrics.lock.json
          if git diff --quiet -- "$lock"; then
            echo "Lock unchanged; no PR."
            exit 0
          fi
          title="Refresh quality metrics ($(date -u +%Y-%m-%d))"
          # Commit as the app's bot user when the app token is in use.
          if [ -n "$APP_SLUG" ]; then
            bot="${APP_SLUG}[bot]"
            git config user.name "$bot"
            git config user.email "$(gh api "users/$bot" --jq .id)+$bot@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git switch -C "$BRANCH"
          git add "$lock"
          git commit -m "$title"
          # Authenticate this push only (checkout kept no credentials).
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
            push --force origin "HEAD:refs/heads/$BRANCH"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      # After the PR, so a failure here never holds up the refresh.
      - name: Prune old release assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: pnpm metrics:prune-assets --ref "origin/$BASE"
