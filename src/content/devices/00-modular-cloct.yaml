notes: >-
  No custom firmware for Cloct is known. Both firmwares, OG and XEQ, are 00 Modular's
  own and no source repository or licence for them is linked from the maker's pages.
  The product page says new firmwares are in the works and will be open-sourced.
  Firmware updates and preset management go through a WebUSB page on the maker's
  site in a Chromium-based browser, and a browser simulator runs the module's
  interface.
