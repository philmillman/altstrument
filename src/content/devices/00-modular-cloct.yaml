name: Cloct
manufacturer: 00 Modular
category: eurorack
added: 2026-11-27
tagline: 10HP Eurorack clock and modulation source that splits one rate into eight outputs at ratios from ÷32 to ×32
description: >-
  Cloct is a 10HP Eurorack module from 00 Modular. It takes one clock or free-running
  rate and branches it into eight outputs, each running at its own ratio from ÷32 to
  ×32, with five inputs, three pots, an encoder and a 240 × 240 colour display.

  It is built on an STM32F405 with a 16-bit, eight-channel DAC8568. It ships with
  two firmwares, OG (LFO, envelope, chaos, random, trigger, gate and logic modes) and
  XEQ (an eight-output step sequencer with morphable A and B sequences). The board has
  a USB-C port, an I2C expansion header and a four-pin SWD header.
platform: STM32F405 (Arm Cortex-M4F)
stock_firmware: OG 1.0.0, XEQ 1.0.0
links:
