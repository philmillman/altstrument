name: Bitbox mk2
manufacturer: 1010music
category: eurorack
tagline: Touchscreen sampler module with effects and mixing
description: >-
  The Bitbox mk2 is a Eurorack sampler from 1010music with a 3.5 inch
  touchscreen. It records and plays samples, launches clips, slices and loops
  to tempo, and streams samples of up to 4 GB from a microSD card. It is
  controlled over CV and MIDI, stores its setups as presets, and has a faster
  processor than the original Bitbox, which adds effects and mixing. A black
  edition is sold alongside the silver one.
stock_firmware: 2.3.4
links:
  manufacturer: https://1010music.com/product/bitbox-mk2
notes: >-
  1010music writes the name as "mk2"; the patcher here calls it MkII. The patcher
  edits an official 2.3.4 image you supply yourself, and it is installed the same
  way as an official update, so putting 1010music's own 2.3.4 file back on the
  card returns the module to stock. 1010music also offers fxbox and synthbox
  firmware for this hardware through its Discord server; those are not listed
  here.
related: [1010music-bitbox-micro, 1010music-blackbox]
