name: 16n faderbank / 16nx
manufacturer: 16n faderbank project
category: controller
added: 2026-10-13
tagline: Open 16-fader MIDI / CV / i2c controller (Teensy 16n, RP2040 16nx)
description: >-
  The 16n is an open-source controller with sixteen faders, built around a
  Teensy 3.2 and sending MIDI over USB and a TRS MIDI jack, plus monome-style
  i2c for modules such as Teletype. The 16nx is the later revision, built on
  an RP2040 microcontroller with its own firmware repository. Both are
  published as open hardware and are usually built from the project's files or
  from kits.
platform: Teensy 3.2 (16n), RP2040 (16nx)
stock_firmware: "16n 2.2.0 / 16next 3.1.1"
links:
  manufacturer: https://16n-faderbank.github.io/
  community:
    - label: 16n wiki and user guide
      url: https://github.com/16n-faderbank/16n/wiki
    - label: 16n web editor
      url: https://16n-faderbank.github.io/editor
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
notes: >-
  16n is a monome-lineage open-hardware faderbank that sends USB and TRS MIDI,
  CV and monome-style i2c to Teletype, ansible and similar modules. Firmware is
  MIT and hardware is CC-BY-SA-4.0. The original Teensy 16n and the RP2040
  16nx have separate firmware repositories and are configured with the
  same browser editor.
related: [monome-teletype, monome-ansible, bpcmusic-telex]
