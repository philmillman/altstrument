name: Cardenza
manufacturer: 203 Systems
category: groovebox
added: 2026-11-18
tagline: Card-sized ESP32-S3 synthesiser and four-track groovebox with 56 lit keys, running CardenzaSynth, whose source is public
description: >-
  Cardenza (鸣片) is a card-sized synthesiser and groovebox from 203 Systems. It is built around an ESP32-S3 and has a
  240 by 135 colour screen, 56 keys with an LED under each, a speaker, an on-board microphone, a microSD card slot,
  an infrared transmitter, an I2C expansion port, Bluetooth and Wi-Fi, and a USB-C port that also carries USB MIDI
  and audio. It needs an external power source. The stock firmware is CardenzaSynth, a four-track groovebox with DX7,
  Juno, sampler and drum sources, a pattern sequencer, real-time recording, chords, arpeggios and effects, and the
  source code is public. A system menu called the 203 Launcher installs and switches firmware on the device itself,
  including firmware published by the community through the 203 Systems website.

  The 203 Systems shop page lists a limited first batch that ships worldwide from late November 2026, so units are
  only starting to reach buyers.
platform: ESP32-S3
stock_firmware: CardenzaSynth 0.2.1
