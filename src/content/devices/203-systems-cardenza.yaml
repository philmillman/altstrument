notes: >-
  Custom firmware is built on CardenzaHAL and installed through the 203 Launcher, not by flashing the chip directly.
  The CardenzaHAL documentation warns that idf.py flash erases the Launcher and the firmware it installed, and
  points to the 203c flash command instead. Holding the side HOME key while plugging in USB or at a reset enters the
  ESP32-S3 ROM download mode. The shop page says Cardputer V1.0 and V1.1 firmware can run on the Cardenza through
  the Launcher; the CardenzaSynth readme says the reverse does not apply, and its firmware is built only for the
  Cardenza. The shop page lists 8 MB of flash while the CardenzaHAL readme lists 16 MB.
