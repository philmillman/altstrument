      url: https://matrix.203.io/
    - label: 203 Systems Discord
      url: https://discord.gg/rRVCBHHPfw
    - label: Matrix OS GitHub discussions
      url: https://github.com/203-Systems/MatrixOS/discussions
notes: >-
  Matrix OS is the stock operating system and is open source, so custom work is mostly apps and control maps
  running on top of it rather than replacement firmware. The wiki warns that incorrect keypad calibration can
  force a reflash that wipes user data.
