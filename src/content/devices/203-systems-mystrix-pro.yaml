name: Mystrix Pro
manufacturer: 203 Systems
category: controller
added: 2026-10-17
tagline: Force-sensitive 8 by 8 RGB pad controller with underglow that runs the open-source Matrix OS
description: >-
  Mystrix Pro is the force-sensitive version of 203 Systems' Mystrix grid controller. It has an 8 by 8 matrix of
  RGB pads that sense pressure, 32 underglow LEDs, a hidden function key and two touch strips, and it connects
  over USB-C or Bluetooth MIDI. It is sold with a pack of TRS MIDI Type A and Type B adapters and a spare cable.
  Like the standard Mystrix it is built around an ESP32-S3 and runs Matrix OS, and its settings menu adds a keypad
  calibration page for the force sensors.
platform: ESP32-S3
stock_firmware: Matrix OS 3.2
links:
  manufacturer: https://203.io/products/mystrix-pro
  community:
