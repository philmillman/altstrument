name: Mystrix
manufacturer: 203 Systems
category: controller
added: 2026-10-17
tagline: Thin 8 by 8 RGB pad controller that runs the open-source Matrix OS
description: >-
  Mystrix is a USB grid controller from 203 Systems, a small company run by Nengzhuo Cai (Null). It has an
  8 by 8 matrix of RGB pads, a hidden function key in the centre and two touch strips, and it connects over
  USB-C or Bluetooth MIDI, with optional TRS MIDI adapters. It is built around an ESP32-S3 and runs Matrix OS,
  an open-source operating system whose built-in apps include a note and scale player, a performance mode, a
  step sequencer, a strum app and a configurable control map, and which also loads apps written in Python or
  C++. The standard model uses simple on-off pad switches, while the Pro model has a force-sensitive keypad.
platform: ESP32-S3
stock_firmware: Matrix OS 3.2
links:
