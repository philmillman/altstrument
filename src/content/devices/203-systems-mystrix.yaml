notes: >-
  Matrix OS is the stock operating system and is open source, so custom work is mostly apps and control maps
  running on top of it rather than replacement firmware. Matrix OS builds also exist for a Mystrix 2 hardware
  family that is not yet on the 203 Systems shop. The Matrix OS README lists an earlier STM32F1-based Mystrix
  Founder Edition as no longer supported since Matrix OS 3.0.
