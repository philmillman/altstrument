notes: >-
  The 203 Systems shop page sells it as a pre-order with a stated release price of 299 US dollars, offers a ceramic
  edition, and says a second batch is due in November. It also says a development SDK, schematics and CAD files will
  be published around the release date. The firmware repository is public and has no releases or tags yet.
