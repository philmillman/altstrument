name: NullPerator
manufacturer: 203 Systems
category: groovebox
added: 2026-10-17
tagline: Pocket-sized ESP32-S3 handheld tracker running a modified picoTracker engine
description: >-
  NullPerator is a small handheld tracker from 203 Systems, a company run by Nengzhuo Cai (Null). It is built
  around an ESP32-S3 and has a 1.54 inch 240 by 240 display, tactile buttons, a speaker and microphone,
  stereo audio in and out, TRS MIDI in and out, Bluetooth and Wi-Fi, a motion sensor, a microSD card slot and a
  720 mAh battery. Its firmware is a heavily modified fork of the picoTracker firmware with eight tracks and more
  instrument types, and the shop page says its project files can be moved to and from the RP2040 picoTracker.

  The same codebase is also built as an iOS app, an experimental Android app and a browser workbench.
platform: ESP32-S3
stock_firmware: NullPerator 0.2
