name: Dual Looping Delay
manufacturer: 4ms Company
category: eurorack
added: 2026-10-24
tagline: Two-channel clock-syncable looping delay module
description: >-
  The Dual Looping Delay (DLD) is a Eurorack module from 4ms Company, designed
  with Gary Hall. It holds two independent delay and loop channels, each with
  time, feedback, reverse and infinite-hold controls and its own send and
  return jacks, and can lock its delay times to an external clock through a
  ping input.

  The module records into SDRAM and runs on an STM32F427 with two CS4271 audio
  codecs. 4ms publishes the firmware source under the MIT license and updates
  the module by playing an audio file into its input through a built-in
  bootloader.
platform: STM32F427 (ARM Cortex-M4F, 180 MHz)
stock_firmware: "5"
