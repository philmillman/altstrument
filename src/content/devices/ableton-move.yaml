notes: >-
  Ableton does not support custom code on Move. Third-party projects use the SSH key page that the unit serves
  at move.local/development/ssh, and they warn that this is unsupported. They state that Ableton's documented DFU
  restore procedure returns a unit to stock, and that a Move firmware update disables the add-ons until their
  installer is run again. Most work for Move is Schwung and modules that run on top of it rather than replacement
  firmware.
