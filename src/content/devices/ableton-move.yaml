name: Move
manufacturer: Ableton
category: groovebox
added: 2026-10-17
tagline: Portable battery-powered instrument with 32 pads, eight encoders and a built-in sound engine
description: >-
  Move is a standalone portable instrument from Ableton. It has a 4 by 8 grid of pads, eight encoders and a main
  encoder, a small monochrome display, a built-in speaker, microphone, line input and output, a battery, and USB-C
  and USB-A ports. It runs its own sequencer, sampler and synth instruments without a computer, connects over
  Wi-Fi to a browser page on the unit, and exchanges sets with Ableton Live. The stock software runs on Linux and
  Ableton offers an SSH developer access page on the device.
platform: Linux-based Move OS
links:
  manufacturer: https://www.ableton.com/en/move/
  community:
