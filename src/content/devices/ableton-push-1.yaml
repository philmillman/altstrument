name: Push 1
manufacturer: Ableton
category: controller
tagline: Ableton's first USB pad controller, with an 8 by 8 pad grid and a text display
description: >-
  Push 1 is the first-generation Push, a controller from Ableton for Ableton Live. It has an 8 by 8 grid of pressure-sensitive pads, a touch strip, a row of encoders
  above a four-line text display, and many labelled buttons. It has no computer of its own and connects to a computer over USB, and its pads and buttons can also be used from a
  host program by putting it in User Mode. Push 2 replaced it with a colour display.
platform: USB controller driven by the host computer (no on-board OS)
links:
  manufacturer: https://web.archive.org/web/20150104195551/https://www.ableton.com/en/push/
notes: >-
  No custom firmware is catalogued for Push 1. The entry here is a browser tool that uses the pads and buttons as a MIDI surface in User Mode. It is not approved or supported by Ableton.
