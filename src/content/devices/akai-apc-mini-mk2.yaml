name: APC mini mk2
manufacturer: Akai Professional
category: controller
added: 2026-11-03
tagline: Compact USB pad controller with 64 RGB pads and 9 faders
description: >-
  The APC mini mk2 is a small USB controller from Akai Professional designed for Ableton Live. It has an 8 by 8 grid of RGB pads, nine faders, a row of
  track buttons and a column of scene launch buttons. The pad colours are set from the host over MIDI, with the maker documenting a communication protocol for it.
platform: USB controller driven by the host computer
links:
  manufacturer: https://www.akaipro.com/apc-mini-mk2
notes: >-
  No custom firmware is catalogued for the APC mini mk2. The entry here is a desktop app that sets the pad colours. It is not made or endorsed by Akai.
