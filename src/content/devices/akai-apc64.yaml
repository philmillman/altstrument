name: APC64
manufacturer: Akai Professional
category: controller
tagline: Pad controller with 64 RGB pads, touch strips and an OLED display
description: >-
  The APC64 is a USB controller from Akai Professional with an 8 by 8 grid of RGB pads, eight touch strips, a row of track buttons, an encoder and a small OLED display.
  It is built around Ableton Live's session view but also has its own Note, Chord, Step and Custom views, and it stores projects and global settings in its own memory.
platform: Not published
stock_firmware: 1.2.1.6
links:
  manufacturer: https://www.akaipro.com/apc64
notes: >-
  No custom firmware is catalogued for the APC64. The entry here is a host program that takes over the unit in its DAW mode. It is not made or endorsed by Akai, and it has been verified only on firmware 1.2.1.6.
