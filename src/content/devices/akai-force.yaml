name: Force
manufacturer: Akai Professional
category: groovebox
added: 2026-10-13
tagline: Standalone clip-launching production instrument
description: >-
  The Force is a standalone clip-launching production instrument from Akai
  Professional, announced in January 2019. It has an 8x8 RGB clip-launch
  matrix, a 7-inch multi-touch display, eight touch-sensitive knobs with small
  OLED displays, and a separate set of 16 velocity- and pressure-sensitive
  pads. It records and sequences without a computer and provides two audio
  inputs, four audio outputs, MIDI and CV I/O.
platform: Embedded Linux, shared by the standalone MPCs and Force
links:
  manufacturer: https://www.akaipro.com/force/
  community:
    - label: MockbaMod Discord
      url: https://discord.gg/HvNBpArSSa
    - label: MPC-LiveXplore wiki
      url: https://github.com/TheKikGen/MPC-LiveXplore/wiki
notes: >-
  Mods here keep Akai's factory application. MockbaMod loads extras from an SD
  card, and with no card inserted the unit runs stock. IamForce2 from the
  MPC-LiveXplore project goes the other way and runs Force software on MPC
  hardware.
