name: LPD8
manufacturer: Akai Professional
category: controller
tagline: Compact USB controller with 8 pads, 8 knobs and 4 stored programs
description: >-
  The LPD8 is a small USB pad controller from Akai Professional. It has eight backlit velocity-sensitive pads, eight knobs and four program memories, with the pad notes, program
  changes, controller numbers and knob ranges set per program. A second generation, the LPD8 mk2, was released later; this entry covers the original.
platform: Not published
links:
  manufacturer: https://web.archive.org/web/20170707200403/http://akaipro.com:80/product/lpd8
notes: >-
  No custom firmware is catalogued for the LPD8. The entry here is a browser editor that reads and writes the programs over MIDI SysEx. It is not made or endorsed by Akai.
