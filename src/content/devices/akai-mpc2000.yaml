name: MPC2000 / 2000XL
manufacturer: Akai Professional
category: sampler
added: 2026-10-13
tagline: MPC sampler and sequencer in Classic and XL versions
description: >-
  The MPC2000 is a 16-pad sampler and sequencer from Akai Professional,
  introduced in 1997. It plays 32 voices from 16-bit, 44.1 kHz stereo samples,
  has a multi-track sequencer, and stores data on a built-in floppy drive. The
  2000XL is the revised version with a larger display and an updated operating
  system.
stock_firmware: 1.72 (Classic) / 1.20 (XL)
links:
  community:
    - label: MPC2000 MODS
      url: https://vubeatz.com/mpc-mods.html
notes: >-
  MPC2000 MODS builds a new OS file from your original and leaves the
  original untouched. The author recommends running the built-in memory test
  on the stock OS first and warns against installing the Classic OS on the
  F-ROM expansion. The other entries are tools: emulators that run on a
  computer and libraries and scripts for the Akai disk format and the .PGM
  and .SND files.
