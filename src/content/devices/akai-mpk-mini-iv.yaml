name: MPK mini IV
manufacturer: Akai Professional
category: controller
added: 2026-11-04
tagline: 25-key USB and DIN MIDI controller with 8 pads, 8 knobs and a small colour screen
description: >-
  The MPK mini IV is the fourth generation of Akai Professional's compact MIDI keyboard. It has 25 mini keys, eight
  backlit pads, eight knobs, pitch and modulation wheels and a small colour display with an encoder, and it sends MIDI
  over USB and a 5-pin DIN output.

  Its controller chip is an Artery AT32F405 with 256 KB of flash. The keyboard starts through a bootloader that stays in
  place when the application is replaced, and a button combination at power-up returns it to update mode.
platform: Artery AT32F405 (Arm Cortex-M4)
stock_firmware: "1.41"
links:
  manufacturer: https://www.akaipro.com/mpk-mini-4/
  community:
    - label: giusmarci/open-mpk4 hardware notes
      url: https://github.com/giusmarci/open-mpk4/tree/main/docs/hardware
notes: >-
  The one replacement firmware catalogued, OPEN MPK4, installs through Akai's own bootloader after a flasher assembles an
  image from your own stock v1.41 file. Stock firmware is not hosted here. Software projects that only use the keyboard as an
  input device, such as Stame, do not change its firmware.
related: [akai-mpk-mini]
