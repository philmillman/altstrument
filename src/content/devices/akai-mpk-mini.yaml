name: MPK mini
manufacturer: Akai Professional
category: controller
tagline: Compact 25-key USB controller with 8 pads, 8 knobs and 4 stored programs
description: >-
  The MPK mini is a small USB MIDI keyboard controller from Akai Professional. It has 25 mini keys, eight velocity-sensitive pads in two
  banks, eight assignable knobs, an arpeggiator and four program memories that store the pad, knob, channel and arpeggiator settings.

  Several generations have been sold. The entry here follows the original model shown on the maker's archived product page; the editor catalogued
  for it uses a four-program SysEx layout that its README does not tie to a specific generation.
platform: Not published
links:
  manufacturer: https://web.archive.org/web/20170709155223/http://akaipro.com:80/product/mpkmini
notes: >-
  No custom firmware is catalogued for the MPK mini. The entry here is a browser editor that reads and writes the programs over MIDI SysEx. It is not made or endorsed by Akai.
