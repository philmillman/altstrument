name: MPK49
manufacturer: Akai Professional
category: controller
added: 2026-11-03
tagline: 49-key USB controller with 12 MPC pads, 8 knobs, 8 faders and 30 presets
description: >-
  The MPK49 is a discontinued USB MIDI performance keyboard from Akai Professional. It has 49 semi-weighted keys with aftertouch, twelve MPC-style pads in four banks,
  eight knobs, eight faders and eight switches in three control banks, an arpeggiator and a small display. Its 30 preset slots hold the full control layout.

  The maker's own preset editor, Vyzex, was a 32-bit program that has not kept up with newer operating systems, which is the gap the community editor fills.
platform: Not published
links:
