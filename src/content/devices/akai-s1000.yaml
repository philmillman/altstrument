name: S1000
manufacturer: Akai Professional
category: sampler
added: 2026-11-06
tagline: Rack-mount 16-bit stereo sampler from 1988 with 16 voices
description: >-
  The S1000 is a rack-mount stereo sampler from Akai Professional, released in 1988 and the first of the S-series.
  It records and plays 16-bit samples with 16 voices and 16 multitimbral parts, and has digital filters, a floppy
  drive and 2 MB of sample RAM that can be expanded. Later operating system versions added time-stretching. The
  S1100, S2000 and S3000 that followed read its sample disks and CDs.
links:
  community:
