      url: https://en.wikipedia.org/wiki/Akai_S1000
notes: >-
  No custom firmware for the S1000 is known. The one entry here is a desktop tool that builds and reads sample CDs
  in the S-series disc format.
related: [akai-s2000, akai-s3000]
