name: S2000
manufacturer: Akai Professional
category: sampler
added: 2026-11-06
tagline: Rack-mount 16-bit stereo sampler with 32 voices and a floppy drive
description: >-
  The S2000 is a rack-mount stereo sampler from Akai Professional, one of the S-series that began with the S1000. It plays 32 voices and uses expandable
  sample RAM, a floppy drive, and SCSI for hard disks and CD-ROM drives. Its effects board, the EB16, was an optional extra. Sample CDs and disks for the
  S1000, S2000 and S3000 share one disc format family.
platform: NEC V53 CPU, Akai L7A1045 voice chip
stock_firmware: "2.0"
links:
  manufacturer: https://web.archive.org/web/20010202214000/http://akaipro.com:80/products/S2000.html
notes: >-
  The firmware entry is a patch kit for OS 2.0 that boots from a floppy emulator and leaves ROM and flash alone. The other entry is a
  tool that builds and reads sample CDs in the S-series disc format.
related: [akai-s1000, akai-s3000, akai-z4-z8, akai-mpc3000]
