name: S3000 / S3000XL
manufacturer: Akai Professional
category: sampler
added: 2026-11-06
tagline: Rack-mount 16-bit stereo samplers with 32 voices and SCSI
description: >-
  The S3000 and the later S3000XL are rack-mount stereo samplers from Akai Professional's S-series. They play
  32 voices across 16 parts, with resonant filters, a floppy drive and SCSI for hard disks and CD-ROM drives. The
  S3000XL takes standard SIMMs for up to 32 MB of sample RAM and has a larger display, a stereo mix and eight
  individual outputs, and S/PDIF digital input and output. Both read S1000 sample disks and CDs.
