name: SampleKey
manufacturer: Akai Professional
category: sampler
added: 2026-10-28
tagline: Teased keyboard sampler related to the MPC Sample
description: >-
  The SampleKey is a keyboard sampler that Akai Professional showed in a short
  teaser video on 2026-10-27. Press coverage of the video describes a compact unit
  with a two-octave keyboard, pitch and mod wheels, knobs, an encoder and a screen,
  and a voice-over that mentions sampling on individual keys and key splits. Akai
  has not published a specification, price or release date, and press outlets spell
  the name SampleKey and Sample Key.
