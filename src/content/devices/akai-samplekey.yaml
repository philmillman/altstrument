notes: >-
  Announced 2026-10-27 in a teaser. The press says the teaser's voice-over claims the
  firmware will be opened to the community, but no source code, licence, product page
  or release exists yet. Everything on this entry rests on that video and the news
  reports about it. No image is shown because Akai has no product page or press kit
  for the unit and a video frame or news photo is not an acceptable source.
