name: Z4 / Z8
manufacturer: Akai Professional
category: sampler
added: 2026-11-03
tagline: Rack-mount Z-series samplers, driven by SysEx over USB
description: >-
  The Z4 and Z8 are rack-mount hardware samplers from Akai Professional's Z-series, the Z8 being the larger of the two. They load and play samples, programs and multis from disk media, and
  they can be controlled and sent files from a computer over USB using Akai's system exclusive commands. The MPC4000 uses a related command set, and some S-series samplers
  (S5000 and S6000) are partly supported by the same Python library.
platform: Not published
links:
  manufacturer: https://web.archive.org/web/20170618073644/http://www.akaipro.com/product/z8
notes: >-
  No custom firmware is catalogued for the Z4 or Z8. The entry here is a Python library for controlling the samplers and moving files over USB. It is not made or endorsed by Akai.
