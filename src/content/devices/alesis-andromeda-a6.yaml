name: A6 Andromeda
manufacturer: Alesis
category: synth
added: 2026-10-22
tagline: 16-voice analog polysynth with a digitally controlled signal path
description: >-
  The A6 Andromeda is a 61-key analog polyphonic synthesizer from Alesis, sold from 2000
  and now discontinued. It has 16 voices and 16 multitimbral parts, two analog oscillators
  and two analog filters per voice, and a Motorola ColdFire processor that handles voice
  control, patch storage and the effects.

  The last official operating system, V1.40.12, dates from 2002 and is installed over MIDI
  from a computer.
platform: Motorola ColdFire controlling an analog voice path
stock_firmware: 1.40.12
