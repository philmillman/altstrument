name: MMT-8
manufacturer: Alesis
category: other
added: 2026-11-07
tagline: Eight-track MIDI sequencer from the late 1980s
description: >-
  The MMT-8 is a hardware MIDI sequencer from Alesis with eight tracks, a 16x2 character display, a MIDI input and output and
  battery-backed memory. Its operating system runs from a socketed 27C256-type EPROM on an 8031 microcontroller. Songs and parts
  can be saved to tape or sent over MIDI.
platform: Intel 8031 (MCS-51)
notes: >-
  OpenMMT-8 and JAM-8 are replacement ROMs for the operating system EPROM. The original chip can be kept and refitted to return
  the unit to stock.
related: []
