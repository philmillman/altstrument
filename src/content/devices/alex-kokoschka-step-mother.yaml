name: Step Mother
manufacturer: Alex Kokoschka
category: controller
added: 2026-11-09
tagline: Teensy 4.1 pad controller with a step sequencer and a 303-style synth
description: >-
  The Step Mother is a small handmade controller with 23 mechanical keys, 20 LEDs and one knob, built around a
  Teensy 4.1. It connects to a computer, iPhone or iPad as a class-compliant USB MIDI and audio device. Its firmware
  holds a MIDI step sequencer and a bass synth that sends audio over USB. The PCB and enclosure files are published
  as open hardware, and assembled units are sold in small batches by the designer.
platform: Teensy 4.1 (NXP i.MX RT1062, ARM Cortex-M7)
links:
  manufacturer: https://github.com/AlexKokoschka/StepMother
  community:
    - label: Step Mother on Ko-fi (assembled units)
      url: https://ko-fi.com/s/28225d3770
    - label: StepDaddy firmware and updater
      url: https://github.com/AlexKokoschka/StepDaddy
notes: >-
  The firmware is open. Updates go through the Teensy bootloader, which the PROGRAM button on the Teensy also starts. No photo is shown: the hardware repository holds only CAD, PCB and 3D model files,
  and the project has no other image source that the catalog accepts.
