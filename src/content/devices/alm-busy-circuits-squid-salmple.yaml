name: Squid Salmple
manufacturer: ALM Busy Circuits
category: eurorack
added: 2026-10-30
tagline: eight-channel Eurorack sampler that loads sample banks from a USB drive
description: >-
  The Squid Salmple (ALM022) is a 21HP Eurorack sampler from ALM Busy Circuits with eight sample
  channels, each with a trigger input, and a small display for editing. Sample banks are stored as
  WAV-based files on a USB drive, and the module records from a sample input. It has four stereo-pair
  outputs, a mix output and three assignable CV inputs.
links:
  manufacturer: https://busycircuits.com/pages/alm022
notes: >-
  No custom firmware is catalogued for this module. The one entry is a computer-side bank editor that works on
  the files of the USB drive and does not change the module's firmware.
