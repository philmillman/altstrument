name: MicroFreak
manufacturer: Arturia
category: synth
added: 2026-10-13
tagline: Hybrid digital/analog paraphonic synth
description: >-
  The MicroFreak is a compact hybrid synthesizer from Arturia, released in
  2019. It combines a digital oscillator with several synthesis modes, an
  analog filter, and a pressure-sensitive flat keyboard with polyphonic
  aftertouch. It is paraphonic with four voices, and includes a sequencer,
  arpeggiator and a modulation matrix.
stock_firmware: 5.0.0.2084
links:
  manufacturer: https://www.arturia.com/products/hardware-synths/microfreak/overview
  community:
    - label: Freakier Firmware Labs
      url: https://freakierfirmware.com/microfreak/
    - label: SuperFreaker compatibility table
      url: https://freakierfirmware.com/compatibility/
notes: >-
  The custom firmware here (SuperFreaker, freakpatch and FreakSwap) supports
  official firmware 5.0.0.2084 and nothing newer; the patchers reject any other
  file, and the SuperFreaker authors advise not updating the official firmware
  until a newer version is listed as ported. Modified builds are loaded through Arturia MIDI Control
  Center's force upgrade, and the same step restores the official file.
  Host-side preset, wavetable and sample tools for the stock firmware are listed
  alongside it.
related: [arturia-minifreak]
