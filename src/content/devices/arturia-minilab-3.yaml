name: MiniLab 3
manufacturer: Arturia
category: controller
added: 2026-11-13
tagline: 25-key compact controller with pads, knobs, faders and an OLED screen
description: >-
  The MiniLab 3 is a compact 25-key MIDI controller from Arturia with eight RGB pads, eight endless knobs, four faders, two
  touch strips, an OLED screen with a main encoder and a 5-pin DIN MIDI output. It connects over USB-C and is updated through
  Arturia's MIDI Control Center. Hardware revision A (USB PID 0x020B) uses an STM32G0B1 microcontroller, and a revision B
  with PID 0x220B and a different microcontroller exists.
platform: STM32G0B1 (ARM Cortex-M0+, revision A)
stock_firmware: 1.2.0
links:
  manufacturer: https://www.arturia.com/products/hybrid-synths/minilab-3/overview
notes: >-
  OpenLab supports revision A only. Revision B units cannot take it yet.
