notes: >-
  Homebrew ROMs run from a flash or EEPROM cartridge, such as a Unocart, or in an emulator. A26F NEO also
  needs a Raspberry Pi Pico wired to controller port 2. Synthcart was sold as a physical cartridge through the
  AtariAge store. Developer tools such as TIATracker, which exports players for games, are not catalogued. No
  current manufacturer product page for the 2600 was found, so the Wikipedia article is linked.
