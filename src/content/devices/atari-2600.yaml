name: Atari 2600
manufacturer: Atari
category: handheld
added: 2026-10-18
tagline: Atari's 1977 home console, whose two-voice TIA chip is played from MIDI or keypad synth cartridges
description: >-
  The Atari 2600, first sold as the Video Computer System in 1977, is a home console built around a MOS 6507
  processor and the TIA chip, which produces video and two audio channels. Each channel has a 4-bit volume and a
  5-bit frequency divider with a choice of tone and noise waveforms.

  The music software here runs from a cartridge. A26F NEO is a MIDI interface that plays the TIA from a computer,
  and Synthcart is a keypad-controlled synthesizer with an arpeggiator and drum patterns.
platform: MOS 6507 with TIA video and audio chip
links:
