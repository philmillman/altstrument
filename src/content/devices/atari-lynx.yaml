name: Lynx
manufacturer: Atari
category: handheld
added: 2026-10-18
tagline: Atari's 1989 colour handheld, with four identical audio channels that a homebrew tracker exposes
description: >-
  The Lynx is a handheld game console released by Atari in 1989, with a backlit colour screen, a WDC 65SC02
  processor and a custom chip called Mikey that handles video and sound. Mikey provides four audio channels built
  from identical timer-driven polynomial counters, and the Lynx II added stereo panning.

  ALYNXDJ is a tracker in the style of LSDJ that runs on the console itself. It is the only music software for the
  Lynx catalogued here.
platform: WDC 65SC02 with Mikey audio and video chip
links:
  manufacturer: https://en.wikipedia.org/wiki/Atari_Lynx
notes: >-
  Homebrew ROMs run from a flash cartridge or in an emulator. ALYNXDJ syncs to MIDI clock through the Lynx's ComLynx
  port using a Raspberry Pi Pico based adapter whose firmware is part of the project. No manufacturer product page
  for the Lynx is currently maintained, so the Wikipedia article is linked.
related: [sega-master-system-game-gear, sega-mega-drive, atari-2600]
