name: Faderpunk
manufacturer: ATOV
category: eurorack
tagline: 16-fader Eurorack and USB MIDI controller that runs small apps
description: >-
  Faderpunk is a Eurorack module and USB MIDI controller from ATOV. It has sixteen faders, each with a backlit button, an RGB LED and a
  configurable CV jack, plus extra jacks for clock and reset. Each fader channel runs an app, such as an LFO, sequencer, quantizer,
  envelope or CV-to-MIDI converter, and one app can span several channels. A browser configurator sets the layout, app parameters and
  scenes over USB MIDI.

  The firmware is written in Rust for an RP2350B and is open source, and the maker's repository also holds the configurator and the
  libraries for writing apps.
platform: RP2350B (dual Arm Cortex-M33), MAX11300 mixed-signal I/O
stock_firmware: 1.12.0
links:
  manufacturer: https://atov.de/products/faderpunk
  community:
    - label: Faderpunk repository (firmware and configurator)
      url: https://github.com/ATOVproject/faderpunk
    - label: ATOV Discord
      url: https://atov.de/discord
notes: >-
  The maker publishes the firmware, so the entry for it is tagged official. Firmware updates are UF2 files copied to the
  module in its USB boot mode (hold the bottom right Shift button while connecting USB).
