name: i2c2midi
manufacturer: attowatt
category: eurorack
added: 2026-10-13
tagline: Open DIY 2HP Teletype expander that speaks i2c and MIDI
description: >-
  i2c2midi is a DIY open-source 2HP Eurorack module by attowatt that adds MIDI
  to the monome Teletype through dedicated I2M ops. It sends notes, CC and other
  messages out through a TRS jack and USB host and receives MIDI over USB host,
  with 16 channels and 8-voice polyphony per channel. It runs on a Teensy and
  also works with crow through a separate library.
platform: Teensy 3.2 / 3.6 / 4.1
links:
  manufacturer: https://github.com/attowatt/i2c2midi
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
notes: >-
  A DIY module and firmware project that adds MIDI in and out to monome
  Teletype through dedicated I2M ops, which the release notes say work with
  official Teletype firmware 5.0.0 and later. The firmware is compiled in the
  Arduino IDE with Teensyduino, with defines selecting MKI or MKII and the
  Teensy model. Back up Teletype scenes before reflashing Teletype.
related: [monome-teletype, bpcmusic-telex, monome-crow]
