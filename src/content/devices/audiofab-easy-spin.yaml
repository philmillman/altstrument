name: Easy Spin
manufacturer: Audiofab
category: pedal
added: 2026-10-24
tagline: Programmable FV-1 effects pedal for guitar and bass
description: >-
  The Easy Spin is a programmable effects pedal from Audiofab, a Canadian
  company, built around the Spin Semiconductor FV-1 DSP chip. It holds eight
  effect programs, chosen with an eight-position rotary switch, and has three
  parameter knobs, a true-bypass footswitch and an LED in a 1590B aluminium
  enclosure. It runs from a 9 V battery or an external 9 V supply. A
  programming jack on the side connects to the Audiofab USB Programmer, which
  is included with the pedal.
platform: Spin FV-1 DSP
links:
  manufacturer: https://audiofab.com/products/easy-spin
  community:
    - label: Easy Spin web programmer
      url: https://easy-spin.audiofab.com/
    - label: FV-1 VS Code extension docs
      url: https://audiofab.github.io/fv1-vscode/
related: [spin-fv-1]
pinned: [easy-spin-effects]
notes: >-
  Programs are written to the pedal's FV-1 program memory over the USB
  programmer, the same way as on other FV-1 pedals, so there is no firmware
  image to replace. Audiofab publishes the programming tools and an effects
  library as open source under the MIT licence.
