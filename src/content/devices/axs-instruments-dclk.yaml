name: DCLK
manufacturer: .axs instruments
category: other
added: 2026-11-03
tagline: DIY dual MIDI clock with quantised start and stop, built on a Black Pill
description: >-
  DCLK is a dual MIDI clock by Joe Bowyer of .axs instruments, based on the Sim'n Tonic Nome II. It sends MIDI clock to two 3.5 mm TRS outputs and over USB MIDI, with quantised start and stop
  and a separate clock divider for each output, so two machines can be started on the bar. It has an encoder, capacitive touch buttons, a 128 by 32 OLED and three LEDs, runs on an STM32F411 Black Pill, and saves its settings to flash.
platform: STM32F411CEU6 Black Pill (Arm Cortex-M4), Arduino (STM32duino)
links:
