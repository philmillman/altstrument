name: DRM
manufacturer: .axs instruments
category: drum-machine
tagline: DIY five-voice MIDI drum synthesizer on a Daisy Seed
description: >-
  The DRM is a one-person DIY drum synthesizer by Joe Bowyer of .axs instruments, built around a Daisy Seed. The firmware sketch has five voices, a kick with tune, decay, punch and morph, a snare with a noise
  rattle, hi-hats built from six oscillators and two FM voices, each with a pot per parameter read through multiplexers, a trigger LED and a master volume. Notes arrive over MIDI.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7), Arduino (DaisyDuino)
links:
  community:
    - label: DRM repository (firmware and KiCad files)
      url: https://github.com/joebmz98/DRM-Digital-Drum-Synthesiser
    - label: .axs instruments on GitHub
      url: https://github.com/joebmz98
notes: >-
  A prototype with no README, product page or flasher. The repository has two sketches, a KiCad project and Gerber files. The firmware is the maker's own and is tagged official.
pinned: [drm-firmware]
related: [axs-instruments-weasel]
