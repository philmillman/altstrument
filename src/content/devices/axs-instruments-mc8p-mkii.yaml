name: MC8P MkII
manufacturer: .axs instruments
category: controller
added: 2026-11-03
tagline: DIY standalone MIDI controller with 8 pots, each sending up to 10 CCs
description: >-
  The MC8P MkII is a standalone MIDI controller by Joe Bowyer of .axs instruments. It has eight potentiometers, each able to send up to ten assignable MIDI controller messages, an SSD1306 OLED, four switches for navigation and
  a 3.5 mm TRS MIDI output, and settings are stored in an SPI flash chip. It runs on an STM32F411 Black Pill, which makes it cheaper than the earlier Teensy 4.0 version, and it has scenes in step and custom modes. PCBs are sold through the maker's Tindie store.
platform: STM32F411CEU6 Black Pill (Arm Cortex-M4), Arduino (STM32duino)
