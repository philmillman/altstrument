name: WEASEL
manufacturer: .axs instruments
category: synth
added: 2026-11-03
tagline: DIY digital synth inspired by the Buchla Music Easel, with a virtual patch bay
description: >-
  WEASEL is a one-person DIY digital synthesizer by Joe Bowyer of .axs instruments, inspired by the Buchla Music Easel and built around a Daisy Seed. It has a complex oscillator with a wavefolder, a modulation oscillator,
  two low pass gates, an ASR envelope, a pulsar generator, a random voltage source and a five-step sequencer, with 32 pots and two button matrices. A four by seven button matrix works as a virtual patch bay that routes
  four modulation sources to seven destinations. It takes MIDI on a 3.5 mm TRS input and has a reverb.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7), Arduino (DaisyDuino)
