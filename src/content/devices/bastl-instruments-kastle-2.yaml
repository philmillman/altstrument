name: Kastle 2
manufacturer: Bastl Instruments
category: synth
added: 2026-10-19
tagline: Pocket patchable DSP platform on an RP2040, sold as Alchemist, Wave Bard and FX Wizard
description: >-
  The Kastle 2 is a small battery or USB-C powered instrument from Bastl Instruments with seven knobs, two buttons and
  pin headers for patching, running on a Raspberry Pi RP2040. It has stereo audio in and a headphone output, sync in
  and out, three analog and three digital outputs, and USB MIDI. Bastl sells the same hardware with different panels
  and official apps as Alchemist, Wave Bard and FX Wizard, and publishes the firmware framework, two official firmwares
  and the schematics as open source. The same platform is used in the Citadel Eurorack module.
platform: RP2040
links:
