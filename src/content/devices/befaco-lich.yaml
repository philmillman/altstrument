name: Lich / Witch (OpenWare)
manufacturer: Befaco / Rebel Technology
category: eurorack
added: 2026-10-13
tagline: OWL-platform modules that load patches from a library
description: >-
  Lich is a 12HP Eurorack module made by Befaco in Barcelona in collaboration
  with Rebel Technology, and it carries on the OWL platform. It has stereo audio
  input and output at 48 kHz and 24 bits, four knobs summed with CV inputs, two
  CV outputs, gate inputs and a gate output, a display for patch selection, and
  USB host and device ports.
platform: STM32 (Rebel Technology OWL)
links:
  manufacturer: https://www.befaco.org/lich/
  community:
    - label: Rebel Technology OpenWare
      url: https://github.com/RebelTechnology/OpenWare
notes: >-
  Lich is made by Befaco with Rebel Technology on the OWL platform; patches
  written in Pure Data, Max gen~ or Faust load onto the module. Befaco's
  Oneiroi is a separate module that runs a patch on the same platform.
related: [electrosmith-daisy-patch]
