name: BCF2000
manufacturer: Behringer
category: controller
tagline: B-CONTROL Fader controller with eight motorised faders
description: >-
  The BCF2000 is a MIDI controller from Behringer with eight motorised 100 mm faders, eight push encoders, and 16 buttons plus
  four user buttons. It connects by USB and DIN MIDI, takes foot switches and stores its assignments as presets that a computer
  can send as SysEx. It has emulation modes for several DAW control protocols.
links:
  manufacturer: https://www.behringer.com/en/products/0808-AAB
notes: >-
  Behringer lists the BCF2000 as a legacy product. Its sibling, the BCR2000, shares the preset format. No custom firmware is
  known; the entry here is a host-side editor.
related: [behringer-bcr2000, behringer-bcr32]
