name: BCR2000
manufacturer: Behringer
category: controller
added: 2026-11-03
tagline: B-CONTROL Rotary controller with 32 encoders
description: >-
  The BCR2000 is a MIDI controller from Behringer with eight illuminated push encoders that switch between four groups of
  assignments, 24 further encoders in three rows, and 16 buttons plus four user buttons. It connects by USB and DIN MIDI, takes two foot switches and stores its
  assignments as presets that a computer can send as SysEx.
links:
  manufacturer: https://www.behringer.com/en/products/0808-AAA
notes: >-
  Behringer lists the BCR2000 as a legacy product. Its sibling, the BCF2000, shares the preset format. This is a different
  unit from the newer BCR32. No custom firmware is known; the entry here is a host-side editor.
related: [behringer-bcf2000, behringer-bcr32]
