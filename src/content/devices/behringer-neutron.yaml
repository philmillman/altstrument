name: Neutron
manufacturer: Behringer
category: synth
added: 2026-10-13
tagline: Semi-modular analog synth
description: >-
  The Neutron is a semi-modular, paraphonic analog synthesizer from Behringer,
  released around 2018. It has two oscillators, a multimode filter, two ADSR
  envelopes, a bucket-brigade delay and an overdrive circuit, with a patch bay
  for routing signals. It is controlled by an STM32 microcontroller
  (Cortex-M0).
platform: STM32 (Cortex-M0)
links:
  community:
    - label: mrf-r/Neutron
      url: https://github.com/mrf-r/Neutron
notes: >-
  This is the only Behringer alternative firmware found in this research. It is
  flashed over USB DFU; the release bundles a Windows DFU tool and suggests
  dfu-util on macOS and Linux.
