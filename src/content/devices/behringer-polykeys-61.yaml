name: Polykeys 61
manufacturer: Behringer
category: controller
tagline: Announced 61-key MIDI keyboard with polyphonic aftertouch and a ribbon controller
description: >-
  The Polykeys 61 is a MIDI keyboard controller that Behringer announced on
  2026-11-01 with a target price of $199. Press coverage of the announcement
  describes a 61-key polyphonic aftertouch keybed, a ribbon controller above the
  keys, pitch and mod wheels, nine sliders, nine knobs, 16 pads, a display and
  transport buttons. Behringer has published no specification or availability
  date.
links:
  community:
    - label: Synth Anatomy report on the announcement
      url: https://synthanatomy.com/2026/11/behringer-polykeys-61-an-open-source-midi-keyboard-controller-with-polyphonic-aftertouch.html
    - label: Music Tribe Open Source organisation
      url: https://github.com/MusicTribeOpenSource
notes: >-
  Announced on 2026-11-01 in a Behringer social media post, which Synth Anatomy
  reports as confirming that the keyboard is open source. No product page (the
  addresses guessed for it on behringer.com return 404), repository, licence or
  availability date has been published, and Music Tribe's open source
  organisation on GitHub has no repository for it yet. No image is shown because
  Behringer has no product page or press kit for the unit and a news photo is not
  an acceptable source.
related: [behringer-aq64l, behringer-bcr32]
pinned: [polykeys-61-open-firmware]
