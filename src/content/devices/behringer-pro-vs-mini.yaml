name: PRO-VS MINI
manufacturer: Behringer
category: synth
added: 2026-11-17
tagline: Portable hybrid vector synth with four oscillators per voice and a mixing joystick
description: >-
  The PRO-VS MINI is a portable hybrid synthesizer from Behringer that follows the Sequential Prophet VS. Each voice
  blends four oscillators from 128 waveforms with a joystick, then passes through an analogue 24 dB low-pass filter.
  It has three envelopes, two LFOs, chorus, ensemble and reverb, a 16-step sequencer with 16 patterns, an arpeggiator,
  a 27-key touch keyboard and a headphone output, and it weighs 0.40 kg.
links:
  manufacturer: https://www.behringer.com/en/products/0722-ABF
related: []
notes: >-
  No supported route for custom firmware is known. The one community firmware project says there is no safe way to flash
  the unit and warns that removing read-out protection on the microcontroller erases the factory firmware.
