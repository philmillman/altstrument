name: SP1200X
manufacturer: Behringer
category: drum-machine
added: 2026-10-29
tagline: Announced $200 tribute to the E-mu SP-1200 sampling drum machine
description: >-
  The SP1200X is a drum machine and sampler that Behringer announced on
  2026-10-29 as a tribute to the E-mu SP-1200. Press coverage of the announcement
  describes eight sliders and pads laid out like the original, a numeric keypad,
  a larger full-colour display, stereo sampling inputs, eight individual outputs,
  sync in and out, five-pin MIDI in, out and thru, and USB-C host and computer
  ports. Behringer says it is still in development and is aiming for about $200,
  and has published no specification or release date.
links:
