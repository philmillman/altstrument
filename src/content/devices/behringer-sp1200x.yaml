notes: >-
  Announced 2026-10-29 in a Behringer social media post, which the press quotes
  as saying the firmware will be open source. No product page, repository,
  licence or release date has been published, and Music Tribe's open source
  organisation on GitHub has no SP1200X repository yet. No image is shown because
  Behringer has no product page or press kit for the unit and a news photo is not
  an acceptable source.
