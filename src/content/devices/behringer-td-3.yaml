name: TD-3
manufacturer: Behringer
category: synth
added: 2026-11-03
tagline: Analog bass line synthesizer modelled on the TB-303
description: >-
  The TD-3 is an analog bass line synthesizer from Behringer that follows the Roland TB-303. It has a sawtooth and square
  oscillator, a 16-step sequencer with seven tracks, an arpeggiator and a distortion circuit, and it connects by USB and MIDI.
  Behringer's SynthTribe software edits its patterns and settings.
links:
  manufacturer: https://www.behringer.com/en/products/0718-ABP
notes: >-
  The TD-3-MO is a revised version with extra controls, and the TD-3 comes in several colours. Tools that speak the TD-3's
  SysEx protocol are reported to work with both. No custom firmware is known; the entries here are host-side tools.
related: [roland-t-8]
