name: Gliss
manufacturer: Bela
category: eurorack
added: 2026-11-06
tagline: 4HP capacitive touch-strip Eurorack controller with an LED strip, also in a 1U version
description: >-
  Gliss is a Eurorack touch controller from Bela with a long capacitive touch
  strip and a row of LEDs behind it that shows the gesture. It has one input
  and two outputs and four modes: control voltages from finger position and
  touch size, recording gestures as waveforms of up to 75 seconds, processing
  an incoming signal, and five tunable voltages played as a keyboard or step
  sequencer. Gliss launched on Crowd Supply in December 2022 and shipped in
  August 2023; Gliss 1U is a 24HP Intellijel 1U version.
platform: STM32G491 (Arm Cortex-M4)
stock_firmware: v2.0.1
