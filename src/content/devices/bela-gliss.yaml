notes: >-
  Unlike Bela's other modules, Gliss does not run the Bela Linux image. It has
  its own microcontroller firmware, which Bela publishes as source, and
  firmware updates are sent over USB from the Gliss Upgrade page in a
  Chrome-based browser. Firmware v2 (October 2024) is a free upgrade for
  earlier units.
