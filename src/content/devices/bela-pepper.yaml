notes: >-
  Pepper runs the standard Bela image from a microSD card in the BeagleBone,
  so any program can be swapped out from the IDE and a broken system is fixed
  by writing a fresh image to the card. It is not compatible with Bela Mini,
  Bela Gem or the CTAG capes. Jumpers on the board set whether some inputs
  are read as CV or as gates, and some community programs ask for a specific
  setting. Bela lists Pepper with its legacy hardware but still sells the kit.
