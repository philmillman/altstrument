name: Pepper
manufacturer: Bela
category: eurorack
added: 2026-11-06
tagline: DIY 18HP Eurorack kit that turns a BeagleBone Black and Bela cape into a programmable module
description: >-
  Pepper is an open-source DIY Eurorack module from Bela, sold as a kit of
  panel, circuit boards and parts. It is a passive breakout for a BeagleBone
  Black with a Bela cape mounted behind it, and gives the module stereo audio
  in and out, eight CV inputs, eight DC-coupled CV outputs, eight pots, four
  buttons and a ten-LED bar graph. Programs are loaded and edited over USB in
  the Bela IDE and can be written in C++, Pure Data, SuperCollider or Csound.
platform: BeagleBone Black with a Bela cape (TI AM335x, Arm Cortex-A8)
stock_firmware: Bela image v0.3.8h
links:
  manufacturer: https://bela.io/products/pepper
  community:
