name: Salt / Salt+
manufacturer: Bela
category: eurorack
added: 2026-11-06
tagline: Discontinued 12HP programmable Eurorack module made by Bela and Rebel Technology, with a 10HP expander
description: >-
  Salt is a programmable Eurorack module designed by Bela with Rebel
  Technology and launched in 2018. It is a 12HP panel with a BeagleBone Green
  and a Bela cape mounted behind it, and has stereo audio in and out, four CV
  inputs and outputs with offset pots, two trigger inputs and outputs with
  bi-colour LED buttons and a USB device port. The 10HP Salt+ expander adds
  four more CV inputs and outputs, two more triggers and a USB host port for
  MIDI devices, and connects to Salt over a ribbon cable. Programs are written
  in C++, Pure Data, SuperCollider or Csound in the Bela IDE.
platform: BeagleBone Green with a Bela cape (TI AM335x, Arm Cortex-A8, 1 GHz, 512 MB RAM)
stock_firmware: Bela image v0.3.8h
links:
