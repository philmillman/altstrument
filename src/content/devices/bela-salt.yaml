notes: >-
  Salt is discontinued and no longer sold. It runs the standard Bela image
  from a microSD card, so programs can be swapped in the IDE and a broken
  system is fixed by writing a fresh image. The Salt+ expander does nothing
  without Salt. Pepper is the DIY successor and uses most of the same
  programming model, but its panel layout and I/O differ, so programs need
  their pin assignments changed to move between the two.
related: [bela, bela-pepper]
