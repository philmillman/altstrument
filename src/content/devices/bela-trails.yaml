    - label: Bela forum (forum.bela.io)
      url: https://forum.bela.io/
notes: >-
  No custom firmware for Trails is known. The only firmware is Bela's own
  closed build, which owners update from the Upgrade Trails page
  (bela.io/upgrade-trails) in a Chrome-based browser; unlike Gliss, its source
  has not been published.
related: [bela-gliss]
