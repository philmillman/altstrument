name: Trails
manufacturer: Bela
category: eurorack
added: 2026-11-06
tagline: 22HP polyphonic touch recorder that turns finger gestures on a multitouch pad into CV, gates and MIDI
description: >-
  Trails is a Eurorack module from Bela built around an 85 × 85 mm multitouch
  pad with lights behind it, a ten-segment touch slider and a set of buttons.
  It records finger movements and plays them back on four channels as
  melodic, rhythmic or control data, with X and Y CV outputs and a gate for
  each channel, four CV inputs for reset and modulation and a clock input. A
  breakout module in 4HP or 1U adds MIDI over TRS, and the USB-C port sends
  USB MIDI.
links:
