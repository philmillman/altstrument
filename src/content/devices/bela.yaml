notes: >-
  The system lives on a microSD card, so a bad install or update is undone by
  writing a fresh image to the card; Bela and Bela Mini can also be flashed to
  the BeagleBone's eMMC. The cape and Mini share one image line, built by
  bela-image-builder, while Bela Gem uses its own arm64 image from
  gem-image-builder, and projects for the older boards need porting to run on
  Gem. Bela Mini and its Multichannel Expander, and the Audio and Multiplexer
  capelets, are end of life but still supported. The CTAG FACE and BEAST
  multichannel sound-card capes (4 in and 8 out, or 8 in and 16 out), made with
  CTAG at FH Kiel, run the same Bela image on a BeagleBone Black and are
  covered here. Projects that run on the stock image are catalogued when they
  turn the board into a specific instrument or effect, or when they are
  host-side tools for the platform. The Trill touch sensors are not listed.
