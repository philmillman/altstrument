name: Bela / Bela Mini / Bela Gem
manufacturer: Bela
category: diy-platform
added: 2026-11-06
tagline: Low-latency audio and sensor boards for BeagleBone computers, programmed from a browser IDE
description: >-
  Bela is a family of audio and sensor boards that sit on BeagleBoard
  computers and run a real-time Linux image with the Bela core and a
  browser-based IDE served from the board. Projects are written in C++, Pure
  Data, SuperCollider, Csound or other languages, and audio and sensor I/O are
  processed together with round-trip latency of around 1 ms.

  The original Bela cape (2016) fits a BeagleBone Black and has stereo audio
  in and out, eight 16-bit analog inputs and outputs, 16 digital I/O pins and
  two speaker amplifiers. Bela Mini fits a PocketBeagle and drops the analog
  outputs. Bela Gem Stereo and Gem Multi (2025) fit a PocketBeagle 2, with 2 or
  10 channels of 24-bit, 96 kHz audio I/O, eight 16-bit analog inputs, 16
  digital pins, USB host and device ports and a Qwiic connector.
platform: >-
  Bela and Bela Mini: TI AM335x (Arm Cortex-A8, 1 GHz) on a BeagleBone Black or
  PocketBeagle, Xenomai real-time kernel. Bela Gem: TI AM62 (4 × Arm
  Cortex-A53, 1.4 GHz) on a PocketBeagle 2, arm64 Debian 12.
stock_firmware: Bela image v0.3.8h (Bela, Bela Mini, CTAG); Bela Gem image v1.0.2
