name: minichord
manufacturer: Benjamin Poilvé
category: synth
added: 2026-10-20
tagline: Open-source pocket chord instrument with a strummed touch strip, built on a Teensy 4.0
description: >-
  The minichord is a battery-powered handheld chord instrument laid out like a small Suzuki Omnichord. It has 21
  chord buttons in seven columns of major, minor and seventh chords plus a sharp modifier, a capacitive harp strip of 12 zones that is
  strummed or tapped, three potentiometers, preset up and down buttons and a rhythm button that also runs an
  arpeggiator. Sound comes out of a 3.5 mm jack, and plugging a cable into that jack is what turns it on.

  A Teensy 4.0 runs the synthesis with the Teensy Audio Library. Over micro USB it charges and appears as a two-port
  USB MIDI device, one port for the chords and one for the harp, and also sends its audio to the host for
  recording. Its 12 preset slots are edited over SysEx from a web page. Seeed Studio sells it as a product
  co-created with the designer, and the project's assembly guide covers both a build from scratch and finishing a
  kit.
platform: Teensy 4.0 (NXP i.MX RT1062)
stock_firmware: "9"
