notes: >-
  The firmware is open source (BSD-3-Clause) and its source, generator and a prebuilt firmware.hex live in the same
  repository as the hardware. The hardware files (PCB Gerbers, BOM, enclosure and keycap files) are under CC BY-NC
  4.0, so building one for sale is not permitted. Updating is done with PJRC's Teensy Loader and a pin pressed
  through a hole in the back of the case to reach the Teensy's program button, and the Teensy's separate bootloader
  chip means a bad image can be replaced the same way. After a firmware change the manual suggests resetting all
  preset banks in minicontrol. Forks and the community editors talk to the same SysEx parameter map that the
  firmware's generator script produces from parameters.json.
