name: Metal Fetishist
manufacturer: Body Synths
category: synth
tagline: Digital percussion synthesizer with random sequencing and heavy distortion
description: >-
  The Metal Fetishist is a desktop percussion synthesizer from Body Synths. It has an oscillator, a noise source, a resonant multi-mode filter and an effects section with
  distortion, downsampling, phaser, flanger and chorus. Two random generators control trigger probability and step modulation of a looping step sequence, and an audio input lets it process external sounds. It takes
  MIDI on a 3.5 mm jack and has clock, trigger and control voltage jacks.
platform: STM32 with a Daisy-style DFU bootloader
stock_firmware: "2.0"
links:
  manufacturer: https://bodysynths.com/products/metal-fetishist
notes: >-
  Body Synths publishes its firmware only as built images, installed with its own WebUSB programmer, so the entry for that tool is tagged official. The image files are the maker's own closed binaries. The device is updated through a DFU bootloader reached from buttons on the circuit board under the bottom plate.
