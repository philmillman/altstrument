name: CUBE Street II
manufacturer: Boss
category: other
added: 2026-11-03
tagline: Battery-powered stereo amplifier for guitar and mic with effects, a looper and Bluetooth MIDI control
description: >-
  The CUBE Street II is a portable stereo amplifier from Boss with two 6.5-inch speakers and 10 watts of output. It has a
  Mic/Instrument channel with harmony, EQ and reverb and a Guitar/Mic channel with amp types, EQ, chorus and delay effects, reverb
  and a tuner, plus a looper that records up to 45 seconds in stereo. It runs on eight AA batteries or an adaptor. The
  optional BT-DUAL adaptor adds Bluetooth audio and MIDI, which the CUBE Street II Editor app uses to edit the amp.
links:
  manufacturer: https://www.boss.info/us/products/cube_street_2/
notes: >-
  No custom firmware is known. The community tools control the amp through its Bluetooth MIDI link and its Roland SysEx
  messages and do not change its firmware.
