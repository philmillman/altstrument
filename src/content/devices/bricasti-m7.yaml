name: M7
manufacturer: Bricasti Design
category: other
tagline: Stereo reverb processor in a one-unit rack case with MIDI SysEx program and system dumps
description: >-
  The M7 is a rack-mounted stereo reverb processor from Bricasti Design with a stainless steel chassis, a two-line display,
  an input level knob, preset and register buttons, AES and balanced analog connections, and MIDI in and out sockets. Its
  banks cover halls, chambers, plates and other rooms, and the V2 firmware adds delay parameters and further banks. Holding
  PROG, EDIT or SYSTEM makes it send a SysEx dump, and Bricasti publishes a note on that workflow.
links:
  manufacturer: https://www.bricasti.com/en/pro/m7.php
  community:
  - label: Bricasti MIDI application notes
    url: https://www.bricasti.com/images/Midi_app_note.pdf
notes: >-
  No custom firmware is known. The community editor reads and writes program and system SysEx dumps, and does not
  replace the firmware.
