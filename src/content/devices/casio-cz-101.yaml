name: CZ-101
manufacturer: Casio
category: synth
added: 2026-11-03
tagline: Phase distortion synth with mini keys, first of the CZ line
description: >-
  The CZ-101 is a digital synthesizer made by Casio from 1984. It uses phase
  distortion synthesis, with a digitally controlled oscillator, wave shaper and
  amplifier for each of two lines per voice, and has 49 mini keys and MIDI. The CZ-1000 and CZ-5000
  share its sound engine and SysEx format, so editors for the family often name them together.
notes: >-
  No custom firmware is known; the entries are editors and librarians that use the CZ
  SysEx format.
related: [casio-vz-1]
