name: SK-1
manufacturer: Casio
category: sampler
added: 2026-11-06
tagline: Mini-key sampling keyboard from 1985 with a 1.4 second sampler
description: >-
  The SK-1 is a small battery-powered keyboard from Casio with 32 mini keys. It samples through a built-in microphone and line input at 8 bits, for about 1.4 seconds,
  and also plays preset sounds and rhythms stored in a ROM chip. It was sold in the United States as the Radio Shack Realistic Concertmate-500.
platform: Casio MSM6283 custom CPU with an external sound ROM
notes: >-
  The entry here replaces the preset ROM with a socketed EEPROM; the original chip can be refitted. The sampler's own length limit sits in the CPU and is not changed.
