name: VZ-1 / VZ-10M
manufacturer: Casio
category: synth
tagline: Interactive Phase Distortion keyboard and rack module
description: >-
  The VZ-1 is a digital synthesizer made by Casio in the late 1980s, and the VZ-10M is
  its rack module. Both use Casio's Interactive Phase Distortion sound engine, in which each voice is built from
  several modules connected in lines, and both exchange tone and bank data over MIDI
  SysEx. Editors treat the VZ line as one family, so this entry covers both models.
notes: >-
  No custom firmware is known; the entries are editors that use the VZ SysEx format.
related: [casio-cz-101]
