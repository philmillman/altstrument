name: CHOMPI
manufacturer: Chase Bliss
category: sampler
added: 2026-10-13
tagline: Chromatic sampler and tape-music instrument
description: >-
  CHOMPI is a portable sampler from CHOMPI Club, now part of Chase Bliss,
  introduced in 2023. It has a built-in microphone, an internal battery, a
  stereo aux input and a two-octave chromatic keyboard of mechanical switches,
  with a screenless interface of RGB LEDs and push-button encoders. Sample
  playback, envelopes, a filter and a single-knob delay and reverb section run on
  an Electrosmith Daisy Seed.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
stock_firmware: TAPE 2.0
links:
  manufacturer: https://www.chompiclub.com
  community:
    - label: CHOMPI open source
      url: https://www.chompiclub.com/opensource
notes: >-
  The original CHOMPI is discontinued. Hardware and firmware were released as
  open source in September 2026 and the repository is described as a
  permanent source with no further updates planned. Panel artwork, the CHOMPI
  name and the logo are not covered by the MIT license.
related: [electrosmith-daisy-patch]
