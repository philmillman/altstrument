name: Lost + Found
manufacturer: Chase Bliss
category: pedal
tagline: Dual-engine stereo multi-effect with ramping, 122 MIDI presets and DIP switches
description: >-
  Lost + Found is a stereo multi-effects pedal from Chase Bliss with two engines. The left side offers reverb, pitch and
  warp effects and the right side delay, synth and bend effects, each with A and B variants set by a Modify knob. It has
  twelve knobs, three toggles, a ramping function that sweeps selected knobs, DIP switches for trails, latch and polarity,
  and 122 presets. MIDI goes in through a 1/4-inch TRS jack, using a Chase Bliss-compatible cable or adapter. Firmware updates
  are published on Chase Bliss's firmware page and add resonator modes.
links:
  manufacturer: https://www.chasebliss.com/lost-and-found
  community:
  - label: Chase Bliss firmware updates
    url: https://firmware.chasebliss.com/
notes: >-
  No custom firmware is known. The pedal has no USB port and no documented read-back, so the community editors send MIDI
  to it from a computer through a MIDI interface and cannot read the knob positions.
