name: MOOD MKII
manufacturer: Chase Bliss
category: pedal
added: 2026-11-03
tagline: Micro-looper and spatial effect pedal with two channels, a hidden option bank and 122 MIDI presets
description: >-
  MOOD MKII is a stereo pedal from Chase Bliss with two channels that work together. One samples and loops short moments,
  and the other has reverb, delay and slip effects. It has Time, Mix, Length, Clock and two Modify knobs, three toggles
  that pick the effect modes and routing, a hidden second bank of functions, ramping and 122 presets. MIDI goes in through a
  1/4-inch TRS jack, using a Chase Bliss-compatible cable or adapter.
links:
  manufacturer: https://www.chasebliss.com/mood-mkii
  community:
  - label: Chase Bliss firmware updates
    url: https://firmware.chasebliss.com/
notes: >-
  No custom firmware is known. The pedal has no USB port and no documented read-back, so the community editors send MIDI to
  it from a computer through a MIDI interface and cannot read the knob positions.
