name: Nord Lead A1
manufacturer: Clavia
category: synth
added: 2026-11-17
tagline: 4-part multitimbral analog-modeling synth with 26-voice polyphony
description: >-
  The Nord Lead A1 is an analog-modeling synthesizer from Clavia, sold under the Nord name. It is four-part multitimbral
  with 26-voice polyphony, eight oscillator configurations, 12 and 24 dB low-pass, high-pass and band-pass filters with
  ladder simulations, a mod envelope, an LFO, an arpeggiator and an effects section. It connects over USB MIDI, and its
  operating system is updated by a downloadable updater program.
