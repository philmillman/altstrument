name: Hothouse DSP Pedal Kit
manufacturer: Cleveland Music Co.
category: pedal
added: 2026-10-13
tagline: Stereo DIY digital effects pedal kit for the Daisy Seed
description: >-
  The Hothouse is a stereo DIY digital signal processing pedal kit from Cleveland
  Music Co., sold as a kit or pre-assembled. It provides the controls,
  footswitches and audio jacks of a guitar pedal around an Electrosmith Daisy
  Seed or Seed3, which is bought separately. The hardware design is open source
  under CC BY-SA 4.0.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://clevelandmusicco.com/hothouse-diy-digital-signal-processing-platform-kit/
  community:
    - label: Hothouse Flasher
      url: https://clevelandmusicco.github.io/HothouseFlasher/
    - label: HothouseExamples wiki
      url: https://github.com/clevelandmusicco/HothouseExamples/wiki
related: [guitarml-funbox, pedalpcb-terrarium, electrosmith-daisy-patch]
notes: >-
  The hardware is open source (CC BY-SA 4.0), with design files in the
  open-source-pedals repository. Compatible with the Daisy Seed and Seed3. Most
  binaries in recent releases can enter DFU mode by holding both footswitches
  for two seconds; Earth, Mars and Venus excepted.
