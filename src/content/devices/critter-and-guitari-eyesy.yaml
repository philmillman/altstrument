name: EYESY
manufacturer: Critter & Guitari
category: other
added: 2026-10-14
tagline: Audio-reactive video synthesizer whose visuals are Python/Pygame modes
description: >-
  EYESY is a video synthesizer from Critter & Guitari that turns incoming
  audio and MIDI into live visuals, output over HDMI or composite video. A
  Raspberry Pi Compute Module runs the visuals, and each "mode" is a Python
  script that draws with the Pygame library; five knobs and a row of buttons
  control the current mode, and scenes store favourite settings. Modes and
  scenes can be managed from a browser through the built-in web editor once
  EYESY is on WiFi through a USB adapter.
platform: Raspberry Pi Compute Module 3, Linux
stock_firmware: EYESY OS 3.1
