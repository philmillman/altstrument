notes: >-
  The operating system and the modes live on a microSD card. To update, write
  the current disk image to a card of 8 GB or more with balenaEtcher; this
  wipes the card, so download your modes and scenes first (section 6.1 of the
  manual). The same step restores a card that has problems, and an EYESY on
  OS 2.3 is upgraded to OS 3 this way. If a USB drive containing a Modes
  folder is plugged in at boot, EYESY runs its modes, scenes and settings
  from the drive instead of the card, which is a way to try modes without
  touching the internal card. Modes written for OS 2 need converting from
  Python 2 to Python 3 for OS 3. The predecessor ETC has its own entry.
