notes: >-
  With a USB-C cable to a computer, pressing Next Track and then Mode puts the
  unit into Disk Mode, where the card shows up as a drive: recordings sit in a
  recordings folder, and playback modes can be reordered, removed or added.
  Each mode needs its own folder whose name starts with a number from 1 to 6,
  containing module.pd and a copy of waveplayer~.pd-linux. The operating system
  is on the same card; writing the manual's disk image with balenaEtcher resets
  the unit to factory state and erases the card. Critter & Guitari now lists
  Kaleidoloop in its Museum of Retired Instruments.
