name: Kaleidoloop
manufacturer: Critter & Guitari
category: sampler
added: 2026-10-14
tagline: Pocket loop recorder whose playback modes are Pure Data patches on a microSD card
description: >-
  Kaleidoloop is a portable sound recorder and manipulator from Critter &
  Guitari. It records mono 48 kHz, 16-bit audio, plays the recordings back
  through six playback modes that warp speed, add effects or layer loops, and
  runs from batteries or USB-C power. Each mode is a Pure Data patch, and the
  recordings and modes are stored on its microSD card.
links:
