notes: >-
  The operating system lives on the microSD card, so updating means writing a
  new disk image to the card with a tool such as balenaEtcher; this erases the
  card, so back up patches first, and the same step restores a card that has
  gone bad. The image links are in section 7.1 of the user manual. Organelle
  OS 5.x runs on the M, S and S2 from one image; the original Organelle is
  not supported by it. Patches are folders with a main.pd file in a Patches
  folder on the card or on a FAT32 USB drive, and zipped patches install from
  the patch menu. Community patches, which run on the stock OS and are not
  catalogued here, are collected on Patchstorage and the Critter & Guitari
  forum.
