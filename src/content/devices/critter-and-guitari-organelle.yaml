name: Organelle M / S / S2
manufacturer: Critter & Guitari
category: diy-platform
added: 2026-10-14
tagline: Pure Data keyboard instrument on a Raspberry Pi Compute Module with open OS and patches
description: >-
  The Organelle is a music computer from Critter & Guitari: a small Linux
  computer behind a 25-key maple keyboard, four knobs, a volume knob, a
  selector encoder and an OLED screen. Instruments are Pure Data patches
  loaded from the microSD card or a USB drive, and the system also has MIDI
  in and out, an HDMI output and WiFi through a USB adapter. The Organelle M
  has a built-in speaker and battery power, the S omits them, and the S2 is
  the current model.

  Patches can be edited on the device with a keyboard and monitor, from a
  browser over WiFi, or over VNC. The manual for these models covers the M, S
  and S2 together; the original 2016 Organelle has its own entry.
platform: Raspberry Pi Compute Module 3 (Organelle M) and Compute Module 4 (Organelle S2), Linux
stock_firmware: Organelle OS 5.1
