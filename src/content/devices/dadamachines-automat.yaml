      url: https://github.com/dadamachines/automat-software
    - label: dadamachines forum
      url: https://forum.dadamachines.com/
notes: >-
  The maker publishes the firmware as open source, so its entry is tagged official. Firmware updates need the dadamachines UF2 bootloader; units that still have the original SAM-BA bootloader use a serial upload instead.
