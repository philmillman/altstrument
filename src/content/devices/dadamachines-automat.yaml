name: automat
manufacturer: dadamachines
category: other
tagline: MIDI-to-solenoid controller with 12 outputs for playing acoustic objects
description: >-
  The automat is a small controller from dadamachines that turns MIDI notes into pulses on twelve solenoid outputs, so physical actuators can strike drums, bells and other objects.
  It takes MIDI over USB and a DIN input and has a MIDI thru jack and a status LED per output. Velocity programs set how long each output is driven, and the settings are stored in the unit
  and edited by SysEx from a browser configurator. Solenoid power comes from an external supply.
platform: Microchip SAMD21G18A (Arm Cortex-M0+), UF2 bootloader
stock_firmware: "3.11"
links:
  manufacturer: https://dadamachines.com/products/automat-controller/
  community:
