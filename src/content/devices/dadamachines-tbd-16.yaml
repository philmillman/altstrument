name: tbd-16
manufacturer: dadamachines
category: groovebox
added: 2026-10-28
tagline: Compact standalone 16-track groovebox with synthesis, sampling and SD-card apps
description: >-
  The tbd-16 is a USB-C-powered standalone groovebox designed, assembled and
  tested in Berlin. Its Groovebox app provides 16 audio or MIDI tracks,
  synthesis and sampling, step sequencing with parameter locks, two FX tracks
  and master processing. The 110 × 110 × 25 mm instrument has a 2.4-inch OLED,
  four endless potentiometers and 16 RGB step keys. Connections include USB
  audio, USB host and device MIDI, two TRS MIDI inputs and outputs, two stereo
  audio inputs, separate main and headphone/cue outputs, and Ableton Link;
  a browser-based WebUI manages samples, presets and configuration over USB
  or Wi-Fi.
platform: ESP32-P4 (DSP), RP2350B (UI/MIDI), ESP32-C6 (Wi-Fi)
