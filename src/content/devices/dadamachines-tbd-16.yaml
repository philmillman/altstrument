notes: >-
  Pre-orders are not yet open and the shipping date is unconfirmed. Apps can
  be switched from the SD card at reboot; the manufacturer demonstrates a
  tbd-16 port of MCL (MegaCommand Live), the Elektron Machinedrum sequencer.
  The dadamachines CTAG TBD repository publishes the DSP firmware, plugin and
  rack framework, developer tools and desktop simulator under GPL-3.0-only.
  This is the public DSP-side code, rather than the complete instrument
  firmware. The separately licensed WebUI and proprietary hardware designs
  are not covered by the GPL.
