name: VIBE FM Mk1
manufacturer: Designburg
category: synth
added: 2026-11-17
tagline: Announced instrument that runs VIBE FM firmware; a prototype, not yet on sale
description: >-
  The VIBE FM Mk1 is a hardware instrument announced by Designburg, the Hamburg project of Sven Trogus (zvenson) that runs
  the FM-1 Firmware Hub. It is not on sale. The Firmware Hub says the Mk1 is a working prototype with its first circuit
  boards ordered, lists it as coming in 2027 and says a crowdfunding campaign starts later. The hub describes a 480 x 320
  colour screen, 16 pads, 25 keys, seven encoders, audio inputs, MIDI in and out and CV and gate outputs, and says the same
  VIBE FM firmware file that runs in the browser Playground, the VST3, AU and CLAP plugin and the standalone app is meant
  to run on it unchanged.
