name: M8 Headless
manufacturer: Dirtywave
category: groovebox
added: 2026-10-13
tagline: Full M8 tracker on a bare Teensy 4.1 with a host display client
description: >-
  The M8 is a tracker-style sequencer, synthesizer and sampler designed by
  Timothy Lamb and sold by Dirtywave, with the first M8 Model:01 units
  shipping in 2021. It runs eight tracks of assignable instruments, including
  FM, wavetable and virtual analog synth engines and sample playback, and
  sends MIDI. The headless version runs the same software on a bare Teensy 4.1
  and relies on a computer or handheld client for the display and keys.
platform: Teensy 4.1
stock_firmware: 6.6.3E
links:
  manufacturer: https://dirtywave.com/products/m8-tracker
  community:
    - label: M8 Headless setup guide
      url: https://github.com/Dirtywave/M8Docs/blob/main/docs/M8HeadlessSetup.md
    - label: M8 display client (TouchDesigner)
      url: https://github.com/DirtyWave/M8DisplayTouchdesigner
notes: >-
  Covers the headless build only: the M8 firmware running on a Teensy 4.1
  with the display and keys handled by a host computer over USB. The
  firmware is published by Dirtywave itself, so this is the vendor's own
  build, not a third-party mod. Dirtywave's EULA forbids modifying,
  reverse engineering or redistributing it, and since 2026-10-20 also
  forbids running it in an emulator, simulator or other software
  implementation of the hardware without written permission.
