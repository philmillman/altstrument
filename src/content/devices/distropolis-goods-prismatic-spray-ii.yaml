name: Prismatic Spray II
manufacturer: Distropolis Goods
category: synth
added: 2026-11-26
tagline: Stereo bytebeat synth with two engines, a colour display and a digitally controlled analog filter
description: >-
  Prismatic Spray II is a synth from Distropolis Goods that plays
  bytebeat equations, which the maker calls incantations, through two
  independent engines in stereo. It has 60+ built-in equations, 60 preset
  slots, a 1.5-inch colour display with several visualization styles, a
  digitally controlled analog filter, and a row of knobs and buttons for
  pitch, speed, detune and the equation's variables.

  The unit is powered and connected over USB-C, which carries USB MIDI, and
  it also has a TRS-A MIDI connection. It comes in a 3D printed case.
platform: Teensy
stock_firmware: "2.0"
links:
