notes: >-
  No custom firmware for Prismatic Spray II is known. The only firmware is the
  maker's own closed build, distributed as a .hex download from the firmware
  page; no source repository or licence has been found. Version 2.0 added a
  browser-based editor that backs up and restores the unit, writes up to 64
  user incantations and installs firmware updates, and it added tempo-synced
  time stretching and MIDI clock sync over USB or TRS-A. Updating from 1.x
  firmware may erase saved data, and units on 1.00 or 1.01 cannot connect to
  the editor; the page offers TyTools as a second update route. The original
  Prismatic Spray is a retired product with separate firmware that does not
  work on the II.
