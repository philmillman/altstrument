name: Pocket X
manufacturer: Donner
category: pedal
added: 2026-11-04
tagline: Compact amp modeller and multi-effects pedal with two footswitches and a colour screen
description: >-
  The Pocket X is a small two-footswitch guitar and bass amp modeller and multi-effects pedal from Donner. It has a colour
  screen, Master and Para knobs, seven buttons for the home page and the FX, amp, modulation, delay, reverb and cab
  modules, and a tuner on the footswitches. Donner lists a rechargeable battery with up to ten hours of use and an app for
  a computer or phone that stores settings.
platform: JieLi AC791N (two cores)
links:
  manufacturer: https://us.donnermusic.com/products/donner-pocket-x-multi-effects-guitar-pedal
notes: >-
  OpenPocket's authors describe the pedal as running the same JieLi update system as the M-VAVE FM-1 and list the
  M-VAVE BlackBox as the sibling model; OpenPocket does not yet install on the BlackBox, where it boot-loops. Donner
  does not support custom firmware.
related: [m-vave-blackbox]
