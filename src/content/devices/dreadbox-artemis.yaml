name: Artemis
manufacturer: Dreadbox
category: synth
tagline: Six-voice analog synthesizer with sliders and a sequencer
description: >-
  The Artemis is a six-voice analog synthesizer from Dreadbox of Greece. Its front panel
  has two LFOs, an oscillator section, a filter with 12 dB and tracking switches, envelope
  sliders and an effects row for distortion, modulation, delay and reverb, plus a small display and a
  sequencer. It stores its presets in eight banks and exchanges them as MIDI SysEx data, in which each preset
  is a JSON document.
links:
  manufacturer: https://dreadbox-fx.com/artemis/
notes: >-
  No custom firmware is known; the entry here is a browser preset explorer.
