name: ALTERIA
manufacturer: E103-designs
category: eurorack
added: 2026-10-27
tagline: Narrow Eurorack function generator with three knobs, two DAC outputs and swappable Arduino firmware
description: >-
  ALTERIA is a narrow Eurorack module from E103-designs with three knobs, a mode button and a
  manual button, a CV input, an I/O jack and two DAC-driven outputs. Its firmware decides what it
  is: the ALLROUNDER sketch offers sixteen modes covering envelopes, clock tools, logic, random
  sources and two drum voices, and the DRUM LAB sketch gives two percussion voices. It is built
  on an Arduino Nano-style ATmega328P board.
platform: ATmega328P (Arduino Nano), board REV5-2
links:
  manufacturer: https://github.com/E103-designs/ALTERIA
notes: >-
  Both published sketches target the REV5-2 hardware with an ATmega328P at 16 MHz; the README
  says ATmega168P is not supported. The schematics folder says corrected schematics and CAD files
  are still to be uploaded, so the repository is not yet a complete hardware release. Output
  calibration is done by hand with a multimeter.
related: [e103-designs-eurotrack]
