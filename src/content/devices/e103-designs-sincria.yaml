name: SINCRIA
manufacturer: E103-designs
category: eurorack
added: 2026-10-27
tagline: Eurorack cellular automata sequencer with an 8x8 LED matrix and an Arduino-based controller
description: >-
  SINCRIA is a Eurorack module from E103-designs that runs a Conway-style cellular automaton
  on an 8x8 LED matrix and scans the grid in 64 steps, turning living cells into clock, gate and
  generation-end events. It has an internal 60 to 200 BPM clock or an external clock input, and
  buttons to randomise, lock, rotate, spawn and kill cells. The firmware targets an Arduino
  Nano-style AVR and a MAX7219 display driver.
platform: ATmega328P (Arduino Nano) with MAX7219 LED driver
links:
  manufacturer: https://github.com/E103-designs/SINCRIA
notes: >-
  The repository publishes the firmware, a user guide and photos. Its schematics folder says the
  corrected schematic and editable CAD files are still to be uploaded, and that the published
  sketch has not been checked against the newest PCB revision, so confirm the board and MCU
  before uploading.
related: [e103-designs-eurotrack]
