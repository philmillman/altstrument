name: Daisy Field
manufacturer: Electrosmith
category: diy-platform
added: 2026-11-08
tagline: Desktop Daisy board with 16 keys, 8 knobs, an OLED and CV, gate and MIDI jacks
description: >-
  Daisy Field is a desktop board from Electrosmith that houses a Daisy Seed
  and adds eight knobs, two rows of eight lit keys, a small OLED display, two
  switches, four CV inputs, two CV outputs, gate in and out, TRS MIDI in and
  out, line audio jacks, a headphone output and an SD card slot. It was sold as
  a development board and a compact synth for custom DSP firmware.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
stock_firmware: Ships with a Daisy example program on the Seed
links:
  manufacturer: https://web.archive.org/web/20220911044959/https://www.electro-smith.com/daisy/field
  community:
    - label: Daisy community forum
      url: https://community.daisy.audio/
notes: >-
  The Field is no longer on Electrosmith's current store, and its product page
  is only available from the Internet Archive. The board is covered by libDaisy
  (daisy_field.h) and DaisyExamples. It is a separate product from the Daisy
  Patch, Pod and Patch.init() listed on their own page, and the Seed inside it
  is reflashed over USB like a bare Seed.
related: [electrosmith-daisy-seed, electrosmith-daisy-patch]
