name: Daisy Patch / Pod / Patch.init()
manufacturer: Electrosmith
category: eurorack
added: 2026-10-13
tagline: Daisy-based Eurorack and desktop hardware for custom DSP firmware
description: >-
  This entry covers hardware from Electrosmith built on its Daisy embedded audio
  platform, whose Daisy Seed module uses an STM32H750 processor. Daisy Patch is
  a Eurorack module with quad 24-bit audio I/O, Patch.init() is another Eurorack
  module on the platform, and Daisy Pod is a small desktop board with knobs, an
  encoder and buttons.
platform: Electrosmith Daisy Seed and Patch SM (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://electro-smith.com/
  community:
    - label: Daisy community forum
      url: https://community.daisy.audio/
notes: >-
  Daisy Patch is listed by Electrosmith as legacy hardware. Firmware is
  written in C++ (libDaisy / DaisySP), Arduino, Pure Data or Max gen~, and
  flashed over the Daisy bootloader. Ports of Mutable Instruments code to
  Patch follow the same terms as the original (MIT, no use of the Mutable
  name).
