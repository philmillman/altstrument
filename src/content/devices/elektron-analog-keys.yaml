name: Analog Keys
manufacturer: Elektron
category: synth
added: 2026-10-13
tagline: 4-voice analog keyboard synth
description: >-
  The Analog Keys is a four-voice analog synthesizer from Elektron with a 37-key
  velocity- and aftertouch-sensitive keyboard, released in December 2013. It
  uses the same synth architecture as the Analog Four, with two oscillators and
  two filters per voice, and adds Elektron's parameter-lock sequencer and
  onboard effects.
platform: ColdFire (MCF5441x)
stock_firmware: "1.56"
links:
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Chopshop
      url: https://chopshop-synth.pages.dev/
notes: >-
  Only Chopshop currently builds Analog Keys mods (OS 1.56). There is no
  custom firmware for the Analog Four, which Chopshop explicitly does not
  support. Recovery uses the startup menu over DIN MIDI with Elektron's original
  file. Elektron does not permit sharing mod files or links on Elektronauts
  (policy of 2026-09-16); community discussion moved to elektronmods.com and
  modwerk.app.
