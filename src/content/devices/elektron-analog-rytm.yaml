    - label: Chopshop
      url: https://chopshop-synth.pages.dev/
notes: >-
  Mods target OS 1.73. Elektron's support pages now serve only OS 1.74, which
  current mods do not support and which a unit cannot easily be taken back from
  (unverified; Chopshop advises asking Elektron support). Keep Elektron's
  original 1.73 file. Mods leave the recovery code untouched; recovery uses the
  startup menu over DIN MIDI. Elektron does not permit sharing mod files or
  links on Elektronauts (policy of 2026-09-16); community discussion moved to
  elektronmods.com and modwerk.app.
