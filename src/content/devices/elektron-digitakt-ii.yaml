name: Digitakt II
manufacturer: Elektron
category: sampler
added: 2026-10-13
tagline: 16-track sampler
description: >-
  The Digitakt II is Elektron's successor to the Digitakt, announced in April
  2024. It has sixteen tracks that can each be set to mono, stereo or MIDI, 400
  MB of sample memory, a 128 x 64 pixel OLED display and a sequencer with
  patterns of up to 128 steps. The hardware pairs a ColdFire control processor
  with a SHARC+ DSP.
platform: ColdFire + SHARC+ DSP (ADSP-21569)
stock_firmware: "1.17"
links:
  manufacturer: https://www.elektron.se/explore/digitakt-ii
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
      url: https://modwerk.app/
notes: >-
  Early days: OS 1.16 and 1.17 are targeted; nothing here is a polished
  release yet. Research is split between a ColdFire control side and a SHARC+
  audio side. elekloader support for 1.17 is experimental. Mods patch the stock
  .syx you supply and leave the bootloader untouched. Elektron does not permit
  sharing mod files or links on Elektronauts (policy of 2026-09-16); community
  discussion moved to elektronmods.com and modwerk.app.
