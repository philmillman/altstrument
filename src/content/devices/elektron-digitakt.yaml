name: Digitakt (mk1)
manufacturer: Elektron
category: sampler
added: 2026-10-13
tagline: 8-track sampler
description: >-
  The Digitakt is a compact drum computer and sampler from Elektron, released in
  2017. It has eight sample-playback audio tracks and eight MIDI tracks, with
  sixteen trig keys, a per-track filter and effects section, and Elektron's
  parameter-lock sequencer. Samples are mono, and the unit can be used as a USB
  audio and MIDI interface.
platform: ColdFire (MCF5441x)
stock_firmware: "1.53 / 1.54"
links:
  manufacturer: https://www.elektron.se/explore/digitakt
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
      url: https://modwerk.app/
notes: >-
  Mods target OS 1.53 and 1.54 and are loaded with elekloader, which builds a
  custom .syx from the stock file you supply and leaves the bootloader
  untouched, so the official OS restores the unit; recovery over physical DIN
  MIDI from the startup menu is the documented fallback. Some mods are built
  for 1.53 only (DigiFilter, DigiSplash). Elektron does not permit sharing mod
  files or links on Elektronauts (policy of 2026-09-16); community discussion
  moved to elektronmods.com and modwerk.app.
related: [elektron-digitone, elektron-digitakt-ii, elektron-tools]
