name: Digitone / Digitone Keys (mk1)
manufacturer: Elektron
category: synth
added: 2026-10-13
tagline: 8-voice FM synth
description: >-
  The Digitone is a desktop four-operator FM synthesizer from Elektron, released
  in 2018. It has eight voices shared across four synth tracks, plus four MIDI
  tracks, and uses Elektron's parameter-lock step sequencer. A 37-key version,
  the Digitone Keys, followed in 2019 and shares the same engine and firmware
  line.
platform: 2x ColdFire (MCF5441x)
stock_firmware: "1.43 / 1.44"
links:
  manufacturer: https://www.elektron.se/explore/digitone
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
      url: https://modwerk.app/
notes: >-
  Mods target OS 1.43 and 1.44 for both the desktop Digitone and Digitone
  Keys, loaded with elekloader, which builds a custom .syx from the stock file
  you supply and leaves the bootloader untouched. Elektron does not permit
  sharing mod files or links on Elektronauts (policy of 2026-09-16); community
  discussion moved to elektronmods.com and modwerk.app.
related: [elektron-digitakt, elektron-digitone-ii, elektron-tools]
