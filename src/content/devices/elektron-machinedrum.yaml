name: Machinedrum
manufacturer: Elektron
category: drum-machine
added: 2026-10-14
tagline: 16-track drum synthesizer and sequencer
description: >-
  The Machinedrum is a drum machine from Elektron, first released in 2001 and
  later revised as the SPS-1UW MKII (2007) and SPS-1UW+ MKII (2010). It has 16
  tracks, each loaded with one of its synthesis machines, a per-track effects
  chain and master reverb, delay, EQ and dynamics sections. The UW versions add
  a sample-playback engine, and Elektron's parameter-lock sequencer is built in.
platform: ColdFire (MCF5206e) + 2x Motorola DSP56303
stock_firmware: "1.63"
links:
  manufacturer: https://www.elektron.se/support-downloads/machinedrum
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
      url: https://modwerk.app/
notes: >-
  The OS entries build an update from an official file you supply and send it
  to the unit as a SysEx update, so sending the original OS file again restores
  the unit; none of the projects here distributes Elektron firmware. User
  machines are separate: they are small SysEx files stored in Machine Manager
  slots and need a third-party OS that supports them (MDX X.20 B for the entry
  listed here, which the MDS tools and the machinedrum-kit documentation also
  target). Gearmulator MD/MM and MDMM emulate the Machinedrum and the
  Monomachine on a desktop from an OS file you supply, and the MegaCommand
  runs the MCL sequencer firmware as a separate device built to accompany the
  Machinedrum. Elektron does not
  permit sharing mod files or links on Elektronauts (policy of 2026-09-16, as
  noted on the other Elektron devices); community discussion moved to
  elektronmods.com and modwerk.app.
related: [elektron-octatrack, elektron-tools, elektron-monomachine, megacommand]
