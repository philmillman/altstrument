name: Model:Cycles
manufacturer: Elektron
category: groovebox
added: 2026-10-13
tagline: 6-track FM groovebox
description: >-
  The Model:Cycles is a compact six-track FM groovebox made by Elektron and
  released in 2020. It packages a simplified version of the Digitone's FM engine
  as six voices, each with four macro controls, driven by a six-track sequencer
  with parameter locks and patterns up to 64 steps. Delay and reverb are built in,
  and it is part of Elektron's lower-priced Model series alongside the
  Model:Samples.
platform: ColdFire (MCF5441x)
stock_firmware: "1.13"
links:
  manufacturer: https://www.elektron.se/support-downloads/modelcycles
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modded Cycles browser flasher
      url: https://18nelli18.github.io/Modded-Cycles/flasher/
notes: >-
  Mods target OS 1.13 and patch the official .syx you supply; none ship
  Elektron firmware. Model:Cycles and Model:Samples share much of their
  firmware, so several projects (Modded Cycles, elektron-model-tweaks,
  ms-multi-output, plaits-on-models) cover both; Modded Cycles can also turn a
  Cycles into a Samples and back, where returning needs a MIDI interface.
  Elektron does not permit sharing mod files or links on Elektronauts (policy
  of 2026-09-16); community discussion moved to elektronmods.com and
  modwerk.app.
related: [elektron-model-samples, elektron-syntakt]
