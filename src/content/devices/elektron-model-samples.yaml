name: Model:Samples
manufacturer: Elektron
category: sampler
added: 2026-10-13
tagline: 6-track sample-based groovebox
description: >-
  The Model:Samples is a compact six-track sample-based groovebox made by Elektron.
  It has six velocity-sensitive pads, 64 MB of sample
  memory, and a resonant multimode filter, LFO, delay and reverb on each track.
  Its sequencer uses Elektron's parameter locks, and each track can alternatively
  send MIDI.
platform: ColdFire (MCF5441x)
stock_firmware: "1.13"
links:
  manufacturer: https://www.elektron.se/support-downloads/modelsamples
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: elektron-model-tweaks web flasher
      url: https://drumkilla.github.io/elektron-model-tweaks/flasher/
notes: >-
  Mods target OS 1.13 and patch the official .syx you supply. Model:Samples
  shares most of its firmware with the Model:Cycles; elektron-model-tweaks and
  ms-multi-output are filed here; the 1-Bit Editor is filed under
  elektron-model-cycles and also listed here; Modded Cycles, Model-TG and
  plaits-on-models are filed under elektron-model-cycles and say which parts
  also run here. Elektron does not permit sharing mod files or
  links on Elektronauts (policy of 2026-09-16); community discussion moved to
  elektronmods.com and modwerk.app.
related: [elektron-model-cycles]
