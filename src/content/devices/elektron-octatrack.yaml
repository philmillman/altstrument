name: Octatrack MKI / MKII
manufacturer: Elektron
category: sampler
added: 2026-10-13
tagline: 8-track performance sampler
description: >-
  The Octatrack is a performance sampler and sequencer made by Elektron, first
  released in 2010 and later revised as the MKII. It has eight audio tracks, each
  able to hold two effects, plus eight MIDI tracks, a crossfader for morphing
  between scenes, and four audio inputs for live sampling. Audio runs on a
  DSP56300-family DSP with a ColdFire CPU, and samples load from a CompactFlash
  card into RAM or are streamed from it.
platform: ColdFire + Motorola DSP56300
stock_firmware: 1.40C
links:
  manufacturer: https://www.elektron.se/explore/octatrack-mkii
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
      url: https://modwerk.app/
notes: >-
  Every Octatrack mod patches a stock 1.40C OS file you supply yourself and
  leaves the bootloader untouched, so reflashing the official OS restores the
  unit ([FUNC] + power on, then [TRIG 3] per the OCTAMAX notes). No mod
  distributes Elektron firmware; images you build must not be shared. Most
  current projects (octabam, Octatrick, PassOS, midisc, Octaplay) are modules
  or forks of octabam and can be combined through it; Kyoti and ems-octakit
  have their own builders. Elektron does not permit sharing mod files or links
  on Elektronauts (policy of 2026-09-16); community discussion moved to
  elektronmods.com and modwerk.app.
