name: Syntakt
manufacturer: Elektron
category: groovebox
added: 2026-10-13
tagline: 12-track drum and synth groovebox
description: >-
  The Syntakt is a 12-track drum and synth groovebox made by Elektron. Four of
  its tracks use analog drum and cymbal machines and eight use digital machines,
  with an analog effects block that can also process external audio. Its
  sequencer offers patterns of up to 64 steps with parameter locks, and it works
  with Elektron's Overbridge software over USB.
platform: 2x ColdFire (MCF5441x)
stock_firmware: "1.41"
links:
  manufacturer: https://www.elektron.se/explore/syntakt
  community:
    - label: elektronmods.com
      url: https://elektronmods.com/
    - label: Modwerk
      url: https://modwerk.app/
notes: >-
  The public projects target OS 1.41 (workbench) and 1.40A (SY FM4); Modded
  Cycles also reads a Syntakt OS file to borrow engines for the Model:Cycles,
  and its flasher accepts 1.42. The workbench patches your own stock .syx in the
  browser and SY FM4 is built locally from your own file; neither touches the
  bootloader. Elektron does not permit sharing mod files or links on
  Elektronauts (policy of 2026-09-16); community discussion moved to
  elektronmods.com and modwerk.app.
