name: Tonverk
manufacturer: Elektron
category: sampler
added: 2026-11-03
tagline: Elektron sampler-sequencer that plays multisamples and drum kits
description: >-
  The Tonverk is a sampler and sequencer from Elektron, announced in 2025. It plays
  multisampled instruments and sliced drum kits that are stored as .elmulti and
  .eldrum files in its user folders, and it has audio inputs and outputs, MIDI in, out and
  thru, and two USB ports. Prepared multisamples and kits are copied to it as ordinary
  files.
links:
