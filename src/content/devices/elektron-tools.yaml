notes: >-
  Host-side tools that serve more than one device: the elekloader mod loader,
  digiemu and digikit emulators, the OS container tool, and a Ghidra module for
  the DSP56300, plus Elektroid, Overwitch and digi-roll, which talk to the stock
  OS rather than change it. None bundle Elektron firmware; you supply your own .syx. Elektron
  does not permit sharing mod files or links on Elektronauts (policy of
  2026-09-16); community discussion moved to elektronmods.com and modwerk.app.
related: [elektron-digitakt, elektron-digitone, elektron-digitakt-ii, elektron-digitone-ii, elektron-octatrack, elektron-model-cycles, elektron-model-samples]
