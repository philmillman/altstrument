name: Pērkons HD-01
manufacturer: Erica Synths
category: drum-machine
added: 2026-11-10
tagline: four-voice hybrid drum and drone instrument with a 16-step sequencer
description: >-
  The Pērkons HD-01 is a desktop instrument from Erica Synths that sits between a drum machine, a synthesizer and
  a drone box. It has four hybrid voices, each with a digital sound engine that offers three modes, an analog
  multimode filter with overdrive and eight controls, plus a BBD delay send. A sequencer controls all four tracks
  at once, kits store the voice settings, and an LFO can be assigned to any parameter. Each voice has its own
  trigger input, output and FX send and return, and it has MIDI.
stock_firmware: 1.3.0
links:
