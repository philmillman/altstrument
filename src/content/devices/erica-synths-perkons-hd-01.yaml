  community:
    - label: perkons-re source (Mod Matrix and tools)
      url: https://github.com/kiteless/perkons-re
notes: >-
  Firmware updates are an .img file copied to the root of the SD card and installed at power-on with all four voice
  trigger keys held. The custom firmware recorded here is built from your own copy of Erica Synths' official 1.3.0
  image; no stock image is distributed with it.
