name: Zen Delay
manufacturer: Erica Synths
category: pedal
added: 2026-10-26
tagline: Stereo delay with a multimode filter and valve overdrive, made by Erica Synths with Ninja Tune
description: >-
  The Zen Delay is a stereo delay effect that Erica Synths made together with the record label Ninja Tune. It has delay
  times from 1 to 5000 ms, with divisions of a tapped or MIDI clock tempo from 1/8 to x8, five delay modes, and a
  multimode filter and a valve overdrive stage after the delay. It takes stereo audio, a control voltage input and a
  MIDI input, and it is controlled by knobs, a tap button and a bypass switch.
stock_firmware: 1.1.0 (2020-06-18)
links:
  manufacturer: https://www.ericasynths.lv/zen-delay-554/
  community:
    - label: Erica Synths support
      url: https://www.ericasynths.lv/support/
notes: >-
  Erica Synths publishes firmware updates as audio files that are played into the left input while the unit is
  powered on in update mode with the TAP button held, and units ordered from 2020 onwards already run the latest
  version. The mod listed here patches a copy of Erica Synths' official 1.1.0 update file that the user downloads,
  and Erica Synths' own file restores the stock firmware. Erica Synths does not support modified firmware.
