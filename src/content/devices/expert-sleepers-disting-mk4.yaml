name: disting mk4
manufacturer: Expert Sleepers
category: eurorack
tagline: 4HP Eurorack utility module with 112 selectable algorithms
description: >-
  The disting mk4 is a 4HP Eurorack module from Expert Sleepers of the UK, the fourth version of the original disting. It
  has two inputs, X and Y, a third control input Z, two outputs, A and B, two knobs and a dot-matrix screen that shows text
  and values. The module runs one algorithm at a time chosen from a list of 112 covering utilities, filters, oscillators,
  delays, envelopes and more. It has a MicroSD slot on the front panel, MIDI input and output on a breakout header and
  compatibility with Expert Sleepers' Select Bus protocol.
platform: ARM Cortex-M
links:
  manufacturer: https://www.expert-sleepers.co.uk/disting.html
  community: []
notes: >-
  No custom firmware is known. The firmware is Expert Sleepers' own, and the community tool listed here only browses its
  algorithms and sends MIDI to the module. The manufacturer's page mentions an Expert Sleepers framework for adding algorithms
  to the disting and a forum thread on firmware hacking.
related: [expert-sleepers-disting-nt]
