name: disting NT
manufacturer: Expert Sleepers
category: eurorack
added: 2026-10-13
tagline: Algorithm-based DSP module with 12 inputs and 6 outputs
description: >-
  The disting NT is a 22HP Eurorack DSP module from Expert Sleepers of the UK
  and the successor to the disting EX in a line that began with the original
  disting in 2014. It has twelve DC-coupled inputs and six outputs, with two
  more outputs on a breakout, and a MicroSD card slot. The module runs a user-
  selected list of algorithms at the same time, covering synthesis, effects,
  sampling, sequencing and utilities.
links:
  manufacturer: https://www.expert-sleepers.co.uk/distingNT.html
  community:
    - label: distingNT_API
      url: https://github.com/expertsleepersltd/distingNT_API
    - label: nt_helper editor
      url: https://github.com/No-Such-Device/nt_helper
notes: >-
  The main firmware is closed. Community work arrives as plugins built against
  the C++ API (added in firmware 1.7.0): compiled .o files copied to the
  plugins folder on the SD card. They add algorithms to the stock firmware and
  are not replacement firmware.
