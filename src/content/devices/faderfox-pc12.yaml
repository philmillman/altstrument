name: PC12
manufacturer: Faderfox
category: controller
added: 2026-11-03
tagline: Compact MIDI pot controller with 72 knobs, 12 buttons and a push encoder
description: >-
  The PC12 is a MIDI pot controller from Faderfox of Hamburg. It has seventy-two potentiometers in six rows of twelve, a row of twelve backlit buttons, a
  push encoder and a small LED display. Each control is assigned a command type, channel, number and value range, in setups stored on the unit.

  The unit can send one setup or all setups as a SysEx dump and receive them again, which is how the unofficial browser editor works.
platform: Not published
links:
  manufacturer: https://faderfox.de/pc12.html
notes: >-
  No custom firmware is catalogued for the PC12. The entry here is a browser editor that exchanges setups with the unit over MIDI SysEx. It is not made or endorsed by Faderfox.
