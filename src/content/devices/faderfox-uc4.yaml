name: UC4
manufacturer: Faderfox
category: controller
tagline: Compact USB and MIDI controller with 8 encoders, 8 faders and 18 setups
description: >-
  The UC4 is a small hardware MIDI controller from Faderfox of Hamburg. It has eight push encoders above a display, eight faders with a ninth cross-fader style
  control, and eight backlit buttons. Its memory holds 18 setups of eight groups each, and each control can send control changes, notes and
  other messages on any channel.

  Setups are edited on the unit through its menus, or by sending and receiving a SysEx dump. Faderfox has shared parts of the SysEx format with editor authors, and there are several unofficial browser editors for the unit.
platform: Not published
links:
  manufacturer: https://faderfox.de/uc4.html
notes: >-
  No custom firmware is catalogued for the UC4. The entries here are browser editors that exchange setups with the unit over MIDI SysEx. They are not made or endorsed by Faderfox.
