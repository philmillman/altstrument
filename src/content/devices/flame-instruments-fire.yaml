name: FIRE
manufacturer: Flame Instruments
category: eurorack
added: 2026-11-09
tagline: Eurorack 8-voice percussion synthesizer
description: >-
  FIRE is an eight-voice percussion synthesizer in Eurorack format from Flame Instruments of Germany. Each voice has
  a gate input and a velocity or CV input, there are MIDI inputs and an output, individual audio outputs and a stereo
  pair, and an X-FIRE expander panel shown with it carries gate and velocity-CV inputs and outputs 4 to 8. Sounds are edited on a small display with eight knobs
  and stored in kits.
stock_firmware: "1.07"
links:
  manufacturer: https://www.flame-instruments.de/flame2/instruments_modular.html#fire
  community:
    - label: Flame FIRE downloads
      url: https://www.flame-instruments.de/flame2/downloads.html#fire
notes: >-
  The stock firmware is updated over MIDI by sending a SysEx file while the module is switched on in its update mode;
  Flame publishes its firmware versions on its downloads page. The only custom firmware listed so far is a binary-only
  modification of stock v1.07.
related: [flame-instruments-takt]
