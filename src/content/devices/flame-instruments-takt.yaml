name: TAKT
manufacturer: Flame Instruments
category: eurorack
added: 2026-11-09
tagline: Eurorack 8-track rhythm sequencer
description: >-
  TAKT is a Eurorack rhythm sequencer from Flame Instruments of Germany. It has eight tracks, each with a gate and a
  CV output, four LFOs, clock and reset jacks, MIDI in and out, and four patterns plus fill that are stored in scenes.
  Knobs set variation, gate time, beat and velocity, and a three-digit display shows values and menus.
stock_firmware: 1.7.2
links:
  manufacturer: https://www.flame-instruments.de/flame2/instruments_modular.html#takt
  community:
    - label: Flame TAKT downloads
      url: https://www.flame-instruments.de/flame2/downloads.html#takt
notes: >-
  The stock firmware is updated over MIDI by sending a SysEx file while the module is switched on in its update mode.
  Flame publishes its firmware versions on its downloads page. The only custom firmware listed so far is a binary-only
  modification of stock v1.7.2.
related: [flame-instruments-fire]
