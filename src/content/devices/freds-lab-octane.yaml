name: Octane
manufacturer: Fred's Lab
category: other
added: 2026-11-15
tagline: 8-in, 8-out TRS MIDI hub with USB-C, built on a Rust firmware and open hardware
description: >-
  The Octane is a class-compliant MIDI hub from Fred's Lab, made with Sourcebox. It has eight TRS MIDI inputs, eight TRS MIDI
  outputs and a USB-C port that carries power and MIDI. Routing, merging, filtering, channel and controller remapping and
  keyboard splits are set in the Tentacles web patch editor. A Raspberry Pi RP2354 microcontroller runs the firmware, which is
  updated over USB. The product page states that the hardware schematics and firmware sources are open, and it was on Kickstarter
  in November 2026 with delivery planned from February 2027.
platform: Raspberry Pi RP2354
