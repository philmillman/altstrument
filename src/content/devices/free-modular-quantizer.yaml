name: Quantizer
manufacturer: Free Modular
category: eurorack
tagline: Open-hardware 10 HP two-channel quantizer
description: >-
  The Quantizer is a 10 HP Eurorack module from the Free Modular project, a set
  of free and open source DIY module designs by Quinn Freedman. It rounds two
  volt-per-octave pitch signals to a musical scale, with the channels either
  independent or linked. Each channel has transposition, delay and portamento,
  and works as sample-and-hold, track-and-hold or continuous quantization. Scales
  are set note by note and can be saved to and recalled from persistent storage.
platform: ATmega328P (Arduino Nano)
links:
  manufacturer: https://freemodular.org/modules/Quantizer/
  community:
    - label: Quantizer source, firmware and KiCad files
      url: https://github.com/QuinnFreedman/modular/tree/main/modules/Quantizer
notes: >-
  The design, schematic and original Rust firmware are published in the Free
  Modular repository. The module is built from a PCB set, as a kit or bought
  hand-assembled; the Nano's USB port is for flashing only and must not be
  connected while the module is on a Eurorack power bus.
