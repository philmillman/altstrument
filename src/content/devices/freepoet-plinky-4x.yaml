name: Plinky 4X
manufacturer: FREEPOET
category: synth
added: 2026-11-27
tagline: Large-format Plinky with four times the touch area, a 2.23-inch OLED and a built-in battery
description: >-
  Plinky 4X is a redesigned, enlarged version of the Plinky touch synth, made by FREEPOET. It has eight touch strips about 205 mm long plus a function row,
  72 pads with 72 LEDs, and a 2.23-inch OLED in place of the original 0.91-inch one. The maker lists the panel area as four times that of the original.

  All original ports are kept, with two extra quarter-inch outputs and a volume knob. It has a built-in battery rated by the maker at 8 to 12 hours, and
  a built-in expander circuit with a gyroscope whose tilt can be used for parameter modulation. It runs Plinky firmware, and the FREEPOET firmware
  repository describes it as the same design scaled up.
platform: STM32L476 (Arm Cortex-M4)
links:
  manufacturer: https://freepoet.co.uk/products/plinky-4x
  community:
    - label: Plinky4x firmware repository
      url: https://github.com/FreepoetOfficial/Plinky4x-Firmware
notes: >-
  The one custom firmware listed is FREEPOET's own Plinky4x build of Plinky LPE, which is open source and installs through the Plinky bootloader as a UF2
  file. It cannot use touch calibration made by other firmware, so it starts a calibration on first boot.
