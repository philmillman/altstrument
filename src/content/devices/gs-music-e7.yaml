name: e7
manufacturer: GS Music
category: synth
tagline: Seven-voice analog polysynth with MPE support
description: >-
  The e7 is an analog polyphonic synthesizer from GS Music of Buenos Aires,
  announced in 2022. It has seven voices with two oscillators and sub oscillators per voice and a
  four-pole ladder low-pass filter, plays four parts multitimbrally and supports MPE. Its
  memory and settings are readable and writable over MIDI SysEx.
links:
  manufacturer: https://www.gsmusic.com/
notes: >-
  No custom firmware is known; the entry here is a browser editor.
