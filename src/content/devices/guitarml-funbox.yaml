name: Funbox
manufacturer: GuitarML
category: pedal
added: 2026-10-13
tagline: Stereo DIY guitar pedal platform for the Daisy Seed
description: >-
  Funbox is an open-source stereo digital guitar pedal design by Keith Bloemer
  of GuitarML, first released in 2024. Its PCB, with KiCad design files in the
  GitHub repository, hosts an Electrosmith Daisy Seed (an STM32H750 audio
  board) in a 125B enclosure with six knobs, three toggle switches and two
  footswitches.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://github.com/GuitarML/FunBox
  community:
    - label: Funbox build guide
      url: https://medium.com/@keyth72/funbox-build-guide-afbd8046121e
related: [cleveland-hothouse, pedalpcb-terrarium, electrosmith-daisy-patch]
notes: >-
  Open hardware with KiCad design files in the repository (125B enclosure, about
  $120 to $150 to build per the README). Programs are loaded with the Electrosmith
  web programmer or a make target; some modules (Mars, Neptune) use SRAM and
  need the Daisy bootloader. Funbox effects have been ported to the Cleveland
  Hothouse.
