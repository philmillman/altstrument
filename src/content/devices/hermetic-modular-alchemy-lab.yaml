name: Alchemy Lab
manufacturer: Hermetic Modular
category: eurorack
added: 2026-10-14
tagline: 12 HP Daisy-based Eurorack platform with field-programmable jacks, 102 RGB LEDs and an open MIT SDK
description: >-
  Alchemy Lab is a 12 HP Eurorack module from Hermetic Modular that serves as
  a hardware platform for interchangeable firmwares. It has six pots, three
  buttons, stereo audio in and out, six CV jacks that firmware can switch
  between input and output, and 102 RGB LEDs arranged as rings around the
  pots, plus a microSD slot, a front USB-C port with USB-MIDI and a rear
  SPI/I2C expansion header.

  The platform is sold with Hermetic Modular's Echoa, Spagyros and Capicola
  firmwares, and buying it includes future releases. Firmware is swapped and
  presets are backed up from the web programmer in a Chromium browser.
platform: STM32H750 (Arm Cortex-M7, 480 MHz), Electrosmith Daisy ecosystem (64 MB SDRAM, 16 MB QSPI flash)
