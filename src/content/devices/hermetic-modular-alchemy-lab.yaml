notes: >-
  Any Alchemy Lab firmware runs on any Alchemy Lab; the panel is swapped to
  match. Official firmwares are flashed from the web programmer over the
  front USB-C port, which needs a Chromium-based browser (Chrome, Edge or
  Brave) and backs up and migrates presets during updates. The module uses a
  fork of the Electrosmith Daisy bootloader, so custom builds can also be
  flashed with dfu-util after holding B3 through the boot window. The Echoa
  and Spagyros sources are not published; the Alchemy SDK they are built on,
  the board support package and the bootloader are open under MIT.
