name: K1 / K1m / K1r
manufacturer: Kawai
category: synth
added: 2026-11-03
tagline: Kawai's digital synthesizer family with four-source patches
description: >-
  The K1 is a digital synthesizer from Kawai, sold as the K1 keyboard, the K1m module and the K1r rack module. Each patch
  combines up to four sources that play waves from a 256-wave set, with its own envelope. The unit stores 64 internal single
  patches and takes patches over MIDI System Exclusive.
notes: >-
  The K1rII is a later rack model. No custom firmware is known; the entry here is a host-side editor.
