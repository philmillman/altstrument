name: DW-6000
manufacturer: Korg
category: synth
added: 2026-11-03
tagline: Six-voice digital waveform synth, the DW-8000's sibling
description: >-
  The DW-6000 is a six-voice hybrid synthesizer from Korg that plays single-cycle digital waveforms, called DWGS, through
  analog-style filter and amplifier sections and a chorus. It stores 64 programs and takes parameter changes and program dumps
  over MIDI System Exclusive.
links:
  manufacturer: https://www.korg.com/us/support/download/product/1/316/
notes: >-
  No custom firmware is known; the entries here are host-side editors that work over SysEx.
