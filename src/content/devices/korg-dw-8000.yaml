name: DW-8000
manufacturer: Korg
category: synth
tagline: 1985 eight-voice digital waveform synth with analog filters
description: >-
  The DW-8000 is an eight-voice hybrid synthesizer that Korg released in 1985. Its oscillators play single-cycle digital
  waveforms, called DWGS, and the signal then passes through analog-style filter and amplifier sections with a digital delay.
  It stores 64 programs and takes parameter changes and program dumps over MIDI System Exclusive.
links:
  manufacturer: https://www.korg.com/us/support/download/product/1/309/
notes: >-
  No custom firmware is known; the entries here are host-side editors that work over SysEx.
