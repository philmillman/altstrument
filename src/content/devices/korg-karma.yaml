name: KARMA
manufacturer: Korg
category: synth
added: 2026-11-03
tagline: Music workstation that adds algorithmic MIDI generation to Triton synthesis
description: >-
  The KARMA is a music workstation from Korg that uses the HI synthesis engine of the Triton and adds the KARMA function,
  which generates and changes MIDI data from algorithms while you play. Its programs are held in banks and can be exchanged
  over MIDI System Exclusive.
links:
  manufacturer: https://www.korg.com/de/products/synthesizers/karma/
notes: >-
  Korg lists the KARMA as discontinued. No custom firmware is known; the entries here are host-side editors, and the one
  covering it is marked beta by its author.
