name: M1
manufacturer: Korg
category: synth
added: 2026-11-03
tagline: 1988 music workstation with a sequencer and onboard effects
description: >-
  The M1 is a digital synthesizer that Korg released in 1988 and sold into the mid 1990s, and it set the pattern for the
  music workstation. A 61-key keyboard drives sampled waveforms processed by Korg's AI synthesis, with onboard effects, a
  drum part and an eight-track sequencer. The internal memory holds 100 programs and 100 combinations, and a memory card adds
  50 of each.
links:
  manufacturer: https://www.korg.com/de/products/synthesizers/m1/
notes: >-
  This entry covers the hardware M1. Korg also sells the M1 as software, which is not part of the catalog. No custom firmware
  is known; the entry here is a host-side librarian.
