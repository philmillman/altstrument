name: microKORG
manufacturer: Korg
category: synth
tagline: 2002 compact synthesizer and vocoder with a gooseneck microphone
description: >-
  The microKORG is a compact synthesizer and vocoder that Korg released in 2002. It has 37 mini keys, a gooseneck microphone
  for the vocoder, an arpeggiator and 128 programs, and its voice engine is derived from Korg's MS2000. Programs travel over
  MIDI SysEx as 254-byte dumps.
links:
  manufacturer: https://www.korg.com/us/products/synthesizers/microkorg/
notes: >-
  This is the original microKORG. The microKORG S and the microKORG2 are different units. No custom firmware is known for
  the original; the entry here is a host-side librarian.
related: [korg-microkorg-2, korg-ms2000]
