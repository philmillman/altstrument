name: minilogue
manufacturer: Korg
category: synth
added: 2026-11-03
tagline: Four-voice polyphonic analog synthesizer from 2015
description: >-
  The minilogue is Korg's original four-voice polyphonic analog synthesizer, with two oscillators per voice, a 16-step
  sequencer and a small display that shows program data and an oscilloscope view. It stores its sounds as programs that Korg's
  Sound Librarian software moves over USB.
links:
  manufacturer: https://www.korg.com/us/products/synthesizers/minilogue/
notes: >-
  This is the original minilogue, not the minilogue xd, which runs the logue SDK. No custom firmware is known for the
  original; the entry here is a host-side editor.
related: [korg-minilogue-xd, korg-prologue]
