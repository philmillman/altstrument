name: MS2000 / MS2000R
manufacturer: Korg
category: synth
added: 2026-11-03
tagline: Analog modeling synthesizer with a vocoder and its rack version
description: >-
  The MS2000 is an analog modeling synthesizer from Korg with four voices, two oscillators per voice and a 16-band vocoder. It
  has 128 programs in eight banks, six arpeggiator patterns and modulation, delay and EQ effects. The MS2000R is the module
  version. Programs are exchanged over MIDI System Exclusive.
links:
  manufacturer: https://www.korg.com/de/products/synthesizers/ms2000/
notes: >-
  Korg lists the MS2000 as discontinued. No custom firmware is known; the entries here are host-side editors that work over
  SysEx.
related: [korg-microkorg]
