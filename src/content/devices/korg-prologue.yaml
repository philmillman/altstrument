notes: >-
  Custom firmware images for the prologue are not known. What the community
  builds are user units made with the logue SDK: custom oscillators for the
  Multi-Engine and modulation, delay and reverb effects (.prlgunit files, which
  are zip archives). Korg lists 16 user oscillator slots and 16 user effect
  slots. Units built with SDK 1.1-0 need system firmware 2.00 or later. They are
  loaded with Korg's prologue Librarian application or the logue-cli command
  line tool, and run alongside the stock firmware rather than replacing it.
  logue-cli can also clear unit data from the instrument. Units built for the
  prologue, minilogue xd and the original NTS-1 digital kit are binary
  compatible with each other when the SDK version matches, though Korg
  encourages builds optimized for each target.
related: [korg-minilogue-xd, korg-nts-1, korg-nts-1-mkii, korg-nts-3, korg-drumlogue, korg-microkorg-2, korg-logue-tools]
