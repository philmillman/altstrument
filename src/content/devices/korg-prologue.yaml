name: prologue
manufacturer: Korg
category: synth
added: 2026-10-14
tagline: 8- or 16-voice analog polysynth with a Multi-Engine that accepts logue SDK units
description: >-
  The prologue is a polyphonic analog synthesizer made by Korg, sold as a
  16-voice, 61-key model and an 8-voice, 49-key model. Each voice has two
  analog oscillators plus a digital Multi-Engine acting as a third, with noise,
  VPM and user oscillator types, followed by one filter, two envelopes, one
  amp and one LFO. It is bi-timbral, so two programs can be played at once, and
  it has a modulation effect and a delay/reverb effect unit.
platform: ARM Cortex-M4 (STM32F401)
links:
  manufacturer: https://www.korg.com/us/products/synthesizers/prologue/
  community:
    - label: logue SDK (prologue platform)
