name: volca beats
manufacturer: Korg
category: drum-machine
added: 2026-10-20
tagline: Analog and PCM drum machine with 16-step sequencer
description: >-
  The volca beats is a compact drum machine made by Korg and released in 2013
  as part of its volca series. Four of its ten parts (kick, snare and two toms)
  are analog and the other six (closed and open hat, clap, claves, agogo and
  crash) play PCM sounds with a speed control. A 16-step sequencer with motion
  sequencing drives it, and the unit has sync in/out and MIDI in.
stock_firmware: "1.04"
links:
  manufacturer: https://www.korg.com/us/products/dj/volca_beats/
notes: >-
  Firmware updates are audio files played into the SYNC IN jack. The one
  catalogued entry is a patcher that builds a modified update from Korg's own
  1.04 file, which the user downloads from Korg. Keep Korg's file to restore
  stock.
