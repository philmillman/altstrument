name: volca drum
manufacturer: Korg
category: drum-machine
added: 2026-10-13
tagline: 6-part digital percussion synth with motion sequencing
description: >-
  The volca drum is a six-part digital percussion synthesizer made by Korg as
  part of its compact volca series. Each part has two layers,
  each with an oscillator, pitch modulator and amp envelope, and a waveguide
  resonator effect adds physically modeled resonance. A 16-step sequencer with
  motion sequencing records knob movements, and the unit has sync in/out and
  MIDI in.
stock_firmware: "1.14"
links:
  manufacturer: https://www.korg.com/us/products/dj/volca_drum/
  community:
    - label: Sonic State coverage of vdcf
      url: https://sonicstate.com/news/2026/08/20/free-custom-firmware-for-the-volca-drum/
notes: >-
  Firmware updates are audio files played into the SYNC IN jack. The vdcf
  project removed Korg's downgrade check, so Korg's own 1.14 file can be
  played to return to stock.
