name: volca fm2
manufacturer: Korg
category: synth
tagline: Six-voice, six-operator FM synth from the volca series
description: >-
  The volca fm2 is Korg's 2022 successor to the volca fm, a compact digital FM synthesizer with six voices, six operators and
  the 32 DX7 algorithms. It plays Yamaha DX7 SysEx patches and has a 16-step sequencer with motion recording, an arpeggiator
  and effects. It runs on batteries or an adapter, has a built-in speaker, and takes MIDI through minijack IN and OUT ports.
links:
  manufacturer: https://www.korg.com/us/products/dj/volca_fm2/
notes: >-
  Not the same unit as the original volca fm, which has three voices and a DIN MIDI input. No custom firmware is known for
  the volca fm2; the entries here are host-side editors that talk to it over MIDI SysEx and leave its software untouched.
related: [korg-volca-fm]
