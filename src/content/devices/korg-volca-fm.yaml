name: volca fm
manufacturer: Korg
category: synth
added: 2026-10-13
tagline: Compact 6-operator FM synth with 16-step sequencer
description: >-
  The volca fm is a compact digital FM synthesizer made by Korg, released in 2016
  as part of its volca series. It has three-voice polyphony, six operators and
  32 algorithms, and can load Yamaha DX7 SysEx patches. A 16-step sequencer with
  motion sequencing stores up to 16 patterns, and the touch keyboard records
  notes into it.
links:
  manufacturer: https://www.korg.com/us/products/dj/volca_fm/
  community:
    - label: ranzee.com firmware mirror (1.08)
      url: https://ranzee.com/korg-volca-fm-firmware-1-08-unofficial-update/
notes: >-
  Covers the original (mk1) volca fm. The unofficial firmware here is reported
  not to apply to the volca fm 2. Updates are audio files played into the
  SYNC IN jack, and Korg's official file can be played to go back.
