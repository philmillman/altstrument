name: volca sample2
manufacturer: Korg
category: sampler
tagline: Revised volca sample with a USB port and 200 sample slots
description: >-
  The volca sample2 is the second revision of Korg's volca sample, a compact digital sample sequencer with ten parts and a
  16-step sequencer with motion recording. Unlike the first version it has a USB port, over which Korg's librarian software
  and third-party tools move samples and settings. Samples are 16-bit mono at 31.25 kHz, and the unit holds 200 sample
  slots.
links:
  manufacturer: https://www.korg.com/us/products/dj/volca_sample2/
notes: >-
  The original volca sample loads samples as audio through its sync input, and the unofficial firmware catalogued for it
  targets that version. No custom firmware is known for the volca sample2; the entries here are host-side tools.
related: [korg-volca-sample]
