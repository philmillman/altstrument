name: X5DR
manufacturer: Korg
category: synth
tagline: AI2 synthesis tone module with General MIDI sounds
description: >-
  The X5DR is a MIDI tone module from Korg that uses AI2 synthesis, with 64-voice polyphony and 430 built-in multisounds. Its
  memory holds a user bank of 100 programs, and a second bank holds 136 General MIDI programs. It also offers combinations,
  multi setups, drum kits and a set of effects.
links:
  manufacturer: https://www.korg.com/us/support/download/product/1/234/
notes: >-
  Korg lists the X5DR as discontinued and keeps only its manual and drivers online. No custom firmware is known; the entry
  here is a host-side editor.
