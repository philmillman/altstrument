name: 1000 GX
manufacturer: Kurzweil
category: synth
added: 2026-11-10
tagline: 1988 rack expander for guitar players with ROM-based sounds
description: >-
  The 1000 GX is a rack sound module from Kurzweil's K1000 series, aimed at
  guitar players and released in 1988. It is driven by a 68000 processor and plays
  samples held in wave ROM chips, with the operating system and the sound
  definitions stored in separate program and SETUP EPROMs. Two of its four wave
  ROM banks are left unpopulated, and the series was also sold as the PX, SX, HX
  and AX expanders and as the K1000 keyboard.
platform: Motorola 68000, Kurzweil custom sound chips
stock_firmware: SETUP V2.5
links:
  manufacturer: https://kurzweil.com/k1000_series/
  community:
    - label: k1000.net
      url: http://k1000.net
notes: >-
  Custom sounds for this unit are installed by programming EPROM chips and
  replacing the SETUP chips inside the case. The only entry targets SETUP V2.5
  of the GX.
