name: PCM 70
manufacturer: Lexicon
category: other
tagline: Digital effects processor with reverb, delay and chorus algorithms and 50 user registers
description: >-
  The PCM 70 is a digital effects processor from Lexicon with eleven programs, including Concert Hall, Rich Chamber, Rich
  Plate, Infinite Reverb, Chorus and Echo, Multiband Delay, Resonant Chords and rhythm-synced variants. It keeps its edits in
  50 registers, has a dynamic MIDI patch bay with ten patches, and sends and receives its settings as SysEx bulk dumps. Firmware
  2.0 and 3.0 differ in their layouts, and 3.0 adds the Inverse Room program.
links:
  manufacturer: https://lexiconpro.com/en/products/pcm70
notes: >-
  No custom firmware is known. The browser editor works over MIDI SysEx and does not replace the firmware. The front panel
  does not send its edits over MIDI, so the editor has to ask the unit for its active program.
