name: Reflex
manufacturer: Lexicon
category: other
added: 2026-11-03
tagline: Digital effects processor with eight algorithms and 128 registers
description: >-
  The Reflex is a digital effects processor from Lexicon with eight algorithms: Hall, Plate, Flanger, Multi-Taps, Resonator,
  Inverse, Gate and Chorus. It holds 128 registers, of which registers 113 to 128 are for user settings. It takes MIDI
  program changes and SysEx messages. Reading data back from the unit needs the internal MIDI output jumper set to out rather than thru.
links:
  manufacturer: https://lexiconpro.com/en/products/reflex
notes: >-
  No custom firmware is known. The browser editor works over MIDI SysEx and does not replace the firmware.
