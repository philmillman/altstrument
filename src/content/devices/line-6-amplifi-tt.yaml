name: Line 6 AMPLIFi TT
manufacturer: Line 6
category: other
tagline: Discontinued tabletop guitar processor with Bluetooth and USB audio
description: >-
  The AMPLIFi TT is a tabletop guitar effects processor from Line 6 that stores 100 tones and was designed to be edited and
  streamed to from a phone or tablet app over Bluetooth. It has a guitar input, an Amp Out and Main outputs, headphone and optical
  S/PDIF output, an FBV foot controller port and a USB port that appears as a stereo 24-bit 48 kHz audio interface. Line 6 has
  discontinued the unit, and the mobile app workflow that went with it is no longer maintained.
platform: NXP LPC1820 (Cortex-M3) control CPU and Analog Devices ADSP-21489 SHARC DSP
stock_firmware: "2.61"
links:
  manufacturer: https://line6.com/
  community: []
notes: >-
  A flash that goes wrong can leave the unit needing its microSD card restored, and the firmware is stored on that card. Line 6
  firmware must be obtained from Line 6 and is not shared in this catalog. Everything here is unsupported by Line 6 and used at
  your own risk.
