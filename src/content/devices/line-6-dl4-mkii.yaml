name: DL4 MkII
manufacturer: Line 6
category: pedal
added: 2026-11-02
tagline: Delay modeler stompbox, the updated DL4
description: >-
  The DL4 MkII is a delay modeler pedal from Line 6 and a revision of the original DL4. It has a selector knob for
  delay models, four footswitches, a looper, stereo inputs and outputs, MIDI in and out/thru, an XLR microphone
  input and a jack for an expression pedal or extra footswitches. It is smaller and lighter than the first DL4.
