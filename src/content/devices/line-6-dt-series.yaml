name: Line 6 DT25 / DT50
manufacturer: Line 6
category: other
tagline: Tube guitar amps with modelled HD preamps and MIDI control
description: >-
  The DT25 and DT50 are 25 and 50 watt tube guitar amplifiers designed by Line 6 with Reinhold Bogner, sold as combos and heads. They pair a tube
  power stage with modelled HD preamps, cabinets and reverb in two channels with four voicings each, and let you change operating
  class and tube configuration. The amps take MIDI control through a 5-pin MIDI input and have no MIDI output, and firmware 2.0 or later
  is the version the available tools target.
stock_firmware: "2.0"
