name: FBV foot controllers
manufacturer: Line 6
category: foot-controller
tagline: Line 6 foot controller family for its amps and modelers
description: >-
  The FBV series is Line 6's range of foot controllers for its amplifiers and modelers. It covers the older FBV Longboard,
  Shortboard and Express units and the current FBV 3, FBV Express MkII and FBV2. The units have footswitches, a display on
  the larger models and an expression pedal input or built-in pedal, and they connect to the amp or modeler through a
  dedicated FBV port. Some models also have a USB port.
links:
  manufacturer: https://line6.com/foot-controllers/
  community:
    - label: r/Line6
      url: https://www.reddit.com/r/Line6/
notes: >-
  No custom firmware for the controllers themselves is known. The community projects here either translate the FBV serial
  messages on an external microcontroller or document the protocol. The page image shows the FBV 3.
related: [line-6-spider-v, line-6-pod-classic, line-6-pod-xt, line-6-amplifi-tt]
