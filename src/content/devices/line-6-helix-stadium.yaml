name: Helix Stadium / Stadium XL
manufacturer: Line 6
category: pedal
tagline: Newest Helix floor processors, with a large display and the Agoura modelling engine
description: >-
  The Helix Stadium and Helix Stadium XL are floor amp and effects processors from Line 6 that follow the original
  Helix. They use a new modelling method that Line 6 calls Agoura, a large colour display, twelve footswitches with
  OLED scribble strips and two variable-impedance instrument inputs. The XL adds an expression pedal with a toe
  switch. They also have an XLR microphone preamp and S/PDIF digital connections.
