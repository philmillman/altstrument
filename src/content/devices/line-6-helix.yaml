name: Helix Floor / LT / Rack
manufacturer: Line 6
category: pedal
added: 2026-11-02
tagline: Line 6 flagship amp and effects processors in floor, LT and rackmount forms
description: >-
  The Helix is the original flagship processor of Line 6's HX family, sold as the Helix Floor, the smaller Helix LT
  and the rackmount Helix Rack. The Floor has twelve footswitches with scribble strips, a built-in expression
  pedal and a colour display. The Rack is played from the separate Helix Control foot controller. All of them run
  on a dual SHARC audio engine, support four stereo signal paths, and are edited with HX Edit.
platform: Dual Analog Devices SHARC DSP
links:
  manufacturer: https://line6.com/helix/
  community:
    - label: r/Line6
      url: https://www.reddit.com/r/Line6/
notes: >-
  No custom firmware is known. The author of the HX Stomp NAM patch says the Floor, LT and Rack firmware is a
  different design, so that patch does not apply here. The entries here are editors and preset tools.
related: [line-6-helix-stadium, line-6-hx-stomp, line-6-hx-stomp-xl, line-6-hx-effects, line-6-pod-go]
