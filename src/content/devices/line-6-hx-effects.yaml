name: HX Effects
manufacturer: Line 6
category: pedal
added: 2026-11-02
tagline: Effects-only HX processor with eight footswitches
description: >-
  The HX Effects is a floor effects processor from Line 6 that carries the HX effect models of the Helix range
  without amp and cab models. It has eight capacitive-touch footswitches with small scribble displays, stereo
  effects loops and MIDI, and is edited with HX Edit. Audio runs on an Analog Devices SHARC DSP and an NXP LPC4350
  handles control.
platform: Analog Devices SHARC DSP, NXP LPC4350 control MCU
stock_firmware: 3.80.0
links:
  manufacturer: https://line6.com/hx-effects/
  community:
    - label: r/Line6
      url: https://www.reddit.com/r/Line6/
notes: >-
  NAM A2 Lite for HX Effects patches your own copy of stock 3.80.0. Holding the > button at power on gives update
  mode for recovery. Built files contain Line 6's firmware and should not be shared. Everything is unsupported by
  Line 6.
related: [line-6-hx-stomp, line-6-hx-stomp-xl, line-6-hx-one, line-6-helix]
