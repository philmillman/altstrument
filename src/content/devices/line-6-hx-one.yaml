name: HX One
manufacturer: Line 6
category: pedal
tagline: Single-effect Helix-family stompbox with USB-C and MIDI
description: >-
  The HX One is a compact single-effect pedal from Line 6 that holds a library of effect models from the HX range
  and runs one at a time. It has three knobs, a Flux controller that moves several parameters over a set time,
  adjustable input impedance, true or buffered DSP bypass and a jack for an expression pedal or two footswitches.
  MIDI connectors and a USB-C port are used for control, firmware updates and backups.
