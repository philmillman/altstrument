name: HX Stomp XL
manufacturer: Line 6
category: pedal
tagline: Larger HX Stomp with eight footswitches and up to eight processing blocks
description: >-
  The HX Stomp XL is a bigger version of the HX Stomp from Line 6, with eight capacitive-touch footswitches and a
  colour screen. It uses the same SHARC DSP family as the Helix range and runs up to eight amp, cab and effect
  blocks at once. It shares the HX models and the HX Edit editor with the smaller Stomp.
platform: Analog Devices SHARC DSP
links:
  manufacturer: https://line6.com/hx-stomp-xl/
  community:
    - label: r/Line6
      url: https://www.reddit.com/r/Line6/
notes: >-
  NAM A2 Lite has an XL build from the XL's own 3.80.0 file, but only an earlier one-block build has run on an XL,
  from RAM, and none has been installed on one. Everything is unsupported by Line 6.
related: [line-6-hx-stomp, line-6-hx-effects, line-6-hx-one, line-6-helix]
