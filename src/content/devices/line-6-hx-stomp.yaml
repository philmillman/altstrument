name: HX Stomp
manufacturer: Line 6
category: pedal
tagline: Compact Helix-family floor processor with three footswitches and a colour screen
description: >-
  The HX Stomp is a small floor amp and effects processor from Line 6, built on the same HX models as the Helix
  range. It has a 2.4-inch colour screen, three capacitive-touch footswitches and up to six amp, cab, effect and IR
  blocks running at once per preset. It also works as a USB audio and MIDI interface, and presets are edited with
  HX Edit on a computer. Audio runs on an Analog Devices SHARC DSP and an NXP LPC4350 handles control.
platform: Analog Devices SHARC DSP, NXP LPC4350 control MCU
stock_firmware: 3.80.0
links:
  manufacturer: https://line6.com/hx-stomp/
  community:
    - label: r/Line6
      url: https://www.reddit.com/r/Line6/
notes: >-
  Custom work targets stock 3.80.0 and comes in two forms. NAM A2 Lite and its CustomOS fork patch your own copy
  of the stock firmware file, and hx-stomp-nam replaces the software entirely but only runs from RAM. The firmware
  container uses checksums, with no encryption or signature. Holding Page Right at power on gives update mode, and
  the author of NAM A2 Lite has restored a hung unit that way. Built files contain Line 6's firmware and should
  not be shared. Everything is unsupported by Line 6.
related: [line-6-hx-stomp-xl, line-6-hx-effects, line-6-hx-one, line-6-helix]
