name: M5 / M9 / M13
manufacturer: Line 6
category: pedal
tagline: Line 6 stompbox modelers in three sizes
description: >-
  The M5, M9 and M13 are floor effects processors from Line 6 that model stompbox effects, in three sizes. They have
  a built-in looper and footswitches for switching models and operating the looper. Line 6 lists them among its
  legacy products.
