name: POD 1.0 / 2.0 / Pro / PocketPOD
manufacturer: Line 6
category: pedal
added: 2026-11-02
tagline: Original kidney-shaped Line 6 POD modelers and their rack and pocket versions
description: >-
  The first generation of POD amp modelers from Line 6, introduced in 1998 as a compact unit with amp models and
  effects for recording and practice. The line went on to the POD 2.0, the rackmount POD Pro and the small
  PocketPOD. They run Line 6's older modelling engine, before the PODxt and POD X3 families.
