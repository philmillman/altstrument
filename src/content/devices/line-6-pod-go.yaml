name: POD Go / POD Go Wireless
manufacturer: Line 6
category: pedal
tagline: Floor amp and effects processor with built-in expression pedal
description: >-
  The POD Go is a floor amp and effects processor from Line 6 with a colour screen, eight footswitches and a
  built-in expression pedal. It uses HX-family models in a semi-fixed signal path, has a stereo effects loop, works as a USB
  audio and MIDI interface, and is edited with POD Go Edit. The POD Go Wireless version adds a built-in receiver for Line 6 Relay wireless
  transmitters.
