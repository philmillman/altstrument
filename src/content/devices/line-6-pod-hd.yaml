name: POD HD series
manufacturer: Line 6
category: pedal
tagline: >-
  Line 6 HD-model amp and effects modelers: HD300, HD400, HD500, HD500X, Desktop and Pro
description: >-
  The POD HD series is a group of amp and effects modelers from Line 6 that use its HD amp, cab and effect models.
  The floor units are the HD300, HD400, HD500 and the later HD500X with an expression pedal and a small display.
  The range also has desktop and rackmount versions, the POD HD Desktop, HD Pro and HD Pro X. Line 6 lists them
  among its legacy products.
