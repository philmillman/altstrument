name: PODxt / POD X3 series
manufacturer: Line 6
category: pedal
added: 2026-11-02
tagline: Line 6 PODxt and POD X3 modelers in desktop, Live floor and Pro rack forms
description: >-
  The PODxt and POD X3 families are amp and effects modelers from Line 6, which followed its original POD. Each
  family has a tabletop unit, a Live floor version with footswitches and an expression pedal, and a Pro rackmount
  version, plus bass variants. Line 6 lists them among its legacy products.
