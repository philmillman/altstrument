name: Line 6 Spider Jam / JM4 Looper
manufacturer: Line 6
category: other
tagline: Spider Jam modelling amp with built-in looper, and the JM4 Looper pedal
description: >-
  The Spider Jam is a 75 watt 1x12 modelling combo amplifier from Line 6 with amp and effect models, jam tracks and a built-in
  looper. The JM4 Looper is a Line 6 floor pedal looper. Recordings from the Spider Jam are .JAM files that hold a small header followed
  by WAV audio, and the one tool for them says JM4 Looper files probably match but were not tested.
