name: Spider V / Spider V MkII
manufacturer: Line 6
category: other
tagline: Line 6 modelling guitar combo amps
description: >-
  The Spider V is a range of modelling guitar combo amplifiers from Line 6 in power ratings from 20 to 240 watts,
  with amp and effect models, a tuner and USB. The Spider V MkII is the current revision of the range. This entry
  covers both generations.
