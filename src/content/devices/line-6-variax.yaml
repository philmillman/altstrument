name: Variax / James Tyler Variax
manufacturer: Line 6
category: other
added: 2026-11-02
tagline: Line 6 modelling guitars that imitate other guitars
description: >-
  The Variax is a line of electric, acoustic and bass modelling guitars from Line 6. Pickups and electronics in the
  guitar are processed to imitate the sound of other instruments, so one body can switch between many guitar models.
  The range includes the Variax 300, 500, 600 and 700, the Variax Standard, acoustic and bass versions, and the
  James Tyler Variax JTV-59, JTV-69 and JTV-89 guitars. Line 6 lists them among its legacy products.
