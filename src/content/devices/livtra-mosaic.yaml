name: Mosaic
manufacturer: Livtra
category: pedal
added: 2026-11-03
tagline: Three-footswitch floor multi-effects unit from Livtra that shares the NanoCore's MIDI protocol
description: >-
  The Mosaic is a floor-standing multi-effects processor from Livtra with three footswitches labelled A, B and C, a small
  display, Master and Selector knobs and Bluetooth. Livtra lists it as a multi-effects product beside the NanoCore. A
  community editor reports that it accepts the same SysEx protocol as the NanoCore, checked against a capture from a real
  unit.
links:
  manufacturer: https://livtramusic.com/products/mosaic
  community:
  - label: Livtra downloads and manuals
    url: https://livtramusic.com/downloads
notes: >-
  No custom firmware is known. The community tools control the unit over MIDI and do not write firmware. The Preset on
  Press setting has no MIDI control, according to the NanoCore editor's notes.
related: [livtra-nanocore]
