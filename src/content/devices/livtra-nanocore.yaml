name: NanoCore
manufacturer: Livtra
category: pedal
tagline: Pocket multi-effects processor with amp and cab models, profiles and USB and Bluetooth MIDI
description: >-
  The NanoCore is a handheld multi-effects processor from Livtra with a colour screen and two knobs, Master and Selector.
  Its signal chain has eight blocks: two effect slots, an amp, a cabinet, delay, modulation, reverb and EQ, and it holds
  64 presets. It loads amp and effect profiles and cabinet impulse responses, and it takes MIDI over USB and Bluetooth.
  Livtra's ToneCommand editor edits it and its updater installs firmware.
links:
  manufacturer: https://livtramusic.com/products/nanocore
  community:
  - label: Livtra downloads and manuals
    url: https://livtramusic.com/downloads
notes: >-
  No custom firmware is known. The community tools control the pedal over MIDI and the SysEx commands that Livtra's app
  uses, and none of them writes firmware. According to the NanoCore editor's notes, amp and cab selection over the documented CC messages did not work
  until a September 2026 firmware update.
