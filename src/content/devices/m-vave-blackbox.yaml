name: Blackbox
manufacturer: M-VAVE
category: pedal
tagline: Pocket amp modeller and effects processor with 80 presets, 20 amp and 20 cab slots
description: >-
  The Blackbox is a compact two-footswitch guitar and bass processor from M-VAVE, marked ANNBLACK BOX on its front
  panel. It has 80 editable presets, 20 preamp models and 20 IR cabinet slots, an effects chain of noise gate,
  boost, compressor, EQ, modulation, delay and reverb, and a colour screen. It has a built-in rechargeable battery,
  Bluetooth audio and a USB audio interface. M-VAVE's M-EFCS app edits presets over Bluetooth or USB. It is a
  different product from the 1010music Blackbox sampler.
links:
  manufacturer: https://www.m-vave.com/product.html?id=annblack-box
  community:
  - label: M-VAVE software and firmware downloads
    url: https://www.m-vave.com/download
notes: >-
  No custom firmware is known. The community tools edit presets, amp models and IR slots through the
  pedal's own Bluetooth and USB protocols and do not replace its firmware. Writes to the pedal's flash can
  fail; the tools' authors keep backups and warn that use is at your own risk.
related: [m-vave-tank-g, m-vave-cube-baby]
