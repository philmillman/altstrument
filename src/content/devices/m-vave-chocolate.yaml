name: Chocolate / Chocolate Plus
manufacturer: M-VAVE
category: foot-controller
added: 2026-10-13
tagline: Bluetooth MIDI footswitch controller
description: >-
  The Chocolate and Chocolate Plus are compact MIDI footswitch controllers from M-VAVE, each with four
  programmable switches. They connect over Bluetooth MIDI, USB-C or a TRS MIDI output and run from a
  built-in rechargeable battery. Switch assignments are set with M-VAVE's CubeSuite app, which talks to
  the unit over a SysEx configuration protocol.
links:
  manufacturer: https://www.cuvave.com/product?id=chocolate-plus
  community:
  - label: OpenChocolate protocol spec
    url: https://github.com/majabojarska/OpenChocolate/blob/main/reverse-engineering/MIDI-protocol-spec.md
  - label: cbix/mvave-chocolate-sysex
    url: https://github.com/cbix/mvave-chocolate-sysex
notes: >-
  No custom firmware exists for these devices. Firmware updates are official only, from M-VAVE. The projects
  listed here are host-side configuration tools that speak the stock SysEx protocol over USB or Web MIDI
  to change switch assignments, or companion apps that remap its MIDI output on a computer. They do not
  replace the footswitch's firmware. Per cbix's notes, SysEx configuration over BLE MIDI did not work,
  and USB configuration only worked while the official app was running.
related: [m-vave-fm-1, m-vave-smk-37]
