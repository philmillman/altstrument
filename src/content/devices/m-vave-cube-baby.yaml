name: Cube Baby
manufacturer: M-VAVE
category: pedal
added: 2026-10-31
tagline: Compact battery-powered guitar multi-effects pedal with amp models and IR cabinets
description: >-
  The Cube Baby is a small guitar multi-effects pedal from M-VAVE, sold under the Cuvave name as well. It
  chains an amp module with modulation, delay, reverb and a cabinet section of nine IR slots, eight of them
  classic IRs. Ten knobs and three footswitches, A, B and C, run it in PRESET, LIVE and EDIT modes. It plays
  Bluetooth audio, records from a phone, and runs for about six hours from a built-in rechargeable battery
  charged over USB. CubeSuite, M-VAVE's app and desktop software, edits it and loads IRs.
links:
  manufacturer: https://www.cuvave.com/product?id=cube-baby
  community:
  - label: M-VAVE software and firmware downloads
    url: https://www.m-vave.com/download
notes: >-
  No custom firmware exists for this pedal. M-VAVE also makes Cube Baby AC and Cube Baby Bass variants,
  which this catalog does not list separately. The projects listed here are host-side tools that speak the
  pedal's USB-MIDI protocol, and none of them replaces its firmware.
related: [m-vave-ir-box]
