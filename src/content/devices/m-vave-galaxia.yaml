name: Galaxia
manufacturer: M-VAVE
category: pedal
added: 2026-11-05
tagline: Stereo reverb pedal with nine reverb modes and a freeze footswitch
description: >-
  The Galaxia is a stereo reverb pedal from M-VAVE. A central knob selects one of nine reverbs: room, hall, plate,
  spring, shimmer, cloud, bloom, swell and lo-fi. Six knobs set decay, mode, mix, tone, lend and mod, and a second
  footswitch holds the current reverb tail. It has two 6.35 mm inputs and two outputs for mono-in stereo-out or
  stereo-in stereo-out use, and runs from a 9 V DC supply or USB-C. M-VAVE lists firmware upgrades through a computer.
platform: JieLi WL82 / AC791N family
links:
  manufacturer: https://www.m-vave.com/product.html?id=galaxia
  community:
  - label: M-VAVE software and firmware downloads
    url: https://www.m-vave.com/download
notes: >-
  Custom firmware can be written with felucca-bsp's Galaxia board code or the Galaxia SDK, which install over USB and
  keep a backup of the pedal's own firmware. Flashing is at your own risk and may void the warranty.
related: [m-vave-fm-1, m-vave-pocket-amp]
