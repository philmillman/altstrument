name: MK-300
manufacturer: M-VAVE
category: pedal
added: 2026-11-05
tagline: Guitar multi-effects and amp modeller with expression pedal and looper
description: >-
  The MK-300 is a floor multi-effects processor from M-VAVE with a colour display, four footswitches, a built-in
  expression pedal and a looper. It holds several hundred amp, cabinet and effect models in a signal chain of
  eleven blocks, with user presets and third-party IR loading, and works as a USB audio interface. M-VAVE's
  M-EFCS editor reads and writes its presets over USB.
stock_firmware: V73
links:
  manufacturer: https://www.m-vave.com/product.html?id=mk-300
notes: >-
  No custom firmware exists for this pedal. The only entry is a host-side library and command-line tool that
  speak the stock editor's SysEx protocol. Firmware updates are official only, from M-VAVE.
related: [m-vave-tank-g, m-vave-tank-b, m-vave-pocket-amp]
