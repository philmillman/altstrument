name: Pocket AMP
manufacturer: M-VAVE
category: pedal
added: 2026-11-05
tagline: Pocket-sized amp simulator with a colour screen and a headphone output
description: >-
  The Pocket AMP is a small amp simulator and effects processor from M-VAVE that clips onto a guitar. M-VAVE lists
  20 amp modules, chorus, delay and reverb effects, a 6.35 mm input, a 3.5 mm headphone output, a 3.5 mm aux input for
  playing along and a rechargeable battery charged over USB-C. The front has a 240 by 240 pixel screen, a Master knob
  and a Para knob, and buttons labelled HOME, VOL-, VOL+ and two arrows. M-VAVE's M-EFCS app edits presets and
  M-UPGRADE installs firmware updates.
platform: JieLi AC791N (two cores)
stock_firmware: V105
links:
  manufacturer: https://www.m-vave.com/product.html?id=pocket-amp
  community:
  - label: M-VAVE software and firmware downloads
    url: https://www.m-vave.com/download
notes: >-
  The Pocket AMP runs the same JieLi update system as the FM-1. The custom firmwares listed here install over USB
  and keep a way back to the official file, which M-VAVE lists as V105 dated 2026-10-13. Flashing is at your own
  risk. Onyx's README says the unit is sold as a Donner product too; M-VAVE's page does not mention that.
related: [m-vave-fm-1, m-vave-blackbox]
