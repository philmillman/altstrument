name: SMC-Mixer
manufacturer: M-VAVE
category: controller
added: 2026-11-05
tagline: 8-fader wireless DAW control surface with 8 encoders and 43 buttons
description: >-
  The SMC-Mixer is a control surface from M-VAVE with eight touch-sensitive faders, eight encoders and 43
  backlit buttons, including a row of transport keys. It connects over USB-C or Bluetooth MIDI and can run
  from a built-in battery. It stores two presets of control assignments, the first of them a factory DAW preset.
  The same hardware is also sold under the SINCO name.
links:
  manufacturer: https://www.m-vave.com/product.html?id=smc-mixer
  community:
  - label: Davilka/midisuite-linux
    url: https://github.com/Davilka/midisuite-linux
notes: >-
  No custom firmware exists for this device. The only entry is a host-side editor that reads and writes the
  stock configuration over USB or Bluetooth LE. Firmware updates come from M-VAVE.
related: [m-vave-smc-pad, m-vave-smk-37, m-vave-chocolate]
