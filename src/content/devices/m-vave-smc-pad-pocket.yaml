name: SMC-PAD Pocket
manufacturer: M-VAVE
category: controller
added: 2026-11-13
tagline: Pocket-sized 16-pad Bluetooth and USB MIDI pad controller
description: >-
  The SMC-PAD Pocket is a small MIDI pad controller from M-VAVE with sixteen velocity-sensitive RGB pads in a pocket-sized
  square body and a built-in rechargeable battery. It connects over USB-C or Bluetooth MIDI. The pad colors and layout are stored in a settings
  memory that M-VAVE's editor changes over SysEx, using the same protocol as the larger SMC-PAD, which has eight encoders and
  more buttons.
links:
  manufacturer: https://www.m-vave.com/product?id=smc-pad-pocket
notes: >-
  No replacement firmware is known. The one entry here is a browser drum machine that uses the pad as its controller and
  sets the pad's colors over USB or Bluetooth without saving them to the pad.
