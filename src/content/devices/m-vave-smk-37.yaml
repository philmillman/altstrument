notes: >-
  Shares the JieLi AC791N (WL82) chip, second-stage bootloader, update loader and chip key with the FM-1;
  only the panel wiring and flash map differ, so Felucca-family FM-1 firmware can be ported by replacing
  the board layer. Ports and mods are unofficial and install at your own risk. The fm1-to-smk37 flash-safety
  guide warns that the unit holds per-device data in SPI flash (factory key and pad calibration at 0xC1000,
  Bluetooth pairing data at 0xC0000, chip key and MAC at 0xFF000) that must never be overwritten. Baud
  Girl's SMK-37+VA also lists the Donner Starrykey-37 Play and EROK MKE-P37 as supported. The FM-1 recovery
  caveats (single-bank flash, no established recovery path per AL-255/FM-1-RE) should be assumed to apply
  here too.
related: [m-vave-fm-1, m-vave-chocolate]
