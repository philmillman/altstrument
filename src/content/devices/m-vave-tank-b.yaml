name: Tank-B
manufacturer: M-VAVE
category: pedal
tagline: Multi-effects pedal for bass with amp modeling and app control
description: >-
  The Tank-B is a long, flat bass multi-effects pedal from M-VAVE, built in the same format as the Tank-G. It has four
  footswitches, a row of fifteen knobs, a one-digit preset display and an XLR output, and it is edited from a phone app.
stock_firmware: "100"
links:
  manufacturer: https://www.m-vave.com/product.html?id=tank-b
notes: >-
  The factory firmware number and the v1 and v2 hardware revisions are as named by UltraRig, the one custom firmware
  catalogued here, which ships for this pedal and the Tank-G from the same releases.
related: [m-vave-tank-g]
