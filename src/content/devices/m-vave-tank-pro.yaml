name: Tank-PRO
manufacturer: M-VAVE
category: pedal
added: 2026-11-23
tagline: Battery-powered guitar and bass multi-effects pedal with a colour screen, drum machine and looper
description: >-
  The Tank-PRO is a flat guitar and bass multi-effects pedal from M-VAVE with four footswitches, a 2.4-inch
  colour screen, a PARA encoder, three knobs and a master knob, and ten module buttons. M-VAVE lists 90 amp
  models, 90 cabinet simulations, 30 distortion and overdrive types and more than 300 effects in all, with
  up to ten modules in a chain. It stores 120 presets, has a looper of up to 150.8 seconds, a drum machine
  with 100 rhythm patterns, stereo TS and XLR outputs, USB audio and MIDI over USB-C, a 3.5 mm MIDI input
  and a built-in 3000 mAh battery. M-VAVE's M-EFCS app edits presets and imports amp and cabinet files, and
  M-UPGRADE installs firmware updates.
platform: JieLi AC792N, 8 MB SDRAM, uC/OS-II
stock_firmware: V40
links:
  manufacturer: https://www.cuvave.com/product?id=tank-pro
  community:
  - label: M-VAVE software and firmware downloads
    url: https://www.m-vave.com/download
  - label: Tank-PRO reverse engineering guide (unlikelytheorist)
    url: https://github.com/unlikelytheorist/mvave-re/blob/main/tank-pro/README.md
notes: >-
  M-VAVE's download page lists firmware V40 dated 2026-11-09. The platform and firmware details come from
  the mvave-re reverse engineering guide: the update files are the same JieLi container that the Tank-G
  uses, and the guide reads the application as running M-VAVE's own models and Neural Amp Modeler A2-Lite
  captures. Preset and user data are not part of the update image.
