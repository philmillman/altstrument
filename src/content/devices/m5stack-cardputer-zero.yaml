name: M5Stack Cardputer Zero
manufacturer: M5Stack
category: handheld
added: 2026-11-26
tagline: Pocket Linux computer on a Raspberry Pi CM0 with a 46-key keyboard, 320 by 170 screen and built-in speaker
description: >-
  The Cardputer Zero (CardputerZero) is an M5Stack pocket computer built on the Raspberry Pi Compute Module Zero,
  a quad-core Cortex-A53 at 1 GHz with 512 MB of RAM, running Linux from a microSD card. It has a 1.9 inch 320 by 170
  screen, a 46-key keyboard, a microphone, a 1 W speaker, a 3.5 mm audio jack, Wi-Fi, Ethernet, USB-A and two USB-C ports,
  and an IMX219 camera on the standard version. It was funded on Kickstarter in 2026, and M5Stack's documentation lists
  a standard version and a Lite version without a microSD card.
platform: Raspberry Pi CM0 (RP3A0, quad-core Cortex-A53, aarch64)
links:
  manufacturer: https://docs.m5stack.com/en/CardputerZero
  community:
    - label: CardputerZero AppBuilder (packaging tool for the launcher and store)
      url: https://github.com/CardputerZero/AppBuilder
    - label: M5 Imager releases (writes the system image to the microSD card)
      url: https://github.com/CardputerZero/m5stack-imager/releases
notes: >-
  Unlike the ESP32-based Cardputer, the Zero runs a full Linux system, so music software for it is installed as a
  Debian package or built on the device, and nothing replaces the device's firmware; the system image on the microSD
  card can be rewritten with M5 Imager. It shares neither firmware nor hardware with the ESP32 Cardputer, so the two are
  not linked as related devices. The photo is M5Stack's own product image from its documentation page.
