name: M5Stack StickS3
manufacturer: M5Stack
category: handheld
added: 2026-11-16
tagline: Pocket ESP32-S3 controller with a small colour screen, speaker and microphone, used as a firmware switcher for the FM-1
description: >-
  The StickS3 is a small M5Stack controller built on the ESP32-S3-PICO-1-N8R8 module with 8 MB of flash and 8 MB of
  PSRAM. It has a 1.14 inch colour screen, a 6-axis IMU, programmable buttons, an ES8311 mono audio codec with a MEMS
  microphone and a speaker amplifier, an IR transmitter and receiver and a 250 mAh battery, plus a Hat2 header and a
  Grove port for expansion. M5Stack's shop has listed it since January 2026.
platform: ESP32-S3 (ESP32-S3-PICO-1-N8R8)
links:
  manufacturer: https://docs.m5stack.com/en/core/StickS3
  community:
    - label: M5Stack shop page
      url: https://shop.m5stack.com/products/m5sticks3-esp32s3-mini-iot-dev-kit
notes: >-
  Firmware is a flash image loaded with M5Burner, esptool or the Arduino and ESP-IDF toolchains; the application
  replaces M5Stack's demo firmware. The StickS3 has no keyboard or SD slot, so music projects for it use its buttons,
  IMU and USB. M5Stack advises keeping the speaker below 75% volume on battery to avoid resets. Its catalog entries
  so far are host-side helpers for the M-VAVE FM-1 rather than instruments.
