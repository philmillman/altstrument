name: 0-Coast
manufacturer: Make Noise
category: synth
tagline: Semi-modular monosynth with MIDI and 3.5 mm patch points
description: >-
  The 0-Coast is a semi-modular analog monosynth from Make Noise. It combines a
  triangle-core oscillator, overtone and multiply wave shaping, slope and contour
  envelopes, a dynamics stage and patch points that accept Eurorack-level signals. It
  has a MIDI input that converts to two channels of CV and gate and an arpeggiator, and its MIDI
  behaviour is changed through program pages on the panel or from a computer.
links:
  manufacturer: https://www.makenoisemusic.com/synthesizers-and-controllers/0-coast/
notes: >-
  Make Noise publishes its own firmware updates for the 0-Coast, which are not listed
  here. The entry is a settings manager for the MIDI configuration.
