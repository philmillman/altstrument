name: Morphagene
manufacturer: Make Noise
category: eurorack
tagline: Eurorack sampler that cuts reels into splices and genes
description: >-
  The Morphagene is a Eurorack module from Make Noise, designed with Soundhack, that
  records and plays back audio as reels, which are divided into splices and can be played as
  small slices called genes. A reel can run up to 2 minutes 54 seconds, and reels are stored on an SD card. Audio for it is
  prepared on a computer as 48 kHz WAV files with cue points marking the splices.
links:
  manufacturer: https://www.makenoisemusic.com/modules/morphagene/
notes: >-
  No custom firmware is known; the entry here is a browser audio editor that prepares reels.
