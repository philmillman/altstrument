name: René 2
manufacturer: Make Noise
category: eurorack
added: 2026-11-03
tagline: Three-channel Cartesian sequencer with 64 stored states
description: >-
  René 2 is a Eurorack Cartesian sequencer from Make Noise. It has a grid of sixteen
  knobs and sixteen touch plates, separate X and Y clock inputs, three CV and gate output
  pairs and a Z axis for moving between stored states, of which it holds 64. It
  talks to Make Noise's Tempi over a Select Bus on the power header, and that bus can also be driven
  by an Expert Sleepers FH-2 for preset recall.
links:
  manufacturer: https://www.makenoisemusic.com/modules/rene/
notes: >-
  No custom firmware is known; the entry here is a browser controller that recalls its
  stored states.
