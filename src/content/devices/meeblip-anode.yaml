name: MeeBlip anode
manufacturer: MeeBlip
category: synth
tagline: Open-source hybrid monosynth with MIDI
description: >-
  The anode is a small monophonic synthesizer from MeeBlip. It has a digital
  oscillator section with wavetables and an analog filter, built around an ATmega32
  microcontroller, with knobs for wave, detune, envelopes, filter and LFO and MIDI
  input. The firmware is assembly source with a prebuilt hex file, the schematics and board files are
  published, and a Limited Edition build adds a second filter envelope.
platform: ATmega32
links:
  manufacturer: https://meeblip.com/collections/all/products/meeblip-anode-synth
  community:
    - label: MeeBlip on GitHub
      url: https://github.com/MeeBlip
notes: >-
  Flashing needs an AVR ISP programmer; the project's make file uses avrdude with a USBtiny
  programmer. The MeeBlip hardware designs are CC BY-SA 4.0 and the name is reserved by
  the makers.
related: [meeblip-triode, meeblip-se]
