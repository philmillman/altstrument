name: MeeBlip triode
manufacturer: MeeBlip
category: synth
added: 2026-11-04
tagline: Open-source monosynth with digital oscillators and an analog filter
description: >-
  The triode is a small monophonic synthesizer from MeeBlip, sold in a limited run as a fully assembled unit in a red case. It
  has two digital oscillators and a square-wave sub-oscillator, a twin-T analog low-pass filter, an LFO, two envelopes and a
  set of wavetables that can be selected from the panel. It is built around an ATmega32A microcontroller and takes MIDI
  input. The firmware source, schematics and board files are published.
platform: ATmega32A
links:
  manufacturer: https://meeblip.com/
  community:
    - label: MeeBlip on GitHub
      url: https://github.com/MeeBlip
notes: >-
  The product page is no longer on meeblip.com; the image comes from its archived copy. Flashing needs an AVR ISP
  programmer; the repository's make file uses avrdude with a USBtiny programmer. The MeeBlip hardware designs are CC BY-SA 4.0
  and the name is reserved by the makers. MeeBlip's later geode synth carries the same filter design with USB MIDI.
related: [meeblip-anode, meeblip-se]
pinned: [triode-firmware]
