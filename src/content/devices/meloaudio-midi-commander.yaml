name: MIDI Commander
manufacturer: MeloAudio
category: foot-controller
added: 2026-10-13
tagline: Eight-button MIDI foot controller with a small display
description: >-
  The MIDI Commander is a USB MIDI foot controller from MeloAudio, built
  around an STM32F103 microcontroller. It has a row of footswitches, a small
  OLED display, a USB port and MIDI connectors, and is used to send program
  changes and controller messages to amps, effects processors and software.
platform: STM32F103
links:
  community:
    - label: midi-commander-custom
      url: https://github.com/harvie256/midi-commander-custom
notes: >-
  Firmware is loaded with the same DFU update process as the official firmware,
  using the update tools from MeloAudio or ST (STSW-STM32080). The custom build
  keeps its configuration in flash, separate from the stock configuration in the
  external EEPROM, and the custom build's author expects you can go back to
  the MeloAudio build. The custom build's author reported trouble with
  DFU on Windows 10 and tested on a Windows 7 VM.
