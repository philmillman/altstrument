name: Wingie2
manufacturer: Meng Qi
category: synth
added: 2026-11-25
tagline: Handheld stereo resonator with two keyboards and microphone inputs, on an ESP32
description: >-
  The Wingie2 is a handheld stereo resonator from Meng Qi. Sound from its two
  built-in microphones or a line input is fed through resonators that are tuned
  from two rows of keys, and the panel has three knobs, Mode buttons and octave
  switches. It is built on an ESP32, the firmware is written with Faust and
  Arduino and published under GPLv3, and the repository describes it as a
  development platform. Meng Qi's web flasher installs the stock firmware, and
  third-party firmware such as Sleepcousonique can be flashed with esptool.
platform: ESP32
stock_firmware: v4.30
