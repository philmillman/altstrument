name: Enzo
manufacturer: Meris
category: pedal
added: 2026-11-03
tagline: Multi-voice instrument synthesizer pedal with mono, poly and arpeggiator voices
description: >-
  The Enzo is a pedal from Meris that turns a guitar or other instrument signal into synthesizer voices. It has dry, arpeggiator, mono and poly modes, saw and square oscillators, a filter with envelope control, ring modulation and a delay with tap tempo. Its front panel has knobs for pitch, filter, mix, sustain, filter envelope and modulation, and an EXP/MIDI jack takes an expression pedal or MIDI over a TRS cable.
links:
  manufacturer: https://meris.us/product/enzo/
notes: >-
  No custom firmware is known. The community editors send MIDI to the pedal's EXP/MIDI jack from a computer and do not replace its firmware.
related: [meris-mercury7, meris-hedra, meris-ottobit-jr, meris-polymoon]
