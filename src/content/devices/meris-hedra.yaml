name: Hedra
manufacturer: Meris
category: pedal
tagline: Three-voice rhythmic pitch shifter pedal
description: >-
  The Hedra is a pitch shifter from Meris that makes three pitched voices from the input. Knobs set a key, a micro tune amount, the mix and a pitch for each voice, and a switch chooses between running the voices in parallel or in series. A tap footswitch and an alt function hold give access to more controls, and an EXP/MIDI jack takes an expression pedal or MIDI over a TRS cable. The Hedra also exists as a 500-series module.
links:
  manufacturer: https://meris.us/product/hedra-pedal/
notes: >-
  No custom firmware is known. The community editors send MIDI to the pedal's EXP/MIDI jack from a computer and do not replace its firmware.
related: [meris-mercury7, meris-enzo, meris-ottobit-jr, meris-polymoon]
