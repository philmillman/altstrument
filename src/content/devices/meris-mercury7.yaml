name: Mercury7
manufacturer: Meris
category: pedal
tagline: Reverb pedal with Ultraplate and Cathedra algorithms and a pitch vector control
description: >-
  The Mercury7 is a stereo reverb pedal from Meris with two algorithms, Ultraplate and Cathedra. Its knobs set space decay, modulation, mix and lo and hi frequency, and a Pitch Vector control adds shifted voices to the tail. A Swell footswitch and an alt function hold give access to further controls, and an EXP/MIDI jack takes an expression pedal or MIDI over a TRS cable. 
links:
  manufacturer: https://meris.us/product/mercury7-reverb-2/
notes: >-
  No custom firmware is known. The community editors send MIDI to the pedal's EXP/MIDI jack from a computer and do not replace its firmware.
related: [meris-enzo, meris-hedra, meris-ottobit-jr, meris-polymoon]
