name: Ottobit Jr.
manufacturer: Meris
category: pedal
added: 2026-11-03
tagline: Bit-crushing pedal with a stutter and two step sequencers, styled after game consoles
description: >-
  The Ottobit Jr. is a bit-crusher pedal from Meris. Its controls set sample rate, filter, bit depth, stutter and a sequencer with its own multiplier, and the sequencer can follow pitch or filter. A tap footswitch and an alt function hold give access to more controls, and an EXP/MIDI jack takes an expression pedal or MIDI over a TRS cable. It is a smaller version of the Ottobit.
links:
  manufacturer: https://meris.us/product/ottobit-jr/
notes: >-
  No custom firmware is known. The community editors send MIDI to the pedal's EXP/MIDI jack from a computer and do not replace its firmware.
related: [meris-mercury7, meris-enzo, meris-hedra, meris-polymoon]
