name: Polymoon
manufacturer: Meris
category: pedal
added: 2026-11-03
tagline: Delay pedal with multiplied taps, dimension and dynamics controls
description: >-
  The Polymoon is a delay pedal from Meris. Its knobs set time, feedback, mix, a multiply value from 1 to 6, dimension and dynamics, and a sync phase and slow option sit under the footswitch lights. A tap footswitch and an alt function hold give access to more controls, and an EXP/MIDI jack takes an expression pedal or MIDI over a TRS cable.
links:
  manufacturer: https://meris.us/product/polymoon-pedal/
notes: >-
  No custom firmware is known. The community editors send MIDI to the pedal's EXP/MIDI jack from a computer and do not replace its firmware.
related: [meris-mercury7, meris-enzo, meris-hedra, meris-ottobit-jr]
