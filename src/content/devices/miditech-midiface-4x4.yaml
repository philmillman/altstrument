name: Midiface 4x4
manufacturer: Miditech
category: other
added: 2026-11-03
tagline: Four-in, four-out USB MIDI interface with an STM32F103 inside
description: >-
  The Midiface 4x4 is a class-compliant USB MIDI interface from Miditech with four MIDI inputs and four outputs, powered over
  USB. The project that hacks it names the interface as the Miditech or Midiplus 4x4, and its board is marked MIDI 4X4 V0.02 with a
  2010 date and carries an STM32F103RC microcontroller. Miditech sells a related Thru/Merge version with standalone
  thru and merge functions.
platform: STM32F103RC (Arm Cortex-M3)
links:
  manufacturer: https://miditech.de/portfolio/midiface-4x4/
  community:
    - label: The Miditech/Midiplus 4x4 hack story (USBMidiKliK4x4 wiki)
      url: https://github.com/TheKikGen/USBMidiKliK4x4/wiki/The-Miditech-Midiplus-4x4-hack-and-STM32Duino
notes: >-
  The stock firmware cannot be updated. The USBMidiKliK4x4 project says the stock program is read-protected, so installing its
  firmware means opening the case, removing a resistor, wiring a serial adapter and removing the read protection, which erases
  the original firmware for good. The project does not say which exact Miditech or Midiplus model its board photos show, so the
  match to this product page rests on the 4x4 name. The picture is Miditech's own product photo, not a photo from that project.
