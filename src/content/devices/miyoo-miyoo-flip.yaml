name: Miyoo Flip
manufacturer: Miyoo
category: handheld
tagline: Clamshell Linux handheld with a 640 by 480 screen and a spruceOS community firmware
description: >-
  The Miyoo Flip is a clamshell handheld sold for emulation. It has a 640 by 480 screen, a Rockchip RK3566 with four
  Cortex-A55 cores, Wi-Fi and two USB-C ports, and it boots from the SD card. The community firmware spruceOS gives it an
  app menu, and music software runs there as native Linux programs.
platform: Rockchip RK3566
links:
  community:
    - label: spruceOS
      url: https://spruceui.github.io/
notes: >-
  Apps are copied to the SD card and started from spruceOS or a fork of it; nothing here flashes the console itself.
  The RK3566 and the two USB-C ports, of which the top one can act as a USB host, are as documented in Stame's platform
  notes. A USB class-compliant MIDI controller plugged into the host port is the way to play it. No free photo of the
  device was found, so there is no image.
related: [miyoo-miyoo-mini, portmaster-compatible-handhelds]
