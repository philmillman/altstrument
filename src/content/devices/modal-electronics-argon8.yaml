name: Argon8
manufacturer: Modal Electronics
category: synth
added: 2026-11-17
tagline: 8-voice wavetable synthesiser with a 37-key keyboard
description: >-
  Argon8 is an eight-voice wavetable synthesiser from Modal Electronics. It has a
  37-note Fatar keyboard with aftertouch, two oscillators with wavetable
  morphing, morphable filters, a 12-slot modulation matrix, a 512-note
  sequencer and an arpeggiator. It is edited with the MODALapp editor, and
  there are also M and X variants of the series.
platform: ARM (panel, master and slave firmware components)
stock_firmware: "3.2"
links:
  manufacturer: https://modalelectronics.com/argon8/
notes: >-
  The 8-series firmware is installed as three SysEx files (panel, master and
  slave) through MODALapp or a compatible flasher. The bootloader is not part
  of the update, and update mode (power on while holding Shift/Init) stays
  available to reinstall the official files.
related: [modal-electronics-cobalt8, modal-electronics-carbon8]
