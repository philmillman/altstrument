name: Carbon8
manufacturer: Modal Electronics
category: synth
added: 2026-11-17
tagline: 8-voice experimental synthesiser
description: >-
  Carbon8 is an eight-voice digital synthesiser from Modal Electronics with two
  oscillators of 56 cores each, built from 18 algorithms and 38 wavetables. The
  XCore oscillator modifiers add phase distortion and wave shaping. It shares
  the 37-note keyboard, modulation matrix, 512-note sequencer and arpeggiator of
  the other 8-series models.
platform: ARM (panel, master and slave firmware components)
stock_firmware: "1.1"
links:
  manufacturer: https://modalelectronics.com/carbon8/
notes: >-
  The 8-series firmware is installed as three SysEx files (panel, master and
  slave) through MODALapp or a compatible flasher. The bootloader is not part
  of the update, and update mode (power on while holding Shift/Init) stays
  available to reinstall the official files.
related: [modal-electronics-argon8, modal-electronics-cobalt8]
