name: Cobalt8
manufacturer: Modal Electronics
category: synth
added: 2026-11-17
tagline: 8-voice extended virtual-analogue synthesiser
description: >-
  Cobalt8 is an eight-voice virtual-analogue synthesiser from Modal
  Electronics. Each of its two oscillator groups offers 40 algorithms such as
  sync, ring modulation and waveform morphing, followed by morphable and static
  filters. It has the same 37-note keyboard, 12-slot modulation matrix,
  sequencer and arpeggiator as the other 8-series models.
platform: ARM (panel, master and slave firmware components)
stock_firmware: "2.1"
links:
  manufacturer: https://modalelectronics.com/cobalt8/
notes: >-
  The 8-series firmware is installed as three SysEx files (panel, master and
  slave) through MODALapp or a compatible flasher. The bootloader is not part
  of the update, and update mode (power on while holding Shift/Init) stays
  available to reinstall the official files.
related: [modal-electronics-argon8, modal-electronics-carbon8]
