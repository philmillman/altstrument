name: ansible
manufacturer: monome
category: eurorack
added: 2026-10-13
tagline: Grid / arc / Teletype / MIDI companion module (discontinued)
description: >-
  Ansible is a 6HP Eurorack module from monome, announced in 2016, that connects
  to a grid, an arc or a USB MIDI device and makes it the module's interface.
  Its modes include the Kria and Meadowphysics sequencers, Earthsea, the arc-
  based Levels and Cycles, and MIDI voice allocation with arpeggiation. It can
  also be wired to a Teletype over the ii bus for extra inputs and outputs and
  remote control.
platform: AVR32 (AT32UC3B)
stock_firmware: "3.2.0"
links:
  manufacturer: https://monome.org/docs/ansible/
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
    - label: monome modular firmware update guide
      url: https://monome.org/docs/modular/update/
notes: >-
  monome's docs list ansible as discontinued along with its other sunset Eurorack
  modules. The firmware is open (apps include Kria, Meadowphysics and Earthsea)
  and monome's docs point to scanner_darkly's multipass framework for writing
  your own firmware. A flash replaces the whole image including presets, so
  back up first.
related: [monome-teletype, monome-white-whale, monome-meadowphysics, monome-earthsea, monome-grid, monome-arc, monome-tools]
