name: arc
manufacturer: monome
category: controller
added: 2026-10-13
tagline: Four-encoder knob controller with LED rings
description: >-
  The arc is a USB controller from monome, first released in 2011, made of high-
  resolution rotary encoders each surrounded by a ring of 64 LEDs. Current
  models have 1024 ticks per revolution and 16-step LED brightness, and earlier
  editions came in two-knob and four-knob sizes. It does nothing on its own: the
  application it is connected to, such as one running on a computer, norns,
  ansible or crow, defines how movement maps to sound and light.
links:
  manufacturer: https://monome.org/docs/arc/
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
    - label: monome on GitHub
      url: https://github.com/monome
notes: >-
  Only the 2025 arc with a pushbutton supports monome's iii scripting
  firmware, and it ships with it, so no separate install is needed; older arcs
  keep their stock firmware and can use the viii browser emulator for iii
  scripts. Arc is also used with norns, ansible and crow, and a protocol-compatible
  DIY clone has its own open firmware.
related: [monome-grid, monome-norns, monome-ansible, monome-tools]
