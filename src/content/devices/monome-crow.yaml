name: crow
manufacturer: monome / Whimsical Raps
category: eurorack
added: 2026-10-13
tagline: Scriptable USB-to-CV Lua module (discontinued)
description: >-
  crow is a 2HP Eurorack module from monome and Whimsical Raps with two CV
  inputs, four 16-bit CV outputs, a USB port and an ii/i2c connection on the
  rear. It runs a Lua scripting environment on an STM32F722 microcontroller and
  stores a complete script, so it keeps responding to CV and ii messages with no
  computer attached. Scripts are loaded from norns, from a computer through the
  druid terminal tool, or from Max and Max for Live.
platform: STM32F722
stock_firmware: "4.0.5"
links:
  manufacturer: https://monome.org/docs/crow/
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
    - label: crow update guide
      url: https://monome.org/docs/crow/update/
    - label: monome on GitHub
      url: https://github.com/monome
notes: >-
  monome's site lists crow as discontinued as of October 2025; the firmware
  repository still receives commits. Firmware is open (GPL-3.0) and community
  forks add features, so read each fork's own docs before swapping builds. Update
  with druid (`druid firmware`), the fledge script on norns, or a manual DFU
  flash. Lua scripts run on stock firmware and are not catalogued.
related: [monome-teletype, monome-norns, monome-tools]
