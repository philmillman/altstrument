name: earthsea
manufacturer: monome
category: eurorack
added: 2026-10-13
tagline: Pattern-recording grid keyboard and shape-memory CV (discontinued)
description: >-
  Earthsea is a Eurorack module from monome that uses a connected grid as its
  playing surface, mapping the grid to a map of tones for melodies and recording
  performances as patterns. It has three shape CV outputs set by panel knobs,
  plus separate position and edge outputs, and keeps sixteen pattern slots per
  preset. Looped patterns continue to play when the grid is disconnected.
platform: AVR32 (AT32UC3B)
stock_firmware: "1.9.5"
links:
  manufacturer: https://monome.org/docs/earthsea/
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
    - label: monome modular firmware update guide
      url: https://monome.org/docs/modular/update/
notes: >-
  Legacy monome module with open firmware; an earthsea app also runs on ansible.
  Community work such as polyearthsea is built on the multipass framework
  and targets several modules. Back up before flashing.
related: [monome-white-whale, monome-meadowphysics, monome-ansible, monome-tools]
