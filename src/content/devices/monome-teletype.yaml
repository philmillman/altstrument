name: teletype
manufacturer: monome
category: eurorack
added: 2026-10-13
tagline: Scriptable Eurorack event trigger and CV scripting module
description: >-
  Teletype is an 18HP Eurorack module from monome, released in 2015, in which
  short text scripts are assigned to eight trigger inputs and set four CV
  outputs and four trigger outputs. Scripts, patterns and scenes are edited with
  a USB keyboard plugged into the front panel, and the module runs without the
  keyboard attached. It can also talk to other modules over the ii bus.
platform: AVR32 (AT32UC3B)
stock_firmware: "5.0.0"
links:
  manufacturer: https://monome.org/docs/teletype/
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
    - label: monome modular firmware update guide
      url: https://monome.org/docs/modular/update/
    - label: monome on GitHub
      url: https://github.com/monome
notes: >-
  Teletype firmware is open and the community routinely adds ops through pull
  requests to monome/teletype rather than shipping long-lived forks. Flashing
  replaces the whole image, so back up scenes first and ignore the scene-overwrite
  prompt unless you mean to erase them. The repository also includes a small
  command parser and simulator in its simulator directory.
related: [monome-ansible, monome-white-whale, monome-crow, bpcmusic-telex, attowatt-i2c2midi, monome-tools]
