name: walk
manufacturer: monome
category: eurorack
added: 2026-10-13
tagline: Two-footswitch gate and logic module (legacy)
description: >-
  Walk is a Eurorack module from monome that turns two footswitches into gate
  signals. Each footswitch has momentary and toggle outputs, and a central
  section adds logic functions of the two switch states, so six outputs are
  available at once. It is built around an ATtiny24 microcontroller and draws 12
  mA from the +12V rail, and its outputs can clock or trigger other modules such
  as Teletype.
platform: ATtiny24
links:
  manufacturer: https://monome.org/docs/walk/
  community:
    - label: llllllll.co (lines forum)
      url: https://llllllll.co/
notes: >-
  Walk is in monome's legacy docs section, built for use with Teletype and
  White Whale. Its source in monome/walk has no tagged releases and has not
  changed since 2016, so there is no prebuilt download there.
related: [monome-white-whale, monome-teletype]
pinned: [walk]
