name: Matriarch
manufacturer: Moog Music
category: synth
added: 2026-10-18
tagline: Semi-modular paraphonic analog synth with four oscillators and a 49-key keyboard
description: >-
  The Matriarch is a semi-modular analog synthesizer from Moog Music with four oscillators that can be played
  paraphonically, stereo ladder filters, a stereo analog delay, a 256-step sequencer and arpeggiator, and a 49-key
  velocity-sensitive keyboard. Its front and rear panels carry around 90 patch points. It is no longer in
  production, and v1.3.0 was its last firmware release.
platform: TI TMS320F2837x
stock_firmware: 1.3.0
links:
  manufacturer: https://www.moogmusic.com/downloads/?product=Matriarch&type=Firmware+Update
  community:
    - label: Moog forum, Matriarch
      url: https://forum.moogmusic.com/viewforum.php?f=19
notes: >-
  Firmware updates are sent to the synth as SysEx files with a procedure of invalidate, erase and write. The
  patcher listed here changes a copy of Moog's v1.3.0 file that the user supplies, and Moog's original file can be
  sent again to go back to stock. The microcontroller model is taken from the patcher project's own analysis of
  the firmware.
