name: Memorymoog
manufacturer: Moog Music
category: synth
added: 2026-11-21
tagline: Six-voice analog polysynth with 18 oscillators and patch memory, made from 1982 to 1985
description: >-
  The Memorymoog is a six-voice analog polyphonic synthesizer made by Moog Music from 1982 to 1985. Each voice has three
  oscillators and a 24 dB per octave low-pass filter, and the instrument stores patches in memory. It is controlled by a Z80
  microprocessor. The Memorymoog Plus was the version with a factory MIDI interface, and a MIDI retrofit existed for earlier
  units. The Lintronics upgrade replaces the processor and adds a new operating system.
platform: Zilog Z80
notes: >-
  Custom firmware for it is distributed on replacement EPROMs, not installed over a cable. Eric Frampton's +EF firmware needs
  a Memorymoog Plus.
