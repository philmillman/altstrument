name: Mother-32
manufacturer: Moog Music
category: synth
added: 2026-11-25
tagline: Semi-modular analog desktop synth with a 32-step sequencer and 32 patch points
description: >-
  The Mother-32 is a semi-modular analog desktop synthesizer from Moog Music, with one oscillator, a ladder filter, a
  mixer, an LFO, an envelope generator and a 32-step sequencer. Its 32 patch points use Eurorack-compatible 3.5 mm
  jacks, and a 5-pin DIN MIDI input plays it from a keyboard or sequencer. It is controlled by a Texas Instruments
  C2000 microcontroller.
platform: TI C2000
links:
  manufacturer: https://www.moogmusic.com/synthesizers/mother-32/
  community:
    - label: Moog forum
      url: https://forum.moogmusic.com/
notes: >-
  Firmware updates are sent to the synth as SysEx files over MIDI, with an erase step before the new image is written.
  The one custom firmware listed here replaces the factory sequencer firmware, and Moog's own update file can be sent
  again to go back to stock. The microcontroller family is taken from that project's build instructions.
