name: Subharmonicon
manufacturer: Moog Music
category: synth
tagline: Semi-modular analog desktop synth with subharmonic oscillators and a polyrhythm section
description: >-
  The Subharmonicon is a semi-modular analog desktop synthesizer from Moog Music. Each of its two oscillators has two
  subharmonic oscillators that divide its frequency, and two four-step sequencers are clocked by four rhythm
  generators. It also has a ladder filter and a patch bay with 32 points.
platform: TI C2000
stock_firmware: 1.1.1
links:
  manufacturer: https://www.moogmusic.com/synthesizers/subharmonicon/
  community:
    - label: Moog forum
      url: https://forum.moogmusic.com/
notes: >-
  Firmware updates are sent to the synth as SysEx files with a procedure of invalidate, erase and write. The patcher
  listed here changes a copy of Moog's v1.1.1 file that the user supplies, and Moog's original file can be sent again
  to go back to stock. The processor family is taken from the toolchain the patcher project builds with.
