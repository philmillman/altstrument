name: WARBL / WARBL2
manufacturer: Mowry Stringed Instruments
category: other
added: 2026-11-03
tagline: Open source MIDI wind controller that senses finger positions with infrared sensors
description: >-
  WARBL is a MIDI wind controller by Andrew Mowry, made in Oregon, shaped like a small tube with tone holes. Infrared sensors detect how far each finger is from a hole, so the firmware
  can send pitch bend for slides and vibrato, and a breath sensor sets the note level. It has fingering charts for instruments such as the tin whistle, Irish flute, uilleann pipes and
  Great Highland bagpipes, and a browser configuration tool changes the settings.

  The original WARBL sends USB MIDI from an ATmega32U4. WARBL2 is the later model, built on an nRF52840, which adds Bluetooth LE MIDI, a battery and more sensors. Both have open source firmware.
platform: ATmega32U4 (WARBL), Nordic nRF52840 (WARBL2)
stock_firmware: "4.7 (WARBL2), 2.1 (WARBL)"
