name: Workshop System Computer
manufacturer: Music Thing Modular
category: eurorack
added: 2026-10-13
tagline: RP2040 module whose firmware lives on swappable program cards
description: >-
  The Workshop System Computer is an 8HP Eurorack module designed by Tom
  Whitwell of Music Thing Modular as part of the Workshop System, which was
  designed for an April 2024 residency. It is based on the RP2040
  microcontroller and has three knobs, a three-way switch, and paired audio/CV,
  pulse and pitch-CV inputs and outputs. The program it runs is stored on a
  small removable card.
platform: RP2040
links:
  manufacturer: https://www.musicthing.co.uk/workshopsystem/
  community:
    - label: Program card library
      url: https://computer.musicthing.co.uk/
    - label: Workshop_Computer repository
      url: https://github.com/TomWhitwell/Workshop_Computer
notes: >-
  The Computer runs whatever program is on its card, so the card library is
  the firmware scene. The repository's releases folder held 133 card folders
  as of 2026-10-13; each carries its own info.yaml with a license field that
  some cards leave blank. Starter code exists for Pico SDK, Arduino,
  CircuitPython and MicroPython; Chris Johnson's ComputerCard header library
  (MIT) is the most developed.
  The per-card entries on this page are fetched at build time from each
  card's info.yaml in the Workshop_Computer repository. Corrections to a card
  entry belong upstream, not in this catalog. program-card-library is the
  only hand-written entry here.
