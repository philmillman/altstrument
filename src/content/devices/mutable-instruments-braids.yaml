notes: >-
  Mutable Instruments firmware is MIT-licensed (STM32 code) and the hardware
  is CC-BY-SA-3.0. Derivatives may not use the Mutable Instruments name.
  Bees-in-the-Trees (Braids) and Dead Man's Catch (Peaks) live in the same
  Mutated Mutables repository.
