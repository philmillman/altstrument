name: Branches
manufacturer: Mutable Instruments
category: eurorack
added: 2026-10-13
tagline: Dual bernoulli gate (discontinued)
description: >-
  Branches is a 6HP Eurorack dual Bernoulli gate from Mutable Instruments, first
  built in 2014. Each trigger or gate arriving at an input is routed at random
  to one of two outputs, with a probability set by a knob and CV input, which
  makes it useful for probabilistic sequencing and generative patches. It is
  built around an ATmega88p microcontroller running at 8 MHz.
platform: ATmega88 (AVR)
links:
  manufacturer: https://pichenettes.github.io/mutable-instruments-documentation/modules/branches/
  community:
    - label: Mutable Instruments third-party firmware list
      url: https://pichenettes.github.io/mutable-instruments-documentation/third_party_firmware/
notes: >-
  Hardware is CC-BY-SA-3.0. Branches is an AVR module, so its code falls under
  Mutable's GPL-3.0 notice for AVR projects rather than the MIT notice for
  STM32 projects. Derivatives may not use the Mutable Instruments name.
