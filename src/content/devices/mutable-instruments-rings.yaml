name: Rings
manufacturer: Mutable Instruments
category: eurorack
added: 2026-10-13
tagline: Resonator (discontinued)
description: >-
  Rings is a 14HP Eurorack resonator from Mutable Instruments, produced from
  2015 to 2022. It excites a modal resonator, a bank of sympathetic strings or a
  non-linear string model from an audio input or an internal exciter, and it can
  play these polyphonically with up to four voices. The hardware uses an
  STM32F405 at 168 MHz and a WM8731 codec.
platform: STM32F4
links:
  manufacturer: https://pichenettes.github.io/mutable-instruments-documentation/modules/rings/
  community:
    - label: Mutable Instruments third-party firmware list
      url: https://pichenettes.github.io/mutable-instruments-documentation/third_party_firmware/
notes: >-
  Mutable Instruments firmware is MIT-licensed (STM32 code) and the hardware
  is CC-BY-SA-3.0. Derivatives may not use the Mutable Instruments name.
  Rings ports to other platforms exist (for example Rings Versio on the Noise
  Engineering Versio) and are listed under those devices.
