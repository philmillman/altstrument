name: Tides (original)
manufacturer: Mutable Instruments
category: eurorack
added: 2026-10-20
tagline: Tidal modulator, 2014 version (discontinued)
description: >-
  Tides is a 14HP Eurorack function generator and low-frequency oscillator
  designed by Émilie Gillet and sold by Mutable Instruments from 2014 to 2018,
  before the redesigned Tides 2018. It runs as a single-shot, sustained or
  looping generator across three frequency ranges, with shape, slope and
  smoothness controls and a clock input for locking to external timing. It uses
  an STM32F103 at 72 MHz and a DAC8552.
platform: STM32F1
stock_firmware: "1.1"
