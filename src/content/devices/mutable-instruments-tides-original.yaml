notes: >-
  Mutable Instruments firmware is MIT-licensed (STM32 code) and the hardware
  is CC-BY-SA-3.0. Derivatives may not use the Mutable Instruments name. This
  is the original Tides; the 2018 module has different hardware and firmware.
  Parasites by Matthias Puech also exists for the original Tides; see its entry
  here.
