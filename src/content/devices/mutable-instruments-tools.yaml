name: Mutable Instruments cross-module tools
manufacturer: Mutable Instruments
category: tools
added: 2026-10-14
tagline: Host-side tools that work across several Mutable Instruments modules
description: >-
  This entry groups host-side software that serves more than one Mutable
  Instruments module, rather than a single device. Today that is a simulator
  that runs the unmodified open-source module firmware on a computer, with a
  virtual front panel in place of the hardware.
links:
  community:
    - label: Mutable Instruments third-party firmware list
      url: https://pichenettes.github.io/mutable-instruments-documentation/third_party_firmware/
notes: >-
  Host-side tools for the open-source Mutable Instruments firmware. They build
  from the public pichenettes/eurorack source and do not bundle compiled module
  images. Mutable Instruments firmware is MIT-licensed (STM32 code); derivatives
  may not use the Mutable Instruments name.
related: [mutable-instruments-plaits, mutable-instruments-rings, mutable-instruments-clouds, mutable-instruments-braids, mutable-instruments-marbles, mutable-instruments-stages, mutable-instruments-peaks, mutable-instruments-branches, mutable-instruments-yarns]
