name: Warps
manufacturer: Mutable Instruments
category: eurorack
added: 2026-10-20
tagline: Meta-modulator (discontinued)
description: >-
  Warps is a 10HP Eurorack meta-modulator designed by Émilie Gillet and sold by
  Mutable Instruments from 2015 to 2022. It combines two audio signals with
  crossfading, cross-folding, diode ring-modulation, digital ring-modulation,
  XOR, a comparator-based octaver or a 20-band vocoder, and it can replace one
  input with an internal oscillator. The module uses an STM32F405 at 168 MHz
  and a WM8731 codec.
platform: STM32F4
stock_firmware: 1.0a
links:
