notes: >-
  No custom firmware for Antigone is known. The only firmware is Nanopolis's
  own closed build; no source repository or licence for it is linked from the
  maker's pages. Owners update from the maker's news page, which offers each
  release as a .hex file for the Teensy and a microSD card archive, and the
  documentation has a firmware update guide. The 2.1.0 notes say that card
  contents are kept when upgrading from 2.0.2 or 2.0.1 beta, while an upgrade
  from 1.x needs the new card archive, and that V1 presets cannot be read by V2,
  so back up before updating.
