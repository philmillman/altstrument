name: Antigone
manufacturer: Nanopolis
category: eurorack
added: 2026-11-26
tagline: 26HP Eurorack synth voice with six voices, a drum machine mode and an optional MIDI/CV expander
description: >-
  Antigone is a 26HP Eurorack module from Nanopolis, a French maker based in
  Montpellier. It runs six voices that can be played as an oscillator stack
  with four individual outputs, as a multi-timbral poly synth with filters,
  drive, modulators and a note and rhythm generator, or as a drum machine.

  Its engines include wavetable, FM, granular, sample player, resonator and
  drum synth machines, with samples, wavetables and projects stored on a
  microSD card. A separate 4HP MIDI/CV expander adds a TRS MIDI input, six CV
  inputs and two gate inputs.
platform: Teensy
stock_firmware: 2.1.0
