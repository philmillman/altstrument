name: Pacer
manufacturer: Nektar
category: foot-controller
tagline: MIDI and DAW footswitch controller with 24 presets
description: >-
  The Pacer is a MIDI and DAW foot controller from Nektar Technology. It has ten programmable footswitches with RGB LEDs, a separate preset switch, an encoder and a two-row LED display, and it
  connects over USB and a MIDI out jack. It also has four relay outputs, inputs for four external footswitches and two expression pedals, and each of its 24 presets can send up to 16 MIDI or relay
  messages per switch press. Ready-made presets cover Mackie Control transport and track functions.
platform: Not published
links:
  manufacturer: https://web.archive.org/web/20190723112243/https://nektartech.com/pacer-midi-daw-footswitch-controller/
notes: >-
  No custom firmware is catalogued for the Pacer. The entry here is a browser editor that reads and writes presets over MIDI SysEx, which Nektar's support helped its author with. It is not made or endorsed by Nektar.
