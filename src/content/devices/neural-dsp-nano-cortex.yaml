name: Nano Cortex
manufacturer: Neural DSP
category: pedal
added: 2026-11-03
tagline: Compact two-footswitch amp and effects modeller that runs Neural Captures
description: >-
  The Nano Cortex is a 620 g pedal from Neural DSP that plays back Neural Captures of amps and pedals, with an IR loader,
  an input gate and effect slots. It has 64 presets in eight banks, two footswitches that also work as rotary controls,
  a built-in tuner, an on-device capture function, a 24-bit 48 kHz USB audio interface, MIDI over a TRS jack and over
  USB, and Bluetooth for managing presets with Neural DSP's Cortex Cloud app. It can be powered from a USB battery pack.
links:
  manufacturer: https://neuraldsp.com/nano-cortex
notes: >-
  No custom firmware is known. The community tools control the pedal over USB MIDI and Bluetooth and do not replace its
  firmware. Neural DSP publishes no preset or parameter protocol, so the Bluetooth tools rest on traffic captured from the
  official app.
