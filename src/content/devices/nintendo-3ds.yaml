name: Nintendo 3DS
manufacturer: Nintendo
category: handheld
added: 2026-10-18
tagline: Autostereoscopic dual-screen handheld (3DS, New 3DS, 2DS) with homebrew trackers
description: >-
  The Nintendo 3DS, released in 2011, is a dual-screen handheld with a touch screen, a circle pad and a microphone.
  The New 3DS (2014) adds a faster ARM11 processor, and the 2DS models are cartridge-compatible variants without the
  3D display. It runs its own homebrew format (.3dsx) and also plays DS software.

  Native music software is homebrew trackers. The one that needs the extra processing power of the New 3DS family is
  descry; NitrousTracker has a 3DS port in its 0.7.0 beta releases.
platform: ARM11 MPCore with an ARM9 coprocessor
links:
