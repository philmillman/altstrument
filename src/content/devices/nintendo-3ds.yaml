notes: >-
  Native homebrew needs a console with custom firmware and the Homebrew Launcher, which this catalog does not
  cover. 3DS programs that also build for the DS are listed under both devices. descry requires a New 3DS family
  console (New 3DS, New 3DS XL or New 2DS XL) and does not run on the original 3DS. Korg sold the DSN-12 synthesizer as an eShop download; it is a retail
  product with no entry here. Noise Commander 3DS ships only as a demo repository without source, so it is left out.
