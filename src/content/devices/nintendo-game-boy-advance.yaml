name: Game Boy Advance
manufacturer: Nintendo
category: handheld
added: 2026-10-18
tagline: 32-bit handheld (GBA, SP, Micro) with homebrew trackers and the Nanoloop Two cartridge
description: >-
  The Game Boy Advance is Nintendo's 2001 successor to the Game Boy Color, with a 16.8 MHz ARM7TDMI processor and a
  240 by 160 screen. The SP (2003) and Micro (2005) are later versions of the same hardware. Besides the four
  Game Boy sound channels it has two DMA-fed 8-bit sample channels, so native programs can play samples as well as
  the chiptune voices.

  Music software for it is native GBA ROMs: the commercial Nanoloop Two cartridge and a few homebrew trackers and
  sequencers.
platform: ARM7TDMI with Game Boy compatible sound channels plus two sample channels
links:
  community:
