notes: >-
  Music programs here are Game Boy ROMs. On real hardware they need a writable flash cartridge or a commercial
  cartridge; the catalog does not list flash cartridges or cartridge readers because they are not music-specific.
  The same ROMs run in emulators, and Game Boy Advance and DS family consoles also play them (see the Game Boy
  Advance entry). The Analogue Pocket, a separate FPGA handheld that plays Game Boy cartridges, has Nanoloop built
  in; it has no entry here. The M-VAVE FM-1 runs a Game Boy emulator firmware called GameDude, which is listed under
  m-vave-fm-1. Commercial cartridges and the freeware LSDj ROM are listed with a link to their author's own site;
  ROM files are never hosted here.
