name: Game Boy
manufacturer: Nintendo
category: handheld
added: 2026-10-18
tagline: Original handheld family (DMG, Pocket, Color) that runs LSDj, Nanoloop and other music cartridges
description: >-
  The Game Boy is Nintendo's 8-bit cartridge handheld, released in 1989, with the Pocket (1996) and Color (1998)
  following in the same software family. It has a 160 by 144 screen, a link-cable port, and a four-channel sound
  chip with two pulse waves, a 4-bit programmable wave channel and noise. Music software for it runs as a cartridge
  ROM that drives those four channels directly, which is the basis of the Game Boy chiptune scene.

  The best-known programs are the tracker LSDj and the sequencer Nanoloop, plus MIDI and drone tools. The link port
  is also used to sync to other gear through small interfaces such as the Arduinoboy.
platform: Sharp LR35902 (SM83) 8-bit CPU with a four-channel sound unit
