name: NES / Famicom
manufacturer: Nintendo
category: handheld
added: 2026-10-18
tagline: Nintendo's 8-bit console, played as an instrument through homebrew ROMs and MIDI cartridges
description: >-
  The Nintendo Entertainment System, sold as the Famicom in Japan, is an 8-bit home console released in 1983 in
  Japan and 1985 in North America. Its Ricoh 2A03 processor combines a 6502 core with an audio unit of two pulse
  waves, a triangle, noise and a low-rate sample channel.

  Music software that runs on the console itself is homebrew. Pulsar and PR8 are trackers that run on a real
  NES through a flash cartridge or in an emulator, and SynthNes and the Chip Maestro cartridge turn the console
  into a MIDI-controlled synthesizer.
platform: Ricoh 2A03 (6502 core with audio unit)
links:
