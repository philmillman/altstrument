name: Nintendo Switch
manufacturer: Nintendo
category: handheld
added: 2026-10-18
tagline: Hybrid console (Switch, Lite, OLED) with a homebrew build of Little Piggy Tracker
description: >-
  The Nintendo Switch is a hybrid console released in 2017 that works as a handheld or docked to a television. It is
  based on an NVIDIA Tegra X1 system on a chip, and the Lite and OLED models are variants of the same family.

  Music software for it is scarce. The only open project found is a Switch build of Little Piggy Tracker, a tracker
  in the line of LSDj, which is a homebrew app launched from the Homebrew Menu.
platform: NVIDIA Tegra X1 family (ARM Cortex-A57 and A53)
