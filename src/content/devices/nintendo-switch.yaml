notes: >-
  Homebrew runs only on consoles with custom firmware, which this catalog does not cover or link. Korg sells Gadget
  as a commercial Switch eShop app; it has no entry here. Nintendo's own Drum Pad and Music Box are retail games and
  are not listed either.
