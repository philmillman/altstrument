name: Alia
manufacturer: Noise Engineering
category: eurorack
added: 2026-10-13
tagline: 10 HP oscillator and voice platform with swappable firmwares
description: >-
  Alia is a 10 HP Eurorack module from Noise Engineering, built on an
  Electrosmith Daisy Seed (STM32H750), that serves as a common hardware platform for a family of digital voices, with a panel of
  seven knobs and two switches. It was launched with the Basimilus Iteritas
  Alia drum synthesizer, which succeeded the earlier fixed-function Basimilus
  Iteritas Alter module. Printable or sold overlays relabel the panel for
  whichever algorithm is loaded.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://noiseengineering.us/pages/world-of-alia
  community:
    - label: Noise Engineering firmware swap portal
      url: https://noiseengineering.us/portal/firmware/
    - label: Noise Engineering firmware index (Versio only)
      url: https://github.com/Maxhodges/noise-engineering-firmware-index
notes: >-
  Alia is one 10 HP hardware module, billed by Noise Engineering as the home
  of the BIA (Basimilus Iteritas Alia). Every Alia firmware runs on any Alia
  and swapping is free through the Firmware Swap page,
  noiseengineering.us/portal/firmware, from a WebUSB browser. Hot-swappable
  panel overlays are sold per firmware. Alia is a different piece of hardware
  from Versio and Legio, so Versio and Legio firmwares, official or
  third-party, do not run on it. No third-party Alia firmware was found: the
  community firmware index lists Versio only, and Noise Engineering documents
  libDaisy support for Versio and Legio but not Alia. Noise Engineering's
  launch post says Alia uses a Daisy Seed without the external memory
  installed, paired with an external DAC.
related: [noise-engineering-versio, noise-engineering-legio, electrosmith-daisy-patch]
