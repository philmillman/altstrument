name: Legio
manufacturer: Noise Engineering
category: eurorack
added: 2026-10-13
tagline: 6 HP stereo oscillator and effects platform with swappable firmwares
description: >-
  Legio is a 6 HP Eurorack module from Noise Engineering, introduced in June
  2022 with the Virt Iter Legio oscillator and the Librae Legio dynamics
  processor. It is a stereo-in, stereo-out oscillator and DSP platform built
  on an Electrosmith Daisy Seed (STM32H750): one fixed panel and hardware
  design whose function is set by the loaded algorithm, such as an
  oscillator, filter, percussion voice or effect.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://noiseengineering.us/pages/world-of-legio
  community:
    - label: Noise Engineering firmware swap portal
      url: https://noiseengineering.us/portal/firmware/
    - label: libDaisy
      url: https://github.com/electro-smith/libDaisy
    - label: Legio example firmware (DaisyExamples)
      url: https://github.com/electro-smith/DaisyExamples/tree/master/legio
notes: >-
  Legio is one 6 HP hardware module with stereo audio in and out, pitch
  tracking and a few parameters. Every Legio firmware runs on any Legio and
  swapping is free through the Firmware Swap page,
  noiseengineering.us/portal/firmware, from a WebUSB browser. The library
  grew from 7 firmwares to 23 in Noise Engineering's Legioverload release,
  which introduced the Legio drum kit. Noise Engineering documents libDaisy support
  and an example project for writing custom Legio firmware, and the first
  third-party Legio firmwares appeared in late 2026. Versio or Alia firmwares
  do not run on it (different hardware).
related: [noise-engineering-versio, noise-engineering-alia, electrosmith-daisy-patch]
