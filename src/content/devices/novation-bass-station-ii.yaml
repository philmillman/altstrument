name: Bass Station II
manufacturer: Novation
category: synth
added: 2026-11-03
tagline: 25-key analogue monosynth with two oscillators and a sub
description: >-
  The Bass Station II is a monophonic analogue synthesizer from Novation, with two
  oscillators, a sub oscillator, a switchable classic or acid filter, two LFOs, two
  envelopes and an arpeggiator and step sequencer. It has a 25-note keyboard, and its
  patches are stored in memory and exchanged as MIDI SysEx dumps. Most panel controls
  also send and receive MIDI, so editors can mirror the whole front panel.
links:
  manufacturer: https://novationmusic.com/products/bass-station-ii
notes: >-
  No third-party firmware is known; the entries here are browser and desktop editors.
