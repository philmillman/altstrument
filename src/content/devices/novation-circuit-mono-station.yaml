name: Circuit Mono Station
manufacturer: Novation
category: synth
added: 2026-10-27
tagline: Paraphonic analogue synth with three sequencer tracks on a 32-pad grid
description: >-
  The Circuit Mono Station is a paraphonic analogue synthesiser from Novation, derived from the Bass Station II. It has
  two oscillators with a sub-oscillator, ring modulation and noise, a multi-mode filter, three distortion modes and a
  four-by-eight modulation matrix. Two oscillator sequencers and one modulation sequencer are played and edited on 32
  velocity-sensitive RGB pads. It has CV, gate and modulation outputs, MIDI In, Out and Thru, an audio input and USB,
  and stores up to 64 patches on the unit.
platform: STM32F42x Cortex-M4F
stock_firmware: "1.2"
links:
  manufacturer: https://novationmusic.com/products/circuit-mono-station
related: [novation-circuit, novation-circuit-tracks, novation-circuit-rhythm]
notes: >-
  The custom firmware here is built from Novation's official 1.2 update, which the project does not distribute; its
  README says to unpack the file from Novation Components yourself. The bootloader is left untouched, so the stock
  update can be flashed again, or installed through Novation Components.
