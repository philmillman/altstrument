name: Circuit Rhythm
manufacturer: Novation
category: sampler
added: 2026-10-18
tagline: Standalone sampler and drum machine with a 32-pad grid and a rechargeable battery
description: >-
  The Circuit Rhythm is a battery-powered sampler and drum machine from Novation. Samples can be recorded on the
  unit, then sliced, reversed, looped and played chromatically, and are sequenced from a grid of velocity-sensitive
  RGB pads. It has Grid FX for performance, plus reverb, delay, sidechain and a master compressor. Novation rates
  the battery at up to four hours.
stock_firmware: "5706"
links:
  manufacturer: https://novationmusic.com/products/circuit-rhythm
related: [novation-circuit, novation-circuit-tracks, novation-circuit-mono-station]
notes: >-
  The custom firmware here is built from Novation's official 5706 update, either as a patched copy served by an
  installer or patched locally from the user's own file, and is entered through the Rhythm's update mode, which a
  custom image does not replace. Novation Components can reinstall the official firmware.
