name: Launchkey Mini MK4
manufacturer: Novation
category: controller
added: 2026-11-11
tagline: Compact 25-key MIDI keyboard with 16 RGB pads, eight encoders and an OLED display
description: >-
  The Launchkey Mini MK4 is a compact USB keyboard controller from Novation, sold with 25 or 37 mini keys. It has
  16 RGB pads, eight rotary encoders, pitch and modulation strips, an OLED display, an arpeggiator, a chord map and
  custom modes. It is bus powered and is built around an STM32F4 microcontroller.
platform: STM32F4
stock_firmware: "1563"
links:
  manufacturer: https://novationmusic.com/products/launchkey-mini-25
related: []
notes: >-
  The one project here patches Novation's official 1563 update file for the 25-key model, which you download from
  Novation yourself; the project does not distribute it. Its documents say the 32 KB bootloader is never modified and
  that holding Oct + and Oct - while plugging in USB enters the hardware bootloader.
