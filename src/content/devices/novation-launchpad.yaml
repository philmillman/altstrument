  community:
    - label: Launchpad Firmware Utility
      url: https://fw.mat1jaczyyy.com/
related: [novation-launchpad-pro]
notes: >-
  Novation has not opened the MK3 firmware, and no replacement OS was found for
  the Launchpad X, Mini MK3 or Pro MK3. The only third-party tool is a utility
  that patches stock firmware images for these units. For the original Launchpad
  Pro, see the Launchpad Pro (MK1) entry.
