name: Summit
manufacturer: Novation
category: synth
added: 2026-11-10
tagline: 16-voice bi-timbral polyphonic synthesizer with 61 keys
description: >-
  The Summit is a 61-key synthesizer from Novation with two parts, each with eight voices, three oscillators per
  voice, a multimode filter, two LFOs, modulation envelopes and a mod matrix. It has distortion, chorus, delay and
  reverb sections and can layer, split or play two parts at once from the keyboard or over MIDI. Sounds are edited
  from the front panel or with Novation Components.
stock_firmware: "2.2 (build 2121)"
links:
  manufacturer: https://novationmusic.com/products/summit
  community:
    - label: Summit MPE source and releases
      url: https://github.com/michaelkollmann/gipfel_mpe
notes: >-
  Firmware updates are installed as sysex files, normally through Novation Components. The only custom firmware
  recorded here is a patch that is applied to your own copy of Novation's official 2.2 update, and the project
  says the bootloader is never modified.
