name: Nozori
manufacturer: nozoid
category: eurorack
added: 2026-10-13
tagline: Multi-module platform with open Arduino firmware
description: >-
  Nozori is a pair of 12HP Eurorack hardware platforms from the French maker
  nozoid, the Nozori 68 and Nozori 84. Each combines a digital core with
  potentiometers, a three-position switch, two LEDs and audio and CV jacks.
  Jumper settings select which pre-programmed module the hardware behaves as,
  such as an oscillator, filter, envelope or effect.
platform: Arduino IDE firmware
links:
  manufacturer: https://www.nozoid.com/nozori-68
  community:
    - label: Nozori firmware repository
      url: https://github.com/ch-nry/nozori
notes: >-
  One hardware platform morphs into many modules by loading a different
  Arduino sketch; the repository ships sketches for the 68 and 84 variants,
  calibration and test sketches, and a template for new modules. The
  repository has had no commits since 2019-10-04.
