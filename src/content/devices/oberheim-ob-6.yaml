name: OB-6
manufacturer: Oberheim
category: synth
added: 2026-11-03
tagline: Six-voice analog polysynth from Dave Smith and Tom Oberheim
description: >-
  The OB-6 is a six-voice analog polyphonic synthesizer made by Dave Smith and Tom
  Oberheim, released in 2016. Each voice has two oscillators and a two-pole state
  variable filter that morphs from low-pass through notch to high-pass, with cross
  modulation, dual digital effects, an arpeggiator and a 64-step polyphonic sequencer. It
  comes as a 61-key keyboard and as a desktop module.
links:
  manufacturer: https://sequential.com/product/ob-6/
notes: >-
  No custom firmware is known; the entries are editors and librarians.
related: [sequential-prophet-6, sequential-prophet-rev4]
