name: TEO-5
manufacturer: Oberheim
category: synth
added: 2026-11-26
tagline: Five-voice analog polysynth with a SEM-lineage filter and through-zero FM
description: >-
  The TEO-5 is a five-voice analog polyphonic synthesizer from Oberheim, sold as a keyboard
  with a 3.5-octave Fatar keybed and as a desktop module. Each voice has two oscillators with
  linear through-zero FM, a sub-oscillator and a discrete filter in the SEM lineage that
  morphs from low-pass to high-pass through notch, with a band-pass mode. It has a 19-slot
  modulation matrix, dual digital effects with a dedicated reverb, a multimode arpeggiator and
  a 64-step polyphonic sequencer, and stores 256 factory and 256 user programs.
links:
  manufacturer: https://oberheim.com/products/teo-5/
notes: >-
  No custom firmware is known; the entries are editors and librarians.
