name: OXI E16
manufacturer: OXI Instruments
category: controller
tagline: 16-encoder MIDI controller with LED rings, an OLED screen and USB, TRS and Bluetooth MIDI
description: >-
  The E16 is a MIDI controller from OXI Instruments with sixteen push encoders, each ringed by sixteen RGB LEDs, a
  128 by 64 monochrome OLED and a Shift button, in an aluminium case. It offers 12 pages of 16 controls, snapshots that
  morph between control states, a recorder for knob movements and Lua scripting, and it connects over USB, TRS MIDI
  (one input, two outputs) and Bluetooth MIDI. The OXI App edits scenes and instrument definitions on a computer.
platform: GigaDevice GD32F405RG (Arm Cortex-M4F), nRF52832 for Bluetooth
stock_firmware: 1.3.1
links:
  manufacturer: https://oxiinstruments.com/oxi-e16
  community:
    - label: OXI E16 firmware releases
      url: https://github.com/OXI-Instruments/OXI-E16-Releases
notes: >-
  OXI publishes the official firmware as .syx updates on GitHub and installs them through a bootloader that starts from a
  button combination at power-up, whatever firmware is loaded. OXI's E16 SDK is the one route to custom firmware; OXI does not
  support custom firmware.
