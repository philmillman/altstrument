name: Terrarium
manufacturer: PedalPCB
category: pedal
added: 2026-10-13
tagline: Daisy Seed pedal PCB with six knobs and two footswitches
description: >-
  The Terrarium is a bare printed circuit board from PedalPCB that carries an
  Electrosmith Daisy Seed and the controls of a digital effects pedal, listed in
  2020. It is designed for a 125B enclosure with top-mounted jacks and provides
  six potentiometers, four toggle switches, two momentary footswitches and two
  LEDs. The builder supplies the Daisy Seed, components and enclosure.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://www.pedalpcb.com/product/pcb351/
  community:
    - label: Terrarium build docs
      url: https://docs.pedalpcb.com/project/Terrarium.pdf
related: [cleveland-hothouse, guitarml-funbox, electrosmith-daisy-patch]
notes: >-
  A 125B-format PCB for a Daisy Seed. Pedal firmware for it is flashed with the
  Electrosmith web programmer or DFU, so no manufacturer firmware is replaced.
  The GuitarML Seed pedal and the bkshepherd Guitar Pedal framework both run on
  the Terrarium hardware.
