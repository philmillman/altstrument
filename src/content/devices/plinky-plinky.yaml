name: Plinky / Plinky+
manufacturer: Plinky
category: synth
tagline: Open source 8-voice touch synth with an 8 by 8 pad surface, in 24HP Eurorack or desktop form
description: >-
  Plinky is an eight-voice polyphonic synthesizer played on a grid of touch pads, designed by Alex Evans (mmalex). It has a small display, three
  knobs and an encoder, a sequencer and arpeggiator, a sampler and wavetable oscillators, with Eurorack CV and gate jacks and USB MIDI. Plinky+ is a larger
  version with a metal case and a bigger play surface, and it runs the same firmware from version 0.B2.

  Both the hardware and the software are published as open source, and the synth is sold as kits and built units by several shops. Firmware updates
  are UF2 files dropped onto the drive that Plinky shows in its boot mode. Plinky12 is a separate, newer product line and is not covered here.
platform: STM32L476 (Arm Cortex-M4)
stock_firmware: 0.B3
