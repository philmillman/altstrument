name: Plinky12
manufacturer: Plinky
category: synth
added: 2026-11-23
tagline: 12 by 12 inch touch synth with a 16 by 16 pad grid, programmed with C++ panels from a browser IDE
description: >-
  Plinky12 is a newer family of instruments from the makers of Plinky, designed by Alex Evans (mmalex) and Making Sound Machines. It has a 16 by 16
  grid of pressure-sensitive pads with RGB lighting, an SD card slot and MIDI. It ships as three
  standalone instruments, Chords, Blocks and Toadstep, which differ in their printed faceplate and playing layout.

  The behaviour of each instrument is a panel written in C++. Panels are written, tested in an emulator and flashed over USB from the maker's
  browser IDE, which also hosts a library of example and community panels. Community panels are single C++ files that are built into the firmware
  together with the maker's own firmware, whose source is not published.
platform: RP2350 (Arm Cortex-M33)
links:
  manufacturer: https://plinky12.com/
  community:
    - label: Plinky12 web IDE
      url: https://plinky12.com/ide.html
    - label: Community panels library
      url: https://plinky12.com/community.html
    - label: Community panels repository
      url: https://github.com/plinkysynth/community-panels
notes: >-
  The Plinky12 firmware itself is not open source: its source is not published and the IDE injects the SDK headers when it builds a panel. The
  entries here are panels whose source is published by their authors. Plinky12 is a separate product line from the original Plinky and Plinky+
  and does not share their firmware. The maker's website refuses automated access, so the hardware details come from the community panels
  repository and the panels' own documentation.
