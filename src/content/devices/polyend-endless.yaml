name: Endless
manufacturer: Polyend
category: pedal
tagline: Programmable guitar effects pedal with user-loadable effects
description: >-
  The Endless is a programmable guitar effects pedal from Polyend, with three
  knobs, two footswitches and a 720 MHz ARM Cortex-M7 running the effect. It
  connects over USB-C as a drive, and an effect is a single .endl file copied
  onto it. Effects come from Polyend's Playground, which generates them from a
  text description, from the community gallery, or from C++ written with
  Polyend's SDK.
platform: ARM Cortex-M7, 720 MHz
links:
  manufacturer: https://polyend.com/endless/
  community:
    - label: Community plates gallery
      url: https://polyend.com/plates/
notes: >-
  No replacement for the pedal's own firmware is known. The entries here are
  effects that load through its normal patch system and the tools that build or
  manage them. Patches get 512 KB for code and data, and must avoid heap
  allocation.
