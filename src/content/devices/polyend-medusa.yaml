name: Medusa
manufacturer: Polyend
category: synth
added: 2026-11-02
tagline: Polyend and Dreadbox hybrid synthesizer with a pressure-sensitive pad grid
description: >-
  The Medusa is a hybrid polyphonic synthesizer made by Polyend with Dreadbox and
  produced from 2018 to 2021, in grey and in a Black Limited Edition. It combines
  three analog oscillators with digital wavetable oscillators and a Dreadbox
  analog multimode filter, and has five envelopes, five LFOs and a
  pressure-sensitive pad grid for playing and sequencing. Later firmware added an
  FM engine, a drone mode and Polyend Tracker integration.
links:
  manufacturer: https://polyend.com/legacy/medusa/
notes: >-
  No custom firmware is known, and Polyend has not published its source. Production
  ended in 2021. The entries here are host-side tools for its wavetables and MIDI
  control.
