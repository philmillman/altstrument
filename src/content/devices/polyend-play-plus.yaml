name: Play+
manufacturer: Polyend
category: groovebox
added: 2026-11-07
tagline: Sixteen-track sample and synth groovebox with USB multitrack audio
description: >-
  The Play+ is the later, larger sibling of Polyend's Play groovebox. It has sixteen tracks that play samples or the
  built-in synth and drum engines, a grid of backlit pads for steps, a small display with knobs and a step sequencer with
  variations and performance effects. It sends and receives MIDI and streams several stereo channels over USB, and projects
  and samples are kept on a microSD card.
platform: NXP i.MX RT (Cortex-M7)
stock_firmware: 1.3.0
links:
  manufacturer: https://polyend.com/play-plus/
notes: >-
  FreePlay patches a copy of Polyend's 1.3.0 update file that you download yourself. It is also listed under the original
  Play, whose update file and processor differ. Polyend's own firmware is not hosted here.
related: [polyend-play]
