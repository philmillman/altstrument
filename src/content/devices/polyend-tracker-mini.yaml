name: Tracker Mini
manufacturer: Polyend
category: groovebox
tagline: Portable battery-powered tracker with synth engines and a built-in microphone
description: >-
  The Tracker Mini is a portable version of Polyend's tracker-style sampler,
  synthesizer and sequencer, with 16 sequencer tracks, four synth engines plus a
  drum synth, a built-in microphone and a battery rated for up to eight hours.
  It replaces the pad grid and jog wheel of the larger models with a screen and
  buttons. It has stereo line in and out, MIDI in and out, USB-C with audio over
  USB, and a microSD card for projects.
platform: NXP i.MX RT10xx (Cortex-M7)
stock_firmware: "2.0"
links:
  manufacturer: https://polyend.com/tracker-mini/
  community:
    - label: Polyend Backstage forum
      url: https://backstage.polyend.com/
notes: >-
  Polyend's Tracker Community Edition builds for this device, the Tracker+ and the
  original Tracker from one codebase, and is filed under the original Tracker and
  listed here. Firmware is installed from the microSD card, and a recessed reset
  button next to the USB-C port recovers a build that will not boot.
related: [polyend-tracker, polyend-tracker-plus]
