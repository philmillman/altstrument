name: Tracker+
manufacturer: Polyend
category: groovebox
tagline: Standalone tracker with synth engines, drums and USB audio
description: >-
  The Tracker+ is the 2024 successor to the original Polyend Tracker, a
  standalone sampler, synthesizer and sequencer built around a tracker-style
  pattern editor. It adds eight tracks for MIDI or synth playback, several synth
  engines and a drum machine, stereo sampling, more memory and audio over USB,
  alongside MIDI in and out and a microSD card for projects. Like the original,
  it has a grid of backlit pads and a large jog wheel.
platform: NXP i.MX RT10xx (Cortex-M7)
stock_firmware: 1.2.0
links:
  manufacturer: https://polyend.com/tracker-plus/
notes: >-
  Modular Trackular and Conditional Trigs target stock firmware 1.2.0 and patch a copy
  you download from Polyend. Tracker Community Edition is Polyend's own community
  firmware, filed under the original Tracker and also listed here. They are separate from the original Tracker, which has a
  different processor and firmware line. Polyend's tracker-lib reads and writes
  the Tracker+ file formats; it is filed under the original Tracker and also
  listed here.
related: [polyend-tracker, polyend-tracker-mini]
