name: Tracker
manufacturer: Polyend
category: groovebox
added: 2026-10-13
tagline: Standalone tracker-style sequencer and sampler
description: >-
  The Tracker is a standalone sampler, synthesizer and sequencer from Polyend
  that takes its workflow from the tracker software that
  originated on the Amiga. It has a mechanical keyboard, 48 backlit pads, a
  large screen and a haptic knob, and plays samples as sampler, wavetable or
  granular instruments. It records from line or microphone inputs and has an FM
  radio, stereo output, MIDI in and out, and USB-C.
stock_firmware: 1.9.2
links:
  manufacturer: https://polyend.com/tracker/
notes: >-
  Official firmware 1.9.2 dates from October 2025. Some of the third-party
  firmware work here targets older releases, such as RETracker on 1.5.0. Polyend
  also publishes an open library for the instrument, pattern and project files,
  and a community browser tool builds sliced instruments. Tracker Community
  Edition is Polyend's own community firmware, built from its firmware source,
  and also covers the Tracker+ and Tracker Mini.
related: [polyend-tracker-plus, polyend-tracker-mini, polyend-medusa]
