name: Algoradix
manufacturer: Roffa Logics
category: eurorack
added: 2026-11-05
tagline: Open-hardware 12 HP Eurorack voice built around an Axoloti Core
description: >-
  Algoradix is a 12 HP Eurorack synth voice that puts an Axoloti Core v1.2 behind a panel with eight pots, six CV
  inputs, stereo audio in and out, TRS MIDI in and out, an encoder, a gate and function button and a small OLED. The
  Core's micro-SD slot, mini-USB and USB host port come through the panel. Three modules were hand-built by the
  designer, who says there are no plans to make or sell more. The interface and connector boards, panel, bill of materials
  and notes are published as open hardware.
platform: STM32F427 (Arm Cortex-M4, 168 MHz), Axoloti Core v1.2 with ADAU1961 codec and 8 MB SDRAM
links:
  manufacturer: https://github.com/Gianducaconte/algoradix-hardware
  community:
    - label: Algoradix firmware
      url: https://github.com/Gianducaconte/algoradix-firmware
notes: >-
  Not a commercial product: the design is published for others to build. It was first made to run patches from the
  Axoloti patcher and now runs its own firmware. The hardware repository is licensed CERN-OHL-S-2.0. The Axoloti Core's
  ROM bootloader stays available for recovery over DFU.
