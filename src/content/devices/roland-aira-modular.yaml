    - label: Roland TORCIDO
      url: https://www.roland.com/global/products/torcido/
notes: >-
  One entry covers all four modules because they share a single system update
  file. No replacement firmware is listed. A custom SYSTEM-1m oscillator build
  for the Scooper and Demora is not catalogued because its repository bundles
  a modified copy of Roland's firmware image and Customizer files for a current
  product. The tool here works on your own backup of a unit and does not carry
  any Roland code.
