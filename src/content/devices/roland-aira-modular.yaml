name: AIRA Modular
manufacturer: Roland
category: eurorack
added: 2026-10-20
tagline: Bitrazer, Demora, Torcido and Scooper Eurorack effect modules
description: >-
  AIRA Modular is a set of four Eurorack effect modules from Roland: Bitrazer
  (crusher), Demora (delay), Torcido (distortion) and Scooper (scatter and
  looper). Each has CV and gate inputs and is patched with the AIRA Modular
  Customizer on a computer, which loads user-built signal chains onto the unit.
  The four units run the same system program, and a stored product value
  decides which of them a given unit behaves as.
stock_firmware: "1.05"
links:
