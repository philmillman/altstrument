name: D-05
manufacturer: Roland
category: synth
added: 2026-11-03
tagline: Boutique-series module with D-50 Linear Arithmetic sounds
description: >-
  The D-05 is a Boutique-series module from Roland that recreates the Linear Arithmetic synthesis of the 1987 D-50. It is
  compatible with original D-50 patches and has a 64-step polyphonic sequencer and arpeggiator. It runs on four AA batteries or
  USB power and has a built-in mini speaker.
links:
  manufacturer: https://www.roland.com/global/products/d-05/
notes: >-
  Roland lists the D-05 as discontinued. No custom firmware is known; the entries here are host-side editors.
related: [roland-boutique, roland-d-50]
