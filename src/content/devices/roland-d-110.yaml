name: D-110
manufacturer: Roland
category: synth
added: 2026-11-03
tagline: Rack module with Linear Arithmetic sounds and eight parts
description: >-
  The D-110 is a rack sound module from Roland that uses Linear Arithmetic synthesis. It plays eight melodic parts plus a rhythm
  part, with 64 patches and 64 programmable tones, and a set of reverb and part settings stored in its system area. It is edited
  over MIDI System Exclusive.
notes: >-
  Rosetta OS replaces the operating system EPROM, and Rosetta ROM swaps the wave ROMs for flash chips;
  both keep the original chips so the unit can go back to stock. The other entry is a host-side editor
  that works over SysEx.
related: [roland-d-50, roland-d-05]
