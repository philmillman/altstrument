name: D-50
manufacturer: Roland
category: synth
added: 2026-11-03
tagline: 1987 Linear Arithmetic synthesizer
description: >-
  The D-50 is a keyboard synthesizer that Roland released in 1987. It combines sampled attack transients with synthesized
  sustain in its Linear Arithmetic method, and each patch layers an upper and a lower tone built from two partials each. Its
  memory holds 64 internal patches, and a memory card slot adds more. Patches and tones can be edited over MIDI System Exclusive.
links:
  manufacturer: https://www.roland.com/global/roland-50th-anniversary/1980s/
notes: >-
  No custom firmware is known; the entries here are host-side editors that work over SysEx.
