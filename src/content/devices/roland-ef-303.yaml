name: EF-303
manufacturer: Roland
category: other
added: 2026-11-03
tagline: Desktop groove effects unit with a step modulator
description: >-
  The EF-303 Groove Effects is a desktop multi-effects unit from Roland. It has sixteen effect types, a 16-step modulator and
  eight control knobs that can be assigned to effect parameters, and it keeps its settings as patches. It is controlled over MIDI
  with Roland System Exclusive messages.
notes: >-
  No custom firmware is known; the entry here is a host-side editor.
