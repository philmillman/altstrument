name: GP-16
manufacturer: Roland
category: other
added: 2026-11-06
tagline: Rack-mount guitar processor with a chain of DSP effect blocks and MIDI control
description: >-
  The GP-16 is a rack-mounted guitar effects processor from Roland. A block chain of compressor, distortion, filter,
  phaser, EQ, gate, delay, modulation and reverb is run by two DSP chips, and a NEC V25 CPU runs the program from a
  128 KB mask ROM. Patches are stored in battery-backed RAM and can be sent as MIDI System Exclusive.
platform: NEC V25
stock_firmware: Super GP Ver 1.0
notes: >-
  The one project here, Rosetta OS, is built from a dump of your own IC11 and runs from a flash chip that replaces it,
  so installing it means opening the case. Keep the original chip to return to stock. Roland's own firmware is not
  hosted here.
