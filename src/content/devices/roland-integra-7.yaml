name: INTEGRA-7
manufacturer: Roland
category: synth
tagline: Two-unit rack sound module with SuperNATURAL and PCM sounds
description: >-
  The INTEGRA-7 is a rack sound module from Roland with 128-voice polyphony and 16 parts. Its tones come from the
  SuperNATURAL acoustic, synth and drum engines and from PCM synth and drum kits, and it can load Roland's SRX expansion sounds
  into virtual slots. It has a USB port that streams audio and handles MIDI, plus DIN MIDI and individual outputs.
links:
  manufacturer: https://www.roland.com/global/products/integra-7/
notes: >-
  No custom firmware is known; the entry here is a host-side tool that reads the unit over SysEx.
