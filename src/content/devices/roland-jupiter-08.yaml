name: JUPITER-08
manufacturer: Roland
category: synth
added: 2026-11-03
tagline: Roland's compact Jupiter-8 recreation with a keyboard dock
description: >-
  The JUPITER-08 is a Boutique-series instrument from Roland that recreates the Jupiter-8 in a small chassis. It has a
  step sequencer with motion recording, an arpeggiator, onboard effects, USB-C audio and MIDI, DIN MIDI and an external clock
  input, and it ships with a K-25m keyboard dock. It is a different instrument from the JP-08 Boutique module.
links:
  manufacturer: https://www.roland.com/global/products/jupiter-08/
notes: >-
  The unit does not accept SysEx, so patches move in bulk only through a whole-unit backup and restore over its USB drive
  mode. No custom firmware is known; the entry here is a host-side librarian.
related: [roland-boutique]
