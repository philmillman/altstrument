name: JV-1010
manufacturer: Roland
category: synth
tagline: 64-voice rack module with the Session expansion built in
description: >-
  The JV-1010 is a compact sound module from Roland with 64-voice polyphony. It carries the patches of the JV-2080 and the
  sounds of the Session expansion board, and it has one slot for an SR-JV80 series wave expansion board. User memory holds 128
  patches and 64 performances, and the module is edited over MIDI System Exclusive.
links:
  manufacturer: https://www.roland.com/global/products/jv-1010/
notes: >-
  No custom firmware is known; the entry here is a host-side SysEx tool.
