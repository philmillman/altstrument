name: JX-10 Super JX
manufacturer: Roland
category: synth
added: 2026-10-20
tagline: 1986 twelve-voice analog synthesizer from Roland
description: >-
  The JX-10 Super JX is a 76-key analog synthesizer made by Roland between 1986
  and 1989. It has twelve voices with two digitally controlled oscillators each,
  reduced to six voices in dual mode, and can split or layer two tones. A PG-800
  programmer can be connected for editing. Roland also made a rack-mounted
  version, the MKS-70.
links:
  community:
