      url: https://en.wikipedia.org/wiki/Roland_JX-10
    - label: Vecoven Super JX page
      url: https://vecoven.com/superjx/superjx.html
notes: >-
  The Vecoven firmware for this synth, which replaces the assigner ROM with an
  EPROM or flash module, is listed under the MKS-70 because the editors here
  target the rack version. It supports both machines. Entries here are tools
  written only for the JX-10 itself, such as DIY front panels built around its
  assigner and voice boards.
