name: JX-8P
manufacturer: Roland
category: synth
added: 2026-10-21
tagline: 1985 six-voice analog polyphonic synthesizer from Roland
description: >-
  The JX-8P is a 61-key analog synthesizer released by Roland in 1985. It has
  six voices with two digitally controlled oscillators each, velocity and
  aftertouch response, a chorus and MIDI. Most parameters are edited with a
  single slider and a table of parameter numbers, and the PG-800 programmer
  adds dedicated sliders. A cartridge slot holds extra patch memory.
links:
