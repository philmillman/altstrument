    - label: Vecoven JX-8P firmware page
      url: https://vecoven.com/jx8p/jx8p.html
notes: >-
  The Vecoven firmware replaces the synth's program EPROM with a flash module
  that plugs into the same socket, so installing it means opening the case but
  needs no soldering. The module has to match the board revision (A2 or A3)
  of the instrument. The original EPROM can be kept to return to stock.
