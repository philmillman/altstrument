name: MT-32
manufacturer: Roland
category: synth
tagline: 1987 multi-timbre LA synthesis sound module
description: >-
  The MT-32 is a multi-timbral sound module from Roland, released in 1987. It uses LA
  synthesis, which combines short sampled attacks with synthesized tones, and has user
  memory for 64 timbres, 128 patches and a rhythm part. It is edited over MIDI SysEx, and its
  compatibles include the CM-32L and the Munt software emulator.
links:
