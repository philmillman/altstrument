name: OCTA-CAPTURE
manufacturer: Roland
category: other
added: 2026-11-07
tagline: Hi-Speed USB audio interface with eight mic preamps
description: >-
  The OCTA-CAPTURE (model UA-1010) is a rack-style USB audio interface from Roland with eight microphone preamps, a
  128 by 64 LCD that shows levels and settings, a pre-amp section with a cursor and value knob and a direct monitoring
  mixer. It connects to a computer over Hi-Speed USB. Roland ships updates for it as a system program file that the unit
  installs from a disk it presents to the computer.
platform: Analog Devices Blackfin BF52x
stock_firmware: "1.51"
links:
  manufacturer: https://www.roland.com/global/products/octa-capture/
notes: >-
  The one project here, Rosetta OS, is a work in progress that patches Roland's update file. Its author reports the boot
  screen working on hardware. Roland's own firmware is not hosted here.
