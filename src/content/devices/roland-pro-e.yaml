name: PRO-E
manufacturer: Roland
category: synth
added: 2026-11-06
tagline: 1989 Intelligent Arranger keyboard with built-in styles and an MT-32 style voice board
description: >-
  The PRO-E is an arranger keyboard that Roland released in 1989 as part of its
  E-series Intelligent Arranger line. It plays accompaniment styles chosen from
  a bank of 4 by 8 panel buttons and following the chords played in the left
  hand. Sounds come from a voice board that is based on the MT-32 and CM-32L,
  and styles can also be loaded from TN-SC1 cards. A Motorola 68HC11 runs the
  arranger itself and an Intel 8098 runs the voice board, each from its own ROM.
platform: Motorola 68HC11 and Intel 8098
stock_firmware: "2.00"
links:
  manufacturer: https://www.roland.com/global/support/by_product/pro-e/
  community:
    - label: Roland Modding Discord
      url: https://discord.gg/R3CQkFdRtf
notes: >-
  The one project here, Rosetta OS, is built from dumps of your own ROM chips and
  runs from newly programmed chips that replace the originals, so installing it
  means opening the case and swapping chips. Keep the originals to return to
  stock. Roland's own ROM data is not hosted here.
