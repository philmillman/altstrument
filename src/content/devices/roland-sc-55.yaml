name: Sound Canvas SC-55
manufacturer: Roland
category: synth
added: 2026-11-03
tagline: 1991 GS sound module used as a MIDI reference
description: >-
  The SC-55 Sound Canvas is a rack-style sound module from Roland, released in 1991. It was the
  first unit to use Roland's GS format, which extends General MIDI with extra sounds
  and with controls that are changed by SysEx messages. The SC-55mkII and SC-88
  respond to related GS messages.
links:
  manufacturer: https://www.roland.com/global/roland-50th-anniversary/1990s/
notes: >-
  No custom firmware is known; the entry here is a browser tool that builds the SysEx
  messages it accepts.
