name: SP-404MKII
manufacturer: Roland
category: sampler
added: 2026-10-13
tagline: 16-pad sampler with onboard effects and pattern sequencer
description: >-
  The SP-404MKII is a compact sampler from Roland, released in 2021 as the
  successor to the SP-404 line. It has 16 velocity-sensitive RGB pads plus a sub
  pad, 32-voice polyphony, 16 GB of internal storage and a graphic OLED display.
  The unit includes a large set of bus effects, a pattern sequencer with real-time
  and step recording, a mic and guitar input, MIDI in and out, and USB-C audio.
  It can run from mains power, USB, or AA batteries.
stock_firmware: "5.52"
links:
  manufacturer: https://www.roland.com/global/products/sp-404mk2/
  community:
    - label: DOOM OS manual
      url: https://klangfeldlabs.com/doom-os/manual/
notes: >-
  The custom firmware here is a layer on top of Roland's own system rather than a
  replacement for it. DOOM OS and its fork are built by patching the official 5.52
  update file in your browser, and running the updater with Roland's original file
  restores stock. The host-side tools (open404, SparkyMK2, sp404mk2-tools) talk to
  the unit over USB or read its project files and do not change the firmware.
