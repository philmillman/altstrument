name: SPD-SX PRO
manufacturer: Roland
category: sampler
added: 2026-11-05
tagline: 9-pad sampling pad with trigger inputs and 32 GB of sample storage
description: >-
  The SPD-SX PRO is a sampling pad from Roland, announced in September 2022 as
  the flagship of the SPD line. It has nine pads, four trigger input jacks that
  take up to eight external pads or triggers, and 32 GB of internal storage
  holding 200 kits and over 1,550 preloaded samples. Each pad plays a top and a
  bottom sample layer. Outputs are a balanced stereo master pair and four direct
  outs, with a USB computer port for audio, MIDI and Roland's app, and a USB
  memory port for backups and sample transfer.
stock_firmware: "2.00"
links:
  manufacturer: https://www.roland.com/global/products/spd-sx_pro/
notes: >-
  No replacement firmware is listed here. The entries are host-side tools that
  talk to the stock firmware over its USB serial protocol, and the kit editor
  requires system program 2.00. Tools for the original SPD-SX are on its own
  page because it uses a different format and connection, working through files
  on a mounted drive instead of a USB serial protocol.
