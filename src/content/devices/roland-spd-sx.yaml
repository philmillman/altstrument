name: SPD-SX
manufacturer: Roland
category: sampler
added: 2026-11-05
tagline: 9-pad sampling pad with trigger inputs and 16 GB of sample storage
description: >-
  The SPD-SX is a sampling pad from Roland, introduced in 2011. It has nine
  velocity-sensitive rubber pads with LED indicators and two trigger inputs
  that take up to four external pads through splitter cables. It holds 16 GB of
  internal storage, listed as about 25 hours of stereo audio (50 hours of mono)
  as 16-bit, 44.1 kHz WAV or AIFF, in up to 10,000 waves. Outputs are master
  and sub pairs and a headphone jack, with an audio input for sampling.

  A USB computer port carries audio and MIDI, and a USB memory port takes a
  flash drive for importing sounds and saving settings. Roland's free SPD-SX Wave
  Manager for macOS and Windows imports samples, assigns them to pads and
  organizes kits while the unit is in its WAVE MGR USB mode, in which it
  appears to the computer as a drive. The SPD-SX Special Edition is a variant
  with the same Wave Manager and system program listings; Roland's page for it
  describes it as working the same way as the SPD-SX, with 16 GB of storage and
  a red finish.
stock_firmware: "1.10"
links:
  manufacturer: https://www.roland.com/global/products/spd-sx/
notes: >-
  No replacement firmware is listed here. The entries are host-side tools that
  edit the kit and wave files the unit exposes in WAVE MGR mode, with the
  exception of Core SX's Instrument mode, which plays the pads from a computer.
  Roland lists system program 1.10 as the current one for both the SPD-SX and
  the Special Edition. In WAVE MGR mode the unit cannot be played as a drum
  module, and the tools overwrite its files, so back up the unit's contents
  first.
