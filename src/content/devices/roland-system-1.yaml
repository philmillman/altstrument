name: SYSTEM-1
manufacturer: Roland
category: synth
added: 2026-11-22
tagline: 32-key PLUG-OUT synthesizer with one swappable software-synth slot
description: >-
  The SYSTEM-1 is a 32-key synthesizer from Roland's AIRA range with its own
  SYSTEM-1 engine and a single PLUG-OUT slot. Roland's PLUG-OUT versions of
  instruments such as the SH-101 and the Promars are installed from a computer
  over USB. The Eurorack SYSTEM-1m uses the same PLUG-OUT system.
platform: ARM with DSP slaves
links:
  manufacturer: https://www.roland.com/global/products/system-1/
notes: >-
  Roland's own PLUG-OUT installer is the supported way to fill the slot. The
  only third-party work catalogued is a reverse-engineered SDK that writes its
  own engines into the PLUG-OUT slot, replacing the Roland PLUG-OUT that was
  there; the base OS is not touched, and reinstalling the Roland PLUG-OUT
  restores the slot.
related: [roland-system-8]
