name: SYSTEM-8
manufacturer: Roland
category: synth
added: 2026-11-22
tagline: PLUG-OUT synthesizer with three swappable software-synth slots
description: >-
  The SYSTEM-8 is a 49-key synthesizer from Roland's AIRA range that runs its
  own SYSTEM-8 engine and up to three PLUG-OUT synthesizers loaded into slots.
  Roland ships PLUG-OUT versions of classic instruments such as the Jupiter-8,
  Juno-106 and JX-3P, installed from a computer over USB, and the unit takes
  MIDI and USB audio.
platform: ARM with DSP slaves
stock_firmware: "1.32"
links:
  manufacturer: https://www.roland.com/global/products/system-8/
notes: >-
  Roland's own PLUG-OUT installer is the supported way to fill a slot. The
  only third-party work catalogued is a reverse-engineered SDK that writes its
  own engines into the PLUG-OUT slots; the base OS and bootloader are not
  touched, and reinstalling a Roland PLUG-OUT restores a slot.
related: [roland-system-1]
