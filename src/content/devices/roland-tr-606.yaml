notes: >-
  The sequencer firmware is a mask ROM inside the µPD650C. SuperOS-606 does not replace it in place; it asks you to
  swap the chip for an AT90USB1286 board in the same socket, which adds MIDI. Its own project can optionally emulate the
  original chip, but only from a ROM dump you supply. Roland's stock program is copyrighted and no copy is
  catalogued here.
