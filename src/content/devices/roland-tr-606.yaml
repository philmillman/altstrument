name: TR-606 Drumatix
manufacturer: Roland
category: drum-machine
added: 2026-11-03
tagline: 1981 analog drum machine companion to the TB-303
description: >-
  The TR-606 Drumatix is an analog drum machine that Roland released in 1981 as a companion to the TB-303 Bass Line.
  It has seven drum voices, 32 patterns that can be chained into tracks, and a sixteen-step pattern keypad. A
  NEC µPD650C four-bit microcontroller in a socket on the main board runs the sequencer. The unit has DIN sync jacks
  and no MIDI.
links:
