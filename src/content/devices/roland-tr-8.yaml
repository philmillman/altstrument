name: TR-8
manufacturer: Roland
category: drum-machine
added: 2026-11-12
tagline: AIRA rhythm performer with 808 and 909 sounds modelled in Roland's ACB
description: >-
  The TR-8 is a drum machine from Roland's AIRA line, with eleven instruments modelled on the TR-808 and TR-909, 16-step
  patterns with A and B variations, a Scatter effect and per-instrument tune, decay and level controls. It
  connects over USB for audio and MIDI and takes system updates by copying a file to a USB drive that it mounts in
  update mode. The TR-8S later replaced it in Roland's line.
links:
  manufacturer: https://www.roland.com/global/products/tr-8/
notes: >-
  The one custom firmware patches Roland's system program 1.61 and adds motion recording. The update flashes only
  the application area, and holding step button 1 at power-on reaches the updater even when the application is
  modified, so the original file can be reinstalled. Roland says a power cut while the update writes needs service.
related: [roland-tr-8s]
