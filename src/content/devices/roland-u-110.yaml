name: U-110
manufacturer: Roland
category: synth
added: 2026-11-06
tagline: 1988 PCM sound module with sample card slots
description: >-
  The U-110 is a rack sound module from Roland that plays sampled PCM sounds, with a built-in set of tones and four
  slots for plug-in sample cards. Each part picks a tone group, and the cards add more waveforms. The same card format is
  read by related Roland modules and the D-70.
links:
  manufacturer: https://www.roland.com/global/roland-50th-anniversary/1980s/
notes: >-
  The one entry here is a Windows tool that builds card images to burn on a flash chip in a card-slot adapter. It does
  not change the unit's own firmware.
