name: Assimil8or
manufacturer: Rossum Electro-Music
category: eurorack
added: 2026-10-29
tagline: eight-channel phase modulation sampler Eurorack module
description: >-
  The Assimil8or is a Eurorack sampler from Rossum Electro-Music that plays up to
  eight channels from samples stored on a memory card. Each channel has its own
  gate, three CV inputs and output, and any sample can be modulated in phase by
  another channel. Presets and sample files are kept on the card, and the module
  has stereo sample inputs for recording.
platform: ARM
stock_firmware: "3.04"
links:
  manufacturer: https://www.rossum-electro.com/products/assimil8or
  community:
    - label: Rossum downloads (software and manuals)
      url: https://www.rossum-electro.com/pages/downloads
notes: >-
  The module updates its software from an app file on the memory card, using
  Utilities > Load Software. The one catalogued mod is applied by a browser
  patcher to your own copy of Rossum's software, so Rossum's file is never
  redistributed here.
