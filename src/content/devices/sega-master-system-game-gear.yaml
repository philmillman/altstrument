name: Master System / Game Gear
manufacturer: Sega
category: handheld
added: 2026-10-18
tagline: Sega's 8-bit console and its handheld sibling, which share a Z80 and a four-voice sound chip
description: >-
  The Master System is an 8-bit home console released by Sega in 1985 in Japan and in 1986 and 1987 elsewhere, and
  the Game Gear is its handheld successor from 1990. Both use a Zilog Z80 processor and a Texas Instruments
  SN76489-compatible sound chip with three square-wave channels and a noise channel. The Game Gear adds stereo
  panning for each channel, and the Japanese FM Sound Unit adds a Yamaha YM2413 FM chip to the Master System.

  SMSGGDJ is a tracker that builds both a Master System ROM and a Game Gear ROM from one source tree. A bridge
  firmware for ESP32 boards lets it follow Ableton Link tempo.
platform: Zilog Z80 with SN76489-compatible PSG (optional YM2413 FM)
