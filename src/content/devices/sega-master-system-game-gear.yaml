notes: >-
  Homebrew ROMs run from a flash cartridge or in an emulator. SMSGGDJ's YM2413 FM mode needs a Master System with
  the FM Sound Unit or a Game Gear with the GGFM hardware modification; sync with a computer goes through a
  controller or EXT port adapter such as Chipbridge. Developer sound libraries for the SN76489, and desktop trackers
  that only export music for these consoles, are not catalogued. This one device covers both consoles because the
  same ROM source and sound chip serve both.
