notes: >-
  Homebrew ROMs run from a flash cartridge such as a Mega EverDrive, or in an emulator. The Mega Drive MIDI
  Interface ROM talks to a computer through the EverDrive's USB port or a serial cable on a controller port. The
  commercial GenMDM interface by little-scale, sold by Catskull Electronics, plugs into controller port 2 and has
  closed firmware, so it is not catalogued. Desktop trackers that only export ROMs, such as Furnace and DefleMask,
  are not catalogued either. The Nomad handheld version is covered by genmddj.
