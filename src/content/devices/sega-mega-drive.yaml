name: Mega Drive / Genesis
manufacturer: Sega
category: handheld
added: 2026-10-18
tagline: Sega's 16-bit console, with an FM chip that homebrew trackers and MIDI ROMs drive directly
description: >-
  The Mega Drive, sold as the Genesis in North America, is a 16-bit home console released by Sega in 1988. A
  Motorola 68000 handles the main program and a Zilog Z80 runs the sound side, which has a Yamaha YM2612 six-channel
  FM synthesizer with a sample channel and a Texas Instruments SN76489 PSG with three square waves and noise.

  The Mega Drive music software here is homebrew that runs on the console. genmddj is a tracker, and the Mega Drive
  MIDI Interface ROM makes the console a MIDI-controlled synthesizer, with desktop editors and a command line
  tool for its presets.
platform: Motorola 68000 and Zilog Z80, with Yamaha YM2612 and TI SN76489 sound chips
links:
