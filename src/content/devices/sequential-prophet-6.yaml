name: Prophet-6
manufacturer: Sequential Circuits
category: synth
added: 2026-11-03
tagline: Six-voice analog polysynth, keyboard or desktop module
description: >-
  The Prophet-6 is a six-voice analog polyphonic synthesizer from Dave Smith
  Instruments, now Sequential, released in 2015. Each voice has two oscillators, a
  low-pass filter and a high-pass filter, with poly mod, digital effects, an
  arpeggiator and a step sequencer. It comes as a 61-key keyboard and as a desktop
  module, and its programs travel over MIDI as SysEx dumps and NRPN messages.
links:
  manufacturer: https://sequential.com/modern-analog/prophet-6/
notes: >-
  No custom firmware is known; the entries are editors and librarians.
