name: Prophet-600
manufacturer: Sequential Circuits
category: synth
added: 2026-10-13
tagline: Six-voice analog polysynth
description: >-
  The Prophet-600 is a six-voice analog polyphonic synthesizer made by
  Sequential Circuits in 1982. Each voice has two digitally controlled
  oscillators, and the synth stores 100 programs in battery-backed memory. It
  was one of the first synthesizers to include a MIDI interface. A Z80
  microprocessor runs the instrument.
platform: Z80
links:
  community:
    - label: P600FW project page
      url: https://gligli.github.io/p600fw/
    - label: Prophet 600 revisited (blog)
      url: https://prophet600revisited.blogspot.com/
notes: >-
  P600FW is a hardware-plus-firmware replacement: a slightly modified Teensy++
  board plugs into the Z80 socket in place of the stock CPU, so this is not a
  software-only update.
