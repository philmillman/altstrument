notes: >-
  The project calls itself early. Rev C boards have been made and run the firmware; the board files in the repository
  are rev D, which was still being tested in October 2026. The project sells hand-built units on request and runs a
  workshop where a kit is included. Firmware and tools are GPL-3.0, the plugin AGPL-3.0, and the circuit boards,
  documents and pictures CC BY-SA 4.0. The repository has no photograph of a finished unit yet, only renders of the
  board design, so this entry has no image.
