name: OpenDeck boards
manufacturer: Shantea Controls
category: diy-platform
added: 2026-10-13
tagline: Open MIDI and OSC controller platform for custom hardware
description: >-
  OpenDeck is an open-source platform for building MIDI controllers, developed
  by Shantea Controls in Zagreb, Croatia. It handles buttons, encoders,
  potentiometers and force-sensitive resistors as inputs, drives single-colour
  and RGB LEDs, and supports Nextion touchscreens. Controllers send USB MIDI and
  DIN MIDI, with BLE MIDI and OSC on selected boards, and are configured through
  a browser-based configurator.
platform: RP2040, ESP32-S3, STM32, nRF, Teensy 4 (Zephyr RTOS)
links:
  manufacturer: https://shanteacontrols.com/
  community:
    - label: OpenDeck configurator
      url: https://config.shanteacontrols.com/
notes: >-
  One official board is sold, the OpenDeck L (RP2040, 128 digital inputs, DIN
  and USB MIDI, no OSC). The firmware also runs on a long list of third-party
  development boards, including Teensy 4.0/4.1, Raspberry Pi Pico and Pico 2,
  Adafruit Metro and several ST Nucleo and Discovery boards; OSC needs an
  Ethernet-capable board.
