name: WT VCO
manufacturer: SHOT MODULES
category: other
added: 2026-11-05
tagline: Wavetable oscillator module for the AE Modular system with open hardware and firmware
description: >-
  WT VCO is a wavetable oscillator module for the 5 V AE Modular format, designed and sold by SHOT MODULES. A
  Waveshare RP2350-Zero generates the audio through a PCM5102A converter, and a PIC16F18426 reads four knobs
  (coarse and fine frequency, wavetable position and FM depth) and the wavetable and FM control voltage inputs.
  The V/OCT input is read by an ADS1115 and by the RP2350's own converter, and the two readings are combined.
  Calibration runs from a USB serial console and is stored in flash. The schematic, parts list and firmware are
  published in the maker's repository.
platform: RP2350 and PIC16F18426
links:
  manufacturer: https://github.com/sazuma0219-sudo/wt-vco
notes: >-
  The firmware is the module's own, published by its maker, so it is listed with the official tag. AE Modular
  modules are not Eurorack, so this device uses the other category. The repository holds no photograph of the module,
  so the device has no image.
