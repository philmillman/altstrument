name: ChordBox
manufacturer: simonmueller-git
category: controller
tagline: DIY ESP32-S3 chord and bass instrument for USB-MIDI, built with the Ableton Move in mind
description: >-
  ChordBox is a home-built instrument with 16 keypad pads, two screens and two
  encoders around an ESP32-S3 development board. Its native USB-C port acts as a
  USB-MIDI device, and it was made to plug into an Ableton Move, which supplies
  power and the clock; any other USB-MIDI host works as well. The parts list and
  wiring diagram are in the project's repository, and there is no stock
  firmware: the firmware in the repository is what makes the board an instrument.
platform: ESP32-S3
links:
  manufacturer: https://github.com/simonmueller-git/ChordBox
notes: >-
  A one-person project with no manufacturer and no sold kit. The repository
  carries the bill of materials, a wiring diagram and the firmware, and its
  author says it was built and tested with one set of parts and one Move. It
  has no photograph of the finished build, so this entry has no device image.
related: [ableton-move]
