name: Amphonix 2
manufacturer: Sonicake
category: pedal
added: 2026-11-23
tagline: Plug-in Bluetooth headphone guitar amp with 50 presets and NAM support (QAP-50)
description: >-
  The Amphonix 2 (QAP-50) is a palm-sized headphone guitar amp from Sonicake
  that plugs straight into a guitar's jack. It has no screen and no footswitches:
  a power key and three preset keys A, B and C with LEDs do the work. It has 50
  factory presets and nine user preset slots, supports Neural Amp Modeler
  captures and cabinet IRs in five slots each, plays Bluetooth audio and works
  as a USB-C audio interface, and runs on a built-in rechargeable battery.
  Sonicake Manager and the SONICLINK phone app edit it.
stock_firmware: V1.0.2
links:
  manufacturer: https://www.sonicake.com/products/amphonix-ii
  community:
    - label: Sonicake firmware and software downloads
      url: https://www.sonicake.com/pages/amphonix-ii-software-firmware-download-qap-50
notes: >-
  Sonicake publishes only its own firmware updates and offers no SDK. The only
  custom firmware is the Amphonix 2 CFW, a binary-only patched build of Sonicake's
  V1.0.2 firmware, installed over USB.
