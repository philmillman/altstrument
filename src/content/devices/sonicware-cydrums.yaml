name: CyDrums
manufacturer: Sonicware
category: drum-machine
added: 2026-11-04
tagline: Battery-powered drum synthesizer with wavetable voices and 8 tracks
description: >-
  The CyDrums is a battery-powered drum synthesizer from Sonicware with a built-in speaker. Its
  voices combine two wavetable oscillators with noise and tick sources in 22 sound structures,
  and it ships with 550 preset sound patches. Eight tracks run a 128-step sequencer with 128
  patterns per project and 16 songs. It has velocity and pressure sensitive pads, analog output
  on TRS jacks, MIDI in and out, and USB.
stock_firmware: "1.1.84"
links:
  manufacturer: https://sonicware.jp/pages/cydrums
notes: >-
  No custom firmware or tools are catalogued. Firmware comes as a .zip package from Sonicware's
  downloads page, which also offers a v2.0 beta, and its page does not describe the update steps.
