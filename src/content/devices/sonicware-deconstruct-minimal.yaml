name: deconstruct MINIMAL
manufacturer: Sonicware
category: groovebox
added: 2026-11-04
tagline: Compact drum, bass and sampler groovebox with 11 tracks and a 128-pattern memory
description: >-
  The deconstruct MINIMAL is a compact groovebox from Sonicware with ten drum tracks and one
  bass track. The drums are sample-based, with dedicated synthesis for the first bass drum and the
  snare, the bass is an analog-modelled synth with an acid-style ladder filter, and the last four
  drum tracks can act as samplers. Patterns hold 16 steps in 4 variations that can be chained to 64
  steps, with 128 patterns, and it has a 27-key row and a built-in speaker. MIDI and sync use 3.5 mm
  jacks, and a USB-C port carries data, MIDI and audio.
stock_firmware: "1.0.58"
links:
  manufacturer: https://sonicware.jp/pages/deconstruct-minimal
notes: >-
  No custom firmware or tools are catalogued. Firmware comes as a .zip package from Sonicware's
  downloads page, and its page does not describe the update steps.
