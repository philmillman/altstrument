name: ELZ_1 core
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Keyless compact version of the ELZ_1 play with a colour screen and 25 LED buttons
description: >-
  The ELZ_1 core is a compact synthesizer module from Sonicware, described by Sonicware as the
  keyless version of the ELZ_1 play. It has the same 18 sound engines with up to three oscillator
  layers per sound and a single-track sequencer with 128 steps and 128 patterns. A 2.4-inch colour
  screen, five encoders and 25 LED buttons form the control surface, and it is played from a USB
  or 5-pin MIDI controller. It includes a 32 GB card and has USB-C audio, MIDI and mass storage.
links:
  manufacturer: https://sonicware.jp/pages/elz_1-core
notes: >-
  No custom firmware or tools are catalogued. Sonicware's downloads page lists no firmware for it,
  and its page does not describe the update method.
related: [sonicware-elz-1, sonicware-elz-1-play]
