name: ELZ_1 play
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Portable synth with a four-track stereo looper and 37 velocity keys
description: >-
  The ELZ_1 play is a portable synthesizer from Sonicware with a four-track stereo looper and
  built-in speakers. It has 18 sound engines, up to three oscillators can be layered, and one
  engine plays drum kits made for SmplTrek. It has 37 velocity-sensitive keys and a sequencer
  with 128 steps and 128 patterns, ships with a 32 GB card, and offers 5-pin DIN MIDI and a USB-C
  port for audio, MIDI and mass storage.
stock_firmware: "3.1.149"
links:
  manufacturer: https://sonicware.jp/pages/elz_1-play
notes: >-
  No custom firmware is known. Firmware comes as a .zip package from Sonicware's downloads page
  and is applied through the card. Its catalogued entry is STK Writer, a tool for kit files.
related: [sonicware-elz-1, sonicware-elz-1-core]
