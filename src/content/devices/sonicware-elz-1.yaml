name: ELZ_1
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Compact battery-powered digital synth with a built-in speaker and USB MIDI
description: >-
  The ELZ_1 is a compact digital synthesizer from Sonicware with a built-in speaker. Its sound
  engines include 4-operator FM with 31 algorithms, an 8-bit wave memory synth, a granular engine
  and an engine that derives waveforms from audio, with six voices of polyphony. The sequencer
  holds 64 steps for 6 voices and 128 patterns. It runs from four AA batteries or 5V DC, and its
  USB port handles firmware updates, USB MIDI and USB host mode.
stock_firmware: "7.0.124"
links:
  manufacturer: https://sonicware.jp/pages/elz_1
notes: >-
  No custom firmware or tools are catalogued. Firmware comes as a .zip package from Sonicware's
  downloads page and is applied over USB.
related: [sonicware-elz-1-core, sonicware-elz-1-play]
