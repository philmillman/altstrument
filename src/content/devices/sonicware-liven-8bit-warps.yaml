name: LIVEN 8bit warps
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: 8-bit synth with four waveform engines and a four-track looper
description: >-
  The LIVEN 8bit warps is an 8-bit synthesizer from Sonicware with four engines named WARP,
  ATTACK, MORPH and FM. A single-track sequencer holds 128 steps and 128 patterns, and a looper
  gives four tracks, three internal and one for line input. It stores 128 patches and 128
  waveforms, has a 27-key keyboard, and offers 5-pin DIN MIDI in and out and sync jacks.
stock_firmware: "3.0.76"
links:
  manufacturer: https://sonicware.jp/pages/liven8bitwarps
notes: >-
  No custom firmware or tools are catalogued. Firmware updates travel as .syx files sent over
  MIDI SysEx.
