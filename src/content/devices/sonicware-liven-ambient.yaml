name: LIVEN Ambient Ø
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Four-layer soundscape synth with drone, pad, atmos and noise tracks
description: >-
  The LIVEN Ambient Ø is a soundscape synthesizer from Sonicware with four layers named Drone,
  Pad, Atmos and Noise, one per sequencer track. Drone and Pad use blendwave modulation synthesis,
  Atmos uses ring modulation or FM, and Noise can sample up to 8 seconds of stereo line input.
  Patterns run to 64 steps with per-step note probability, and it has a 27-key keyboard, 5-pin DIN
  MIDI in and out, and a built-in speaker. It runs on six AA batteries or an adapter.
stock_firmware: "1.5.45"
links:
  manufacturer: https://sonicware.jp/pages/liven-ambient
notes: >-
  No custom firmware is known. Firmware updates travel as .syx files sent over MIDI SysEx, and
  Sonicware also offers a Web MIDI updater page. Its catalogued entries are Sonicware's web
  tools and M5Liven, a controller that runs on an M5Stack Cardputer.
