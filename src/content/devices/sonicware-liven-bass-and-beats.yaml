name: LIVEN BASS&BEATS
manufacturer: Sonicware
category: groovebox
added: 2026-11-04
tagline: Wavetable bass synth and PCM rhythm machine with a 64-step sequencer
description: >-
  The LIVEN BASS&BEATS pairs a monophonic bass voice with a polyphonic rhythm machine. The bass
  uses two wavetable oscillators from a set of 64 wavetables, plus a sub oscillator and a noise
  generator, while the rhythm side plays more than 350 PCM drum sounds. Patterns run to 64 steps
  with 128 patterns, parameter locks and sequencer effects, and it has a 27-key keyboard, 5-pin
  DIN MIDI in and out, sync jacks, a line input and a built-in speaker.
stock_firmware: "1.1.27"
links:
  manufacturer: https://sonicware.jp/pages/liven-bassandbeats
notes: >-
  No custom firmware is known. Firmware updates travel as .syx files sent over MIDI SysEx. Its
  catalogued entries are Sonicware's wavetable converter and a community deconverter that turns
  wavetable SysEx back into audio.
