name: LIVEN Evoke
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Battery-powered synth that blends acoustic instrument samples with a granular effect
description: >-
  The LIVEN Evoke is a portable synthesizer from Sonicware with a built-in speaker and a 27-key
  keyboard. Its oscillator combines 34 acoustic instruments with 20 waveforms and two filtered
  noises, and a grain effect with up to 12 grains sits behind it, along with 10 reverb types. A
  four-track sequencer holds 64 steps per pattern and 128 patterns, and MIDI in and out use
  5-pin DIN jacks alongside sync and line inputs.
links:
  manufacturer: https://sonicware.jp/pages/liven-evoke
notes: >-
  No custom firmware or tools are catalogued. Firmware updates and user data travel as MIDI
  SysEx, and Sonicware lists no firmware for it on its downloads page.
