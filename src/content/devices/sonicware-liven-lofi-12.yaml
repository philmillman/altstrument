name: LIVEN Lofi-12
manufacturer: Sonicware
category: sampler
added: 2026-11-04
tagline: Lo-fi sampler groovebox with a 4-track, 64-step sequencer
description: >-
  The LIVEN Lofi-12 is a sampler groovebox from Sonicware. It records mono samples at 12 kHz or
  24 kHz and has a 12-bit sampling mode, with 128 sample slots arranged as 8 banks of 16. Four
  tracks run a 64-step sequencer with 64 patterns, parameter locks and sound locks, and the
  master effects include a cassette tape simulator and a vinyl simulator. It has a 27-key
  keyboard, 5-pin DIN MIDI in and out, sync jacks, a line input and a built-in speaker.
stock_firmware: "2.1.65"
links:
  manufacturer: https://sonicware.jp/pages/liven-lofi12
notes: >-
  No custom firmware is known. Firmware updates travel as .syx files sent over MIDI SysEx, and
  its catalogued entry is Sonicware's converter, which extracts WAV audio from sample dumps.
related: [sonicware-liven-lofi-6, sonicware-lofi-12-xt]
