name: LIVEN Lofi-6
manufacturer: Sonicware
category: sampler
added: 2026-11-04
tagline: Limited-run variant of the Lofi-12 that samples at 6 kHz
description: >-
  The LIVEN Lofi-6 is a limited edition of the Lofi-12 sampler groovebox that Sonicware made
  with the US retailer Perfect Circuit, in a run of 500 units. It samples at 6 kHz and 16-bit for
  up to 8 seconds in mono and has 128 sample slots. Four tracks use a 64-step sequencer with
  sound and parameter locks and 10-voice polyphony, and a tube mode adds saturation.
notes: >-
  No custom firmware or tools are catalogued. The facts here come from press coverage because
  Sonicware's site has no page for it, so how its firmware is delivered is unconfirmed; the
  Lofi-12 it is based on updates over MIDI SysEx.
related: [sonicware-liven-lofi-12, sonicware-lofi-12-xt]
