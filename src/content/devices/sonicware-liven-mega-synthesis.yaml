name: LIVEN MEGA SYNTHESIS
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Six-track retro game music synth with FM, PSG and PCM voices
description: >-
  The LIVEN MEGA SYNTHESIS is a six-track synthesizer from Sonicware aimed at retro game
  music. Three tracks play 4-operator FM voices with 8 algorithms, two play PSG voices of
  11 types, and one plays 8-bit PCM samples from 96 slots. The sequencer has 128 steps per
  pattern and 128 patterns, and the unit has a 27-key keyboard, 5-pin DIN MIDI in and out, and a
  built-in speaker. It runs from a 9V adapter or six AA batteries.
stock_firmware: "1.1.37"
links:
  manufacturer: https://sonicware.jp/pages/liven-mega-synthesis
notes: >-
  No custom firmware or tools are catalogued. Firmware updates travel as .syx files sent over
  MIDI SysEx.
