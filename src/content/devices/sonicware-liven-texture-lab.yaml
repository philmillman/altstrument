name: LIVEN Texture Lab
manufacturer: Sonicware
category: synth
added: 2026-11-04
tagline: Granular synthesizer and effector with a 128-step sequencer
description: >-
  The LIVEN Texture Lab is a granular instrument from Sonicware that works either as a four-voice
  synthesizer or as an effect on stereo line input. In synth mode it samples up to 6 seconds into
  one of 32 slots, and the effect mode can freeze 6 seconds of input. It has six reverbs with a
  shimmer control, a one-track sequencer with 128 steps and 128 patterns, a 27-key keyboard, and
  5-pin DIN MIDI in and out.
links:
  manufacturer: https://sonicware.jp/pages/liven-texturelab
notes: >-
  No custom firmware is known. Firmware updates and sample data travel as MIDI SysEx. Its
  catalogued entry is Sonicware's web audio converter, which turns WAV files into a SysEx file
  for import.
