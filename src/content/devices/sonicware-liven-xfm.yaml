name: LIVEN XFM
manufacturer: Sonicware
category: groovebox
tagline: Four-operator FM groovebox with a step sequencer
description: >-
  The LIVEN XFM is a compact FM groovebox from Sonicware. Its voices use four FM
  operators with their own envelopes, and it has a four-track sequencer, a row of touch
  keys and effects. It has MIDI in and out on DIN ports, and its patches and backups
  travel as MIDI SysEx dumps.
links:
  manufacturer: https://sonicware.jp/pages/liven-xfm
notes: >-
  No custom firmware is known; the entries are patch editors that use the SysEx dumps.
