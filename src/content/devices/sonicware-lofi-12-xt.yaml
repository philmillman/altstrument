name: Lofi-12 XT
manufacturer: Sonicware
category: sampler
added: 2026-11-04
tagline: Battery-powered lo-fi sampler with an 8-track sequencer and background mix-tape recording
description: >-
  The Lofi-12 XT is a portable sampler from Sonicware with a built-in microphone and speaker. It
  samples at 12 kHz or 24 kHz and has a 12-bit sampler mode, and it ships with an SD card holding
  more than 2,500 samples. An 8-track sequencer supports unquantized recording and parameter
  locks, track inserts offer 22 effect types, and a mix-tape function records a performance in
  the background for up to three hours. Audio files move in and out over USB or the card.
stock_firmware: "1.5.205"
links:
  manufacturer: https://sonicware.jp/pages/lofi12xt
notes: >-
  No custom firmware is known. Firmware comes as a .zip package from Sonicware's downloads page,
  and its page does not describe the update steps. Its catalogued entry is a pattern transfer
  tool.
related: [sonicware-liven-lofi-12, sonicware-liven-lofi-6]
