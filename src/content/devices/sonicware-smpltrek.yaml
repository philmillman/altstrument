name: SmplTrek
manufacturer: Sonicware
category: sampler
added: 2026-11-04
tagline: Portable production sampler with 10 tracks per scene and an SD card library
description: >-
  The SmplTrek is a portable sampler from Sonicware that records from a built-in microphone, its
  inputs or USB audio. Each song has 16 scenes, and each scene has 10 sequencer tracks that can
  hold loops, one-shots, drums, instruments or MIDI, plus 3 global audio tracks. It has 36 DSP
  effects and stores samples and recordings on an SD card, which can also be read from a computer
  through a card reader mode.
stock_firmware: "3.2.174"
links:
  manufacturer: https://sonicware.jp/pages/smpltrek
notes: >-
  No custom firmware is known. Firmware comes as a .zip package from Sonicware's downloads page,
  with a SmplTrek.bin file copied to the SD card. Its catalogued entries are STK Writer, STK
  Builder, STK Forge and smpltrek-builder, tools for building kits and projects.
