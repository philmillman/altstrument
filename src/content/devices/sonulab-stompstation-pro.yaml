name: StompStation PRO
manufacturer: Sonulab
category: pedal
tagline: Pedal that runs three Neural Amp Modeler files and stereo impulse responses with a colour display
description: >-
  The StompStation PRO is a guitar pedal from Sonulab built around the Neural Amp Modeler format. Each preset can load three
  NAM files, with support for the A1 and A2 architectures, and two impulse responses, with studio effects after them. It has a
  full-colour display, five knobs, three multifunction footswitches, stereo in and out, MIDI in and out, USB, a headphone
  output and 192 kHz 32-bit converters, in a 600 g stainless steel case. A separate VoidX Control app, from another developer, edits it.
platform: Raspberry Pi Compute Module 4
links:
  manufacturer: https://sonulab.com/stompstationpro/
notes: >-
  No custom firmware is known. TonePush edits it over its USB serial port and enables writes only for firmware 1.5, 2.0 and 2.2,
  the versions its author tested.
