name: HR-GP5 / HR-MP5
manufacturer: Sony
category: pedal
added: 2026-11-06
tagline: 1990s half-rack multi-effects processors built on one DSP board
description: >-
  The HR-GP5 is a half-rack guitar effects processor from Sony, and the HR-MP5
  is a related processor that has the same board with a stereo, dual-chain
  design. Both run on an H8/500 CPU with one firmware EPROM, show their pages on
  a 228 by 40 pixel LCD and do their effects on a Texas Instruments TMS57002
  DSP. A rocker and an encoder select programs and values.
platform: Hitachi H8/500 and TMS57002 DSP
stock_firmware: Ver1.03E (HR-GP5)
links:
  manufacturer: https://www.sony.com/
notes: >-
  The one project here, Rosetta OS, is patched from a dump of your own EPROM and
  runs from a new chip in the stock socket, so installing it means opening the
  case. Keep the original EPROM to return to stock. Sony's own firmware is not
  hosted here. The HR-MP5 build of Rosetta OS is part of the same entry.
