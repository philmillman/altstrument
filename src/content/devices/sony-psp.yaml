name: PSP
manufacturer: Sony
category: handheld
added: 2026-10-18
tagline: Sony's 2004 handheld console, a platform for homebrew trackers and MIDI sound modules
description: >-
  The PlayStation Portable is a handheld game console released by Sony in 2004. It has a 4.3 inch screen, a
  MIPS-based main processor with a second Media Engine core, a Memory Stick slot, and a USB port that acts only as
  a device. The PSP-1000, 2000 and 3000 series, the PSP Go and the PSP-E1000 share one software
  platform.

  Music software for it is homebrew, installed as an EBOOT folder on the Memory Stick. The tracker projects
  PSPATTERN, Little Piggy Tracker and MilkyTracker build on it, and a group of newer synthesizer apps turn it into
  a MIDI sound module when connected to a computer or keyboard through a USB host adapter.
platform: MIPS Allegrex (R4000-class) CPU with a Media Engine second core
links:
  manufacturer: https://en.wikipedia.org/wiki/PlayStation_Portable
  community:
    - label: ARK-4 custom firmware
      url: https://github.com/PSP-Archive/ARK-4
    - label: PSPDEV, the homebrew toolchain
      url: https://pspdev.github.io/
notes: >-
  Homebrew needs custom firmware such as ARK-4 or PRO; the projects here report testing on firmware 6.61. The PSP's
  own USB port acts only as a device and cannot host a MIDI keyboard, so apps that take keyboard MIDI use an adapter
  that acts as a USB host (HobbyChop sells one, the PSP-MIDI adapter) or a hardware modification of the headphone port. HobbyChop's
  synth apps list the PSP-1000, 2000 and 3000 as supported and the PSP Go as not supported. Two open-source kernel
  modules, PSP USB MIDI and Open-PSP-MIDI, work the other way and make the PSP appear as a USB MIDI device to a computer
  over its own cable; the second has not been run on a real PSP. Software that runs on the PSP also runs on the PS
  Vita through its PSP emulation, with some limits. Sony's own PSP firmware is not catalogued here.
related: [sony-ps-vita]
