name: CLOCK
manufacturer: South Signal Lab
category: eurorack
added: 2026-11-14
tagline: 10 HP DIY master clock and gate sequencer with eight outputs
description: >-
  CLOCK is a 10 HP Eurorack module designed by South Signal Lab as a DIY build rather than a retail product. It has eight
  gate and clock outputs, two comparator inputs, an OLED display, a push encoder and three buttons. Each channel can run as
  a clock, a Euclidean rhythm or a sequence, or the module can work as one shared clock or an eight-output divider bank.
  It runs from the +12 V rail and is built around a WeAct Black Pill with an STM32F401 microcontroller.
platform: STM32F401CCU6 (Cortex-M4)
stock_firmware: 1.1.0
links:
  manufacturer: https://southsignallab.com/hardware/clock/
  community:
    - label: South Signal Lab Ko-fi
      url: https://ko-fi.com/southsignallab
notes: >-
  South Signal Lab publishes the firmware as source-available under PolyForm Noncommercial. The product page lists the
  module at prototype stage with boards in fabrication. A first install and recovery use an ST-LINK on the SWD pins, and routine updates use
  USB DFU. USB and Eurorack power must not be connected at the same time.
