name: FV-1 based pedals
manufacturer: Spin Semiconductor
category: pedal
added: 2026-10-13
tagline: Pedals built around the Spin FV-1 DSP chip
description: >-
  This entry covers guitar pedals and DIY effect boards that use the Spin
  Semiconductor FV-1, a 28-pin digital signal processor chip for audio effects
  such as reverb, delay and modulation. The chip has a stereo ADC and DAC, three
  potentiometer inputs, eight built-in programs and room for eight more in an
  external EEPROM. Many commercial and hobbyist pedals use the FV-1, and the
  entries here are tools and program collections for it.
platform: Spin FV-1 DSP
links:
  manufacturer: http://spinsemi.com/products.html
  community:
    - label: FV-1 program directory
      url: https://mstratman.github.io/fv1-programs/
related: [audiofab-easy-spin]
notes: >-
  The FV-1 runs programs stored in an external EEPROM, so custom programs are
  burned to or loaded into that memory rather than flashed as a firmware image.
  The entries here are tools and program collections rather than a replacement
  OS.
