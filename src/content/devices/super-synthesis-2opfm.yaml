name: 2OPFM
manufacturer: Super Synthesis
category: eurorack
added: 2026-10-24
tagline: 6 HP digital two-operator FM voice with a decay envelope
description: >-
  2OPFM is a 6 HP Eurorack voice from Super Synthesis (Chris McDowell). It has two digital sine oscillators, one
  modulating the other, and an internal decay envelope that shapes both, with knobs for the carrier frequency
  and the modulator ratio, sliders for decay and FM amount, and a CV input for each control plus a trigger. The
  REV5 board runs on an STM32G431 microcontroller. Super Synthesis publishes the schematic, panel and the
  firmware source for its production modules in a CC0 repository.
platform: STM32G431 (Arm Cortex-M4)
stock_firmware: Super Synthesis REV5 firmware (2024), CC0 source published by the manufacturer
links:
  manufacturer: https://www.supersynthesis.com/products/2opfm
  community:
    - label: Super Synthesis 2OPFM firmware and schematics (CC0)
      url: https://github.com/supersynthesis/eurorack/tree/main/Production%20Modules/2OPFM
notes: >-
  The stock KHz input responds at about half a volt per octave on purpose, so it needs an attenuator to track
  1V/oct. Firmware changes on the REV5 board go through an SWD header (J3) and an ST-Link.
