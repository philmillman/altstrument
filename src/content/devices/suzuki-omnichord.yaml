notes: >-
  Suzuki publishes no firmware source or updates for any Omnichord, and the vintage models do their chord logic in
  custom ICs rather than updatable firmware. On the OM-27 that is a General Instrument AY-5-1317A chord chip with
  an M083A top-octave generator and M747 dividers, none of which are made any more. OpenChord, the only open
  project here, is an untested RP2350 replacement for those chips aimed at the OM-27. QFix is an external Arduino
  box that rewrites the Qchord's MIDI output; it does not change the instrument. Worn strumplates are a common
  fault, and Key & Cable publishes open flex-PCB reproductions under CERN-OHL-S-2.0.
