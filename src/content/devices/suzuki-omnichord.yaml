name: Omnichord (OM series)
manufacturer: Suzuki
category: synth
added: 2026-10-20
tagline: Suzuki's handheld chord instrument with a touch strumplate, made from 1981 to 1996 and reissued in 2024 as the OM-108
description: >-
  The Omnichord is a portable electronic instrument with chord buttons, a touch-sensitive strumplate that plays an
  arpeggio of the held chord, auto bass and chord accompaniment and built-in rhythms, powered by batteries or an
  adapter. This entry covers the whole family. According to Suzuki's history page, the PC-27 (sold as Portachord or
  Tronichord) came first, followed by the OM-27 in 1981, the OM-36 and OM-84 (System One and System Two) in 1984,
  the OM-100 and OM-200M in 1989, the OM-150 and OM-250M in 1993 and the OM-300 in 1996. The M models and the OM-84
  add a keyboard mode, transpose and chord memory, and the OM-200M and OM-250M also have MIDI out. Suzuki then sold
  the Qchord QC-1 from 1999, with song cartridges and General MIDI sounds.

  The OM-108, announced at NAMM in January 2024, is a new model with 108 chords including sus4 and add9, analog
  circuitry that recreates the OM-84 sound alongside PCM voices, a keyboard and drum pad mode, and MIDI out for the
  chords, strumplate and drums. There was no earlier OM-108.
