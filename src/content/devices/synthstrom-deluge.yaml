name: Deluge
manufacturer: Synthstrom Audible
category: groovebox
added: 2026-10-13
tagline: Portable sequencer, synthesizer and sampler
description: >-
  The Deluge is a portable standalone sequencer, synthesizer and sampler from
  Synthstrom Audible, a New Zealand company. It has a 16 by 8 grid of 128 RGB
  pads, subtractive, wavetable and FM synth engines, and a sampler that streams
  from an SD card. The unit offers up to 64 synth voices, MIDI and CV/gate
  outputs, audio I/O including a built-in microphone, and a rechargeable
  battery. It is built around a Renesas RZ/A1L processor.
platform: Renesas RZ/A1L (Arm Cortex-A9)
stock_firmware: 1.2.1
links:
  manufacturer: https://synthstrom.com/product/deluge/
  community:
    - label: Deluge Community
      url: https://delugecommunity.com/
    - label: Update guide
      url: https://github.com/SynthstromAudible/DelugeFirmware/wiki/Update-guide
notes: >-
  Synthstrom Audible open-sourced the Deluge firmware, and the community
  firmware is developed in Synthstrom's own GitHub organisation. Release notes
  recommend backing up the SD card before updating.
hide_stale_after_years: 2
pinned: [deluge-community-firmware]
