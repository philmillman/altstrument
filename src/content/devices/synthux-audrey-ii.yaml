    - label: Audrey videos playlist (Synthux Audrey II and Audrey Touch)
      url: https://www.youtube.com/playlist?list=PL5C3-eYoi3VaNFiLZdAEt40glv4YsTCFm
notes: >-
  The Seed is programmed over USB. Synthux's instructions use a prebuilt .bin
  and the Daisy Web Programmer in Chrome (put the Seed in bootloader mode,
  use a data-capable cable), or the Daisy toolchain and dfu-util to build it
  yourself. The same instrument also exists as a firmware for the Touch 2
  (Audrey Touch), listed under that device. Hardware mods such as a gate input
  are discussed on the Synthux Discord.
related: [synthux-simple-designer, synthux-touch-2, synthux-spotykach, electrosmith-daisy-patch]
