name: Audrey II
manufacturer: Synthux Academy
category: synth
added: 2026-10-14
tagline: Feedback-driven Karplus-Strong drone synth on a Simple Designer board
description: >-
  Audrey II is a feedback synthesizer sold by Synthux Academy as a DIY kit and
  as an assembled unit, built on the Simple Designer PCB with a Daisy Seed. The
  store lists 96 kHz and 24-bit audio. Its signal chain feeds a Karplus-Strong
  string model through distortion, reverb, filters and a long delay back into
  the string, and it makes no sound until the feedback control is raised. It
  was derived from an earlier Audrey DIY project, and version 1 and 2 share the
  same code.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://synthux.academy/store/audrey-ii
  community:
