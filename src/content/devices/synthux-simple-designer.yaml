name: Simple Designer
manufacturer: Synthux Academy
category: diy-platform
added: 2026-10-14
tagline: Daisy Seed board with 80 control slots for building your own instrument
description: >-
  Simple Designer is a larger PCB from Synthux Academy with 80 slots for
  potentiometers, switches and jacks, intended for building a complete
  instrument around a Daisy Seed. The kit contains the Designer board, a Fix
  board, a Daisy Seed, Rogan knobs, twelve 10K pots, a slide pot, switches,
  jacks and hookup wires. Several Synthux instruments, including Audrey and
  Canvas, started on this board.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
links:
  manufacturer: https://synthux.academy/store/simple-designer-kit
  community:
