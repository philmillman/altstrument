      url: https://github.com/Synthux-Academy/simple-designer-instruments
    - label: Synthux Academy on GitHub
      url: https://github.com/Synthux-Academy
    - label: awesome-synthux (community link list)
      url: https://github.com/Synthux-Academy/awesome-synthux
notes: >-
  The board is wired by the builder, so each instrument ships with its own
  wiring and firmware. Official firmware binaries are flashed to the Daisy
  Seed with the Daisy Web Programmer (Chrome or Edge, Seed in bootloader
  mode) or built with the Daisy toolchain and dfu-util.
related: [synthux-audrey-ii, synthux-simple-fix, synthux-touch-2, synthux-spotykach, electrosmith-daisy-patch]
