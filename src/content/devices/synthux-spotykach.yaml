notes: >-
  The official firmware is open source and Synthux invites forks. Unlike the
  other Synthux instruments, Spotykach uses its own bootloader (the repository
  carries bootloader-spotykach-v2.bin) that accepts USB DFU updates only on the
  USB-C port on the rear of the main PCB, not the port on the Daisy Seed. Use
  a data-capable cable, hold Reset on the back for about three seconds until
  the lights under the bottom pads breathe white, then flash the .bin. The
  official README warns that a bad flash can temporarily brick the unit until
  the bootloader, the firmware or both are reinstalled. Alternative firmwares
  replace the DSP but keep the same panel and bootloader.
