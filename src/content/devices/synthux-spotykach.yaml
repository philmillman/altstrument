name: Spotykach
manufacturer: Synthux Academy
category: sampler
added: 2026-10-14
tagline: Dual-deck looper with touch pads, CV and clock I/O, running open firmware on a Daisy Seed
description: >-
  Spotykach is a dual-deck performance looper from Synthux Academy, the
  company's first finished instrument rather than a kit. Each of its two stereo
  decks has reel, slice and drift modes, with 12 touch pads, CV and gate
  inputs, a clock input, two modulation sources, MIDI I/O, a headphone output
  and an SD card slot for saved tapes. It runs on a Daisy Seed, with audio
  hardware at 48 kHz and 24 bits, and is powered over USB-C or a 15 V supply.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
