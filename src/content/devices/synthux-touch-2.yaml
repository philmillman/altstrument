name: Touch 2 (Simple Touch)
manufacturer: Synthux Academy
category: diy-platform
added: 2026-10-14
tagline: Daisy Seed touch instrument with swappable faceplates, one board for many firmwares
description: >-
  Touch 2, developed under the name Simple Touch, is a touch-controlled
  instrument from Synthux Academy built around an Electrosmith Daisy Seed. It
  has 12 touch pads, six trim knobs, two faders, two switches, a stereo input
  and a stereo output, and comes with swappable faceplates (one of them blank)
  that match the official firmwares. Synthux sells it assembled and as a DIY
  kit.
platform: Electrosmith Daisy Seed (STM32H750, Arm Cortex-M7)
