name: FireworX
manufacturer: TC Electronic
category: other
tagline: Studio effects processor with a routing grid of freely placed effect blocks and a modulation matrix
description: >-
  The FireworX is a rack-mounted studio multi-effects processor from TC Electronic. Its effects include filters, formant
  and vocoder blocks, pitch, delay, reverb, chorus and distortion, and any block can be placed in a routing grid and
  controlled by a modulation matrix. It has a graphic display, a Recall and Store workflow, a memory card slot and MIDI
  control, and its parameters can be sent as SysEx. The community editor targets operating system 2.00 and newer.
links:
  manufacturer: https://web.archive.org/web/20151222085736/http://www.tcelectronic.com/fireworx/
notes: >-
  No custom firmware is known. The community editor reads and writes presets over MIDI SysEx and does not replace the
  operating system. TC Electronic no longer sells the unit, so the manufacturer link and the picture come from an archived copy of its
  product page.
