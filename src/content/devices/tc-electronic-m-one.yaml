name: M-One
manufacturer: TC Electronic
category: other
added: 2026-11-06
tagline: Rack-mount stereo effects processor with reverb, delay and modulation
description: >-
  The M-One is a 1U rack effects processor from TC Electronic. It runs two effects at once in series or in parallel, with
  reverbs, delays, chorus, flange, pitch and other effects, and it has a multispectral LCD, a data wheel and MIDI. A
  Motorola DSP56362 runs the effects, and its debug port is wired to a header on the mainboard.
platform: Motorola DSP56362
links:
  manufacturer: https://web.archive.org/web/20180103094705/http://www.tcelectronic.com/m-one/
notes: >-
  The one project here replaces the front panel and effects with an ESP32-S3 wired to the DSP's debug header. It loads
  its programs into DSP RAM, so a power cycle returns the unit to stock. TC Electronic no longer sells the unit, so the
  manufacturer link and the picture come from an archived copy of its product page.
