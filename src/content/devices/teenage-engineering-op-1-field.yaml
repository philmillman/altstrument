name: OP-1 Field
manufacturer: Teenage Engineering
category: synth
added: 2026-10-20
tagline: Portable synth, sampler and tape sequencer, successor to the OP-1
description: >-
  The OP-1 Field is a portable synthesizer, sampler and sequencer from Teenage
  Engineering, released in 2022 as the follow-up to the original OP-1. It keeps
  the OP-1's synth and drum engines, effects, sequencers and four-track
  tape-style recorder, and has a built-in speaker and a rechargeable battery. A
  computer sees the device over USB-C as a portable device (MTP) rather than a
  disk, and projects and patches are exchanged that way.
stock_firmware: 1.7.3
