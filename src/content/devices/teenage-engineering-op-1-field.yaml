notes: >-
  No custom firmware was found for the OP-1 Field. The entries here are
  host-side tools for its patch files. Tools that cover both OP-1 models, such
  as DigiChain, are listed on the original OP-1 page. The stock firmware
  version listed is the one the catalogued patch tool was written against, not
  a statement of the latest release.
