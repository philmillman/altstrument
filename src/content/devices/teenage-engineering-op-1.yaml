notes: >-
  Original OP-1 only. A few host-side tools that make patches and sample chains
  also cover the OP-1 Field and OP-Z (teoperator, DigiChain) and are catalogued
  here; the OP-1 Field, OP-Z, OP-XY, EP-133 and Pocket Operators have their own
  device pages. R246 (2022-12-13) is the latest official
  OP-1 update on Teenage Engineering's download page. Repacker-based mods target
  older builds (tested on 235); op1r targets R246 only. Mods are installed
  through the standard update mode and leave the bootloader untouched.
