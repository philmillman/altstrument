name: PO-133 Street Fighter
manufacturer: Teenage Engineering
category: sampler
added: 2026-11-05
tagline: Street Fighter edition of the PO-33 K.O! micro sampler
description: >-
  The PO-133 Street Fighter is a special edition Pocket Operator made with Capcom and based on the PO-33 K.O! It is a
  pocket-sized sampler and sequencer with a built-in microphone, eight melodic and eight drum sample slots, 40 seconds
  of sample memory and 15 punch-in effects. It ships with sixteen Street Fighter sound tracks and samples from the
  original arcade game.
