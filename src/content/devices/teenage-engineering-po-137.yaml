name: PO-137 Rick and Morty
manufacturer: Teenage Engineering
category: synth
added: 2026-11-05
tagline: Rick and Morty edition vocal synthesizer in the Pocket Operator line
description: >-
  The PO-137 Rick and Morty is a special edition Pocket Operator that Teenage Engineering lists as a vocal
  synthesizer. It is a pocket-sized unit with a built-in speaker, like the rest of the line, and its user guide is
  published on Teenage Engineering's site. Its page in the Teenage Engineering store is no longer online.
links:
  community:
  - label: PO-137 user guide
    url: https://teenage.engineering/guides/po-137/en
notes: >-
  No replacement firmware exists. libpo's author lists it beside the PO-35 speak and builds and decodes the device's
  speech transfers in software. No store page for the device is online, so the device has no manufacturer link and no
  image.
related:
  - teenage-engineering-po-35
