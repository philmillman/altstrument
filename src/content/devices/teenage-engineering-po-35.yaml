name: PO-35 speak
manufacturer: Teenage Engineering
category: synth
added: 2026-11-05
tagline: Pocket Operator vocal synthesizer and sequencer with a built-in microphone
description: >-
  The PO-35 speak is a pocket-sized vocal synthesizer and sequencer from Teenage Engineering. A built-in microphone
  samples speech, which the device turns into one of eight voice characters that play at pitch from the sixteen
  buttons. It has 120 seconds of sample memory, eight effects, scale and transpose settings, and replaceable drum
  sounds that can come from the Microtonic plugin. Like the other Pocket Operators it has a speaker and a sequencer
  with punch-in effects.
