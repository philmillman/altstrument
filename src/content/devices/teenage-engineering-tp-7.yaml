name: TP-7
manufacturer: Teenage Engineering
category: other
tagline: Portable field recorder with a motorised platter and MIDI control
description: >-
  The TP-7 is a portable field recorder from Teenage Engineering with a round motorised platter that is turned to scrub through recordings, a small OLED display, a transport of record, play
  and stop keys, and a pitch fader. It records 96 kHz, 24-bit audio and has a USB-C port that also works as a MIDI interface, plus Bluetooth. Cue points, loops and playback speed can be set from the unit
  or by MIDI commands, and the unit accepts firmware updates published by Teenage Engineering.
platform: Not published
