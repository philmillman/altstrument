name: YM2149 Synth
manufacturer: trash80
category: synth
tagline: Teensy-based three-voice synth around a YM2149F chip
description: >-
  The YM2149 Synth is an open-hardware instrument designed by trash80 around the YM2149F
  sound chip, which has three square-wave voices, a noise source and a hardware envelope. A Teensy 3.1 reads MIDI
  over USB and serial and drives the chip, with one MIDI channel per voice, CC control of the synth type, glide,
  vibrato, pitch envelope and volume envelope, and sixteen presets. Prebuilt units have been sold by Catskull
  Electronics, and the schematic, board files and firmware are published.
platform: Teensy 3.1 (ARM Cortex-M4)
links:
  community:
    - label: trash80 on GitHub
      url: https://github.com/trash80/Ym2149Synth
notes: >-
  The repository has a schematic and a KiCad board but no photograph of the finished
  instrument, so this entry has no picture.
pinned: [ym2149synth]
