name: TrimUI Brick
manufacturer: TrimUI
category: handheld
added: 2026-11-21
tagline: Square Linux handheld with a 1024 by 768 screen that runs music apps from the SD card
description: >-
  The TrimUI Brick is a compact Linux handheld sold for emulation, with a 1024 by 768 screen, a D-pad, face and
  shoulder buttons, Wi-Fi and two USB-C ports. It runs TrimUI's own OS, and community firmwares such as spruce,
  CrossMix, Knulli, NextUI and MinUI boot from the SD card and add app menus where homebrew music software runs as
  native Linux programs.
platform: Allwinner A133P
links:
  community:
    - label: spruce
      url: https://spruceui.github.io/
    - label: Knulli
      url: https://knulli.org/
notes: >-
  Music software is copied to the SD card and started from the stock OS or a community firmware; nothing here flashes
  the console itself. Projects that cover the Brick only through PortMaster or a generic package are listed under
  PortMaster-compatible handhelds; ones with a Brick-specific package as well are also listed here. No free photo of the device was found, so there is no image.
related: [portmaster-compatible-handhelds, anbernic-rg35xx, miyoo-miyoo-flip]
