    - label: M0SS Discord
      url: https://discord.gg/w7DQAhY46v
notes: >-
  Updates use the same procedure as the M0SS-101: the board comes out of the
  enclosure, connects over its internal USB-B port, and enters the BL616's
  mask-ROM bootloader with the BOOT and RST buttons, so a failed flash can be
  repeated. Updating usually erases presets.
