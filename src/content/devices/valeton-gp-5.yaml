name: GP-5
manufacturer: Valeton
category: pedal
tagline: Mini stompbox multi-effects processor with SnapTone NAM captures and Bluetooth
description: >-
  The GP-5 is a small single-footswitch multi-effects pedal from Valeton that weighs 237 g. It has 100 presets, more than
  100 effects and amp models, SnapTone slots for Neural Amp Modeler captures, third-party IR import and Bluetooth 5.0. It
  has a 2-in/2-out USB audio interface, a stereo TRS output and runs from USB or a 9 V supply. The GP-50 is a larger
  two-footswitch sibling that shares its preset format and MIDI commands.
links:
  manufacturer: https://www.valeton.net/product/gp-5/
  community:
  - label: Valeton firmware downloads
    url: https://www.valeton.net/firmware/
notes: >-
  No custom firmware is known. The community tools edit presets over the pedal's USB and Bluetooth protocols and do not
  replace its firmware.
related: [valeton-gp-50, valeton-gp-200]
