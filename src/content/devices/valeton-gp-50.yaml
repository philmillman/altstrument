name: GP-50
manufacturer: Valeton
category: pedal
added: 2026-11-03
tagline: Two-footswitch stompbox multi-effects processor with a battery, looper and SnapTone NAM captures
description: >-
  The GP-50 is a two-footswitch multi-effects pedal from Valeton in a 430 g metal case with a built-in lithium battery. It
  shares the GP-5's effects, 100 presets, SnapTone slots for Neural Amp Modeler captures, third-party IR import and
  Bluetooth 5.0, and adds a looper, external pedal and MIDI connections, and USB, DC or battery power. It has a 2-in/2-out
  USB audio interface.
links:
  manufacturer: https://www.valeton.net/product/gp-50/
  community:
  - label: Valeton firmware downloads
    url: https://www.valeton.net/firmware/
notes: >-
  No custom firmware is known. The community tools edit presets over the pedal's USB and Bluetooth protocols and do not
  replace its firmware.
related: [valeton-gp-5, valeton-gp-200]
