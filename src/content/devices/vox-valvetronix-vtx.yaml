name: Valvetronix VTX series
manufacturer: Vox
category: other
tagline: VT20X, VT40X and VT100X modelling guitar amps with a 12AX7 preamp stage and USB MIDI
description: >-
  The Valvetronix VTX amps are combo guitar amplifiers from Vox that pair a 12AX7 tube preamp stage with a digital modelling
  engine for amp models, pedal and modulation effects, delay and reverb. The VT20X has 20 watts and an 8-inch speaker and the
  VT40X 40 watts and a 10-inch speaker; the VT100X is the largest of the three. Programs are stored in eight channels, A1
  to B4, and the amps connect over USB, where they appear as a MIDI device. Vox's ToneRoom app edits and archives them.
links:
  manufacturer: https://voxamps.com/de/produkt/vt40x/
notes: >-
  No custom firmware is known. The community librarian talks to the amps in SysEx over USB and does not change their
  firmware.
