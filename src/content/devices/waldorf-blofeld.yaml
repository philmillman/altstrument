name: Blofeld
manufacturer: Waldorf
category: synth
added: 2026-11-03
tagline: Digital wavetable synth with 25 voices, keyboard or desktop
description: >-
  The Blofeld is a digital synthesizer from Waldorf, introduced in 2007. It plays up to
  25 voices with three oscillators and two filters per voice, a modulation matrix and effects, and can
  run as a single sound or as a 16-part multi. It is sold as a desktop module and as
  a keyboard, and all of its parameters and sound dumps are available over MIDI SysEx.
links:
  manufacturer: https://waldorfmusic.com/blofeld/
notes: >-
  No custom firmware is known; the entries are editors that use the Blofeld's SysEx
  specification.
