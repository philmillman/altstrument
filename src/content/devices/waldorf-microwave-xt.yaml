name: Microwave II / XT / XTk
manufacturer: Waldorf
category: synth
tagline: Wavetable synths from Waldorf, in desktop and keyboard forms
description: >-
  The Microwave II, Microwave XT and Microwave XTk are wavetable synthesizers
  from Waldorf. They descend from the PPG wavetable instruments and the
  original Microwave, and play stored wavetables through filters and effects.
  The XT is a desktop module, the XTk is the same synth in a keyboard, and the
  Microwave II is the earlier model.

  The XT and XTk share one operating system update file with the Microwave II,
  so a mod for one usually covers all three.
stock_firmware: "2.33"
links:
  manufacturer: https://waldorfmusic.com/legacy-microwave-ii-xt-xtk-series/
notes: >-
  Waldorf distributes the operating system as a MIDI file that is played into
  the synth's MIDI In. Mods in the catalog patch that file in the browser, so the
  stock file has to be downloaded from Waldorf; playing Waldorf's own file
  again puts the stock system back.
