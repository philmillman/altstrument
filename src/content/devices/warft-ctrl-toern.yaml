notes: >-
  The project's own firmware is the unit's firmware, so it is catalogued as an entry. Hardware design files are CC BY-NC 4.0, and
  the README says only Jan-Peter Kuntoff may sell TŒRN hardware. Firmware is flashed through the Teensy 4.1's separate
  bootloader chip, which an upload does not overwrite.
