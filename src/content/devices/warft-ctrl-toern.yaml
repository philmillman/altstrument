name: TŒRN
manufacturer: warft_ctrl
category: diy-platform
added: 2026-11-14
tagline: Open-source Teensy 4.1 sampler and step sequencer with an RGB LED grid
description: >-
  TŒRN is a standalone sampler and step sequencer by Jan-Peter Kuntoff (warft_ctrl) in Hamburg, built on a Teensy 4.1 and a
  custom board with an audio codec, charging and jacks. Its 32 by 16 RGB LED panel serves as both display and note grid, and
  four lit rotary encoders and five touch buttons control it. It has eight sample voices read from a microSD card, a
  three-voice poly synth, two mono synths, TRS MIDI in and out, line and headphone outputs and a microphone input. The code,
  schematics, PCB files and case designs are published in a public repository, and the author sells the finished unit.
platform: Teensy 4.1 (NXP i.MX RT1062)
links:
  manufacturer: https://toern.live/
  community:
