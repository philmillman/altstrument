name: Argos
manufacturer: Wavebox
category: pedal
added: 2026-11-03
tagline: Brazilian MIDI guitar pedal with vintage amp simulation, 40 presets and a MIDI switcher
description: >-
  The Argos is a guitar effects pedal from the Brazilian maker Wavebox, part of its Mythology series. Its manual describes
  overdrive, distortion and heavy metal saturation inside an analogue simulation of vintage Fender, Marshall and Mesa Boogie
  amps, with six parameter knobs and a display. It works in a Pedal mode with three memory banks on three footswitches and
  a Preset mode with 40 presets, each with banks A and B. It has MIDI in and out, a MIDI switcher that selects the channel of a
  connected amp, and master and slave modes for chaining Mythology pedals. The manual documents Program Change for presets
  and Control Change for volume and expression.
notes: >-
  No custom firmware is known. The community editor sends Program Change and Control Change over MIDI, and its preset
  library lives in the browser. There is no manufacturer link or image here: no product page for it could be found on
  wavebox.com.br, and the description comes from the manual in the editor's repository.
