notes: >-
  Firmware is installed from the device's own bootloader screen using a .bin file copied to the SD card, and a
  hardware boot button gives a way back into the bootloader if the unit will not start. The microcontroller model
  comes from the Advance adapter in the picoTracker repository at tag v2.3.0. That adapter was removed from the
  public repository in April 2026, and the current v3 firmware is published as binaries only.
