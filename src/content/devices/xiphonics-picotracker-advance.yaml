name: picoTracker Advance
manufacturer: xiphonics
category: groovebox
added: 2026-10-17
tagline: Assembled metal-cased handheld tracker with a 4 inch 720 by 720 display
description: >-
  The picoTracker Advance is an assembled handheld tracker from xiphonics, launched in November 2025 as a
  successor to the RP2040-based picoTracker. It has an all-metal body, a 4 inch 720 by 720 display, nine keys, a
  speaker, a built-in microphone, line input and output, TRS and USB MIDI with a USB host mode for pad controllers,
  a microSD card slot and a battery rated for up to six hours. It plays eight stereo tracks with sample, MIDI and
  synth instruments, including SID, six-operator FM and macro-oscillator engines in the v3 firmware.

  It keeps the picoTracker screen layout and key combinations, and projects can be converted between it and the
  RP2040 model.
platform: STM32H743
stock_firmware: 3.2.0
