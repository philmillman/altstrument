name: picoTracker
manufacturer: xiphonics
category: groovebox
added: 2026-10-17
tagline: DIY handheld tracker on the RP2040, sold as a PCB kit with open firmware
description: >-
  The picoTracker is a handheld music tracker built around a Raspberry Pi RP2040 microcontroller. It has a 2.8
  inch 320 by 240 display, nine keys, a microSD card slot for projects and samples, headphone or line output,
  TRS MIDI in and out, and a USB-C port used for MIDI, charging and firmware updates. It began as a do-it-yourself
  build by the developer known as democloid, using a Raspberry Pi Pico and off-the-shelf modules, and xiphonics
  now develops its firmware and sells a v2 kit of circuit boards with the display already mounted. The buyer adds
  a 3D-printed case, battery, key switches, keycaps and an SD card.

  The firmware is a descendant of LittleGPTracker, a tracker for game consoles and desktop computers written by
  Marc Nostromo, and keeps its song, chain and phrase workflow. The xiphonics-sold successor with different
  hardware is the picoTracker Advance, which has its own entry.
platform: RP2040
