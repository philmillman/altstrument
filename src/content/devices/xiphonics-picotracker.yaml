notes: >-
  Flashing is a drag-and-drop UF2 copy in the Pico's USB boot mode, so a bad image can be replaced the same way
  and the boot ROM cannot be overwritten. The firmware is open source, and xiphonics hosts a repository of
  community-contributed alternative firmwares for the v2 board. The circuit board and case files are released as
  CC0, but the picoTracker-pcb README says the picoTracker name and branding are not licensed for hardware that
  other people build from them. The picoTracker repository ships separate firmware images for the v2 board and for
  older boards with a different display controller. LittleGPTracker, the upstream project, was written by Marc
  Nostromo (BSD-3-Clause) and has had no commits since November 2020. djdiskmachine maintains a fork renamed Little
  Piggy Tracker under GPL-3.0, which is listed on the handheld consoles it runs on, such as the PSP, the Anbernic
  RG35XX series and the Miyoo Mini.
