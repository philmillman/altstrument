name: DX7
manufacturer: Yamaha
category: synth
tagline: Six-operator FM keyboard synth from 1983
description: >-
  The DX7 is a six-operator FM synthesizer made by Yamaha, introduced in 1983. It
  has 61 keys, 16-note polyphony and 32 FM algorithms, and keeps 32 voices in
  internal memory. It sends and receives single voices and 32-voice banks as MIDI
  SysEx dumps, which is how most of its sounds are edited and backed up.
