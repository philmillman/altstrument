name: PortaSound PSS-270
manufacturer: Yamaha
category: synth
added: 2026-11-06
tagline: FM mini-key keyboard from 1986 built around the YM2413 chip
description: >-
  The PSS-270 is a small keyboard from Yamaha's PortaSound line with 49 mini keys and 100 built-in voices. Its sound comes from a YM2413 two-operator FM chip, with a rhythm
  section and auto accompaniment. It has no MIDI ports.
platform: Yamaha YM2413 FM chip
notes: >-
  The entry here leaves the stock CPU in reset and drives the sound chip and the key matrix from an added microcontroller board, which adds MIDI. The
  stock firmware is not changed.
related: [yamaha-pss-480]
