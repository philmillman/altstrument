name: PortaSound PSS-480
manufacturer: Yamaha
category: synth
added: 2026-11-03
tagline: Two-operator FM keyboard with MIDI and sampled drums
description: >-
  The PSS-480 is a small keyboard from Yamaha's PortaSound line, from the late 1980s. It
  makes its melodic sounds with a two-operator FM engine and plays sampled rhythm sounds, and it has
  MIDI ports. Its voices can be edited by sending SysEx parameter messages. Editors for it also cover related
  PortaSound models and the PortaTone DSR-1000 and DSR-2000.
notes: >-
  No custom firmware is known; the entry here is a browser editor.
