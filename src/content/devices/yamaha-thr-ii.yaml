name: THR-II
manufacturer: Yamaha
category: other
tagline: Desktop modelling guitar amps in 10, 20 and 30 watt versions with USB audio, Bluetooth and a mobile editor
description: >-
  The THR-II series is a line of compact desktop guitar amplifiers from Yamaha: the THR10II, the THR10II Wireless and
  the THR30II Wireless. They model 15 guitar amps and 8 effects, with bass, acoustic and flat voicings, and work as USB audio
  interfaces without a driver. Bluetooth carries audio playback and control from Yamaha's THR Remote app, and the Wireless
  models add a rechargeable battery and a receiver for a wireless guitar transmitter.
