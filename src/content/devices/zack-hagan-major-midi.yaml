name: Major MIDI
manufacturer: Zack Hagan
category: eurorack
tagline: Eurorack MIDI file player with a SoundFont 2 synth, built on the Daisy Patch SM
description: >-
  Major MIDI is a Eurorack module that plays Standard MIDI Files from a microSD card through a built-in SoundFont 2 synth
  with up to 32 voices. It has a display, an encoder, play and bank buttons, four knobs and an internal or external sync switch.
  The jacks are MIDI in and out on TRS, USB MIDI, two CV and two gate inputs, two CV and two gate outputs, and stereo audio out. Its
  maker sells it assembled with the firmware installed, an SD card and a power cable. The firmware source is published.
platform: Electrosmith Daisy Patch SM (STM32H750, Arm Cortex-M7)
