name: Achordion
manufacturer: Zlosynth
category: eurorack
added: 2026-11-08
tagline: 10 HP quantizing wavetable oscillator that plays chords
description: >-
  Achordion is a 10 HP Eurorack oscillator module from Zlosynth. It plays
  wavetables as single tones, chords, arpeggios or intervals, with up to 18
  voices, and quantizes the pitch to a selected scale. It has two lines, each
  with its own 1V/oct input and audio output.

  The module is built on Electrosmith's Daisy Patch SM. Its firmware, schematics,
  PCB layout and manual are published openly, and firmware updates are uploaded
  through Electrosmith's web programmer.
platform: Electrosmith Daisy Patch SM (STM32H750, Arm Cortex-M7)
