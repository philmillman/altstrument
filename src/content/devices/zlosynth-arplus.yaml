name: Arplus
manufacturer: Zlosynth
category: eurorack
added: 2026-11-10
tagline: 20 HP quantizer, arpeggiator and Karplus-Strong string synthesizer
description: >-
  Arplus is a 20 HP Eurorack module from Zlosynth that combines a quantizer, an arpeggiator and a plucked-string
  synthesizer. It plays six strings of Karplus-Strong synthesis, quantizes pitch to 31 scales and chords of up to
  eight notes, offers CV-controlled arpeggio patterns and takes an external signal as the excitation source. It has
  three stereo output modes.

  The module is built on Electrosmith's Daisy Patch SM. Its firmware, schematics, PCB layout and manual are
  published openly, and firmware updates are uploaded through Electrosmith's web programmer.
platform: Electrosmith Daisy Patch SM (STM32H750, Arm Cortex-M7)
