name: Kaseta
manufacturer: Zlosynth
category: eurorack
added: 2026-11-08
tagline: tape delay and saturation Eurorack module with four heads
description: >-
  Kaseta is a Eurorack delay module from Zlosynth that simulates a tape
  machine. It has four reading heads, up to five minutes of recording, tape
  saturation, wow and flutter, tone control, a trigger sequencer and stereo
  output.

  The module is built on Electrosmith's Daisy Patch SM. Its firmware, schematics,
  PCB layout and manual are published openly, and firmware updates are uploaded
  through Electrosmith's web programmer.
platform: Electrosmith Daisy Patch SM (STM32H750, Arm Cortex-M7)
