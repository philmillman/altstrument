name: LiveTrak L6max
manufacturer: Zoom
category: other
tagline: Twelve-channel digital mixer and multitrack recorder with four sound pads
description: >-
  The LiveTrak L6max is a larger model in Zoom's LiveTrak L6 line. It has four
  combo inputs and eight line inputs, records up to 12 tracks plus a stereo mix
  to an SD card in 32-bit float, and works as a 14-in, 4-out USB audio
  interface. It has scene buttons, a sub-out and a monitor output, and MIDI in
  and out jacks as well as USB MIDI. It runs on AA batteries or USB power.
stock_firmware: "1.10"
links:
  manufacturer: https://zoomcorp.com/en/us/digital-mixer-multi-track-recorders/digital-mixer-recorder/livetrak-l6max/
notes: >-
  No custom firmware for the L6max is known. The Overdub and stereo AUX firmware
  listed for the original L6 does not cover it.
