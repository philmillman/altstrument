name: Zoom MS-50G / MS-60B / MS-70CDR and G-series
manufacturer: Zoom
category: pedal
added: 2026-10-13
tagline: Multi-effects pedals with installable effect files
description: >-
  This entry covers the MultiStomp pedal range from Zoom, a Tokyo-based maker of
  audio equipment, together with Zoom's G-series and related multi-effects
  pedals. The original MS-50G came out in 2012 as a small pedal that runs up to
  six effects at once, in any order, from a library of effects and amp models.
  The MS-60B is the bass version, and the MS-70CDR covers chorus, delay and
  reverb. The later MS Plus models (MS-50G+, MS-60B+, MS-70CDR+ and others)
  use a newer effect format and are covered by the same entry.
links:
  manufacturer: https://zoomcorp.com/en/us/
  community:
    - label: r/zoommultistomp
      url: https://www.reddit.com/r/zoommultistomp/
notes: >-
  Two incompatible effect formats exist: ZDL (G1on, G1Xon, B1on, B1Xon, MS-50G,
  MS-60B, MS-70CDR) and ZD2 (G3X, G3n, G3Xn, G5n, B3n, AC-2, AC-3 and the Four
  series), and effects from one cannot be used on the other. Effect files can be
  extracted from official firmware updaters and installed with these tools. The
  newer MS-plus pedals are only partly supported by zoom-zt2. All of this is
  unsupported by Zoom and used at your own risk.
