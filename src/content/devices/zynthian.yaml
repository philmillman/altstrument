name: Zynthian V5.1 / V5 / V4
manufacturer: Zynthian
category: diy-platform
added: 2026-10-20
tagline: Open-source Raspberry Pi synth, sampler and effects workstation sold as a DIY kit
description: >-
  Zynthian is an open synth platform: a Raspberry Pi in an aluminium case that
  runs ZynthianOS, a Debian-based image with a touch user interface that hosts
  chains of synth engines, LV2 plugins, samplers, effects, a MIDI sequencer and
  a mixer. The V5 kit (2023) puts a Raspberry Pi 4 on a main board with
  balanced stereo audio in and out, a headphone output, MIDI in, out and thru on
  DIN sockets and a USB device port, and adds a 5-inch capacitive touchscreen,
  20 backlit buttons and four push encoders. The V5.1 kit (2024) is the same
  design reworked for the Raspberry Pi 5.

  The earlier V4 kit (2020) uses a Raspberry Pi 4 with a 3.5-inch touchscreen,
  four encoders with switches, a HiFiBerry DAC+ADC sound card and a Zynaptik
  board for MIDI. The same image also runs on DIY builds with a Raspberry Pi 3,
  4 or 5 and a supported display and sound card, and the circuit boards are
  published under CC-BY-SA-4.0 in the zynthian-hw repository.
platform: Raspberry Pi 5 (V5.1), Raspberry Pi 4 (V5, V4); Raspberry Pi 3, 4 or 5 in DIY builds; Debian-based Linux
stock_firmware: ZynthianOS Vangelis-2610
