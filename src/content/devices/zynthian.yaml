notes: >-
  ZynthianOS lives on the microSD card. A new major release (Oram, then
  Vangelis) means writing a fresh image to a card of 32 GB or more with
  Raspberry Pi Imager; point releases within a major version install from the
  update option in the UI or webconf. On first boot the image detects the
  official V5.1, V5, V4, V3, V2, Z2 and MINI V2 hardware; DIY builds and older
  kits are set up from webconf under Hardware > Kit. Oram is no longer
  supported since Vangelis became stable in October 2026, and the project
  advises copying data by hand rather than restoring an Oram configuration
  backup. Snapshots, presets, LV2 plugins and controller drivers that run on
  the stock OS are content, not firmware, and are only catalogued when they
  change how the instrument works.
