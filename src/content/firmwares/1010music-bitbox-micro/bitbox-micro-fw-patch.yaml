device: 1010music-bitbox-micro
name: Bitbox Micro firmware patch
summary: Python patcher that edits your own 2.3.4 image to put delay and reverb sends, pad envelopes, LFOs, the compressor and a new master EQ and filter on MIDI, plus Flip UI, Clk Loss and ProgChange settings.
description: >-
  Reads an official Bitbox Micro 2.3.4 image, refuses anything else, and writes
  a patched image whose splash reads "community fw". Per-pad parameters and the
  five compressor controls become MIDI CCs, and a master EQ and filter with ten
  algorithms is added. The 2.3.8-mod release adds three settings on the module:
  Flip UI for upside-down mounting, Clk Loss to hold the last tempo when a clock
  stops, and a ProgChange option that ignores repeats of the loaded preset. The
  2.3.9-mod release adds four effect slots across the master mix, with sixteen
  effects ported from Airwindows plugins. The 2.3.10-mod release adds a jungle
  toolkit for Clip pads, with loops locked to the clock, 24 Live Flip modes and
  turntable-style hold buttons, plus three Airwindows compressors and screen
  themes. The 2.3.11-mod release adds a browser patcher and makes the module
  tolerate microSD cards that answer slowly. The author states it is unofficial and that 1010music neither wrote nor endorses
  it, and asks that support requests not go to 1010music.
status: active
authors:
  - name: modularpatcher
    url: https://github.com/modularpatcher
source: https://github.com/modularpatcher/bitbox-micro-fw-patch
source_status: open
license: MIT
license_notes: >-
  Covers patch_micro.py and the documentation only. 1010music's firmware is not
  included and no rights over it are granted. The LICENSE file also carries the
  MIT notice for the Airwindows effects (Chris Johnson) that 2.3.9-mod ports.
homepage: https://modularpatcher.github.io/bitbox-micro-fw-patch/
distribution: patch-your-own
requires_stock: 2.3.4
install_notes: >-
  Download the stock 2.3.4 image (MICRO234.zip) from 1010music yourself, drop it
  on the web patcher page or run patch_micro.py on its MICRO.BIN, and copy the
  result to the microSD card.
  Never share a patched image. The README says the bootloader is not touched, so
  the module cannot be bricked, and flashing stock back before service is
  advised.
tags: [midi, fx, lfo, ui, performance]
