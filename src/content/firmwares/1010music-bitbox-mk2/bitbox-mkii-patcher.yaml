device: 1010music-bitbox-mk2
name: Bitbox MkII patcher (2.3.4+c)
summary: Browser patcher that turns your own official 2.3.4 image into 2.3.4+c, adding vertical waveform zoom, a screen saver with MIDI or CV wake, pitch-preserving sample speed and default-reset on dial double-tap.
description: >-
  Licence note: the repository has no licence file or licence statement, only an
  "as is" disclaimer from the author, so the terms for reuse are not stated.

  The page checks your 2.3.4 image by SHA-256, applies a binary delta held in the
  repository, checks the result again and offers it as BITBOXMK2.bin to copy to
  the card; the module identifies itself as 2.3.4+c. The changes are vertical
  waveform zoom from 25 to 3200 percent, an optional screen saver with a MIDI or
  CV trigger wake, Sample Speed from 50 to 200 percent that keeps pitch and takes
  LFO or CV modulation, and double-tap dial defaults that keep modulation
  settings. Several native Pitch voices or one exclusive Speed voice can play at
  a time. The repository holds the static site, the delta and a reference PDF,
  not 1010music's firmware or the patched firmware; the source of the changes is
  not published. The page says it is an independent customization and not an
  official release.
