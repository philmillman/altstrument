device: 1010music-bitbox-mk2
name: Bitbox MkII patcher (2.3.4+c8)
summary: Browser patcher that turns your own official 2.3.4 image into 2.3.4+c8, adding a per-pad pattern generator, pitch-preserving sample speed, vertical waveform zoom, extra modulation sources and a screen saver with MIDI or CV wake.
description: >-
  Licence note: the repository has no licence file or licence statement, only an
  "as is" disclaimer from the author, so the terms for reuse are not stated. A
  third-party notices file credits the code taken from other projects for the
  pattern generator.

  The page checks your 2.3.4 image by SHA-256, applies a binary delta held in the
  repository, checks the result again and offers it as BITBOXMK2.bin to copy to
  the card; the module identifies itself as 2.3.4+c8. Changes include vertical
  waveform zoom, an optional screen saver with a MIDI or CV trigger wake, Sample
  Speed from 50 to 200 percent that keeps pitch and can combine with native
  Pitch, double-tap dial defaults, a clocked pattern generator for each of the 16
  pads, extra per-pad modulation sources, a modulated master filter sweep and
  extra delay and distortion controls, plus live-input filter, tone and dry-level processing with a persistent Input FX pad. The repository holds the static site, the
  delta and reference PDFs, not 1010music's firmware or the patched firmware; the
  source of the changes is not published. The page says it is an independent
  customization and not an official release.
status: active
authors:
  - name: vwal
    url: https://github.com/vwal
source: https://github.com/vwal/bitbox-mkii-patcher
source_status: patcher-only
license: unspecified
license_notes: >-
  No LICENSE file. The README's closing note says the modification is shared "as
  is" without warranty and free of charge, which disclaims liability but grants
  no licence.
homepage: https://vwal.github.io/bitbox-mkii-patcher/
distribution: patch-your-own
requires_stock: 2.3.4
install_notes: >-
  Back up the microSD card, download 1010music's 2.3.4 package (BITBOXMK2234.zip)
  yourself and extract it, then select the firmware on the patcher page, which
  runs in the browser. Save the result as BITBOXMK2.bin with no duplicate-download
  suffix, copy it to the card root, power off, insert the card, hold INFO while
  powering on and release it when the upgrade message appears. The update takes
  about 30 seconds and the module reboots by itself. To go back, put the original
  BITBOXMK2.bin from the official 2.3.4 archive on the card and repeat the steps.
