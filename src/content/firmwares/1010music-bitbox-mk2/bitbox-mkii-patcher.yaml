homepage: https://vwal.github.io/bitbox-mkii-patcher/
distribution: patch-your-own
requires_stock: 2.3.4
install_notes: >-
  Back up the microSD card, download 1010music's 2.3.4 package (BITBOXMK2234.zip)
  yourself and extract it, then select the firmware on the patcher page, which
  runs in the browser. Save the result as BITBOXMK2.bin with no duplicate-download
  suffix, copy it to the card root, power off, insert the card, hold INFO while
  powering on and release it when the upgrade message appears. The update takes
  about 30 seconds and the module reboots by itself. To go back, put the original
  BITBOXMK2.bin from the official 2.3.4 archive on the card and repeat the steps.
