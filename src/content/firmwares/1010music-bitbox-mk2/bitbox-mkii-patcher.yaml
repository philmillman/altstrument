device: 1010music-bitbox-mk2
name: Bitbox MkII patcher (2.3.4+c4)
summary: Browser patcher that turns your own official 2.3.4 image into 2.3.4+c4, adding a per-pad pattern generator, pitch-preserving sample speed, vertical waveform zoom, extra modulation sources and a screen saver with MIDI or CV wake.
description: >-
  Licence note: the repository has no licence file or licence statement, only an
  "as is" disclaimer from the author, so the terms for reuse are not stated. A
  third-party notices file credits the code taken from other projects for the
  pattern generator.

  The page checks your 2.3.4 image by SHA-256, applies a binary delta held in the
  repository, checks the result again and offers it as BITBOXMK2.bin to copy to
  the card; the module identifies itself as 2.3.4+c4. Changes include vertical
  waveform zoom, an optional screen saver with a MIDI or CV trigger wake, Sample
  Speed from 50 to 200 percent that keeps pitch and can combine with native
  Pitch, double-tap dial defaults, a clocked pattern generator for each of the 16
  pads, extra per-pad modulation sources, a modulated master filter sweep and
  extra delay and distortion controls. The repository holds the static site, the
  delta and reference PDFs, not 1010music's firmware or the patched firmware; the
  source of the changes is not published. The page says it is an independent
  customization and not an official release.
status: active
