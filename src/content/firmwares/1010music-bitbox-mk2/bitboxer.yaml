    url: https://github.com/BartBral
source: https://github.com/BartBral/Bitbox-editor
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement in the repository.
homepage: https://bartbral.github.io/Bitbox-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page, set the working folder that holds your samples, load a preset, edit it and save the ZIP, then
  unzip it into the presets folder on the SD card. Folder import works in Chromium browsers only.
