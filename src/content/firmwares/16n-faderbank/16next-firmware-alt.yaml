device: 16n-faderbank
name: 16next firmware (morphing fork)
summary: >-
  Fork of the 16next RP2040 faderbank firmware that adds a per-fader morphing option. A fader marked as a morph master scales the faders below it, and the configuration block grows from 86 to 92 bytes.
description: >-
  The fork is based on 16next 3.1.1. A morph master fader multiplies the output of the faders with a lower index, for
  USB and TRS output, in 7-bit or 14-bit resolution. The configuration gains two 16-bit flag fields, one for USB and one for TRS,
  and the SysEx configuration payload becomes 92 bytes. The stock web editor does not know about those fields.
  The fork's README is the upstream text and does not describe the new option. A code comment says the TRS path
  does not consider morph masters yet and that high-resolution scaling is wrong. Release v3.2 attaches a prebuilt
  UF2; the code can also be built with the Pico SDK.
status: active
authors:
