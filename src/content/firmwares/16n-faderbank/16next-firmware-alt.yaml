    url: https://github.com/skolari93
  - name: Damien Clarke
    url: https://github.com/16n-faderbank
source: https://github.com/skolari93/16next_firmware_alt
source_status: open
license: MIT
license_notes: >-
  The LICENSE.md carries the copyright line of Damien Clarke (2016), the author of the upstream 16n firmware.
homepage: https://github.com/16n-faderbank/16nx
based_on: 16n-faderbank/16next-firmware
distribution: download
requires_stock: 16nx revision C or another RP2040 board
install_notes: >-
  Copy the release UF2 to the RP2040 in bootloader mode, or build with the Pico SDK and CMake as in the upstream 16next README.
  Open the configuration afterwards, since the memory map differs from the upstream firmware.
brick_risk: false
tags: [midi, usb-midi, i2c, platform, fork]
