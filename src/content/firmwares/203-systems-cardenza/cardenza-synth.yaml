    date: 2026-11-18
    url: https://github.com/203-Systems/CardenzaSynth/releases/tag/v0.2.2
    notes: Shows the Cardenza as online in the 203 community while the Launcher has Wi-Fi and a bound account, and saves the current work before installing an update sent from the website. The firmware drops Wi-Fi while a play needs memory and does not connect during sound, recording or long sample playback, so a project with many effects may never come online. Includes the CardenzaHAL fix for an interface freeze after the online service stopped.
