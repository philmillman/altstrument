distribution: source-only
install_notes: >-
  Build with the GCC ARM toolchain and the stmlib and stm-audio-bootloader
  repositories next to the project. Run make wav and play the file into the
  module's audio input to use the built-in bootloader (up to about five
  minutes), or flash main.bin at 0x08008000 over the SWD header with an
  ST-Link or J-Link. Keep the official 4ms firmware to go back.
brick_risk: false
