device: 4ms-metamodule
name: MetaModule firmware
summary: Official open-source firmware for the MetaModule. Runs virtual patches built from native and ported plugin modules, with MIDI expander and VCV expander support as of v2.4.0.
description: >-
  v2.4.0 added MIDI expander support, CPU load re-balancing and VCV expander
  modules. Plugins are built against the separate plugin SDK. The MetaModule
  name may not be used in derivative works.
