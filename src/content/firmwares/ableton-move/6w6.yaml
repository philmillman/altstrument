device: ableton-move
name: 6W6
summary: >-
  Schwung drum module that synthesizes a TR-606-style kit plus a clap, with per-voice drive, seven distortion types, hat choke, send reverb and delay, and a browser editor.
description: >-
  Every voice is synthesized with no samples: kick, snare, two toms, closed and open hat, cymbal and hand clap.
  The metal sounds use banks of partials fitted to hardware recordings. Each voice has tune, decay, drive, a
  choice of seven distortion types, level and sends to a reverb and a delay, and the master bus has its own
  distortion. Level follows velocity, hat choke is a switch, and the module has no sequencer, so it plays from
  Move's sequencer or pads. The voices start from analogcode's 606-Inspired-Synth-Drums, vendored unmodified;
  the cymbal, second hat bank, drive stages, choke and accent are additions. The README says it was built with
  AI assistance and is not affiliated with Roland.
