device: ableton-move
name: 8W8
summary: >-
  Schwung drum module with sixteen synthesized TR-808-style voices modelled from the service notes, filling the left pad block, with per-voice drive, distortion and sends.
description: >-
  Sixteen voices are synthesized with no samples: bass drum, snare, three toms, three congas, rim shot, claves,
  maracas, hand clap, cowbell, and closed and open hats. The README says each is modelled from the TR-808
  service notes and the bass drum analysis by Werner, Abel and Smith, and then checked against hardware
  recordings. Voices share the drive, distortion and reverb and delay send controls of the author's other drum
  modules, except that the kick has no sends, and the kit fills the left 4 by 4 pad block, so Master sits on the
  jog wheel. The README says it was developed with AI assistance and is not affiliated with Roland.
