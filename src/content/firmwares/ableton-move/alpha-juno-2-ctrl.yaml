device: ableton-move
name: Alpha Juno 2 Ctrl
summary: >-
  Schwung overtake module that edits and stores patches on a Roland Alpha Juno 1 or 2 or an MKS-50 over USB-MIDI SysEx, putting all 36 tone parameters on Move's knobs.
description: >-
  The module sends and receives SysEx through Move's USB port and spreads the tone parameters over five pages of up to eight
  knobs: DCO, VCF, VCA and modulation, envelope, and LFO with chorus. Its menu has a patch library that saves the current
  patch as JSON and imports .syx files. It is a JavaScript module with no DSP component, and the repository's only README line is a one-sentence description.
status: active
