homepage: https://github.com/madeinspace/move-juno-controller
distribution: download
requires_stock: Schwung installed on the Move, with the Alpha Juno or MKS-50 connected to Move's USB port
install_notes: >-
  Needs Schwung. Install it from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the
  tarball from the release. The synth connects over USB-MIDI.
brick_risk: false
