device: ableton-move
name: Amino
summary: >-
  Schwung sound generator that models an 8-bit wavetable synth in the style of the Waldorf Protein, with four layers, a mod matrix, nine effect types and 324 factory presets. A WebAssembly build runs in the browser.
description: >-
  Amino has eight voices, up to sixteen when the CPU allows, and four layers that can each follow a MIDI channel. It plays stepped,
  aliased 8-bit wavetables through a multimode filter with four envelopes, two LFOs and an eight-slot mod matrix, followed by two
  effect slots. Of its 74 wavetables, 52 are generated by code and 22 come from the CC0 AKWF-FREE set. The pages are laid out for Move's
  eight encoders and display, and a Remote UI opens in Schwung Manager. The README says it is not a Waldorf product and has no built-in
  arpeggiator. The same C engine builds to WebAssembly for a browser page that takes Web MIDI or computer-keyboard input. That page
  plays the synth in the browser and does not connect to a Move.
status: active
authors:
  - name: klaine
    url: https://github.com/klaine
source: https://github.com/klaine/amino
source_status: open
license: MIT
license_notes: >-
  The 22 AKWF-FREE wavetables are CC0 and the rest of the tables are generated; THIRD_PARTY_NOTICES.md lists them.
homepage: https://klaine.github.io/amino/
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Download amino-module.tar.gz from a release and install it in Schwung Manager, or extract it into
  /data/UserData/schwung/modules/sound_generators/ and rescan modules. A deploy script copies a local build over SSH.
brick_risk: false
tags: [synth-engine, wavetable, synth, web]
