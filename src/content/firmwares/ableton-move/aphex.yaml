    url: https://github.com/filliformes
source: https://github.com/filliformes/aphex-move
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install Aphex from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
