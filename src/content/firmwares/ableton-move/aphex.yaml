device: ableton-move
name: Aphex
summary: >-
  Schwung sound generator modelled on the Korg MS-10 and MS-20: two oscillators, switchable Korg-35 and OTA filter circuits, a source-side patchbay and line-in processing, with 41 factory patches.
description: >-
  Aphex is a monophonic synth with two oscillators, a drive stage and a high-pass into low-pass filter cascade, with a choice between an early Korg-35 circuit and a later OTA circuit. A patchbay picks the source for each modulation input, and an External Signal Processor turns the Move line input into pitch, envelope and gate signals. Analog drift gives each instance its own detune and wobble. An MS-10 mode reduces the voice to one oscillator, the low-pass filter and one envelope. The first release is monophonic with last-note priority.
status: active
authors:
