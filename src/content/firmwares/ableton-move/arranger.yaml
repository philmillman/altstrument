device: ableton-move
name: Arranger
summary: >-
  Schwung overtake module for building songs from a library of MIDI drum clips, then performing them from setlists or jamming, with chord and instrument tracks, click and Schwung chain editing.
description: >-
  Arranger builds songs from MIDI drum clips arranged into sections, with trimming of each clip, chord tracks in
  the song's key and up to two instrument tracks that follow the chords or the drum hits. Songs can be placed in
  setlists with a count-in, played with queued section and song jumps, or layered live in a jam mode that
  adjusts tempo. Output can go to external MIDI, Move tracks or the Schwung chains, and the knobs can be mapped
  to chain parameters. The drum clip library is supplied by the user. HELP.md in the repository documents every
  screen.
status: active
authors:
  - name: chaolue
    url: https://github.com/chaolue
source: https://github.com/chaolue/schwung-arranger
source_status: open
license: MIT
homepage: https://github.com/chaolue/schwung-arranger#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Arranger from Schwung's module store, or run the repository's install script. It loads
  as an overtake module from the Schwung tools menu and takes over the Move's surface.
brick_risk: false
tags: [sequencer, midi, drums, performance]
