device: ableton-move
name: Beat Bank
summary: >-
  Schwung MIDI effect that loops one of 457 hand-written drum patterns across 24 genres and plays them through the drum synth in the same slot, with swing and per-voice pad mapping.
description: >-
  Beat Bank holds recognisable grooves with no generation or randomness, from boom-bap and house to jungle, funk, bossa and afrobeat. The jog audition patterns in the
  current genre, knob 8 changes genre, knobs 1 to 6 move each drum voice onto another pad of the loaded kit, and knob 7 sets swing. Its README pairs it
  with Mr. Drums, which loads Move .ablpreset kits. A Schw+Move mode can also print a pattern into a Move track as MIDI. It is the sibling of Groove Bank.
status: active
authors:
  - name: mission-minnow
    url: https://github.com/mission-minnow
source: https://github.com/mission-minnow/beatbank
source_status: open
license: MIT
homepage: https://github.com/mission-minnow/beatbank#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Beat Bank from Schwung's module store or Schwung Manager, or with the repository's install script. A drum synth in the same slot makes the sound.
brick_risk: false
tags: [sequencer, drums, midi]
