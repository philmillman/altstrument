device: ableton-move
name: Bloom
summary: >-
  Schwung overtake module that turns the Move pads into a key-aware chord surface in the style of the Orchid, with strum, arp, progression ideas and recording of chords and bass into Move clips.
description: >-
  Every pad plays a chord in the key of the Set. The rows hold major chords, minor chords, a strum plate for the
  held chord and a colour row of sus, dim, aug, seventh and add chords. Bloom can suggest four or eight chord
  progressions, lets each step have its own voicing, strum, arp, pulse, gate and bass, locks to Move's clock, and
  records the chords and bass into clips on Move tracks. The chords play through the instruments already on
  those tracks. The README says Bloom is built heavily with AI and is not affiliated with Ableton or Telepathic
  Instruments.
status: active
authors:
