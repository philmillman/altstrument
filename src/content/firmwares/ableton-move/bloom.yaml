    url: https://github.com/bondobd
source: https://github.com/bondobd/schwung-bloom
source_status: open
license: MIT
homepage: https://github.com/bondobd/schwung-bloom#readme
distribution: download
requires_stock: Schwung 1.7.3 or later, the minimum host version in the repository's catalog-entry.json
install_notes: >-
  Needs Schwung. Install Bloom from Schwung Manager once it is in the module catalog, or give Schwung Manager the
  tarball from the latest release.
brick_risk: false
tags: [chords, scales, sequencer, performance]
