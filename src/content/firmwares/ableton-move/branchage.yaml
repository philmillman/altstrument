device: ableton-move
name: Branchage
summary: >-
  Schwung MIDI effect that generates kick, snare and hat patterns with a Grids-style pattern map and lets each lane branch to an alternate or random note by probability.
description: >-
  Branchage is a chainable MIDI effect with three lanes. A pattern generator in the spirit of Mutable Instruments
  Grids sets the rhythm, and each lane then has a branch gate in the spirit of Branches: a hit can stay on the
  lane's note, switch to an alternate note, or become a random note from a range. Sync follows Move's transport
  when Move's MIDI clock out is on, or runs from the module's own tempo. It has main, grid and branch pages.
  The code is described as written clean-room from Mutable Instruments documentation, with new pattern tables.
  The repository has no licence file, and its build folders contain compiled shared libraries.
status: active
authors:
