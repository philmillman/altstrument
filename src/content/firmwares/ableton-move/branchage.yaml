    url: https://github.com/broduoliviercontact-web
source: https://github.com/broduoliviercontact-web/Schwung-Midi-Fx-branchages-Multi-Random-generator
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README gives no licence. docs/LICENSE_NOTES.md records that the
  Grids algorithm is MIT-licensed upstream and that this code is a clean-room version, but it states no licence
  for Branchage itself.
homepage: https://github.com/broduoliviercontact-web/Schwung-Midi-Fx-branchages-Multi-Random-generator#readme
distribution: download
requires_stock: Schwung installed on the Move; Move's MIDI Clock Out set to On for Move sync
install_notes: >-
  Needs Schwung. Install Branchage from Schwung's module store, or build it and copy it to the midi_fx modules
  folder on the Move. In Move sync mode the module stays silent unless Move's MIDI Clock Out setting is on.
brick_risk: false
