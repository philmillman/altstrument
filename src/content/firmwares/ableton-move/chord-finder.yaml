device: ableton-move
name: Chord Finder
summary: >-
  Schwung overtake tool that turns Move's pads into a scale-aware chord explorer, with 16 chords and voicings per root, eight stored chords played as a progression, roman numerals and MIDI export.
description: >-
  The left half of the pad grid plays notes and picks a root, and the right half offers 16 chords and voicings that fit that
  root and the selected scale. Chords sound through a Move instrument or an external MIDI device, up to eight can be stored
  and looped as a progression, and the screen shows the chord name on a small piano keyboard. Version 0.5.0 adds a theory
  view, roman numerals including secondary dominants and borrowed chords, and export of the progression as an Impressive Chords preset
  and a standard MIDI file. The README says it is not made or supported by Ableton.
status: active
authors:
  - name: lukeco11
    url: https://github.com/lukeco11
source: https://github.com/lukeco11/chord-finder-for-move
source_status: open
license: MIT
homepage: https://github.com/lukeco11/chord-finder-for-move#readme
distribution: download
requires_stock: Move 1.8 or later with Schwung 0.11.6, or a Schwung release newer than 0.12.1
install_notes: >-
  Needs Schwung. Use Schwung Manager's option to install a custom module from a GitHub URL, or upload the tarball from the latest
  release. The README advises backing up sets and samples and reading Schwung's recovery guidance first.
brick_risk: false
tags: [chords, scales, midi, performance]
