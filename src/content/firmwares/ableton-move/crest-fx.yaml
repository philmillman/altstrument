homepage: https://github.com/klaine/crest-fx#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Download crest-fx-module.tar.gz from a release, install it through Schwung Manager or extract it into /data/UserData/schwung/modules/audio_fx/, then rescan modules or restart Schwung. It appears in the audio FX list as CRFX.
