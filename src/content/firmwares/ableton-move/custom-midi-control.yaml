device: ableton-move
name: Custom MIDI Control
summary: >-
  Schwung overtake module that turns the Move into a configurable MIDI controller with 16 banks of pads, knobs and buttons, each with its own channel, note or CC, colour, name and output.
description: >-
  Each of the 16 banks, selected by the step buttons, holds pads, knobs and buttons that can send notes or
  control changes on their own MIDI channel. Pads have velocity scaling, choke groups and release behaviours
  including toggle, knobs can be relative or absolute, and banks, pads, knobs and buttons can be named and
  coloured. Output can go to external MIDI, to Move or to Schwung. It opens from the tools menu. The repository
  has no licence file.
status: active
authors:
  - name: Caleb
    url: https://github.com/chaolue
source: https://github.com/chaolue/schwung-control
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README gives no licence.
homepage: https://github.com/chaolue/schwung-control#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Custom MIDI Control from Schwung's module store, or run the repository's install script.
  Open it from the tools menu with Shift and Step 13.
brick_risk: false
tags: [midi, controller-mode, performance]
