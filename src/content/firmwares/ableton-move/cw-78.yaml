device: ableton-move
name: CW-78
summary: >-
  Schwung drum module with fourteen synthesized voices modelled on the Roland CR-78 circuits and its twenty preset rhythms transcribed from the service notes.
description: >-
  The voices are synthesized with no samples and modelled from the 1979 CR-78 service notes and factory
  alignment figures: bass drum, bongos, conga, snare, rim shot, claves, hi-hat, cymbal, maracas, cowbell,
  tambourine, guiro and the metallic beat. The twenty preset rhythms come from the same document. Voices have
  tune, decay, drive, distortion and send controls like the author's other drum modules. The README says it was
  developed with AI assistance, lists the tambourine coil value as solved rather than measured, and says it is
  not affiliated with Roland.
status: active
