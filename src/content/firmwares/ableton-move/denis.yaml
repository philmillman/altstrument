device: ableton-move
name: Denis
summary: >-
  Schwung monophonic West Coast synth after the Serge modular: complex oscillator, triple wave multiplier, state-variable filter, audio-rate slope generator and a 4x8 bipolar modulation matrix played from the pads.
description: >-
  Denis has a morphing complex oscillator, a second oscillator that selects harmonics, a three-stage wavefolder, a four-mode state-variable filter and a dual-slope generator that runs from slow to audio rate with a sample-and-hold side. A modulation matrix routes four sources to eight destinations with bipolar depth, and the Move pads set the amounts. The README names the Serge Modular as the inspiration.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/denis-move
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install Denis from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [synth-engine, synth, emulator]
