device: ableton-move
name: Dissolver
summary: >-
  Schwung audio effect that turns any input into an evolving pad: it keeps the FFT magnitudes, discards phase and rebuilds the sound with random phases, with spectral gate, spread, freeze and a decay tail.
description: >-
  Dissolver analyses the input with a 4096-point FFT, keeps only the magnitudes and resynthesises them with phases that range from a phase vocoder to fully random, in the manner of PaulStretch. Controls cover a spectral gate, temporal smoothing, frequency smearing, freeze, a decaying tail of up to about eight seconds, tilt EQ, stereo width and a spectral compressor. Transients and timing in the source are not preserved by design.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/dissolver-move
