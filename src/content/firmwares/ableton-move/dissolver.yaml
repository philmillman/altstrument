license: GPL-3.0-or-later
license_notes: >-
  The LICENSE file adds a notice allowing version 3 or any later version. It credits the spectral algorithms to PaulXStretch by Nasca, Xenakios and Chappell, and the FFT to PFFFT by Julien Pommier.
distribution: download
install_notes: >-
  Needs Schwung. Install Dissolver from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
