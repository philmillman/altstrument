device: ableton-move
name: Dragonfly Hall
summary: >-
  Port of Michael Willis's Dragonfly Hall reverb to Move as an audio effect for the Move Everything host, now
  Schwung, with 25 presets and eight knob parameters.
description: >-
  Dragonfly Hall offers 25 factory presets in five categories (rooms, studios, small, medium and large
  halls). Knobs control dry, early and late levels, size, decay, diffuse, predelay and width, and the jog
  menu reaches modulation, wander and the high and low cut, crossover and multiplier settings. It is chainable
  in signal chain patches. The README calls the host Move Everything, Schwung's earlier name, and credits the
  Dragonfly Reverb project by Michael Willis and Rob van den Berg. It says the port was developed with Claude.
status: active
authors:
  - name: Brad Coomber
    url: https://github.com/wolfrenegade1976
source: https://github.com/wolfrenegade1976/move-anything-dragonfly-hall
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The LICENSE file ends with the GPL notice for version 3 or any later version, although the README and the
  module metadata say GPL-3.0. The upstream Dragonfly Reverb is GPL-3.0.
homepage: https://github.com/wolfrenegade1976/move-anything-dragonfly-hall#readme
distribution: download
requires_stock: Schwung or Move Everything installed on the Move
install_notes: >-
  Needs Schwung. The README lists the module store as coming soon and describes an install script, or
  copying the module folder to the Move's audio_fx modules folder over SSH. Build with Docker.
brick_risk: false
tags: [fx, reverb, emulator]
