device: ableton-move
name: Dronage Move
summary: >-
  Schwung tool module, distributed as a binary only, that runs an ambient drone workstation on the Move with four Plaits-based voices, per-step sequencing, eight LFOs, eight macros and eight scenes.
description: >-
  Licence note: the module is proprietary and free to use as distributed; no source is published. The
  repository holds the manual, a third-party licence file and the release metadata. Dronage Move has four voices
  built on the DSP of Mutable Instruments Plaits through a Rust port, each with its own filter, drive, envelope
  and step sequencer, feeding a shared delay, reverb and dirt section. Eight LFOs and eight macros can modulate
  most parameters, projects hold eight scenes with undo, and recordings can go directly to disk. It takes over
  the Move from Schwung's tools menu and is the Move version of the author's Dronage Terminal desktop synth.
status: active
authors:
  - name: boorch
    url: https://github.com/boorch
source_status: binary-only
license: proprietary
license_notes: >-
  Licence note: the README says the module is proprietary and the distributed binary may be used freely. The
  bundled third-party components, including the Plaits port, are listed in THIRD-PARTY-LICENSES.txt.
homepage: https://github.com/boorch/dronage-move-release#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Dronage Move from Schwung's module store, or extract dronage-tool-module.tar.gz from
  the latest release into the tools modules folder on the Move. Launch it from Shift + Vol + Step 13, then Tools.
brick_risk: false
tags: [synth-engine, sequencer, performance, mutable-instruments-port]
