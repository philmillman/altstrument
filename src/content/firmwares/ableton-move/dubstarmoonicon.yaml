device: ableton-move
name: DubStarMooniCon
summary: >-
  Schwung sound generator with two oscillators that each add two subharmonic taps on 3-limit dividers, five band-limited waveforms, a resonant multimode filter and aftertouch-aware envelopes, with a four-voice first oscillator and a monophonic second.
description: >-
  Each oscillator has a core and two taps that divide its pitch by chosen ratios from 1:2 to 1:12 (3-limit only), and the taps read the core's phase so they stay locked to it. The first oscillator is polyphonic with four voices, and the second is monophonic to hold the low end. Waveform, octave and tap division are stepped selectors, so no pitch needs to be set by ear. The signal goes through a resonant filter with several modes and an envelope, then an amplitude envelope. The module has 25 parameters over root, Osc 1, Osc 2, Filter and Tune pages. The repository's tests build the engine without a Schwung checkout or a device.
