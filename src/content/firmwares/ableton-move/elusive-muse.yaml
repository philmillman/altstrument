homepage: https://github.com/kliegsablaze/elusive-muse#readme
distribution: download
requires_stock: Schwung 1.6.2 or newer on the Move
install_notes: >-
  Needs Schwung. Install Elusive Muse from Schwung's module store, or build it with Docker and run scripts/install.sh to copy it to the Move over SSH.
brick_risk: false
