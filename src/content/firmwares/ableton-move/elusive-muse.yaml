device: ableton-move
name: Elusive Muse
summary: >-
  Schwung audio effect that leaves the signal untouched and, on a jog click, draws one of 1,000 creative prompts onto the Move's screen after a burst of pixel static, with a short chord. A tap on Shift mutes the chord.
description: >-
  The cards are written in the spirit of Brian Eno and Peter Schmidt's Oblique Strategies, and the README says none of their cards are used. The effect goes after a synth in a slot's audio effects and adds only its own notes. Its page shows the last card drawn. It needs Schwung 1.6.2 or later, and a DESIGN document in the repository explains how it works.
status: active
authors:
