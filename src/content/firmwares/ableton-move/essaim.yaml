device: ableton-move
name: Essaim
summary: >-
  Schwung sound generator with 32 self-triggering rhythmic oscillators, one per pad, each with envelope-to-FM, a filter, an LFO and scale quantisation, plus a shared delay and saturation.
description: >-
  Each pad switches on a voice that retriggers itself at its own speed, with its own decay, timbre and filter. Envelopes feed frequency modulation, the filters pick a random low-pass, band-pass or high-pass mode, and six LFO shapes can modulate level, filter or both. Pitches can be quantised to six scales with a chosen root. A bucket-brigade style delay and a saturation stage sit after the voices. A random patch button and 24 named presets are included, and a Drone mode was added in a later release.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/essaim-move
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install Essaim from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
