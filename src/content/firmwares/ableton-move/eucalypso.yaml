device: ableton-move
name: Eucalypso
summary: >-
  Schwung MIDI effect that generates up to four parallel Euclidean rhythm lanes from held notes, with per-lane steps, pulses, rotation, dropouts and seeded note variation, on the internal clock or incoming MIDI clock.
description: >-
  Each of the four lanes has its own step count, pulse count, rotation, drop amount, register note index, octave offset and seeded randomisation of note, octave, velocity and gate. Timing advances from the transport, so the rhythm does not depend on when notes arrive. Notes come from the held or latched keys, from a chosen scale, or from fixed drum pad notes 36 to 51, where pads 1 to 4 gate lanes 1 to 4. A policy decides what happens when a lane asks for a note outside the register. The README says it was developed with AI assistance.
status: active
authors:
