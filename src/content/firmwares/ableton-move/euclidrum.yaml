    url: https://github.com/filliformes
source: https://github.com/filliformes/euclidrum-move
source_status: open
license: MIT
license_notes: >-
  The repository has no LICENSE file. The README states MIT.
distribution: download
install_notes: >-
  Needs Schwung. Install Euclidrum from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release. Pair it with Weird Dreams or another drum sound generator that answers notes 36 to 43.
brick_risk: false
