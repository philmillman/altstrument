device: ableton-move
name: Euclidrum
summary: >-
  Schwung MIDI effect with eight Euclidean drum lanes on notes 36 to 43, 32 presets, per-lane rate multipliers, pattern drift and CC output for pitch and decay. Built as a companion to Weird Dreams.
description: >-
  Euclidrum starts on transport play and plays eight lanes without held notes. Each lane distributes pulses over steps with the Euclidean algorithm and has its own rate multiplier for polymetric patterns, plus accent, fill and drop probabilities. Patterns can mutate and rotate over time, velocity can be humanised, and per-lane CC messages 70 to 87 carry frequency and decay values. It runs from the internal clock or MIDI clock with swing, and live pad notes pass through. The README credits the Euclidean engine to Eucalypso by handcraftedcc.
status: active
authors:
