device: ableton-move
name: Fizzik
summary: >-
  Schwung polyphonic physical-modelling synth: an exciter drives two coupled resonators (strings, beams, plates, membranes), with aftertouch, MPE support, 12 filter voicings and a built-in effects chain.
description: >-
  Each of six voices has one exciter feeding two resonators whose cross-feedback is set by a Couple control. After the voices come a filter with 12 voicings, drive, EQ, chorus, delay, reverb, a glue compressor and a limiter. Polyphonic aftertouch shapes the notes, and MPE input gives each finger its own bend, pressure and timbre. The README says it is inspired by MechanOdd by odoare and that all algorithms were reimplemented from published references.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/fizzik-move
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install Fizzik from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [synth-engine, synth, physical-modeling]
