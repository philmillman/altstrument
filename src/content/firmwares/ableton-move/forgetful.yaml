homepage: https://kliegsablaze.github.io/forgetful/
distribution: download
requires_stock: Schwung 0.12.1 or newer on the Move
install_notes: >-
  Needs Schwung. Install Forgetful from Schwung Manager's module store, or unpack forgetful-module.tar.gz into the Move's audio_fx module folder as the README shows.
brick_risk: false
tags: [fx, looper, performance]
