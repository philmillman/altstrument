device: ableton-move
name: Forgetful
summary: >-
  Schwung audio effect with one live input sent by hand into four tape-style memories that each drift out of tune, hiss and break up as they age. The four are mixed for performing with your own recent past.
description: >-
  Forgetful has seven pages of controls and draws its own screen on Schwung 1.2 or newer, with four tanks that fill with what is left of each memory, a ring for the send and marks for the start and end points. It needs Schwung 0.12.1 or newer. An interactive manual is on the project's site. The repository's module metadata is at version 0.6.1, which is newer than the latest release.
status: active
authors:
