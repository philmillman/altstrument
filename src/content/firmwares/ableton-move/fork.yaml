device: ableton-move
name: Fork
summary: >-
  Schwung MIDI effect that splits incoming notes by pitch into up to four channel ranges and sends them to other tracks through named pipes or to external MIDI hardware.
description: >-
  Fork splits one MIDI stream at up to three configurable octave boundaries. Notes below the first split stay on
  the track, and notes in each higher range get their own MIDI channel and either go out through a named Unix
  pipe under the Schwung data folder or continue on the current track for external gear. Controllers, pitch
  bend, program change and channel pressure are copied to every active split, and active notes are tracked so
  none stick when a parameter changes. A receiver mode on another track reads a pipe and replays the stream
  with a transpose. The README suggests using it to turn the Move into several synth tracks or up to 16 MIDI
  tracks.
status: active
