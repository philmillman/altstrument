device: ableton-move
name: Frodhes
summary: Schwung sound generator that plays Frodhes' physically modelled electric piano, vibraphone and marimba on the Move, with every effect, an arpeggiator, 16 voices and its own eight-knob screen.
description: >-
  The module is the Frodhes engine from the FM-1 build with 16 voices per instrument and a higher-quality version of each
  instrument, and it keeps the FM-1 effects chain: compressor, EQ, drive, tremolo or wah, phaser, chorus, delay and reverb,
  the reverb at the full sample rate. It draws its own screen in which the Move's eight knobs appear as cards one page at
  a time, with a double touch resetting a knob. Presets F01 to F19 are the FM-1's, F20 to F57 are 38 versions made for the
  Move, and 16 user slots hold your own sounds. The arpeggiator follows the Move's tempo and transport, pad pressure can drive a
  control through a CC number, and up to four Frodhes can run at once, one per track, though the release notes say four with
  every effect on can drop audio. The Move's Full Velocity setting must be off to play at every velocity. The module ships from the
  same repository and release as the FM-1 firmware.
