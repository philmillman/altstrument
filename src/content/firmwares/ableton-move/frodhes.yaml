  with Schwung's MIT licence file beside it.
homepage: https://github.com/leonardoMirabal/frodhes/blob/main/docs/MOVE.md
distribution: download
requires_stock: Schwung on the Move (tested with Schwung 1.8.2)
install_notes: >-
  Needs Schwung, which is unofficial. In Schwung Manager (port 7700 on the Move's address) choose Install Custom Module,
  then either From GitHub URL with leonardoMirabal/frodhes or From Tarball with frodhes-module.tar.gz from the release.
  Then pick Frodhes as a track's sound generator in the chain editor. Schwung Manager shows updates for it.
brick_risk: false
