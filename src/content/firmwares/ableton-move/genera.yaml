device: ableton-move
name: Genera
summary: >-
  Schwung MIDI effect that generates evolving notes and chords in a chosen scale, with seven generation modes, a chaotic stutter engine, capture and loop, humanising and internal or MIDI clock sync.
description: >-
  Genera builds sequences from 20 scales in seven modes, including up, down, drunk walk and random. It can stack chords from triads to six-note voicings, shift octaves at random, vary velocity in four ways and record the last steps as a loop that plays beside new notes. A stutter engine adds off-grid bursts, either in free timing or on musical divisions. Move's MIDI sync out must be enabled for it to work fully.
status: active
authors:
