device: ableton-move
name: Granny
summary: >-
  Schwung sound generator that plays short grains from a WAV file, with controls for position, grain size, density, spray and jitter, a scan mode, three window shapes, mono, portamento and polyphonic voices, and an ADSR envelope.
description: >-
  Granny picks a WAV file from the Move's sample folders with Schwung's file browser and reads it as mono. Grains are emitted per voice or as one shared cloud, and a quality setting caps density and active grains per voice at three tiers. Scan moves the read position while a note is held and can wrap, ping-pong, clamp or stop at the file's ends. The README says it was developed with AI assistance. The module is silent until a sample is chosen.
status: active
authors:
