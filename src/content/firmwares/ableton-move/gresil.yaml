device: ableton-move
name: Gresil
summary: >-
  Schwung audio effect that ports the Mutable Instruments Beads granular processor to the Move, adding MIDI-clock grain seeding, freeze saved with the set and a built-in synth source.
description: >-
  Gresil runs the Beads DSP, unchanged apart from the sample rate, with up to 32 grains, a delay mode at maximum size, four recording media and reverb. The port adds grains and delay taps that follow Move's MIDI clock, a frozen buffer that is stored with the set, a wavetable source that needs no input, and a page of output filters taken from Verglas.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/gresil-move
source_status: open
license: MIT
license_notes: >-
  The LICENSE file lists the MIT notices for Emilie Gillet's Beads code and stmlib from the pichenettes/eurorack repository, and for the Move port. The README says the Beads DSP is ported unchanged.
distribution: download
install_notes: >-
  Needs Schwung. Install Gresil from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [fx, granular, eurorack-port]
