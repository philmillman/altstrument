device: ableton-move
name: Groove Bank
summary: >-
  Schwung MIDI effect with 97 rhythm templates in 14 genres that retrigger the chord you hold on the beat, locked to the clock; it plays the synth in its own slot, not Move's instruments.
description: >-
  Groove Bank owns the timing and the player owns the pitches: holding a chord or note retriggers it with a fresh attack on each hit, and a chord change follows on the next hit. Jog
  auditions grooves in the current genre and knob 8 changes genre. Since v0.1.15 it runs only in Schwung mode, not Schw+Move mode, because Move echoes the injected notes back and
  drains the held ones. A sampler such as wav-player or an SF2 synth works as the sound generator. It is the sibling of Beat Bank.
status: active
authors:
  - name: mission-minnow
    url: https://github.com/mission-minnow
source: https://github.com/mission-minnow/groovebank
source_status: open
license: MIT
homepage: https://github.com/mission-minnow/groovebank#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Groove Bank from Schwung's module store or Schwung Manager, or with the repository's install script. Put a synth or sampler in the slot's sound generator.
brick_risk: false
tags: [sequencer, midi, performance]
