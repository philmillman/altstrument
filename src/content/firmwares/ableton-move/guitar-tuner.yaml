device: ableton-move
name: Guitar Tuner
summary: >-
  Schwung tool that shows the nearest note and cents offset from the Move's microphone or line input using YIN pitch detection, with a needle meter on the screen and a letter glyph lit on the pad grid.
description: >-
  The tuner covers roughly 70 to 1200 Hz with a 2048-sample YIN window and switches between the microphone and the line input when a plug is detected. The pads show the note letter in a three-by-four glyph with a sharp or flat beside it, coloured by how close the pitch is. A setting in Schwung's web configuration chooses flats or sharps. The README says it was developed with AI assistance.
status: active
authors:
  - name: eightfour
    url: https://github.com/eightfour-dev
source: https://github.com/eightfour-dev/schwung-guitar-tuner
source_status: open
license: MIT
license_notes: >-
  The LICENSE file names Charles Vestal as copyright holder, the same text as the Schwung module template.
distribution: download
install_notes: >-
  Needs Schwung. Install Guitar Tuner from the Tools section of Schwung's module store, or build it with the repository script and install the tarball with Schwung Manager. Open it from the Tools menu.
brick_risk: false
tags: [utility, performance]
