device: ableton-move
name: Kit Builder
summary: >-
  Schwung overtake module that builds 16-pad drum kits by drawing random samples from the Move library by
  role, then saves them as native Move drum presets.
description: >-
  Kit Builder fills each pad from one or more of 22 sample categories, classified from folder names with a
  filename fallback. Pads can be auditioned, locked, re-rolled one at a time or matched in loudness, and a
  transient 16-step sequencer plays the kit as a pattern. Samples come from the user library, the core
  library or both, and rejected or favourite samples are remembered. Saving writes a kit file and an
  .ablpreset drum preset into the Move's track presets, which the README says also loads in MrDrums. An
  optional exporter writes Akai MPC .xpm files.
status: active
authors:
