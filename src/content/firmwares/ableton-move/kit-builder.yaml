    url: https://github.com/sd88me
source: https://github.com/sd88me/schwung-kit-builder
source_status: open
license: MIT
license_notes: A vendored Dropbear build under src/vendor has its own licence file.
homepage: https://github.com/sd88me/schwung-kit-builder#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Kit Builder from Schwung's module store or Schwung Manager, or build it from source
  and copy it to the Move with the install script.
brick_risk: false
tags: [sampler, drums, utility, performance]
