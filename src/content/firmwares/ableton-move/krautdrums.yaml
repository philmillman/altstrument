device: ableton-move
name: KrautDrums
summary: >-
  Schwung drum machine with 16 tonal voices modelled on the Elka Drummer One bridged-T resonators, plus a studio effect chain of preamp, tape, filter, phaser, three delays, three reverbs and a bus compressor.
description: >-
  Nine voices follow the Elka Drummer One and seven are hand-tuned variations. Each voice is a resonator with a shaped trigger pulse and pitch drift as it decays. The module carries the original's 16 rhythm patterns, up to eight at once, and a pre-effect chain based on V72 preamps, Studer A80 tape, a diode-ladder filter and a phaser. Delay models are an Echoplex EP-3, a Binson Echorec and an RE-201, reverbs are an EMT 140 plate, a spring and a live chamber, and a bus compressor follows. The repository includes SPICE netlists of the voices.
status: active
authors:
