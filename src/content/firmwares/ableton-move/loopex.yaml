device: ableton-move
name: Loopex
summary: >-
  Schwung Overtake module that turns the Move into a 16-track stereo tape looper with up to four playheads per loop, glitch effects on the right pads, two send buses, a tape input stage and session save and load.
description: >-
  Each left pad is a free-running stereo loop of up to 45 seconds, with its own speed, tone, sends and envelope, and up to four playheads in forward, backward, ping-pong or jump modes. Overdub modes include replace, multiply and a disintegrating mode. The right pads hold pressure-sensitive punch-in effects. Sends use a 24-effect Palette engine and four reverbs. Later releases add a mode that locks loops to Move's bars, a dynamic sampler, tape wear and sessions saved as WAV. The README credits code from Mutable Instruments Clouds and Warps, Signalsmith DSP and Stretch, and Airwindows, all MIT.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/loopex-move
source_status: open
license: GPL-3.0-only
license_notes: >-
  The repository has no LICENSE file. The README states GPL-3.0 with no "or later" wording. Vendored MIT code keeps its own licence files under overtake-shell/vendor. The repository also holds two small BlackBox .syx files.
homepage: https://filliformes.github.io/loopex-move/
distribution: download
install_notes: >-
  Needs Schwung. Install Loopex from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release. It runs as an Overtake module, which takes over the Move interface.
brick_risk: false
tags: [looper, sampler, fx, performance]
