device: ableton-move
name: Magneto
summary: >-
  Schwung audio effect that records the signal in its slot onto two virtual cassette sides and plays it back with wow, flutter, hiss and tape models, with variable speed, reverse, scrub, stutter and tape-stop.
description: >-
  Magneto records whatever precedes it in the chain onto two sides of tape, each up to 30 seconds, and plays them back with tape character and per-machine EQ voices. Performance controls cover speed, reverse, fast-wind, scrub, jump, scan, stutter, dropouts and tape-stop. It records and loads WAV files, can sync a take length to MIDI clock, and stores recordings with the set. The README names the Library of Congress C-1 cassette player and the Tascam Portastudio as inspirations, calls the DSP original and says the master limiter adapts Airwindows ClipOnly2. Every GitHub release is marked as a pre-release.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/magneto-move
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install Magneto from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release. To loop external audio, put the Line In sound generator ahead of it in the chain.
brick_risk: false
