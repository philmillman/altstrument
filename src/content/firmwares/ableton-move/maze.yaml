device: ableton-move
name: Maze
summary: >-
  Three Schwung modules inspired by the Moog Labyrinth: a dual generative sequencer as overtake and MIDI FX
  forms, and a monophonic wavefolder synth voice.
description: >-
  Maze and Maze Lite run two 8-step generative sequencers that follow the Move's clock, quantise random
  voltages to one of 12 scales and send MIDI; they have corrupt, range, trigger-mix, bit-flip and
  sequence-reset controls. Maze is the overtake form with its own pad and step interface, and Maze Lite is the
  same engine as a MIDI effect slot. Maze Voice is a sound generator with a thru-zero oscillator, a
  wavefolder and a state-variable filter, to pair with the sequencer. Version 1.4.0 adds an external voice mode
  that outputs the raw oscillator mix.
status: active
authors:
  - name: sd88me
    url: https://github.com/sd88me
source: https://github.com/sd88me/schwung-maze
source_status: open
license: MIT
homepage: https://github.com/sd88me/schwung-maze#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install the Maze modules from Schwung's module store or Schwung Manager. Maze Voice goes in
  a signal chain slot behind Maze Lite, or is driven by Maze overtake.
brick_risk: false
tags: [sequencer, synth-engine, synth, midi, performance]
