device: ableton-move
name: Model-72
summary: >-
  Schwung sound generator that ports Idle Foundry's CA-72 circuit model of the 1970s Minimoog Model D to the
  Move, as a mono, poly or unison synth.
description: >-
  Model-72 carries CA-72's three oscillators, mixer, ladder filter and two contours onto eight knob pages,
  with CA-72's 19 factory sounds and an Init converted to the Move panel. A full circuit voice is too heavy
  for the Move's CPU, so the module uses CA-72's lighter voice model, which the README says stays within
  0.2 to 0.6 dB of the full model on most patches. It plays in mono, poly (2 to 10 voices) or unison, with
  entropy, stereo, double and drive controls. Some CA-72 features are not ported, including MIDI learn and
  audio into the external input. The README states it is unofficial and not affiliated with Idle Foundry,
  Moog Music or Ableton.
status: active
authors:
