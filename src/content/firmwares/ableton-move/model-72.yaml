  plugin-kit code, which are vendored with changes listed in engine/VENDORED.md. The Schwung plug-in header
  is MIT.
homepage: https://github.com/sd88me/schwung-model72#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Model-72 from Schwung's module store or Schwung Manager, or download
  model-72-module.tar.gz from the release, then add Model-72 to a signal chain slot.
