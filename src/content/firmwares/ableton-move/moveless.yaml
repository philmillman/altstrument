device: ableton-move
name: moveless
summary: >-
  Schwung overtake module with a generative performance sequencer: seven synthesized lanes, immutable recorded scenes, morphing between scenes, a randomizer, macros, DJ effects and a mix bus.
description: >-
  Rights warning: the repository has a release named samples that holds a 757 MB file, samples.bin, described
  only as a sample bank that the module downloads when its local copy is missing or a different size. The docs
  say the module has no samples and every voice is synthesized, and nothing states where the bank came from or
  under what terms. moveless starts in a play view with seven lanes (kick, snare, hat, percussion, bass, lead and
  chords) and an effects lane for reverb and delay. The live pattern is edited, saved as a scene that cannot be
  changed afterwards, and scenes can be morphed or wandered between. It also has eight macros, a mixer, DJ
  effects, bookmarks, harmony and global settings. Guides are in English and Russian.
status: active
authors:
  - name: eboblin
    url: https://github.com/eboblin
source: https://github.com/eboblin/moveless
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README gives no licence. The origin and terms of samples.bin, the
  sample bank in the samples release, are not stated.
homepage: https://github.com/eboblin/moveless#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install moveless through Schwung Manager at move.local:7700, which takes the module tarball
  from the v0.1.0 release, or use the repository's deploy script. Open it as an overtake module. After a new
  dsp.so, restart the Move before it is heard.
brick_risk: false
tags: [sequencer, synth-engine, drums, performance]
versions:
