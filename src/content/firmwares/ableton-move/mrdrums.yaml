device: ableton-move
name: MrDrums
summary: >-
  Schwung sound generator with 16 drum pads on notes 36 to 51, each with its own sample, gain, pan, tune, start point, envelope, choke group and chance. It can load a whole kit from a Move drum preset.
description: >-
  Each pad takes a WAV or AIFF sample from the Move's user or core sample folders, with a live preview while browsing. Per-pad controls include one-shot or gate mode, random pan, volume and decay amounts, and a chance value. Global controls cover polyphony, a velocity curve, timing humanisation and a repeatable random seed. Version 0.0.4 loads the 16 cells from a Move .ablpreset or device preset JSON file in one step. The module is silent until at least one sample is set. The README says it was developed with AI assistance.
status: active
authors:
