device: ableton-move
name: MrHyde
summary: >-
  Schwung sound generator built on the Mutable Instruments Plaits engines, with a MicroFreak-style modulation matrix, a multimode post filter, and mono, legato and polyphonic voices with unison.
description: >-
  MrHyde runs Plaits' macro oscillator models with controls for model, pitch, harmonics, timbre, morph, FM amount and the aux mix between the main and aux outputs, plus a low-pass gate with decay and colour controls. A modulation page routes an LFO, envelope, cycling envelope, random, velocity and poly aftertouch to destinations including cutoff, pitch and the macro parameters. Voice settings cover mono, mono legato or poly, unison, detune, spread and glide. Version 0.0.2 hid the six-operator FM, chiptune and drum models from the list. It was first named Freak and renamed to avoid any association with Arturia's product. The README says it was developed with AI assistance.
