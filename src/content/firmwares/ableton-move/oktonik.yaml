  for Move work the project builds on, beside the author's.
homepage: https://github.com/skerryvibe/oktonik#readme
distribution: download
requires_stock: Schwung 1.6.2 or newer on the Move
install_notes: >-
  Needs Schwung 1.6.2 or newer; the 0.2.0 release was tested with 1.7.3. Install OKTONIK from Schwung's
  module store or Schwung Manager. Back up Move projects before updating.
