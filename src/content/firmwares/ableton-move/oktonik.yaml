device: ableton-move
name: OKTONIK
summary: >-
  Schwung tool module for chord, melody and bass performance that sends MIDI to other instruments, with eight
  clips per part, a step sequencer and live recording.
description: >-
  OKTONIK puts chords with harmonic modifiers on the left side of the pad grid and melody pads and bass pads
  on the right, and routes each part to a different instrument. Version 0.2.0 added eight clips each for
  chords, bass and melody with their own length, rate and quantize, live recording with overdub and undo,
  count-in and metronome, and voicing options. Shift and a track button open a Schwung chain while OKTONIK
  keeps playing. It generates MIDI and no audio, and follows the Move's tempo. The project grew from Chord
  Pilot and uses work from Chord Finder for Move, and its notice says it was developed with the help of
  ChatGPT and Codex.
status: active
authors:
