device: ableton-move
name: Omega
summary: >-
  Schwung sound generator for techno kicks, with ten kick engines, a tempo-synced rumble made from delayed copies of the kick, a generative bass and bleep sequencer, and a master stage with sidechain duck, DJ filter and compressor.
description: >-
  The kick engines include two- and four-operator FM, wavetable, physical-modal, hard sample-layer, digital, transistor-style and analog 808-style models, a user WAV or wavetable slot and a generative voice. The rumble reads the kick back as decaying ghost copies on the sixteenth-note grid with no feedback loop. The sequencer is locked to the transport, quantised to 13 scales or free, and has nine voices and a variation page with patterns and riffs. Drive, reverb and a routing selector sit in the groove effects. From v0.5.0 the eight kick engines can also be played from DR32 pads when a second shared object is copied to the Move. The README says it is inspired by Ohm Force's Bohm, Groove and Performer.
status: active
authors:
