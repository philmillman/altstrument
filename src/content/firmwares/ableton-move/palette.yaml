device: ableton-move
name: PALETTE
summary: >-
  Schwung audio effect with four serial slots that each load any of 24 effects, with reorderable chains, per-effect instability, random patches, feedback and tempo sync. Reinterprets the Hologram Chroma Console.
description: >-
  Each of the four slots takes any of 24 effects or none, and the order of the chain can be changed live. Amount, Macro and Drift controls apply to every effect, and a global page sets feedback and tempo sync. The repository includes a manual and a vendor folder with the source of each borrowed effect. The README lists MIT-licensed DSP from Mutable Instruments Clouds and Warps, Airwindows and Signalsmith Audio, plus code from the author's other modules. The repository description says it was in testing.
status: active
authors:
