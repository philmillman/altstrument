    url: https://github.com/filliformes
source: https://github.com/filliformes/palette-move
source_status: open
license: MIT
license_notes: >-
  Vendored Mutable Instruments Clouds and Warps code, Airwindows effects and the Signalsmith DSP library are under vendor with their own licence files, and vendor/SOURCES.md records the origin of each effect.
homepage: https://filliformes.github.io/palette-move/
distribution: download
install_notes: >-
  Needs Schwung. Install PALETTE from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
