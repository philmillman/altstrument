device: ableton-move
name: Plaits
summary: >-
  Schwung sound generator that ports the Mutable Instruments Plaits macro oscillator to the Move, with 24 synthesis engines, per-engine defaults, three banks of 6-op FM presets and a note stack with return-to-held.
description: >-
  This is a port of Emilie Gillet's Plaits DSP and stmlib, built on the Move Anything port by Charles Vestal that the LICENSE credits. It exposes the engine choice, harmonics, timbre, morph, decay, low-pass gate colour, FM amount and aux mix, and resets the voice and applies per-engine defaults when the engine changes. The 6-op FM engines select from three factory preset banks of 96 presets with one knob. The repository has no README.
status: active
