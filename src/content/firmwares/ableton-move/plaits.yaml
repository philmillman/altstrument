source: https://github.com/j3threejay/move-anything-plaits
source_status: open
license: MIT
license_notes: >-
  The LICENSE file lists Emilie Gillet for the original Plaits DSP (2014-2015) and charlesvestal for the Move Anything port. THIRD_PARTY_LICENSES names Plaits and stmlib as MIT, from pichenettes/eurorack.
homepage: https://github.com/j3threejay/move-anything-plaits
distribution: download
install_notes: >-
  Needs Schwung. Install Plaits from Schwung's module store, or install plaits-module.tar.gz from the latest release.
brick_risk: false
tags: [synth-engine, synth, wavetable, emulator]
