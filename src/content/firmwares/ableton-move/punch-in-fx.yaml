device: ableton-move
name: Punch-In FX
summary: >-
  Schwung audio effect with 16 pressure-sensitive punch-in effects on the left pad grid in the style of the Teenage Engineering PO-33 K.O., triggered with Shift and a pad, with up to three stacked.
description: >-
  Loops, unison and octave shifts, stutters, scratches, a 6/8 quantise, retrigger, reverse and a kill-all pad are mapped to the left four-by-four pads. Pad velocity and aftertouch change how each effect behaves, for example duty cycle on stutter and playback speed on reverse. Knobs set tempo, volume and dry/wet, and tempo follows MIDI clock. The README names the PO-33 K.O. punch-in effects as the inspiration.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/punchfx-move
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install Punch-In FX from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [fx, performance]
