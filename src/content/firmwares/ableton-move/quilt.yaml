device: ableton-move
name: Quilt
summary: >-
  Schwung sound generator with 38 synthesised soft instruments, including pianos, organs, mallets, harp, guitar, bowed strings, glass harmonica, flutes and choir, with 114 factory presets. It uses no samples.
description: >-
  A Type knob picks the instrument, and each starts on its own default sound with two more factory presets. The Main page has the same eight knobs for every instrument, and the Instrument page is relabelled for each one. Velocity sets how hard the hammer or mallet strikes, and pad pressure drives bow, breath and swell. A modulation page has four modulators, such as velocity, MPE, an LFO or an envelope, each sent to two destinations. Module help is on the device, and on Schwung 1.7.3 or later each knob draws a small picture. It needs Schwung 1.6.3 or later.
