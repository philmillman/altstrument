device: ableton-move
name: AirPlay
summary: >-
  Schwung sound generator that receives AirPlay audio from an iPhone, iPad or Mac and plays it through a Move signal-chain slot with a gain control.
description: >-
  The module runs a bundled build of shairport-sync, which announces the Move on the network as "Move - Slot N" and writes the decoded stream into the slot, so audio effects in the chain can process it. Gain is the only parameter. It needs avahi on the device and a Wi-Fi network shared with the sending device. The README still calls the host Move Everything, Schwung's earlier name, and says the module was developed with AI assistance.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-airplay
source_status: open
license: MIT
license_notes: >-
  The module bundles a cross-compiled shairport-sync, which the README credits to Mike Brady's project and builds from its own sources.
homepage: https://github.com/charlesvestal/schwung-airplay#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install AirPlay from Schwung's module store or Schwung Manager, or build it with the repository's Docker script and copy it over SSH.
brick_risk: false
tags: [synth-engine, network, audio-input]
