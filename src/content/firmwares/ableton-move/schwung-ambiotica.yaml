distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install Ambiotica from Schwung's module store or Schwung Manager, or build it with the repository's Docker script and copy it over SSH.
brick_risk: false
