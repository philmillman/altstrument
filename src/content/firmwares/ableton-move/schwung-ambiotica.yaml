device: ableton-move
name: Ambiotica
summary: >-
  Schwung audio effect chaining a tempo-locked rolling looper, a granular shimmer, a freeze layer and a modulated reverb, with four mode presets and an eight-knob layout.
description: >-
  Ambiotica runs the signal through a looper whose length follows the host tempo, an octave-and-fifth granular shimmer, an automatic freeze layer and an eight-comb modulated reverb with an optional half-rate lo-fi tail. The four presets are called Mismember, Loona, NAPS and Flow. The eight knobs cover mix, loop layer, grain size, scatter, micro hold, decay and modulation depth and rate, and a settings menu sets loop length, modulation shape and tempo sync.
status: active
authors:
