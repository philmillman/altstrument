device: ableton-move
name: Bouba-Kiki
summary: >-
  Schwung six-voice stereo synthesizer whose oscillators read a closed two-dimensional curve, so the outline drawn on the Move display is the waveform, shaped by six geometric controls.
description: >-
  The Bouba and Kiki silhouettes are the neutral shapes, and the controls Morph, Bulge, Pinch, Spikes, Tilt and Wobble deform them. Each voice runs two phase accumulators in a feedback phase-modulation arrangement, and one shape sets the operator waveforms, their frequency ratio and the modulation index together. It has an amplitude ADSR, six factory presets and an animated display of the contour. The README documents the engine in detail and the 0.3 and 0.4 redesigns.
