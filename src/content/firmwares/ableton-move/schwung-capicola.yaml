device: ableton-move
name: Capicola
summary: >-
  Schwung audio effect that stretches time and shifts pitch live by keeping band-limited signal extrema as keyframes, with transients snapping the read head back to the present.
description: >-
  The effect reduces incoming stereo audio to keyframes and replays them from a lagging read head under separate time and pitch controls. A transient detector re-anchors the read head with a crossfade, so stretched tails ring under an output that stays on the input's rhythm. It is a port of Heavylight Industries' capicola Eurorack module, which runs on the Alchemy Lab V2, and the upstream DSP core is vendored unmodified. Each instance uses about 6 MB for its keyframe rings, against about 50 MB upstream. The README lists a known real-time violation in instance creation.
