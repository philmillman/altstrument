device: ableton-move
name: CHONK
summary: >-
  Schwung sound generator that plays a physically modelled electric bass string, ported from Punk Labs' OneTrick CHONK, with pad-selected articulations, glide and factory presets.
description: >-
  CHONK models one string with bridge and nut terminations, a pickup tapped along its length, a finger pluck and a
  noise transient, so strike force changes the tone. It is monophonic over C3 to G6, with pads below that range
  for mute, finger, pick, slap, slides, legato, ring and alternate-pick articulations. Pages cover the string,
  attack, fretting, output with a five-band EQ, and MIDI. It ships nine presets from Punk Labs. The DSP is Punk
  Labs' Faust code regenerated to C++, and the repository includes a copy of the upstream source. The README asks players to buy the original plug-in from Punk Labs.
status: active
authors:
