  upstream's copy of the GPL-3.0 text. The DSP and presets are Copyright 2024 Punk Labs LLC.
homepage: https://punklabs.com/ot-chonk
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install CHONK from Schwung's module store or Schwung Manager, or build it with the repository's Docker
