device: ableton-move
name: Chord Display
summary: >-
  Schwung audio effect that shows the chord being played, from pads or a clip on any track, with its name and a roman numeral in the Set's key, leaving audio and MIDI untouched.
description: >-
  Chord Display reads the notes that reach it on every channel and names the chord on its first page, with inversions shown as slash chords such as C/E and I/3. Its one setting is
  Channel (Auto, 1 to 16 or Omni); each Move track's MIDI Out must be set to a channel for it to see the notes. The numeral uses the Set's root note and scale as read from Move, and a
  single note clears the display. It is an audio effect because those receive every channel. The page appears in the Schwung editor, not on Move's own screen.
status: active
authors:
  - name: Nipheon
    url: https://github.com/Nipheon
source: https://github.com/Nipheon/schwung-chord-display
source_status: open
license: MIT
license_notes: >-
