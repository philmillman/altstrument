homepage: https://github.com/Nipheon/schwung-chord-display#readme
distribution: download
requires_stock: Schwung 1.6.2 or later installed on the Move (tested on 1.7.3)
install_notes: >-
  Needs Schwung. Install Chord Display from Schwung's module store or Schwung Manager, or build it with the repository's Docker script. Load it as an audio effect on any slot.
brick_risk: false
tags: [chords, scales, utility]
