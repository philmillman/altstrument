device: ableton-move
name: Chordism
summary: >-
  Schwung sound generator that turns one held note into a four-voice chord, with morphing level and pan, an FM matrix, a stereo filter, drive, delay and reverb.
description: >-
  Each note drives four oscillators tuned from a chord type or an interval list, quantised to a scale. Level and pan morphs, a filter with an envelope, a lo-fi stage, six delay modes and a plate reverb follow. Input is monophonic with last-note priority and a held-note stack, and pad aftertouch opens the filter. The 57 built-in presets are counted in the repository, and the README text still says 30. It loads as a sound generator in the signal chain.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-chordism
source_status: open
license: MIT
homepage: https://github.com/charlesvestal/schwung-chordism#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install Chordism from Schwung's module store or Schwung Manager, or download chordism-module.tar.gz from the latest release and extract it on the device over SSH.
brick_risk: false
tags: [synth-engine, synth, chords]
