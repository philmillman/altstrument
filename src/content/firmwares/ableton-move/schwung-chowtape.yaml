device: ableton-move
name: CHOWTape
summary: >-
  Schwung audio effect that models analogue tape with Jiles-Atherton magnetic hysteresis, head loss, wow and flutter, dropouts and tone control, ported to C from Jatin Chowdhury's AnalogTapeModel.
description: >-
  The hysteresis stage solves the Jiles-Atherton model with a fourth-order Runge-Kutta integrator to produce tape saturation and level-dependent compression. Around it are a speed-dependent loss filter with head bump, wow and flutter from an Ornstein-Uhlenbeck process, a chew control for damage and dropouts, degradation noise and a pre-tape tilt equaliser. Eight knobs cover drive, saturation, bias, tone, speed, flutter, chew and mix, with degrade and output reached from the chain editor.
status: active
authors:
