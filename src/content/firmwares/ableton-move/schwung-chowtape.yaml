source: https://github.com/charlesvestal/schwung-chowtape
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README states GPL-3.0-or-later and calls the module a derivative of AnalogTapeModel, which is GPL-3.0. The LICENSE file is the GPL version 3 text and the module metadata reads GPL-3.0.
homepage: https://github.com/charlesvestal/schwung-chowtape#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install CHOWTape from Schwung's module store or Schwung Manager, or build it with the repository's Docker script and copy it over SSH.
brick_risk: false
tags: [fx, tape, emulator]
