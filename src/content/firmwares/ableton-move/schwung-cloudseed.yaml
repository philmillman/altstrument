homepage: https://github.com/charlesvestal/schwung-cloudseed#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install CloudSeed from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
