device: ableton-move
name: CloudSeed
summary: >-
  Schwung audio effect that ports the CloudSeedCore algorithmic reverb, with pre-delay, input diffusion, a modulated delay network, damping and filters on the input.
description: >-
  The reverb passes the input through a pre-delay and four cascaded allpass diffusers into four modulated delay lines joined by a Hadamard feedback matrix, with a one-pole damping filter on each line. Eight knobs set mix, decay up to 60 seconds, size, pre-delay, diffusion, low cut, high cut and modulation amount, and rate and stereo width are reached through the chain parameters. It is an audio effect for signal-chain slots.
status: active
