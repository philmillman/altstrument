device: ableton-move
name: Drums Practice
summary: >-
  Schwung module that turns the Move into a rhythm trainer. Drum notation or tab scrolls across the screen and you play it on the pads, scored on timing, hands and dynamics, with rudiment, groove and ear-training drills and a tempo ladder.
description: >-
  Notes scroll toward a hit line on a percussion staff or a drum-tab view, and each hit is scored for timing against the mean and spread of your errors, per voice. The left and right halves of the pads count as the left and right hand, so sticking is checked, and accents and ghost notes are judged against your own touch. Drills are files, each with a length. The Ladder raises the tempo when a rudiment stays clean, and a Learning Path, review and progress views are included. The kit is a recorded set cut down for the Move. The README says it was developed with AI assistance and that Move's pads cannot train stick technique.
status: active
authors:
  - name: Torben Gräber
    url: https://github.com/graebe
source: https://github.com/graebe/schwung-drums-practice
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  Releases up to v1.2.1 were MIT and keep that licence. The kit is cut from Naked Drums by Wilkinson Audio (CC BY 4.0, modified, SFZ edition by kinwie), and the hand percussion and metronome are from the Versilian Community Sample Library (CC0). A copy of the MIT-licensed Schwung ABI header is vendored, and the licence texts ship in the tarball.
homepage: https://github.com/graebe/schwung-drums-practice#readme
distribution: download
requires_stock: Schwung 1.4.0 or newer on the Move (tested on 1.7.3)
install_notes: >-
  Needs Schwung. Download drums-practice-module.tar.gz from the releases page, or clone the repository and run sh scripts/install.sh, which copies the module to the Move over SSH. Schwung's own recovery guidance applies.
brick_risk: false
tags: [drums, game, utility, sdk]
