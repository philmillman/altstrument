homepage: https://github.com/charlesvestal/schwung-filter#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Filter from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
