device: ableton-move
name: Filter
summary: >-
  Schwung audio effect with a multi-mode state-variable filter, a Moog-style ladder option called Schwoog, an envelope follower and a tempo-synced LFO.
description: >-
  The filter offers low-pass, high-pass, band-pass, notch, peak and all-pass modes with logarithmic cutoff, resonance up to self-oscillation and drive. An envelope follower and a tempo-synced LFO can move the cutoff, and a separate output page holds the mix. The repository README is a short stub that points to design documents and lists further analogue filter models (SEM, Prophet, Roland) as planned, so the module description and releases are the guide to what is built.
status: active
