homepage: https://github.com/aTanguay/Schwung_FlukeDrums#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install FlukeDrums from Schwung's module store, or download flukedrums-module.tar.gz from a release and upload it with Install Custom Module in Schwung Manager at move.local:7700, then restart Schwung. Point a Move track's MIDI output at the slot's channel to play it.
brick_risk: false
