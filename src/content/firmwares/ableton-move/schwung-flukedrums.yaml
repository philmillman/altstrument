device: ableton-move
name: FlukeDrums
based_on: ableton-move/mrdrums
summary: >-
  Schwung sound generator that fills the 16 drum pads with random samples from a folder tree, with per-pad lock, single-pad reroll, 32-level undo, a kit mode that looks for kick, snare and hat names, and a Save Kit action.
description: >-
  FlukeDrums draws samples at random from the Move's own sample folders or Ableton's core library, including subfolders to a configurable depth. Roll replaces every unlocked pad, Roll Pad replaces one, and Undo puts back what the last roll changed while leaving pads locked or edited since. Kit Mode rolls the bottom two pad rows by sample name, as kick, snare, clap, hats, cymbal and tom, and leaves the top two rows fully random. A maximum-length filter keeps long loops out of the pool, and Save Kit copies the 16 files and a manifest into the Samples folder so Move's browser can load them. The per-pad volume, pan, tune, start, envelope and choke controls and the loading of Move .ablpreset kits come from MrDrums, which the repository builds on. The README says it was developed with AI assistance.
status: active
authors:
  - name: Andy Tanguay
    url: https://github.com/aTanguay
source: https://github.com/aTanguay/Schwung_FlukeDrums
source_status: open
license: MIT
license_notes: >-
