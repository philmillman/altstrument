device: ableton-move
name: Gate
summary: >-
  Schwung audio effect that works as a noise gate or a ratio-based downward expander, with threshold, attack, hold, release, range and hysteresis controls.
description: >-
  Gate mode mutes the signal below the threshold and Expand mode reduces gain by a ratio of up to 20:1. Knobs set threshold from -80 to 0 dB, attack, hold, release, maximum attenuation, expander ratio, hysteresis to stop chattering, and the mode. The repository README holds only an AI-assistance notice, so the controls here come from the module metadata and on-device help.
status: active
authors:
