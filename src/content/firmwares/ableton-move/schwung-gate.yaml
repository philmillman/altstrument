    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-gate
source_status: open
license: MIT
homepage: https://github.com/charlesvestal/schwung-gate#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Gate from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
tags: [fx, dynamics]
