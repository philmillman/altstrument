device: ableton-move
name: Hank
summary: >-
  Schwung two-operator FM sound generator played from eight macro knobs on one page, with 32 presets and no raw operator editing.
description: >-
  Each macro drives several engine values at once so that settings which only sound wrong are not reachable. Ratio is a stepped choice of 16 modulator ratios, Bright sets the FM index and adds feedback at the top of its travel, and Bite blends modulator feedback with a tube-style shaper. Tone sweeps a filter, and the remaining knobs cover envelope, noise and level. The README explains the design in detail.
