device: ableton-move
name: HUSH ONE
summary: >-
  Schwung monophonic sound generator modelled on the Roland SH-101, with a saw, pulse, sub and noise mixer, a four-pole resonant filter, two ADSR envelopes, LFO and glide.
description: >-
  The voice has selectable last-note or lowest-note priority, portamento, hold and transpose, a four-pole low-pass filter with nonlinear feedback drive, and an LFO for pitch, pulse width and filter. It can read TAL-BassLine-101 .vstpreset files that the user copies into its presets folder; polyphony, the sequencer, the arpeggiator and the FM controls of that plug-in are not supported. The README is titled HUSH ONE for Move Everything.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-hush1
source_status: open
license: MIT
homepage: https://github.com/charlesvestal/schwung-hush1#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install HUSH ONE from Schwung's module store or Schwung Manager, or build it with the repository's script and install it over SSH.
brick_risk: false
tags: [synth-engine, synth, emulator]
