device: ableton-move
name: Impressive Chords
summary: >-
  Schwung MIDI effect that plays a chord from each pad with strum, tilt, articulation order, length and clock-synced retrigger, using bundled chord sets and ones loaded from files.
description: >-
  Rights warning: the chord presets were extracted from Ableton's Expressive Chords device data (a file named expressive-chords.tar.gz is committed to the repository), and
  the bundled J-6 presets are all 100 of Roland's J-6 factory chord sets transcribed from Roland's manual.

  Impressive Chords is a native C recreation of the Expressive Chords Max for Live device, not a port, renamed to avoid implying it is Ableton's. A base note triggers the chord, with
  controls for invert, strum time, velocity tilt, seven strum orders, note length, retrigger with straight, dotted and triplet timing, choke, a note limit and gate. It can scan JSON, Ableton
  .adv, .als and .alc files, or its own .chords format, from the module's sources folder.
status: active
authors:
  - name: Matt Estela (mestela)
    url: https://github.com/mestela
source: https://github.com/mestela/schwung-impressive-chords
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README gives no licence statement. The README says the chord data was extracted from the Expressive Chords source data and from Roland's published J-6 chord set list; neither carries a stated redistribution licence.
homepage: https://github.com/mestela/schwung-impressive-chords#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Impressive Chords from Schwung's module store or Schwung Manager, or from the repository with the
  installer script's install-module-github command. Extra chord files go in the module's sources folder and are read when the Scan Presets knob is set to 1.
brick_risk: false
