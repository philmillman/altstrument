device: ableton-move
name: Schwung Installer
kind: tool
summary: >-
  Desktop app for macOS, Windows and Linux that finds a Move on the network, sets up SSH access and
  installs, upgrades and removes Schwung and its modules.
description: >-
  The installer pairs with the Move by entering a six-digit code shown on its display, generates an SSH key
  and sends it to the unit, then transfers the Schwung core and the modules you choose. When Schwung is
  already installed it switches to a management view for installing modules, upgrading the core, toggling
  the screen reader and uninstalling. It needs Git for Windows on Windows to run the install scripts. The
  desktop app is recommended in the Schwung README over the command-line script.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-installer
source_status: open
license: MIT
homepage: https://schwung.dev
distribution: download
install_notes: >-
  Download the build for your platform from the releases page, run it with the Move on the same Wi-Fi
  network and follow the pairing steps. It writes to the Move over SSH, so the Schwung warnings about
  backing up sets and knowing the DFU restore procedure apply.
brick_risk: false
tags: [flasher, platform]
