    url: https://github.com/charlesvestal
  - name: dsp56300 (Gearmulator)
    url: https://github.com/dsp56300
source: https://github.com/charlesvestal/schwung-je8086
source_status: open
license: GPL-3.0-only
license_notes: >-
  The licenses/NOTICE.txt file says the module is GPL-3.0-only because the statically linked Gearmulator code, built from a fork by the author, is GPL-3.0 without an "or later" grant. Zlib, BSD and MIT components inside it are listed with their texts. No Roland firmware is committed; the user supplies the ROM dump.
homepage: https://github.com/charlesvestal/schwung-je8086
distribution: download
requires_stock: Schwung installed on the Move and a JP-8000 v1.5 firmware dump supplied by the user
install_notes: >-
  Needs Schwung and the user's own JP-8000 v1.5 firmware dump (eight .mid files, 79,372 bytes each). Install JE-8086 from Schwung's module store or Schwung Manager, then upload the files under the module's Assets in Schwung Manager.
brick_risk: false
tags: [synth-engine, synth, emulator]
