device: ableton-move
name: JE-8086
summary: >-
  Schwung sound generator that emulates the Roland JP-8000 through the Gearmulator project, running the synth's own firmware from user-supplied ROM files, with patch and performance modes.
description: >-
  The module runs a JP-8000 emulator as three pipelined stages on separate CPU cores, kept off the audio core, and only one instance can run at a time. It has eight-voice polyphony, Patch, Performance and System modes, and sub-pages for oscillator, filter, amplifier, LFO and effects. It needs the eight .mid files of a JP-8000 v1.5 firmware bulk dump, which the user uploads through Schwung Manager; none are included. Bank files in .syx, .mid, .j8k, .pat and .pfm formats can be loaded. The repository has no README; the notes here come from the module metadata, help text and licence notices.
status: active
authors:
