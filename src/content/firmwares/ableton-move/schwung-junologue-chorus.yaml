homepage: https://github.com/charlesvestal/schwung-junologue-chorus#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install Junologue Chorus from the Audio FX section of Schwung's module store or Schwung Manager, or build it with Docker and copy it over SSH.
brick_risk: false
