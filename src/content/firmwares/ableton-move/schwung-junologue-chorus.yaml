device: ableton-move
name: Junologue Chorus
summary: >-
  Schwung audio effect that ports Peter Allwin's Juno-60 chorus emulation, with modes I, I+II and II, a dry/wet mix and a brightness control.
description: >-
  The effect reproduces the Juno-60 bucket-brigade chorus with two triangle LFOs at fixed rates of 0.513 and 0.863 Hz and delay times taken from measurements by Andy Harman. Three knobs set the mode, the equal-power dry/wet mix and a pre- and post-filter brightness, and a soft limiter sits on the input. It is an audio effect for signal-chain slots. The README is titled Junologue Chorus for Move Everything.
status: active
