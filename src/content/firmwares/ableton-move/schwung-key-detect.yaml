    date: 2026-10-03
    url: https://github.com/charlesvestal/schwung-keydetect/releases/tag/v0.1.5
    notes: The module now unloads completely, so an update takes effect without restarting.
  - version: v0.1.4
    date: 2026-08-31
    url: https://github.com/charlesvestal/schwung-keydetect/releases/tag/v0.1.4
    notes: Help correction about the short key format.
