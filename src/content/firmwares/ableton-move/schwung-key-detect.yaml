device: ableton-move
name: Key Detect
summary: >-
  Schwung audio effect that analyses the audio passing through it and shows the detected musical key, with a selectable analysis window.
description: >-
  Key Detect reads the signal in a window of a chosen length and reports the key in short form such as C maj or A min, as a read-only value for the chain. It uses libkeyfinder and FFTW, statically linked into the module binary. The README holds only an AI-assistance notice and a licence statement. The repository is close to 1 GB, so the notes here come from its README, NOTICE, tags and releases.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-keydetect
source_status: open
license: MIT
license_notes: >-
  The README says the repository source is MIT but the distributed keydetect.so statically links libkeyfinder (GPL-3.0-or-later) and FFTW (GPL-2.0-or-later), so the binary is distributed under GPL-3.0-or-later. A NOTICE file with both licence texts ships in the module tarball.
homepage: https://github.com/charlesvestal/schwung-keydetect#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Key Detect from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
tags: [fx, analysis, utility]
versions:
