device: ableton-move
name: MIDI Player
summary: >-
  Schwung MIDI effect that plays Standard MIDI Files into a chain slot's sound generator, following Move's MIDI clock, with track selection and looping.
description: >-
  Files are copied into the module's MIDI folder over SSH or SMB and chosen from the slot menu. The track setting merges all tracks or picks one, loop can be on or off, and playback starts when Move's transport runs. All notes are rewritten to channel 1, and CCs such as pan, volume and effect sends are dropped so the file does not override the target synth's mix. Tempo events in the file are ignored, events snap to the 24 PPQN clock grid, and Song Position Pointer and SMPTE files are not handled.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-midi-player
source_status: open
license: MIT
homepage: https://github.com/charlesvestal/schwung-midi-player#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install MIDI Player from Schwung's module store or Schwung Manager, then copy .mid files into the module's MIDI folder over SSH or SMB.
brick_risk: false
tags: [midi, utility, midi-fx]
