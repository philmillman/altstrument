device: ableton-move
name: MrSample
summary: >-
  Schwung sound generator that plays one audio file chromatically, with an AHDSR envelope, multimode filter,
  filter LFO and loop points with crossfade.
description: >-
  MrSample loads a single WAV, MP3, FLAC or AIFF file and plays it across the pads with root note, transpose and
  fine tune, eight-voice polyphony expandable to 16. The amplitude envelope can run as AHDSR, as a one-shot AHD
  or as a loop. A state-variable filter offers low-pass, band-pass and high-pass with an envelope amount and LFO
  modulation, and loop points have a crossfade and are read from a WAV smpl chunk when one is present. Version
  0.2.0 added an on-device editor for sample start, loop start and loop end. The README describes it as
  mirroring the Sampler workflow on the Move.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-mrsample
source_status: open
license: MIT
license_notes: >-
  The README says the bundled dr_mp3.h and dr_flac.h by David Reid are public domain or MIT-0.
distribution: download
install_notes: >-
  Needs Schwung. Install MrSample from Schwung's module store or Schwung Manager, or build it with the Docker
  script and install it with the install script.
brick_risk: false
tags: [synth-engine, sampler]
