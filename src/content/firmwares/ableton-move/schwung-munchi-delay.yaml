device: ableton-move
name: Munchi Delay
summary: >-
  Schwung audio effect that ports the Magic Wand dual delay of the CHOMPI TEMPO firmware, locked to the Move
  tempo.
description: >-
  Munchi Delay has one control, the Wand, that is off at centre. Turned one way it gives a stereo echo synced to
  the Move tempo from one bar to a sixteenth, and turned the other way the echo melts into a diffusion reverb.
  Random octave, reverse, retrigger and pan events fire on the clock, the feedback ducks under new material, and
  the buffer can be frozen. It runs in a slot effect chain, on a bus or as a master effect. The README presents
  it as a port of effect code that CHOMPI Club released as open source, and not an official release.
