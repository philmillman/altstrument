  engine is Copyright 2005 to 2010 Patrick Kunz, TAL / Togu Audio Line, vendored byte for byte.
homepage: https://github.com/legsmechanical/schwung-noisemaker#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Noisemaker from Schwung's module catalog through Schwung Manager, or unpack the release tarball
  into the sound generators module folder.
brick_risk: false
