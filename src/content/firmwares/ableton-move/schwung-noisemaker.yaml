device: ableton-move
name: Noisemaker
summary: >-
  Schwung sound generator that ports the TAL NoiseMaker virtual-analog synth, with six voices, 12 filter types, 256 factory presets and import of NoiseMaker preset banks.
description: >-
  Noisemaker runs the TAL NoiseMaker engine from DISTRHO-Ports unmodified: dual oscillators with a sub, ring mod, FM,
  sync and bitcrush, two LFOs, a spline envelope editor used as a tempo-synced modulation source, chorus, reverb and
  delay. It has four macros and 256 factory presets decoded from the engine's program data. Loose .noisemakerpreset
  files copied into the module's presets folder appear as banks, and uninstalling the module deletes them. Since v0.3.0 the
  host draws the knob pages.
status: active
