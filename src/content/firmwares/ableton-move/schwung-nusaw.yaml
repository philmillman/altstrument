    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-nusaw
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install NuSaw from Schwung's module store or Schwung Manager.
brick_risk: false
