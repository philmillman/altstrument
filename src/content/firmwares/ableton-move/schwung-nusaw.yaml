device: ableton-move
name: NuSaw
summary: >-
  Schwung sound generator that is a polyphonic synth of 3 to 25 detuned saw oscillators per voice, with a sub
  oscillator, resonant filter, chorus and delay.
description: >-
  NuSaw has eight voices, each stacking an odd number of detuned sawtooth oscillators from 3 to 25 with PolyBLEP
  anti-aliasing, analogue-style drift, stereo spread and a sine sub oscillator. A resonant low-pass filter,
  separate amplitude and filter envelopes, a Juno-style chorus and a stereo ping-pong delay follow. It has 25
  parameters, velocity sensitivity and pitch bend. The repository has no README; the description here comes from
  its development notes file and module metadata.
status: maintained
authors:
