device: ableton-move
name: OB-Xd
summary: >-
  Schwung sound generator that ports OB-Xd, a six-voice virtual analog synth after the Oberheim OB-X, with a
  graphical remote panel in Schwung Manager.
description: >-
  The module has six polyphonic voices with saw and pulse oscillators, a four-pole resonant filter, an LFO with
  sine, square and sample-and-hold shapes, amplitude and filter ADSR envelopes, and the OB-Xd per-voice
  variation settings. It loads .fxb banks and works on its own or as a sound generator in a chain, with chain
  presets for arpeggiators and effects. A remote panel styled after the OB-Xd faceplate runs in Schwung Manager
  in a browser. It is a port of the OB-Xd plug-in by Filatov Vadim (reales).
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
  - name: Filatov Vadim (reales)
    url: https://github.com/reales
source: https://github.com/charlesvestal/schwung-obxd
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL version 3 text and the README says GPL-3.0, with no later-version clause. The OB-
  Xd engine is GPL-2.0, and a copy of that text is in licenses/.
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung with SSH access enabled. Install OB-Xd from the Sound Generators section of Schwung's module
  store, from the pre-built tarball in the repository, or by building it with Docker.
brick_risk: false
tags: [synth-engine, synth, emulator]
