device: ableton-move
name: Performance FX
summary: >-
  Schwung overtake module with 32 pressure-sensitive punch-in effect pads, latching and global tilt EQ and DJ
  filter, applied to the Move mix.
description: >-
  Holding a pad switches its effect on and releasing it switches it off, with pad pressure modulating the
  selected parameter. Shift plus a pad latches the effect. The pads are laid out in rows of beat repeat and
  stutter, filter sweeps and modulation, delays and reverbs, and further effects such as octave down and vinyl.
  A tilt EQ and DJ filter sit on their own knobs, and the jog wheel sets the tempo. Version 0.12.0 or later of
  Schwung is needed for the effects to act on the Move mix, and older hosts only affect Schwung audio.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-performance-fx
source_status: open
license: MIT
license_notes: >-
  The LICENSE file names chaolue as the copyright holder, not the repository owner. The README lists Bungee
  (MPL-2.0), Eigen (MPL-2.0), PFFFT and cxxopts (MIT) as third-party code, and a vinyl_crackle.wav asset is
  committed under src/assets without a stated origin.
distribution: download
requires_stock: Schwung 0.12.0 or later on the Move
install_notes: >-
  Needs Schwung 0.12.0 or later. Install Performance FX from the Overtake Modules menu's module store, or build
  it with the Docker script and install it over SSH.
brick_risk: false
tags: [fx, performance]
