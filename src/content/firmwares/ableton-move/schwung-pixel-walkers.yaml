device: ableton-move
name: Pixel Walkers
summary: >-
  Schwung MIDI effect in which each played note becomes an animated pixel walker that retriggers the note whenever it lands on a platform, with bounce, hardness and level controls.
description: >-
  Each note spawns a walker that falls through a field of platforms, and every landing retriggers the original pitch on the selected Move track. Birth
  Note and Birth Level control the note played when a walker appears, Collision Level and Decay shape the landing velocities, which scale with fall distance, and Bounce and
  Hardness set how tall and how long the rebounds are, up to a twenty-bounce series. Randomize Platforms builds a new layout and Kill All clears every walker. It makes no sound itself and sits before a Schwung synth.
status: active
authors:
  - name: Matt Estela (mestela)
    url: https://github.com/mestela
source: https://github.com/mestela/schwung-pixel-walkers
source_status: open
license: MIT
homepage: https://github.com/mestela/schwung-pixel-walkers#readme
distribution: download
requires_stock: Schwung 1.3.0 or later installed on the Move
install_notes: >-
  Needs Schwung. Install Pixel Walkers from Schwung's module store or Schwung Manager, or use the tarball from the release page.
brick_risk: false
tags: [sequencer, midi, performance]
