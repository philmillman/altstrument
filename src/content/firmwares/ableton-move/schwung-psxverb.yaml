device: ableton-move
name: PSX Verb
summary: >-
  Schwung audio effect that emulates the PlayStation 1 SPU reverb with six presets, decay and mix controls.
description: >-
  PSX Verb follows a simplified structure of the console's sound unit reverb: a low-pass filter into four comb
  filters and two all-pass filters with feedback. The six presets are Room, Studio S, Studio M, Studio L, Hall
  and Space Echo, and decay and dry/wet mix are adjustable. The README says it was ported from the same author's
  CVCHothouse effects for the Daisy Seed, and the README still calls the host Move Everything.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-psxverb
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install PSX Verb from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
tags: [fx, reverb, emulator]
