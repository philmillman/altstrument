device: ableton-move
name: PushNPull
summary: >-
  Schwung audio effect with a tempo-synced curve shaper that ducks or boosts volume and a multimode filter in time with the project, for sidechain-style pumping without routing.
description: >-
  A beat-locked curve produces a bipolar signal that can duck or boost the output volume, drive a filter, or do both. There
  are 12 curves, including sidechain, punch, gate, reverse, pulse, swell and stutter shapes, with rate, slope, shift and attack
  controls and three pages on the knob grid. It works in an instrument slot's chain and in Master FX, where it follows the host
  transport because no MIDI clock arrives, which needs Schwung 0.11.5 or newer. It is bypassed while the transport is stopped.
