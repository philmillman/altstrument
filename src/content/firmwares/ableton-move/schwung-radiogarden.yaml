device: ableton-move
name: Radio Garden
summary: >-
  Schwung sound generator that browses and streams live radio stations from 200 cities, chosen by continent,
  country and city, through a bundled ffmpeg.
description: >-
  The module has a Browse page that walks from continent to country to city and then lists stations fetched from
  the Radio Garden service at runtime. A selected station streams through an ffmpeg executable that decodes it
  to audio, and three knobs set gain, play or pause, and stop. It needs an internet connection on the Move.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-radiogarden
source_status: open
license: MIT
license_notes: >-
  The module code is MIT. THIRD_PARTY_LICENSES.md says the release bundles a pre-built ARM64 FFmpeg binary from
  the yt-dlp FFmpeg-Builds project under GPL-3.0, run as a separate process. Station data comes from the Radio
  Garden API.
distribution: download
install_notes: >-
  Needs Schwung with the page-first canvas pages (1.5.0 to 1.6.x show Browse as page 2) and internet access on
  the Move. Install Radio Garden from Schwung's module store, or build it with the build-deps and build scripts.
brick_risk: false
tags: [synth-engine, web]
