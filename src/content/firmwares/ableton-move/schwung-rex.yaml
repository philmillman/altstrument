device: ableton-move
name: REX Player
summary: >-
  Schwung sound generator that plays ReCycle .rx2 loop files, mapping each slice to a MIDI note, with an
  independent decoder for the REX2 format.
description: >-
  REX Player reads mono and stereo .rx2 files placed in the module's loops folder, uploaded through the Schwung
  file manager, and plays each slice on its own note. The older .rex and .rcy formats are not supported. The
  decoder was written by analysing the file structure, because the official library does not run on the Move,
  and the repository includes a format specification and round-trip tests. The README says it contains no Reason
  Studios code.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-rex
source_status: open
license: MIT
license_notes: >-
  The module code is MIT. REX2 is a proprietary Reason Studios format; the README says the decoder is an
  independent reverse-engineering effort for interoperability and carries no vendor code, and the repository
  holds no loops.
distribution: download
install_notes: >-
  Needs Schwung. Install REX Player from Schwung's module store or Schwung Manager, or copy the rex folder from
  a release to the module directory on the Move. Add .rx2 loops through the Schwung file manager.
brick_risk: false
tags: [synth-engine, sampler, drums]
