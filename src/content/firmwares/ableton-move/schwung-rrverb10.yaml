device: ableton-move
name: RRVerb-10
summary: >-
  Schwung audio effect that emulates a mid-80s Micro Rack digital reverb at chip level, running its program ROM for nine room, hall, plate, delay, reverse and gate modes; you supply the ROM dump.
description: >-
  RRVerb-10 uses MUNT's cycle-accurate emulation of the BOSS reverb gate array and executes a 16 KB program ROM that the
  user supplies, placed at roms/rrv10.bin or uploaded through Schwung Manager, which checks size and CRC. Without the ROM it loads and passes audio
  through. Controls are Mode, Decay/Gate, Pre-EQ and Mix. The module resamples to the chip's native 31.25 kHz clock so
  decay times match the hardware. The program ROM is not in the repository.
status: active
authors:
