  from MUNT, LGPL-2.1-or-later, carried with one memory-release fix. The reference plug-in smol-rack by giulioz is GPL-3.0 but only its
  emulation file was taken. The program ROM remains its rights holder's property and is not distributed.
homepage: https://github.com/legsmechanical/schwung-rrverb10#readme
distribution: download
requires_stock: Schwung installed on the Move; a 16384-byte program ROM dump (CRC32 4B1D6D75) that you supply
install_notes: >-
  Needs Schwung and your own ROM dump. Install RRVerb-10 from Schwung's module store or Schwung Manager, then upload
  the ROM through the manager's asset slot or copy it to roms/rrv10.bin in the module folder.
brick_risk: false
