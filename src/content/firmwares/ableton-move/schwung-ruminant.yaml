device: ableton-move
name: Ruminant
summary: >-
  Schwung audio effect, a frequency-shifting feedback delay with upper and lower sideband blend, a delay of 0.05 to 1000 ms and soft-saturated feedback up to 110 percent.
description: >-
  Ruminant puts a single-sideband frequency shifter in the feedback loop of a fractional delay, so each repeat gains a fixed number of hertz
  and becomes less harmonic. Controls are Shift (plus or minus 2000 Hz, or ten times that in Wide range), Delay, Feedback, a Side blend from lower sideband through ring modulation to upper sideband, Mix,
  Tone and Stereo phase offset. The README calls it an early public test and says it is an original implementation that contains no Teenage Engineering or Sonic Charge code.
status: active
authors:
