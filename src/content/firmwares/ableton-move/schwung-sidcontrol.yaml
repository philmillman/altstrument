device: ableton-move
name: SID Control
summary: >-
  Schwung overtake module that turns the Move into a MIDI controller for the SIDaster III synthesizer, with
  eight parameter pages on the knobs and chromatic pads.
description: >-
  SID Control sends MIDI to a SIDaster III connected to the Move's USB-A port. The eight step buttons switch
  between pages for global settings, tuning and the three oscillators, with the knobs mapped to the parameters
  on each page and an overlay showing the name when a knob is touched. The pads play chromatic notes from C2 to
  G5 with velocity.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-sidcontrol
source_status: open
license: MIT
distribution: download
requires_stock: Schwung 1.0.0 or later on the Move, and a SIDaster III on USB-A
install_notes: >-
  Needs Schwung and a SIDaster III on the USB-A port. Install SID Control from the Utilities section of
  Schwung's module store, or build it with the Docker script.
brick_risk: false
tags: [midi, controller-mode]
