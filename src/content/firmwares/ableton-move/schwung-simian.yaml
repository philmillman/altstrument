device: ableton-move
name: SIMIAN
summary: >-
  Schwung drum synth, a port of Punk Labs' OneTrick SIMIAN 2, with ten synthesised drums on sixteen pads, 35 factory kits and tone, noise, mix and master pages.
description: >-
  Each drum is a tuned oscillator that morphs from triangle to a sampled cymbal, noise behind a resonant filter and
  a click, swept by one envelope; the kits are parameter sets rather than audio files. Six pads are second pads on a drum
  that another pad owns, sharing everything except Tune, and hats and cymbals choke each other. The pad layout follows Move's drum
  racks, not General MIDI. The DSP and kits are Punk Labs' and the repository keeps a copy of the upstream source. The README asks players to buy the original.
status: active
authors:
