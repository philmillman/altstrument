  wrapper, widget and tooling are by Josh Gaines (legsmechanical) under the same licence. The cymbal wavetable sample by Kevin Hall is CC0.
homepage: https://punklabs.com/ot-simian
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install SIMIAN from Schwung's module store or Schwung Manager, or build it with the repository's Docker
  build script and install it over SSH.
