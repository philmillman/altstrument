device: ableton-move
name: Sophie
summary: >-
  Schwung sound generator with sixteen pads of metallic FM percussion, six operator models, per-pad filter, ring delay and crush, and a Character page for decay and tail behaviour.
description: >-
  Sophie makes kicks, clangs, zaps, bells and shards from synthesis alone. Per pad it has tune, model (Fuse, Stack, Split, Shard, and since v0.6.0 Pipe and
  Boom), colour, metal, feedback, sweep, decay, crush, drive, a multimode filter that sits last, and a short ring delay. The v0.6.0 Character page adds Metal Decay,
  Raw or Smooth feedback and Hit or Live tail modes. The README says Pipe, Boom and related ideas are adapted from soejrd's digisophie, MIT, as a floating-point version, and it includes a Movy layout.
status: active
authors:
  - name: Matt Estela (mestela)
    url: https://github.com/mestela
source: https://github.com/mestela/schwung-sophie
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text. The README credits soejrd/digisophie (MIT, revision ee4ff40) for the Pipe and Boom models and related ideas.
homepage: https://github.com/mestela/schwung-sophie#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Sophie from Schwung's module store or Schwung Manager, or build it with the repository's script and install it to a reachable Move.
brick_risk: false
tags: [synth-engine, drums, synth]
