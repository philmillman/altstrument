device: ableton-move
name: Stems
summary: >-
  Schwung tool module that separates a WAV file on the Move into drums, vocals and accompaniment stems with
  SpleeterRT.
description: >-
  You pick a WAV file in the Tools menu, and the module splits it into three stems at a little under real time.
  Long tracks are processed in overlapping chunks that are cross-faded back together, so memory use stays near
  that of a one-minute file. A review screen lets you keep all stems or choose some, and they are saved as WAV
  files under a Stems folder in the user library. The separation engine is a prebuilt SpleeterRT binary with its
  runtime libraries.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-stems
source_status: open
license: MIT
license_notes: >-
  The module code is MIT. The separation engine is the third-party SpleeterRT, built separately and kept out of
  the git tree; neither the README nor engine notes state its licence.
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung with SSH access enabled. Install Stem Separation from the Tools section of Schwung's module
  store; processing is memory heavy on long files.
brick_risk: false
tags: [utility, sampling]
