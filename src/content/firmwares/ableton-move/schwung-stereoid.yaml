device: ableton-move
name: Stereoid
summary: >-
  Schwung audio effect that widens stereo with four selectable engines, Comb, Haas, Disperse and M/S, on one page of knobs with a width control, band limits and level compensation.
description: >-
  Comb adds a delayed copy of the mid to one side and subtracts it from the other, Haas delays one side, Disperse uses all-pass and comb
  networks modelled from measurements of a commercial widener, and M/S scales the side signal. Knobs set width from minus
  100 to plus 100 percent, the lowest and highest widened frequencies, delay time, output trim and a loudness or peak compensation mode. At zero width it is a true bypass.
status: active
