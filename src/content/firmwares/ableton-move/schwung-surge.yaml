device: ableton-move
name: Surge XT
summary: >-
  Schwung sound generator that ports the Surge XT hybrid synth, with 600 factory presets, modulation slots, MPE
  and tempo auto-sync.
description: >-
  The module exposes Scene A of Surge XT with its oscillator types, dual filters, LFOs, envelopes and six
  modulation slots, and ships more than 600 factory presets. It supports MPE with per-note expression and locks
  to host tempo through MIDI clock. The README lists limits: no Formula modulator because LuaJIT is left out,
  Scene B is not reachable, and the built-in effects are not exposed.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
  - name: Surge Synth Team
    url: https://github.com/surge-synthesizer
source: https://github.com/charlesvestal/schwung-surge
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The LICENSE file is the GPL version 3 text and NOTICE states GPL-3.0-or-later. The synth and its factory
  presets are derived from the Surge XT project by the Surge Synth Team.
distribution: download
install_notes: >-
  Needs Schwung. Install Surge XT from Schwung's module store or Schwung Manager.
brick_risk: false
tags: [synth-engine, synth, wavetable]
