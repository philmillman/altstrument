device: ableton-move
name: TAPESCAM
summary: >-
  Schwung audio effect that adds tape saturation, drive, wow and flutter and a tilt EQ, ported from the author's
  Daisy Seed pedal collection.
description: >-
  TAPESCAM has input level, drive, colour, wobble, tone and output controls. Colour changes the character of
  both the drive stage and the tape saturation, wobble adds wow and flutter as pitch modulation, and tone is a
  tilt EQ. It sits after a sound generator in a signal chain. The README says it was ported from CVCHothouse, a
  collection of Daisy Seed effects pedals by the same author.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-tapescam
source_status: open
license: MIT
distribution: download
install_notes: >-
  Needs Schwung. Install TAPESCAM from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
tags: [fx, tape]
