device: ableton-move
name: TB-3PO
summary: >-
  Schwung tool module that generates 303-style acid bassline patterns as MIDI, with two independent slots,
  pattern banks and scale-locked notes.
description: >-
  TB-3PO ports the TB_3PO applet of the Phazerville Hemisphere Suite. Each of two slots has its own pattern,
  MIDI channel and banks, with density, accent and slide probabilities, octaves, root, scale, length and gate on
  the eight knobs, plus mutate and several play directions. It sends MIDI only and is meant to drive a monosynth
  such as the 303 module. Both slots keep running while another part of the Move is in use, and the sequencer
  follows the Move transport.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
  - name: djphazer
    url: https://github.com/djphazer
source: https://github.com/charlesvestal/schwung-tb3po
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL version 3 text and the README says the licence is GPL-3.0, inherited from the
  Phazerville TB_3PO.h upstream, with no later-version clause.
distribution: download
requires_stock: Schwung 0.9.8 or later on the Move
install_notes: >-
  Needs Schwung 0.9.8 or later. Install TB-3PO from Schwung's module store, or build it with the build and
  install scripts. Open it from the Tools menu.
brick_risk: false
tags: [sequencer, midi, scales]
