device: ableton-move
name: Tenebrae
summary: >-
  Schwung sound generator with eight oscillator models, a gritty filter, a tape and reverb effects chain and 163 presets, aimed at dark basses, pads, leads and horror-style sounds.
description: >-
  Tenebrae has eight voices with mono and glide modes and five pages of eight macro knobs. Oscillator models are saw, pulse,
  hard sync, FM, bell, wavetable, formant voice and a pitch-drop zap, with a stack of up to seven oscillators and a clean sub layer
  that bypasses the effects. The filter has three kinds of drive, and the effects are chorus, phaser, tempo pump, VHS, tape delay and a reverb with shimmer.
  Engine and presets are original to the repository.
status: active
