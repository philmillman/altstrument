device: ableton-move
name: Usefulity
summary: >-
  Schwung audio effect that works as a stereo utility with channel select, width, mono, bass mono, gain,
  balance, phase invert, DC filter and mute.
description: >-
  Usefulity covers the jobs of a utility device: stereo, left, right or swap channel selection, mid-side width
  from 0 to 2, a mono collapse, a bass-mono crossover from 50 to 500 Hz with an audition mode, gain from -100 dB
  to +35 dB, balance, independent phase flips for each side, a DC filter at about 5 Hz and a mute. The README
  compares it to Ableton Utility. Eight knobs cover the common settings and a menu holds the rest.
status: maintained
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-usefulity
source_status: open
license: MIT
license_notes: >-
  The repository commits built files under build/ and dist/ (usefulity.so and a module tarball) beside the C
  source.
distribution: download
install_notes: >-
  Needs Schwung. Install Usefulity from the Audio FX section of Schwung's module store or Schwung Manager.
brick_risk: false
tags: [fx, utility]
