device: ableton-move
name: Schwung
summary: >-
  Unofficial framework that runs alongside Move's stock software and adds a Shadow UI, instrument and effect
  slots, overtake tools and a module store.
description: >-
  Schwung used to be called Move Everything and builds on the Move Anything project's techniques for
  reaching the Move's hardware. The installer copies files to the unit over SSH, replaces the Move launcher
  with a boot selector and loads a shim library into the unchanged stock Move process. A second Shadow UI
  process draws over the display and handles the pads, knobs and MIDI. Four instrument slots, one per Move
  track, plus a master effect slot host synths, audio effects and MIDI effects, and overtake modules take
  over the whole surface for sequencers, controllers and other tools. Modules are installed from a catalog
  in a browser page on the unit or from the desktop installer. The catalog lists more than 150 modules,
  including ports of Dexed, Surge XT, OB-Xd, Mutable Instruments Braids, a Roland JV-880 emulator, a TB-303
  emulator, NAM, a DJ deck and Tim Cox's performance tools, and several are listed as separate entries. The
  project states that much of the code is written by coding agents under human supervision, and that it is a
  hack rather than a daily driver.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung
source_status: open
license: MIT
license_notes: >-
  Since v1.9.0 the screen reader's speech synthesis runs in a separate schwung-tts program linked against
  eSpeak NG, which is conveyed under GPL-3.0-or-later, and the shim is MIT again; earlier releases linked
  eSpeak NG into the shim itself. The release also carries link-subscriber (Ableton Link) and a jack2 library,
  both GPL-2.0-or-later and shipped as separate programs. See THIRD_PARTY_LICENSES.md in the repository.
homepage: https://schwung.dev
distribution: download
install_notes: >-
  Install with the Schwung Installer desktop app or the install.sh command from the README, with the Move on
  the same Wi-Fi network and an SSH key added on the unit's move.local/development/ssh page. The script
  copies Schwung to the user data partition and puts a boot selector in place of the Move launcher; the
  README advises backing up sets and samples first. Pressing Back during the two-second start-up message
  opens a picker with a Stock Move entry that boots without Schwung, and the picker also opens by itself
  after three failed starts. The uninstall script, or Ableton's DFU restore, returns the unit to stock. The
  manual says a Move firmware update temporarily disables Schwung until the installer is run again, and that
  Schwung Manager on port 7700 has no authentication.
brick_risk: false
