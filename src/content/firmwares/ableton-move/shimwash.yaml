device: ableton-move
name: Shimwash
summary: >-
  Schwung audio effect that combines two pitch shifters with a long 8-line reverb for shimmer and ambient
  washes, with 13 factory programs.
description: >-
  Each of the two pitch shifters can sit before the reverb, in its feedback path or after it, with pitch of
  plus or minus 24 semitones, fine tuning and an echo delay. The reverb length runs from 0.8 to 60 seconds,
  and the module adds an input filter, a ducker, a bloom swell and a freeze control. Settings are spread over
  seven pages and the module id is shimmerwash. It builds with Docker only.
status: active
authors:
  - name: Dan (twinpowers)
    url: https://github.com/twinpowers
source: https://github.com/twinpowers/schwung-shimwash
source_status: open
license: MIT
homepage: https://github.com/twinpowers/schwung-shimwash#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Shimwash from Schwung's module store or Schwung Manager, or build it from source
  with the repository's Docker script and deploy it with the deploy script.
brick_risk: false
tags: [fx, reverb, performance]
