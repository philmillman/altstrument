device: ableton-move
name: Signal
summary: >-
  Schwung sound generator for polymetric microsound rhythms, with a breakbeat engine, drum-kit synthesis, a live-drummer layer, phrase fills and a Scene A/B morph that blends two complete module states.
description: >-
  Signal plays patterned clicks, pings and drum voices at independent lengths. Version 0.2 adds ten breakbeat presets driven by a stochastic anchor-curve algorithm, kit synthesis for kicks, snares and hats, per-voice improvisation and push-pull timing, fills at the end of a phrase and retriggers. Two scenes can be captured and morphed with one knob. The README lists influences including Ryoji Ikeda and mathcore, and credits the breakbeat approach to mestela's schwung-breakbeat.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/signal-move
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The LICENSE file is a short GPL version 3 notice that allows any later version. The README says GPL-3.0.
distribution: download
install_notes: >-
  Needs Schwung. Install Signal from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [synth-engine, drums, sequencer, performance]
