device: ableton-move
name: Snake
summary: >-
  Schwung overtake module that plays the Snake game on the Move's pad grid and sends the notes the snake
  eats to a Move track in a chosen scale.
description: >-
  The snake is steered with the arrow buttons or knobs across the 8 by 4 pad grid and speeds up with every
  piece of food. Each food pad plays a note on the selected native Move track, with a root note and a choice
  of major, minor, major pentatonic or blues scales. A chord mode plays a repeating four-chord progression
  instead of single notes. Edges wrap around, and the best score lasts until the module is unloaded.
status: active
authors:
  - name: Samir Caus
    url: https://github.com/samircaus
source: https://github.com/samircaus/move-anything-snake
source_status: open
license: MIT
homepage: https://github.com/samircaus/move-anything-snake#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Snake from Schwung's module store or Schwung Manager, or use the module tarball
  attached to a release. Exit with Shift, the volume touch and a jog click.
brick_risk: false
tags: [game, midi, performance, scales]
