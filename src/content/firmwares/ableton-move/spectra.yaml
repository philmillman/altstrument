device: ableton-move
name: Spectra
summary: >-
  Schwung audio effect that analyses input in eight bands and excites scale-quantised resonators from it, so kicks, snares and hats ring different notes. Includes 12 scales in 12 roots, chord drift and a compressor.
description: >-
  Spectra detects onsets and the noise-to-tone ratio in each of eight bands and starts a bank of tuned resonant filters from them. The bank follows a chosen scale and root, with decay from 50 ms to 10 seconds, a harmonic-series or scale-degree tuning blend, and a chord drift control that sometimes offsets notes by a semitone or two. Controls also cover resonator count, octave range, an RMS compressor, gain and filters. The README cites the Mutable Instruments Elements and Rings resonators as algorithmic references.
status: active
authors:
