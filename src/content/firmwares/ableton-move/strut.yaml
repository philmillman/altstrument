device: ableton-move
name: Strut
summary: >-
  Schwung sound generator that makes each of the Move's 16 pads a drum from a resonating Skin body, a Wave oscillator and a Noise source or sample, with per-pad finish effects, a dice for new sounds and a shared plate room.
description: >-
  Each engine has one modulator, which can be an envelope, LFO, random value or velocity, sent to two of its knobs. The Noise engine plays one of 208 bundled samples or the player's own, as recorded, resynthesised or as colour only. Pads have 40 starting sounds, and Dice rolls new ones for a pad or the whole kit, level-matched. Kits save with the set. The samples come from CC0 or public-domain sources listed in src/samples/SOURCES.md, with two glitch sounds made from CC0 hits. The README says the factory kits are placeholders. The latest release is v0.9.1, while the module metadata on the main branch is at 0.12.14.
status: active
