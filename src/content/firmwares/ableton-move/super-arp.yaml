device: ableton-move
name: Super Arp
summary: >-
  Schwung MIDI effect arpeggiator with 40 progression and 40 rhythm presets, chord-step notation, octave modes, swing, latch, internal or MIDI clock, and a seeded modifier engine for dropouts and velocity, gate, octave and note variation.
description: >-
  Super Arp turns held notes into arpeggiated phrases. Progression presets use a small notation of numbers and bracketed chord steps, rhythm presets use trigger and rest strings, and a random pattern mode builds sequences from a seed. Modifiers can drop steps or vary velocity, gate, octave and note, and an optional loop length repeats the variation. Each engine can retrigger or run continuously. Other modules have borrowed its patterns, for example Quark. The README says it was developed with AI assistance.
status: active
