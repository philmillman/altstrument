device: ableton-move
name: Super Boom
summary: >-
  Schwung audio effect for the master bus or a drum group, inspired by the OTO Boum: ten preamp models, four distortion modes, an eight-band filterbank with vocoder mode, a creative compressor, EQ cuts and a tape output stage.
description: >-
  Signal passes through an input gain, a compressor, an eight-band filterbank, a distortion with Boost, Tube, Fuzz and Square modes, a two-times oversampled preamp, a tape stage, low and high cuts and a limiter. The filterbank has eight flavours and a vocoder mode that uses the microphone or line input as modulator. The repository also contains a text summary of the OTO Boum features, a manual and a code listing, all written for this module.
status: active
authors:
