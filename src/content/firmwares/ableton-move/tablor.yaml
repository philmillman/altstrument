device: ableton-move
name: Tablor
summary: >-
  Schwung sound generator that ports FigBug's Wavetable synth to the Move: two wavetable oscillators, sub and noise, a multimode filter, four envelopes, unison and 115 bundled wavetables.
description: >-
  Tablor has two wavetable oscillators with position morphing, bend and formant shift, up to four unison voices,
  a sub oscillator, noise, a multimode filter with its own envelope, and four envelopes of which two can be
  aimed at most parameters. It plays 8 voices or mono with glide, ships 9 factory sounds, and loads Serum, Vital
  and Ableton wavetable files from a folder on the Move. 115 wavetables are seeded on first run, from the
  Adventure Kid and Neu KatalYst packs. The engine is a port of Roland Rabien's Wavetable and its gin library
  with the JUCE dependency removed. A browser panel shows the wavetable displays.
status: active
authors:
  - name: Gustavo Lima
    url: https://github.com/athousanddetails
  - name: Roland Rabien (FigBug)
    url: https://github.com/FigBug
source: https://github.com/athousanddetails/schwung-tablor
source_status: open
license: BSD-3-Clause
license_notes: >-
  The LICENSE file is BSD 3-Clause and names portions from Roland Rabien's Wavetable and gin, Michael Massberg's
  AudioFilter, Thomas Merchant's pink noise (MIT) and dr_flac (public domain or MIT-0). The bundled wavetable
  packs keep their own terms: Adventure Kid is listed as public domain, and Neu KatalYst is described only as
  free to use "in all your synths".
homepage: https://github.com/athousanddetails/schwung-tablor#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Tablor from Schwung's module store or Schwung Manager. Extra wavetables go in the
  Wavetables folder of the Move's user library.
brick_risk: false
tags: [synth-engine, wavetable, synth]
