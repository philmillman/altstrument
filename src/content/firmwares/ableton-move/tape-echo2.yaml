device: ableton-move
name: Tape Echo 2
summary: >-
  Schwung audio effect that ports Dusk Audio's Tape Echo 2, a three-head tape echo with spring reverb, twelve head modes, tape saturation in the feedback loop and tempo sync.
description: >-
  The effect models a vintage three-head tape echo with a spring tank. Twelve modes combine the playback heads
  with the reverb, and record EQ and tape saturation sit inside the feedback loop so repeats darken and compress.
  It has wow and flutter, tape age, bass and treble on the echo path only, tempo sync with note tables from the
  reference machine, and a ping-pong stage that the port adds to the echo output; with ping-pong off the output
  matches upstream. It imports settings from the earlier TapeDelay module and has a browser panel.
