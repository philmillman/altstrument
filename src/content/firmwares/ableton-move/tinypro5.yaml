device: ableton-move
name: TinyPro5
summary: >-
  Schwung sound generator that models a Prophet-5 Rev 2 style five-voice polysynth, with poly-mod, an SSM-style filter, Rev 2 and Rev 4 voicing, 32 original factory presets and import of Prophet-5 and Repro-5 SysEx banks.
description: >-
  TinyPro5 has five voices with Poly, Unison, Mono and Legato modes. Oscillator A is hard-synced to oscillator B, a four-pole low-pass filter self-oscillates at full resonance, and the filter envelope and oscillator B can modulate oscillator A and the filter through poly-mod. A Rev switch chooses the original voicing or a Rev 4 variant with faster envelopes and velocity and aftertouch response, and a Vintage control adds per-voice drift. The 32 factory programs are written for this engine and compiled in, and the README says none are copied from another instrument's patch data. Banks can be loaded, saved and reverted on the device. The README is explicit that Prophet-5 and Sequential are trademarks of their owners and that the project is independent.
status: active
authors:
  - name: Mathew Taylor
    url: https://github.com/fleshinachair
source: https://github.com/fleshinachair/TinyPro5
source_status: open
license: MIT
license_notes: >-
  The LICENSE file covers the source, documentation and the 32 factory presets, and lists third-party material separately, including attribution for a DEFLATE routine re-implemented after Mark Adler's puff.c (zlib licence). The README says the LFO curves used for SysEx import come from public numeric fits documented by the GPL-3.0 Melodee project and were re-implemented without its source.
homepage: https://github.com/fleshinachair/TinyPro5#readme
distribution: download
install_notes: >-
  Needs Schwung. Install TinyPro5 from Schwung's module store or Schwung Manager, or use the TinyPro5.tar.gz from the latest release.
brick_risk: false
tags: [synth-engine, synth, emulator]
