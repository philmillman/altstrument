device: ableton-move
name: TinyScratch
summary: >-
  Schwung sound generator that writes turntable scratch patterns for a sample, plays them in time with the Move's transport and lets you keep the clips you like. Two sample slots are built in, and six more take your own recordings or WAV files.
description: >-
  Pressing the Generate pad writes a new clip from a style, a length of one, two or four bars, and dials for forwards, finish, echo and groove. A clip follows the transport, and held pads cut the sound like a crossfader. Kept clips are stored exactly, and each sample has four pages of 14 clip slots. Playback dials cover swing, humanise, saturation, drag and vinyl noise. User samples can be recorded from the Move's input, loaded as WAV files or picked from a song dropped on the module's Remote UI page. The README says the look and workflow are inspired by the Live Scratcher module, and that the styles follow published turntablist research.
status: active
authors:
  - name: Mathew Taylor
    url: https://github.com/fleshinachair
source: https://github.com/fleshinachair/TinyScratch
source_status: open
license: MIT
license_notes: >-
  The code is MIT. The two bundled samples, Ahhh and Fresssh, are scratch sounds from "Change the Beat" (1982) that samples/CREDITS.txt describes as public domain. Clips imported from an Ableton Live Pack with tools/import_clips.py stay local and are not covered.
homepage: https://github.com/fleshinachair/TinyScratch#readme
distribution: download
install_notes: >-
  Needs Schwung. Install TinyScratch.tar.gz from the latest release with Schwung's module manager (Install Custom Module, from GitHub URL fleshinachair/TinyScratch), then load it in a track slot as a sound generator.
brick_risk: false
tags: [synth-engine, sampler, performance, drums]
