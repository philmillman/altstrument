device: ableton-move
name: TinySID
summary: >-
  Schwung sound generator that plays Commodore 64 .sid tunes on an emulated 6502 and SID chip locked to the Move's clock, with Timbre Lock, per-voice MIDI output to other tracks, AutoTune, loops and pad control.
description: >-
  TinySID runs a PSID tune's own player code on a built-in 6502 and SID emulation, with 6581 and 8580 chip models. Timbre Lock freezes each voice's waveform, pulse width, envelope and the filter so a different tune plays through the first tune's sounds. Notes Out sends each of the three voices as MIDI with pitch bend to instruments on other Move tracks. Further controls cover subtunes, AutoTune, host-locked or free timing, loop capture over up to eight bars, a voice filter, ducking effects, and pads that mute voices, transpose, fire the tune's sound effects or play its instruments. Only single-SID PSID files work, and sampled digi sounds do not play. The repository bundles only an original demo tune made by its own script, and the README says users supply their own .sid files, which are copyrighted by their authors. It is not derived from Tammo Hinrichs' TinySID player.
status: active
authors:
