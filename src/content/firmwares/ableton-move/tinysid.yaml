homepage: https://github.com/fleshinachair/TinySID#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install TinySID.tar.gz from a release with Schwung's module manager, or unpack it into the Move's schwung/modules/sound_generators/tinysid folder, copy your own .sid files into the module's sids folder, then load it in a track slot and pick a tune with SID File.
