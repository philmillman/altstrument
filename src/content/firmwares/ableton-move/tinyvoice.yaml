device: ableton-move
name: TinyVoice
summary: >-
  Schwung audio effect for the Move's voice input with four engines: a 13-mode vocoder, a vowel-formant Synth Voice filter, Resynth harmonic resynthesis and Mangler pitch and formant shifting.
description: >-
  The Vocoder engine has three pages of controls and thirteen modes. Some use a carrier played from the pads, and others process the voice directly, such as a PSOLA-based scream shifter. The Synth Voice engine (called Voice FX before 1.5.0) is a four-formant vowel filter with eight knobs on one page. Resynth rebuilds the voice from its harmonics with a wavetable synth, and Mangler is a multi-voice pitch and formant shifter with chords from the pads. A browser Remote UI shows every control of the active engine, and a Looper can save a processed loop as a WAV in the Move's sample library. Each engine has its own parameters and a built-in demo phrase, and the Vocoder keeps its own five knob values per mode. Pitch tracking covers about 70 Hz to 1 kHz. The README calls version 1.0.1 a public preview and says the modes were tuned on synthetic voices and a built-in mic rather than many singers. All published releases are marked as pre-releases.
status: active
authors:
  - name: Mathew Taylor
    url: https://github.com/fleshinachair
source: https://github.com/fleshinachair/TinyVoice
source_status: open
license: proprietary
license_notes: >-
