device: ableton-move
name: TinyVoice
summary: >-
  Schwung audio effect for the Move's voice input with two engines: a 13-mode vocoder and voice transformer that includes robot, auto-tune, harmony and Dalek modes, and a vowel-formant talking filter with six presets.
description: >-
  The Vocoder engine has three pages of controls and thirteen modes. Some use a carrier played from the pads, and others process the voice directly, such as a PSOLA-based scream shifter. The Voice FX engine is a four-formant vowel filter with eight knobs on one page. Each engine has its own parameters and a built-in demo phrase, and the Vocoder keeps its own five knob values per mode. Pitch tracking covers about 70 Hz to 1 kHz. The README calls version 1.0.1 a public preview and says the modes were tuned on synthetic voices and a built-in mic rather than many singers. Both published releases are marked as pre-releases.
status: active
authors:
