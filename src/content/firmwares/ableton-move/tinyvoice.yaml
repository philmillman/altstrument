homepage: https://github.com/fleshinachair/TinyVoice#readme
distribution: download
install_notes: >-
  Needs Schwung. Download TinyVoice.tar.gz from the releases page, unpack it into the Move's audio_fx module folder over SSH as the README shows, and restart Schwung. Then add TinyVoice as an audio effect after a sound generator such as Line In.
