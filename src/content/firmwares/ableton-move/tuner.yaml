  from bashtuner by Storm Dragon and Jeremiah Ticket are WTFPL.
homepage: https://github.com/CatsAreCool710/Schwung-Tuner#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Tuner from Schwung's module store or Schwung Installer, or build it with Docker and
  deploy it over SSH.
brick_risk: false
