device: ableton-move
name: Tuner
summary: >-
  Schwung tool module that tunes instruments from the Move microphone or line input with YIN pitch detection, 22 tuning presets and spoken or tone feedback, designed for blind and low-vision players.
description: >-
  The tuner detects pitch from the built-in microphone or line input and shows a chromatic mode or one of 22
  presets in eight categories, including guitar tunings, 12-string, bass, ukulele, lap steel and bowed strings.
  Feedback can be a step-guide interval figure, a reference tone in sine, pluck or soft pluck style, or off, and
  the screen reader announces controls, detected notes and tuning state. A4 can be set from 410 to 480 Hz, with a
  noise gate, tune threshold and a passthrough mode for headphones. Some tuning definitions come from bashtuner
  (WTFPL). The README says it was built with AI assistance.
status: active
authors:
