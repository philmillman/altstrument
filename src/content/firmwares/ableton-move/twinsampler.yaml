homepage: https://github.com/jrucho/schwung-twinsampler#readme
distribution: download
install_notes: >-
  Needs Schwung. Install TwinSampler from Schwung's module store, or unpack twinsampler-module.tar.gz from the latest release into the Move's overtake module folder. Open it from the Overtake Modules list.
