device: ableton-move
name: TwinSampler
summary: >-
  Schwung overtake sampler that splits the Move's pads into two independent 4x4 grids with eight banks each, with per-pad controls, transient slicing, a chop editor, recording, MIDI loopers, effects, sessions with undo and autosave.
description: >-
  The left grid defaults to Source mode, where one sample is chopped into 16 pads in a choke group, and the right grid defaults to Pad mode for finger drumming. Version 0.4.0 adds waveform editors for trimming and chopping, live cue marking by tapping pads while a chop plays, and independent bank modes. Banks can be copied and erased, samples reversed, and sessions saved and restored. The repository commits the compiled DSP libraries beside the source, and releases attach a checksum file. The README links two demo videos.
status: active
