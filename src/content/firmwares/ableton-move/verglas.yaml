device: ableton-move
name: Verglas
summary: >-
  Schwung audio effect that ports the Mutable Instruments Clouds granular processor, with granular, stretch, looper and spectral modes, output filters and a limiter.
description: >-
  Verglas runs the Clouds engine on the Move as an effect slot. It offers the four Clouds playback modes, filters that shape only the wet signal and a limiter on the output. The Filters page was reused in Gresil, the same author's port of Beads.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/verglas-move
source_status: open
license: MIT
license_notes: >-
  The LICENSE file lists the MIT notices for Emilie Gillet's Clouds code and stmlib from the pichenettes/eurorack repository, and for the Move port.
distribution: download
install_notes: >-
  Needs Schwung. Install Verglas from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [fx, granular, eurorack-port]
