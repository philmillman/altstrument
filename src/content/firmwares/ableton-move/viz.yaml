device: ableton-move
name: Viz
summary: >-
  Schwung master effect that paints an 8x8 grid controller and its underglow with 106 geometric scenes that step on the Move's clock or follow the sound of the mix. It is made for the 203 Systems Matrix on the USB-A port and leaves the audio untouched.
description: >-
  Scenes are wipes, rings, sprites and small games, plus six softer ones, with knobs for scene, colour, rate, size, trail, fold, shift and react. An eight-step sequence of scenes has its own length, colours and rates per step, and two LFOs can move the look knobs on the beat, on the kick or on the level. Modes are Auto, Beat, Sound and Blend. Beat follows the Move's clock and needs no audio. Move's own tracks reach it only with the Move to Schwung setting enabled. A Remote UI page shows the grid in a browser. Launchpad models are offered through a grid setting and are untested. The Move's USB-A port cannot power a bright Matrix, so a powered hub is advised for full brightness.
