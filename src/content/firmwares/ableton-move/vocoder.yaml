device: ableton-move
name: Vocoder
summary: >-
  Schwung audio effect that vocodes the Move's microphone or line input onto the synth in the signal chain, with 8 to 32 bands, formant shift, sibilance pass-through and a gate.
description: >-
  The module is a channel vocoder. The input from the microphone or line-in is split into bands by a stereo
  state-variable filter bank, and the band envelopes shape the carrier arriving from the signal chain. Bands can
  be set to 8, 16, 24 or 32, with low and high frequency limits, attack and release, mod gain and a wet/dry mix.
  Version 0.2.0 added presence, sibilance, bright, formant, gate and note gate controls aimed at clearer vocals.
  The README says it was written with AI assistance.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-vocoder
source_status: open
license: MIT
homepage: https://github.com/charlesvestal/schwung-vocoder#readme
distribution: download
requires_stock: Schwung installed on the Move
install_notes: >-
  Needs Schwung. Install Vocoder from Schwung's module store or Schwung Manager, or give Schwung Manager the
  tarball from the latest release. Put a bright sustained synth before it in the chain and speak into the
  microphone.
brick_risk: false
