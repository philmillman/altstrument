device: ableton-move
name: War Bells
summary: >-
  Schwung audio effect with eleven granular, looping, glitch and delay effects in four families, plus
  shimmer reverb, a 60-second phrase looper and a generative mode.
description: >-
  War Bells groups its effects into Loops (Glide, Seq, Stack), Grains (Cloud, Drone, Chain), Glitch (Arp,
  Cutup, Chop) and Delays (Taps, Warp), each with four variations. Around them are a four-mode stereo reverb
  with shimmer, a resonant low-pass filter, pitch modulation with scale-locked pitch, a tempo-synced Motion
  LFO, an Evolve and Dice engine, input ducking and a hold sampler. It has eight character presets and 16
  user preset slots that store loops too. The module is hand-written C, and the README links an online manual
  with a live demo.
