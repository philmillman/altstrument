device: ableton-move
name: Wave Edit
summary: >-
  Schwung tool module that edits WAV files on the Move itself: trim, gain, normalize, cut, copy, paste and mute sections, with a zoomable waveform, audition playback and undo.
description: >-
  Wave Edit shows a WAV file with a minimap, start and end markers moved by the jog wheel or knobs, and a
  vertical scale. Gain and normalize apply in real time, any pad auditions the selection with an optional loop,
  and every destructive edit can be undone. A selection can be exported as a new file. The README says it was
  written with AI assistance.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-waveform-editor
source_status: open
license: MIT
homepage: https://github.com/charlesvestal/schwung-waveform-editor#readme
distribution: download
requires_stock: Schwung installed on the Move, with SSH access enabled
install_notes: >-
  Needs Schwung. Install Wave Edit from the Tools list of Schwung's module store, or build it with the
  repository's build and install scripts, which copy it to the Move over SSH. Edits overwrite the opened file
  on save, so export a selection to keep the original.
brick_risk: false
tags: [sampler, editor, utility]
