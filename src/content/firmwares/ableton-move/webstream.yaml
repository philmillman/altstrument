device: ableton-move
name: Webstream
summary: >-
  Schwung sound generator that searches and streams audio from YouTube, SoundCloud, the Internet Archive, Freesound and Discogs-based Crate Dig, using yt-dlp and ffmpeg on the Move.
description: >-
  Webstream searches a chosen provider, plays the selected result through a decode pipeline of yt-dlp and ffmpeg
  at 44.1 kHz stereo, and puts transport on knobs 1 to 6: play and pause, 15-second skips, gain, stop and
  restart. Providers are YouTube and SoundCloud through yt-dlp, archive.org, Freesound (needs an API token) and
  Crate Dig, which picks random releases with YouTube videos from Discogs by genre, style, decade and country.
  It keeps previous searches and favorites, and can send a downloaded track to the waveform editor. The README
  calls it experimental, unsupported and not affiliated with Ableton or YouTube, and leaves compliance with
  source-platform terms to the user.
status: active
authors:
  - name: Charles Vestal
    url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/schwung-webstream
source_status: open
license: MIT
license_notes: >-
  The module code is MIT. The full release tarball also bundles yt-dlp (Unlicense), Deno (MIT) and an FFmpeg
  build under the GPL; THIRD_PARTY_NOTICES.md lists them and a core-only tarball leaves them out.
homepage: https://github.com/charlesvestal/schwung-webstream#readme
distribution: download
requires_stock: Schwung 1.6.3 or later, as stated in the v0.5.0 release notes
install_notes: >-
  Needs Schwung and a network connection on the Move. Install Webstream from Schwung's module store or
  Schwung Manager; the release has a full tarball with the runtime tools and a core tarball for which you
  supply yt-dlp, Deno and ffmpeg. Freesound needs a token entered in Schwung Manager.
brick_risk: false
tags: [synth-engine, sampler, utility]
