device: ableton-move
name: Weird Dreams
summary: >-
  Schwung drum synth with eight voices, 41 voice presets, 64 kits, random kit, pitch and pan, pad-selected voice editing and a master bus with compressor, DJ filter and three-band EQ. Expands Daniele Filaretti's WeirdDrums.
description: >-
  Each voice has a morphing oscillator, filtered noise, exponential envelopes, pitch modulation, distortion and clap retrigger. Pressing a pad plays the voice and switches the knobs to its parameters. Kits cover classic machines, genres and character sets, and Rnd Pitch picks from 96 scales. Notes 36 to 43 trigger voices one to eight, and other notes rotate across voices. Euclidrum is a companion MIDI effect written for it. The README says the original DSP is by Daniele Filaretti under MIT.
status: active
authors:
  - name: Vincent Fillion (filliformes)
    url: https://github.com/filliformes
source: https://github.com/filliformes/weird-dreams-move
source_status: open
license: MIT
license_notes: >-
  The repository has no LICENSE file. The README states MIT and credits the original WeirdDrums DSP to Daniele Filaretti, whose repository is MIT.
distribution: download
install_notes: >-
  Needs Schwung. Install Weird Dreams from Schwung's module store or Schwung Manager, or give Schwung Manager the repository URL or the tarball from the latest release.
brick_risk: false
tags: [synth-engine, drums, performance]
