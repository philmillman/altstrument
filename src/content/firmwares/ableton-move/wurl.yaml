device: ableton-move
name: Wurl
summary: >-
  Schwung sound generator that models a Wurlitzer 200A electric piano from its reed, pickup, preamp, power amp and speaker stages, with tremolo, spring reverb and ten presets. A C port of the Rust plug-in OpenWurli.
description: >-
  Wurl is a port of OpenWurli by hal0zer0 to single-file C. Each voice is a seven-mode reed model feeding a capacitive pickup model, with a short attack-noise burst on the hammer strike. The summed voices pass through a simplified two-stage preamp, a class AB power amp model and a speaker cabinet model, with a light-dependent-resistor tremolo, a darkening filter and a spring reverb. A small neural network corrects partial frequencies and decay rates at note-on. It plays 16 voices, has eight knobs and three menu parameters, and ships ten presets and matching chain patches. The README lists what was left out of the port, including the circuit-solver preamp and the Twin-T tremolo oscillator.
status: active
authors:
