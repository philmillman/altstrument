    url: https://github.com/filliformes
  - name: hal0zer0
    url: https://github.com/hal0zer0
source: https://github.com/filliformes/wurl-move
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file holds an abbreviated GPL-3.0 text with a link to the full text and no "or later" statement. The README says the licence is inherited from OpenWurli, the GPL-3.0 Rust original by hal0zer0. The neural-network weights were trained on Wurlitzer 200A recordings by OldBassMan on Freesound, credited in the README.
homepage: https://github.com/filliformes/wurl-move#readme
distribution: download
install_notes: >-
  Needs Schwung. Install Wurl from Schwung's module store or Schwung Manager, or download wurl-module.tar.gz from the latest release and use Install custom module in the Schwung Installer.
brick_risk: false
tags: [synth-engine, synth, emulator, physical-modeling]
