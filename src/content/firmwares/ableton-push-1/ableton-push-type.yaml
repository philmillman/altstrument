license: MIT
homepage: https://push-tool.netlify.app/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, connect Push 1 over USB and hold the User button to put it in User Mode, then use the grid buttons. Press the audio button on the page to hear the notes. To run it yourself, use npm install and npm run dev.
