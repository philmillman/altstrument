device: ableton-push-1
name: Ableton Push Type
kind: tool
summary: Browser prototype that turns Push 1 into a graphics surface. Each pad cycles a geometric shape in a grid drawn with p5.js, the encoders change the grid method, colours and gaps, and each press also plays a note with Tone.js. It uses Web MIDI with the unit in User Mode.
description: >-
  The pads show which cells hold a shape, and the left encoders and the first three knobs choose the grid layout, the shaping function, a colour pair and the horizontal and vertical gaps.
  The New and Play buttons reset one cell or all of them, and the canvas can be saved as a PNG. The author says it was tested only with Chrome and Push 1, and Push 2 and 3 are not supported.
  A video demonstration is linked from the README.
status: active
