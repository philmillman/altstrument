homepage: https://github.com/llcheesell/apc-mini-mk2-color-controller
distribution: download
install_notes: >-
  Download the macOS zip or dmg (Apple Silicon, not notarized, so open it with a right click) or the Windows installer from a release page. The unit takes one MIDI connection at a time, so close other programs that hold its port. Nothing is flashed.
