device: akai-apc-mini-mk2
name: APC Stage
kind: tool
summary: Desktop app for lighting the Akai APC mini mk2 without Ableton. It paints the 64 RGB pads and single-colour LEDs, plays animations, reacts to incoming notes, and can save a colour scheme as a small launch file that re-sends it. Electron with Web MIDI; the README is in Japanese.
description: >-
  Design mode paints pads with a brush, row and column colours and the maker's 128-colour palette, with named presets. Animation mode runs twelve timed effects and
  sends only the pads that changed. Reactive mode lights pads from notes played on the controller or another keyboard. The app sends colours by SysEx in groups of eight pads, because the
  unit drops longer messages. The release v0.3.1 stops it from sending to an unrelated MIDI port when no APC mini mk2 is found. The pad lighting is not stored in the controller, so it is sent again after power-up.
status: active
