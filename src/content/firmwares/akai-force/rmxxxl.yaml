license: GPL-3.0-or-later
license_notes: >-
  The LICENSE file is the GPL version 3 text, and the README says "GNU GPL v3.0 or later", because the project
  includes Dragonfly Reverb. Third-party parts keep their own licenses: Clouds with Parasites (MIT), the
  mpc-vst-plugins wrapper (MIT) and the Titillium Web font (SIL OFL 1.1).
distribution: download
requires_stock: MPC OS 3.x (tested on 3.9.1)
install_notes: >-
  Needs root SSH access to the device, for example through MockbaMod, since stock MPC OS does not load third-party
  plugins. Unzip the release, copy it to the device with scp and run install.sh, which stops MPC, so save the project
  first. It copies the plugin to /sdcard/Synths, backs up and edits MPC.settings and restarts MPC. Pad samples and
  presets live outside the plugin folder and survive updates. uninstall.sh removes the plugin. Installing plugins this
  way is unofficial.
brick_risk: false
