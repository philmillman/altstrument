name: RMXXXL
summary: Native VST2 insert effect for MPC OS that works like a Pioneer RMX-1000 remix unit, with build-up and break-down knobs, a 3-band kill isolator, DJ filter, echo, Clouds, reverbs, drum pads and a limiter.
description: >-
  An effect that sits in one insert slot of a track, a submix or the master and has its own touchscreen pages and
  Q-Link sets. Two scene knobs move a filter, echo, Clouds, reverb and a noise riser together, and a Release switch
  or Release FX (echo out, vinyl brake, backspin over 1/2 to 4 beats) drops the mix back to dry. Other parts are an
  eighth-order three-band isolator with kill buttons, a bipolar DJ filter, a tempo-synced echo, Mutable Instruments
  Clouds with the Parasites firmware, Dragonfly plate, room and hall reverbs, four pads with a drum or a WAV
  one-shot each, a look-ahead limiter, a Panic button and 16 saved presets. MPC OS sends no MIDI to insert effects,
  so each instance opens its own MIDI input port that a MIDI track can play. The wrapper, skin generator and
  installer come from sd88me's mpc-vst-plugins. It was tested on an Akai Force with MockbaMod; the README calls
  other first-generation MPC OS units untested.
