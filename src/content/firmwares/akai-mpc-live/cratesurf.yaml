device: akai-mpc-live
name: CrateSurf
summary: Alpha web browser for rooted MPC One+ and MPC Live II units that runs Chromium on the touchscreen from a Debian chroot, with downloads saved straight into MPC Documents and unpacked on the device.
description: >-
  Gives the MPC a browser for finding samples. A chroot of Debian armhf packages holds Chromium, weston and PulseAudio
  and is copied to /data/browser, and a small Node server on port 8798 switches the panel between the MPC application
  and the browser, because the application holds the display and the two cannot share it. Browse mode is entered with a
  three-finger hold, Ctrl+Alt+B on a USB keyboard or a page served by the device, and a bar on every page offers
  navigation, an on-screen keyboard, a recorder that writes the page audio as WAV files and an exit button. Downloads
  go to MPC Documents/Samples or another chosen folder, show their size and free space first, and zip files unpack on
  the device. Confirmed on an MPC One+ up to firmware 3.10 and an MPC Live II up to 3.9.1; scrolling is slow because
  the GPU path tears the display. The installer does not bundle or download an SSH-enabled firmware image.
status: active
