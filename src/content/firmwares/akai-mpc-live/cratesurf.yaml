distribution: download
requires_stock: Rooted MPC One+ (firmware up to 3.10) or MPC Live II (up to 3.9.1)
install_notes: >-
  Needs root SSH on the unit, which the project does not provide beyond pointing to where SSH-enabled images come
  from. Run the installer for Windows, macOS or Linux from the release page and type the MPC's IP address; it checks
  the device, downloads a payload of about 350 MB, installs the toggle service and by default sets a root password
  and key. With the boot option it writes a unit file into the read-only firmware partition. Browse mode stops the
  MPC application, which does not save on exit, so save the project first. The toggle port has no authentication.
brick_risk: true
