device: akai-mpc-live
name: FeluccaSynth
summary: VST2 plugin for MPC OS 3.10.1 and later that ports the six Felucca synthesis engines to one eight-voice stereo instrument with a custom touchscreen skin, eight programs, a stereo delay and a room reverb.
description: >-
  FeluccaSynth uses the six engines of Felucca-Engines, the library extracted from the M-VAVE FM-1 firmware Felucca:
  analog, lofi chip, three-oscillator trio, tonewheel organ, noise and phase distortion. Each plugin instance plays one
  engine at a time with eight voices, MIDI velocity, sustain and pitch bend, a global ADSR, and a delay and reverb
  written for the plugin. All six engine pages stay editable while one is selected. Settings are stored with the MPC
  project. The README lists what is left out of Felucca: its four-part sequencing, song mode, web editor, modulation
  matrix, the lofi arpeggio and the sample engine. The repository includes compiled ARM32, ARM64 and macOS builds of the
  plugin in its build folder, built from the source in src, and no tagged releases.
