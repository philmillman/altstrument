  part of this plugin.
based_on: m-vave-fm-1/felucca-engines
distribution: download
requires_stock: MPC OS 3.10.1 or later with Enable Enhancements and External Plugin Support turned on
install_notes: >-
  Copy the plugin folder from build (named FeluccaMPC - VST - Felucca Synth) into the VST2 Plugins folder of a drive, or
  rebuild it with the MPC Plugin Builder SDK's tools/build.py. Turn on Enable Enhancements and External Plugin Support
  under Preferences, Enhancements. The README says it was checked with a host simulator and that CPU use depends on the MPC model and settings. Remove the folder from the drive to uninstall.
brick_risk: false
