license: unspecified
license_notes: >-
  The repository has no top-level LICENSE file and the README gives no licence for the plugin; it says kissfft is BSD-3-Clause, the Akai plugin SDK is MIT, and that firmware/ and android/ come from the original app with their own licences (firmware/LICENSE.md is GPL text from M-VAVE's FM1 Open). The engine comes from ferluht/fm1-sampler, which has no licence. firmware/sdk/firmware/FM-1_015.fwsc matches M-VAVE's FM-1 V15 image licensed Apache-2.0 (git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd).
homepage: https://github.com/Koolkatze/FM1-AKAI-Sampler-MPC-ONE
distribution: download
requires_stock: MPC OS 3.10.1 or later
install_notes: >-
  On the MPC, turn on Enable Enhancements and External Plugin Support under Preferences, Enhancements (Beta). Unzip mpc/release/FM1_LooperX_MPC_SD.zip and copy everything to the root of the SD card or a USB drive, then add the plugin to a track from External Plugins. To remove it, delete the plugin's folder from VST2 Plugins. The README warns that third-party plugins run inside the MPC without protection and a fault can hang it, so it advises saving the project often.
