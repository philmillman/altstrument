device: akai-mpc-live
name: FM1 Sampler for MPC One
summary: >-
  Port of the FM1 Sampler sound engine to an Akai MPC plugin, with six sample-playing modes, envelope, LFO, arpeggiator, tape and effects, packed with LooperX on a ready-to-copy SD card image.
description: >-
  Rights warning: the repository's factory samples are the 17 WAV files from the FM1 Sampler Android app (ferluht/fm1-sampler), which gives no source or licence for them, and the README says that original project declares no licence and that its author should be asked for permission before the plugin is distributed publicly.

  The plugin runs the FM1 Sampler engine inside the MPC, with melodic, one-shot, looped, kit or slice, granular and Paulstretch modes, an ADSR envelope, an LFO, an arpeggiator, scales and chords, tape colour, reverb and delay. Controls are arranged as rows of four for the MPC's Q-Links and the touch screen, and the pads play the sample. Samples are read from folders on the SD card or internal disk, including the folders that LooperX uses, and a checked-in SD card zip also carries the 22 LooperX plugins. A mode that treats an M-VAVE FM-1 running the FM1 Sampler firmware as a controller over USB is marked experimental. The README says it was tested with Akai's SDK simulator and the repository's own tests, which compare the plugin with the phone engine sample by sample, and not yet on a real MPC One. The repository also holds the original app's Android project and FM-1 firmware.
