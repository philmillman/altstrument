device: akai-mpc-live
name: Machinemodule for MPC OS
summary: Native VST2 instrument that runs the Elektron Machinedrum sound engine on MPC and Force, with all 16 tracks in one plugin, a touchscreen skin and Q-Link control; it needs your own Machinedrum OS file, and Gen2 MPCs have a ready-made download.
description: >-
  Plays the Machinedrum SPS-1 UW voices by running the unit's own DSP code in
  a DSP56300 emulator that is recompiled ahead of time for 32-bit ARM, with
  the parameter maths taken from your OS file in a 68k emulator. The plugin
  has pages for synth, amp and effects, routing and LFO per track, a kit
  library and a voice budget to keep CPU use in check. Two companion plugins
  put individual tracks or the reverb and delay sends on their own MPC tracks.
  The Gen2 download has the Machinedrum master effects (reverb, delay, EQ and
  dynamix), a 16-track mixer page with mute and solo, and the CTR control
  machines; a first-generation build leaves the master effects out and sends the
  reverb and delay sends to the companion plugin instead. The RAM, input and
  MIDI machines are not included. Nothing from Elektron is in the repository or its releases: the
  build needs the Machinedrum OS 1.63 file and, for the ROM sample machines and
  factory kits, a flash image from your own unit. Developed on a Force and
  tested on MPC OS 3.9.1. The same engine is also released as a desktop
  VST3 / AU plugin from this repository. The plugin was called Machinedrum
  until v0.3.6. The Gen2 download runs the voice DSP on a JIT compiler
  instead of the ahead-of-time ARM build.
status: active
authors:
  - name: sd88me
    url: https://github.com/sd88me
source: https://github.com/sd88me/mpc-vst-machinedrum
source_status: open
license: AGPL-3.0-only
license_notes: The README states AGPL-3.0-only. The bundled dsp56300 emulator is GPL-3.0.
distribution: download
requires_stock: MPC OS 3.x
install_notes: >-
  Gen2 MPCs (64-bit, such as the MPC Live III) can install the prebuilt
  aarch64 zip from the release, then put your own Machinedrum OS 1.63 .syx in
  the plugin's machinedrum folder; it has no ROM machines or factory kits and
  the author had not yet tried it on a Gen2 unit. For other models, or to get
  the ROM machines and kits, run the release script on a computer with Docker,
  using your own OS file and optionally a full flash image, and copy the
  resulting installer zip to the device over root SSH. The build takes about 25
  minutes. Expect around six simultaneous voices
  on a first-generation unit. Installing plugins this way is unofficial and
  needs a modded unit.
tags: [synth-engine, drums, emulator, platform]
