device: akai-mpc-live
name: MPC Chord Progression Generator and Finder
kind: tool
summary: Two browser tools for the standalone MPCs' chord progressions. The generator builds .progression files for Pad Perform on MPC One, Live, X and Key 61 from templates or scales. The finder reads existing files and names their chords and keys.
description: >-
  The generator offers 173 progression templates and 34 scales, shows each chord on the MPC pad grid, a keyboard, a guitar neck or staff notation, and exports single files, MIDI files or the whole
  catalogue as a prebuilt download. The README documents how the MPC reads the name inside a .progression file and sets the exported names to match. Chords can also be sent over Web MIDI to external gear.
  The repository also has Roland MX-1, TR-8 and VT-4 MIDI program files (.xpm) for MPC programs. Nothing is sent to the MPC from the browser except as files you copy over.
status: active
authors:
  - name: Jean-Marc Liotier
    url: https://github.com/liotier
source: https://github.com/liotier/AkaiMPC
source_status: open
license: Unlicense
homepage: https://liotier.github.io/AkaiMPC/
distribution: browser-installer
install_notes: >-
  Open the hosted page, generate or analyse progressions, and copy the downloaded .progression files to the MPC's storage. Web MIDI output works in Chrome, Edge and Firefox.
brick_risk: false
tags: [chords, midi, web-midi, web, generative, converter]
