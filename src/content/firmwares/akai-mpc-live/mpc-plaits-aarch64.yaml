device: akai-mpc-live
also_devices: [akai-force, akai-mpc-sample]
name: MPC Plaits (aarch64 and Melodee)
summary: keremimo's fork of poloq's MPC Plaits that adds an aarch64 build for second-generation MPC OS devices and the MPC Sample's Melodee, slide and tie from a sequencer, a page in Melodee's look and 25 factory sounds.
description: >-
  The sound engine, voices, modulation and parameter positions are poloq's MPC Plaits, so projects saved with poloq's 1.0.x open with this build. The fork adds an aarch64 build next to the armv7 one, with a separate zip for Melodee on the MPC Sample, Slide and Tie driven by CC 84 and CC 68 as Melodee sends them, an eight-tab page whose Q-Links come in groups of three for Melodee's K1 to K3 rows, and 25 factory sounds in the preset menu. The two MODEL arrow buttons are removed, and a fix stops the FM attenuverter taking a note below C0 where the Waveshaping model read past the end of a table. The 1.1.0 release notes say it was not yet tested on an MPC OS device or the MPC Sample and the factory sounds were not checked by ear.
