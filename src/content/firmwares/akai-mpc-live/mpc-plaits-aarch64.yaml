distribution: download
requires_stock: MPC OS 3.x standalone device or Force with root SSH access, or an MPC Sample running Melodee
install_notes: >-
  On MPC OS, download the armv7 zip for first-generation devices and Force or the aarch64 zip for second-generation ones, copy the folder to the device and run install.sh as root over SSH; this needs a modded unit. For Melodee, unzip the mpc-sample zip and copy the poloq - VST - MPC Plaits folder into Plugins at the top of the SD card. Installing plugins this way is unofficial.
