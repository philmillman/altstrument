name: MPC Plaits
summary: Native VST2 instrument for first-generation MPC OS devices and Force that runs all 24 Mutable Instruments Plaits models with up to eight voices, LFOs, envelopes, two modulation matrices and a six-page touchscreen skin.
description: >-
  MPC Plaits is a port of Plaits to MPC OS's VST2 plugin host. It has mono, poly and legato voices with unison, detune and spread, four low-pass gate behaviours (gate, ping, envelope and drone), two LFOs, two ADSRs, a cycling envelope and a random source. A fixed 4 x 4 matrix and an assignable one route them, including velocity, aftertouch and the mod wheel, and tempo sync follows the MPC. Q-Links follow the page on the touchscreen. The bridge to the Plaits engine is vendored from handcraftedcc's MrHyde for Ableton Move, and the wrapper and skin tooling come from sd88me's mpc-vst-plugins. The skin artwork is derived from Mutable Instruments' panel and stays CC-BY-SA 3.0. Tested by its author on an MPC One running MPC OS 3.9.1. keremimo's fork of this plugin adds an aarch64 build and a Melodee page.
