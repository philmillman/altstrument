distribution: download
requires_stock: First-generation (32-bit ARM) MPC OS standalone device or Force, with root SSH access
install_notes: >-
  Needs root SSH access, so it is meant for modded units. Download the armv7 release zip, copy the folder to the device and run install.sh as root; it stops MPC, backs up MPC.settings, registers the plugin and restarts MPC. On MPC One and Live the SD card is mounted noexec, so install into a folder on internal storage listed under SynthContentLocations in MPC.settings. Installing plugins this way is unofficial.
