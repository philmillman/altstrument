  Steinberg VST SDK code and notes that VST is a trademark of Steinberg Media Technologies.
homepage: https://www.akaipro.com/downloads-and-support/downloads/firmware/mpc/
distribution: source-only
requires_stock: MPC OS 3.10.1 or later
install_notes: >-
  MPC Sample: update to firmware v1.4.0 or later, turn on Dev Enhancements and Custom Plug-In Support in MIDI Config and copy effect plugins to VST2 Plugins on the microSD card in SD Card Access mode. Other MPCs: update to OS 3.10.1 or later, then turn on Enable Enhancements and External Plugin Support under Preferences,
  Enhancements. Build a plugin with python tools/build.py and copy the output folder to VST2 Plugins on a USB drive or SD
  card, or install it with the SDK's network tool. A faulty plugin can freeze or restart the MPC; remove its folder from the
  drive to recover.
brick_risk: false
tags: [official, sdk, platform, vst, dsp, plugins, ai]
