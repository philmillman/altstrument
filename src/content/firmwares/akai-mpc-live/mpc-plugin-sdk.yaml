homepage: https://www.akaipro.com/downloads-and-support/downloads/firmware/mpc/
distribution: source-only
requires_stock: MPC OS 3.10.1 or later
install_notes: >-
  Update the MPC to OS 3.10.1 or later, then turn on Enable Enhancements and External Plugin Support under Preferences,
  Enhancements. Build a plugin with python tools/build.py and copy the output folder to VST2 Plugins on a USB drive or SD
  card, or install it with the SDK's network tool. A faulty plugin can freeze or restart the MPC; remove its folder from the
  drive to recover.
brick_risk: false
