device: akai-mpc-live
also_devices: [akai-force]
kind: tool
name: MPC Plugin SDK
summary: inMusic's open SDK for building instrument and effect plugins that run inside MPC OS 3.10.1 or later on standalone MPCs and Force, with a build tool, a host simulator and agent skills.
description: >-
  A plugin is a Linux shared library that follows the VST 2.4 binary interface, packaged with a plugin.json manifest and JSON
  skins for the touch screen and the sixteen hardware knobs. The repository holds a header-only C++ framework, DSP helpers,
  three example plugins (a synth, a delay and a drum synth), a cross-compiling build script for 32-bit and 64-bit MPC
  processors, a command-line host simulator and a tool that installs plugins onto an MPC over the network. It also ships agent
  skills and instructions so that a coding assistant can write a plugin from a plain-language description. The README lists
  the MPC X, X SE, Live, Live II, One, One+, Key 37, Key 61, Force, Live III and XL as targets and requires the External
  Plugin Support option under Preferences, Enhancements, which Akai marks as beta. It does not list the MPC Sample. The README
  warns that a plugin runs inside the MPC application unprotected and that inMusic does not support third-party plugins.
status: active
