    url: https://github.com/stampman3000-jpg
source: https://github.com/stampman3000-jpg/mpc-tributary
source_status: open
license: GPL-3.0-only
license_notes: The README and source header state GPL version 3 with no "or later" wording.
homepage: https://github.com/stampman3000-jpg/mpc-tributary
distribution: download
install_notes: >-
  Needs root SSH access. Copy the plugin folder into the Synths folder on the
  MPC's storage card, add its line to the MPC plugin list (back up
  MPC.settings first; pluginList-arm for 32-bit units, pluginList-arm-64bit
  for Gen 2), restart the MPC once, then insert the plugin on a track. Release
  zips are provided for armv7 and aarch64. Building from source needs Docker
  and a checkout of mpc-vst-plugins.
