device: akai-mpc-live
name: Tributary
summary: "Native MPC plugin that plays Elektron Overbridge audio over USB on the MPC track it sits on, with switches to sum chosen outputs; heard on a Digitone II, other Overbridge machines listed but untested."
description: >-
  A plugin for rooted standalone MPCs, based on the channel maps and device
  ids of Overwitch, that opens the USB audio stream of a connected Overbridge
  machine and sends the selected outputs to its MPC track. Several copies on
  different tracks share one USB read. The author describes about 4 ms of
  buffering, says the MPC should be the clock, and notes that recording needs
  a resample because the audio is live USB input. Builds exist for 32-bit ARM
  and AArch64 MPCs. The author has only tested a Digitone II (OS 1.10A or
  newer). The wrapper needed to build comes from the separate
  open-mpc/mpc-vst-plugins repository.
status: active
authors:
