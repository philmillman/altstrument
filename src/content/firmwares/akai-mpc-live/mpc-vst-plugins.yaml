device: akai-mpc-live
name: MPC VST Plugins (Open MPC)
kind: tool
summary: Catalog, desktop installer and porting kit for native VST2 plugins that run inside MPC OS on standalone MPCs and Force, each with its own touchscreen page.
description: >-
  MPC OS contains a plugin host that can load Linux VST2 libraries. This
  repository holds a browsable catalog of community plugins with versions,
  licenses, source links and checksummed downloads, a desktop installer for
  Windows, macOS and Linux that copies plugins to a device over SSH, and a kit
  for turning an existing C or C++ engine into a plugin with a generated skin
  and Q-Link map. It includes Skin Studio, a browser page editor, and a release
  workflow for GitHub Actions. Catalog plugins include ports of Dexed, Plaits,
  Braids, NAM and Airwindows effects, the JV-880 emulation, and
  build-it-yourself ports of Elektron engines that need the user's own
  firmware. Engines written for Ableton Move's Schwung host build through an
  adapter. Developed on a Force on MPC OS 3.x. The on-device Plugin Manager
  has its own entry, OpenMPC Plugin Manager; it lived in this repository until
  v1.1.0 and now has its own.
status: active
authors:
  - name: sd88me
    url: https://github.com/sd88me
source: https://github.com/open-mpc/mpc-vst-plugins
source_status: open
license: MIT
license_notes: >-
  The repository is MIT. Third-party folders such as tools/vendor keep their
  own licenses, and the plugins listed in the catalog are separate projects
  with their own.
homepage: https://open-mpc.github.io/
distribution: download
requires_stock: MPC OS 3.x (2.x partly, per plugin skin)
install_notes: >-
  The desktop installer needs root SSH access to the device, so it is meant for
  modded units. It backs up the settings file, checks each download and
  restarts MPC once per batch. On MPC OS 2.x a plugin loads and responds to
  Q-Links, but its touchscreen page stays empty unless the release has a
  skin in the older format. A plugin crash takes MPC down with it.
tags: [sdk, platform, loader, web]
