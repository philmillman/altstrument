device: akai-mpc-live
also_devices: [akai-force]
name: πAMB
summary: Generative ambient instrument plugin for MPC and Force, a port of the AMB-1 engine from the M-VAVE FM-1 with a touch screen view and eight built-in pieces.
description: >-
  πAMB runs as an external plugin on the MPC and Force through Akai's plugin SDK. It plays by itself, using a pad
  voice, bells on four tape loops of different lengths, a gliding bass and a soft Euclidean pulse that share one
  scale and one slowly changing chord, through a tape echo and a plate reverb. Eight pieces are available as
  presets, the touch screen shows the current chord and a ring of the twelve notes that can be edited, and
  seven pages of four controls each map to the Q-Links.

  The music engine is Charles Vestal's AMB-1, which the repository includes unchanged at a pinned commit. The
  project adds the MPC adapter, the screen and the packaging. It is tested on a first-generation Force. The
  64-bit package for second-generation units has not been tried on hardware, only one instance can sound at a time,
  and the tempo is not synced to the host.
