based_on: m-vave-fm-1/amb-1
distribution: download
requires_stock: MPC OS 3.10.1 or later with Enhancements and External Plugin Support enabled
install_notes: >-
  Unzip the release package and copy the folder Timo - VST - πAMB into a folder named VST2 Plugins at the root of a
  drive, such as /sdcard/VST2 Plugins on the internal memory, then restart MPC. The README gives no root access or
  installer script as a requirement. Removable drives mounted noexec cannot run plugins. To remove it, delete the
  folder and restart. A plugin from an earlier catalogue package that was installed with an install script has to
  be removed with its own uninstall script first, or the plugin is listed twice.
brick_risk: false
