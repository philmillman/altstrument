device: akai-mpc-live
name: OpenMPC Plugin Manager G2
summary: On-device VST2 plugin manager for MPC OS 3.x, a fork of poloq's Plugin Manager for MPC with Gen1 and Gen2 builds, that installs, updates and removes catalog plugins from the MPC itself with rollback.
description: >-
  Runs as an instrument plugin with its own touchscreen skin and reads the
  mpc-vst-plugins catalog over the device's network. Tabs list plugins to
  discover, installed ones and updates, with search, filter and sort. Changes
  are queued and applied together with one MPC restart. Before MPC is stopped
  each package's SHA-256 is checked and its manifest is compared with the
  device's architecture, glibc and MPC OS, and plugins go only to a folder MPC
  lists in SynthContentLocations. A failed install puts the plugin folder and
  MPC.settings back. It also takes local zips, registers hand-copied plugin
  folders, handles addins and has a light and dark theme. It started as a fork
  of poloq's Plugin Manager for MPC and keeps that project's history. v0.1.9
  was Gen2 only; v0.2.0 ships a 32-bit armv7 zip for Gen1 devices (Force, Live,
  Live II, One, X, Key) next to the 64-bit aarch64 zip for Gen2. The author
  tested it on an MPC Live III with MPC OS 3.10 and on a Force; the MPC One
  layout comes from a user report and is tested offline only.
status: active
authors:
  - name: sd88me
    url: https://github.com/sd88me
  - name: poloq-instruments
    url: https://github.com/poloq-instruments
source: https://github.com/open-mpc/mpc-vst-plugins/tree/main/tools/plugin_manager_g2
source_status: open
license: MIT
license_notes: >-
  LICENSE is MIT and keeps poloq's copyright notice from the upstream manager;
  NOTICE.md lists the other contributors and sources. The repository is MIT
  overall. Nothing of Akai's firmware or skins is included.
homepage: https://open-mpc.github.io/
distribution: download
requires_stock: MPC OS 3.x
install_notes: >-
  Download the zip for your device (mpc-armv7 for Gen1, mpc-aarch64 for Gen2),
  copy the folder to the device over root SSH and run install.sh with -t and a
  Synths folder listed in SynthContentLocations in MPC.settings. It stops MPC,
  backs up MPC.settings and starts MPC again. The scripted install needs a modded
  unit with root access. Since v0.9.0 there is also a USB stick, written from the
  project's install page in Chrome or Edge, that installs the manager without SSH
  on MPC OS 3.9.1 and earlier; the stick runs a script as root once the prompt is
  confirmed, and the project says MPC OS 3.10 is not supported by it. The device
  needs a network connection for the catalog. Applying changes restarts MPC, so
  save the project first.
brick_risk: false
tags: [loader, utility, platform, ui]
