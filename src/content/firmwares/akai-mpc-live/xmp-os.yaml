device: akai-mpc-live
name: XMP OS
summary: Clip-based music workstation OS for the original MPC Live (Mk1) that boots from a USB key, with a browser version, an SDK and a graphical installer for macOS and Windows.
description: >-
  XMP OS (eXtensible Music Platform) replaces the MPC application on an original MPC Live (Mk1, board ACV8) with a
  clip, scene and pad workflow, with its own mixer, kits and synth modules. It runs from a USB key; the same
  touchscreen interface is built from shared C++ and also runs in a browser at abstracteng.com/xmpos, where it can be
  tried without hardware. The repository holds the app, a declarative module SDK with examples, build tools and
  the installer source. The installer builds its loader and a stock-recovery copy locally from Akai's own signed
  updater, which the owner supplies, so no Akai files are distributed. Only MPC OS 3.10.1 on the Live Mk1 is
  supported; MPC One and One+ are planned ports with installation disabled, and Force is excluded. The authors
  note that physical Windows PC flashing and Apple Silicon testing were still pending at 1.0.1.
