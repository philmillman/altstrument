homepage: https://abstracteng.com/xmpos/
distribution: download
requires_stock: MPC OS 3.10.1 (Gen 1)
install_notes: >-
  Download the installer ZIP for the computer in use from the release page, extract all of it and open the installer.
  Supply Akai's official Gen 1 MPC OS 3.10.1 updater, enable Developer Mode on the Live and let the installer verify
  the unit read-only. It prepares a FAT32 USB key, then, after a typed confirmation, writes a loader to the Live's
  rootfs partition over fastboot (hold FULL LEVEL, ERASE and PAD BANK C/G while powering on). The bootloader and other
  partitions are not written. XMP boots with the key inserted and Akai's MPC OS boots without it. A full return to
  stock writes the original rootfs back from the same updater; the project's recovery guide covers it.
brick_risk: false
