device: akai-mpc-sample
kind: tool
name: Le Resampler
summary: Desktop sample library manager that scans folders, infers category, BPM and key, previews files and exports a selection to an SD card in category folders for the Akai MPC Sample.
description: >-
  A Tauri application with a Rust backend for macOS, Windows and Linux. It indexes audio files recursively, shows
  BPM, key, duration and category taken from file names and metadata, lets you edit these and add tags, and plays
  files for preview. Exporting copies the checked samples into subfolders such as kick, snare and loop on a
  destination folder, which the README says matches the layout the MPC expects on its SD card. It does not talk to
  the unit and does not change its firmware. It is a general sample organiser aimed at MPC users, so it is a
  borderline entry. Releases are built automatically every week without release notes.
status: active
authors:
  - name: Flug
    url: https://github.com/flug
source: https://github.com/flug/Le-Resampler
source_status: open
license: MIT
distribution: download
install_notes: >-
  Download the installer for your system from the GitHub releases page (a dmg for macOS, an exe installer for
  Windows, an AppImage, deb or rpm for Linux). On macOS the README also gives a Homebrew cask from the
  project's tap. Copy the exported folders onto an SD card for the MPC Sample.
brick_risk: false
tags: [sampler, library, editor, utility]
