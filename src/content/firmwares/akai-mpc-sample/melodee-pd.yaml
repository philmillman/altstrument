distribution: download
install_notes: >-
  For Melodee on the MPC Sample, unzip the release's -mpc-sample.zip and copy the plug-in folder inside into the
  Plugins folder at the top of the card. MPC OS devices that load Open MPC plug-ins, which needs root access, take the
  -mpc-aarch64.zip (Gen 2) or -mpc-armv7.zip (Gen 1). Building needs Docker and a checkout of mpc-vst-plugins.
