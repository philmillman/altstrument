device: akai-mpc-sample
name: Melodee (MPC Sample)
summary: >-
  keremimo's 16-track groovebox for the MPC Sample, started from the microSD card in place of the stock app: kits,
  sampled instruments, a VST3, VST2, LV2 and CLAP host, MIDI tracks, patterns, song mode and a looper.
description: >-
  A separate app from the author's FM-1 firmware of the same name, built on the author's sample-base runtime for
  the MPC Sample. Each pad is a track holding a kit of up to 128 pads, a sampled instrument, a plug-in instrument or
  a MIDI track for external gear. Sampled instruments stream from the card and can be SFZ, MPC keygroup and drum
  programs, MPC expansions, EXS24, SoundFont or DecentSampler files; stock MPC Sample projects open as well. The
  sequencer has 16 patterns per track of up to 128 bars, with parameter locks, ratchets and trig conditions, plus
  scenes, chains and a song arrangement that exports a WAV mix, stems or a MIDI file. There are 41 effects on track
  chains, four send buses and the master, a four-loop looper and MIDI clock and MTC sync. The plug-in host loads
  aarch64 Linux VST3, VST2, LV2 and CLAP builds and Open MPC plug-ins, and runs 32-bit ARM plug-ins through a bridge. Songs from stock MPC Sample projects, jam capture and Ableton Live Set export arrived in the 0.6 line. Its own
  synths moved out into three separate plug-ins at 0.1.0: Melodee Poly, Melodee PD and Melodee Chip.
status: active
authors:
  - name: keremimo
    url: https://github.com/keremimo
source: https://github.com/keremimo/melodee-sample
source_status: open
license: AGPL-3.0-only
license_notes: >-
  AGPL-3.0-only (LICENSE), with JUCE used under the AGPLv3 and the Rubik font under OFL-1.1 (THIRD_PARTY.md). The
  boot animation's logo and backdrop are not covered by the AGPL: forks may keep the files, but no public release of
  a fork may include them. Since 0.10.2 a NOTICE file adds section 7 terms: author attribution, no passing off as the original, and no rights to the names and logos.
homepage: https://github.com/keremimo/melodee-sample
based_on: akai-mpc-sample/sample-base
distribution: download
requires_stock: 1.3.0.12, 1.4.0.7 or 1.4.0.8
install_notes: >-
  Back up the microSD card and move any existing top-level autorun folder aside, then copy the release zip's autorun
  folder to the top of the card. The stock app starts first and Melodee takes over a few seconds later. On firmware 1.4.0.7 (since 0.6.6) turn on Developer Mode in the stock app's Settings, copy the autorun
  folder and the autorun.sh file to the top of the card and press Yes each time the MPC asks to run the card's script; Screen Mirror is not available there and Melodee runs at 44.1 kHz only. On firmware 1.4.0.8 it needs 0.8.0 or newer; on any other
  stock firmware it does not start. Nothing on the MPC itself changes: choose MPC APP on Melodee's exit screen, or
  delete the autorun folder, to get the stock app back. Plug-ins go in Melodee/Plugins on the card. Since 0.2.0 Melodee installs later releases from a zip copied to the card; 0.1.0 has to be replaced by hand.
brick_risk: false
tags: [groovebox, sequencer, sampler, platform, midi]
image:
  url: https://raw.githubusercontent.com/keremimo/melodee-sample/main/docs/images/melodee-promo.png
  alt: "Melodee promo banner: the pixel wordmark and feature list beside six screen captures, including a song arrangement, a four-loop looper, a sample chop view and a plug-in picker"
  credit: keremimo
  source_url: https://github.com/keremimo/melodee-sample#readme
  first_party: true
versions:
  - version: v0.10.2
    date: 2026-11-28
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.10.2
    notes: Adds a sequence colour picked from the Menu on Sequences and Patterns, and NOTICE, the additional terms under section 7 of the AGPL covering attribution, origin and names and logos.
  - version: v0.10.1
    date: 2026-11-28
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.10.1
    notes: Fixes short bursts of silence in USB-C audio played from a computer or phone into the MPC at 44.1 kHz, and adds recording an audio track's input into the song as a clip.
  - version: v0.10.0
    date: 2026-11-28
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.10.0
    notes: >-
      Adds Song loop ranges with copy, paste and take-out of sections, an all-tracks Song view, Time Correct APPLY, layers chosen by a MIDI CC, MPC 3 drum kits, track colours, start and stop from a foot pedal, program changes to plug-ins and an optional screensaver. Mutes now land on the grid and Time Correct's B2 is GROOVE, so read the release notes before updating.
  - version: v0.9.1
    date: 2026-11-26
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.9.1
    notes: Fixes the SLICE card on a kit step's SOUND cards, which stayed blank in 0.9.0.
  - version: v0.9.0
    date: 2026-11-26
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.9.0
    notes: >-
      The sequencer now counts 960 ticks a quarter note, as the MPC does, and adds per-track speed and direction, a sound of its own for each step, pattern lengths up to 128 bars, trimming before loading a sample and file sharing over USB-C on firmware 1.3.0.12. A project saved in 0.9.0 plays ten times too slow in 0.8.3 and earlier; back up Melodee/Projects first.
  - version: v0.8.3
    date: 2026-11-25
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.8.3
    notes: >-
      Muted tracks stay muted in a sequence, and launching a sequence mutes and unmutes tracks as it keeps them. Adds copying a sequence with SHIFT + ERASE and clearing a single parameter lock. Back up Melodee/Projects before updating; supports MPC Sample firmware 1.3.0.12, 1.4.0.7 and 1.4.0.8.
  - version: v0.8.2
    date: 2026-11-24
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.8.2
    notes: >-
      The mixer opens on a row of strips, one per channel with meter, fader and mute or solo state; hold + to open the selected channel's card and hold - to return to the strips. Requires MPC Sample firmware 1.3.0.12, 1.4.0.7 or 1.4.0.8.
  - version: v0.8.1
    date: 2026-11-24
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.8.1
    notes: >-
      Effect plug-in tails of up to 10 seconds play out after the last sound, a preset picked on a sleeping CLAP plug-in applies at once, and a held sustain pedal no longer keeps a plug-in instrument running. Lowers screen and plug-in CPU work. Requires MPC Sample firmware 1.3.0.12, 1.4.0.7 or 1.4.0.8.
  - version: v0.8.0
    date: 2026-11-24
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.8.0
    notes: >-
      Adds a mixer that replaces the Tracks and Sends pages: a strip per track with trim, a nine-band EQ, compressor and width, eight submixes, buses A to D, an input and a master channel, and pad outputs that send a kit pad to a submix. Adds support for MPC Sample firmware 1.4.0.8; 0.7.1 and earlier do not start on it. Requires MPC Sample firmware 1.3.0.12, 1.4.0.7 or 1.4.0.8.
  - version: v0.7.1
    date: 2026-11-23
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.7.1
    notes: >-
      Loads plug-ins in the MPC plug-in SDK folder format (the -mpc-sdk.zip of Open MPC releases) and plug-ins in VST2 Plugins at the top of the card, lists a plug-in folder's .xpl presets, lets a chop hold 128 slices on banks A to H, and reads a plug-in's samples and skins from the card instead of copying the folder into memory. Requires MPC Sample firmware 1.3.0.12 or 1.4.0.7.
  - version: v0.7.0
    date: 2026-11-23
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.7.0
    notes: >-
      Plug-in parameters come in pages under B1 to B3, with page files for hand-set pages and skins and a way for CLAP and VST2 plug-ins to draw their own screen on the MPC Sample, including 32-bit ARM plug-ins. Fixes names with a # in sample and instrument files. Requires MPC Sample firmware 1.3.0.12 or 1.4.0.7.
  - version: v0.6.8
    date: 2026-11-22
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.8
    notes: >-
      Finds a loop's exact tempo more often, makes Chop slices warp as their pad, stops a solo on an empty track silencing the others and lowers CPU use when a project is stopped or silent. Requires MPC Sample firmware 1.3.0.12 or 1.4.0.7.
  - version: v0.6.7
    date: 2026-11-22
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.7
    notes: >-
      SHIFT with K1 on Patterns sets a length of 1 to 64 sixteenths, a Mute setting can stop new notes and let sounding ones ring out, and MUTE with a pad records the mute on a pad's lane. Requires MPC Sample firmware 1.3.0.12 or 1.4.0.7.
  - version: v0.6.6
    date: 2026-11-22
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.6
    notes: >-
      Runs from the card on MPC Sample firmware 1.4.0.7 with Developer Mode on, at 44.1 kHz and without Screen Mirror. Adds a JAMS list on Song, with each PLAY to STOP run kept as its own jam, and a note preview in the pattern editors. Requires MPC Sample firmware 1.3.0.12 or 1.4.0.7.
  - version: v0.6.5
    date: 2026-11-22
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.5
    notes: A sequence now keeps its own pattern for each track, and SEQ with STOP turns the selected track off instead of stopping the transport. Opening a stock MPC Sample project turns its song into Song, and a jam capture records the patterns, mutes, tempo and sequences launched between PLAY and STOP. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.6.4
    date: 2026-11-21
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.4
    notes: Fixes chop hits from MPC Sample projects playing the whole sample. Adds Ableton Live Set export from Song, which writes an .als file with a copy of every sample for Live 12.1 or later, and a MIDI Config setting that plays the project's scale on a keyboard's white keys. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.6.3
    date: 2026-11-21
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.3
    notes: Fixes keygroup programs saved by the MPC software playing every key too high, because a root note of 0 was read as C-1 instead of using the root stored in the WAV file. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.6.2
    date: 2026-11-21
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.2
    notes: Adds a setting to turn Autosave off, with a SAVE button on Projects and a REVERT to the saved file. The engine, model and file formats move to a separate MIT-licensed repository, ellic-core, with no change in how Melodee plays. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.6.1
    date: 2026-11-21
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.1
    notes: While Seq Record runs, the pads on Chop record the slices they play, and a sequence can be given one of the 16 track colours. Stage's FX view can add an effect. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.6.0
    date: 2026-11-21
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.6.0
    notes: USB-C in plays straight to the jacks by default, about 8 ms sooner, and an audio track's MONITOR is now Off, Auto or On. Hand-played MIDI goes out at once, a MIDI track's delay reaches -50 ms, and an undo list, starred and recent samples, track names and the scales of Live 12, Push 3 and Move are added. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.5.1
    date: 2026-11-18
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.5.1
    notes: Holding SEQ launches patterns on the selected track, and SHIFT with a pad launches a sequence on every track. Auto chop cuts drums and music on the beats, TO PADS also writes a pattern of the slices, and a USB volume setting on AUDIO chooses between full level and following the main volume. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.5.0
    date: 2026-11-18
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.5.0
    notes: Settings and MIDI Config rows are now set with K1. Adds free pattern length that grows with the first sequencer recording and a new bar past the end in Step Edit, an Auto chop type that reads a sample as drums, music, shots or hits, a KIT card for TO PADS and up to eight velocity layers in the auto sampler. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.4.0
    date: 2026-11-17
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.4.0
    notes: Reworks Chop with a manual take on the pads, hand-fixed cuts that survive re-chopping and beat division, and adds Load Kit from MPC drum programs, a gap-closing erase, sample note detection and a one-press Rec Quantize. A new project starts with no tracks, new samples go to Melodee/Samples and Melodee starts on the Full track set. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.3.0
    date: 2026-11-16
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.3.0
    notes: SEQ opens Sequences with pads that launch a sequence on every track, and the open project saves itself. Adds Audio and Keygroup tracks, an auto sampler, 4-stem separation, long samples played from the card and MPC 3 project export and import. Requires MPC Sample firmware 1.3.0.12.
  - version: v0.2.2
    date: 2026-11-14
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.2.2
    notes: Adds Cycle hold and Random hold layer play and an arpeggiator on/off shortcut. Note Repeat no longer works as the arpeggiator and plays every held pad on each step, and repeats land on their exact frame.
  - version: v0.2.1
    date: 2026-11-14
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.2.1
    notes: Adds pad-light settings, a Note Repeat velocity option and a plug-in delete button on the web page. Idle plug-ins sleep, Warp by Time sounds cleaner, and the Cloud setting moves from per kit to per pad.
  - version: v0.2.0
    date: 2026-11-14
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.2.0
    notes: Adds updates from a release zip on the card, a web page at melodee.local over USB-C, a screen mirror that shows the MPC as a webcam, LV2 and CLAP plug-ins, track freeze, 128 patterns per track and Roll, Chop and 16 Levels changes. Plug-ins move to Melodee/Plugins on the card, and 0.1.0 has to be replaced by hand once.
  - version: v0.1.0
    date: 2026-11-12
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.1.0
    notes: First full release. The built-in synths became the separate Melodee Poly, PD and Chip plug-ins; FM6 and 909 tracks were dropped.
  - version: v0.1.0-alpha.6
    date: 2026-11-11
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.1.0-alpha.6
    notes: Adds a skippable boot animation.
  - version: v0.1.0-alpha.5
    date: 2026-11-11
    url: https://github.com/keremimo/melodee-sample/releases/tag/v0.1.0-alpha.5
    notes: Adds Logic EXS24 instruments to the streamed multisample formats.
