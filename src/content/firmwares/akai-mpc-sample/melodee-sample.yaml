homepage: https://github.com/keremimo/melodee-sample
distribution: download
requires_stock: "1.3.0.12"
install_notes: >-
  Back up the microSD card and move any existing top-level autorun folder aside, then copy the release zip's autorun
  folder to the top of the card. The stock app starts first and Melodee takes over a few seconds later. On any other
  stock firmware it does not start. Nothing on the MPC itself changes: choose MPC APP on Melodee's exit screen, or
  delete the autorun folder, to get the stock app back. Plug-ins go in Melodee/Plugins on the card. Since 0.2.0 Melodee installs later releases from a zip copied to the card; 0.1.0 has to be replaced by hand.
brick_risk: false
tags: [groovebox, sequencer, sampler, platform, midi]
