device: akai-mpc-sample
name: Melodee (MPC Sample)
summary: >-
  keremimo's 16-track groovebox for the MPC Sample, started from the microSD card in place of the stock app: kits,
  sampled instruments, a VST3, VST2, LV2 and CLAP host, MIDI tracks, patterns, song mode and a looper.
description: >-
  A separate app from the author's FM-1 firmware of the same name, built on the author's sample-base runtime for
  the MPC Sample. Each pad is a track holding a kit of up to 128 pads, a sampled instrument, a plug-in instrument or
  a MIDI track for external gear. Sampled instruments stream from the card and can be SFZ, MPC keygroup and drum
  programs, MPC expansions, EXS24, SoundFont or DecentSampler files; stock MPC Sample projects open as well. The
  sequencer has 16 patterns per track of up to 128 bars, with parameter locks, ratchets and trig conditions, plus
  scenes, chains and a song arrangement that exports a WAV mix, stems or a MIDI file. There are 41 effects on track
  chains, four send buses and the master, a four-loop looper and MIDI clock and MTC sync. The plug-in host loads
  aarch64 Linux VST3, VST2, LV2 and CLAP builds and Open MPC plug-ins, and runs 32-bit ARM plug-ins through a bridge. Its own
  synths moved out into three separate plug-ins at 0.1.0: Melodee Poly, Melodee PD and Melodee Chip.
