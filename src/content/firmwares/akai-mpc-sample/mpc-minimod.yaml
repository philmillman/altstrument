device: akai-mpc-sample
name: MPC Sample MiniMod
summary: >-
  Small Rust mod that keeps the stock MPC Sample workflow and adds AutoTrim, 16 Levels octave shift and MIDI playback,
  a sample options menu, a synth, a 16-pad Live Looper, recent samples and optional voice naming.
description: >-
  A preload library written in Rust on the author's mpc-sample-sdk, started from the SD card's autorun folder, for firmware
  1.3.0.12 only. The README says it is meant to leave the original experience in place and add only small fixes. AutoTrim,
  on the trim screen, cuts a sample to its silent edges in steps of 3, 6 and 9 percent. In 16 Levels, PLUS and MINUS move the pads
  by eight semitones and an external MIDI keyboard plays the selected sample chromatically, from its root note or C3. A SAMPLE
  OPTIONS menu runs HPSS, which splits a sample into harmonic and percussive copies, Spectral Chop, which slices at changes of
  chord, phrase or drum, Add Reverb, Vinyl, Lo-Fi and an eight-character Synth that renders a note to a new pad. The Live Looper is a
  fullscreen view where each of the 16 pads records, plays and overdubs a loop from the selected input, with a sync pulse and
  latency compensation. A virtual Recent Samples folder lists the last 20 samples loaded in the Load Sample browser. An optional
  package adds voice project names, which transcribe speech locally with the Moonshine Tiny English model on the unit's CPU cores
  and include a C++ bridge to its runtime. To go back to stock, delete the autorun folder.
status: active
authors:
- name: ioma8
  url: https://github.com/ioma8
source: https://github.com/ioma8/mpc-minimod
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text. The repository holds no Akai firmware; the SDK finds and verifies the stock library
  on the unit. The dictation package bundles the Moonshine Tiny English model and its ARM64 runtime under their own terms.
distribution: download
requires_stock: "1.3.0.12 only"
install_notes: >-
  Download minimod.zip, or minimod-dictation.zip for voice naming, from a release, unzip it and copy the autorun folder to the
  top level of the SD card, then insert the card and power on. Delete autorun, or boot without the card, to return to stock.
  Building needs uv and zig, and the dictation build downloads a model of about 43 MB.
brick_risk: false
tags: [sampler, editor, looper, synth-engine, fx, performance, midi, rust, mod, sdk]
