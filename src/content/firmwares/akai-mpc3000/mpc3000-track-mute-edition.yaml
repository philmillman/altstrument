  sold, and invites others to improve it, but gives no licence text and publishes no source. It contains Akai's code.
homepage: https://www.deep88.com/vibecod/mpc3000/
distribution: download
install_notes: >-
  Download the zip from the author's page, copy the .sys file to a floppy disk, or the .hfe or .img file to a Gotek floppy
  emulator, and start the MPC3000 with it inserted. The page warns to back up all data first, particularly with ZuluSCSI,
  SCSI2SD or a SCSI Zip drive, and accepts no responsibility for data loss.
