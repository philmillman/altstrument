device: akai-mpc3000
name: MPC3000 OS 3.40 Track Mute Edition
summary: Free bootable modification of MPC3000 OS 3.12 that adds a Track Mute page, sampling while the sequencer runs, stop-sampling, a bit and sample rate crusher, normalize, incremental chop and double-stop.
description: >-
  Rights warning: this is a modified copy of Akai's MPC3000 operating system 3.12, shared as a zip from the author's own
  site, with no source and no stated licence. Only the page's own wording says it is unofficial and free.

  The Track Mute page opens from the SONG key and shows the first 16 tracks, with TIMING CORRECTION plus a pad
  triggering note repeat. Other additions are keeping the sequencer running in the Sample and Edit Sound pages, a stop soft
  key while sampling, a Crush page (4 to 16 bits, rates from 11 kHz to 44.1 kHz including the SP-1200 rate, drive, the 45 rpm
  pitch trick and an anti-aliasing filter), Normalize, Chop Incr for equal slices with repeated presses of DO, a Filter Live
  option, the slider in Edit Sound, a choice of Zone Play behaviour and hybrid SCSI mode for formatting disks that a computer
  can read. Program, sequence and all-file formats stay compatible with 3.11 and Vailixi, which ignore the mute groups. It is
  a bootable update only: put a .sys file on a floppy or on a Gotek image, with no EPROM version, and the author says
  it will never be sold. The author used MAME's MPC3000 emulation for early tests and says SCSI, including hybrid mode, was
  tested with 3.11 and Vailixi 3.50. The author used ChatGPT for the code.
status: active
