device: akai-mpk-mini
name: Akai MPK mini editor
kind: tool
summary: Browser preset editor for the Akai MPK mini, a React app that reads and edits the four programs over Web MIDI. It covers the pad banks, knobs, channels, octave, transpose and arpeggiator, and the README documents the 110-byte program SysEx.
description: >-
  The page requests a program from the controller with a SysEx query and decodes the reply into pad notes, program changes, controller numbers and
  toggle or momentary types for two banks of eight pads, plus the low and high values of eight knobs and the arpeggiator settings. The README
  lists the byte layout and the four factory presets as decimal and hex dumps. Its to-do list says saving and loading preset files was not done,
  and the project has not changed since 2020.
status: dormant
