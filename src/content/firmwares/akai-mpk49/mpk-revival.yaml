source_status: open
license: AGPL-3.0-only
license_notes: The LICENSE file is the GNU AGPL version 3 text and the README says AGPLv3, with no later-version clause. The factory preset dumps and backups are Akai's data and are not covered by that license.
homepage: https://github.com/carlomontec/mpk-revival
distribution: source-only
install_notes: >-
  Serve the editor folder locally (python3 -m http.server 8080 in editor/), open it in Chrome, Edge or Brave, connect the MPK49 over USB and press Connect MIDI. There is no hosted copy. The optional DAW scripts install with daw-integration/install.sh. Back up your presets before writing to the keyboard.
brick_risk: false
