device: akai-mpk49
name: MPK-Revival
kind: tool
summary: Browser editor and SysEx librarian for the Akai MPK49 with a reverse-engineered memory map of its 1,033-byte preset. It edits all 30 slots, senses control moves live, and sends to the keyboard. The repository also has Ableton Live and Reason control scripts.
description: >-
  Rights warning: the repository holds copies of the keyboard's 30 factory presets, as JSON and raw .syx backups and as base64 data inside the editor, which are Akai's preset data.
  The editor shows the pad matrix, knobs, faders, switches and arpeggiator of a slot and highlights a control as you touch it on the hardware. Presets can also
  be written as JSON and compiled to .syx files with a Node script. The remote scripts map the keyboard's three control banks to Ableton Live 12 and Reason 14, and a spec file documents the
  memory map. The README says the project is experimental, asks users to back up their presets first, and credits Google Gemini for part of the code.
status: active
