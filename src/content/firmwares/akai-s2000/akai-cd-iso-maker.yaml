device: akai-s2000
also_devices: [akai-s1000, akai-s3000]
name: Akai CD ISO Maker
kind: tool
summary: Desktop tool that builds Akai S1000, S2000 and S3000 sample CD images from audio files, reads and edits existing Akai CDs, and exports WAV, SFZ and SoundFont files.
description: >-
  The tool imports WAV, MP3, FLAC, Ogg and AIFF files, sets root notes and loops, maps samples into programs and writes a raw Akai disc image that is burned as a data CD. It has a loop finder, crossfade baking and a Tk
  GUI plus a command line. Existing S1000 and S3000 volumes can be opened, edited and rebuilt, and exported to WAV with loop data, SFZ or SoundFont 2. The README reports reading
  nine commercial CD images correctly, but says discs it writes had not been tried on a real sampler, and the S3000 mode is experimental. Releases include a Windows executable, and the
  repository builds macOS and Linux packages. The author credits Claude, an AI assistant, with the code and format analysis.
