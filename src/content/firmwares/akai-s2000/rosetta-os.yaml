device: akai-s2000
name: S2000 Rosetta OS
summary: Patch kit for the S2000's OS 2.0 that adds reverb, echo and reverse delay without the EB16 board, live input effects, a small synth rompler and redesigned menus, booted from a Gotek.
description: >-
  Build scripts patch your own copy of the OS 2.0 floppy into a boot image for a Gotek floppy emulator running FlashFloppy. The patched OS uses the voice chip's
  built-in delay line and taps for an EFFECTS page with room, hall, plate, echo, ping-pong, chorus and flanger types, plus tape, dub and resonator variants, and reverse delays
  on played notes. The sampling screen can send the live input through the same effects, including a reverse delay tied to a set tempo. Other additions are a home screen, grouped menus for
  program, sample and global editing, hold or tap recording, a synth page for tweaking the nine bundled synth programs, and drift, detune and filter LFO controls on MIDI CCs 20 to 25.
  The stock boot ROM loads only 256 KB, so extra code is read from the boot floppy into spare RAM after boot. The README reports most features running on a real S2000 and says the
  moving effects (chorus, flanger, juno, tape) crackle on held chords. The author credits Claude, an AI assistant, with the code and reverse engineering. A homemade V53 disassembler and
  emulator are in the repository.
