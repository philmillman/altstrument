license: MIT
license_notes: Covers the repository only. The README says no Akai code or data is included, and the test sounds are synthesized.
homepage: https://yuyoi.github.io/Akai-S2000-Rosetta-OS/
distribution: patch-your-own
requires_stock: "2.0"
install_notes: >-
  Needs your own OS 2.0 floppy as a Teledisk or raw image, Python with numpy, NASM, a Gotek with FlashFloppy and an HFE template of an Akai HD floppy. Run the two
  build scripts, copy the resulting HFE file to the USB stick as DSKA0000.hfe and boot the S2000 from the Gotek. Nothing is written to ROM or flash; booting your stock disk gives back the
  stock OS. Built images contain Akai's code and should not be shared.
