device: alesis-andromeda-a6
name: A6Plus
summary: >-
  Community build of the 2002 Andromeda OS, now in public beta, with fixes for jumpy knobs, CV
  and envelope glitches, plus stereo spread, vintage drift, a patch randomizer and new arp modes.
description: >-
  Rights warning: this is derived from Alesis's closed Andromeda firmware. The author says the
  code is newly written from reverse engineering, that all rights to the original remain with
  Alesis, and states no licence or release terms for the build.

  The beta adds an A6Plus page and a Settings page under the Global tab. New controls include
  a stereo spread knob, a vintage knob for per-voice drift, a customisable random patch
  generator with undo, five more arpeggiator modes, whole-number BPM, and a poly pressure
  input that is received as mono aftertouch. It also fixes jittery pots, CV-input glitches and
  envelope smoothing, and changes gain staging so that both oscillators at full level clip less
  than on stock. Existing patches may sound slightly different, and a Settings option switches
  between stock and modified envelopes. Beta 1.1.2 fixes the hanging notes reported with Beta 1.0
  and adds an experimental pseudo-polyphonic aftertouch mode that tracks up to 32 held keys and
  passes on the highest pressure; the author has not tested it with a poly aftertouch keyboard. The
  author lists known issues: the vintage knob can lag the arpeggiator in chord mode and is
  disabled in Mix mode. They say the bootloader is left
  untouched so stock firmware can be reloaded, and that Claude assisted with the coding.
