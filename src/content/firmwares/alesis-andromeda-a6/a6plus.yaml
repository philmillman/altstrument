homepage: https://gtsynthware.com/
distribution: download
install_notes: >-
  Put the Andromeda in bootloader mode (hold the seventh grey soft button at power-on), press
  Store to receive firmware, and send the downloaded SysEx file from a computer over MIDI. The
  transfer can take up to ten minutes and power must not be lost. When the screen asks, press
  a button to write to flash, then set the mod wheel to minimum for calibration. Back up your
  patches first and keep the stock firmware SysEx at hand; if the synth misbehaves, reload
  stock through the bootloader. The author's disclaimer says the firmware does not
  touch the bootloader, so the original firmware can be loaded again. The author calls this an experimental beta and asks you to read
  the disclaimer at https://gtsynthware.com/disclaimer/ before installing.
brick_risk: false
