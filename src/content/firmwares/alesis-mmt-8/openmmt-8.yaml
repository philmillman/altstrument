device: alesis-mmt-8
name: OpenMMT-8
summary: Replacement operating system for the MMT-8 sequencer, written in C from scratch, with extra part-edit functions and a stock-style profile with tape save, load and verify. Burned to a 27C256 or run in a CLAP plugin.
description: >-
  The repository builds 32 KB ROM images for the MMT-8's 8031 with SDCC. The default image adds part-edit functions: note and
  step entry over MIDI, a data knob that sends a MIDI controller, note audition, fast-forward and rewind by the quantize grid,
  bar:beat:tick times and one-step undo. A second profile keeps the tape functions of the original and leaves out those
  additions. Memory can be sent as a MIDI dump, which only OpenMMT-8 reads back. The same repository holds the JAM-8 ROM and a
  CLAP plugin that runs the ROMs on an emulated MMT-8 panel with display and MIDI. The README says it contains no original
  ROM or manual.
status: active
authors:
