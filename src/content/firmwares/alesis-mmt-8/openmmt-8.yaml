    url: https://github.com/uAdvanced
source: https://github.com/uAdvanced/openmmt-8
source_status: open
license: MIT
license_notes: Covers the OpenMMT-8 and JAM-8 code. The plugin bundles third-party components under their own licences, listed in THIRD_PARTY_NOTICES.md and LICENSES/.
homepage: https://openmmt8.outand.in
distribution: source-only
install_notes: >-
  Build the ROM with SDCC and Python, burn the image to a 27C256 EPROM and fit it in the unit's socket in place of the original
  chip. The project site has a guide to building and burning. Keeping the original chip lets you refit it to return to stock.
brick_risk: false
