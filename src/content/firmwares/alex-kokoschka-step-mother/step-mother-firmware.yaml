source: https://github.com/AlexKokoschka/StepDaddy
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README and NOTICE state GPL version 3 or later for the firmware and updater. The hardware repository is separate
  and uses CERN-OHL-S-2.0. The vendored Teensyduino 1.62.0 subset keeps its own licences (MIT-style, LGPL-2.1-or-later,
  BSD-3-Clause), as listed in NOTICE.
homepage: https://github.com/AlexKokoschka/StepMother
distribution: download
install_notes: >-
  Open StepDaddy from the release page and choose Step Mother; the case stays closed. A running unit restarts into the
  bootloader by itself. Otherwise hold Glide and Function while plugging in USB, or press the PROGRAM button on the
  Teensy once if it has never run this firmware. To install by hand, load the .hex file in PJRC's Teensy Loader. On a
  Step Mother 2 (USB-C), hold Glide and Function while plugging in USB, or use a brand-new board as it is, and copy the
  .uf2 file onto the RPI-RP2 drive. The
  macOS and Windows apps are not code-signed and show a one-time warning.
brick_risk: false
