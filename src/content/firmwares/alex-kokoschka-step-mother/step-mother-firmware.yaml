device: alex-kokoschka-step-mother
name: Step Mother firmware (StepDaddy)
summary: Open firmware for the Step Mother controller, in Teensy 4.1 and RP2040 versions, with the StepBro MIDI step sequencer and the Yummy Gummy 303-style bass synth, installed with the StepDaddy updater for macOS and Windows or with Teensy Loader or a UF2 copy.
description: >-
  Two engines run in one firmware and keep playing while the panel is switched between them. StepBro is a MIDI step
  sequencer with two banks of patterns, pattern chaining, per-step velocity, note repeat and a density knob, and it
  follows the host's MIDI clock. Yummy Gummy is a mono or four-note paraphonic saw and square synth with slides,
  accents, a ladder filter, distortion, a tempo-synced delay and its own sequencer with automation of eight parameters,
  and it streams 48 kHz audio to the computer over USB. Patterns and settings are written to a journal in program flash
  only while the sequencer is stopped, and an update keeps them. StepDaddy is a separate updater app, unsigned on both
  platforms, that carries the firmware file and can ask a running unit to restart into the Teensy bootloader. The
  Version 1.1.0 adds firmware for the Step Mother 2, a revision built around an RP2040 instead of a Teensy 4.1, with
  the same two engines; one StepDaddy updates both boards. The
  README states that the 303 name is a Roland trademark and that the project is not affiliated with Roland.
status: active
