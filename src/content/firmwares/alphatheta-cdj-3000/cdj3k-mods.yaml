device: alphatheta-cdj-3000
name: cdj3k-mods
summary: >-
  Open-source add-ons for the CDJ-3000 installed as a firmware update, with gate and smart cues, stem faders, a touch-strip sampler, new themes, playlist reordering and BPM grid controls.
description: >-
  Loads a shim into the deck's own EP122 application through the update overlay, so no stock firmware is
  replaced and the root file system stays untouched. Features are gate cue, smart cue and preview hot cue; drums,
  harmonics and vocals stems on three toggles and faders, separated by a separate server (stemd) running on a
  computer on the same network; an X-PAD sampler on the touch strip; six themes; reordering tracks within a
  playlist; and BPM double, halve and nudge controls for the grid panel. It supports both hardware variants on
  firmware 3.13 to 3.22 and installs nothing on a firmware version it does not recognise. The README states the
  project is independent of AlphaTheta and Pioneer DJ. Releases are marked unstable and for testing only.
status: active
authors:
  - name: nsaintot
    url: https://github.com/nsaintot
source: https://github.com/nsaintot/cdj3k-mods
source_status: open
license: Apache-2.0
license_notes: >-
  Dual-licensed under Apache-2.0 or MIT at the user's option (LICENSE-APACHE and LICENSE-MIT). The repository
  does not include AlphaTheta firmware. The .UPD packages are signed with a packaging key that the README says
  is kept secret and is not in the repository, so the published releases cannot be rebuilt as-is.
homepage: https://cdj3k-mods.com
distribution: download
requires_stock: CDJ-3000 firmware 3.13 to 3.22
install_notes: >-
  Copy the release's .UPD file to an MBR-formatted FAT32 or exFAT USB stick as the only .UPD on it, and run the
  deck's normal firmware update from the top USB port; the deck restarts twice. To remove the mods, power on
  while holding CUE/LOOP CALL left and TEMPO range to enter service mode, or flash the removal .UPD from the
  uninstall folder. The project says the .UPD is a patch that does not replace the stock application or
  reflash the system. Its developer notes say a shim that crashes the player application leaves the deck in
  a reboot loop that flashing the .UPD fixes, and the project asks users not to install it on a deck they
  rely on.
brick_risk: false
tags: [dj, qol, stems, sampler, themes]
