device: anbernic-rg35xx
name: Contour
kind: firmware
summary: >-
  Visual music tracker for H700 handhelds and Windows with sample and synth instruments, generative visuals and a planned device-to-device song sharing system, now in a first alpha.
description: >-
  Licence note: the repository holds no source and no licence statement, and the only release asset is a zip. The author says it is meant to be
  released for free, with optional paid sound packs later.

  Contour is a tracker with Song, Chain, Roll and Phrase views, sample instruments (single, sliced and kit) and a set of
  synthesizer engines that includes drum voices, an acid line and a Braids-based oscillator. A visual synthesizer driven by
  tracker events, an art canvas and a chord generator are described on the project site, with sharing between devices as a
  longer-term plan. The author tests on the Anbernic RG35XX Pro, RG35XX H and RG34XXSP and says other H700 models may
  work, and a Windows build is in development. The changelog calls the 0.0.1 alpha a proof of concept in which not every
  system is complete, and warns that song files may change before the beta and may not stay compatible. The site credits
  Mutable Instruments' Braids code and Freeverb.
