device: anbernic-rg35xx
name: Genvolve
summary: >-
  Eight-track generative MIDI step sequencer for the Anbernic RG40XX V on Knulli, written to drive an M-VAVE FM-1
  running Felucca over USB, with scale-aware pattern generators, slow pattern evolution, a piano roll and drum tracks.
description: >-
  Genvolve, called seq4h until November 2026, runs as a Knulli port on the RG40XX V and sends notes, MIDI clock and start and stop
  to a USB MIDI device. Eight tracks of up to 32 steps each have their own channel and length, and steps carry note, velocity, gate,
  probability, a micro-timing offset, held notes, ratchets, trig conditions and a lock. Tracks can be mono or polyphonic, with chords
  on a step, and drum tracks have an eight-lane drum grid and a drum map. Thirteen generators (Euclidean, random walk, Markov,
  logistic map, cellular automata, weighted, follow, arpeggio, Turing-style shift register, motif, drone, drift and
  bell) and a chord generator write into the step grid, and an evolve setting changes unlocked steps every 1 to 64 bars, with anchors that
  pull drifted steps back, density limits, swells and rests. Each track has eight pattern slots that
  can be chained or morphed into each other, and pages for harmony progressions, performance (mute, solo, density, fills), arranging
  scenes into songs, four LFOs driving MIDI CC destinations, and device presets for the FM-1, Digitone and Blackbox 2. The state is saved to a plain text file. Its defaults put tracks 1
  to 4 on MIDI channels 1 to 4, which match Felucca's CH1-4 input mode. It is inspired by SEQ-4 but shares no code
  with it. The folder's README says the engine and interface are tested on desktop Linux and that the Knulli build has been run on an
  RG40XX V driving an FM-1, while its state note still says nothing has run on the handheld; whether the handheld powers the FM-1
  over its single USB-C port is listed as unverified. The source, desktop binary and saved files keep the seq4h name. It lives in the
  sequencer folder of the SlowMorph repository, whose main project is a browser sample-morphing instrument. Commit messages credit
  Claude as a co-author.
