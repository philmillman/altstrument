device: anbernic-rg35xx
name: seq4h
summary: >-
  Four-track generative MIDI step sequencer for the Anbernic RG40XX V on Knulli, written to drive an M-VAVE FM-1
  running Felucca over USB, with scale-aware pattern generators and slow pattern evolution.
description: >-
  seq4h runs as a Knulli port on the RG40XX V and sends notes, MIDI clock and start and stop to a USB MIDI device.
  Four tracks of up to 32 steps each have their own channel and length, and steps carry note, velocity, gate,
  probability, a micro-timing offset, held notes and a lock. Thirteen generators (Euclidean, random walk, Markov,
  logistic map, cellular automata, weighted, follow, arpeggio, Turing-style shift register, motif, drone, drift and
  bell) write into the step grid, and an evolve setting changes unlocked steps every 1 to 64 bars, with anchors that
  pull drifted steps back, density limits, chord stacking, swells and rests. Each track has eight pattern slots that
  can be chained or morphed into each other, and the state is saved to a plain text file. Its defaults put tracks 1
  to 4 on MIDI channels 1 to 4, which match Felucca's CH1-4 input mode. It is inspired by SEQ-4 but shares no code
  with it. The status line of the folder's README says it has only been tested on desktop Linux, while its build
  and button-mapping sections report a first run on a Knulli RG40XX V driving an FM-1; whether the handheld powers
  the FM-1 over its single USB-C port is listed as unverified. It lives in the sequencer folder of the SlowMorph
  repository, whose main project is a browser sample-morphing instrument.
status: active
