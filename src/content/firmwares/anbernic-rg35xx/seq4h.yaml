distribution: source-only
requires_stock: Knulli
install_notes: >-
  Run sequencer/knulli/build.sh (it needs Docker) to cross-compile the aarch64 build, then unzip
  dist/seq4h-knulli-aarch64.zip into /userdata/roms/ports/ and refresh the game list. The zip adds SHOW-BUTTONS and
  USB-MIDI-CHECK helpers to the Ports menu. Connect the FM-1 to the handheld's USB-C port, set the FM-1's MIDI IN to
  CH1-4 and its clock source to USB. Nothing is flashed to the handheld.
brick_risk: false
tags: [sequencer, midi, generative]
