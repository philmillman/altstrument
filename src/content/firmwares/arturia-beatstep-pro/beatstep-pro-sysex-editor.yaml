device: arturia-beatstep-pro
name: BeatStep Pro SysEx Editor
kind: tool
summary: Browser app that changes the BeatStep Pro's global settings by SysEx over Web MIDI. It sets sync, metronome and CV options, the note and channel of each drum pad, and user scales, and has a console that logs and exports the SysEx messages.
description: >-
  Each change goes out as a single parameter message to the unit. The drum map editor sets a note and channel for each of
  the 16 pads, with presets such as General MIDI, chromatic runs and a Volca Sample layout that puts pads 1 to 10 on channels
  1 to 10. A user scale designer builds scales and sends them, and a console shows sent and received SysEx in hex, filters
  the log, injects raw bytes and saves a session as a .syx file. Number fields are validated before sending. It is a
  React and Vite app with a light and dark theme. The README says it was built with Google AI Studio, and the hosted page still carries
  that tool's default title.
status: active
