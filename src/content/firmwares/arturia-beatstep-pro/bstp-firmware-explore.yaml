    url: https://github.com/angellinares
source: https://github.com/angellinares/bstp_firmware_explore
source_status: open
license: unspecified
license_notes: The repository has no license file and its README states no license.
homepage: https://angellinares.github.io/bstp_firmware_explore/
distribution: patch-your-own
requires_stock: 2.0.1.6
install_notes: >-
  Back up all projects with MIDI Control Center first, and install Arturia's own 2.0.1.6 file once
  to confirm the way back works. Download BeatStepPro_Firmware_Update_2_0_1_6.led from Arturia,
  load it into the patch page, and install the modified file with MIDI Control Center like any
  update. If the unit does not start, hold PLAY, STOP and RECORD while switching it on to reach the
  updater. The author warns that a mod changes how patterns are stored and a fault could damage or
  erase them.
brick_risk: false
