device: arturia-beatstep-pro
name: BeatStep Pro custom firmware
summary: Browser patcher and tooling that adds per-step chance and conditions, drum ratchets and chord steps to your own BeatStep Pro 2.0.1.6 update file; the chord build has not run on a device yet.
description: >-
  A patch page builds a modified .led update file in the browser from the official 2.0.1.6 file
  you supply, and only offers a result that is byte for byte a build the author tested. The
  step chance and conditions mod lets a SEQ1, SEQ2 or DRUM step play with a set chance or on
  chosen passes, such as every second pass or only the first, saved with the pattern. DRUM steps
  can ratchet two, four or eight times inside the step. A separate chords mod adds up to four
  notes per SEQ1 or SEQ2 step and is not yet offered on the page. The author reports that
  version 1.4.7 of the chance mod runs on one unit and that other behaviours are checked in an
  emulator only. The repository also holds C patch sources, a .led pack and unpack tool, a
  Ghidra export helper and a one-off bootloader dump build. It contains no Arturia files. The
  superMIDI controller-mode patch is built with this tooling.
status: active
authors:
