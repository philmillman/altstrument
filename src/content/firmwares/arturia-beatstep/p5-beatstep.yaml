device: arturia-beatstep
name: p5.beatstep
kind: tool
summary: Small JavaScript library and sketches that read a BeatStep's 16 knobs and 16 pads through webmidi.js and use them to drive p5.js drawings and sounds. The README is copied from a Korg nanoKONTROL library and is not accurate. There is no hosted page.
description: >-
  p5.beatstep.js defines a BeatStep class with the controller's default knob and pad maps, smoothing of knob values over a
  window, and pad and encoder state, and the example sketches use it for a jittery grid, rain, motion, a simple sequencer and pad
  sound effects, with a few WAV drum samples. It listens to the controller and sends nothing to it. The README says the
  library listens for Korg nano controllers, which conflicts with the code. The last commit is from February 2024.
status: dormant
