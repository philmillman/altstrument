    url: https://github.com/hypergrace
source: https://github.com/hypergrace/p5.beatstep
source_status: open
license: Unlicense
license_notes: The repository also commits webmidi.js and a few WAV samples, which have their own terms.
distribution: source-only
install_notes: >-
  Clone the repository and open index.html in a Web MIDI browser with a BeatStep connected; webmidi.js is also loaded
  from a CDN in the example page.
brick_risk: false
