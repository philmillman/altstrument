device: arturia-beatstep
name: react-arturia-beatstep-web-midi
kind: tool
summary: Small React demo and hook that read the original BeatStep's pads and knobs through webmidi.js in the browser, plus a controller config file. A demo project from 2020 for building web pages controlled by a BeatStep; there is no hosted page.
description: >-
  The useArturia hook maps the unit's default pad notes and knob CCs to pad numbers 1 to 16 and knob numbers 1 to 16, and exposes
  usePadPress and useKnobTurn with optional callbacks and a step size. The example app shows pads 1, 2 and 9 and knobs 1 and 2
  reacting. A .beatstep controller configuration is included. The tool reads the controller only and sends nothing
  to it. The last commit is from December 2020.
