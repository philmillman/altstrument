license: MIT
license_notes: >-
  The project's own code and notes are MIT. The Synth CC catalogue in the page comes from the MIDI Guide and is
  CC BY-SA 4.0. Arturia's firmware is not included; the build needs the user's copy of the official 2.5.20 update.
homepage: https://canadianblaken.github.io/keystep-con/
distribution: patch-your-own
requires_stock: 2.5.20
install_notes: >-
  Back up the 16 projects first. Open the installer page, choose Arturia's keystep-pro_Firmware_Update_2.5.20.0.kspf
  (MIDI Control Center keeps a copy on the computer), and download the patched KSCON .kspf the page produces after
  checking that the input is the official 2.5.20 file. Flash it with MIDI Control Center like an official update, which
  may flag it as a downgrade from 2.5.99. To go back, flash Arturia's 2.5.20 file again. The editor page works in
  Chrome or Edge and also runs against a simulated device. The author lists each feature as checked on a real
  KeyStep Pro and says to use it at your own risk.
brick_risk: false
