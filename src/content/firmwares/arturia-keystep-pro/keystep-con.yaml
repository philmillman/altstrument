device: arturia-keystep-pro
name: KeyStep Con
summary: Patch for the KeyStep Pro's 2.5.20 firmware that adds a bass generator, drum and chord pads, root chords and project names, plus a browser project editor and playable manual.
description: >-
  KSCON (KeyStep Con) modifies Arturia's 2.5.20 firmware with hand-written Thumb-2 hooks. The patched firmware, which
  reports itself as 2.5.99, adds a Make bass button combination with five styles, drum lanes and scale chords played from the step
  buttons that can also drive the arpeggiator, with 64 chord pads shared across a project, a root-chord mode, key and step lights for pad notes, note and chord names on the screen, a
  mod strip lock, 16-character project names and a changed startup screen. A
  single HTML page edits the 16 projects over Web MIDI SysEx in place of MIDI Control Center, with piano-roll and
  drum-grid editors, MIDI file import and export, backups, 158 global settings and a simulated, playable KeyStep Pro
  that serves as a manual. A separate browser installer applies the patch to the user's own copy of Arturia's update
  file and checks the result against a known build; it carries only the changed bytes, not Arturia's firmware. The
  repository also holds notes on the SysEx protocol and storage layout and a list of bugs found in 2.5.20.
