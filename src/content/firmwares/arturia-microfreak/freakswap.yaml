device: arturia-microfreak
name: FreakSwap
summary: Browser tool that prepares a modified MicroFreak firmware file with a custom engine lineup, in which original synth engines are replaced by engines adapted from Mutable Instruments Plaits or by a 6-operator FM engine, applied to your own official 5.0.0.2084 file.
description: >-
  The page, now labelled FreakSwap 2.0 (a modular prototype), lets you pick which original
  engines to replace, from 11 replacement engines plus a 6-operator FM engine, with any of the
  22 engine slots as a target. A position can also be emptied, which makes it silent and frees
  space for the replacements. The 6-operator FM engine can import a compatible Yamaha DX7 bank
  in the browser and use selected presets. The page plays short dry digital reference
  previews of each engine; they are not recordings of the instrument. The engine modules are
  published with the page and applied in the browser to the firmware file you supply; the
  author states the official file is neither included nor uploaded, and that the result is
  installed with MIDI Control Center. Presets that use a replaced engine will sound different.
  Raster replaces the Sample engine with rhythmic slicing and repeats that follow
  the transport clock; its README calls it an independent implementation, not a port of the MiniFreak's Raster.
  A checkbox, on by default, adds an optional performance control to the generated firmware: double-tapping Shift
  holds it, and Shift with Hold then locks the arpeggio and frees the keyboard. Unchecking it produces the same
  engine firmware as before the option existed; the README says engine combinations still need testing on an instrument.
  The notice file says the engines are adapted from Mutable Instruments Plaits and stmlib code
  under the MIT licence, and that a GPL-2.0 Unicorn emulator, used only for checks in the
  browser, is not inserted into the firmware. The module data is published but no source for the
  adapted engines was found, so the source status is patcher-only.
status: active
authors:
