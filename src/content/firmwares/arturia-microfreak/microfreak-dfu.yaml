device: arturia-microfreak
kind: tool
name: microfreak-dfu
summary: Linux-friendly firmware updater for the MicroFreak, as a WebUSB page and a Python command-line tool that flash Arturia's own update package over USB DFU without MIDI Control Center.
description: >-
  Arturia's MIDI Control Center does not run under Wine, so this tool reproduces its update protocol: plain USB DFU 1.1
  plus three Arturia class requests, which the author reverse-engineered from the MIDI Control Center binary and wrote
  up in docs/protocol.md. The web page takes a .mff package dropped on it, compares its SHA-256 with the release it
  knows and writes it to the synth in a Chromium-family browser. The command-line tool lists the device, prints a plan
  for a package, flashes it in the same order as MIDI Control Center and can enter or leave DFU mode on its own. It
  writes only Arturia's package, which the user downloads from Arturia or takes from the macOS installer; the
  repository holds no firmware. The README says a full 5.0.0.2084 update succeeded from both the page and the command
  line on a real unit, and that Windows is out of scope.
status: active
authors:
- name: TaraTheStar
