source: https://github.com/TaraTheStar/microfreak-dfu
source_status: open
license: AGPL-3.0-only
license_notes: >-
  LICENSE is the AGPL version 3 text and the README says AGPL-3.0 with no later-version clause. The MicroFreak firmware
  itself is Arturia's and is not included.
homepage: https://tarathestar.github.io/microfreak-dfu/
distribution: browser-installer
install_notes: >-
  Download the .mff update package from Arturia, open the hosted page in Chrome, Edge, Brave or Chromium, drop the file
  on it and connect the synth, or run mf_dfu.py flash with pyusb and libusb. On Linux a udev rule for USB ID 1c75:0601
  is needed so the browser may open the device. The README says the bootloader stays in DFU mode if an update is
  interrupted, so the flash can be run again.
brick_risk: false
