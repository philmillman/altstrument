    url: https://github.com/francoisgeorgy
source: https://github.com/francoisgeorgy/microfreak-reader
source_status: open
license: unspecified
license_notes: The repository has no license file or license statement. It includes the preset data files of Arturia's factory banks and free packs.
homepage: https://homestudio.app/microfreak-reader/
distribution: browser-installer
install_notes: >-
  Open the hosted app in Chrome or Opera, connect the MicroFreak over USB or MIDI, select its input and output ports,
  enter a preset number and press READ. Restart the MicroFreak and reload the page if nothing is displayed.
brick_risk: false
