device: arturia-microfreak
name: MicroFreak Reader
kind: tool
summary: Read-only browser viewer for the MicroFreak's saved presets, built from reverse-engineered SysEx. It reads presets over Web MIDI and shows oscillator, filter, envelope, LFO and modulation matrix values. It cannot edit or write.
description: >-
  Rights warning: the app ships pre-loaded preset data in public/data for the factory banks 1.1 and 2.0 and for the free packs Arp
  Monster, Naughty Bass, Plaisir Pads and Tech Loop, which are other people's work.

  Reading one preset or ranges up to all 256 sends requests over MIDI, and the app displays each preset's controls, the modulation
  matrix and the preset name. Reads go to memory until the page is closed, and the loaded set can be saved to the app's own
  file, which is not a SysEx or preset file Arturia's software can use. It does not read sequences, the unsaved
  state of the panel or any factory preset in the newer format, which can be converted by saving it to a user slot on
  the synth. The author warns that the decoding came from reverse engineering the exchange with Arturia's MIDI Control Center and may
  be wrong. The README, which has a French section, says the project is no longer maintained and invites forks.
status: archived
authors:
