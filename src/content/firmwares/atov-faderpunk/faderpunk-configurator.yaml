device: atov-faderpunk
name: Faderpunk Configurator
kind: tool
summary: The maker's browser configurator for the Faderpunk. It sets the channel layout, app parameters, global settings and scenes, and installs community apps, over USB MIDI SysEx. It needs a Chromium browser.
description: >-
  The page shows the sixteen channels and lets you drag apps onto them, edit each app's parameters, and set global options for
  MIDI, I2C, clock and the quantizer. It also manages scenes and installs packaged community apps into the module's free slots.
  Nothing is flashed by this page; firmware updates are separate UF2 files. Earlier releases used WebUSB for the link, and
  releases from v1.11 use MIDI SysEx on named virtual ports. A beta build is hosted at a separate path.
status: active
authors:
  - name: ATOV
    url: https://github.com/ATOVproject
source: https://github.com/ATOVproject/faderpunk
source_status: open
license: GPL-3.0-only
license_notes: Shares the repository's LICENSE (GNU GPL version 3, no later-version clause). The configurator is built from the configurator folder of the firmware repository.
homepage: https://faderpunk.io/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or another Chromium browser, connect the Faderpunk over USB and allow MIDI access with SysEx. Firefox and Safari are not supported. Close other tabs that hold the module's MIDI ports.
brick_risk: false
tags: [official, editor, web-midi, sysex, usb-midi, presets, web]
