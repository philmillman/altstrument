device: axs-instruments-4-tme
name: 4-TME PolySynth firmware
kind: firmware
summary: >-
  The maker's open source firmware sketch for the 4-TME four-voice polysynth, written for the Daisy Seed with DaisyDuino, with the KiCad board files. The repository has no README or license file, and the web flasher entry carries a newer v16 build with a USB editor link.
description: >-
  The 4-tme-fw sketch is about 80 kB of Arduino code. The device page describes the synth, which the author says is based on the Vermona PERfourMER, and the web flasher repository holds the v15.6 sketch plus a patch for the v16 USB link.
  This repository's latest commit set up an MCP23017 I/O expander.
