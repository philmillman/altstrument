install_notes: >-
  Build src/dclk_midi_clock/dclk_midi_clock.ino in the Arduino IDE with STM32duino and the custom DCLK board entry, then upload with STM32CubeProgrammer by DFU or SWD. Most people will use the web flasher, which has a built release.
