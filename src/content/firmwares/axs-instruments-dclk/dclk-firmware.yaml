device: axs-instruments-dclk
name: DCLK firmware
kind: firmware
summary: >-
  The maker's open source firmware for the DCLK dual MIDI clock, an Arduino sketch for the STM32F411 Black Pill. It sends clock to two TRS outputs and USB with quantised start and stop, per-output dividers, a screen saver, saved settings and USB clock input.
description: >-
  Tempo runs from 30 to 300 BPM at 24 PPQN. Start waits for the next bar boundary of a set wait length of 1 to 16 bars, stop can be quantised the same way, and each output divides the clock by 1, 2, 3, 4, 6 or 8. The menus cover LEDs, MIDI and screen settings, a monitor and an about page.
  The README lists the build options, which need a custom board entry and an upload method without a bootloader offset, and the pin map.
