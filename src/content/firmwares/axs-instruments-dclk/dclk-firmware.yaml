device: axs-instruments-dclk
name: DCLK firmware
kind: firmware
summary: >-
  The maker's open source firmware for the DCLK dual MIDI clock, an Arduino sketch for the STM32F411 Black Pill. It sends clock to two TRS outputs, USB and two analogue sync outputs, with quantised start and stop, per-output dividers, saved settings and USB clock input.
description: >-
  Tempo runs from 30 to 300 BPM at 24 PPQN. Start waits for the next bar boundary of a set wait length of 1 to 16 bars, stop can be quantised the same way, and each output divides the clock by 1, 2, 3, 4, 6 or 8. The menus cover LEDs, MIDI and screen settings, a monitor and an about page.
  Version 1.4 reads the CH1, CH2 and Settings touch pads from a CAP1206 controller and reverses the encoder direction, and version 1.5 adds Settings > UPDATE, which restarts the unit into the STM32 ROM DFU bootloader, and a SysEx command that does the same for the web flasher. Version 1.6 adds two analogue sync outputs with a clock pulse on the tip and a run gate on the ring, 1.6.1 adds a SYNC menu that sets pulses per quarter note for each output, 1.6.2 shows a tab on the main screen for each channel while it plays, and 1.6.3 makes the beat bars and the BEAT LED follow the host clock.
  The README lists the build options, which need a custom board entry and an upload method without a bootloader offset, and the pin map.
