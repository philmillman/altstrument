device: axs-instruments-dclk
name: DCLK-Flasher
kind: tool
summary: >-
  Browser tools for the DCLK dual MIDI clock: a WebUSB DfuSe flasher for the STM32 ROM bootloader with a bundled v1.5 build, and a settings editor over Web MIDI SysEx that changes tempo, dividers, wait length and more live. Both pages have a demo mode.
description: >-
  The flasher has an Enter update mode button that sends a SysEx command to restart DCLK into the ROM bootloader without the BOOT0 and NRST pins, which needs firmware 1.5 or later; older firmware still needs the pin method. The editor needs firmware 1.3 or later, finds the unit by asking each MIDI port rather than by port name, polls the unit several times a second to follow panel changes, and can start and stop each output. The flasher leaves the last flash sector alone so saved settings survive an update. The repository has a simulated STM32 bootloader for its tests.
  It also bundles the WeAct Black Pill's HID bootloader image and MC8P MkII firmware files as test fixtures. Commit messages credit Claude as a co-author.
status: active
authors:
