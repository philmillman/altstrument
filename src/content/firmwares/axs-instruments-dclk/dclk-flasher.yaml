source: https://github.com/joebmz98/DCLK-Flasher
source_status: open
license: MIT
license_notes: The LICENSE file says MIT. The bundled dclk_midi_clock.ino.hex is the maker's own build.
homepage: https://joebmz98.github.io/DCLK-Flasher/
distribution: browser-installer
requires_stock: DCLK; the editor needs firmware v1.3 or later
install_notes: >-
  Open the hosted page in Chrome or Edge on a computer, connect DCLK with a USB-C data cable and press Enter update mode (firmware 1.5 or later), or on older firmware hold BOOT0, tap NRST and keep holding BOOT0 for about a second, then press Flash Firmware and choose STM32 BOOTLOADER. Windows needs a one-time WinUSB driver through Zadig.
brick_risk: false
