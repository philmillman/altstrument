device: axs-instruments-drm
name: DRM firmware
kind: firmware
summary: >-
  The maker's open source firmware for the DRM drum synthesizer, Arduino sketches for the Daisy Seed. They give a kick, snare, hi-hat and two FM voices with a pot per parameter, trigger LEDs and MIDI note input. A second sketch is the same size and named for an FM variant.
description: >-
  The kick has a sine and triangle oscillator with pitch and amplitude envelopes and a noise layer, the snare mixes a pitched oscillator with filtered noise, the hats use six oscillators, and the two FM voices each have carrier and modulator tuning, decay and modulation amount.
  Pots are read through two 16-channel multiplexers. The repository has no README. It also holds a KiCad project with Gerber files and logo images.
