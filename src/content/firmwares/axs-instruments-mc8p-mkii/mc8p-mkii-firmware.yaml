device: axs-instruments-mc8p-mkii
name: MC8P MkII firmware
kind: firmware
summary: >-
  The maker's open source firmware for the MC8P MkII MIDI controller, an Arduino sketch for the STM32F411 Black Pill. Each of the 8 pots sends up to 10 CC messages, with step and custom scenes, a temporary override with catch-up, display themes and, from v3.2, a web editor link.
description: >-
  The README gives the parts list, the pin map and the build steps for STM32duino, and settings are stored in a W25Q64 SPI flash. Version 3.2 added the SysEx link that the web editor uses. The repository also has KiCad files, photos and diagrams. It
  supersedes the maker's Teensy 4.0 design, which has its own repository.
