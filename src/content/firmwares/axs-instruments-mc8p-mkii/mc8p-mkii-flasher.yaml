distribution: browser-installer
requires_stock: MC8P MkII; the editor needs firmware v3.2 or later
install_notes: >-
  Open the hosted page in Chrome or Edge on a computer and connect the Black Pill with a USB-C data cable. Hold BOOT0, tap NRST and keep BOOT0 held for about a second to enter DFU mode, then choose Flash Firmware and STM32 BOOTLOADER. Windows needs a WinUSB driver through Zadig.
