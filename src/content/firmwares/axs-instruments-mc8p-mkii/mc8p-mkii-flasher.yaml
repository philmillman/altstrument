device: axs-instruments-mc8p-mkii
name: MC8P-MkII-Flasher
kind: tool
summary: >-
  Browser tools for the MC8P MkII: a WebUSB DfuSe flasher for the STM32 ROM bootloader with a bundled v3.2 build, and a knob-assignment editor over Web MIDI SysEx that edits each pot's messages, curves, scenes and display options and saves them to the unit. Both have a demo mode.
description: >-
  The editor needs firmware 3.2 or later. Each knob holds 1 to 10 messages with channel, CC number, curve (normal, inverted, log, inverse log) and output range, and a knob's list can be copied to another. Settings can also be backed up to JSON. Live edits reach the unit at once but are kept only after Save to MC8P.
  The firmware folder also holds the WeAct Black Pill's HID bootloader image. Commit messages credit Claude as a co-author.
