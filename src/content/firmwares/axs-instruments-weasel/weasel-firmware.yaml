device: axs-instruments-weasel
name: WEASEL firmware
kind: firmware
summary: >-
  The maker's open source firmware for the WEASEL west coast synth, an Arduino sketch for the Daisy Seed. It has a complex oscillator with wavefolder, a modulation oscillator, low pass gates, an envelope, a pulsar, random voltage, a five-step sequencer and a patch bay.
description: >-
  Version 1.0 reads 32 pots through two multiplexers and two button matrices. The README lists every pot function and button position, the MIDI implementation (notes trigger the sequencer, pulsar and random source and can set the oscillator pitch)
  and the Arduino setup with DaisyDuino. The repository also has KiCad files and design drawings. The README links the web flasher and editor, whose USB editor link (WeaselEditor.h) lives in the Weasel-Flasher repository, and has build options for the LED wiring and the sequencer step switches.
status: active
authors:
  - name: Joe Bowyer
    url: https://github.com/joebmz98
source: https://github.com/joebmz98/Weasel-West-Coast-Synthesiser
source_status: open
license: MIT
license_notes: The LICENSE file and README say MIT, Copyright (c) 2024 .axs instruments.
homepage: https://github.com/joebmz98/Weasel-West-Coast-Synthesiser
distribution: source-only
install_notes: >-
  Install DaisyDuino and the MIDI library in the Arduino IDE, open src/WEASEL_FW/WEASEL_FW.ino, select the Daisy Seed board and upload, or export the compiled binary and flash it with the web flasher.
brick_risk: false
tags: [official, open-source, synth-engine, sequencer, midi, daisy, lpg, platform]
