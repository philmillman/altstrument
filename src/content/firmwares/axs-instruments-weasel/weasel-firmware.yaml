device: axs-instruments-weasel
name: WEASEL firmware
kind: firmware
summary: >-
  The maker's open source firmware for the WEASEL west coast synth, an Arduino sketch for the Daisy Seed. It has a complex oscillator with wavefolder, a modulation oscillator, low pass gates, an envelope, a pulsar, random voltage, a five-step sequencer and a patch bay.
description: >-
  The README gives firmware 1.0, and the sketch in the repository reports 1.1.5. Since 1.1.1 it has gained panel memory that powers up with the last button modes, sequencer clock reporting to the web editor, a circuit model of the Buchla 292 low pass gate (1.1.2), buttons that act on release with a MIDI shift to choose which oscillators follow MIDI pitch (1.1.3), MIDI clock sync that counts ticks (1.1.4) and a USB port named WEASEL (1.1.5). It reads 32 pots through two multiplexers and two button matrices. The README lists every pot function and button position, the MIDI implementation (notes trigger the sequencer, pulsar and random source and can set the oscillator pitch)
  and the Arduino setup with DaisyDuino. The repository also has KiCad files and design drawings. The README links the web flasher and editor, whose USB editor link (WeaselEditor.h) lives in the Weasel-Flasher repository, and has build options for the LED wiring and the sequencer step switches.
