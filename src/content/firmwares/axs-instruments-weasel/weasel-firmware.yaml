device: axs-instruments-weasel
name: WEASEL firmware
kind: firmware
summary: >-
  The maker's open source firmware for the WEASEL west coast synth, an Arduino sketch for the Daisy Seed. It has a complex oscillator with wavefolder, a modulation oscillator, low pass gates, an envelope, a pulsar, random voltage, a five-step sequencer and a patch bay.
description: >-
  Version 0.1 reads 32 pots through two multiplexers and two button matrices. The README lists every pot function and button position, the MIDI implementation (notes trigger the sequencer, pulsar and random source and can set the oscillator pitch)
  and the Arduino setup with DaisyDuino. The repository also has KiCad files and design drawings. The web flasher repository holds a newer 0.2 source with a USB editor link.
status: active
