device: axs-instruments-weasel
name: WEASEL-Flasher
kind: tool
summary: >-
  Browser tools for the WEASEL synth: a WebUSB DfuSe flasher for the Daisy Seed, a MIDI settings page and a presets page over Web Serial and SysEx, all with a demo mode. Its firmware 0.2 adds the USB link; no release build is published yet, so it flashes a file you supply.
description: >-
  The settings page sets the MIDI receive channel and shows a MIDI monitor, and the presets page stores and recalls the panel's button modes, kept in the browser and exportable as JSON. The flasher is built on the MC8P flasher and handles the H750's 32 byte flash words. The
  repository holds the firmware 0.2 source with a patch against the 0.1 sketch and a fix for the complex oscillator waveform button. Its README says the full sketch has not been compiled for the Seed or tried on hardware yet. Commit messages credit Claude as a co-author.
status: active
