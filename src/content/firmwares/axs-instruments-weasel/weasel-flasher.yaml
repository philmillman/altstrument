device: axs-instruments-weasel
name: WEASEL-Flasher
kind: tool
summary: >-
  Browser tools for the WEASEL synth: a WebUSB DfuSe flasher for the Daisy Seed, a MIDI settings page and a presets page over Web Serial and SysEx, all with a demo mode. It offers a released v1.1.5 firmware build or a file you supply.
description: >-
  A Play page runs a port of the firmware 0.2 sound engine in the browser, with the Buchla 292 low pass gate model added in firmware 1.1.2. The settings page sets the MIDI receive channel and shows a MIDI monitor, and the presets page stores and recalls the panel's button modes and, from firmware 1.1.3, which oscillators follow MIDI pitch, kept in the browser and exportable as JSON. The flasher is built on the MC8P flasher and handles the H750's 32 byte flash words. The
  repository's firmware folder holds the released v1.1.5 build as a .hex file, with the source kept in the WEASEL repository. Commit messages credit Claude as a co-author.
status: active
authors:
  - name: Joe Bowyer
    url: https://github.com/joebmz98
source: https://github.com/joebmz98/Weasel-Flasher
source_status: open
license: unspecified
license_notes: No license file or statement in the repository.
homepage: https://joebmz98.github.io/Weasel-Flasher/
distribution: browser-installer
requires_stock: WEASEL running its own firmware; the settings and presets pages need firmware 1.0 or later
install_notes: >-
  Open the hosted page in Chrome or Edge on a computer and connect the Seed with a micro-USB data cable. Enter DFU mode by hand (hold BOOT, tap RESET, release BOOT) or from the page once 1.0 or later runs, then choose DFU in FS Mode, and pick the released build or your own file. Build the firmware yourself in the Arduino IDE with USB support set to CDC.
brick_risk: false
tags: [flasher, editor, web-midi, sysex, presets, web]
