license: unspecified
license_notes: No license file or statement in the repository.
homepage: https://joebmz98.github.io/Weasel-Flasher/
distribution: browser-installer
requires_stock: WEASEL running its own firmware; the settings and presets pages need firmware 0.2 or later
install_notes: >-
  Open the hosted page in Chrome or Edge on a computer and connect the Seed with a micro-USB data cable. Enter DFU mode by hand (hold BOOT, tap RESET, release BOOT) or from the page once 0.2 runs, then choose DFU in FS Mode. Build the firmware yourself in the Arduino IDE with USB support set to CDC.
brick_risk: false
