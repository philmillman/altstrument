homepage: https://bastl-instruments.com/instruments/kastle2-fx-wizard
distribution: source-only
requires_stock: Any Kastle 2 or Citadel
install_notes: >-
  Build with the repository's CMake toolchain (make fx-wizard in code/build, or the Nix shell) to get a .uf2. Hold
  SHIFT while powering on so the unit appears as a USB drive, then copy the .uf2 onto it. The RP2040 boots from ROM
  into that mode, so a bad build is replaced the same way; Bastl's official .uf2 files on its website put the unit back.
