device: bastl-instruments-kastle-2
also_devices: [bastl-instruments-citadel]
name: FX Wizard (official source)
summary: Bastl's own FX Wizard effects firmware for the Kastle 2 and Citadel, published with source in the kastle2 repository. It has nine time-based effects and takes custom rhythms through a file format.
description: >-
  The FX Wizard app in Bastl's kastle2 repository is the firmware sold on the FX Wizard version of the Kastle 2 and
  Citadel. It has nine time-based effects controlled by Time, Feedback and Amount, with a DJ-style low-pass and
  high-pass filter, an LFO and a pattern generator. The app folder documents a file format for loading custom rhythms,
  and Bastl's FX Wizard Chamber web app builds a firmware image with them. It uses the same framework as the other
  Kastle 2 apps, with its own app ID (0xB1). The repository README labels it experimental. Community variants such as
  Sungam's FX Wizard Plus for Citadel start from this code.
