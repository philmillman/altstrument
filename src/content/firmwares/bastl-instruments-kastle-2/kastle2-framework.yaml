device: bastl-instruments-kastle-2
also_devices: [bastl-instruments-citadel]
name: Kastle 2 framework (official source)
kind: tool
summary: Bastl's open C++ framework, toolchain and documentation for writing Kastle 2 and Citadel apps, with the FX Wizard and Wave Bard firmwares, schematics and a list of app IDs.
description: >-
  The kastle2 repository is the development base for the Kastle 2 family. It holds the C++ code for the RP2040
  hardware (audio, knobs, pins, MIDI, USB, calibration and test mode), a Nix shell and manual install guides, a coding
  style guide, a glossary with examples, generated code documentation, MIDI mappings and a script that scaffolds a
  new app. It also has the schematics and case outlines, and an app list that reserves ID ranges for official and
  community apps. Citadel runs the same builds as the Kastle 2. Bastl keeps the Alchemist app, the board layout and
  the full panel and case files closed.
