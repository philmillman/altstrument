    url: https://discord.com/invite/C4RXRjgYJ6
distribution: source-only
install_notes: >-
  Clone the repository, set up the toolchain with the Nix shell or the manual guide, and run make in code/build to build
  all apps, or make <app-name> for one. Copy the .uf2 to the unit while it is in its SHIFT-at-power-on USB drive mode.
  The RP2040 ROM provides that mode, so a bad build is replaced the same way.
brick_risk: false
