device: bastl-instruments-kastle-2
also_devices: [bastl-instruments-citadel]
name: Wave Bard (official source)
summary: Bastl's own Wave Bard sample player firmware for the Kastle 2 and Citadel, published with source in the kastle2 repository. The factory sample bank is all rights reserved.
description: >-
  Rights warning: the factory sample bank (SAMPLES.bin) in the repository is marked all rights reserved and may not be
  distributed commercially, alone or inside a custom firmware. Wave Bard is a sample player with Sample, Pitch and
  Length controls and a bank button, and by default holds six banks of eight samples. The app folder documents the
  packed format for samples, scales and rhythms, and Bastl's Wave Bard Sample Loader web app generates a new bank.
  Running make wave-bard builds the app alone, and make wave-bard-with-samples appends the sample bank to give the
  complete official image. The app ID is 0xB3.
status: active
