source_status: open
license: MIT
license_notes: >-
  The code is MIT (LICENSE). SAMPLES.bin, the factory samples by Oliver Torr for Bastl Instruments, is all rights
  reserved, and the README says it must not be commercially distributed as part of a custom firmware. Panel graphics
  and case artwork are also all rights reserved; schematics and documentation are CC BY SA 4.0. The sample bank is
  Bastl's own file in its own repository, so linking to the repository is not redistribution by this catalog.
homepage: https://bastl-instruments.com/instruments/kastle-2-wave-bard
distribution: source-only
requires_stock: Any Kastle 2 or Citadel
install_notes: >-
  Build with the repository's CMake toolchain, using make wave-bard-with-samples for the full image, then hold SHIFT
  while powering on so the unit appears as a USB drive and copy the .uf2 onto it. The RP2040 boots from ROM into that
  mode, so a bad build is replaced the same way; Bastl's official .uf2 files on its website put the unit back.
brick_risk: false
