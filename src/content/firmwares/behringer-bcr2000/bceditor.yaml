homepage: https://midiq.online/bceditor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or Opera, connect the controller by USB or through a DIN MIDI interface, choose the
  ports in Settings and press Connect. On Apple silicon Macs USB works in one direction only, so use DIN MIDI with the unit in
  an S mode, or see the site's BCDriver note. Back up the unit's presets before sending a bank. The editor does not trigger the
  unit's STORE, LEARN, EDIT or EXIT keys, which are hardware operations.
brick_risk: false
