device: behringer-bcr2000
also_devices: [behringer-bcf2000]
kind: tool
name: BCEditor
summary: Closed browser editor for the Behringer BCR2000 and BCF2000 from MidiQ. It shows the controller as a virtual panel, sets each encoder, button and fader's MIDI assignment, edits the BCL code, and sends banks to the unit over Web MIDI SysEx. Free to use with a paid Pro tier.
description: >-
  The page draws the BCR2000 or the BCF2000 and opens an editor for any element: MIDI type, channel, range, encoder mode,
  LED ring style, button behaviour and a custom SysEx template. A code view shows the raw BCL lines for the element and checks
  them as you type. Whole banks can be received from the unit, sent to it, or exchanged as BCL and SysEx files, and the global
  setup, which holds MIDI mode, receive channel and timing, can be edited and sent. A MIDI monitor and a community library of
  presets are included. No account is needed for local editing, while saving to the cloud and importing community presets use a
  free account, and the terms say Pro features need a one-time payment. The site also links a separate macOS driver fix called
  BCDriver, which corrects the BCR2000's USB descriptor on Apple silicon and needs a change to kernel extension signing in
  Recovery. That driver is not part of this entry. Nothing is flashed.
status: active
