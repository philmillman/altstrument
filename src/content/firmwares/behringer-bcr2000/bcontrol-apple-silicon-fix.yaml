device: behringer-bcr2000
also_devices: [behringer-bcf2000]
kind: firmware
name: B-Control Apple Silicon Fix
summary: Python patcher that corrects the USB bulk endpoint size in Behringer's official BCR2000 and BCF2000 1.10 firmware so USB MIDI input works on Apple silicon Macs.
description: >-
  On Apple silicon Macs the BCR2000 and BCF2000 send MIDI over USB but receive none, because the firmware's USB descriptor
  declares a bulk OUT packet size of 4 bytes, a value full-speed USB does not allow. The script reads Behringer's official
  1.10 SysEx update file for either model, checks its SHA-256, decodes it, changes the declared size from 4 to 8 in the four
  descriptor sets used by USB modes U-1 to U-4 and writes a new .syx file. It verifies that exactly four bytes changed. The
  device still reports firmware 1.10. The patched file cannot be sent over USB from an Apple silicon Mac, so the README
  flashes it with BC Manager over DIN MIDI in S-4 mode or from a computer where USB output already works. The README says
  the BCR2000 patch was tested on a real unit and a user confirmed the BCF2000 patch on one, and that the code and the README were generated
  with Claude Code. The firmware container code is a Python 3 port from the BCR2000-dev kit. No Behringer firmware is in
  the repository.
status: active
authors:
