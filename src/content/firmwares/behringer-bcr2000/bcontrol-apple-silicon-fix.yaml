  derives from bcfwconvert.py in BCR2000-dev.
distribution: patch-your-own
requires_stock: "1.10"
install_notes: >-
  Download Behringer's official bcf2000_1-10.zip, run patch_bc2000_usb.py on the .syx for your model, then send the
  -usbfix.syx file with BC Manager over DIN MIDI with the unit in S-4 mode (EDIT + STORE, turn encoder 1 to S-4). Switch
  back to a USB mode afterwards. Recovery: updates write only the OS area, so power on while holding STORE and LEARN to
  reach the bootloader's load mode, then send the original .syx through DIN MIDI IN; rescue mode does not work over USB.
brick_risk: false
tags: [patch, python, cli, usb-midi, macos, sysex]
