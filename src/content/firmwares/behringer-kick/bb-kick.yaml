device: behringer-kick
name: BB-KICK
summary: >-
  Announced independent firmware for the Behringer KICK, based on the BB1
  rhythm engine, with two drum machines, Dillo bass, tape echo and spring reverb.
description: >-
  Big Beat Studio is adapting its BB1 rhythm engine for the KICK. The project
  plans an offline drum-machine library based on the Drum Machines Have No Soul
  archive, with recordings and variations browsable on the unit. Beta
  registration is open on the project page.
status: announced
authors:
  - name: Big Beat Studio
homepage: https://github.com/TexasRADIO/bb-kick
source_status: closed
license: unspecified
install_notes: >-
  The project page accepts beta registrations. A KICK firmware download and
  installation instructions are not yet available.
tags: [drum-machine, sampler, sequencer, fx]
