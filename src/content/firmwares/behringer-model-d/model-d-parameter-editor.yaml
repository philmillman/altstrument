device: behringer-model-d
name: Model-D Parameter Editor
kind: tool
summary: Free, closed-source Web MIDI page from Bread and Butter Sounds that sends parameter SysEx to a Behringer Model D, with a menu of commands for multi trigger, pitch bend range, channel switches, priority and modulation curve.
description: >-
  A one-page hosted tool: pick the Model D MIDI port, choose a command and a value from the drop-down lists, then press
  Send Command. It needs Chrome or another browser with Web MIDI. The page carries a 2018 copyright notice for
  breadandbuttersounds.com, a PayPal donation button and no licence terms, and the files on the server date from February
  2018. It is a different page from the open-source Model D control app. Nothing is flashed.
status: unknown
authors:
  - name: Bread and Butter Sounds
    url: https://breadandbuttersounds.com/
source_status: closed
license: proprietary
license_notes: >-
  No licence terms are published. The page shows a 2018 copyright line for breadandbuttersounds.com and is free to use,
  with a donation button.
homepage: https://data.dynareg.se/breadandbutter/ModelD.html
distribution: browser-installer
install_notes: >-
  Open the page in a Web MIDI browser such as Chrome, connect the Model D over USB, choose its MIDI port, pick a command
  and value, then press Send Command.
brick_risk: false
tags: [editor, web-midi, sysex, midi, web]
