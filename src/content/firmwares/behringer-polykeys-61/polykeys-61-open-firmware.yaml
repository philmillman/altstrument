device: behringer-polykeys-61
name: Polykeys 61 open firmware (announced)
summary: Open firmware for Behringer's announced Polykeys 61 MIDI keyboard, which Behringer says is open source; no source, licence or release has been published.
description: >-
  Behringer announced the Polykeys 61 on 2026-11-01. Synth Anatomy reports that
  the post confirms the keyboard is open source, and the article says it is not
  yet clear which features the firmware includes. This entry rests on that report
  of Behringer's post. Behringer has not said where the firmware will be
  published, under which licence, or when, and the unit has no release date.
  Music Tribe has published open source repositories for other controllers, such
  as the BCR32 and AQ64L developer kits. Check Behringer's and Music Tribe's own
  channels before relying on any of it.
status: announced
authors:
