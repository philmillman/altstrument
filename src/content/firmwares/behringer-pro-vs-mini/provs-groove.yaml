    url: https://github.com/latepilot
source: https://github.com/latepilot/ProVS-Groove
source_status: open
license: AGPL-3.0-only
license_notes: >-
  The README names the AGPL-3.0 and the LICENSE file is the GNU AGPL version 3. The README says it is independent of
  Music Tribe, and no Behringer firmware is in the repository.
distribution: source-only
install_notes: >-
  No install route exists yet. The README says the firmware cannot be put on the hardware, because there is no safe,
  supported way to flash the PRO-VS MINI and the port to its microcontroller has not been written. Building gives the
  engine tests and a macOS simulator that needs clang and SDL2.
brick_risk: false
