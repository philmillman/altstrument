device: behringer-pro-vs-mini
kind: firmware
name: ProVS Groove
summary: Groovebox firmware for the PRO-VS MINI with four synth drum tracks, the vector synth and an acid bass under a 16-step p-lock sequencer, plus MIDI clock and SYNC; it runs only in a macOS simulator for now.
description: >-
  The repository holds a portable C++ engine and a desktop simulator of the panel. ProVS Groove has kick, snare, hat and
  percussion tracks, a five-voice vector synth with four oscillators per voice and a per-voice digital filter, and an acid
  bass line. The sequencer has 16 patterns of 16 steps, a length per track, and per-step accent, probability, ratchets and
  parameter locks. It also has swing, a ping-pong delay, Euclidean fills, random variation and clock handling for internal,
  MIDI and SYNC sources. A second firmware in the same repository, ProVS Acid, is a dedicated acid machine with a pattern
  generator. The README says the author wrote it with Claude and that it uses no factory firmware or decompiled code.
  The panel, screen and pin details come from photos of the board and are not confirmed on hardware.
status: active
authors:
