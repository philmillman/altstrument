device: behringer-td-3
kind: tool
name: Acid Injector
summary: Browser page that converts MIDI clips from the free STING Max for Live device into .seq pattern files for Behringer's SynthTribe and .syx dumps for the TD-3. It only reads and writes files; it does not connect to the synth.
description: >-
  The page reads a type 0 MIDI file with one track, such as a clip exported from STING, and works out the TD-3's step data from
  it: notes, accents from maximum-velocity notes, slides from overlapping notes, ties and a triplet mode. It then offers a .seq file that
  SynthTribe can send to the unit and a .syx file that any SysEx librarian or DAW can transmit. All processing is JavaScript in
  the page and no MIDI port or server is involved. The author points to 303patterns.com as a fuller TD-3 manager. Nothing is
  flashed.
status: dormant
authors:
