    url: https://github.com/echolevel
source: https://github.com/echolevel/Acid-Injector
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and the README does not state a licence.
homepage: https://echolevel.co.uk/Acid-Injector/
distribution: browser-installer
install_notes: >-
  Open the hosted page, choose a one-track MIDI file and download the .seq or .syx file. Send the .seq file with SynthTribe, or
  transmit the .syx file with a SysEx-capable librarian or DAW. Back up the unit's patterns first.
