distribution: source-only
requires_stock: TD-3-MO firmware 2.0.1 (tested); plain TD-3 expected to work
install_notes: >-
  Needs Python 3.12 or newer, ALSA and a USB connection to the synth. Clone the repository, create a virtual environment, run
  pip install -e . and start the program with td3mo serve, which opens a page on 127.0.0.1. No root access or udev rules are
  needed in a normal desktop session. The program writes patterns and settings but not firmware, so keep using SynthTribe for
  updates.
brick_risk: false
