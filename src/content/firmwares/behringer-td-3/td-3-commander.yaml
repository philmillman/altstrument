device: behringer-td-3
kind: tool
name: TD-3 Commander (td3mo)
summary: Linux pattern editor, librarian and generator for the Behringer TD-3-MO, expected to work on the plain TD-3 too. A local Python server shows a Windows 98 style desktop in the browser, and a command line covers backups and conversion. Firmware updates are left to SynthTribe.
description: >-
  The program talks to the synth over ALSA MIDI from a Python server bound to the local machine, so the browser needs no Web
  MIDI permission. It has a step grid for patterns, a host-side audition that plays the pattern through the synth without
  writing it, a generator with eight acid styles, a librarian for all 64 slots with backup and restore, and a settings page
  for channels, transpose, clock source and similar options. Patterns import and export as raw .syx, SynthTribe .seq and .sqs,
  JSON and text. The protocol notes were measured on the author's unit, which runs firmware 2.0.1, and the README reports two
  corrections to published notes. Every write is read back and compared, the first write of a session backs up the bank, and the
  command that includes firmware update mode is never sent. Nothing is flashed.
status: active
