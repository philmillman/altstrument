    url: https://github.com/hallvardkristiansen
source: https://github.com/hallvardkristiansen/Bela-pepper-drum-machine
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Copy drum_machine.scd into a SuperCollider project in the Bela IDE and run
  it. The README gives no further steps. A fresh image on the microSD card
  recovers a broken system.
brick_risk: false
tags: [supercollider, drum-machine, midi, eurorack]
