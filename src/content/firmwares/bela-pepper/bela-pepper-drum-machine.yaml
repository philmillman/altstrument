device: bela-pepper
name: Bela-pepper-drum-machine
summary: SuperCollider drum machine for Pepper. Four trigger inputs play drums, four CV inputs control a reverb, buttons switch instrument sets, and USB MIDI input is converted to CV and triggers.
description: >-
  The project is a single SuperCollider file, drum_machine.scd. Audio input
  passes through the reverb and is mixed with the drum voices. The MIDI
  mapping is set up for one specific keyboard layout. The author calls the
  code work in progress and messy.
status: dormant
authors:
