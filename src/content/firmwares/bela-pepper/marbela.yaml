device: bela-pepper
name: MARBela
summary: Pure Data attempt at a Marbles-style random clock and trigger generator for Pepper, with internal or external clock and rate and bias knobs. Unfinished.
description: >-
  The patch has an internal clock and a MIDI clock mode switched by a button,
  a rate knob, a bias knob that sets the coin-toss odds, and three random
  trigger outputs plus a plain clock output. The author's development notes
  in info.rtf list known bugs and planned features, and the README is a
  single sentence.
status: dormant
authors:
  - name: Lorenzo Minneci
    url: https://github.com/lorenzoPazuzu
source: https://github.com/lorenzoPazuzu/MARBela
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Copy the repository into ~/Bela/projects on the board and open it in the
  Bela IDE. A fresh image on the microSD card recovers a broken system.
brick_risk: false
tags: [pure-data, generative, cv, eurorack]
