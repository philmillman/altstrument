device: bela-pepper
name: pepper-chaurus
summary: Chorus effect for Pepper built from seven LFO-modulated oscillator voices, written as a Pure Data project. Knobs 1 to 7 set the amount of each voice and knob 8 sets the output level.
description: >-
  The effect takes a mono signal on the left input and returns it on the left
  output. The project is a Pure Data patch with a separate mixer subpatch and
  a Makefile.
status: active
authors:
  - name: Yoyodyne Research
    url: https://github.com/yoyodyne-research
source: https://github.com/yoyodyne-research/pepper-chaurus
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Clone the repository into ~/Bela/projects on the board and open it in the
  Bela IDE. A fresh image on the microSD card recovers a broken system.
brick_risk: false
tags: [pure-data, fx, chorus, eurorack]
versions:
