device: bela-pepper
name: Pimento
summary: Work-in-progress Euclidean rhythm gate sequencer for Pepper, written in C++. It has a master clock and one Euclidean gate output of up to eight steps, with more outputs planned.
description: >-
  The README says the project is not finished. Its checklist marks the single
  Euclidean gate output and the clock as done and lists rotation, a second
  sequence, tap tempo, clock division, gating of the audio inputs and fills
  from the digital inputs as open. The code splits the Euclidean pattern,
  button and LED handling into separate classes.
status: dormant
authors:
  - name: Cyrus Vahidi
    url: https://github.com/cyrusasfa
source: https://github.com/cyrusasfa/pimento
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Copy the repository into ~/Bela/projects on the board as a C++ project and
  build it from the Bela IDE. A fresh image on the microSD card recovers a
  broken system.
brick_risk: false
tags: [sequencer, euclidean, generative, eurorack]
