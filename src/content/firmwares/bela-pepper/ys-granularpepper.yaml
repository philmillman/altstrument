device: bela-pepper
name: ys.granularPepper
summary: Pure Data granular synthesis patches for Pepper that record from the audio input or load a random file from a sample folder on a button press.
description: >-
  The repository contains a main patch, a grain engine with mono and stereo
  grain voices, a recorder, a sound loader and helper patches for buttons and
  the LED bar, plus fourteen sample files. The author says the patches are
  barely documented and invites questions by email.
status: active
authors:
  - name: Yann Seznec
    url: https://github.com/yannseznec
source: https://github.com/yannseznec/ys.granularPepper
source_status: open
license: MIT
license_notes: LICENSE file is the MIT text, copyright 2025 Yann Seznec.
distribution: source-only
install_notes: >-
  Copy the repository into ~/Bela/projects on the board and open it in the
  Bela IDE. A fresh image on the microSD card recovers a broken system.
brick_risk: false
tags: [pure-data, granular, sampler, eurorack]
