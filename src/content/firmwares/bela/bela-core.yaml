source: https://github.com/BelaPlatform/Bela
source_status: open
license: LGPL-3.0-only
license_notes: >-
  The LICENSE file says the software is distributed under the "LGPL 3.0" and
  links the license text, with no later-version clause. The hardware designs
  are CC BY-SA 3.0, and libraries bundled as dependencies keep their own
  licenses, which the file lists.
homepage: https://bela.io
distribution: download
install_notes: >-
  The core and IDE are already on the microSD card (or eMMC on a Bela cape)
  flashed with a Bela image, so a first install means flashing the image.
  After that, open the IDE at http://bela.local, go to Settings, and use
  Check for Updates under Other System Functions. Editing the core code
  directly is described on learn.bela.io. A broken system is fixed by
  writing a fresh image to the card.
brick_risk: false
