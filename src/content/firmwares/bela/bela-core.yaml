device: bela
also_devices: [bela-pepper, bela-salt]
name: Bela core and IDE
kind: firmware
summary: The Bela C++ core, real-time audio and sensor engine, and browser IDE that ship inside the Bela images for the Bela cape, Bela Mini, Pepper and Salt.
description: >-
  The Bela repository holds the C++ core API, the PRU firmware that reads and
  writes analog and digital I/O on the AM335x boards, the browser IDE served
  from the board, example projects and the libraries that connect Pure Data
  (through libpd) and other languages to the core. Projects are written in
  C++, Pure Data, SuperCollider or Csound, with Faust and Pyo listed as
  experimental on learn.bela.io, and are compiled on the board from the IDE.
  On the original boards the core runs on a Xenomai real-time kernel.

  The repository has no tags or releases. The default branch, master, last
  changed in March 2025, while the dev branch has commits to October 2026.
  The core is not installed on its own: it comes inside the Bela images, and
  the IDE's Settings tab has a "Check for Updates" function that updates the
  system and IDE on the board. The Bela Gem guide on learn.bela.io describes
  that function.
status: active
authors:
