device: bela
name: Cloud Instrument
summary: SuperCollider synthesizer and effects chain driven by a MIDI controller and API.Cultor sound retrieval, with a Bela configuration for low-latency use; it also runs on a Raspberry Pi 3.
description: >-
  Targets Bela (the repository does not name a model) and also Raspberry Pi 3.
  No catalog device exists for the Raspberry Pi, so only the Bela side is
  described here. The instrument searches a sound
  database (Freesound by default) with music information retrieval
  descriptors through the API.Cultor service, then plays the results through a
  SuperCollider synth with granular playback, freeze, vibrato, pan, pitch
  shift, filters, delay and reverb. It is played from a custom MIDI controller
  made by Yaeltex, with an Open Stage Control interface for visual feedback.
  A python program runs the search side and needs a Freesound API key.


  The bela folder holds a SuperCollider server configuration that sets a
  small block size for low latency, a synth file and a script that connects
  MIDI. Extra hardware is the MIDI controller and, on the Raspberry Pi, a USB
  sound card. The Bela notes are short and the main code and install steps
  are written for desktop and Raspberry Pi systems, so expect to adapt them.
