install_notes: >-
  Follow INSTALL.md for dependencies and the README for the Freesound
  configuration; the Bela-specific SuperCollider settings are in the bela
  folder. The Bela system runs from a microSD card, so a bad install is undone
  by writing a fresh image to the card.
