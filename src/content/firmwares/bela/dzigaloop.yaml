device: bela
name: DzigaLoop
summary: Multi-track tape looper for Bela Mini built as a Pure Data patch that plays WAV loops from tables, aimed at ambient textures and soundscapes.
description: >-
  Targets Bela Mini. The repository contains the main Pure Data patch, a helper
  abstraction, six sample files and a settings file, with a PDF that
  accompanies the project. The patch reads the sample files into tables and
  plays them back as tape-style loops, with controls read from Bela's analog
  and digital inputs. The author's Hackster project page, linked as the
  homepage, has the write-up, and the hardware (knobs and buttons) is not
  described in the README, so check that page before building.
status: dormant
