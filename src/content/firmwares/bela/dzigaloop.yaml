source: https://github.com/francescoganassin/DzigaLoop
source_status: open
license: unspecified
license_notes: No LICENSE file.
homepage: https://www.hackster.io/francescoganassin/dzigaloop-3c6f63
distribution: source-only
install_notes: >-
  Copy the repository files into a new Pure Data project on the Bela Mini
  (through the Bela IDE or ~/Bela/projects) and run it. The Bela system runs
  from a microSD card, so a bad install is undone by writing a fresh image to
  the card.
brick_risk: false
