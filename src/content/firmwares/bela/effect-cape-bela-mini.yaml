license: CC-BY-NC-SA-4.0
license_notes: >-
  No LICENSE file. The README licence section names Attribution-NonCommercial-ShareAlike 4.0
  International but links to the CC BY-SA page, so the intended terms are
  ambiguous; the licence name was used. The licence is a Creative Commons one
  rather than a software licence.
distribution: source-only
install_notes: >-
  Needs the effect cape built from the KiCad files and parts list in the
  repository. Copy the Projects/Delay_Chain folder into a project on the Bela
  Mini (via the Bela IDE or ~/Bela/projects) and run it. The Bela system runs
  from a microSD card, so a bad install is undone by writing a fresh image to
  the card.
