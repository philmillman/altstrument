device: bela
name: Effect Cape for Bela Mini
summary: Guitar effects pedal for Bela Mini made of a custom cape (four rotary encoders, two footswitches, OLED, expression input) and a Pure Data framework, with a delay-chain example of scanner vibrato, tape delay, reverb and looper.
description: >-
  Targets Bela Mini. The repository holds KiCad files, a bill of materials and
  an assembly guide for a stompbox cape with four rotary encoders with
  switches, two footswitches, a bicolor LED, an OLED display, a mono audio
  input, two outputs, a headphone output, an expression pedal input and a DC
  power socket. The author says the PCB is not sold, so it has to be ordered
  from the board files. A laser-cut acrylic case design is included.


  The software side is a Pure Data framework with a custom render.cpp that
  reads the encoders, plus patches for the interface, LED, OLED and a
  phone or tablet GUI. The Delay_Chain project uses it for a Hammond scanner
  vibrato simulator, a tape delay, a Freeverb reverb and an overdubbing looper.
  Other effects can be built on the same framework.
status: dormant
