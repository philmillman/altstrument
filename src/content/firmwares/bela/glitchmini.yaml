source: https://github.com/stephaneworkspace/GlitchMini
source_status: open
license: unspecified
license_notes: No LICENSE file. The README only says the project is open source.
distribution: source-only
install_notes: >-
  Copy the repository files (render.cpp and headers) into a C++ project on the
  Bela Mini and run it from the Bela IDE, with the expander and buttons wired as
  in the PDF. The Bela system runs from a microSD card, so a bad install is
  undone by writing a fresh image to the card.
brick_risk: false
