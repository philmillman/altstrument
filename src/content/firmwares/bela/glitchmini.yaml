device: bela
name: GlitchMini
summary: Clock-driven glitch effect for Bela Mini with the Multichannel Expander in C++, giving stereo glitch outputs at 16th, 32nd, 64th and 128th note lengths from a PPQN 48 clock, for Eurorack use.
description: >-
  Targets Bela Mini together with the Multichannel Expander. A stereo input is
  captured and repeated in rhythm to an external clock at 48 pulses per quarter
  note on analog input 0, with a reset trigger on analog input 1. Each pair of
  outputs carries one subdivision, from the 16th to the 128th note. One button
  switches between frozen glitch patterns and another shuts the board down
  cleanly. Extra hardware is two mono mini jack inputs, two push buttons and an
  LED with a resistor; a wiring PDF is in the repository. The author warns to
  check input voltages, since excess voltage can damage the board.
status: dormant
