device: bela
name: REBUS
summary: Code for REBUS, an interactive instrument that senses hand and body movement in an electromagnetic field, played through Bela with C++ and Pure Data projects, a composition library and a Theremin-to-CV example.
description: >-
  Targets the Bela cape. REBUS is a gesture-controlled instrument and
  compositional tool developed by Eleonora Oreggia (xname) from a PhD at Queen
  Mary University of London and continued at Goldsmiths. Bela reads the field
  sensor on its analog inputs and the software turns the readings into sound.
  The repository holds a REBUS composition library for Bela, example and
  project folders (boids, dub terrain, loopera, spectrifier, stringthing,
  wobble and others), Pure Data patches and a Theremin-to-CV program that
  maps phase to pitch and gain to amplitude and sends a control voltage from
  analog output 0.


  Needs REBUS hardware. The USAGE file says a Bela with two loose wires on
  analog inputs 0 and 4 can stand in for a demo, and the library has a pin
  mode for a regular Bela. A lamp on analog output 1 is needed for the bulb
  controller. The author presents it as an instrument and as a controller,
  and a paper on it is cited in the README.
status: active
