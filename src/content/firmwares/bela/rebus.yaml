license: GPL-3.0-only
license_notes: LICENSE is GPLv3; no "or later" statement in the README, USAGE file or the headers that were checked.
homepage: https://xname.cc/rebus
distribution: source-only
install_notes: >-
  Install the REBUS library with make install in the libraries folder, which
  replaces ~/Bela/libraries/REBUS on the board, and reboot once so the IDE
  sees it. Examples install the same way, and the projects folder makes zips
  that are dragged into the Bela IDE as new projects. The README suggests
  backing up the SD card first. The Bela system runs from a microSD card, so a
  bad install is undone by writing a fresh image to the card.
