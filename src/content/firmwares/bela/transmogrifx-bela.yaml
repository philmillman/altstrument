license: Unlicense
license_notes: LICENSE file is the Unlicense; the README says the code is released to the public domain.
distribution: source-only
install_notes: >-
  Copy the src folder into a new project in the Bela IDE (or into
  ~/Bela/projects on the board), then build and run it there. The code is not
  meant to build outside the Bela core. The Bela system runs from a microSD
  card, so a bad install is undone by writing a fresh image to the card.
