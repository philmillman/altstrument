    url: https://github.com/donnerbono
source: https://github.com/donnerbono/varietybox
source_status: open
license: unspecified
license_notes: No LICENSE file.
distribution: source-only
install_notes: >-
  Wire the knobs and display as in the Fritzing diagram, set up the OLED screen
  following Bela's OLED guide, then copy the project files from belastuff and
  patches into projects on the board. The Bela system runs from a microSD
  card, so a bad install is undone by writing a fresh image to the card.
