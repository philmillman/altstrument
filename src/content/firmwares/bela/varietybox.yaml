device: bela
name: VarietyBox
summary: Desktop effects unit built around a Bela Mini in a small box, with knobs, an OLED display and a Pure Data switchboard patch that gives every effect patch the same controls.
description: >-
  Targets Bela Mini. The repository holds the author's modified OLED example
  code, a Pure Data switchboard patch that maps the knobs and display text,
  a Fritzing wiring diagram and example effect patches. The author describes
  it as a demonstration and not a finished product. Each effect patch then only
  needs its parameters connected to the knob values. The video shows patches
  made with Pure Data and some Faust, and one patch needs a compiled external.
  Extra hardware is a box, potentiometers and an I2C OLED display, wired as in
  the Fritzing diagram.
status: dormant
authors:
