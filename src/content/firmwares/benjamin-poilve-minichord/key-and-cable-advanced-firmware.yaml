device: benjamin-poilve-minichord
name: minichord advanced firmware (Key & Cable)
summary: Fork of the minichord firmware by The Key & Cable Company that adds a few hundred settings, among them sampled instruments, a drum machine, a looper, MIDI input, MPE output, historical and microtonal temperaments and support for its replacement harp plates.
description: >-
  The fork keeps every stock setting at the same SysEx address and adds its own above them. Its additions include
  sampled piano, pizzicato strings, choir, string quartet, vibraphone, bass, sitar and electric piano voices, modelled
  plucked string, reed piano and tonewheel organ voices, a drum machine with patterns and accompaniment styles, a
  tanpura drone, a looper started with a double tap, playing notes received over MIDI, MPE output, voice leading,
  temperaments including 19- and 31-note divisions, preset names and settings that stay locked across presets. A
  phone deck mode follows a song sent to the minichord over USB audio. Releases from 95 on add calibrations, hover
  sensing and automatic detection for the harp plates that Key & Cable sells, and
  release 114 adds a drum kit made from your own sound files and release 121 adds circuit-bend effects and a fifth
  harp plate, the bent board, and release 125 gives the Tesseract, Torus and Celtic Knot chord plates numbers of their own. The firmware reports version numbers from 10 up, which
  minictl and the Key & Cable minicontrol use to tell it from the stock firmware. The release notes describe it as
  unofficial and experimental and not endorsed by Benjamin Poilvé, and pull requests from the fork have been
  merged upstream.
status: active
authors:
  - name: Greg Miller (The Key & Cable Company)
    url: https://github.com/keyandcableco
source: https://github.com/keyandcableco/minichord/tree/advanced
source_status: open
license: BSD-3-Clause
license_notes: Inherits the upstream firmware LICENSE. The bundled sample data is not covered by it; lib/minichord_samples/LICENSE lists FluidR3_GM samples under CC BY 3.0 and Musyng Kite samples under CC BY-SA 3.0, and the tabla strokes are CC0.
homepage: https://github.com/keyandcableco/minichord/releases
distribution: download
install_notes: >-
  Back up all banks to a file in the Key & Cable minicontrol first, because switching between this firmware and the
  stock one formats the preset storage. Then flash minichord-advanced-firmware-<n>.hex from the release page with
  PJRC's Teensy Loader the same way as the stock firmware, pressing the button through the hole in the back with a
  pin, and restore the backup or reset all banks. From release 115 on, the firmware page in minicontrol's settings
  can install the newest release instead, without Teensy Loader. To go back, flash the upstream firmware.hex the
  same way.
brick_risk: false
tags: [fork, synth-engine, sampler, drum-machine, looper, mpe, microtonal, chords, midi, open-source, teensy]
versions:
  - version: firmware-125
    date: 2026-11-01
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-125
    notes: Gives the chord plates (Tesseract, Torus and Celtic Knot) plate numbers 6, 7 and 14 and turns the strip guard off for them. Upside down no longer reverses the harp on plates printed with their notes. Releases 123 and 124 were not published.
  - version: firmware-122
    date: 2026-10-29
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-122
    notes: Fixes the harp plate setting being reset to a previously fitted plate when a Lab game, the vocoder or the phone page hands the settings back.
  - version: firmware-121
    date: 2026-10-29
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-121
    notes: Adds circuit-bend effects (pitch drop, voltage starve, bitcrush, clock bend, stutter) on any plate, a fifth harp plate called the bent board, and new bank sets.
  - version: firmware-116
    date: 2026-10-26
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-116
    notes: Filters a second tine out of the low kalimba recordings and moves the loop points of some kalimba and marimba notes, so chords and held notes stay in tune. No settings change.
  - version: firmware-115
    date: 2026-10-25
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-115
    notes: Adds control command 11, which restarts the minichord into Teensy update mode so minicontrol can install firmware without Teensy Loader.
  - version: firmware-114
    date: 2026-10-23
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-114
    notes: Reads the Piano Glide harp plate and adds a drum kit built from your own sound files, sent from minicontrol or minictl. Also covers firmware 113, which had no release.
  - version: firmware-102
    date: 2026-10-23
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-102
    notes: With harp drums on, the harp volume knob sets how loud the drum hits are.
  - version: firmware-101
    date: 2026-10-23
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-101
    notes: Plays the drum pads harp plate (plate 13).
  - version: firmware-100
    date: 2026-10-21
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-100
    notes: Changing chords strikes the new chord once, and a slash chord no longer slips in on a fast change.
  - version: firmware-99
    date: 2026-10-21
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-99
    notes: Adds plate detect, which learns each harp plate, support for the zipper 24 and arcade wheel plates, and restores the classic chord button timing.
  - version: firmware-96
    date: 2026-10-16
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-96
    notes: Hover curves per harp plate, and a looper that keeps playing through a preset change.
  - version: firmware-95
    date: 2026-10-15
    url: https://github.com/keyandcableco/minichord/releases/tag/firmware-95
    notes: Adds the harp plate setting with a calibration for each Key & Cable plate.
