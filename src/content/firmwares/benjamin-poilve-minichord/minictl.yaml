device: benjamin-poilve-minichord
name: minictl
kind: tool
summary: Python command-line tool for the minichord that reads and sets parameters by name, backs up and restores banks, turns plain-language descriptions into presets, plays notes into it, records its USB audio and flashes firmware.
description: >-
  minictl uses the same SysEx protocol as minicontrol and detects whether the minichord runs the stock firmware or
  the Key & Cable advanced fork, offering 206 named settings on stock and the fork's extra settings on the fork.
  Commands cover reading and setting live parameters, loading and saving banks, backups in minicontrol's file
  format, preset share codes, a describer that builds a preset from words and an instruction parser ported line
  for line from the Key & Cable minicontrol, importing a twelve-note Scala tuning (fork firmware), MIDI and serial
  monitoring, recording the USB audio to a WAV file, and flashing a .hex through PJRC's teensy_post_compile.
  Commands that write to the instrument's memory ask for confirmation first. Its tests run against a simulated
  minichord on virtual MIDI ports.
status: active
authors:
