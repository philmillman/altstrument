    url: https://github.com/keyandcableco
source: https://github.com/keyandcableco/minictl
source_status: open
license: BSD-3-Clause
license_notes: The LICENSE file carries the minichord firmware's BSD 3-clause text with Benjamin Poilvé's 2024 copyright and a 2026 Key and Cable line, since the tool bundles data and code from the firmware.
homepage: https://github.com/keyandcableco/minictl
install_notes: >-
  Install with pip from the Git repository (the README gives the command, with an [all] extra that adds pyserial
  and sounddevice for monitoring and recording). Needs Python 3.9 or later on Linux, macOS or Windows. Flashing
  needs PJRC's Teensy tools from PlatformIO or the Arduino IDE, and on Linux it refuses to flash on kernel
  6.1.0-53.
