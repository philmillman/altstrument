device: blokas-midiboy
name: bytebeats
summary: Bytebeat sketch for the Midiboy and Arduboy that plays one-line formula music on the speaker, with twelve formulas in three banks and tempo control.
description: >-
  Each direction button selects a formula, and holding A or B while choosing switches to another bank of four. A and
  B on their own raise and lower the tempo, and holding a button shows the formula on screen.
status: dormant
authors:
