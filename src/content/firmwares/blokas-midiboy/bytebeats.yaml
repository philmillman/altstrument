    url: https://github.com/poetaster
source: https://github.com/poetaster/bytebeats
source_status: open
license: Apache-2.0
distribution: source-only
install_notes: >-
  Build and upload bytebeats.ino from the Arduino IDE with the Blokas board package, after holding B while switching
  the Midiboy on to enter the bootloader.
brick_risk: false
tags: [generative, chiptune, arduino]
