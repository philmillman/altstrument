device: blokas-midiboy
name: lunamidiboy
summary: Square-wave tone sequencer sketch modelled on the Lunamod, playing a 64-step loop of pitch and duration on the piezo speaker, with live recording of changes.
description: >-
  The sketch loops 64 steps, each with its own frequency and duration, as a pulse wave. Up and down change the
  pitch, and left and right change the duration. Holding B records pitch changes into the steps as they play, and
  holding A records duration changes. The screen shows a rough animation of the current values. It is based on the
  lunaMod45 remix code and also runs on the Arduboy.
status: dormant
