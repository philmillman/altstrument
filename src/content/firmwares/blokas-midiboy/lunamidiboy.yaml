source: https://github.com/poetaster/lunamidiboy
source_status: open
license: unspecified
license_notes: The repository has no license file or license statement.
distribution: source-only
install_notes: >-
  Build and upload lunamidiboy.ino from the Arduino IDE with the Blokas board package, after holding B while
  switching the Midiboy on to enter the bootloader.
brick_risk: false
