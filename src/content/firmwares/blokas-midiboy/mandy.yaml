device: blokas-midiboy
name: Mandy
summary: Experimental MIDI chord sequencer sketch that spreads three-note chords across tracks with their own patterns, lengths and tempo dividers, routed to several MIDI channels.
description: >-
  Chords are programmed in a step sequencer and their notes are assigned to tracks automatically. Each track plays
  its notes with its own pattern, note length and tempo divider, partly at random, and can be routed to a fixed or
  random MIDI channel to drive several mono synths at once. Mandy follows external MIDI clock, start and stop, and
  can take a note offset from MIDI input.
status: dormant
