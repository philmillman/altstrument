    url: https://github.com/ulmert
source: https://github.com/ulmert/mandy
source_status: open
license: BSD-3-Clause
distribution: source-only
install_notes: >-
  Build and upload mandy.ino from the Arduino IDE with the Blokas board package, after holding B while switching the
  Midiboy on to enter the bootloader.
brick_risk: false
