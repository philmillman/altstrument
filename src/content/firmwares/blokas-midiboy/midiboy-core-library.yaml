device: blokas-midiboy
name: Midiboy Core Library
kind: tool
summary: Official Arduino library for writing Midiboy sketches, with drivers for the screen, buttons, speaker and DIN MIDI ports.
description: >-
  The library is what Midiboy sketches include to reach the hardware: the OLED display, the six buttons, the piezo
  speaker and the serial DIN MIDI ports. Blokas's own sketches and most community sketches build on it, together with
  the Blokas board package for the Arduino IDE and the USBMIDI library for MIDI over USB.
status: dormant
authors:
  - name: Blokas
    url: https://github.com/BlokasLabs
source: https://github.com/BlokasLabs/Midiboy
source_status: open
license: GPL-2.0-only
license_notes: Source headers grant GPL version 2 only, with no "or later" wording.
homepage: https://blokas.io/midiboy/
distribution: source-only
install_notes: >-
  Installed with the Blokas board package through the Arduino IDE Boards Manager, using the package index URL given in
  the Midiboy software guide on blokas.io.
brick_risk: false
tags: [official, sdk, library, arduino]
versions:
