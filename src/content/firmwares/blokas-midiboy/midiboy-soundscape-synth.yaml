homepage: https://patchstorage.com/midiboy-soundscape-synth/
distribution: download
install_notes: >-
  Download the prebuilt .hex from Patchstorage, hold B while switching the Midiboy on, connect it over USB and write
  the file with avrdude using the usbasp programmer. Building from source is described in the repository's
  development notes.
