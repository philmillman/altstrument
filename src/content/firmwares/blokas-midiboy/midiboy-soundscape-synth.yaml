device: blokas-midiboy
name: Midiboy Soundscape Synth
summary: Generative ambient synth sketch that makes 8-bit audio on the ATmega328P and sends it out of the MIDI OUT socket, with a drifting pad, wind, chimes and an echo.
description: >-
  The Midiboy has no audio output, so this sketch generates audio at about 15.6 kHz and drives it out of the MIDI OUT
  socket, which connects to a line input through a DIN-to-jack adapter. On power-up it plays a pad that changes
  chords on its own, wind noise and chimes with an echo. Eight scales and settings for density, drift, tone, wind,
  echo and level are on the screen, A starts a new random scene and B holds the current chord. A melody mode loops a
  tune on the bells, and a script in the repository converts a MIDI file into a melody for a custom build. It does
  not respond to MIDI input, and settings are not saved.
status: active
