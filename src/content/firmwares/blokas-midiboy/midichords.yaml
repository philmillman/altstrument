device: blokas-midiboy
name: midichords
summary: Official Blokas sketch that turns each incoming note into a chord of up to five notes and sends it to both the USB and DIN MIDI outputs.
description: >-
  Notes arriving over USB or DIN MIDI are expanded into chords built from the configured intervals, and note-off
  messages release the whole chord. The output goes to both ports. One configuration can be stored in memory with A
  and recalled with B.
status: dormant
