homepage: https://patchstorage.com/midichords/
distribution: source-only
install_notes: >-
  Install the Blokas board package (1.0.5 or later) in the Arduino IDE, select Midiboy as the board and USBasp as the
  programmer, hold B while switching the Midiboy on, then upload the sketch.
brick_risk: false
