device: blokas-midiboy
name: Orac Controller
summary: Official Blokas sketch that makes the Midiboy a screen and button interface for the Orac modular synth running on a Raspberry Pi, through a bridge script on the Pi.
description: >-
  The sketch pairs with a Python bridge that runs on the Raspberry Pi next to Orac and MEC, TheTechnobear's
  modular environment. With the Midiboy plugged into the Pi over USB, the screen lists Orac's modules and their
  parameters. The direction buttons move through modules and parameter pages, A selects a parameter for editing,
  and B switches between the module menu and the parameter screen.
status: dormant
authors:
