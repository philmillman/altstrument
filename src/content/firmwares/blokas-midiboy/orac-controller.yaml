    url: https://github.com/BlokasLabs
source: https://github.com/BlokasLabs/orac-controller
source_status: open
license: GPL-2.0-only
license_notes: Source headers grant GPL version 2 only, with no "or later" wording.
homepage: https://patchstorage.com/orac-controller/
distribution: source-only
install_notes: >-
  Upload orac-controller.ino to the Midiboy from the Arduino IDE with the Blokas board package (1.0.2 or later), then
  run install.sh from the repository on the Raspberry Pi to install the bridge. Orac and MEC must be running on the Pi.
brick_risk: false
