device: blokas-midiboy
name: Polly
summary: MIDI proxy sketch that lets a Korg Volca Sample 2 play polyphonically and multitimbrally from a MIDI keyboard, with up to nine channels split, layered or grouped.
description: >-
  Polly sits between a keyboard and a Volca Sample 2 set to multi-channel mode and spreads incoming notes across the
  Volca's sample parts. Each of the nine channels has its own listen channel, key range, note offset, note stealing,
  velocity handling and release time, and can map sample selection, lo-cut, pan and reverb to controls. The author
  notes an occasional click when more than six or seven channels are active.
status: dormant
