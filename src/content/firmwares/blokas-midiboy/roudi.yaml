homepage: https://patchstorage.com/roudi/
distribution: source-only
install_notes: >-
  Build and upload Roudi.ino from the Arduino IDE with the Blokas board package, after holding B while switching the
  Midiboy on to enter the bootloader.
brick_risk: false
tags: [midi, router, utility, arduino]
