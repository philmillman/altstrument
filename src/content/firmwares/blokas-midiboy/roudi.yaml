device: blokas-midiboy
name: Roudi
summary: DIN MIDI router sketch for using a keyboard with weak MIDI features as a master keyboard, with named channels, splits and layers, filters, velocity curves and a MIDI monitor.
description: >-
  Roudi was written to drive other instruments from a digital piano without a computer in between. It switches the
  output channel and lets you name channels, sets up splits and layers, filters out unwanted message types, maps pitch
  bend to channel aftertouch and applies an editable velocity curve. A monitor page shows incoming messages, and
  settings are saved automatically. It works with DIN MIDI only, and it fills most of the program memory.
status: dormant
authors:
