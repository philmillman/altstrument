device: blokas-midiboy
name: Stepollo
summary: Multi-track MIDI step sequencer sketch with per-step lengths, loops and conditional triggers, and a song mode, fitted into the ATmega328P's 2 kB of RAM.
description: >-
  Stepollo has a grid view for editing steps and a track and song view for arranging. Steps can be muted, inserted,
  deleted and given their own length, and conditions decide when a step fires. Because RAM is small, the number of
  tracks and steps is set at build time in fixed pairs, from 3 tracks of 64 steps to 12 tracks of 16 steps.
status: dormant
