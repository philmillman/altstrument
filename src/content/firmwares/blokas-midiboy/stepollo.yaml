    url: https://github.com/ulmert
source: https://github.com/ulmert/stepollo
source_status: open
license: GPL-2.0-only
license_notes: Source headers grant GPL version 2 only, with no "or later" wording.
homepage: https://patchstorage.com/stepollo/
distribution: source-only
install_notes: >-
  Build and upload stepollo.ino from the Arduino IDE with the Blokas board package, after holding B while switching
  the Midiboy on to enter the bootloader.
brick_risk: false
