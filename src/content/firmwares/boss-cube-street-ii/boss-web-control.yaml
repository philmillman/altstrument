device: boss-cube-street-ii
kind: tool
name: Boss Cube Web Control
summary: Progressive web app that controls a Boss CUBE Street II over Web Bluetooth with its SysEx parameters. It has mixer, effects, looper and tuner pages, reads values back from the amp, runs a live performance mode and can drive any parameter from an EV-1-WL expression pedal.
description: >-
  The page connects to the amp's Bluetooth MIDI service and sends Roland SysEx messages whose addresses come from the author's
  street-cube-II-sysex notes. It has sliders for the mixer, the guitar and mic effects, the shared reverb, looper
  controls and settings, a visual tuner and a SysEx discovery dashboard. It follows changes made on the amp. It can also connect to an EV-1-WL
  expression pedal at the same time and map the pedal and its footswitches to chosen parameters, with a pickup mode that holds a value until the
  pedal catches up. A live performance mode keeps custom control layouts for songs. The app installs as a PWA and works offline. The README
  presents it as an alternative to Boss's own editor and says the project is not tied to Boss. Nothing is flashed.
status: active
authors:
  - name: Petr Dlouhý
    url: https://github.com/PetrDlouhy
source: https://github.com/PetrDlouhy/boss-web-control
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file. The README's licence section says only that it is an open-source project for educational and practical use and asks users to keep volume at safe levels, which is not a licence grant.
homepage: https://petrdlouhy.github.io/boss-web-control/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or Opera, which have Web Bluetooth, and put the amp in Bluetooth pairing mode with a
  flashing LED. The amp must not be paired in the system's Bluetooth settings. The amp needs the optional BT-DUAL adaptor for Bluetooth MIDI.
  Put the EV-1-WL pedal in pairing mode too if you use it. Keep the volume low when testing new controls.
brick_risk: false
tags: [controller, editor, bluetooth, sysex, midi, performance, web]
