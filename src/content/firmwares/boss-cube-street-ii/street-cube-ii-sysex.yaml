device: boss-cube-street-ii
kind: tool
name: CUBE Street II SysEx Reference
summary: Documentation of the CUBE Street II's Roland SysEx address map, with a Python script that drives the amp from a BLE MIDI foot pedal. It also covers the BLE MIDI framing, the tuner data format and how the address map was found.
description: >-
  Rights warning: the README says the address map is based on a file that Roland's CUBE Street II Editor Android app
  ships, so the parameter table comes from Roland's own data.

  The README is a long reference of the message format, the addresses for system setup, mic and guitar effects,
  reverb, mixer, panel controls, looper status, tuner and system commands, the BLE MIDI framing that generic sender apps get wrong, and the tuner
  data format, with notes on extracting the map from the editor app and capturing Bluetooth traffic. The separate script,
  pedal_control_ble.py, is an abandoned Linux prototype that uses gatttool and mido to send those messages when an EV-1-WL pedal
  moves. The author replaced it with the Boss Cube Web Control app. Nothing is flashed.
