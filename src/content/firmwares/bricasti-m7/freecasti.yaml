device: bricasti-m7
kind: tool
name: Freecasti
summary: Browser editor for Bricasti M7 program and system SysEx dumps, together with an unofficial byte-level specification of both formats. It edits the 18 sound parameters, loads 222 factory presets and can talk to the unit over Web MIDI.
description: >-
  Rights warning: the repository holds hundreds of .syx dumps captured from a hardware M7, including 222 factory presets, and a
  preset sheet parsed from Bricasti's published PDF.

  The specification describes the 157-byte program dump and the 77-byte system dump, with the frame, a CRC-16 checksum, the name,
  bank and slot fields and the encoding of each parameter, checked against 452 captured dumps and written out as Kaitai
  and JSON schemas. A Python toolchain decodes, rebuilds and analyses dumps. The static web editor shows the parameters with
  tooltips, serializes dumps live, loads presets and system settings, and sends them over Web MIDI, which is off until you
  enable it. Nothing is flashed.
status: active
authors:
