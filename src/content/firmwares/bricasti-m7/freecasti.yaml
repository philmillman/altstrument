homepage: https://codebrain.github.io/freecasti/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a Web MIDI browser. Web MIDI is off by default in the editor, so enable it, then choose the MIDI ports
  and hold PROG, EDIT or SYSTEM on the M7 to send a dump. The specification tools need Python 3.11 and the web UI build
  needs Node 20 and Java or kaitai-struct-compiler.
