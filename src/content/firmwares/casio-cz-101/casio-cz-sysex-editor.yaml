device: casio-cz-101
name: CZ SysEx Editor
kind: tool
summary: Small browser sound editor for Casio CZ synths that sends the sound over Web MIDI SysEx as sliders move. It has controls for the two DCO, DCW and DCA lines, the modulation mode, the wave choices, the envelopes and randomizers. The interface is in Spanish.
description: >-
  Rights warning: the repository contains sysex_definition.txt, a copy of an old text document on the CZ-101, CZ-1000 and CZ-5000
  SysEx format, and a cert.pem and key.pem pair that were committed, which are not covered by the MIT licence.

  The page asks for MIDI access with SysEx, and every change to a slider, switch or wave choice builds a CZ tone message and
  sends it to the selected output. It offers per-line randomize buttons and envelope editing with up to eight steps. It is a
  single static page with two scripts and no build step. Nothing is flashed.
status: dormant
