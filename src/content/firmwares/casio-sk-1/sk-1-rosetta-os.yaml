device: casio-sk-1
name: SK-1 Rosetta OS
summary: Replaces the SK-1's preset sound ROM with an EEPROM image built from your own WAV files or Roland and Akai sample CDs, with custom loop points, using the SK-1 Studio app.
description: >-
  The SK-1's external ROM holds data only (tones, envelopes, rhythms and the five PCM presets), while its program lives inside the CPU. SK-1 Studio fills the
  five preset slots from a WAV file, a Roland S-760 or S-770 CD image, or an Akai S1000 or S3000 CD image, pitches each to its slot, reverses it if asked, and edits a
  loop on a waveform. One slot can loop, and a single long sound of about 3 seconds can fill every preset. Output is a 64 KB image for a W27C512 EEPROM or a 512 KB
  image for an SST39SF040, and the app can burn the W27C512 through minipro. The stock drum kit is kept. The README reports a W27C512 in the ROM socket working on a real
  SK-1, and says the sampler's own 1.4 second limit is unchanged. The author credits Claude, an AI assistant, with the code. The same changes apply to the Radio Shack Concertmate-500.
