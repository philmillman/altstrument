license: unspecified
license_notes: The repository has no licence file and its README and release notes carry no licence statement. The README says Casio's ROM is not included.
homepage: https://yuyoi.github.io/Casio-Sk1-Rosetta-OS/
distribution: patch-your-own
install_notes: >-
  Desolder the preset ROM (LSI2, a 28-pin chip beside the two RAM chips), fit a socket and read the chip first with a programmer; the README lists the expected CRC32 of a good dump.
  Build an image in SK-1 Studio (Windows, Python 3.10 or later) and burn it to a W27C512 outside the board, since it needs a programming voltage the board grounds. Keep the original chip; fitting it
  again returns the keyboard to stock. A 512 KB SST39SF040 can be seated in the socket with a few wire links described in the README.
