device: chase-bliss-chompi
name: CIRCLES
summary: Firmware that turns the CHOMPI into an ensemble of up to fifteen mallet-instrument players that loop short figures at their own lengths, in the manner of In C, with a guided web tutorial.
description: >-
  Each of the fifteen players has one of fourteen mallet and percussion
  instruments on the white keys: wood, marimba, amadinda, gangsa, mbira, kora, a
  snare bar and a muffled voice for rhythm, and vibes, bell, hang, singing bowl,
  gong and glass for melodies. The player plays a short figure and presses loop,
  and that player repeats it. A figure can be copied to other players, and each
  player can be given its own length as a ratio of the shared beat, from one
  third to three, so that its copy drifts against the others. Knobs K1 to K4
  shape each player, K6 sets the room and volume, and with the switch on all the
  knobs and black keys act on every player. Holding K6 shows the voice count and
  load. A tutorial page with six lessons talks to the CHOMPI over USB MIDI in
  Chrome or Edge and runs as a demo without one. The release notes say that long
  overlapping notes can use up the CPU, in which case the quietest voices drop
  first. The author states it was written with Claude and tested on one unit.
