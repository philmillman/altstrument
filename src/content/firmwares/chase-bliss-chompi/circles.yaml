install_notes: >-
  With multi-firmware launcher 1.1 or later, send CHOMPI_CIRCLES_beta_1.bin to a
  free key from the setup page. On a stock card, put it in the card root as the
  only .bin. The release is marked beta and the release notes list the SHA-256
  of the file.
