    url: https://github.com/ZUHcYa
source: https://github.com/sfaber02/CHOMPI-MULTI-FIRMWARE
source_status: open
license: MIT
license_notes: >-
  The LICENSE file names CHOMPI Club as copyright holder; the CHOMPI name and
  marks are not covered, see TRADEMARKS.md. The card image includes CHOMPI Club's
  own TAPE, TEMPO and WAVE builds, which that company publishes under MIT.
distribution: download
requires_stock: TAPE 2.0
install_notes: >-
  Format a card as FAT32 (32 GB or smaller), copy the contents of the release's
  card folder to the root and power on; the bootloader installs the launcher on
  first boot. Units already on launcher 1.1 or later can be updated from the
  setup page or by copying the new CHOMPI.bin. Back up an existing card first.
  Putting a stock card back returns the unit to normal. The firmware at the card
  root must be the only .bin there.
brick_risk: false
tags: [launcher, loader, flasher, usb-midi, os, usb-audio, platform]
