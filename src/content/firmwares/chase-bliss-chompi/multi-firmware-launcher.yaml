device: chase-bliss-chompi
name: CHOMPI Multi-Firmware Launcher
summary: Launcher firmware that keeps several CHOMPI firmwares on one SD card, lights one key per firmware in its own colour, and installs new firmware over USB MIDI; the card image also includes USB storage mode.
description: >-
  The launcher is the only .bin in the card root. At power-on it lights a key for
  each file in the FIRMWARE folder, and pressing a key starts that firmware;
  switching the unit off and on returns to the picker. To let the stock TAPE,
  TEMPO and WAVE firmwares share a card, they were patched to keep their samples
  and settings in their own folders. The card image also carries a USB storage
  firmware that makes the SD card appear as a drive. Later releases add firmware
  installation over USB MIDI, a setup page that writes a whole card from a
  computer, per-key colours and pages of firmware slots. The README says nothing is written to the
  processor's internal flash and that the Daisy's ROM DFU mode can recover a
  unit. The project credits several contributors and is unofficial.
status: active
authors:
