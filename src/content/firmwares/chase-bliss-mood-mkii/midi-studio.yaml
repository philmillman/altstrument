distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, pick a device and press Connect MIDI. The Chase Bliss pedals have no USB MIDI, so connect
  a MIDI interface to the pedal's TRS MIDI input with a Chase Bliss-compatible adapter. Check each device's MIDI receive
  settings under Connection and setup. Saving a preset overwrites the pedal's slot after a confirmation.
