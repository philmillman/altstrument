device: cleveland-hothouse
name: Hothouse Projects (andyhunti)
summary: >-
  Three effect programs for the Hothouse pedal platform with a shared hardware layer, namely a 60-second mono looper, a three-oscillator triangle drone with ping-pong delay, and a tremolo, reverb and delay effect.
description: >-
  The looper has overdub, replace and decaying modes, reverse and half or double speed, and its latest commits replace the DaisySP looper with a custom engine. Triurn plays three triangle oscillators with rhythmic gating and a stereo delay. Tremdelrevolo combines tremolo, a delay with clean, shimmer and tape modes, and a Dattorro reverb. A FLASHING.md explains why make program does not work over ST-Link on this hardware.
status: active
authors:
