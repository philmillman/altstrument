    url: https://github.com/andyhunti
source: https://github.com/andyhunti/hothouse
source_status: open
license: GPL-3.0-or-later
license_notes: The root LICENSE is GPL version 3 with a 2024 copyright for Andy Huntington and the "or any later version" grant. The README says each project folder may carry its own license and lists all three as GPL v3.
distribution: source-only
install_notes: >-
  Build libDaisy and DaisySP, run make in a project's folder, then flash with make program-dfu after holding BOOT and tapping RESET. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
