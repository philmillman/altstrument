homepage: https://schnell-auswahl.github.io/bandwerk/
distribution: browser-installer
install_notes: >-
  The project site offers a browser installer, or build with make and flash with tools/flash.sh. A first installation puts the Daisy bootloader in the Seed's internal flash and the program in the QSPI chip; at each power-up the bootloader waits two seconds for an update, so a failed update can be fixed by power-cycling the pedal. Holding both footswitches for about two seconds enters the bootloader for updates, and BOOT plus RESET on the Daisy Seed does the same for the first install. The FunBox build is selected with BOARD=funbox.
brick_risk: false
