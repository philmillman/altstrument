device: cleveland-hothouse
also_devices: [guitarml-funbox]
name: Bandwerk
summary: >-
  Multiband bass pedal firmware for Daisy Seed pedals: an LR4 crossover, a compressor per band, an FX loop on the high band with automatic latency compensation, an octaver and three drive types.
description: >-
  Bandwerk splits the bass signal at an adjustable point between 100 Hz and 800 Hz into a low and a high band and compresses each band separately. The high band can be sent out through the output ring and returned through the input ring, and the pedal measures the loop delay itself and delays the low band and dry signal to match. An octaver adds a sub octave and an octave up, a drive section offers overdrive, distortion and fuzz with an oversampled path, and a band mix and soft-clipped master finish the chain. Settings are stored in the QSPI flash. An optional USB link lets a web page or the included tools show levels along the chain and control the pedal, while the pedal runs the same without a computer.

  The README marks the project a v0.2 beta, says it has been tested on the Hothouse only and that the FunBox v1 to v3 builds are supported but untested, and says the FX loop has not been verified on hardware.
