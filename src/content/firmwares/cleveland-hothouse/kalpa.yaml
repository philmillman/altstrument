device: cleveland-hothouse
name: kalpa
summary: Distortion pedal for the Hothouse with drive, tone, character and volume controls, an input boost, and a switchable slapback, ambience or reverb effect.
description: >-
  Kalpa has six knobs for drive, tone, volume, a pre-distortion character EQ, effect mix and effect shape. Switch 1 sets the input boost, switch 2 picks the effect type and switch 3 assigns footswitch 2 to the pre-EQ, the effect or the boost. The repository includes a block diagram and a short report, and no license file or releases.
status: active
