source_status: open
license: unspecified
license_notes: No license file or statement in the repository. The README credits Joe Kokosa as the contributor.
distribution: source-only
install_notes: >-
  Build with the Daisy toolchain and flash over DFU. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
