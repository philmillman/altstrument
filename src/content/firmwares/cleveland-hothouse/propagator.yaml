device: cleveland-hothouse
name: Propagator
kind: tool
summary: >-
  Browser control surface and WebUSB DFU flasher for Spore firmware. It mirrors the pedal's knobs and switches, edits the synth voice, envelopes, LFOs, patchbay and step sequencer over MIDI, and flashes the latest Spore release.
description: >-
  The page connects to a Spore pedal over Web MIDI and sends the control changes and SysEx defined in Spore's MIDI protocol
  document. It saves presets in the browser. A wizard fetches the latest Spore release binary, or
  takes a local file, reboots the pedal into the bootloader with a control change and writes the app to QSPI over WebUSB with a built-in DfuSe client. An
  advanced option installs or repairs the bootloader through the STM32 ROM loader. It needs a Chromium browser, and Windows needs the WinUSB driver once.
  The README says it was built with substantial help from Claude.
status: active
authors:
