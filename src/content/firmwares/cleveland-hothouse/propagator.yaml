    url: https://github.com/rainybit-code
source: https://github.com/rainybit-code/propagator
source_status: open
license: GPL-3.0-or-later
homepage: https://rainybit-code.github.io/propagator/
distribution: browser-installer
requires_stock: Spore firmware on a Daisy Seed in a Hothouse
install_notes: >-
  Open the hosted page in Chrome or Edge with the pedal connected over USB. No install is needed, and the repository can be served locally with any static server.
brick_risk: false
tags: [editor, flasher, web-midi, web, presets]
