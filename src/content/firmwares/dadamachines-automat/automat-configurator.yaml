    url: https://github.com/dadamachines
source: https://github.com/dadamachines/automat-configurator
source_status: open
license: MIT
license_notes: The LICENSE file says Copyright (c) 2018 dadamachines.
homepage: https://automat-configurator.dadamachines.com/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a Web MIDI browser, connect the automat over USB and allow MIDI access with SysEx. Nothing is flashed.
brick_risk: false
