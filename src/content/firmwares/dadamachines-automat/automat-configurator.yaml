device: dadamachines-automat
name: automat configurator
kind: tool
summary: The maker's browser configurator for the automat. It sets the velocity program, minimum and maximum timing and gate duration of each solenoid output over Web MIDI SysEx, and the page also has an experimental view and a small sequencer. It needs a Web MIDI browser.
description: >-
  The page talks to the automat with the SysEx protocol that the firmware implements, which the firmware repository's README names as the way to set per-output programs and timing.
  Its credits thank two community developers. The repository's last commit, in 2024, only set the custom domain, so the page has not changed since the firmware moved to version 3.
status: dormant
authors:
