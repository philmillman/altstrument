device: designburg-vibe-fm-mk1
name: ECHOFIELD
summary: >-
  Granular instrument built with the VIBE FM SDK, ported from the FM-1 ECHOFIELD, with six modes, live audio input
  granulation, 16 pads and a stage view; it runs in the VIBE FM Playground and plugin today.
description: >-
  It reads small grains from a sample or from the live input, up to 48 at once, and overlaps them into a continuous sound.
  The six modes are CLOUD, DUST, TAPE, BLOOM, PULSE and DRIFT, and the keys play the cloud at any pitch, with an ORACLE that
  picks notes in a chosen key, held performance effects, RANDOM with locks, RESAMPLE and a filter, delay, reverb and tape
  section. Compared with the FM-1 version it adds a live ring of up to 8 seconds fed from IN 1 and IN 2, recording into 16
  slots of up to 16 seconds, 16 pads, WAV loading and export, MIDI out for PULSE and a 480 x 320 screen view. A larger stage
  view and automatable parameters appear in the Playground and plugin. It is one WebAssembly file that runs in the browser
  Playground and the VST3, AU and CLAP plugin, and the README says the same zip will run on the VIBE hardware, which has not
  shipped. Hardware use is therefore untested.
status: active
authors:
