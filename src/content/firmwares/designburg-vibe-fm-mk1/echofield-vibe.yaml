    url: https://github.com/Philip-Bos
source: https://github.com/Philip-Bos/echofield-vibe
source_status: open
license: MIT
license_notes: >-
  LICENSING.md says the firmware, engine, tools and page are MIT, the factory sounds are CC0-1.0, and the VIBE FM SDK,
  a pinned submodule, is Apache-2.0 with its fonts under SIL OFL 1.1. The release carries THIRD-PARTY-LICENSES.txt.
homepage: https://philip-bos.github.io/echofield-vibe/
based_on: m-vave-fm-1/echofield
distribution: browser-installer
install_notes: >-
  Drop echofield.wasm onto the VIBE FM Playground in Chrome or Edge, or echofield.zip onto the VIBE FM plugin window. There
  is no install on hardware yet, because the VIBE FM Mk1 has not shipped.
brick_risk: false
