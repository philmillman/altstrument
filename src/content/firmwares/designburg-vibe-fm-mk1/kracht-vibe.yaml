versions:
  - version: v0.5.2
    date: 2026-11-25
    url: https://github.com/Kracht/kracht-vibe/releases/tag/v0.5.2
    notes: Makes KRACHT playable without pads and keys on the VIBE Box, with step editing on the encoders, effects picked from SHIFT and the encoders, fills, drum keys and a DATA kick-preset control. Tested in the web player, not yet on VIBE Box hardware.
  - version: v0.5.0
    date: 2026-11-22
    url: https://github.com/Kracht/kracht-vibe/releases/tag/v0.5.0
    notes: Adds 16 performance effects on the pads (beat repeat, tape stop, pitch shifts, reverse, sweeps, delay and hall throws and others), note repeat, overdub, quantize, fills, six scenes, polymeter per lane, the kick tuned to a key, MIDI in and out with clock, and saved settings.
  - version: v0.3.1
    date: 2026-11-21
    url: https://github.com/Kracht/kracht-vibe/releases/tag/v0.3.1
    notes: Kick and rumble are made in small portions so turning a knob no longer interrupts the audio.
