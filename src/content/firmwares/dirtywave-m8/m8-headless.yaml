device: dirtywave-m8
name: M8 Headless
summary: Dirtywave's own build of the M8 tracker for a bare Teensy 4.1, driven through a display and input client on a host computer over USB.
description: >-
  Precompiled .hex firmware for the Teensy 4.1 with the M8 sequencer, sampler
  and synth engines. Samples are read from a microSD card in the /Samples
  directory; the repository recommends FAT32 and a card with good random-read
  speed. Setup is covered in the M8Docs headless guide. The repository's
  changelog lists the 6.6.3 series as fixes for MIDI sync, trig envelopes and
  the FM synth, plus a recording dropout mitigation.
status: active
authors:
  - name: Dirtywave (Trash80)
    url: https://dirtywave.com
source: https://github.com/Dirtywave/M8HeadlessFirmware
source_status: binary-only
license: proprietary
license_notes: >-
  Distributed under the Dirtywave EULA in the repository (EULA.txt): use on
  your own devices and archival copies only. No modification, derivative
  works, reverse engineering or redistribution. The EULA was changed on
  2026-10-20 to also forbid running the firmware in an emulator, simulator or
  other software implementation of the target hardware without Dirtywave's
  written permission.
homepage: https://github.com/Dirtywave/M8Docs/blob/main/docs/M8HeadlessSetup.md
distribution: download
install_notes: >-
  Flash the .hex from the repository's Releases folder to the Teensy 4.1 and
  run a display and input client on the host. See the setup guide.
tags: [sequencer, sampler, synth-engine, fm, midi]
video:
  url: https://www.youtube.com/watch?v=gf1Blf8M7XE
  title: "DIY Dirtywave M8 headless using a Teensy 4.1 microcomputer"
