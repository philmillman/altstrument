    url: https://github.com/clickysteve
source: https://github.com/clickysteve/m8-librarian
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement in the repository.
homepage: https://m8librarian.allmyfriendsaresynths.com
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, since the File System Access API is needed, and choose the SD card. The screen
  mirror needs Web Serial over HTTPS.
brick_risk: false
tags: [librarian, editor, tracker, web, sample-transfer]
