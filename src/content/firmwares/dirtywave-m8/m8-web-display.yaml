    url: https://github.com/derkyjadex
source: https://github.com/derkyjadex/M8WebDisplay
source_status: open
license: MIT
homepage: https://derkyjadex.github.io/M8WebDisplay/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge 89 or later and connect the Teensy or the M8. On Linux add your user to the
  dialout group. To flash, choose the .hex file for the M8 Headless firmware from Dirtywave.
brick_risk: false
