device: dirtywave-m8
name: M8 Web Display
kind: tool
summary: Browser front end for the M8 Headless firmware on a Teensy 4.1 or an M8, over Web Serial or WebUSB. It draws the screen, routes the M8's audio, takes keyboard and gamepad input and includes a loader for a Teensy firmware .hex.
description: >-
  The page renders the M8 display in WebGL, plays the audio the M8 sends over USB, maps keyboard keys and gamepad buttons
  to the M8 controls, shows touch buttons and sends MIDI notes from a typing keyboard. It works offline once loaded and
  installs as a PWA. The firmware loader asks the user to select a .hex file and writes it to a Teensy through its HID
  bootloader; the project bundles no firmware. WebUSB is the fallback on Chrome for Android, where audio cannot be routed.
  The author's to-do list names automatic reboot into the bootloader as unfinished.
status: dormant
authors:
