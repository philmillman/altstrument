versions:
  - version: v42
    date: 2026-11-10
    url: https://github.com/isod89/openpocket/releases/tag/v42
    notes: Reworks the pedal's footswitch and knob controls, adds diagnostics pages, a four-section web editor and an optional USB sound card mode. The sound engine is unchanged.
  - version: v41
    date: 2026-11-10
    url: https://github.com/isod89/openpocket/releases/tag/v41
    notes: Splits NAM models across the two cores by layer to lower the processor load, frees 24 KB of RAM and speeds up preset changes. Output samples are the same as v40.
  - version: v40
    date: 2026-11-09
    url: https://github.com/isod89/openpocket/releases/tag/v40
    notes: Moves the audio code into RAM at boot and runs the delays at half rate, as the official firmware does, to cut the load that pushed heavy presets into bypass. Presets and delay times are unchanged.
  - version: v37
    date: 2026-11-08
    url: https://github.com/isod89/openpocket/releases/tag/v37
    notes: Adds an AMP type that plays Neural Amp Modeler A2 networks on the pedal, with 12 factory models, 16 user slots loaded from the web editor and rebuilt factory presets. Also adds MIDI over USB, a working battery gauge, a soft output limiter and BlackBox button lights.
  - version: v36
    date: 2026-11-06
    url: https://github.com/isod89/openpocket/tree/v36
    notes: Git tag; no GitHub release page. Adds the new PLAY and EDIT screens and matches loudness across amps and presets.
