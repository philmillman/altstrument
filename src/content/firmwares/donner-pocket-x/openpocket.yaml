device: donner-pocket-x
name: OpenPocket
summary: >-
  Guitar multi-effects firmware written from scratch for the Pocket X's JieLi chip, with a 12-block chain of 78 models, 8 fitted amps plus neural amp models, 7 cabs and 52 preset slots, installed from a browser page. A BlackBox build ships too and is still being tested.
description: >-
  The signal chain has twelve blocks that can be reordered and saved with the preset: gate, compressor, pitch, special FX,
  synth, drive, amp, cab, EQ, modulation, delay and reverb. The models include amps and cabinets named after classic gear, with the amps fitted to captures of the real ones,
  drives, modulations, delays and reverbs, and a group of synth, organ and string voices played from a normal guitar. The
  audio path is 24-bit and reads the left input only, as the official firmware does. There are 52 factory presets and 52
  slots that survive updates, saved with a power-cut-safe store, a chromatic tuner and a web page for editing the presets. The pedal appears as a USB MIDI device
  and, with a setting that is off by default, as a USB sound card; it takes updates from the project's web installer page, which can also return it to the official firmware from a file you
  download from the maker. Since v37 the AMP block can also run Neural Amp Modeler A2 networks, with 12 factory models and
  16 user slots loaded from the web editor, and the pedal takes MIDI program and control changes over USB. Version 42 reworked the pedal's controls, added diagnostics pages and a four-section web editor, and the
  README says the new USB audio is tried on a BlackBox with macOS only. The engine is
  portable C tested on a computer with a simulated pedal and flash. The project builds a package for the M-VAVE BlackBox
  too. Early builds restarted in a loop on a BlackBox (issue 1, now closed); the README says v31 fixes it and that it is
  being tested, and an owner reported v31 working there. The Pocket X install is reported as tested by the author and by
  other owners.
status: active
authors:
  - name: isod89
    url: https://github.com/isod89
source: https://github.com/isod89/openpocket
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only for the project. The chip support and the update loader come from felucca-bsp under MPL-2.0, the installer page and
  packaging tools are adapted from Felucca under GPL-3.0, and the Inter font (OFL-1.1) is compiled into the firmware. The
  repository commits a few binary files taken as-is from JieLi's Apache-2.0 AC79 SDK (two LLVM bitcode drivers, a boot
  stage and two config files) and no Donner or M-VAVE firmware.
homepage: https://isod89.github.io/openpocket/
distribution: browser-installer
requires_stock: Donner Pocket X official firmware (the page also takes your own copy of the official file to go back)
install_notes: >-
  Open the installer page in Chrome or Edge on a computer, connect the pedal over USB, press Connect and then Install. To go
  back, pick the official .fwsc from the maker in the same page, which checks it in the browser. Keep the SD-card recovery
  described in the flash folder (fm1buddy on an ESP32-S3) at hand. The BlackBox package is still marked as being tested. The official BlackBox V21 download contains no sound bank, so after going back to it the installer can check the factory sounds and the repository describes a macOS recovery tool for them.
brick_risk: false
tags: [fx, amp-sim, ir, synth-engine, presets, tuner, flasher, web, usb-midi, open-source]
