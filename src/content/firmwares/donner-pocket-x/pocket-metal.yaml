device: donner-pocket-x
also_devices: [m-vave-blackbox]
name: POCKET METAL
summary: >-
  Metal-focused firmware for the Donner Pocket X and M-VAVE BlackBox, built on OpenPocket, with 60 sounds across metal styles, ten fitted high-gain amps and five pedals, cent-accurate down-tuning and a riff gate, installed from a browser page.
description: >-
  POCKET METAL is an alternative firmware on OpenPocket's base firmware, exported from the OpenPocket repository. It carries sixty presets covering metal styles from NWOBHM and thrash to death, black, doom, djent and metalcore, plus cleans and leads, matched in loudness. Ten high-gain amps and five drive pedals are fitted to captures of real gear and sit beside OpenPocket's own models; it uses no neural amp models. The chain runs on the pedal's second core and the delay and reverb on the first. Other features are a DOWN TUNE page that shifts the guitar from E to F# standard or an octave down to the cent, with an octaver, harmonizer, whammy and detune, a gate tuned for palm-muted riffs, a stereo WIDTH control, black and blood-red screens, a tuner on both footswitches, and MIDI program and control changes.

  The installer page checks the package in the browser before sending it and the pedal checks it again before writing. It works over the official firmware, over OpenPocket or over another firmware on OpenPocket's base, and OpenPocket presets, NAM models and cabinet IRs stay on the pedal. The release notes and README say version 2 has not been run on a pedal yet and ask for reports; the BlackBox package is built from the same source, and a BlackBox on M-VAVE firmware V22 or later is refused. The project is independent of Donner and M-VAVE.
