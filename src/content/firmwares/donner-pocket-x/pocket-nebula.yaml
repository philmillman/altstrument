license_notes: >-
  GPL-3.0-only for the project. The chip support and update loader come from felucca-bsp (MPL-2.0), the installer and packaging tools are adapted from Felucca (GPL-3.0), screen fonts are SIL OFL 1.1, and the repository holds a few binary files taken as-is from JieLi's Apache-2.0 AC79 SDK and test guitar loops under CC BY 4.0. It commits no Donner or M-VAVE firmware.
homepage: https://isod89.github.io/pocket-nebula/
based_on: donner-pocket-x/openpocket
distribution: browser-installer
requires_stock: Donner Pocket X official firmware, or OpenPocket; on the BlackBox, M-VAVE firmware older than V22
install_notes: >-
  Open the installer page in Chrome or Edge on a computer, plug the pedal in over USB, press Connect and then Install, and keep it plugged in for a minute or two. Keep your backup or the official firmware file at hand. To go back, use OpenPocket's installer (Back to OpenPocket) or step 3 of this installer with the official file from Donner or M-VAVE. A pedal that restarts in a loop can be recovered with the installer's rescue mode or OpenPocket's USB rescue.
