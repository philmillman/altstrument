device: donner-pocket-x
also_devices: [m-vave-blackbox]
name: NEBULA
summary: >-
  Granular processor firmware for the Donner Pocket X and M-VAVE BlackBox, built on OpenPocket, that plays up to 32 grains from a 5.9 second memory of the guitar, with 40 soundscapes and a freeze footswitch, installed from a browser page.
description: >-
  NEBULA is an alternative firmware on OpenPocket's base firmware, exported from the OpenPocket repository. The guitar is recorded continuously into a 5.9 second memory and up to 32 grains play small pieces of it back, each with its own position in the past, length, pitch, direction and stereo place. The cloud passes through a tone filter and an eight-line space, part of it feeds back into the memory, and it joins the dry guitar in stereo. FREEZE stops the recording so the cloud lives on what it holds. There are forty soundscapes, pitch from minus to plus 24 semitones with grains optionally on octaves, fifths or scales, reversed grains, glide, a rhythm control that locks to MIDI clock, trails when bypassed, an onboard amp section, a live drawing of the cloud on the screen, and MIDI program changes, 23 control changes and clock.

  The installer page checks the package in the browser before sending it and the pedal checks it again before writing. It works over the official firmware, over OpenPocket or over another firmware on OpenPocket's base, and OpenPocket presets, NAM models and cabinet IRs stay on the pedal. The release notes and README say version 1 has not been run on a pedal yet; the BlackBox package is built from the same source, and a BlackBox on M-VAVE firmware V22 or later is refused. The project is independent of Donner and M-VAVE.
