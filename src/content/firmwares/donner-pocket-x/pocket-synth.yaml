device: donner-pocket-x
also_devices: [m-vave-blackbox]
name: POCKET SYNTH
summary: >-
  Guitar synthesizer firmware for the Donner Pocket X and M-VAVE BlackBox, built on OpenPocket, with a pitch-tracking mono mode, a polyphonic band-split mode and 128 sounds, installed from a browser page.
description: >-
  POCKET SYNTH is an alternative firmware on OpenPocket's base firmware, exported from the OpenPocket repository. It plays a synthesizer from the plain guitar signal in three ways. MONO tracks the pitch to the cent and drives two oscillators of ten kinds, a sub-octave, noise, up to four chord notes, an arpeggiator and glide. POLY splits the guitar into 24 bands, each driving a synthesizer wave, so chords sound without tracking. DRY runs the guitar itself through the synthesizer's filter, envelopes and effects. The rest of the engine is a ladder or state-variable filter, envelopes, an LFO, a ring modulator, a chorus, a stereo delay and a reverb, with 128 sounds in 14 families, a HOLD footswitch, and MIDI program changes, 51 control changes and clock for the arpeggiator, LFO and delay.

  The installer page checks the package in the browser before sending it and the pedal checks it again before writing. It works over the official firmware, over OpenPocket or over another firmware on OpenPocket's base, and OpenPocket presets, NAM models and cabinet IRs stay on the pedal. The release notes and README say version 1 has not been run on a pedal yet; the BlackBox package is built from the same source, and a BlackBox on M-VAVE firmware V22 or later is refused. The project is independent of Donner and M-VAVE.
