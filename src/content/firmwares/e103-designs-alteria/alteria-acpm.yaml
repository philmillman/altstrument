device: e103-designs-alteria
name: ALTERIA ACPM
summary: Arduino firmware that turns the ALTERIA module into an Addressable or Clocked Preset Manager, storing up to 16 steps of two CV values and a gate and stepping through them by clock or CV address.
description: >-
  ACPM 1.0.0 is a standalone sketch that stores sixteen steps, each holding output 1, output 2
  and a gate state, with an active length from 1 to 16 that does not erase the other steps. In
  play mode CV in either advances one step per rising edge (clock) or selects a step by level
  across 0 to +5 V split into as many bands as there are active steps (address). Outputs 1 and 2
  replay the stored CV values and the I/O jack is always a gate output. Edit mode sets the two CVs
  and the gate with the three knobs, which use pickup, and setup mode sets the length, a shared
  output range of plus or minus 1, 2 or 5 V and the CV in function. A long press of the mode
  button saves the bank to two checksummed EEPROM banks that leave the ALLROUNDER, FULL VOICE,
  DRUM LAB and calibration data alone. The range is not a 1 V per octave quantizer. The README
  marks the firmware as untested on the physical module.
