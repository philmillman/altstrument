install_notes: >-
  Open ACPM/Firmware/ALTERIA_ACPM/ALTERIA_ACPM.ino in the Arduino IDE and build for Arduino Nano with
  an ATmega328P at 16 MHz (the ALTERIA REV5-2 board), choosing the old bootloader only if the Nano
  needs it. Upload one ALTERIA sketch at a time, and disconnect external sources from the I/O
  jack first because it is an output in this firmware. The firmware only reads the existing
  output calibration. Check the CV in limits on your board before patching bipolar signals into
  it, and do not power off while the LEDs flash during a save.
brick_risk: false
