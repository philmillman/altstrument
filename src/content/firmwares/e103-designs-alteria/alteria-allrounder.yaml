device: e103-designs-alteria
name: ALTERIA ALLROUNDER
summary: Arduino firmware for the ALTERIA module with sixteen selectable modes, including envelopes, ducking, burst, acid pitch patterns, tremolo, clock tools, Euclidean triggers, logic, Turing-style CV and a sample and hold with glide.
description: >-
  ALLROUNDER 2.3.0 runs one mode at a time and steps through them with the mode button. The modes
  include AD and AR envelopes, dual decay, ducking, burst, an acid pitch generator, tremolo and
  autopan, Grids-style trigger patterns, triple clock ratios, three Euclidean trigger lanes with
  separate densities, XOR logic, a Turing-machine register, humaniser, Bernoulli routing, a trance
  gate and a sample and hold with glide. Version 2.3.0 replaced the earlier Mutant Drums and preset
  manager slots, and sessions saved in those slots now start at AD Shaper. Output calibration at 0 V,
  +5 V and -5 V is stored per board in EEPROM. The sources credit an acid-pattern generator by drakh
  (CC0) as inspiration for one mode. The README says the firmware was compiled and checked in
  software only, with testing on a physical module still pending. The repository also holds a
  Firmware Builder that assembles a custom set of up to sixteen modes, and a library of 47
  single-mode sketches that includes ORBIT, the eight-step preset manager and the drum modes.
