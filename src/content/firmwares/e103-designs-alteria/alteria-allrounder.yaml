install_notes: >-
  Open ALLROUNDER/Firmware/ALTERIA_ALLROUNDER/ALTERIA_ALLROUNDER.ino from its own folder in the
  Arduino IDE, together with the two header files beside it, and build for Arduino Nano with an
  ATmega328P at 16 MHz, choosing the old bootloader only if the board needs it. Upload one ALTERIA
  sketch at a time. Calibrate the outputs with a multimeter before use, and disconnect external
  signals from the I/O jack before leaving mode 3 or rebooting.
