homepage: https://github.com/E103-designs/ALTERIA#readme
distribution: source-only
install_notes: >-
  Open firmware/ALTERIA_ALLROUNDER/ALTERIA_ALLROUNDER.ino in the Arduino IDE and build for
  Arduino Nano with an ATmega328P at 16 MHz, choosing the old bootloader only if the board needs
  it. Upload one of the three ALTERIA sketches at a time. Calibrate the outputs with a multimeter
  before use, and disconnect external signals from the I/O jack before entering modes 3 or 10.
