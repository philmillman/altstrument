device: e103-designs-alteria
name: ALTERIA ALLROUNDER
summary: Arduino firmware for the ALTERIA module with sixteen selectable modes, including envelopes, ducking, burst, acid pitch patterns, tremolo, clock tools, logic, Turing-style CV and a preset manager.
description: >-
  ALLROUNDER 2.0.2 runs one mode at a time and steps through them with the mode button. The modes
  include AD and AR envelopes, dual decay, ducking, burst, an acid pitch generator, tremolo and
  autopan, Grids-style trigger patterns, triple clock ratios, mutant kick and snare synthesis,
  XOR logic, a Turing-machine register, humaniser, Bernoulli routing, a trance gate and a
  preset manager. Output calibration at 0 V, +5 V and -5 V is stored per board in EEPROM. The
  sources credit an acid-pattern generator by drakh (CC0) as inspiration for one mode. The
  README says the 2.0.2 sound changes still need listening and bench checks. A separate
  experimental 2.1.0 sketch in the same repository replaces the Mutant Drums mode with an Acid Voice mode and is marked
  untested on hardware.
status: active
