install_notes: >-
  Open firmware/ALTERIA_DRUM_LAB/ALTERIA_DRUM_LAB.ino in the Arduino IDE and build for Arduino
  Nano with an ATmega328P at 16 MHz, choosing the old bootloader only if the board needs it.
  Upload one of the three ALTERIA sketches at a time. The README says the DRUM LAB audio path still
  needs listening and bench verification.
