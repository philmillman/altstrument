device: e103-designs-alteria
name: ALTERIA DRUM LAB
summary: Arduino firmware that turns the ALTERIA module into two lo-fi percussion voices, each with eight selectable engines and three effects.
description: >-
  DRUM LAB 1.0.0 assigns one of eight engines to each voice: kick, tom, synth percussion, snare,
  clap, FM metal, closed hat or open hat. CV in triggers voice A to output 1 and the I/O jack
  triggers voice B to output 2, and the manual button triggers the selected voice. A sound
  control sets pitch, duration and character, and an effects control adds tone, drive and crush;
  hat pairs choke each other, and a kit can be saved. Audio runs at 6.4 kHz on purpose and there
  is no internal sequencer. The author describes it as original AVR synthesis and not an Erica
  Synths LXR port.
