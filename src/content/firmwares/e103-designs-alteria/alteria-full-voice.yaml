device: e103-designs-alteria
name: ALTERIA FULL VOICE
summary: Experimental Arduino firmware that turns the ALTERIA module into a monophonic digital voice with an oscillator, drive, resonant low-pass filter, VCA and a shared AD envelope.
description: >-
  FULL VOICE 1.0.0 is a separate sketch from ALLROUNDER and DRUM LAB and does not change their
  presets. One voice runs through four pages selected with the mode button: oscillator (sine,
  triangle, saw or pulse with pulse width and fine tune), filter (cutoff, resonance and envelope
  amount), VCA (level, envelope amount with a drone setting, and drive) and envelope (attack,
  decay and curve). CV in sets pitch at a nominal 1 V per octave, a rising edge on the I/O jack
  starts the AD cycle, output 1 carries the audio and output 2 carries the envelope. The sound is
  digital and lo-fi at 6.4 kHz, with no audio input and no sequencer. The repository marks the
  firmware as untested on hardware: it compiles and passes host and AVR simulator tests, but
  pitch tracking, levels and noise have not been checked on a physical module, and the
  output calibration does not cover the pitch input.
