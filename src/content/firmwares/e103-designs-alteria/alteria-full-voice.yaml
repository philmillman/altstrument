distribution: source-only
install_notes: >-
  Open firmware/ALTERIA_FULL_VOICE/ALTERIA_FULL_VOICE.ino in the Arduino IDE and build for
  Arduino Nano with an ATmega328P at 16 MHz. Upload one ALTERIA sketch at a time, and disconnect
  external gate sources from the I/O jack before changing firmware because other sketches drive
  it as an output. Calibrate the outputs with a multimeter by holding both buttons at power-up,
  use only positive voltages that your board is known to accept on CV in, and send the outputs
  to a mixer or interface at modular levels, not to headphones.
