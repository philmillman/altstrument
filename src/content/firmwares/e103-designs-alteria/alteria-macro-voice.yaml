device: e103-designs-alteria
name: ALTERIA MACRO VOICE
summary: Experimental Arduino firmware that turns the ALTERIA module into a digital voice with five oscillator models (fold, FM, chord, wavetable and Karplus-Strong) and two audio outputs.
description: >-
  MACRO VOICE 1.0.0 is a standalone sketch that does not replace the other ALTERIA firmwares. The
  mode button steps through five models: Fold (folded triangle), FM, Chord (four-note chords with
  inversions and a morph from sine to a richer tone), Wavetable (three banks of four waveforms,
  scanned independently on each output) and Karplus (a plucked string). Three knobs act on the
  current model immediately. CV in sets pitch at a nominal 1 V per octave, and the I/O jack is
  always an input. In the first four models it resyncs the oscillator phase on a rising edge,
  and in Karplus it plucks the string, as does the manual button. Both outputs carry audio; in
  Chord, output 2 holds the root. There is no envelope, filter or VCA, so notes are shaped with an
  external VCA. The sound runs at 8 kHz and is lo-fi, and the fold and FM models can alias on high
  notes. The synthesis models are original fixed-point code that cites the Mutable Instruments
  Plaits manual only as a reference for the families. The README marks the sketch as untested on
  hardware and links a stereo demo WAV that is a software render, not a recording of the module.
