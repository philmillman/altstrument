install_notes: >-
  Open MACRO-VOICE/Firmware/ALTERIA_MACRO_VOICE/ALTERIA_MACRO_VOICE.ino in the Arduino IDE and build
  for Arduino Nano with an ATmega328P at 16 MHz (the ALTERIA REV5-2 board), choosing the old
  bootloader only if the Nano needs it. The sketch does not suit an ATmega168P. Upload one ALTERIA
  sketch at a time, and disconnect external sources from the I/O jack first because some
  ALLROUNDER variants drive it as an output. The firmware reads the existing output calibration
  but has no calibration menu and writes nothing to EEPROM. Use only positive voltages on CV in
  and send the outputs to a mixer at modular levels, not to headphones.
