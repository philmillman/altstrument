device: e103-designs-eurotrack
name: euroTrack firmware
summary: Arduino firmware for the euroTrack module that counts bars and beats from a 4 PPQN clock in seven meters, sends a measure pulse every 1 to 16 bars, runs an internal clock and a performance timer, and keeps settings in EEPROM.
description: >-
  V4.1 follows an external clock at four pulses per sixteenth note and shows the bar, beat and elapsed time on the
  OLED, in a bar and beat layout or a larger timer layout. Meters are 4/4, 3/4, 6/8, 5/4, 7/8, 9/8 and 12/8, with
  compound meters shown as rhythmic groups. The measure output pulses on the first bar and then every 1, 2, 4, 8 or
  16 bars, with pulse lengths of 5, 10, 20 or 50 ms. An internal clock from 50 to 250 BPM takes over when the
  external clock stops and the timer is running. The timer can start, pause, resume and stop, and can be coupled to
  the bar counter. Settings are saved to EEPROM with a checksum. The source comes as a single-file sketch and a
  modular one with a host-side regression suite. The README calls it an engineering candidate and says only a few
  hundred bytes of RAM remain free on the ATmega328P.
