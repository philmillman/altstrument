homepage: https://github.com/E103-designs/euroTrack#readme
distribution: source-only
install_notes: >-
  Install the pinned Arduino AVR core 1.8.6 and the Adafruit SSD1306, GFX and BusIO libraries listed in
  docs/DEVELOPMENT.md, open one of the two sketch folders in the Arduino IDE and upload it to an Arduino Nano with an
  ATmega328P at 16 MHz, choosing the old bootloader only if the board needs it. Open only one sketch at a time. The
  repository also holds prebuilt .hex files with SHA-256 sums. Check the hardware revision against the README first;
  an updated schematic PDF dated 2026-10-28 is in hardware/schematics.
brick_risk: false
