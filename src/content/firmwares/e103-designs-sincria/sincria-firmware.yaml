install_notes: >-
  Install LedControl 1.0.6 from the Arduino Library Manager, open
  firmware/SINCRIA_Scansione_Righe/SINCRIA_Scansione_Righe.ino and build for Arduino Nano with an ATmega328P at
  16 MHz, choosing the old bootloader only if the board needs it. Confirm the installed MCU and
  the corrected schematic before uploading to a physical module.
