device: e103-designs-sincria
name: SINCRIA firmware
summary: Arduino sketch for the SINCRIA cellular automata sequencer that runs a Conway-style 8x8 world, scans it as 64 steps and emits clock, live-cell and generation-end events.
description: >-
  The published sketch, SINCRIA_Rev2_OK, is dated August 2025 inside the source and carries no
  version number. It applies the B3/S23 rules with horizontal wrap-around, scans the grid left to
  right and bottom to top, and lets the world evolve at the end of each scan. The tempo knob sets
  an internal clock of 60 to 200 BPM in sixteenth notes, or an external clock advances the scan.
  Buttons randomise the world, lock evolution, rotate it, and add or remove a random cell, with
  alternate functions behind AltMode. The README states that it adds no MIDI, pitch CV, pattern
  storage or reset input, and that the sketch is not matched to every PCB revision. It needs the
  LedControl library.
