device: e103-designs-sincria
name: SINCRIA firmware
summary: Arduino sketch for the SINCRIA cellular automata sequencer with five selectable rules, a dual gate sequencer mode and two small games on the 8x8 LED matrix.
description: >-
  The current sketch, SINCRIA_Scansione_Righe (dated 3 November 2026), scans the 8x8 world as 64
  steps and lets it evolve after each complete scan. Five rules can be chosen from a selector: Conway
  B3/S23, B234/S01, B3/S234, Mazectric and Coagulations. The tempo knob sets an internal clock of 30
  to 300 BPM, or an external clock advances the scan. A second mode turns the matrix into two gate
  patterns of up to 32 steps each with separate lengths. Holding a button combination at power-on
  starts EUROBOY, a Snake game or an editable Life colony. The default input profile fits the
  inverting inputs of boards Rev2.2 and Rev2.3, and profile 0 covers earlier active-high wiring. The
  older SINCRIA_Rev2_OK sketch stays in the repository. It needs the LedControl library, and the
  repository holds a prebuilt hex file and host-side tests.
