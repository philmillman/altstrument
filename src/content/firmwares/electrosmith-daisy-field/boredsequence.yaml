device: electrosmith-daisy-field
name: BoredSequence
summary: Minimal fixed-tempo 8-step CV sequencer for the Daisy Field, where each of the eight knobs sets one step's voltage and the pattern is output on CV Out 1.
description: >-
  A single-file program. Knobs 1 to 8 set the level of steps 1 to 8 across a 0 to 5 V range, the sequence advances
  at a fixed 120 BPM, and the sequence is output on CV Out 1. The knob LEDs show the active step and the current
  step is brightest while the gate is high. There is no tempo control or MIDI sync in the code. The Makefile expects
  libDaisy and DaisySP checked out next to a DaisyExamples copy.
status: active
