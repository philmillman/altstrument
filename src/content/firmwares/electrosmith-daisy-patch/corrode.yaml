  "or later" statement. Open303 is by Robin Schmidt.
distribution: source-only
install_notes: >-
  Build libDaisy and DaisySP, run make, then hold BOOT and press RESET and run
  make program-dfu. The ROM DFU bootloader stays available if a flash fails.
brick_risk: false
