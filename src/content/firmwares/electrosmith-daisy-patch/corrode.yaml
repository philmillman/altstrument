device: electrosmith-daisy-patch
name: Corrode
summary: TB-303 style acid voice for Patch.Init() built on the Open303 DSP engine, driven by CV and gate or USB MIDI, with saw and square waves, accent, slide and a drive stage.
description: >-
  Four knobs on two pages set cutoff, resonance, envelope mod and decay, then
  accent, slide, drive and tuning. CV inputs take pitch, cutoff, envelope mod and
  accent, a gate input triggers accents, and USB MIDI covers notes and
  parameters. External audio can pass through the filter, and a CV output
  follows the filter envelope. There is no sequencer. The Open303 code was
  converted to single precision, with a Butterworth anti-aliasing filter and
  faster tanh and exp approximations. The changelog still lists its phases as
  unticked.
status: active
authors:
