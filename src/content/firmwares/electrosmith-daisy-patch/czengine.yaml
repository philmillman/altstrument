device: electrosmith-daisy-patch
name: CZengine
summary: Casio CZ style phase distortion drone for the Daisy Pod, with six distortion profiles on a switch and distortion amount and pitch on the knobs.
description: >-
  An experiment in phase distortion synthesis as used by the Casio CZ series, written from the patent text and by
  ear against a real CZ. It emits a continuous tone. Switch 1 cycles through sawtooth, square, impulse, null, sine
  impulse and sawsquare profiles, knob 1 sets the distortion amount from a plain sine at full clockwise to maximum
  distortion, and knob 2 sets the pitch. The other Pod controls are ignored. The engine code has a separate test.
