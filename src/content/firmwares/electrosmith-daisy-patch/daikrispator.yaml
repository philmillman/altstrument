device: electrosmith-daisy-patch
name: Daikrispator
summary: Daisy Pod adaptation of Dekrispator, a monophonic synth that plays itself with random patches, a 16-step random sequencer, FM, multisaw and additive generators and a chain of effects.
description: >-
  An adaptation of the Dekrispator autonomous music synthesizer for the Daisy Pod. Sounds change on their own:
  switch 1 freezes or releases the current patch, switch 2 mutes, knob 1 sets tempo and knob 2 steps the effects from
  none to delay, phaser and chorus. Sound generators are band-limited analogue waveforms, four-operator FM,
  drifting multisaw, a ten-sine additive generator and noise, followed by two parallel LP/BP/HP filters with LFOs and
  vibrato, tremolo, distortion, echo, chorus/flanger and phaser. There is no USB host MIDI.
