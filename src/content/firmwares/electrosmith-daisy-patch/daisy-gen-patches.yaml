device: electrosmith-daisy-patch
name: Daisy gen~ patches
summary: Two Max gen~ patchers for Daisy Patch, a probability gate skipper with CV control and a four-output clock divider.
description: >-
  Skipmin takes four gate inputs, a probability knob and CV for each channel and
  passes or drops gates. The clock modulator divides one clock input into four
  outputs, with a knob and a CV for each division. Both are .maxpat files to
  export for the Daisy with Oopsy.
status: dormant
authors:
