    url: https://github.com/nnirror
source: https://github.com/nnirror/daisy_patches
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement in the repository.
distribution: source-only
install_notes: >-
  Open the patch in Max, export it with Oopsy and flash the result. The ROM DFU
  bootloader stays available if a flash fails.
brick_risk: false
tags: [max, gen, clock, gate, cv]
