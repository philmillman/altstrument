device: electrosmith-daisy-patch
name: Daisy Harmoniqs
summary: Ten-voice additive synth for the Daisy Pod, each voice made of eight harmonics with harmonic balance, bitcrusher, envelope, shared filter, distortion and LFO, controlled mostly by MIDI.
description: >-
  Every voice sums sine waves at one to eight times the fundamental. Controls set the harmonic level, the even-to-odd
  mix and the low-to-high balance, and each voice has its own bitcrusher and envelope. The mix passes through a
  tanh-style distortion, a filter and a triangle LFO of 0.1 to 10 Hz, with the Pod's two knobs on LFO speed and amount.
  The README says version 0.6.0 works on the Pod and that it needs a patched DaisySP Decimator and a repaired Moog
  filter, and was written against libDaisy 4. The project also lists a Seed schematic and PCB as future work.
