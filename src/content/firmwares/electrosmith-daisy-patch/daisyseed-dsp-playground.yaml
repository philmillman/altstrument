device: electrosmith-daisy-patch
name: DaisySeed DSP Playground
summary: Fork of DaisyExamples with the author's own Daisy Pod programs added, including a DJFX effect suite, granular looper and time-stretch engines, and a performance looper modelled on a sampler's DJ effects.
description: >-
  The repository is a copy of Electrosmith's DaisyExamples with new Pod folders. DJFX_Looper and DJFX_Advanced are
  loopers over a 30-second SDRAM buffer. DJFX_Advanced has classic, ping-pong and tape-stop modes, two parameter banks
  selected by the encoder button, linear interpolation and Hanning or rectangular windows. DJFX_Suite is a chain of
  effects including a bitcrusher, a formant filter, a bi-directional filter sweep, an Euclidean tremolo, a spectral
  isolator and a transient gater, with tempo sync. GranularTimestretch adds MIDI sync.

  The top-level README is still the upstream examples text. The folders also contain Cursor rule files that guide the
  author's use of an AI coding editor.
status: active
authors:
