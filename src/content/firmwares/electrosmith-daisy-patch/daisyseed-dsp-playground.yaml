    url: https://github.com/mokafari
source: https://github.com/mokafari/DaisySeed-DSP-Playground
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT license, copyright 2020 andrewikenberry, inherited from DaisyExamples, and covers the
  new folders too. The repository is about 600 MB because it carries the libraries and a full copy of the examples.
distribution: source-only
install_notes: >-
  Build a program folder under pod/ with make after building libDaisy and DaisySP, then flash over USB DFU. The repository
  includes a Pod flashing guide. The ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
