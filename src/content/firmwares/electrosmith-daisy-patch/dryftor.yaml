device: electrosmith-daisy-patch
name: Dryftor
summary: Drone machine for the Daisy Pod with eight drifting polyblep saw oscillators and delay, phaser and chorus effects, controlled by modes selected on the encoder.
description: >-
  A drone synth built from eight drifting polyblep saw oscillators. The encoder selects one of six modes, shown by
  LED colour, with knob positions stored so values do not jump on a mode change. In the white mode, switch 1
  toggles manual and automatic operation, switch 2 mutes, knob 1 sets the main frequency and knob 2 the amount of
  drift; the blue, red and green modes switch the delay, phaser and chorus. The author says the modes are not
  fully implemented.
