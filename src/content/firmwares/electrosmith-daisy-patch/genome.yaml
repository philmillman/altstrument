device: electrosmith-daisy-patch
name: Genome
summary: Genetic-algorithm CV and gate sequencer for Patch.Init() that evolves its patterns, with the algorithm sketched first in a Python notebook.
description: >-
  The repository holds the Daisy firmware, an evolution header and a Jupyter
  notebook with a Python version of the algorithm. Its README is a single line,
  so the controls are not documented.
