requires_stock: Daisy Pod
install_notes: >-
  Build with make, which uses libDaisy v5.4.0, then flash with python3 tools/flash.py. The README says that works hands-free
  for firmware version 5 and later, so earlier builds need the usual DFU mode. The companion app runs from source with npm.
