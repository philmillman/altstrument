device: electrosmith-daisy-patch
name: GroovyDaisy
summary: >-
  Groovebox and looper firmware for the Daisy Pod, played by several people at once from a MIDI keyboard, pads and a guitar input, with retrospective capture, swing, send effects, eight scenes and a WebSerial companion app.
description: >-
  Capture is retrospective: rolling buffers record pads, keys and the guitar input, and a button grabs the last one to
  eight bars as a new track. Quantise, swing and velocity limiting apply to captures, CC movements are recorded with the notes, and live knob
  moves blend over them. A shared reverb and tempo-synced ping-pong delay act as sends, scenes are eight mute snapshots switched on the bar line, and
  loops can be edited on drum and piano-roll lanes in the companion app, which runs in Chrome or Edge over WebSerial and is not hosted.
  Firmware can be flashed from the host over the serial link, and the code includes a hard-fault recorder and a watchdog. It was
  built with an Arturia KeyLab Essential 61 on DIN MIDI. The README credits a human, Cleo, and Claude as the pair who wrote it,
  and includes a short piece composed by Claude to be played over the serial link.
