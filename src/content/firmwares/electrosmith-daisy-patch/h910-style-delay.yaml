install_notes: >-
  Build the .ino sketch with the Arduino IDE and DaisyDuino, then flash it over
  the Daisy bootloader. A build folder in the repository holds compiled files
  named for version 1.2. The Daisy ROM bootloader stays available if a flash
  goes wrong.
brick_risk: false
