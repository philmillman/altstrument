device: electrosmith-daisy-patch
name: H910 Style Delay
summary: Arduino sketch for Daisy Patch that models an Eventide H910 Harmonizer and delay, with a pitch-shifted left channel, a plain delay on the right and a mode switch on the encoder.
description: >-
  Four controls set delay time, feedback and dry and wet levels. In pitch shift
  mode the left channel is delayed and shifted while the right channel is delay
  only, and the encoder changes the shift ratio in steps of ten cents. In delay
  only mode the encoder offsets the right delay line from the left, and pressing
  it switches between the two modes. An OLED page shows the settings. Version
  1.3 needs a SetCents function added by hand to the pitch shifter header of the
  DaisyDuino library before it will build.
