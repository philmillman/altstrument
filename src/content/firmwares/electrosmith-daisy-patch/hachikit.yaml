    url: https://github.com/perkowitz
source: https://github.com/perkowitz/daisy-hachikit
source_status: open
license: unspecified
license_notes: No licence file and no licence statement in the repository.
distribution: source-only
install_notes: >-
  Build from source with the Makefile in source/HachiKit (libDaisy and DaisySP needed). No prebuilt binary is
  published and the repository has no install instructions.
brick_risk: false
