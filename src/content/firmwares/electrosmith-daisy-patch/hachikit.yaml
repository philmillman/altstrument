device: electrosmith-daisy-patch
name: HachiKit
summary: Virtual modular drum kit for the Daisy Patch, built from separate drum voices such as bass drum, snare, noise snare and FM drum, with a display screen and parameter editing.
description: >-
  Source for a drum machine on the Daisy Patch made of interchangeable drum voice modules: an 8-series style bass
  drum and snare, a noise snare and an FM drum, each behind a common drum interface. The latest commit adds drum
  selection and on-screen display and editing of parameters. The repository's README is an unedited template copied
  from the Daisy examples, and it also holds two earlier MIDI-controlled kit prototypes (Kit and Kit2).
status: dormant
