distribution: download
install_notes: >-
  Download build/Jellybeans.bin, put the Daisy in bootloader mode and program it
  with the Daisy web programmer. The README tells you to use the 1.4.2 build,
  which is under old_builds. The ROM DFU bootloader stays available if a flash
  fails.
