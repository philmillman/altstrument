device: electrosmith-daisy-patch
name: Jellybeans
summary: Diatonic quantizing arpeggiator for Daisy Patch that turns a V/oct root input into an arpeggio of the chord on that scale degree, with chord voicings, inversions and clock divisions.
description: >-
  The user sets a scale root and quality, and the module quantizes the incoming
  pitch and arpeggiates the diatonic chord built on it, sending the root out as a
  bass note on CV out 2. Later versions added BPM detection, an internal clock,
  fractional clock values and menu trims for the CV and output levels. The
  author's README says the project was being overhauled and recommends the
  1.4.2 build. It lives in a folder of a fork of DaisyExamples, next to the
  author's other projects.
status: dormant
