device: electrosmith-daisy-patch
name: MultiFX
summary: Sixteen-effect processor for a Patch.Init() with a 64 by 48 OLED, in four banks of reverbs, delays, filters and pitch or distortion effects, with CV on every knob and a global dry and wet control.
description: >-
  Effects are arranged as four banks of four. The reverb bank has classic, plate, tank and shimmer patches, the delay bank
  ping, tape, multitap and echo with reverb, the tone bank a ladder filter, a morphing state-variable filter, a comb and two
  independent low-pass filters, and the last bank a resonator, pitch shifter, drive and bit crusher. A button press steps
  through the patches and a long press opens a bank menu on the OLED. Knob 4 is the dry and wet mix for every patch, each knob
  sums with its CV jack, and the ping and echo patches lock their delay time to a clock on gate input 1. Patch changes fade the
  output out and reset the effect so they do not click. The DSP and navigation sit in a shared library that the author also
  uses for a bare Daisy Seed version in the same repository. The README gives the display modification pins and build steps
  and says nothing about hardware testing.
status: active
authors:
