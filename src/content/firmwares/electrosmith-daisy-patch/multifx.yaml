    url: https://github.com/Eight4aWish
source: https://github.com/Eight4aWish/eurorack_daisy_patch_init/tree/main/daisy_multifx_oled
source_status: open
license: MIT
license_notes: The repository's LICENSE is MIT and its licence table lists the multifx projects as the author's MIT work. The build uses Electrosmith's libDaisy and DaisySP.
homepage: https://eight4awish.com/modules/
distribution: source-only
requires_stock: Daisy Patch.Init() with a 0.66 inch SSD1306 OLED wired to the expansion header
install_notes: >-
  Wire the OLED SDA to A2 and SCL to A3 with 3.3 V and ground, build with make in daisy_multifx_oled after initialising the
  repository's submodules, put the module in DFU mode (hold BOOT, press RESET) and run make program-dfu.
brick_risk: false
