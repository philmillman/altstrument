device: electrosmith-daisy-patch
name: MultiOsc
summary: Multi-engine voice firmware for a Patch.Init() with an OLED, hosting a four-operator FM voice, an interval dual oscillator, a scanned-synthesis voice and a plain oscillator behind one shared panel layout, with the engine stepped by holding a button.
description: >-
  The firmware starts in the engine it was left in. Holding the button B7 for two seconds without turning a knob steps to the
  next engine, and the engine's name shows large on the OLED. Pot 1 picks what the engine makes, pots 2 to 4 shape it with the
  MOD jacks below them, V/OCT sets the pitch with C3 at 0 V, and the first gate ends an initial continuous drone and hands over
  to attack and decay. Holding B7 while turning a knob reaches a second bank (volume, attack and decay). The engines are FM4OP,
  a four-operator FM voice with eight algorithms, INTVL, a port of Nick Donaldson's dual oscillator with quantised interval
  offset, SCAN, a scanned-synthesis voice from the author, and WAVES, a basic oscillator. Holding B7 at power-up runs a V/OCT
  calibration that is stored once per module in QSPI flash and shared with the author's other Patch.Init apps. The design is
  written up in the repository's docs, and the sources live in sibling folders of a shared repository that also holds the
  author's released modules. The README says v2.0 of this interface, a redesign of 2026-11-22, was flashed and calibrated well
  but its button did nothing because a press was read as a release, and that v2.1 fixes this and is built but not yet flashed.
  Before the redesign FM4OP, INTVL and SCAN were checked on hardware, and WAVES was never bench tested. There is no release or
  prebuilt file.
status: active
authors:
  - name: David Baghurst (Eight4aWish)
    url: https://github.com/Eight4aWish
source: https://github.com/Eight4aWish/eurorack_daisy_patch_init/tree/main/daisy_multiosc
source_status: open
license: MIT
license_notes: >-
  The repository's LICENSE is MIT, and the licence table lists the multiosc host, the SCAN and FM4OP engines as the author's
  MIT work. The INTVL engine ports Nick Donaldson's MIT IntervalOsc, whose notice is kept, and the build links Electrosmith's
  LGPL-2.1 DaisySP-LGPL, so distributed binaries need a pointer to the source.
homepage: https://eight4awish.com/modules/
distribution: source-only
requires_stock: Daisy Patch.Init() hardware with an SSD1306 OLED and the Daisy bootloader
install_notes: >-
  Build with make in daisy_multiosc after initialising the repository's submodules, as a boot-SRAM app, which lets it save the calibration. Flash with
  make program-dfu during the bootloader's grace period, or copy build/daisy_multiosc.bin to the root of a FAT32 SD card
  and power-cycle. The folder's own docs describe a Patch.Init modified with the OLED in place of the toggle switch.
brick_risk: false
tags: [synth-engine, oscillator, fm, ui, open-source]
