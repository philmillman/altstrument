device: electrosmith-daisy-patch
name: MultiOsc
summary: Boot-selectable voice firmware for a Patch.Init() with an OLED, hosting a four-operator FM voice, an interval dual oscillator, a scanned-synthesis voice and a plain oscillator behind one shared panel layout.
description: >-
  A chooser on the OLED appears at power-on and the TUNE knob picks an engine. A short press of the button cycles an engine's
  algorithm or waveform, a long press toggles between a play page and an edit page, and holding it for three seconds returns
  to the chooser without a power cycle. The OLED shows what the three modulation knobs do in the current engine. The engines
  are FM4OP, a four-operator FM voice with parallel, stacked and feedback algorithms, INTVL, a port of Nick Donaldson's dual
  oscillator with quantised interval offset, SCAN, a scanned-synthesis voice from the author, and WAVES, a basic oscillator. The
  panel design is written up in the repository's docs, and the sources live in sibling folders of a shared repository that
  also holds the author's released modules. The README reports hardware checks of FM4OP, INTVL and SCAN on the author's
  hand-built Patch.Init with an OLED, says WAVES has been built but not bench tested, and says the hold-to-chooser gesture
  was installed from the SD card on 2026-11-01. There is no release or prebuilt file for it.
status: active
authors:
