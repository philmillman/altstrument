    url: https://github.com/Eight4aWish
source: https://github.com/Eight4aWish/eurorack_daisy_patch_init/tree/main/daisy_multiosc
source_status: open
license: MIT
license_notes: >-
  The repository's LICENSE is MIT, and the licence table lists the multiosc host, the SCAN and FM4OP engines as the author's
  MIT work. The INTVL engine ports Nick Donaldson's MIT IntervalOsc, whose notice is kept, and the build links Electrosmith's
  LGPL-2.1 DaisySP-LGPL, so distributed binaries need a pointer to the source.
homepage: https://eight4awish.com/modules/
distribution: source-only
requires_stock: Daisy Patch.Init() hardware with an SSD1306 OLED and the Daisy bootloader
install_notes: >-
  Build with make in daisy_multiosc after initialising the repository's submodules, as a QSPI boot-type app. Flash with
  make program-dfu during the bootloader's grace period, or copy build/daisy_multiosc.bin to the root of a FAT32 SD card
  and power-cycle. The folder's own docs describe a Patch.Init modified with the OLED in place of the toggle switch.
brick_risk: false
