device: electrosmith-daisy-patch
name: Musubi
summary: Oscillator processor for Daisy Patch with a two-output envelope generator, VCA, filter and multi-effect section holding reverb, delay, distortion and a DJ filter, controlled from an on-screen menu.
description: >-
  Up to four oscillator inputs go through a mixer, panning, a VCA envelope,
  distortion placed before or after the filter, a filter with its own envelope, a
  DJ filter, delay and reverb. The four controls change the options of the menu
  page shown on the display, and settings can be saved and loaded from the
  encoder. Version 1.1.0 removed clicks on fast attacks and added a volume meter.
  It lives in a folder of a fork of DaisyExamples.
