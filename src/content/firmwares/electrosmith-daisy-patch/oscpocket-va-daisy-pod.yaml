device: electrosmith-daisy-patch
name: OscPocket VA Synth (Daisy Pod port)
summary: Port of Staffan Melin's OscPocketD polyphonic MIDI virtual analog synth to the Daisy Pod, with oscillator, filter and effect pages on the knobs and 16 save slots.
description: >-
  A port of the OscPocketD VASynth, a polyphonic MIDI virtual analog synth written for the OscPocketD/Base2 Daisy
  Seed board, to the Daisy Pod. The two buttons step through categories and parameter sets, shown by LED colour,
  and the knobs adjust them. The encoder picks one of 16 save slots, with a turn left to save and right to load.
  The port needs an external MIDI source. The author lists open issues including detune scaling, voice stealing and
  delay glitches, and says voice count is limited to 1, 5 or 8.
status: dormant
