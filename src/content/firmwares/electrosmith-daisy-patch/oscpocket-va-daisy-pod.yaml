  state GNU General Public License v3.0, and the port's author edited those files.
source: https://github.com/moonfriendsynth/OscPocket-VA-Daisy-Pod
source_status: open
homepage: http://www.oscillator.se/opensource
distribution: download
install_notes: >-
  Download oscvasynthpod.bin from the v1.0 release and flash it with Electrosmith's web programmer. A MIDI keyboard
  or other MIDI source is required.
brick_risk: false
