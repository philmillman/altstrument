device: electrosmith-daisy-patch
name: PolySynth (podsynth)
summary: Six-voice polyphonic MIDI synth for the Daisy Pod with a reverb, an NTS-1 style signal chain, and arpeggiator and sequencer code, still early in development.
description: >-
  A polyphonic synth for the Daisy Pod that plays six voices from incoming MIDI. The source also contains an
  arpeggiator, a step sequencer, an LCD driver and a reverb, and the most recent commits add line-in sync code and
  gain changes. The README is a Daisy examples template whose controls table says nothing is mapped yet except MIDI.
