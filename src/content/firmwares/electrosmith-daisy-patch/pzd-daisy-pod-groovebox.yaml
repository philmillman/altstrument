device: electrosmith-daisy-patch
name: PZD Daisy Pod Groovebox
summary: >-
  Multitimbral groovebox firmware for the Daisy Pod with a four-layer looper, DX7-style FM, granular, string
  ensemble, organ, supersaw and sampler engines, a MIDI sequencer, an I2C OLED menu and SD card storage.
description: >-
  Needs a Daisy Pod with an added 128x64 I2C OLED and a hand-wired micro SD socket. The looper has four
  tempo-locked stereo layers with undo, per-layer filter, effects and reverb send, vari-speed, and WAV export of
  the performance. Alongside it run an FM engine built on the msfa DX7 core with a few thousand DX7 SysEx
  presets, of up to 16 voices and, since v3.6.0, a second Dexed engine with up to 24 voices across both, a granular
  instrument, a string ensemble with up to 16 voices, a drawbar organ added in v3.6.5, and, since v3.6.6, two separate samplers, a chromatic sound
  player and a sliced drum kit that start on their own MIDI channels and can import OP-1 drum and instrument packs you supply. All engines play at the
  same time, each on its own MIDI channel, and share a plate reverb and delay. Since v4.0.0 there are eight MIDI
  tracks with patterns, chains and an arpeggiator, 16 scenes and a song mode, and v4.0.1 adds a Supersaw engine as the
  eighth. Presets, performances and samples
  live on the SD card. From v1.6.0 the app runs from QSPI flash behind a separate Daisy bootloader, which each Pod
  needs flashed once. v3.0.0 renamed the SD card folders, so cards from v2.x need their folders renamed.
status: active
authors:
