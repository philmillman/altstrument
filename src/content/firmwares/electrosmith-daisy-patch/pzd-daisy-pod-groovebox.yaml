source: https://github.com/Peteranthony1st/PZD-Daisy-Pod-Groovebox
source_status: open
license: PolyForm-Noncommercial-1.0.0
license_notes: >-
  LICENSE is PolyForm Noncommercial 1.0.0, copyright PZD, with an added permission to make, perform, record,
  publish and sell music with the firmware; selling the firmware or hardware running it needs a commercial
  licence. Releases up to v3.6.7 were binary-only; source is published from v4.0.0. The vendored msfa DX7 core in
  src/msfa/ is Apache-2.0 and the Dattorro reverb port is MIT. The libDaisy and DaisySP submodules point to the author's forks, and the build also compiles
  DaisySP-LGPL. The factory DX7 presets are SysEx banks collected from the wider Dexed community; the repository
  does not state their terms. OP-1 packs are not bundled.
distribution: download
requires_stock: Electrosmith Daisy Pod with an added I2C OLED display and a micro SD socket
install_notes: >-
  Flash the Daisy bootloader from the release (dsy_bootloader_v6_4-intdfu-2000ms.bin) once, in DFU mode with the
  Daisy web programmer or make program-boot. Then copy main.bin to the root of a FAT32 SD card and power-cycle the
  Pod, or flash it over DFU. The sdcard-template folder from the release gives a ready-made card layout. Power off
  before swapping cards. Building from source needs the Arm GNU toolchain and make.
brick_risk: false
tags: [groovebox, looper, sequencer, arpeggiator, synth-engine, fm, granular, sampler, fx, reverb, midi]
