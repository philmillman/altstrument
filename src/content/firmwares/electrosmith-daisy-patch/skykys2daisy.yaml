device: electrosmith-daisy-patch
name: Skykys2Daisy
summary: Collection of about 35 Pure Data patches for the Patch.Init() module, including synths, delays, drum and noise processors, with some used in the author's performances.
description: >-
  A set of Pure Data patches written for Electrosmith's Patch.Init() module, which runs on the Daisy Patch SM. The
  file names point to a wide range of ideas: drum synth, karplus, wavetable, resonator, reverse delay and spectral
  delay patches, and several three-layer live patches. The author describes them as an archive of firmware, some of
  it used in compositions and performances. Each patch is a single .pd file that has to be converted and built for
  the module.
status: dormant
