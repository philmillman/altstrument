distribution: source-only
install_notes: >-
  The repository holds Pure Data sources only. Convert a patch for Daisy with Electrosmith's Pure Data to Daisy
  workflow (Heavy / hvcc), then flash the result to the Patch.Init() over USB DFU. No built binaries are provided.
brick_risk: false
