source: https://github.com/algoritmarte/algodaisy/tree/main/patch_algodaisy/TorusPlus
source_status: open
license: unspecified
license_notes: >-
  No LICENSE file and no licence statement in the repository. The Rings code it
  imitates is Mutable Instruments' MIT-licensed work.
homepage: https://github.com/algoritmarte/algodaisy
distribution: download
install_notes: >-
  Flash firmwares/TorusPlus.bin over the Daisy bootloader. Recovery through the
  ROM DFU bootloader stays available.
brick_risk: false
tags: [resonator, physical-modeling, delay, generative, synth-engine]
