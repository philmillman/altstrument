device: electrosmith-daisy-patch
name: Torus Plus
summary: Clone of the Mutable Instruments Rings resonator for Daisy Patch with extras added, including a delay and a built-in random rhythm and note generator.
description: >-
  Torus Plus sits in a repository of Daisy Patch experiments from the same
  author, which also holds a hardware cheat sheet and a PatchSkeleton example
  that shows how to read and write the Patch's controls. The repository keeps
  prebuilt .bin files of Torus Plus and the skeleton in a firmwares folder.
status: dormant
