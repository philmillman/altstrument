device: electrosmith-daisy-patch
name: WavPlayer
summary: Multitrack WAV sample player for the Daisy Pod that streams files from an SD card, takes MIDI over USB and preloads a set of samples into RAM.
description: >-
  A sample player for the Daisy Pod that mounts an SD card, preloads the first few samples into memory and streams
  files from the card, with a small state machine and MIDI input over USB. A python folder holds time-stretch
  experiments (a WSOLA script and test audio). The README is a single line and the source describes it as a fairly
  simple player.
