device: electrosmith-daisy-seed
name: Creart Sampler
summary: Arduino-based looper and sampler for a Daisy Seed with a TFT screen, four encoders and six buttons, with ten-second loops, overdub, delay, reverb, pitch shift and filters.
description: >-
  Built by Crearttech and handed to the Centro Nacional de las Artes in Bogota, this is a portable instrument whose
  hardware is a Seed, an ST7735 TFT, four push encoders, six buttons and an RGB LED. The firmware records loops of up
  to ten seconds at 48 kHz, overdubs, plays in reverse, sets start and end points, keeps three levels of undo, and
  switches between line and microphone input on jack detection. The effects are delay, reverb, pitch shift and
  high and low-pass filters. The repository includes the schematic, case drawings, a user manual and a compiled
  simple-looper.bin. The README is in Spanish and calls the sketch SAMPLER_CNA.ino, while the file is SAMPLER.ino.
