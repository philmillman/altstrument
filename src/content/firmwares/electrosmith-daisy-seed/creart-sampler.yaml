install_notes: >-
  Install the Electrosmith Daisy board package, DaisyDuino, Adafruit GFX and Adafruit ST7735 in the Arduino IDE,
  choose the Daisy Seed board and upload. A bad image is replaced by putting the Seed back into DFU mode.
