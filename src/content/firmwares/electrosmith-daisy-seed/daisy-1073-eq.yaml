source_status: open
license: unspecified
license_notes: No license file or statement in the repository.
distribution: source-only
install_notes: >-
  Build with CMake and the Arm toolchain against libDaisy and DaisySP, then flash the .bin with the Daisy web
  programmer or dfu-util. The ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
