device: electrosmith-daisy-seed
name: daisy-fast-stft
kind: tool
summary: Header-only C++ framework for real-time FFT, STFT and inverse STFT spectral processing on a Daisy Seed, built on CMSIS-DSP, with windowing, spectral operations and feature extraction.
description: >-
  The library wraps a CMSIS-DSP real FFT with a streaming STFT and an overlap-add inverse, window generation, magnitude
  and phase conversion, frequency-domain arithmetic and morphing, and spectral features such as centroid, flux,
  rolloff and flatness. It does not allocate heap memory. Three example programs show a mono and a stereo STFT and an
  inverse-only path, and the docs cover parameters, processing modes and measured performance. The author calls it
  experimental and offers no guarantee of accuracy or sound quality.
status: maintained
authors:
