    url: https://github.com/Farmer2K5
source: https://github.com/Farmer2K5/daisy-fast-stft
source_status: open
license: unspecified
license_notes: No license file or statement in the repository.
homepage: https://github.com/Farmer2K5/daisy-fast-stft
distribution: source-only
install_notes: >-
  Clone with submodules, include fast_dsp.h in a libDaisy project and build with make. The example programs are flashed
  over USB DFU. A bad image is replaced by putting the Seed back into DFU mode.
brick_risk: false
