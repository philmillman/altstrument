device: electrosmith-daisy-seed
name: Daisy Griesinger Reverb
summary: Small stereo reverb for a bare Daisy Seed that follows a Griesinger-style comb and all-pass layout with damping, width and mix controls; the README is in German.
description: >-
  The project is a single reverb header and a short main file that sets up the Seed's audio callback. The reverb
  combines comb filters and all-pass filters with damping, stereo width and a dry/wet mix. The README lists decay
  and damping values to try for a longer or darker tail, and says to change individual comb delays by a few samples
  if the sound turns metallic. Nothing in it describes knobs or other hardware, so parameters are set in the code.
