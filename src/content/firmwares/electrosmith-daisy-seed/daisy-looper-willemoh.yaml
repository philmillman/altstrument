    url: https://github.com/willemOH
source: https://github.com/willemOH/daisy_looper
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Clone with submodules and build as in the Daisy C++ environment tutorial, then
  flash over USB DFU. A Seed recovers through DFU mode after a bad image.
brick_risk: false
