device: electrosmith-daisy-seed
name: Daisy Looper (willemOH)
summary: Looper for a Daisy Seed that records a loop to an SD card, reloads it into SDRAM at start-up and plays it back; the author built it on their own PCB because a breadboard did not work.
description: >-
  Samples live input, writes the loop to the SD card as a WAV file and reads it
  back into memory after a reboot. The README says it needs a wavwriter.h
  change from an open libDaisy pull request, that SD card wiring must be short,
  and that it failed on a breadboard but worked on a PCB with under 50 mm
  between the Seed and the card reader. It credits a forum post for the
  card-to-SDRAM read code.
status: dormant
authors:
