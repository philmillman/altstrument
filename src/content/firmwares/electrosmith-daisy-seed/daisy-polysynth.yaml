device: electrosmith-daisy-seed
name: Daisy Polysynth
summary: Polyphonic plucked-voice synth with a Costello reverb for a Daisy Seed, built from DaisyExamples code as the companion to a blog series on bare-metal synths.
description: >-
  Combines several Electrosmith example programs into one polyphonic synth
  called pluck, with a single shared filter and a reverb. The repository is the
  accompaniment to the author's blog series on building a simple synth on the
  Daisy, includes DaisySP and libDaisy as submodules and builds on macOS and
  Linux.
status: dormant
authors:
