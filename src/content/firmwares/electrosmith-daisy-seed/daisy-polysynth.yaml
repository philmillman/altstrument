    url: https://github.com/jcampbellcodes
source: https://github.com/jcampbellcodes/daisy_polysynth
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
homepage: http://www.jackcampbellsounds.com/2022/04/30/anatomyofabaremetalsynth_part1.html
distribution: source-only
install_notes: >-
  Run make all to build the Daisy libraries and the synth, then make program-dfu
  over USB or make program with an ST-Link. A Seed recovers through DFU mode
  after a bad image.
brick_risk: false
tags: [synth-engine, polyphonic, reverb, open-source]
