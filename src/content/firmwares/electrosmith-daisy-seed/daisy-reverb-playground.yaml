device: electrosmith-daisy-seed
name: Daisy Reverb Playground
summary: Experimental delay and reverb building blocks and example programs for a Daisy Seed, covering diffusers, feedback delay network tanks, and plate, hall and delay examples.
description: >-
  A set of example programs that combine early reflection generators, diffusion
  networks, feedback delay network tanks with Householder mixing and
  freeze or tail layers, built so that the blocks can be rearranged. The author
  says it is a work in progress for learning, not finished products. The
  delay line approach borrows from another Daisy developer, as the README credits.
status: active
authors:
  - name: Farmer2K5
    url: https://github.com/Farmer2K5
source: https://github.com/Farmer2K5/daisy-reverb-playground
source_status: open
license: MIT
license_notes: There is no LICENSE file; the README says the code is under the MIT License unless a source file says otherwise.
distribution: source-only
install_notes: >-
  Build one of the example programs with the Makefile and the Daisy toolchain
  and flash the Seed over USB DFU. A Seed recovers through DFU mode after a bad
  image.
brick_risk: false
tags: [fx, reverb, delay, open-source]
