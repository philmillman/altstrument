device: electrosmith-daisy-seed
name: Daisy SDRAM delay lines
kind: tool
summary: Two C++ delay line classes and a bump allocator that place long delay buffers in the Daisy Seed's external SDRAM, for long delays and reverbs.
description: >-
  A small library for DaisySP-based programs. DelayLineExt works on a buffer you supply, and DelayLineSDRAM
  allocates its own buffer in SDRAM. A lightweight bump allocator hands out float buffers from the SDRAM region.
  Both delay classes are derived from the DaisySP DelayLine, and the external-buffer design follows ideas from Keith
  Shepherd. Four example programs show internal and external buffers, an object placed in SDRAM and a run with no
  SDRAM. The author labels it experimental and a foundation to build on.
status: active
authors:
