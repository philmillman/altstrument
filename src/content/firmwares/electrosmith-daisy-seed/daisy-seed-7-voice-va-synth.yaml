device: electrosmith-daisy-seed
name: Daisy Seed 7-Voice VA Synthesizer
summary: Seven-voice virtual analog synth for a bare Daisy Seed with dual oscillators, a four-pole ladder low-pass filter per voice and USB MIDI control, derived from Staffan Melin's OscPocketD VASynth.
description: >-
  A further change to the VASynth code that the OscPocket Daisy Pod port also builds on, here adapted to run on the
  Seed with no Pod board. Each of seven voices has two oscillators (triangle, saw, square with pulse width, polyblep
  saw), its own amplifier and a four-pole resonant low-pass filter, with separate ADSR envelopes for amplitude and
  filter. Other features are several LFOs, keyboard follow and velocity routing, a stereo effect and a one-track
  scratchpad sequencer.

  Parameters are set from a MIDI keyboard over USB, and ten patches are stored in QSPI flash. A short text file
  explains the setup and another lists the parameters. A late commit message says the project was made compatible
  with the LGPL.
status: dormant
authors:
