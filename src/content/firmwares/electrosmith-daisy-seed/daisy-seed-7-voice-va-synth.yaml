license: unspecified
license_notes: >-
  No license file. The README says to feel free to copy, modify and improve the code, and names Staffan Melin as the
  author of the original VASynth. The OscPocket port in this catalogue records GPL-3.0 headers on that original code.
source: https://github.com/Nettech15/Daisy-Seed-7-Voice-VA-Synthesizer
source_status: open
homepage: http://www.oscillator.se/opensource
distribution: source-only
install_notes: >-
  Build and flash with the build_and_program or build_and_program_dfu task in VS Code, connect a USB MIDI keyboard,
  and select the Seed as the MIDI output. The ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
