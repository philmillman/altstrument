device: electrosmith-daisy-seed
name: Daisy Seed 8-Voice VA Synthesizer
summary: Eight-voice virtual analog synth for a bare Daisy Seed played over USB MIDI, with dual oscillators, a four-pole filter per voice, ADSRs, a loop recorder and parameters mapped to CC 2 to 25.
description: >-
  A descendant of the VASynth example from OscPocketD by Staffan Melin, which a Pod version and then the NucleoSynth
  author moved to the Seed without a Pod. This fork reworks the MIDI map so that generic controllers with eight pots and nine
  sliders can reach the parameters, trims the exposed list, widens the envelope ranges and adds a Moog ladder filter
  as a DaisySP upgrade folder. The text files list the parameters and the loading steps. Saving and loading
  patches is not implemented, and the author lists DIN MIDI, effects and extra filters as to-do items. The
  repository includes the author's own build output.
