distribution: source-only
install_notes: >-
  Copy the files from the DaisySP Filter Upgrade folder into DaisySP, rebuild DaisySP, then build and flash the synth
  over USB DFU with the VS Code tasks. A bad image is replaced by putting the Seed back into DFU mode.
