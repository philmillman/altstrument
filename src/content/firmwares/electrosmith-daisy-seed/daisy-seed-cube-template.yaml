    url: https://github.com/DADDesign-Projects
source: https://github.com/DADDesign-Projects/DaisySeedCubeTemplate
source_status: open
license: MIT
license_notes: The LICENSE file is MIT, copyright 2025 DADDesign-Projects.
homepage: https://github.com/DADDesign-Projects/DaisySeedCubeTemplate
distribution: source-only
install_notes: >-
  Open the project in STM32CubeIDE, build and flash with an ST-Link or over the STM32 ROM DFU mode. A bad image is
  replaced by putting the Seed back into DFU mode.
brick_risk: false
