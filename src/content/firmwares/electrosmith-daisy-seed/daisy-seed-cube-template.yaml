device: electrosmith-daisy-seed
name: DaisySeedCubeTemplate
kind: tool
summary: STM32CubeIDE project that sets up the Daisy Seed's audio codec, SDRAM and QSPI flash for programming the board without libDaisy, covering the Rev 5 WM8731 and Rev 7 PCM3060 boards.
description: >-
  A starting project for people who prefer STM32CubeIDE and the ST HAL to the Daisy toolchain. It contains the CubeMX
  configuration for the STM32H750, linker scripts for flash and RAM builds, code for the WM8731 codec and the IS25LP
  QSPI flash (erase, write and read), SDRAM setup, MPU settings and an audio callback. It has no synth or effect of
  its own.
status: active
authors:
