    url: https://github.com/NickCulbertson
source: https://github.com/NickCulbertson/Daisy-Seed-Mono-Synth
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Build with the same steps as DaisyExamples and run make program-dfu with the
  Seed in DFU mode (hold BOOT, press RESET). A Seed recovers through DFU mode
  after a bad image.
brick_risk: false
