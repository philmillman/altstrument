device: electrosmith-daisy-seed
name: Daisy Seed Mono Synth
summary: USB MIDI monosynth for a bare Daisy Seed with two detunable oscillators, a sub oscillator, two ADSR envelopes, a state variable filter, drive and eight presets.
description: >-
  Plays from a USB MIDI keyboard or a DAW; no panel controls are needed. The two
  oscillators offer saw, square, triangle and sine with detune, a sub oscillator
  sits an octave down, and a multimode filter has its own envelope. Parameters
  are mapped to MIDI control changes, pitch bend covers two semitones and
  program change selects one of eight built-in presets.
status: active
authors:
