    url: https://github.com/cutlasses
source: https://github.com/cutlasses/DaisyDrone
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: download
install_notes: >-
  Build next to a DaisyExamples checkout or use the precompiled .bin in the
  precompiled_binaries folder. Because the board uses the USB pins, the README
  says to program the Seed over USB while it is off the PCB, or over JTAG while
  it is on the board. DFU mode recovers a Seed after a bad write.
brick_risk: false
