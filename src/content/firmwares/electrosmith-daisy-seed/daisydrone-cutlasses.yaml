device: electrosmith-daisy-seed
name: DaisyDrone (Cutlasses)
summary: Drone synth for a Daisy Seed on its own PCB with six sliders, an encoder and a seven-segment note display; each slider mixes three detuned sines, summed or wavefolded.
description: >-
  Each of the six sliders sets the gain of three sine waves at slightly offset
  pitches around a frequency in the selected key, and the frequencies rise from
  left to right. A three-way switch chooses between averaging the 18 sines and
  wavefolding them with a sine or a triangle, and an encoder sets the base note
  shown on the display. The repository has Gerbers and a schematic for the
  board, the C++ source and precompiled binaries made by the author.
status: dormant
authors:
