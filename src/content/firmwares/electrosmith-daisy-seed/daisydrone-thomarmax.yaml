device: electrosmith-daisy-seed
name: DaisyDrone (ThomArmax)
summary: Basic two-oscillator drone synth for a Daisy Seed built on a breadboard, with pots and a switch for the oscillator waveform; the repository includes a breadboard schematic.
description: >-
  A small STM32 project that generates a drone from two oscillators on a Daisy
  Seed. The README shows a legend for the pots and the switch, a breadboard
  schematic and a demo video, and gives two scripts that build the Daisy
  libraries and the application.
status: dormant
authors:
  - name: ThomArmax
    url: https://github.com/ThomArmax
source: https://github.com/ThomArmax/DaisyDrone
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Run build_deps.sh to build the Daisy libraries and build.sh to build the
  application; the output is written to src/build. Flash it over USB DFU. A Seed
  recovers through DFU mode after a bad image.
brick_risk: false
tags: [synth-engine, oscillator, open-source]
