device: electrosmith-daisy-seed
name: daisylab
summary: Carl's breadboard experiments on a Daisy Seed, including op6daisy, a six-operator FM synth that reads DX7 bulk dumps, a LatelyBass-style four-operator voice, and a Python patch editor.
description: >-
  A collection of small projects. op6daisy plays six-operator FM voices and converts Yamaha DX7 SysEx bulk dumps; its
  op6-ui companion is a Python and tkinter program that loads dumps, sends program changes and edits voices, and
  runs on a Raspberry Pi. latebloomer reduces the engine to four operators with a half-sine waveform and a
  resonant low-pass filter, 16 voices and USB MIDI. Smaller folders hold a test tone, a Daisy Pod synth and an
  I2S daisy-chain test with a delay. The author says op6daisy does not match the real DX7 exactly.
