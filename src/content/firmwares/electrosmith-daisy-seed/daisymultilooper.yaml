device: electrosmith-daisy-seed
name: DaisyMultiLooper
summary: Multi-channel synchronised looper for a Daisy Seed with an OLED and a button interface, written as an Arduino sketch.
description: >-
  A looper in which every loop is locked to the length of the first one. Each loop can be switched on and off on
  its own, and when all are off playback returns to the start. The first recording waits for the first sound after it
  is armed. The latest commit adds a second audio input, a start and stop control for all loops and a loop position
  indicator. The sketch includes a copy of DaisyDuino and a Petal header, so it is built for a Seed wired to its
  own buttons and display rather than for a finished Daisy product.
status: dormant
authors:
