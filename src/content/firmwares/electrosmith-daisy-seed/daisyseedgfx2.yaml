device: electrosmith-daisy-seed
name: DaisySeedGFX MK2
kind: tool
summary: C++ graphics library for a Daisy Seed driving ST7735 or ST7789 TFT screens over DMA SPI, with layered frame buffers, text, shapes, bitmaps and fonts held in flash.
description: >-
  Offers text, lines, rectangles, circles, arcs and bitmaps drawn into a frame
  buffer split into layers with transparency between them. Only the changed
  blocks of the buffer are sent to the display by SPI under DMA. The second
  version also supports fonts and bitmaps stored in flash, multi-frame images,
  colour inversion and a screen offset set in UserConfig.h. The DaisyPlatform pedal
  project uses it.
status: dormant
authors:
