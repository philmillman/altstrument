    url: https://github.com/DADDesign-Projects
source: https://github.com/DADDesign-Projects/DaisySeedGFX2
source_status: open
license: MIT
homepage: https://github.com/DADDesign-Projects/DaisySeedGFX2
distribution: source-only
install_notes: >-
  Add the source files to a libDaisy project and set the pins and screen type in
  UserConfig.h. The library writes nothing to the device by itself.
brick_risk: false
