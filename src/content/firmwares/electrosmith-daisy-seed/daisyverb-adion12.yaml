    url: https://github.com/adion12
source: https://github.com/adion12/DaisyVerb
source_status: open
license: MIT
license_notes: The LICENSE file is the MIT license, copyright 2024 Andrew Ionascu.
distribution: source-only
install_notes: >-
  Copy one of the reverb files into a libDaisy and DaisySP project and build it with the Daisy toolchain, then flash
  over USB DFU. Wire four pots to A0 to A3 first. The ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
