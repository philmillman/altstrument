device: electrosmith-daisy-seed
name: DaisyVerb (adion12)
summary: Reverb algorithms for a bare Daisy Seed in mono and stereo versions, covering a feedback delay network, Freeverb, Dattorro and Zita designs, with rendered audio samples and a small dev board design.
description: >-
  The repository holds separate source files for a feedback delay network reverb and a Freeverb in mono and stereo
  forms, plus Dattorro and Zita reverbs that the author wrote while developing for the Noise Engineering Versio.
  The code reads four potentiometers on the Seed's analog pins A0 to A3, wired between 3.3 V and ground.

  Recorded examples show the dry/wet and feedback gain controls on two pieces of source music. The author also
  published EAGLE schematic and board files for a small carrier board they built to avoid working on a breadboard.
  The repository carries no build files, so each file is compiled inside a libDaisy project of your own.
status: active
authors:
