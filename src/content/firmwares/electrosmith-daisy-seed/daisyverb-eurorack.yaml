device: electrosmith-daisy-seed
name: DaisyVerb (Eurorack module)
summary: Eurorack reverb module built around a Daisy Seed, with an Arduino sketch, KiCad schematic and board, and a panel design.
description: >-
  A reverb module for Eurorack that carries a Daisy Seed on its own board. The repository holds the KiCad project
  with a PDF and SVG of the circuit, the front panel artwork and a single Arduino sketch (DaisyVerb.ino) that runs the
  reverb on the Seed. The last commit swapped the knob assignments. The README is two lines long, so the controls
  are only documented by the sketch itself. Not the same project as the earlier Daisy Patch reverb listed
  under the Patch.
status: dormant
