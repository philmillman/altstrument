device: electrosmith-daisy-seed
name: Ethereal Harmonizer
summary: Guitar pitch tracker and interval harmonizer for a breadboarded Daisy Seed, adding a scale-quantized third or fifth over four octaves with a noise gate and dry mix.
description: >-
  The pedal tracks the pitch of the guitar input and adds a harmony note, a major or minor third in diatonic
  scales and a fifth for pentatonic and blues scales, quantized to the chosen scale across four octaves. The README and
  docs describe the hysteresis noise gate, transient rejection for pick attacks, a dry signal path, floating-point
  denormal flushing and DC blocking, plus a hardware setup page with a pin table, breadboard wiring and AC coupling
  for the Seed. The whole engine is a single source file.
status: active
authors:
