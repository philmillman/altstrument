device: electrosmith-daisy-seed
name: GyroBass
summary: Effects unit built into a bass guitar body, where a Daisy Seed reads an LSM6DS3 motion sensor and maps neck tilt to a filter sweep with overdrive and low-pass, notch, band-pass and bypass modes.
description: >-
  A Seed on a breadboard inside the instrument reads the IMU over I2C at 100 Hz and turns the tilt angle into the cutoff
  of a state variable filter, sweeping from about 160 Hz to 3.5 kHz, so the filter acts like a wah without a pedal. The
  signal path is a DC blocker, input gain, soft-clip overdrive, the filter and a blend with the clean signal; a button
  cycles the modes. Audio runs in the interrupt at 48 kHz while FreeRTOS tasks handle the sensor and the button. The build needs
  a one-line change to libDaisy's SysTick handler, flashing uses an ST-Link, and the README lists a custom filter,
  display and MIDI output as unfinished.
