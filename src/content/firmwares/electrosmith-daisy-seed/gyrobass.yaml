  and no line naming the project's author. FreeRTOS sources are bundled in src.
homepage: https://github.com/vitonol/GyroBass
distribution: source-only
install_notes: >-
  Clone with submodules, comment out SysTick_Handler in libs/libDaisy/Core/system.cpp as the README says, build libDaisy
  and DaisySP, then run make and make program with OpenOCD and an ST-Link. A bad image can be replaced through the
  ST-Link or DFU mode.
