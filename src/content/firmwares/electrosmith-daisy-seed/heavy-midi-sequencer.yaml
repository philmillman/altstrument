device: electrosmith-daisy-seed
name: Heavy MIDI Sequencer
summary: Pure Data patch for the Heavy compiler that plays a MIDI file as a polyphonic sequence on a Daisy Seed, with a Python script that turns a .mid file into table messages.
description: >-
  The repository holds a Pure Data patch made for export through Heavy to a
  Daisy Seed, a hvcc board definition for the Seed, and a Python script that
  reads a .mid file and writes the note data as messages for the patch's
  tables. Two example MIDI files are included. The documentation is a two-line
  text file, so the controls and the exact export steps are not described.
status: active
authors:
