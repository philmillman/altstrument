    url: https://github.com/bbparasite
source: https://github.com/bbparasite/Heavy-Midi-Sequencer
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  The Python script needs the mido library. Export the patch with the Heavy
  Compiler Collection for the Daisy Seed and flash the result over USB; the
  Seed is recovered through DFU mode if an image fails.
brick_risk: false
tags: [pure-data, sequencer, midi, codegen, open-source]
