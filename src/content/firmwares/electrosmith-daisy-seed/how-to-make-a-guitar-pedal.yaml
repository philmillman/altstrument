device: electrosmith-daisy-seed
name: How to Make a Digital Guitar Pedal
summary: Code, bill of materials and PCB files for a ten-episode YouTube course on building a Daisy Seed guitar pedal, with distortion and chorus programs for a breadboard Seed and a Pod.
description: >-
  Supporting material for a course on designing and assembling a digital pedal around a Daisy Seed. The code folder
  has a chorus pedal for the Seed, an Arduino IDE version of it, and chorus and distortion programs for the Daisy
  Pod. The episodes cover breadboarding the Seed, hard and soft clipping, the DaisySP library, an enclosure drill
  template, a KiCad schematic and board, ordering parts, UV-printed artwork and final assembly. The hardware folder
  includes Gerber files for the author's chorus pedal board. The course teaches the workflow and does not aim to
  reproduce one fixed pedal.
