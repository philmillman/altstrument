device: electrosmith-daisy-seed
also_devices: [electrosmith-daisy-patch, electrosmith-daisy-field]
name: libdaisy-rust
kind: tool
summary: Rust hardware abstraction layer for Daisy boards with audio, GPIO, ADC, SD card, SDRAM, flash and USB MIDI support, plus examples such as passthrough, delay and blinky.
description: >-
  A Rust crate (published as libdaisy) that wraps the STM32H750 peripherals of the Daisy Seed for bare-metal Rust
  programs. Its source covers the audio interface, GPIO and HID inputs, the SDMMC card, SDRAM, QSPI flash, a logger
  and memory protection. The examples folder has blinky, passthru, delay, knob, volume, switch, toggle, sdram,
  sdmmc, flash and USB MIDI programs. Binaries can be flashed with the Daisy web programmer, dfu-util or a debug
  probe through probe.rs. The README points to a separate one-button looper built on the crate. The last commit
  removed aliasing mutable references to the DMA buffers.
status: dormant
authors:
