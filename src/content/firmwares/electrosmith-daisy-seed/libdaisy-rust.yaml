    url: https://github.com/mtthw-meyer
source: https://github.com/mtthw-meyer/libdaisy-rust
source_status: open
license: MIT
license_notes: LICENSE is the MIT license, copyright 2021 Matthew Meyer.
homepage: https://docs.rs/libdaisy
distribution: source-only
install_notes: >-
  Add the thumbv7em-none-eabihf target and cargo-binutils, build an example with cargo objcopy --release -O binary,
  and flash the .bin with the Daisy web programmer or dfu-util. The README states a minimum Rust version of 1.82.
