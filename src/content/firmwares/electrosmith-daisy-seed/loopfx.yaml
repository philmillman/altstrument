device: electrosmith-daisy-seed
name: LoopFX
summary: Looper and multi-effects pedal for a Daisy Seed with a modular signal chain, with a C++ source, a Makefile and pedal PCB files.
description: >-
  A looper pedal that also runs effects in a configurable signal chain. The repository holds the C++ firmware
  (LoopFX.cpp), a Makefile, JSON files for the control and board layout in a Hardware folder and a photo of the
  prototype. The author's README is short and does not list effects or controls. A build folder with a compiled
  .bin from the author's own build is committed.
status: dormant
authors:
