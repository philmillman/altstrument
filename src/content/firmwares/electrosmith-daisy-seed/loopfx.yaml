    url: https://github.com/DavidJones10
source: https://github.com/DavidJones10/LoopFX
source_status: open
license: unspecified
license_notes: No licence file and no licence statement in the repository.
distribution: source-only
install_notes: >-
  Build with make using local copies of libDaisy and DaisySP, then flash with make program-dfu. A compiled
  build/LoopFX.bin is committed but is not a published release.
brick_risk: false
tags: [looper, fx, pedal, hardware, open-source]
