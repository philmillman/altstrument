device: electrosmith-daisy-seed
name: lx-deciim
summary: Two-channel bit-selecting bitcrusher Eurorack module on a Daisy Seed, where each of 12 bits can be switched off and replaced by a gate input, with KiCad hardware files and firmware.
description: >-
  Instead of reducing resolution from the lowest bit up, lx-deciim lets you disable any of the 12 bits of a 48 kHz
  signal. A disabled bit can be replaced by a trigger input that compares a CV against a reference of 0 V or 2.5 V,
  chosen with a jumper. The input can also be downsampled from 48 kHz to 1 kHz. The module is 12 HP and takes
  Eurorack-level signals.

  The repository has the KiCad main board and front panel, a Python script that generates the panel pattern, and the
  libDaisy firmware.
