    url: https://github.com/benjiaomodular
source: https://github.com/benjiaomodular/MiniVerb
source_status: open
license: MIT
license_notes: The LICENSE.md file is the MIT license, copyright 2023 Benjamin Joseph Jiao. It covers the hardware files and sketches alike.
distribution: source-only
install_notes: >-
  The sketches are built with the Arduino setup for the Daisy Seed and uploaded over USB; the repository gives no
  steps of its own. The ROM DFU mode stays available if an upload goes wrong. Build only the working board
  revisions the README names.
brick_risk: false
