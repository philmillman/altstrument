device: electrosmith-daisy-seed
name: MiniVerb
summary: Through-hole Eurorack reverb module built around a Daisy Seed, with KiCad hardware files for several board revisions and Arduino sketches for the Seed.
description: >-
  MiniVerb is a Eurorack module design that carries a Daisy Seed. The repository holds KiCad schematics, boards,
  fabrication files, panel artwork and bills of materials for four revisions. The README says versions 1.0 and 2.0
  do not work and that 2.1 is the working surface-mount version, with 1.1 as the corrected through-hole one.

  Firmware is written as Arduino sketches. The v1.x folder has a MiniVerb sketch, and the v2.x folder has Delay,
  Jitter and Octave sketches. The README does not describe what the sketches do or how to load them.
status: dormant
authors:
