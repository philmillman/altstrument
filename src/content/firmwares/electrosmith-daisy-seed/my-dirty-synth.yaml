device: electrosmith-daisy-seed
name: My-Dirty-Synth
summary: Arduino synth for a Daisy Seed in a Synthux Academy Simple Synth kit, with a four-shape oscillator, wavefolder, decimator, filter, VCA or lowpass gate and a custom MIDI front-panel PCB.
description: >-
  The sketch uses Electrosmith's DaisyDuino library. An oscillator with sine,
  triangle, saw and square shapes can mix in its first two octaves, then passes
  through a wavefolder and a decimator, a filter with no-filter, high-pass,
  low-pass and band-pass settings, and a VCA, lowpass gate or both. The
  repository has the KiCad front-panel PCB for the MIDI parts and notes how to add the
  wavefolder to DaisyDuino.
status: dormant
authors:
