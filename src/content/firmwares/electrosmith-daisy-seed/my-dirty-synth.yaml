    url: https://github.com/lucblender
source: https://github.com/lucblender/My-Dirty-Synth
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement.
distribution: source-only
install_notes: >-
  Open the sketch in the Arduino IDE with DaisyDuino and add the DaisySP
  wavefolder files as the README describes. The build needs Synthux's Simple
  Synth kit parts plus the custom MIDI panel. A Seed recovers through DFU mode
  after a bad upload.
brick_risk: false
