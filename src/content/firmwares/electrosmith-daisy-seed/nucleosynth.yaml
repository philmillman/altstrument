device: electrosmith-daisy-seed
name: STM32 Daisy Seed NucleoSynth
summary: Six-voice virtual analog synth for a bare Daisy Seed played over USB MIDI, with two oscillators, a four-pole filter and ADSRs per voice, several LFOs and MIDI-editable parameters.
description: >-
  A port of the author's 2006 NucleoSynth to the Seed, using libDaisy for USB MIDI and audio and the HAL for the
  engine. Each voice has two oscillators (saw or pulse-width square, mix, detune and scale), a VCA and a resonant
  filter with separate envelopes, keyboard follow and velocity routing. LFOs act on pitch, both pulse widths and the
  filter. The README names a Miditech keyboard as the controller and says the project was forked from an earlier
  Seed polysynth. The repository description mentions a Karlsen low-pass filter, and the last commit fixes an audio output offset.
