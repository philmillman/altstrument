device: electrosmith-daisy-seed
name: Olm (Pure Data patches)
summary: Pure Data patches for the Olm, a battery-powered generative sculpture and ambient synthesizer built on a Daisy Seed, with Plugdata and Heavy-compiled C++ exports for the Seed.
description: >-
  The sound generation for Olm, an interactive object that randomly generates ambient soundscapes and music, housed
  in a handmade plywood, plaster and aluminium case. The repository has the Pd patches, a desktop version that runs
  in Pure Data or Plugdata, a component list for the author's own Olm PCB, and the C++ files that Plugdata's Heavy
  export produced for the Seed. On the device, three dials push the randomisation further instead of shaping
  specific parameters, and two buttons store and recall states. The README describes raising the audio block size to
  256, using -O3 and a larger message pool to cut CPU load. The author calls the project nearly complete.
