distribution: download
install_notes: >-
  Put the Seed into USB mass-storage mode by holding BOOT, pressing RESET and releasing BOOT, then copy main.bin from
  the Firmware Master folder to the drive. Alternatively build with make and use make program-dfu. The ROM DFU mode
  stays available if a flash goes wrong. The repository is over 160 MB because of a video file.
