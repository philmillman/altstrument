device: electrosmith-daisy-seed
name: Ouroboros Loop Station
summary: Five-track stereo looper built on a Daisy Seed with its own through-hole PCB, front panel and 3D-printed case, controlled by buttons and knobs with per-track speed, pan and volume.
description: >-
  Ouroboros records five stereo layers of about 33 seconds each at 48 kHz. Holding a layer button and turning a knob
  sets that layer's speed from 0.3 to 2 times and its pan, each layer has a volume knob, and there is a master volume
  and tempo control. Inputs are a Hi-Z guitar input, a microphone input with a preamp, and stereo line in.

  The repository holds the firmware source, a prebuilt main.bin built by the author, schematics, Gerber files for two
  PCB revisions, a bill of materials, a front panel design and enclosure models. PCB 1.1 is marked as tested and 1.2
  as beta. A single-board version is planned.
