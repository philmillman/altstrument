device: electrosmith-daisy-seed
name: PENDAII Software
summary: Framework and delay effect for the author's PENDAII stereo pedal hardware, which pairs a Daisy Seed with a TFT display and a WM8731 codec; the author has deprecated it in favour of OSCAR.
description: >-
  The project is a C++ framework for building effect pedals on the PENDAII board, so that effect code deals only with
  signal processing. It handles the audio codec, SDRAM and QSPI flash storage with per-effect preset saving, an
  ST7789 TFT user interface, and a CPU load monitor. The one bundled effect is a delay with a main line of 0.1 to 1.5
  seconds, a second line with rhythmic subdivisions, modulation and bass and treble control on the echoes.

  The project is built in STM32CubeIDE. A notice at the top of the README, added in July 2026, says the author has
  abandoned it in favour of a project called OSCAR. The board design is in a separate PENDAII-Hardware repository.
status: archived
