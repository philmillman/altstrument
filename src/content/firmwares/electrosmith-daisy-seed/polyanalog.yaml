device: electrosmith-daisy-seed
name: PolyAnalog
summary: Four-voice polyphonic virtual analog synth for a Daisy Seed wired to 19 pots, a MIDI input and an SSD1306 OLED, with two oscillators, filter, two LFOs and 16 presets.
description: >-
  The firmware targets a hand-built Seed instrument whose parts list and schematic are in the README: a multiplexer
  feeding 19 potentiometers, a DIN MIDI input through an optocoupler, four buttons, a mono audio output and a 128x64
  OLED. Each voice has two oscillators with saw, supersaw and pulse-width square waves, noise, glide, an ASR envelope
  and a resonant low-pass filter with envelope, followed by a global high-pass. Two LFOs have selectable
  destinations, the mod wheel and pitch bend are handled, and 16 presets can be stored and recalled with Program Change.
  After a preset loads, the knobs use soft takeover. The synth listens on MIDI channel 5 only, and the README lists the
  CC map.
status: active
authors:
