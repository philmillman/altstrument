homepage: https://github.com/alexiszbik/polyanalog
distribution: source-only
install_notes: >-
  Clone with submodules and build with make using the Daisy toolchain, then flash over USB DFU. A bad image is replaced
  by putting the Seed back into DFU mode. The TestApp folder holds a JUCE test build for desktop.
brick_risk: false
