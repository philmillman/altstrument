device: electrosmith-daisy-seed
name: Polyphonic Saw via USB MIDI
summary: Test firmware that plays USB MIDI notes from a computer on a bare Daisy Seed as a 24-voice saw organ, with a Python virtual keyboard and a prebuilt binary.
description: >-
  The program merges code from the DaisyExamples USB MIDI and Field polysynth examples into a basic polyphonic organ
  with a sawtooth per note. It needs only a USB cable and an audio lead on output pin 18 and analog ground. A PyGame
  script sends MIDI from the computer, and the README suggests Neothesia to play MIDI files. The README says the
  prebuilt binary can be flashed with the Daisy web programmer and notes that Windows needs the WinUSB driver set with Zadig.
status: dormant
