homepage: https://github.com/zvodd/DaisySeed--polyphonic_saw_via_USB_MIDI
distribution: download
install_notes: >-
  Flash precompiled/DAISY_SEED_USB_MIDI_FIRMWARE.bin with the Daisy web programmer, or build with make. A bad image is
  replaced by putting the Seed back into DFU mode.
