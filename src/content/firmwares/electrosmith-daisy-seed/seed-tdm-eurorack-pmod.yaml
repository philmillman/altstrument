device: electrosmith-daisy-seed
name: Daisy Seed TDM for Eurorack PMOD
summary: Example program that drives the apfelaudio Eurorack-PMOD multichannel codec board from a Daisy Seed using a libDaisy fork with TDM support for the AK4619 codec.
description: >-
  Shows how to feed a Daisy Seed from a TDM codec. It uses a libDaisy fork on a feature branch that adds TDM
  SAI support and an AK4619 driver, and a small driver for the Eurorack-PMOD board that sets up the codec and its LED
  VU meter. The README lists the wiring between the Seed's pins and the PMOD header. The code is a demonstration of
  multichannel audio rather than a finished instrument, and it is tied to the fork rather than to Electrosmith's
  mainline libDaisy.
status: dormant
authors:
