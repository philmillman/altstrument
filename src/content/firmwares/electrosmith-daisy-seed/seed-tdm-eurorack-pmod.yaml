    url: https://github.com/heartwerktech
source: https://github.com/heartwerktech/daisy_seed_tdm_eurorack_pmod
source_status: open
license: unspecified
license_notes: No licence file and no licence statement in the repository.
distribution: source-only
install_notes: >-
  Clone with --recursive so the libDaisy fork submodule is fetched, wire the Seed to the PMOD as listed in the
  README, then build with make and flash over USB DFU.
brick_risk: false
