device: electrosmith-daisy-seed
name: Sitira Embedded Daisy
summary: Rust firmware for the Sitira granular eurorack module, with a Daisy Seed, a 2.2 inch screen, live-input, SD-streamed and delay modes, and knob or CV control of grain parameters.
description: >-
  Sitira is a 34 HP module built around a Daisy Seed; this repository holds its firmware, while the PCB design is in a
  separate repository. It is written in Rust on the stm32h7xx HAL and a libdaisy-rust copy, and uses the author's
  granulator crate. The modes are live recording from the input, streaming WAV files from a micro SD card and a
  real-time delay. Offset, grain size, pitch, delay and velocity can each be spread randomly, and the grain
  envelope has an extra parameter. The last commit on the default branch is from 2023.
