homepage: https://www.impracticaldevices.com/docs/devices/str500/
distribution: source-only
install_notes: >-
  Build the board and enclosure from the files provided, then load the Pure Data patch onto the Seed using the
  Pd-to-Daisy workflow described in the STR500_code README and the project site.
brick_risk: false
tags: [granular, sampler, pure-data, gestural, hardware, open-source]
