device: electrosmith-daisy-seed
name: STR-500
summary: Pure Data granular sampler patch, KiCad board and enclosure files for the STR-500, a gestural instrument built on a Daisy Seed and a salvaged Gametrak string controller.
description: >-
  A gestural granular synthesizer from Impractical Devices. A salvaged Gametrak string controller steers playback of
  a recorded sample, and the sound is made by a Pure Data patch that runs on the Seed. The repository has the main
  patch and a single-grain patch with the component definition file, the KiCad schematic and board, laser-cut and
  etched lid files for the v1.2 enclosure, a manual and PCB build instructions. The README names v1.2 as the
  working version.
status: active
