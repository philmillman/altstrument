device: electrosmith-daisy-seed
name: SynthMachine
summary: Prototype modular synth modules built around SSI2130 oscillator and SSI2140 filter chips with a Daisy Seed, with KiCad boards and a Seed firmware project.
description: >-
  The repository collects KiCad designs for a VCO Machine and a controller board, plus a Seed firmware project named
  SYNTHMACHINE. The boards use DAB2130 and DAB2140 breakout boards for the analog chips, so they carry DIP footprints
  instead of QFN ones. The author calls it very much a prototype and credits TimMJN's Polymorph VCO for reference on
  audio and CV levels.

  The firmware folder also contains the author's own build output, including an ELF, hex and bin file. The README
  asks you to build with a current libDaisy and DaisySP rather than use it.
