device: electrosmith-daisy-seed
name: Takshaka
summary: Four-voice supersaw desktop synthesizer for a Daisy Seed on the Synthux Simple platform, with sub oscillator, overdrive, low-pass and comb filters, an ADSR, an LFO and USB MIDI control.
description: >-
  A synthesizer from Song Naga built on the Synthux Academy Simple synthesizer design board with a Daisy Seed. The
  supersaw oscillator follows Adam Szabo's thesis on emulating the Roland JP-8000 sound. Knobs set supersaw drift and
  shift, sub level, drive, low-pass cutoff and resonance, comb delay and feedback, and the envelopes and LFO. The
  synth has four-note polyphony, and USB MIDI input controls every parameter. The repository holds the C++ source
  and the author's own build output, including a compiled takshaka.bin.
