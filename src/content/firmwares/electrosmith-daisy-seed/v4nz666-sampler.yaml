device: electrosmith-daisy-seed
name: Sampler (v4nz666)
summary: Looping sampler for a bare Daisy Seed with gated recording, overdubbing, loop decay and a non-linear playback speed curve, read from a record switch and analog controls.
description: >-
  A single C++ sampler program that records into SDRAM. The commit history adds recording that is gated by a switch,
  a non-linear response curve for playback speed, then overdubbing and a loop decay setting. An LED flashes to
  confirm actions. The code reads one switch and several analog inputs, but the README is the unedited example
  template, so the wiring and control assignments are only visible in the source.
