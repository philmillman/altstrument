device: electrosmith-daisy-seed
name: VasVas Noisebox
summary: Noisebox with two piezo pickups and a Daisy Seed effects processor that runs a Dattorro reverb with a freeze mode and a shimmer effect, with KiCad board files and source.
description: >-
  VasVas is a plywood noisebox that uses two piezo pickups as the left and right inputs, which gives a stereo signal
  at the output. Firmware 1.0 contains a reverb based on the Dattorro design, with delay lines and all-pass filters
  whose sizes change proportionally and a long decay that can be frozen, and a shimmer effect that extracts the second
  harmonic. The case has four pots, a button and two LEDs, and the README leaves the vibrating parts, such as springs
  and plates, up to the builder.

  The repository holds the schematic, KiCad board, bill of materials and the source with its libraries. The author
  says later versions may change the effects without changing the hardware.
