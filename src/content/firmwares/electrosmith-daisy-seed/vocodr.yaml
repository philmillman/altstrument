device: electrosmith-daisy-seed
name: vocodr
summary: Channel vocoder for a Daisy Seed that turns a microphone signal into a robot voice, with a blog post that covers the preamp, schematics and sound samples.
description: >-
  A short C++ program that implements a channel vocoder. The author describes it as semi-functional, says they were
  new to vocoders and DSP, and suspects logic errors in the signal processing. The linked blog post walks through
  the build, starting with a microphone preamp, because the Seed needs line-level input.
status: dormant
authors:
