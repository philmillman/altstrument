    url: https://github.com/dbusteed
source: https://github.com/dbusteed/vocodr
source_status: open
license: unspecified
license_notes: No license file or statement in the repository.
homepage: https://dbusteed.github.io/daisy-seed-vocoder/
distribution: source-only
install_notes: >-
  Build with make using the Daisy toolchain and flash over USB DFU. A microphone needs an external preamp in front of
  the Seed's line input. The ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
