device: elektron-analog-rytm
name: Plock
kind: tool
summary: Browser pattern editor for the Analog Rytm over Web MIDI. It pulls the current pattern and kit by SysEx, edits trigs, parameter locks, retrigs, micro-timing and sound locks in a step grid, and sends the result back. It also opens and saves .syx dumps and exports MIDI.
description: >-
  The grid shows 12 tracks of up to 64 steps over two pages, with flags for accent, mute, swing and slide and lock trigs. A step
  panel edits every SYN, SMP, FLTR, AMP and LFO parameter lock, trig conditions, retrig settings and sound locks, and a track name
  opens its defaults, speed and length. A groove template adds per-track shuffle and a per-track MIDI export was added in June 2026.
  A built-in preview plays rough 909-style voices and the page lists what it ignores, such as parameter locks and samples. The
  byte layouts come from libanalogrytm and are for firmware 1.70, said to work with 1.72. The page, labelled v0.9.0-beta,
  warns that sending SysEx can overwrite patterns, kits, sounds and settings, and tells users to back up first. It
  connects to the first MIDI port with "rytm" in its name. The page says it was built by a human and a Claude.
status: active
authors:
  - name: Plenty of Names in the Club
    url: https://plentyofnam.es/
source: https://github.com/plentyofnames/plock
source_status: open
license: MIT
license_notes: The repository has no LICENSE file; its README ends with a section stating MIT.
homepage: https://plentyofnam.es/plock/plock.html
distribution: browser-installer
requires_stock: "1.70"
install_notes: >-
  Open the page in a Chromium browser, connect the Analog Rytm over USB, press Connect and then Get from AR, or load a
  .syx dump. Back up projects with Elektron Transfer first. An EMPTY RESET (hold FUNC while powering on) and Transfer can
  restore the unit if something goes wrong.
brick_risk: false
