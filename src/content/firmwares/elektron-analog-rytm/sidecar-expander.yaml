device: elektron-analog-rytm
name: Sidecar | Expander
summary: Raspberry Pi 4B or Pi 5 voice and effects expander for the Analog Rytm MKII, driven from the Rytm through a patched OS 1.74 (1.73 up to release 0.4.4) that you build from your own stock file; the Analog Four MKII has a separate mod.
description: >-
  The Pi sits on the Rytm's USB port and plays extra machines on the Rytm's tracks, among them Plaits, DaisySP, JUNO,
  6-operator FM, multisample, wavetable, granular and a sample chopper, along with send and insert effects, master FX, LFOs, a
  recorder, the Pi's own poly-capable sequencer and a MIDI machine. The Rytm's firmware is changed with a set of OS mods
  that add pages on the unit to drive the Pi, which you apply to your own official OS file with elekloader or the browser
  patcher; there is one build per OS version. The Pi runs from an SD card image and is configured from a web page, a
  touchscreen or the Rytm. Overbridge can pass through the Pi to a computer. A Teensy 4.1 version, Sidecar Mini, is frozen
  at 0.1.0. The project calls itself unofficial and experimental, lists what is tested on hardware and what only in an
  emulator, and keeps no Elektron firmware in its repositories.
status: active
authors:
  - name: trigcondition
    url: https://github.com/trigcondition
source: https://github.com/trigcondition/sidecar-firmware
source_status: open
license: GPL-2.0-or-later
license_notes: >-
  The README says the project's own code is GPL version 2 or, at your option, any later version. The Raspberry Pi engine
  links the Circle library (GPLv3), so the Pi binary as a whole is distributed under GPL version 3. Third-party components
  and their licences are listed in THIRD_PARTY_LICENSES. The Rytm mods live in a separate sidecar-mods repository, also
  under the GPL. No Elektron firmware is included.
homepage: https://trigcondition.github.io/sidecar-expander/
distribution: patch-your-own
requires_stock: Analog Rytm MKII OS 1.74 (1.73 up to release 0.4.4)
install_notes: >-
  Build the Rytm firmware from your own stock Analog-Rytm_MKII_OS1.74.syx file (OS1.73 for releases up to 0.4.4) with elekloader or the browser
  patcher, send it with Transfer, then set up the Pi from the release's SD card image and set the Rytm's USB CONFIG to
  Overbridge. Back up projects first. To go back, send the stock file of the OS you want the same way. A Rytm that does not
  boot recovers from the startup menu: hold FUNC at power on, press TRIG 4 (OS UPGRADE) and send the stock file over DIN MIDI,
  which takes about 16 minutes or more.
brick_risk: false
tags: [expander, synth-engine, effects, sequencer, mutable-instruments-port, raspberry-pi, patcher, overbridge]
versions:
  - version: v0.5.2
    date: 2026-11-27
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.5.2
    notes: >-
      Adds MORPH between two scenes, a sidechain on every insert chain, WAVETABLE v2 with a second table and nine warps, and scene editing on the Rytm's own pages. The looper is switched off in this build. Flash the Rytm's 0.5.2 files as well; Pi 0.5.2 with Rytm 0.5.2 is the tested pair.
  - version: v0.5.1.2
    date: 2026-11-24
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.5.1.2
    notes: >-
      Pi-only fix release; the Rytm firmware stays 0.5.1.1 (0.5.0 also works). FILL and the other keys that wait for the Rytm's hello now work when the Pi starts or updates while the Rytm is already on, and the CONNECTED screen no longer stays up. Install with Install it anyway ticked once when updating from 0.5.1 or 0.5.0.
  - version: v0.5.1.1
    date: 2026-11-22
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.5.1.1
    notes: >-
      Fixes release for the Pi 4B and Pi 5 that runs with the Rytm still on firmware 0.5.0. Adds a black box download from Settings, audio previews in the catalog and several fixes. Two optional Rytm files stop stray samples under Sidecar machines and smooth machine list scrolling. Install with Install it anyway ticked once, because 0.5.1 and 0.5.0 cannot compare a four-number version.
  - version: v0.5.1
    date: 2026-11-17
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.5.1
    notes: Pi-only update, installed from Settings > Update on a Pi running 0.5.0; the Rytm stays on firmware 0.5.0. Adds new touchscreen themes and layouts, touch controls on the Pi's screen, a community machine catalog in the web page and the BP303 bass machine, and fixes a halt when the USB-C cable is pulled during traffic.
  - version: v0.5.0
    date: 2026-11-16
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.5.0
    notes: Adds the SAMPLER machine, a reworked CHOP, SAMPLE EDIT, FILL, the MIST user machine, the Rytm's own parameters on the XY pad and MIDI learn, two more LFOs per track, user send effects, a new web page with updating from it, and ready-made SD card images. Sidecar voices play about 9 dB lower to stop clipping. Comes with Rytm firmware 0.5.0, which needs OS 1.74.
  - version: v0.4.4
    date: 2026-11-10
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.4.4
    notes: Shows a held step's values on the SRC view, makes the pads' octave keys work on the SEQ and ARP pages, lets one NO leave a page opened by its shortcut and shows the CONNECTED screen when the Rytm boots after the Sidecar. Comes with Rytm firmware 0.4.4 for OS 1.74 and 1.73; a Rytm on 0.4.0 still works with the new card files.
  - version: v0.4.3
    date: 2026-11-09
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.4.3
    notes: Fixes the CHRO pads on poly tracks, including silent first hits and tracks using JUNO, PLAITS, DAISYSP, MD or user machines, and redraws the Rytm's screen less often to cut sluggishness. New card files only; the Rytm keeps its 0.4.0 firmware.
  - version: v0.4.2
    date: 2026-11-08
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.4.2
    notes: Overbridge passthrough on the Pi 5. New card files only; the Rytm keeps its 0.4.0 firmware.
  - version: v0.4.1
    date: 2026-11-06
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.4.1
    notes: Fixes for USB dropouts and for the Rytm returning after its cable is pulled, and opt-in Overbridge passthrough on the Pi 4.
  - version: v0.4.0
    date: 2026-11-04
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.4.0
    notes: Master FX, a SAT saturator, the MIDI machine, an arpeggiator, a USER SLOTS page and Analog Four MKII support; the Rytm firmware 0.4.0 is released with it for OS 1.74 and 1.73.
  - version: v0.3.0
    date: 2026-10-30
    url: https://github.com/trigcondition/sidecar-firmware/releases/tag/v0.3.0
    notes: Poly tracks played by the Sidecar's sequencer, new machines (multisample, wavetable, granular, chop, live in), an amp insert that loads NAM captures and a recorder.
