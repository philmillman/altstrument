device: elektron-digitakt-ii
also_devices: [elektron-digitakt, elektron-analog-rytm, elektron-model-samples]
name: ElekPrep Transfer
kind: tool
summary: Closed browser app, labelled ElekPrep v0.1, that preps audio for Elektron samplers and sends it over Web MIDI SysEx to the +Drive. It has Transfer and +Drive Manager views and device profiles for the Digitakt II, Digitakt, Analog Rytm and MKII and the Model:Samples.
description: >-
  Dropped files or folders are trimmed with handles that snap to zero crossings, converted to the device format and sent into
  a +Drive folder you pick or create. The Transfer view tracks queued uploads, and a +Drive Manager view browses the connected
  device's files. The page asks for a connected unit before it offers the +Drive folder list, and shows no device found
  when none answers. It shares its name and page title with the open-source ElekPrep sample prep page, but neither
  project mentions the other and no source repository was found for this one. The page was updated on 3 November 2026.
status: active
authors:
  - name: Unknown
    url: https://elekprep-transfer.vercel.app/
source_status: closed
license: proprietary
license_notes: A hosted app with no source repository, no licence text and no author credit.
homepage: https://elekprep-transfer.vercel.app/
distribution: browser-installer
install_notes: >-
  Open the page in a Chrome or Edge browser, connect the unit over USB and press Connect USB, then allow MIDI with SysEx
  access. Choose the device profile and a destination folder on the +Drive.
brick_risk: false
tags: [sample-transfer, sampler, librarian, web-midi, sysex, usb-midi, web, utility]
