device: elektron-digitakt
name: Digitakt Pattern Editor
kind: tool
summary: Native desktop pattern editor for the original Digitakt, written with JUCE. It downloads patterns or a project over USB MIDI, edits trigs and sample locks, uploads samples to the +Drive and plays patterns offline. Not a browser tool.
description: >-
  Rights warning: the repository commits prebuilt Linux VST3 and CLAP plugin binaries for Dexed, Junior, Pivot,
  Monomodule One and Sala, together with their guides, presets, tables and themes. These are other people's work and are not
  covered by the BSD licence of the editor.

  The app asks the machine for a pattern or a whole project over SysEx, or listens while you start a dump on the device,
  and sends edits back. It edits the step grid, imports a MIDI file onto it, and sets a different +Drive sample on any step
  through sample parameter locks. A +Drive tab lists, creates folders, uploads converted audio to the machine and
  downloads samples as WAV, and a sample pool mirrors the 128 slots so patterns play from the computer with no Digitakt connected.
  A Remote tab makes the editor the clock master and plays the Digitakt's own samples with notes. The MIDI tracks
  can drive hosted VST3 or LV2 instruments, and USB audio can resample them into the Digitakt. Its format layer is a C++ port
  of the author's earlier Python tool, which derives from elk-herd, and a test checks that both write identical files. It targets the first Digitakt; the author says it builds on Linux,
  macOS and Windows and was built on Linux.
status: active
authors:
