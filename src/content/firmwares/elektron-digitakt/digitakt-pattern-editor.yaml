source: https://github.com/mk3stn3r/digitaktEditor
source_status: open
license: BSD-2-Clause
license_notes: >-
  LICENSE.txt is the BSD 2-Clause text with Mark Lentczner's copyright, from elk-herd. It says the project is a derivative
  of elk-herd, whose storage formats, offset tables, seven-bit codec and blank pattern data it uses. The bundled plugin
  binaries and presets have their own terms.
distribution: source-only
install_notes: >-
  Build with CMake; JUCE is fetched on the first configure. Set USB CONFIG to USB MIDI on the Digitakt. Sending a pattern
  needs the machine at SETTINGS > SYSEX DUMP > SYSEX RECEIVE > PATTERN, and Auto-send in the Remote tab overwrites the
  chosen slot on every edit, so point it at a scratch pattern.
brick_risk: false
