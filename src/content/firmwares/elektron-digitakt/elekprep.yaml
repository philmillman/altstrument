    url: https://github.com/luizvarela
source: https://github.com/luizvarela/elektron-sample-prep
source_status: open
license: MIT
homepage: https://luizvarela.github.io/elektron-sample-prep/
distribution: browser-installer
install_notes: >-
  Open the hosted page in any current browser, export the WAV, and copy it to the device with Elektron Transfer,
  Elektroid or USB. The page is a single HTML file and can also be opened from a clone.
