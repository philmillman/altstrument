device: elektron-digitakt
also_devices: [elektron-digitakt-ii, elektron-analog-rytm, elektron-model-samples]
name: ElekPrep
kind: tool
summary: Single-page browser sample prep tool for Elektron samplers. It trims at zero crossings, converts to 48 kHz 16-bit WAV, works out loop lengths from BPM and steps, and has profiles for four devices. It does not use MIDI; files go to the device through Transfer or Elektroid.
description: >-
  Audio files of any format the browser can decode are dropped in, a device profile sets the target format and a warning
  about length limits, and the page exports a WAV. Features include trim handles that snap to zero crossings, a loop
  calculator from tempo and step count, optional peak normalisation, an A/B preview, zoom with a minimap, loop playback,
  dragging the whole trim region and batch conversion. The profiles are Digitakt, Digitakt II, Analog Rytm and Model:Samples.
  Processing happens locally and nothing is uploaded.
status: active
authors:
