device: elektron-digitone-ii
name: DigiGlide
summary: >-
  Beta modification of Digitone II OS 1.12 that plays a whole chord from one key or trig and glides its voices into the next chord along shaped paths, made on your computer from your own copy of the official OS file.
description: >-
  DigiGlide adds four pages after a synth track's own SYN pages, on FM TONE, WAVETONE, FM DRUM and SWARMER tracks. One key or one trig plays a chord set by type, extension, key and voicing, and when the next chord arrives its voices glide to it instead of jumping. Per track settings cover glide time, path, timing, voice order, moves such as Bloom, Cascade and Spiral, drift, vibrato and scrubbing. It is a port of the glide engine of Brickglide, which is part of the catalogued brickchord project. The manual describes play modes, bass patterns, pure tuning, ten DigiDrone sounds, two DigiGlide tracks at once and a boot splash.

  The repository holds no Elektron firmware. A Python patcher (Python 3.10 or newer, nothing else) checks that the file you give it is the official Digitone_II_OS1.12.syx by hash, applies DigiGlide's compiled patch and writes the image only when it is byte for byte the tested result. The author asks that the resulting image is not shared, since it contains Elektron's firmware. The README marks it as beta, played on one unit with most checks run in emulators, and says settings and storage formats can still change between builds. It is unofficial and not endorsed by Elektron. The credits name dnfw, digihealth, digiemu, digikit, digitone-2-modding-skill and Digiwerk as sources of the loader, emulator tooling and notes.
