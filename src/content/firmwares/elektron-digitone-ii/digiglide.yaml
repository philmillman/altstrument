based_on: trimui-brick/brickchord
homepage: https://michaeltietjen.github.io/digiglide/
distribution: patch-your-own
requires_stock: "1.12"
install_notes: >-
  Back up the +Drive with Elektron Transfer and keep the official Digitone_II_OS1.12.syx. Download the repository, run python3 install/digiglide_patch.py on your own copy of that file, and send the DN2_1.12_DIGIGLIDE_35.syx it writes to the unit with Transfer, as for an OS update. If the unit starts but misbehaves, send the official OS file the same way. If it does not start, hold FUNC while powering on, press TRIG 4 (OS UPGRADE) and send the official file to the MIDI IN socket through a DIN MIDI interface, which takes 12 to 15 minutes and does not use USB. A DIN MIDI interface is needed for that route.
