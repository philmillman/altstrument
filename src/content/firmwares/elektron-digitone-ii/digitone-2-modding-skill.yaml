device: elektron-digitone-ii
name: digitone-2-modding-skill
kind: tool
summary: "Agent skill and dev kit for writing Digitone II OS 1.11 mods: a ColdFire C mod builder, SHARC DSP block tools, two emulators, static hardware-rule checks, a USB flasher and two worked examples."
description: >-
  Installed with the skills.sh tool for coding agents such as Claude Code, but
  most of the repository is ordinary scripts and notes. It holds reverse-engineering
  notes (stock addresses, hook sites, the ColdFire-to-DSP frame, free memory), a
  list of hardware rules that emulators cannot catch, a ColdFire mod builder, a
  SHARC boot-stream block adder, a DSP kernel language with a bit-exact model, a
  whole-DSP SHARC emulator and a USB flasher. A cfatlas.py script lists functions,
  callers, classes, vtable slots and strings from the C++ type information in your
  own image. The ColdFire side is tested in
  digikit. The two examples are double_time, a C hook that doubles the sequencer
  clock, and track_trim, a DSP mod that lowers track 1 by 6 dB, and both pass
  their emulator tests. It needs your own copy of Elektron's OS 1.11 file, which
  is not included, plus dnfw, digikit and an m68k GCC. The README names Overtone
  as a firmware made with it, which targets OS 1.12.
status: active
authors:
  - name: Julian Kominiak
    url: https://github.com/complex-ping
source: https://github.com/complex-ping/digitone-2-modding-skill
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT. THIRD-PARTY.md lists the files derived from digikit
  (fastemu.py, fastblock.c and digikit-local.patch) as GPL-2.0. It says the
  repository holds no Elektron firmware, and the README asks users not to
  redistribute Elektron's firmware or modified images of it.
distribution: source-only
requires_stock: "1.11"
install_notes: >-
  Run npx skills add complex-ping/digitone-2-modding-skill, then ask the agent to
  set up the workspace with scripts/dn2setup.py, which checks each dependency.
  You need Python 3.11 or later, dnfw, an m68k GCC and digikit, and your own OS
  1.11 .syx (sha256 beginning 2af43e65). The README says a unit can be recovered
  by reflashing the stock OS over DIN MIDI (hold FUNC at power-on, press TRIG 4),
  and that flashing modified firmware is at your own risk.
brick_risk: false
tags: [sdk, emulator, scripting, python, research]
