device: elektron-digitone-ii
name: Digiwerk
summary: "Custom firmware for the Digitone II on OS 1.12 that adds 42-channel USB audio, Déjà vu and in-key LFO waves, new arp modes, a 3-band master compressor, a flanger and a tape echo, built from your own OS file in the browser or by a notarized Mac patcher app."
description: >-
  Formerly published as dn2-cfw, a research notebook; version 0.1.0 is the first
  release under the Digiwerk name. Every build is a base plus a choice of effects
  for four slots. From 0.3.0 the base adds a USB CONFIG choice, USB MULTI/MIDI,
  that presents the unit as a class-compliant USB audio device with 42 inputs at
  48 kHz and 24 bits (16 tracks as stereo pairs, the main mix, three effect
  returns and the audio inputs). The base also adds LFO waves after RAND: a looping run of random
  values, a version that restarts on each trig, versions that snap the loop to a
  scale, and from 0.2.0 one that follows the track's key, plus one-cycle and
  half-cycle LFO modes and the arp modes SHUF, RAND and TM, which also work on
  MIDI tracks. The effects are a three-band master compressor (CMP3), a flanger
  (FLNG) and, from 0.2.0, a tape echo (TAPE). A spring reverb (SPNG) shipped in
  0.2.0, but the author withdrew all six builds that include it (EEES, CEES, EFES,
  EETS, CFES and EFTS) on 30 Oct 2026: on a Digitone II, CFES and EFTS go silent or
  buzz within a second of starting while the screen keeps working, and the other
  four run the same spring code. The Digiwerk Patcher macOS app, or the
  digiwerk-patch command-line tool, checks that your file is Elektron's original
  OS 1.12 by hash and saves a build only if it matches the tested result; no
  Elektron firmware is included. From 0.3.0 the same patcher also runs in the
  browser, with nothing uploaded.
  tools/brickcheck runs 12 checks that each build must pass, and recovery from the
  STARTUP menu over DIN MIDI was tested on the author's unit. The Déjà vu LFO
  follows Kári Garðarsson's design for the Digitakt II. Kits saved on Digiwerk
  lose the new settings when opened on stock OS 1.12. The README says the project
  is part of Modwerk and was made with Claude.
status: active
