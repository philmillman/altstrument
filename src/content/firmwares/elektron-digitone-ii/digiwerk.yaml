source: https://github.com/naturarum/dn2-cfw
source_status: open
license: GPL-2.0-or-later
homepage: https://naturarum.github.io/dn2-cfw/
distribution: patch-your-own
requires_stock: "1.12"
install_notes: >-
  Back up projects and the +Drive with Elektron Transfer first. Use the patcher
  page in a browser, or download Digiwerk Patcher from the release (macOS 13 or
  later), and drop Elektron's own Digitone_II_OS1.12_dist.zip on it, choose the effects for each slot, and send the resulting .syx
  to the Digitone II with Transfer. Keep the original OS file, since Elektron's
  page lists only the current version and it is needed to go back. If the unit
  does not start, hold FUNC at power-on, press TRIG 4 (OS UPGRADE) and send the
  stock file over DIN MIDI. If USB CONFIG is set to USB MULTI/MIDI, pick one of
  Elektron's own choices before going back, since Elektron's OS reads it as USB MIDI. If you installed one of the withdrawn spring reverb
  builds, send another build or Elektron's Digitone_II_OS1.12.syx with Transfer.
tags: [fx, lfo, arpeggiator, compressor, delay, patcher, research, usb-audio]
