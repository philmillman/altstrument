device: elektron-digitone-ii
also_devices: [elektron-digitone]
name: DNX
kind: tool
summary: Browser tools for Digitone and Digitone II projects over Web MIDI. An expander spreads a Digitone 1 sketch over the 16 tracks of a Digitone II, a manager moves patterns between slots and projects, and a library browses the +Drive presets and backs it up.
description: >-
  The expander gives each sound that a Digitone 1 track switches between with sound locks its own track on a Digitone II,
  with its trigs and locks. The manager moves, copies, swaps, clears and renames patterns across banks and projects with undo,
  and an Insights view reports polymeter cycles, trigs stored past a track's end, voice use and key fit. The library lists the 2,048 +Drive presets with tags, renames them
  and drags them into a project's sound pool, and a wavetables pane works on a Digitone II running the Waverider firmware, where it can install the two original tables, Prim. and Harm., on builds that have no built-in tables and keep an older project's saved table values. Backups of every project, soundbank and kit
  go into one .dnx file; global settings are not included because the instrument cannot send them. Writing is off until a toolbar switch is
  turned on, a copy of the old contents is saved before anything is replaced, every write is read back, and the loaded
  project is never written to. A probe page asks an instrument what it is and captures what it sends. The core is a separate
  package and there is a command-line version. The project is a beta, and its documentation grades each format claim as
  verified, decoded, inferred or unknown.
status: active
