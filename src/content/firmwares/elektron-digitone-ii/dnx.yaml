license: AGPL-3.0-or-later
license_notes: >-
  The README names AGPL-3.0-or-later and package.json agrees. A different licence is offered on request. The repository
  vendors web/vendor/dksample.wasm, the sample converter from digikit (AGPL-3.0-or-later), the Prim. and Harm. wavetable files from the dn2_firmware project (same licence, generated from formulas with no Elektron data, per the docs), and commits one test zip.
homepage: https://noiseandmatter.github.io/DNX/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a Chromium browser and allow MIDI with SysEx; Firefox and Safari have no Web MIDI. Close
  Elektron Transfer and Overbridge first. Turn WRITE on only when you want to change the instrument, and keep the copy it
  saves before each write.
brick_risk: false
