versions:
  - version: v1.3
    date: 2026-11-04
    url: https://github.com/complex-ping/overtone/releases/tag/v1.3
    notes: Brings LFO 3 back, so MOD has three LFOs and two envelope followers again; sounds saved on earlier versions keep ARP 2 and start LFO 3 at defaults. Every LFO, follower and arp knob can be a destination for the others, with grouped DEST lists, and page changes respond faster.
  - version: v1.2
    date: 2026-10-30
    url: https://github.com/complex-ping/overtone/releases/tag/v1.2
    notes: Adds instant pattern switch (hold PTN and press YES or NO), which makes a picked pattern take over at the next step at the position it would have reached; saved with the project.
  - version: v1.1
    date: 2026-10-30
    url: https://github.com/complex-ping/overtone/releases/tag/v1.1
    notes: Reworks GROOVE with presets, a drift control that offsets each cycle at random, random weights and arrow-key editing, and restores FUNC + TEMPO as tap tempo.
  - version: v1.0.1
    date: 2026-10-29
    url: https://github.com/complex-ping/overtone/releases/tag/v1.0.1
    notes: Fixes installing Elektron's OS or an Overtone update with Transfer while Overtone is running.
  - version: v1.0
    date: 2026-10-29
    url: https://github.com/complex-ping/overtone/releases/tag/v1.0
    notes: First release; superseded by 1.0.1.
