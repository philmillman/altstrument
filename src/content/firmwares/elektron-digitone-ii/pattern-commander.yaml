device: elektron-digitone-ii
name: Digitone II Pattern Commander
kind: tool
summary: Closed browser tool that loads Digitone II .dn2prj or SysEx project files, copies and moves patterns between slots and between projects, and saves the result.
description: >-
  The tool is a page on the Dissonant Witchcraft soundpack site, and the site's description says it runs in the browser.
  Its page text says only that it needs JavaScript, so the details here come from that description and the author's
  Elektronauts post of 2026-11-17. The post calls it free and says the author made it with AI assistance and reviewed
  the code. No source repository, licence text, version number or privacy statement for the tool itself is published;
  the site states that it uses no analytics or advertising cookies. The page does not say whether it talks to the
  unit over Web MIDI or only edits files.
status: active
authors:
  - name: Dissonant Witchcraft
    url: https://dissonantwitchcraft.com/
source_status: closed
license: proprietary
license_notes: A hosted app with no source repository and no licence text. The forum post and the site call it free.
homepage: https://dissonantwitchcraft.com/tools/digitone-ii-pattern-commander
distribution: browser-installer
install_notes: >-
  Open the page in a browser with JavaScript enabled, load a project file, move the patterns and save the file.
  Keep a copy of the original project before sending a changed one back to the unit.
brick_risk: false
tags: [editor, librarian, web, sysex, patterns]
