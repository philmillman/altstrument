source: https://github.com/rumorismo/Elektron-Mods
source_status: open
license: GPL-2.0-or-later
license_notes: >-
  Stated only in modules/dn-monomachine/mod.json; the repository has no LICENSE file. The ports derive from MIT-licensed
  upstream code, and the reference sources in modules/ are gitlinks to other authors' repositories.
homepage: https://github.com/rumorismo/Elektron-Mods
distribution: source-only
requires_stock: 1.44 (1.43 reported compatible)
install_notes: >-
  Compile the module with an m68k ColdFire cross compiler, link it with elekloader against the official OS file you
  supply, and send the result with Elektron Transfer. Nothing in the repository replaces the bootloader, and the author
  leaves hardware flashing to the user.
brick_risk: false
tags: [machines, synth-engine, sequencer, emulator, os]
