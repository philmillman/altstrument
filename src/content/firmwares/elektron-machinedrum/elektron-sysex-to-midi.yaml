device: elektron-machinedrum
name: elektron-sysex-to-midi
kind: tool
summary: Small Windows command-line tool, written in C#, that converts Machinedrum pattern SysEx dumps into MIDI files, built to read the patterns in Autechre's released 2008 dumps. It reads files only and does not use MIDI ports.
description: >-
  Rights warning: the repository commits 128 MIDI files extracted from Autechre's 2008 live-set SysEx dumps, in a folder and as a
  zip, along with a built Windows executable. The music data is not the author's and the repository has no license.

  The tool reads trig data for the 16 tracks of a pattern and writes a single-track MIDI file. It does not handle
  accents, swing, kit contents or Monomachine dumps, which the README lists as possible additions. The last commit is from January 2019.
status: dormant
authors:
