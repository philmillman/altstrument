device: elektron-machinedrum
name: MD Sample
kind: tool
summary: Single-page converter that turns an audio file into a MIDI Sample Dump .syx for the Machinedrum UW. It runs offline in the browser with no MIDI access, so you send the file with another tool.
description: >-
  Reads WAV and AIFF in common bit depths, and other formats through the browser's decoder, plays back the mono conversion,
  and writes a mono 16-bit sample dump at 44.1, 22.05 or 11.025 kHz with device ID 0 and sample number 0, loop off. Downsampling
  uses a 48-tap windowed-sinc filter and there is no normalising. Input is limited to 80 MiB and 180 seconds. Node tests
  check decoding, packet checksums and counter rollover, and the README says hardware transfer has not been validated by
  them. The page makes no uploads, analytics or MIDI requests. The README calls it an unofficial community tool.
status: active
authors:
