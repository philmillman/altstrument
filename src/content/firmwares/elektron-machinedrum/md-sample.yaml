    url: https://github.com/mathieustaub
source: https://github.com/mathieustaub/md-sample
source_status: open
license: GPL-3.0-only
license_notes: The LICENSE file is the GPL v3 text; the README and source make no statement about later versions.
homepage: https://mathieustaub.github.io/md-sample/
distribution: browser-installer
install_notes: >-
  Open the hosted page, choose an audio file, listen to the preview and download the .syx. Choose the destination slot
  on the Machinedrum before sending the file with a SysEx tool.
brick_risk: false
