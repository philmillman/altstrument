device: elektron-machinedrum
name: MDMM (Machinedrum and Monomachine Editors)
kind: tool
summary: Desktop editors for the Machinedrum and the Monomachine that run the unit's own OS in an emulator, as a standalone app or a VST3/AU plug-in, with an optional hardware MIDI mode.
description: >-
  Two separate apps, one per instrument, each showing a step grid, parameter-lock
  lanes, kit, pattern and song libraries, a mixer and a sampler view on one
  screen. Edits can be undone, projects save inside a DAW session, and SysEx can
  be imported and exported. A beta mode drives a real unit over MIDI instead of
  the emulation. The project's own installers target macOS; Windows and Linux
  builds are published but marked untested. It builds on the Gearmulator DSP56300
  emulator and an earlier Machinedrum/Monomachine emulation by the GitHub user joelanders. No
  Elektron OS is included or linked: you supply your own file for each machine,
  which the app copies into its ROM folder, and the unit itself is never flashed.
status: active
authors:
  - name: radekdymacz
    url: https://github.com/radekdymacz
source: https://github.com/radekdymacz/mdmm
source_status: open
license: GPL-3.0-only
license_notes: Bundled third-party code (Monocypher, JUCE, the Gearmulator-derived emulators) keeps its own notices.
homepage: https://mdmm.dev
distribution: download
requires_stock: Machinedrum OS 1.63 and Monomachine OS 1.32B (supplied by you)
install_notes: >-
  Download the installer from the GitHub releases page; the macOS packages are
  not signed or notarised, so they need Open Anyway in Privacy and Security.
  On first start, point the editor at your own official OS file for the machine.
tags: [editor, emulator, midi, sequencer]
