  - version: mdmm-v0.9.0
    date: 2026-11-06
    url: https://github.com/radekdymacz/mdmm/releases/tag/mdmm-v0.9.0
    notes: Adds a Machinedrum sample manager with copy, paste, RAM to ROM, rename, erase, undo and WAV or SDS export, a Monomachine DigiPRO waveform manager, undo for SysEx import and Empty Reset, and a fix for the song LOOP row and the OJMP value. The release body carries an unsigned-build warning.
