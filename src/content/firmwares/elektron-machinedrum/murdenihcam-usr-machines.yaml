device: elektron-machinedrum
name: murdenihcam USR machines
summary: Seven user-machine families for the Machinedrum running the MDX X.20 B firmware, with a slicer, a time stretcher, a granulator, a modulation effect and RAM granulator, pitch shifter and stretcher machines.
description: >-
  Each machine is a small DSP program sent to the unit as SysEx and stored in a
  Machine Manager slot, so the OS itself is not replaced. SMP-SL slices samples
  at detected transients, SMP-ST stretches samples with adjustable grain size and
  jitter, SMP-GR is a granulator, and NFX-MO is a modulation effect with flanger,
  chorus, doubler, pitch-shifting and frequency-shifting modes. The sample machines
  come in versions for the UW ROM plus the internal E12 samples, ROM only, or E12
  only, and only the E12-only versions suit non-UW units. Three RAM machines, RAM-GR, RAM-PS and RAM-ST, work on
  live audio held in memory as a granular delay, a two-voice pitch shifter and a time stretcher, and are for the UW only.
  A project site lists the machines with parameter notes, demos and downloads. Source files and build
  scripts are in the repository next to the prebuilt .syx files. The author states
  that the code was written with LLM assistance and that the machines are
  unaffiliated with the MDX developers.
