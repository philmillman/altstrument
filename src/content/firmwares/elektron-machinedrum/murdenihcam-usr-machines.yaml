homepage: https://murdenihcam.github.io/murdenihcam-usr-machines/
distribution: download
requires_stock: MDX X.20 B
install_notes: >-
  Needs a Machinedrum already running the third-party MDX X.20 B firmware. Back up
  first. Open Machine Manager on the unit (FUNC+GLOBAL, FILE), pick an empty slot
  and receive, then play the .syx file from a SysEx librarian app. Reloading the
  kit or power cycling clears glitchy sound that can appear on tracks already using
  user machines right after an install.
