device: elektron-machinedrum
name: Say A!
kind: tool
summary: Browser sample prep and transfer tool for the Machinedrum UW. It shifts each sample so its root note lands on an A for MegaCommand's chromatic mode, resamples it, processes loops, and sends it over MIDI Sample Dump or saves WAV and .syx files.
description: >-
  Dropped WAV files are read for root note and loop points, with a pitch detector as a fallback, then pitched and resampled in
  a single windowed-sinc pass at twice the target rate, loop-snapped, optionally cross-faded and cropped, and dithered
  to 16-bit. A queue mirrors the Machinedrum's 32 or 48 sample slots with a memory gauge and 4-character names, and sends
  selected or all slots over SDS with closed-loop handshake or open-loop timing and optional turbo speeds. Exports are WAV,
  a 32-bit float WAV and SDS .syx, and existing .syx or .sds files can be dropped onto a slot. An experiment lab sends
  deliberately odd SDS headers to see how the unit reacts. Two Python scripts convert between WAV and SDS. The page needs Web MIDI with
  SysEx.
status: active
authors:
