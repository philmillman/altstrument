device: elektron-machinedrum
name: SM
kind: tool
summary: Closed browser sample manager for the Machinedrum UW that uses MIDI Sample Dump Standard over Web MIDI. The page shows 48 slots with a waveform view, loads and exports WAV and .syx files, and has reverse, invert, loop and name controls.
description: >-
  Single page, labelled version 1.1 and 2025 in its header. It asks for MIDI access, connects to a Machinedrum with a variant
  setting, and shows the slots with names, a waveform with draggable loop markers, a bank loader and
  bank export, a volume control and a globals dialog. Per sample it loads, deletes, exports as .syx or .wav, toggles the loop,
  renames and applies reverse or invert, and a help page and sample rate options are included. There is no source repository, and the
  author's home page shows a GitHub account with no repository for it.
status: unknown
authors:
