    url: https://fyris.me/
source_status: closed
license: proprietary
license_notes: A hosted app with no source repository and no licence text.
homepage: https://sm.fyris.me/
distribution: browser-installer
install_notes: >-
  Open the page in a Chromium browser, press Request MIDI Access, and pick the Machinedrum ports and variant.
brick_risk: false
