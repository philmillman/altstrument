device: elektron-model-cycles
name: BIAS
summary: Source package for BIAS, a six-oscillator percussion machine for Model:Cycles OS 1.13 with a wavefolder, written clean-room after Noise Engineering's published description of the Basimilus Iteritas Alia. It is for porting, and the machine is also on the Cycles Engines flasher.
description: >-
  Six oscillators with their own envelopes are summed, folded and given a second envelope after the folder, all on a clock locked
  to the note. The Cycles' knobs set the harmonic spread, the wave shape, the ratios, the fold amount, the decay and a pitch drop
  on the clock. The code is fixed-point C for the ColdFire, with a generator for its tables, a host build for comparison and an
  emulator test on the OS's own voice loop. The repository is a machine package for model27, with a fixed-slot tweak for Modded
  Cycles 2.0, and its own scripts clone model27 at a pinned commit and drop the package in. It is not a firmware and holds
  none; you regenerate and check it against your own official OS file. The README says the owner played it on a Model:Cycles on
  2026-11-03 in slot 11 as Cycles Engines composes it, that it is heavy on the processor, and that it does not combine with five
  model27 Track FX packages because of 15 overlap problems. A French technical note covers addresses and measurements.
status: active
authors:
  - name: 100demons
    url: https://github.com/100demons
source: https://github.com/100demons/bias
source_status: open
license: MIT
license_notes: >-
  MIT for everything in the repository, with a copy of the licence in the machine folder so a port can keep it under MIT. The
  repository commits a compiled object of the machine (bias.o) and a tweak file whose old-byte values are short checksums of
  the stock file. Its notices say no Noise Engineering code, table or sample and no Elektron firmware is included.
homepage: https://100demons.github.io/cycles-engines/flasher/
distribution: source-only
requires_stock: "1.13"
install_notes: >-
  This repository builds nothing that can be installed. To try the machine, use the Cycles Engines web flasher with your own
  official model-cycles_OS1.13.syx. To port it, run scripts/setup-model27.sh to get a model27 checkout with the package, then
  gen_bias.py and the emulator test against your own OS file; the object build and the test need m68k-elf-gcc. The script
  still clones the original model27 repository, which is gone; its pinned commit 3b4e972 is in nicolai-creates/model27.
brick_risk: false
tags: [machines, synth-engine, drums, oscillator, emulator, open-source]
