homepage: https://tkawamu0622-cmd.github.io/model-cycles-web-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge with the Model:Cycles connected over USB. For transfers set CLK IN on and CLK
  OUT off, PCH IN on, RCV NOTE and RCV CC on, and the AUTO channel to match the app, then press REC and PLAY on the unit and the
  track's transfer button in the app. Set the input from to USB in MIDI settings.
