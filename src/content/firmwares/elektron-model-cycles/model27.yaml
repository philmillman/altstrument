device: elektron-model-cycles
name: model27
summary: Beta fork of Modded Cycles 1.55 for Model:Cycles OS 1.13 that keeps the browser mod picker and Control All Config but offers only a short list of mods, starting with a one-shot SAMPLE machine; the rest build from the command line.
description: >-
  The author describes a smaller, curated take on Modded Cycles, with mods that
  declare what they touch so that compatible combinations can be worked out
  rather than listed by hand. The web flasher builds the OS in your browser from
  your own official file and sends it over USB. It currently offers thirteen cards:
  the SAMPLE machine from the author's Cycles One-Shot, a one-shot sampler for
  samples on the +Drive, Control All Config, two delay effects (Digital Delay
  and POTS), trig conditions that put A:B before the percentages, drumkilla's
  trig preview, and five Track FX: Samples, which puts SAMPLE's filter on any
  track, Crush, a sample-rate and bit reducer, Ring, a ring modulator, Reso, a
  tuned resonator, and EQ, a three-band equalizer. The two newest cards are a CPU
  page in SETTINGS that shows how much of the Model:Cycles' processing time the sound takes, and RESAMPLE, which
  records a track, the main mix or USB audio and saves the take as a sample in /recordings. Since 0.38 POTS runs its
  loop at 6 kHz, which cuts its load to about a third and changes its sound slightly. The README, at release 0.42,
  says up to six added machines can be combined and that every card was played
  on a Model:Cycles as the page builds it. Every other
  Modded Cycles 1.55 mod stays buildable with the command-line tools until the
  author decides which to offer. A Manager page keeps one project per firmware and, on Switch, backs up the
  current project, flashes the other firmware over USB and restores that
  firmware's project. The Modded Cycles startup animation is left out
  of the flasher as that project's branding. The rules a mod follows are set out in a separate
  draft standard, the Cycles Mod Standard (draft 0.5), in its own repository.
status: active
