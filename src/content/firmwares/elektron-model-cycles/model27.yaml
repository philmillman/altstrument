device: elektron-model-cycles
name: model27
summary: Beta fork of Modded Cycles 1.55 for Model:Cycles OS 1.13 that keeps the browser mod picker and Control All Config but offers only a short list of mods, starting with a one-shot SAMPLE machine; the rest build from the command line.
description: >-
  The author describes a smaller, curated take on Modded Cycles, with mods that
  declare what they touch so that compatible combinations can be worked out
  rather than listed by hand. The web flasher builds the OS in your browser from
  your own official file and sends it over USB. The README lists sixteen cards, the sixteenth being SOLID, a machine for struck sounds such as strings, bars and bells:
  the SAMPLE machine from the author's Cycles One-Shot, a one-shot sampler for
  samples on the +Drive, Control All Config, two delay effects (Digital Delay
  and POTS), trig conditions that put A:B before the percentages, drumkilla's
  trig preview, five Track FX (Samples, which puts SAMPLE's filter on any
  track, Crush, Ring, Reso and EQ), a CPU page in SETTINGS, RESAMPLE, which
  records a track, the main mix or USB audio and saves the take as a sample in
  /recordings, Transpose, and CHORD Tables, which lets the CHORD machine play
  wavetables from the +Drive, one per pattern. Since 0.38 POTS runs its loop at
  6 kHz, which cuts its load to about a third and changes its sound slightly.
  The README says up to six added machines can be combined and that every card
  is played on a Model:Cycles. Every other Modded Cycles 1.55 mod stays
  buildable with the command-line tools until the author decides which to offer.
  An Uploader page puts audio files and folders onto the +Drive over USB. A
  Manager page keeps one project per firmware and, on Switch, backs up the
  current project, flashes the other firmware over USB and restores that
  firmware's project. On SAMPLE tracks, MACHINES + PUNCH or GATE with trigs held
  locks Loop or Reverse on those steps. The Modded Cycles startup animation is
  left out of the flasher as that project's branding. The rules a mod follows
  are set out in a separate draft standard, the Cycles Mod Standard.
  The author took this repository and their other Cycles repositories offline
  on 2026-11-06 and 2026-11-07. Another person kept a restoration at
  nicolai-creates/model27 meanwhile. The original repository and its hosted web
  flasher were public again on 2026-11-09; the author's other Cycles tools and
  the standard's repository were still offline.
status: active
