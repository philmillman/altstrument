license: MIT
license_notes: >-
  Modded Cycles' copyright for what comes from it, model27's for the changes.
  Third-party code (Braids, Open303, Model-TG, elektron-model-tweaks and others)
  keeps its own license, listed in THIRD-PARTY-NOTICES.md. No Elektron firmware
  is included.
homepage: https://github.com/nicolai-creates/model27
distribution: source-only
requires_stock: "1.13"
install_notes: >-
  The hosted web flasher no longer exists. Serve the docs folder locally or build with tools/build.py from your
  official model-cycles_OS1.13.syx, then send the result to the Model:Cycles; the restorer has not tested either route.
  Back up projects and samples with Elektron Transfer first. To return to stock, send the official file the same way, after
  setting any track that uses an added machine back to one of the six original
  machines. The README describes recovery from the startup menu through MIDI IN.
