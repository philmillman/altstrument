    date: 2026-11-05
    url: https://github.com/AveyCole/Supermodel/commit/ada11e9144c36621f78a9cd9021275252b466521
    notes: No tagged releases; this is the latest commit, which releases Supermodel 3.06 across the editions. It adds an INV voice-steal order, master FX kept per pattern, a fix for FX restoration during live pattern changes and a hardened Track Swap, on top of 3.05's Track Swap page. The only GitHub release is a wavetable archive.
