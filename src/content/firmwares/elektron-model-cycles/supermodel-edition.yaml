device: elektron-model-cycles
name: Supermodel Edition
summary: Fork of Modded Cycles for Model:Cycles OS 1.13 with a separate Supermodel 909 flasher that replaces the six stock machines with a 909-style kit, plus the ACID machine, Sequence Genie, a second LFO and MIDI Bank.
description: >-
  Rights warning: the repository commits 83 prebuilt Supermodel upgrade files under docs/flasher/, each about 2 MB with Elektron's SysEx header, although its README says no Elektron firmware, original or modified, is included. See license_notes.

  Built on Modded Cycles by A.V. and published as a fork of it. The Supermodel
  909 flasher page asks for the official OS file and four of your own WAV files
  (closed hat, open hat, crash, ride), converts them in the browser and builds
  the firmware locally. Nothing is uploaded and no samples are hosted. The 909
  voices come from Model909 by DMDaudio. The fork's main flasher also carries
  extra machines such as RETROSYN, Sample Wizard integration, ChordKeys and
  other options in its own selection. MIDI Bank data is held in RAM only and is
  lost at power-off. The README's current documentation was for release 3.05,
  which it says covers song mode, direct pattern jump, trig selection, per-track
  ACID glide and legato, arp envelope retriggering and Wizard lock priority.
  Release 3.06 adds an INV option to the overload governor, keeps master FX with
  each pattern and fixes FX restoration when patterns change during playback;
  3.05 added a Track Swap page under Mod Setup that exchanges two tracks
  while the sequencer is stopped, and 3.04 added a double-tap PATTERN latch and a
  choice of voice-stealing policy. The author reports hardware tests of the 909 edition on
  2026-10-14.
status: active
