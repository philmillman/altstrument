device: elektron-model-cycles
name: Supermodel Edition
summary: Fork of Modded Cycles for Model:Cycles OS 1.13 with a separate Supermodel 909 flasher that replaces the six stock machines with a 909-style kit, plus the ACID machine, Sequence Genie, a second LFO and MIDI Bank.
description: >-
  Built on Modded Cycles by A.V. and published as a fork of it. The Supermodel
  909 flasher page asks for the official OS file and four of your own WAV files
  (closed hat, open hat, crash, ride), converts them in the browser and builds
  the firmware locally. Nothing is uploaded and no samples are hosted. The 909
  voices come from Model909 by DMDaudio. The fork's main flasher also carries
  extra machines such as RETROSYN, Sample Wizard integration, ChordKeys and
  other options in its own selection. MIDI Bank data is held in RAM only and is
  lost at power-off. The author reports hardware tests of the 909 edition on
  2026-10-14.
status: active
