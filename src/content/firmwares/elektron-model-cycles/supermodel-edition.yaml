source: https://github.com/AveyCole/Supermodel
source_status: open
license: unspecified
license_notes: >-
  The fork has no LICENSE file at its root (the upstream Modded Cycles repository
  has an MIT one). Bundled components carry their own MIT notices, such as
  LICENSE-Punch.txt, which is the file GitHub reports as the repository's
  licence. The repository also commits 83 prebuilt Supermodel upgrade files in
  docs/flasher/ (Full, Lite and Optional builds from 2.53 to 3.06, sixteen of them added
  with 3.04 to 3.06). They are about 2 MB each and start with Elektron's SysEx manufacturer
  header, so they are complete modified OS images that probably contain Elektron's
  code. The README says no Elektron firmware, original or modified, is included, and
  the repository states no permission from Elektron; the stock file was not available
  to compare, so this was not checked byte for byte.
homepage: https://aveycole.github.io/Supermodel/flasher-supermodel-909/
distribution: browser-installer
requires_stock: "1.13"
install_notes: >-
  Open the Supermodel 909 flasher in a Web MIDI browser, add your four WAV files
  and your official Model:Cycles OS 1.13 file, then flash over USB. Back up
  projects and samples with Elektron Transfer first and start from an empty
  project when moving off the stock machines. The "Official firmware" tab
  returns to stock.
tags: [machines, drums, sampler, sequencer, lfo, midi, fx]
versions:
