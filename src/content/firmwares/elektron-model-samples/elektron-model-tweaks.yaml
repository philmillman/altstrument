device: elektron-model-samples
name: elektron-model-tweaks
summary: "Web flasher and command-line tweaks for Model:Samples and Model:Cycles OS 1.13: 16-channel USB audio, latching mute, trig preview, scrolling names, M:S-only stereo samples and time-stretch. Includes the Model:Cycles tweaks."
description: >-
  Mods are .elemod files, one folder per device, linked into your firmware by
  elekloader's linker. The web flasher can download the built file or send it over
  USB MIDI from Chrome or Edge. Some tweaks are also carried by Modded Cycles and
  Model-TG. The README warns modification voids the warranty and could brick the
  device.
status: active
authors:
  - name: drumkilla
    url: https://github.com/drumkilla
source: https://github.com/drumkilla/elektron-model-tweaks
source_status: open
license: MIT
license_notes: The vendored ms-multi-output code keeps its own MIT notice by Scott Metoyer (LICENSE-ms-multi-output).
homepage: https://drumkilla.github.io/elektron-model-tweaks/flasher/
distribution: browser-installer
requires_stock: "1.13"
install_notes: >-
  Use the web flasher with your own .syx, then send it with Elektron Transfer or straight over USB MIDI.
  The README says only the main OS section is changed and the bootloader and updater are carried over
  byte for byte, so the startup menu (power off, hold FUNC, power on, then OS UPGRADE) stays available to
  reinstall stock.
brick_risk: false
tags: [usb-audio, sampler, ui, flasher]
