based_on: elektron-model-samples/underpass
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge, Firefox 108 or later, or Opera, connect the Model:Samples over USB, pick the
  input and MIDI ports, then record and stop. The sample appears in inbox/0 on the unit, or at the Sample ID you set.
