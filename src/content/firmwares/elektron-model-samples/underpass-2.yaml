device: elektron-model-samples
name: underpass-2
kind: tool
summary: Fork of underpass, the browser sampler that records audio and sends it to a Model:Samples over Web MIDI. It is rewritten in TypeScript and adds a record gate that drops leading silence, a single record toggle and more stable transfers.
description: >-
  Rights warning: the repository commits Elektron's Model:Samples and Transfer user manuals as PDF and text files.

  The fork keeps the original's flow: pick an audio input, record at 48 kHz, sum to mono and send the sample as a MIDI
  Sample Dump to the inbox folder or a chosen sample number. Changes listed in the README are a move to TypeScript with
  Vite and Tailwind, a single record and stop button, fixes to sample rate handling and mono summing, steadier transfers with clearer
  progress, an in-app help panel, and a gated recorder that waits for audio above a threshold and keeps a short pre-roll
  so the attack is kept. The README also lists Firefox 108 and later on desktop as working. It was
  made with Claude Code, according to the commit history and a CLAUDE.md in the repository, and keeps the original
  copyright notice.
