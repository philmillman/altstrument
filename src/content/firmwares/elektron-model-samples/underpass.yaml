  choice of any later version.
homepage: https://mlnoga.github.io/underpass/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, connect the Model:Samples over USB, choose the input and the MIDI ports, press record
  and then stop. On the unit, open the sample selection and look in inbox/0.
brick_risk: false
