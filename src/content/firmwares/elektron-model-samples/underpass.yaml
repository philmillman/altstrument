device: elektron-model-samples
name: underpass
kind: tool
summary: Single-page browser sampler for the Model:Samples. It records from any audio input, or resamples the unit's own USB audio output, and sends the result to the unit as a MIDI Sample Dump over Web MIDI into the inbox slots.
description: >-
  The page lists audio inputs and MIDI ports, shows a level meter, records at 48 kHz 16-bit, sums to mono and
  sends the take as sample dump packets, numbering samples from 0 in the unit's inbox folder or at a number you choose.
  It is plain HTML, CSS and JavaScript with two audio worklets, with no framework. The author tested it on Chrome on
  Windows 10 and says Android may have problems with the class-compliant USB audio and iOS cannot work because Safari
  has no Web MIDI. The last commit is from December 2021. A later fork, underpass-2, rewrites it in TypeScript.
status: dormant
authors:
