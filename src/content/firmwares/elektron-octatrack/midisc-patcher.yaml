    date: 2026-09-18
    url: https://github.com/bkkbrls-del/midisc-patcher/commit/1ce22456a01dc149d598d2b3808b8a6b36c82e41
    notes: No tagged releases; this is the latest commit, which freezes 1.40MIDISC8.1.
