device: elektron-octatrack
name: octabam
summary: Modular "remixer" build that adds bus and per-track effects, an FM synth machine, 255 kits per project, USB audio and MIDI, and fixes for stock bugs.
description: >-
  A modification is a module, a named selection of modules is a remix, and the
  build composes a remix into a flashable image from your own OS 1.40C: it
  places the code, wires hooks by symbol, refuses collisions by name and
  checks every ported module against its author's own build byte for byte.
  Community mods such as Octatrick, PassOS, midisc and Octaplay are built on
  it. No firmware is distributed and a
  built image must not be shared. Pull requests are accepted; issues are
  disabled.
status: active
authors:
  - name: Sam Banks
    url: https://github.com/sambanks
  - name: Contributors credited per module
source: https://github.com/sambanks/octabam
source_status: open
license: MIT
license_notes: Covers the repository's own code and docs; transcribed third-party DSP sources and carried community modifications keep their own terms.
homepage: https://modwerk.app/
distribution: patch-your-own
requires_stock: 1.40C
install_notes: >-
  Build from your own stock 1.40C .syx, in the browser builder named in the
  release notes or with the repository's tools, then flash with Elektron
  Transfer or from the CF card. Bootloader is not modified.
tags: [fx, machines, usb-audio, usb-midi, bugfixes]
video:
  url: https://www.youtube.com/watch?v=GGpkCyshUak
  title: 'Octabam testing round 1'
  credit: Sam Banks
  first_party: true
versions:
  - version: v0.4
    date: 2026-11-08
    url: https://github.com/sambanks/octabam/releases/tag/v0.4
    notes: Adds a SHATTER effect on FX2 and restores the side-chain compressor, limits OCTA303 to two machines per Part, and fixes dropped and cut USB MIDI input and output. The author says this build has not run on a unit.
  - version: v0.3
    date: 2026-11-08
    url: https://github.com/sambanks/octabam/releases/tag/v0.3
    notes: LOAD KIT and SAVE KIT show their own titles, and FUNC+YES in LOAD KIT no longer arms all tracks. Superseded by v0.4 the same day.
  - version: v0.2
    date: 2026-11-01
    url: https://github.com/sambanks/octabam/releases/tag/v0.2
    notes: Adds VARISPEED, a fifth TSTR position on STATIC and FLEX tracks, and removes FX2 LOCK from the octabam remix because it stopped FX2 picks from taking effect. The author lists some checks as not yet run on a unit.
  - version: v0.1
    date: 2026-11-01
    url: https://github.com/sambanks/octabam/releases/tag/v0.1
    notes: First numbered release, built in the browser on your own 1.40C. The author marks it superseded by v0.2 because its FX2 LOCK blocks FX2 effect picks.
  - version: "MIDI SCENES engine latch (PR #754)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/754
    notes: MIDI SCENES now follows the engine's bank and Part latch each playback step, so a direct pattern jump re-mixes the scenes in the same step.
  - version: "REC THRESHOLD armed indicator (PR #728)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/728
    notes: An armed track's status icon blinks, and the IN level meter falls back faster after the input goes quiet.
  - version: "EUCLID FILL (PR #735)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/735
    notes: Adds a TRACK+PAGE page that writes a Euclidean rhythm (STEPS, PULSE, ROT) as sample trigs on the held tracks.
  - version: "RND NAME (PR #729)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/729
    notes: FUNC+CUE in the name editor fills in a random two-word name for new projects, saved samples, directories and sets, and Kits.
  - version: "STEM REC window (PR #724)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/724
    notes: STEM REC opens in its own UP+REC window so it can be used alongside BRAIN.
  - version: "Remix selection persists (PR #745)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/745
    notes: The chosen remix is saved on the card and restored at boot; refused saved-data files now get keep, skip, replace or back-up choices.
  - version: "LOFI2 insert (PR #734)"
    date: 2026-10-15
    url: https://github.com/sambanks/octabam/pull/734
    notes: Adds LOFI2, a ring modulator or stereo frequency shifter followed by sample-rate and bit reduction, to the octabam-inserts remix (FX2 only).
  - version: "BRAIN beta screens (PR #714)"
    date: 2026-10-14
    url: https://github.com/sambanks/octabam/pull/714
    notes: BRAIN gains Part-based templates and PERFORMANCE, LOG and ABOUT screens, with defaults applied on project creation (beta, port-tested).
  - version: "GATE VERB (PR #718)"
    date: 2026-10-14
    url: https://github.com/sambanks/octabam/pull/718
    notes: Adds a gated plate reverb insert with a GATE control that closes the wet signal after the input falls quiet.
  - version: "STEM REC STATS.TXT (PR #644)"
    date: 2026-10-13
    url: https://github.com/sambanks/octabam/pull/644
    notes: STEM REC writes a STATS.TXT with each take, uses less interrupt time, and T8 stops being a source while MASTER TRACK is on.
  - version: "Stations on FX1+FX2 (PR #713)"
    date: 2026-10-13
