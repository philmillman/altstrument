  - version: "octabam-core, inserts and bus remixes (PR #709)"
    date: 2026-10-13
    url: https://github.com/sambanks/octabam/pull/709
    notes: Adds the octabam-core, octabam-inserts and octabam-bus official remixes.
  - version: "REC THRESHOLD (PR #687)"
    date: 2026-10-13
