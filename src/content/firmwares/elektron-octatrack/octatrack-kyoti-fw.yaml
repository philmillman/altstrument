device: elektron-octatrack
name: OT Kyoti FW
summary: Feature and bug-fix builds that keep the stock feel, with mute modes, direct pattern jump, a sidechain compressor with key input, tempo-locked varispeed, repitch, project reload and batch fixes. Tested on an MKI.
description: >-
  Every feature is off by default so a freshly flashed unit behaves like stock;
  bug fixes are always on. Features include MUTE_MODES (OT, OTFX, OTFX-T, DT-T),
  DIRECT_JUMP_KYOTI, SIDECHAIN_COMPRESSOR, RELOAD_FROM_PROJECT, repitch
  (REPITCH_REPEAT98_KYOTI), VARISPEED, REC_TRIG_MUTE (TRACK + REC toggles the
  recorder-trig mute of each held track), live-record quantize toggle and trigless-lock
  cleanup. KYOTI V1.7 is the current combined image. BLACKPYRAMIDS_303, a
  TB-303 voice added as a track machine (BLKPYRAMD, built on Open303), is a
  separate standalone build and is not in the V1.7 image. Unpromoted builds refuse to
  run unless KYOTI_ALLOW_WIP=1 is set. KYOTI V1.0 was withdrawn on 2026-10-06 because it could crash; V1.2 broke
  PLATE REVERB, and V1.1 to V1.6 filter the stock DELAY darker than stock at most
  BASE and WDTH settings, which V1.7 fixes. Hardware testing is on an MKI only.
status: active
authors:
  - name: Zac Kyoti
    url: https://github.com/Zac-Kyoti
source: https://github.com/Zac-Kyoti/octatrack-kyoti-fw
source_status: open
license: MIT
license_notes: >-
  Covers the repository's own code and docs. Excludes Elektron material, files
  inherited from OCTAMAX (which ships no license), patches to third-party tools
  and anything fetched at build time.
distribution: patch-your-own
requires_stock: 1.40C
install_notes: >-
  Build with the repo's tools from your own OS 1.40C; see BUILD_KYOTI.md and
  FLASHING.md in the repo. The unit's OS version reads KYOTI V1.7 when the combined image is flashed.
tags: [fx, sequencer, performance, ui, bugfixes]
