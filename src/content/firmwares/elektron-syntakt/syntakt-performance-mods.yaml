device: elektron-syntakt
name: Syntakt Performance Mods
summary: Browser and desktop builder that adds a CDJ-style JOG page and a PERFORM DJ filter to your own Syntakt OS 1.41 or 1.42 file, alone or on top of a Syntakt MAX build.
description: >-
  The builder reads the official Syntakt OS file you download from Elektron, recognises it by SHA-256, applies guarded patches
  and writes a new .syx on your own disk. Holding TEMPO opens a JOG page with a platter that turns once a bar, a jog that
  nudges and brakes with a selectable weight, pitch that follows the nudge, a phrase counter and tempo memories. RIGHT from
  there opens a PERFORM page with a DJ filter over the whole mix on the analog FX block, with resonance, drive and a spectrum
  display. The same builder runs in a browser tab, where the OS file stays local and the page hosts no firmware, and as a
  Python and Tk program for Windows. An add-on script merges the mods into someone else's Syntakt MAX manifest. The
  repository holds no Elektron firmware and says so in LEGAL.md. The README marks the package experimental, and the newest
  screen changes had not run on a real unit when it was written.
status: active
authors:
