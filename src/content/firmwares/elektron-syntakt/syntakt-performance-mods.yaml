license: MIT
license_notes: >-
  The LICENSE file is the MIT License, with a note that it does not cover Elektron's firmware or the third-party parts listed
  in THIRD_PARTY_NOTICES.md. LEGAL.md still says the repository has no licence of its own yet and that the jog mod's code is
  all rights reserved, which contradicts the LICENSE file; this entry follows the LICENSE file. The mod-area loader, splash
  and parameter hooks come from SyntHack (MIT), and the SY CHORD bank and Deja Vu shapes from Syntakt Firmware Workbench (MIT).
homepage: https://ghnmrec.github.io/SyntaktPerformanceMods/
based_on: elektron-syntakt/syntakt-max
distribution: browser-installer
requires_stock: 1.41 or 1.42
install_notes: >-
  Download Syntakt OS 1.41 or 1.42 from Elektron, open the builder page, drop the file, tick the mods and build, then send
  the result with Elektron Transfer. The desktop builder needs elektron-firmware-tool.exe copied into builder/resources.
  Back up projects and samples first. Recovery: the tools never touch the bootstrap, whose OS upgrade menu is reached by
  holding FUNC at power-on, then TRIG 4, and the stock .syx is sent over MIDI DIN (USB does not work there). Avoid TRIG 2 and
  TRIG 3, which erase data.
brick_risk: false
tags: [patch, dj, jog, filter, performance, web, wasm]
