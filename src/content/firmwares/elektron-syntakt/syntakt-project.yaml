device: elektron-syntakt
name: Syntakt Project
summary: >-
  Browser and source builder for Syntakt OS 1.41 mods built from your own official file. The main mod, DelayCtrl, turns MOD B into a freeze and repeat, adds a DJ filter type and a drive rectifier, and a mod SDK lets others write more.
description: >-
  Syntakt Project continues Synthack-OS as a patch-based toolchain. It stores patches that hold only the project's own
  code and the SHA-256 of the Elektron bytes they replace, and nothing from Elektron is committed; a pre-commit hook
  refuses firmware files. The builder page at bengleg.github.io/syntakt-project asks for your own Syntakt_OS1.41.syx, applies
  the ticked mods in the browser tab without uploading the file, checks for overlapping patches and for enough boot room, and
  offers the result as a download. The same build runs from Python tools on Linux or WSL. The project's own mod is DelayCtrl,
  which takes over MOD B as an Octatrack-style freeze and repeat of everything going through the FX block, with four trig keys
  that hold the loop at rates from 1/4 to 1/64 and a stock delay that stays silent while it is on. It also replaces the LP-Notch
  entry in the FX filter type list with a one-knob DJ filter, mixes a full-wave rectifier into the FX block's Drive above 5, and
  rearranges the FX SYN page. The older SyntHack mods (master compressor, readable values, beat repeat, a third send effect,
  dual-mono input, splash) are carried over. A mod SDK compiles small C mods into patch files, flags clashes with taken
  spots, and the repository documents the memory map, audio path and an emulator harness used for tests. The author says the
  behaviour of the DJ, drive and all-features builds is not verified in an emulator or on hardware, and that a build from
  the DelayCtrl baseline is the tested one. The project is not affiliated with Elektron and the author asks that built
  files are not shared or sold.
