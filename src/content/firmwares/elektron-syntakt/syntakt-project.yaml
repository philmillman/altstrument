license: MIT
license_notes: >-
  LICENSE (MIT) covers the repository's own code and documentation and grants no rights over Elektron firmware; GitHub
  reports no recognised licence because of that closing sentence. The published builder page bundles GPL-3.0-or-later engine
  code from GSM1980/synfact-dev, pinned at commit fcbc288 and not vendored in the repository (LEGAL.md). The upstream
  SyntHack-OS work is MIT.
homepage: https://bengleg.github.io/syntakt-project/
based_on: elektron-syntakt/synthack-os
distribution: patch-your-own
requires_stock: "1.41"
install_notes: >-
  Download Syntakt OS 1.41 from elektron.se yourself (SHA-256 8e2488f4...ed19e), open the builder page, tick the mods and build,
  or run tools/build/build.py on Linux or WSL. Back up projects with Elektron Transfer first, and flash the result through the
  Transfer Drop page. The tools never modify the bootstrap, so if the OS does not start, RECOVERY.md describes holding FUNC at
  power-on, choosing OS UPGRADE and sending the stock file over MIDI DIN, which USB cannot do at that point and which takes tens
  of minutes. The author advises a dry run of that procedure with the stock file before the first flash.
brick_risk: false
tags: [fx, filter, sequencer, loader, sdk, emulator, patch, web, dj]
