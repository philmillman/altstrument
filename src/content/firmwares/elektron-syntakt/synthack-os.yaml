device: elektron-syntakt
name: SyntHack OS
summary: Set of patches for Syntakt OS 1.41, built from your own official file, that add a compressor, performance effects (repeat, reverse, half speed), a third send effect, dual-mono external input levels and parameter values in real units.
description: >-
  Each mod is a separate patch with a recorded hash of the original bytes it
  replaces, and a build script combines the chosen mods with your own stock
  1.41 file into a .syx. The compressor works on the FX track bus and has threshold,
  attack, release, ratio and make-up controls plus a gain-reduction meter on
  the FX track. Performance FX play repeat, reverse or half speed on all
  tracks from keys 13 to 16 and replace the earlier beat repeat. A third send,
  SND3, feeds a chorus, flanger, phaser or crusher. Other mods give the external inputs
  independent left and right levels, show filter, envelope, level and effect
  values in Hz, dB, ms and percent, and add a boot splash. A ColdFire emulator
  tests every mod against the original code before it goes on hardware. The
  author reports nine mods running on a real unit. Versions up to 0.8.0 could
  crash at boot with projects that use samples; 0.8.1 fixes this. The
  repository holds no Elektron firmware and a pre-commit hook rejects it, and
  the author asks that built files not be shared.
status: active
authors:
  - name: Angelo Tedesco (Angelo-politek)
    url: https://github.com/Angelo-politek
source: https://github.com/Angelo-politek/Synthack-OS
source_status: open
license: MIT
license_notes: >-
  Covers the code and documentation in the repository only; no rights over
  Elektron's firmware are granted.
distribution: patch-your-own
requires_stock: "1.41"
install_notes: >-
  Download Syntakt OS 1.41 from Elektron yourself and check it against the
  SHA-256 in the repository, then build with the repository's Python tools on
  Linux or WSL (the setup script builds elektron-firmware-tool). Back up
  projects with Elektron Transfer, flash the result through its Drop page, and
  flash the stock file the same way to go back. The bootstrap is never
  modified; if the OS does not start, RECOVERY.md describes holding FUNC at
  power-on and sending the stock OS over MIDI DIN, which USB cannot do and
  which takes tens of minutes. Try that procedure once with the stock file
  before flashing.
brick_risk: false
tags: [fx, compressor, sequencer, ui, emulator, patch]
