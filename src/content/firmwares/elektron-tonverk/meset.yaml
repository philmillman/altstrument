device: elektron-tonverk
name: MESET
kind: tool
summary: Hosted web app that slices audio files and exports them as Tonverk multisamples (.elmulti) and round-robin drum kits (.eldrum). It produces files only; nothing is sent to the sampler. Closed source; no repository was found.
description: >-
  The page loads audio, lets the user place slices on a waveform with zoom and pan and map them to MIDI notes by root note and
  interval, and exports a zip in the Tonverk's multisample or drum kit layout, to be copied into the User folders on the sampler.
  It can be installed as an offline app. Its author, posting on Elektronauts as nds0797, announced it there in September 2025 and mentions
  direct card transfer over WebUSB only as a possible later feature. The version on the page is 0.7.4b. The page loads an analytics script. Nothing is flashed.
status: unknown
authors:
  - name: nds0797
    url: https://www.elektronauts.com/u/nds0797
source_status: closed
license: unspecified
license_notes: No source or licence terms are published, and the page does not state any.
homepage: https://meset.w-sz.workers.dev/
distribution: browser-installer
install_notes: >-
  Open the page in a browser, slice the audio and export. Copy multisamples to Tonverk/User/Multi-sampled Instruments and drum kits to
  Tonverk/User/Drum Kits on the sampler's storage, without renaming the files.
brick_risk: false
