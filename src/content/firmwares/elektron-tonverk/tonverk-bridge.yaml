    url: https://github.com/Ma94xx
source: https://github.com/Ma94xx/TonverkBridge
source_status: open
license: GPL-3.0-only
license_notes: The README and the LICENSE file state GPL-3.0; the bundled libusb is LGPL-2.1.
distribution: source-only
install_notes: >-
  Build with Android Studio (Gradle 8.7, NDK 26) or gradle assembleDebug on JDK 17 or later, install on an Android 10+
  phone, connect the Tonverk in audio mode and press Start.
brick_risk: false
