device: elektron-tonverk
name: elmconv
kind: tool
summary: Python command-line and desktop app that converts Logic Pro EXS24 instruments and SFZ libraries to Tonverk .elmulti multisamples, with loops, crossfades, velocity layers and round-robin, resampling to 48 kHz.
description: >-
  Reads an .exs or .sfz instrument, maps its zones, loop points, velocity layers and round-robin groups to the Tonverk's
  .elmulti TOML layout, and writes the mapping with resampled WAV files. A Tkinter-style GUI and prebuilt GUI binaries
  are offered next to the command-line tool, and the docs folder holds notes on the .elmulti and EXS24 formats. The README is
  also in Japanese. Nothing is sent to the sampler.
status: active
authors:
  - name: asatamax
    url: https://github.com/asatamax
source: https://github.com/asatamax/tonverk-elmulti-converter
source_status: open
license: ISC
license_notes: Stated in the README badge and the LICENSE file.
distribution: download
install_notes: >-
  Install with uv tool install or pipx from the repository, or download a GUI build from the releases page, convert an
  instrument and copy the output to User/Multi-sampled Instruments on the Tonverk.
brick_risk: false
tags: [sampler, samples, converter, python]
