device: elektron-tonverk
name: tonverk-link
kind: tool
summary: Python terminal app that lists the projects on a Tonverk SD card, user and factory, with sorting by name, size, date and type. It reads the card and writes nothing.
description: >-
  Built on the Textual library, it scans a mounted card for project folders, reads the project database for pattern and
  song counts and the samples, drum sets and multisamples each project refers to, and shows them in a sortable table
  with user and factory filters. Launchers are included for macOS, Windows and Linux. The repository has a short README
  and no tests or releases.
status: active
