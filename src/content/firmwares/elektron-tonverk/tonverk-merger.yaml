device: elektron-tonverk
name: Tonverk Merger
kind: tool
summary: >-
  Local browser app, run from Python, that copies patterns between Tonverk projects with their kits, sequences,
  parameter locks and samples, reorganises banks and exports a project to the SD card. Built on a reverse-engineered
  project format.
description: >-
  A Tonverk project is a RocksDB database. The tool reads it, copies selected patterns from one project or card into
  another with the ids remapped, and carries the kit, sequence data, parameter locks, sample mappings and the audio files
  with them, including .eldrum and .elmulti definitions. Samples are de-duplicated by content, so two different
  recordings with the same path both survive. It can also move, duplicate and rename patterns, undo a merge, keep
  timestamped backups, print a set list and report orphan samples and broken references on each card. Originals are not
  modified; output goes to separate folders, and an export to the card never overwrites a file already there. The
  repository includes written specifications of the project schema and the preset parameter map. It was tested against
  Tonverk OS 1.3.3 and needs RocksDB installed; on macOS it builds a small app wrapper. Nothing is flashed.
status: active
authors:
