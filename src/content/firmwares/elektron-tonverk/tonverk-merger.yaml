    url: https://github.com/romainguerif
source: https://github.com/romainguerif/tonverk-merger
source_status: open
license: MIT
license_notes: Stated in the README and in the LICENSE file.
distribution: source-only
requires_stock: OS 1.3.3 (tested)
install_notes: >-
  Install RocksDB (brew install rocksdb), run python3 tonverk/make_app.py on macOS or python3 tonverk/app.py elsewhere,
  and put copies of the project folders or whole SD cards in the repository folder. Work on copies and keep a backup of the card.
