device: elektron-tonverk
name: Tonverk SFZ Tool
kind: tool
summary: Single-page browser tool that converts between Tonverk .elmulti multisamples and SFZ instruments, in both directions. The repository has no README.
description: >-
  The repository is one HTML file titled Tonverk and SFZ Multisample Tool, by "Iterate", with two tabs for the two
  conversion directions. It runs in the browser and handles .elmulti and .sfz files. The repository has no README, no
  licence and no releases, and the author's name is taken from the page title. Nothing is sent to the sampler.
