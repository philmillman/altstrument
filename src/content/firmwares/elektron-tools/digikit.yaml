device: elektron-tools
name: digikit
kind: tool
summary: Patch toolchain and run-time module system that add machines and effects to your own Digitakt II or Digitone II .syx, loaded from the card without reflashing, plus an emulator that runs the real OS (ColdFire control CPU and SHARC+ DSP) with front panel and display.
status: active
authors:
  - name: m-dwyer
    url: https://github.com/m-dwyer
source: https://github.com/ElekLabs/digikit
source_status: open
license: AGPL-3.0-or-later
license_notes: The LICENSE file is the AGPL v3 text and the README states "or later". NOTICE adds section 7 terms on attribution, origin and use of the digikit name.
distribution: source-only
requires_stock: Digitakt II 1.17 and Digitone II 1.12 for patching; the emulator also runs 1.16 and 1.11
install_notes: >-
  Build with mise and uv, and supply your own Elektron .syx files; none are in
  the repository. The README lists the runtime and the PLUCK machine as running
  on a Digitakt II (OS 1.17); Digitone II patches are emulator-tested only, and
  the docs say the recovery menu with a broken OS was shown in the emulator, not
  on hardware.
tags: [emulator, research]
versions:
  - version: main @ e14cbc4
    date: 2026-11-14
    url: https://github.com/ElekLabs/digikit/commit/e14cbc43c2849b1fc1055ea5e80511d2370b16d6
    notes: No tagged releases; this is the latest commit. Since the previous entry the commits split the runtime into service modules behind a core interface, add a profiler and static analysis of module DSP code, a job store with cancel in the workbench and a header table in the module format, and delete the patched-in module twins.
  - version: main @ 5f6be83
    date: 2026-11-13
    url: https://github.com/ElekLabs/digikit/commit/5f6be8326147fe41cf06bb19358ae2916b2f3f63
    notes: No tagged releases; this is the latest commit. Since the previous entry the commits speed up uploads with a larger card-command size, a USB receive ring and a readback hash that overlaps the next card read, harden the USB take-over, and fix module loading in the workbench.
  - version: main @ b657f37
    date: 2026-11-12
    url: https://github.com/ElekLabs/digikit/commit/b657f370144559e7b66ae360e6732d25c61ab828
    notes: No tagged releases; this is the latest commit. Since the previous entry the commits add a USB take-over for fast sample transfer in the workbench, a read-back check of each file against the host's hash, a diagnostic module that reads card information, a message saying which adapter a module needs when it does not load, and a restructured SDK, with fixes to the card image and the patch kit on Windows.
  - version: main @ 9b81b05
    date: 2026-11-11
    url: https://github.com/ElekLabs/digikit/commit/9b81b05b1a5d9593297401f8d75aefad9a9bfb7e
    notes: No tagged releases; this is the latest commit. Adds the SHOT one-shot sample machine with a waveform page that zooms and a background job queue for sample work, and a run-time Open303 TB-303 machine for the Digitakt II with a note gate. Later commits speed up the emulator's DSP and fix a frame-loss case in its Digitone II 1.11 handling. The Transfer page now shows upload speed, has a Cancel button and skips files the device already holds with the same bytes, and deleting a sample folder deletes its contents. Later commits add a fast sample transfer over a USB bulk interface, with SysEx as the fallback, and rework the workbench layout.
