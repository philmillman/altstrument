device: elektron-tools
name: digikit
kind: tool
summary: Patch toolchain and run-time module system that add machines and effects to your own Digitakt II or Digitone II .syx, loaded from the card without reflashing, plus an emulator that runs the real OS (ColdFire control CPU and SHARC+ DSP) with front panel and display.
status: active
authors:
  - name: m-dwyer
    url: https://github.com/m-dwyer
source: https://github.com/ElekLabs/digikit
source_status: open
license: AGPL-3.0-or-later
license_notes: The LICENSE file is the AGPL v3 text and the README states "or later". NOTICE adds section 7 terms on attribution, origin and use of the digikit name.
distribution: source-only
requires_stock: Digitakt II 1.17 and Digitone II 1.12 for patching; the emulator also runs 1.16 and 1.11
install_notes: >-
  Build with mise and uv, and supply your own Elektron .syx files; none are in
  the repository. The README lists the runtime and the PLUCK machine as running
  on a Digitakt II (OS 1.17); Digitone II patches are emulator-tested only, and
  the docs say the recovery menu with a broken OS was shown in the emulator, not
  on hardware.
tags: [emulator, research]
versions:
