homepage: https://ph1r3574r73r.github.io/black_seq_gui/
distribution: download
install_notes: >-
  Run it from source with Python 3 (pip install -r requirements.txt, then python3 -m blackseq), or use the unsigned
  macOS zip from the release. Copy projects to the sequencer's SD card yourself.
