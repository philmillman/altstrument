device: erica-synths-black-sequencer
name: Black Sequencer editor
kind: tool
summary: Local Python companion with a browser interface that edits patterns and songs in the Black Sequencer's SD-card project files, previews them through a rack of Mutable Instruments modules and records from a MIDI keyboard.
description: >-
  The program runs a small server on the user's computer and opens in a browser or a native window. It works on projects
  kept in a studio folder or on a mounted card with a PROJECTS folder, writes .SEQ files and the performance data kept
  with them, imports MIDI files onto the four channels and records notes from a controller attached to the computer. The
  preview rack builds sound from Mutable Instruments DSP compiled to WebAssembly and is not a model of the hardware. The
  README calls it a personal-use work in progress that is not fully tested. Nothing is flashed to the sequencer. An
  unsigned macOS build is attached to the release.
