device: erica-synths-lxr-02
name: LXR-02 Emu (unofficial)
kind: tool
summary: Browser emulator that compiles Erica Synths' open LXR-02 firmware 1.7 to WebAssembly, with a virtual panel, a step sequencer, a sound editor and an SD card kept in the browser.
description: >-
  Only the hardware layer is replaced; the sound engine, sequencer, menus and preset code are the firmware sources,
  compiled with a single #ifdef added. The page shows the two-line display, knobs, faders and buttons, and above them a
  step grid for the playing pattern and a panel for the eight pages of sound parameters. The virtual SD card is stored in
  the browser and can be exported, so kits and patterns made on a computer can be copied to a real card. The start-up
  screen reads Unofficial Emu, based on fw 1.7, as Erica Synths' notice requires. The author says the output has not been
  compared with recordings of a real unit, MIDI is not there yet, and that Claude helped build it. Erica Synths' team
  replied in an issue that the name is fine if it states that it is a community project, and that the code will not be
  added to the official repository. The page is in English or Chinese. It is a different project from lxr02-recomp, which
  translates the compiled ARM program instead.
status: active
authors:
