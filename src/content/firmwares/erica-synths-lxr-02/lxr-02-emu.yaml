    url: https://github.com/bg1eym
source: https://github.com/bg1eym/lxr-desktop-app/tree/emu
source_status: open
license: GPL-3.0-only
license_notes: >-
  The emu branch of a fork of erica-synths/lxr-desktop-app. Its README states GPL-3.0-only, like the firmware, with the
  additional terms in Erica Synths' NOTICE.md: trademark limits on the Erica Synths and LXR names and marking of modified
  firmware on the start-up screen. The virtual panel is a generic layout with no Erica Synths artwork.
homepage: https://bg1eym.github.io/lxr-desktop-app/
distribution: source-only
install_notes: >-
  Open the hosted page in desktop Chrome and click Power on. Nothing is flashed to a device. To build it locally, see
  emu/README.md on the emu branch.
brick_risk: false
tags: [emulator, web, drums, sequencer, editor, open-source]
