  changes for LX_UMA).
homepage: https://mausuaza.github.io/LX_UMA-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page, make a wavetable, terrain or DX7 bank, and download the file. The page writes nothing to the module;
  copy the file to the folder the LX_UMA manual names on the SD card.
brick_risk: false
