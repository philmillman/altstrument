    date: 2026-11-05
    url: https://github.com/sawtoothwave/lxr-eurorack-app/releases/tag/v1.51-c6
    notes: Fixes loading a drum from another kit right after start-up, which in c4 and c5 always went into drum 1.
  - version: v1.51-c5
    date: 2026-11-04
    url: https://github.com/sawtoothwave/lxr-eurorack-app/releases/tag/v1.51-c5
    notes: The edit light blinks while morph is in use. The release notes warn of the start-up bug in loading a drum from another kit and point to c6.
