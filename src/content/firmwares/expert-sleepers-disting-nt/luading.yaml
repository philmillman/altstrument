device: expert-sleepers-disting-nt
name: Luading
kind: tool
summary: Browser workbench for writing and testing disting NT Lua scripts. It runs Lua 5.4 in a Web Worker, simulates the algorithm callbacks and the 256x64 display, scores scripts and can drive outputs to Web Audio or MIDI. It does not connect to the module.
description: >-
  A Monaco editor with disting NT completions sits next to simulated CV, gate, trigger and clock inputs, parameters and
  front-panel controls. The simulator runs init, step, trigger, gate, draw and MIDI callbacks, reports average, 95th
  percentile and maximum timing against a 1 ms budget measured in the browser, and checks scripts against the scripting
  contract. Physical Web MIDI input can stand in for CV and gates. Bundled example scripts sit in folders named for Expert
  Sleepers and for the author. Rights warning: the repository includes a PDF copy of Expert Sleepers' disting NT Lua scripting
  manual 1.12 and example scripts adapted from Mutable Instruments Grids under the GPL. It is not affiliated with Expert
  Sleepers, and timings are not a measure of the hardware's CPU use.
status: active
