device: faderfox-uc4
name: UC4 SysEx Editor
kind: tool
summary: Single-page browser editor for all 18 setups of the Faderfox UC4. It edits the full SysEx dump file, with an overview grid, conflict detection, a setup manager, JSON backups and undo, and it runs from one HTML file with no server.
description: >-
  The page loads the factory defaults and lets you edit every control in all eight groups of each setup, either one control at a time or in an
  overview grid of all 64 controls per type. It finds duplicate MIDI assignments, copies and swaps whole setups, and keeps labels for them. Setups go out as a
  100,640 byte .syx file or as JSON. The page works on files, so the .syx dump is moved to and from the unit with a separate SysEx tool. The repository also has two example controller maps.
status: dormant
