device: freds-lab-octane
name: Octane firmware
summary: Announced Rust firmware for the Octane MIDI hub, which Fred's Lab says it publishes as open source, with USB updates and the Tentacles web editor for routing and remapping.
description: >-
  The Octane's firmware is written in Rust for a Raspberry Pi RP2354 and is installed over USB; the kit version ships with one
  firmware file to flash. The product page lists the firmware as open source and the board design as KiCad schematics, and says
  the licences are permissive without naming them. The page does not link a source repository and no Octane repository was found
  on GitHub on 2026-11-15, so the entry stays announced until sources are public. The Tentacles web editor sets routing, merging,
  filtering, channel and controller remapping, velocity shaping and keyboard splits.
status: announced
authors:
  - name: Fred's Lab
    url: https://www.fredslab.net/
  - name: Sourcebox
    url: https://sourcebox.de/
source_status: closed
license: unspecified
license_notes: >-
  The product page says the firmware and hardware are distributed under permissive licenses and names none. Source status is
  recorded as closed only because no repository is public yet.
homepage: https://www.fredslab.net/en/octane-hub.php
community:
