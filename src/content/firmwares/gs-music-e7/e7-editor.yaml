    url: https://github.com/iromerox
source: https://github.com/iromerox/e7-editor
source_status: open
license: MIT
license_notes: The LICENSE file is the MIT text with the name Ivan and the year 2026.
distribution: source-only
install_notes: >-
  Install Bun, run bun install and bun run dev, then open the dev server in Chrome, Edge, Opera or Firefox 108 or later and
  allow MIDI access with SysEx. The hardware smoke test page is read-only; writing presets back is not.
brick_risk: false
