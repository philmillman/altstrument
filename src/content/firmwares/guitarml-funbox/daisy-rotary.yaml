    url: https://github.com/pianomanfrazier
source: https://github.com/pianomanfrazier/DaisyRotary
source_status: open
license: unspecified
license_notes: No license file or statement in the repository.
distribution: source-only
install_notes: >-
  Build with make using the Daisy toolchain and flash over USB DFU. The Seed's ROM DFU mode stays available if a flash
  goes wrong.
brick_risk: false
