device: guitarml-funbox
name: DaisyRotary
summary: Leslie rotary speaker emulation with a preamp and overdrive for a Daisy Seed, with fast and slow rotor switches and acceleration, deceleration, gain and drive knobs, tidied to fit the FunBox PCB.
description: >-
  The program models a rotating speaker with separate fast and slow speeds, a rotor mode read from two switch pins,
  and acceleration and deceleration controls for the speed change. A preamp stage adds gain and drive. Six pots are
  read from the Seed's analog pins. The last commit is titled as tidying the pin use to work with the FunBox PCB, and
  earlier ones work on the overdrive. The README is still the unedited example template.
status: active
