device: guitarml-funbox
also_devices: [cleveland-hothouse]
name: Flick
summary: Reverb, tremolo and delay pedal for the FunBox and Hothouse with three reverb types, three tremolo shapes, tap tempo, per-reverb editing and saved settings.
description: >-
  Footswitch 1 controls tremolo and reverb and footswitch 2 controls delay and tap tempo, with long presses for reverb edit mode and device settings. Reverbs are room, plate and ambient, each with its own saved parameters, and tremolo has smooth, harmonic and opto settings. The README documents a factory reset, a footswitch gesture for entering DFU mode and a Tayda drill and artwork set for a 125B case. FunBox builds need replaced libDaisy petal files from the repository.
status: active
authors:
  - name: Boyd Timothy
    url: https://github.com/joulupukki
source: https://github.com/joulupukki/Flick
source_status: open
license: GPL-3.0-only
license_notes: LICENSE-GPLv3.txt is the standard GPL version 3 text with no "or later" statement.
distribution: download
install_notes: >-
  Build with the Daisy toolchain, replacing the libDaisy petal files for a FunBox build, or use the release files. Hold both footswitches for five seconds to enter DFU mode. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
