distribution: download
requires_stock: Alchemy Lab V2
install_notes: >-
  Connect the front USB-C port and hold B3 during the boot animation to enter DFU, then run make program-dfu, or run make
  program-live to reboot into the bootloader without a button press, or upload the release .bin in Hermetic Modular's web
  programmer. The flash goes over DFU to the module's QSPI program area, as for the other Alchemy Lab firmwares.
brick_risk: false
