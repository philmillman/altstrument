device: hermetic-modular-alchemy-lab
name: Paradox
summary: Eight-voice cross-coupled FM and ring-modulation feedback synth with an eight-voice stereo exponential reverb and leveler for the Alchemy Lab V2, after a Reaktor ensemble by Lazyfish.
description: >-
  Paradox is described by its README as a recreation of the Reaktor community ensemble "h e i s h e r e" by Lazyfish. Its
  first page runs eight voices that feed each other through one shared modulation bus, each with amplitude, pitch,
  ring-mod, FM, mod-send and feedback-delay parameters that have a variable and a random layer, and the six bipolar CV inputs
  are mapped to the variable layer. The second page is a stereo cross-coupled comb reverb with up to 10 seconds per voice,
  damping filters and a per-voice leveler, and it can blend in external audio. There are 16 preset slots in QSPI flash, parameter
  locks recorded with B1 and a settings page for LED brightness. The build uses the Alchemy SDK and libDaisy as submodules.
status: active
authors:
