    url: https://github.com/araz4github
source: https://github.com/araz4github/simulacrum
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL version 3 text and the README says GPL-3.0 with no "or later" wording. It builds on the
  MIT-licensed Alchemy SDK and libDaisy, which keep their own licenses.
distribution: download
requires_stock: Alchemy Lab V2 board
install_notes: >-
  Connect the front USB-C port, power on and press B3 while the rings show the warm-white comet, then load
  simulacrum.bin with Hermetic Modular's web programmer or with dfu-util (make program-dfu). Run the board's CV
  calibration once by holding B1 and B2 at power-on. Hermetic's bootloader is not touched, so the module can be put back
  into update mode and reflashed.
brick_risk: false
