device: hermetic-modular-alchemy-lab
name: Simulacrum
summary: Stereo accompaniment firmware for the Alchemy Lab V2 that runs a clock-synced tape delay, a 12-bit granular delay and an eight-voice sine and supersaw stack through a bipolar dual-notch filter.
description: >-
  Simulacrum was written to play beside a Moog Matriarch. The tape layer is a stereo delay synced to an external clock
  with wow and flutter, a tone filter that compounds on every repeat, up to 105 percent feedback with saturation and a
  microspeed control driven by V/Oct or a sub-sine. The grain layer records into a 12-bit, 24 kHz buffer and plays up to
  36 grains with per-grain time stretch from one sixteenth to eight times at constant pitch and an envelope morph. The
  stack plays up to eight ringing voices of quadrature sines and a supersaw from a gate on J6 and V/Oct on J4, through
  a dual-notch filter whose cutoff sweeps in mono or stereo, with an option to send the grains through the notches.
  Three main pages and several hidden pages hold the controls, and the USB link shows CPU and clock diagnostics. It is
  built on the Alchemy SDK 0.13.0 and libDaisy. Hermetic Modular did not write or endorse it.
status: active
authors:
