homepage: https://thisisbribery.github.io/SealEggs_v1/
distribution: patch-your-own
requires_stock: 1.3.5.0
install_notes: >-
  Download the official Sealegs 1.3.5.0 file from Intellijel, load it in the
  page, choose mods and download the patched file. Install it with the same
  update procedure as official firmware. Keep the original file to go back. The
  author gives no warranty and asks that Intellijel not be contacted for help
  with modified firmware.
