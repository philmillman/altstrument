device: intellijel-sealegs
name: Seal Eggs
summary: Browser tool that writes a modified Sealegs firmware file from your own official 1.3.5.0 file, adding live reverse delay, a second character control, Digi doppler, a granular Digi mode, a micro-loop mode and tone changes.
description: >-
  The page applies selected patches to the official 1.3.5.0 file in the browser
  and offers the result as a download of the same size. The mods are live
  reverse delay on the Tape, BBD and Digi models, a second character function
  on the NOISE control, pitch-bending Digi time changes, faster Tape time
  following, a brighter BBD filter, a Tape tone change, Seal Beads, a granular
  mode in the Digi slot adapted from Mutable Instruments Beads, and Seal
  Microloops, a micro-loop mode behind BBD with three modes of four variations
  each. Some mods depend on others; Seal Microloops needs Seal Beads. The page checks the input file's SHA-256 against the
  official 1.3.5.0 file and checks each output against a listed hash, and it
  does not host or fetch the official firmware. The README says reverse,
  character and the stability fixes were tested on hardware, while some other
  combinations were checked only in an emulator. The patch data is published but
  not the source of the added code, so the source status is patcher-only.
