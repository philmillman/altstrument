device: irijule-theoryboard-thy333
name: TBOSS
summary: Open-source replacement firmware for the TheoryBoard THY333 with chords by scale degree, strum, hold, an arpeggiator, chord names on the display, presets, custom scales and MIDI control, installed from the browser.
description: >-
  TheoryBoard Open Source Software plays chords from the left pads and a melody from the right, in any key and
  scale, with per-pad chord edits such as added sevenths or suspended chords, 86 built-in scales and up to 12 custom scales drawn on
  a piano keyboard in a web editor, and separate MIDI channels for chords and melody. Pad pressure can be sent as
  aftertouch or as a controller such as mod wheel or filter. The editor also backs up settings and makes a
  verified copy of the board's 16 MB memory chip. Later versions add recordable chord progressions, user-typed chord sets, a Modes chord set, external MIDI control,
  a chord grid, an eight-lane, eight-pattern step sequencer with songs, four MIDI effects, a bass layout, Program Change in both directions, MPE, a Turing-pattern arpeggiator
  and chained progressions. From 2.0 the web editor has its own USB port, so a DAW can keep playing while it is connected. TRS MIDI out and the
  sustain pedal are confirmed on a board; the pedal's other modes, scale lock and progressions started from a DAW are not yet, and the
  author asks for test reports. Releases up to 1.6 carried a beta label, and 1.7 and later do not. The
  author is not affiliated with the board's makers.
status: active
authors:
  - name: armandhammer
    url: https://github.com/armandhammer
source: https://github.com/armandhammer/TBOSS
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  TinyUSB (MIT) and the CMSIS headers are downloaded at build time and are not part of the repository.
homepage: https://armandhammer.github.io/TBOSS/
distribution: browser-installer
install_notes: >-
  Use Chrome or Edge with the installer page. Unplug the board, hold the top-left and bottom-left pads of the
  left half while plugging it back in until the TheoryBoard logo shows, then connect and install; it takes about
  a minute. Save settings in the web editor first when updating from an earlier TBOSS. The installer uses the
  board's own update mode and never touches the resident loader, so installing again always works. Going back to
  the original firmware means running the manufacturer's old update utility with its update file, which the
  maker no longer supplies; the project's flashing guide describes the steps. Linux needs a one-time permission
  rule.
brick_risk: false
tags: [controller-mode, chords, scales, arpeggiator, midi, editor]
versions:
  - version: "2.4"
    date: 2026-11-09
    url: https://github.com/armandhammer/TBOSS/releases/tag/v2.4
    notes: The step sequencer grows to eight lanes and eight patterns, with songs of up to 16 patterns, mute and solo on the root buttons, live transpose and per-lane loop windows. Adds light settings for out-of-scale notes and dimming, and a Sequencer tab in the web editor.
  - version: "2.3"
    date: 2026-11-07
    url: https://github.com/armandhammer/TBOSS/releases/tag/v2.3
    notes: Includes 2.1 and 2.2, which were not released on their own. Adds a Modes chord set that borrows chords from other modes on the same root, external MIDI control learned on the board, a 4 by 4 step grid, firmer default pad thresholds and a fix for sessions ending when 16 MIDI messages went out at once.
  - version: "2.0"
    date: 2026-10-31
    url: https://github.com/armandhammer/TBOSS/releases/tag/v2.0
    notes: Includes 1.8 and 1.9, which were not released on their own. Adds a Turing-pattern arpeggiator, chained progressions, presets with their own chord sets, MPE, a step sequencer with fill, nudge, mutate and stutter, and sleep and shut down. The web editor gets its own USB port, so a DAW keeps playing while it is connected.
  - version: "1.7"
    date: 2026-10-27
    url: https://github.com/armandhammer/TBOSS/releases/tag/v1.7
    notes: Includes 1.6. Adds per-step velocity, gate, tie, chance, ratchet and condition to the step sequencer, a bass layout, Program Change in both directions, and pad calibration that adjusts to each board.
  - version: 1.6.0-beta.1
    date: 2026-10-25
    url: https://github.com/armandhammer/TBOSS/releases/tag/v1.6.0-beta.1
    notes: Adds four optional MIDI effects, harmony, echo, mono melody and chance for the arpeggiator and note repeat.
