device: korg-drumlogue
name: Taureon drumlogue FX units
summary: Five beta effect units for the drumlogue, GrainDrift V2 granular delay, MixForge, TapeVibe and DrumShuffler master effects, and the GateVerb80 gated reverb.
description: >-
  A collection of drumlogue effect units built with logue SDK v2 by sscheidl,
  who publishes under the Taureon name. GrainDrift V2 is a tempo-aware granular
  delay with sixteen rhythm patterns. MixForge is a master-bus processor with a
  DJ-style filter, compressor, four saturation modes and a bit crusher. TapeVibe
  adds drive, wow and flutter, hiss and dropouts. DrumShuffler is a
  tempo-synchronised micro-delay for shifting drum timing and stereo motion.
  GateVerb80 is a gated stereo reverb. The README calls the set pre-release beta
  software that has passed initial hardware tests, and the repository takes bug
  reports from beta testers.
status: active
authors:
  - name: sscheidl
    url: https://github.com/sscheidl
source: https://github.com/sscheidl/drumlogue_fx_units
source_status: open
license: unspecified
homepage: https://github.com/sscheidl/drumlogue_fx_units/releases
distribution: download
install_notes: >-
  Put the drumlogue in USB mass-storage mode and copy each .drmlgunit file from
  the release to Units/DelayFXs, Units/MasterFXs or Units/ReverbFXs as listed in
  the README, then restart. Units can be deleted from the same folders.
brick_risk: false
tags: [delfx, masterfx, revfx, granular, reverb, open-source, drumlogue]
versions:
