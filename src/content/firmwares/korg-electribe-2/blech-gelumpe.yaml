    notes: Lets you view and audition another pattern while one plays, adds a step-by-step firmware patcher in the app that can update a file already carrying BLECH 1.3.4 to 1.3.7, a BEAT 8 pattern option, a custom loading animation and a MANAGE PLUGINS list for up to 64 plugins. Settings saved with 1.4.0 are lost if you go back to 1.3.7.
  - version: v1.3.7
    date: 2026-10-29
    url: https://github.com/KuhlerBuhler/kuhlers-gelumpe/releases/tag/v1.3.7
    notes: The Electribe starts on the pattern last selected (hold EXIT at power-on for 001), a chosen init pattern replaces Korg's template for INITIALIZE PATTERN, BLECH > VERSION shows the running version, and a plugin switched off in PLUGIN EDIT stays off after a restart. Also for the blue Electribe.
  - version: v1.3.5
    date: 2026-10-27
    url: https://github.com/KuhlerBuhler/kuhlers-gelumpe/releases/tag/v1.3.5
    notes: Adds app translations, sample transfer over USB, plugins that write sequencer steps, a plugin list that includes plugins on the card, HUE/SAT/BRIGHT colour settings and two insert presets.
  - version: v1.3.3
    date: 2026-10-26
    url: https://github.com/KuhlerBuhler/kuhlers-gelumpe/releases/tag/v1.3.3
    notes: Sync groups keep sounding samples running when one pattern leads into the next, and the patcher no longer mistakes a Hacktribe file with a blue Electribe header for Korg's blue firmware.
  - version: v1.3.0
    date: 2026-10-25
    url: https://github.com/KuhlerBuhler/kuhlers-gelumpe/releases/tag/v1.3.0
    notes: Adds sync groups so patterns switch together, quick save and part reset shortcuts, a GIF player app, up to 12 plugins, 16 extra insert and master effects, and display and LED customization.
  - version: v1.2.0
    date: 2026-10-17
    url: https://github.com/KuhlerBuhler/kuhlers-gelumpe/releases/tag/v1.2.0
    notes: Adds pad color options and pre-checks Korg's original 2.02 for the blue Electribe.
