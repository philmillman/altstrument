device: korg-electribe-2
name: Electribe 2 Pattern Change
kind: tool
summary: Single-page browser remote that changes patterns on an Electribe 2 over USB MIDI. It sends bank select and program change for patterns 1 to 250 from a number pad, and has an 8-step chain with repeat counts that loops until stopped.
description: >-
  The page opens a MIDI output through Web MIDI, shows a large pattern number and sends bank select (control change 0 and 32)
  and a program change for the number you enter. Quick-jump buttons go to set patterns, and a chain of eight boxes can hold
  pattern numbers with repeat counts and plays through only the filled steps. It is one HTML file with no README, built for a
  phone or tablet screen. Nothing is flashed.
status: active
