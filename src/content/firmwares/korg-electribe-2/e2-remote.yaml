    url: https://github.com/EliasTX09
source: https://github.com/EliasTX09/e2-remote
source_status: open
license: AGPL-3.0-only
license_notes: >-
  The LICENSE file is the AGPL-3.0 text. The NOTICE file says the page is its own implementation in JavaScript with no code
  taken from the AGPL-3.0 BLECH and Hacktribe projects it draws protocol facts from.
homepage: https://eliastx09.github.io/e2-remote/
distribution: browser-installer
requires_stock: Electribe 2 with BLECH SysEx and the BLECH plugin runtime
install_notes: >-
  Open the hosted page in Chrome or Edge over HTTPS, connect the Electribe 2 by USB with an SD card inserted and allow MIDI
  with SysEx. Back up the SD card and the original SYSTEM.VSB first. Firefox and Safari have no Web MIDI.
brick_risk: false
