device: korg-electribe-2
name: E2 Fernsteuerung
kind: tool
summary: German-language browser remote for an Electribe 2 running BLECH SysEx. Over USB MIDI it presses the buttons and turns the knobs, reads the display, edits effect presets and the startup image, and reads and writes SYSTEM.VSB on the card.
description: >-
  The page talks to a unit that has been patched with BLECH, using that project's SysEx protocol; stock firmware does not
  answer. It sends the 35 key and 5 knob commands through the BLECH runtime, reads the screen image from memory and can refresh
  it, reads effect presets and writes changed ones back, replaces or inverts the startup image, reads any memory address as
  a hex view, and sets the file name the SOFTWARE UPDATE menu opens. Changed effects and startup image go into a SYSTEM.VSB
  file written to the SD card, and become permanent only when you start SOFTWARE UPDATE on the synth, so Korg's own updater does
  the flash write. The page deliberately does not use the direct flash write commands. A NOTICE file lists the BLECH and
  Hacktribe sources the protocol facts come from, and says the repository holds no firmware.
status: active
authors:
