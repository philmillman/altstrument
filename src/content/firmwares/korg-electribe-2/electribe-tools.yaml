device: korg-electribe-2
name: Electribe Tools
kind: tool
summary: Browser tool that splits an Electribe 2 all-patterns file into 250 pattern files plus a global settings backup, and builds an allpat file back from them, so patterns can be renamed and reordered. Everything runs in the page.
description: >-
  The Pattern Manager takes an .allpat file and returns a zip with the patterns and a global settings backup, or takes such a
  zip with at least 250 pattern files and one settings backup and returns an allpat file. Patterns are ordered by file name, and
  a four-character numeric prefix on each name sets how it is labelled. It is based on the Max for Live Electribe2 pattern editor
  and on e2allpat. The to-do list names pattern editing, instrument remapping and sending to the device over SysEx, none of
  which is built. The page has no link to the hardware. Nothing is flashed.
