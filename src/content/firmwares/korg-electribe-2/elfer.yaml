distribution: source-only
install_notes: >-
  Build with the Flutter beta channel from 2022 on Linux or Android, connect the Electribe 2 by USB and press Connect. Set the
  Electribe's Global parameter PTN. CHANGE LOCK to On before using the panel controls.
brick_risk: false
