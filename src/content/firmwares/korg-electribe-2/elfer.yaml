device: korg-electribe-2
name: Elfer
kind: tool
summary: Flutter tracker-style pattern editor for the Electribe 2 synth, sampler and Hacktribe. It reads the current pattern over USB MIDI, edits notes from the keyboard or from the Electribe's panel on Hacktribe, and sends the pattern back. Linux and Android only; archived.
description: >-
  The app connects to the Electribe 2 over USB, loads a pattern into a tracker grid showing step on and off, velocity and gate, and
  sends edits back to the current pattern without saving to a slot. Navigation works from the computer keyboard, and with
  Hacktribe firmware the Select knob, part buttons and pads move around and enter notes, which needs the Global parameter
  pattern change lock turned on. The README calls it work in progress. Sample editing, file saving and other formats remain
  on its list. The repository was archived in 2022. Nothing is flashed.
status: archived
authors:
