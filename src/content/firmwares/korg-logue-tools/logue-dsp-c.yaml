device: korg-logue-tools
name: logue-dsp-c
kind: tool
summary: C reimplementation of some of the DSP routines from Korg's logue SDK (a biquad filter and a delay line header), for use in custom logue units written in C.
description: >-
  The repository holds two headers, biquad.h and delay_line.h, ported from the
  C++ DSP code that ships with Korg's logue SDK so that units can be written
  in plain C. The author's fbos and lpf units pull it in as a submodule.
  There are no releases or build steps; it is a header library.
status: dormant
