device: korg-minilogue-xd
also_devices: [korg-nts-1-mkii]
name: Master Volume 2 (boochow)
summary: Modulation effect that sets the overall output volume from the depth knob and modulates it with the time knob; release builds for minilogue xd and NTS-1 mkII, plus a delay-slot variant.
description: >-
  Depth controls the master volume and time selects a volume modulation (off,
  on, or a ramp up or down in each quarter). The first release has
  modulation-effect units for the minilogue xd and NTS-1 mkII; the later
  0.1-delfx release repeats the same function as a delay-slot unit for the
  minilogue xd. The manifest in the repository targets the minilogue xd.
