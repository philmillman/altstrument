device: korg-minilogue-xd
name: deiosc
summary: Pad-oriented user oscillator for the minilogue xd that mixes a saturated sine with golden-ratio inharmonic partials, drifting on its own over about 51 seconds, with a beating control and optional sub oscillator.
description: >-
  The oscillator blends a saturated sine base with a brighter inharmonic part
  built from partials at powers of the golden ratio. The blend moves by itself
  over a cycle of about 51 seconds, driven by an internal clock instead of the
  synth's LFO, and the user only sets how much of the inharmonic part is
  present. Shape sets that presence, shift-shape sets the amount of beating
  and Edit 1 the sub oscillator level. The README is bilingual (Spanish and
  English) and links two demo videos and a blog post on how it was built.
