device: korg-minilogue-xd
name: HyperSawX
summary: Free minilogue xd user oscillator with a single supersaw of 15 detuned saws, a sub oscillator, drift and vibrato.
description: >-
  HyperSawX is a user oscillator with 15 detuned saws in the JP-8000 style.
  Shape sets detune, Shift+Shape tilts the tone from dark to bright, and the
  parameters control a sub oscillator one octave down, pitch drift, and
  vibrato depth and rate. The README says it is a rewrite of an earlier
  version that had bugs. The repository is named super-duper-stuff and holds
  only this oscillator, with source, a built .mnlgxdunit file and an audio
  demo. MegaSaw builds on it.
status: active
authors:
  - name: SpeakingColors
    url: https://github.com/SpeakingColors
source: https://github.com/SpeakingColors/super-duper-stuff
source_status: open
license: MIT
license_notes: >-
  LICENSE is MIT. The README says it covers hypersawx.cpp and that the tpl/
  and ld/ files come from the KORG logue SDK under BSD-3-Clause.
homepage: https://github.com/SpeakingColors/super-duper-stuff
distribution: download
install_notes: >-
  Drag the .mnlgxdunit file into a free User Oscillator slot in the minilogue
  xd Sound Librarian, or load it with logue-cli. User units can be removed
  again from the Librarian.
brick_risk: false
tags: [oscillator, supersaw, open-source, minilogue-xd]
versions:
