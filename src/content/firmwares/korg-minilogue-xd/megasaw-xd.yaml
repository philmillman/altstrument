device: korg-minilogue-xd
name: MegaSaw
summary: Free minilogue xd user oscillator with two supersaw layers of up to 11 voices each, per-layer waveforms and analog-style drift.
description: >-
  MegaSaw merges HyperSaw and HyperSawX into one oscillator with two layers.
  Each layer has 3 to 11 detuned voices, chosen with a Voices control, and its
  own waveform (saw, square, pulses, triangle, sine, glass tables or vocal
  "Ah"). Layer B can be offset by up to two octaves, and Drift lets each voice
  wander in pitch. The README says it was tested on a PC with the repository's
  test suite and not yet on real hardware, and advises lowering Voices if a
  busy chord glitches. The repository has source, a built .mnlgxdunit file, a
  roadmap and an audio demo.
status: active
authors:
