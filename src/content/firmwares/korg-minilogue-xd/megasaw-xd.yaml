    url: https://github.com/SpeakingColors
source: https://github.com/SpeakingColors/MegaSaw-XD
source_status: open
license: MIT
license_notes: >-
  LICENSE is MIT (the GitHub API reports NOASSERTION). The README says the
  KORG SDK template files keep their BSD-3-Clause licence.
homepage: https://github.com/SpeakingColors/MegaSaw-XD
distribution: download
install_notes: >-
  Unzip the release download and drag the .mnlgxdunit file into a free User
  Oscillator slot in the minilogue xd Sound Librarian, or load it with
  logue-cli, which the README describes for Linux. User units can be removed
  again from the Librarian.
brick_risk: false
