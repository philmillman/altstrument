device: korg-minilogue-xd
name: minilogue xd viewer
kind: tool
summary: Browser viewer for minilogue xd programs and libraries with a faithful panel display. It can mirror a connected synth over Web MIDI and has a model that tries to match an audio clip to a patch, plus an Ableton Live extension.
description: >-
  Rights warning: the repository holds a product photo of the minilogue xd module (web/minilogue_xd_module.jpg) and vendored
  Ableton extension SDK archives under ableton/vendor.

  The page opens .mnlgxdprog and .mnlgxdlib files and shows every parameter on a drawn panel. With the synth connected over Web
  MIDI it follows live changes. A resynthesis feature runs an ONNX model in the browser to guess a patch from an audio clip,
  which can then be loaded on the hardware. A viewer-only build ships as an Ableton Live 12.4.5 or later extension, with a
  bridge script in the repository. The releases page carries the extension and bridge archives.
