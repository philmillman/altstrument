    url: https://www.elektronauts.com/t/tetraphon-a-free-minilogue-xd-editor-for-the-mac/258953
distribution: download
requires_stock: minilogue xd with MIDI Rx and Tx CC and program change switched on
install_notes: >-
  Download the DMG from the project page, or join the TestFlight test. It needs macOS 15 or later and the synth connected
  over USB, with MIDI Rx CC, Tx CC, Rx program change and Tx program change enabled in the Global menu. The page warns that
  an alpha can overwrite presets, so run File, Back Up All Presets first. It writes presets and settings through MIDI and
  does not touch the synth's firmware.
brick_risk: false
