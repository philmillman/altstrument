device: korg-minilogue-xd
name: Tetraphon
kind: tool
summary: Free macOS editor for the minilogue xd, with a single-panel view that follows the synth, a 16-step sequencer with motion curves, a 500-preset librarian with backup, a variation generator and a Max for Live device.
description: >-
  Licence note: the site calls Tetraphon free and says it will stay free, and no licence terms or source are published.

  Every sound parameter, the multi engine, the arpeggiator and the Program Edit and Global menus appear on one panel, and a
  knob turned on the synth moves in the app and the other way round. The sequencer view shows 16 steps with four voices each
  and draws motion curves, and a generator writes waves or random curves into a motion lane. The preset list covers all 500
  slots with search, favourites, move, swap and compare, and backs them up with the user oscillators and effects; Korg preset
  and library files can be opened. Inspiration plays four variations of the current sound. A Max for Live device for Live 12
  automates the parameters, and a mode with a simulated synth works without hardware. The page lists it as an alpha, needs macOS 15 and
  USB, and warns that storing, moving or swapping presets overwrites slots on the synth.
status: active
