device: korg-minilogue-xd
name: XXD Virtual Mod Matrix
kind: tool
summary: Browser mod matrix for the minilogue xd over Web MIDI. It adds two LFOs, two note-triggered envelopes and live mod wheel, aftertouch, pitch bend and velocity as sources routed to synth parameters by control change, with the knob positions read back.
description: >-
  The page mirrors the synth's signal path as a diagram. Each destination such as pitch, shape, wave, mixer levels, cutoff or
  resonance opens a popup with two routing slots, each with a source, a bipolar depth and an on switch. The base value follows
  the physical knob, which the app reads from the synth's KBD/KNOB port, so turning a knob and using the app do not fight
  each other. Modulation goes out to the MIDI port as control changes. It needs a Chromium browser, has no build step and is
  started with any static web server. Nothing is flashed.
status: active
authors:
  - name: seandunn
    url: https://github.com/seandunn
source: https://github.com/seandunn/xxd
source_status: open
license: MIT
license_notes: >-
  The README says MIT. The MIT-LICENSE file names David Heinemeier Hansson as copyright holder, which looks like a leftover from
  a project template.
distribution: source-only
install_notes: >-
  Serve the repository with a static server, for example ruby -run -e httpd . -p 8000, open it in a Chromium browser, choose
  the minilogue xd KBD/KNOB port as input and its MIDI out port as output, then press Connect MIDI.
brick_risk: false
tags: [midi, web-midi, usb-midi, web, performance]
