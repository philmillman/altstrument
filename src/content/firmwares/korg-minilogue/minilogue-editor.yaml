device: korg-minilogue
kind: tool
name: Minilogue Editor
summary: Browser editor for the original minilogue's programs over Web MIDI, written in 2018. It shows a panel of every parameter, imports and exports Korg Librarian files, sends and receives programs, and sends control changes while you turn its knobs.
description: >-
  The page draws the minilogue's panel and lets you view and change each program parameter. It keeps a library of programs
  in the browser, and it opens and saves the program files used by Korg's own Minilogue Librarian. Programs are loaded from and
  sent to the synthesizer over MIDI, and the editor can send and receive control changes for the panel controls. It was built with
  React and Redux and has not changed since early 2018, but the hosted page still loads and shows the panel. The author notes
  that MIDI support was limited to Chrome when it was written. Nothing is flashed.
status: dormant
