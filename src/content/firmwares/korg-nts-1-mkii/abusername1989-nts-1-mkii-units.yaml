device: korg-nts-1-mkii
name: Abusername1989 NTS-1 mkII units
summary: Free collection of about 75 custom oscillators, pattern oscillators, modulation, delay and reverb units for the NTS-1 mkII, shipped as ready-to-load .nts1mkiiunit files with a how-to text for many of them.
description: >-
  The repository holds prebuilt NTS-1 mkII units sorted into oscillator,
  pattern_osc, modulation, delay and reverb folders, plus a docs folder with a
  quick start text for many units listing the knob and parameter assignments.
  The oscillators include sound-alike patches such as a TR-909 drum voice, an
  M1-style piano and an acid bass; a pattern_osc folder holds
  more oscillators. There are also arpeggiator,
  chorus, flanger, tape wobble and several reverb units. Only compiled units
  are committed; the repository holds no source, and the README says bugs may
  remain.
