device: korg-nts-1
name: Lissa delay (boochow)
summary: Delay unit that passes the input to the right channel and writes a sweep signal to the left, so an XY oscilloscope shows the input as a Lissajous figure.
description: >-
  The unit leaves the right output channel carrying the input unchanged and
  uses the left for a sweep signal that can be a sine wave, a sawtooth or the
  input delayed by a quarter of a cycle. Time (a MIDI note number) tunes the
  sweep to the played pitch, depth sets its level and shift-depth picks the
  waveform and offset. It is meant for watching waveforms on an oscilloscope,
  not for music production, and is the delay half of the Picture oscillator
  setup. The manifest targets the NTS-1 platform and the repository lists
  other logue SDK synths as compatible.
status: dormant
