device: korg-nts-1
name: Picture oscillator (boochow)
summary: Wavetable oscillator whose waveforms encode line drawings that appear on an XY oscilloscope when paired with the Lissa delay; the polygon data is edited in a header file.
description: >-
  Picture places the X and Y coordinates of a polygon in different quarters of
  one waveform, and the Lissa delay's quarter-cycle delay lines them up so an
  oscilloscope in XY mode shows the figure. The shape knob squashes the picture
  and the shift-shape knob chooses among the stored figures; the manifest
  also exposes a phase and an interpolation setting. To keep the figure stable
  the delay time has to follow the played pitch, which the author does by
  converting note numbers to a control change with a MIDI plugin on a
  computer. The release includes a second figure build and the Lissa delay.
