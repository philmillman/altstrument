homepage: https://github.com/boochow/schroeder
distribution: download
install_notes: >-
  Download the unit for your synth from the release (.ntkdigunit,
  .mnlgxdunit, .prlgunit or .nts1mkiiunit) and load it with Korg's Librarian,
  or KORG KONTROL Editor for the NTS-1 mkII.
