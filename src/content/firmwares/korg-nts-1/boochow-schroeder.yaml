device: korg-nts-1
also_devices: [korg-minilogue-xd, korg-prologue, korg-nts-1-mkii]
name: Schroeder reverb (boochow)
summary: Basic mono Schroeder reverberator without early reflections for the logue SDK, with release builds for NTS-1, minilogue xd, prologue and NTS-1 mkII.
description: >-
  The unit is a plain Schroeder-style reverb, mono and without early
  reflections. The repository has
  manifests for the NTS-1, minilogue xd and prologue, and the release adds an
  NTS-1 mkII file. It is a short project with a two-line README.
status: dormant
