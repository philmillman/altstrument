device: korg-nts-1
also_devices: [korg-minilogue-xd, korg-nts-1-mkii]
name: Teleconf (boochow)
summary: Modulation effect that runs input through a bandpass filter and a G.711 a-law codec to sound like a teleconference line; builds for NTS-1, minilogue xd and NTS-1 mkII.
description: >-
  Time sets the resonance of the filters and depth mixes the processed signal
  into the output. The release notes say no prologue build exists. The
  repository holds source with a manifest for the NTS-1 platform; the minilogue
  xd and NTS-1 mkII files come only as release assets.
