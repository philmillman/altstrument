    url: https://github.com/boochow
source: https://github.com/boochow/veryshort
source_status: open
license: MIT
license_notes: LICENSE file is MIT, Copyright 2020 boochow.
homepage: https://github.com/boochow/veryshort
distribution: download
install_notes: >-
  Download the unit for your synth from the release (.ntkdigunit,
  .mnlgxdunit, .prlgunit, .nts1mkiiunit or .drmlgunit). Load it with Korg's
  Librarian, KORG KONTROL Editor (NTS-1 mkII) or by copying the file to the
  drumlogue's Units folder.
