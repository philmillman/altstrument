device: korg-nts-1
also_devices: [korg-minilogue-xd, korg-prologue, korg-nts-1-mkii, korg-drumlogue]
name: Very Short Delay (boochow)
summary: Delay for 0.5 to 50 ms with feedback from -0.98 to +0.98, which acts as a comb filter; runs on NTS-1, minilogue xd, prologue, NTS-1 mkII and drumlogue.
description: >-
  The delay time is short enough that the unit adds metallic, comb-filter
  colouring instead of echoes. Feedback may be negative. The main branch
  builds for the NTS-1, minilogue xd and prologue; the NTS-1 mkII and
  drumlogue versions are on their own branches, and the 1.1 release carries
  units for all five. Release 1.1 smoothed delay time changes, lengthened the
  maximum delay and allowed negative feedback.
status: dormant
authors:
