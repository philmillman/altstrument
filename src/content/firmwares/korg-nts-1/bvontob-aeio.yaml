device: korg-nts-1
name: aeio
summary: Formant oscillator for the NTS-1 with a single random parameter; source only, with no README and no prebuilt unit.
description: >-
  aeio is a user oscillator that produces vowel-like formant sounds, as the
  repository description says. Its manifest has one parameter, named rand.
  The repository has a main.c, a biquad header and the logue SDK makefile
  layout, no README and no releases, so it has to be built inside an SDK
  checkout.
status: dormant
