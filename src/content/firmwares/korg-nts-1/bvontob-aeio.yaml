homepage: https://github.com/bvontob/aeio
distribution: source-only
install_notes: >-
  No prebuilt unit is published. Build it with the logue SDK for the NTS-1 and
  load the result with Korg's Librarian or logue-cli.
tags: [oscillator, formant, open-source, nts-1]
