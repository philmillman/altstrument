device: korg-nts-1
name: bell
summary: Oscillator for the NTS-1 that models Risset's bell with hold, compression and attack parameters; source only, with no README and no prebuilt unit.
description: >-
  bell is a user oscillator that follows Jean-Claude Risset's additive bell
  tone. The manifest lists three parameters: hold, comp and att. The
  repository has a main.c and the logue SDK makefile layout, no README and no
  releases, so it has to be built inside an SDK checkout.
