device: korg-nts-1
name: dbar
summary: Drawbar organ oscillator for the NTS-1 with bar, percussion and dirt parameters; source only, with no README and no prebuilt unit.
description: >-
  dbar is a user oscillator that imitates a drawbar organ. The manifest lists
  three parameters: bar (0 to 9), perc (0 to 9) and dirt (a percentage). The
  repository has a main.c and the logue SDK makefile layout, no README and no
  releases, so it has to be built inside an SDK checkout.
status: dormant
