device: korg-nts-1
name: fbos
summary: Custom oscillator for the NTS-1 built on a resonant feedback delay network, with resonance, overtone and noise parameters; a prebuilt unit is on the releases page.
description: >-
  fbos is a user oscillator whose tone comes from a feedback delay network.
  The manifest lists five parameters: resonance, overtone mix, overtone Q,
  overtone type and noise. The DSP code is pulled in as a git submodule from
  the author's logue-dsp-c library.
status: dormant
