device: korg-nts-1
name: sat
summary: Saturation effect for the NTS-1's modulation effect slot; source only, with no README and no prebuilt unit.
description: >-
  sat is a user modulation effect that adds saturation to the signal. Its
  manifest declares no named parameters. The repository has a main.c and the
  logue SDK makefile layout, no README and no releases, so it has to be built
  inside an SDK checkout.
