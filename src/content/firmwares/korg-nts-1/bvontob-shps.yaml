device: korg-nts-1
name: shps
summary: Oscillator for the NTS-1 combining waveshaping, ring modulation and sync; source only, with no README and no prebuilt unit.
description: >-
  shps is a user oscillator that, according to the repository description,
  uses waveshaping, ring modulation and sync. Its manifest declares no named
  parameters. The repository has a main.c and the logue SDK makefile layout,
  no README and no releases, so it has to be built inside an SDK checkout.
