device: korg-nts-1
name: Hungry Driven
summary: Mod FX unit that applies a soft-clipping overdrive up to ten times in series, with a dry/wet control.
description: >-
  The repository liopic/logue-osc-fx holds one unit so far, Hungry Driven, a
  parabolic soft-clipping overdrive. Param A sets how many overdrive stages are
  chained, from one to ten, and param B sets the dry/wet balance. The README
  says it is tuned for the NTS-1 and should work on other logue SDK
  instruments, with that untested by the author, who owns only an NTS-1. The
  repository holds the source and a built unit file.
