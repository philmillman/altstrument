device: korg-nts-1
name: KNGWSIN
summary: Sine oscillator unit for the NTS-1 digital kit with a continuous harmonic multiplier, a sub-oscillator mode and a self-feedback phase modulation mode.
description: >-
  KNGWSIN is a user oscillator unit built with the logue SDK. Control A
  sweeps the oscillator's frequency multiplier from the fundamental up to the
  sixteenth harmonic, passing through inharmonic ratios, and the panel LFO can
  modulate it. Control B depends on a MODE menu setting. In mode 0 it blends
  in a sine sub-oscillator one octave down. In mode 1 it sets the depth of
  self-feedback phase modulation, which adds upper harmonics. The output goes
  through a soft clipper. The repository holds the source and a built unit
  file, and the release carries the same unit.
status: active
