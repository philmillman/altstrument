device: korg-nts-1
name: Reverse Echo
summary: Delay effect unit that records a one to two second slice of input and plays it back reversed with a trailing echo.
description: >-
  Reverse Echo is a delay FX unit. Knob A sets the length of the audio to
  reverse, between one and two seconds, knob B sets the length of the trailing
  echo and shift B sets the wet/dry mix. The README lists version 2.0 as
  working on the NTS-1, which is the only instrument it has been tested on, and
  marks the NTS-1 mkII, NTS-3, minilogue xd and prologue as untested. Earlier
  compiled versions are kept on the author's GitHub Pages site.
