device: korg-nts-1
name: Stutter
summary: Mod effect unit that records a very short slice of input and repeats it up to 50 times.
description: >-
  Stutter is a mod FX unit. Knob A sets the length of the captured slice, from
  zero up to about two milliseconds, and knob B sets how many times it repeats,
  from zero to 50. The README lists version 3.0, working on the NTS-1, with the
  minilogue xd marked as in testing and the NTS-1 mkII, NTS-3 and prologue as
  untested. Earlier compiled versions are kept on the author's GitHub Pages
  site.
