device: korg-nts-1
name: NTS-1 Web Controller
kind: tool
summary: Browser control surface for the Nu:Tekt NTS-1 over Web MIDI, with virtual knobs for every parameter, a keyboard with hold and arpeggiator modes, eight patch slots kept in the browser and live MIDI device monitoring.
description: >-
  A Vue and Quasar app that sends MIDI control changes to the NTS-1 as you move on-screen knobs and menus for the oscillator,
  filter, envelope, modulation, delay, reverb and arpeggiator. The keyboard page plays notes with octave shifting and a hold
  or arpeggiator mode. Patches can be stored and recalled from eight slots in the browser's local storage. It also
  shows which MIDI devices are connected. The hosted copy is the quickest way to try it, and it can be built and run locally.
  Nothing is flashed.
