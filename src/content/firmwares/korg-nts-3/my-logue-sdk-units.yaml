device: korg-nts-3
also_devices: [korg-nts-1-mkii, korg-microkorg-2]
name: my-logue-sdk-units
summary: >-
  Collection of about sixty logue SDK units, mostly NTS-3 kaoss pad effect and drum units plus a few oscillators for the NTS-1 mkII and microKORG2, with a hosted page that previews them in the browser and sends them over Web MIDI SysEx.
description: >-
  Rights warning: several drum units embed audio read from Roland TR-909 ROM chips (the hi-hat and ride images in plugins/common, hhat and ride909, and a ride WAV), and the README
  names the 909 ROM as the voice source. Roland's rights in that audio are not addressed in the repository.

  Each plugin keeps one shared DSP header and a thin adapter per target. In the source tree, 58 plugins have an NTS-3 genericfx target, 7 have an NTS-1 mkII target and 4 a microKORG2 target. The set includes
  feedback and saw-stack oscillators, a shaker, an acid bass, tempo-synced slicers and glitch effects, and many drum and groove
  units, some flagged experimental and shown only with a query option on the page. The page loads the compiled units, previews them with a WebAssembly
  build and sends NTS-1 mkII and NTS-3 units to the instrument over Web MIDI SysEx. microKORG2 units are copied by USB mass storage instead, since SysEx loading does not work there. The README lists minilogue xd, prologue, NTS-1 and
  drumlogue as targets, but the tree has no plugin with a target for them. The author calls the project under construction.
status: active
