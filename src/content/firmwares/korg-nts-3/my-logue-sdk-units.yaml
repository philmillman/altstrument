source_status: open
license: BSD-3-Clause
license_notes: >-
  Korg's logue SDK, included as a submodule, keeps its own BSD 3-Clause license. The TR-909 ROM-derived audio is not covered by this license.
homepage: https://mosynthkey.github.io/my-logue-sdk-units/
distribution: browser-installer
requires_stock: NTS-3 or NTS-1 mkII with unit support; microKORG2 firmware 2.0 or later
install_notes: >-
  Open the hosted page in a Chromium browser, preview a unit and send it to an NTS-1 mkII or NTS-3. For the microKORG2, download the mk2unit file,
  boot the synth into USB mass storage with FUNCTION 1 held, copy the file into an empty folder under Units/Oscs, and pick it with FUNCTION 5. Units run next to the stock firmware, which is not changed.
brick_risk: false
