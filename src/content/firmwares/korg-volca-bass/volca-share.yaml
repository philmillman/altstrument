install_notes: >-
  Open the hosted site, build a patch on the bass or keys form, connect the volca by USB-MIDI or a MIDI interface and use the
  sync button in a browser with Web MIDI. To run your own copy, follow the README steps for Ruby, Node and MongoDB.
