device: korg-volca-bass
also_devices: [korg-volca-keys]
name: VolcaShare
kind: tool
summary: Patch sharing site for the volca bass and volca keys, with a Rails back end. Patches are edited on forms that look like the panel and can be sent to the synth over Web MIDI. Also has randomise, sequence storage and browser emulators.
description: >-
  A Ruby on Rails and MongoDB application behind volcashare.com. Users can sign in, save and tag patches for either synth,
  keep some private, attach audio samples and note sequences, and browse patches ranked by completeness and age. A patch
  page can sync its settings to a connected volca over Web MIDI by sending control changes, and a randomise button changes
  parameters at random. Two in-browser emulators, a three-oscillator monosynth with a step sequencer for the bass and a
  polysynth for the keys, let you try settings without the hardware. The repository can be run locally with Ruby, Node and
  MongoDB, and the README says to remove the reCAPTCHA code first. Nothing is flashed.
