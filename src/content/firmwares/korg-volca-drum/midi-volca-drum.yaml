    url: https://github.com/hansdesmedt
source: https://github.com/hansdesmedt/midi-volca-drum
source_status: open
license: MIT
license_notes: The README states MIT and refers to a LICENSE file, but the repository has none.
distribution: source-only
install_notes: >-
  Run npm install at the repository root, then npm run dev inside the web folder, open the page in a browser with Web MIDI and
  connect the volca drum.
brick_risk: false
tags: [editor, web-midi, midi, web]
