device: korg-volca-drum
name: MIDI Volca Drum Editor
kind: tool
summary: React and TypeScript patch editor for the volca drum that sends parameter changes over Web MIDI, with six parts, two layers, a pitch note display and part save and load as JSON. It has no hosted copy and runs from a local build.
description: >-
  A monorepo holding a web app, shared UI components and a MIDI helper package. The app shows the six parts of the volca drum
  with layered controls, sends each change to the connected synth as a control change, saves and loads single parts as JSON
  files and has keyboard shortcuts for switching parts. The repository also has a Railway deployment file and a folder of
  Python MIDI utilities. Nothing is flashed.
status: active
authors:
