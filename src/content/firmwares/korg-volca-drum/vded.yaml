device: korg-volca-drum
name: VDED
kind: tool
summary: Browser control surface for the volca drum over Web MIDI, with a 16-step sequencer for all six parts, per-layer knobs, a waveguide panel, presets and a MIDI map. It sends only control changes and notes; the synth does the sound. Japanese README.
description: >-
  A Vite app that edits the six parts and two layers of each part through the synth's published control changes, including the
  packed source, modulation and envelope select value. It adds a step sequencer with tempo, swing, gate, per-step velocity and an
  optional MIDI clock, plus a table and dial view of all layers, a remappable MIDI map and presets kept in the browser and
  exportable as files. It works in the volca drum's split-channel mode and, with fewer controls, in single-channel mode. A
  SEND ALL button pushes every on-screen value to the synth, because the volca drum does not send its knob positions back.
  The README, in Japanese, asks for volca drum firmware 1.11 or later and for MIDI RX Short Message to be on, and says motion
  sequences, choke and program storage cannot be controlled over MIDI. Nothing is flashed.
status: active
authors:
