    url: https://github.com/LouisYOSHINAGA
source: https://github.com/LouisYOSHINAGA/vded
source_status: open
license: MIT
license_notes: The README states MIT. The repository has no LICENSE file.
homepage: https://louisyoshinaga.github.io/vded/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a Chromium browser, connect a USB-MIDI interface to the volca drum's MIDI IN and choose it as the
  device. On the synth, turn MIDI RX Short Message on and use split channel mode. Press SEND ALL PARAMETERS to bring the synth
  in line with the screen.
brick_risk: false
