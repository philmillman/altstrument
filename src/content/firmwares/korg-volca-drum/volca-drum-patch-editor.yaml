device: korg-volca-drum
name: Volca Drum Patch Editor
kind: tool
summary: Browser patch editor for the volca drum over Web MIDI built from native web components. It edits all six parts and both layers, streams changes live, links layers, and produces shareable patch codes with LCD-style values.
description: >-
  Every per-layer and per-part parameter the volca drum accepts over MIDI has a control, and turning Live on streams edits to
  the chosen MIDI output as the sliders move. A link option drives both layers of a part from one set of controls using the
  both-layers control changes. Layers and whole parts can be turned into copyable patch codes with comments, and values are
  shown the way the synth's screen shows them. A pitch quantization switch adds a chromatic pitch picker. The README says it
  was inspired by synthmata's volca drum editor. Nothing is flashed.
status: active
