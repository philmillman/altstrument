  notes: No tagged releases; this is the latest commit. The README names the patch version as 1.21 beta and says it was tested on a real volca fm2. Version 1.21 lets the chain run free of the Korg chain with recording, works REC and FUNC while a chain plays, copies the previous pattern into an empty one, adds a fixed REC mode, accepts Program Change in and saves the effect choice in the pattern.
