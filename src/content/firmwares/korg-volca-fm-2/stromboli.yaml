source: https://github.com/mongio/stromboli-fm2
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only and LICENSE is the GPL version 3 text. No Korg firmware, updater or WAV is in the
