  GPL and remain under Korg's licence, and that they will be removed if Korg asks.
homepage: https://github.com/mongio/stromboli-fm2
distribution: download
requires_stock: "1.12"
install_notes: >-
  Download the FM2_1_24_BETA zip from the GitHub release, or build the WAVs yourself: download the official volca fm2
  System Updater 1.12 from Korg, put the zip unchanged in reference/ and run build_release.py (Python 3.11 or later
  and LLVM 18 tools). Play the install WAV into SYNC IN after powering on
  holding FUNC and PLAY, as for a Korg update. The README says the bootloader and update receiver are not changed, the
  beta reports application version 1.11 so the official 1.12 WAV is always accepted, and the second built WAV restores
  the exact original 1.12. Do not play the WAVs through speakers or headphones.
brick_risk: false
tags: [sequencer, arpeggiator, fx, delay, scales, patcher, midi, fm]
versions:
