device: korg-volca-fm-2
name: STROMBOLI
summary: >-
  Beta patch for the volca fm2 firmware 1.12 that adds step probability, ratchet, microtiming and swing, new arpeggiator modes, scales, a tape LOFI delay, a phaser or tremolo and a free-order chain. Release WAVs contain Korg's firmware.
description: >-
  Rights warning: the GitHub release has ready-made update WAVs that contain Korg's firmware 1.12 with the patch
  applied. The Korg part is not under the GPL and remains Korg's; the project says the WAVs are offered for owners
  of a volca fm2 and will be removed if Korg asks. The patch adds per-step probability and trig conditions, a global probability, a virtual sustain (HOLD), seven extra
  arpeggio modes and arpeggio output on MIDI OUT. It also adds 15 musical scales with a root note that apply to the
  sequencer too, velocity humanize and random octave per pattern, and a tempo-synced or free-time delay, mono or
  ping-pong, that can stand in for the reverb, with a tape-style LOFI mode (hiss, wow and flutter, self-oscillation).
  Later versions add a Rhodes-style phaser or stereo tremolo in place of the chorus, ratchet, microtiming and swing per
  pattern, play direction per pattern and note mutation within the scale. The chain feature allows free order with repeats up to 64 entries, live
  chain capture and recording while a chain plays. It is for the second-generation volca fm only, not the 2016 model.
  The repository source holds no Korg firmware: a Python script reads the official updater 1.12 zip that the user
  downloads from Korg, checks every byte it touches and writes an install WAV, a WAV that restores the original 1.12
  and checksums. Since release 1.24 the same WAVs are also attached to the GitHub release. The WAVs are played into SYNC IN with the Korg update procedure. The
  README says the patch was tested on a real unit and in an ARM emulator, and the licence file says it was written with
  Claude's help.
status: active
