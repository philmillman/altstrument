    url: https://github.com/mosynthkey
source: https://github.com/mosynthkey/volcafm2-tools
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text, copyright 2025 Masaki Ono. THIRD_PARTY.md says the preview engine contains Apache-2.0 code
  from Google's music-synthesizer-for-android as vendored by Dexed; the GPL-3.0 parts of Dexed are not compiled in.
homepage: https://mosynthkey.github.io/volcafm2-tools/
distribution: browser-installer
install_notes: >-
  Open the hosted app in Google Chrome 153 or later, or install the macOS app from the releases page. Connect a MIDI interface
  to both MIDI IN and MIDI OUT of the volca fm2 and allow MIDI with SysEx access. Back up the unit from the app's library before writing over programs.
brick_risk: false
tags: [editor, librarian, sequencer, web-midi, sysex, midi, presets, web]
