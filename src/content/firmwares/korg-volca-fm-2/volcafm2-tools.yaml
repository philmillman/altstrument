device: korg-volca-fm-2
kind: tool
name: volca fm2 tools
summary: Browser and macOS desktop editor for the volca fm2's programs and sequences over MIDI SysEx. It edits and reorders the 64 programs, edits sequences on a piano roll, imports and exports DX7 SysEx, backs up the unit and previews sounds with a Dexed engine.
description: >-
  The app reads programs and the 16 sequences from the volca fm2 and writes them back, with a piano roll and motion editing for
  sequences and an editor for every program parameter. It can reorder the 64 programs stored on the unit, import and export DX7
  SysEx files, and keep programs, sequences and whole-unit backups in a library in the browser. A preview plays a program or a
  sequence through a WebAssembly build of the Dexed FM engine, which the author says does not fully match the hardware's
  sequencer. The unit connects through a MIDI interface on both its MIDI IN and MIDI OUT. The README says the web version needs a
  recent Chrome, and the macOS desktop app is offered for setups where Chrome cannot find the unit. Nothing is flashed.
status: active
authors:
