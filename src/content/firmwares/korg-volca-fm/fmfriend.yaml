    url: https://github.com/ahihi
source: https://github.com/ahihi/fmfriend
source_status: open
license: CC0-1.0
homepage: https://fmfriend.foldplop.com/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a browser with Web MIDI, connect a MIDI interface to the volca fm's MIDI IN and choose it as the
  output.
brick_risk: false
tags: [editor, web-midi, sysex, midi, web]
