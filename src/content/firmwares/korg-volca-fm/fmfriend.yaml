device: korg-volca-fm
name: FMFriend
kind: tool
summary: Browser patch editor for the volca fm over Web MIDI, with sliders for every operator and global DX7-style parameter plus a patch name field. The author says it might also work with a Yamaha DX7.
description: >-
  A small Vue page that lists the MIDI outputs, shows six operator panels and a global panel, and sends each slider change
  to the volca fm as DX7-format parameter data. The patch name is edited in the same page. The volca fm cannot send its patch
  back, so the page edits from its own values. The code is one HTML file and a few scripts, with its libraries included.
  The last commit is from 2016. Nothing is flashed.
status: dormant
authors:
