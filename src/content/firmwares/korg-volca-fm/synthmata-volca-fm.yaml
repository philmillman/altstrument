device: korg-volca-fm
also_devices: [korg-volca-fm-2, yamaha-dx7]
name: synthmata Volca FM Editor
kind: tool
summary: Browser patch editor for the volca fm and the 2022 volca fm 2 over Web MIDI, also usable with a Yamaha DX7. Every operator and global parameter has a control, with a randomiser and a sharable patch link.
description: >-
  A page of operator panels and a global panel that sends DX7 SysEx parameter changes to the connected instrument as you move
  them. The instrument menu offers the original volca fm, the 2022 model with the green display, or a DX7, which can also send
  its voice back when it is set to channel 1. The patch is sent automatically when the interface, instrument or channel is
  chosen. Envelope shapes are drawn on the page, a randomiser changes parameters in bulk, and the whole patch can be stored in
  a shareable link. The page adds notes on MIDI interfaces and on the type A adapter for the minijack MIDI ports of the newer
  model. Nothing is flashed.
status: dormant
