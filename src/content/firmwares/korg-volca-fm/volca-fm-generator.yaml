device: korg-volca-fm
also_devices: [korg-volca-fm-2]
name: volca fm generator
kind: tool
summary: Browser tool that builds DX7-style voices from a tonality wheel instead of parameters and plays them in a built-in DX7 engine or sends them to a volca fm or volca fm 2 over Web MIDI. Voices export as .syx.
description: >-
  Rights warning: the Start from list reproduces the parameters of 41 classic Yamaha DX7 factory voices, and two piano voices
  of unknown authorship taken from the cartridge collection that comes with Dexed.

  You place up to three pins on a wheel of twelve tonalities, then shape envelope, brightness, register, effects and
  velocity, and the app builds the six operators, algorithm and envelopes. Variation and mutate buttons move the result, and
  an advanced view edits every parameter. Voices can be kept in the browser, exported as .syx files or as a 32-voice DX7
  cartridge, and DX7 cartridges can be opened and auditioned. The sound engine in the page follows the DX7 and is tuned
  against a volca fm 2. Voices go to the volca over Web MIDI through a MIDI interface and replace the sound of the program
  that is selected until another program is chosen. The page cannot read voices back. The author tested on a volca fm 2 and
  the original volca fm, and the original model has no velocity or chorus control. The code was written with Claude under the
  author's direction. Nothing is flashed.
