homepage: https://privatepublic-de.github.io/volca-fm-generator/
distribution: browser-installer
install_notes: >-
  Open the hosted app in Chrome, Edge or Firefox, pick the volca model, press Connect the volca and allow MIDI access.
  Firefox first offers a small site-permission add-on for MIDI with SysEx. Connect a MIDI interface to the volca's MIDI IN.
  On the volca fm 2, turn on MIDI Short Message to control chorus and reverb depth. To keep a voice, write it on the volca
  itself.
brick_risk: false
