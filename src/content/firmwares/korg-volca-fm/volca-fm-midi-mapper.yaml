    url: https://github.com/kristianj
source: https://github.com/kristianj/volcafm
source_status: open
license: unspecified
license_notes: No license file or statement in the repository.
distribution: source-only
install_notes: >-
  Open index.html from a local web server in a browser with Web MIDI, then connect the keyboard to the
  MIDI input and the volca fm to the MIDI output.
brick_risk: false
