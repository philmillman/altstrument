device: korg-volca-keys
also_devices: [korg-volca-bass]
name: volca seq editor
kind: tool
summary: Browser piano-roll sequence editor for the volca keys and volca bass over Web MIDI. Neither synth has MIDI out or SysEx, so it transfers by playing the pattern into the synth's real-time record with MIDI start, clock, notes and optional CC motion.
description: >-
  A Vue 3 and Vuetify app with a model menu that switches the CC map and colours between the keys and the bass. It offers a
  piano-roll with step on and active-step editing, a finer in-step timing mode for the keys, per-oscillator lanes for the bass,
  Euclidean fills, and motion lanes that are sent as control changes. To send a sequence you press REC on the volca, then
  start the transfer, which plays MIDI start, clock and notes for one or more passes before stopping. Sequences import and
  export as standard MIDI files or JSON and are kept in a local library in the browser. The README, in Japanese, cites Korg's
  MIDI implementation chart for the lack of SysEx and MIDI out, and says the editor adapts ideas from the author's volcafm2
  tools. Nothing is flashed.
