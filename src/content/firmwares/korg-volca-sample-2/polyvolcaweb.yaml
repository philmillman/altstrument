device: korg-volca-sample-2
kind: tool
name: PolyVolcaWeb
summary: Browser app that turns a volca sample2 into an eight-voice chromatic sample player. It takes notes from a MIDI keyboard and sends them to the volca's parts as note and chromatic pitch messages over Web MIDI. No SysEx is used.
description: >-
  The page reads notes from a chosen MIDI input and shares them across the volca's channels so several notes can sound at once.
  It sets each channel's pitch through the volca sample2's chromatic speed control change and maps velocity to level. Channel
  allocation can be round robin or based on the number of active notes. Further options include an octave offset, a stereo spread
  that pans lower notes left and higher notes right, a reverb switch, sustain pedal handling, a global sample selector and
  layered sampling that picks a different sample for each velocity range. The page is plain JavaScript with no libraries. The
  author first built it as a Max for Live device. Nothing is flashed.
