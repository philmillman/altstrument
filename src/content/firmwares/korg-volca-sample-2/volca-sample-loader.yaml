device: korg-volca-sample-2
kind: tool
name: sample loader for volca sample 2
summary: Single-page browser app that records or opens audio, trims and processes it, and sends it to a volca sample2 over USB MIDI SysEx. It also lists the 200 slots, backs them up to a zip file, restores them, and plays the parts from on-screen pads.
description: >-
  The page records from a microphone or line input or opens common audio files, trims the sample on a waveform and applies gain,
  pitch shift, high cut, fades, normalising and reverse. A preview plays the result as the unit will hold it, mono at 31.25 kHz and
  16-bit. Samples go to a chosen slot over the volca's USB MIDI SysEx protocol, which Korg has not published and which the
  author ported to JavaScript from the open-source volsa2 project. The library view lists all 200 slots with name and length,
  and a backup saves every slot as a WAV file in one zip that can be restored later. The README says the code was tested against
  captured data dumps and a simulated unit, and asks for reports from real hardware. Nothing is flashed.
