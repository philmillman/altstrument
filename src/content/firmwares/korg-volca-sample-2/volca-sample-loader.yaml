distribution: browser-installer
install_notes: >-
  Use Chrome or Edge on a computer, or Chrome on Android with a USB OTG cable, and connect the volca sample2 by its micro-USB
  cable. Allow MIDI with SysEx access when asked. The hosted copy is served over plain HTTP, which browsers may treat as an
  insecure page for MIDI; if the unit cannot be reached, download index.html from the repository and open it from disk or host
  it over HTTPS. Back up all samples first. Very long samples can make the volca stop answering, and switching it off and on
  recovers it with the memory intact.
brick_risk: false
