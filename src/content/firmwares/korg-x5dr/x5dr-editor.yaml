device: korg-x5dr
kind: tool
name: X5DR Editor
summary: Browser editor and librarian for the Korg X5DR over Web MIDI SysEx. It edits programs, combinations, multis, drum kits and global settings in real time, reads and writes the module, and loads and saves .syx files. X5D, X5 and 05R/W are expected to work but are untested.
description: >-
  Rights warning: the editor ships both factory soundbanks as data captured from a real X5DR, which the README says are Korg's
  original sound data and are not covered by the MIT licence. The repository also holds hardware capture .syx files and tables
  transcribed from Korg's owner's manual.

  Programs have six pages with draggable envelopes and an equaliser curve, and edits are sent as you move a control. The app
  covers all 47 effect types with routing diagrams, combinations, multis, both drum kits and the global settings. Changes can be
  written in place or to a new slot, and anything not written can be discarded. Data files can hold any mix of programs,
  combinations, multi, drums and global data, and the device menu imports from or writes to the module. A browser-side All Notes Off
  button stops stuck notes. The editor sends no notes. The same page can be installed as an app, or downloaded from the
  releases as a single offline HTML file. Nothing is flashed.
status: active
authors:
