source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text, copyright 2026 Mark Baylis, and covers the editor's code. The README excludes the built-in
  factory soundbanks A and B, which are Korg's sound data, and notes that the tables under docs/ are transcribed from Korg's
  manual. Fonts are under the SIL Open Font License.
homepage: https://baylo1.github.io/x5dr-editor/
distribution: browser-installer
requires_stock: X5DR; X5D, X5 and 05R/W untested
install_notes: >-
  Use Chrome or Edge, with a MIDI interface wired both ways between computer and module. On the X5DR enable SysEx reception in
  the global settings, turn off program and combination write protection to write, and set the editor's channel to the
  module's global MIDI channel, since other channels are ignored. Close any DAW that holds the MIDI port.
brick_risk: false
tags: [editor, librarian, web-midi, sysex, midi, presets, web]
