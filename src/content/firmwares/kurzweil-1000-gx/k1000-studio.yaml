device: kurzweil-1000-gx
name: K1000 Studio
kind: tool
summary: Windows tool that turns WAV files into wave ROM images and a matching SETUP image for the 1000 GX, adding up to 33 new patches while the factory sounds stay; not yet tested on a real unit.
description: >-
  Kurzweil's data is not included. The tool asks for the user's own dumps of the
  two GX SETUP chips (V2.5), converts dropped-in WAV files of any bit depth to
  12-bit samples at 30, 15 or 7.5 kHz, lets the user trim, loop and set a root
  note per sample, and writes chip images for the two empty wave ROM banks
  together with a new SETUP that appends the sounds as patches 160 to 192
  without moving any factory byte. It re-reads the images it built to check
  them and can call minipro to program the chips on an XGecu T48. At 30 kHz the
  two free banks hold about 69 seconds of sound. The repository has a write-up
  of the wave ROM and SETUP formats, worked out from the factory data and
  firmware. The author says it has not been played on real hardware yet and
  that the first chip burn is next. The PX Plus, SX and HX SETUP versions are
  not supported, and reaching the new patches from the front panel is
  unconfirmed. The author credits Claude for part of the work.
status: active
