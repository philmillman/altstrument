source: https://github.com/yuyoi/Kurzweil-1000-Rosetta
source_status: open
license: MIT
license_notes: >-
  The README says no Kurzweil ROM data is included and that ROMs built with it
  are for the builder's own unit.
homepage: https://yuyoi.github.io/Kurzweil-1000-Rosetta/
distribution: source-only
requires_stock: SETUP V2.5 (U22 and U33 chips)
install_notes: >-
  Runs on Windows with Python 3.10 or newer, PySide6, numpy and sounddevice.
  Needs a chip programmer and minipro, six W27C040 chips for the two empty wave
  ROM banks and two W27C512 chips for the new SETUP, with the stock jumpers
  unchanged. The new SETUP replaces U22 and U33 inside the case and has to match
  the wave ROMs fitted. Keep the original SETUP chips, which are the way back
  to the stock unit.
brick_risk: true
tags: [sampler, converter, patch, hardware, python]
