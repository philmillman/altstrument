device: line-6-amplifi-tt
kind: tool
name: line6-tt
summary: Rust GUI and command-line tool that controls an AMPLIFi TT over USB from Linux, with tone librarian and editor, audio routing, and guarded firmware inspection and flashing. No custom firmware image is published.
description: >-
  Rights warning: the repository includes six block icons taken from Line 6's AMPLIFi app, two Line 6 tone files used as
  test data, and the API key from Line 6's app in the source.

  The author reverse engineered the TT's USB editor protocol, boot layout and firmware container from Line 6's own updater
  and app, and documented it in a large set of research notes. The tools list and edit the 100 onboard tones, import and
  export official .l6p presets, switch to a clean guitar signal, mute the guitar, set the master level, choose the Amp or Main
  guitar route and set up JACK or PipeWire routing to an external effects host. Tone writes take a full bank backup first.
  The Line 6 Cloud page logs in to Line 6's web service with your Line 6 account to search and download community tones, so
  it sends your login to a vendor service.

  Most of these features depend on a modified copy of the TT's 2.61 main firmware image that the author built and
  installed on their own unit. It adds a loader that accepts small agent programs over USB into RAM, and those agents
  carry the controls. The repository holds the C sources, patch builders and research for this, but no firmware image or
  SD card image, and the builders read Line 6 files from the author's local directories that are not in the repository.
  The documentation shows the modified build running on the author's unit through many iterations, with several failed
  placements early on that needed the microSD card rewritten, and the author then returned the unit to stock 2.61 and
  recorded a final recovery check. The firmware commands install a file you supply: stock-reflash accepts only the pinned
  official 2.61 hash, and custom-reflash accepts any file that passes its checks. The README says a failed flash can leave a
  unit needing its microSD card restored. 96 kHz, extra USB channels and onboard routing were ruled out by the author as
  hardware limits.
status: active
