source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text for the project's original code. The README says Line 6 and AMPLIFi names belong to
  their owners. The repository holds no Line 6 firmware, installers, device backups or SD card images, but it includes the
  Line 6 app icons, two Line 6 tone files and the app's API key noted above, which the MIT license does not cover.
distribution: source-only
requires_stock: AMPLIFi TT firmware 2.61
install_notes: >-
  Needs Linux, a Rust toolchain and libusb. Build with cargo build --release and run packaging/install-user.sh, then
  install the included udev rule to use the TT without sudo. Offline firmware inspection with line6-tt inspect does not
  touch the unit. Flashing needs the TT in its Tone+Tap recovery mode and a firmware file you obtained yourself. Keep a
  verified copy of the original microSD card image before any flash, and do not cut power during a transfer.
brick_risk: true
