device: line-6-dl4-mkii
kind: tool
name: DL4 Conductor
summary: macOS Swift app and CLI that makes a Mac the MIDI clock master for one to four DL4 MkII pedals, sequences delay subdivisions and feedback sweeps, routes a MIDI grid controller to the loopers, and serves a phone looper remote.
description: >-
  The conduct mode sends MIDI clock so the pedal's repeats follow the tempo, steps through subdivisions per bar and
  sweeps feedback with a tempo-synced LFO, and plays a different subdivision on a second pedal. The grid mode
  learns pad presses from a USB MIDI controller such as a Midi Fighter 64 and turns them into looper commands for a
  chosen pedal, with LED feedback, quantised triggers and a re-sync of running loops from an incoming clock, because the
  DL4's looper ignores MIDI clock. The loop mode serves a small web page on the local network for a phone. All
  control is MIDI on channel 1 using the DL4 MkII's documented messages, and the app only sends MIDI. Several roadmap
  items, such as four-pedal addressing and LED colour calibration, are marked as still needing checks on real
  hardware. It builds with the Swift toolchain on macOS 13 or newer.
status: active
authors:
