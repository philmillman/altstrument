    url: https://github.com/clearchaos3
source: https://github.com/clearchaos3/dl4-conductor
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and no license statement.
distribution: source-only
install_notes: >-
  Run make-app.sh to build and install the app into Applications, or use swift run dl4 with list, test, conduct or
  loop. For clock sync set the pedal's Receive MIDI Clock global setting to Auto or On. The DL4 MkII's USB-C port
  carries MIDI and firmware only, not audio.
