device: line-6-dl4-mkii
kind: tool
name: DL4 Controller
summary: Web MIDI page that controls a DL4 MkII from a desktop or phone browser, with preset selection, delay and reverb model and parameter controls, looper controls and sync settings. Hosted on GitHub Pages and written in plain JavaScript.
description: >-
  The page sends MIDI to the pedal over USB through the browser's Web MIDI API and uses Material Design
  Components for its layout, which is meant to work on desktop and mobile. It covers presets, the delay and reverb
  models with their knobs, and the looper, and later commits added a settings view and a sync option. Web MIDI needs
  a Chromium browser or Firefox with the MIDI permission. The README does not describe hardware testing or which
  firmware versions were used.
