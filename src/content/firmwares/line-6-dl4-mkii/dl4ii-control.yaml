device: line-6-dl4-mkii
kind: tool
name: DL4 MkII Control
summary: Windows desktop app that sends the DL4 MkII's documented MIDI messages over USB, with separate delay and reverb selectors, preset recall, bypass, tap and channel and preset step buttons, so models can be changed without the pedal's menus.
description: >-
  The author built it because choosing delays on a pedalboard, and reverbs in particular, is awkward on the pedal
  itself. It follows the MIDI commands in the DL4 MkII manual and splits the delay and reverb pickers into two
  panels that update together. It has a MIDI channel setting, a preset number box, bypass by pressing the active
  footswitch as on the pedal, preset store in the app's configuration file, footswitches for the three lowest
  presets, and error messages for MIDI that could not be sent. Version 1.7 was updated for DL4 MkII firmware 1.10,
  which changed the bypass command. The tap tempo light does not show the current tempo, and looper
  controls are still listed as pending. It is a C# WPF application.
status: dormant
