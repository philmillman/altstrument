distribution: download
requires_stock: DL4 MkII firmware 1.10 for release 1.7
install_notes: >-
  Download DL4MkII_Control.zip from the releases page. Connect the pedal by USB-C and set the app's MIDI channel
  to match the pedal's, because the stored default is channel 2.
brick_risk: false
