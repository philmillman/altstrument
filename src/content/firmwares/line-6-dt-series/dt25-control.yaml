device: line-6-dt-series
kind: tool
name: DT25 Control
summary: Browser-based MIDI controller for the Line 6 DT25 that sends CC messages over USB MIDI or Bluetooth MIDI to the amp's MIDI input. It covers channels, voicings, amp, cab, power amp and reverb, with presets kept in the browser. DT50 options are hidden by default.
description: >-
  The page generates its controls from a JSON parameter file built from Line 6's DT amplifier MIDI implementation guides. Since
  the amp has no MIDI output and no program change, the app keeps its own copy of all eight channel and voicing slots, and its Send
  slot and Sync all buttons push them to the amp. It lists the amp, cab and reverb models, has a mode for amps on firmware before
  2.0 that accept only the CCs from the Pilot's Guide, and can show DT50 controls for the 12AX7 boost, PI B+ voltage and
  feedback cap. The README notes that one documented CC, 122, did not respond on a real DT25, and nothing says the DT50 settings
  were tried on a DT50. Presets export and import as JSON, and a profile file moves the whole setup between devices. It runs on GitHub Pages.
status: active
authors:
