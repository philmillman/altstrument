    url: https://github.com/Giovanni-Russo-Boscoli
source: https://github.com/Giovanni-Russo-Boscoli/line6-dt25-MIDI-controller
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and no license statement. data/dt25-params.json lists parameter names, CC numbers and model
  names taken from Line 6's MIDI implementation guides.
homepage: https://giovanni-russo-boscoli.github.io/line6-dt25-MIDI-controller/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or Opera, or serve the folder locally, since Web MIDI needs https or localhost. Connect a
  USB-to-MIDI interface from its MIDI OUT to the amp's 5-pin MIDI IN. The amp listens on MIDI channel 1. Safari has no Web MIDI.
brick_risk: false
