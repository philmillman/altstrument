device: line-6-fbv
name: Line 6 Protocol Research
kind: tool
summary: Documentation and Python tools for the serial protocol between Line 6 FBV foot controllers and their hosts. It has a frame decoder, a capture differ, a structure analyzer and a receive-only serial logger, with notes on commands, IDs, handshake and FBV2 electronics.
description: >-
  The repository collects what public source code, forum posts and teardown reports say about the FBV message frames, and
  labels each statement as confirmed in source, confirmed in two projects, inferred or reported by others. The docs cover
  commands, the FBV 3 physical control IDs, the handshake, display and LED messages, electrical families and host mappings, and
  have plans for custom pedals that imitate only the functions a target amp needs. The tools decode button, pedal, LED
  and display frames from text or CSV captures, compare a baseline capture with an action capture, classify unknown bytes
  and log serial traffic without transmitting. The README leaves the FBV2 wire protocol open and notes that two baud rates
  appear in public code. The repository is independent and states no affiliation with Line 6.
status: active
authors:
