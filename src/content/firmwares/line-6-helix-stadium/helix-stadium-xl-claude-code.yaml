device: line-6-helix-stadium
kind: tool
name: Helix patch building with Claude Code
summary: Node.js toolkit and documentation for writing Helix Stadium .hsp presets with Claude Code, with a float-safe JSON writer, preset builders and validators, based on a format worked out from Stadium XL exports.
description: >-
  Rights warning: docs/MODEL-CATALOGUE.md lists 376 Line 6 model ids with parameter names and observed value ranges
  mined from 114 of the author's own device exports. The author says it holds no preset content, and tools/model-lookup.js
  fetches Line 6's published "Based on" list at run time, but the catalogue is Line 6 model data. The corpus folder
  that holds your own exports is git-ignored, and factory presets are not redistributed.

  The documents describe the .hsp container, block ids, model-id shapes, snapshots, controllers, Command Center and
  stereo routing, and list traps found on hardware. The main one is that the firmware tells floats from integers by
  whether the JSON text has a decimal point, so a stock JSON writer can make a preset fault the unit; the writer in
  lib/ learns the right form per model and parameter from presets your own device exported. The tools validate
  structure, ranges, device rules, snapshot coverage and firmware changes, and three example patches are built by
  examples/build-examples.js. It was developed on one Helix Stadium XL on firmware 1.3.2.1340 and 1.4.1.1343, and
  the author asks for reports from other Helix models. The skill and CLAUDE.md files are there for Claude Code.
status: active
authors:
