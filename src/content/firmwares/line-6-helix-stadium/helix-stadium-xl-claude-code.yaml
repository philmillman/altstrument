source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GNU GPL version 3 text with no "or later" statement in the README. The author says presets
  you generate are your own work, not covered by the licence.
distribution: source-only
requires_stock: Helix Stadium XL firmware 1.3.2 or 1.4 (the versions the author tested)
install_notes: >-
  Needs Node.js 18 or newer and no packages. Export your own presets from HX Edit into corpus/, run
  node tools/mine-catalogue.js, then build with the lib/ builders and check output with the validators. The README
  warns that a malformed preset can make the unit restart a few seconds after it is selected, so back up and
  audition each patch before relying on it.
brick_risk: false
