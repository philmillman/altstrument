device: line-6-helix-stadium
kind: tool
name: Take Controller
summary: SwiftUI app for iPad and Mac that sends MIDI control change messages to a Helix Stadium so another person can queue songs and drive Showcase mode.
description: >-
  Take Controller sends control changes on CC 47 to 51 for previous and next marker, cycle clear, cycle continue,
  return to zero, previous and next song and play and pause, and CC 63 and CC 10 when a playlist or song is chosen. It
  keeps names for playlists and songs, lets you choose the MIDI destination, and works through a USB-C to MIDI
  adapter on an iPad. The author says an AI tool wrote it, and the README does not state which firmware or
  unit it was tried on.
