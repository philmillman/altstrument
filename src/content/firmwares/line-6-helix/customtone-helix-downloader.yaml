distribution: download
install_notes: >-
  Zip and DMG builds for Windows, macOS and Linux are on the releases page. The macOS apps are unsigned, and the
  README tells you to clear the quarantine flag with xattr -cr and to move the apps to /Applications. Choose a
  download folder on first run. A scraper breaks whenever Line 6 changes its pages.
brick_risk: false
