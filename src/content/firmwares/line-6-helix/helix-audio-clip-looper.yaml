distribution: source-only
install_notes: >-
  Build with Maven and run the Java app, pick the Helix MIDI device and an audio device that reaches the
  looper, drag a file onto the grey panel and press Play. The README describes an aggregate audio device on macOS
  and a USB 3/4 routing in the Helix preset.
