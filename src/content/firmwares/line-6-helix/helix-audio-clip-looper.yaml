device: line-6-helix
kind: tool
name: Helix Audio Clip Looper
summary: Java desktop app that plays a dropped audio file into a Helix and drives the Helix looper over MIDI so the clip is recorded as a loop with accurate loop points.
description: >-
  The app sends MIDI control changes to open the looper, record, overdub, play, stop and close it, and plays
  the audio file through a chosen audio device that the Helix routes into the looper. The author routes USB
  input 3/4 into the main path before the looper, and adds that the looper can crash the unit if it is sent
  too many commands and sometimes ignores messages. It was used on macOS and has not been tested on Windows or
  Linux. The repository includes the author's demo preset as an .hlx file.
