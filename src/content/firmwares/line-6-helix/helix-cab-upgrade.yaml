    url: https://github.com/chriscore
source: https://github.com/chriscore/Helix.CabUpgrade
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file. A GPL 3 licence file was added on 2022-11-10 and removed in a commit
  later the same day, and GitHub's repository metadata still lists GPL-3.0, but no licence statement remains in
  the tree.
homepage: https://helixcabupgrade.azurewebsites.net/
distribution: browser-installer
install_notes: >-
  Use the hosted page, or build the .NET 6 site from source, which has a Dockerfile. Upload a .hlx file and
  import the result into HX Edit. Keep the original preset as a backup.
brick_risk: false
