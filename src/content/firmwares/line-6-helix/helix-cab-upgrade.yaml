device: line-6-helix
kind: tool
name: Helix Cab Upgrade
summary: Hosted ASP.NET web tool, with its C# source, that rewrites legacy cab blocks in Helix .hlx presets made before firmware 3.50 into the newer mic and IR cab models.
description: >-
  You upload a .hlx file, optionally choose a replacement cab model, mic and position, and download the changed
  preset. The library maps each legacy HD2_Cab model to its newer HD2_CabMicIr counterpart, carries over the
  matching parameters and handles single, amp plus cab and dual cab blocks. It accepts only preset version 6
  with the L6Preset schema. Unit tests cover the mappers and the updater. The README calls it a solo side project
  and does not say which units it was tried on. The site also has an unrelated page for a video-triggering program
  by the same author.
status: dormant
authors:
