install_notes: >-
  Clone the repository and install the Python dependencies; the README points at a requirements.txt that the repository does not contain. For Helix Native, install a virtual MIDI
  cable, and note that the Helix Native manual limits remote MIDI control to the AU and AAX plugin formats.
