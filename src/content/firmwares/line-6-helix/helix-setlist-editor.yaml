device: line-6-helix
kind: tool
name: Helix Setlist Editor
summary: Tauri desktop app for macOS and Windows that opens, builds and edits Helix .hls setlist files outside HX Edit, loading presets from a separate .hlx library folder.
description: >-
  Rights warning: tests/fixtures/IMGL Fibs.hls is an HX Edit setlist of 128 presets named after songs, committed
  as a test fixture, and its origin is not stated, so it may contain third-party or Line 6 preset content.

  The app can open an .hls file, start a new one from a bundled blank template, reorder, insert, replace, remove and
  sort presets alphabetically, and save a file Helix can import. Its codec keeps the container valid by
  rebuilding the zlib-compressed payload, the CRC and the decompressed size on save. A website on GitHub Pages
  holds download links and a walkthrough. The app checks for updates on launch. The README does not say which
  Helix units or firmware it was tested on, and the macOS build is ad-hoc signed but not notarized.
