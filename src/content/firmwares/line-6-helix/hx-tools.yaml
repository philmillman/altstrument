install_notes: >-
  For the CLI, run pip install -e . in src/hxcli, adding the mcp extra for the MCP server. The viewer is a Next.js
  app in src/hxviewer; run npm run import-res to pull model data from your own HX Edit installation. Back up presets
  before saving edits.
