  repository holds no Line 6 code or data and no .nam captures. A built file contains Line 6's firmware, and the README says it
  must never be shared.
homepage: https://github.com/Suddl3/hx-unbound
based_on: line-6-hx-stomp/hx-stomp-nam-lite
community:
  - label: HX Unbound hub
    url: https://github.com/Suddl3/hx-unbound
distribution: patch-your-own
requires_stock: 3.80.0 (Helix_Floor_v3.80.0_0x7d01f5efb.hxf, MD5 805caa03e8a30fd6ff7892f32ed5a9f4)
install_notes: >-
  Run helix-floor/floor/build_floor2.py on the stock file (Python 3.10 or newer with capstone), then install the
  result with Line 6 Updater in Offline Mode. To go back, hold footswitches 6 and 12 while powering on to enter update
  mode and install the stock 3.80.0 file; presets survive. The README advises leaving the unit on a preset without an NAM
  block before installing and rehearsing the recovery first. After any firmware install the Floor starts on a factory
  setlist.
brick_risk: false
tags: [nam, amp-modeling, patch]
