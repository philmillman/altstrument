device: line-6-helix
name: HX Unbound Floor
summary: A patcher that builds Helix Floor firmware 3.80.0 with Neural Amp Modeler A2 Lite amp blocks, two per DSP, from your own stock file; further Floor features are planned.
description: >-
  The build reads Line 6's stock Helix Floor 3.80.0 file on your computer and writes a modified file that adds an
  NAM block under Amp > NAM, using the same User IR captures and knobs as the HX Stomp patch. Each of the Floor's two
  DSPs can run two blocks, so a preset holds up to four, and a path holds at most two amp-type blocks because the
  Floor's DSPs have less free memory than the Stomp's. The author reports that one unit has run it. The repository
  also holds a browser setup page that builds the file with Pyodide and converts .nam captures to User IR files, plus
  research notes on the Floor firmware. At the first commit it builds exactly what savedadodo's helix-floor-nam-lite
  branch builds at commit ad69ec4, and the README lists a feature engine like HXtra's, a metronome and more NAM menu
  options as goals that have not been started. HX Edit may drop NAM blocks when it rewrites a preset.
