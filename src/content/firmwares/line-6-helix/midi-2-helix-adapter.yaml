device: line-6-helix
also_devices: [line-6-hx-stomp, line-6-hx-stomp-xl, line-6-hx-effects]
kind: tool
name: MIDI to HX Adapter
summary: Python script with a Tk window that turns MIDI keyboard notes into the control change messages that drive the 3 Note Generator block on Helix and HX devices, in mono or three-voice poly mode.
description: >-
  The generator block cannot be played by MIDI notes, only through control changes on its oscillator shape,
  note, octave, glide and level. The adapter listens to a keyboard, splits each note into a note and an octave
  value, and sends those and the bypass message on configurable CC numbers, with intervals for the second and
  third oscillators. It runs headless on a Raspberry Pi if the port names are given. The README title lists the
  Helix Floor, LT, Rack, HX Stomp, HX Stomp XL and HX Effects, but the author describes setting it up on an LT
  and the screenshot shows Helix LT selected, so the other models are claimed and untested. It lists known
  problems with duplicate ports on Linux and with MIDI Thru.
status: dormant
