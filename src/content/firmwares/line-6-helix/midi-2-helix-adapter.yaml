distribution: source-only
requires_stock: Helix LT; the README does not give a firmware version
install_notes: >-
  Install mido, python-rtmidi, tk and Pillow, set the 3 Note Generator's parameters and bypass to the CC
  numbers shown in the window using HX Edit or the unit's own menus, then run helix_midi_adapter.py. Stop it
  with CC 18 or by holding seven keys. The HX Stomp, HX Stomp XL, HX Effects, Helix Floor and Rack are
  claimed but untested.
