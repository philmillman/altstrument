    url: https://github.com/sensorium
source: https://github.com/sensorium/phelix
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GNU GPL version 3 text and the README says Version 3, with no "or later" statement. It
  does not cover the Line 6 block data.
distribution: source-only
requires_stock: Helix LT firmware 3.80 (the version tested)
install_notes: >-
  Needs Python 3.11 or newer with working tkinter and numpy; the README explains the macOS tkinter caveat. Run
  python3 phelix.py from the folder, then import the files in presets/generated with HX Edit. Back up first and
  keep the output level low and a limiter on headphones, as the author advises.
brick_risk: false
