device: line-6-helix
kind: tool
name: phelix
summary: Python and tkinter tool that generates random Helix presets from a library of block files and a template, and mutates existing presets to find unusual sounds.
description: >-
  Rights warning: the blocks/ folder holds about 380 block JSON files for Line 6 amps, cabs and effects, each made
  by snapshotting every parameter in HX Edit and exporting a preset, then split out with extractBlocks.py. They are
  Line 6 model and parameter data.

  The Generate tab substitutes random blocks into a template preset, shuffles block order, randomises the parameters
  of eight snapshots and maps 16 parameters to expression pedal 2, producing five .hlx files at a time. The Mutate
  tab swaps and shuffles blocks in a preset and nudges parameters, and a Probabilities tab sets how likely each block
  type is. Legacy cabs, IR blocks, preamps and separate amp and cab blocks are not handled. The author tested it on
  an LT with firmware 3.80, says it cannot guarantee it will not brick a Helix, notes that levels vary widely, and
  says some generated presets import blank when they exceed the DSP budget.
status: active
authors:
