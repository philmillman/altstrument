device: line-6-helix
also_devices: [line-6-pod-go]
kind: tool
name: POD GO to Helix converter
summary: Tauri and React desktop app that converts POD Go .pgp preset files into Helix .hlx files for import into a Helix or Helix Native.
description: >-
  Rights warning: ConversionTests and sampleFiles hold about 30 .pgp and .hlx presets used as test input and output.
  Their origin is not stated, and one is named like a Line 6 factory preset, so they may include Line 6 content.

  The converter reads the L6Preset JSON of a .pgp file, rewrites the metadata to those of a Helix Native export, removes
  controller data, strips model name suffixes, spreads blocks across two DSP paths, handles delay, reverb and mono
  or stereo variants and special cases, and applies block colours. The TypeScript code has unit tests, and
  an editor page lets you rearrange blocks before saving. The README calls it a simple mockup that may fail on
  some effects and says it is unclear whether it works with amps and effects added in newer POD Go firmware. The README says
  Electron where the code uses Tauri.
status: active
authors:
