source: https://github.com/Zavsek/POD_GO-Helix_converter
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and no license statement.
distribution: source-only
install_notes: >-
  The README links a Windows installer on Google Drive, which was not opened or checked; building from source
  needs Node.js and Rust for Tauri. Convert a .pgp, save the .hlx and import it with HX Edit or Helix Native, then
  check the chain and levels by ear. Keep the original preset.
