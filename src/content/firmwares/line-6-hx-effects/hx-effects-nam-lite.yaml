device: line-6-hx-effects
name: NAM A2 Lite for HX Effects
summary: >-
  A port of NAM A2 Lite to the HX Effects that patches stock firmware 3.80.0 so Neural Amp Modeler captures run on the
  pedal's SHARC DSP. An all-in-one build adds original effects (Click, Geiger, Commander, Corrupt, Ottobit, Doom Chug) and a stock Line 6 amp.
description: >-
  The HX Effects has no amp blocks. In the NAM-only build the NAM block takes over the identity of the 1024-sample IR block under
  IR > Single, and that block is no longer available; in the all-in-one build it sits under Distortion > Mono in place of the mono
  Regal Bass DI, so a cab IR can follow it. The knobs are Model, Input, Bass, Mid, Treble, Presence, Ch Vol and Polarity, and captures
  load as User IRs like the HX Stomp version.
  The kernel, assembler, simulator and firmware tools come from Derek Bui's hx-stomp-nam-lite, with a few hundred lines of offsets
  and workarounds added. The kernel measures about 23% of a block in the simulator, and the README explains how to
  tune the declared DSP cost by hand.

  Original effects can go into the same image. Click is a metronome block that takes over the mono Mod/Chorus Echo delay,
  with a Time knob synced to tap tempo, beats per bar, accent, three sounds, level and subdivision. Geiger is a bit crusher with
  16 shaping curves that takes over the mono Megaphone. Commander (octave fuzz), Corrupt (tracking square synth), Ottobit (sequenced
  bit crusher with random stutters) and Doom Chug (low drone generator) take over other fuzz and crusher blocks, and the stock
  Line 6 US Small Tweed amp is added in place of the mono Tycoctavia Fuzz. build_nam_click.py builds NAM with Click and build_all.py
  builds the all-in-one image the README recommends, in which NAM runs two blocks at once instead of three. The author reports the
  all-in-one image running on their unit on 2026-11-11. A tools/flash.py script repeats the Line 6 Updater update over USB and checks that the unit boots.

  The repository includes demo captures that its author made, already converted to .wav. Its author warns that this is for
  people comfortable with command line tools and with recovering the unit themselves.
status: active
authors:
  - name: scottlynn73
    url: https://github.com/scottlynn73
  - name: Derek Bui
    url: https://github.com/nocaseguy
source: https://github.com/scottlynn73/hx-effects-nam-lite
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README states GPL-3.0-or-later, as upstream. The repository holds no Line 6 code or data, and .gitignore keeps firmware/,
  build/ and every .hxf out of it. The README says the built file is a derivative of Line 6's firmware and must not be shared.
  The author releases the demo captures for free use.
distribution: patch-your-own
requires_stock: 3.80.0 (HX_Effects_v3.80.0_0xd97239907.hxf; the build checks the MD5 and refuses any other)
install_notes: >-
  Put the stock file in firmware/, then run build_effects.py (Python 3.10 or newer with numpy). Back up in HX Edit,
  close it, and pick the built .hxf with Choose File in Line 6 Updater, on a unit already on 3.80.0. The author notes a
  flash may report a problem and work on a second try. If it shows Boot Failure or stops at the splash, hold the >
  button at power on and reinstall the stock file. Do not edit the MD5 check: a later firmware needs its offsets
  remapped. The README says the build never touches the bootloader, and that presets, IRs and global settings survive
  the recovery flash.
brick_risk: false
tags: [nam, amp-modeling, patch]
