distribution: source-only
requires_stock: HX Stomp backups from firmware 2.81 and 2.82
install_notes: >-
  Needs Linux and Python 3. Clone the repository and run hx-tool.py with the backup or set-list file. The author warns against loading
  exported files onto a device. Windows is expected to break on file paths.
