kind: tool
name: fretwire
summary: Linux editor for Line 6 HX and Helix units and the POD Go, with a Tauri GUI, CLI, browser serve mode and an MCP server, built on a USB protocol recovered from HX Edit traffic.
description: >-
  fretwire edits presets, blocks, parameters, snapshots, footswitch labels and controller assignments,
  manages impulse responses and global settings, and backs up and restores a whole device, including
  .hxb backups made by HX Edit and POD Go .pgb backups. The project is developed against an HX Stomp.
  The README grades each unit: HX Stomp, Helix Floor, Helix Rack, POD Go and POD Go Wireless as
  verified, with the Floor tested over many logged sessions with a remote tester and the others by
  individual owners; Helix LT as verified for reads only, with no edit ever sent to one; and HX Stomp XL
  and HX Effects as reported working by one owner each, with no captures or logged session for the
  Effects. Firmware, flash and DFU traffic is never sent. The editor can also run as an HTTP daemon
  on a headless machine such as a Raspberry Pi. fretwire-mcp is a Model Context Protocol server for AI
  assistants that is read-only unless started with flags that allow edits or saves. The repository holds
  captured preset streams used as test fixtures. Line 6's model data is not included: on first run the
  user imports it from their own HX Edit installer, or POD Go Edit for a POD Go.
