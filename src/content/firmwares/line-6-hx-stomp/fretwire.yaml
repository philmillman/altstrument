homepage: https://fretwire.org
distribution: download
requires_stock: >-
  HX Stomp (verified); other units as graded in the README; HX Edit or POD Go Edit data imported by the user
install_notes: >-
  Install the .deb, .rpm, Arch package or AppImage from the releases page. The packages add a udev rule;
  for an AppImage run fretwire install-udev, then unplug and replug the pedal. On first run import model
  data from your own HX Edit installer or res folder (POD Go Edit for a POD Go). Only one program can hold
  the pedal's USB interface at a time. Back up the device before writing to it.
