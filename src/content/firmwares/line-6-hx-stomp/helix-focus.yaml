device: line-6-hx-stomp
also_devices: [line-6-helix]
kind: tool
name: Helix Focus Controller
summary: >-
  Touch PWA that morphs between four Helix or HX Stomp presets on an XY pad. It reads amp parameters from four .hlx files and sends the interpolated values as MIDI CC messages over Web MIDI as you drag.
description: >-
  Four .hlx files are loaded into the corners of the pad, and the page pulls values from the amp block of each file's DSP0.
  Dragging the cursor blends them by bilinear interpolation, with a smoothing step, and sends changes as MIDI CC numbers
  4 to 10 for drive, bass, mid, treble, presence, master and channel volume. Only changed values are sent, timed with the
  display's frame loop to avoid flooding the USB link. The pad keeps its loaded presets in browser storage, has
  a double-tap to centre, keeps the screen awake and can be themed. It connects to the first output whose name contains
  Helix, HX or Line 6. The pedal has to be set to receive those CC numbers; the README does not say how. The README text
  is in Spanish. Nothing is flashed.
