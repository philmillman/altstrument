install_notes: >-
  Open the hosted page, or serve the html/ folder with any static web server. For the Docker version, clone the docker
  branch and run docker compose up -d, or pull ghcr.io/adman234/helix-viewer:latest and map port 7860. Import
  exported files with HX Edit and keep the originals, since the Stomp conversion is unofficial.
