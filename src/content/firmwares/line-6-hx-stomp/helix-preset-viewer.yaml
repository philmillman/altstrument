device: line-6-hx-stomp
also_devices: [line-6-hx-stomp-xl, line-6-hx-effects, line-6-helix, line-6-pod-xt]
kind: tool
name: Helix Preset Viewer
summary: Browser app, hosted on GitHub Pages or run in Docker, that shows and edits Helix and HX .hlx presets without a unit, converts Helix presets to HX Stomp or Stomp XL, and views PODxt .l6t files read-only.
description: >-
  Rights warning: html/models.js, about 400 KB, holds names, parameters, units and ranges for 677 Line 6 models,
  generated by tools/build_models.py from the JSON files of an HX Edit installation. It is Line 6 model data.

  A dropped .hlx shows the signal chain of both DSPs including parallel paths, block parameters in the units HX Edit
  uses, snapshots, footswitch and controller assignments, MIDI mappings and IR slots. You can switch snapshots,
  toggle blocks per snapshot, edit values, remove blocks or a whole DSP and export a changed .hlx. A converter
  merges the two DSPs of a Helix preset into one chain for the HX Stomp or Stomp XL once it is down to eight
  blocks, keeping snapshots, expression assignments and block states, and listing footswitches to reassign.
  DSP usage is not checked. PODxt .l6t presets can be viewed but not edited. Parsing happens in the browser; the
  Docker branch adds an upload server that keeps a copy of each preset. The README does not say which units
  the exported files were tried on, and the other devices listed are the families it names.
