device: line-6-hx-stomp
kind: tool
name: helix_usb
summary: Python scripts and a small Qt UI that talk to an HX Stomp over USB, based on the author's reverse engineering of the HX Edit protocol, with preset browsing, packet parsers and capture tools.
description: >-
  helix_usb reads preset names and the current preset's slots, switches presets through MIDI program
  change, and parses preset and footswitch data. Its repository also holds converters from packet captures
  and a large folder of raw capture and parameter notes, and a wiki documents the protocol. A Qt window
  added in 2026 by a contributor shows the preset list and a block view of the current preset. The README
  says it was built for the HX Stomp and that it may also work with the Helix LT, Pod Go, HX Effects and
  Helix Rack, which it does not claim to have tested. Several later projects, including TonePush and
  HXLinux, name it as their starting point.
status: active
authors:
