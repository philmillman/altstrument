    url: https://github.com/kempline
source: https://github.com/kempline/helix_usb
source_status: open
license: MIT
homepage: https://github.com/kempline/helix_usb/wiki
distribution: source-only
requires_stock: HX Stomp; the README does not give a firmware version
install_notes: >-
  Clone the repository, create a Python virtual environment and install pyusb, xlsxwriter and PySide6
  (or PyQt6). Run the scripts for command line use or helix_qt_ui.py for the window. Switching presets
  needs a MIDI interface, and the Helix can serve only one USB host at a time.
brick_risk: false
