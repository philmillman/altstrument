device: line-6-hx-stomp
kind: tool
name: helixcli
summary: Swift command-line tool for macOS that reads presets and blocks from an HX Stomp over USB and switches presets, with JSON output for scripts and AI agents; it is based on the helix_usb protocol notes.
description: >-
  helixcli implements the proprietary HX USB handshake and data requests in Swift on top of libusb, and
  switches presets through USB MIDI. Verified against an HX Stomp, it lists presets, reads the loaded
  preset and its blocks with model and category names, backs up the current preset to a JSON file, and
  lists snapshots. Snapshot switching sends a MIDI control change but its effect is not yet confirmed by a
  read-back, and block writes, restore and import, parameter unit scaling and the tuner are not
  implemented. The README says it relies heavily on kempline/helix_usb, and it ships parser fixtures from
  four captured presets and a skill file for the OpenClaw agent tool.
status: active
authors:
