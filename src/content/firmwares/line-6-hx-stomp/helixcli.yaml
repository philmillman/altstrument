    url: https://github.com/acwilan
source: https://github.com/acwilan/helixcli
source_status: open
license: MIT
license_notes: >-
  The README's License section says MIT and the Homebrew formula says MIT, but the repository has no
  LICENSE file.
distribution: source-only
requires_stock: HX Stomp; the README does not give a firmware version
install_notes: >-
  Needs macOS 14 or newer, Swift 6 and libusb. Build with swift build -c release, or use the author's
  Homebrew tap, whose formula points at a v0.1.0 archive although the repository has no tags and the
  formula's checksum is a placeholder. Only the HX Stomp is claimed.
brick_risk: false
