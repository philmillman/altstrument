device: line-6-hx-stomp
name: HX Stomp CustomOS
summary: >-
  A fork of NAM A2 Lite that adds a CustomOS section to the HX Stomp's Global Settings, with tuner activation and a tuner
  settings lock, as first steps towards a fully custom firmware. Patches stock 3.80.0.
description: >-
  It builds everything in NAM A2 Lite and adds tools/patch_menu.py, which adds a seventh section to Global Settings. Tuner
  Activation makes a TAP/Tunr footswitch open the tuner on a press instead of a hold, at the cost of tap tempo on that
  switch. Lock Tuner Settings stops knob turns and resets from changing the tuner's settings. The author reports running these
  from RAM on a unit. FIRMWARE_NOTES.md records what is known about the 3.80.0 firmware, marking each claim as verified on a
  unit, verified offline or a hypothesis. The gr-meter-experiment branch holds unfinished gain reduction meter work.

  The added settings are for the HX Stomp only, and the XL build does not have them. The README inherits the upstream
  project's setup page link, and that page builds upstream's firmware, not this fork's; use build.py here.
status: active
authors:
  - name: wisemandenny
    url: https://github.com/wisemandenny
  - name: Derek Bui
    url: https://github.com/nocaseguy
source: https://github.com/wisemandenny/hx-stomp-customOS
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  NOTICE, kept from the upstream project, grants GPL-3.0 or any later version. The repository holds no Line 6 code or data:
  the build reads your own stock file, and the built image contains Line 6's firmware and should not be redistributed.
distribution: patch-your-own
requires_stock: 3.80.0 (the build checks the stock file's MD5 and refuses any other)
install_notes: >-
  Run build.py on HX_Stomp_v3.80.0_0x103966115.hxf, which writes build/HX_Stomp_v3.80.0_CustomOS.hxf. Try it from RAM first with
  tools/hxf_ram.py (needs pyusb), or install it with Choose File in Line 6 Updater. If the Stomp stops at the splash screen,
  hold Page Right while powering on and reinstall the stock file.
brick_risk: true
tags: [nam, amp-modeling, patch, tuner]
