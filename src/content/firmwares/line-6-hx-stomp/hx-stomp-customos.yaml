  - name: Derek Bui
    url: https://github.com/nocaseguy
source: https://github.com/wisemandenny/hx-stomp-customOS
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  NOTICE, kept from the upstream project, grants GPL-3.0 or any later version. The repository holds no Line 6 code or data:
  the build reads your own stock file, and the built image contains Line 6's firmware and should not be redistributed.
distribution: patch-your-own
requires_stock: 3.80.0 (the build checks the stock file's MD5 and refuses any other)
install_notes: >-
  Run build.py on HX_Stomp_v3.80.0_0x103966115.hxf, which writes build/HX_Stomp_v3.80.0_CustomOS.hxf. Try it from RAM first with
  tools/hxf_ram.py (needs pyusb), or install it with Choose File in Line 6 Updater. If the Stomp stops at the splash screen,
  hold Page Right while powering on and reinstall the stock file. Optional features are chosen with environment variables
  such as HX_BPM=1 and HX_DSP_METER=1 or with build.py's --splash options; BPM and DSP meter need Apple's Command Line Tools
  to assemble their code.
brick_risk: true
tags: [nam, amp-modeling, patch, tuner]
