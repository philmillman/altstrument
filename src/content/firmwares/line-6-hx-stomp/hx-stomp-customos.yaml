device: line-6-hx-stomp
name: HX Stomp CustomOS
summary: >-
  A fork of NAM A2 Lite that patches stock 3.80.0 to add a CustomOS section to the HX Stomp's Global Settings and a feature
  engine for its UI: tuner press-to-open and lock, a BPM readout, a DSP meter and a custom boot screen.
description: >-
  It builds everything in NAM A2 Lite and adds an engine for the Cortex-M4 application, where each feature is a module under
  tools/features with its own settings, hooks and tests. The settings sit in a seventh Global Settings section called CustomOS.
  The tuner feature is always built in: Tuner Activation makes a TAP/Tunr footswitch open the tuner on a press instead of a
  hold, at the cost of tap tempo on that switch, and Lock Tuner Settings stops knob turns and resets from changing the tuner's
  settings. The other features are switched on at build time. BPM shows the tempo at the top left of the Home screen with a
  beat dot that follows the TAP footswitch ring, with font, colour and dot position settings. DSP meter shows each Edit-view
  block's share of the DSP in per cent and the total at the top right. The boot screen option replaces the boot picture and
  the boot text, with emoji. The author reports running each feature from RAM on an HX Stomp. FIRMWARE_NOTES.md records what is
  known about the 3.80.0 firmware, marking each claim as verified on a unit, verified offline or a hypothesis, and
  docs/resource-limits.md covers how much room is left.

  Later features add a long press on a stomp footswitch to open the tuner or act as FS4 or FS5, virtual footswitches FS6 to FS10
  on MIDI CC 20 to 24, and a second bank of snapshots 4 to 6 saved in the preset file. A metronome block (HX_CLICK=1) clicks
  on every beat of the tempo, the tuner settings move to the tuner's own settings page with an HX_TUNER build switch, and the
  DSP meter also shows each model's cost in the model browser.

  The added features are for the HX Stomp only. The README says the HX Stomp XL builds with NAM A2 Lite only and marks the XL as
  untested. It no longer links a setup page, so use build.py.
status: active
authors:
