device: line-6-hx-stomp
also_devices: [line-6-hx-stomp-xl]
name: NAM A2 Lite for HX Stomp
summary: >-
  A patch for stock HX Stomp firmware 3.80.0 that adds Neural Amp Modeler A2 Lite as a new amp model, running up to three
  captures at once on the pedal's own SHARC DSP. Built in the browser from your own firmware file.
description: >-
  The amp appears under Amp > NAM, with a second copy under Distortion > NAM, so a preset can hold three blocks where the
  Stomp normally allows two amps. Each block has Model, Input, Bass, Mid, Treble, Presence, Ch Vol and Polarity knobs.
  Captures go in as User IRs: a converter packs a .nam file's weights into a .wav that HX Edit imports, and the Model knob
  picks the slot. Only 3-channel A2 Lite captures fit, and three blocks nearly fill the DSP. The kernel is hand-written
  SHARC assembly, and the project has its own assembler and simulator, so no vendor toolchain is needed.

  Four of the firmware's 15 parts change and the bootloader does not. A build can run from RAM first, which writes nothing
  to the pedal. The author reports running three blocks from RAM on an HX Stomp. The current build has not run on an XL,
  where only an earlier one-block build has run from RAM, and neither has been installed on one. The newest Polarity knob
  has only run in the simulator. The same author's hx-stomp-nam is separate firmware that replaces the stock software
  altogether.
status: active
