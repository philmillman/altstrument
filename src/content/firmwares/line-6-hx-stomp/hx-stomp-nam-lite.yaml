source_status: open
license: GPL-3.0-or-later
license_notes: >-
  NOTICE grants GPL-3.0 or any later version. The repository holds no Line 6 code or data: the build reads your own copy
  of the stock file on your computer, and NOTICE says the result contains Line 6's firmware and should not be
  redistributed. The SHARC opcode tables in sasm.py are adapted from ghidra-sharc under Apache-2.0. No .nam captures are
  included.
homepage: https://nocaseguy.github.io/hx-stomp-nam-lite/web/
distribution: patch-your-own
requires_stock: 3.80.0 (the build checks the stock file's MD5 and refuses any other)
install_notes: >-
  The setup page builds the firmware in Chrome or Edge from HX_Stomp_v3.80.0_0x103966115.hxf, or from the XL's own file, and
  can run it from RAM over WebUSB. With Python, run build.py on the stock file. To install, back up in HX Edit, close it,
  and pick the built .hxf with Choose File in Line 6 Updater, using only the file built for your unit. If the Stomp stops at
  the splash screen, hold Page Right while powering on and reinstall the stock file with Line 6 Updater; the author has done
  this on a real unit. The same button is untested on an XL.
brick_risk: true
