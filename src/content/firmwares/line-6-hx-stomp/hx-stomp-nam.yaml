device: line-6-hx-stomp
name: hx-stomp-nam
summary: >-
  Independent firmware for the HX Stomp, with no Line 6 code, that loads into RAM over USB and plays a full 8-channel Neural
  Amp Modeler A2 model through a small amp, EQ and delay pedal. The stock firmware stays untouched.
description: >-
  Everything is written from scratch: a boot loader and programs for the ADSP-21469 SHARC, an assembler and simulator for it,
  and images for the LPC4350 that load them. Images go in through the USB loader in the chip's boot ROM, so they vanish at
  the next power cycle. On a real HX Stomp, the author reports the display, codecs, knobs, buttons, footswitches and their
  rings all working, with an A2-Full model using 86.9% of the audio period. Compared with NeuralAmpModelerCore on the same
  model, its output differs by less than four steps of a 24-bit converter.

  make pedal builds the chain on a 16-colour screen, and make stomp builds it with a full-colour interface. This is a working
  experiment and not a replacement for the stock firmware: there are no presets, no stereo, no model choice at run time and
  nothing saved. The XL has not been tried. HARDWARE.md records what the author found about the board. For NAM alongside the
  stock firmware's effects, see the same author's NAM A2 Lite patch.
status: active
authors:
