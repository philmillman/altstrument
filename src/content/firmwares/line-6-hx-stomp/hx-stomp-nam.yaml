    url: https://github.com/nocaseguy
source: https://github.com/nocaseguy/hx-stomp-nam
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  NOTICE grants GPL-3.0 or any later version. The SHARC opcode tables in sasm.py are adapted from ghidra-sharc under
  Apache-2.0, and the two UI fonts are under the SIL Open Font License. The repository says it holds no Line 6 code,
  firmware, presets, pictures or sounds, and none are needed to build it. No .nam model is included.
distribution: source-only
install_notes: >-
  Needs arm-none-eabi-gcc, Python 3, dfu-util and a NAM A2 model of your own. Build with make pedal or make stomp, hold Page
  Right while powering on so the pedal appears as 1fc9:000c, then load the .dfu with dfu-util. Turn your amp or headphones
  down first, because the level is fixed until the volume knob first moves. A power cycle returns to stock. RECOVERY.md covers
  the details.
brick_risk: false
