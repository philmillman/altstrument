device: line-6-hx-stomp
name: HX Stomp HXtra
summary: >-
  A fork of NAM A2 Lite that patches stock 3.80.0 to add an HXtra section to the HX Stomp's Global Settings and a feature
  engine for its UI: tuner lock, BPM readout, DSP meter, long-press footswitches, six snapshots and a boot screen.
description: >-
  It builds everything in NAM A2 Lite and adds an engine for the Cortex-M4 application, where each feature is a module under
  tools/features with its own settings, hooks and tests. The settings sit in a seventh Global Settings section called HXtra,
  after Displays, and the project was called CustomOS until 2026-11-11. The features are off by default and are switched on at
  build time. The tuner feature moves the tuner's settings to a page of their own: Tuner Activation makes a TAP/Tunr footswitch
  open the tuner on a press instead of a hold, at the cost of tap tempo on that switch, and Lock Tuner Settings stops knob
  turns and resets from changing the tuner's settings. BPM shows the tempo at the top left of the Home screen with a beat dot
  that follows the TAP footswitch ring, with font, colour and dot position settings. DSP meter shows each Edit-view block's
  share of the DSP in per cent and the total at the top right, and each model's share in the model browser. Breathing line
  animates the line across the Home screen. Metronome adds a click track in time with the tempo. GR meter shows gain
  reduction on compressor blocks. Long press makes holding a footswitch for one second open the tuner, act as FS4 or
  FS5, or send virtual footswitches FS6 to FS10 on MIDI CC 20 to 24. More snapshots adds snapshots 4 to 6 as a second bank saved
  in the preset file. The boot screen option replaces the boot picture and the boot text, with emoji. The author reports running
  each feature from RAM on an HX Stomp. FIRMWARE_NOTES.md records what is known about the 3.80.0 firmware, marking each claim as
  verified on a unit, verified offline or a hypothesis, and docs/resource-limits.md covers how much room is left.

  The added features are for the HX Stomp only. The HX Stomp XL builds with NAM A2 Lite only, and the README marks it untested.
  The repository has a browser setup page for building and running from RAM; the README gives no hosted address, so build with
  build.py. The repository was renamed from hx-stomp-customOS to hxtra.
status: active
authors:
  - name: wisemandenny
    url: https://github.com/wisemandenny
  - name: Derek Bui
    url: https://github.com/nocaseguy
source: https://github.com/wisemandenny/hxtra
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  NOTICE, kept from the upstream project, grants GPL-3.0 or any later version. The repository holds no Line 6 code or data:
  the build reads your own stock file, and the built image contains Line 6's firmware and should not be redistributed.
distribution: patch-your-own
requires_stock: 3.80.0 (the build checks the stock file's MD5 and refuses any other)
install_notes: >-
  Run build.py on HX_Stomp_v3.80.0_0x103966115.hxf, which writes build/HX_Stomp_v3.80.0_HXtra.hxf. Try it from RAM
  first with tools/hxf_ram.py (needs pyusb), or install it with Choose File in Line 6 Updater. If the Stomp stops at the
  splash screen, hold Page Right while powering on and reinstall the stock file. Optional features are chosen with
  environment variables such as HX_BPM=1 and HX_DSP_METER=1 or with build.py's --splash options; BPM and DSP meter need
  Apple's Command Line Tools to assemble their code. The README says the bootloader is never touched and that this
  recovery restored stock on a real unit after a hang at the splash.
brick_risk: false
tags: [nam, amp-modeling, patch, tuner]
versions:
  - version: v1.1.0
    date: 2026-11-12
    url: https://github.com/wisemandenny/hxtra/releases/tag/v1.1.0
    notes: Adds a Tap LED Color setting, functions for footswitches FS6 to FS10, opt-in real block names, snapshot stepping across all six snapshots, a BPM Display Off setting and a tempo-synced breathing line. The setup page now shows a demo video per feature.
  - version: v1.0.0
    date: 2026-11-11
    url: https://github.com/wisemandenny/hxtra/releases/tag/v1.0.0
    notes: First release under the HXtra name, with the repository renamed to hxtra. Adds a metronome block, a gain-reduction meter on compressor blocks, a Global Settings section for each feature, boot screen text showing the version and a setup page listing every feature per build.
