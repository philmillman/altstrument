device: line-6-hx-stomp
also_devices: [line-6-hx-effects, line-6-helix, sonulab-stompstation-pro]
kind: tool
name: TonePush
summary: Cross-platform GUI, CLI and Rust crates that edit Line 6 HX pedals over USB without HX Edit, with a reverse-engineered protocol write-up, backups, setlists and a tone library, plus support for the Sonulab StompStation PRO.
description: >-
  The author developed and tested TonePush against an HX Stomp on firmware 3.80, and the README says each
  operation was checked on that unit. It edits the signal chain, parameters, snapshots, footswitch and
  expression assignments, tempo, impulse responses and device settings, and it saves, renames, copies,
  imports, exports and backs up presets and whole setlists. Presets are stored as the device's own
  documents byte for byte, and .hlx files are applied as ordinary parameter edits. Contributors have
  tested a Helix Floor on firmware 3.80 (reading, backup, editing, saving) and an HX Effects, where
  .hlx import and backup were fixed after user reports and a restore can still report a failure although
  it landed. Helix LT and Helix Rack presets parse and render but have not been tried on real hardware,
  and the HX Stomp XL is not mentioned in the README. The same editor also drives the Sonulab
  StompStation PRO over its USB serial port, with writes enabled only for firmware 1.5, 2.0 and 2.2 that
  the author verified; that pedal is not a Line 6 device. The
  repository documents the HX USB protocol in PROTOCOL.md and an opcode reference, and holds
  captured traffic and a sniffing script for HX Edit. Model names, ranges and artwork are read at
  runtime from an HX Edit installation or installer that the user supplies, and Line 6's data is not
  redistributed. The editor asks for a one-time setup, offers an opt-in online tone library and
  update check, and has opt-in crash reports. The author warns that a client fault can lock a unit
  until its power adapter is pulled.
status: active
