source: https://github.com/crmne/tonepush
source_status: open
license: MIT
license_notes: >-
  The captures directory holds USB logs plus an HX Stomp setlist export and a preset file used as test
  fixtures; the repository does not say whether any of that content is Line 6 factory material.
homepage: https://docs.tonepush.rocks/
distribution: download
requires_stock: HX Stomp on firmware 3.80 (the verified setup)
install_notes: >-
  Download the macOS DMG, Windows MSI, Linux archive, package or AppImage from the releases page, or
  a Flatpak bundle or the Fedora COPR, or build with Rust and run install.sh, which also installs a udev rule on Linux. Quit HX Edit first,
  because only one program can hold the vendor USB interface. On first launch the editor copies model
  data from an installed HX Edit, or takes an HX Edit installer you download from Line 6; reading a
  Windows or Linux installer needs 7-Zip. Back up the pedal before writing, and never trigger a USB
  reset, which the README says makes the device leave the bus.
brick_risk: false
tags: [editor, usb, presets, research, librarian, cli]
