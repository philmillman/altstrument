source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Name the folder MIDI_SWITCH, open the sketch in Arduino IDE, select Arduino Nano with the ATmega328P (the old bootloader
  on many clones) and upload with the MIDI cable disconnected from the M5. Set the M5 to MIDI channel 1 and wire the box
  as in the diagram and the wiring guide.
