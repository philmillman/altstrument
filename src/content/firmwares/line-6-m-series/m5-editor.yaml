device: line-6-m-series
kind: tool
name: M5 Editor
summary: Single-page browser tool for the Line 6 M5 that reads a DUMP ALL as MIDI SysEx or a .syx file, shows all 24 presets with their knob settings, renames and reorders them, and sends the set back to the pedal.
description: >-
  The author made it for their own M5 with help from Claude, which did most of the reverse engineering and coding from dumps
  of the pedal. The page unpacks the M5's 244-message dump, which uses 7-bit packing and checksums, into 24 presets. It lists the
  effect type and name, 16-character preset names, and each preset's knob values including the expression pedal heel and toe
  range. Names can be edited and presets swapped by dragging. The result can be saved as .syx or sent back to the M5, and a
  send replaces all 24 presets. Single-preset dumps and real knob names per effect are not done, and effect names for models outside
  the factory set can be entered by hand. Only the M5 is covered, not the M9 or M13. The author tested it on a real M5.
status: active
authors:
