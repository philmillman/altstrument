homepage: https://harmonicworks.org/M5-editor/
distribution: browser-installer
install_notes: >-
  Open the page in Chrome or Edge and allow MIDI with SysEx access, since Safari has no Web MIDI. Start a dump on the M5 from
  setup page 2 with Model Select set to DUMP ALL, then hold ON/OFF and press Model Select. Sending a dump overwrites all 24 presets,
  so keep a saved .syx backup first.
