distribution: source-only
install_notes: >-
  Build the BoostC project, or program the included hex file, onto a PIC12F675 wired as in the schematic, and
  connect its MIDI out to the pedal's MIDI input with a standard cable. Power is 9 to 15 V DC, centre negative, according to
  the manual.
