device: line-6-m-series
kind: tool
name: MIDI9 controller for M9 and M13
summary: PIC12F675 firmware in BoostC with schematic, hex and manual for a small three-switch MIDI foot controller that steps through the M9's folders and scenes, toggles tuner and bypass, and drives the looper. The author names the M9 and M13.
description: >-
  The controller is a separate DIY box, not a change to the Line 6 pedal. It has up, down and mode switches and an LED
  that shows the mode: four colours for the folders of scenes, one for tuner and bypass, one for the looper. It covers
  24 scenes in four folders of six, remembers a favourite scene in EEPROM, and in looper mode gives play, record
  and overdub. The source is a single BoostC file of about 700 lines with a version history from 1.0 to 2.0 in 2011.
  The repository adds a hex file, a schematic image, a user's manual in PDF and Word, and a photo of the layout. The
  manual was written for the M9, and the author's README title adds the M13. Whether it was tested on an M13 is not stated.
  The README says the project is for individual use only and commercial use is not allowed, which conflicts with the
  GPL text in the LICENSE file.
status: dormant
