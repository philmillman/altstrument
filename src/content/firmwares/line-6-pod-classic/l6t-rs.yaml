device: line-6-pod-classic
also_devices: [line-6-pod-xt]
kind: tool
name: l6t-rs
summary: Rust library, command-line dumper and GTK viewer for Line 6 Edit files (.l6t tones, .l6b bundles, .l6c collections) from POD 2.0, PocketPOD, Floor POD, PODxt and Bass PODxt. Reading is the working part, and the README says writing is not supported yet.
description: >-
  l6t-rs is a companion to the author's pod-ui editor and shares its model of how POD units behave. The workspace has a file crate
  that decodes the IFF containers, a symbolic crate with data models that give names and value ranges for POD 2.0, PocketPOD, Floor POD,
  PODxt and Bass PODxt parameters, an info command that dumps chunks or decoded patches, and an l6t-viewer GTK app. The
  README calls it beta quality and says Sounddiver .lib and MidiQuest .sqs files are goals rather than done. The code has an
  encoder and an option to write a tone, but the README says writing is not supported yet. It works on files only and does not
  touch a device.
status: active
