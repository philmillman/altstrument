device: line-6-pod-classic
kind: tool
name: pjm-pocket-pod-amp
summary: Max for Live MIDI effect for Ableton Live that sends a PocketPOD its amp model, cab model, drive, EQ, presence, bright and AIR settings, with up and down buttons for the amp and cab lists.
description: >-
  The device sits on a MIDI track whose output goes to the PocketPOD's MIDI port, and covers only the amp section
  of the unit. The up and down buttons are meant to be mapped to foot switches. It does not read anything back from
  the PocketPOD, so turning the unit's knobs does not move the device. A Resend button sets all controls again.
  Controls are auto-mapped to two banks of eight. The author used pod-ui while debugging, and the changelog says the
  PocketPOD answers MIDI messages that Line 6's public documentation leaves out. It needs Ableton Live with Max for
  Live.
