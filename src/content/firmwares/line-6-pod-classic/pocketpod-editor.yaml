device: line-6-pod-classic
kind: tool
name: Pocket POD Online Editor
summary: Angular web app that edits a PocketPOD over Web MIDI in the browser, including on phones, with amp, cab and effect controls, program selection and several layouts. Hosted at pocket-pod.web.app.
description: >-
  Rights warning: the repository bundles Line 6 documentation, namely the MIDI Continuous Controller reference PDF, the
  SysEx reference, and an HTML copy of the Pocket POD manual, and the repository has no license file.

  The app is served from Firebase and runs offline once loaded. It needs Web MIDI, so it works in Chromium
  browsers and Firefox with the MIDI permission, not in Safari. It sends the PocketPOD's controller messages for the
  amp, cab, effect, EQ, gate, reverb, delay, chorus and wah sections, selects programs, and decodes Line 6 SysEx
  dumps with a parser in the source. The interface offers card and column layouts with round dials, sliders or
  number fields. The README says it works with the PocketPOD attached to a PC, laptop or mobile device, and does not
  list other models. The single commit is from December 2021.
