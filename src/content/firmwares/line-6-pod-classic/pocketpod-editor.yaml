homepage: https://pocket-pod.web.app/
distribution: browser-installer
install_notes: >-
  Open pocket-pod.web.app in a browser with Web MIDI, allow MIDI access when asked and reload. Connect the PocketPOD
  by USB first. To build it yourself, run it as an Angular project from the repository.
