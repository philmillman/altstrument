distribution: source-only
install_notes: >-
  Install Pure Data on the Pi, open PocketPOD.pd and select the PocketPOD's MIDI port. The RoboRemo layout is in
  PocketPODMain.txt. Wiring for the buttons and pots is not documented beyond the screenshots.
