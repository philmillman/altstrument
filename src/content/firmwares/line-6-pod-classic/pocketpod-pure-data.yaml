device: line-6-pod-classic
kind: tool
name: PocketPOD Pure Data controller
summary: Pure Data patches that run on a Raspberry Pi and control a PocketPOD with MIDI messages from a GUI, GPIO buttons and pots, or a phone running RoboRemo. Also contains a Digitech RP250 patch.
description: >-
  PocketPOD.pd puts all of the PocketPOD's controls on one Pure Data screen, reads buttons, LEDs and
  potentiometers wired to a Raspberry Pi through an MCP3008 converter, and accepts commands from the RoboRemo
  Android app over WiFi or Bluetooth, which also allows mapping phone motion sensors to the wah. The preset names
  are typed in by hand because the patch cannot read them from the unit. The author lists reading and writing
  presets over SysEx as work still wanted. The same repository holds a looper patch and a SysEx patch for a
  Digitech RP250, which is not a Line 6 product. The author says the listed functions were tested, on a Raspberry Pi
  Zero W and a Model B, and links four demo videos.
