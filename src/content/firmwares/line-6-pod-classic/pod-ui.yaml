source: https://github.com/arteme/pod-ui
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL version 3 text with no "or later" statement, and the project site says GPLv3.
homepage: https://arteme.github.io/pod-ui/
distribution: download
install_notes: >-
  Download a build from the releases page. Windows has two zips, one of them a winrt build to try first on Windows
  10 and 11. macOS has a dmg. Linux has two AppImages in v1.5.0, one for older Debian 10 based systems. Version 1.5.1
  has Windows and macOS builds only, so Linux users stay on 1.5.0. Connect the unit by MIDI cable, a USB MIDI
  interface or, for supported models, USB. Storing a program overwrites it in the unit's memory, so download your
  library first.
brick_risk: false
