device: line-6-pod-classic
also_devices: [line-6-pod-xt]
kind: tool
name: POD UI
summary: Rust and GTK editor that edits live and backs up programs on POD 1.0, POD 2.0, POD Pro and PocketPOD, and on PODxt and Bass PODxt units, over MIDI or raw USB. Stand-in for Line 6 Edit.
description: >-
  POD UI is modelled on Line 6 Edit. It changes the connected unit's settings as you move controls, sends and
  receives single programs and whole program libraries, and renames programs. Separate modules cover the POD 1.0,
  POD 2.0 and POD Pro, PocketPOD, PODxt, PODxt Pro and PODxt Live, and the Bass PODxt family. The author developed
  it on Linux with their own POD units, starting from a POD 2.0. Bass PODxt support was written from Line 6's MIDI
  documentation and from watching Line 6 Edit, since the author has no Bass PODxt, and the project site asks for
  testers for it and for Bass POD, POD X3 Pro and Live, and Floor POD Plus, none of which are supported yet. The POD
  X3 without MIDI ports and the PocketPOD Express cannot be supported. Since version 1.5.0 it can also talk to
  supported units over raw USB with libusb, without Line 6 drivers, which the author calls finicky; Linux builds use
  the kernel driver instead. Loading Line 6 Edit .l6t and .lib files and editing amp and effect presets on the PODxt
  are not done. A sibling library, l6t-rs, reads Line 6 Edit file formats.
status: active
authors:
