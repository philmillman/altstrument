device: line-6-pod-classic
kind: tool
name: PODFBV
summary: C program that translates MIDI between a Line 6 FBV Express MkII foot controller and a PocketPOD, so the floor board can switch banks, tap, and control volume and wah. Runs on Linux, with a Windows build and an Android app.
description: >-
  Both Line 6 devices connect to the host by USB, for example a Raspberry Pi. PODFBV opens their raw MIDI interfaces
  and converts the FBV's messages into what the PocketPOD expects. It covers bank switching, tapping, volume and
  wah, with a volume threshold setting. Turning the tuner on and off is not supported because the program cannot
  drive the FBV's LEDs. The FBV must be loaded with the settings file in the repository, using Line 6's own tools.
  It can run as a command-line program or as a systemd daemon. The repository also holds an Android variant, a
  Windows cross-build and a service template. The README does not say how much was tested on hardware beyond the
  author's own setup.
status: dormant
authors:
