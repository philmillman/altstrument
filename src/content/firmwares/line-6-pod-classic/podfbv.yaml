    url: https://github.com/kurzlo
source: https://github.com/kurzlo/podfbv
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and no license statement. The README carries a no-warranty disclaimer only.
distribution: source-only
requires_stock: FBV Express MkII programmed with misc/fbv_settings.fbv
install_notes: >-
  Build with make on the host, or cross-compile with CROSS_COMPILE set, or API=win for Windows. Run it as a
  command-line program or install podfbv.service. By default it looks for the devices under /dev/snd/by-id/, and
  switches --fbv_id, --pod_id, --fbv_dev and --pod_dev override that.
brick_risk: false
