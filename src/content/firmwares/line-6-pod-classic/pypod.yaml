device: line-6-pod-classic
kind: tool
name: PyPOD
summary: Python command-line tool and GTK interface for the POD 2.0 over MIDI. It dumps, saves, loads and uploads programs, renames them, shows info, sends CC and program changes, and updates the GUI live when knobs move on the unit.
description: >-
  PyPOD was written and tested on Ubuntu 20.04 with a POD 2.0 and uses mido and python-rtmidi. The command-line tool dumps a
  program or the edit buffer in decimal, hex or a readable form, writes it to a file, loads a file and uploads it to a chosen
  program slot, and renames programs. The GTK interface, built with Glade, covers the amp and effect settings and sends CC and
  program change messages. The author learned the SysEx format by experimenting and reading a JSynthLib implementation and a
  scanned POD 2.0 MIDI document, and keeps a MIDI cheat sheet in the repository. The README lists a bug where turning many
  knobs on the unit at once freezes the GUI, and says multi-byte values such as delay time were not fully worked out at one
  stage. Windows and macOS are untested.
