    url: https://github.com/jang1563
source: https://github.com/jang1563/guitar-worship-assistant
source_status: open
license: MIT
license_notes: >-
  The README states MIT, but the repository has no LICENSE file. models/btc carries its own LICENSE file.
distribution: source-only
install_notes: >-
  Needs Python 3.10 or newer and a GPU or Apple Silicon for reasonable speed. Install with pip install -e . and
  the GAPS package from GitHub, then run gwa preset with a recording or a style name. Check the output in POD
  Go Edit before loading it, as its format was not confirmed.
