device: line-6-pod-go
kind: tool
name: Guitar Worship Assistant
summary: Python pipeline and gwa command that pulls guitar from a YouTube song, writes a tab and chords, analyses the tone and writes a POD Go preset file, tuned for Korean contemporary worship styles; documentation in Korean.
description: >-
  Most of the project is music transcription: yt-dlp audio extraction, Demucs source separation, a GAPS model for MIDI,
  a fingering optimiser for tabs, chord recognition and a Guitar Pro export. The POD Go part is
  src/preset_matcher.py, which maps a tone analysis or one of seven named worship styles to amp, drive, delay,
  reverb and chorus settings, prints a guide and writes an L6Preset JSON file with the POD Go device id and a
  .hlx extension. POD Go Edit's own preset files are .pgp, the README does not say whether the .hlx output
  imports, and no hardware testing is recorded. The repository also vendors the BTC chord model with its own
  licence.
status: active
authors:
