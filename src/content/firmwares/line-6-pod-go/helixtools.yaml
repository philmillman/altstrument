name: HelixTools
summary: >-
  Paid converter that turns POD Go .pgp presets into Helix Floor, LT and HX Stomp .hlx presets. The page says it runs in the browser and processes files locally, and the output is imported into HX Edit by hand.
description: >-
  The site describes a downloadable HTML app sold through Gumroad as a one-time purchase at 5.99 US dollars, offered as an
  independent utility not affiliated with Line 6. It takes a POD Go preset file, builds the equivalent Helix or HX Stomp
  preset file and leaves the transfer to the user. The homepage does not say how the conversion handles blocks the
  target cannot match, and no source is published. It does not talk to the pedal. The homepage links a demo video and
  a YouTube channel. It was not confirmed that the app also runs as a hosted page.
