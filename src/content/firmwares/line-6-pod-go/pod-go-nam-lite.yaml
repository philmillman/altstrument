device: line-6-pod-go
name: NAM A2 Lite for POD Go
summary: A patch for stock POD Go and POD Go Wireless firmware 2.50 that adds a Neural Amp Modeler A2 Lite amp block with a tone stack, running on the unit's own DSP with up to 101 captures stored as IRs. Built in the browser from your own firmware file.
description: >-
  A port of Derek Bui's hx-stomp-nam-lite to the POD Go. The patched firmware adds a NAM A2 Lite block to the amp list in
  the place of the Line 6 Elektrik amp and leaves every other amp, cab, effect and IR as it was. Captures are converted
  on a web page, which packs a capture's 1,871 weights into an IR-sized .wav, and are imported with POD Go Edit like any
  IR; the block's Model knob picks the slot, for up to 101 captures. Bass, Mid with frequency and width, Treble and High
  Cut sit after the capture, with Input and Output knobs. Most captures include the cab, so the cab block can be switched
  off. The repository also has five preset templates that free the fixed blocks, a block helper that places an amp, cab,
  IR or FX loop into any empty block, an optional boot screen and experimental capture names on the Model knob. A build
  can run from RAM first without installing anything. The author measured the NAM block at 28.3 percent of the DSP on a
  POD Go Wireless, where all 128 user presets loaded, and says the wired POD Go uses the same firmware file but has not
  been tried.
status: active
authors:
