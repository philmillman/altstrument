    url: https://github.com/tavishrox
source: https://github.com/tavishrox/pod-go-nam-lite
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  NOTICE grants GPL-3.0 or any later version, which the README repeats; the LICENSE file is the plain GPL 3 text. The
  repository holds no Line 6 code or data, and NOTICE says the built firmware contains Line 6's firmware and should not
  be redistributed. The SHARC opcode tables are adapted from ghidra-sharc under Apache-2.0. No .nam captures are
  included.
homepage: https://tavishrox.github.io/pod-go-nam-lite/
based_on: line-6-hx-stomp/hx-stomp-nam-lite
distribution: patch-your-own
requires_stock: 2.50 (POD_Go_v2.50.0_0x6e984472.hxf, which the build checks)
install_notes: >-
  Drop your own copy of the stock 2.50 file on the setup page, which builds in the browser and reports Verified when the
  result matches the tested build, or run podgo/build_podgo.py. Back up with POD Go Edit, then install the built file with
  Line 6 Updater using Choose File. The README says the bootloader is never touched. If the unit stops at the splash
  screen or an update fails, hold Page > while powering on and reinstall the stock 2.50 file with Line 6 Updater.
brick_risk: false
tags: [nam, amp-modeling, patch]
