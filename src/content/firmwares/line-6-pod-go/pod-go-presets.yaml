distribution: download
requires_stock: POD Go firmware 2.50 (the version the presets were made on; no backward compatibility is promised)
install_notes: >-
  Open a preset's page on GitHub and download the raw .pgp, then import it with POD Go Edit. Back up your own
  presets first, because a preset that breaks a limit can import with blocks dropped. The Python tools in
  tools/ regenerate the registry and validate the files, and tools/usb-intercept needs macOS and a re-signed
  local copy of POD Go Edit.
brick_risk: false
