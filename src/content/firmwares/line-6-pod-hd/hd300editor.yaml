device: line-6-pod-hd
kind: tool
name: POD HD300 Unchained Editor
summary: Python and PyQt6 editor for the POD HD300 that sends SysEx over MIDI, lifts the stock editor's limit on which effect type each FX slot can hold, and reads and writes .h3e and .syx presets. Includes drag-and-drop signal chain and a DI mode.
description: >-
  Rights warning: the repository bundles about 230 images named after Line 6 amp, cab and effect models, with no source
  given, plus a JSON model table, and has no license file.

  The HD300's stock editor ties FX1 to drive and compression, FX2 to modulation and so on. The author says that
  limit is software only and this editor lets any effect category go into any of the four slots (FX1 to FX3 and
  reverb). The rest of the editor offers drag-and-drop reordering of the amp, cab, FX, wah and volume blocks with
  PRE and POST placement, full amp, cab, gate and wah parameters, two-way SysEx sync with the pedal, a list of all 128
  presets with renaming, import and export of .h3e and .syx files, and a DI mode that switches to a clean preset and
  mutes USB monitoring for reamping. Tempo is synced from the hardware and a persistent backup of the edit
  buffer is kept. The README warns that free routing is experimental, may add latency and can reset effect
  parameters, and that the mapping tool should be left alone. It does not describe what was tested on hardware. Changes reach the pedal's memory only when Send
  Active is pressed.
