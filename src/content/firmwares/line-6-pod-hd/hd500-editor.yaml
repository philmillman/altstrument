device: line-6-pod-hd
kind: tool
name: HD500 Editor
summary: Electron and Node editor for the POD HD500 and HD500X that talks to the pedal over its vendor USB protocol on Linux, Windows and macOS. Shows a signal graph, edits models and parameters live, manages 8 sets of presets, and includes an MCP server for AI editing.
description: >-
  Rights warning: the catalog folder holds amp, cab and effect tables derived from lpedit-lib and from Line 6's
  published model list and POD HD Model Gallery, so some of the bundled data comes from Line 6 and others.

  The HD500 is not a USB MIDI device, so the editor uses its vendor bulk endpoints with 64-byte packets and 4 KB
  preset images, worked out from Line 6's last official editor and documented in docs/protocol.md and
  docs/preset-format.md. Features are a drag-and-drop signal graph for paths A and B, live editing of every amp,
  cab and effect model with footswitch and expression assignments, a mixer, input routing, tempo, a preset sidebar
  for all 8 sets of 64 presets, library import and export, and import and export of Line 6 .h5e files. Edits go to
  the pedal's edit buffer, and nothing reaches memory until Save to pedal is pressed, which first copies the old slot
  to a backup file. The README says everything marked as working was verified on a real POD HD500 running
  firmware 2.x, on Linux, in a Windows 10 VM with USB passthrough, and on macOS. The HD500X was tested on a real unit on
  Windows 10 with the project's hardware test suite; the README asks for reports on other POD HD models. The editor reloads a
  preset when a model or expression range is changed on the pedal's front panel, and it does not poll the pedal.
  On Windows the editor and Line 6's audio driver cannot be used at the same time, because the editor needs the
  control interface bound to WinUSB. The included MCP server lets an AI assistant read and edit a preset live,
  with a snapshot first and an explicit confirmation to save. The first public release was a pre-release and the
  repository history was rewritten before publication.
