source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT. The NOTICE file says catalog/catalog.json derives from lpedit-lib by Nicolas Schwartz,
  which is LGPL-3.0, and that amp-origins.json and fx-origins.json were transcribed from Line 6's published model
  lists. Line 6's gallery text itself was removed from the repository before release. The Windows installers
  bundle Zadig, which is GPL-3.0, as a separate program. The repository is not affiliated with Line 6.
homepage: https://github.com/linepix-idev/hd500-editor
distribution: download
requires_stock: POD HD500 firmware 2.x (HD500X tested on a real unit)
install_notes: >-
  Download the Linux deb or AppImage, the Windows setup or portable exe, or the macOS dmg from the releases page.
  Linux needs the included udev rule, which the deb installs. Windows needs Zadig to bind the pedal's interface 1 to
  WinUSB, which the installer offers, and this removes the pedal's sound card until Line 6's driver is
  reinstalled. The macOS app is unsigned, so open it with right-click and Open. Export your library before
  experimenting.
brick_risk: false
tags: [editor, librarian, presets, usb, research, mcp]
