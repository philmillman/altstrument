device: line-6-pod-hd
kind: tool
name: l6-podhdprox
summary: Python and Qt 6 (PySide6) reimplementation of Line 6's POD HD Pro X Edit that talks to the unit over USB with libusb. Has no README, so its testing status and supported features are only visible in the code.
description: >-
  Rights warning: the repository includes a data table generated from Line 6's POD HD Pro X Edit app, plus a
  junk folder of about 300 images and extraction scripts taken from it, and has no license file.

  The app registers for hotplug of the Pro X's USB device, claims interface 1 and exchanges bulk packets, listing
  setlists and presets and handling parameter, module, tempo and footswitch events. It holds the preset state in
  structs, with a model and view split and a few model tests. data_gen.py, over 7,000 lines, was generated by
  extract.py from files of the original editor, which the script says must be extracted from Line 6's installer
  and cannot be run as is. The repository has no README and no statement of what was tested on hardware, and the
  commits run from October to November 2025.
