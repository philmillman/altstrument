  GUI and test program and LGPL-2.0 for the library, with no "or later" statement.
distribution: source-only
requires_stock: POD HD500
install_notes: >-
  Linux only, with ALSA headers and the kernel line6 driver. Build with Meson, using the top-level meson.build.
