device: line-6-pod-hd
kind: tool
name: pod_hd_edit
summary: Early C library and Qt skeleton for controlling a POD HD500 from Linux through the kernel's ALSA hwdep interface. The library receives preset, pedal and parameter events, and the GUI is a stub that draws an FX chain.
description: >-
  The author wrote a small library, podhdctrl, that opens the Line 6
  hwdep device and parses incoming messages into events: preset changed, setlist and preset index, pedal state,
  parameter changes, effect on and off, and a raw preset blob. A test program prints them, and a Qt 5 GUI under
  gui draws the amp and effect chain without editing yet. The README is two lines that say it is work in progress.
  A separate repository, line6_hwdep_test, holds a short ALSA test program for HD500 hwdep access that the same author
  wrote the same month. The last commit was in May 2020.
status: dormant
authors:
