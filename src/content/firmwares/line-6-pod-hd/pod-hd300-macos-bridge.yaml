    url: https://github.com/toto9999
source: https://github.com/toto9999/pod-hd300-macos-bridge
source_status: open
license: GPL-2.0-only
license_notes: >-
  The LICENSE file is the GPL version 2 text, and THIRD_PARTY_NOTICES.md says the project's own code is GPL-2.0-only. The vendored
  Linux line6 reference sources keep their GPL-2.0 notices, and the BlackHole plug-in is a separate GPL-3.0 component.
distribution: download
install_notes: >-
  Download the arm64 zip from the release into a permanent folder, run Setup.command, then Install Bridge.command, which installs a
  HAL plug-in with an administrator prompt and restarts Core Audio. The release is not signed or notarized. Start the bridge from HD300
  Control.command. Source builds need git submodules, which GitHub's source zip omits.
brick_risk: false
