device: line-6-pod-hd
kind: tool
name: POD HD300 macOS Bridge
summary: Experimental user-space USB audio receiver for the POD HD300 on Apple Silicon Macs. A Python bridge feeds a BlackHole-based virtual input so GarageBand and other apps can record from the HD300. The control window is in Korean, and there is no preset editing or playback.
description: >-
  The bridge reads the HD300's 48 kHz 24-bit stereo USB audio with libusb, using format details taken from the Linux line6
  driver sources, which the repository keeps under vendor/linux-line6. It passes the audio through a FIFO and resampler to a
  virtual Core Audio device named POD HD300 USB Bridge 2ch, built from a pinned BlackHole submodule. A small control window sets
  latency modes, extra gain and a level meter, and the bridge reconnects up to three times after USB errors. The author
  confirms device recognition and data transfer in GarageBand on macOS 27.2, and says long sessions, other Macs and other
  DAWs are not guaranteed, with dropouts and USB reconnects seen. The HD400, HD500 and other models are unverified, playback
  to the HD300 is not implemented, and preset editing and firmware updates are outside its scope. The README is in Korean with
  an English summary line.
status: active
authors:
