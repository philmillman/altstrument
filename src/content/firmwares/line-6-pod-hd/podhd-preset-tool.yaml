device: line-6-pod-hd
kind: tool
name: PODHD Preset Tool
summary: Qt desktop app that converts POD HD presets, setlists and bundles between HD300, HD400, HD500, HD500X, Desktop, Pro and Pro X file formats, and mass-edits amps, cabs, mics and inputs in files. Works on files only, not on the unit.
description: >-
  The tool reads a folder of preset, setlist or bundle files and rewrites them for another model without changing
  amp, cab or effect settings. It also translates HD300 and HD400 presets to the HD500 family and back, and can
  change inputs, impedance, amps, cabs and mics across a whole setlist, for example turning every preamp into a full
  amp with a cabinet. It has an option to back up the originals. The docs folder has the author's notes on the
  file layouts of presets, setlists, bundles, inputs and effects. The current version is C++ with Qt for Windows and
  macOS. Older ports in Objective-C and Java live in the podhd-objc and podhd-java repositories. The README does not
  describe testing on hardware.
status: dormant
