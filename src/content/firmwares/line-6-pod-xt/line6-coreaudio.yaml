distribution: download
install_notes: >-
  Download the macOS tarball from the release and run ./install.sh ondemand, which asks for your password once to install the audio
  plug-in. Or build from source with Rust and the Xcode command line tools and run ./scripts/install.sh ondemand. The plug-in
  test harness should pass before installing, because a faulty plug-in can make coreaudiod use full CPU. Uninstall with the matching
  uninstall script.
