license: MIT
license_notes: >-
  The LICENSE file is the MIT text followed by a note that it covers only the repository's own code and
  documentation, not any Line 6 software, firmware or drivers. GitHub shows the file as unrecognised because of that
  note.
distribution: source-only
requires_stock: POD XT firmware 3.01 (analysis only)
install_notes: >-
  Needs Python 3 with pyusb and libusb. Download Line 6 firmware and software from Line 6 yourself and pass the
  file path to the analysis script. The USB reset scripts under tools/attempts are reference code, and the author
  says they do not reliably work. Treat any reset as erasing all presets.
