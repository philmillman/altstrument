device: line-6-pod-xt
kind: tool
name: line6-reverse-engineering
summary: Python tools and notes on the POD XT's .xtf firmware container (IFF with an L6FF form type), its USB IDs and the Line 6 Monkey app, plus documented but unreliable USB reset scripts. The working factory reset is a button combination.
description: >-
  The author wanted to reset a POD XT on a current Mac, where Line 6's 32-bit tools no longer run. The repository
  documents what they found: the POD XT is USB 0e41:5044, the .xtf file for firmware 3.01 is an IFF container whose
  header and twenty device-info chunks describe memory regions, and the Line 6 Monkey app is 32-bit Intel. The
  parser, line6_analysis_tools.py, reads a firmware file you supply and lists its chunks. It does not write
  anything. The reset scripts send a SysEx-style command over raw USB, which the author says never reliably reset the
  unit, so the README gives the button method instead: hold SAVE and all four UP buttons while powering on. That
  method was confirmed on a POD XT, and is reported but untested for the POD XT Live and POD XT Pro. The factory
  reset erases all saved presets. The repository does not include Line 6 software or firmware, and a shell script
  helps unpack Line 6's old installers that you download yourself.
status: active
authors:
