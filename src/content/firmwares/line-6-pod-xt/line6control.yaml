source: https://github.com/gthiemonge/line6control
source_status: open
license: GPL-2.0-only
license_notes: >-
  The repository has no LICENSE file. File headers state the GNU GPL: the C module says version 2 only, while most Python
  files say version 2 or any later version, so the combined work is treated as GPL-2.0-only.
distribution: source-only
install_notes: >-
  Needs Python 3, PyGObject, the Glib and ALSA development headers and a PODxt on an ALSA MIDI port. Run make to build the C module,
  then start line6control.py.
brick_risk: false
