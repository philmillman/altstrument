device: line-6-pod-xt
kind: tool
name: POD Flutter
summary: Flutter MIDI controller for the POD XT Pro, with a hardware-style interface, all parameters, patch browsing, bulk import of 128 patches and editing over USB or Bluetooth MIDI. It is a spinoff of pod-ui, written with Claude Code, and covers the XT Pro only.
description: >-
  POD Flutter redraws the pod-ui idea as an app for macOS, Windows, iOS and Android with knobs, an LCD-style display and LED
  indicators. It controls the 70-plus parameters, loads and saves the 128 patches, requests them one at a time because the XT Pro has
  no bulk dump, and includes the expansion pack models and a tuner. A Bluetooth MIDI adapter on the POD's MIDI port gives wireless
  control, and Windows uses USB MIDI with Line 6 drivers. The README is firm that only the POD XT Pro works, because
  its 160-byte patches differ from the plain POD XT's 152-byte patches. The project says it was built with Claude Code and the
  repository includes a CLAUDE.md. The author's v1.0.0 release has a macOS DMG and a Windows zip, while the Android and iOS builds
  are from source.
