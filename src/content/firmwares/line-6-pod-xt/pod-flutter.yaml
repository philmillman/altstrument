distribution: download
install_notes: >-
  Download the macOS DMG or Windows zip from the release, or build with Flutter. Connect the POD XT Pro by USB MIDI or through a
  Bluetooth MIDI adapter. Saving a patch overwrites it in the unit, so import your patches first.
