license: GPL-3.0-or-later
license_notes: >-
  The README says the project is licensed GPL-3.0-or-later and points to control/LICENSE, which is the GPL version 3 text. The
  repository root has no LICENSE file, so GitHub shows none. The model and knob tables in control/data come from the GPL-3.0
  POD-Controller project.
distribution: source-only
install_notes: >-
  Needs macOS 15 on Apple Silicon, Xcode command line tools, Homebrew libusb and Node.js 20 or newer. Run ./podx3 to build
  and open the web UI at 127.0.0.1:8787. The optional CoreAudio plug-in installs with sudo and restarts coreaudiod, and it
  is untested. If the POD stops answering, power cycle it.
brick_risk: false
