device: line-6-pod-xt
kind: tool
name: podx3-macos
summary: Userspace tools for running a POD X3 on Apple Silicon macOS without Line 6 drivers. They give 8-channel USB audio capture, a web and command-line controller for presets, models and knobs with backup and write, and a tuner. A CoreAudio device is experimental.
description: >-
  The POD X3 uses vendor-specific USB interfaces, so the project drives both from user space with libusb. A TypeScript controller
  speaks the control channel over bulk endpoints, decodes the 4096-byte preset blobs, lists the 64 stored presets, edits blocks
  and knobs, builds presets from JSON files and writes them back. The audio part streams the POD's eight input channels
  (main, tone 1, tone 2 and dry guitar) at 48 kHz, plays them on the Mac through a monitor tool, records WAV files and feeds a browser tuner. Mac
  to POD audio sends but the author has not checked it by ear, and the CoreAudio HAL plug-in that would show the POD to DAWs
  is described as built but not yet tested. The controller follows protocol notes from andree182's podx3 and the POD-Controller
  project, whose model and knob tables are in control/data. The author tested a POD X3 on macOS 15 with Apple Silicon and
  says the X3 Live uses the same protocol but is untested. Writing presets requires a full backup, refuses the slot in
  the edit buffer and reads each slot back for comparison. The README also describes using Claude Code to run the CLI.
