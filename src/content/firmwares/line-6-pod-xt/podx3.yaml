distribution: source-only
install_notes: >-
  Needs Python 2 and pyusb. Edit the calls at the end of pypodx3.py to choose what to run, make sure the kernel
  line6 driver is not bound, and run it as root. The author reports that it sometimes works on the first and second
  attempt and then needs the POD turned off and on again.
