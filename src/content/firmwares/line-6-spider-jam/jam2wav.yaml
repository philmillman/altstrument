device: line-6-spider-jam
kind: tool
name: jam2wav
summary: Small Python script that converts Spider Jam .JAM recording files to WAV by finding the embedded RIFF audio. The author thinks it works for JM4 Looper files too but did not test that.
description: >-
  The script looks for the first RIFF marker in a .JAM file and writes everything from there to a WAV file. A sample recording from a
  Spider Jam, REC_#08.JAM, sits in the repository and the one unit test checks the output length on that file. The sample starts with a
  header that carries the recording name, so the format is a small wrapper around ordinary WAV data. The script is about twenty lines,
  and the author notes it probably also works for the JM4 Looper but did not try. It needs Python 3 and does not talk to the amp.
