distribution: source-only
install_notes: >-
  Needs libusb and wiringPi 2.52 or newer on a Raspberry Pi. Build with the gcc command in the README, run as root,
  and for automatic start copy fbv3_startup.sh and the binary to /opt/fbv3_clone and call the script from
  rc.local.
