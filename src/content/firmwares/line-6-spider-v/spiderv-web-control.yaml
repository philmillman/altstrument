device: line-6-spider-v
kind: tool
name: Spider V Web Control
summary: Browser editor for Spider V amps over Web MIDI, built from a reverse-engineered SysEx protocol. It edits the signal chain, models and knobs, saves presets, adds performance shortcuts and an optional AI tone assistant, and also has a command-line client.
description: >-
  Rights warning: the test fixtures hold a preset name list and a preset recorded from the author's amp, the sample tone from
  Line 6's Spider Remote app and a USB capture from another project.

  The editor loads the amp's 128 presets, shows the signal chain, switches blocks, changes models, turns every knob, sets
  tempo sync for delays and modulations, and reorders effects where the amp allows it. Edits go to the amp's edit buffer, and
  saving writes a preset slot the way Spider V Remote does, with one step of undo and a backup of all presets. It reads
  and writes .svl6p tone files. On top of that it adds shortcuts, tap tempo, A/B channels, a play view and MIDI footswitch
  mapping, which it keeps in the browser. A tone assistant sends a text description to Claude or Gemini with your own API key
  and sets the result on the amp. The app can run on an Android phone through Chrome, or relay a phone to an amp plugged
  into a computer. PROTOCOL.md documents the framing, handshake and commands, which the author derived from symbols in
  Line 6's Spider Remote app and from live tests. The author tested on a Spider V 20 MkII on firmware 2.0.1, and a Spider
  V 30 capture is used only in tests. Model and knob names come from Line 6's app, so the editor asks you to load them
  from your own copy of the Spider Remote APK. Without that file it falls back to names made from internal ids.
