license: MIT
license_notes: >-
  The LICENSE file is the MIT text. The README's third-party table says three test fixtures are not covered by it: a
  recording of a Spider V 20 MkII's replies including its symbol table, Line 6's sample tone from the Spider Remote app, and
  a USB capture from the GPL-3.0 Line6-FBV3-Clone project. The model catalog is Line 6's and is not included.
homepage: https://leevilaukka.github.io/spiderv-web-control/
distribution: browser-installer
install_notes: >-
  Open the hosted app in Chrome or Chromium, connect the amp over USB and allow MIDI with SysEx access. The hosted copy has no
  phone remote relay. To self-host, use Bun, Docker or the standalone executables on the releases page. Load the model
  catalog once from a Spider Remote APK you own. Back up all presets before saving over any slot.
brick_risk: false
