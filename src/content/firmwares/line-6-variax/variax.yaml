homepage: https://pypi.org/project/variax/
distribution: download
install_notes: >-
  Needs Python 3.11 or newer, a Line 6 Variax USB Interface on the guitar's VDI jack, and the guitar switched on
  with a cable in its output jack. Install with pip, uv tool or pipx. Linux also needs libusb, build packages and a
  udev rule for 0e41:534d, and the tool detaches the kernel's variax driver while it runs. Close Line 6 Central and
  Workbench HD first.
