  vendor trademarks or protocol evidence quoted from vendor software, and that vendor manuals, firmware and model libraries are
  not bundled.
distribution: source-only
install_notes: >-
  Run the simulator with Node 24 or newer (npm start) or build the app on macOS with the Xcode command line tools
  (npm run build:mac). Builds are ad-hoc signed and not notarized. The repository's archive folder keeps earlier packaged
  Intel builds that were not rebuilt or tested again. The Mosaic's own Bluetooth MIDI connection is made in macOS.
brick_risk: false
