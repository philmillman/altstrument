device: livtra-nanocore
name: nanohardcore
summary: >-
  Experimental HARDCORE edition for NanoCore firmware 1.2 that replaces the effect chain with a TR-909 bass drum, a Sherman-style filter and a Mackie channel, and the Livtra screen with its own vector interface, installed from a web page.
description: >-
  The signal chain is a trigger or drum input, a transient detector, a TR-909 bass drum modelled at component level, a Sherman-style dual switched-capacitor filter with a HARMONICS clock divider, and a Mackie 1202-VLZ PRO channel with preamp, low cut, EQ and gain stages. The project documents measurements against real units, aliasing tests and offline demo renders, all in freestanding C99. On the pedal it takes the route of re-nanocore's hardware-tested 1.2 Octaver: a patch in the FX2 and pitch slot with a reset shim, four hooks, a larger audio ring and UI hooks. For the first 3 seconds after power-on the stock firmware runs, then HARDCORE takes over the audio chain, MIDI notes and control changes over USB and Bluetooth, the screen and both knobs, with 47 settings on a vector interface. The original chain takes over again if the CPU limit is exceeded, and the updater commands stay native. The web installer only accepts a pedal on stock 1.2, makes a backup, and can restore the stock image. The repository's manifest holds the project's own code plus 78 bytes of original instructions at the hook sites, and no vendor image. The release notes say it has not been tested on hardware, and the documents are mostly in Dutch.
