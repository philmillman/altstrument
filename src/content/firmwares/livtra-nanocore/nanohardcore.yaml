homepage: https://plieuw.github.io/nanohardcore/
distribution: browser-installer
requires_stock: NanoCore firmware 1.2
install_notes: >-
  Use desktop Chrome or Edge, also on a Chromebook, with the pedal connected by USB, headphones and audio cables removed and ToneCommand closed. Open the install page, press Install, allow MIDI and pick the Lupgrader bootloader; the install takes about two minutes. The page makes its own backup, and a separate read-only backup page exists. Keep the backup file; "Restore original" and "Resume interrupted upload" are on the same page. The README gives the residual risk: if an image does not start, the only known recovery is the updater, and whether the bootloader offers DFU itself is not known.
