    url: https://github.com/patogordo
source: https://github.com/patogordo/Tonebook
source_status: open
license: MIT
homepage: https://patogordo.github.io/Tonebook/
distribution: browser-installer
requires_stock: NanoCore firmware 1.04 or newer
install_notes: >-
  Open the hosted page in Chrome, Edge or Brave on a computer or Android phone, connect the pedal by USB, press Connect,
  and allow MIDI access including SysEx, which is needed to name the preset. Safari and iPhone have no Web MIDI. Saving
  overwrites the target preset, which defaults to 64.
brick_risk: false
