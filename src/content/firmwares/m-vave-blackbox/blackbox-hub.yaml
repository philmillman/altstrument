device: m-vave-blackbox
kind: tool
name: Black Box Hub
summary: Browser panel for the M-VAVE Blackbox pedal that switches its presets and module blocks over USB MIDI and reads, edits and writes presets over SysEx, with a drum machine, songs that change presets by section, setlists and a preset naming and notes layer.
description: >-
  A static web app, installable as a PWA, that talks to the pedal over Web MIDI in Chrome or Edge on desktop and in Chrome on
  Android. It sends Program Change messages to select presets P01 to P80 and Control Change messages to switch the FX, AMP,
  MOD, DLY, REV and CAB blocks, and it keeps names, colors, notes and favorites for each preset in the browser. It adds a
  synthesized drum machine with 16 patterns and tap tempo, songs made of sections that change the pedal's preset at each
  part, and setlists, with backup export and restore. The interface is in Portuguese. It also uses the pedal's own SysEx
  protocol to read all 80 preset slots, edit a preset's volume, block order, on/off state, models and knobs with the pedal
  following live, and save to a slot; each save reads the slot first, re-reads and compares it, restores the old bytes on a
  mismatch and keeps the last five versions of the slot. The README says no code touches firmware, amps, IRs or global
  settings, and that the CC numbers come from M-VAVE's release notes and are still to be confirmed on each pedal.
