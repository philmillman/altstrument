distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, connect the pedal by USB-C and press Connect (Conectar pedal). On Android, use an
  OTG or USB-C to USB-C cable and install the page from Chrome. iOS, Firefox and Safari lack Web MIDI. Nothing is flashed.
