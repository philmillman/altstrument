    url: https://github.com/mendong
source: https://github.com/mendong/blackboxctl
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The repository has several licences. The tool under tools/blackboxctl/ is GPL-3.0-or-later. The protocol notes adapted
  from mvave-blackbox-ble and the other documents and example preset bank are CC-BY-SA-4.0. The README says no
  third-party capture, IR, manual or firmware binary is committed.
homepage: https://github.com/mendong/blackboxctl#readme
distribution: source-only
requires_stock: Pedal reporting BLACKBOX v20 (the tested unit)
install_notes: >-
  Needs Python 3.10 or newer and a Mac; device commands are macOS-only. Run it from tools/blackboxctl with
  python -m blackboxctl doctor. The author's recovery guide describes backup, restore and the point past which a write
  cannot be undone. Take a backup before using --yes.
brick_risk: false
