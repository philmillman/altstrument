device: m-vave-blackbox
kind: tool
name: blackboxctl
summary: macOS command-line tool that reads and writes an M-VAVE Blackbox over USB MIDI SysEx, backs up its 80 presets and manages the M-EFCS capture and IR library, with protocol notes and an example preset bank. Writes are dry runs unless confirmed.
description: >-
  A Python command line, with no third-party packages, that talks to the pedal through CoreMIDI. It checks the setup
  with a doctor command, reads settings and presets, makes checksummed backups of all 80 preset slots, writes presets
  with rollback bytes and a read-back check, and installs AMP and CAB entries into M-EFCS's on-disk library. Every
  write is a dry run unless it gets --yes, and flash writes need a second capability; there is no generic address writer
  or firmware writer. The repository also holds a protocol specification validated against the author's pedal, a recovery
  guide and an example bank of 12 presets with 92-byte images from the author's own unit. Preparing a new amp record
  needs the installed M-EFCS parser library. Nothing is flashed.
status: active
authors:
