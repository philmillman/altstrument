homepage: https://jvsobrinho.github.io/mvave-blackbox-edit/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, which support Web Bluetooth, and pair with the pedal; wired use needs Web
  MIDI with SysEx access. The README marks the project as an experimental beta and says the author is not responsible for
  damaged devices or lost data, so keep a backup of presets you care about.
brick_risk: false
