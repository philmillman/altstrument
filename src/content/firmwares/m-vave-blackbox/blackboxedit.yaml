device: m-vave-blackbox
kind: tool
name: BlackboxEdit
summary: Browser preset editor for the M-VAVE Blackbox over Web Bluetooth, with a wired USB MIDI SysEx transport added in v0.3.0. It edits parameters and amp models live, reorders the signal chain and saves presets to the pedal's flash.
description: >-
  The page connects to the pedal's own Bluetooth service, which the author reverse-engineered from the official app, and
  polls the pedal so footswitch changes show up on screen. It changes parameters, amp models and effect on/off states,
  lets you drag effect blocks to reorder the chain, and writes the edited preset to a flash slot, waiting for the pedal's
  acknowledgement. Version 0.3.0 adds a wired transport that wraps the same messages in USB MIDI SysEx and a debug mode
  that pauses polling for sniffing. Preset import and export and a full dump of the 80 slots are listed as planned. The
  editor's logic is adapted from PocketEdit for the Sonicake Pocket Master, with its authors' permission. The README
  warns that flash writes are experimental and at your own risk. It does not replace the pedal's firmware.
status: active
authors:
  - name: Joel Victor Sobrinho
    url: https://github.com/jvsobrinho
source: https://github.com/jvsobrinho/mvave-blackbox-edit
source_status: open
license: MIT
license_notes: >-
