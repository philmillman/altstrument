device: m-vave-blackbox
kind: tool
name: ESP32-S3 Blackbox MIDI Controller
summary: ESP-IDF firmware for a homemade ESP32-S3 footswitch controller that selects presets and effect blocks on the M-VAVE Blackbox by USB MIDI, with an OLED, 80 presets and an optional USB device mode.
description: >-
  The firmware runs on a separate ESP32-S3 board with ten buttons, four navigation and edit buttons and an SSD1306 OLED, built
  by the author for the Blackbox. By default it acts as a USB host and sends MIDI to the pedal; holding a button at power-on
  switches it to USB device mode, and the choice is stored in flash. It organises 80 presets as eight pages of ten, and each
  preset has its own effect page with buttons for the FX, MOD, delay, reverb, amp, cab and tuner blocks and for stepping to the
  previous or next preset. Long presses navigate between pages, and a battery monitor circuit and power-saving modes are included.
  The repository contains the ESP-IDF project, a manual in Portuguese and a README with the battery circuit. It does not
  modify the pedal's own firmware.
