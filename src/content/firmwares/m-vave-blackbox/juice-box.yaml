device: m-vave-blackbox
name: Juice-Box
summary: >-
  Replacement firmware that turns the Blackbox into a player for Neural Amp Modeler A2-Lite captures, with eight
  captures in six banks, A/B switching and a desktop installer for macOS and Windows.
description: >-
  Runs one A2-Lite capture in real time, split across the chip's two cores, and matches the reference implementation
  closely according to the README. Captures load over USB from the desktop app. The FX to CAB buttons pick one of six
  banks, the right footswitch toggles A and B, and the left one bypasses on a tap and mutes on a hold; each bank has
  its own input and output level. The screen interface is in English or Portuguese. The app also installs the
  firmware and restores the official one. Full A2 captures do not fit the chip. The firmware builds on Felucca's
  hardware layer, USB and update code, and recent commits use the engine from the Pocket AMP's Onyx firmware. The
  installer downloads M-VAVE's official V20 package, checks its hash and puts the official update loader into the
  image on your computer, so built packages are not distributed. The README calls v0.17 the first public test, with
  Windows testing just started.
