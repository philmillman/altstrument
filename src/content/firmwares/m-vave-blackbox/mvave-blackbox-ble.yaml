device: m-vave-blackbox
kind: tool
name: M-Vave Blackbox BLE Protocol
summary: Reverse-engineering notes for the M-VAVE Blackbox, covering its Bluetooth GATT service, the preset memory map, checksums and the SysEx framing used over USB. It is the reference behind the BlackboxEdit web editor.
description: >-
  Three Markdown documents describe how the official app talks to the pedal: the custom Bluetooth LE service and its
  write and notify characteristics, the layout of a 92-byte preset record and the other memory regions, and the
  Base-128 SysEx framing used over USB MIDI. The author derived the Bluetooth side from HCI snoop logs of the official
  app and notes that the Bluetooth stack's acceptance of the USB SysEx form is untested. The README lists Python
  reference scripts and packet logs, but only the documents are in the repository. Nothing is flashed.
