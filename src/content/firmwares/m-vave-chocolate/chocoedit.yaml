device: m-vave-chocolate
kind: tool
name: ChocoEdit
summary: Mac editor for the Chocolate Plus that reads all of the pedal's settings over USB MIDI, edits per-switch messages, stomp modes and keyboard keys, and writes back only changed bytes after a backup.
description: >-
  A macOS app in the style of Morningstar's editor. It handles the Custom MIDI, Mix Key and Custom keyboard modes with
  eight or six groups of four switches, a stomp mode for each switch and up to 16 program change, control change, note
  or raw SysEx messages per bank. The keyboard modes have a Learn from Keyboard button. Writing backs up the pedal to
  the user's Documents folder, sends only the changed bytes and reads them back to check. Settings can be saved as
  .chocoplus files, a live monitor shows what the pedal sends, and an Advanced view lists every settings byte,
  including ones not yet decoded, which are kept as read. PROTOCOL.md documents the SysEx format shared with the
  CubeSuite app, and a command-line companion called chocoprobe checks it against a real pedal. The app updates itself
  from the repository. It does not flash firmware.
status: active
