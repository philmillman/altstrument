install_notes: >-
  Run install.sh to build the app and copy it to the Applications folder in your home directory, or take the zip in the
  repository's updates folder. Quit CubeSuite and connect the pedal over USB-C; its MIDI port is named SINCO. Writes
  back up the pedal's settings first.
