requires_stock: "012"
install_notes: >-
  Download the original FootCtrlPlus 012 package from M-VAVE's Chocolate Plus
  page, run build.py on it with Python and the JieLi toolchain notes in the
  firmware README, and flash the result with SincoOTA from an Android phone with
  the pedal not paired. The changelog says flash space is nearly full and that one
  early build crashed when a Bluetooth pairing was stored, which was fixed. To
  return to stock, flash the original 012 package the same way; if the pedal is
  stuck in update mode, use SincoOTA's Mandatory upgrade.
brick_risk: false
