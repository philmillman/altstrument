device: m-vave-cube-baby
kind: tool
name: Cube Baby Studio (cuvave-app-2)
summary: >-
  Native Windows editor in Python and Qt for the Cube Baby, plus a React Web MIDI preset studio. They read the three presets over SysEx, edit live, import and export JSON presets and keep a local library with backups. IR upload and firmware update are not included.
description: >-
  Rights warning: the repository root holds the vendor's Windows program as CubeSuite.exe with its Qt DLLs, an
  AppConfig.ini and a Qt style plugin, and a zip of the editor. These are not the author's work and no license for them
  is stated.

  The Python editor in cubebaby/ connects with python-rtmidi, finds the port by itself, reads presets A, B and C and edits
  pre-amp type, gain, tone, delay, reverb, modulation, cabinet and volume as you turn them. It imports and exports preset
  JSON files shared with the web studio and with CubeControl banks, and backs up before it writes an imported
  preset to the pedal. A simulated pedal mode runs without hardware. The preset-studio/ folder is a Vite and React page
  with knobs, a beginner mode, example presets and an IR panel, talking to the pedal through Web MIDI, with a README
  and a hardware test guide in Portuguese. The README credits cubecontrol and cuvave-midi for the protocol and warns that
  their licenses differ. Nothing is flashed.
status: active
