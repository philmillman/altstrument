  cubecontrol (MIT) and cuvave-midi (GPL-3.0, used only as a reference) and tells anyone distributing it to check those
  licenses.
distribution: source-only
install_notes: >-
  Windows: install Python 3.12 and run run_debug.bat, or build_exe.bat for an executable. Close the vendor CubeSuite
  first, since two programs cannot hold the pedal's MIDI port. The web studio is in preset-studio/ and needs npm.
