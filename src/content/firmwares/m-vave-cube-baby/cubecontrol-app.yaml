device: m-vave-cube-baby
kind: tool
name: CubeControl
summary: Desktop and Android editor for the Cube Baby over USB-MIDI with live A, B and C slots, setlists, a tuner, performance clips and tools to back up and load cabinet impulse responses.
description: >-
  An Electron and React app for Windows and Linux, plus an Android companion that uses USB host MIDI, built on the
  protocol libraries in the author's cubecontrol repository. It edits the live A, B and C presets, saves and restores
  the bank, organizes songs into shows for stage use and loads WAV impulse responses into the pedal's eight cabinet
  slots, keeping a local backup first. It also has a tuner and spectrum analyzer that use the computer's microphone, an
  in-app guide in Spanish and English, and a Clips page that records video with the pedal's audio and an on-screen
  copy of the pedal. The app connects when the pedal is plugged in. The repository's safety note rates saving a slot and
  importing a bank as medium risk and loading an impulse response to a ROM slot as high, because that overwrites the
  stored cabinet. Nothing in it writes firmware.
