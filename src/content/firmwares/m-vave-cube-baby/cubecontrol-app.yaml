homepage: https://mrgarizack.github.io/cubecontrol-app/
distribution: download
install_notes: >-
  Download the Windows installer or portable exe, the Linux AppImage or deb, or the Android APK from the release page,
  close the vendor's CubeSuite and connect the pedal over USB. Export the bank before experimenting, because writing an
  impulse response to a ROM slot overwrites that cabinet.
brick_risk: false
