device: m-vave-fm-1
name: 6210 Drum Peter
summary: >-
  808, 909-style and 303 drum machine for the FM-1 with a TR-style DRUM page (16 step keys, drum pads on the black keys, velocity and chance per step) and panel lights that blink in time; a variant of 3310.
description: >-
  6210 replaces the ARRANGE page of 3310 with a classic drum page: one row per drum, sixteen steps, the white keys as step
  buttons and the black keys as pads. Track 1 is an eleven-drum 808 kit, track 2 the same engine voiced shorter and
  harder as a 909-style kit, and track 3 an acid 303 line. Velocity and chance are set per step, tracks run 16 to 64
  steps, and the arpeggiator key rolls the drum. The panel lights follow a set of blink codes that show the playhead,
  edited step, unsaved changes and mutes. An empty project loads the 6210 kit on start. The rest of FM1 Open's editors,
  mixer, projects and MIDI stay. The README calls it a beta and says it has not been tried on many physical FM-1s.
status: active
