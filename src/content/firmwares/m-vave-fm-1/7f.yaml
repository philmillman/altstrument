license_notes: >-
  LICENSING.md lists the parts it builds on: the platform code is Felucca's with changes by SLOOP, Dinghy and X0X (GPL-3.0-only), Bluetooth parts are GPL-3.0-only OR MPL-2.0 (used under GPL-3.0-only), felucca-bsp parts are MPL-2.0 and Apache-2.0, platform/mvave comes from M-VAVE's FM1 Open kit (GPLv3 with M-VAVE's SDK linking exception, plus the binary engine library libfm1_engine.a under M-VAVE's terms for FM-1 devices only), and the Terminus font is SIL OFL 1.1. bigscreen/ is MIT. No stock firmware image is committed.
homepage: https://sunjaculley.github.io/7f-fm1/
distribution: browser-installer
install_notes: >-
  Open the project page in Chrome or Edge with the FM-1 on USB and install from it; or build with Docker (./fm1 build).
  The README says to back up the FM-1 first, and that if the firmware does not start, holding OCT- while switching on
  gives the USB rescue, from which you install again.
