device: m-vave-fm-1
name: 7F
summary: >-
  Unofficial adaptation of Fors' FMS Game Boy Advance FM groovebox: four 2-op FM tracks and a noise track in which every
  step carries its own sound, with note echo, a transpose sequence, step modulators and pattern slots.
description: >-
  Each of the sixteen steps holds a note, level, pan, portamento, condition, chord and a complete FM patch, so there are
  no instruments or presets, and a new step copies the last one touched. The FM tracks use a self-feeding modulator into
  a carrier with fractional ratios, an additive mode, amp and mod envelopes and a pitch sweep. The noise track offers
  five noise types. Chords take up to three offsets per step, and the screen shows all steps, a per-step setting graph
  and the four knob values. The README says the firmware uses none of FMS's code. It is built with the foma framework
  and ships a browser emulator and installer page.
