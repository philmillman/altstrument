device: m-vave-fm-1
name: A22
summary: >-
  FM workstation for the FM-1, derived from h1: ten synth and drum engines with eight algorithms each, eight effects, a four-track tape with knob automation, a mixer, Riff and Shake sequencers and chord memory.
description: >-
  Each engine (FM-4, ELECTRIC, STACK, ANALOG, SHAPER, WIRE, HAZE, MONO, KIT, PERC) has eight algorithms and four live knobs, and the screen is drawn in colour vector graphics. The effects are plate and spring reverb, tape delay, filter, frequency shifter, chorus, lo-fi and a drive stage, with a send per track and a master EQ. The tape records four tracks of up to 32 bars with 2,048 events, speed changes, brake and stutter tricks, and cut and paste of notes. It also has an arpeggiator, a step sequencer, eight patch snapshots, chord memory, USB audio out, USB MIDI in and out and a USB host mode for a keyboard. Nearly all sound is synthesised; the KIT drums layer in short CC0 hits taken from h1. The README calls it early and says it has run on one FM-1 only.
status: active
authors:
- name: abektes
  url: https://github.com/abektes
source: https://github.com/abektes/a22
based_on: m-vave-fm-1/h1
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT and carries Jake Handy's copyright, as h1's does. The package also carries fm1-base and felucca-bsp as a git submodule. dist/a22.rfm1 is the project's own WebAssembly build for browser simulators.
homepage: https://github.com/abektes/a22#readme
distribution: download
requires_stock: V15 or another custom firmware
install_notes: >-
  Download a22-0.7.0.fwsc from the release and install it from a clone with submodules by running base/tools/fm1_install.py a22-0.7.0.fwsc (pip3 install mido python-rtmidi). Every push to main also builds a development package (a22.fwsc) as a GitHub Actions artifact. It works from stock V15 and from other custom firmwares. Back up first. The package carries fm1-base's update loader, so another firmware's installer or the Firmware Hub's Back to official V15 replaces it. After two failed starts it boots into a safe mode with USB working, and holding REC while switching on enters the chip's ROM update mode, which the Hub's rescue page uses. It supports both the Puya P25Q80 and UC25HQ80 flash chips.
brick_risk: false
tags: [synth-engine, fm, looper, sequencer, fx, chords, arpeggiator, usb-audio, usb-midi]
