versions:
- version: 0.7.0
  date: 2026-11-26
  url: https://github.com/abektes/a22/releases/tag/v0.7.0
  notes: "Adds MIDI out for a DAW, with a channel per track (T1 on 1 to T4 on 4), the knobs' CCs on the same channels and MIDI clock with Start and Stop. KEY FOLLOW lets a tape play in the ROOT and SCALE set in GLO, LANE sets ROOT, SCALE and degree bar by bar, and PUNCH, FX held with a white key, applies brake, stutters, filters, crush or gate to the whole mix. STACK and ELECTRIC share one render across their algorithms to make room. The release holds a22-0.7.0.fwsc, the app image, firmware.json and a checksum file."
- version: 0.6.0
  date: 2026-11-25
  url: https://github.com/abektes/a22/releases/tag/v0.6.0
  notes: Adds CPU headroom for loop jams (J0 to J7). The rest of the release is README and site changes, including a note that A22 is on The Firmware Hub. The release holds a22-0.6.0.fwsc, the app image, firmware.json and a checksum file.
- version: 0.5.0
  date: 2026-11-23
  url: https://github.com/abektes/a22/releases/tag/v0.5.0
  notes: Adds CYCLE, SKINS and DICE, a saved-state version 5 and eight modes for the PERC engine, and the pictures now follow the track in hand while keys are read as they are drawn. The release holds a22-0.5.0.fwsc, the app image, firmware.json and a checksum file.
- version: 0.4.0
  date: 2026-11-22
  url: https://github.com/abektes/a22/releases/tag/v0.4.0
  notes: A late audio half no longer plays at full level, and the WAVE engine's SPREAD now acts over its whole turn. The release holds a22-0.4.0.fwsc, the app image, firmware.json and a checksum file.
- version: 0.1.0
  date: 2026-11-21
  url: https://github.com/abektes/a22/releases/tag/v0.1.0
  notes: "The first release. It holds a22-0.1.0.fwsc, the app image, firmware.json and a checksum file, and the release page has only a changelog link. Later commits on main, up to 867c87e on 2026-11-22, let the sequencer's SHAKE mode be left again, with KNOB 1 as MODE in every mode."
