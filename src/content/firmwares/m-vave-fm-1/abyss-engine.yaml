device: m-vave-fm-1
name: ABYSS ENGINE
summary: >-
  Bass and pad firmware for drum and bass: neuro bass voices navigated through a graph of preset sweet spots, a clean mono
  sub, stabs, an evolving pad and a harmonic sequencer on a shared key, with a bass-safe master stage.
description: >-
  Half of the JUNGLE OS pair; it runs alone or with BREAK SURGEON, ducking from that firmware's kicks and sharing clock,
  scenes and fills over plain MIDI (JUNGLE LINK). As of 0.7.0 the bass has five models (FM neuro, Reese, womp, horn and sine) and sixteen named sounds, and 0.7.1 adds a hoover model, which the player
  moves through with morph, snap, explore, mutate and undo, and a STYLES list sets a whole sound and line at once; stabs come as rave, orchestral, glass and dark sets. The README
  states that neither firmware has been installed on a physical FM-1, and that the work was tested in software, in
  fm1-base's host simulator, a browser emulator and fm1-emu. It has its own manual, emulator, installer page and package.
status: active
authors:
- name: RahelPuest
  url: https://github.com/RahelPuest
source: https://github.com/RahelPuest/jungle-os-fm1
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSE is the MPL-2.0 text. fm1-base and felucca-bsp are MPL-2.0 too. The repository commits its own built .fwsc
  packages in release/; no stock M-VAVE image is among them. The site folder also carries a copy of Julius Vitkauskas'
  m-bootloader 1.2 package (MIT) offered as an optional extra by the web installer.
homepage: https://rahelpuest.github.io/jungle-os-fm1/abyss-engine/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Web installer page in Chrome or Edge over USB, or fm1-base's fm1_install.py with the .fwsc. The installer can also put
  M-VAVE's firmware back and has an optional, off-by-default m-bootloader install that replaces the stock bootloader. The
  project's install guide says the update loader writes only the app area and leaves the boot loader, calibration and unit
  key alone, and recommends a flash backup first.
brick_risk: false
tags: [synth-engine, oscillator, sequencer, fx, performance, midi, emulator, web]
