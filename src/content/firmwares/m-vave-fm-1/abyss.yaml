  url: https://github.com/Tentacletunes
source: https://github.com/Tentacletunes/abyss
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only because it uses Felucca's build tools and update loader. felucca-bsp files keep MPL-2.0 and Inter Tight is SIL OFL 1.1.
homepage: https://tentacletunes.github.io/abyss/emu/
based_on: m-vave-fm-1/felucca-bsp
distribution: download
requires_stock: V15
install_notes: >-
  Download abyss.fwsc from the latest release and install it with felucca-bsp's fm1_install.py, as docs/INSTALL.md describes. The firmware keeps the update entry, so any other firmware, including M-VAVE's, can be installed over it. After three crashing starts it waits in update mode, which can also be entered by holding OCT- and OCT+ at power-on, and Felucca's rescue tool backs up the flash first. User data lives in flash 0xF0000 to 0xF3FFF, which another firmware may use, so back up first.
brick_risk: false
tags: [synth-engine, noise, experimental, fx, delay, midi, usb-midi, emulator, web]
