device: m-vave-fm-1
name: ABYSS
summary: >-
  Experimental noise synth firmware for the FM-1 with up to four voices of three oscillators, six noise types, FM, ring mod and sync, six drive types, two feedback delays, two LFOs and MIDI clock sync.
description: >-
  Inspired by the APTBS and Death By Audio synthesizer and not the same project as ABYSS ENGINE. Each voice has three oscillators with FM, cross modulation, ring modulation, hard sync and a CHAOS control, a sub oscillator, a mixable noise source with six types, a low-, band- or high-pass filter and an envelope. Two LFOs, a random sample-and-hold and the envelope can modulate any target, six drive types lead into two PT2399-style feedback delays, and stereo width is adjustable. One to four voices play with spread and glide. MIDI clock turns LFO rates and delay times into note divisions, and TRS and USB MIDI take notes, pitch bend, program change, sustain and CCs. It has 14 factory sounds and 10 user slots, and the last sound is remembered over power-off. A web emulator and cheat sheet are on the project site.
status: active
authors:
