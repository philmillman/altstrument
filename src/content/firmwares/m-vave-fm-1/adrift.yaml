homepage: https://romainguy.github.io/adrift/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Open the project site in Chrome, Edge, Brave or Opera with the FM-1 connected by USB data cable, and press the install
  button; the installer verifies the package and writes changed blocks in about 15 seconds. The site's restore section
  flashes an unmodified stock FM-1.fwsc, which the user provides, and the installer accepts only Adrift or Felucca
  packages and the official V15 image. Releases are attested through the Firmware Hub's shared build workflow and can be
  checked with `gh attestation verify`.
