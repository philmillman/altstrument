device: m-vave-fm-1
name: Adrift
summary: >-
  Polyphonic synth firmware that sends oscillators through key-tracked bucket-brigade delay resonators: 16 voices in six
  multi-timbral groups, per-group arpeggiators, three LFOs a group and a stereo effects bus, with a browser emulator and
  installer.
description: >-
  Each voice runs an exciter (a morphing oscillator with pluck and noise) through a resonant filter into a 1024-stage
  bucket-brigade delay loop tuned to the played note, which gives string, pipe and bell-like bodies. Feedback, polarity
  invert and dispersion shape the resonance, and a second envelope after the loop gates it. The 16 voices are split into
  six groups that answer to separate MIDI channels, each with its own arpeggiator, three LFOs and settings. A shared
  effects bus has a chorus, a tempo-syncable ping-pong delay, an octave shimmer reverb and a bus compressor. There are
  24 factory and 24 user presets, 16 scales, and MIDI clock sync over USB and TRS. The project site plays the same code
  in the browser and installs the firmware over WebMIDI; its restore option takes a stock FM-1.fwsc that the user
  supplies, and the repository holds no stock image. The code builds on felucca-bsp and the fm1-emu emulator. The first
  release is v0.1.0, published the same day as this entry.
