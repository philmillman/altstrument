device: m-vave-fm-1
name: After Images
summary: >-
  Generative ambient composer: REC writes a new piece with four layers, 30 sound engines, eleven rule-based sequencers, an ambient mixer and three visuals, and the next piece follows on round the circle of fifths.
description: >-
  Pressing REC deals a key, tempo, four sounds, four sequencers, a featured effect, a colour palette and a name. The four layers (ground, body, light and dust) each keep to their own part of the spectrum and answer each other. The eleven sequencers include Euclidean rings, a Turing machine, Markov chains, the Lorenz attractor, Conway's Life and Reich-style phasing, and one layer's notes can nudge another's system. Thirty engines cover FM, string, glass, voice, organ, choir, mallet, wavetable and bass sounds, with per-layer effect sends for reverb with shimmer, tape echo, chorus and tape saturation. Four macros (mood, activity, evolve and drift) steer the piece, and a PERSONALITY page sets what REC favours. The keys play the scale on the chosen layer. MATRIX, RORSCHACH and MOSH are three screens that react to the notes. It follows MIDI clock to the beat and bar, can send clock, sends each layer on its own MIDI channel, and streams a stereo mix over USB audio. The README says it is built on fm1-base, works on both FM-1 flash chips and is not affiliated with M-VAVE. Pieces and settings save themselves a few seconds after stopping with PLAY.
status: active
