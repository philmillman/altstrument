source_status: open
license: MPL-2.0
license_notes: >-
  The README states MPL-2.0 and the LICENSE file is the MPL-2.0 text. The screen font is DejaVu Sans under its own licence file in app/fonts, and the README points to fm1-base's LICENSING.md for the parts it is built from.
homepage: https://TheGrizard.github.io/After-Images/install/
distribution: browser-installer
install_notes: >-
  Open the web installer in Chrome or Edge, connect the FM-1 by USB and follow the page, or download the .fwsc from Releases and use fm1-base's command-line installer. The README says the web installer can put M-VAVE's own firmware back at any time and that earlier releases stay available. Stop with PLAY and wait a few seconds before switching off so the piece and settings save.
brick_risk: false
