versions:
- version: '0.6'
  date: 2026-11-13
  url: https://github.com/kevinelliott/fm-1-agent-deck/releases/tag/v0.6
  notes: Colours the screen by state, adds a box view of the agents as tiles, an ABOUT page, a prompt queue with pipelines, auto-approve rules that refuse commands such as rm -r, git push and sudo (a text match, not a sandbox), and knob combinations with a button held. The notes say the screens and sounds have had emulator time, not a careful pass on the hardware.
- version: '0.5'
  date: 2026-11-13
  url: https://github.com/kevinelliott/fm-1-agent-deck/releases/tag/v0.5
  notes: Adds context gauges, a marker for marked agents and new sounds, with a louder blocked alert and feedback ticks; the daemon gains a DIFF view, marks and a fleet menu.
- version: '0.4'
  date: 2026-11-13
  url: https://github.com/kevinelliott/fm-1-agent-deck/releases/tag/v0.4
  notes: Adds host-controlled button LEDs and a repeat marker. The daemon adds an INFO view of a Claude Code agent's session, names the tool call a blocked agent waits on and gains more chords.
- version: '0.3'
  date: 2026-11-13
  url: https://github.com/kevinelliott/fm-1-agent-deck/releases/tag/v0.3
  notes: First tagged release. Adds a footer line, chimes, time in state, chords (hold a button and tap a key to approve, deny, interrupt or answer), a MENU page and slot memory in the daemon.
