device: m-vave-fm-1
name: Agent Deck
summary: >-
  Turns the FM-1 into a desk controller for command-line coding agents: key LEDs and the screen show each agent's state
  and the buttons approve, deny or interrupt, driven by a host daemon over USB MIDI. Fork of Dinghy.
description: >-
  There is no synth engine. Each of the 27 keys is one agent slot, with its LED showing idle, working, blocked, error
  or done, and blocked agents blink until dealt with. The screen has a grid of agents, a detail page with the selected
  agent's last output lines and a page listing only agents waiting on you. Buttons start, approve, deny or interrupt the
  selected agent, and the encoders move the selection. A Python daemon on the computer reads agent state from tmux
  by pattern matching on pane content, or from the Herdr terminal multiplexer through its socket, and talks to the FM-1
  over USB MIDI using a framed protocol on two controller numbers, documented in PROTOCOL.md. The firmware is a single
  app file dropped into a Dinghy tree. Releases from 0.3 add chords for approving and
  answering from the keys, a MENU page, chimes, an INFO view of a Claude Code agent's session, a colour-coded screen
  with a box view, a prompt queue with pipelines and auto-approve rules that skip commands such as git push. The 0.6 notes say the package is installed on the author's FM-1
  and driven there by the daemon, while the individual screens and sounds have had emulator time but not a careful pass on the
  hardware. The README also embeds a browser player that runs the packaged firmware in the
  fm1-emu emulator.
status: active
authors:
- name: Kevin Elliott
  url: https://github.com/kevinelliott
source: https://github.com/kevinelliott/fm-1-agent-deck
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0, inherited from Dinghy and Felucca, and the Dinghy tree under firmware-build/ carries the
  GPL version 3 text and a LICENSING.md that states GPL-3.0-only. There is no licence file at the repository root. The
  Dinghy logo in that tree is the Dinghy author's all-rights-reserved artwork, not GPL.
homepage: https://github.com/kevinelliott/fm-1-agent-deck
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Download agentdeck-0.6.fwsc from the latest release and install it with firmware-build/tools/fm1_install.py or the FM-1
  Firmware Hub, then run host/agentdeck.py on the computer. The README asks you to return a V16 unit to V15 first, says a cut-off write
  can leave the unit dark until the chip's mask-ROM mode rescues it, and notes that holding OCT- at power-on gives the
  USB rescue.
brick_risk: false
tags: [controller-mode, usb-midi, midi, ui, fork]
