device: m-vave-fm-1
name: Agent Deck
summary: >-
  Turns the FM-1 into a desk controller for command-line coding agents: key LEDs and the screen show each agent's state
  and the buttons approve, deny or interrupt, driven by a host daemon over USB MIDI. Fork of Dinghy.
description: >-
  There is no synth engine. Each of the 27 keys is one agent slot, with its LED showing idle, working, blocked, error
  or done, and blocked agents blink until dealt with. The screen has a grid of agents, a detail page with the selected
  agent's last output lines and a page listing only agents waiting on you. Buttons start, approve, deny or interrupt the
  selected agent, and the encoders move the selection. A Python daemon on the computer reads agent state from tmux
  by pattern matching on pane content, or from the Herdr terminal multiplexer through its socket, and talks to the FM-1
  over USB MIDI using a framed protocol on two controller numbers, documented in PROTOCOL.md. The firmware is a single
  app file dropped into a Dinghy tree. The README says it was built and tested without an FM-1, with the daemon run
  against real tmux and Herdr sessions and the firmware in Dinghy's host emulator, and that the first flash on
  hardware had not happened yet.
status: active
authors:
