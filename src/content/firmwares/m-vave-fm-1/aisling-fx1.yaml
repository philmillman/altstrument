device: m-vave-fm-1
name: AISLING FX-1
summary: >-
  AISLING with its voices removed, turning the FM-1 into a USB effects box: the computer's audio comes in over USB, runs through AISLING's filter, echo, plate reverb and key effects, and leaves at the 3.5 mm socket.
description: >-
  Built from AISLING's source with a switch that leaves out the harps, drone and flute and adds a second USB sound stream, so the FM-1 appears to the computer as a standard 44.1 kHz, 16-bit stereo USB audio device with no driver. Whatever the computer plays goes through a filter, an echo and a plate reverb with a dry control, and through the effects on the keys: 17 of the 27 keys are effects while held, the black keys are Shimmer, Freeze, Macalla and Fras, and REC holds the echo and reverb. The processed sound also goes back up the cable so the computer can record it. The screen shows the incoming stream's state, its level and its packet counts. A piece chosen with PRESETS or a MIDI program change sets the echo and reverb settings and the tempo the echo counts in. Saved settings use AISLING's format and location, so a save here replaces what NACHTFAHRT, DUB-1 or AMB-1 saved. The README says 1.0 ran on one FM-1 with the first flash chip and a Mac, with no gaps or lost packets, and lists latency, long sessions, newer units and other computers as untested. The ENV, ARP, LFO, SEQ, SAVE and EDIT pages are still present but change nothing audible. The repository also holds a browser page for a separate screen build of AISLING.
