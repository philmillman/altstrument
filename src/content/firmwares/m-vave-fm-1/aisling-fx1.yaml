license_notes: >-
  LICENSING.md puts the work under GPL-3.0-only, inherited from AISLING, NACHTFAHRT, DUB-1, AMB-1 and Felucca. Fonts are SIL OFL 1.1, and the JieLi AC79 SDK files are read from your SDK checkout at build time.
homepage: https://aisling.stephen8n.com/
distribution: download
requires_stock: Installs over AISLING, another custom firmware or the stock firmware (tried from V16)
install_notes: >-
  Download aislingfx-1.0.fwsc from the release and install it with tools/fm1_install.py in the repository (Python 3 with mido and python-rtmidi). Its identity is FM-1_391, so The Firmware Hub and AISLING's web installer do not take it for AISLING. To go back, install AISLING from its web installer or use its Back to stock steps. The release notes report installs over AISLING 1.4 and over V16, and AISLING 1.4 put back over it with its saved pieces unchanged.
