device: m-vave-fm-1
name: AISLING
summary: >-
  Generative Irish ambient instrument, a fork of NACHTFAHRT: wire-strung harps and a breathy flute over a held
  drone, in Irish modes, in eight self-playing pieces, with a browser installer and emulator.
description: >-
  A fork of NACHTFAHRT, which is a fork of DUB-1 and AMB-1, keeping NACHTFAHRT's five layers, long arc, drifting
  filters, lead that remembers and answers, effects grid, emulator and site. The changes are the sound and the music.
  The sequence voice is restrung as a long-ringing harp that also plays the second sequence an octave down, and
  the lead is a flute with breath and a chiff on each note. The scales are major, Mixolydian, Dorian, minor and two
  six-note gapped scales, in D, G, A, E and B. Chords swing between two tonics, the harps run in jig-style groups
  of 12 and 9 steps with every third step accented, and eight pieces are named for places in the west of Ireland
  and for the harper Turlough O'Carolan. Three of the black-key effects are renamed Ceo, Macalla and Fras, and
  there is a green triskele launch screen. From 0.4, notes received over USB or TRS MIDI play the Lead. From 0.5, a web editor shows every setting of a piece
  and works the FM-1 over USB, and holding HOME with OCT- or OCT+ undoes and redoes the last 16 changes. A separate one-file browser visualiser reads the FM-1's MIDI out and
  paints it as a landscape. From 0.5.1, units with the newer UC25HQ80 flash chip can save and update. From 1.0, the audio is computed one block ahead to remove crackle. From 1.1, a sleep timer fades the sound out and blanks the screen, and MIDI program changes 0 to 7 pick the piece. From 1.2, MIDI controllers turn the knobs and Evolve can be set to land on the bar line. AISLING saves its eight pieces in the same flash location as NACHTFAHRT, DUB-1 and
  AMB-1, so installing one of them can overwrite another's saves.
status: active
authors:
- name: Stephen Cummins
  url: https://github.com/stephencummins
source: https://github.com/stephencummins/fm1-aisling
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md: inherits GPL-3.0-only from NACHTFAHRT, DUB-1, AMB-1 and Felucca. The Barlow Semi Condensed and
  Terminus fonts are SIL OFL 1.1, the harp's string follows MIT-licensed code from M-VAVE's fm1_open, and the JieLi
  AC79 SDK files are read from your SDK checkout at build time.
homepage: https://stephencummins.github.io/fm1-aisling/
distribution: browser-installer
requires_stock: V15, V16 or NACHTFAHRT
install_notes: >-
  Web installer in Chrome or Edge over USB (also Chrome on Android or a Chromebook), or tools/fm1_install.py with
  the .fwsc from the release (aisling-1.2.fwsc). The release notes report installs on a real FM-1 from V15, V16 and NACHTFAHRT
  0.9.5, and a return to stock with M-VAVE's M-UPGRADE, which shows AISLING as v14. They also say an install
  interrupted by pulling the cable carries on when it is reconnected. Installing is at your own risk.
brick_risk: false
tags: [generative, ambient, sequencer, synth-engine, fx, reverb, delay, fork, emulator]
image:
  url: https://raw.githubusercontent.com/stephencummins/fm1-aisling/main/docs/card.png
  alt: A gold pixel-art harp on a flat green background
  credit: Stephen Cummins
  source_url: https://github.com/stephencummins/fm1-aisling
  first_party: true
versions:
- version: "1.2"
  date: 2026-11-08
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v1.2
  notes: MIDI controllers on any channel turn the knobs (CC 16 to 19 for the four knobs of the current page, CC 74 to 79 for Filter, Evolve, Motion, Drift, Wet and Energy). On the Aisling page ALGORITHM sets whether Evolve nudges now and then at a phrase start or every 4, 8, 16 or 32 bars. Saves from 1.1 open as before. The release notes say it was tried on one FM-1 with the first flash chip, over 1.1 and over V16, and that the two new controls were checked only in the computer test build.
- version: "1.1"
  date: 2026-11-07
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v1.1
  notes: Adds a sleep timer on the Setup page (15 or 30 minutes, or 1 to 8 hours after the last touch) that fades the sound over 30 seconds and blanks the screen, and program changes 0 to 7 that pick the piece. The unit now also reports its flash chip ID so the installer can name it. The sound engine is unchanged from 1.0. Tried on one FM-1 with the first flash chip, not on a newer unit.
- version: "1.0"
  date: 2026-11-06
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v1.0
  notes: First version out of testing. The audio interrupt now works one block ahead, which the release notes say cuts the dropouts heard as crackle (counts on 0.5 over ten minutes were 29 to 374 by piece, and 0 over about eight minutes on 1.0), at the cost of 5.8 ms more latency from key to sound. Saved pieces from 0.2 onwards carry over. Tried on one FM-1 with the first flash chip, not on a newer unit.
- version: "0.5.1"
  date: 2026-11-05
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v0.5.1
  notes: Accepts the newer flash chip (UC25HQ80) as well as the first one, so pieces save and updates start on FM-1s sold since autumn 2026. Nothing else changes from 0.5. The release notes say it was not tried on a newer unit.
- version: "0.5"
  date: 2026-11-05
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v0.5
  notes: Adds a web editor that works the FM-1 over USB, 16-step undo and redo on HOME plus OCT- or OCT+, hold SAVE to save, a gentler MASTER curve, and USB audio ahead of MASTER so recordings do not depend on the knob. The release notes record audio dropouts on some pieces, not yet fixed, and that this package was installed on a real FM-1.
- version: "0.4"
  date: 2026-11-03
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v0.4
  notes: Notes arriving over USB or TRS MIDI on any channel play the Lead, the harps' density drifts slowly in the Carolan piece, and the USB audio interface is listed first for macOS 15 and earlier. The scale toggle on channel 1 is gone; the scale is set on the Key page. Tested on a real FM-1 as an install over a test build.
- version: "0.3"
  date: 2026-11-02
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v0.3
  notes: Evens out sudden level jumps in the Lead's voice, and the visualiser's Sea and Space views are redrawn.
- version: "0.2"
  date: 2026-11-02
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v0.2
  notes: Each piece's lead opens on a public-domain Irish air, with fiddle, chanter and voice added beside the flute, ornamented notes, new sequence, drone and atmosphere voices, a longer-ringing Macalla echo and lower CPU load. Saves from 0.1 are not read.
- version: "0.1"
  date: 2026-10-30
  url: https://github.com/stephencummins/fm1-aisling/releases/tag/v0.1
  notes: First test version; eight pieces, harp and flute voices, Irish modes and a package for FM-1 V15 and V16.
