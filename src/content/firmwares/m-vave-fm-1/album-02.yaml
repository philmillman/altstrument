license: MIT
license_notes: >-
  LICENSE is the MIT text, copyrighted to Alive-Stable-7254. The README says it is built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments), both MPL-2.0, which come in as the base
  submodule. The build fetches JieLi's toolchain and three SDK files for the package's boot files, which are not in the repository. The package the site serves is 611,496 bytes, not an M-VAVE image.
homepage: https://joshbartlettband-web.github.io/album-02-fm1/
distribution: browser-installer
install_notes: >-
  The project site has an install page for Chrome or Edge over USB and a package download (album02-0.1.5.fwsc) for the command-line installer; the site says the installer can put M-VAVE's firmware back. The repository's workflow builds the package and
  site on every push to main. No release has been tagged, so the package version comes from the site and not from a tag.
