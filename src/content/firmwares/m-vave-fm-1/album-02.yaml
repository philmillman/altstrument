device: m-vave-fm-1
name: Album 02
kind: firmware
summary: >-
  Second firmware in the Album series: five filter-house tracks of three patches each, a sequencer modelled on the KeyStep Pro, a bus that pumps on the kick and a code-drawn animation for every patch.
description: >-
  The tracks are DRUMS (BOX, BOOM, CLUB), BASS (PLUCK, ACID, ROUND), CHORDS (PAD, STAB, WIND), LEAD (BRASS, GLASS, FUNK) and VOX, a formant singer (CHOIR, ROBOT, MONK). Every patch has
  five knobs (TONE, MOTION, PUMP, SWEEP and SPACE) and four effects under EDIT (PHASER, CHORUS, GRIT and ECHO), and everything except the drums pumps on the kick. Each patch has a picture drawn by code
  each frame in the manner of 1970s space-opera animation that its knobs and effects move. The sequencer has 16 patterns a track of up to 64 steps with up to four notes, gate, velocity, shift and chance,
  step mode and live recording, scenes and a scene chain, an arpeggiator and chord mode, with four projects saved safely against power loss. MIDI runs over USB and TRS in and USB out, one channel a track, with clock in and out. The
  second core renders chords, echo and reverb and the first core takes over if it misbehaves. There is no Bluetooth. The README says it runs in the simulator and its tests but has not yet been played on an FM-1. The project site has a browser
  emulator, an install page and a manual. Album 01 is a separate entry.
status: active
