device: m-vave-fm-1
name: Album
summary: >-
  Series of FM-1 firmwares, one per record: Album 01 has eleven deep chord patches, each tied to a photograph that moves
  with the sound, a chord mode, soft beats and a reverse reverb.
description: >-
  Every patch has one photograph and a sound drawn from it, with five knobs (glide, swell, tone, blur and fuzz) that change both
  the sound and the picture. In chord mode every key plays a chord, black keys included, chosen from a table of chords taken from
  My Bloody Valentine records and voiced differently by each patch, and the note names show on the photo in a colour per note.
  Each patch has a quiet beat with fills, an auto bass and an amount sent into the reverse reverb. MIDI works over USB in and out
  and over TRS in. The sound runs on two cores with twelve voices, and falls back to one core with eight voices on a unit whose
  second core misbehaves. Earlier builds had Bluetooth MIDI, including linking two FM-1s; the latest commit removes it. The repository has a manual and a project site with a browser emulator and an installer page.
