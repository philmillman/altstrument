device: m-vave-fm-1
name: Alien Stack
kind: firmware
summary: >-
  Five-part groovebox on the Earth Creature Beats platform: a poly synth, a synthesised drum machine with eight kits, an alien bass bank, a sampler and synth, and a 32-step sequencer with scenes and a song builder.
description: >-
  Each part is a visitor with its own button: Nordics the poly synth, Mantis a 16-voice synthesised drum machine with eight kits and no samples, Reptiles sixteen chromatic one-shots and 24 synth basses, Greys a wavetable and FM synth that can also load user samples, and the Ship the sequencer with eight patterns, scenes and a 16-slot song. Parameter locks, polymeter, a reverb bus with per-part sends, live transpose, Euclidean patterns and fills on a held key are in the Ship. The song builder repeats slots and recalls mixer scenes. USB audio goes out at full level. The firmware identifies as FM-1_5800 with the USB name Alien Stack. It is the second firmware in the Sin Fetish Audio repository, kept in the visitors folder beside Earth Creature Beats, and it builds with the same fm1-base tools. The commit log records flashing it on a unit through Build 5, and the shipped samples are the authors' own, released as CC0.
status: active
authors:
