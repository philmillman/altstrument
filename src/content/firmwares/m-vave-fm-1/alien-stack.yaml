  notes: No tagged releases; this is the latest commit. Alien Stack Build 5 adds a declick pass, ramped mixer gains and the song builder. Since the previous row, the engines fade out over a few milliseconds on preset, octave and mute changes instead of cutting off, the bass retrigger step and filter attack are fixed to avoid clicks, and each engine carries an id and a version number.
