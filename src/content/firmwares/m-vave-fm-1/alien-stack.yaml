  url: https://github.com/SoulandCode69
source: https://github.com/SoulandCode69/sfa-fm1/tree/main/visitors
source_status: open
license: GPL-3.0-only
license_notes: >-
  The NOTICE says the source in visitors/ is GPL-3.0-only, fm1-base is MPL-2.0 as a submodule, and the bundled samples are original and released as CC0 1.0. The repository's LICENSE is the GPL v3 text.
distribution: source-only
install_notes: >-
  Clone with submodules and run tools/go.sh visitors with the unit alone on USB; the package is written to visitors/build/alien.fwsc. The README says to keep a way back to the official firmware through the Firmware Hub.
