device: m-vave-fm-1
name: ALTER
summary: >-
  Felucca fork that replaces the groovebox with three euclidean rhythm circles, seven percussive engines, dice and CHAOS, a mixer per circle, 48 scenes and a browser companion page, aimed at industrial techno and texture work.
description: >-
  Keeps Felucca's hardware layer, effects and installer and puts a new instrument on top. Three circles each play a euclidean rhythm or a Turing loop through their own sound, envelope, effects and mixer channel. The seven engines include ALTER, a noise and metal voice that the README says takes its idea from Noise Engineering's Basimilus Iteritas Alter, and PHYS, NOISE, RESO, PLATE, CORDE and RING. Dice redraw a circle's pattern, velocity, chance and length, CHAOS does it for all three at once, and locks keep what must stay. Held fills (dub delay, dub reverb, destroy, rolls), scales and chord progressions, a console per circle with EQ and compressor, a master filter, a delay with a tape mode, reverb, three LFOs and a modulation matrix add to the playing. A song chains three rhythm slots A, B and C, and 48 scenes keep everything the dice drew. MIDI comes in over USB and TRS with MIDI learn and clock. The browser companion page shows every setting, and a browser build runs the firmware without an FM-1. The README says it was developed with an AI coding assistant and tested on a real FM-1 with the UC25HQ80 flash chip, and that MIDI learn is not yet tried with a hardware controller.
