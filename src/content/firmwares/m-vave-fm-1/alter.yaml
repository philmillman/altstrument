source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSE state GPL-3.0-only, as Felucca. The engines in firmware/engines are MIT, the hardware layer felucca-bsp is MPL-2.0, and fonts and ported DSP code keep their own licences (LICENSING.md). The repository holds JieLi's unmodified wl82loader.bin (Apache-2.0), a RAM helper its recovery tool loads and does not install in flash.
homepage: https://forban5929.github.io/Alter-FM1/
distribution: browser-installer
install_notes: >-
  Install page on the project site in Chrome or Edge over USB, or the .fwsc from the release. The README says to go back to M-VAVE's firmware with Back to official V15 on The Firmware Hub, and that a failed update leaves the FM-1 able to enter update mode (OCT- and OCT+ held 5 seconds). A Windows rescue kit on the install page writes the firmware again from that mode, after a full backup; its notes say it has not been tried on a UC25HQ80 unit.
brick_risk: false
