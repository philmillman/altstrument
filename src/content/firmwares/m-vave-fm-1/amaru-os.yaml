device: m-vave-fm-1
name: AMARU OS
summary: >-
  Four-track generative firmware for hard dance genres on the FM-1, derived from Bunker Evolved: a seeded generator
  for tekno, acid, hardcore, jungle, drum and bass and psytrance with a choice of synthesis engines per track.
description: >-
  Rights warning: the repository keeps ten percussion hits decoded from Vermona SK86 sound EPROM dumps in
  firmware/assets/tekno-import. Its README says they are manufacturer ROM dumps shared for preservation, not under an
  open licence, and that they are kept out of the compiled firmware for now.
  A derivative of Bunker Evolved that keeps its pages and adds a GEN page, where genre, seed, energy and form
  (a loop of one, two or four bars) set a repeatable pattern; the OCT keys step the seed or reset it. The tracks are
  named AIR, MELODY, ROOT and SPARK. Four engines are active (analog, digital, FM6 and drum) and the others are
  compiled out to keep the render loops within budget. The genre rules are modelled on JIANT's generator and some
  timbres are parameter shapes taken from Carnac OS and Mycelium, with no binaries from either. The 0.4 notes in the
  README add a TEKNO drum kit, 32 hard-tekno worlds for the generator and a monochrome HOME screen; the kit is
  parameter data for the drum engine modelled on the character of the SK86 hits, not the dumps themselves. A browser
  emulator is included. The README says the song editor's backup and restore were checked on an FM-1, while the
  quick-start guide says on-device listening is the final step, and no release or flashable package is published
  yet.
status: active
authors:
- name: Marco Casanova (MarcoCasanova00)
  url: https://github.com/MarcoCasanova00
source: https://github.com/MarcoCasanova00/amaru-os
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and docs/ATTRIBUTION.md, inherited from Bunker Evolved and Felucca. Felucca-Engines is MIT,
  msfa is Apache-2.0, the samples are CC0 and the fonts are SIL OFL; the logo artwork is by the author. The ten Vermona SK86 EPROM dumps under firmware/assets/tekno-import are not under
  an open licence (the README says the project owner has a team looking into the legal side) and are not built into the
  firmware.
homepage: https://marcocasanova00.github.io/amaru-os/
based_on: m-vave-fm-1/bunker-evolved
distribution: source-only
requires_stock: V15
install_notes: >-
  The repository publishes source only, with firmware/BUILDING.md for the build. The project site has an
  emulator and an install page that checks a package's hash and size before flashing over WebMIDI. Back up V15
  first. Holding OCT- at power-on opens the update-mode recovery, and docs/RESCUE.md names the rescue tools.
brick_risk: false
