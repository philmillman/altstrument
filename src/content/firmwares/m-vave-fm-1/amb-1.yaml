device: m-vave-fm-1
name: AMB-1
summary: >-
  Generative ambient machine inspired by Music for Airports: starts playing at power-on with unsynced
  tape loops, a gliding bass and quiet Euclidean percussion.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-amb
source_status: open
license: MPL-2.0
license_notes: >-
  Release 1.3 moved to the MPL-2.0 on fm1-base; the 1.3 release notes say 1.2 and earlier stay under the GPL-3.0.
homepage: https://charlesvestal.github.io/fm1-amb/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer, which can also restore M-VAVE firmware. Plays in a browser first.
brick_risk: false
tags: [synth-engine, performance]
image:
  url: https://raw.githubusercontent.com/charlesvestal/fm1-amb/main/docs/img/screen-garden.png
  alt: "AMB-1 screen on the FM-1, showing the generative garden view"
  credit: "Charles Vestal"
  source_url: https://github.com/charlesvestal/fm1-amb
  first_party: true
versions:
- version: 1.3.2
  date: 2026-11-06
  url: https://github.com/charlesvestal/fm1-amb/releases/tag/v1.3.2
  notes: Fixes 1.3.1 being reported as "No FM-1 found" by the Firmware Hub; nothing else changes.
- version: 1.3.1
  date: 2026-11-05
  url: https://github.com/charlesvestal/fm1-amb/releases/tag/v1.3.1
  notes: Works on newer FM-1s with the UC25HQ80 flash chip, shows a battery indicator, answers M-UPGRADE 3.11, installs only changed parts and fixes the install page button and the emulator pitch at 48 kHz.
- version: '1.3'
  date: 2026-10-17
  url: https://github.com/charlesvestal/fm1-amb/releases/tag/v1.3
  notes: Relicensed under the MPL-2.0; the install page can read a crash report over USB.
- version: '1.2'
  date: 2026-10-15
  url: https://github.com/charlesvestal/fm1-amb/releases/tag/v1.2
  notes: Adds screen-reader support through the FM-1 Screen Reader page.
- version: '1.1'
  date: 2026-10-10
  url: https://github.com/charlesvestal/fm1-amb/releases/tag/v1.1
- version: '0.9'
