device: m-vave-fm-1
name: AMB-1 Drift
summary: >-
  AMB-1 variant that wanders between 24 pieces by itself and adds plucked harp and kalimba, a strings pad, bowed or glass leads, rain, wind, sea and vinyl textures and a reverb shimmer.
description: >-
  Starts from AMB-1's generative ambient engine, with unsynced tape loops, a gliding bass and Euclidean percussion, and adds a Wander mode (GLO twice) that glides from piece to piece. Karplus-Strong harp or kalimba figures, a single long bowed or glass lead note, a third detuned-saw pad colour and an air layer of rain, wind, sea or vinyl crackle are reached by pressing the page buttons a second time. The 24 pieces are AMB-1's eight, eight for Wander and eight new ones such as Monsoon, Lighthouse and Aurora. With the new sounds at zero the first sixteen pieces sound as in AMB-1, and saved AMB-1 projects carry over. The README is AMB-1's, extended for the Drift additions, and links Charles Vestal's AMB-1 site for the emulator, installer and manual.
