device: m-vave-fm-1
name: AmbWave
summary: >-
  Ambient instrument built on Felucca: four tracks with roles for tides, textures, clouds, pulses and a drone,
  four macro knobs, a track mixer and hold, scatter and sequence modes, with a browser version of the same engine.
description: >-
  A modified Felucca (based on 1.0.5.2) that reuses Felucca's engines behind a reduced interface. Each track takes
  a role and a compatible sound, held notes sustain until tapped again, and SHAPE, MOTION, DENSITY and SPACE
  work as macros. The cloud role uses a bundled CC0 flute sample. The branch that is the default on GitHub
  adds an autonomous drone role and two resonant bowl patches, which are not part of the v0.1.0 package. Whole
  AmbWave scenes cannot be saved or recalled, and the 0.1.0 release notes report an installation, playback and
  restart test on one FM-1 but no rollback or interrupted-update test. The project was earlier called Hasake.
status: active
authors:
- name: mentalcells
  url: https://github.com/mentalcells
source: https://github.com/mentalcells/ambwave
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSE and LICENSING.md, with Felucca's component notices kept. Ports of DaisySP and Rings are MIT,
  the msfa port is Apache-2.0, bundled instrument samples are CC0 1.0, and fonts are SIL OFL 1.1 (the Fukiai
  icon font is MIT).
homepage: https://mentalcells.github.io/ambwave/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, which checks the package's SHA-256 and can reinstall a previous
  Felucca-compatible package you supply. Back up your projects first. Getting back to M-VAVE's own firmware
  is a separate procedure in the repository's recovery guide, and the package keeps Felucca's FM-1_900
  identifier, so check the splash screen to tell it from Felucca.
brick_risk: false
