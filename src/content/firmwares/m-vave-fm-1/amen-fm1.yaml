source: https://github.com/Joolo09/amen-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README gives GPL-3.0-only for the engines, host code and tools, and for the Felucca 1.9.0 fork under fw/, whose parts keep the licences
  listed in fw/LICENSING.md. felucca-bsp is MPL-2.0 and the package holds three Apache-2.0 files from JieLi's AC79 SDK.
  The sdk/ plugin interface is MIT. The sample recordings under fw/assets/samples-cc0 are CC0.
homepage: https://joolo09.github.io/amen-fm1/
distribution: browser-installer
install_notes: >-
  Browser installer on the project site (Chrome or Edge, FM-1 on USB); AMEN OS needs the ?fw=os address. Back up first. If
  the unit does not start, docs/RESCUE.md describes recovery, and holding OCT- and OCT+ for five seconds reaches update mode.
brick_risk: true
