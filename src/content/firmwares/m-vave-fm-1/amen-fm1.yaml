device: m-vave-fm-1
name: AMEN-FM1
summary: >-
  Jungle, drum and bass and breakcore firmware: a JUNGLE break engine with generated edits and effects, a REESE bass, and
  its own screens, shown as Felucca with built-in engines and as AMEN OS, a separate firmware on Felucca's hardware layer.
description: >-
  The repository holds two firmware lines. The first is a Felucca 1.9.0 fork under fw/ with the JUNGLE and REESE engines,
  a break map of 32 slices and an acid-green screen theme. The second, AMEN OS, replaces the interface, sequencer and
  sound with its own code and keeps only felucca-bsp's drivers, loader and update path. In AMEN OS 0.3 the breaks play
  drum hits cut from CC0 recordings of a real kit, with patterns the author arranged, and SEQ TOOLS on the JUNGLE track
  write whole edits with effects. The README says AMEN OS 0.2 did not start on its first FM-1, leaving a black screen and the
  chip's update mode, and that 0.3 adds a SAFE MODE and is a test build. The project site installs the Felucca-based line by
  default and the OS only through a separate link. The README is in Russian. The default branch is a work branch and the repository has no releases.
status: active
authors:
