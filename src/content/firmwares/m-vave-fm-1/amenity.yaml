  notes: Rebuilt on fm1-base and felucca-bsp instead of M-VAVE's FM1 Open SDK, so it saves and updates on both flash chips. Adds the Apache and Think breaks beside the Amen, four slots for your own breaks, instant effects on the top black keys, a flip, tempo on SELECT and a delay-locked MIDI clock follower. Nothing from 1.0 carries over, including its settings and sample bank.
