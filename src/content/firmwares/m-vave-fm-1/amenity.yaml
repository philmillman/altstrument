license: GPL-3.0-only
license_notes: >-
  LICENSE.md is M-VAVE's FM1 APP licence: GPL-3.0 only with an added permission to link the binary SDK, whose engine
  library keeps M-VAVE's separate terms (THIRD_PARTY.md). Files under assets/third-party/ are excluded from the licence.
  sdk/firmware/FM-1_015.fwsc matches M-VAVE's FM-1 V15 image licensed Apache-2.0 (git blob
  ce49cc1595b67347c68a3ac7463017f9fa8c19dd).
homepage: https://ejtb76.github.io/amenity/
distribution: browser-installer
install_notes: >-
  Open the installer page in Chrome or Edge with the FM-1 on USB, connected directly without a hub, and confirm you
  have a backup. If the FM-1 has no valid sample bank the page also writes the full-quality break to it; otherwise the
  firmware plays its built-in 20 kHz copy unless you load the bank from the page, which replaces all eight sample
  slots. The same page restores V15. Projects and samples are not shared between firmwares.
brick_risk: true
