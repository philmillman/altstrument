device: m-vave-fm-1
name: Amenity
summary: >-
  Live jungle firmware built on FM1 Open: the Amen break sliced into sixteen steps, with rolls, builds, echo and
  stretch effects on the white keys, a self-varying pattern, MIDI clock and a lo-fi, EQ, saturation and compressor chain.
description: >-
  Rights warning: the repository carries amen.wav, a two-bar loop of the drum break from The Winstons' "Amen, Brother"
  (1969). The author states it is not covered by the project's licence, that all rights stay with the original holders
  and that it is included for convenience; it is also built into the firmware image and the installer page. Deleting
  assets/third-party/amen/ gives a build without it.

  Hold a white key for a repeat, roll, build, echo or old-sampler stretch while the pattern keeps running; black keys
  play single hits. Knobs set a short ringing feedback delay, how much the pattern varies, how many hits are warped, and
  a DJ filter. The firmware follows MIDI clock from any input and sends its own clock when it leads. It is built on
  M-VAVE's FM1 Open V14 SDK and ported from the author's Jungle Choppa plugin. M-VAVE's update loader is included, so
  the unit can go back to V15 or move to another firmware.
status: active
