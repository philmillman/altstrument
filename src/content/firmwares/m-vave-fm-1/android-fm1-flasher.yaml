device: m-vave-fm-1
name: FM-1 Flasher for Android
kind: tool
summary: >-
  Android app that browses The Firmware Hub's catalogue, downloads firmware packages and installs them on an FM-1 over
  USB MIDI, with an experimental chip detection, backup and ROM-recovery path.
description: >-
  Needs Android 14 or newer and a phone with USB host support. It can manage several FM-1s on a hub, installing to them one after another from a queue. The
  catalogue tab lists The Firmware Hub's entries, and optionally awesome-fm1, a GitHub repository's releases or a direct package link, with favourites, filters and update marks, and keeps downloaded packages for offline use. Before writing, the app checks the
  catalogue's SHA-256, the package header and the file CRCs, then runs the two-step update and checks the unit's identity after each restart. The only
  package it pins is M-VAVE's official V15. An experimental switch in Settings turns on a multi-port MIDI logger, flash chip detection through the
  chip's USB download mode, and a recovery that backs up the whole flash and rewrites only the firmware region from the V15 package. From 0.10.1 the same switch also enables sector-level flash maps, backup import and restore to the same unit, installing compatible firmware over ROM and, as options, installing m-bootloader 2.4 or restoring the stock V15 bootloader, each from a reviewed plan with a pre-write backup. The app has
  English, Polish and Simplified Chinese interfaces. The README calls it experimental, says one user has flashed a real FM-1 with an earlier build and
  lists physical USB recovery and automatic reconnection as untested; the 0.10.1 notes say physical acceptance of the newly enabled writes is still outstanding.
status: active
authors:
- name: ekim-pl
  url: https://github.com/ekim-pl
source: https://github.com/ekim-pl/android-fm1-flasher
source_status: open
license: MIT
license_notes: >-
  LICENSE.md is the MIT text, copyright 2026 ekim.pl@gmail.com, with a note that third-party components, firmware packages, catalogue entries and artwork
  keep their own terms. GitHub reports the file as unrecognised because of that note. The two flash loader binaries in app/src/main/assets are
  unmodified builds from jvitkauskas/m-flasher (MIT), documented in third_party/. No firmware package is in the repository.
homepage: https://ekim-pl.github.io/android-fm1-flasher/
distribution: download
requires_stock: A firmware with a compatible USB updater, such as M-VAVE's V15
install_notes: >-
  Release 0.10.1 carries an F-Droid APK and a developer APK with SHA-256 files; earlier builds were debug-signed APKs meant for testing. Normal installs and the V15 recovery write only the firmware region and leave the boot area alone; the recovery refuses a unit whose boot area is not a recognised stock one, and downloading is separate from writing. From 0.10.1, with Experimental features on, the app can also install m-bootloader 2.4 or restore the stock V15 bootloader, which are opt-in choices that need a reviewed plan and a pre-write backup, and a backup restore keeps the unit's own bootloader unless told otherwise. Keep M-UPGRADE or another rescue route ready, since a power loss while writing can need a USB rescue.
brick_risk: true
tags: [flasher, usb-midi, recovery, backup]
versions:
- version: 0.11.0
  date: 2026-11-18
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.11.0
  notes: "The release page has no notes beyond the F-Droid APK (no Firebase) and developer APK (test Firebase) and the source commit. The commits since 0.10.2 polish the firmware library and device screens, open the Library tab first and add F-Droid and GitHub nightly update checks."
- version: 0.10.2
  date: 2026-11-18
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.10.2
  notes: "Adds backup of banks, settings, sequences and presets to a ZIP holding only user data, restorable to the same FM-1 with matching firmware, under a new Devices, MIDI and backups page. Flash-chip download-mode operations move to a Modes and flash chip page behind the experimental switch, where ROM writes still need a reviewed plan, an exported pre-write backup and confirmation. Published as an F-Droid APK without Firebase and a developer APK with test Firebase."
- version: 0.10.1
  date: 2026-11-17
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.10.1
  notes: "Stable release, published as an F-Droid APK and a developer APK. With Settings, Experimental features on, adds a sector-level flash map, import of app ZIP backups or M-Flasher BIN and JSON files, installing the bundled m-bootloader 2.4 or restoring the stock V15 bootloader, installing compatible downloaded firmware over ROM, and restoring a verified backup to the same instrument, each from a reviewed plan with a pre-write backup. The notes say physical acceptance of these writes is still outstanding and automated tests use simulated flash. The F-Droid APK is signed with a different key from the debug builds and cannot update over them."
- version: 0.10.0-experimental.40
  date: 2026-11-16
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.10.0-experimental.40
  notes: "Pre-release build 40. Shows the measured flash ID, chip key and capacity, adds a flash map for full backups and MBOOT MIDI diagnostics, and previews m-bootloader 2.4 installation, stock V15 boot restoration and backup restoration. The new write operations are disabled in this build and no physical flashing was performed."
- version: 0.10.0-experimental.39
  date: 2026-11-16
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.10.0-experimental.39
  notes: "Pre-release build 39. Source check intervals can be set from 1 to 168 hours, with manual checks in experimental mode skipping the interval except for The Firmware Hub, which keeps a 24-hour minimum. The notes say no physical flashing was performed."
- version: 0.10.0-experimental.38
  date: 2026-11-16
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.10.0-experimental.38
  notes: "Pre-release build 38, for Android 14 or newer. Lets each connected or saved FM-1 take one of six colours, shown in the device list, task queue, history and flashing progress. Usage statistics are on by default and can be switched off in Settings. The notes say no physical USB flashing was performed."
- version: 0.9.5-experimental.29
  date: 2026-11-15
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.9.5-experimental.29
  notes: "Pre-release build 29. Adds onboarding for firmware developers, diagnostics for private sources and Google Analytics for Firebase usage statistics, which are on from the first online launch and can be turned off in Settings. The notes say the stable release remains 0.9.3 and no physical firmware install was done."
- version: 0.9.3
  date: 2026-11-15
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.9.3
  notes: "Adds a shorter in-app guide in English, Polish and Simplified Chinese, with links that open Library, Devices, Tasks and the firmware source settings. Reorganises the README and documentation."
- version: 0.9.2
  date: 2026-11-15
  url: https://github.com/ekim-pl/android-fm1-flasher/releases/tag/v0.9.2
  notes: "Stable release rebuilt on Kotlin Multiplatform, with an iOS host still under development; the download is the Android app. Adds a full-screen settings page, catalogue providers (The Firmware Hub, awesome-fm1, a GitHub repository URL or a direct .fwsc URL), HTTP authentication for catalogue sources, and a sequential install queue for several FM-1s on an OTG hub. The notes say the native iOS app and production OAuth sign-in still need verification."
