  url: https://github.com/drophlex
source: https://github.com/drophlex/ANDROMEDAFM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README gives GPL-3.0 and the LICENSE file is the GPL-3.0 text; firmware-src/LICENSING.md keeps Felucca's terms: GPL-3.0-only overall, with the Felucca-Engines files MIT, felucca-bsp MPL-2.0, the FM6 engine from msfa Apache-2.0, a DaisySP port MIT and the Inter Tight font SIL OFL 1.1. The README says the VSCO-2 CE and VCSL samples are CC0. No M-VAVE stock image is in the repository; the installer's return-to-official function asks for the user's own official package.
homepage: https://drophlex.github.io/ANDROMEDA/fm1/
based_on: m-vave-fm-1/felucca
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Open the installer in Chrome or Edge with the FM-1 on a direct USB-C data cable and press Install; writing takes about five minutes and the unit must not be unplugged meanwhile. The same package is in install/ as a .fwsc for Felucca's tools. The installer can return to M-VAVE's official firmware (V15 or V16) from an official FM-1.fwsc that the user supplies, saving the music, banks, samples and settings first. The README says to install at your own risk and follow the manual.
brick_risk: false
