device: m-vave-fm-1
name: ANDROMEDA FM-1
summary: >-
  Felucca 1.8.2 with six ambient pages: a mood generator that writes four tracks in key, an AUTO page that keeps varying your pattern, key snapping, a sky macro page, a three-head tape echo and four drawn visions, with an English and Spanish screen.
description: >-
  Every sound and feature of Felucca stays. ALIGN picks one of 13 moods and a key and writes all four tracks at once, with a beat or texture, bass, chord pad and bells or a melody. AUTO changes one part every two, four or eight bars from the player's own pattern, with an ENERGY control for how many parts sound. KEYS snaps or shifts played notes to a scale, and with SHIFT a note outside the scale moves the whole song to the nearest scale on the next beat. SKY has drift, haze, bloom and gravity controls and an eclipse action. SPACE TAPE is a three-head echo with spring in 12 modes and a freeze. VISION draws cymatics, a harmonograph, an attractor or an orrery from the music. Six analog presets and a 32-voice FM bank are added, and the screen can be switched to Spanish. The repository holds the firmware source with a patch against Felucca, a bilingual manual and a browser installer. It is a separate release line from the same authors' Dark Funk Durcal Synt, whose design it credits.
status: active
authors:
