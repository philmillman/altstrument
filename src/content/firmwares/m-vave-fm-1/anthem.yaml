device: m-vave-fm-1
name: ANTHEM
summary: >-
  Generative firmware for the FM-1 in which up to four Langton's-ant-style walkers paint a grid and sing the note of each cell, with time that can run backwards, wave terrain synthesis and a chord arpeggiator. Early; not yet run on a real FM-1.
description: >-
  Up to four ants walk a grid of cells, and on each step an ant reads the colour under it, turns by its rule, repaints the cell and sings that cell's note. There are nine rules, from Langton's ant to square, mirror and spiral families, and a seed sets the starting ground. Nothing is random, so a seed and rule always give the same song, and the rule runs exactly backwards: OCT- steps the colony back and un-paints it, OCT+ goes forward, and SEL freezes the paint so the walk becomes a loop. A cell's note comes from a map with step counts across and up, folded into a range of octaves, with 48 scales. The sound is wave terrain synthesis, where the painted grid is a landscape of heights and each note traces an orbit over it. The keys only set the root or, on the ARP page, the chord the ants sing. It carries eight presets and eight user slots that store the colony too, and from Dinghy it has MIDI clock sync, MIDI in and out, USB audio and a backup page. The README warns that it has only been tested on a computer and not on a physical FM-1, and the project says it was written with Claude.
