license_notes: >-
  The README and LICENSING.md state GPL-3.0-only and the LICENSE file is the GPL-3.0 text. Dinghy's platform files keep their upstream notices, the screen mirror is MIT, the IBM Plex Mono and Terminus fonts are SIL OFL 1.1 and the JieLi SDK files are read from the builder's own checkout at build time and are not in the repository.
homepage: https://github.com/jaak-stjaaques/Anthem
based_on: m-vave-fm-1/dinghy
distribution: source-only
install_notes: >-
  Build with sh build.sh (Python 3 with Pillow, the JieLi toolchain and three AC79 SDK files, through Docker on macOS); every push to main also builds a package onto the repository's build branch. The README says to keep stock firmware or another firmware ready to flash back, and that holding OCT- at power-on starts the USB rescue mode, with the Firmware Hub's rescue page explaining the way back to the official firmware. It says nothing has been installed on a real FM-1, so treat it as untested.
