device: m-vave-fm-1
name: APSIS
summary: >-
  Native FM-1 firmware of the author's APSIS browser instrument: one shared musical state shown through string, drift,
  clock, spiral, bloom, gravity, chain and keep surfaces, with five sound sources into a shared reverb space.
description: >-
  A fork of Dinghy 0.4 where the platform files stay close to upstream and the APSIS state, scheduler, source DSP, room and
  surface code sits in its own directory with one app file. The project journal is stored in Dinghy's flash blob sectors.
  The repository's state file reports CI measurements on the fm1-emu cycle model, about 44 % average audio load with the
  worst block near 70 %, and the README says no physical FM-1 has run it yet, so sound, interrupt margin and power-cut
  behaviour are unverified. Development notes, decision records and tests are kept in the repository.
status: active
authors:
- name: joakimskurk
  url: https://github.com/joakimskurk
source: https://github.com/joakimskurk/fm1apsis
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL version 3 text and the README and PLATFORM.md describe the platform as Dinghy's GPL-3.0-only; there
  is no later-version option. The Terminus font is SIL OFL 1.1.
distribution: source-only
install_notes: >-
  Build build/apsis.fwsc with make fw, which needs the JieLi toolchain (Docker on macOS) and JieLi's AC79 SDK, then install it
  over USB-MIDI with tools/fm1_install.py. The README says a tag vX.Y would publish a package through CI, but the repository has no
  tags or releases.
brick_risk: false
