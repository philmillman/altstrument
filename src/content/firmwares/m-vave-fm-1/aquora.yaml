device: m-vave-fm-1
name: AQUORA
summary: >-
  Generative ambient firmware with eight synthesized roles including drums, Solfeggio reference tones, stereo binaural
  beats, procedural nature beds and four saved arrangement banks.
description: >-
  Plays itself in scenes that set scale, tempo and density, with motifs that vary at phrase boundaries. The pages are
  PLAY, SOUND, EVOLVE and MIX, with a quick-find list of parameters and an eight-track console. Fixed tones run at
  frequencies from 111 to 963 Hz, and the binaural mode puts a carrier and a small difference on the left and right
  channels. The screen has several visualizers, and an experimental AIR control reads Bluetooth signal strength to
  modulate reverb and echo. The author states that no medical benefit is claimed. It was built with AI tooling, and
  its release notes say that the changes in each build are unverified on hardware, with the owner having confirmed
  playback of 0.2.0 only. It builds on charlesvestal's fm1-base.
status: active
authors:
- name: CodingSlapfu
  url: https://github.com/CodingSlapfu
source: https://github.com/CodingSlapfu/AQUORA
source_status: open
license: MPL-2.0
license_notes: >-
  The repository has no LICENSE file. The licence comes from statements in the source: device/app.c opens with an
  SPDX MPL-2.0 identifier and device/fm1.toml sets licence = "MPL-2.0", matching fm1-base. The release notes describe
  the AQUORA Sans font as OFL-licensed. The release assets include the full source archive with the pinned SDK inputs.
distribution: browser-installer
install_notes: >-
  The release notes link a browser installer that needs Chrome or Edge with Web MIDI and SysEx access, and the
  releases carry the .fwsc and a single-core .fwsc. The manual says an interrupted application write needs recovery
  and that the update is not a dual-bank rollback. Earlier builds are kept for rollback, and the release notes say
  physical flashing and rollback are unverified. The 0.7 releases say they are for the original Puya flash chip only
  and do not support the newer UC25HQ80.
brick_risk: false
tags: [generative, ambient, synth-engine, fx, sequencer, drums, reverb, delay, emulator]
versions:
- version: 0.7.3
  date: 2026-11-10
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.7.3
  notes: Adds an INTENSITY knob on the performance page that blends sparse through richer orchestration, optional call-and-response on the physical keys with a four-slot motif memory, independent LIGHTS, KEYS, NOTES and DANCE controls, a black interface with larger text and a continuous EVOLVE lookahead. Banks move to a V8 layout that migrates V1 to V7, and older firmware cannot read it; the v0.7.2 firmware is included for rollback. For the original Puya 0x856014 flash only. The notes list real FM-1 flashing, rollback and listening as hardware checks still open.
- version: 0.7.2
  date: 2026-11-10
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.7.2
  notes: Adds an ARRANGE view that shows upcoming sections, queues a chosen next section and sets its length, a dedicated EVOLVE graph with a two-bar event preview, joint intention and mode profiles for instruments and drum kits, and new two-bar Neoclassical phrasing with stronger dynamics. Banks move to a V7 layout that migrates V1 to V6. For the original Puya 0x856014 flash only; the newer UC25HQ80 is unsupported. The notes say LCD, DMA and radio timing and listening remain owner observations, not inferred from host tests.
- version: 0.7.1
  date: 2026-11-10
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.7.1
  notes: Adds stable rhythmic themes with twelve contours and four rhythmic identities, bass anchors and ghost percussion, a 160-pixel EVOLVE display with onset blocks, and 21 intention reference tones with an exact audible oscillator. For the original Puya 0x856014 flash only; the newer UC25HQ80 is unsupported. The notes give host-side test counts and say host timing is not FM-1 DMA, LCD or radio evidence.
- version: 0.6.7
  date: 2026-11-07
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.7
  notes: Adds a third visualizer, Chladni, beside Original and Cymatics, and eight more intentions for 21 in total. Longer loops now run through statement, answer, bridge and resolution. Visualizer, LED, display and startup preferences save during playback. The release notes list hardware flashing, LCD frame rate and LED brightness as unverified by the owner.
- version: 0.6.6
  date: 2026-11-07
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.6
  notes: Adds a redrawn water and sand cymatics visual, a startup sound option (off, quiet or normal), changed key lighting and fixed 20-target or automatic scheduling. USB and Bluetooth performance MIDI are disabled on purpose; firmware-update SysEx still works. The release notes list FM-1 frame rate, headroom and update behaviour as unverified.
- version: 0.6.5
  date: 2026-11-05
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.5
  notes: Hotfix for performance and SAVE reliability, with a time-limited save that reports failure instead of false success, six more FM basses, a new startup spiral and auto gain and auto level on the master FX page. The release notes say physical FM-1 performance and flashing are unverified.
- version: 0.6.4
  date: 2026-11-05
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.4
  notes: Adds Standard, Cinematic and Neoclassical music modes, independent automatic or manual lead and bass motion, and a Resonance Plate standing-wave display.
- version: 0.6.3
  date: 2026-11-05
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.3
  notes: Adds one-press SAVE on every page, CRC-protected bank commits, black and white canvases and standing-wave Polar Bloom contours.
- version: 0.6.2
  date: 2026-11-05
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.2
  notes: Adds four panel skins, an eight-track console, direct SOUND sections, an 83-parameter quick find and AIR calibration readouts.
- version: 0.6.1
  date: 2026-11-05
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.1
  notes: Adds role traces, FM instruments and percussion, extra nature beds, lighting modes and a passive Bluetooth AIR scan.
- version: 0.6.0
  date: 2026-11-05
  url: https://github.com/CodingSlapfu/AQUORA/releases/tag/v0.6.0
