  url: https://raw.githubusercontent.com/Wulgaren/Araminta/HEAD/docs/araminta.png
  alt: "Araminta splash screen: a white stippled four-petal flower in a dotted circle on black, with the name ARAMINTA below"
  credit: Wulgaren
  source_url: https://github.com/Wulgaren/Araminta
  first_party: true
versions:
- version: '3.10'
  date: 2026-11-12
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.10
  notes: Projects grow to the FUN20 format (FUN7 to FUN19 still load), with autosave as a 4096-byte A/B pair, 96 user presets in six banks and chord glide on POLY. Factory sounds and FM6 patches come in the same build with USB serial turned off so the image fits. The release notes advise a full flash dump with tools/fm1_flash_dump.py before installing over stock, since a SysEx backup does not keep the factory radio calibration. The release attaches no package; build it or use the web installer.
- version: '3.9'
  date: 2026-11-10
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.9
  notes: With the ARP on, a free take records the notes the arpeggiator plays, a latched chord starts the take on the next arp note, and closing the take stops the arp. PITCH becomes the last VOICE card, so the pitch bend is on K4. No project, preset or setting change; 3.8 files load as they are. The release attaches no package; build it or use the web installer.
- version: '3.8'
  date: 2026-11-08
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.8
  notes: Adds a pitch-bend card to the VOICE page, with a second VOICE page in UNISON, and moves CLOCK to MASTER's second page. Units with the newer UC25HQ80 flash chip can save and update again; a unit already on the newer chip with an older build needs one flash through M-Flasher or m-bootloader first. Also adds an Ableton Live 12 Control Surface script and removes the boot pop. The release attaches no package; build it or use the web installer.
- version: '3.7'
  date: 2026-11-02
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.7
  notes: KNOB 1-4 send relative MIDI CCs 16-31 on the USB output by track, with PRESETS as pitch bend and SELECT as mod wheel; saves unchanged. The release attaches no package; build it or use the web installer.
- version: '3.6'
  date: 2026-11-01
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.6
  notes: FM6's E5 macro becomes VIB, the patch LFO's pitch depth, and older VMOD values move into operator velocity sensitivity. The DIGITAL engine's DSP and the FUN1 to FUN6 project formats are dropped, so such projects show as empty and DIGITAL sounds no longer play; the web editor converts them on upload.
- version: '3.5'
  date: 2026-10-31
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.5
  notes: ANALOG gets OSC A and OSC B pages, with OSC B's own wave, PWM, MORPH and DRIFT; a strummed chord records into one step in free take, and CLOUD's SIZE 127 holds the tail instead of droning. Project format unchanged.
- version: '3.4'
  date: 2026-10-29
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.4
  notes: LFO pages draw a live scrolling waveform and S&H's SMTH as a glide; CLOUD's reverb tail now ends in silence, and SIZE 127 freezes it.
- version: '3.3'
  date: 2026-10-29
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.3
  notes: Safer audio maths with identical output, LEDs dark during a flash erase, MAP ALL shares one scale across every track and AUTO and MELO chord keys.
- version: '3.2'
  date: 2026-10-28
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.2
  notes: Adds Felucca's DRUMS engine, a per-step PITCH lock, chord STRUM and STROKE, a TAPE effects bus and MASTER routing; saves use a new FUN19 format that older builds show as empty.
- version: '3.1'
  date: 2026-10-22
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.1
  notes: Adds a public-domain CR-78 drum kit to SAMPLE and one card per user slot in the editor.
- version: '3.0'
  date: 2026-10-22
  url: https://github.com/Wulgaren/Araminta/releases/tag/v3.0
  notes: Adds a WAVETABLE engine with two morphing oscillators; user slots hold full wavetables.
- version: '2.8'
  date: 2026-10-21
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.8
  notes: New FUN16 project format with room for 88 motion records; one-way once a project is re-saved.
- version: '2.7'
  date: 2026-10-19
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.7
  notes: An overload that runs past the deadline sheds two voices at once; editor project slots get one row each.
- version: '2.6'
  date: 2026-10-19
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.6
  notes: FX punch-ins reach every effect again on two fixed pages; an overload thins a voice sooner.
- version: '2.5'
  date: 2026-10-18
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.5
  notes: The delay TIME roll follows the FM-1 tape law.
- version: '2.4'
  date: 2026-10-17
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.4
  notes: The second core renders parts of the mix; an update refuses a package built for another board.
- version: '2.3'
  date: 2026-10-15
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.3
  notes: Drum pattern generation on DRUM-X; the slicer records cleaner when tracks share a send.
- version: '2.2'
  date: 2026-10-14
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.2
  notes: Leaner FM6 and USB audio timing and revised navigation.
- version: '2.1'
  date: 2026-10-13
  url: https://github.com/Wulgaren/Araminta/releases/tag/v2.1
  notes: Smooth oscilloscope, scale lock for every track and a drone mode in the arpeggiator.
- version: '2'
  date: 2026-10-12
  url: https://github.com/Wulgaren/Araminta/tree/v2
  notes: Git tag; no GitHub release page.
