device: m-vave-fm-1
name: ARCADE RAT
summary: >-
  Arcade sound lab and tracker for the FM-1 with Z80-based arcade game engines, emulated arcade sound chips, a 16-step multi-chip tracker, SFX banks on the keys and speech samples.
description: >-
  Rights warning: src/pacman_roms.h holds the byte data of Pac-Man's program, tile, sprite, colour and sound ROMs, and the repository and release carry speech recordings taken from Berzerk, Q*bert, Sinistar, Wizard of Wor,
  Gorf and Dragon's Lair arcade games. The repository has no licence and no permission for any of this material.

  The README describes eight game engines (Pac-Man, Crazy Climber, Galaga, Donkey Kong, Frogger, Asteroids, Tempest and Gyruss) running a Z80 core and emulated Namco, AY-3-8910 and POKEY sound hardware, a studio
  of five synth engines with a filter and delay, a four-channel 16-step tracker with eight factory patterns, 108 SFX pads in four banks, a flash high-score table and circuit-bending effects on the 240 by 240 screen.
  The repository is mostly tools, tests and a browser simulator. The release contains a demo video and audio renders but no firmware package, and the README gives a flash command for an arcade_rat_fm1.fwsc that is not in the repository.
  Its source section shows only the Pac-Man engine in C, so how much of the rest is native firmware is unclear.
