device: m-vave-fm-1
name: Arctic Scream
summary: >-
  GR!MM-based drone firmware with Holvut, a feedback-loop voice that grows out of silence into a howl, a DRONE page
  of slow random walks, 38 factory sounds, a drone-length piece that plays itself, a new look, a browser demo and an editor.
description: >-
  A modified version of GR!MM, keeping its four tracks, effects, 64-step sequencer, chords, arpeggiator and song
  mode. Holvut is a string and resonant body in a saturating feedback loop, written from scratch after the Synthux
  Audrey II design, and each key press sends a burst into the loop. The DRONE page adds drifting filter, shape and
  reverb movement per track, a tension control and a rise time in bars. Further changes are six presets that hold
  their notes, a close-interval HORROR scale, delay feedback up to 150 percent, keys an octave lower and an
  aurora-themed screen. From 2.0 it adds JIEHKKI, a timed piece that plays itself and fades out, RUOHČAT ice sounds, pure tunings for drones, a wind sound source and an aurora screen-off mode. From 1.5.2 MOD OUT sends each track's level and LFO over USB, and PANEL OUT is an open protocol that tells apps which keys
  and buttons are down and how the knobs turn. It keeps its own saves separate from GR!MM's. The project site has a browser demo, an
  editor that works with or without an FM-1, and a cheat sheet.
status: active
authors:
