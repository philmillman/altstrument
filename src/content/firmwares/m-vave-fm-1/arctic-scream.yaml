  url: https://github.com/PolarPatch
source: https://github.com/PolarPatch/Arctic-scream-FM-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0 only for GR!MM and for PolarPatch's changes. GR!MM's msfa file is Apache-2.0 and its
  DaisySP and Rings files are MIT. The PolarPatch logo is not under the GPL. The 1.5.2 notes say firmware/src/panel_out.c is MIT and docs/PANEL_OUT.md is CC0.
homepage: https://polarpatch.github.io/Arctic-scream-FM-1/
distribution: download
install_notes: >-
  Download the release .fwsc and install it with tools/fm1_install.py over USB. It installs over the stock
  firmware, GR!MM or any other FM-1 firmware, and releases carry a GitHub attestation from the Firmware Hub's
  build workflow. Do not unplug the FM-1 while it writes. The README says installing is at your own risk and
  points to the Rescue page of the FM-1 Firmware Hub for a stuck unit.
brick_risk: false
tags: [synth-engine, sequencer, fx, reverb, delay, ambient, chords, arpeggiator, editor, emulator, fork]
