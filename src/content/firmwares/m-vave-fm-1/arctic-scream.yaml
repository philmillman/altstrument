versions:
- version: '2.0'
  date: 2026-11-12
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v2.0
  notes: The drone machine. JIEHKKI plays a whole piece by itself for a set length (5 to 60 minutes or endless) and then goes dark; RUOHČAT adds ice cracks and drips, and your own samples can join them; pure tunings (JUST, PYTHAG, HARMONIC) hold a chord still; Biegga is a ninth, wind-based sound source; and a SCREEN OFF choice shows an aurora over stars. ACCIDENT moves a few track settings at random, PRESETS blend under a sounding drone, MASTER is louder, and the factory set is 38 sounds. Projects, sounds, samples and settings stay.
- version: 1.5.2
  date: 2026-11-09
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.5.2
  notes: Shows UPDATE MODE, a WRITING bar and DONE on the screen during an install instead of leaving it black. Adds MOD OUT, which sends each track's level (CC 102) and LFO (CC 103) over USB, and PANEL OUT, an open protocol that tells an app which keys and buttons are down and how the knobs turn. DELAY now runs to 2.6 s, the browser demo plays in tune at 48 kHz and RAM use falls from 93 KB to 79 KB. Projects, sounds, samples and settings stay.
- version: 1.5.1
  date: 2026-11-08
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.5.1
  notes: Adds support for the newer UC25HQ80 flash chip so saves and updates work on FM-1s sold since autumn 2026; nothing else changes. A newer unit on 1.5 or older needs one flash through the chip's USB download mode (m-flasher or the Firmware Hub's Rescue page) before updates install normally.
- version: '1.5'
  date: 2026-11-07
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.5
  notes: Release page has no text; the commits add speech output of the screen for the fm1-reader app, saves that go through while a latched drone is playing, project files in the editor that keep effects and tempo, and a displayed corner frequency for TAPE's TONE.
- version: '1.4'
  date: 2026-11-06
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.4
  notes: Release page has no text; the commits add a LOOP page for Holvut (gate, bloom, low cut, excite), ping-pong and shimmer on the AIR page, a USB level setting for the computer recording with a limiter, and a settings format change that loads older saves.
- version: 1.3.1
  date: 2026-11-01
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.3.1
  notes: Release page has no text; the commits make USB audio work on macOS 10.14 to 15 and at full level.
- version: '1.3'
  date: 2026-11-01
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.3
  notes: Release page has no text; the commits bring in GR!MM V2.0's GENERATE, MASTER and DRIVE effect pages, track filter types, MIDI clock and TRS MIDI input, plus a visual manual.
- version: '1.2'
  date: 2026-10-31
  url: https://github.com/PolarPatch/Arctic-scream-FM-1/releases/tag/v1.2
- version: '1.1'
  date: 2026-10-26
