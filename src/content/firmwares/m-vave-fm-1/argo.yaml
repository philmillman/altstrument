  date: 2026-11-11
  url: https://github.com/echoe/argo_fm1/releases/tag/1.8.2
  notes: The release notes only say it finishes the remaining to-do items. The commits since 1.8.1 add a user pattern of 16 steps for the slicer insert, saved with the project, make changes to SH-DRUM and to the interface, and fix a speed display in the screen.
- version: 1.8.1
  date: 2026-11-09
  url: https://github.com/echoe/argo_fm1/releases/tag/1.8.1
  notes: Rebased on a newer Felucca with the change that is meant to support the newer flash chip, which the author could not test. Adds a page for setting the preset per step that also switches user presets within one engine, patch slots 33 to 48 (without FM6, with the old patterns in the patches removed to make room), a tape insert effect and pulse wave and sync on SH-DRUM. Tried on one FM-1 only.
- version: 1.7.0
  date: 2026-11-06
  url: https://github.com/echoe/argo_fm1/releases/tag/1.7.0
  notes: Renamed Argo. Removes the sample, grain, slice and drum engines and all samples, adds the FM-TONE, SWARM, WAVETONE, DRUM-X and SH-DRUM engines, and adds a preset change per step.
