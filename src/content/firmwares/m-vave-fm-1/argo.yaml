device: m-vave-fm-1
name: Argo
summary: >-
  Felucca fork, renamed Argo, with eight selectable sequences per track, sequence chaining, a generative arp, chord
  strum and play modes, and swapped engines: the sample engines are gone, and three Mini-Tone engines, DRUM-X and an SH-DRUM engine are in.
description: >-
  The sample, grain, slice and drum engines and all bundled samples are removed. Added in their place are the FM-TONE, SWARM
  and WAVETONE engines from Mini-Tone, the DRUM-X engine from Jiant and SH-DRUM, a drum and synth engine the author
  models on the SH-4d, and a track can change preset on a step, with a page for it and user presets allowed within the same engine. Version 1.8.1 adds 16 more patch slots (33 to 48, without the FM6 engine), a tape insert effect, pulse wave and oscillator sync on SH-DRUM, and the newer UC25HQ80 flash chip support taken from Felucca. Each track plays one of eight sequences, chosen on a SEQ page
  or with keys while SEQ is held, switching at once or at the end of the current pass. Chained sequences play in order,
  and a song cell can name which sequence it plays. The arp gains a generative option with density, chord, evolve and
  algorithm knobs, and the chord page gains strum modes and a play mode whose black keys are set from saved packs.
  The sequences use the flash that Felucca's user sample slots occupy. The repository was first named Felucca_8_patterns,
  then Felucca_seq_per_track, and became argo_fm1 with 1.7.0. The README began as Felucca's and the author has
  rewritten it to list what changed. It says the project is built with generative AI, with design and direction by the
  author, and the release notes say the author plans further changes to keep it apart from Felucca.
status: active
authors:
- name: echoe
  url: https://github.com/echoe
source: https://github.com/echoe/argo_fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca; LICENSING.md covers the bundled assets and ported DSP. The README notes the CC0 Hügelton
  sample pack is meant to be removed, and lists the Mini-Tone and Jiant engines as sources.
homepage: https://echoe.github.io/argo_fm1/
distribution: browser-installer
install_notes: >-
  The project page is a web installer for Chrome or Edge over USB, and each release carries a .fwsc package. The README
  says installing is at your own risk and that M-VAVE's updater or the installer's Return to official V15 goes back.
  Projects saved with sequences may not open on firmware without them, and projects that use the removed sample
  engines will not play.
brick_risk: false
tags: [sequencer, performance, synth-engine, fork]
versions:
