  url: https://github.com/echoe/argo_fm1/releases/tag/v1.8.3
  notes: The release notes list only the 1.8.2 merge and edits made to get ready for submitting the firmware to the Firmware Hub. The release holds argo-1.8.3.fwsc and a checksum file.
