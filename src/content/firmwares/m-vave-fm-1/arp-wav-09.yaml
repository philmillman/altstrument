device: m-vave-fm-1
name: ARP WAV 09
summary: >-
  Two-voice acid synth on the Dinghy platform: a latching arpeggiated lead and a droning bass with 303-style knobs, a drum kit
  page and a neon start-up logo.
description: >-
  The app's header comment describes a minimal instrument with no presets and no saving: switch on and a raw sawtooth plays. The
  PRESETS encoder picks the lead or the bass. The lead holds a chord after release and arpeggiates it in four patterns (up, up-down,
  bounce and offbeat); the bass is a saturated drone that rings until another key is pressed. Three pages of knobs give cutoff,
  resonance, envelope amount and decay, then glide, FM, ring modulation and a vowel control, then drive, delay, warp and crush.
  Turning PRESETS fully right selects a drum kit without a sequencer. The code is integer-only and lives in the platform's dinghy.c, with lookup tables in
  acid_tables.h. The README and documentation are still Dinghy's, so the description above comes from the source's
  header comment.
