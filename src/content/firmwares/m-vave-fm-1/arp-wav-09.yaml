distribution: download
install_notes: >-
  Releases from v1.0.2 carry a .fwsc package named dinghy.fwsc, and a GitHub workflow builds it; locally the
  Dinghy build and install scripts apply (./build.sh, then tools/fm1_install.py). The README says the USB rescue and the
  Firmware Hub can return the unit to other firmware.
