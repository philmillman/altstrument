device: m-vave-fm-1
name: ARP WAV 09
summary: >-
  Five-voice instrument on the Dinghy platform: a latching arpeggiated lead, a droning bass, a 16-step recorded loop, a drum kit and a radio voice
  that tunes through generated sounds, with 303-style knobs and a neon start-up logo.
description: >-
  The app's header comment describes a minimal instrument with no presets and no saving: switch on and a raw sawtooth plays.
  The PRESETS encoder picks one of five voices (ARP, WAV, SEQ, KIT, FM1) and the keys, knobs and volume act on that voice.
  ARP holds a chord after release and arpeggiates it; WAV is a saturated drone that rings until another key is pressed; SEQ
  writes notes into a loop of 16 boxes; KIT is a kick, snare and hat pattern with a tempo of its own that ducks the other voices; FM1 is a radio with
  stations hidden on a dial. Two pages of knobs per voice cover cutoff, envelope, decay, delay, stretch, FM and crush. The
  code is integer-only and lives in the platform's dinghy.c, with lookup tables in acid_tables.h. The README and
  documentation are still Dinghy's, so the description above comes from the source's header comment.
