versions:
- version: 2.0.2
  date: 2026-11-06
  url: https://github.com/KHAVld/ARTIHIVE/releases/tag/artihive-2.0.2
  notes: Fixes high-contrast flashing in DISORDER in 2.0.1 (the release notes recommend updating), which now shows a full-screen audio-reactive cell animation in the chosen colourway. Also removes a click at the FREEZE loop boundary, adds the ULTRAVIOLET colourway and migrates saved settings and user presets.
- version: 2.0.1
  date: 2026-11-05
  url: https://github.com/KHAVld/ARTIHIVE/releases/tag/artihive-2.0.1
  notes: Adds a user arpeggio of 1 to 16 chord or rest steps and DISORDER on a REC hold, smooths the HYPER LFO and the delay modulation to remove clicks, drops three factory presets with automatic migration of saved patches, and waits for silence before saving to flash.
- version: 2.0.0
  date: 2026-11-04
  url: https://github.com/KHAVld/ARTIHIVE/releases/tag/artihive-2.0.0
  notes: Adds POLY mode with all 27 keys, global envelope and tuning controls, 10 to 400 BPM arpeggiation, mutation, output compression and support for the UC25HQ80 flash chip.
