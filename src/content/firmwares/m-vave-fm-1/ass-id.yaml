device: m-vave-fm-1
name: ASS-ID
summary: >-
  ATEK303 acid synth with a second 64-step drum track on the same clock: eight synthesized 808, 909 and 707 style voices, a seeded pattern generator with mutations and LOCK, a drum matrix editor and shared effects.
description: >-
  Keeps ATEK303 1.2 unchanged for the bass line and adds a drum track that plays with it, sharing tempo, PLAY and MIDI clock. The drums are synthesized without samples: kick, snare, clap, closed and open hat, two toms and a cowbell, with a rimshot in the 707 kit. A knob switches between three kits. A seeded generator, set with density, accents and fill, always gives the same groove for the same seed, and the ENV, LFO and ARP buttons mutate backbone, tops and accents. LOCK freezes both tracks. An 8 by 16 matrix edits hits, accents and row offsets with undo, and swing, track length and per-voice level, tune and decay are adjustable. The drums go through the same drive, chorus, delay and reverb, they are sent as General MIDI notes over USB, and eight factory presets store the drum pattern too. Presets saved with ATEK303 1.2 do not load. The README, which is in French, lists checking on a real FM-1 among the steps before publication. The project site has a browser emulator.
