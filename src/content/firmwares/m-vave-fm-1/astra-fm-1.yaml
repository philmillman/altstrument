  url: https://github.com/MichaelAPerry
source: https://github.com/MichaelAPerry/ASTRA-FM-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README names GPL-3.0-only, and LICENSING.md says the firmware is GPL-3.0-only because it is built on Dinghy. The planet series are VSOP87B coefficients as truncated in Astronomy Engine (MIT), and the site's installer is Felucca's. The reading text is the author's own, and the Crowley table titles are from a work the file treats as public domain. The package carries the JieLi SDK files that Dinghy's build adds.
homepage: https://michaelaperry.github.io/ASTRA-FM-1/
distribution: browser-installer
requires_stock: V15 or another custom firmware
install_notes: >-
  Use the installer on the project site, or download astra-0.1.fwsc from the release. The README says to know the USB rescue before installing: hold OCT- while switching on. Back up first.
