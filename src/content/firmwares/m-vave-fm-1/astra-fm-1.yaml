device: m-vave-fm-1
name: ASTRA FM-1
summary: >-
  Astrology instrument built on Dinghy: the FM-1 calculates planet positions for 1800 to 2200, casts a birth chart from your details, and wires ten FM operators from the chart's aspects.
description: >-
  The firmware computes the positions of the Sun, Moon, Mercury to Pluto and the Moon's node on the device, with no network, in seven house systems and in tropical or sidereal form. Entering a birth date, time and place builds a chart, and the aspects between planets decide which of ten FM operators modulates which: the README describes a trine as a smooth bend, a square as a metallic ring and an opposition as a loop. Four notes play at once through 37 wirings, with chorus, echo and reverb, and 64 preset slots whose unsaved entries build a sound from your chart. Seven screen pages show the chart as a wheel and a horoscope of today's transits, closest to exact first, with a 30-day graph either side and the Moon's phase. Readings quote the Tarot titles that Aleister Crowley's 777 gives each planet and sign. The README calls it a working title and an early build, tested on a physical FM-1 and in the fm1-emu emulator, and says astrology here is symbolic reading, not prediction. The project site runs the firmware in a browser emulator.
status: active
authors:
