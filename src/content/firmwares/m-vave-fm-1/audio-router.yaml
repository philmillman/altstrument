device: m-vave-fm-1
name: FM-1 Audio Router
summary: >-
  Turns the FM-1 into a 2-in 2-out USB audio interface and a Bluetooth audio receiver with AAC, aptX and LDAC, with a five-band
  parametric EQ, a peak limiter, a mixer and three visualizers.
description: >-
  The FM-1 shows up on the computer as a class-compliant 16-bit 44.1 kHz audio interface, and also receives Bluetooth
  audio with AAC, aptX, aptX HD, LDAC or SBC. Incoming audio plays through the speaker or headphones, and a USB out can send it back to
  the computer, raw or after effects. The effects are a five-band parametric EQ with selectable filter types and a peak
  limiter, each with eight presets, switched on by holding FX. A mixer trims the inputs and USB output with mute and solo on
  the keys, and the visualizers are meters, waveforms and a 40-band spectrum, the last two limited during AAC playback because
  of memory. It builds on fm1-base and felucca-bsp with Optimist's Bluetooth stack, and the firmware container embeds m-bootloader.
