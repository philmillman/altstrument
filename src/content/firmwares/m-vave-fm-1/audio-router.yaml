homepage: https://github.com/maxravedj/fm1-audio-router
distribution: download
install_notes: >-
  Flash m-bootloader with M-Flasher first, power on holding REC, then flash the release's fm1-audio-router-v0.3.0.fwsc
  with M-Flasher. docs/INSTALL.md says to keep bootloader replacement off for updates, to keep a verified full-flash
  backup, never to write below 0x4000, and that a unit that no longer enumerates on USB may need hardware recovery.
