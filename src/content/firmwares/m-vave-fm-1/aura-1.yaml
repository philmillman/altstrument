device: m-vave-fm-1
name: AURA-1
kind: firmware
summary: >-
  Generative ambient firmware modified from AMB-1, adding a Solo Mode for playing polyphonic synth over the generated music and a Random World patch generator.
description: >-
  AURA-1 keeps AMB-1's self-playing ambient design of breathing voices, bells on tape loops of unequal length, a gliding bass and quiet Euclidean percussion through a tape echo, a long loop and a plate reverb. There are sixteen pieces and a choice of scale, and the keys add or remove notes of the scale. Solo Mode turns the keys into a live polyphonic synth over the generated music, with six pages for preset, ADSR, tone, delay, reverb and arpeggiator, and a user preset slot. Random World generates new ambient patches from a held EDIT press. It reports its screen to the FM-1 Screen Reader page over USB. A browser emulator, installer and manual are on the project site, which follows main, while tagged releases are the verified versions.
status: active
authors:
