  url: https://github.com/ahaku
source: https://github.com/ahaku/AURA-1
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSING.md gives MPL-2.0, file by file, on fm1-base and felucca-bsp, which are MPL-2.0. AMB-1 0.9 and earlier were GPL-3.0-only and stay so; AMB-1's later code was relicensed by its author.
homepage: https://ahaku.github.io/AURA-1/
based_on: m-vave-fm-1/amb-1
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB. The site installs the latest development build from main; tagged releases are listed on GitHub. The README says the installer can put M-VAVE's own firmware back and that an FM-1 that fails to start twice comes up in a safe mode the installer can reach.
