device: m-vave-fm-1
name: AURORA
summary: >-
  Generative ambient firmware that plays itself: pads, bells, drone, wind and soft drums over a very large reverb, under an aurora drawn on the screen, with a keyboard that plays pads, bells or a choir.
description: >-
  Pads move through chord progressions and keep returning to a motif, bells play phrases of it, and the piece drifts through sections and keys, with an EVOLVE knob setting how much changes. Every button opens a page of four knobs and adds its own light to the sky: sky, effects, pad shape and tone, motion, drone, machine, drums, a mixer and a night page. The keys play snapped pads, latch a drone, strike bells or sing with a choir of recorded voices, and drums are a heartbeat, a rim, a shaker and chord mallets. A freeze mode holds the reverb and the sky still, a night page adds lake sounds, loon calls and a sleep timer, four saved moments recall a whole setup, and everything it plays goes out over USB MIDI. The firmware runs in the browser as well. It is built on GR!MM's platform, DSP and reverb, with small build-time patches for newer FM-1s that use a UC25HQ80 flash chip. The choir comes from the VocalSet dataset.
status: active
authors:
- name: Andrew D'Amelio
  url: https://github.com/andrewdamelio
source: https://github.com/andrewdamelio/aurora-fm1
