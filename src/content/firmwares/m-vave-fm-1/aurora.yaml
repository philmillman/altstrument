license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3 text and LICENSING.md states GPL-3.0, with GR!MM and the Felucca, Dinghy, SLOOP and X0X work under it also GPL-3.0. The choir cycles are made from VocalSet (Northwestern University, 2018), licensed CC BY 4.0, and the screen font is Terminus under SIL OFL 1.1. The repository holds no M-VAVE firmware image.
based_on: m-vave-fm-1/grimm
homepage: https://andrewdamelio.github.io/aurora-fm1/web/dist/
distribution: browser-installer
install_notes: >-
  Releases are built from source and attested on GitHub by the FM-1 Firmware Hub's shared workflow, and carry aurora-X.Y.fwsc with SHA256SUMS. Install from the Firmware Hub in Chrome or Edge, or load the package with a FM-1 firmware loader. The package identity is FM-1_9441126. The project documents no recovery steps of its own; the hub's Rescue page and M-VAVE's updater are the usual ways back.
