device: m-vave-fm-1
name: AutoJam FM-1
summary: >-
  Improvising band for the FM-1: lead, bass, harmony and drums play on PLAY, and a few notes recorded on REC are answered on the next chords, in 14 styles with 125 melodic presets and 41 drum kits.
description: >-
  Pressing PLAY starts a lead, bass, harmony and drum part. Pressing REC, playing a few notes and pressing REC again lets the band remember the pauses and lengths played and answer on the coming chords. ALGORITHM picks one of 14 styles, among them lo-fi, ambient, bossa nova, synthwave, rock, Chinese pentatonic, swing, bluegrass, 8-bit and blues, each with its own poster, typeface and palette on the screen. The TRACKS page selects a track with SELECT and a preset with PRESETS, and saves a setup per style. The drum machine has 41 kits, drum hits on 16 white keys and four saved 16-step overlay patterns that can be entered on the keys. The screen shows a pixel stage whose band members move with the notes played. The code ports the motion engine of the author's AutoJam onto Felucca's audio and hardware base, with drum definitions and presets adapted from sloop-fm1. The README and its guide are in Chinese. The author reports a timing test of all 14 styles on one FM-1 and says the 1.1.0 release had not been flashed to a device.
status: active
authors:
