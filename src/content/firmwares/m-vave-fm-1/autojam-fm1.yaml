  url: https://github.com/nasonliu
source: https://github.com/nasonliu/AutoJam-FM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and LICENSING.md, carried over from Felucca, states GPL-3.0-only. The motion engine in firmware/autojam has its own Apache-2.0 LICENSE, and bundled parts keep their own licences under LICENSES/ (MIT, Apache-2.0, LGPL-2.1, SIL OFL 1.1, MPL-2.0 for felucca-bsp). The sloop-fm1 material is GPL-3.0-only. No stock firmware is committed.
based_on: m-vave-fm-1/felucca
homepage: https://github.com/nasonliu/AutoJam-FM1
distribution: download
install_notes: >-
  Download the .fwsc from a release. BUILDING.md installs it with tools/fm1_install.py (Python with mido and python-rtmidi) on a unit already running AutoJam or another custom firmware, after following that firmware's migration steps, or from a locally served copy of the web installer. It says that if an install fails and the FM-1 no longer starts, recovery needs FM-1-transporter. Stop playback and save the session before installing.
brick_risk: false
tags: [generative, drums, sequencer, synth-engine, performance, arpeggiator, chords, midi]
