device: m-vave-fm-1
name: B1 Drawbar Organ
summary: >-
  Drawbar organ for the FM-1: 91 tonewheel oscillators, nine drawbars on upper, lower and solo registrations, percussion,
  rotary speaker, scanner chorus, delay and reverb, with a sawtooth engine and 12 stored projects.
description: >-
  Builds the sound from tonewheel-style harmonics instead of recordings, with up to 12 voices. Two engines are
  offered, sine and a band-limited sawtooth, each with a cleaner organ character and a driven amplifier and cabinet
  character. Performance features include four keyboard ranges, chord assignment with a humanised onset, 48 scales and MIDI
  routing. It is built on SikkenWorks' BEETLE and ETCH and on Felucca. The README now leads with V5.6, an update-path
  repair that leaves the sound, interface and project storage unchanged, and says that release was flashed and tested on
  physical hardware. The older install text kept below it still carries earlier cautions about 12-voice timing and an
  on-device update failure.
status: active
authors:
- name: SikkenWorks
  url: https://github.com/SikkenWorks
source: https://github.com/SikkenWorks/B1-Drawbar-Organ
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and CREDITS.md. The Inter font glyphs are SIL OFL 1.1. The repository also holds earlier B1
  builds and a BEETLE reference package, which are SikkenWorks' own builds.
homepage: https://sikkenworks.github.io/B1-Drawbar-Organ/
distribution: browser-installer
install_notes: >-
  WebMIDI installer in Chrome or Edge, with the .fwsc in the repository and on releases. The installer accepts only FM-1
  packages that match B1's protected BEETLE boot header and loader requirements, and an ENTER UBOOT option hands off to
  the FM-1's update environment. The README says to back up projects, keep an independent tested recovery method, and
  not to keep retrying a failed update or treat the included BEETLE package as a universal recovery image.
brick_risk: false
tags: [synth-engine, oscillator, fx, performance, chords, scales]
