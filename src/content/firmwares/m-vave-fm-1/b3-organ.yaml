versions:
- version: '0.3'
  date: 2026-11-11
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.3
  notes: Adds three manuals (upper, lower and pedal) with their own drawbars on MIDI channels 1 to 3, three screens, a vibrato and chorus selector, a finer reverb scale and the newer UC25HQ80 flash chip, which the release notes say was tried on an FM-1 with that chip. The percussion no longer passes through the vibrato. Saved settings use a new layout, so the first start of 0.3 loads the defaults. 0.2 stays available as a fallback.
- version: '0.2'
  date: 2026-11-05
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.2
  notes: Replaces the soft-clip overdrive with a model of setBfree's preamp, adds a battery indicator, makes the percussion key click closer to setBfree's and lowers the load with many keys held.
- version: '0.1'
  date: 2026-11-05
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.1
  notes: First release.
