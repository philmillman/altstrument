  Terminus font is SIL OFL 1.1. The designburg logo in assets/ is all rights reserved and not under the GPL.
distribution: browser-installer
install_notes: >-
  Download b3organ-0.3.fwsc from the release and install it through the FM-1 Firmware Hub in Chrome or Edge, or
  with tools/fm1_install.py over USB. Hold OCT- while switching on for the USB rescue. The official firmware can
  be put back the usual way.
brick_risk: false
tags: [synth-engine, fork, emulator, fx, usb-audio]
