device: m-vave-fm-1
name: B3 ORGAN
summary: >-
  Tonewheel organ with 91 wheels, nine drawbars, percussion, scanner vibrato, overdrive, reverb and a Leslie,
  built from setBfree's data tables on the Dinghy base in integer arithmetic.
description: >-
  A fork of Dinghy that replaces its sine synth with an organ engine. Gear ratios, key click, the gain matrix,
  the Leslie tables and all 110 programs of setBfree's default.pgm are generated from setBfree's own data, and
  the README lists measurements against setBfree running on a Raspberry Pi. Drawbars, percussion and effects
  follow setBfree's default MIDI controller numbers over USB and TRS. The repository also has a WebAssembly
  build of the engine to play in a browser and a host mode that writes WAV files. The README says release 0.1
  has been tested on one FM-1. From 0.2 the overdrive follows setBfree's preamp model, and the firmware identifies as FM-1_953. From 0.3 it has three manuals (upper, lower and pedal) on MIDI channels 1 to 3, each with its own drawbars, and accepts the newer UC25HQ80 flash chip. From 0.7 the release also carries an experimental SMK-37 build, which its notes said was
  tested in an emulator only; the 0.7.1 notes report a first test on a real SMK-37 Elite, and 0.7.2 adds an SMK-37 layout for live playing.
status: active
authors:
- name: R-Jeb
  url: https://github.com/R-Jeb
source: https://github.com/R-Jeb/setBfree-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md. The setBfree-derived tables and programs are GPL-2.0-or-later, and the
  Terminus font is SIL OFL 1.1. The designburg logo in assets/ is all rights reserved and not under the GPL.
based_on: m-vave-fm-1/dinghy
distribution: browser-installer
install_notes: >-
  Download b3organ-0.7.2.fwsc from the release and install it through the FM-1 Firmware Hub in Chrome or Edge, or
  with tools/fm1_install.py over USB. Hold OCT- while switching on for the USB rescue. The official firmware can
  be put back the usual way.
brick_risk: false
tags: [synth-engine, fork, emulator, fx, usb-audio]
image:
  url: https://raw.githubusercontent.com/R-Jeb/setBfree-fm1/main/docs/screen.png
  alt: "B3 ORGAN v0.1 screen showing nine drawbar rows, vibrato, Leslie, percussion, overdrive and reverb states, and the program 5 Standard B"
  credit: "R-Jeb"
  source_url: https://github.com/R-Jeb/setBfree-fm1
  first_party: true
versions:
- version: 0.7.2
  date: 2026-11-28
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.7.2
  notes: "Reworks the SMK-37 build for live playing: the buttons act as vibrato and chorus, percussion, Leslie, manual and overdrive switches on every screen, and the SMK-37 gains MIDI out and saving of the sound on the unit, on both FM-1 and SMK-37. The notes say the sound engine is unchanged."
- version: 0.7.1
  date: 2026-11-27
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.7.1
  notes: "Reverses the expression pedal on the SMK-37 so toe down is louder, makes hard pad hits (velocity 120 or more) move a drawbar all the way, and keeps the organ at about 10 percent level when the swell pedal is closed, on FM-1 and SMK-37 alike. The notes cite the first test report from a real SMK-37 Elite, saying the organ runs on the hardware."
- version: "0.7"
  date: 2026-11-26
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.7
  notes: "Adds an experimental build for the SMK-37 (Pro, Elite and MKE-P37), with the pads as drawbars and the faders on the 1' drawbars. The notes say it was tested in an emulator only, and only the Pro package was run; these packages are offered on the release page and not on the installer site. The FM-1 program is byte for byte the same as 0.6.1, the packages are now built and signed by the Firmware Hub's shared workflow, and the web editor pages and equalizer sliders are restyled."
- version: '0.6.1'
  date: 2026-11-22
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.6.1
  notes: "Fixes the drawbar pages, where the dim INFO digits were drawn over a drawbar at 0 to 2 so that 0 looked like 2, makes the sustain pedal (CC 64) toggle the Leslie once per press even with pedals that send in-between values, and makes the web editor's MIDI player send all notes off again after the last queued note so Stop leaves nothing hanging. The sound is unchanged, and settings and programs are kept."
- version: '0.6'
  date: 2026-11-20
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.6
  notes: "Adds an output equalizer with bass, middle and treble bands, on the pedal screen and in the web editor, and recalibrates the overdrive against setBfree, so the drive range is now 0 to 20 and settings and programs 112 to 127 from 0.5.x are converted on the first start. The web editor gets a MIDI file player."
- version: '0.5.1'
  date: 2026-11-17
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.5.1
  notes: "Adds a drawbar logo shown at start-up and as a screen saver, install progress on the FM-1's screen and an install page in the browser that can also return the FM-1 to the official firmware. Fixes footage numbers cut off on the lower and pedal pages and starts with setBfree's drive of 12. The sound is as in 0.5, and saved settings and programs 112 to 127 stay."
- version: '0.5'
  date: 2026-11-16
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.5
  notes: "Adds a web editor that reads and writes the FM-1 over USB, sixteen user programs (112 to 127) stored in their own flash sector, setBfree's overdrive character and extended Leslie speed parameters."
- version: '0.4'
  date: 2026-11-14
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.4
  notes: "Splits the tonewheels across the FM-1's two processor cores, turns the overdrive knob into a drive control, adds a limiter against clipping, reduces Leslie noise and fixes the DIN MIDI input hanging notes after some minutes. The notes say it was tested on both flash chip types, and keep 0.3 as a fallback."
- version: '0.3'
  date: 2026-11-11
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.3
  notes: Adds three manuals (upper, lower and pedal) with their own drawbars on MIDI channels 1 to 3, three screens, a vibrato and chorus selector, a finer reverb scale and the newer UC25HQ80 flash chip, which the release notes say was tried on an FM-1 with that chip. The percussion no longer passes through the vibrato. Saved settings use a new layout, so the first start of 0.3 loads the defaults. 0.2 stays available as a fallback.
- version: '0.2'
  date: 2026-11-05
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.2
  notes: Replaces the soft-clip overdrive with a model of setBfree's preamp, adds a battery indicator, makes the percussion key click closer to setBfree's and lowers the load with many keys held.
- version: '0.1'
  date: 2026-11-05
  url: https://github.com/R-Jeb/setBfree-fm1/releases/tag/v0.1
  notes: First release.
