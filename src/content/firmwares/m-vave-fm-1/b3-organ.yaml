  url: https://raw.githubusercontent.com/R-Jeb/setBfree-fm1/main/docs/screen.png
  alt: "B3 ORGAN v0.1 screen showing nine drawbar rows, vibrato, Leslie, percussion, overdrive and reverb states, and the program 5 Standard B"
  credit: "R-Jeb"
