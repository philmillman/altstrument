device: m-vave-fm-1
name: B3 ORGAN
summary: >-
  Tonewheel organ with 91 wheels, nine drawbars, percussion, scanner vibrato, overdrive, reverb and a Leslie,
  built from setBfree's data tables on the Dinghy base in integer arithmetic.
description: >-
  A fork of Dinghy that replaces its sine synth with an organ engine. Gear ratios, key click, the gain matrix,
  the Leslie tables and all 110 programs of setBfree's default.pgm are generated from setBfree's own data, and
  the README lists measurements against setBfree running on a Raspberry Pi. Drawbars, percussion and effects
  follow setBfree's default MIDI controller numbers over USB and TRS. The repository also has a WebAssembly
  build of the engine to play in a browser and a host mode that writes WAV files. The README says release 0.1
  has been tested on one FM-1. From 0.2 the overdrive follows setBfree's preamp model, and the firmware identifies as FM-1_953. From 0.3 it has three manuals (upper, lower and pedal) on MIDI channels 1 to 3, each with its own drawbars, and accepts the newer UC25HQ80 flash chip.
status: active
authors:
- name: R-Jeb
  url: https://github.com/R-Jeb
source: https://github.com/R-Jeb/setBfree-fm1
source_status: open
license: GPL-3.0-only
