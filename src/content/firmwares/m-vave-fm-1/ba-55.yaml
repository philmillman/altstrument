install_notes: >-
  Download ba55-X.Y.Z.fwsc from the Releases page and install it as any FM-1 firmware. The README describes no recovery path, and the FM-1's ROM boot mode applies. The sound being edited saves itself once the pattern stops, and preset slots save with SAVE.
