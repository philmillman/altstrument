device: m-vave-fm-1
name: BA-55
summary: >-
  Bassline synth after the Erica Synths Bassline DB-01: a 64-step sequencer with accent, slide and probability, a state-variable filter, a bucket-brigade detune, a mod track recorded live and a ten-style beat with sidechain pump.
description: >-
  The voice has a triangle, saw or square wave, a sub-octave square, noise into the filter, a detune blended in through a bucket-brigade line, an overdrive blend and an LFO that can modulate pitch up to audio rate. The filter is a 12 dB state-variable design with low-pass and band-pass modes that self-oscillates, with an envelope for decay and depth and a sustain-release amplifier envelope. The sequencer has 64 steps in four bars, each with a note, gate length, accent, slide, a cutoff offset, a pitch envelope and a probability, plus five play directions, shuffle and tempo. The mod track records live while the pattern runs, notes can be entered from the keys, a random pattern generator works from a scale and root, and an arpeggiator and step copy and paste are included. A GROOVE section taken from MONSUN adds ten drum styles that duck the bassline with a pumping sidechain. It follows MIDI clock, start, stop and continue over USB, and MIDI notes play the voice. There are 16 preset slots, each holding a sound and its pattern. The README says it is unofficial and not connected with Erica Synths, and that it is built on fm1-base and felucca-bsp. Its sound core in dsp/ is plain C.
