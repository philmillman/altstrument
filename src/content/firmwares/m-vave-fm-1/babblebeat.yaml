device: m-vave-fm-1
name: BabbleBeat
summary: >-
  Experimental speech instrument: every key says a phrase built by a sentence grammar that can be mutated and made to remember a word, spoken by a small robotic formant voice.
description: >-
  A white key holds a word from the chosen vocabulary (Machine, Dream, Body or Gothic) and says a phrase about it; the black key beside it says the same word in another kind of phrase, such as a question, a negation or a conditional. A grammar generator with role-tagged words and 18 templates builds the phrases, and the GRAMMAR knob sets how elaborate they are, from bare to nested. WANDER moves a key's word, DAMAGE remakes or breaks phrases, and REC and RECALL bring one remembered noun back in later phrases. The voice is a Klatt-style formant synthesizer driven by hand-written phoneme codes, with knobs for pitch, rate, tone, breath and mouth shape. The vocabulary is small and fixed, and there is no user text input, saved patches or MIDI in the app. The repository holds it as instruments/babblebeat, beside STRATA and PALINDROME, with its own version file and a babblebeat- release tag prefix; releases are marked as pre-releases. The release notes call it experimental with hardware validation pending, and the documentation says it has not run on a real FM-1.
