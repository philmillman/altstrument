device: m-vave-fm-1
name: BAILE Tracker
summary: >-
  Six-track funk tracker for the FM-1 forked from KAWA, with a Portuguese, English or Spanish screen, painted-tile themes, funk kits, breaks and live effects, and a macaw mascot.
description: >-
  A separate project from the catalogued BAILE by arrastao, which shares the name. This one is a tracker aimed at Brazilian funk:
  each row is a step and each column a track, with six tracks that use pulse, 4-bit wave, noise, six-operator FM, drum kit or sliced
  sample engines, up to two effects per cell, tables, per-step groove, 64 live effects in four banks, an eleven-type filter and a song
  chain of patterns of 16, 32 or 64 steps. It inherits the whole engine from KAWA and adds the identity, three themes, the Portuguese
  interface, a mascot and boot mosaic, a hub page, a manual and a browser emulator page. The README still says the kits, breaks and grooves
  of funk come in later phases (PLAN.md), but commits on 2026-11-18 add eight funk kits (VOLT, TAMBOR, 150, MANDELA, BREGA and others), six funk breaks, groove presets, a BEAT FUNK tool, funk sounds and two banks of live effects. A test log in docs records one install of the 0.1 package on a real FM-1 from another community firmware, ending with the FM-1 running the new package. On 2026-11-21 the log records 0.2 installed over 0.1 and the on-device checklist passing. It was created on 2026-11-18.
status: active
authors:
- name: saulofilho
  url: https://github.com/saulofilho
source: https://github.com/saulofilho/baile-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the LICENSE file give GPL-3.0-only, kept from KAWA. msfa is Apache-2.0 and the fonts are SIL OFL 1.1; JieLi SDK files
  are read from the user's own checkout at build time. The committed baile-0.2.fwsc (610,280 bytes) and the older baile-0.1.fwsc are builds of this project, not stock images.
homepage: https://saulofilho.github.io/baile-fm1/
based_on: m-vave-fm-1/kawa
distribution: browser-installer
install_notes: >-
  Install from the hub page in Chrome, Edge or Opera over USB, or run the INSTALL launcher for Windows, macOS or Linux (Python 3), which
  installs install/baile-0.2.fwsc (0.1 is kept in install/older). The package is checked before anything is erased and an interrupted install resumes. The README
  says BAILE projects are lost when going back, which needs M-VAVE's M-UPGRADE with V15, and that holding OCT- at power-on opens the USB rescue. The test log records BAILE 0.1 installed on hardware and 0.2 installed over 0.1, with the on-device checklist passing.
brick_risk: false
tags: [tracker, sequencer, chiptune, drums, synth-engine, fx, emulator, fork]
