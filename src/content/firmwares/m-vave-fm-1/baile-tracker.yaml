  are read from the user's own checkout at build time. The committed baile-0.1.fwsc is a build of this project (package FM-1_971, 610,280 bytes), not a stock image.
homepage: https://saulofilho.github.io/baile-fm1/
based_on: m-vave-fm-1/kawa
distribution: browser-installer
install_notes: >-
  Install from the hub page in Chrome, Edge or Opera over USB, or run the INSTALL launcher for Windows, macOS or Linux (Python 3), which
  installs install/baile-0.1.fwsc. The package is checked before anything is erased and an interrupted install resumes. The README
  says BAILE projects are lost when going back, which needs M-VAVE's M-UPGRADE with V15, and that holding OCT- at power-on opens the USB rescue. The test log records one install on hardware; other checks are still to do.
brick_risk: false
