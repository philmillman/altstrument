device: m-vave-fm-1
name: BAILE Tracker
summary: >-
  Six-track funk tracker for the FM-1 forked from KAWA, with a Portuguese, English or Spanish screen, painted-tile themes and a macaw mascot. Version 0.1 adds eight funk kits, six breaks, groove presets and funk live effects to KAWA's engine.
description: >-
  A separate project from the catalogued BAILE by arrastao, which shares the name. This one is a tracker aimed at Brazilian funk:
  each row is a step and each column a track, with six tracks that use pulse, 4-bit wave, noise, six-operator FM, drum kit or sliced
  sample engines, up to two effects per cell, tables, per-step groove, 64 live effects in four banks, an eleven-type filter and a song
  chain of patterns of 16, 32 or 64 steps. It inherits the whole engine from KAWA and adds the identity, three themes, the Portuguese
  interface, a mascot and boot mosaic, a hub page, a manual and a browser emulator page. The README still says the kits, breaks and grooves
  of funk come in later phases (PLAN.md), but commits on 2026-11-18 add eight funk kits (VOLT, TAMBOR, 150, MANDELA, BREGA and others), six funk breaks, groove presets, a BEAT FUNK tool, funk sounds and two banks of live effects. A test log in docs records one install of the 0.1 package on a real FM-1 from another community firmware, ending with the FM-1 running the new package; the on-device checks of sound, saving and rescue are marked as still to do. It was created on 2026-11-18.
