device: m-vave-fm-1
name: Banquise
summary: >-
  Musical walking game in which a drone, wind and footsteps make the music and places on an ice field wake the synth; the FM-1
  port, built on fm1-base, has only the first stage so far.
description: >-
  The game is also a browser page, in English and French. You walk an ice field from an igloo, and the wind, a drone and
  footsteps become the music, while fishing holes, a boat, an ice cave, a pine forest, a lighthouse and singing seals each
  change the synth. The FM-1 firmware is being ported in three steps. Step one, the walk with day and night, the igloo synth,
  the ice rink and the river, is done and redrawn for the FM-1's small screen. The playable places, the quest and the outfits
  are still to come. A WebAssembly build of the firmware code runs in the browser. The README says the build has not been tried
  on a real FM-1. The author credits Claude as a collaborator, and the project belongs to the same OSR-1 effort as Blop.
