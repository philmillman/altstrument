device: m-vave-fm-1
name: BARLINE
summary: >-
  Five-track clip sketchpad for techno that sends its projects to Ableton Live: whole-bar clips in eight scenes, with
  each track's sound described by the parameters of a Live device.
description: >-
  The tracks are a 16-pad kit, bass, lead, pads and pluck, each on its own MIDI channel, and in Live the kit splits into
  kick, snare, hats, ride and perc. Clips are one, two, four, eight or sixteen bars, launch on the next bar and keep
  notes at 96 PPQN, with repeated bars stored once. Melodic tracks have step recording with rests, ties, accents and
  slides, and live recording; eight projects and an automatic Restore Last are kept on the FM-1. Version 0.2 gave each
  sound the parameters of a Live device (Simpler, Drift, and kit pads as Simplers), and a companion web page reads .als
  sets and .adg racks and sends them to the FM-1. The same page pulls a project over MIDI and saves each clip or scene as
  .mid files and a .barline backup. A Live Set export is listed as a later step. It is built with the foma framework and
  ships a browser emulator and installer.
