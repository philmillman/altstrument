homepage: https://sunjaculley.github.io/barline-fm1/
based_on: m-vave-fm-1/foma
distribution: browser-installer
install_notes: >-
  Open the project page in Chrome or Edge with the FM-1 on USB and install from it, or build with Docker (./fm1 build).
  Projects are kept in the flash area where Felucca keeps its projects and samples, so installing overwrites anything
  Felucca saved there; the README says to back that up with Felucca's web editor first and to take a full flash backup
  with M-Flasher before the first install.
