device: m-vave-fm-1
name: BASSLINE
summary: >-
  Bass line writer with ten generated basses, glide, four drives and a 1 to 8 bar loop, which follows a chord progression
  or suggests chords that fit what was played.
description: >-
  Built on CHORDS and through it FoMni and the Felucca platform, with a new instrument and interface. The basses are
  808, plucked-string models, acid, sub and Reese, with no samples. Loops are recorded live or entered by step, and a
  bass arpeggiator or Fill writes notes from the progression. Snap can pull wrong notes into the scale or chord, and
  Suggest ranks chords for each bar of a played line.
