device: m-vave-fm-1
name: Baud Girl FM-1+VA
summary: >-
  Closed-source firmware that keeps M-VAVE's FM engine, fixes its bugs, and adds a virtual-analogue engine,
  an 8-bit engine, a Bitcrush effect, 64-step sequencer and per-screen knob banks.
description: >-
  Patterns up to 64 steps (stock stops at 16) with per-step ratchet, chance, gate and length, pattern
  chaining into songs, four knobs on every screen, and Bluetooth MIDI clock between two FM-1s (from version
  97). Presets and patterns are kept across installs, and the installer can restore M-VAVE's firmware.
  Distributed free from the author's page; a Ko-fi tip jar is linked.
status: active
authors:
- name: Baud Girl
  url: https://baudgirl.com/
source_status: closed
license: proprietary
homepage: https://baudgirl.com/work/FM-1+VA
distribution: browser-installer
install_notes: >-
  Install page works in Chrome or Edge (not Firefox or Safari) over USB and takes under a minute. Two
  free preset packs (8-Bit, Virtual Analog) overwrite presets 97-128, so back up first. The same author
  ships SMK-37+VA for the SMK-37.
brick_risk: false
