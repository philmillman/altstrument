source_status: open
license: GPL-3.0-only
license_notes: >-
  The archive's README states GPL-3.0-only for the original instrument code, and firmware/LICENSE and the browser
  player's LICENSE.txt are the GPL v3 text. The FM-1 platform layer is imported from Felucca under GPL-3.0-only, with
  Apache-2.0 files alongside. The fiddle timbre is adapted from the CC0 VSCO2 CE solo violin, and the acid phrases are
  credited to J. McConaghy / Acid-Tabs.com under CC BY-SA 4.0. The record calls, steel clip, character art, font and
  music editions are outside the GPL; see the rights warning above. The archive holds the code and build inputs and
  needs the JieLi PI32r3 toolchain and AC79 SDK to build.
homepage: https://thebigbeat.app/bb-bob/about/
distribution: browser-installer
install_notes: >-
  The assisted installer at thebigbeat.app/bb-bob/install/ runs in desktop Chrome or Edge on Windows, macOS or Linux
  and installs the application, sounds and artwork over the current firmware. Before writing it asks you to prove a
  chip-ROM recovery route on the unit: with the FM-1 in ROM boot (USB 4C4A:8057), save a full backup with M-Flasher 0.9.3
  and give the installer its JSON receipt, then load fm1-stage-ram.bin from the m-bootloader v2.2 release into RAM with
  M-Flasher. The installer stops if it finds existing data that BB-BOB would erase, can restore a saved backup, and
  repeats the backup for a verify pass after the restart. The author reports install and restore passing against
  simulated factory V15, factory V16 and Compás units, with physical FM-1 verification still to do, and the identity
  file in the source archive still marks the build as not hardware accepted. The Mac kit in the archive, which needed
  BB1 2.0 with sound library 1.4, is now described as a historical test workflow. Without a proven ROM route, the author
  points to the browser player instead.
