source: https://thebigbeat.app/bb-bob/downloads/BB-BOB-50-Source.zip
source_status: open
license: GPL-3.0-only
license_notes: >-
  The archive's README states GPL-3.0-only for the original instrument code, and firmware/LICENSE and the browser
  player's LICENSE.txt are the GPL v3 text. The FM-1 platform layer is imported from Felucca under GPL-3.0-only, with
  Apache-2.0 files alongside. The fiddle timbre is adapted from the CC0 VSCO2 CE solo violin, and the acid phrases are
  credited to J. McConaghy / Acid-Tabs.com under CC BY-SA 4.0. The record calls, steel clip, character art, font and
  music editions are outside the GPL; see the rights warning above. The archive holds the code and build inputs and
  needs the JieLi PI32r3 toolchain and AC79 SDK to build.
homepage: https://thebigbeat.app/bb-bob/about/
distribution: download
requires_stock: BB1 2.0 with BB1 sound library 1.4
install_notes: >-
  The Mac installer on the about page needs macOS and Python 3.12. It checks the package hashes, then checks that the
  FM-1 runs the exact BB1 2.0 application and sound library 1.4 before writing, so an FM-1 on BB1 2.1 must go back to 2.0
  first. It reads the starting firmware, user data, library and art back twice into a local folder, installs the BB-BOB
  application with its timbre and artwork banks and verifies them. Keep USB and Terminal open for the whole session;
  pressing Return in Terminal restores the saved banks and BB1 2.0 and checks them against the backup. The identity
  file in the source archive still marks the build as not hardware accepted.
brick_risk: true
