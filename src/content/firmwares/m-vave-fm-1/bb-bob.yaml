device: m-vave-fm-1
name: Big Beat Studio BB-BOB
summary: >-
  Western swing band instrument from the BB1 author with 50 classic arrangements, generated new tunes, live band cues and
  a Then to Now control that brings in electric guitar, acid bass and electronic drums.
description: >-
  Rights warning: the FM-1 application compiles in 103 short spoken calls in Bob Wills's voice and a two-bar steel
  guitar clip. The first source archive's call index named the discs, tracks and timings of the commercial Bob Wills box
  set the calls were cut from, and the browser player described the clip as an estimate from Steel Guitar Rag. The
  GitHub repository's call index lists the calls only by ID and family, and its clip header calls the steel part a
  source-derived estimate with separate rights; the audio itself is committed as C headers. The 50 classics are written
  melody heads of published songs such as San Antonio Rose and Faded Love, and the steel solos are transcriptions. The
  README and LICENSING.md say the character art, historical recordings, font and music editions carry separate rights
  and leave the private collection and media masters out; nothing in the repository or on the site shows a licence from
  the rights holders.

  BB-BOB grew out of the BB1 base code but installs and runs without BB1. A band of fiddle, steel guitar, archtop rhythm
  guitar, piano, upright bass and light drums plays one of the classics or a New Tune, for which it generates the
  melody, changes and form. HOME opens Conduct, with pads for fills, stop-time breaks, a steel feature, a return to the
  theme and the ending; SEQ plays an instrument from the keys, EDIT opens the Song Book and GLO puts the calls on pads.
  Turning from Then towards Now swaps in electric guitar, sliding acid bass, synth chords and harder drums. The acid
  phrases come from the same Acid-Tabs set as BB1's Dillo. The project site also runs the same C engine in a browser
  player that works without an FM-1 and adds a Concert mode.

status: active
authors:
- name: TexasRADIO
  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/bb-bob-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only for the original instrument code, and LICENSE is the GPL v3 text. The
  FM-1 platform layer in vendor/fm1/ is imported from Felucca under its GPL notices, with Apache-2.0 files alongside. The fiddle timbre is adapted from the CC0 VSCO2 CE solo violin, and the acid phrases are
  credited to J. McConaghy / Acid-Tabs.com under CC BY-SA 4.0. The record calls, steel clip, character art, font and
  music editions are outside the GPL; see the rights warning above. The repository holds the source, the generated build
  inputs and the released packages and loader, and needs the JieLi PI32r3 toolchain and AC79 SDK to build. The
  README says a clean build reproduces the released application and loader byte for byte. No M-VAVE stock image is
  bundled.
homepage: https://thebigbeat.app/bb-bob/about/
distribution: browser-installer
install_notes: >-
  The assisted installer at thebigbeat.app/bb-bob/install/ runs in desktop Chrome or Edge, installs the firmware, sounds
  and artwork together, and keeps a backup to restore your previous firmware; the page says it stages a small helper in the
  FM-1's update area before taking the backup, so the backup lacks that area's earlier contents. The R34 release also
  carries a single Hub-compatible .fwsc, which the README says installs the application and its sound and art banks in one
  package without BB1. The README reports the package installed on a physical FM-1, booted, returned to official V15 and
  installed again from V15. Earlier installer versions asked for a chip-ROM recovery route first (a full M-Flasher backup
  and a RAM-loaded stage file); the current page does not mention it. The installer may replace existing sounds, artwork
  and saved sequences.
brick_risk: false
