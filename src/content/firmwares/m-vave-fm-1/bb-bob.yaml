device: m-vave-fm-1
name: Big Beat Studio BB-BOB
summary: >-
  Western swing band instrument from the BB1 author with 50 classic arrangements, generated new tunes, live band cues and
  a Then to Now control that brings in electric guitar, acid bass and electronic drums.
description: >-
  Rights warning: the FM-1 application compiles in 103 short spoken calls cut from a commercial Bob Wills box set (the
  source archive's call index names the discs, tracks and timings) and a two-bar steel guitar clip that the browser
  player describes as an estimate from Steel Guitar Rag. The 50 classics are written melody heads of published songs
  such as San Antonio Rose and Faded Love, and the steel solos are transcriptions. The archive's README says the
  character art, historical recordings, font and music editions carry separate rights and leaves the private collection
  and media masters out; nothing in the archive or on the site shows a licence from the rights holders.

  BB-BOB is built on the BB1 base. A band of fiddle, steel guitar, archtop rhythm guitar, piano, upright bass and light
  drums plays one of the classics or a New Tune, for which it generates the melody, changes and form. HOME opens Conduct,
  with pads for fills, stop-time breaks, a steel feature, a return to the theme and the ending; SEQ plays an instrument
  from the keys, EDIT opens the Song Book and GLO puts the calls on pads. Turning from Then towards Now swaps in electric
  guitar, sliding acid bass, synth chords and harder drums. The acid phrases come from the same Acid-Tabs set as BB1's
  Dillo. The project site also runs the same C engine in a browser player.

status: active
authors:
