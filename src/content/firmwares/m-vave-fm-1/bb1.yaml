device: m-vave-fm-1
name: Big Beat Studio BB1
summary: >-
  Felucca-based rhythm firmware with two independent drum machines, Dillo acid bass, echo and spring reverb; version 2.1 adds a Rhythm Conductor mode and a redesigned interface, 2.0 a song arranger and a kit builder.
description: >-
  Rights warning: the sound library and pattern data come from commercial drum machines. The sampled LinnDrum,
  DrumTraks, DMX, LM-1, Simmons, Rhythm King and Drumulator kits live in a separate sound library, and the
  repository's catalogue holds the factory presets of four Roland rhythm boxes and drum patterns in the style of
  existing records. BIG-BEAT-LICENSING.md covers the LinnDrum, DrumTraks and DMX samples and the pattern data with a
  quoted statement from "the project owner" and says that statement does not establish the original sources or
  third-party provenance. It does not specify terms for the four machines added in 1.2. The 1.5 addendum credits
  Acid-Tabs.com phrases to J. McConaghy under CC BY-SA 4.0 and records that the reported Acid Voice licence terms
  are still to be filed in the intake.

  Big Beat Studio BB1 runs two drum layers at once, each with its own kit, pattern and level, plus Dillo, a monophonic acid bass
  synth with nine presets. Shared effects include three-head tape echo and spring reverb. The catalogue has 539
  rhythm sections: 233 song sections from 67 songs, 168 sections across 21 eras and 138 classic Roland rhythms.
  Dillo adds 205 ACID phrases in 27 banks. The 808 is synthesised; the seven sampled machines use a separate library.

  Version 2.0 adds a named song arranger, ratchet editing, reversible Evolve, swung recording, BUILD screens for
  user kits and 31 additional drum kits. A browser emulator and guide are available. One audio deadline overrun
  and DMA miss were recorded in hardware testing; the owner released 2.0 with this known issue for investigation
  in a minor update. Formal whole-stack qualification remains open. See the release notes for the measured scope.

  Version 2.1 reworks the interface around three instruments, Rhythm Conductor, Big Beat and Dillo, selected with
  SELECT. Rhythm Conductor plays Kit A, Kit B and Dillo together, with the whole arrangement cued at once or one
  player focused. It also adds full-screen song, era and preset lists, preset combining and context help on HOME.
  SLOOP is removed to make room, and projects that depended on it are not supported. The 2.1 notes report a
  20-second hardware run with no faults or deadline overruns. Version 2.1.1 only renames ambiguous section labels.

status: active
authors:
- name: TexasRADIO
  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/bb1-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL v3 text. LICENSING.md, inherited from Felucca, states GPL-3.0-only, and BIG-BEAT-LICENSING.md says
  the same for the Big Beat code, with the 9W9 TR-909 voices ported under their own GPL-3.0 text. The CC0 instrument
  samples, DaisySP, Rings and msfa parts keep their own licences, and three JieLi SDK files inside each package are
  Apache-2.0. The sampled drum kits and pattern data are not under the GPL; see the rights warning above. The release
  also carries the sound library as a separate file (bb1-sounds-1.4.bin with 2.0, bb1-sounds-2.1.bin with 2.1). ACID phrases carry the additional attribution and
  adaptation statements in BIG-BEAT-LICENSING.md; the new phrase count is not a claim of original authorship.
homepage: https://thebigbeat.app/fm1/
distribution: browser-installer
requires_stock: Corrected-ID BB1 1.5 or BB1 2.0 for the browser installer
install_notes: >-
  Use the project's browser installer and follow its supported-browser and starting-firmware checks. Install the
  application with the sound library of the same release (1.4 for 2.0, 2.1 for 2.1); the 2.1 notes warn against
  mixing the 2.1 application with an older library, and do not treat the application package alone as the complete
  installation. Back up before switching firmware. The attended return to corrected BB1 1.5 was verified by
  restoring the original 1.2 sound library, installing 1.5 through the normal updater and comparing all four flash
  regions twice; saved data and region B were unchanged. This does not establish universal data preservation or
  stock-firmware return. The source, downloads and limitations are on the public release pages; the 2.1 notes name 2.0 as the rollback release.

brick_risk: true
