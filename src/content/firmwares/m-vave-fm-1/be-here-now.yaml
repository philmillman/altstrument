based_on: m-vave-fm-1/foma
distribution: browser-installer
install_notes: >-
  Open the project page in Chrome or Edge with the FM-1 on a USB data cable and use its Install tab; the page also has
  a Rescue tab. Holding OCT- while switching on gives the USB rescue, from which you install again, a firmware built
  here that crashes twice at start goes there by itself, and the page can install M-VAVE's official firmware again. The
  page says installing is at your own risk. The package identity in firmware.json, FM-1_86, is a placeholder.
