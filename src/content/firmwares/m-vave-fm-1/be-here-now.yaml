device: m-vave-fm-1
name: BE HERE NOW
summary: >-
  Sarod-inspired string instrument with a tanpura drone and sympathetic strings, plus a browser Coach that teaches
  improvising in Western and Indian music alongside the FM-1.
description: >-
  Sarod mode plays one string, with a key pressed while another is held sliding (meend) instead of plucking again;
  chord mode gives four strings and names the chord on screen. The sound is Karplus-Strong strings feeding eleven
  sympathetic strings tuned to the chosen thaat, which ring only when a played note or harmonic matches. PRESETS picks
  the thaat, ALGORITHM the home note, PLAY the tanpura drone, and REC plays the scale up and down while the keys
  light. The Coach page runs in Chrome next to the FM-1 over USB MIDI, or listens to a guitar or piano through the
  computer's microphone, with lessons, a jam room and a dictionary, and it shows the answer only when you ask for a
  hint. From version 1.1 the Coach's backing beat and chords play on the FM-1 itself. It is built with the foma
  framework and ships a browser emulator and installer.
