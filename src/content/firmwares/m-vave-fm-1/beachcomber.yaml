license: GPL-3.0-only
license_notes: >-
  The README and LICENSE give GPL-3.0-only, with upstream notices retained in LICENSING.md. The Terminus and IBM Plex Mono fonts are SIL OFL 1.1. The JieLi AC79 SDK files are read from the builder's own checkout at build time and are not in the repository.
homepage: https://github.com/jaak-stjaaques/Beachcomber
based_on: m-vave-fm-1/dinghy
distribution: source-only
install_notes: >-
  Build with sh build.sh (JieLi toolchain and AC79 SDK, a Linux container on macOS), then install build/beachcomber_0.2.8.fwsc with M-Flasher, leaving the bootloader option unchecked, or with tools/fm1_install.py over USB. docs/BUILDING.md says to make a full recovery backup first and check that the recovery tool can open it, and that holding OCT- at power-on enters the USB rescue mode. Installation on a physical FM-1 is unverified.
brick_risk: false
