device: m-vave-fm-1
name: BEACHCOMBER
summary: >-
  Random arpeggiator and four-track looper for the FM-1: a Turing-Machine-style loop of sixteen dice feeds four Karplus-Strong tracks, with 43 scales, delay, hall and chorus.
description: >-
  The ARP is a loop of sixteen random choices that can be locked, left to drift or thrown again, with controls for how often it changes, its length, range and density, and the white keys choose which notes it may use. REC keeps what the arpeggiator plays on one of four tracks of up to 16 steps, each with its own length and speed, PUNCH IN replaces part of a track, and a track can be shifted up or down the scale. The scale is applied last, so a new scale or key changes the recordings straight away. There are 43 scales, and a random one is picked at power-on. The sound comes from four ringing engines (pluck, blow, hit and tube) that are excited by noise, waves or a chord, with delay, hall and chorus in parallel, an envelope and an LFO per track, a mixer, and MIDI in and out with clock. Nothing is saved between sessions. The sound engine, delay and hall come from the same author's LOOPHEADS, and the project is built on Dinghy. The README says version 0.2.8 passed the host tests and simulated installer checks and plays in the online FM-1 emulator, but has not been installed on a physical FM-1.
status: active
