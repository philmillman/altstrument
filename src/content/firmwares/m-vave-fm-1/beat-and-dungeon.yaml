device: m-vave-fm-1
name: Beat & Dungeon
summary: >-
  Skiff 2.7.1 fork that turns the FM-1 into a dungeon game: each room opens a track, a D20 sets the rule for composing it, and curses and creatures edit tracks you already made.
description: >-
  The unit starts in a dungeon with no tracks. A dungeon has four or six rooms, and each room opens one track of Skiff's six-track groovebox. At each door the player picks the track's role and throws a D20 on the keys. The result is a composing rule such as one take, no note on the beats or two kits mixed, and the firmware cannot check that rule. Cursed rooms make permanent edits to an earlier track (delay, reversal, transposition, dropped notes), creatures add an effect to the new track, and since 1.1 a rare calm room lets one earlier track be reworked and its curse undone. The preparation page sets the number of rooms, difficulty, encounters, tempo and whether the dungeon picks the sounds. The same dungeon code gives the same dice. HOME switches between the dungeon and Skiff's normal music pages. The game's rules and texts are copied from the author's separate Beat & Dungeon project, which also exists as an MPC plugin and a web game. The README says the merchant, objects, special rooms and quests of the full game are not included and the dungeon itself is not kept over a power-off, while the tracks are.
status: active
