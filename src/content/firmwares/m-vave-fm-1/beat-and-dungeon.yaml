license: GPL-3.0-only
license_notes: >-
  LICENSE is GPL-3.0 and the README says GPL-3.0-only, with Skiff's credits and licences kept. The game data copied from the author's game repository is MIT, the fonts are SIL OFL 1.1, and the instrument samples are CC0 (VSCO-2 Community Edition and VCSL); the texts are in LICENSES/.
homepage: https://beatanddungeonfm1.gonz-music.fr/
based_on: m-vave-fm-1/skiff
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB, or install the release .fwsc with tools/fm1_install.py. The README says to back up first and to download M-VAVE's official FM-1.fwsc as the way back. The installer page has a return-to-official-firmware option, and M-UPGRADE also restores stock. If M-Flasher's m-bootloader is on the unit, put the stock bootloader back first. The package identity stays the same between versions, so a new version installs over the old one.
brick_risk: false
