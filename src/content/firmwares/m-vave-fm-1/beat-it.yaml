  date: 2026-11-10
  url: https://github.com/epidex/beat-it/releases/tag/v1.4
  notes: Adds a SysEx BT STATUS query and a Linux Bluetooth test script.
- version: '1.3'
  date: 2026-11-10
  url: https://github.com/epidex/beat-it/releases/tag/v1.3
  notes: Sends the clock over Bluetooth, ends held notes when Bluetooth sending is turned off and fixes the missing CLOCK IN Bluetooth choice.
- version: '1.2'
  date: 2026-11-09
  url: https://github.com/epidex/beat-it/releases/tag/v1.2
  notes: Follows a Bluetooth MIDI clock.
