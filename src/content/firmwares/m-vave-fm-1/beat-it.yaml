device: m-vave-fm-1
name: Beat It
summary: >-
  Bluetooth MIDI firmware with clock in and out, a full-screen scope and a purple-and-black theme; built on SLOOP through 1.5 and on Melodee from 2.0.
description: >-
  Versions 1.0 to 1.5 are built on SLOOP, keeping its drums and two FM engines, with the Bluetooth stack and radio driver taken from Optimist's open-source code, and a backup of the
  unit's radio calibration. From 1.1 it sends and receives notes over Bluetooth MIDI; 1.2 follows a Bluetooth clock, 1.3 sends
  the clock over Bluetooth, USB or both and ends held notes when sending is switched off, 1.4 adds a SysEx status
  query for connected apps plus a Linux test script that steps through the Bluetooth checks and writes a log, and 1.5 keeps
  both processor cores running with Bluetooth on, where earlier versions stopped the second core until restart. Bluetooth is
  off at every power-on. From 2.0 the firmware is a fork of Melodee 1.6.1 instead, keeping Melodee's Bluetooth MIDI and second-core code and adding the Beat It name, five saved brightness levels and a full-screen pitch-coloured oscilloscope. Up to 1.5 the README is SLOOP's own, with
  a short Beat It file and install guide beside it. Both state that it has not run on a real FM-1 and that Bluetooth has never
  been tried over a real radio.
status: active
authors:
- name: epidex
  url: https://github.com/epidex
source: https://github.com/epidex/beat-it
source_status: open
license: GPL-3.0-only
license_notes: >-
  BEAT-IT.md and the SLOOP README state GPL-3.0-only; LICENSING.md is Felucca's, with Felucca's separately licensed assets
  excluded. The Bluetooth radio tables carry Apache-2.0. The docs/firmware folder holds a build of SLOOP 2.8.5 rather than
  a stock image; the repository has no M-VAVE image.
based_on: m-vave-fm-1/melodee
distribution: browser-installer
install_notes: >-
  Open Beat-It-X.Y-installer.html from the release in Chrome or Edge on a computer with the FM-1 on USB, or install the .fwsc
  with SLOOP's fm1_install.py or the Firmware Hub. Back up projects first; Beat It cannot open projects from the official
  firmware. Holding OCT- while switching on starts the USB rescue, and the guide lists M-UPGRADE and the Firmware Hub for
  going back to stock. The guide warns that earlier installs may have erased the radio calibration, which cannot be restored.
brick_risk: false
tags: [groovebox, drums, fm, ble-midi, midi, sequencer, fork]
versions:
- version: '2.0'
  date: 2026-11-17
  url: https://github.com/epidex/beat-it/releases/tag/v2.0
  notes: "A fork of Melodee 1.6.1 renamed Beat It 2.0, with the Bluetooth name BEAT IT XXXX, a purple-on-black theme, five saved brightness levels and a full-screen pitch-coloured oscilloscope, keeping Melodee's Bluetooth MIDI and second-core code. The notes say it was tested only in a simulator and has not run on a real FM-1; the installer backs up the FM-1 before writing."
- version: '1.5'
  date: 2026-11-10
  url: https://github.com/epidex/beat-it/releases/tag/v1.5
  notes: Keeps both processor cores running with Bluetooth on, using a start-up order that the project says stops the Bluetooth plus two-core crash. A reset during radio start-up no longer causes a boot loop, and cut-off screen messages fit. The release also offers an optional test installer with raised supply voltages marked as at your own risk. The notes repeat that it has only run in a simulator and nothing has transmitted over a real radio.
- version: '1.4'
  date: 2026-11-10
  url: https://github.com/epidex/beat-it/releases/tag/v1.4
  notes: Adds a SysEx BT STATUS query and a Linux Bluetooth test script.
- version: '1.3'
  date: 2026-11-10
  url: https://github.com/epidex/beat-it/releases/tag/v1.3
  notes: Sends the clock over Bluetooth, ends held notes when Bluetooth sending is turned off and fixes the missing CLOCK IN Bluetooth choice.
- version: '1.2'
  date: 2026-11-09
  url: https://github.com/epidex/beat-it/releases/tag/v1.2
  notes: Follows a Bluetooth MIDI clock.
