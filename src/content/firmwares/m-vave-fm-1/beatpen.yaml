device: m-vave-fm-1
name: BEATPEN
summary: >-
  Stylus-style beat maker after the Stylophone BEAT: 12 drum pads and a bass line, four sound packs, a layered two-bar
  looper with four patterns, a lo-fi stage and a filter on the loop.
description: >-
  The keys play 12 drum pads or a chromatic bass with glide, and the four packs (ROK, TECHNO, HIPHOP, BEATBOX) each
  have a drum kit and a bass voice that can be mixed freely. Hits are recorded in layers into a 32-step loop with
  quantizing, undo and mute, and there are four patterns, a click, transposition, a low-pass and high-pass filter on the
  loop and an adjustable lo-fi stage. The first start holds a hip-hop groove on pattern 1. Every sound is synthesized
  with no samples. The README (in French) calls it independent of Dubreq and M-VAVE. It is built on konsumer's foma
  framework.
