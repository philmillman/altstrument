device: m-vave-fm-1
name: Berlinan
summary: >-
  Generative Berlin School sequencer as FM-1 firmware: a standalone USB MIDI sequencer whose voices repeat and phase on
  loops of unequal length, each sent on its own MIDI channel, matching the Berlinan macOS app note for note.
description: >-
  The FM-1 makes no sound in this firmware; it connects by USB to a MIDI router and plays other synthesizers. Given the same
  template and seed, it produces the same notes and controllers as the Berlinan macOS app, and the repository tests this
  against the unchanged Swift engine. It has seven pages, six save slots, a generative arranger and a delay cheat sheet, and
  runs as MIDI clock master or follows USB or TRS clock. Projects do not move between the Mac app and the FM-1, and harmony
  modes, melody, MIDI echo, Link and capture are left out of this first version. The site is in English and Czech and has an
  installer, a manual and a browser emulator that sends MIDI over Web MIDI. It is built on fm1-base and felucca-bsp and
  ignores other firmwares' saved data.
status: active
authors:
- name: Jiří Píša
  url: https://github.com/jiripisa
source: https://github.com/jiripisa/fm1-berlinan
source_status: open
license: GPL-2.0-or-later
license_notes: >-
  The LICENSE file names Berlinan for macOS and states GPL-2.0-or-later, chosen to match Ableton Link's licence. The
  vendored fm1-base (MPL-2.0) and felucca-bsp keep their own licences.
homepage: https://jiripisa.github.io/fm1-berlinan/
distribution: browser-installer
install_notes: >-
  Install page on the project site in Chrome or Edge over USB, which can also restore M-VAVE's firmware, or install the
  release .fwsc with fm1-base's tools/fm1_install.py. The package identity is FM-1_23XXYYZZ.
brick_risk: false
