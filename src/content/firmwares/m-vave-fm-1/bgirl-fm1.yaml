device: m-vave-fm-1
name: BGIRL FM-1
summary: >-
  Electro edition of Felucca with six full tracks, a sample-fed vocoder, a vocal chop bank, ten original electro sounds and
  an arp-driven dancer page; hardware packages are published as candidates, still in hardware testing.
description: >-
  BGIRL is an independent derivative of Felucca v1.8.1, imported with its history, and not an official Hügelton build. It
  extends the shared eight-voice budget to six tracks, adds a bounded project save format, and ships an electro starting
  arrangement with a sample-fed vocoder on track four, a bundled vocal recording and its chops, ten original factory
  sounds (subs, kick, snare, clap, hats, stab, chord and chirp), and an arp page that steps through twelve dance poses. A
  CIRCUIT colour style is available on the panel. Since v0.0.1 the releases carry a firmware-only FWSC and an optional
  Miami vocal starter bank, which the release notes call a candidate with a physical install and return check still
  pending. The README says the firmware is in hardware testing and that the Pages site is a playable preview. It runs as
  an emulated FM-1 panel in the browser through a GitHub Pages demo, with host and browser tests in CI. Old project formats are not migrated.
status: active
authors:
- name: track-forge
  url: https://github.com/track-forge
source: https://github.com/track-forge/bgirl-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states a GPL-3.0-only combined derivative (LICENSE); Felucca's engines stay MIT and its board support
  package MPL-2.0, with fonts and other assets under their own notices (felucca/LICENSING.md). The graffiti wordmark in
  assets/branding is not covered by the repository licence. The bundled vocal recording is described as authorised for
  public redistribution. No M-VAVE stock image is in the repository.
homepage: https://track-forge.github.io/bgirl-fm1/
based_on: m-vave-fm-1/felucca
distribution: download
install_notes: >-
  Download the release's FWSC and install it with FM-SWITCH, which installs the firmware only; the project's Pages
  installer can also provision the optional Miami vocal bank. The v0.0.2 notes call it a candidate with a physical
  install and return check pending, and the README says the firmware is in hardware testing. The browser preview runs at
  the homepage, and ./build.sh --web builds it locally with Emscripten 6.0.10.
brick_risk: false
tags: [groovebox, sequencer, synth-engine, drums, vocoder, sampler, emulator, fork]
