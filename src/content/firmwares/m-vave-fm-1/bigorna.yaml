  url: https://github.com/nzimas/bigorna/commit/1e2985922de4fefe30e9dcb46a8fc6f495871bdc
  notes: No tagged releases; this is the latest commit. The site's installer reaches build 107. Build 107 adds a set list on the SESSIONS grid, where SHIFT plus black key 1 marks the session under the cursor in yellow or unmarks it, and the marks are written to the last-session sector when the sequencer is stopped. Build 89 adds WRECK, a sound page with fold, ring and ring frequency, and build 90 makes the MIDI FX audible. Build 97 lets a pattern store each track's sends and tempo, build 98 adds a USB audio setting (stereo or six mono tracks) and a pattern-switch setting (at the end of the steps or at once), build 99 adds a screen reader that speaks what the screen shows, and build 100 fixes notes left hanging when a key is let go on a held page and adds a panic key (SHIFT plus black key 5). Build 101 adds step rotation on PRESETS in the step view and an EUCLID mode on black key 5 that spreads a track's steps evenly, and build 102 stops black key 1 from drawing a new phrase while EUCLID is on. Build 103 adds tap tempo on black key 8 of the TEMPO page, and build 104 makes that key blink at the tempo. Build 105 adds SHUFFLER, held with SHIFT and black key 8 on the track's view, which trades the lanes' step events among the lanes at random every 2, 4 or 8 sixteenths without writing anything, and build 106 dims that key on the track's view and lights it while SHUFFLER is on. A commit on 2026-11-13 fixed the site's Backup page, which refused builds numbered 8100 and later as not Bigorna.
