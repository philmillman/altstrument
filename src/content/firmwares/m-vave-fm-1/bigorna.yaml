device: m-vave-fm-1
name: Bigorna
summary: >-
  Six-track groovebox for rhythmic noise, power noise, industrial and IDM, modelled on the Elektron Digitone II: four
  machines (4-OP FM, DRUM, WAVY, HIVE), a 16-step sequencer with parameter locks, a looper and send effects.
description: >-
  Bigorna follows the Digitone II's page layout and parameter ranges, with six tracks that each choose one of four
  machines: four-operator FM, three-operator FM drums, a two-oscillator wavetable voice with phase distortion, and a
  swarm of detuned oscillators. The HOME key draws a new sound from 56 recipes. Twelve voices are shared by the tracks, and
  the chip's second core renders half of them and the send effects. Each track has a 16-step sequencer with trig
  conditions, ratchets, parameter locks, per-track probability and swing, and a generated-phrase option, plus chord and mute modes, a break key that
  rearranges the playing pattern, a looper, 16 patterns and 16 sessions. A DRUM track can also hold subtracks ST-A to ST-D, each with its own
  sound and steps, drawn from three subtracks shared across the tracks. Chorus, delay, reverb and a sidechain
  compressor are available as sends. The firmware is built on Tonitor, which is built on Felucca and SLOOP, and
  takes its dual-core start from Melodee. The author states that no Elektron code or data is in it.
status: active
