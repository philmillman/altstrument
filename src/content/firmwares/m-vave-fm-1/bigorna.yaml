homepage: https://nzimas.github.io/bigorna/
distribution: browser-installer
install_notes: >-
  Browser installer in desktop Chrome, Edge or Opera over USB, or ./install.sh from the source on macOS or Linux;
  switch the FM-1 off and on once afterwards. Holding OCT- while switching on enters a rescue screen from which the
  installer can run again, and two failed starts in a row enter it too. If the FM-1 stops answering over USB, holding
  OCT- and OCT+ for five seconds enters the chip's update mode, and the README points to Melodee's recovery tool.
  The README warns that an interrupted update can leave the FM-1 unable to start until it is recovered.
brick_risk: false
