device: m-vave-fm-1
name: BIOFORGE
summary: >-
  Biomechanical rhythm machine and synth with drums made of pressure, fracture, friction and vents through resonant bodies, nine organs, a Turing-register sequencer and delay, reverb and crush effects.
description: >-
  Nine organs share six channels: four drum organs (HEART, BONE, TEETH, CLAW), BASS, DRONE, SPASM, VOICE and NOISE, all synthesised in integer arithmetic without samples. Each drum hit is built from an
  impulse, fracture clicks, noise and a puff of air through damped resonators. The keys write straight into the pattern memory with live, step and parameter recording, overdub, replace and undo, and a 16-bit shift register
  on the ALGORITHM knob locks the texture and rhythm in place or lets it slowly change. There are four scenes saved in flash, and the effects are BLOOD DELAY, BILE REVERB with a freeze and MARROW CRUSH. The project page plays
  the firmware in the browser and has seven scripted demos and an installer. It is a Dinghy 0.5 app from the author of FM1 Clock and ORBITRIX, and the repository also makes SMK-37 packages. The README says version 0.1 has been
  tested on a computer, in the browser and in the fm1-emu emulator in CI, and not yet on a real FM-1.
