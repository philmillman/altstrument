install_notes: >-
  Use the installer on the project page (Chrome or Edge over USB), which offers the latest build of main that passed its tests, or install build/bioforge.fwsc with tools/fm1_install.py, which asks before it writes.
  Holding OCT- while switching on reaches the USB rescue, where an installer always works.
