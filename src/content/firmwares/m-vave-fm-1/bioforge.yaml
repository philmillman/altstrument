  notes: No tagged releases; this is the latest commit. Since the previous row, 19 commits add a noise core that makes rhythm from noise and organic crackle, a deep kick, a drone-led set of heavier sounds, a darker reverb with ducking, four scenes that are four different worlds with their own key and scale, a chord arpeggiator, and a project page restyled to match the firmware. The README calls it an early alpha not yet tried on a real FM-1 and says a new version can forget what an older one saved.
