device: m-vave-fm-1
name: Bliss Box
summary: >-
  Prototype ambient firmware for the FM-1 styled on 1980s new age cassettes: a self-playing Grove of pads and bells, seeded stings, nine solo voices and a cassette effect that can be worn down.
description: >-
  The Grove piece runs for five to thirty minutes or without end and moves through six named seasons. A sting is a
  seeded cue of 3, 5, 10 or 30 seconds that is the same for the same seed. Solo voices (Rhodes, CP-80, flute, harp,
  zither, bells, strings, choir and glass) can be played over the bed in one of seven keys named after the chakras,
  with four modes, just intonation and an A=432 option. A cassette model on the master bus adds wow, flutter, hiss and
  dropouts that increase with a wear setting, and a TALK dip makes room for a voice. The commits say the engine
  was tuned to fit the FM-1's processor budget, and a note in the README says it has run only in the host simulator
  and the fm1-emu emulator, not on hardware. The repository has no releases and no prebuilt package, so it
  has to be built. Commit messages credit Claude as co-author.
status: active
authors:
