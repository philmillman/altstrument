distribution: source-only
install_notes: >-
  Build with tools/fw.sh, which needs the JieLi toolchain (through Docker on macOS), then install the resulting
  blissbox.fwsc with a FM-1 installer. The author says it has not been run on a real FM-1, so treat flashing as
  experimental.
