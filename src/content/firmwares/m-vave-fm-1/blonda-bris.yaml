device: m-vave-fm-1
name: BLONDA BRIS
summary: >-
  Six-voice analog-style polysynth module for fm1-dock, modelled on GS Music's Bree6, with 90 sounds, a lo-fi and
  tape wear control and a browser emulator. Built by CI as a .dock file.
description: >-
  A module for the dock firmware, not a firmware of its own: fm1-dock is installed once and the .dock file is dropped on
  its web console. BRIS has an oscillator with sub, a four-pole ladder filter, two ADSRs, an LFO, an ensemble and an
  echo, rewritten for the FM-1's single-precision chip from the author's desktop engine blonda-motor and checked
  against it in the repository's tests. The Algorithm knob selects an ERA, with clean at zero, tape wear from 1 to 60 and
  lo-fi with fewer bits and a lower sample rate from 61, using a tape effect shared across modules. The tests report
  the CPU load of a six-note chord on an emulated FM-1 in fm1-dock, and the second core takes voices 3 to 5 when fm1-dock
  lends it. The repository holds a second module, PULS, a drum machine with 16-step sequences, and the README and docs are in Swedish. No hardware test is
  mentioned.
status: active
