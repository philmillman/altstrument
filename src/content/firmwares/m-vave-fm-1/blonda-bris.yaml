license: GPL-3.0-only
license_notes: >-
  The root LICENSE is the GPL-3.0 text, and the README and module files state GPL-3.0-only, as fm1-dock and Felucca.
distribution: source-only
install_notes: >-
  Needs fm1-dock installed first, from its releases or the FM-1 Firmware Hub, and then bris.dock dropped into its
  web console in Chrome or Edge, or deployed with fm1-dock's tools/dock.py. GitHub builds the .dock files on each push
  and attaches them to a release when a version tag is pushed; none is tagged yet. Holding OCT- at power-on opens the
  rescue. The README says the build runs beside blonda-motor and fm1-dock checkouts.
