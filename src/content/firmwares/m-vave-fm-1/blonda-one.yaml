device: m-vave-fm-1
name: BLONDA ONE
summary: >-
  BLONDA ONE, a polysynth module for fm1-dock with two sound engines, a three-oscillator one and BRIS, a six-voice
  analog-style engine modelled on GS Music's Bree6, with 140 sounds, an arpeggiator, step sequences and a browser
  emulator. Built by CI as a .dock file.
description: >-
  A module for the dock firmware, not a firmware of its own: fm1-dock is installed once and the .dock file is dropped on
  its web console. The module began as BRIS alone; from 2.0 it is BLONDA ONE, which merges BRIS with a second engine of three oscillators per
  voice, noise, drive and a self-oscillating ladder filter, and the engine changes with the sound (000 to 049 for the
  three-oscillator engine, 050 to 139 for BRIS). ONE adds an arpeggiator and step sequences of up to 64 steps recorded with REC, a reverb called RUM
  and a ducking effect called PUMP; 2.1 draws the screen as a yellow dot display and adds a PRESSURE setting for the keys' aftertouch, and 2.2
  removes denormal numbers that took 30 to 70 percent of the audio interrupt on the FM-1. BRIS has an oscillator with sub, a four-pole ladder filter, two ADSRs, an LFO, an ensemble and an
  echo, rewritten for the FM-1's single-precision chip from the author's desktop engine blonda-motor and checked
  against it in the repository's tests. The Algorithm knob selects an ERA, with clean at zero, tape wear from 1 to 60 and
  lo-fi with fewer bits and a lower sample rate from 61, using a tape effect shared across modules. The tests report
  the CPU load of a six-note chord on an emulated FM-1 in fm1-dock, and the second core takes voices 3 to 5 when fm1-dock
  lends it. The repository's other module is PULS, a drum machine with 16-step sequences, and the README and docs are in Swedish. No hardware test is
  mentioned.
