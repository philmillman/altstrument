device: m-vave-fm-1
name: Blop
summary: >-
  One-finger chord firmware for the FM-1 (repository OSR-1): 38 chord grids, 16 chord rhythms, a bass with riffs, drums with sidechain, 32 sounds, and a creature on the screen that swims to the chords.
description: >-
  Each of the 27 keys plays a chord from the chosen grid, with white keys as the safe chords and black keys as the
  spicier ones. A chord rhythm can repeat the chord, and a chord that is latched stops when the same key is pressed
  again. The bass has six sounds and eight riff patterns, there are ten drum patterns with their own kits, and a
  kick sidechain pumps the chords. Pages cover effects (delay, tremolo, chorus, reverb), chord voicing and strum,
  groove, bass, drums and the screen's scenery. Notes go out over USB MIDI on channel 1 as they sound, and from 1.1.0 the tempo and beats follow MIDI clock arriving over USB. The README
  is in French, calls the project a prototype and says it has never been tested on a real FM-1; the author measured
  about a fifth of the audio interrupt's time in an emulator. It builds on fm1-base and felucca-bsp.
