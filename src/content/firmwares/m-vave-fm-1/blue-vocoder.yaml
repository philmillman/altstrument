homepage: https://github.com/rev3rend/bluevocoder
based_on: m-vave-fm-1/felucca
distribution: browser-installer
install_notes: >-
  Use the web installer on the project's Pages site in Chrome or Edge over USB, or tools/fm1_install.py with
  bluevocoder-1.0.fwsc (mido and python-rtmidi); SHA256SUMS is in the release. The README says there is one firmware
  bank and no recovery button, but the boot guard drops the unit into the chip's boot mode after two failed boots
  (OCT- and OCT+ held 5 s does it on purpose) and the update path stays open while the firmware runs. The way back is
  fm1_install.py --stock, the installer's Return to official V15, or M-VAVE's updater, and FM-1-transporter is
  listed as optional recovery hardware.
brick_risk: false
