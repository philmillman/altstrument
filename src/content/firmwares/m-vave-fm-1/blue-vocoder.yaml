device: m-vave-fm-1
name: Blue Vocoder
summary: >-
  16-band vocoder for the FM-1: a voice streams in from a computer over USB audio and the unit's own two-oscillator
  synth is shaped by it, with freeze, stereo spread, arpeggiator, MIDI sync and screen-reader support.
description: >-
  The FM-1 appears as a class-compliant 16-bit, 44.1 kHz stereo USB audio device, with the voice on channel 1 and the
  output returned to the computer. The vocoder has 16 bands from 104.5 Hz to 4.6 kHz, ported from the author's Max
  gen~ patch, with resonance, gain, noise and spread controls, and REC freezes the vowel being sung. The carrier is a
  six-voice synth with two oscillators, a low-pass and high-pass filter on one knob, an ADSR and an LFO, or comes from
  USB channel 2. It adds an arpeggiator, a short reverb, MIDI in and out with a CC for every control, clock out and
  clock follow, and saved settings. It speaks every screen through the fm1-reader screen reader, with a device file for
  synthaccess. It is built on the Felucca platform as M-Vave-OP1 carries it, with parts of Solinaesque and Percolator.
  The README says it was tested on a real FM-1.
status: active
