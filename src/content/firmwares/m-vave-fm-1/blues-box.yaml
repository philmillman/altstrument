device: m-vave-fm-1
name: Blues Box
summary: >-
  Standalone 12-bar blues backing band: drums, bass and comping keys follow a major or minor blues form while the 27 keys
  play a four-voice lead synth.
description: >-
  Blues Box plays a 12-bar or 8-bar blues form with 14 groove presets, 12 drum kits, 14 bass engines in 10 bass line
  styles, and 18 keyboard tones in 10 rhythm styles. Bass, keys and drums each have Fullness and Variation controls, and
  higher variation adds extended chords, chromatic bass walk-ups, diminished passing chords and tritone substitutions in
  the turnaround. The keys play a four-voice lead from 14 voices with four play styles, and the key lights show the
  current chord root and the active blues scale. Live controls switch between major and minor blues, trigger a stop-time
  break or a vamp, cue a turnaround and arm one of four endings. Four screens show the lead sheet, band mixer, band
  style and band feel, and 16 preset slots are saved to flash. From 2.3 there are six pages (lead sheet, mixer, drums, bass, keys and lead), sampled
  and modelled voices beside the synth ones, 20 groove beats and 13 riff-based bass lines, and the counts above are for earlier releases. From 2.2, five Band Heat levels raise the band's fullness, variation and volume. It is built on Dinghy. The README says it was built and
  tested on the FM-1; the release also carries SMK-37 packages, which the README does not describe.
status: active
authors:
- name: provostprovost
  url: https://github.com/provostprovost
source: https://github.com/provostprovost/blues
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, with the Blues Box engine and UI credited to its author and the platform code to Leo
  Kuroshita, genkigenki, zvenson and others. The Terminus font is SIL OFL 1.1. The package in docs/ is Blues Box's own
  build, not an M-VAVE image, and no JieLi SDK files are in the tree. The 2.3 commit message names the Salamander Grand V3 piano samples
  (CC BY 3.0), the Erik37 engine (MPL-2.0) and CC0 sample libraries for the other voices.
homepage: https://provostprovost.github.io/blues/
based_on: m-vave-fm-1/dinghy
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer in Chrome, Edge or Opera, or tools/fm1_install.py with the release's bluesbox-X.Y.fwsc. The
  README suggests backing up patterns and presets with M-VAVE's tool first and says installing is at your own risk. Hold
  OCT- while switching on for the USB updater, then reflash Blues Box or restore stock with M-VAVE's updater or a backup
  package.
brick_risk: false
tags: [groovebox, sequencer, drums, synth-engine, chords, blues, editor]
