  alt: "Photo of the FM-1 screen on the Blues Box lead sheet: Jazz Shuffle with the Jazz Club kit, key E minor, 98 BPM, twelve chord boxes (Em7, Am7, C7, B7), Talk-Box and Vibraphone below"
  credit: provostprovost
  source_url: https://github.com/provostprovost/blues
