device: m-vave-fm-1
name: Blues Box
summary: >-
  Standalone 12-bar blues backing band: drums, bass and comping keys follow a major or minor blues form while the 27 keys
  play a four-voice lead synth.
description: >-
  Blues Box plays a 12-bar or 8-bar blues form with 14 groove presets, 12 drum kits, 14 bass engines in 10 bass line
  styles, and 18 keyboard tones in 10 rhythm styles. Bass, keys and drums each have Fullness and Variation controls, and
  higher variation adds extended chords, chromatic bass walk-ups, diminished passing chords and tritone substitutions in
  the turnaround. The keys play a four-voice lead from 14 voices with four play styles, and the key lights show the
  current chord root and the active blues scale. Live controls switch between major and minor blues, trigger a stop-time
  break or a vamp, cue a turnaround and arm one of four endings. Four screens show the lead sheet, band mixer, band
  style and band feel, and 16 preset slots are saved to flash. It is built on Dinghy. The README says it was built and
  tested on the FM-1; the release also carries SMK-37 packages, which the README does not describe.
status: active
authors:
