license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, with the Blues Box engine and UI credited to its author and the platform code to Leo
  Kuroshita, genkigenki, zvenson and others. The Terminus font is SIL OFL 1.1. The package in docs/ is Blues Box's own
  build, not an M-VAVE image, and no JieLi SDK files are in the tree.
homepage: https://provostprovost.github.io/blues/
based_on: m-vave-fm-1/dinghy
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer in Chrome, Edge or Opera, or tools/fm1_install.py with the release's bluesbox-X.Y.fwsc. The
  README suggests backing up patterns and presets with M-VAVE's tool first and says installing is at your own risk. Hold
  OCT- while switching on for the USB updater, then reflash Blues Box or restore stock with M-VAVE's updater or a backup
  package.
brick_risk: false
