versions:
- version: 2.3.0
  date: 2026-11-25
  url: https://github.com/provostprovost/blues/releases/tag/v2.3.0
  notes: "Adds sampled grand piano, electric and upright bass, a jazz drum kit, tenor sax and hollowbody guitar voices and a modelled tonewheel organ, 20 groove beats with fills, 13 riff-based bass lines and a Lead page with a voice, play style, slide time and two chained effect slots. The screens grow to six pages, the preset layout changes and saved slots are reset. The release page only links the changelog; the details come from the release commit."
- version: 2.2.3
  date: 2026-11-21
  url: https://github.com/provostprovost/blues/releases/tag/v2.2.3
  notes: Adds a SWAMP ROCK groove with an eight-bar I, bVII, IV form, a 1B DRONE intro and a six-note blues scale (1, b3, 4, b5, 5, b7) used for every form and chord so the flat-5 note stays lit.
- version: 2.2.2
  date: 2026-11-21
  url: https://github.com/provostprovost/blues/releases/tag/v2.2.2
  notes: "Backlights the 14 function buttons softly in low light and lights them fully when held or active: PLAY/STOP while playing, ENV for a vamp, SEQ for stop-time, and LFO in major blues."
- version: 2.2.1
  date: 2026-11-19
  url: https://github.com/provostprovost/blues/releases/tag/v2.2.1
  notes: Fixes the i-iv and I-IV vamp so a minor blues alternates two bars of i7 and two of iv7 instead of forcing major I7, and shows VAMP NEXT BAR and 12-BAR NEXT BAR when queuing or leaving it. Changes the M-VAVE Chocolate four-switch layout and keeps the blues scale lights on, shifting with the key, while SEL is held.
- version: '2.2'
  date: 2026-11-18
  url: https://github.com/provostprovost/blues/releases/tag/v2.2
  notes: Adds five Band Heat levels, from SIMMER to SMOKIN', that raise the band's fullness, variation and volume and are stepped with FX, KNOB 2 on the lead sheet or the Chocolate switch, with a drum pickup fill when stepping up. The stage lights, amp lamp and chord flash change colour with the level, and the boot splash is new.
- version: '2.0'
  date: 2026-11-18
  url: https://github.com/provostprovost/blues/releases/tag/v2.0
  notes: Adds M-VAVE Chocolate footswitch support, musical lead-ins, next-measure outros, a stinger and a splash screen without flicker, per the release title. The release page carries no further notes.
