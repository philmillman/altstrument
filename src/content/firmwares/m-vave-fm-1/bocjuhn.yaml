source: https://github.com/IanP06/bocjuhn
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states that the modifications, browser adapter and renderer are GPL-3.0-only and keeps Tonitor's table of
  notices: Felucca, SLOOP and Melodee code (GPL-3.0-only), msfa (Apache-2.0), Plaits and Rings parts (MIT), CALIGULA
  after LIRA-8 (BSD) and fonts under SIL OFL 1.1. The release folders also keep Tonitor's own build 68 package, which
  is a community image and not M-VAVE's.
homepage: https://ianp06.github.io/bocjuhn/
distribution: download
install_notes: >-
  Download bocjuhn-1.0-rc7.fwsc from the release, which carries SHA-256 sums and a manifest, or use the local
  installer page that tools/serve_bocjuhn.cjs serves with Node in Chrome or Edge over USB. The README says to back up
  the FM-1 first, because unrelated firmware projects and samples can be overwritten, and the package includes the
  update loader. The README notes a Firmware Hub submission was prepared but not sent.
brick_risk: false
