versions:
- version: v1.0.0-rc10
  date: 2026-11-11
  url: https://github.com/IanP06/bocjuhn/releases/tag/v1.0.0-rc10
  notes: Pre-release. Replaces RYUJI's simplified 808 and 909 bank with integer synthesis for some sources and recorded samples stored as 8-bit companded audio for others, keeping the 48 source IDs, kit maps and session format. RYUJI timbres change on existing sessions. The notes say physical six-track playback, timing and listening checks are pending. Includes the RC7 rollback package.
- version: v1.0.0-rc9
  date: 2026-11-11
  url: https://github.com/IanP06/bocjuhn/releases/tag/v1.0.0-rc9
  notes: Pre-release. RYUJI gets 48 original sources in editable kits (hold EDIT, then pad, source, tuning and lock knobs), kits and locks that persist in presets and sessions, and PLAY ALONG that keeps running while other tracks are selected. Adds four-pole filter options and resonance up to Q12. Session format 32774 reads RC7 and RC8 sessions. Physical validation is pending.
- version: v1.0.0-rc8
  date: 2026-11-10
  url: https://github.com/IanP06/bocjuhn/releases/tag/v1.0.0-rc8
  notes: Pre-release. Adds 33 modulation destinations, delay and reverb controls with six reverb and five delay characters, a PRISM granular mode per track, a mixed straight and triplet loop grid, and fixes for overlapping note gates. Session format 32772 reads RC7 sessions. Physical validation is pending.
- version: v1.0.0-rc7
  date: 2026-11-02
  url: https://github.com/IanP06/bocjuhn/releases/tag/v1.0.0-rc7
  notes: Pre-release. Engine-specific animated graphics and redesigned temporary dials; engines, controls and session format unchanged from RC5.
- version: v1.0.0-rc6
  date: 2026-11-02
  url: https://github.com/IanP06/bocjuhn/releases/tag/v1.0.0-rc6
  notes: Pre-release. First release with the clean performance screens and the browser player.
