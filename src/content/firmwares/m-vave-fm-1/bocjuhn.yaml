device: m-vave-fm-1
name: bocjuhn
summary: >-
  Fork of Tonitor with eight sound engines on six tracks, among them new ACID, DROPLETS, FRACT and RYUJI engines,
  free loops and clocked sequences, and animated engine graphics, with a browser player.
description: >-
  Six tracks each choose one of eight engines: FM, ACID, DROPLETS, FRACT, DRUID, RYUJI, HIVE and OBRADOR. Tonitor's
  list was FM, ANIMA, CALIGULA, RUSSOLO, DRUID, BAYAREA, HIVE and OBRADOR, so four engines are new: ACID in place of
  ANIMA, a particle engine for DROPLETS where CALIGULA was, and FRACT and RYUJI, with the RUSSOLO and BAYAREA names
  gone. Tonitor's granulator, filters, effects, BALLSY, BRICKLAYER and PLAY ALONG are kept. Loops and the BALLSY and
  BRICKLAYER generators can run free or follow an internal clock with a note division, ACID is a monophonic bass
  voice with accent and slide, and every engine has its own animated graphic on a black screen. The README credits
  ryuji kanagawa, and the fork is four commits ahead of Tonitor build 68.

  RC7 is a pre-release. The release notes and HARDWARE-TEST.md record that the author confirmed on 2 November 2026
  that RC7 works on their own FM-1, with no separate record of the install routes or of recovering from an interrupted
  update. The browser player runs the firmware's C code as WebAssembly. Sessions use the RC5 format, and earlier ANIMA
  sessions migrate to ACID.
status: active
