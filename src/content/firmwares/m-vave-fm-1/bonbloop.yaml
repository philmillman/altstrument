device: m-vave-fm-1
name: BONBLOOP
summary: >-
  SLOOP 2.8.5 plus a synth mode: hold ENV and the selected track becomes a three-oscillator wavetable synth with its own
  envelopes, LFOs, filter and a buildable effects chain.
description: >-
  Everything outside the synth mode is SLOOP, including its four tracks, sequencer, drums, projects and web editor.
  Holding ENV for about 0.7 seconds switches the selected track to a new WAVE engine and its own pages, which stay until
  ENV is held again. Each of the three oscillators picks a sine, triangle, saw, square, noise or one of ten wavetables,
  with position, level, tuning and a reverse option, and has its own envelope and LFO. The synth has a filter and an
  effects chain you build from drive, a transient shaper, phaser, DJ filter, chorus, delay and reverb, all off at the
  start, and keeps sixteen sounds. Other additions are chord voicings (inversions, drop 2 and 3, spread, added bass) and
  delay times of one half, one half triplet and a free value in milliseconds. The repository is a copy of SLOOP's
  source with its history rather than a GitHub fork, and its main guide is in Portuguese.
status: active
authors:
