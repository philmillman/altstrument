versions:
- version: '1.9'
  date: 2026-11-24
  url: https://github.com/henribon/bonbloop/releases/tag/v1.9
  notes: The keys can light up the selected track's scale (SEL 2, KEYS set to SCALE), the EQ becomes each track's own instead of the master's, and the soft clipper works on every instrument track. The release holds bonbloop-1.9.fwsc.
- version: '1.8'
  date: 2026-11-24
  url: https://github.com/henribon/bonbloop/releases/tag/v1.8
  notes: Gives the drums' clipper a page of its own, FX > CLIP, with DRIVE, CEIL, SHAPE (soft, hard, fold) and OUT. Violet marks what is on or selected, and pages that choose rather than set a sound return to value windows on the screen.
- version: '1.7'
  date: 2026-11-24
  url: https://github.com/henribon/bonbloop/releases/tag/v1.7
  notes: Adds an FX mixer on every track (distortion, modulation, delay and reverb in parallel), a master compressor and EQ, new effect pages, a Pixelify Sans font and a Very Peri palette. The notes also list 1.4 to 1.6, which add drum REPEAT with triplets, real-time recording, a four-band EQ and one FX chain per project.
- version: bonbloop/synth-mode @ f29de9e
