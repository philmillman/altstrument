device: m-vave-fm-1
name: Bongo Cat's Tiny Studio
summary: >-
  Felucca-based FM-1 firmware with four animated cat bandmates (lead, keys, bass, drums), a looper, a generated
  backing band and all 13 Felucca engines on each part.
description: >-
  A custom build of Felucca 1.6.1. The player's part is recordable in 1, 2 or 4 bars with replace or overdub and
  quantised or as-played timing; the keys, bass and drum parts follow a chosen key and one of four chord
  progressions with swing, band energy and room reverb. Each part picks its own engine, preset, envelope and
  effects, with an A/B sound swap, and there are per-part mute and solo and tap tempo that follows external MIDI
  clock. Screens show cat animations, coats, hats and three hidden scenes triggered by note phrases; a calm mode
  freezes the motion. The release bundle includes a browser preview that runs the same engine as WebAssembly. The
  author describes the build as AI-assisted and reports testing of the 0.3.0 to 0.4.0-rc1 upgrade on one FM-1
  only, with no long hardware soak. The package identity is FM-1_980 and USB MIDI and audio still appear as
  Felucca.
status: active
