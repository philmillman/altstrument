source: https://github.com/ImpossibleKnot/bongo-cat-studio
source_status: open
license: GPL-3.0-only
license_notes: >-
  The cat layer, procedural artwork and tools are GPL-3.0-only. Felucca's MIT engines, ported DaisySP, Rings and
  msfa code, fonts and CC0 samples keep their own licences (LICENSING.md, LICENSES/). The cat drawings are
  original procedural art with no meme sprites bundled, and the project says it is not affiliated with the Bongo
  Cat meme. The repository's promotional GIF and the release's MP4 contain an M-VAVE product photograph that stays
  under M-VAVE's copyright and is outside the GPL; it is not in the firmware.
homepage: https://github.com/ImpossibleKnot/bongo-cat-studio#readme
distribution: download
install_notes: >-
  Download the release ZIP, take a verified backup with tools/capture_felucca_backup.py, then install the .fwsc
  with the bundled Felucca updater (tools/felucca-1.6.1/fm1_install.py) over USB. The only tested route is Tiny
  Studio 0.3.0 to 0.4.0-rc1; from any other firmware use that firmware's own way back first. A Felucca backup
  restores Felucca, not a Bongo jam. The Felucca update loader and its OCT- plus OCT+ recovery path are kept.
brick_risk: false
