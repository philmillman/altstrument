  url: https://raw.githubusercontent.com/Josh-McFarlin/boopbox/main/assets/screens/boopbox-screens.png
  alt: Nine BoopBox screens on dark purple, covering the track banks 1 to 4 and 5 to 8, patterns, the drum grid, the piano roll, chords, punch-in effects, mix and song
  credit: Josh McFarlin
  source_url: https://github.com/Josh-McFarlin/boopbox
  first_party: true
versions:
- version: 1.6.0
  date: 2026-11-09
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.6.0
  notes: The synth tracks share 20 voices instead of 8, so chords on several tracks sound together; one track still plays at most 8 notes and each engine keeps its own cap. Heavy voices use more of the FM-1's time and the quietest fade out if it runs short. BoopBox Trainer keeps 8 voices. The web editor's side bar is regrouped and some pages are renamed. Projects, presets and settings from 1.5.1 open as they are.
- version: 1.5.1
  date: 2026-11-06
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.5.1
  notes: BoopBox Trainer's coach text scrolls when too wide for the screen and the song page judges half-time and kick patterns over whole sections; BoopBox itself is unchanged. Installing it from the installer empties the Trainer's level 4 song.
- version: 1.5.0
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.5.0
  notes: BoopBox Trainer gains a fourth level made from your own song. A web page estimates tempo, key, drums, bass, chords and lead from 30 seconds of an audio file in the browser and installs the Trainer with that song in it; BoopBox itself is unchanged.
- version: 1.4.3
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.3
  notes: BoopBox Trainer explains the music behind each step on 45 short topic pages, opened by holding HOME; BoopBox itself is unchanged.
- version: 1.4.2
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.2
  notes: The sound browser stays open until SAVE keeps the sound or HOME puts the old one back, a drum track can reach PATTERNS, and LEVEL and PAN read the same on every screen. The Trainer's hints follow these changes.
- version: 1.4.1
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.1
  notes: BoopBox Trainer gains a level picker, progress saved to flash after every step and clearer hints; BoopBox itself is unchanged.
- version: 1.4.0
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.0
  notes: Adds BoopBox Trainer as a second firmware, chosen in the installer; BoopBox itself is unchanged.
- version: 1.3.1
  date: 2026-11-02
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.3.1
  notes: Keeps the TANPURA sympathetic strings in tune on the top notes and frees 4.7 KB in the application slot.
- version: 1.3.0
  date: 2026-11-01
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.3.0
