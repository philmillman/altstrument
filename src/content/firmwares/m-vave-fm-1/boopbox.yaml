device: m-vave-fm-1
name: BoopBox
summary: >-
  Eight-track live groovebox renamed from SLOOP: six synth and two drum tracks by default, twelve engines, parameter
  locks, micro timing, fills, a song mode and a web editor, plus a Trainer build that teaches three songs and one from your own audio.
description: >-
  A renamed fork of SLOOP that restarts its numbering at 1.0.0, continuing from SLOOP 2.8.3. The project format has
  eight tracks, any of which can be a synth or a drum machine, and is not interchangeable with SLOOP's, although
  presets, samples and themes carry over and the installer updates an FM-1 running SLOOP or Felucca. Additions over
  SLOOP include physical-model strings, bells and hand drums, a noise engine, six-operator FM with DX7 patch import,
  parameter locks, micro timing, fills, chains with repeats, eight named scenes, sequencer output to MIDI out, a visualiser, and
  factory sounds levelled against each other. The same repository builds BoopBox Trainer, a second firmware in
  which an on-screen coach lights the controls to press and teaches lo-fi hip-hop, synthwave and melodic dubstep
  songs step by step. Versions 1.5.0 to 1.9.0 had a web page that analysed an audio file and added its own song as a fourth level; 1.9.1 removes it. The Hügelton icon atlas and sample pack that SLOOP carries were replaced with assets
  generated in the repository.
status: active
authors:
- name: Josh McFarlin
  url: https://github.com/Josh-McFarlin
source: https://github.com/Josh-McFarlin/boopbox
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md: GPL-3.0-only for the whole tree, with copyright lines for Felucca, SLOOP and BoopBox. Third-party
  parts are CC0 samples, a CC BY 3.0 electric piano in the hip-hop pack, the Terminus font (SIL OFL 1.1), the Fukiai
  icon font (MIT), ports from CrispyZebra (GPL-3.0), msfa from Dexed (Apache-2.0), DaisySP and Rings code (MIT), and
  JieLi SDK files read from your SDK checkout at build time (Apache-2.0). The repository commits its own BoopBox
  builds under docs/firmware; none of them is M-VAVE's stock firmware. The OBERVAVE engine is adapted from zvenson's
  OberVave and the key velocity model from JIANT FM, both listed as GPL-3.0-only.
homepage: https://josh-mcfarlin.github.io/boopbox/
based_on: m-vave-fm-1/sloop
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, where the page offers BoopBox or BoopBox Trainer, or
  tools/fm1_install.py with a release's .fwsc. Projects and songs from SLOOP do not open in BoopBox, so back them up
  in SLOOP's editor first. Holding OCT- alone while switching on enters USB rescue, an interrupted install finishes
  when it is repeated, and M-VAVE's M-UPGRADE with the official V15 firmware puts the stock firmware back. Installing
  is at your own risk.
brick_risk: false
tags: [sequencer, synth-engine, drums, sampler, fx, performance, usb-audio, midi, fm, physical-modeling, editor, fork]
image:
  url: https://raw.githubusercontent.com/Josh-McFarlin/boopbox/main/project/assets/screens/boopbox-screens.png
  alt: Nine BoopBox screens on dark purple, covering the track banks 1 to 4 and 5 to 8, patterns, the drum grid, the piano roll, chords, punch-in effects, mix and song
  credit: Josh McFarlin
  source_url: https://github.com/Josh-McFarlin/boopbox
  first_party: true
versions:
- version: 1.9.4
  date: 2026-11-12
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.9.4
  notes: Redraws the logo in the website's pixel font, with a pixel-art boombox, on the FM-1's boot screen and About page and in the installer, web editor and icons. Nothing else changes; projects, presets and settings from 1.9.3 open as before.
- version: 1.9.3
  date: 2026-11-11
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.9.3
  notes: In the sound browser, PRESETS steps through the engines and ALGORITHM through the engine's sounds, and SAVE and HOME are lit while it is open. Fixes the section letter covering the transport on TRACKS, the track number running into the tape icon and a stray line at the right edge of 14 pages. Projects, presets and settings open as they are.
- version: 1.9.2
  date: 2026-11-11
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.9.2
  notes: A synth track's LEVEL reads 0 to 127, as a drum track's does and as MIDI CC 7 sends it, in place of dB. The sound is the same, with 112 still unity. Projects, presets and settings open as they are.
- version: 1.9.1
  date: 2026-11-10
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.9.1
  notes: BoopBox Trainer goes back to three levels. Level 4 (a song made from an audio file) is removed from the FM-1, and so is the web page that made it. BoopBox itself is as in 1.9.0; projects, presets and settings open as before.
- version: 1.9.0
  date: 2026-11-10
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.9.0
  notes: Adds beats from the keys. On a drum track's PLAY page, holding white keys writes a whole beat across the kit, with the lowest key picking one of eight grooves (house, rock, boom bap, trap, break, dembow, DnB, electro) and further keys adding variations. The same keys and seed give the same beat, and one hold is one undo.
- version: 1.8.1
  date: 2026-11-10
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.8.1
  notes: 'BoopBox Trainer teaches the new pattern pages: level 2 ends with named scenes and a chain, and the coach points at white keys; BoopBox itself is as in 1.8.0.'
- version: 1.8.0
  date: 2026-11-10
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.8.0
  notes: Recognises the newer UC25HQ80 flash chip, so FM-1s sold from late 2026 save and update. Adds NRPN control of every track parameter, optional key velocity and aftertouch (off by default), a browser emulator running the real firmware and a smaller screen font. Projects and settings from 1.7.0 open as before.
- version: 1.7.0
  date: 2026-11-10
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.7.0
  notes: 'Splits PATTERNS into PATTERNS, CHAIN and SCENES pages played with the white keys as pads: a chain is a playlist of up to 16 slots with repeats, and eight named scenes switch every track together on the quantize. Adds the OBERVAVE engine, an eight-voice analog polysynth with 70 programs adapted from zvenson''s OberVave, which moves Program Change numbers. Projects saved by 1.7.0 may not open on older builds.'
- version: 1.6.0
  date: 2026-11-09
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.6.0
  notes: The synth tracks share 20 voices instead of 8, so chords on several tracks sound together; one track still plays at most 8 notes and each engine keeps its own cap. Heavy voices use more of the FM-1's time and the quietest fade out if it runs short. BoopBox Trainer keeps 8 voices. The web editor's side bar is regrouped and some pages are renamed. Projects, presets and settings from 1.5.1 open as they are.
- version: 1.5.1
  date: 2026-11-06
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.5.1
  notes: BoopBox Trainer's coach text scrolls when too wide for the screen and the song page judges half-time and kick patterns over whole sections; BoopBox itself is unchanged. Installing it from the installer empties the Trainer's level 4 song.
- version: 1.5.0
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.5.0
  notes: BoopBox Trainer gains a fourth level made from your own song. A web page estimates tempo, key, drums, bass, chords and lead from 30 seconds of an audio file in the browser and installs the Trainer with that song in it; BoopBox itself is unchanged.
- version: 1.4.3
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.3
  notes: BoopBox Trainer explains the music behind each step on 45 short topic pages, opened by holding HOME; BoopBox itself is unchanged.
- version: 1.4.2
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.2
  notes: The sound browser stays open until SAVE keeps the sound or HOME puts the old one back, a drum track can reach PATTERNS, and LEVEL and PAN read the same on every screen. The Trainer's hints follow these changes.
- version: 1.4.1
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.1
  notes: BoopBox Trainer gains a level picker, progress saved to flash after every step and clearer hints; BoopBox itself is unchanged.
- version: 1.4.0
  date: 2026-11-04
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.4.0
  notes: Adds BoopBox Trainer as a second firmware, chosen in the installer; BoopBox itself is unchanged.
- version: 1.3.1
  date: 2026-11-02
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.3.1
  notes: Keeps the TANPURA sympathetic strings in tune on the top notes and frees 4.7 KB in the application slot.
- version: 1.3.0
  date: 2026-11-01
  url: https://github.com/Josh-McFarlin/boopbox/releases/tag/v1.3.0
  notes: Factory sounds are levelled against each other, the drum track's LEVEL works on the TRACKS screen, and LEVEL covers its full range on 39 presets.
