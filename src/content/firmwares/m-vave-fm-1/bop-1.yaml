device: m-vave-fm-1
name: BOP-1
summary: >-
  Music toy and teaching synth for children on the FM-1: music plays at power-on, and Play, Make, Lab and Games doors grow
  from pressing keys to a two-oscillator subtractive synth with its real parameter names.
description: >-
  Each sound parameter is drawn as a character: waveform as its body, pitch as its size, filter cutoff as its mouth, and echo
  and reverb as its surroundings. Play has no wrong notes and eight styles, Make has four layers on sixteen steps with eight
  saved songs, and Lab exposes two oscillators, a filter, an envelope, an LFO, an arpeggiator, effects and ten
  lessons the firmware checks. Games use public-domain tunes. A grown-ups' page sets a volume cap, a sleep timer and which
  doors show. It is built on Felucca by way of X0X, AMB-1, IND-1, LCD-4 and CRT-4, and a browser emulator, printables and a
  manual are published.
