distribution: browser-installer
install_notes: >-
  Installer page in Chrome or Edge over USB; the .fwsc is on the releases page. OCT- and OCT+ held for five seconds
  enters update mode. The README says installing firmware is at the user's own risk and that the installer can put the stock
  firmware back.
