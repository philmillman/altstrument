- version: V0.30
  date: 2026-11-20
  url: https://github.com/kevinsint/bourdon/releases/tag/v0.30
  notes: Adds the NOISE, CHOP and RING disruptors on the FX button, an FM link between voices, an OWN control on THROUGH voices, and changes the licence to GPL-3.0-only.
- version: V0.27
  date: 2026-11-20
  url: https://github.com/kevinsint/bourdon/releases/tag/v0.27
  notes: First release; three voices with six styles, FOLLOW and THROUGH links, a mixer and a delay, reverb and compressor chain. Published under MPL-2.0.
