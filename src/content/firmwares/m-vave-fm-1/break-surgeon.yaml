device: m-vave-fm-1
name: BREAK SURGEON
summary: >-
  Drum and break firmware for drum and bass: a sliced-break player and six synthesized drum models on one step sequencer,
  with roll, chop, reverse and glitch performance modes, fills, ghost notes, mutation and a drum master bus.
description: >-
  Half of the JUNGLE OS pair; it runs alone or with ABYSS ENGINE, which shares its clock, scenes, fills and kick triggers
  over plain MIDI (JUNGLE LINK). Breaks are prepared on a computer and loaded over USB, since the FM-1 has no audio input.
  The synthesized models are kick, snare, ghost snare, metal hats, percussion and impact effects. The sequencer has
  mutation with anchors and undo, break lock, rhythm and kit graphs of preset sweet spots, six scenes and a master bus
  with room, grit, glue and pressure stages. The README states plainly that neither firmware has been installed on a
  physical FM-1: it was tested in software, in fm1-base's host simulator, a browser emulator and fm1-emu, which runs the real
  device binary. Built on fm1-base and felucca-bsp, used unmodified as a submodule.
status: active
authors:
- name: RahelPuest
  url: https://github.com/RahelPuest
source: https://github.com/RahelPuest/jungle-os-fm1
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSE is the MPL-2.0 text. fm1-base and felucca-bsp are MPL-2.0 too. The repository commits its own built .fwsc
  packages in release/; no stock M-VAVE image is among them. The site folder also carries a copy of Julius Vitkauskas'
  m-bootloader 1.2 package (MIT) offered as an optional extra by the web installer.
homepage: https://rahelpuest.github.io/jungle-os-fm1/break-surgeon/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Web installer page in Chrome or Edge over USB, or fm1-base's fm1_install.py with the .fwsc. The installer can also put
  M-VAVE's firmware back and has an optional, off-by-default m-bootloader install that replaces the stock bootloader. The
  project's install guide says the update loader writes only the app area and leaves the boot loader, calibration and unit
  key alone, and recommends a flash backup first. User patches from the stock firmware are lost because the firmware uses
  those flash areas.
brick_risk: false
