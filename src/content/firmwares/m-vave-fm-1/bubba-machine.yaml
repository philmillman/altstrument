device: m-vave-fm-1
name: Bubba Machine
summary: >-
  Six-channel live groovebox written from scratch in C99: TR-style drum machine, 16-pad sampler and four tracks
  that each load a bass, mono, FM, wavetable or polyphonic synth machine, with polymeter, p-locks, scenes and
  crash-resilient flash saves.
description: >-
  No code from other FM-1 firmware; only hardware facts from public reverse engineering. It runs on the FM-1
  and installs from a web page, and also runs in a desktop simulation and a WebAssembly emulator. The README
  calls the current build a beta tested on a single FM-1, says it still changes a lot, and warns that an update
  may erase saved patterns, songs, settings and takes until version 1. Documentation is mostly Spanish, with an
  English site and some English docs.
status: active
authors:
- name: Erbubar23
  url: https://github.com/Erbubar23
source: https://github.com/Erbubar23/bubba-machine
source_status: open
license: GPL-3.0-or-later
homepage: https://erbubar23.github.io/bubba-machine/
distribution: browser-installer
install_notes: >-
  Web installer page in Chrome or Edge over USB, which reads the FM-1 and can also install the factory firmware
  again. The docs say each beta was tested on one FM-1, and that an update may erase saved patterns, songs, settings
  and takes. Each release also carries the .fwsc package and a no-sound diagnostic build.
brick_risk: false
tags: [drums, sampler, sequencer, synth-engine, wavetable, emulator]
