device: m-vave-fm-1
name: Bunker Evolved
summary: >-
  Generative ambient firmware built from Felucca: four editable layers, 64 sound recipes, 24 worlds, 32 scales,
  a GROW key that proposes new phrases with one-step undo and seven slow mutation processes.
description: >-
  Six home views edit the live synthesizer and sequencer, and Felucca's full engine editors stay reachable.
  The project site has a web installer with music backup and restore, a Chrome editor over USB, a browser
  simulator that runs the firmware's C code, a manual and a recovery guide. The release notes say the
  owner updated one FM-1 from original firmware to Bunker and back, with working audio and controls, and that
  power-loss recovery and other board revisions were not tested. The repository itself holds only a README.
  The complete source is a zip attached to the release, because GitHub's own archives omit part of the tree.
  The site and parts of the release material were made with AI tools.
status: active
