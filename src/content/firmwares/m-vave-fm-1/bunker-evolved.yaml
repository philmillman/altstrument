homepage: https://bunker-evolved.sugarypixie10.chatgpt.site
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, which verifies size, SHA-256 and identity before writing. It installs
  from original V15 or from another firmware with a compatible update loader; back up music first, since
  firmware rollback does not restore overwritten music. The installer offers a return to M-VAVE V15 from a
  file you download from M-VAVE yourself. UBOOT chip mode is not reachable by the installer and may need
  M-VAVE's tools.
brick_risk: false
