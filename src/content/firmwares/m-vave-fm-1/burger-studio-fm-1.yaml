license_notes: >-
  LICENSE and LICENSING.md are Felucca's, giving GPL-3.0-only with the copyright line of Leo Kuroshita, Hügelton Instruments. The MIT Felucca-Engines, the MPL-2.0 felucca-bsp, the Hügelton Sample Pack (CC0), the VSCO-2 CE and VCSL samples (CC0), ported DSP and the fonts keep their own licences, listed in LICENSING.md and LICENSES/. The repository has no M-VAVE stock image and no committed firmware package.
homepage: https://perawoga2-coder.github.io/Fm1sampa/
based_on: m-vave-fm-1/felucca
distribution: download
install_notes: >-
  The release notes say the build is untested on hardware and tell you to back up the FM-1 first. Download felucca-X.Y.Z-bsN.fwsc from the release and install it with tools/fm1_install.py, or use the Firmware Hub card the project says it published. The package is a Felucca build, whose documented ways back to stock V15 are the web installer's return option and M-VAVE's updater; the project documents no recovery of its own.
