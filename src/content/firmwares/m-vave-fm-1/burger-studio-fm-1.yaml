device: m-vave-fm-1
name: Burger Studio FM-1
summary: >-
  Sampling-first build of Felucca 1.8.2: a SAMPLE row on HOME opens a sample editor that trims and slices the three user slots, and one sample can span two or three slots, up to about 84 seconds.
description: >-
  The firmware is Felucca 1.8.2 with sampling changes, published from the repository Fm1sampa by Maker Hip, whose Android groovebox app is listed as Burger Studio. HOME lists the tracks as rows with an extra SAMPLE row that opens EDIT SAMPLE, where the three user sample slots are trimmed and sliced, and a sample can be spread over two or three slots. Later releases make EDIT SAMPLE play the slot on screen, raise the synth engines by 4 dB and give the build its own package identity, FM-1_4627, so the Firmware Hub does not confuse it with Felucca. The bundled sounds are a Rock Heavy drum kit that the project says was synthesized by its own script, the Hügelton Sample Pack and CC0 instrument samples from VSCO-2 Community Edition and VCSL. The project's site carries a sampling guide in eight pages and a PDF. The README in the repository is still Felucca's own, and the release notes say the build is untested on hardware.
