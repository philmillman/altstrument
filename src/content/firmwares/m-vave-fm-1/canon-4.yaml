device: m-vave-fm-1
name: CANON-4
summary: >-
  Canon sequencer for the FM-1: one 16-cell phrase read by four playheads at once, each with its own rate, direction,
  path and transpose, with its own synth and MIDI out.
description: >-
  Sixteen cells, a 4 x 4 field of scale degrees and rests on the white keys, are read by four heads. Each head has its
  own rate (1/32 to 1/2), direction, one of six paths (rows, columns, snake, diagonals, spiral, random), offset,
  length, transpose, octave, sound and mute. The heads drift apart and re-sync every N bars or on a key. Cells carry
  velocity, chance and length, and REC writes cells as the keys are played. It has its own 8-voice synth, eleven drums
  and an echo, sends MIDI over USB and Bluetooth, can send or follow MIDI clock, and keeps four project slots. The
  README names Fugue Machine, PolyPhase and Make Noise Rene as the models.
