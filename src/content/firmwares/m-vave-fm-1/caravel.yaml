versions:
- version: 0.13.0
  date: 2026-11-13
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.13.0
  notes: "Adds ELASTIC, a seventh HOME ACTION bank that turns supported HOME controls into temporary springs with a tempo-synced bounce period. The factory PIANO and FLUTE samples use fewer zones, freeing 27,014 bytes of flash and changing how some notes sound. Projects saved by 0.13.0 use a newer HOME capsule version that 0.12.0 does not read, so back up first. The notes say the final package was not byte-identical to the release candidate tested on an FM-1 and has not itself been tried on a device."
- version: 0.12.0
  date: 2026-11-10
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.12.0
  notes: 'Adds HARMONY, one four-chord progression that tracks follow on the bar clock, LINK to copy a track''s key to another, a sixth HOME ACTION bank with new key assignments (the 0.11.0 keys moved) and recognition of the newer UC25HQ80 flash chip, so saves and updates work there. The project format changes (FUN11): 0.11.0 and earlier show a project saved by 0.12.0 as empty. The notes say an earlier test package passed a device test without per-item results and that the later fixes, including the UC25HQ80 detection, have not been tried on a device.'
- version: 0.11.0
  date: 2026-11-04
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.11.0
  notes: >-
    Makes the ENSEMBLE engine stereo: the track's SPREAD (SPRD) sets the width across six delay taps, and eleven factory
    pads now load with a width. The mono sum is 2 to 3.5 dB lower and wide pads return less reverb, so REV or LEVEL may
    need raising. No project-format change; a stereo ENSEMBLE project plays mono on 0.10.1. The notes say a
    release-candidate build was checked on an FM-1 and no per-item findings are recorded.
- version: 0.10.1
  date: 2026-11-03
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.10.1
  notes: >-
    Fixes the ENSEMBLE taps' slow LFOs, which ran in phase instead of 120 degrees apart, so all fourteen presets sound
    slightly different, and fixes the sea-chart ship in RANDOM moving when another track's journey ran. The notes say
    neither fix was tried on an FM-1 before release. No project-format change.
- version: 0.10.0
  date: 2026-11-03
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.10.0
  notes: >-
    Adds the ENSEMBLE engine (strings, choir and a rough dark timbre through a built-in three-tap ensemble, up to six
    voices per track) with fourteen factory presets and five Pair Morph layer recipes, and fixes the backup script
    stopping on project format 3. No project-format change, but a project that uses ENSEMBLE shows as an empty slot on
    0.9.0, so back up first. The notes say the exact release build was not recorded as installed on an FM-1.
- version: 0.9.0
  date: 2026-11-02
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.9.0
  notes: >-
    Gives every track its own Random Morph snapshots, morph engine and journey, adds a JOURNEY SETUP page, and retires
    the SAX sample set to free flash (SAX sounds now play PIANO). Projects move to a new format 3 that 0.8.0 shows as an
    empty slot, so back up before installing. The author tried a pre-release build on an FM-1; the final build was not
    installed.
- version: 0.8.0
  date: 2026-11-01
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.8.0
  notes: >-
    Adds the Morph Journey ACTION bank, which chains the Random Morph snapshots S1 to S4 into a looping movement, and
    makes a MIDI CC override a running morph for every target. Journey settings are saved with the project, and 0.7.x
    and earlier refuse such projects, so back up first. Only 352 bytes remain free in the app slot, and the author
    describes their install on an FM-1 as a first trial.
- version: 0.7.2
  date: 2026-10-31
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.7.2
  notes: >-
    A candidate fix for Update Failed -5 when returning to official V15: the installer now checks that the package's boot
    area is valid instead of requiring its first 16 KiB to match the unit's flash head, and still refuses a damaged one
    before anything is erased. Not yet confirmed on a unit that showed -5. Also fixes a divide by zero at BPM 0 and
    imported FM6 voices with AMS going silent or full scale.
- version: 0.7.1
  date: 2026-10-30
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.7.1
  notes: >-
    Random Morph's four S1-S4 snapshots now travel with projects, RESTORE LAST and USB backups. The new 7,200-byte project
    format needs 0.7.1 or later; 0.7.0 cannot read it, and older projects load with empty slots. The installer checks
    package size, SHA-256, product, layout and CRCs before installing.
- version: 0.7.0
  date: 2026-10-29
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.7.0
  notes: >-
    Runs the DRONE, SEM, HADES, STASIS and HALL loops from RAM, puts CHORUS before REVERB, and lists HOME macro and
    pair recordings under the owning track's SEQ > AUTOMATION. The new automation list is not yet checked on a device,
    and the four Random Morph snapshots stay volatile.
- version: 0.6.0
  date: 2026-10-27
  url: https://github.com/bonszaimusic/caravel/releases/tag/v0.6.0
  notes: >-
    Adds STASIS HOLD, which captures recent sound from the REV send and holds it, with ADD and BLEND to mix in or
    fade to another captured sound. ROOM, SPRING and the SLICE engine are left out to fit; projects that use them
    show substitutions before loading.
