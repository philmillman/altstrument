device: m-vave-fm-1
name: Caravel
summary: >-
  Independent continuation of Felucca 1.6.1 for the FM-1, adding SEM, HADES, DRONE, DRUM-X and ENSEMBLE engines, a second LFO,
  a per-track filter and a menu layout that shows two parameter groups per screen.
description: >-
  Carries on from the last Felucca release after its author stepped back from development. It keeps Felucca's
  storage formats, so projects and presets saved by Felucca open in Caravel; projects that use Caravel-only
  parameters need Caravel to open, and projects saved by 0.3.0 or later do not open on 0.2.0 or earlier, projects saved by 0.7.1 or later do not open on 0.7.0, and projects saved by 0.8.0 do not open on 0.7.x or earlier, and projects saved by 0.9.0 (new project format 3) do not open on 0.8.0. Added
  features include a latch for held keys, a button to clear the step under the cursor, per-track voice reservations
  and a MORE page for spread and morph; 0.6.0 adds a STASIS hold with ADD and BLEND, and leaves out ROOM, SPRING
  and the SLICE engine; 0.8.0 adds a Morph Journey bank that chains the four Random Morph snapshots into a hands-free loop; 0.9.0 makes Random Morph and Morph Journey per track and retires the SAX sample set; 0.10.0 adds the ENSEMBLE strings, choir and dark-texture engine with fourteen factory presets; 0.11.0 makes ENSEMBLE stereo, with the track's SPREAD setting as its width; 0.12.0 adds a HARMONY chord progression that tracks follow, LINK between tracks and the newer UC25HQ80 flash chip, and shows as empty on 0.11.0 and earlier any project it saved. 0.13.0 adds ELASTIC, a bank of temporary springs on HOME controls, trims the PIANO and FLUTE sample sets, and saves projects with a new HOME capsule version that 0.12.0 cannot read. DRUM-X, MORPH and the BYTE and FLOAT waves in LOFI are adapted from the
  JIANT FM fork. A web installer, editor and browser emulator are published on the project site. The README says
  hardware acceptance on a real FM-1 is still pending (the 0.10.0 notes say only an earlier test build was installed on a unit; the 0.11.0 notes say the maintainer checked a release-candidate build on an FM-1 without recording per-item findings, and the 0.12.0 notes say the later fixes were not tried on a device), and that the firmware uses USB test IDs that the pid.codes
  policy does not allow on devices that are shared or sold. Not affiliated with Hügelton Instruments or M-VAVE.
status: active
authors:
- name: bonszaimusic
  url: https://github.com/bonszaimusic
source: https://github.com/bonszaimusic/caravel
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only (NOTICE and LICENSING.md), as Felucca. Parts keep their own licences: the Felucca-Engines
  submodule is MIT, and ported DSP and fonts carry MIT, Apache-2.0 and SIL OFL texts. The USB IDs 1209:0001 and
  1209:0002 are pid.codes test IDs.
homepage: https://bonszaimusic.github.io/caravel/webapp/installer/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, which installs the newest release and saves a backup before returning to
  official V15, or tools/fm1_install.py with a caravel-X.Y.Z.fwsc package from a release. Releases list SHA256SUMS
  to check the package against. The installer's Return to official V15 takes the unmodified FM-1.fwsc that you
  download from M-VAVE yourself; no stock file is bundled. Back up projects and settings first.
brick_risk: false
tags: [synth-engine, sequencer, fx, fork, editor, emulator, usb-audio, midi]
