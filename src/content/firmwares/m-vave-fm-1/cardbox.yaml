device: m-vave-fm-1
name: Cardbox
summary: >-
  Clip groovebox with a DAW-style timeline: record takes straight into clips, edit them in note cards, a piano roll or a drum grid, and send each lane out on its own MIDI channel. Early beta.
description: >-
  Cardbox has one drum lane of eight synthesised drums and four synth lanes with five engines (analog, FM, plucked string, supersaw and organ), a resonant filter, three envelopes, two LFOs, 128 synth presets and 10 drum kits. Pressing REC writes what is played as a quantised clip at the playhead on an arrangement timeline, with loop overdub, undo of the last take, and copy, paste, split and glue of clips. Delay, reverb, drive, crush and lo-fi, an arpeggiator and a scale lock complete the sound. MIDI clock, start and song position are sent or followed over USB or TRS, and each lane sends on its own channel so a DAW can record the lanes as separate tracks. Version 0.2 adds a song library of up to 17 songs in the unit's flash, time signatures, a song dump that OpenMelodies SongMaker imports, and sound in the opening animation. The screen is dressed as a card table. It is built on the FM-1 firmware kit from Leo Kuroshita's Felucca, through M-Vave-OP1, and the README calls it an early beta.
