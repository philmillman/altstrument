license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, as Felucca, with copyright held by Leo Kuroshita, the M-Vave-OP1 contributors and Alex Wang. The packages hold three unmodified JieLi AC79 SDK files under Apache-2.0, the fonts Inter Tight and Bebas Neue are SIL OFL 1.1, and the browser emulator's design comes from X0X (GPL-3.0). The repository also holds M-VAVE's FM-1 V15 image (vendor/m-vave/FM-1_015.fwsc, git blob ce49cc15, the Apache-2.0 file licensed for redistribution) for the return to stock; it is never part of a package.
distribution: download
requires_stock: V15
install_notes: >-
  Download cardbox_v0.2.fwsc from the release and install it with tools/fm1_install.py (needs mido and python-rtmidi), or build it from source with Docker or Linux. fm1_install.py --stock, the web installer's return to V15 or M-VAVE's own updater puts the stock firmware back while Cardbox still starts. The README says the unit has one firmware bank and no recovery button, and lists a boot guard that sends the unit to the chip's boot mode after two failed starts, a recovery gesture of holding OCT- and OCT+ for 5 seconds, and the update entry that takes a new package over USB. It advises keeping an FM-1-transporter at hand for a first install and backing up the flash first.
