device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: Synth Rescue
kind: tool
summary: >-
  Firmware for an M5Stack Cardputer ADV that revives a bricked FM-1 or SMK-37 by itself: it forces the chip into ROM download
  mode, backs the flash up to an SD card and installs m-bootloader and a minimal open firmware.
description: >-
  The Cardputer sends the JieLi USB key through its USB-C data pins, answers the ROM's calibration pulses, then acts as a
  USB host and runs M-Flasher's flash loader. It identifies the unit from the flash ID and the SMK-37's calibration record,
  backs up the whole 1 MiB to /fm1 on the SD card, and installs a clean image for that board: m-bootloader 2.3 and
  fm1-base's template firmware, which plays the keys and takes any other firmware over USB MIDI afterwards. Sectors up to
  0xFEFFF end up as the image says, so earlier presets and settings are erased; 0xFF000 to 0xFFFFF and, on the SMK-37, the
  Bluetooth pairing and calibration sectors at 0xC0000 to 0xC1FFF are never written. A guided mode shows one step per screen and
  an advanced mode shows the log and runs self-tests. The author reports repairs of an FM-1 and an SMK-37 Pro, including an FM-1 that
  showed nothing on USB, each taking 2 to 8 seconds. The repository holds the two rescue images with their checksums and
  provenance but no M-VAVE firmware.
status: active
authors:
- name: Julius Vitkauskas (jvitkauskas)
  url: https://github.com/jvitkauskas
source: https://github.com/jvitkauskas/cardputer-synth-rescue
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT, copyright 2026 Julius Vitkauskas. THIRD-PARTY.md lists the rest: the rescue images contain
  m-bootloader (MIT), fm1-base and felucca-bsp (MPL-2.0), JieLi AC79 SDK files (Apache-2.0) and fonts (SIL OFL 1.1), and the
  firmware links Arduino-ESP32 (LGPL-2.1) and the M5Stack libraries (MIT). Each rescue image's boot area reuses a 160-byte
  flash header and file table and a 34-byte chip-key record taken from M-VAVE's FM-1 015 and SMK-37 Pro 016 packages, as every
  installer that puts m-bootloader on a unit does; no stock image is in the repository.
distribution: download
install_notes: >-
  Download the merged .bin from the release and flash it at 0x0 with esptool, with the Cardputer in download mode, or copy it
  to a FAT32 SD card and install it with M5Launcher. Switch the synth off, connect it with a USB-C cable, optionally insert a
  card for the backup, switch it on and follow the screen; Y starts the repair. The app takes over the Cardputer's USB-C port,
  and the README says to measure VBUS first and use a cable without it if the Cardputer outputs 5 V on battery. The repair
  replaces the bootloader, and its confirmation key is the only write.
brick_risk: true
tags: [flasher, loader, backup, utility]
