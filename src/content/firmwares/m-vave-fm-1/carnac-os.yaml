device: m-vave-fm-1
name: Carnac OS
summary: >-
  Beta wavetable synth firmware on the X0X platform: 15 wavetable banks, seven voice types, two layers with
  splits, a step sequencer, an arpeggiator and effects, with a stone-circle theme.
description: >-
  Eight voices across both of the FM-1's cores, with 15 morphing wavetable banks, seven voice architectures
  (one of them generates attack sounds), four filter types, three modulation slots per patch, reverbs and
  tape and bucket-brigade delays. Layers can be run single, dual or split. A step sequencer with scales and a
  chord arpeggiator are included, and presets are stored in their own flash area so they survive firmware
  updates. The wavetables and attack sounds are generated by scripts in the repository. The firmware runs on
  X0X's hardware layer, so it is a derivative of X0X and of Felucca. A build that crashes twice at start-up
  boots into a safe mode with USB available. Tagged builds are 0.9.x, which the author calls a beta.
status: active
authors:
- name: OrbVorgis
  url: https://github.com/OwenKirby
source: https://github.com/OwenKirby/carnac-os
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherits X0X and Felucca, both GPL-3.0-only. Fonts from X0X's tree are SIL OFL 1.1, and the JieLi AC79 SDK
  boot files (Apache-2.0) are read from the builder's own SDK checkout rather than stored in the repository.
  The src/dsp/*.bin files are generated wavetable and attack-sound tables, not stock firmware.
homepage: https://owenkirby.github.io/carnac-os/
distribution: browser-installer
install_notes: >-
  Use the web installer in Chrome or Edge with the FM-1 on USB, or run the X0X fm1_install.py script on a
  .fwsc package. docs/fm1-recovery.md describes putting the stock firmware back, including the OCT- and OCT+
  hold for the chip's update mode. The .fwsc holds only the firmware; the PCM waves and the FOUNDATIONS bank are
  written by the web installer or by pcm_store_upload.py sync.
brick_risk: false
tags: [synth-engine, wavetable, sequencer, fx, platform]
