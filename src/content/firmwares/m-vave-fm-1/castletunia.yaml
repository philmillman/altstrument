license: GPL-3.0-only
license_notes: >-
  LICENSING.md, which is Dinghy's, gives GPL-3.0-only, while the README badge and text say GPL-3.0. The platform code is credited to Leo Kuroshita and others and the Terminus font is SIL OFL 1.1. The logo in assets/ is designburg's signet, all rights reserved and not under the GPL. The JieLi SDK files are read from the builder's own SDK checkout and are not in the tree. The only firmware package committed, docs/castletunia.fwsc, is the project's own build and is not an M-VAVE stock image.
homepage: https://github.com/provostprovost/castletunia
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  The README advises backing up stock patterns and presets with M-VAVE's tool first. Download the .fwsc package from the release and install it with tools/fm1_install.py, or build it with the JieLi toolchain and SDK (build.sh). The README says to hold OCT- while powering on to enter USB rescue mode, to reflash with fm1_install.py, and to return to stock with M-VAVE's updater or a backup package. The releases also attach SMK-37 packages, but the README describes only the FM-1.
brick_risk: false
