device: m-vave-fm-1
name: Castletunia
summary: >-
  Generative dungeon-synth and 16-bit RPG battle soundtrack instrument: phrases played on the keys become attacks by a three-member party against a boss on nine fantasy stages, with spells and status effects that reshape the music.
description: >-
  The project was published as Fantasia and is now Castletunia. A three-member party of two-operator FM voices (Fighter, Cleric and Sorceress) plays over backing chords and an FM percussion kit, with a room reverb and a soft clipper. A phrase of one to sixteen notes played on the 27 scale-quantized keys is committed on the next beat and becomes the active character's attack, and the generator weaves the phrases into a four-bar A, B, A, C arrangement. Nine stages, from the Crypt and Tavern to Coronation and Boss, each set a scale, tempo, chord progression, drum kit and per-character timbres, and each boss counts player turns before a three-beat drum-roll build-up and a one-bar musical curse. Spells (Haste, Mirror, Shatter, Resolve and Toll) and four status effects (Sloth slow, Poison, Berserk and Freeze, added in 1.1.0) change what the party plays, and macro encoders set intensity, drift, density, harmony, weave and tempo. The 240 by 240 screen shows a pixel-art battle scene with activity meters and status badges, after a skippable splash. It is built on Dinghy, and the release packages are still named dinghy-X.Y.Z.
