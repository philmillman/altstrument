device: m-vave-fm-1
name: Cat Piano
summary: >-
  Novelty sample instrument: each of the 27 keys plays a real cat meow tuned to its note, with four banks, a
  four-track sequencer, an arpeggiator, reverb and delay.
description: >-
  A fork of Fart Machine One, which is built on FoMni, X0X and Felucca. Held keys keep meowing, a knob bends
  pitch, and MIDI channel 1 plays the keys. Patterns are kept in RAM only and are lost at power-off, and some
  sequencer settings have no panel controls yet. The README says it runs on an FM-1 and passes its host tests,
  while INSTALL.md says it has not been installed on one yet.
status: active
authors:
- name: thefriendlyhedgehog
  url: https://github.com/thefriendlyhedgehog
source: https://github.com/thefriendlyhedgehog/FM-Cat1
based_on: m-vave-fm-1/fart-machine-one
source_status: open
license: GPL-3.0-only
license_notes: >-
  Covers the code and artwork. The meow recordings come from OpenGameArt and Wikimedia Commons: CC0 1.0 or
  public domain, except one recording under CC BY 4.0 whose attribution must travel with the firmware
  (LICENSING.md, samples/banks.json). Fart Machine One's recordings are not included.
distribution: source-only
install_notes: >-
  No release package is published yet; build cat-piano.fwsc with ./build.sh (JieLi toolchain in a linux/amd64
  container) and install it with tools/fm1_install.py. The README points to M-VAVE's updater or the FM-1
  Firmware Hub to go back, and holding OCT- at power-on starts a USB rescue.
brick_risk: false
tags: [sampler, sequencer, fx, reverb, delay]
