device: m-vave-fm-1
name: Cesari
summary: >-
  Felucca fork that adds ported TR-808 and TR-606 drum kits playable on any of the four tracks, a one-page drum
  editor and per-note velocity, chance, length and nudge, while dropping the 909, several engines and the built-in samples.
description: >-
  Cesari keeps Felucca's ANALOG, FM6, PHASE, VOICE and PHYS engines and removes the LOFI, TRIO, WHEEL, GRAIN, NOISE
  and SLICE engines and the built-in samples. In their place come an 808 kit, ported from X0X and its 8W8 circuit
  models, and a 606 kit, ported from 6W6 with voices from AudioKit's 606 synth drums. Each drum has its own
  level, tune, decay, drive and send values on the DRUM pages. The sequencer gives each note its own velocity,
  chance, length and nudge, with per-lane lengths and loop conditions. CI builds publish a web installer, and the README states that the project is
  a work in progress with a new sequencer planned.
status: active
