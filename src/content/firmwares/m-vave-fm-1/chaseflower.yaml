device: m-vave-fm-1
name: ChaseFlower
summary: >-
  Personal fork of CoralFlower for the FM-1 that adds a browsable bank of chord progressions, auto harmony, contextual variations, 40 FX preset chains, new sound banks, 6/8 grooves, six-channel USB recording and a diagnostics view.
description: >-
  Keeps CoralFlower's chord instrument, with its Top Lock key layout, 27 scales, bass part, arpeggiator and sequencer,
  and adds to it. HOME opens on a catalogue of 100 progression ideas that set key, scale and meter, and cycles
  through scene, chord, keyboard and diagnostics views, the last showing audio load, UI timing, memory and USB state.
  GLO has an Auto Harmony mode that stacks thirds from the scale, and a Variation page that changes harmony, arpeggio,
  drums, effects, sound or scale by a chosen amount with undo. There are 40 factory FX chains, 39 drum patterns including
  6/8 and 3/4 grooves, and sound banks that include 32 CC0 Aquanode DX7 voices. USB capture is six channels at 44.1 or
  48 kHz with MIDI still available. The startup animation is a bass jumping out of a lake. Releases are named
  0.6-chaseN and keep CoralFlower's package identity, so the upstream installer takes them through its custom file option.
  The development source adds a native editor and a recorder rework that the README says are not in the released build,
  and its progression catalogue includes snippets written after commercial songs.
status: active
authors:
- name: Chase DeAnda
  url: https://github.com/chasedeanda
source: https://github.com/chasedeanda/chaseflower-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md puts ChaseFlower's own work under GPL-3.0-only, on CoralFlower, ChoralRoot and Felucca. The CC0 Aquanode
  DX7 voices keep their bytes unchanged, a few drum recipes adapt Melodee's GPL-3.0-only tables, and the packages carry
  three unmodified JieLi SDK files under Apache-2.0. The 0.6-chase1 to chase3 packages are also committed under
  releases/ in the repository, and none is an M-VAVE stock image.
homepage: https://github.com/chasedeanda/chaseflower-fm1
distribution: download
requires_stock: M-VAVE stock firmware, CoralFlower, ChoralRoot or Felucca
install_notes: >-
  Download the .fwsc from the release, open CoralFlower's browser installer in Chrome or Edge, expand the custom build
  option and choose the file before pressing Install; the installer's default is upstream CoralFlower. The installer
  can back up CoralFlower, ChoralRoot and Felucca data first, and the release says the official M-VAVE firmware can be
  reinstalled. The README says the combined release's appearance and timing still need checking on a unit.
brick_risk: false
