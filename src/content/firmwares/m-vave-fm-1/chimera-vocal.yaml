device: m-vave-fm-1
name: FM-1 Chimera Vocal
summary: >-
  Physically modelled human voice for the FM-1, a port of Jameson Hodge's CHIMERA: each key sings the next syllable of a line, with a vowel mode and a web Studio for the words.
description: >-
  The sound comes from a simulated airway of lungs, vocal folds, throat, mouth and nose, with no samples. In WORDS mode each
  key sings the next syllable of a line at the key's pitch, with consonants on the press, the vowel while held and the ending on
  release, and PLAY speaks the whole line. In VOWEL mode the keys play pitch while the knobs move the mouth through CHIMERA's
  vowel space, and twelve vowel snapshots can be recalled. Five knob pages cover singing, shape, mouth, source and play, and
  eight voice presets are provided. The screen shows CHIMERA's flat view of the head as it moves. Words are prepared in a web
  Studio with the CMU Pronouncing Dictionary, tried on an emulated FM-1 and sent over USB, and from 0.5.0 they can
  also be typed on the unit. The FM-1 uses a lighter waveguide tract than CHIMERA's full airflow model, which the author measured at about
  twice what the chip can run, and from 0.5.0 ALGORITHM picks a male, female or child body. It uses both processor cores, with the sound
  rendered on one and the control on the other. The project is unofficial, and uses CHIMERA's name and head with its author's
  permission.
