license: MIT
license_notes: >-
  A mixed licence, read from the LICENSE file and README. The port of CHIMERA's voice (engine/ and app/dsp/voice_male.h) is MIT with
  Jameson Hodge's copyright, and the project's own Studio, site, tools and lab are MIT. The files started from fm1-base's
  template (app/app.c and app/app.h) are MPL-2.0, and the firmware package is MPL-2.0 AND MIT. The CMU Pronouncing Dictionary
  entries keep Carnegie Mellon's BSD-style licence, and each package carries JieLi AC79 SDK files under Apache-2.0.
homepage: https://shan-sherif.github.io/fm-1-chimera-vocal/
distribution: browser-installer
install_notes: >-
  Use the install page in Chrome or Edge with the FM-1 on USB; the README says it can put M-VAVE's own firmware back. The release
  also holds the .fwsc and the .bin image with SHA256SUMS. Both FM-1 flash chips (Puya P25Q80 and UC25HQ80) are accepted, but the
  README says the newer chip has not been tested with this firmware on a unit. Install at your own risk.
brick_risk: false
