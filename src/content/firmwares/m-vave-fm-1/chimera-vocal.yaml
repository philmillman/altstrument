versions:
- version: 1.0.0
  date: 2026-11-23
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v1.0.0
  notes: "No longer a beta. Adds blended bodies (hold SEL and turn PRESET for male to female, SELECT for adult to child, between CHIMERA's three bodies) and a TONGUE mode on ARP that places the tongue body and tip by hand while the keys play pitch. Presets from 0.9.0 carry over, each with its body, and the package works with both FM-1 flash chips."
- version: 0.9.0
  date: 2026-11-21
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.9.0
  notes: "Adds an American alligator and an African elephant to the Bestiary on LFO, completing it. Much of their low rumble is below what the FM-1's speaker plays. Saved seal and songbird settings carry over."
- version: 0.8.0
  date: 2026-11-17
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.8.0
  notes: "Adds a Sing mode on ENV that fits a word slot to one of CHIMERA's six tunes, with tempo, key and vibrato on the knobs. Rebalances the beatbox against CHIMERA's renders, ends plurals and verbs in -s as English does, and retunes the hi-hat hiss to CHIMERA's range. The debug page gets a treble shelf to try."
- version: 0.7.0
  date: 2026-11-17
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.7.0
  notes: "Adds a beatbox on SEQ with ten mouth-made drum sounds, seven beats and a 16-step editor for your own, plus a Bestiary on LFO with a Weddell seal and a songbird. The waveguide now holds pressure in a sealed pocket, which clicks and ejectives need."
- version: 0.6.0
  date: 2026-11-16
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.6.0
  notes: "Adds pressure-sensitive vibrato, aftertouch, mod wheel and pitch bend from a MIDI controller, a random-word button on the unit (ARP) and in the Studio, a child voice closer to CHIMERA's and a fix for a crack at the end of words ending in /m/ or /n/."
- version: 0.5.0
  date: 2026-11-16
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.5.0
  notes: "Adds a word editor on the unit (EDIT opens it, with an A-Z or a two-row QWERTY key layout), moves the knob pages from EDIT to SEL, and lets ALGORITHM choose a male, female or child body. Typed words use the built-in pronunciations. The platform sources from fm1-base and felucca-bsp now sit in the repository as plain folders instead of a submodule."
- version: 0.4.1
  date: 2026-11-16
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.4.1
  notes: "Lights the keys for incoming MIDI notes over USB, Bluetooth or TRS, and is built, tested and signed by The Firmware Hub's shared builder."
- version: 0.4.0
  date: 2026-11-14
  url: https://github.com/shan-sherif/fm-1-chimera-vocal/releases/tag/v0.4.0
  notes: First public release.
