  alt: "Chipbox RACK view: four channels of 16 steps in red, yellow-green and blue, a Game Boy icon, tempo 144 and RACK, CHIP and SONG tabs"
  credit: pbarilla
  source_url: https://github.com/pbarilla/chipbox
  first_party: true
