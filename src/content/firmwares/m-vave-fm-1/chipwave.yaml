license: GPL-3.0-only
license_notes: >-
  LICENSE.md is M-VAVE's FM1 APP license (GPL-3.0-only with an additional permission to link the binary SDK), carried
  over from m-vave/fm1_open. The engine library sdk/lib/libfm1_engine.a is the proprietary binary M-VAVE's THIRD_PARTY.md
  allows to be used, linked and redistributed for M-VAVE FM1 devices only; its git blob matches the one in fm1_open. The
  copy of M-VAVE's stock V15 image at sdk/firmware/FM-1_015.fwsc has the git blob ce49cc1, the file M-VAVE licenses under
  Apache-2.0 in fm1_open.
homepage: https://github.com/nickgudauskas/fm1-chipsynth/tree/chipsynth
distribution: source-only
requires_stock: M-VAVE FM-1 V14 or V15 with the M-UPGRADE update path
install_notes: >-
  Build on Windows x64 with PowerShell and the JieLi 2.5.3 toolchain, following the FM1 Open build steps; the build
  writes build/dx7/generated/Chipwave 01.fwsc and an offline workbench page that can flash it over USB. The workbench has a
  way back to the V15 recovery image. The default branch is chipsynth. The firmware is close to the application size limit, so
  the factory bank was trimmed and program numbers differ from stock, which changes what saved projects load.
