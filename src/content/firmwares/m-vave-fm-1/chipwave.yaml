device: m-vave-fm-1
name: Chipwave
summary: >-
  Adds a chip voice engine to M-VAVE's FM1 Open V14: polyphonic NES-style or Sega SN76489 voices on MIDI channel 16, 34 presets, echo and a limiter, plus NES and Genesis DX7 voices and projects. Not yet flashed to a device.
description: >-
  The repository is a copy of M-VAVE's FM1 Open V14 history with a chipsynth branch on top. The sound engine and sequencer of FM1 Open are a sealed binary library, so the chip engine is mixed into the audio block after that library renders and before the output stage, and takes its notes from MIDI channel 16 through a tee in the MIDI router. It offers pulse, triangle, wavetable and noise voices in an NES flavour, an SN76489 flavour with square voices and Sega noise, polyphonic, mono legato and chip modes, program changes for 34 presets including drum kits and arpeggios, and control changes for echo, flavour, mode and volume. The branch also rebuilds the factory DX7 bank with NES and Genesis style voices, trims it to fit the flash budget with the original V15 banks kept as .syx files, adds two ready-made projects, a colour-cycling screen and a firmware name Chipwave V01. The handoff notes say the package builds with the JieLi toolchain and 48 host checks pass, but that it has not been connected to or flashed onto a device.
