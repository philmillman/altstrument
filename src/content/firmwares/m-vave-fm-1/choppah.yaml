versions:
- version: '1.2'
  date: 2026-11-08
  url: https://github.com/profikid/fm1-break-choppah/releases/tag/v1.2
  notes: Rebuilds ARP. The sixteen white-key overlay effects are removed; the white keys play slices as on HOME, and each black key is an effect slot (filter, crunch, drive, delay, reverb and the rest of the FX library) that sounds while held, or stays on with SEL. Up to four sound at once. Settings saved on 1.1 load as before.
- version: '1.0'
  date: 2026-11-07
  url: https://github.com/profikid/fm1-break-choppah/releases/tag/v1.0
  notes: First 1.x release. Adds a battery indicator next to the level meter on the slicer page, with a bolt while USB powers the unit; otherwise the firmware is as in 0.99, which dropped the Bluetooth codec knob and the left and right test again and moved to fm1-base's newest main.
