device: m-vave-fm-1
name: CHOPPAH
summary: >-
  Breakbeat chopper for the FM-1: eight classic breaks cut into sixteen slices, effect pads, 16 step-sequenced
  patterns, a pattern generator, sixteen overlay effects, a four-slot master effects chain, synthesized kick, snare
  and hat, and a DJ filter.
description: >-
  Rights warning: since 0.13 the firmware's eight breaks are two-bar cuts of commercial records, among them The Winstons'
  "Amen, Brother", James Brown's "Funky Drummer" and "Cold Sweat" and the Incredible Bongo Band's "Apache". The
  repository's breaks folder says the rights belong to the labels and artists and that the owner chose to publish them.
  Built on charlesvestal's fm1-base, with Felucca's board support code underneath. The ALGORITHM knob steps through the eight
  breaks; versions up to 0.12 instead had seventeen, five played by a small drum synth and twelve recorded Amen loops. Holding
  a slice loops it and the four knobs set its length, pitch, start and mode. The black-key pads cover rolls, reverse,
  freeze, tape stop, gate, random, a filter throw and a dub delay. The generator rearranges the break as it plays, the
  ARP key turns the white keys into sixteen overlay effects (dive, rise, radio, wah, crush, wobble, jet and others) that
  sound while held up to 1.1, and from 1.2 leaves the white keys playing slices and makes each black key a held effect slot
  from the FX library, four sounding at once, and the FX page holds a master chain of four slots in any order (filter, crunch, drive, punch,
  flanger, ring modulator, tremolo, reverb, delay, EQ, tape saturation, multiband compressor and clipper), with further
  effects per slice. From 0.60 each effect has MAIN, MORE and MOD parts, with extra knobs and a modulator, and a live
  view, and MB COMP has a page of its own. Since 0.32 the firmware has 16 patterns with a step sequencer and recording: 32 break steps, plus
  kick, snare and hat lanes of 16 steps each, with MIDI notes for the slices and drums. The kick is a four-layer
  synthesized gabber kick; the snare and hat have their own design page. A MIXER page sets the levels, and ENV is a
  full-screen tap tempo with a metronome click. MIDI clock in and out and Bluetooth MIDI are included, as is Bluetooth
  audio out to headphones or a speaker, which the README says runs 150 to 300 ms late and is for listening. The README
  calls it an early 0.x release: the looper and a song mode are next, and the breaks are built in, so you cannot load
  your own. Left alone, the screen runs a demo of animated scenes. Units sold since late 2026 carry a UC25HQ80 flash
  chip instead of the Puya P25Q80, and from 0.69 the firmware accepts both. The 0.86 notes report an install on a real
  FM-1 over the official V15 and over another firmware, with another firmware installing again afterwards. A browser
  emulator and a manual are published on the project site.
status: active
authors:
- name: Laurens Profittlich (profikid)
  url: https://github.com/profikid
source: https://github.com/profikid/fm1-break-choppah
source_status: open
license: MPL-2.0
license_notes: >-
  MPL-2.0 (LICENSE). The ten classic breaks in breaks/classics/ are commercial recordings whose rights belong to the
  labels and artists (breaks/README.md); the firmware has used eight of them since 0.13 and they are not covered by the
  repository licence. The Amen loops in breaks/cw/ and breaks/huge/ are Cyberworm's collections from rhythm-lab.com, which
  the collection's info file describes as royalty free; they were the firmware's breaks up to 0.12. No M-VAVE stock
  image is bundled.
homepage: https://profikid.github.io/fm1-break-choppah/
distribution: browser-installer
requires_stock: M-VAVE stock firmware or another Felucca / fm1-base build; not FM1 Open
install_notes: >-
  Install page on the project site (Chrome or Edge, Web MIDI with SysEx) or build with ./build.sh and flash with
  ./build.sh flash. An FM-1 running M-VAVE's FM1 Open only accepts M-VAVE's own packages, so put M-VAVE's stock
  firmware back first. FLASHING.md describes holding OCT- and OCT+ for five seconds to enter update mode, a safe mode
  after two failed starts, and says an interrupted write has no proven recovery.
brick_risk: false
tags: [sampler, drums, performance, fx, looper, generative, emulator, midi]
