device: m-vave-fm-1
name: ChoralRoot FM-1
summary: >-
  Telepathic Orchid-style chord instrument: one hand plays roots, the other shapes voicings, with key
  and performance modes, a bass line and a looper, on Felucca engines and the monome-grid ChoralRoot musical
  engine.
description: >-
  Rights warning: the repository bundles the 64 Casio CZ-1 factory tones and the 200 Sequential Prophet-5/10 factory
  programs (v1.03) as SysEx sound data, which the default build compiles in as factory presets (the Prophet-5 list is
  cut to 115 programs). Its licensing file states the rights stay with Casio and Sequential and that no licence is
  granted.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/ChoralRootFM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The repository bundles the CZ-1 factory tones (assets/cz1-factory) and Sequential's Prophet-5/10 factory programs
  v1.03 (assets/prophet5-factory, of which shipped.txt names the 115 compiled in) as sound data; LICENSING.md and the
  folders' READMEs say no licence is granted for them by this project and that the rights stay with Casio and
  Sequential.
homepage: https://quixotic7.github.io/ChoralRootFM1/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer; browser emulator at /emu/. Independent of Telepathic Instruments and M-VAVE.
  Early releases were beta pre-releases.
brick_risk: false
tags: [chords, synth-engine, performance]
image:
  url: https://raw.githubusercontent.com/Quixotic7/ChoralRootFM1/main/docs/manual/chord.png
  alt: "ChoralRoot FM-1 chord screen showing a Dm7 chord and its notes"
  credit: "Quixotic7"
  source_url: https://github.com/Quixotic7/ChoralRootFM1
  first_party: true
versions:
- version: '0.40'
  date: 2026-11-11
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.40
  notes: Adds drums. Choosing Drums instead of Metronome in the SEQ menu plays a kick, a snare that turns into a clap and closed and open hats from six kits, on a pattern map taken from Mutable Instruments' Grids and with CoralFlower's morph drum synth, following the loop. The click now follows MASTER, the beat is off at every power-on, and a second resource region holds the kits and map. Settings, sounds and loops carry over, but a settings backup does not hold the drum settings. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.39'
  date: 2026-11-11
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.39
  notes: Adds a MIDI Roots option, under which every note on a chosen MIDI channel is a chord root and the chord keys or the first nine pads of a pad controller pick the chord type, with the home screen showing the chord. The Options are grouped in a list and reopen where they were left. Settings, sounds and loops are stored as before. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.38'
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.38
  notes: Glide now runs from 3 ms to 30 s and the knob shows the time the slide really takes; with the voice mode on POLY, chords slide note by note into each other, and a new Gl. mode sets whether the time is per octave or per slide. Fixes two notes that could keep sounding after LATCH went off or under Free. Old sounds with Glide above 0 now slide more slowly. Settings, sounds and loops carry over. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.37'
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.37
  notes: Bass Solo plays the chord root in the octave you play, loops stay locked to an incoming MIDI clock because every clock pulse now counts, the tempo follows the clock steadily, and the PERF layers' knobs sit in the same places across modes, which reorders the Slop and Pattern knobs. Settings, sounds and loops carry over. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.36'
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.36
  notes: 'Adds 21 more scales to Key Mode, 23 in all: the modes, pentatonics, blues, bebop, whole tone, diminished and some eastern scales, and the 6th-diminished scale. Each scale note plays the chord built from the scale''s own notes. The SMK-37 package for this version is listed under ChoralRoot''s SMK-37 entry.'
- version: '0.35'
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.35
  notes: The bass can Follow the chords' performance mode and parameters, and holding PERF inside a PERF layer switches between the chords' and the bass's layer. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.34'
  date: 2026-11-09
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.34
  notes: Adds separate Chord and Bass Perform modes, so slow chords can sit over an arpeggiated bass. A BASS tap turns the bass on and off at once, and the BASS layer's keys play by default. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.33'
  date: 2026-11-09
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.33
  notes: Removes the loud pop some FM-1s gave a few seconds after power-on by starting the audio clocks earlier and keeping the output silent until the unit is ready. Adds an Options setting, MIDI CC, so controllers set the chord and bass sound parameters (and knob turns can be sent out), and lets the master filter act on the chords or the bass alone. Stored settings, sounds and loops carry over. The SMK-37 package for this version is listed under ChoralRoot's SMK-37 entry.
- version: '0.32'
  date: 2026-11-08
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.32
  notes: Flash driver waits up to 2 s for an erase and 50 ms for a page write, so FM-1s with the slower second flash chip finish saves and updates that ran late; a chip still busy after that is reset and the unit restarts. Nothing played changes.
- version: '0.31'
  date: 2026-11-08
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.31
  notes: Adds an Options setting, USB Host, that makes the USB-C port host a USB MIDI device, so two FM-1s can play each other over one cable. It is never saved and the port stops working with a computer while it is on. Notes held by MIDI are released when USB goes away.
- version: '0.30'
  date: 2026-11-08
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.30
  notes: Adds Bluetooth MIDI (switched on under Options, effective after the next power-on) with the same notes, clock and controllers as USB, and makes incoming MIDI Start, Continue and Stop act like the LOOP button. The fonts moved to their own flash region to make room.
- version: 0.29.2
  date: 2026-11-03
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.29.2
  notes: Loops now stay in time with an incoming MIDI clock by following its pulses instead of a whole-BPM tempo, which had drifted about 2 seconds in 10 minutes at 120.4 BPM. Nothing else changes.
- version: 0.29.1
  date: 2026-11-03
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.29.1
  notes: Recognises the second flash chip fitted to FM-1s sold from late 2026. On those units 0.27 to 0.29 kept no settings, sounds or loops and refused updates; the release notes give a recovery route through the Unbricker. Nothing else changes.
- version: '0.29'
  date: 2026-11-01
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.29
  notes: >-
    Brings the Digitone II's filter and envelope work to FM TONE: four more filter types, drive before the filter, an AHD
    amp envelope and bit and sample-rate reduction. Imported Digitone sounds carry their own reverb, delay and chorus
    sends, and FM TONE chord voices now share both cores.
- version: '0.28'
  date: 2026-11-01
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.28
  notes: The firmware is 0.27's with a new version line; the web device manager and installer now read Digitone .syx dumps and sounds of every record version.
- version: '0.27'
  date: 2026-10-26
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.27
  notes: Adds an FX Routing page that orders chorus, delay, reverb and the master filter, in parallel or as one chain.
- version: 0.26.1
  date: 2026-10-20
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.26.1
  notes: Same firmware as 0.26, built and signed on GitHub from the tag.
- version: '0.26'
  date: 2026-10-20
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.26
  notes: Shares dense VA and FM6 chords between the two cores.
- version: 0.25.1
  date: 2026-10-17
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.25.1
  notes: The FM-1 chord-key layout becomes the default.
- version: '0.25'
  date: 2026-10-17
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.25
  notes: GRAIN morph blends its two sources into one sound.
- version: '0.24'
  date: 2026-10-17
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.24
  notes: Adds the GRAIN engine, an FM-1 chord-key layout and velocity on all keys with poly aftertouch out.
- version: '0.23'
  date: 2026-10-16
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.23
  notes: Brings FM TONE to the level of the other engines and adds a velocity curve for the FM-1 keys.
- version: '0.22'
  date: 2026-10-16
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.22
  notes: Adds a P5 engine, 128 shared sound slots, favorites and a filter on the whole sound.
- version: '0.21'
  date: 2026-10-13
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.21
