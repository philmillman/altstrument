license: GPL-3.0-only
license_notes: >-
  The README and LICENSE state GPL-3.0-only, as Blop (OSR-1). The grand piano samples (res/piano.bin) are the Salamander Grand Piano V3 by Alexander Holm under CC-BY-3.0, changed to mono ADPCM. fm1-base and felucca-bsp stay MPL-2.0, and each package holds three Apache-2.0 JieLi SDK files. CREDITS.md says thirteen sounds are converted from DRIFT's factory settings (GPL-3.0-only).
homepage: https://swtdr34mz-afk.github.io/CHORD_RUN/emu/
distribution: download
install_notes: >-
  Download the .fwsc package from the latest release and install it with an FM-1 .fwsc installer; the README gives no install steps of its own, and the firmware is also listed on The Firmware Hub. The README does not describe a recovery path, and the FM-1's ROM boot mode applies.
