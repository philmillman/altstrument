device: m-vave-fm-1
name: CHORD RUN
summary: >-
  One-finger chord player for the FM-1 with 17 song sets, a scale-matched melody on the white keys, drum styles, a 4-bar looper and a runner game that scores your playing. Rights warning: the song sets use the chords of commercial songs.
description: >-
  Rights warning: the 17 song sets are named after commercial songs by artists such as The Beatles, Toto, Adele, Ed Sheeran, The Weeknd and Radiohead, and each sets the chords of that song on the black keys with its own tempo and drum style. The README says the guide melodies are original and not the records', but it does not discuss the rights in the chord sets.

  Each song brings its own sounds, bass and drums. The white keys play the song's scale fitted to the chord sounding, and an ASSIST setting lights the notes that fit or, in GUIDE mode, a melody made for the song key by key. Nine chord rhythms, an arpeggiator, 24 sounds including a sampled grand piano, thirteen drum styles, a bass and the effects add to the playing. REC records four bars of chords that loop under the melody. A little runner covers distance while you play, with missions and ten unlockable characters. Chords and bass go out as USB MIDI on channel 1 and incoming MIDI clock sets the tempo. It is a GitHub fork of Blop (OSR-1), whose entry it extends, and a browser build of the same firmware is on the project site.
