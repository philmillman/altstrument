  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-chordism
based_on: ableton-move/schwung-chordism
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSE is MPL-2.0. The README says the engine in app/dsp is the MIT-licensed Chordism module for Schwung ported to C, and the original is vendored as an MIT-licensed reference for tests. It builds on fm1-base and felucca-bsp, and the Barlow font is OFL 1.1.
homepage: https://charlesvestal.github.io/fm1-chordism/
distribution: browser-installer
install_notes: >-
  Install from the project's web installer in Chrome or Edge, or run base/tools/fm1_install.py on the .fwsc from the release from a clone with submodules. The manual describes a way back to M-VAVE's own firmware in the installer. Releases are built and attested by the shared fm1-build workflow. It supports both the Puya P25Q80 and UC25HQ80 flash chips.
brick_risk: false
