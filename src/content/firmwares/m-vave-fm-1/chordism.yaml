device: m-vave-fm-1
name: Chordism
summary: >-
  Chord synth for the FM-1, a port of the Chordism Schwung module: each key plays a four-voice chord with morphing levels and pans, FM, a pressure-controlled filter, lo-fi, delay, plate reverb and an arpeggiator.
description: >-
  Chords come from sixteen chord types, your own intervals or a chord per scale degree, and the Voicing page spreads, rotates and detunes them. The sound engine is the Schwung module's C code ported to the FM-1 and checked against the original, with the delay and reverb changed to suit the chip, half the voices on the second core and a guard that fades the oldest tail when processing runs short. Velocity and key pressure are used. It carries the module's 57 sounds, 16 slots for your own, an arpeggiator with Euclidean rhythms, MIDI in and out over USB and Bluetooth, TRS MIDI in and USB audio recording. Each page is drawn with a picture of what it changes. A browser emulator and manual are published beside the installer.
status: active
authors:
