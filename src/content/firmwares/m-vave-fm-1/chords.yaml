device: m-vave-fm-1
name: CHORDS
summary: >-
  Chord generator for the FM-1: pick a scale and root, the white keys play the scale's chords and the black keys its
  notes, with twelve synth sounds, voicings from dyads to 11ths, an arpeggiator and a bass.
description: >-
  Puts the author's Chord Generator web app on the device, built on FoMni's copy of the Felucca platform with a new
  instrument and interface. It keeps HOLD and an effects chain. The README says it passes its tests in the simulator
  and browser emulator but has not been run on a real FM-1. BASSLINE by the same author is built on it.
