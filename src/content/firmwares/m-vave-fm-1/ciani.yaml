device: m-vave-fm-1
name: CIANI
summary: >-
  Work-in-progress generative Buchla-style voice for the FM-1, after Suzanne Ciani's solo Buchla concerts: three
  self-mutating pattern layers and a pad through a model of a low pass gate.
description: >-
  Each of three layers has four voices made from an FM pair, a wavefolder and a low pass gate model, struck by its own
  pattern. A Source of Uncertainty control changes notes, bends fold and decay and skips or accents steps, so the
  patterns keep shifting, and the layers run at fractions of one tempo with lengths of 8, 5 and 7 steps. Layer A is an
  arpeggio, B a bass and C a lead made from two detuned saws into a ladder filter with reverb. A pad holds an open
  chord with slow LFOs. The keys steer every layer to a new root, with two-key combinations choosing major or minor.
  The gate and folder follow published DAFx papers on the Buchla 292 and 259. The README calls it a working name, lists
  stereo movement, macros, presets and a release as later steps, and the repository has no release yet.
