homepage: https://mrjoshida.github.io/CINCO/
distribution: browser-installer
requires_stock: V15 or Felucca
install_notes: >-
  Web installer on the project site (Chrome or Edge over USB), or build with ./build.sh (Docker and the JieLi
  toolchain). The installer's Return to official V15 asks for the FM-1.fwsc you download from M-VAVE yourself, and the
  README also names the OCT- and OCT+ boot recovery. The browser emulator on the project page needs no hardware.
