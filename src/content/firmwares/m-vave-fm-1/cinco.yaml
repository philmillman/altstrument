device: m-vave-fm-1
name: CINCO Identity Generator 2.5
summary: >-
  Joke firmware that turns the FM-1 into the "Celery Man" computer from Tim & Eric Awesome Show, Great Job!: a
  playable instrument with dancing sprites, a speech synthesizer and a backing groove in several 90s dance styles.
description: >-
  Rights warning: this is a fan parody of a television sketch. The planning notes say the dancer sprites are rotoscoped
  from the show's footage and show the actor's likeness, and the firmware uses the show's character names, quoted lines
  and trademark-style branding. The README presents the project as a 1995 Cinco software box and uses the Cinco name.
  The computer's voice is described as new speech made with macOS text-to-speech and encoded as LPC data, not the
  show's audio. It is a working firmware, not only a README gag: a fork of Felucca with about 80 KB of its own
  C source (graphics, sound, groove, speech and UI) and a WebAssembly emulator on the project site. Knob 1 stacks up to
  sixteen cascading windows and widens the chorus, the LFO, ARP and FX keys trigger the sketch's Hat Wobble, Flarhgunnstow
  and Nude Tayne moves, a boss key swaps in a fake spreadsheet, SEQ opens a disk-defragmenter screen that works as a
  16-step sequencer, and a speech soundboard plays on the keyboard. The ALGO encoder picks one of 16 synthesis
  algorithms and PRESET one of 16 character presets. The README marks version 2.5 as beta, and the plan lists testing
  on real hardware as a later phase. A prebuilt cinco.fwsc (package identity FM-1_555, 610 KB) is attached to the
  v2.5 release and served by the project's own web installer.
status: active
