device: m-vave-fm-1
name: CITY POP
summary: >-
  Self-playing 1980s city pop firmware for the FM-1 that generates whole songs with slap bass, electric piano, chorus guitar, brass and a sax or synth lead, over a screen of a city at dusk seen from a car stereo.
description: >-
  Each song gets its own key, tempo between 95 and 120 BPM, groove and title, and runs intro, verse, pre-chorus, chorus, second verse and chorus, bridge or solo, a key change up for the last chorus and a fade. Chords are lush major sevenths, minor ninths and suspended sevenths with royal road and ii-V turns. The band is a fingered or slap bass locked to the kick, Rhodes or DX electric piano, a clean chorused guitar, brass stabs, strings in the choruses, a lead on synth or soprano sax and gated drums with tom fills. The screen shows a car stereo with turning reels under a city whose windows and rooftop signs light up as the chorus arrives. Thirteen styles each keep their own settings, EDIT calls the next song, REC repeats the last chorus and the keys play the electric piano along.
status: active
