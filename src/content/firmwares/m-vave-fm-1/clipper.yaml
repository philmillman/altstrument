device: m-vave-fm-1
name: Clipper
summary: >-
  Synthesizer firmware that grew out of SLOOP: one instrument with 23 engines and 407 sounds, including
  a three-oscillator, two-filter HYBRID voice, a twelve-slot modulation matrix, four macros and a web editor.
description: >-
  Where SLOOP is a groovebox, Clipper is a single synth (two parts in MULTI mode) with no tracks, drum machine,
  song mode or built-in samples. It keeps SLOOP's twelve sound engines, effects, arpeggiator, step sequencer, USB
  audio and MIDI, and adds HYBRID, an opsix-style six-operator FMX engine, wavetable, vector and wave-sequencing
  engines, a Juno-style engine with chorus, a Plaits-style macro engine, physical models and more. Every engine
  gets a modulation matrix, a third LFO, a looping second envelope, a four-lane modulation sequencer, per-voice
  stereo spread, hall and shimmer reverbs and a tape delay. Tunings include just, meantone, maqam and Scala
  files, and the browser editor edits patches live, loads DX7 banks and your own wavetables and backs up the
  whole FM-1. The first two releases were labelled experimental; the README for 1.3 still lists more testing on real units as the
  main item still to do.
status: active
authors:
- name: isod89
  url: https://github.com/isod89
source: https://github.com/isod89/clipper-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Code is GPL-3.0-only; the icon atlas and panel image are separate assets (LICENSING.md). Includes msfa
  (Apache-2.0) for the FM6 engine and ports of DaisySP, Rings and CrispyZebra code. The bundled sample sets are
  CC0, except one electric piano set under CC BY 3.0 whose credit has to travel with it.
homepage: https://isod89.github.io/clipper-fm1/webapp/installer/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or the .fwsc from the release with tools/fm1_install.py; on Windows
  INSTALL-CLIPPER.bat builds and installs from source. Make a backup with the web editor first. The installer
  can write M-VAVE's V15 or V16 back when you pick M-VAVE's own file, which it checks by SHA-256 and size, and SLOOP can
  be reinstalled with INSTALL-SLOOP.bat. Projects, user presets and samples share SLOOP's flash areas. Newer FM-1 units carry
  a UC25HQ80 flash chip instead of the Puya P25Q80; 1.3.1 supports both, and on such a unit an older Clipper's update loader
  refuses 1.3.1, so return to the official firmware first and then install 1.3.1.
brick_risk: false
tags: [synth-engine, oscillator, wavetable, fm, filter, lfo, fx, reverb, delay, arpeggiator, sequencer, scales, midi, usb-audio, editor, physical-modeling]
versions:
- version: 1.3.1
  date: 2026-11-04
  url: https://github.com/isod89/clipper-fm1/releases/tag/v1.3.1
  notes: Adds support for the UC25HQ80 flash chip in newer FM-1 units; on those units earlier releases could not save projects, presets or settings and their update loader refused new versions. Nothing else changes.
- version: '1.3'
  date: 2026-10-30
  url: https://github.com/isod89/clipper-fm1/releases/tag/v1.3
  notes: >-
    Bug-fix release: clean note tails, unison voices that no longer start in phase, in-tune PHYS strings, editor
    backups that include user wavetables, and a Return to official firmware that accepts M-VAVE's V16 as well as V15.
- version: '1.2'
  date: 2026-10-28
  url: https://github.com/isod89/clipper-fm1/releases/tag/v1.2
  notes: >-
    First release without the experimental label; takes in SLOOP 2.8.3's fixes, so a held note keeps sounding under
    later notes, hardens the second core, adds an offline editor file and plays the EWI as one voice.
- version: 1.1-experimental
  date: 2026-10-20
  url: https://github.com/isod89/clipper-fm1/releases/tag/v1.1-experimental
  notes: Pre-release; fixes reverb crackle and adds MIDI program change, bank select and breath control plus the SLOOP 2.7.2 sequencer.
- version: 1.0-experimental
  date: 2026-10-19
  url: https://github.com/isod89/clipper-fm1/releases/tag/v1.0-experimental
  notes: Pre-release; first public release, from SLOOP.
