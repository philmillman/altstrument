device: m-vave-fm-1
name: CLOCKBOX
summary: >-
  Port of the ClockBox v3 MIDI master clock to the FM-1: 24 PPQN clock over USB and Bluetooth MIDI, quantized restart, two follow modes, tap tempo, three tempo presets and a sync pulse on the audio output.
description: >-
  A port of ClockBox v3 firmware 3.55 from socialmidi.com onto fm1-base. The FM-1 sends clock over USB MIDI and Bluetooth MIDI, because it has no MIDI out jack. Quantized restart re-syncs other gear on the next downbeat while the music keeps running. The two follow modes take clock from the TRS MIDI input or from USB. SEQ is tap tempo, SELECT and ALGORITHM change the tempo by 1 and 5 BPM across 30 to 300, FX, SEL and ENV hold three presets that jump or fade to a tempo, and OCT- and OCT+ nudge the tempo by 7.5 percent while held. The ClockBox's CV jacks become pulses on the audio output, with clock on the left channel and reset on the right. The original Arduino firmware is by Andy Fischer, whose GitHub account also owns this port, and the tap-tempo algorithm is re-implemented from Damien Clarke's MIT-licensed TapTempo library. The repository has no releases yet, and its README says the release build still needs some fields in fm1.toml filled in.
