based_on: m-vave-fm-1/fm1-base
distribution: source-only
install_notes: >-
  Clone with --recursive, run make venv and make toolchain, then make fw builds app/build/clockbox.fwsc (on macOS this needs Docker) and make install, or python3 base/tools/fm1_install.py clockbox.fwsc, writes it over USB. The README says the FM-1's mask-ROM recovery mode exists and that fm1-base's installer can put M-VAVE's firmware back. make host runs the simulator checks without a device. The settings are kept at flash offset 0xFC000.
