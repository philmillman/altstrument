device: m-vave-fm-1
name: COLLAPSE
summary: >-
  Physics drum machine for the FM-1: six synthesized instruments hang in a web of springs so that every hit pushes the others, with eight patterns, a performance mode with live effects and MIDI clock sync.
description: >-
  Inspired by the Anukari physics synth, the six instruments (kick, snare, hats, glitch, perc and bass) are each a mass on springs, one per knob. A hit makes the struck instrument jump to new parameters and shoves the instruments tied to it, and the springs pull everything back to the set sound, so no two hits are alike. Two macros, MASS and CHAOS, set the inertia and how the instruments are tied together. Pages cover each instrument's engine effects, how it is struck (mallet, pluck, bow or brush), a slow motion modulator, the springs themselves, a master section and general settings. Eight patterns have a track length for each instrument, so tracks of different lengths drift against each other. ARP turns on a performance mode with sixteen pads, mutes, live effects and four knobs that mutate the pattern. MIDI clock from USB or TRS drives the steps, and notes 36 to 41 play the instruments. All sound is synthesized; the README states there are no samples.
