device: m-vave-fm-1
name: Compás TEKNO
summary: >-
  Rights warning: the sample bank is cut from commercial sample packs. Compás rhythm firmware with a free-party tekno sample kit, 33 tekno grooves at 145 to 180 BPM, four bass voices and a black, green and yellow theme.
description: >-
  Rights warning: the replacement drum kit comes from commercial UFO hardtekno, tribecore and tribe190 sample packs, and the packed bank is committed in the repository and inside the .fwsc. The README says redistributing the audio may break the packs' licences and advises swapping in samples you have the rights to share before publishing or selling a build. Compás TEKNO keeps the engine, screens and workflow of Compás and changes what it plays. The TR-727 sounds are replaced by a 15-voice kit of kicks, a clap, a snare, hats, tribal percussion, a hoover stab, a pad stab and a break loop, and the 29 factory grooves become 33 tekno patterns built on four-on-the-floor or double kicks, offbeat hats and tribal sixteenths. The BASS page style knob chooses between a breathy flute, an acid voice, a three-oscillator ladder-filter voice after the Minimoog and a detuned trance lead. The interface and splash portrait are redrawn, and a browser emulator on the project site runs the firmware code with four extra lead scores. The README says the changes stay within the Compás engine and protocol. It is not a GitHub fork of Compás, and the repository has no releases.
status: active
