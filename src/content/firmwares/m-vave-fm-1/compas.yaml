device: m-vave-fm-1
name: Compás
summary: >-
  Compás is a bilingual Latin rhythm section for the M-VAVE FM-1: 38 source-labelled groove studies, 6/8 and 12/8
  support, cued song parts, TR-727 percussion, bass, effects, persistent shows and a browser editor.
description: >-
  Compás plays drums, bass and hand percussion as a band. Six song parts sit on the centre white keys; a cued part
  waits for the phrase, counts down the beats and comes in on the boundary, and ALGORITHM sets the next phrase to base,
  lift or break. The bass plays ensemble lines for each style or switches to an acid voice, and conga, maraca, timbal
  and bell layers are switched in and out from the black keys. A 727 page puts fifteen TR-727 percussion recordings on
  the pads with a rhythm bank, a sixteen-step editor, live recording and roll, and a KUMBIA page plays the four sounds
  and four patterns of Oficina de Sonido's Hanan Cumbia on their own or layered over the band.

  Version 1.3 has 38 source-labelled groove studies. The nine new ones cover Mexican Sureste, Pará, north-coast Peru, a
  Costa Chica 6/8 accompaniment and a 12/8 bell and block study. The README calls them accompaniment studies rather than
  claims to reproduce a whole regional practice, and their source notes mark published reductions, authored support,
  proxy voices and studies still awaiting local musician review. Compound-meter studies show dotted-quarter BPM while
  MIDI clock stays at 24 PPQN. Kumbia gets a LEVEL / NIVEL knob from 0 to 100, with OCT−/+ setting its sample clock in
  Hz, and the final digital output conversion is restored to full scale, a 6.02 dB gain correction. ROOM reverb,
  tempo-synced ECHO, GLUE compression, MIDI clock out and the Sideman reference carry over from 1.2.

  Written songs arranged from printed editions play from THE SHOW on the GLO page, with a melody guide, hold, coda and
  transpose, and Rebajada slows the whole band to 60 % with the pitch. Supported shows, user rhythms and Kumbia settings
  are kept across power-off in a CPS6 journal, which a firmware update clears. Big Beat Editor in desktop Chrome or Edge
  reads and edits tempo, feel, groove, energy, key, clave, the six band lanes and effects over USB MIDI. The English and
  Spanish packages hold the same bilingual instrument and differ only in the language shown at first boot; GLO and
  ALGORITHM switch it live. A browser player on the project site runs the same audio engine.

  History: version 1.0 (2026-11-08) had 29 groove studies and 28 written songs such as La Paloma, Cielito Lindo and
  Siboney, and lost the set list and user 727 rhythms at power-off. Version 1.1 added the KUMBIA page, whose settings
  reset at power-off, and 1.2 added the effects and the Big Beat Editor adapter.

