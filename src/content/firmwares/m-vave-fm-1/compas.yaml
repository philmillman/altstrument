install_notes: >-
  Use the author's installer page in desktop Chrome or Edge with the FM-1 on USB, and keep the cable connected through
  the write. Choose English or Español there; the release also carries compas-1.3-en.fwsc and compas-1.3-es.fwsc, and
  the firmware identity stays FM-1_92210003. A firmware update clears the CPS6 journal that holds shows, user rhythms
  and Kumbia settings, so export the show with Big Beat Editor before installing. The 1.3 qualification says the
  package writes only the application area (0x4000–0x92FFF) and a staging area, leaving the boot head and device
  identity untouched, and that the hardware recovery route shown by the installer does not depend on Compás. To return
  to official firmware, give an unchanged M-VAVE FM-1 package to the installer's return section. For 1.3, physical
  installs of both packages with transport, editor and MIDI-clock checks passed, and a return to a compatible installed
  firmware was verified. The exact 1.3-to-stock-V15 round trip, the panel knob and save/power-cycle checks, analogue
  output measurement and regional musician review are still open. The FM-1's mask-ROM rescue is the fallback.
brick_risk: false
