device: m-vave-fm-1
name: CONDUCTOR
summary: >-
  Orchestral groovebox with strings, woodwinds, brass and percussion parts, written on a piano roll or as sheet music,
  with articulations, dynamics curves, a hall reverb and a song arranger.
description: >-
  The orchestra is laid out as a conductor sees it, with high and low parts for strings (violins, cellos), woodwinds
  (oboes, bassoons) and brass (trumpets, horns), plus a percussion part of eight drums chosen from bass drum, cymbals,
  triangle, snares, toms and timpani. The README says the string, wind and brass sounds were measured from recordings of
  real instruments. Each melodic part plays up to three notes at once and can be set to tutti, solo or tacet. Every part
  has ten patterns, A to J, entered on a piano roll or in notation, or recorded live, and each pattern keeps its own
  expression, player count, vibrato, balance and con sordino setting. Articulations include staccato, accent, legato,
  marcato, trill, and pizzicato and tremolo for strings, and a pattern can carry a crescendo or diminuendo curve. The
  Composer chains patterns into ten pieces. Other features are eight time signatures, swing, humanise, tap tempo, key
  signatures with scale lock, four hall settings, a metronome with count-in, four save slots, MIDI in over USB or the TRS
  jack, and USB audio. A short overture is loaded at first start. The platform layer is Dinghy, and the notation code
  comes from QUARTET. The repository also carries an SMK-37 board layer from Dinghy, and its docs/SMK37.md describes how
  Dinghy builds for the SMK-37; the release has an FM-1 package only.
