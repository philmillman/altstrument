homepage: https://mammothcheese.github.io/conductor/
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install conductor-1.0.fwsc from the release with M-Flasher, after backing up the whole flash, or with tools/fm1_install.py
  over USB-MIDI. The unit then reports itself as FM-1_1812. To go back, restore the M-Flasher backup or install M-VAVE's
  official firmware. Holding OCT- while switching on starts a USB rescue mode. The README says installing is at your own risk.
