  and Rings parts are MIT and the fonts are SIL OFL 1.1. GR!MM's voice source and choir wavetables are not included.
homepage: https://saulofilho.github.io/coqui-fm1/
distribution: download
install_notes: >-
  Download coqui-1.0.fwsc from the release and install it with tools/fm1_install.py or any FM-1 web installer that
  takes a .fwsc; docs/BUILDING.md covers building it instead. Saves are separate from GR!MM's. The README points to the Firmware Hub's Rescue page, reached by
  holding OCT- while switching on, for a stuck unit.
