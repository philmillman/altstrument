install_notes: >-
  Build with docs/BUILDING.md, then install build/coqui.fwsc with tools/fm1_install.py or any FM-1 web installer that
  takes a .fwsc. Saves are separate from GR!MM's. The README points to the Firmware Hub's Rescue page, reached by
  holding OCT- while switching on, for a stuck unit.
