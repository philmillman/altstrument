device: m-vave-fm-1
name: COQUÍ
summary: >-
  Latin and Caribbean groovebox built from GR!MM: 22 synthesized percussion instruments, four kits, 14 rhythm styles
  that a track plays by itself, Latin bass and piano lines for the arpeggiator and 44 new factory sounds.
description: >-
  A new PERC source puts congas, bongos, timbales, guiro, clave, cowbell and kit drums on the keys, with knobs for
  kit, tuning, decay and a HUMAN control that makes each hit late, soft and slightly off pitch at random. GROOVE lets a
  PERC track play a whole style, among them salsa, bomba, plena, merengue, cumbia, bachata, dembow and perreo, split
  over parts with fills and swing. The arpeggiator can play tumbao, montuno and guajeo lines over a held chord. The rest
  is GR!MM: four tracks, a 64-step sequencer, song mode, effects, MIDI and a web editor and emulator. The README calls
  it version 0.1, in development, and says it has not been tried on a real FM-1.
