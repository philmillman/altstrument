device: m-vave-fm-1
name: CoralFlower
summary: >-
  Chord instrument for the FM-1, a fork of ChoralRoot FM-1 with its own chord keys, bass part, arpeggiator,
  eight-pattern sequencer, six effects, about 60 sounds and a pixel plant that grows from the chords you play.
description: >-
  Upper keys turn each scale note into a chord (major, minor, sus, 6, 7, add9 and combinations), in a Top or a
  Side key layout that each have a Lock mode, over 27 scales. A bass part with an octaver, a nine-pattern arpeggiator
  that follows the metronome or MIDI clock, a sequencer for chords, bass, layer and drums with a song mode, REC
  that records into a new pattern, and an ordered chain of filter, drive, chorus, phaser, delay and reverb sit on
  top of virtual-analogue and FM engines. A rhythm machine plays 23 ready-made drum rhythms under the chords, on six
  drum kits of CoralFlower's own beside the older ones. The home screen
  draws a flower or a coral whose parts follow the notes played. The author says it is inspired by the
  Telepathic Instruments Orchid. It keeps ChoralRoot's and Felucca's hardware layer and update loader, and
  the web page also runs the firmware in a browser emulator.
status: active
authors:
- name: Danil Tokarev (FicusFicusov)
  url: https://github.com/FicusFicusov
source: https://github.com/FicusFicusov/CoralFlower
source_status: open
license: GPL-3.0-only
license_notes: >-
  Built on ChoralRoot FM-1 and Felucca; inherited and bundled parts (Melodee, MSFA and Dexed, SLOOP, the
  Departure Mono font) keep their own licences (LICENSING.md, docs/LICENSING-choralroot.md). The release
  packages carry three unmodified JieLi AC79 SDK files under Apache-2.0.
homepage: https://ficusficusov.github.io/CoralFlower/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer in Chrome or Edge over a direct USB connection, with a browser emulator at /play/.
  If the FM-1 already runs CoralFlower, ChoralRoot or Felucca, the installer saves its sounds to a file first;
  the stock firmware's sounds cannot be backed up. The README says to get FM-1 V15 from M-VAVE and install it
  from the same page to go back to stock.
brick_risk: false
tags: [chords, synth-engine, performance, sequencer, fx, fm, midi]
