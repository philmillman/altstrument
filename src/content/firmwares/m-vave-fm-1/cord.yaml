device: m-vave-fm-1
name: CORD
summary: >-
  Chord instrument, groovebox and songwriting companion for the FM-1, a fork of CoralFlower first released as ChaseFlower: 130 progression ideas, Auto Harmony, contextual variations, a phrase editor, Chord Lab, saved songs, USB recording and a browser player.
description: >-
  Fork of CoralFlower, which is a fork of ChoralRoot and Felucca. The author released it as ChaseFlower in versions
  named 0.6-chaseN, which shared CoralFlower's package identity and were installed through CoralFlower's installer, and
  renamed it CORD with 1.0. It keeps CoralFlower's chord instrument, with a lower row of roots and an upper row of
  chord types, and adds a catalogue of 130 progression ideas that HOME browses and that set key, scale and metre. Nine
  HOME pages cover the core controls, sound, texture, groove, performance, looping, mixing, variations and keyboard
  and harmony. Auto Harmony stacks chords from the scale, and variations change harmony, arpeggio, drums, effects, sound or
  scale by a chosen amount with a way back. Other parts are thirteen arpeggiator modes, thirteen FX preset chains, a
  phrase editor of up to sixteen chord slots, Chord Lab for comparing chords, six saved songs, the latest three manual
  takes and USB capture of stereo audio and stems. The sound banks include 32 CC0 Aquanode DX7 voices. The screens show a small
  mascot, and a browser version runs the firmware compiled to WebAssembly. The progression catalogue includes chord
  excerpts based on commercial songs; the README says they are practice starting points and do not reproduce a recording.
status: active
authors:
- name: Chase DeAnda
  url: https://github.com/chasedeanda
source: https://github.com/chasedeanda/cord-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md puts CORD's own work under GPL-3.0-only, on CoralFlower, ChoralRoot and Felucca. The CC0 Aquanode
  DX7 voices keep their bytes unchanged, a few drum recipes adapt Melodee's GPL-3.0-only tables, the Departure Mono
  font is SIL OFL 1.1, and the packages carry three unmodified JieLi SDK files under Apache-2.0. The 0.6-chase1 to
  chase3 packages are also committed under releases/ in the repository, and none is an M-VAVE stock image.
homepage: https://chasedeanda.github.io/cord-fm1/
based_on: m-vave-fm-1/coralflower
distribution: browser-installer
requires_stock: M-VAVE stock firmware, CoralFlower, ChoralRoot or Felucca
install_notes: >-
  The CORD installer page, in Chrome or Edge over USB, picks the latest release, checks its checksum and also
  takes your own .fwsc. The README and releases say to save a backup first and that the official M-VAVE firmware can be
  reinstalled. The 0.6-chaseN packages go through CoralFlower's installer under its custom build option. The 1.0.2 and 1.0.3 release
  notes say that hardware acceptance, including install from V15, switching away and recovery from an interrupted
  update, has not been recorded on a physical FM-1.
brick_risk: false
tags: [chords, synth-engine, performance, sequencer, fx, drums, fork, usb-audio, midi, emulator]
