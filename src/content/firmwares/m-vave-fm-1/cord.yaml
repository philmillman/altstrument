versions:
- version: 1.0.3
  date: 2026-11-09
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v1.0.3
  notes: Changes the package identity to FM-1_26730001 (update mode shows ota-FM-1_26730001) because FM-1_936 sat inside another developer's reserved range on the Firmware Hub; earlier CORD and CoralFlower packages stay installable through the CORD installer. Backups, flash layout and two-chip support are unchanged. The notes say hardware acceptance is still pending.
- version: 1.0.2
  date: 2026-11-08
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v1.0.2
  notes: CORD gets its own package identity, FM-1_936, in place of CoralFlower's FM-1_930. The app and update loader accept both the Puya P25Q80 and the newer UC25HQ80 flash chips and refuse unknown ones; flash layout and saved data formats are unchanged. The release notes say hardware acceptance of this package is pending.
- version: 1.0.1
  date: 2026-11-08
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v1.0.1
  notes: Public renaming. USB MIDI now shows as CORD FM-1 and USB audio as CORD In, so the device has to be selected again in a DAW, and backups download as cord-backup files; old CoralFlower backups still load.
- version: '1.0'
  date: 2026-11-08
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v1.0
  notes: First 1.0 build. PLAY is green while running and orange while stopped, there are nine HOME pages, progression cues show only chord roots, harmony and drum variations go through the next-bar queue with undo, Auto Harmony defaults to on, and melodic and percussion voices get separate budgets.
- version: 0.6-chase13
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase13
  notes: HOME now cycles eight toolbars (Core, Sound, Texture, Groove, Perform, Loop, Mix, Harmony and Keyboard), the boot animation plays once, the boot chime is a longer rising strum, and the key lights show only chord roots. The release notes say the final chime and toolbar order still need review on a physical unit.
- version: 0.6-chase10
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase10
  notes: Adds an optional startup chime, switched under GLO, Display, BOOT SND, that a first played note cancels. The preceding 0.6-chase9 added a piano-key CORD boot screen, live matching of progression cards and round beat pulses.
- version: 0.6-chase8
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase8
  notes: Chord-first update with new native screens, a shared-clock accompaniment page, a sixteen-slot phrase editor, six saved song ideas, a Chord Lab for comparing chords, and the latest three manual recordings. The older bass and bonfire scenes are dropped from the default build.
- version: 0.6-chase7
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase7
  notes: Adds the HOME progression explorer with 100 ideas, contextual variations with undo, live auditioning of FX presets and a 3/4 Waltz groove.
- version: 0.6-chase6
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase6
- version: 0.6-chase5
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase5
  notes: Adds Auto Harmony under GLO, with smart chord modifiers on the upper keys.
- version: 0.6-chase4
  date: 2026-11-07
  url: https://github.com/chasedeanda/cord-fm1/releases/tag/v0.6-chase4
  notes: First combined release, with the bass and bonfire scenes, startup animation, diagnostics, sound banks, 6/8 grooves and six-channel USB recording.
