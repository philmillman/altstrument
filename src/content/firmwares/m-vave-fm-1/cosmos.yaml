device: m-vave-fm-1
name: COSMOS
summary: >-
  Drone synth played by the sky: sun height, cloud cover, air pressure, geomagnetic Kp index and moon phase shape two
  drones, and the screen draws the real stars, moon and planets over your location.
description: >-
  Two drones never stop, with an instrument above them. The weather chooses the pad (fifteen of them, by day or night),
  the moon chooses the voice of the stars, the Kp index sets the rhythm, clouds set the space and the sun height opens
  the filter. The sun, moon, planets and 500 catalogued stars are computed on the FM-1, so they work offline, and the
  screen shows the sky for the latitude and longitude you enter, with readings over it. Planets can be chosen as notes
  and chords, there is an arpeggiator that plays the stars and planets, and a browser build of the real firmware runs on
  the project site.

  The Wi-Fi feature runs on the FM-1 itself, with no companion page or app. The firmware starts the unit's Wi-Fi at
  power-on (Bluetooth is off), and the ENV key opens a Wi-Fi page where you pick a network and type its password with
  the panel controls; it remembers up to six networks. Once connected, and every half hour, it fetches cloud cover and
  pressure from Open-Meteo and the planetary Kp index from NOAA's Space Weather Prediction Center over HTTPS. Its design
  notes say the servers' certificates are not checked. REC on the Wi-Fi page turns it off, and without news for three
  hours the weather drifts by itself. The USB installer page is the only web part used. From 0.21 an FX RADIO page also joins a public MQTT broker
  (broker.hivemq.com, plain connection) to pair players and send note messages between units, with a web test player. The README still calls the
  project a design plus a test firmware (COSMOS PROBE), while the install page offers COSMOS 0.23.
