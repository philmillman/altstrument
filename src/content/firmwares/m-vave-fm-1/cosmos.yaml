homepage: https://gadlele.github.io/COSMOS/
distribution: browser-installer
requires_stock: V15, or a firmware with a compatible USB updater
install_notes: >-
  Web installer on the project site (Chrome or Edge over USB), after ticking a checklist that includes a backup of
  what you care about. COSMOS keeps only its own settings and known Wi-Fi networks. The installer's Back to the stock
  firmware option asks you to choose M-VAVE's V15 file that you downloaded, and M-UPGRADE also restores it.
