device: m-vave-fm-1
name: Crawl
summary: >-
  Dark generative ambient firmware forked from ZEN-1: four animated scenes (crypt, forest ruins, frozen lake, night sky)
  whose on-screen events sound the notes, with a browser emulator. Not yet flashed to an FM-1.
description: >-
  The README says Crawl has not been flashed to an FM-1, has no release and no installer, and
  that builds from the tree should not be installed on a unit the owner cares about. It runs in a host simulator and in a
  browser emulator, and builds from source.
  Each scene has four moods and a Long Night mode that moves through all of them over about two hours. Notes come from
  events in the picture, such as candle flames, falling leaves, ice cracks and meteors, in dark five-note scales over a
  breathing drone. Sound sources include a six-operator FM engine, a formant voice with choirs, physical models, a sampled
  ice groan and CC0 field recordings, with tape, delay, granular and plate reverb effects. The scenes, conductor and
  renderer come from ZEN-1 by aceyprime. The voice, physical-model, tape, delay and grain code is ported from GR!MM, and the
  platform layer comes from Felucca by way of X0X and FoMni. The simulator still carries ZEN-1's three scenes, which the
  FM-1 image leaves out.
