install_notes: >-
  No release or installer exists yet. The README asks users not to install a build from the tree until a release says the
  install and the restore of M-VAVE's firmware have been tested. Builds use the Docker or shell scripts in the repository
  and need JieLi's toolchain and three AC79 SDK files.
