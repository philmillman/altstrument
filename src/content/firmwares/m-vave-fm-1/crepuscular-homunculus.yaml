device: m-vave-fm-1
name: Crepuscular Homunculus
summary: >-
  Dark performance synth and four-track groovebox with 64 factory sounds, six-operator FM, metallic distortion,
  synthesized drum kits and pads, a reactive purple-and-green display, a piano-roll editor and 64-step tracks with four pattern banks.
description: >-
  Called TERKINSTEIN until 0.22.0-dev; the repository was renamed to Crepuscular_Homunculus and the creator is
  still credited as TERKINSTEIN. Derived from Dinghy with Felucca and SLOOP platform work. Tracks are drum, melody,
  atmosphere and bass, with live recording, a piano roll, saved song-wide swing, held notes, an arpeggiator, a
  metronome and MIDI notes, wheels and pedals. The home screen animates in response to playing. Eight voices are
  shared across the tracks, with at most four of them FM. The release notes say the retained 0.26.19-dev build
  passed hardware identity, V15 switching and transfer-recovery checks on an FM-1, and that the suffix-free
  0.26.19 build was not flashed during release preparation.
