install_notes: >-
  Download the .fwsc from the releases page and install over USB (docs/INSTALL.md), with the included tools/fm1_install.py. Back up songs and settings
  first and keep the previous .fwsc; the FM-1's updater cannot read back the installed firmware. Hold OCT- at
  power-on for USB rescue.
