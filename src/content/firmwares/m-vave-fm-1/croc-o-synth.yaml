device: m-vave-fm-1
name: Croc-O-Synth
summary: >-
  Kid-oriented teaching synth on fm1-base: a crocodile character explains wave shape, envelope and LFO, one lesson per button, with
  presets and a saved My Croc sound.
description: >-
  Written for a child, the firmware maps synth ideas to a crocodile: EDIT is Teeth (wave shape, unison rows and detune), ENV
  is Open, Relax, Hold and Close, LFO is the tail wag, the ALGORITHM knob is the filter, and OCT selects one of three
  sizes. Five presets and a saved My Croc sound are chosen with the PRESETS knob, the croc is named on first start, and up to
  four notes play at once. FX has swamp echo and cave reverb knobs, and a SEQ page plays eight lily pads with a note on each or eight nursery-tune songs, REC has the croc listen to a tune and sing it back, and SAVE has twelve challenges with stars. The code is new, written
  against fm1-base's interface, and the PROVENANCE file lists what was read from Felucca for hardware facts only. A browser
  prototype of the panel is included, and since 2026-11-16 the firmware itself is also built for the browser and published as a Pages site. The changelog reports builds 1 to 6, 8, 9 and 11 installed on a real FM-1, and builds 7, 10, 12 and 13 not yet reported or installed. A GitHub Actions workflow builds each main commit and replaces one rolling release named latest, which holds the
  installer package.
