device: m-vave-fm-1
name: CRT-4
summary: >-
  Four-track groovebox that plays the sound chips of nine game consoles and home computers, each with two drum
  kits, sixteen sounds, its own effects and a screen dressed as that console.
description: >-
  The consoles are the Atari 2600, Commodore 64, NES, PC Engine, Genesis, Game Boy, SNES, PlayStation and N64.
  Track one is drums and the other three take any of the console's sounds, which a program in the source
  generates by modelling the instrument and stores in the console's own sample format. Each console keeps its
  own song of sixteen patterns chained to 64, with chords, swing, locks, slides, ratchets and 16 punch-in
  effects, plus a demo song, MIDI in and out and MIDI clock. On the four chip-based consoles a track plays one
  note at a time and chords are arpeggios. It is built on LCD-4, IND-1 and AMB-1 and the Felucca platform layer,
  and shares its settings and song storage with other firmwares of that family. The README reports CPU and
  frame-rate measurements on an FM-1.
status: active
authors:
