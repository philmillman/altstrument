device: m-vave-fm-1
name: CTL-1
summary: >-
  Turns the FM-1 into a MIDI master controller: 4 CC banks on the knobs, program change, scale keys with
  chords, arpeggiator and a 4-track Euclidean drum sequencer, plus General MIDI sounds of its own and Bluetooth MIDI.
description: >-
  Release 1.0 adds Bluetooth MIDI: the FM-1 shows up as "FM-1" to a computer or tablet and can connect to
  Bluetooth MIDI devices, with everything played going out over USB and Bluetooth at once. The release carries a
  second, USB-only package without Bluetooth. Earlier releases were USB-only (USB MIDI plus TRS MIDI in) because
  JieLi's binary-only Bluetooth libraries could not ship with a GPL-3.0 firmware; 1.0 moved to the MPL-2.0 fm1-base,
  which the release notes say allows it.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-ctl
source_status: open
license: MPL-2.0
license_notes: >-
  Release 1.0 moved to the MPL-2.0 on fm1-base; earlier releases were under the GPL-3.0.
homepage: https://charlesvestal.github.io/fm1-ctl/install/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer, which can put M-VAVE firmware back; an FM-1 that fails to start twice comes
  up in a safe mode the installer can reach. Firmware file also on the releases page.
brick_risk: false
tags: [controller-mode, midi, usb-midi, sequencer, drums, chords]
image:
  url: https://raw.githubusercontent.com/charlesvestal/fm1-ctl/main/docs/img/screen-play.png
  alt: "CTL-1 Play page on the FM-1 screen"
  credit: "Charles Vestal"
  source_url: https://github.com/charlesvestal/fm1-ctl
  first_party: true
