install_notes: >-
  Web installer in Chrome or Edge over USB, or build from the folder (BUILDING.md). The README says it is
  untested on hardware and that HYP-1 or M-VAVE's firmware goes back on the same way. The installer can write
  M-VAVE's V15 back from a file you download yourself.
