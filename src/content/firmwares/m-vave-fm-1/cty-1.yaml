device: m-vave-fm-1
name: CTY-1
summary: >-
  Experimental generative firmware in which a small city builds itself on the FM-1's screen and plays chiptune, with cars as playheads, weather, disasters and a first-responder game; tested only in a simulator.
description: >-
  Each power-on founds a new town on new land (forest, desert, alpine, volcano isles, plains, beach or river
  lands), each with its own look, weather, disaster and sound. The town grows week by week into zoned districts,
  roads, bridges and landmarks. Cars drive real routes and act as the music's playheads, and the day, seasons,
  fires, quakes, robberies and festivals shape the music, which plays on NES, Game Boy or SID-style voices. The
  keys play a lead in the city's scale, and black keys call events on the Events pages. Behind SEL plus EDIT is
  a game in which the player drives a fire truck, police car or ambulance to calls. It takes MIDI clock in over
  USB or TRS, plays notes from MIDI in, and sends each chip channel's notes on its own channel with the city's
  state as CCs. It lives in the cty1/ folder of the HYP-1 repository and is a fork of AMB-1 by way of HYP-1,
  ECO-1 and GRAV-1. The README says it has been built and tested in the simulator and browser emulator only and
  is numbered 0.x until it runs on a real FM-1.
