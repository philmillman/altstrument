versions:
- version: 0.19.0
  date: 2026-11-18
  url: https://github.com/cursedsound-music/CS_FM1/releases/tag/v0.19.0
  notes: Adds a MODAL set of struck-sound modes in the ADD engine (marimba, kalimba, steel, tube, log and glass) with eight presets, and a set of 32 voices in eight groups that a Syntakt MIDI track picks with program changes. A new GLO > SYNTAKT 2 page sets how programs, following, held notes and touch behave, and tracks can be handed back to the FM-1 by hand. A note sent right after a program change now waits for the new sound to load. Saved projects, sounds, kits, favourites and settings from 0.18.x load unchanged.
- version: 0.18.5
  date: 2026-11-15
  url: https://github.com/cursedsound-music/CS_FM1/releases/tag/v0.18.5
  notes: Gives cursed os its own USB identity, FM-1_420, and adds the Firmware Hub card file and licensing text; nothing changes for an install.
