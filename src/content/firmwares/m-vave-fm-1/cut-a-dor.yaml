source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSE. Samples are CC0 (Sonic Pi, Karoryfer Gogodze Phu and Virtuosity Drums,
  Versilian VCSL), each listed with its source URL, and fonts are SIL OFL. The platform code and installer come
  from Felucca by Leo Kuroshita via X0X and AMB-1, GPL-3.0-only (UPSTREAM-LICENSING.md). The repository and
  recovery kit include a copy of M-VAVE's FM-1 V15 image, which matches the file M-VAVE licenses for
  redistribution (blob ce49cc1, 699,956 bytes); it is not GPL code. The JieLi SDK is fetched separately to build.
homepage: https://cut-a-dor.sugarypixie10.chatgpt.site/
distribution: browser-installer
requires_stock: M-VAVE V15
install_notes: >-
  Browser installer in desktop Chrome or Edge over USB, starting from M-VAVE V15 with no intermediate firmware.
  It checks the package fingerprint before writing and expects the identity FM-1_7010201 afterwards. The page
  returns the unit to V15, and the Recovery Kit adds a Mac rescue script for a unit that no longer answers over
  MIDI. Switching firmware can overwrite the project and user-bank storage, so export projects and keep your
  own sound banks first. The README says the unit has been tested by its author on one FM-1.
brick_risk: false
