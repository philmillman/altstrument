device: m-vave-fm-1
name: Cut-A-Dor
summary: >-
  Drum and break firmware with eight lanes of 32 editable steps, six styles, A/B parts, a recordable FX tape and
  76 factory sounds, plus a browser editor with sound-bank assembly.
description: >-
  Eight drum lanes carry 32 editable steps with velocity and timing nudges, lane levels and per-lane generation
  locks. Six styles and sixteen rhythm families set the pattern, with swing, humanised timing, evolving variation,
  A/B parts, intro, drop, outro and fills. The performance effects (roll, stutter, reverse, brake, filter, echo,
  crush, gate) can be recorded and overdubbed as a one- to eight-bar FX tape. The 76 factory sounds are 64 drum
  one-shots and 12 break arrangements, and three separate 80 KiB banks add 48 more hits. USB MIDI clock goes out
  with start, stop and continue, and USB or jack MIDI comes in. The browser editor runs the same engine for step
  editing, mixing, project files and WAV bounce, and its Sound Crate converts WAV files into sample banks that
  USB sends to the unit. Browser patterns cannot be sent live to the FM-1. The author describes it as tested on
  one unit, with the recovery paths not yet exercised on hardware.
