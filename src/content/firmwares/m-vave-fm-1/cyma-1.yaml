homepage: https://teg-lizard-man.github.io/cyma-1/
distribution: download
requires_stock: V15
install_notes: >-
  Each release attaches a .fwsc with its sha256; the repository holds none. Follow notes/INSTALL.md, the route every install
  so far took, from a Mac. The README says to back up the unit's full flash twice and keep three copies, keep the official
  V15 image, and never install V16, and warns that a power cut during the write can leave the unit dark or in ROM mode.
  BUILDING.md rebuilds the release package byte for byte from a fresh clone.
brick_risk: false
