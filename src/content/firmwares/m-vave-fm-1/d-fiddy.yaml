license: GPL-3.0-or-later
license_notes: >-
  NOTICE and the README state GPL-3.0-or-later and the LICENSE file is the GPL-3.0 text. PicoFaceD5 is GPL-3.0-or-later with the project's changes in patches/pvsc-fm1.patch, fm1-base is MPL-2.0, and the fonts are SIL OFL 1.1 and public domain. No Roland data is in the repository; a built .fwsc contains Roland's data and must not be redistributed.
homepage: https://github.com/lewhomusic/d-fiddy
based_on: m-vave-fm-1/fm1-base
distribution: source-only
install_notes: >-
  Put your own ROM dumps and patch banks in roms/, run ./run.sh gen and ./run.sh device, then ./run.sh install over USB. Building for the FM-1 needs JieLi's toolchain and three AC79 SDK files, and on macOS Docker. The README says installing replaces the firmware at your own risk and points to fm1-base for its installer and recovery.
brick_risk: false
