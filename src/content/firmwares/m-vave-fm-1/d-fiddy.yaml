device: m-vave-fm-1
name: D-FIDDY
summary: >-
  D-50 style LA synth: PicoFaceD5's engine on fm1-base with two tones, four partials, chorus and reverb, arp, sequencer and XY pages, D-50 SysEx and a librarian page. You build it from your own ROM dumps.
description: >-
  The engine is Michi71's PicoFaceD5, run on both cores at 32 kHz: 8 held notes in Dual and 16 in Whole. Two banks of 64 patches come from your own .syx files, and up to 24 edited patches are saved in flash. Pages show a D-50 style LCD, an arpeggiator, a 64-step sequencer recorded from the keys and an XY pad for the D-50's joystick, and the arpeggiator and sequencer follow MIDI clock over USB or TRS. The firmware answers the D-50's DT1 and RQ1 SysEx, and a companion page in Chrome works as a librarian and a PG-1000 style editor. The project says it is not affiliated with Roland, ships no ROMs and releases no firmware binaries, because every build embeds data converted from Roland's ROMs; the README asks that built packages not be shared and does not say where to find the dumps.
