  url: https://github.com/grant-vine
source: https://github.com/grant-vine/dabbl8
source_status: open
license: GPL-3.0-only
license_notes: Inherited from Felucca (LICENSING.md); the Felucca icon atlas, panel image and drum sample pack are excluded from the GPL.
homepage: https://github.com/grant-vine/dabbl8/blob/main/DABBL8.md
distribution: source-only
install_notes: >-
  No release or installer is published. Build from source (BUILDING.md). The project's install policy says a first
  Dabbl8 install resets the previous firmware's projects, autosave, settings, presets and samples, so back
  up first; Felucca's loader and recovery paths are unchanged.
