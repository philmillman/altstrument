device: m-vave-fm-1
name: Dabbl8
summary: >-
  Felucca fork in development that aims for eight sequencer tracks, more engines and expressive live play; an
  eight-track prototype exists but no release has been qualified on an FM-1.
description: >-
  The repository holds the firmware source, a long planning and evidence set under docs/dabbl8, host and target
  build checks and many small pull requests. Its plan document says an eight-track development prototype exists,
  that no Dabbl8 installation on a device or release qualification is claimed, and that the README on the main
  branch is still Felucca's. It plans eight logical tracks on the same eight shared voices, its own project
  format, a first install that clears the previous firmware's projects and settings, and a Dabbl-branded boot
  screen and colour themes. Nothing is published to install; a build needs the JieLi toolchain.
status: active
authors:
