versions:
- version: 0.22-beta
  date: 2026-11-25
  url: https://github.com/wissamsader/dabke/releases/tag/v0.22-beta
  notes: Each track's DELAY SEND and REVERB SEND now drive that track's own delay and reverb, with new starting values and a song-wide delay and reverb row on the EFFECTS page. Loops and the arpeggio play as the sound's PLAY mode says (LEGATO, MONO or POLY), settings save only when nothing sounds, and saves from 0.16 to 0.21 still load. Marked a pre-release.
- version: 0.21-beta
  date: 2026-11-25
  url: https://github.com/wissamsader/dabke/releases/tag/v0.21-beta
  notes: Turning a track's PITCH while its notes sound slides them to the new pitch, and each track gets its own CHORUS, which is the MIDImix's bottom knob. Marked a pre-release.
- version: 0.20-beta
  date: 2026-11-24
  url: https://github.com/wissamsader/dabke/releases/tag/v0.20-beta
  notes: Most buttons have new jobs. REC freezes the picked track's held notes, SEQ is the picked track's loop, EDIT held toggles step mode, and a held SEL with a white key picks a track. Adds a MIXER on the EDIT page, a three-band MASTER EQ, a per-track delay and reverb send, new MIDImix assignments and a new ink-and-red screen look. The notes tell players of 0.19 to read the manual's What changed in 0.20 first. Saves from 0.16 to 0.19 load.
- version: 0.19-beta
  date: 2026-11-22
  url: https://github.com/wissamsader/dabke/releases/tag/v0.19-beta
  notes: Pressing the key of a held note again stops that note at once while the others go on, and the same works from a MIDI keyboard. OCT- and OCT+ move held notes up or down an octave, a new sound on a track keeps its held notes, and with the arpeggio on a held note's key takes it out of the arpeggio. Saves from 0.18, 0.17 and 0.16 load as before.
- version: 0.18-beta
  date: 2026-11-17
  url: https://github.com/wissamsader/dabke/releases/tag/v0.18-beta
  notes: Adds a start-fresh page, reached by holding SAVE at power-on, that clears only DABKE's own saves. The maqam page shows notes inside the maqam white and notes outside it grey. Maqamat are now one line each in a header file. Saves from 0.17 and 0.16 still load.
- version: 0.17-beta
  date: 2026-11-16
  url: https://github.com/wissamsader/dabke/releases/tag/v0.17-beta
  notes: Every track keeps its own sound, with 22 ready sounds to select per track.
- version: 0.16-beta
  date: 2026-11-16
  url: https://github.com/wissamsader/dabke/releases/tag/v0.16-beta
  notes: First public beta.
