homepage: https://studiomorphik.com/dabke/install/
distribution: browser-installer
install_notes: >-
  Installer page in Chrome or Edge with the FM-1 on USB, or install dabke-X.Y.fwsc with any FM-1 installer. The package
  accepts both the newer (B36014) and older (856014) flash chips, but the README says only the newer was tried. To go back,
  install the other firmware the same way. Firmwares that keep saves in the same flash area can make DABKE start fresh when
  you return to it.
brick_risk: false
