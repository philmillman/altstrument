device: m-vave-fm-1
name: DABKE
summary: >-
  Arabic wedding keyboard with maqam scales and quarter tones on any note, dabke and shaabi rhythms, 22 ready sounds,
  pressure bends, eight tracks with a step sequencer and an Akai MIDImix as mixer.
description: >-
  DABKE plays maqam scales with quarter tones over rhythms such as maqsum, baladi, saidi, dabke, khaliji and chobi. Its
  voices include mijwiz, zurna, violin, ney, accordion, buzuq, oud and qanun, with a drone, trills, glides and automatic
  ornaments, and leaning on a key bends the note. There are eight tracks with loops and a step sequencer, each with its own
  sound, plus bass and backing from the left hand, an arpeggio, delay, reverb and a wedding PA effect. An Akai MIDImix on
  the FM-1's USB port works as its mixer. All sounds are generated by code, with no samples. The project is an app on
  fm1-base, and the README calls it a public beta tested on one FM-1 with the newer flash chip.
status: active
authors:
- name: STUDIOMORPHIK
  url: https://github.com/wissamsader
source: https://github.com/wissamsader/dabke
source_status: open
license: MPL-2.0
license_notes: >-
  Stated in the README and LICENSE. app/app.c and app/app.h began as fm1-base's template, and the package carries fm1-base
  and felucca-bsp (MPL-2.0), JieLi AC79 SDK files (Apache-2.0) and the Barlow Semi Condensed font (SIL OFL 1.1). No M-VAVE
  stock image is in the repository.
homepage: https://studiomorphik.com/dabke/install/
distribution: browser-installer
install_notes: >-
  Installer page in Chrome or Edge with the FM-1 on USB, or install dabke-X.Y.fwsc with any FM-1 installer. The package
  accepts both the newer (B36014) and older (856014) flash chips, but the README says only the newer was tried. To go back,
  install the other firmware the same way. Firmwares that keep saves in the same flash area can make DABKE start fresh when
  you return to it.
brick_risk: false
tags: [synth-engine, sequencer, performance, chords, arpeggiator, emulator, midi]
