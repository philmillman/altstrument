homepage: https://kong8la.github.io/xianqiang-fm1/
distribution: browser-installer
requires_stock: Flashes over official V15 or another FM-1 firmware; refuses M-VAVE's FM1 Open build
install_notes: >-
  Use the browser installer in Chrome or Edge with SysEx allowed, or run tools/fm1_install.py on a package from the release. The installer writes the app area and its own update loader, not the boot head at 0x0000-0x3FFF. Take a full flash backup with M-Flasher first. For recovery the README lists holding OCT- at power-on for USB rescue, download mode, and the mask-ROM USB key route with an RP2040 board.
