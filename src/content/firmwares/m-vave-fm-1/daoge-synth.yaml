device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: DaoGe Synth
summary: >-
  Six-voice physical-modelling instrument on Dinghy: plucked strings, struck bars, bells, membranes, bowed strings and wind, with 37 presets, a 16-step sequencer, arpeggiator and effects. README is in Chinese.
description: >-
  Eight engine families run in fixed-point code without floating point: plucked and steel strings, marimba and xylophone bars, bells, drums, bowed strings, clarinet and flute, and from 0.2 also koto, gong, organ pipe and bowed bar. Version 0.2 has 37 factory presets, eight user slots saved to two alternating flash sectors with a checksum, four edit pages (tone, effects, arpeggiator, sequencer), reverb, delay and chorus, a 16-step sequencer with recording, an internal clock that sends MIDI clock and follows an external one, and a long list of MIDI controllers. The release page has an FM-1 package and three SMK-37 packages (Pro, Elite, MKE-P37); the README does not say whether any SMK-37 build has been run on hardware. The synthesis core in dsp/ and host/ is MIT, and the firmware linked with Dinghy is GPL-3.0-only as a whole. The repository carries the licensed M-VAVE V15 package in its installer folder for restoring stock; its blob matches the one in m-vave/fm1_open.
