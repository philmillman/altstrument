source: https://github.com/sparky480v/Dark-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md, which keeps PERF-1's chain (HYP-1, AMB-1, Felucca, Melodee's FM engine) and says the
  DARK-1 additions are GPL-3.0-only too. Fonts are SIL OFL 1.1. The JieLi SDK files that go into the package are
  read from your own SDK checkout at build time and are not in the repository.
homepage: https://sparky480v.github.io/Dark-1/play/
distribution: download
install_notes: >-
  Download the .fwsc from the release and flash it with an FM-1 installer page; the package carries its own update
  loader, so another firmware can be installed afterwards. PERF-1 keeps its own pieces and settings and does not
  read other firmwares' projects, so expect stored data to be lost when switching. Back up first and keep a way to
  put M-VAVE's firmware back.
brick_risk: true
