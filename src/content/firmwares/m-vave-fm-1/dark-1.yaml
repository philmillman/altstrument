device: m-vave-fm-1
name: DARK-1
summary: >-
  PERF-1 with its music replaced: sixteen dark genres of ten pieces each, a rewritten engine per genre, and Wander
  pages that make the music change on its own. The instrument and its controls are PERF-1's.
description: >-
  A modification of deamonSLINKY's PERF-1 that keeps its pages, screens, sequencer, auto-DJ, effects and project
  saving, and changes what plays. The genres are dark techno, horror, dark EDM, industrial, dark rave, cinematic,
  dark electro, dark trance, EBM, dystopian techno, industrial horror, dark synthwave, dark drum and bass, dark
  dubstep, ritual and experimental. Each has its own drum kits and patterns, bass, scales, chord habits, builds and
  breakdowns and latched effects, and the thirty FM voices are new. Wander, added in 1.0.1, is a pair of settings
  pages that move between pieces and genres, swap sounds, drift knobs and mute layers on a schedule you set; it
  leaves the kick and snare alone, does not touch stored pieces and does not keep its settings over a power cycle.
  The project page plays the engine in the browser with a preset picker. The README says it has been tried on one
  FM-1 only. The README and manual below the first section are PERF-1's and still describe its genre list.
status: active
authors:
