source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text; firmware-src/LICENSING.md keeps Felucca's terms: GPL-3.0-only overall, with the
  Felucca-Engines files MIT, felucca-bsp MPL-2.0, the FM6 engine from msfa Apache-2.0, a DaisySP port MIT and the
  Inter Tight font SIL OFL 1.1. The README says the VSCO-2 CE and VCSL samples kept from Felucca are CC0.
homepage: https://drophlex.github.io/dark-funk-durcal-synt-fm1/web/DarkFunkDurcalSynt.html
based_on: m-vave-fm-1/felucca
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Open install/DarkFunkDurcal-Installer.html in Chrome or Edge with the FM-1 on a direct USB cable and press Install; the
  installer first saves a backup of the music. The same package is in install/ as a .fwsc for Felucca's tools. The
  installer can return to M-VAVE's official firmware (V15 or V16) from the official package. The README says to install
  at your own risk.
brick_risk: false
