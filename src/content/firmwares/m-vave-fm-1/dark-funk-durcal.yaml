device: m-vave-fm-1
name: Dark Funk Durcal Synt
summary: >-
  Felucca 1.8.2 with a groovebox layer for acid, breaks and rave: two blended styles fill all four tracks, a melody maker
  keeps notes in key, dice re-roll parts, plus time-stretch, a tape echo and an eye that reacts to the music.
description: >-
  Every sound and feature of Felucca stays. RITUAL blends two of eleven styles with FUSION and CHAOS and writes drums or
  a chopped break, acid, bass and melody into the four tracks. MELODY writes tunes in a chosen scale and key by shape and
  density, DICE re-rolls one part or all of them, and STRETCH time-stretches granularly to the tempo with a pitch
  shift of up to 12 semitones. A three-head tape echo sits on the delay, and the eye on the home page changes with
  tempo, density and distortion. There are ten acid, bass and pad presets on the analog engine and a 32-voice FM bank,
  also provided as a DX7 sysex bank. The repository adds a web groovebox, a web page that writes MIDI files into the
  FM-1 tracks and saves them back as .mid files, a pack of MIDI sequences, a bilingual English and Spanish manual and
  the complete firmware source with a patch against Felucca 1.8.2. The package has its own identity, FM-1_946, and keeps
  Felucca's update loader.
