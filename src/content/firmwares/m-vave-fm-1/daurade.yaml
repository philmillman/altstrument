homepage: https://delirioux.github.io/daurade/
distribution: browser-installer
requires_stock: V15 or Felucca
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, which also offers a test build from the dev branch. It
  keeps settings in Felucca's first two song slots, so back up anything made in Felucca first. The README says Felucca's
  or Tuna's installer, or M-VAVE's official V15, takes the unit back, and calls the build one with no warranty.
