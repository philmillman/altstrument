device: m-vave-fm-1
name: Daurade
summary: >-
  Generative groove firmware in ten styles, with a low-pass loop that opens over sixteen bars, a mix that ducks on every
  kick, a formant-synth robot voice and synthesized drums. Built on Tuna and Felucca.
description: >-
  Press PLAY and it writes a song in one of ten styles, five on the CHROME side (filter house, robot pop, shred, night
  drive, slow jam) and five on SESSION (disco, sequencer, funk, ballad, finale). Four knobs set the filter ceiling, the
  pump depth, how much of the robot voice sings, and density with drive. A song arc runs from intro through build, drop,
  solo and breakdown, DROP and SOLO buttons trigger those parts by hand, and the keys play a lead that snaps to the
  scale. Forty sounds run on Felucca's engines, the drums are seven one-shots synthesized by a script in the repository,
  and MIDI out sends the stabs, bass, lead and drums on separate channels. Settings and eight sets are kept in Felucca's
  first two song slots. A browser version runs the firmware.
status: active
