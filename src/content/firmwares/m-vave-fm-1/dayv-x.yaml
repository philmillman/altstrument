homepage: https://github.com/halfman73/dayv-x
distribution: download
requires_stock: Flashes over official V15 or another FM-1 firmware
install_notes: >-
  Download dayv-x.fwsc from the release and install it with Felucca's tools/fm1_install.py, which needs mido and python-rtmidi. The README says to charge the unit and keep M-VAVE's official V15 package to hand. If the unit does not start, hold OCT- while switching it on and install again, and M-VAVE's updater returns it to the official firmware. Installing is at the user's own risk.
