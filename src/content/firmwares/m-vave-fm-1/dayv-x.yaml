device: m-vave-fm-1
name: DAYV-X
summary: >-
  Felucca 1.8.2 with a drifting two-oscillator DRIFT engine, an AGE tape stage on the master, a dusty DUST drum kit with GRIT bit reduction, new FM and acid presets and a power-on setup of bass, pad, bell and drums.
description: >-
  Every Felucca sound and feature stays. DRIFT is a new engine with two oscillators, a sub and a low-pass filter, where each note starts a few cents off and each voice has its own detune LFO, plus wow and flutter per part; it has ten presets including two resonant acid basses. AGE is a master tape stage with WEAR and HISS controls that adds wow, flutter, saturation and treble roll-off. The DRUM engine gains a soft DUST kit and a GRIT control that holds each drum at a lower sample rate and bit depth, which replaces the KICK knob, so the round kick moves to MIDI note 35. FM6 gets bell, music box, chime and slap bass presets, four phrases are added under SAVE, PHRASES, and the display has a DAYV-X colour palette. The README says it has run on a real FM-1 with all four parts playing at about 55 percent CPU. It has its own host tests with golden renders for DRIFT and AGE.
