distribution: source-only
install_notes: >-
  Build build/dealornodeal-preview.fwsc following BUILDING.md (JieLi toolchain, AC79 SDK, espeak-ng, Docker on macOS) and
  install it with tools/fm1_install.py. Do not use --force. After repeated failed boots the FM-1 enters ROM mode, and
  tools/fm1_rescue.py needs M-VAVE's stock V15 package, which you supply yourself.
brick_risk: false
