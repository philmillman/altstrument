device: m-vave-fm-1
name: Deal or No Deal
summary: >-
  Game firmware: a Sega Genesis style Deal or No Deal on the FM-1, with 26 cases on the keys, pixel-art host, an FM and PSG
  chiptune soundtrack and a synthesized voice reading the banker's offers.
description: >-
  Cases 1 to 26 sit on the keys and light while closed; PLAY is Deal and SEL is No Deal, and the final round offers keep or
  swap. The art, music and voice lines are generated by scripts at build time, and the project states that no ROM or show
  assets are used; the voice is rendered with espeak-ng during the build only. It is built on FoMni's platform and so on
  Felucca's, replaces only the app region, and enters update mode when OCT- and OCT+ are held for five seconds. The README
  calls it an unofficial personal fan project, and there is no prebuilt package, so it has to be built.
status: active
authors:
- name: Kiwi3p
  url: https://github.com/Kiwi3p
source: https://github.com/Kiwi3p/fm1-deal-or-no-deal
source_status: open
license: GPL-3.0-only
license_notes: >-
