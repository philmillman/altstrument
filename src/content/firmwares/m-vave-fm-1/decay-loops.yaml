device: m-vave-fm-1
name: DECAY LOOPS
summary: >-
  Self-playing tape looper firmware for the FM-1 whose recorded phrases wear away as they play, after William Basinski's Disintegration Loops, with two turning reels on screen.
description: >-
  The firmware writes a phrase of a few chords, a figure or a slow melody, records it onto tape and plays it over and over. On each pass the tape wears: highs roll off, dropouts open and grow, pitch wobbles and hiss rises until only fragments remain, and before a loop is gone a fresh phrase records on another layer and fades in. The tape is 27 seconds of 8-bit mu-law at 11 kHz shared by all layers, holding up to two 12-second loops or four 6-second loops. The screen shows two reels, the tape scrolling past the head with its gaps and fading oxide, and the wear of every loop. The keys play notes that go onto the next loop, REC starts a new loop at once and EDIT holds the wear. Loop life runs from 15 minutes to 39 seconds. Fourteen presets set the tape stock and mood. The README gives the idea as inspired by Basinski and says no material from it is used.
