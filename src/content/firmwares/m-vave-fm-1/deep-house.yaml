device: m-vave-fm-1
name: DEEP HOUSE DECKS
summary: >-
  Self-playing deep house firmware for the FM-1 that generates an endless set of records at 118 to 124 BPM and shows a virtual DJ blending them on two turntables and a mixer.
description: >-
  Records have a four-on-the-floor kick, offbeat open hats, shuffled sixteenths, claps on 2 and 4, shaker, conga and rim, with minor ninth and eleventh vamps on Rhodes, organ or pad stabs, a rolling bass locked to the kick and now and then a lead hook or chopped vocal stab. Each record runs in 16-bar phrases of drum intro, groove, full, breakdown with the kick out, filter build and drop. A virtual DJ blends each record into the next on a phrase line by raising the new fader, swapping the bass on the low EQ, sweeping filters and moving the crossfader, while tempo holds and the next key is always a neighbour. The screen shows two spinning platters, a mixer with faders, EQ and filter knobs and meters, and each deck's record title, mix, section and phrase. Thirteen sets each keep their own settings and EDIT starts the next mix.
status: active
