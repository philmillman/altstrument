homepage: https://wisestwizard.github.io/deepfield/
distribution: browser-installer
install_notes: >-
  The project site has a Chrome or Edge installer over USB and a package (the handoff notes call the latest 0.4), which its installer can replace with
  M-VAVE's firmware. To build instead, build.sh deepfield needs a Linux container for JieLi's toolchain plus the AC79
  SDK, and fm1_install.py installs the package. The package identity is FM-1_1400. Holding OCT- at power-on opens
  update mode. Back up and keep M-VAVE's updater ready.
brick_risk: false
