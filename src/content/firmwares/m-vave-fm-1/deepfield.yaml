device: m-vave-fm-1
name: DEEP FIELD
summary: >-
  Ambient drone machine for the FM-1 on fm1-base: each key strikes a long-held body, with eight models, a noise layer,
  an ORBIT mode that moves notes on its own, a freezing hall reverb and 32 morphing scenes.
description: >-
  Eight bodies sound at once, drawn on the screen as beams over the keys, planets round a sun, a nebula or a radar
  scope. Four knob groups, MASS, DRIFT, SPACE and TIDE, shape all bodies together, and thirteen models can be mixed with a noise layer, with SCAN and DX voices among
  them. Effects are a delay of seven kinds, an ensemble and a hall reverb with freeze and shimmer, and scenes recall everything and crossfade into each other.
  MIDI runs over USB, TRS and Bluetooth in both directions, with MIDI clock in and out. Pocket Poly and GNOMNOM lived in the same repository until 2026-11-08 and have their own repositories now. The commit
  messages record a 1.0 package flashed on a real FM-1 on 2026-11-09, and the 1.3 package published and verified on 2026-11-10.
status: active
authors:
- name: WisestWizard
  url: https://github.com/WisestWizard
source: https://github.com/WisestWizard/deepfield
source_status: open
license: MPL-2.0
license_notes: >-
  The repository LICENSE is the MPL-2.0 text, and the README calls the choice proposed. The fm1-base platform and
  felucca-bsp are MPL-2.0. JieLi's SDK files used by the build are Apache-2.0 and are not committed.
homepage: https://wisestwizard.github.io/deepfield/
distribution: browser-installer
install_notes: >-
  The project site has a Chrome or Edge installer over USB and a package, which its installer can replace with
  M-VAVE's firmware. To build instead, build.sh deepfield needs a Linux container for JieLi's toolchain plus the AC79
  SDK, and fm1_install.py installs the package. The package identity is FM-1_1400. Holding OCT- at power-on opens
  update mode. Back up and keep M-VAVE's updater ready.
brick_risk: false
tags: [synth-engine, ambient, drone, reverb, delay, generative, ble-midi, platform, emulator]
versions:
- version: '1.3'
  date: 2026-11-10
  url: https://github.com/WisestWizard/deepfield/tree/1.3
  notes: Git tag; no GitHub release page. Takes the dead knobs and skipped values off the panel so every control does what the screen says, removes the clicks heard while turning knobs by sliding changes and blocking DC offset, keeps how long each note was held in a loop, and stops freezing the lowest note under a progression so the harmony can move.
- version: '1.2'
  date: 2026-11-09
  url: https://github.com/WisestWizard/deepfield/tree/1.2
  notes: Git tag; no GitHub release page. Holds notes across a chord change so the generator sounds like harmony moving, and gives ROAM its own MIDI control so the knob no longer fires the generator's trigger. Earlier commits since the previous row rework the volume law so MASTER also reaches what a computer records and rebalance the FM voice, mixer and echo knobs.
