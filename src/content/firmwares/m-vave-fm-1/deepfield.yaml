device: m-vave-fm-1
name: DEEP FIELD
summary: >-
  Ambient drone machine for the FM-1 on fm1-base: each key strikes a long-held body, with eight models, a noise layer,
  an ORBIT mode that moves notes on its own, a freezing hall reverb and 32 morphing scenes.
description: >-
  Eight bodies sound at once, drawn on the screen as beams over the keys, planets round a sun, a nebula or a radar
  scope. Four knob groups, MASS, DRIFT, SPACE and TIDE, shape all bodies together, and eight models (solar, void,
  glass, string, choir, bell, Shepard and fold) can be mixed with a noise layer. Effects are a tape delay, an
  ensemble and a hall reverb with freeze and shimmer, and scenes recall everything and crossfade into each other.
  MIDI runs over USB, TRS and Bluetooth in both directions, with MIDI clock in and out. It lives in the same
  repository as Pocket Poly, which is listed separately. The author's handoff notes record flashing builds on a real FM-1 through 2026-11-07, where the newest booted
  cleanly at about 5 percent CPU; the notes say the new SCAN and DX voices and the delay types have not yet been
  heard on the unit, and device CPU load with them is unmeasured.
status: active
