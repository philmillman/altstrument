device: m-vave-fm-1
name: Del Rio
summary: >-
  Hand-percussion rhythm box built on fm1-base: djembe, cajon, udu, clapsticks, maracas and triangle, 39
  rhythms, a capoeira bateria led by the berimbau, and tanpura and shruti-box drones.
description: >-
  Made for accompanying singing in a circle. The black keys play the instruments' individual strokes with
  velocity, and the white keys are a step sequencer for the selected instrument, with bars of 2 to 8 beats.
  PLAY loops the rhythm and REC records strokes onto the nearest step. The berimbau's page holds a capoeira
  roda's instruments (three berimbaus, caxixi, pandeiro, atabaque, agogô and reco-reco) with varying toques and a RODA
  ANGOLA rhythm that plays them together. The tanpura, the shruti box and the berimbau are each played alone from the FX
  page, and a drone keeps sounding under the rhythm; the two drones are synthesised, not sampled. The
  rhythms and toques are taken from published sources listed in the README. The project reuses Felucca's
  update loader, ships its own sample kit under mixed licences, and does not read other firmwares' projects
  or samples. It starts with a pixel-art animation of a maned wolf.
status: active
authors:
- name: jsopdebeeck
  url: https://github.com/jsopdebeeck
source: https://github.com/jsopdebeeck/fm1-delrio
source_status: open
license: MPL-2.0
license_notes: >-
  The code is MPL-2.0, as fm1-base is. The drum and percussion samples keep their own licences: CC0 1.0
  (VCSL, one Freesound caxixi), CC BY 3.0 and CC BY 4.0 (Freesound udu and berimbau recordings), so
  redistributing a build needs the credits in app/kit/CREDITS.txt. The opening artwork is the author's.
distribution: download
install_notes: >-
  Flash the .fwsc from a GitHub release with fm1-base's web installer in Chrome or Edge (Web MIDI), or take
  it from The Firmware Hub. Each release page lists a SHA-256. The firmware keeps its own settings and
  rhythms in a separate flash area. Builds inherit fm1-base's brick risk, so back up the device first.
brick_risk: true
tags: [drums, percussion, sequencer, synth-engine]
image:
  url: https://raw.githubusercontent.com/jsopdebeeck/fm1-delrio/main/docs/img/screens.png
  alt: "Four Del Rio screens: djembe step grid in orange, clapsticks in green, maracas in pink, and a yellow cajon sound page with sliders"
  credit: jsopdebeeck
  source_url: https://github.com/jsopdebeeck/fm1-delrio
  first_party: true
