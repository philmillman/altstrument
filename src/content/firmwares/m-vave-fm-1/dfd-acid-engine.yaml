device: m-vave-fm-1
name: DFD ACID ENGINE
summary: >-
  Acid pattern generator and sequencer on Felucca 1.8.2's drivers: a monophonic acid voice with a ladder filter, ten styles, DNA lock and a DIRTY page. It plays the patterns of its browser app, which also runs as a plug-in.
description: >-
  The repository holds one acid engine written as a single C++ header and used in three places: a browser app, a VST3 and AU plug-in in beta, and an FM-1 firmware. The voice is a band-limited saw and square with a sub, noise and a four-pole resonant ladder filter, with accent, slide, tie and drive. A generator writes patterns in one of ten styles and a chosen key and scale, and DNA lock keeps the notes, rhythm, accents or slides while the rest is regenerated. On the FM-1, PRESETS picks the style, ALGORITHM the sound, OCT+ generates, OCT- mutates and a DIRTY page on FX sets filth, pump, zap and width, and the firmware plays the web generator's own patterns note for note. The browser app adds a sequencer of up to 256 steps, nine tempo-synced effects, MIDI and WAV export and a TB-3 link over USB MIDI. The FM-1 build uses Felucca 1.8.2's drivers and update loader and is documented in English and Spanish manuals.
