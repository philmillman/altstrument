requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Open the installer at https://drophlex.github.io/DFD-ACID-ENGINE/fm1/install/ in Chrome or Edge with the FM-1 on a direct USB cable and press Install, after backing up the music. The release also carries the package as a .fwsc. The README says the installer can always return the FM-1 to M-VAVE's official firmware, which is the documented recovery. The installer page embeds only the DFD package; no stock image is committed to the repository.
