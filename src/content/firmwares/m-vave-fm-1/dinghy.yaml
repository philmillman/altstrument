device: m-vave-fm-1
name: Dinghy
summary: >-
  Minimal base firmware to build your own on: update path, USB rescue, USB MIDI and audio, panel, screen and
  settings working and documented, with a sine wave on top.
description: >-
  Classified as firmware rather than a tool because it is a flashable image (a 4-voice sine synth) that
  people copy and extend; it is tagged platform and sdk to mark its role as a starting skeleton. The README
  has a step-by-step build-your-own guide. Release 0.4 also builds for the SMK-37 (Pro, Elite and MKE-P37), which its
  notes say has not been tried on hardware.
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
source: https://github.com/zvenson/dinghy
source_status: open
license: GPL-3.0-only
homepage: https://github.com/zvenson/dinghy
distribution: browser-installer
install_notes: >-
  Installs from the FM-1 Firmware Hub listed on fm1-editor.com, or build and flash with the Makefile.
brick_risk: false
tags: [platform, sdk, usb-audio, usb-midi]
