device: m-vave-fm-1
name: DIRGE
summary: >-
  Felucca 1.6.1 fork for drones, noise and darksynth: adds BASS and DRONE engines, a tape and room-noise effect page,
  a ducking effect, dark scales, latch and key split, and a dark colour scheme.
description: >-
  Keeps Felucca's engines, 64-step sequencer, song chain and MIDI features and adds a mono darksynth BASS engine, a
  DRONE engine with detuned and supersaw-style oscillators, a TAPE page (worn-cassette colour, room tone, tape echo),
  a sidechain DUCK effect ported from Skiff, a very long VAULT reverb type, Phrygian dominant, Hungarian minor and
  double harmonic scales, a latch for held keys, a keys layer and split, and four colour palettes. Features
  borrowed from GHOULBOX, GR!MM and Skiff are credited in the README. The README says every addition is off, or
  identical to Felucca, until switched on, so Felucca projects and sounds still open. A browser emulator, a web
  editor and an installer that backs up the FM-1 first are published on the project site.
status: active
authors:
- name: sinscum
  url: https://github.com/sinscum
source: https://github.com/sinscum/DIRGE
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only as a whole (LICENSING.md), with Felucca's copyright retained. Felucca-Engines is MIT, and fonts, ported
  DSP and the JieLi AC79 SDK boot files carry their own licences (Apache-2.0, MIT, SIL OFL).
homepage: https://sinscum.github.io/DIRGE/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, which saves a backup of the FM-1's music, sounds, samples and settings
  first, or tools/fm1_install.py with a dirge-X.Y.fwsc package. Return to official V15 on the installer page takes the
  unmodified FM-1.fwsc that you download from M-VAVE, which it checks by size and hash; no stock file is bundled. If
  the unit does not start, hold OCT- while switching on for the USB rescue mode.
brick_risk: false
