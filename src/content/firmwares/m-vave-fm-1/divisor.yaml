device: m-vave-fm-1
name: Divisor
kind: firmware
summary: >-
  Felucca 1.8.2 fork that adds a DIVISOR engine modelled on a subharmonic polyrhythm synth, with two oscillators, four
  subharmonic dividers, a ladder filter and two four-step sequencers.
description: >-
  Divisor is planned to start as one more engine inside Felucca and end as its own instrument. The DIVISOR engine has two
  oscillators, four subharmonic oscillators that divide their cycles by 1 to 16, a six-channel mixer, a ladder-style filter
  with an attack and decay envelope, a second envelope on the amplifier and eight presets. A quantizer can snap the second
  oscillator's interval through four modes: off, 12-tone equal temperament, a just-intonation mode and an eight-step equal division. A sequencer for DIVISOR
  tracks has four rhythm dividers that can each advance either or both of two four-step pitch sequencers, which route to an
  oscillator and its subs over a range of one, two or five octaves. It runs on the song tempo or MIDI clock, and the other
  Felucca engines, parts and pages remain. The README says the project is at its early phases with nothing to install yet,
  and the repository's tests render the engine on a computer; no hardware run is documented.
status: active
