device: m-vave-fm-1
name: Doinua
summary: >-
  Music companion for the FM-1 that teaches while you play: a four-track song of chords, bass, melody and drums with key detection and adjustable help, plus Producer, Guided and Game modes. Early; not yet run on a real FM-1.
description: >-
  Doinua is Basque for melody, and the project began as fm1-scales. The FM-1 holds one loop of up to eight bars with four tracks, each of which can be played freely, played in the detected key, shown what to play, or played from one finger on a chord pad. Recordings are kept as played. Producer mode leaves everything open, Guided mode steps beginners through lessons, and Game mode has children play along with a unicorn or a dinosaur. The firmware draws on 41 sounds from seven engines, including ported fmini-1 and FM-106 (Juno) engines, and has a click with count-in, per-track MIDI channels, tuning and a screen timeout. An fm1kit API for screen, keys with velocity, sound, music theory, storage and MIDI sits under the apps, and the repository runs scripted checks on a PC simulator and on the real firmware inside the fm1-emu emulator. The README says the work is in its first phase and that nothing has been installed on a real FM-1 yet. The project says its code was written by AI agents under automated checks and that it began as one published commit without its earlier history.
status: active
authors:
- name: ekhve
  url: https://github.com/ekhve
source: https://github.com/ekhve/Doinua
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and the LICENSE file is the GPL-3.0 text. The board support files (device.c and app.ld) derive from felucca-bsp and stay MPL-2.0. The FMini engine is fmini-1's (GPL-3.0-only) and the Juno-106 engine is FM-106's (GPL-3.0-only), both ported. Felucca-Engines and fm1-emu are MIT, the Inter Tight font is SIL OFL 1.1, and each package carries three unmodified Apache-2.0 JieLi SDK files.
based_on: m-vave-fm-1/felucca-bsp
distribution: source-only
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  No release or published package. tools/setup.sh fetches the JieLi toolchain and SDK files on Linux x86-64, and factory/check.sh builds the .fwsc; the repository's CI also attaches built packages as workflow artifacts. The README installs it with felucca-bsp's fm1_install.py and says to back up first, keep a way back to stock V15 through Felucca's web installer, and expect update mode after two failed starts or OCT- and OCT+ held for five seconds. It also says nothing has run on hardware, so treat it as untested.
brick_risk: false
tags: [sequencer, chords, scales, synth-engine, drums, game, midi, emulator]
