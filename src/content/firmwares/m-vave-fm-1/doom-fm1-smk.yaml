device: m-vave-fm-1
name: Doom FM-1 / SMK
summary: >-
  Doom-engine game for the FM-1 with a nine-level campaign, sprites and synthesised sound, installed from a
  browser page that also restores M-VAVE's V15 firmware. Also builds for the SMK-37 Pro and Elite.
description: >-
  Built on doomgeneric and the Felucca hardware layer, using the second CPU core for audio. The levels,
  enemies and sounds are the author's own work on top of the Freedoom-derived Miniwad assets, so no commercial
  Doom game data is needed. The site has a firmware builder that downloads the application and a pinned base
  package and prepares the install in the browser, a browser simulator with FM-1 and SMK-37 control layouts,
  and a separate restore page. The game replaces the synth application and keeps no saves. Releases from
  07 on can be replaced again over normal USB. Separate from the FM-1 Doom and FM-1 Doom E1M1 entries, which
  are other people's ports. Its SMK-37 Pro and Elite builds have their own release line (smk-pads) and are not listed here.
status: active
authors:
- name: Chance Roth (ChanceTheMaker)
  url: https://github.com/ChanceTheMaker
source: https://github.com/ChanceTheMaker/doom-fm1-smk
source_status: open
license: GPL-3.0-only
license_notes: >-
  New code is GPL-3.0-only; the engine is GPL-2.0-or-later (doomgeneric) and Freedoom/Miniwad content is
  BSD-style. The classic DOOM logo (assets/branding/) is id Software's and is expressly outside the GPL and
  Freedoom licenses. Includes M-VAVE's FM-1 V15 image (FM-1_015.fwsc), which M-VAVE licenses under Apache-2.0
  in m-vave/fm1_open; the copy at site/restore-stock/ has the matching git blob ce49cc1. The repository
  carries no Apache-2.0 notice for that file; its Apache-2.0 text covers the JieLi SDK files.
homepage: https://chancethemaker.github.io/doom-fm1-smk/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15, or a firmware with a compatible USB updater
install_notes: >-
  Chrome or Edge over USB. The installer builds the package in the browser and checks the release
  identity after the restart. Releases 06 and earlier have no USB updater and need the recovery adapter once.
  The author warns that power loss or a defect can need hardware recovery. The restore page reinstalls
  M-VAVE's V15.
brick_risk: false
tags: [game, emulator]
