distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer on the project site, which serves a package named melodee-0.13.1-dr. The README is
  still Melodee's, and its plan file says it is a plan. Use Melodee's route back to M-VAVE V15 if needed. No
  numbered releases.
