device: m-vave-fm-1
name: DP3OYB
summary: >-
  Six-track performance groovebox forked from Felucca 1.9.0, adding per-track note hold, envelope retrigger, envelope
  destinations in the mod matrix, ADSR-shaped drums and a MIXER-first HOME button.
description: >-
  The repository is a copy of Felucca's source with its full history, plus a CHANGES_CUSTOM.md that lists the changes to
  1.9.0. Double-tapping OCT+ holds notes on the selected track after the keys are released, and double-tapping OCT-
  turns on envelope retrigger, which restarts the attack each time the envelope falls to silence while a note is gated
  and sustain is zero. Attack, decay, sustain and release can be mod matrix destinations, the drum engine now runs
  through the ADSR, and HOME opens the MIXER page before the HOME screen. The 1.0.0 release adds a start-phase parameter on the LFO pages, a keyboard view and scale LED filtering on the SCL page, and a TRIGS page graph of both LFOs. The source sets six parts where upstream sets
  four. The README is still Felucca's own, and the author's description calls the box a performance groovebox. A browser
  demo is linked from the hub card, but its page was not live when checked.
status: active
authors:
- name: DP3OYB
  url: https://github.com/DP3OYB
source: https://github.com/DP3OYB/DP3OYB
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is Felucca's GPL-3.0 text and LICENSING.md states GPL-3.0-only, as upstream. The engines (MIT), board support
  layer (MPL-2.0), ported DSP, fonts and CC0 samples keep their own licences. The release felucca.fwsc is the author's
  build, not an M-VAVE stock image. The repository also holds a 1 MiB felucca_flash.bin that is mostly erased flash.
based_on: m-vave-fm-1/felucca
distribution: download
install_notes: >-
  Download felucca.fwsc from the latest release and send it with a flasher that accepts custom packages (Felucca's
  tools/fm1_install.py is in the repository). Upstream Felucca's hosted installer installs only upstream's release.
  Felucca's Return to official V15 or M-VAVE's updater goes back to stock.
brick_risk: false
tags: [groovebox, sequencer, synth-engine, performance, fork]
versions:
- version: 1.1.0
  date: 2026-11-21
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.1.0
  notes: Holding EDIT on the USER or PROJECT page copies the current preset or project to the next empty slot, and the footer key reads RENAME. Fixes LFO2's phase parameter being ignored when SYNC and TRIG are both on.
- version: 1.0.9
  date: 2026-11-21
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.9
  notes: Adds a step record mode on a double tap of REC, where each key writes a note and moves on, OCT- adds a tie and OCT+ a rest. Each track remembers its own octave shift, and the last saved or loaded project loads at power-on.
- version: 1.0.8
  date: 2026-11-20
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.8
  notes: Adds a ROTA knob on K3 of TRACKS that rotates the step pattern in real time, audibly and on the grid.
- version: 1.0.7
  date: 2026-11-19
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.7
  notes: A layer button now latches open by tapping once and then pressing and holding it, so a quick double-click no longer latches, and a TAP or HOLD badge in the footer marks the buttons that have a hold layer.
- version: 1.0.6
  date: 2026-11-19
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.6
  notes: Tightens the OCT+ double-tap that holds notes and the OCT- double-tap that toggles envelope retrigger from 400 ms to 250 ms, and adds both gestures to the README.
- version: 1.0.5
  date: 2026-11-19
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.5
  notes: Fixes held notes cutting out when held across three or more tracks.
- version: 1.0.4
  date: 2026-11-18
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.4
  notes: Adds an oscilloscope trace inside the envelope graph on the ENV and ENV DEST pages, a tab strip between those pages and new envelope proportions.
- version: 1.0.3
  date: 2026-11-18
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.3
  notes: Renames and retunes six factory presets.
- version: 1.0.2
  date: 2026-11-18
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.2
  notes: Scale LEDs now always show on the SCL page while editing ROOT and SCALE.
- version: 1.0.1
  date: 2026-11-18
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.1
- version: 1.0.0
  date: 2026-11-18
  url: https://github.com/DP3OYB/DP3OYB/releases/tag/v1.0.0
  notes: Adds a start-phase parameter to the 1LFO and 2LFO pages, a two-octave keyboard view on the SCL page, scale LED filtering for non-chromatic scales and a TRIGS page graph of both LFO waveforms.
