device: m-vave-fm-1
name: DREADNOUGHT
summary: >-
  Jungle and drum and bass groovebox firmware with a Reese bass engine, break chopper, sampler, DX7-style FM, wavetable and Juno-style
  synths, an eight-track sequencer, song mode, a web editor and a plugin build.
description: >-
  Its own app on X0X's platform, started as a SLOOP 2.8.1 fork and rewritten from 0.3. Eight tracks hold any of the instruments:
  REESE, SUB (an SH-101-style bass), BREAKS and SAMPLER (loop chopping and one-shot or keyed samples), FM (a six-operator engine
  that plays DX7 voices), WAVE (a two-oscillator wavetable synth that can import Serum tables), JUNO and MIDI-out tracks. Each
  instrument has a sequencer page with eight patterns, conditions and retriggers, and a song mode chains patterns. Effects include
  tape and BBD echoes, springs and reverbs. A web editor and flasher run in Chrome or Edge, and an iPad build of the editor is a
  separate pre-release. From 0.44 the same app also runs as an AU, VST3 and standalone plugin. The release notes call it a beta not
  yet tested on a real FM-1, and the interface follows the layout of Native Instruments' Massive.
status: active
authors:
- name: TwistedGenetics
  url: https://github.com/TwistedGenetics
source: https://github.com/TwistedGenetics/DREADNOUGHT
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and LICENSE is the GPL-3.0 text. It credits Felucca (Leo Kuroshita), SLOOP and Clipper (isod89),
  X0X, FM-1-RE and M-VAVE's FM1 Open. The FM engine is a port of Dexed's msfa (Apache-2.0).
homepage: https://twistedgenetics.github.io/DREADNOUGHT/
distribution: browser-installer
install_notes: >-
  Open the web flasher in Chrome or Edge with the FM-1 on USB, back up, then pick a release from its list or a downloaded
  DREADNOUGHT-X.Y.fwsc. Or run X0X's tools/fm1_install.py from the repository. Read docs/RECOVERY.md first. Since 0.43 the update
  loader writes the first sector last, so an install cut off part-way leaves the unit in its loader instead of a dead black screen.
brick_risk: true
tags: [synth-engine, sequencer, drums, sampler, fm, wavetable, fx, lfo, editor, flasher, vst, fork]
