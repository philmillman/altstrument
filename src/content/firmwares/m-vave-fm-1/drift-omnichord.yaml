device: m-vave-fm-1
name: DRIFT (Omnichord drone)
summary: >-
  FoMni-1 fork that adds an ambient drone following the chord buttons and four Euclidean rhythm lanes, with the
  Omnichord-style strum plate kept on the white keys.
description: >-
  The black keys pick chords as in FoMni-1 and the white keys strum them, and the drone underneath follows the
  chord, either gliding to each new root or staying on a fixed pedal note. Drone pages set its mode, key, level,
  filter tone, glide time, detune spread, a slow filter and level swell, and a colour voice on the chord's third.
  Four Euclidean lanes (a low thump, mallet pings on chord tones, a shaker and a swell that opens the drone's
  filter) each have their own hits, length and rotation, so they drift against each other, and a Vary control
  roughens the timing and dynamics. Notes go out over MIDI on separate channels with clock while the pulse runs.
  FoMni-1's rhythms and pages remain, with its drums and auto bass off by default. The README has no prebuilt
  package: you push the repository to your own GitHub account and let its workflow build the firmware and an
  installer page. It is a different project from the DRIFT sequencer by FBNFRTG.
status: active
authors:
