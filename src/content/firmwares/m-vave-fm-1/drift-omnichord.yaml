source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md lists the origins: the platform layer is Felucca's code as carried by X0X and FoMni-1, the rhythm
  patterns, waves and drum sounds come from Chordian (CC0 1.0), and the fonts keep their own licences.
distribution: source-only
install_notes: >-
  Build with the repository's GitHub Actions workflow in your own copy (Pages source set to GitHub Actions), then
  install from the generated /install/ page in Chrome or Edge over USB, or with tools/fm1_install.py. The page also
  has a way back to the stock firmware. The README advises keeping M-VAVE's V15 file on your computer in case an
  interrupted install leaves the screen black.
