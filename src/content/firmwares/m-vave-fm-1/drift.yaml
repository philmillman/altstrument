  url: https://raw.githubusercontent.com/FBNFRTG/drift-fm1/main/web/site/assets/drift-sequence.png
  alt: "DRIFT sequence page on the 240x240 screen: white text on black showing direction, interval, chaos and time settings above a step grid with short note bars"
  credit: FBNFRTG
  source_url: https://github.com/FBNFRTG/drift-fm1
