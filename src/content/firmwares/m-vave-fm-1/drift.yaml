  date: 2026-11-02
  url: https://github.com/FBNFRTG/drift-fm1/releases/tag/v0.9.6
  notes: Replaces the sequence TIME setting with deterministic musical rhythms, shows per-note duration in the piano roll and keeps the playhead through live changes. Patches with TIME above zero play the new rhythm, patch and sample storage keep the 0.8 layout, and older firmware cannot reproduce all the new settings.
