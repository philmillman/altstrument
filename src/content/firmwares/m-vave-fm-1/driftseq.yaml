device: m-vave-fm-1
name: DriftSeq
summary: >-
  Planned 16-track polymetric MIDI sequencer for the FM-1. So far design specs, a C engine with host tests, a browser
  emulator and an in-progress firmware source tree; no prebuilt image is published.
description: >-
  Each of the 16 tracks has its own loop length, so the patterns drift against each other, and the home screen
  is meant to show that phase drift. Steps can be generated with Euclidean rhythms, per-step probability and
  conditional triggers, and the sequencer sends USB MIDI out to an external rig. The plan also includes an
  on-device General MIDI monitor using the Sonivox EAS engine. The repository holds the specs, the
  deterministic engine in C with host tests, and a WebAssembly build that drives a 240x240 emulator page with
  Web MIDI out. A firmware directory holds the FM-1 UI and platform code with a package-build script, but the
  README still lists the port to the FM-1 itself as the next step and no built package is published. The author's FM-1 port continues in a separate repository, listed here as
  DriftSeq (fm1-base). Specs are partly in Chinese.
