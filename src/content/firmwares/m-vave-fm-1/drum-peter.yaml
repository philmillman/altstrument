device: m-vave-fm-1
name: Drum Peter
summary: >-
  Drum machine for the FM-1 with 808, 909, 606 and 707 kits, eight built-in songs, a TR-style DRUM page (16 step keys, drum pads on the black keys, velocity and chance per step) and panel lights that blink in time; a variant of HYPNOTIC MIKE.
description: >-
  Drum Peter replaces the ARRANGE page of HYPNOTIC MIKE with a classic drum page: one row per drum, sixteen steps, the
  white keys as step buttons and the black keys as pads. Four tracks hold the 808, 909, 606 and 707 kits with eleven
  drums each. Velocity and chance are set per step, tracks run 16 to 64 steps, and the arpeggiator key rolls the drum.
  Eight songs (hypno, hard techno, electro, house, minimal, breaks, dub and boom bap) are loadable templates, and an
  empty project loads song 1 on start. SAVE opens a project menu to save, load a saved project, load a template or start
  a new one. The panel lights follow a set of blink codes that show the playhead, edited step, unsaved changes and
  mutes. The DX7, 303, PSG and pluck editors of FM1 Open are compiled out to make room; its step editor, drum sound
  editor, FX, mixer, MIDI and arpeggiator stay. The project was called 6210 Drum Peter until 2026-11-26, when it dropped
  the 6210 number. The README calls it a beta (0.2) that is tested on an original FM-1 with every build.
status: active
authors:
