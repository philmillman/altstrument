  url: https://github.com/orion-musica
source: https://github.com/orion-musica/6210-FM-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md states GPL-3.0-only with M-VAVE's additional permission to link the FM1 binary SDK, inherited from FM1 Open.
  The repository holds M-VAVE's sdk/lib/libfm1_engine.a under M-VAVE's separate terms for FM-1 devices, and
  sdk/firmware/FM-1_015.fwsc, which is the V15 image M-VAVE publishes under Apache-2.0 (git blob ce49cc15, identical to
  the one in m-vave/fm1_open). Other parts are listed in THIRD_PARTY.md.
homepage: https://orion-musica.github.io/6210-FM-1/
based_on: m-vave-fm-1/hypnotic-mike
distribution: browser-installer
requires_stock: stock V15 or any FM1 Open build
install_notes: >-
  Use the web installer on the project site in desktop Chrome or Edge over USB, and back up projects, voices and samples
  first. From stock V15 the first install needs the installer's force-flash option. The installer's Restore original V15
  choice goes back to stock. No release has been published yet; the README says the workflow publishes drum-peter.fwsc to a GitHub release when a version tag is pushed.
brick_risk: false
