device: m-vave-fm-1
name: Drumlab
summary: >-
  Drum machine with 16 sounds, 16 patterns and four lanes that imports Microtonic kits and sends kits, patterns and chains to a Pocket Operator PO-32.
description: >-
  Drumlab has three views. PATTERN holds the four lanes with accent, mute, solo, chain and punch-in effects, LAB edits
  each of the 16 sounds on pages of four settings with two patch sides (A and B), and SEND transfers the project to a
  PO-32 as audio. The project page reads Microtonic .mtpreset and .mtdrum files and Microtonic patterns dragged in as MIDI, and
  exports kits as Microtonic presets and drum patches, or as small .drumlab files. It also links several FM-1s over
  Bluetooth with Brothers Link, shared with Chipbox and Smileyface, where one unit leads tempo, sidechain, patterns and
  punch-in effects. A browser version runs the same code, and the site has a manual, tutorials and a cheat sheet. It
  builds on Chipbox, Dinghy and Felucca.
status: active
authors:
- name: Pasquale Barilla (pbarilla)
  url: https://github.com/pbarilla
source: https://github.com/pbarilla/drumlab
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README, LICENSE and LICENSING.md. The platform code is Felucca by Leo Kuroshita with SLOOP's changes,
  with wiring from Dinghy by zvenson and a Bluetooth stack from fm1-base and felucca-bsp. Fonts keep their own licences,
  and no JieLi SDK files are in the tree. PO-32 and Microtonic belong to their makers.
homepage: https://ihavenocluewhatimdoing.com/drumlab/
distribution: browser-installer
install_notes: >-
  Installer page on the project site in Chrome or Edge over USB, using Felucca's installer code; each release also
  attaches a .fwsc with a SHA256SUMS file. The README says to set Brothers Link SYNC to OFF before installing a firmware.
  It gives no notes on returning to stock.
brick_risk: false
tags: [drums, sequencer, groovebox, fx, sampler, ble-midi, emulator, fork]
