homepage: https://fc79.github.io/drumtonic/
based_on: m-vave-fm-1/dinghy
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Back up the flash first with the project's backup tool (docs/BACKUP.md), which writes nothing to the FM-1. Install from
  the project site in Chrome or Edge, or from the single-file installer attached to each release, or with
  tools/fm1_install.py. The first save overwrites the settings area that other FM-1 firmwares share. The installers never
  write the boot area (0x0-0x3FFF), 0xC0000-0xC1FFF or the unit's key at 0xFF000.
brick_risk: false
tags: [drums, sequencer, synth-engine, fx, reverb, delay, usb-midi, usb-audio, performance, web]
