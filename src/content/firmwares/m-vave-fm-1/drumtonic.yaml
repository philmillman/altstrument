device: m-vave-fm-1
name: Drumtonic
summary: >-
  Synthesised drum machine with ten channels, a 64-step sequencer with p-locks, conditions, micro timing and ratchets,
  beat repeat, and reverb, tape delay and master compressor, built on Dinghy.
description: >-
  Ten drum channels (bass drum, snare, clap, hats, toms, rimshot, cymbal) each combine an oscillator with a pitch envelope
  and a filtered noise source, with 24 controls per channel, three factory kits, 8 user kits and a library of 59 sounds
  plus 64 user slots. The sequencer holds 32 patterns of ten parts, each part 1 to 64 steps long, with per-step
  parameter locks, probability and cycle conditions, micro timing and ratchets, eight LFOs per pattern, knob-motion
  recording, chains and per-pattern kits. Performance features are beat repeat, note repeat and kit changes from the keys.
  Effects are a shared reverb and tape delay, and a master section with drive, filters and a compressor with sidechain
  filter and a look-ahead limiter. It takes MIDI over USB and TRS, sends clock, and appears as a USB audio input. The
  UI follows X0X and the effects follow 9W9, both credited in LICENSING.md. The project's logo is all rights reserved and
  is not under the GPL. The source also holds an SMK-37 board layer inherited from Dinghy, but the release package is the
  FM-1 build.
status: active
