license: GPL-3.0-only
license_notes: >-
  LICENSING.md keeps DUB-1's terms, GPL-3.0-only, inherited from AMB-1 and Felucca; fonts are SIL OFL. The repository holds small
  test .bin files (project saves for the simulator) but no firmware image.
distribution: source-only
install_notes: >-
  No release or installer page. Build as DUB-1 is built (BUILDING.md, build.sh, JieLi toolchain) and install with
  tools/fm1_install.py. DUB-1's own site and installer carry the original DUB-1, not this fork; that installer or M-VAVE's
  updater can restore stock firmware.
