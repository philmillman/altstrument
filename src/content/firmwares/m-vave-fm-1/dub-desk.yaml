device: m-vave-fm-1
name: DUB DESK
summary: >-
  Self-playing roots dub firmware for the FM-1 where a reggae band plays sixteen riddims while a virtual engineer mixes live with drops, echo throws, spring crashes and sirens.
description: >-
  The band plays sixteen original riddims at 65 to 80 BPM in a half-time feel, with one-drop, rockers or steppers drums, deep sub bass that carries the tune, off-beat guitar skank, organ bubble and now and then a melodica line or horn stab over one or two minor chords or a plain I-IV-V. The engineer mixes on bar lines: dropping to drum and bass, throwing the snare and skank into tape echo, swelling the feedback, kicking the spring tank, sweeping a high-pass and sounding a siren, then bringing the band back. The screen is the mixing desk with faders that move by themselves, echo blips riding a tape loop, a shaking spring tank and the riddim name on masking tape. FX throws the echo and LFO kicks the spring tank. Thirteen styles each keep their own settings.
