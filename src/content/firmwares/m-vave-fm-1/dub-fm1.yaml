  url: https://github.com/jmfk
source: https://github.com/jmfk/dub-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and ATTRIBUTION.md give GPL-3.0-only for the application code, with Dinghy, Felucca and SLOOP notices kept. The Terminus font is SIL OFL 1.1 and the JieLi SDK files are read from the builder's checkout.
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  The repository commits the prebuilt DUB-r39.fwsc under releases/r39 with a Python updater, manual_install.py, that checks the package and then writes it over MIDI, or it can be built from source with the toolchain and SDK in BUILDING.md. The scripts ask for confirmation and say not to run another updater at the same time. The package identity is FM-1_990. It is built on the Dinghy platform, which keeps its update loader and writes only the firmware area, so the FM-1's ROM boot mode remains the way back.
