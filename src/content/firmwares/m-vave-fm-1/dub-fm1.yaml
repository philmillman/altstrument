device: m-vave-fm-1
name: DUB R39
summary: >-
  Experimental dub-techno instrument with four tracks, up to eight oscillators per synth track, an eleven-part sample drum bank, a mixer, two delays, reverb, MIDI and a sequencer.
description: >-
  Rights warning: the eleven drum waveforms were supplied by the project owner, and ATTRIBUTION.md says no sample licence accompanied them and that the code's GPL licence does not establish rights to third-party recordings.

  The repository starts at revision R39 and does not import earlier history. DUB has four tracks, with the fourth carrying the sample drums, and routes modulation between them. R39 mixes drums on the second core while the first renders the synths, adds short voice-transition fades and the SLOOP master look-ahead limiter, and offers delay engines with a page-2 set of controls. A browser simulator uses the same fixed-point engine, and the repository has benchmark and profiling tools. The README calls it an experimental developer image and says local build, sanitizer and simulator checks passed while hardware performance and listening verification are pending. It is built on the Dinghy platform with SLOOP's dual-core code. It is a separate project from DUB-BOX.
status: active
authors:
