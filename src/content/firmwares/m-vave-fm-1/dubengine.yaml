device: m-vave-fm-1
name: dubengine
summary: >-
  Dub techno chord sequencer built on DUB-1: pick a key and mode, play scale chords with one finger, record or step-enter
  patterns with per-step locks, and run everything through a filter, tape echo and plate reverb.
description: >-
  Two chord tracks, A and B, plus a bass and an FM ping, for dub techno, minimal and microhouse. Only the keys of a track's
  root and mode light up, and each plays the triad the scale builds on it in root position or the first or second
  inversion. Patterns run up to 64 steps per track with live or step recording and per-step locks (chord, voicing, octave,
  length, level, cutoff and delay mix). Each chord track has its own synth with two oscillators a voice, a wavefolder, a
  resonant filter, four envelopes and two LFOs, a tape delay and an EQ, and both share a plate reverb. The README lists eight
  pattern slots and eight sound slots and a randomise function. The code is built on DUB-1, whose generative layers, panel and
  project code have been removed. The repository builds a browser emulator of the same code, which the project site hosts
  together with a web installer, and the README describes itself as a brief for continuing the work in a codespace.
status: active
authors:
- name: marwanfarha
  url: https://github.com/marwanfarha
source: https://github.com/marwanfarha/dubengine
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only, kept from DUB-1, AMB-1 and Felucca, and LICENSE is the GPL v3 text. The
  fonts are SIL OFL 1.1. The repository holds small test .bin project saves for the host simulator and no firmware image.
homepage: https://marwanfarha.github.io/dubengine/
based_on: m-vave-fm-1/dub-1
distribution: browser-installer
requires_stock: M-VAVE stock firmware V15 or DUB-1 (the README says it works from either and offers a way back to stock)
install_notes: >-
  Use the installer on the project site in Chrome or Edge with the FM-1 on USB, which takes about two minutes, or build with
  ./dev.sh build or build.sh and install with tools/fm1_install.py. No GitHub release exists yet. The README lists recovery
  steps: holding OCT- and OCT+ for 5 seconds enters update mode, two failed starts bring up a safe mode that the installer can
  still reach, a unit that shows only the WL82 UBOOT disk can be fixed with M Flasher or MvaveFM1Unbricker, and the Firmware
  Hub's rescue page covers the rest. The firmware accepts both FM-1 flash chips.
brick_risk: false
tags: [sequencer, synth-engine, fx, emulator, performance, midi, fork]
versions:
