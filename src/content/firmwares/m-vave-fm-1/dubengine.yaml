  notes: No tagged releases; this is the latest commit. Since the previous row, the commits add a synth for each chord track, delay and reverb pages, saved patterns and sounds, a web installer with its own identity, a black and orange screen with live pictures, and a lean engine with DUB 1's layers and panel removed. One commit message records a 0.1.1 step page for steps 17 to 32.
