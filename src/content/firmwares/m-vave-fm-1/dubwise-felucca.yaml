device: m-vave-fm-1
name: DUBWISE (Felucca fork)
kind: firmware
summary: >-
  Dub techno fork of Felucca 1.8.1 with a one-key chord-stab engine, a tape echo in place of the delay bus and a dub song that loads at power-on, plus new presets and phrases.
description: >-
  Keeps all of Felucca and adds the STAB engine, in which one key plays a whole chord (m7, m9, m11, fourths, minor, fifth, sus4, maj7, maj9 or octave)
  through a four-pole low-pass with its own decay envelope, with CUT, ENV, DEC and CHRD on the HOME knobs. The delay bus is replaced by a tape
  echo with wow and flutter, a stereo offset, a low cut, two low-pass poles in the loop and tape saturation, so feedback past about 100 percent runs
  away into a bounded howl, and ECHO THROW pushes feedback to 0.98. The song that loads at power-on uses STAB DUB M7, ANALOG DUB SUB, NOISE VINYL and
  a DRUM DUB KIT with patterns, a dotted eighth echo and a long dark hall. It adds eleven STAB presets, a tape-hiss sound and six phrases. The screen shows a cassette
  deck with reels that follow the transport. This is a different project from the catalogued DUBWISE by hatch-blip, which is a riddim-and-skank app on fm1-base.
