device: m-vave-fm-1
name: DUBWISE
kind: firmware
summary: >-
  Dub sound system for playing with a band: a riddim with bass and skank that follows MIDI clock, tape-echo throws, a spring crash and an auto-dub mode that makes the moves itself.
description: >-
  Drums, bass and skank run over four riddims (one drop, rockers, steppers, and a MIDI one with no internal drums). It follows incoming MIDI clock and transport from USB or the TRS input and carries on at its own tempo if the clock stops; the channels are set for an Arturia BeatStep Pro, and CC messages work the echo, filter, throw, freeze, siren and spring. The echo repeats can be shifted in pitch, the tape can be warped or frozen into a loop, and a phaser runs through the wet signal. Auto dub drops, throws and bends things at a settable rate. The keys play sub bass and chord stabs. It is an app on fm1-base. The README calls it a draft that has not been run on an FM-1; only the sound engine and the controls against a stub panel were checked.
