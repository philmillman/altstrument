install_notes: >-
  No package is published. build.sh expects fm1-base in base/ as a git submodule (it is not committed here; the script prints the commands), the JieLi toolchain and the AC79 SDK, then builds with fm1-base's build tool. fm1-base installs over USB-MIDI, and holding OCT- while powering on starts the USB rescue.
