  date: 2026-10-31
  url: https://github.com/oscillr/DUELL/releases/tag/v1.1
  notes: Every page redesigned; adds chord STRUM, chained MORPH rolls with undo, parameter locks recorded from knob turns and whole-pattern transpose and shift.
