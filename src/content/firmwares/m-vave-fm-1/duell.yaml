device: m-vave-fm-1
name: DUELL
summary: >-
  Bi-timbral synth built on Felucca: two simultaneous sound parts with their own engines, patches, effects,
  EQ and arpeggiators, in LAYER, SPLIT or STEREO modes, with patch morphing and about 100 factory sounds.
description: >-
  Developed emulator-first. The 1.1 release notes say it has run on two FM-1 units, both the author's, and that more than
  100 people have installed it through the Firmware Hub; the earlier notes reported the return to official V15 working
  about three times on one unit. 1.1 redraws every page and adds chord STRUM, chained MORPH rolls with undo, parameter
  locks recorded from knob turns and pattern transpose and shift. Recovery notes in docs/RECOVERY.md.
status: active
authors:
- name: OSCILL/R
  url: https://github.com/oscillr
source: https://github.com/oscillr/DUELL
source_status: open
license: GPL-3.0-only
homepage: https://oscillr.github.io/DUELL/emu/
distribution: browser-installer
install_notes: Installer page at oscillr.github.io/DUELL/install/ and docs/INSTALL.md.
brick_risk: true
tags: [synth-engine, performance, fx, midi]
versions:
