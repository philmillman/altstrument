device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: DUELL
summary: >-
  Bi-timbral synth built on Felucca: two simultaneous sound parts with their own engines, patches, effects,
  EQ and arpeggiators, in LAYER, SPLIT or STEREO modes, with patch morphing and about 100 factory sounds.
description: >-
  Developed emulator-first. The 1.1 and 1.2 release notes say it has run on two FM-1 units, both the author's, and that more than
  100 people have installed it through the Firmware Hub; the earlier notes reported the return to official V15 working
  about three times on one unit. 1.1 redraws every page and adds chord STRUM, chained MORPH rolls with undo, parameter
  locks recorded from knob turns and pattern transpose and shift. 1.2 shares one pool of up to 16 voices a part across both cores and accepts the newer UC25HQ80 flash chip. Since 1.3.5 the same release carries SMK-37 Pro, Elite and MKE-P37 packages, where both parts show on one screen and the keys split at F#4. Recovery notes in docs/RECOVERY.md.
status: active
authors:
- name: OSCILL/R
  url: https://github.com/oscillr
source: https://github.com/oscillr/DUELL
source_status: open
license: GPL-3.0-only
homepage: https://oscillr.github.io/DUELL/emu/
based_on: m-vave-fm-1/felucca
distribution: browser-installer
install_notes: >-
  Installer page at oscillr.github.io/DUELL/install/ and docs/INSTALL.md. From 1.3.5 the page picks the package for the FM-1 or for the SMK-37 Pro, Elite or MKE-P37 that you connect. The release notes give the way back to official firmware for the SMK-37 and docs/RECOVERY.md has recovery notes.
brick_risk: false
tags: [synth-engine, performance, fx, midi]
versions:
- version: 1.3.7
  date: 2026-11-22
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3.7
  notes: The source builds again on the Firmware Hub's VIBE FM converter. The release notes say nothing changes on the unit and that owners of 1.3.5 or 1.3.6 do not need to update.
- version: 1.3.6
  date: 2026-11-20
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3.6
  notes: GitHub now builds and signs every package from the release's source. The notes say nothing changes on the unit.
- version: 1.3.5
  date: 2026-11-20
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3.5
  notes: Adds builds for the SMK-37 Pro, Elite and MKE-P37, with both parts on one screen, the faders for level and morph, the pads as PERFORM effects, a keyboard split at F#4 and a start-up guide. On both devices PAN shows L 100 to R 100 and PERFORM DRIVE is never louder than the dry sound.
- version: 1.3.3
  date: 2026-11-20
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3.3
  notes: Each multi remembers its own ALGORITHM across power-on, an asterisk after the patch name shows an unsaved change, and HOLD stays as set when another sound loads. The CHORD list starts with MAJ, M16 becomes SLOW THAW and the patches and multis get a flat EQ except the basses.
- version: 1.3.2
  date: 2026-11-18
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3.2
  notes: Small update to the screen reader, which now says the names of patterns and multis when they are saved and reads the three rows of TOOLS. LOFI's AVAILABLE VOICES readout shows what LOFI really plays with everything on.
- version: 1.3.1
  date: 2026-11-16
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3.1
  notes: Adds screen reader support, in which Charles Vestal's FM-1 Screen Reader page, opened in Chrome or Edge with the FM-1 on USB, announces the screen, knobs, settings rows, messages and the first-start guide. The web emulator gets a screen reader section too, and without the reader page the firmware stays silent.
- version: '1.3'
  date: 2026-11-16
  url: https://github.com/oscillr/DUELL/releases/tag/v1.3
  notes: Adds MIDI presets for Novation Circuit Tracks and Akai MPC or Force chosen at first start, five macros (TIMBRE, ENV MACRO, FILTER MACRO, CHARACTER, MOTION) playable on HOME or over MIDI CC 56 to 62, user-chosen PERFORM knobs 2 to 4 and MORPH as a mod matrix target. SETTINGS is regrouped into seven sections and MIDI notes now follow the part's TRANSPOSE.
- version: '1.2'
  date: 2026-11-10
  url: https://github.com/oscillr/DUELL/releases/tag/v1.2
  notes: Both parts play from one shared pool of up to 16 voices spread over both cores instead of 8 a part, with an AVAILABLE VOICES readout, and FM6 plays up to 12 voices. Fixes crackle on chord starts and knob or MIDI moves, and lets FM-1s with the newer UC25HQ80 flash chip save and update. The installer finds any FM-1 whatever its MIDI port is called and can install other FM-1 firmwares.
- version: '1.1'
  date: 2026-10-31
  url: https://github.com/oscillr/DUELL/releases/tag/v1.1
  notes: Every page redesigned; adds chord STRUM, chained MORPH rolls with undo, parameter locks recorded from knob turns and whole-pattern transpose and shift.
- version: '1.0'
  date: 2026-10-22
  url: https://github.com/oscillr/DUELL/releases/tag/v1.0
  notes: First release after the betas; 128 factory patches, two filters on every engine and a MIDI CC map.
- version: 0.2.20 beta
  date: 2026-10-15
  url: https://github.com/oscillr/DUELL/releases/tag/v0.2.20-beta
  notes: Beta; adds a web editor, user wavetables and a 128-patch bank.
- version: 0.2.13 beta
  date: 2026-10-14
  url: https://github.com/oscillr/DUELL/releases/tag/v0.2.13-beta
  notes: Beta; adds the WAVE engine, PERFORM mode and a multimode filter on every engine.
- version: 0.2.4 beta
  date: 2026-10-12
  url: https://github.com/oscillr/DUELL/releases/tag/v0.2.4-beta
  notes: First firmware beta; earlier 0.1 beta was the emulator only.
