license: GPL-3.0-only
license_notes: >-
  LICENSING.md lists the parts it builds on: Felucca, SLOOP, Dinghy and X0X platform code (GPL-3.0-only), the Bluetooth stack
  (GPL-3.0-only OR MPL-2.0, used under GPL-3.0-only), felucca-bsp parts under MPL-2.0 and Apache-2.0, Inter Tight and Terminus
  fonts under SIL OFL 1.1, and JieLi SDK files under Apache-2.0. No stock M-VAVE image is committed.
homepage: https://mutant.cloud/#/p/dumbmidi
distribution: browser-installer
install_notes: >-
  Install from the mutant.cloud page or use the .fwsc package from the release that matches the model on the label, because
  the stock updater accepts only a unit's own package; building needs Docker (./fm1 build). Going back is done by installing
  the matching stock package from the Firmware Hub. For the SMK-37 the README advises backing up the unit's flash first,
  since it holds the factory key and pad calibration, which this firmware does not write. The README says installing
  unofficial firmware is at your own risk.
brick_risk: false
