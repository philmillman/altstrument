device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: DUMBMIDI
summary: >-
  MIDI controller firmware for the FM-1 and SMK-37 with a large chord and note display, on-screen mapping of every control,
  USB and Bluetooth MIDI out, an arpeggiator, chord memory, scale lock and a keyboard split.
description: >-
  The main page shows the name of the chord the held notes form in large type, with the note names, octave and active modes
  around it. Each knob, fader, button, wheel and pedal can be mapped on the screen to a CC, note, program change or pitch bend
  on its own channel, with two banks of knobs and faders. The arpeggiator has four patterns, five rates, one to four octaves
  and a tempo of 40 to 240 BPM with tap tempo. Chord memory stores a held shape and plays it from one key, and scale lock snaps
  notes to a chosen root and scale. A split sends keys below a chosen note on one channel and the rest on another. Everything
  goes out over USB MIDI and Bluetooth MIDI at once, and MIDI in on channel 16 colours the SMK-37 pads or the FM-1 key lights.
  The release has separate packages for the FM-1 and for the SMK-37 Pro, Elite and MKE-P37. The README says the Bluetooth stack
  has not been tested on an SMK-37. It is built with the author's foma framework on Felucca's platform and the fm1-to-smk37
  kit's SMK-37 layer.
