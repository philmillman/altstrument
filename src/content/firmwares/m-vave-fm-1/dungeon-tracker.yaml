device: m-vave-fm-1
name: Dungeon Tracker
summary: >-
  Felucca fork with a tracker-style sequencer, FM, wavetable, Amiga-style sample and SID-like engines, and a dungeon
  crawl on the home screen that the song plays.
description: >-
  Based on Felucca 1.6.1 and formerly called RE-1 and, before that, RONDO. The step grid and piano roll are replaced by a
  tracker with per-track screens, commands and sequence dice, and sound design has a dice page that rolls and holds
  parameters. Each of the four tracks is played by a class (rogue for drums, cleric for chords, fighter for bass, mage for
  lead) that fixes its voices and sound list, drawn from a 12-voice budget. Version 1.0.0 named its new engines FMKIT,
  FMTONE, WAVES (oscillators from Mutable Instruments' Ambika) and SID, with a lo-fi acoustic kit and a dungeon-sound
  kit, 96 more presets and extra CHIP presets. Version 1.5 regroups them into four families of two engines: FM
  (GENESIS, GEN KIT), wavetable (WAVES, WAVE 32), Amiga-style sampled (MOD, MOD KIT) and subtractive (ANALOG, SID). It
  retires FMTONE, CHIP, SAMPLE, GRAIN and PHYS, whose songs load on substitutes, and adds a dice on every engine,
  sound morph toward saved sounds, a bard that plays four voices, a choice of all eight classes for the party, and twelve
  monsters and five bosses. Other additions are a six-pattern bank with song mode, eleven whole-song
  slots with power-safe saves, an autosave three seconds after stop, sound morph, extra track and master effects and
  a power-on song written at random. The home screen shows a first-person dungeon in which the party fights as the
  song plays; it is optional. The package format and web editor are Felucca's. The manual says the 1.5 engines GENESIS,
  GEN KIT, WAVE 32, MOD, MOD KIT and ANALOG pass host tests and are new to the hardware.
status: active
authors:
- name: BourbonWX
  url: https://github.com/BourbonWX
source: https://github.com/BourbonWX/Dungeon-Tracker
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md, as for Felucca, whose copyright line it keeps. The Felucca-Engines submodule is MIT, and bundled
  ports and fonts keep their own licences (LICENSES/). The added drum samples are cut from CC0 sample libraries.
distribution: download
requires_stock: V15
install_notes: >-
  Download the .fwsc from the release page and install it over USB with tools/fm1_install.py. The README says to
  update to M-VAVE's V15 first and keep a copy of it, and that the unit has one firmware slot. Holding OCT- and OCT+
  for five seconds enters update mode, and two failed boots in a row do so on their own. Without that, recovery
  needs a separate RP2040 board. Songs saved in Felucca's project and sample slots 2 and 3 are not read by this
  build, and Felucca's USR2 and USR3 sample slots are retired.
brick_risk: true
tags: [tracker, sequencer, synth-engine, drums, fm, wavetable, chiptune, game, generative, fork]
