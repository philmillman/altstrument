device: m-vave-fm-1
name: DUODRONE
summary: >-
  Two-voice analog-style drone synth after the Stylophone CPM DS-2, with sync and pitch link between the voices, a two-output
  ultra LFO, a dark delay and an eight-algorithm reverb.
description: >-
  Each drone has a morphing X-WAVE oscillator from triangle to a narrow pulse, a sub-oscillator one or two octaves down and a
  resonant four-pole low-pass or high-pass filter that self-oscillates. A single ultra LFO has two outputs with 13 shapes each,
  routed per voice to wave shape, pitch or cutoff. The mixer takes USB audio from a computer as an aux input, a PT2399-style
  delay and a reverb with eight algorithms. There are eight factory presets and eight user slots, MIDI note input and 40
  parameters on CC 20 to 59. The README (in French) says it is a digital model rather than a copy of the circuit and is
  independent of Dubreq and M-VAVE. It is built on konsumer's foma framework.
