license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only, as Dinghy, with Felucca, SLOOP and SMK-37 board code under their own notices. The
  Terminus font is SIL OFL 1.1, and the chords, clips and factory tapes are the project's own with no samples.
homepage: https://joakimskurk.github.io/fm1dusk/
distribution: browser-installer
install_notes: >-
  Use the installer on the project page (Chrome or Edge over USB), which offers the latest build that passed its tests,
  or build with make fw and install build/fm1dusk.fwsc with tools/fm1_install.py, which asks before writing. The README
  says that if anything goes wrong, holding OCT- while switching on starts the USB rescue, where an installer always
  works.
