device: m-vave-fm-1
name: Dusk
summary: >-
  Lofi beat maker for the FM-1: four tracks of keys, bass, drums and lead built from clips, four scenes per tape, a song
  page and tape effects such as wobble, vinyl crackle and rain.
description: >-
  A tape has four scenes (A to D), and each scene has one clip on each of four tracks. The bank offers 14 chord
  progressions, 10 keys rhythms, 8 bass lines, 10 drum grooves and 8 toplines, with 8, 4, 8 and 6 sounds for keys,
  bass, lead and drums. SELECT moves the cursor, ALGORITHM picks a track's clip and PRESETS its sound. Chords are played
  on the keys, drum steps on the white keys, and a topline can be recorded or written step by step. Eight pages cover
  the lanes, chords, bass, drums, lead, tape and room effects, the song and a shelf of eight user tapes beside eight
  factory ones. Tempo, swing, wobble, vinyl, pump and lazy-snare settings are on the knobs, and MIDI in over USB and
  TRS plays the lead. All sound is synthesised. It is a Dinghy 0.5 app from the same author as VaveHero and FM-1 Clock,
  with a project page that runs the firmware in the browser. The README says it is version 0.1, tested on a computer
  and in fm1-emu and not yet tried on a real FM-1.
status: active
