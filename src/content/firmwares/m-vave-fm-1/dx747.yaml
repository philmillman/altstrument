device: m-vave-fm-1
name: DX747
summary: >-
  Multitimbral DX7 module for the FM-1 played over MIDI: up to eight parts, each with one to eight layered DX7 voices
  with note and velocity windows, shared effects, a master filter and stored scenes; no sequencer or sampler.
description: >-
  Built on M-VAVE's FM1 Open SDK at commit 4c7496d and using the SDK's closed DX7 engine; everything else, including MIDI
  routing, screens, scenes and SysEx handling, is code in the repository. A part is one MIDI channel with one sound, and a
  layer takes its own range, shift, level, pan and effect sends. Sixteen voices are shared between the eight engines. DX747.md says the
  routing, screens and scenes run in a simulator and host tests, that Bluetooth and USB audio were only checked by reading code, and that
  nothing has run on a real FM-1. It reports release V01 and its own update identity, and the name and logo refer to the Yamaha DX7 and a
  Boeing 747, with the project stating it has no connection to either company. The default branch is dx747.
