device: m-vave-fm-1
name: Earth Creature Beats
kind: firmware
summary: >-
  Five-part groovebox: a four-voice polysynth, a sample drum machine with eight kits, 808 and synth basses, a slicer and a four-track sequencer with patterns, scenes and a song chain.
description: >-
  Each part is called a creature and has its own button: OTTER the synth with 64 presets, CAT the drum kit, FOX the bass and 808 bank, HOPPER
  the slicer that can use the user's own samples, and BEAVER the sequencer of four tracks with 32 steps, probability, ratchets, eight patterns and a 16-slot
  chain. A home screen shows all five, a mixer holds levels, pans, effects and a master section, and eight scenes store pattern, preset, kit and mix.
  Generators write a groove on all tracks in one press. The factory samples are synthesised by scripts in the repository and released as CC0.
  The build is on fm1-base. The author flashes one of two units and the other stays stock, and the README has no hardware test report beyond the simulator audit.
  The repository is a personal project that writes a static site and installer for the firmware.
status: active
authors:
- name: SoulandCode69
  url: https://github.com/SoulandCode69
source: https://github.com/SoulandCode69/sfa-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0-only for the firmware and MPL-2.0 for the fm1-base platform, and the repository has no LICENSE file. docs/SAMPLES.md
  says the factory samples are original and released as CC0 1.0.
distribution: source-only
install_notes: >-
  Clone with submodules and build with fm1-base's build script and the JieLi toolchain, then install the package with its installer or from the
  Firmware Hub's install-from-file. The README says to try Felucca through the hub first, to return with the hub's back-to-official option, and to hold
  OCT- while switching on if the unit sticks. A tool writes user samples to a separate bank.
brick_risk: false
tags: [groovebox, sequencer, drums, sampler, synth-engine, generative]
