license_notes: >-
  GitHub shows no standard licence for the repository, but the README and LICENSE.md state GNU GPL version 3 only with M-VAVE's additional permission to link the FM1 binary SDK, inherited from FM1 Open. The repository holds M-VAVE's sdk/lib/libfm1_engine.a under M-VAVE's separate terms for FM-1 devices, and sdk/firmware/FM-1_015.fwsc, which is the V15 image M-VAVE publishes under Apache-2.0 (git blob ce49cc15, identical to the one in m-vave/fm1_open). Other parts are listed in THIRD_PARTY.md.
homepage: https://orion-musica.github.io/Echo-Ludwig-FM-1/
based_on: m-vave-fm-1/fm1-open
distribution: browser-installer
requires_stock: stock V15 or any FM1 Open build
install_notes: >-
  Use the web installer on the project site in desktop Chrome or Edge over USB, after backing up your FM-1 projects, since the game stores its progress in the place of project slot 15. No release has been published; the README says every push to main builds the firmware and installer in GitHub Actions.
