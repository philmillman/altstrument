device: m-vave-fm-1
name: Echo Ludwig
summary: >-
  Audio-first echo game for blind players on the FM-1: the unit plays a melody, you play it back on the keys and it grows each round, with spoken menus, 25 public-domain tunes remixed in five styles and light waves. Experimental.
description: >-
  Echo Ludwig replaces the FM-1 firmware with a memory game. A voice says listen, plays a short melody and signals your turn, and you repeat it on the keys. A wrong note gets a spoken higher or lower, the melody grows by one or two notes each round, and finishing a record earns stars and unlocks the next one. There are 25 public-domain pieces and traditional tunes in five crates (chiptune, house, trance, electro and hard techno), played as remixes with a built-in groove synth. Menus are read aloud by a small speech synth called Ludwig Voice, the screen stays black with one message for sighted helpers, and every press sends a light wave across the LEDs with limited screen flashes. By default every button does the same thing, short for select and held for back, so nothing has to be found by sight, and a Classic mode gives each button its own job. Progress is kept in the flash area of project slot 15. A browser version plays the game without hardware, and the README calls the FM-1 builds experimental first builds for device testing.
