device: m-vave-fm-1
name: ECO-1
summary: >-
  Experimental generative firmware in which a small plant plays music: three leaves fire notes as light and
  water charge them, a stem drones, and a changing day and weather shape the result; tested only in a simulator.
description: >-
  Eight plants, each with its own scene on the screen, respond to the time of day, rain, wind and drought. A
  leaf that reaches full charge plays a note in the scale set on the keys. It takes MIDI clock in over USB or
  TRS and sends each leaf and the stem on separate MIDI channels with the plant's signals as CCs. It lives in
  the eco1/ folder of the HYP-1 repository and is a fork of AMB-1 by way of HYP-1. The README says it has been
  built and tested in the simulator and browser emulator only and is numbered 0.x until it runs on a real FM-1.
status: active
authors:
- name: RedtailWorks
  url: https://github.com/RustyPawz
source: https://github.com/RustyPawz/fm1-HYP1/tree/main/eco1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in eco1/LICENSING.md. The platform layer is Felucca's by way of X0X and FoMni and the sound code is
  AMB-1's. Fonts are SIL OFL 1.1.
homepage: https://rustypawz.github.io/fm1-HYP1/eco/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or build from the folder (BUILDING.md). The README says it is
  untested on hardware and that HYP-1 or M-VAVE's firmware goes back on the same way. The installer can write
  M-VAVE's V15 back from a file you download yourself.
brick_risk: true
