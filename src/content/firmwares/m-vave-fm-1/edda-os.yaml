device: m-vave-fm-1
name: EDDA OS
summary: >-
  Felucca 1.7.0 fork for one artist's live set: thirteen preloaded songs, 16-WAV user drum kits, a fourth sample slot,
  chord and filter additions, a tempo that matches the decks, tempo bend and sequencer MIDI out with clock.
description: >-
  Built for the author's live performance of an album, with the album's songs loadable and cued from the keys, a
  Camelot-wheel key lock, a bank of rhythm patterns and a hard stop that re-enters on the one. Version 1.7.4-EDDA
  merges Felucca 1.7.0 and Felucca 1.8's flash and FM6 fixes (EDDA OS 1.1.5 was built on Felucca 1.1.5.1). It counts tempo at the FM-1's real sample rate
  and adds a TEMPO BEND on GLO with G#4 or A#4 that slows or speeds the set by about 4 percent. Other additions are
  user drum kits of 16 WAV pads built from the web editor, a fourth user sample slot, CHORD+ with voice leading and
  strum, a one-knob DJ filter per track, dotted delay times, a sequencer output on USB MIDI with clock and show cues.
  To fit the app slot, the device build leaves out the twelve visualisers, the USB serial console and 48 kHz USB
  audio; the browser emulator keeps the visualisers. The author's guide says the host tests pass and the package
  compiles with JieLi's toolchain on GitHub, and that 1.7.1 was installed on one FM-1 on 9 November 2026 and
  played its songs. Version 1.7.1 also accepts the newer UC25HQ80 flash chip, which the author had not seen tried on
  a unit that carries it. Since 1.7.2 the power-on screen shows the artist's own credit lockup and waits for a key press. Projects stay in
  Felucca's own format and EDDA OS 1.1.5's projects open.
