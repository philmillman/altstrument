homepage: https://github.com/mrsheez/felucca/blob/main/EDDA-OS.md
distribution: source-only
install_notes: >-
  The guide recommends a single HTML installer with the package inside, opened in Chrome or Edge with the FM-1 on
  USB (EDDA-OS-Installer-1.7.4.html); web/make_site.py --onefile makes it from a built package, and main holds no
  built copy. EDDA-OS.md also describes letting GitHub Actions build the package and publish an installer page from
  your own fork, or building with WSL2 on Windows and installing with tools/fm1_install.py. The CI writes its latest package to the ci-out branch. The installer's Return
  to official V15 and Felucca's own installer go back on a V15 unit; the guide says a V16 unit cannot go back to stock from this
  firmware yet and that installing is at your own risk.
