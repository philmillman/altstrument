  url: https://dmajka.github.io/elixir/shots/pattern.png
  alt: >-
    Elixir's pattern grid on the FM-1 screen, with tracks D1 to OH down the side, step dots across, a bar selector
    below and Tempo, Shuffle, Length and Volume knob cards.
  credit: dmajka
  source_url: https://dmajka.github.io/elixir/
  first_party: true
versions:
- version: 1.5.3
  date: 2026-11-24
  url: https://github.com/dmajka/elixir/releases/tag/v1.5.3
  notes: Autosave now counts a move of the master filter (Filt) as a change, so a drone's note is in the session after a power-off and loading a project warns that it is unsaved. Projects, kits and settings from 1.5.2 work as before.
- version: 1.5.2
  date: 2026-11-24
  url: https://github.com/dmajka/elixir/releases/tag/v1.5.2
  notes: Saves the master filter (FX > MASTER FILTER) with the project, so a RING drone's note survives a reload, and makes a hold of GLO open the mixer when Last page is on YES and CONFIG is the last GLO page. Projects from before 1.5.2 load with the filter off.
- version: 1.5.1
  date: 2026-11-22
  url: https://github.com/dmajka/elixir/releases/tag/v1.5.1
  notes: Brings back the 5/16 and 3/16 LFO sync values in place of 1.5's 8/1 and 16/1; anything saved in 1.5 with 8/1 or 16/1 loads as 4/1.
- version: "1.5"
  date: 2026-11-21
  url: https://github.com/dmajka/elixir/releases/tag/v1.5
  notes: Adds new projects from LOAD to PROJECT, a SAVE THEM FIRST? prompt, mute and solo on the mixer and CONFIG, a quick look at the mixer on GLO, clearer hints and a lighter processor load (core 0 about 73% to 61% in a busy project, with the overload warning moved to 95%). Projects, kits and settings from 1.4 work as before.
- version: 1.4.7
  date: 2026-11-19
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.7
  notes: "Steadies the MIDI clock sync: with BPM set to MIDI, the incoming clock is measured over a whole beat, so the tempo no longer jumps above about 90 BPM and synced delay and LFOs follow it."
- version: 1.4.6
  date: 2026-11-19
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.6
  notes: "A controller button sending CC 19 on the remote's GLOBAL channel reloads the kit and the playing pattern as last saved, as holding OCT- and pressing key 13 does."
- version: 1.4.5
  date: 2026-11-19
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.5
  notes: "The controller builder sends a template to any custom mode of a Launch Control XL 3 or Launchpad Pro MK3 without Components, with a backup optional. Adds mute and solo templates that toggle and effect buttons that play while held, and CONFIG > REMOTE > Mute/solo now defaults to TOGGLE."
- version: 1.4.4
  date: 2026-11-19
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.4
  notes: "Adds keyboard folding on KEYS: with a scale on the pattern the white keys play the scale on any track and black keys 1 to 7 pick the track. Track volumes no longer morph, so volume faders work at any morph amount."
- version: 1.4.3
  date: 2026-11-17
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.3
  notes: "Shows a thin bar on the grid for notes held past their step, and sets note length in steps (1/4, 1/2, 3/4, 1 to 64, AUTO, INF and TIE) in the track's own steps whatever its clock; older projects keep their lengths. Step edit gets pages STEP, TRIG, RATCHET and LOCKS."
- version: 1.4.2
  date: 2026-11-17
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.2
  notes: "Holding a step no longer changes it, so a held step can be locked across pages without losing or adding a note. CLEAR with a knob turn clears that knob's locks on the track, and CC 125 skips kit slots still named Init."
- version: 1.4.1
  date: 2026-11-15
  url: https://github.com/dmajka/elixir/releases/tag/v1.4.1
  notes: "Shows breadcrumbs under the title on the sound and FX pages, makes ENV, SCL and LFO open on their first page, keeps SELECT on the pressed button in the button settings, moves FX ROUTING next to the sends and simplifies the screen pictures. The project site lets you browse every page's screen, and the firmware has a new card on The Firmware Hub."
- version: '1.4'
  date: 2026-11-14
  url: https://github.com/dmajka/elixir/releases/tag/v1.4
  notes: "Adds a knob to pick the morph kit with SNAP and SWAP, up to eight locks per step, a dub-style SPRING reverb, a WEAR page for the whole kit, new global LFO destinations and a CHAOS wave, program change out and per-track rush CCs. Several effects and drum models use less CPU. Kits that use SPRING sound different, and projects from 1.3 load as before."
- version: 1.3.1
  date: 2026-11-11
  url: https://github.com/dmajka/elixir/releases/tag/v1.3.1
  notes: Fixes the master filter carrying the RING filter's Decay over as the Reso of the other filters. RING's Decay is now its own setting, so the LXR, ACID and MS20 filters keep theirs.
- version: '1.3'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.3
  notes: Records hits from a track's black key while REC is on and the pattern plays, like a drum pad, with a Quantize record option that can be turned off to keep the played timing. Adds a track nudge of up to 16 steps either way and puts a step's microtiming on the first step-edit page.
- version: '1.2'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.2
  notes: A track's black key now plays its voice as it selects the track, outside the PERF page and without recording the hit. Setting Audition to NO in CONFIG restores the silent select.
- version: '1.1'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.1
  notes: Adds SMOOTH and DRIFT LFO waves to every LFO, both gliding between random values, SMOOTH on a curve and DRIFT in small steps. Kits sent to an LXR-02 get RANDOM in their place.
- version: 1.0.1
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.0.1
  notes: Renames the DJ filter to the master filter; nothing else about it changes and projects load as before.
- version: '1.0'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.0
  notes: Adds CLOUD, RAIN and NOISE sound models, ACID, MS-20 and LADDER filters, a separate delay with sends and routing, a frequency shifter, 8-channel USB audio (stereo mix plus each voice), a fourth global LFO and an envelope follower, 12 more scales, and support for the UC25HQ80 flash chip. Removes four Plaits engines and some track inserts and the FX-bus drive to make room.
- version: 0.25.2
  date: 2026-11-03
  url: https://github.com/dmajka/elixir/releases/tag/v0.25.2
  notes: Makes LFO destinations easier to find, showing the full name and group on the LFO pages and turning the Dest knobs through the destinations in signal-path order. Track LFO parameters are renamed Dest, as on the global LFOs.
- version: 0.25.1
  date: 2026-11-03
  url: https://github.com/dmajka/elixir/releases/tag/v0.25.1
  notes: Release page has no notes. Releases 0.24.1 and 0.24.2, not listed here, added Wyrd data protection at power-on and the basic launch controls on the remote MIDI channels.
- version: '0.25'
  date: 2026-11-03
  url: https://github.com/dmajka/elixir/releases/tag/v0.25
  notes: Adds the ENSEMBLE model on every track, eight sines stacked from the voice's pitch, quantized to a scale and warped, at about 10% of the CPU each.
- version: '0.24'
  date: 2026-11-02
  url: https://github.com/dmajka/elixir/releases/tag/v0.24
  notes: Adds a CC map for pointing your own MIDI CC numbers at any parameter, a global MIDI channel that launches patterns and kits, and an install page that detects an FM-1 running Wyrd or Grimoire. Removes the P WTABLE model to free flash.
- version: '0.23'
  date: 2026-11-01
  url: https://github.com/dmajka/elixir/releases/tag/v0.23
  notes: Adds WANDER, a slow evolution of the pattern with eleven quests, plus POSTCARD, RUSH and TRANSPOSE performance controls, ten more arp orders and step lengths up to 64 bars. Removes three MICRO types for room.
- version: '0.22'
  date: 2026-11-01
  url: https://github.com/dmajka/elixir/releases/tag/v0.22
  notes: Gives Elixir its own firmware identity and adds a three-page cheat sheet.
- version: '0.20'
  date: 2026-10-31
  url: https://github.com/dmajka/elixir/tree/v0.20
