device: m-vave-fm-1
name: Elixir
summary: >-
  Port of the Erica Synths LXR-02 drum machine's sound engine and sequencer to the FM-1, with per-voice sends,
  Felucca's reverb, Rings and Plaits drum models, and a second-core voice renderer.
description: >-
  Six voices on seven tracks, 32 patterns of four bars with parameter locks, flams, rolls, Euclid and other
  pattern generators, morphing, songs, kits and projects, and MIDI in and out with clock sync. The LXR-02's
  floating-point DSP is rewritten in fixed point, and a host test renders each voice with both engines to compare
  them. Additions on top of the LXR-02 are per-voice FX and reverb sends, waveshapers, a bit reducer, tilt EQ,
  choke groups, cross-modulation, a phaser and flanger on the FX bus, MICRO model types from 0.17 (click, train,
  crunch, grain and others) that replace a voice's oscillators, seven filter types and per-pattern GROOVE templates from
  0.18, SPELLS for performance and the LXR-02's factory kits from 0.19, drum voices that can use ports of Rings
  resonators or Plaits engines, and a kit and sound library in flash. 0.20 adds three more MICRO types, per-pattern
  Voices, a Play mode and a song ROWS page. 0.23 adds WANDER, which changes the pattern slowly over minutes, plus RUSH and
  TRANSPOSE performance controls, and 0.24 adds a CC map for assigning your own MIDI CC numbers and a global MIDI channel
  for launching patterns and kits. 0.25 adds an ENSEMBLE model of eight stacked, warped sines. 1.0 adds granular CLOUD and RAIN voices, 303-style, MS-20 and ladder filters, a separate delay with routing, a frequency shifter and 8-channel USB audio. 1.1 adds SMOOTH and DRIFT LFO waves, and 1.3 records hits from the black keys like a drum pad. The keys can play a voice as an
  instrument. It was named Kettle up to version 0.13 and a unit running Kettle updates to Elixir keeping its
  projects. It is built on Felucca's hardware layer, USB stack and updater, and its flash data area is shared
  with Felucca, so installing it replaces Felucca's saved data. The project states it is not affiliated with Erica
  Synths or M-VAVE.
status: active
authors:
- name: dmajka
  url: https://github.com/dmajka
source: https://github.com/dmajka/elixir
source_status: open
license: GPL-3.0-only
license_notes: >-
  Derived from Erica Synths' GPL-3.0 LXR-02 firmware and from Felucca; NOTICE.md lists the other parts, among them
  Grids (GPL-3.0-or-later, used under GPL-3.0), Rings and Plaits (MIT) and the JieLi boot files (Apache-2.0).
homepage: https://dmajka.github.io/elixir/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  The install page (Chrome or Edge, USB) checks the device, offers M-VAVE's official V15 first, then Elixir, and
  can go back to V15; the package can also be installed with tools/fm1_install.py. The manual says to install
  official V15 before Elixir.
brick_risk: false
tags: [drums, sequencer, synth-engine, fx, performance, generative, emulator]
