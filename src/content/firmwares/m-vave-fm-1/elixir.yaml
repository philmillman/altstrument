  url: https://dmajka.github.io/elixir/shots/pattern.png
  alt: >-
    Elixir's pattern grid on the FM-1 screen, with tracks D1 to OH down the side, step dots across, a bar selector
    below and Tempo, Shuffle, Length and Volume knob cards.
  credit: dmajka
  source_url: https://dmajka.github.io/elixir/
  first_party: true
versions:
- version: '1.3'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.3
  notes: Records hits from a track's black key while REC is on and the pattern plays, like a drum pad, with a Quantize record option that can be turned off to keep the played timing. Adds a track nudge of up to 16 steps either way and puts a step's microtiming on the first step-edit page.
- version: '1.2'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.2
  notes: A track's black key now plays its voice as it selects the track, outside the PERF page and without recording the hit. Setting Audition to NO in CONFIG restores the silent select.
- version: '1.1'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.1
  notes: Adds SMOOTH and DRIFT LFO waves to every LFO, both gliding between random values, SMOOTH on a curve and DRIFT in small steps. Kits sent to an LXR-02 get RANDOM in their place.
- version: 1.0.1
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.0.1
  notes: Renames the DJ filter to the master filter; nothing else about it changes and projects load as before.
- version: '1.0'
  date: 2026-11-09
  url: https://github.com/dmajka/elixir/releases/tag/v1.0
  notes: Adds CLOUD, RAIN and NOISE sound models, ACID, MS-20 and LADDER filters, a separate delay with sends and routing, a frequency shifter, 8-channel USB audio (stereo mix plus each voice), a fourth global LFO and an envelope follower, 12 more scales, and support for the UC25HQ80 flash chip. Removes four Plaits engines and some track inserts and the FX-bus drive to make room.
- version: 0.25.2
  date: 2026-11-03
  url: https://github.com/dmajka/elixir/releases/tag/v0.25.2
  notes: Makes LFO destinations easier to find, showing the full name and group on the LFO pages and turning the Dest knobs through the destinations in signal-path order. Track LFO parameters are renamed Dest, as on the global LFOs.
- version: 0.25.1
  date: 2026-11-03
  url: https://github.com/dmajka/elixir/releases/tag/v0.25.1
  notes: Release page has no notes. Releases 0.24.1 and 0.24.2, not listed here, added Wyrd data protection at power-on and the basic launch controls on the remote MIDI channels.
- version: '0.25'
  date: 2026-11-03
  url: https://github.com/dmajka/elixir/releases/tag/v0.25
  notes: Adds the ENSEMBLE model on every track, eight sines stacked from the voice's pitch, quantized to a scale and warped, at about 10% of the CPU each.
- version: '0.24'
  date: 2026-11-02
  url: https://github.com/dmajka/elixir/releases/tag/v0.24
  notes: Adds a CC map for pointing your own MIDI CC numbers at any parameter, a global MIDI channel that launches patterns and kits, and an install page that detects an FM-1 running Wyrd or Grimoire. Removes the P WTABLE model to free flash.
- version: '0.23'
  date: 2026-11-01
  url: https://github.com/dmajka/elixir/releases/tag/v0.23
  notes: Adds WANDER, a slow evolution of the pattern with eleven quests, plus POSTCARD, RUSH and TRANSPOSE performance controls, ten more arp orders and step lengths up to 64 bars. Removes three MICRO types for room.
- version: '0.22'
  date: 2026-11-01
  url: https://github.com/dmajka/elixir/releases/tag/v0.22
  notes: Gives Elixir its own firmware identity and adds a three-page cheat sheet.
- version: '0.20'
  date: 2026-10-31
  url: https://github.com/dmajka/elixir/tree/v0.20
  notes: >-
    Git tag; no GitHub release page. Adds pattern Voices, a Play mode, a song ROWS page and three MICRO types after
    Curtis Roads' Microsound.
- version: '0.19'
