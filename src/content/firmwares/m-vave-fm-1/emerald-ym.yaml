device: m-vave-fm-1
name: Emerald YM
summary: >-
  Generative chiptune firmware with an emulated YM2612 FM chip, a Sega-style PSG and an endless sequencer, with live
  keys, per-instrument levels and effects, and USB audio capture of the mix.
description: >-
  A fork of DUB-1 that keeps its platform lineage. Five YM2612 FM voices and percussion through the chip's DAC channel
  run on the Yamaha chip emulator ymfm, alongside three PSG tone voices and white noise. A seeded sequencer writes
  melodies, bass, chords and changing arrangements, with tempo, density, mutation and transpose on the four knobs. The
  keyboard plays up to three live PSG notes over the backing. Twelve sources each have a level and independent DECAY,
  COLOR and ECHO amounts, saved to flash after three seconds without edits. The 0.7.0 release adds a GLO button that
  mutes the speaker and headphones while USB audio and MIDI continue, and 0.10.0 adds an EDIT mode that sends the
  keyboard and sequencer notes out over USB MIDI, 1.0.4 adds an 88-bar song mode, and 1.0.12 lets PLAY pause and resume the arrangement and REC restart it with a new seed. From 0.5.0 the FM-1 appears as a stereo 16-bit
  44.1 kHz USB audio input carrying the master mix, plus USB MIDI and a status interface. The project describes the
  music as original and inspired by the Mega Drive sound palette, with no game music or extracted samples, and says
  it is not affiliated with Sega, Yamaha or M-VAVE. Releases up to 0.10.0 are marked beta; 0.11.3 and 1.0.4 are marked
  stable, and 1.0.12 is not a pre-release. It does not import presets or projects from other firmware.
status: active
authors:
- name: Caspius Labs
  url: https://github.com/CaspiusLabs
source: https://github.com/CaspiusLabs/Emerald-YM
based_on: m-vave-fm-1/dub-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md: the combined firmware is GPL-3.0-only. The ymfm YM2612 emulator is BSD-3-Clause (Aaron Giles), and the
  original Emerald sequencer, PSG, effects and adapter code is MIT (LICENSE-emerald.txt). DUB-1, AMB-1 and Felucca
  platform code is GPL-3.0-only, the Terminus and Barlow fonts are SIL OFL 1.1, and the JieLi AC79 SDK files in the
  package are Apache-2.0.
distribution: download
requires_stock: V15
install_notes: >-
  Download emerald-ym-*.fwsc and SHA256SUMS from the releases page and install with tools/fm1_install.py (Python with
  mido and python-rtmidi); docs/INSTALLING.md has the steps. The README documents round trips with official V15 and
  Dinghy 0.3 for the 0.4.3 package and a USB disconnection test, and says interrupted-write recovery and
  preservation of other firmware's data are not established. Back up with your current firmware's tools first, and
  note that saving can overwrite another firmware's data in the project sectors.
brick_risk: false
tags: [generative, chiptune, synth-engine, sequencer, fm, usb-audio, usb-midi, fx]
