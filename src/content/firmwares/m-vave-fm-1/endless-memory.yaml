device: m-vave-fm-1
name: Endless Memory
summary: >-
  Shepard-tone synth for the FM-1 with a staircase sequencer: each note is eight partials that seem to rise or fall for ever, and a short phrase climbs one scale step per repeat.
description: >-
  Every note is a Shepard tone built from eight partials spaced by octaves, fifths, fourths, tritones, thirds or a stretched interval, under a moving bell of brightness, and CLIMB keeps them rising or falling without end. The staircase sequencer plays a phrase of up to eight notes that moves up or down by scale steps on each repeat, for a set number of repeats or endlessly. SEL freezes held notes like a sustain pedal that stays down, and a high-pass and a low-pass filter sit on the home page ahead of a parallel echo and a reverb called space. There are 26 scales with a root, an arpeggiator, an LFO, two envelopes, eight presets and MIDI in and out. The release notes say it has been tested on a computer and in the online FM-1 emulator only, and the README says installation and keeping settings across a power cycle still need checking on a physical FM-1. It is built on Dinghy.
