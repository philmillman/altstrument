homepage: https://github.com/jaak-stjaaques/Endless-Memory
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install endless-memory-0.5.1.fwsc from the release with M-Flasher or the M-VAVE updater, or build it with sh build.sh --release 0.5.1 and install it with tools/fm1_install.py over USB. The releases carry a warning that the firmware is untested on a real FM-1 and that another firmware should be kept ready to flash back. docs/BUILDING.md says Dinghy's USB rescue path is included.
