device: m-vave-fm-1
name: ENJAMBRE
summary: >-
  Swarm engine for the FM-1 in which insects act as agents moving in an orbital, quantum or atomic field, added to
  Felucca and installed from a browser page the repository builds. The text is in Spanish.
description: >-
  The repository holds only an overlay of files that change or add to Felucca at a pinned commit, and a GitHub Actions
  workflow that applies it, builds the firmware, tests the engine on Felucca's host harness and publishes a site with the
  installer, a browser simulator and an editor. The new ENJAMB engine gives each note a group of stridulating insects.
  Three fields move them: ORBITA, with one to three masses and a slight Doppler shift; CUANTO, a particle in a box where
  the insects follow the probability density and playing a note collapses it; and ATOMO, electrons in Bohr shells with
  hydrogen line ratios. Cricket chirps synchronise as coupled oscillators and keep a temperature-dependent rate. The
  engine reads the real processor load and adds or drops insects as it changes. Six presets ship (GRILLOS, KEPLER,
  LUCIERNAG, NUBE PSI, ATOMO H, CIGARRAS). The author is a university researcher, and the README says the software is experimental.
