homepage: https://capitanplaneta80-create.github.io/enjambre-fm1/
distribution: browser-installer
install_notes: >-
  Open the site's installer in Chrome or Edge with the FM-1 on USB, allow MIDI with SysEx and press install, without
  unplugging during the write; the package is also linked as a .fwsc. The engine is the last entry of the ENG list in
  PRESETS. The site names the build 1.8.1-enjambre and shows its SHA-256.
