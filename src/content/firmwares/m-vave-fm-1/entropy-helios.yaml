based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Open the install page in Chrome or Edge, connect the FM-1 over USB-C and press Install; after the restart the screen shows the HELIOS version. The repository also holds the .fwsc package. The README describes no recovery path of its own, and the FM-1's ROM boot mode applies.
brick_risk: false
