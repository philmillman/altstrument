device: m-vave-fm-1
name: ENTROPY HELIOS
summary: >-
  Ambient drone and microtonal synth for the FM-1 with a generative ENTROPY mode and a hands-on PURE HW mode, two-core voices, 16 stackable effect cartridges and a browser installer and studio page.
description: >-
  Two modes are switched with SEL and REC. ENTROPY, the mode at power-on, runs a generative engine with three behaviours (DRIFT, CINEMA and WILD), 18 factory presets grouped as calm, lush and edge, and eight user slots. PURE HW removes the generative presets and leaves 16 blank hardware slots that start with no autonomous drift, and since 1.3.4 the Evolve behaviours can be switched on there by hand. The voices run on both cores: six swarm drone voices of five oscillators each and two melodic voices, through two modelled op-amp filters, with an eight-voice play mode that responds to velocity and per-key aftertouch. Sixteen effect cartridges can be stacked, each with its own level and tone, ahead of a three-spring tank, and external USB audio can be routed through the filters and effects. The screen is drawn as a hardware panel with five selectable finishes saved to flash. A WebMIDI studio page adds an 8x8 pin matrix, a two-axis joystick, a cartridge selector and JSON backup of the user slots, and can use the computer's webcam as a light sensor and a desk tap as a piezo input. It runs on both FM-1 flash chips and is built on fm1-base and felucca-bsp.
