versions:
- version: 1.3.4
  date: 2026-11-27
  url: https://github.com/behn1220/entropy-helios/releases/tag/v1.3.4
  notes: The release is titled Beta. Lets the generative Evolve behaviours (SLOW DRIFT, CINEMA, WILD) be switched on in PURE mode from the SELECT encoder or the Studio page, saved with each PURE slot, and crossfades a stacked effect cartridge's level when Evolve switches it on.
- version: 1.3.3
  date: 2026-11-27
  url: https://github.com/behn1220/entropy-helios/releases/tag/v1.3.3
  notes: Fixes a stack overflow that sent 1.3.2 into safe mode on FM-1 hardware and fixes editing of active effect cartridges. Adds a master and a per-module random button with a 16-step undo.
- version: 1.3.2
  date: 2026-11-26
  url: https://github.com/behn1220/entropy-helios/releases/tag/v1.3.2
  notes: Adds a master volume and quick mute, raises the tempo limit from 160 to 240 BPM, adds a Core 0 and Core 1 CPU meter, tap tempo, preset steppers and keyboard shortcuts to the Studio page. The notes say it trapped into safe mode on FM-1 hardware, which 1.3.3 fixes.
- version: 1.3.1
  date: 2026-11-26
  url: https://github.com/behn1220/entropy-helios/releases/tag/v1.3.1
  notes: "Adds a phase offset for sequencer step timing, a continuous Reich-style phase drift and sequencer sync, and updates the WebMIDI Hardware Studio and the FM-1 screens. The release also carries the browser flasher page as a separate file."
- version: 1.3.0
  date: 2026-11-25
  url: https://github.com/behn1220/entropy-helios/releases/tag/v1.3.0
  notes: "Release page has no text; the tagged commit adds a three-band parametric master EQ with an FM-1 screen, WebMIDI Studio and SysEx control, saved to flash."
- version: 1.2.0
  date: 2026-11-24
  url: https://github.com/behn1220/entropy-helios/releases/tag/v1.2.0
  notes: The README calls it v1.2 Beta. The release carries the .fwsc package and a checksum file; the repository holds its installer page. The repository was recreated on 2026-11-23, and the earlier 1.0-beta and 1.1.0 tags are gone.
