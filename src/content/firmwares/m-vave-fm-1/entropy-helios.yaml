license_notes: >-
  The LICENSE file is the MPL-2.0 text and the README states MPL-2.0. The README credits fm1-base (Charles Vestal), felucca-bsp (Leo Kuroshita, Hügelton Instruments), the dual flash chip support (Laurens, profikid) and the DSP helpers and build script template (Styves Goupil).
