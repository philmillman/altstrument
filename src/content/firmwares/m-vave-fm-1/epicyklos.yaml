device: m-vave-fm-1
name: EPICYKLOS
summary: >-
  Six-track sequencer instrument for the FM-1 aimed at dub techno, hypnotic techno, ambient and drone, with a euclidean,
  polymetric sequencer, dub chord and drone engines, and drum voices.
description: >-
  The project name is marked provisional. The manual describes six tracks with a euclidean, polymetric sequencer:
  a kick, metallic hats, a clap or snare, a toms and percussion engine, a dub-techno chord voice with selectable
  chord tables (Plaits Palette), a sustaining drone with drift and a second voice, and a bass track that is still a
  placeholder. Views cover orbit, mix, effects, flow and mod, with pattern slots, tempo, a delay with throw and
  freeze, a master filter, undo, eight scenes with eight locks each with a per-scene fade, in recent commits a per-track step source (EUCLID, SEQ or a TURING loop), and a reverb with PLACA (after Plateau) and NUBE (a granular cloud) types and a shimmer, a MACRO voice on track 4 with six synthesis models, and a boot screen with a turning galaxy.
  It is built on charlesvestal's fm1-base with Felucca's board support code underneath. The README still says phase 0
  and warns not to flash it, but the English manual calls the build test version 0.1.17 and says it has run on a real
  FM-1 since 0.1.7, with a CPU profile measured on the device in FLOW; several functions, such as external clock sync and
  Bluetooth audio, are marked as pending on the device. The CI workflow compiles a development .fwsc, and a manually
  started site workflow packages a private test build and installer page, but no release is published. The manual is in
  English and Spanish and the on-screen labels are Spanish for now.
status: active
authors:
- name: JavierIng
  url: https://github.com/JavierIng
source: https://github.com/JavierIng/fm1-epicyklos
based_on: m-vave-fm-1/fm1-base
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only (LICENSE, LICENSING.md). The fm1-base and felucca-bsp submodules and the copied template files are
  MPL-2.0, the Plaits Palette chord tables are MIT, and the AC79 SDK parts in compiled packages are Apache-2.0 (LICENSING.md).
  Bluetooth uses fm1-base's own stack, with no binary JieLi libraries. No M-VAVE stock image is bundled.
distribution: source-only
install_notes: >-
  No package is published. Clone with --recursive and build with ./build.sh, which needs the JieLi toolchain and AC79 SDK
  (see fm1-base's README), or run the browser emulator and host simulator with ./build.sh --web and ./build.sh --host.
  The README still says not to flash it yet, and the project's licence notice says installing other firmware on an FM-1 is
  at your own risk.
brick_risk: false
tags: [sequencer, drums, synth-engine, generative, emulator]
