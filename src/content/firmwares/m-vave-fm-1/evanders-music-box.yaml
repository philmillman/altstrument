device: m-vave-fm-1
name: Evander's Music Box
summary: >-
  Roleplaying-themed firmware that turns the FM-1 into an elven bard's music box: a four-track medieval
  workshop with a 64-step sequencer, and an Encounter mode of sixteen scene soundtracks for live games.
description: >-
  Bardic Crafting has twenty instruments (tuned drums, plucked strings, hurdy-gurdy, bagpipe, winds, organs),
  eight modes, four temperaments, microtiming, parameter locks and live looping. In Encounter mode four group
  keys switch scenes on the next bar and the other keys apply battle modifiers such as half time or a key
  change. There is a reverb, a limiter with an output level setting, and reactive key lights. The web side has
  an emulator, an installer and a preset console that can cue scenes remotely. The README calls it early
  hardware testing and says the battery start-up fix is unconfirmed on a unit. The FM-1 port uses Felucca's
  hardware layer, USB, update code and loader as a git submodule.
status: active
authors:
- name: Mike Tsakiroglou (MikeTsak)
  url: https://github.com/MikeTsak
source: https://github.com/MikeTsak/Evanders-Music-Box--FM-1-LARP-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  Source files carry SPDX GPL-3.0-only headers, as required by the bundled Felucca code.
distribution: download
install_notes: >-
  Web installer (Chrome or Edge, USB) that you build and serve from the repository with tools/build.py, or
  Felucca's fm1_install.py with the release .fwsc. The README says to return to official V15 first when coming from
  another custom firmware, using M-VAVE's updater or the installer's option, which asks you to select
  M-VAVE's own FM-1.fwsc. Its recovery notes cover the chip's UBOOT mode and the FM-1 Transporter dongle for a
  hard brick.
brick_risk: true
