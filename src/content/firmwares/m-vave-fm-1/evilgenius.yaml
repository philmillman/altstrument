  notes: "Adds sound editing to the web manager, with a library of MY PRESETS and the factory sounds that can be edited, loaded on the FM-1, exported, renamed, tagged and deleted. The manager also works with EVILGENIUS in RemoteFM1, whose store now matches the FM-1's, so one backup file restores on both. RemoteFM1's store is cleared once at the first start of 0.1.2, and nothing changes on the FM-1."
