device: m-vave-fm-1
name: Fantasia
summary: >-
  Generative dungeon-synth and 16-bit RPG soundtrack instrument: nine fantasy zones with their own scale and tempo, a three-voice FM party, seed planting from the keys and a pixel-art diorama on the screen.
description: >-
  On power-on Fantasia starts an ambient drone, the Living Room Tone, and plays within one of nine zones (the Crypt, Tavern, Glade, Castle, Sands, Spire, Tundra, Coronation and Boss), each with its own mode and tempo. A three-member party of two-operator FM voices plays bass, harmony and lead, with a bell voice, a two-channel FM percussion kit, a room reverb and a soft clipper. Notes played on the 27 scale-quantized keys after a silence plant a seed that the generator develops. Seven macro encoders and six Spell buttons change the music, and the 240 by 240 screen shows a pixel-art scene and a party status display. The repository has no releases yet, and the README describes only the FM-1 build. It is built on Dinghy.
