device: m-vave-fm-1
name: FANTASMA
summary: >-
  Felucca fork for slow, drifting ambient music: a self-playing ambient machine (pad, bells and endless noise
  on a shared scale), an Omnichord-style chord mode, tape-style sounds and a neon ghost theme.
description: >-
  FANTASMA is the released form of the FANTASMA branches of Pelucco, Gadlele's earlier personal Felucca fork,
  and now has its own repository. An AMBIENT page picks a root and scale on one key press and sets up a pad that
  plays its own chord progression, a bell part that scatters notes and a noise part that never stops, all
  running on their own clock even with the transport stopped. It adds an AMBI noise engine (sea, rain, vinyl,
  drone and others), a bell engine, a long-tail AMBI reverb, an OMNI chord mode on the keys and parts named
  for their role. Version 1.1 adds slow pitch wobble and tape-style sounds. The look is a neon palette with an
  animated ghost at power-on. A rescue mode, entered by holding OCT- at power-on or after two failed boots,
  starts a minimal updater that the web installer can reach.
status: active
authors:
- name: Gadlele
  url: https://github.com/Gadlele
source: https://github.com/Gadlele/Fantasma
source_status: open
license: GPL-3.0-only
license_notes: >-
