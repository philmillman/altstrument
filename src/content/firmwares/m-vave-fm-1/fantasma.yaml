homepage: https://gadlele.github.io/Fantasma/
distribution: browser-installer
install_notes: >-
  Web installer on the project site (Chrome or Edge over USB, with a backup step) or tools/fm1_install.py with
  the .fwsc from a release. Hold OCT- alone at power-on to reach USB rescue. The installer can put M-VAVE's
  official firmware back. The site also has a browser emulator.
