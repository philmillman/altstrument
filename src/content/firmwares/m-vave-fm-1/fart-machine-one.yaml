device: m-vave-fm-1
name: Fart Machine One
summary: >-
  Novelty sample instrument: ten fart sounds across all 27 keys, a one-bar 16-step loop recorder, reverb and
  delay, with an animated cartoon on the screen.
description: >-
  A derivative of FoMni. Keys play one-shot samples; REC records and overdubs one pattern that is kept in RAM
  only and lost at power-off. Tempo, reverb and delay have knobs, and MIDI channel 1 notes 53-79 play the keys.
  The ten recordings are published by their creators under CC0 1.0, according to the README; the 1.0.0 release
  used eleven recordings from Pixabay whose redistribution terms the author had not verified.
status: active
authors:
- name: adamcharleswilsonmusic-code
  url: https://github.com/adamcharleswilsonmusic-code
source: https://github.com/adamcharleswilsonmusic-code/Fart-Machine-One
source_status: open
license: GPL-3.0-only
license_notes: >-
  Covers the code and original artwork. Since 1.1.0 the recordings are CC0 1.0 per the README, with creator links
  and hashes in samples/ATTRIBUTION.md; the code licence is separate from them. The 1.0.0 recordings had unverified
  terms.
distribution: download
install_notes: >-
  Download fart-machine-one.fwsc and the source zip from the release, then run tools/fm1_install.py (Python 3 with
  mido and python-rtmidi). Installation replaces the current firmware. If an update is interrupted, run the same
  command again.
brick_risk: false
