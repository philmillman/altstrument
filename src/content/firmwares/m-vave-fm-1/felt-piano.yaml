device: m-vave-fm-1
name: FELT PIANO
summary: >-
  Self-playing solo piano firmware for the FM-1 that generates pieces on a modelled felt piano and draws each note as a fading line of light on a scrolling piano roll.
description: >-
  Pieces follow one another, each with its own key, mode, tempo and title, in five idioms chosen by preset: a Gymnopedie-like waltz, Airport-style drifting loops, a felt ostinato, a nocturne and sparse modal playing. Playing has rubato and swells, and each piece ends slowly on a long note before a quiet gap and the next one. The piano model has soft felt hammers, beating partials, dampers, a sustain pedal, sympathetic strings, key noise and a small room. The screen shows a piano roll in which each note fades as it rings, a pedal lane underneath and the title and key above. Fourteen presets each keep their own settings, EDIT calls the next piece and REC keeps the current one playing.
status: active
authors:
