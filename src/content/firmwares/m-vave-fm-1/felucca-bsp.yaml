device: m-vave-fm-1
name: felucca-bsp
kind: tool
summary: >-
  MPL-2.0 board support package for custom firmware on M-VAVE devices built around JieLi chips: clock, interrupts,
  flash, USB device and MIDI host, UART, timers, boot entry, update loader and FM-1 board code. No sound code or user interface.
description: >-
  Split out of Felucca. It holds the chip layer shared across the family, a loader that builds as a RAM image, the update session in
  ota.c, USB with MIDI, serial and audio classes, an optional USB MIDI host (direct or through one powered hub, ported from Melodee), and
  the FM-1 wiring: LCD pins, key scan with optional velocity, ADC channels, audio codec lines and the headphone jack switch. Separate
  board folders cover the M-VAVE Galaxia guitar pedal (board PD49 V03) and, with audio, input and LCD headers, the Pocket Amp. Tools build update packages, install over USB-MIDI
  and rescue a unit that cannot start. The update loader has a fast install that writes only the sectors that changed, tools/fm1_rescue.py accepts the newer UC25HQ80 flash chip, and the USB audio input can be built with 4 to 10 channels. A hwtest example firmware exercises the screen, knobs, buttons, LEDs and USB serial. The
  README labels the second core, expanded flash and USB host as beta or experimental, a higher clock as a concept, and lists the SMK-37 Elite and
  Pro as planned without board support. Its chip/ folder also holds Bluetooth LE and BR/EDR radio drivers from Optimist, the radio's start-up tables and a
  calibration routine; fm1-base's own Bluetooth stack uses them. fm1-base, CTL-1 and a WiFi radio firmware build on it. Some macros still carry the FELUCCA name.
status: active
authors:
- name: Leo Kuroshita (@kurogedelic), Hügelton Instruments
  url: https://github.com/kurogedelic
source: https://github.com/hugelton/felucca-bsp
source_status: open
license: MPL-2.0
license_notes: >-
  MPL-2.0 per file (LICENSING.md, NOTICE). Leo Kuroshita and keremimo confirmed it for the Felucca code and the USB code they own, and
  the USB host port has its author's permission. A fork of Felucca cannot move to MPL-2.0 by using this repository. JieLi's SDK
  (Apache-2.0) is fetched and checked by hash, not copied. Two files in chip/ (ble_rf_tables_v15.h, fm1_rf_cal.h) are Apache-2.0
  and derive from the radio code of JieLi's SDK and M-VAVE's V15; the radio drivers come from Optimist by Henri David and
  are taken under MPL-2.0 from its dual GPL-3.0-only OR MPL-2.0 offer.
homepage: https://github.com/hugelton/felucca-bsp
distribution: source-only
install_notes: >-
  A base to build on, not an end-user firmware. Build with the JieLi toolchain and SDK files fetched by tools/get_sdk.sh, and
  install packages with tools/fm1_install.py. The safe hwtest image excludes the experimental parts. Flashing is at your own risk.
brick_risk: false
tags: [platform, sdk, usb-midi]
