device: m-vave-fm-1
name: Felucca Canvas
summary: >-
  Felucca fork with CANVAS, a granular performance engine where each key runs its own grain stream with its own
  position, size, density and pitch, and the black keys hold glitch effects.
description: >-
  CANVAS is a granular performance engine. Tapping a white key starts a stream of grains that keeps sounding (LATCH) or
  sounds while held (HOLD), and several blend together; holding a key and turning knobs 1 to 4 changes that grain's
  position, size, density and pitch, and the GRAINS page draws a fractal that reacts to the sounding grains. Black keys
  hold glitches such as beat repeat, reverse, freeze, tape stop, scatter, jump, burst, crush and octave shifts. Since
  17 November 2026 the three published builds are granular only: all four tracks are CANVAS, PRESETS offers only CANVAS
  sounds, HOME returns to the GRAINS page, and the source material is synthesized at build time (nature, dream and
  glitch sets, 17 factory sounds) in place of the earlier piano, flute and sax samples. Three key layouts (16 grains
  plus effects, 27 grains, or 8 grains plus controls) are the three builds. A build made without the layout option
  keeps every Felucca engine. Projects that use a CANVAS track will not load in upstream Felucca. The source patches
  Felucca 1.8.x, and the repository's README is Felucca's with a notice at the top.
