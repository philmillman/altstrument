install_notes: >-
  Open the project's GitHub Pages site in Chrome or Edge with the FM-1 on USB, pick one of the three builds and press
  Install, or build and flash with Felucca's tools/fm1_install.py. Upstream's hosted installer installs only upstream's
  release. Installing upstream Felucca, or its Return to official V15 or V16, goes back; back up projects and presets
  first.
