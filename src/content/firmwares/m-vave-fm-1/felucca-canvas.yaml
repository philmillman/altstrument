device: m-vave-fm-1
name: Felucca Canvas
summary: >-
  Felucca fork with CANVAS, a granular performance engine where each key runs its own grain stream with its own
  position, size, density and pitch, and the black keys hold glitch effects.
description: >-
  CANVAS is engine 15 beside Felucca's other engines, which are unchanged. Tapping a white key starts a stream of grains
  that keeps sounding (LATCH) or sounds while held (HOLD), and several blend together; holding a key and turning knobs 1
  to 4 changes that grain's position, size, density and pitch. Black keys hold glitches such as beat repeat, reverse,
  freeze, tape stop, scatter, jump, burst, crush and octave shifts. Material comes from built-in piano, flute and sax
  samples or three user slots, and there are factory presets with their own grain sets. Three key layouts (16 grains plus
  effects, 27 grains, or 8 grains plus controls) are published as three builds, each with track 1 starting as CANVAS, and
  a combined build lets the layout be switched. Projects that use a CANVAS track will not load in upstream Felucca. The
  source patches Felucca 1.8.x, and the repository's README is Felucca's with a notice at the top.
