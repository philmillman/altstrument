device: m-vave-fm-1
name: Felucca DCO and 303
summary: >-
  Felucca 1.6.1 fork that adds a Juno-106-style DCO engine with a BBD chorus, and a TB-303 engine with the TB-3PO
  pattern generator. Source only; the version string still reads 1.6.1.
description: >-
  The DCO engine (14) plays up to four voices a track with wave, pulse width, sub, noise, filter and range
  controls, a high-pass filter and 20 presets taken from the Juno-106 factory patches, after the KR-106 emulation
  as ported in fm-106. The chorus effect gains a stereo BBD type with the Juno's I, II and I+II modes. The 303 engine
  (15) is a single bass voice from Open303 as X0X ported it, with accent, slide and drive options. On a 303 track
  the ARP key opens TB-3PO, which writes a new 64-step line from density, accent, slide, octave and scale settings
  and can mutate it every few passes while playing. A MODEL page sets the generator to AICD, which draws lines from an
  n-gram model of acid patterns instead of TB-3PO's rules. The repository also holds the generator as a standalone C
  library under packages/acidgen. Engine numbers are appended after Felucca's, so existing
  projects load unchanged, but 1.6.1 and older firmware show projects that use the DCO engine as empty. The
  README marks the changes as not yet released.
status: active
authors:
- name: mediaworkbench
  url: https://github.com/mediaworkbench
source: https://github.com/mediaworkbench/felucca
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca. The DCO engine follows fm-106 and the Ultramaster KR-106 (both GPL-3.0), and Open303 is
  MIT (LICENSING.md, LICENSES/); the TB-3PO generator is a port of X0X's, itself after the Phazerville Hemisphere
  TB_3PO applet. The AICD mode uses the acid line model of Michael Ganss's Aicd (MIT, LICENSES/MIT-Aicd.txt), unchanged
  and turned into flash tables at build time; the patterns it was trained on are not in the repository. The standalone
  packages/acidgen library is GPL-3.0-only code with that MIT model data.
distribution: source-only
install_notes: >-
  Build it from the repository as Felucca is built (BUILDING.md) and install with Felucca's tools. The README
  says installing is at your own risk and that Felucca's installer or M-VAVE's updater returns to V15.
brick_risk: false
