device: m-vave-fm-1
name: Felucca DRONE
summary: >-
  Felucca 1.5.1 fork with a DRONE engine of stacked oscillators and 32 presets, a 3D drone-field screen, a 24 dB ladder
  low-pass, lofi drum kits and HOLD that latches notes.
description: >-
  DRONE is engine 15 and comes first in the preset list. It stacks three oscillators, or six drones at once, with a
  detune spread, a wave knob that crosses saw, square, ring, fold and noise, a sub, drift and grit. The same fork adds an LP24
  transistor-ladder filter type for ANALOG and DRONE with fourteen monosynth presets, four lofi drum kits, drum
  re-hits that restart cleanly, and HOLD to latch notes for drones. DRONE.md lists the changes, and everything else
  is Felucca. The fork reports itself as 1.5.1-dr4. The default branch is drone, and the repository has no releases.
