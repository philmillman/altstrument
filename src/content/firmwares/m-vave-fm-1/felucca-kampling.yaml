device: m-vave-fm-1
name: Felucca (Kampling fork)
summary: >-
  Personal integration fork of Felucca, now carrying upstream 1.8.0 features, for combining upstream and other forks' work, with an optional
  Braids-based MACRO engine, a redrawn UI, MIDI timing fixes, an optional second-core worker and USB diagnostics.
description: >-
  The fork tracks upstream Felucca and adds changes it reviews and measures itself: deferred project autosave, bitmap
  lettering and a single rule-based UI with a graph that follows the knob being turned, fixes to external clock phase,
  TRS timestamps and invalid tempo, shortcuts for silent effects, and a retained exclusion that keeps the second-core
  worker off after a failure. An opt-in build profile adds a fourteenth MACRO engine with 48 Braids oscillator
  models and 51 factory sounds; the normal build and hosted demo leave it out. Developer features include an
  opt-in screen capture over USB serial, a read-only USB collector, build reports with measured sizes and a
  firmware-watch ledger of other forks. The latest merge backports upstream Felucca 1.8.0 features, among them aftertouch,
  CLEAR ALL, step-edit undo, safer load dialogs and the FM6 AMS correction. The README also describes opt-in
  SMK-37 Pro, Elite and MKE-P37 targets whose physical qualification is pending. The author lists listening, loaded-panel and several device checks as still
  pending, and says development follows the author's own priorities. A GitHub Pages site hosts a demo, an installer
  and an editor built from main.
status: active
authors:
- name: Jan Kampling (kmplngj)
  url: https://github.com/kmplngj
source: https://github.com/kmplngj/Felucca
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca; LICENSING.md lists components that keep their own terms, including the CC0 Hügelton Sample
  Pack. The five portable engines come from the author's fork of Felucca-Engines (MIT).
homepage: https://kmplngj.github.io/Felucca/
distribution: browser-installer
install_notes: >-
  Use the .fwsc package from the fork's rolling latest-dev prerelease (replaced after each merge; no tagged releases) with the fork's web installer in
  Chrome or Edge, or build it with the repository's uv-based command (BUILDING.md); the macro profile needs
  FELUCCA_PROFILE=macro. Felucca's Return to official V15 and M-VAVE's updater go back, and OCT- starts the early
  USB rescue. The README says installing is at your own risk.
brick_risk: true
tags: [synth-engine, fork, ui, midi, platform, emulator, editor]
