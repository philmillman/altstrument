device: m-vave-fm-1
name: Felucca MPE with VLFO and DRIFT
summary: >-
  Felucca 1.6.1 fork that plays from an MPE controller with per-note pitch bend, pressure and slide, and adds
  voice LFO and drift modulation sources that move each note of a chord separately.
description: >-
  A separate fork from the other Felucca MPE entry. A new MIDI IN setting called MPE plays the selected
  track, one voice per finger, each with its own bend (plus or minus 48 semitones by default, up to 96, now on
  every MIDI IN setting). PRES and TIMB become modulation sources for amplitude, cutoff, shape or pitch. VLFO
  reads the track's LFO at a different phase for each of the eight voices, and DRIFT gives each voice a slow
  random wander of about 3 seconds per target; both work from the FM-1's own keys and sequencer, without an MPE
  controller. The README says it was played in the browser emulator with a ROLI Seaboard RISE 49 and an Embodme
  Erae Touch, and that neither the repository's prebuilt package nor anything else has run on a real FM-1. The
  package keeps Felucca's identity FM-1_900, so installers and editors treat it as Felucca.
