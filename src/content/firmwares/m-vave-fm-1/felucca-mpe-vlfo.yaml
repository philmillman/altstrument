distribution: download
requires_stock: V15
install_notes: >-
  Take prebuilt/felucca-mpe-1.6.1.fwsc from the repository (SHA-256 in the README) and install it with Felucca's
  web installer or another updater, or build it with build.sh. Untested on hardware; keep a way back to V15.
  MPE needs the lower zone with 15 member channels, then MENU > MIDI > MIDI IN set to MPE and a POLY track.
