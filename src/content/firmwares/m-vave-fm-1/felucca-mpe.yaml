device: m-vave-fm-1
name: Felucca MPE
summary: >-
  Work-in-progress fork of Felucca 1.6.1 that adds MPE: voices follow the pitch bend, aftertouch and CC74 of their own MIDI
  channel, with an MPE option and a base-channel setting in the MIDI menu. Source only, no package yet.
description: >-
  The repository is a copy of Felucca with its README unchanged, and the work is on the mpe branch, nine commits after
  Felucca's last commit of 2026-10-16, which was 1.6.1 plus a licensing note. A new MIDI IN route sends each member channel to the MPE part and tags every voice with the channel
  that started it. Each voice then takes its own pitch bend, using a pitch bend range set over RPN from 0 to 96 semitones,
  and its own channel aftertouch. CC74 acts as a per-voice brightness on the FM6 engine through a low-pass filter, with
  a reset on CC121 or a route change. The MIDI page of the menu offers the MPE route and a BASE CH row, which defaults to
  channel 2. The branch also makes the voice count a build option of 8, 12 or 16, and the commit messages say rendering
  the extra voices on the chip's second core is not done yet. The commits say host tests pass and that output is
  byte-identical for non-MPE playing; nothing in the repository says it has run on a real FM-1.
