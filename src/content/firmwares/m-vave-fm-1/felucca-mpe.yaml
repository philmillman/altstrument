license_notes: >-
  Inherited from Felucca: code is GPL-3.0-only, the Hügelton Sample Pack is CC0 1.0, and the engines submodule is MIT (the
  fork points it at monch1962/felucca-engines). Bundled fonts and ported DSP keep their own licences (LICENSING.md,
  LICENSES/). The bundled sample sets are CC0.
homepage: https://github.com/monch1962/mvave-fm1-mpe/tree/mpe
distribution: source-only
install_notes: >-
  Build it as Felucca is built (BUILDING.md: Docker, JieLi's Linux toolchain and the AC79 SDK, cloning with the
  submodule), then install the resulting felucca.fwsc with tools/fm1_install.py. It inherits Felucca's rescue: holding
  OCT- while switching on, and M-VAVE's updater, go back to V15.
brick_risk: false
