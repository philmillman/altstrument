device: m-vave-fm-1
name: Felucca Sequences
summary: >-
  Felucca fork with eight selectable sequences per track, optional chaining of them into longer runs, and
  per-sequence song choices, at the cost of the user sample slots.
description: >-
  The sequences are stored in the flash that the three user sample slots used, so these builds have no user
  samples. A track plays one of its eight sequences, chosen on a SEQ page or with keys while SEQ is held, and
  can switch at once or at the end of the current pass. Chained sequences play in order, and a song cell can
  name which sequence it plays. The 1.6.1 build adds a generative arp option and a chord mode with strum that can be
  saved and recalled. The repository was renamed from Felucca_8_patterns; the README is Felucca's
  own with a section for the added feature at the end. The author says the changes were written with a free
  LLM.
status: active
authors:
- name: echoe
  url: https://github.com/echoe
source: https://github.com/echoe/Felucca_seq_per_track
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca; LICENSING.md covers the bundled assets and ported DSP.
homepage: https://echoe.github.io/Felucca_seq_per_track/
distribution: browser-installer
install_notes: >-
  The project page forwards to the Felucca web installer in the repository (Chrome or Edge, USB), and the
  release carries a felucca-1.6.1_sequences_2.fwsc package. Projects saved with sequences may not open on firmware without
  them.
brick_risk: false
tags: [sequencer, performance]
