device: m-vave-fm-1
name: Felucca
summary: >-
  Open multi-engine synth platform: 13 engines, 4 tracks sharing 8 voices, 64-step sequencer, mod matrix,
  USB and TRS MIDI, USB audio. The base most other FM-1 firmwares fork.
description: >-
  Thirteen engines with factory presets (analogue, 6-operator FM, phase distortion, samples, granular,
  drums, Plaits- and Rings-derived physical models), a 64-step sequencer with chords, ties, chance, conditions,
  ratchets and automation, songs, effects, a MOD matrix, MIDI learn, a web editor and a browser demo.
  Most of the scene (SLOOP, X0X, FoMni, Melodee and others) is built on its hardware layer and update
  loader.
status: active
authors:
- name: Leo Kuroshita (@kurogedelic), Hügelton Instruments
  url: https://github.com/kurogedelic
source: https://github.com/hugelton/Felucca
source_status: open
license: GPL-3.0-only
license_notes: >-
  Bundled fonts and ported DSP keep their own licences (LICENSING.md, LICENSES/).
  Since 1.6.1 five engines, and since 1.7.0 PHASE as well, come from the separate Felucca-Engines repository,
  which is MIT. Since 1.7.0 the hardware layer is the felucca-bsp submodule (MPL-2.0).
homepage: https://hugelton.github.io/Felucca/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py from a terminal. The installer's Return
  to official V15 and M-VAVE's updater both go back to stock. Build guide: BUILDING.md.
brick_risk: true
tags: [synth-engine, sequencer, fx, usb-audio, midi, wavetable, granular, physical-modeling, fm, editor,
  platform]
video:
  url: https://www.youtube.com/watch?v=EzFknmhtKZk
  title: "Mvave FM-1 | Felucca Firmware - Multi Sequencer, 9 Engines, Scale Mode - First Look"
  credit: "Stanley Gurvich"
  first_party: false
versions:
- version: 1.8.1
  date: 2026-11-01
  url: https://github.com/hugelton/Felucca/releases/tag/v1.8.1
  notes: The web installer now installs the current release instead of 1.7.0, and FM6 shows the name of a voice-bank sound in the footer instead of the preset loaded before. Projects, presets and samples are unchanged.
- version: 1.8.0
  date: 2026-10-31
  url: https://github.com/hugelton/Felucca/releases/tag/v1.8.0
  notes: >-
    Adds MENU > SYSTEM > CLEAR ALL to start a new project, key and channel aftertouch routing (off by default), undo for
    steps edited by hand and a prompt before loading a project over unsaved changes. Fixes FM6 operators that use AMS.
- version: 1.7.0
  date: 2026-10-28
  url: https://github.com/hugelton/Felucca/releases/tag/v1.7.0
  notes: >-
    Moves the hardware layer to the felucca-bsp submodule, no longer refuses M-VAVE's V15 package from M-VAVE's own
    updater, and fixes TRS MIDI clock timing, external clock drift, TRS input reads and a divide by zero at BPM 0.
    PHASE moves to Felucca-Engines.
- version: 1.6.1
  date: 2026-10-14
  url: https://github.com/hugelton/Felucca/releases/tag/v1.6.1
  notes: >-
    Keeps one LARGE size per knob, checks the package size on the FM-1 before erasing, and adds an opt-in beta
    for the second core. Five engines move to the MIT-licensed Felucca-Engines repository.
- version: '1.6'
  date: 2026-10-13
  url: https://github.com/hugelton/Felucca/releases/tag/v1.6
  notes: >-
    Custom UI colours, conditional steps, EUCLID, MIDI channel per track. Projects with conditional steps
    do not open on 1.5 or 1.5.1.
