device: m-vave-fm-1
name: Fernbedienung
summary: >-
  Firmware that makes the FM-1 the hardware controller and USB audio output for the Steckfeld SF1 modular synth app on iPad and iPhone,
  with the selected module drawn on its screen.
description: >-
  Its keys play Steckfeld over USB-MIDI with octave buttons, its four knobs, SELECT, ALGORITHM and PRESETS send relative
  control changes, and its function buttons switch pages and modules. The app sends the selected module back as SysEx, and the
  screen shows the module's name, pages, knob values and a picture, the cables on a route screen and the patch list. The iPad's
  stereo output plays through the FM-1, with MASTER as the volume. An EDIT screen holds the MIDI channel, velocity, and whether Steckfeld
  opens its programmer when a module is picked on the unit, and a system setting chooses the theme. The control protocol is
  published under CC0 so other apps can implement it. Each version goes with one Steckfeld SF1 version; 1.0 needs 1.4.0. It
  is a fork of the author's Beiwagen, which descends from FM1_AudioBase, MOOD_FM1, GATOR, ORBIT and Felucca.
status: active
authors:
- name: Daniel Pangerl (DPangerl)
  url: https://github.com/DPangerl
source: https://github.com/DPangerl/fernbedienung
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only for the firmware, tools and installer. The protocol document under
  docs/fernbedienung/ is CC0-1.0, the Inter and Terminus fonts are SIL OFL 1.1, and three JieLi SDK files in every package are
  Apache-2.0. No M-VAVE firmware is in the repository.
based_on: m-vave-fm-1/beiwagen
distribution: browser-installer
requires_stock: Steckfeld SF1 1.4.0
install_notes: >-
  Install it from the FM-1 Firmware Hub, which also offers the way back to M-VAVE's official firmware, or write the .fwsc from the release with another
  FM-1 installer. It installs over M-VAVE's V15 and over other community firmware. The README warns that a failed or interrupted
  install can leave the FM-1 unable to start until it is recovered with a USB tool, and the update loader is unchanged from ORBIT's.
brick_risk: false
tags: [controller, ios, usb-audio, midi, usb-midi, fork]
