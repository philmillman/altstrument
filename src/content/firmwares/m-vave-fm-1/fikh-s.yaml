device: m-vave-fm-1
name: FIKH-S
kind: firmware
summary: >-
  Experimental drone and texture synth for the FM-1 with 22 algorithms in three banks, a filter, a metallic or diffuse
  delay with a frequency shifter, an ambient reverb with five modes, snapshots and a freeze.
description: >-
  Twenty-two algorithms for drones, basses, textures and noise play from one root key that the keys set: pairs of
  oscillators with exponential FM or ring modulation, wavetable and waveshaper voices, sine clusters, quantised
  chords, partial stacks, comb swarms, a shortwave radio dial, wind and rain, struck or bowed bodies and saw stacks.
  Several scan a row of frequency and wave pairs with MORPH. Every algorithm runs through a filter into a stereo
  processor, either DUNGEON, a metallic delay, or REFLEKTA, a diffuse one, each with a frequency shifter in its
  feedback, then a reverb with DREAM, DARK, RISE, LIGHT and RAIN modes. Controls include HOLD for a drone, FREEZE, a
  random SEED and SCAN, DICE, eight snapshots that store the whole sound on the first white keys, and per-algorithm
  or global time. It plays fewer oscillators and shows ECO when the CPU passes 88 percent for a second. The README
  says the concept and control names follow the Forge TME VHIKK X and the reverb modes the Walrus Audio SLOER, that
  none of their code, sound or artwork is used, and that it runs on both FM-1 chips. English and German manuals are in
  the repository, and it is built on fm1-base and felucca-bsp.
