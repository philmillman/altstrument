homepage: https://justynroberts.github.io/fm1-finton/
distribution: browser-installer
install_notes: >-
  Web flasher in Chrome or Edge over Web MIDI, which installs the bundled build or any .fwsc you drop on it and
  finishes an interrupted update, or tools/fm1_install.py. To go back, use M-VAVE's updater or another
  installer's return to official option. If it fails to start, hold OCT- while powering on for the USB rescue
  mode. The repository's bundled package is Finton's own 610,110-byte build, not M-VAVE's firmware.
brick_risk: false
