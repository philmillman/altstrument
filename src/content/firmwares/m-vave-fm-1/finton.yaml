device: m-vave-fm-1
name: Finton
summary: >-
  Six-track trance machine with kick, 909 drums, bass and three supersaw tracks, a generated chord progression
  library, a build and drop knob and an orbiting-rings screen, with a Web MIDI flasher.
description: >-
  Tracks are KICK, 909 (hats, clap, snare, ride), BASS, ROLL, LEAD and PAD. Chords come from a library of 66
  progressions in five moods, over eight bars that can split at the half. BASS, ROLL and LEAD are written from the
  chords, key, mode and roller settings and are regenerated when those change unless the track was edited by hand.
  Every knob can be locked per step or recorded as motion, and one LIFT knob runs the build and the drop. The
  sound is fixed-point DSP on the FM-1's chip: supersaws, a 909-style kick and kit, a ping-pong delay, a hall and a
  riser, using about 30 percent of the audio budget by the author's measurement in an emulator. The harmony and
  roller are ported from the author's Rollwerk and the engine from APEX. The platform layer comes from Dinghy,
  Felucca and SLOOP. Song slots sit in the flash area Felucca uses for projects, so going back to Felucca may show
  damaged projects there. The repository has a host mode that renders audio and screenshots on a computer.
