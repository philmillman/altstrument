device: m-vave-fm-1
name: FIZZ
summary: >-
  Step-sequencer groovebox around ChoralRoot's FM TONE voice: six tracks on 16 shared voices, p-locks, conditions,
  ratchets, chords, MIDI FX, a mixer and a browser-based manager, in beta.
description: >-
  Six tracks share 16 voices and a pool of 128 sounds, with track defaults that individual steps can override,
  pages with their own start and end, chance, ratchets and chords of up to six notes. MIDI FX groups per track
  include an arpeggiator, and releases add recording modes, tools such as stretch and clip, a mixer with mute and
  solo, a global scale and a routing page that runs the chorus, delay, reverb and filter in parallel or in a chain.
  A web manager handles presets and edits sounds; beta.13 gives it a new look, a live mix, a virtual FM-1 panel and
  Digitone .syx imports. The FM TONE voice and effects come from the author's
  ChoralRoot, while the Felucca-derived code was rewritten. The README still describes an earlier phase that ran on
  a Mac through FM1VST and RemoteFM1 and an eight-track design, but the releases are FM-1 firmware packages with six
  tracks, all marked as pre-releases.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/FIZZ
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSING.md states MPL-2.0 for the firmware, relicensed by its author from GPL-3.0-only on 2026-10-23. The site/
  folder and the test oracles that build ChoralRoot's tree are GPL-3.0-only and are not firmware. plutovg is MIT with
  FreeType License parts, and the Inter Tight font is SIL OFL 1.1.
homepage: https://quixotic7.github.io/FIZZ/
distribution: browser-installer
install_notes: >-
  Install from the page at quixotic7.github.io/FIZZ/install/ in Chrome or Edge over USB, from The Firmware Hub, or
  with fm1_install.py. Since beta.13 each .fwsc carries FIZZ's data, so one install is enough. Updating between betas
  keeps projects and presets, but switching between the USB and Bluetooth packages erases them, so back up in the
  manager first. The Bluetooth package uses flash where other firmwares keep their data, so back up first.
brick_risk: false
tags: [sequencer, synth-engine, fm, fx, chords, arpeggiator, performance, editor, midi]
versions:
- version: 0.12.0-beta.16
  date: 2026-11-13
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.16
  notes: Adds a step keyboard, turned on with a B11 click, where the white keys play each hold mode's values (velocity, length, micro-timing, ratchet, chance, condition, sound) and each press plays the step, with live overrides while playing, a sticky SHIFT and further step-entry changes.
- version: 0.12.0-beta.15
  date: 2026-11-11
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.15
  notes: Adds an OVERVIEW of all six tracks at once, a second shift key on B11, a new SHIFT screen, chords written into selected steps from every page, a third engine mode that plays FM TONE and sends the sound editor's moves as MIDI CCs, and a routing map on the MIDI FX screen. HOME clicks now cycle the views.
- version: 0.12.0-beta.14
  date: 2026-11-08
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.14
  notes: Supports the newer FM-1s sold since autumn 2026 with the UC25HQ80 flash chip, which previously kept saves only until power-off, and waits for the slower chip to finish each write. Nothing changes on older units.
- version: 0.12.0-beta.13
  date: 2026-11-03
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.13
  notes: Each package now carries FIZZ's data, so one install is enough, including from The Firmware Hub. A new project starts on a drum-beat pattern, and the manager gets a new look, live mix, a virtual panel, drag-and-drop pattern copying and Digitone .syx imports.
- version: 0.12.0-beta.12
  date: 2026-10-28
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.12
  notes: Adds USB audio so the master output can be recorded over the cable, and a second package with Bluetooth MIDI that holds 4 projects and 128 presets. Switching between the two packages erases projects and presets.
- version: 0.12.0-beta.9
  date: 2026-10-27
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.9
  notes: Adds a VOICE page (mono or poly, unison, priority), draws the FX page as a cat and the MASTER page as two heads, reads patterns in the background so changing one no longer clicks, and adds HOLD for the live keys.
- version: 0.12.0-beta.8
  date: 2026-10-26
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.8
  notes: Sequencer clean-up with one knob table in every mode, a SLIDE key replacing P-LOCK, an effects page that opens on the sends, and chain routing as wet and dry in series.
- version: 0.12.0-beta.7
  date: 2026-10-26
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.7
  notes: Reworks FX routing into a signal flow of four blocks with parallel and chain modes.
- version: 0.12.0-beta.6
  date: 2026-10-26
  url: https://github.com/Quixotic7/FIZZ/releases/tag/v0.12.0-beta.6
  notes: Adds a global scale, a patterns map that stays open and MIDI FX bypass from the ARP key.
- version: 0.12.0-beta.5
  date: 2026-10-25
