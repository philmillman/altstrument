device: m-vave-fm-1
name: FM-1 Flasher
kind: tool
summary: >-
  Portable CircuitPython device on an Adafruit Metro ESP32-P4 that keeps FM-1 firmware packages on a microSD card,
  downloads more from The Firmware Hub over WiFi and installs them over USB MIDI SysEx from a touchscreen, with no
  computer.
description: >-
  The device is an Adafruit Metro ESP32-P4 with the 2.8-inch capacitive TFT touch shield. The FM-1 plugs into the
  Metro's native USB host port, and packages come from thefirmwarehub.com over WiFi. The screen browses the card's
  firmwares as picture cards or a list, filters by type or favourites, shows a firmware's details before installing,
  and its Catalog page fetches new firmwares and versions, only ever adding or updating. The README reports V15 to
  SLOOP in about 50 seconds and SLOOP back to V15 in about 46. The update protocol is ported from M-VAVE's
  WebUpdate.js, with each package checked the way the FM-1 checks it before writing; packages for other loaders such
  as Skiff are handled, and firmwares the hub sends to their own installer page are not downloaded. It needs
  CircuitPython 11 built with two patches that are in the repository, because stock CircuitPython cannot mount the
  FM-1. A desktop command-line flasher, a screen simulator with a faked FM-1 and a unit-test suite are included, and
  tools/make_sd.py prepares a card from .fwsc files or from the hub catalogue. The repository holds no firmware
  packages; M-VAVE's stock V15 is added from a clone of m-vave/fm1_open and cannot be removed from the screen.
  The earlier version for an Adafruit Feather RP2040 or RP2350 with a TFT FeatherWing is deprecated and its code is
  gone from the main branch; its last tested state is the tag v1-feather-final in the old repository. On 5 November 2026 the project moved from
  jedgarpark/FM-1_Flasher, now archived, to the FM-1_Flasher folder of Adafruit's Learning System Guides repository. A
  release in the old repository, firmware-20261102, still holds a custom CircuitPython .uf2 for the Feather RP2350.
status: active
authors:
- name: jedgarpark
  url: https://github.com/jedgarpark
source: https://github.com/adafruit/Adafruit_Learning_System_Guides/tree/main/FM-1_Flasher
source_status: open
license: GPL-3.0-only
license_notes: >-
  The folder's LICENSE and README say GPL-3.0, because the update protocol is ported from M-VAVE's WebUpdate.js (GPL-3.0-only with the
  GPL-3.0 linking exception). Each firmware you put on the card keeps its own licence.
distribution: source-only
requires_stock: V15 or a firmware with a compatible USB updater
install_notes: >-
  Hardware build only: a Metro ESP32-P4 with the 2.8-inch TFT touch shield, a microSD card in the Metro's slot and
  CircuitPython 11 built with the two patches in patches/ (see patches/README.md). Copy FM-1_Flasher_Code to the board
  or run tools/deploy.py, set CIRCUITPY_SDCARD_USB = false in settings.toml, join WiFi from Settings, then tap Catalog
  to fill the card and pick a firmware to install. The FM-1 goes in the Metro's USB-A host port. Keep both devices
  powered during an install. PLAN.md, the Feather-era plan, lists recovery routes, including holding OCT- at power-on
  and a Raspberry Pi Pico transporter rig.
brick_risk: false
tags: [flasher, loader, usb-midi, sysex, python, utility]
