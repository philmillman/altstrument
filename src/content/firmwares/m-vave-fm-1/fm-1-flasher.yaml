device: m-vave-fm-1
name: FM-1 Flasher
kind: tool
summary: >-
  Portable CircuitPython device that keeps FM-1 firmware packages on a microSD card and installs them over USB MIDI
  SysEx from a touchscreen, with no computer. The Metro ESP32-P4 version also downloads them from The Firmware Hub.
description: >-
  The README now describes a version on an Adafruit Metro ESP32-P4 with a 2.8-inch TFT touch shield, which uses the
  board's native USB host port and downloads firmwares from thefirmwarehub.com over WiFi; the v2 plan reports spike
  installs of V15 to SLOOP in 52 seconds with a custom CircuitPython and TinyUSB build. The Feather version is
  deprecated, and its last tested version is the tag v1-feather-final. In that version an Adafruit Feather RP2040 USB
  Host acts as the USB host for the FM-1, with the Feather's own PIO USB port or a MAX3421E USB Host FeatherWing, and a
  3.5-inch TFT FeatherWing that provides the
  touch screen and the microSD slot (its pins clash with the MAX3421E wing). A Feather RP2350 with the wing also installs, once the display's CS and DC pins are rewired; a GitHub release (firmware-20261102) offers a custom CircuitPython .uf2 for that board that drives the wing, which stock CircuitPython cannot yet do. The release reports 5 of 5 installs of DUB-1 and 4 of 5 of V15 with it, the one failure unexplained. The screen browses the card's firmwares as cards or a list,
  keeps favourites and shows a firmware's details before installing. The update
  protocol is ported from M-VAVE's WebUpdate.js, with each package checked the way the FM-1 checks it before writing.
  The README reports installs from the REPL of V15 to SLOOP in 70 seconds, SLOOP back to V15 with the factory voices
  restored in 73 seconds, and V15 to ChoralRoot in 69 seconds. It needs a patched CircuitPython build (patches are in
  the repository). A desktop command-line flasher, a simulated FM-1 and a unit-test suite are included, and tools/make_sd.py
  prepares an SD card from .fwsc files or from the FM-1 Firmware Hub catalog. The repository holds no firmware
  packages; the README tells you to take the stock V15 image from a clone of m-vave/fm1_open.
status: active
authors:
- name: jedgarpark
  url: https://github.com/jedgarpark
source: https://github.com/jedgarpark/FM-1_Flasher
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0, because the update protocol is ported from M-VAVE's WebUpdate.js (GPL-3.0-only with the
  GPL-3.0 linking exception). Each firmware you put on the card keeps its own licence.
distribution: source-only
requires_stock: V15 or a firmware with a compatible USB updater
install_notes: >-
  Hardware build only. The current target is a Metro ESP32-P4 with the 2.8-inch TFT touch shield and a custom CircuitPython
  build described in docs/PLAN-v2.md. The deprecated Feather build needs a Feather RP2040 USB Host running CircuitPython 11.0.0-alpha.2 (10.3.1 with the MAX3421E wing) with
  the patches from patches/, plus the TFT FeatherWing and the long USB cable the README asks for. Prepare the card with
  tools/make_sd.py, then pick a firmware on the touchscreen; device/fm1_install.py also runs from the REPL. Keep both devices powered during an install. PLAN.md lists recovery routes, including holding OCT- at
  power-on and a Raspberry Pi Pico transporter rig.
brick_risk: true
tags: [flasher, loader, usb-midi, sysex, python, utility]
