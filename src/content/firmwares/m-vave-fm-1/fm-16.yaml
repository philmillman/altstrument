device: m-vave-fm-1
name: FM-16
summary: >-
  2-op FM groovebox with five tracks (kick, snare, hat, perc and a filtered-noise clap), sixteen steps with per-step
  parameter locks, eight pattern banks and a song chain.
description: >-
  Four tracks are 2-operator FM voices and the clap is filtered noise. Holding a step and turning a knob locks that
  value to the step, and other pages cover envelopes, accent, probability, echo, tempo, swing and song mode. Patterns
  can be copied, pasted, randomised and cleared, tracks muted or soloed, and hits recorded live while playing. Banks A
  to H switch at the next bar, and the song page chains banks. Sync follows MIDI clock from USB or the TRS jack, and the
  FM-1 always sends its own clock over USB. It is built with the foma framework and ships a browser emulator and
  installer page.
