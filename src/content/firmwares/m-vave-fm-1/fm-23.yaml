device: m-vave-fm-1
name: FM-23
summary: >-
  Tekno and tribal groovebox: a 303-style acid bass, a two-voice lead and drone synth, synthesized percussion and a
  pattern generator that follows a fixed musical grammar.
description: >-
  The generator builds patterns from small note cells in Phrygian-family and other scales, leaves rests where the kick
  sits, adds accent and slide flags and runs 3-, 5- and 7-step percussion cycles against the 16-step grid. A five-part
  arc runs from a drone intro to a peak and an outro. It is a ground-up app on a platform kit derived from Felucca, as
  used in M-Vave-OP1, with a browser emulator, a web installer and a package checker. The README calls it version 0.1,
  in development.
status: active
