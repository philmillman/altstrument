  is SIL OFL 1.1. The repository commits M-VAVE's FM-1 V15 image as vendor/m-vave/FM-1_015.fwsc, which matches the file
  M-VAVE licenses under Apache-2.0 (git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd).
homepage: https://marcocasanova00.github.io/FM-23/webapp/installer/
distribution: browser-installer
install_notes: >-
  Use the web installer in Chrome or Edge after reading docs/SAFETY.md, which advises a flash backup and, until the
  firmware has run on a real unit, recovery hardware at hand. The installer can return the unit to official V15, and the
  platform's boot guard drops to the chip's boot mode after two failed boots or when OCT- and OCT+ are held for five
  seconds.
brick_risk: false
