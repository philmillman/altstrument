homepage: https://davidamomusic.github.io/fm-fam/fam/docs/FM-FAM-mirror.html
distribution: download
requires_stock: Any FM-1 firmware; the installers write the package over it
install_notes: >-
  Install the .fwsc package from a release with The Firmware Hub, M-UPGRADE or tools/fm1_install.py. M-UPGRADE refuses a
  package that has the same identity as the firmware already on the unit, which is the case when updating FM-FAM, so use
  tools/fm1_install.py or the install section of the mirror page, in Chrome or Edge, for that. The README says to back up first, with the mirror
  page, and not to unplug the unit while it writes. A unit that stops starting is brought back by installing another firmware package with
  The Firmware Hub or M-UPGRADE. Building from source needs the JieLi pi32v2 toolchain and AC79 SDK.
brick_risk: false
