device: m-vave-fm-1
name: FM-FAM
summary: >-
  Drum synth and 16-step sequencer for the FM-1 in the manner of a semi-modular analog drum synth: two oscillators,
  a kick with its own sequence, parameter locks, a sound saved with each pattern, an effects chain and random pages.
description: >-
  The synth voice has two oscillators with 16 wave types each, hard sync, FM, noise, a ladder or state-variable filter, three
  envelopes and a patch bay of eight virtual cables. A second voice, the kick, has its own 16-step sequence with pitch,
  volume, condition, ratchet and nudge per step. The main sequencer offers parameter locks, step conditions, ratchets, swing and
  nudge, with 176 patterns in 11 banks, a 32-slot song and a sound stored with every pattern. The effects chain has a
  compressor, stutter, delay, reverb, DJ filter and limiter. Other parts are 16 scales, presets, four projects that save
  by themselves, random pages that draw a whole sound, a percussion pattern or a melody, MIDI clock sync, and
  experimental Bluetooth MIDI and Bluetooth audio on the fm1-base stack. A browser page mirrors the screen and panel over USB, plays the
  panel from the computer, backs up and restores projects and installs a release from GitHub. The repository is a GitHub fork of
  fm1-base and keeps its README below the FM-FAM text, so the repository description still reads as the base. The README calls FM-FAM beta software.
