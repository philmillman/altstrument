device: m-vave-fm-1
name: FM-KICK
summary: >-
  Kick drum synthesizer with a sequencer of up to 32 steps for the FM-1: seven kick types, 48 parameters, live effects
  held on the keys, parameter locks on any step and generators, LFOs and user kicks.
description: >-
  The kick comes in seven types: 808, 909, 606, ANALOG, FM, a waveshaper with its own curve and a punch type with its
  own rumble. Each has 48 parameters. Twelve effects play while keys are held and a master chain follows them. The
  sequencer has up to 32 steps, three banks of sixteen patterns, four projects, parameter locks of any parameter on
  any step (recorded from the knobs with REC), a condition and a chance per step, nine generators and four LFOs. Notes
  can be recorded from the keys or from MIDI, and 32 user kicks can be stored. A new hit does not cut the previous
  one, which fades over 6 ms under it. The repository carries a browser player, a screen mirror page, a cheat sheet
  and a backup and restore of everything as an .fmkbak file. The README calls it beta software written by one person.
  The package runs on both flash chips the FM-1 has been sold with.
status: active
authors:
