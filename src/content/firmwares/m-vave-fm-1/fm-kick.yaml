  url: https://github.com/davidamomusic
source: https://github.com/davidamomusic/fm-kick
source_status: open
license: MPL-2.0
license_notes: >-
  The LICENSE file is the MPL-2.0 text. LICENSING.md says the platform code comes from fm1-base (MPL-2.0), felucca-bsp
  and a few Apache-2.0 and BSD-2-Clause parts of the Bluetooth stack that keep their own licences.
homepage: https://davidamomusic.github.io/fm-kick/kick/docs/play/
based_on: m-vave-fm-1/fm1-base
distribution: download
install_notes: >-
  Install the .fwsc package from a release with The Firmware Hub installer or M-UPGRADE. M-UPGRADE sees only the
  identity (FM-1_222 from 0.5.0), so it will not replace one FM-KICK with another; update with The Firmware Hub or
  install another firmware first. The README warns that installing writes the FM-1's flash, that the cable must stay
  connected while it writes, and that leaving FM-KICK means installing another firmware. Building needs the JieLi
  toolchain and AC79 SDK.
brick_risk: false
