device: m-vave-fm-1
name: FM Lab
summary: >-
  Six-operator FM synthesizer for the FM-1 made for learning FM: eight DX7-style voices with every parameter on a knob, algorithm,
  spectrum and envelope drawings, a filter, effects, an arpeggiator and a one-phrase looper.
description: >-
  Has no drums, patterns or song mode. It uses the DX7 engine as ported to integer C in dxsloop, with 32 algorithms, feedback,
  keyboard scaling, a pitch envelope and an LFO, and offers 20 factory voices and, from 1.2.0, 256 user slots in eight banks of 32, so that a DX7 bank fits one bank. The
  screens draw the algorithm live with each operator's level, the envelopes to scale, a spectrum and a scope. Later releases add a sample-rate setting down to 8 kHz, a bit-depth setting, the 3.5 mm MIDI input, MIDI bank select and a mono output option. It is built on Dinghy, which carries Felucca as SLOOP does, and the README
  reports about 26 percent of the audio interrupt budget for eight voices. The factory voices are Sven Trogus's, from
  dxsloop, and the README says no Yamaha or M-VAVE voice data is included.
status: active
authors:
- name: Jake Smith
  url: https://github.com/jsmith13
source: https://github.com/jsmith13/fm_lab
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only. firmware/src/dx7_core.c is Apache-2.0 AND GPL-3.0-only, from Dexed's msfa as ported in
  dxsloop. The Terminus font is SIL OFL 1.1, and JieLi SDK files are read from the user's own SDK checkout at build time.
homepage: https://github.com/jsmith13/fm_lab
distribution: download
install_notes: >-
  Download fmlab-1.2.0.fwsc from the release and install it with tools/fm1_install.py over USB, which asks before writing, or
  with the FM-1 Firmware Hub. Holding OCT- while switching on enters a USB rescue, which two crashes at boot also enter.
  Settings saved by 1.0.x carry over to 1.1.0, and the voices saved in the first user bank stay in place in 1.2.0.
brick_risk: false
tags: [synth-engine, fm, oscillator, lfo, filter, fx, arpeggiator, looper, editor]
