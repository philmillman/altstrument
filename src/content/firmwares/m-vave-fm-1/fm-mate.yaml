device: m-vave-fm-1
name: FM-MATE
kind: tool
summary: >-
  Windows and macOS desktop app that browses The Firmware Hub's catalogue, downloads packages, flashes them to an FM-1 with
  M-Flasher, backs up units and opens firmware in the FM-1 emulator.
description: >-
  A Tauri app with a Vue front end. It reads thefirmwarehub.com's catalogue, keeps downloaded firmware versions in a library,
  and drives the M-Flasher command line to back up the flash into a per-version saves folder and to flash a .fwsc package or
  restore a .bin backup. M-Flasher and fm1-emu are downloaded from their GitHub releases on request. A firmware or save can be
  opened in the emulator before installing. The author calls it an early beta, built largely with AI help, says it was tested
  on Windows with macOS to follow, and notes that the packages are unsigned. No firmware is bundled.
status: active
authors:
- name: EJTH
  url: https://github.com/EJTH
source: https://github.com/EJTH/FM-MATE
source_status: open
license: MIT
license_notes: >-
  The README says MIT and points to a LICENSE file, which is not in the repository. NOTICE.md lists the build dependencies
  and says M-Flasher and fm1-emu are fetched from their own repositories. No M-VAVE image is in the repository; the catalogue
  it reads hosts only the V15 file M-VAVE licenses under Apache-2.0 as its way back to stock.
homepage: https://github.com/EJTH/FM-MATE/releases
distribution: download
install_notes: >-
  Download the Windows installer or the Apple Silicon dmg from the releases page, or build with Node, Rust and the Tauri CLI.
  Flashing goes through M-Flasher in USB download mode. Restoring a .bin backup writes the whole flash, so use only a backup
  of the same unit.
brick_risk: true
tags: [flasher, librarian, emulator, utility]
versions:
