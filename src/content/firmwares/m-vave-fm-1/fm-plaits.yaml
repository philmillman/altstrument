source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and manual state GPL-3.0 with the FM1 SDK linking exception (M-VAVE's FM1 Open terms); there is no LICENSE
  file in the repository. Plaits-derived code keeps its MIT notice, and the installer is fm1-base's (MPL-2.0). Source
  is a zip in the repository (FM1_FM_PLAITS_v1_source.zip), built on M-VAVE FM1 Open V14.
homepage: https://narti-live.github.io/fm1-fm-plaits/
distribution: browser-installer
install_notes: >-
  One-button web installer on the project site, which arms M-VAVE's FM1 Open updater and can write M-VAVE's original V15
  back. Back up projects, voices and samples with the M-VAVE workbench first, since FM-PLAITS may lose what the stock
  firmware saved. The manual also describes building with a GitHub Actions workflow or the JieLi toolchain on Windows.
  A browser version of the instrument plays on the site.
brick_risk: false
