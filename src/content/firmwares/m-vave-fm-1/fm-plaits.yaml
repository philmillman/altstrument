device: m-vave-fm-1
name: FM-PLAITS
summary: >-
  One-voice generative synth built on M-VAVE's FM1 Open code: sixteen engines modelled on Mutable Instruments Plaits, a
  low pass gate, a generative melody sequencer, reverb, delay and MIDI out. No drums.
description: >-
  The engines are C re-implementations of the published Plaits algorithms, not a bit-exact copy: virtual analog,
  waveshaping, FM, grain, additive, wavetable, chords, vowel, swarm, noise, particles, string, modal, phase
  distortion, terrain and chiptune. A low pass gate sets pluck length or swell, and the melody generator, modelled on a
  Max for Live device by the author, picks notes from eight scales with density, length, speed, triplet, chance and slide
  controls. The sequencer follows the FM-1's own clock, so it follows PLAY and STOP, tempo, swing and external MIDI
  clock. The reverb and ping-pong delay run at half rate to fit the FM-1's RAM. Because the current JieLi compiler
  produces larger code than the one M-VAVE used, this build leaves out the stock editor pages and the 128 DX7 voices. The
  manual says it was tested only in the FM-1 browser simulator and not yet on hardware. The repository also holds an
  Android app version.
status: active
