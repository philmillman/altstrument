license: unspecified
license_notes: >-
  The repository has no licence file and the README gives no licence statement. The four factory bank .syx files were extracted from M-VAVE's Apache-2.0 V15 image in m-vave/fm1_open. No firmware package is committed.
homepage: https://github.com/OriolFF/FM1_ios
distribution: source-only
install_notes: >-
  Generate the project with xcodegen, open FM1.xcodeproj and run it on an iPad simulator or, with your own signing team, on a device. The app runs on the iPad only and does not flash an FM-1.
