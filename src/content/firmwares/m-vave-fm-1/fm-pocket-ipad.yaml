device: m-vave-fm-1
name: FM Pocket for iPad
kind: tool
summary: >-
  SwiftUI iPad app that recreates the FM-1's panel, 240x240 screen and six-operator DX7-compatible engine with the V15 factory banks, MIDI and SysEx, plus a groovebox mode offered as a second firmware.
description: >-
  Rights warning: the research folder commits M-VAVE promotional images, a retailer listing screenshot and screenshots taken from other firmwares' pages and documentation.
  The app is a reimplementation of V15's behaviour rather than an emulation of the chip: its own FM engine, effect chain, arpeggiator, a sixteen-step sequencer and a CoreMIDI and Bluetooth MIDI host. Its firmware menu holds the V15 imitation and FM Pocket Groove, which adds eight patterns with a synth track and an 11-lane drum track, a Euclidean generator, parameter locks and a perform layer. The 128 factory voices come from the V15 recovery image that M-VAVE licenses in fm1_open. It targets iPadOS 18 and builds with XcodeGen and Xcode. It writes nothing to a real FM-1.
status: active
