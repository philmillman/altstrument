versions:
- version: main @ 4659e40
  date: 2026-11-12
  url: https://github.com/MPASTEAU/FM-Stud1o-FM-1-Firmware/commit/4659e4037060bf65447d95d537d91e60f2d00b82
  notes: No tagged releases; this is the latest commit. Since the previous row, a pattern keeps its own arpeggiator settings, LIVE mode lets the white keys choose the pattern of every track and queues a pattern to start at the end of the selected track's pattern, pattern length offers 16 to 256 steps, and quantize is one setting for all tracks at 50 % by default. Later commits add a count-in that waits for the first note, live recording that keeps the keys as played in every voice mode, an 8-voice GRAIN, and a REC arm that follows the selected track; the LFO draw page is removed. The latest commits add volume-fade and filter-fade keys in LIVE mode, a count-in row set to off, on or note, removal of a drum lane's hits by holding its key while recording, and a pickup that takes a MIDI-turned HOME knob at 0 or 127.
