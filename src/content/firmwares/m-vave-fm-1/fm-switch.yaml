device: m-vave-fm-1
name: FM-SWITCH
kind: tool
summary: >-
  App for iPhone, iPad and Mac that installs and swaps FM-1 firmwares over USB using CoreMIDI, with a catalogue of
  community firmwares that can be saved for offline flashing; the Mac build also backs up and restores the whole flash.
description: >-
  The app speaks the FM-1's SysEx update protocol through the FM1Kit Swift package, including the reboot into
  the update loader, the identity check and resuming an interrupted write. Its firmware list merges the Firmware
  Hub catalogue with the lists on fm1-editor.com, mutant.cloud and the FM1 Resource Hub, can sort by the Hub's install counts, and finds .fwsc packages in GitHub
  releases and project pages. It shows a note on whether each firmware supports USB rescue mode, keeps saved and
  starred firmwares in sync through iCloud and can notify you when a saved firmware has an update. The Mac app also
  has a Backup and rescue page that uses the FM-1's USB download mode to back up and restore the whole flash and to
  write a firmware or bootloader straight to it, through a small root helper that asks for an administrator password.
  M-VAVE's official V15 is bundled so there is always a way back. A simulated FM-1 lets it run in the iOS Simulator.
  The first public release is a Mac build; the release text says the iPhone and iPad app is in TestFlight.
status: active
authors:
- name: Drew Robinson (ocean)
  url: https://github.com/ocean
source: https://github.com/ocean/FM-SWITCH
source_status: open
license: MPL-2.0
license_notes: >-
  The LICENSE file is the Mozilla Public License 2.0 (added with 0.2.1; earlier releases had no licence file). The FM1Kit package it depends on is MIT.
  App/Resources/Firmware/FM-1_015.fwsc is M-VAVE's licensed V15 recovery image from m-vave/fm1_open (Apache-2.0, git
  blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, 699,956 bytes), kept beside its licence text. The git blob hash of
  the bundled file matches. It is the only stock file in the repository.
distribution: download
install_notes: >-
  Mac: download FM-SWITCH.dmg from the release (signed and notarised, macOS 14 or later) and drag the app to
  Applications; it asks for an administrator password so that its flash tool can reach the FM-1 in download mode.
  iPhone and iPad: generate the Xcode project with xcodegen and build it (iOS 17 or later; project.yml expects an
  FM1Kit release). The app says that it cannot repair a device that no longer starts from an iPhone, since the chip's
  ROM recovery needs a computer; the Mac's Backup and rescue page covers that case.
brick_risk: true
tags: [flasher, utility, midi, ios, macos, backup]
versions:
- version: 0.2.1
  date: 2026-11-09
  url: https://github.com/ocean/FM-SWITCH/releases/tag/0.2.1
  notes: Warns before installing firmwares that only know the older flash chip, shows which FM-1 flash chips a firmware saves on, lets you switch between a saved release and a newer one, and moves the source under the MPL-2.0.
- version: 0.2.0
  date: 2026-11-08
  url: https://github.com/ocean/FM-SWITCH/releases/tag/0.2.0
  notes: Switching back from firmwares that refuse the chosen target (AMB-1, DUB-1, HYP-1 to V15, V16 or Open) now goes through MIDIMON first, with warnings beforehand. Asks which FM-1 to use when several are connected, warns about the newer flash chip, keeps per-install logs, and adds V16 and m-bootloader 2.1 installs to Backup and rescue.
- version: 0.1.1
  date: 2026-11-03
  url: https://github.com/ocean/FM-SWITCH/releases/tag/0.1.1
  notes: Adds sorting by most installed, filters that wrap and are remembered, a separate sort and filters for My firmwares, mutant.cloud as another firmware source, and keeps earlier saved releases of a firmware. Fixes the firmware list hanging for several seconds.
- version: 0.1.0
  date: 2026-10-30
  url: https://github.com/ocean/FM-SWITCH/releases/tag/0.1.0
  notes: First public release, for Mac; adds the signed disk image, whole-flash backup and restore, and update notices for saved firmwares.
