source: https://github.com/morbious22/FM1-800
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSE state GPL-3.0-only, as Felucca. Parts keep their own licences, listed in CREDITS.md and LICENSING.md: felucca-bsp is MPL-2.0 and the packages hold three Apache-2.0 JieLi SDK files. The licence does not cover Korg's Poly-800 programs, names or trademarks.
distribution: browser-installer
install_notes: >-
  Connect the FM-1 by USB and open the FM1-800 web installer in Chrome or Edge, then press Install; the README does not link the installer's address, and the package felucca.fwsc is attached to the release. The installer has a way back to M-VAVE's official V15 or V16, and programs and sequences saved in FM1-800 may be lost when going back.
brick_risk: false
