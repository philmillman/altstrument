device: m-vave-fm-1
name: FM1-800
summary: >-
  Fan-made Korg Poly-800 for the FM-1 with its 64 factory programs plus 64 user slots, Poly-800 style editing, chorus and a 256-note step sequencer, and an added phaser, tape echo, high-pass and MIDI clock in. Rights warning: the factory programs reproduce Korg's.
description: >-
  Rights warning: the 64 factory programs, with their names and 47 parameters each, are Korg's Poly-800 programs, read from a web prototype that the author built from Korg's circuit diagrams, and the repository includes them as generated data. The README calls the project a fan tribute not endorsed by Korg and does not discuss the programs' rights. The firmware replaces Felucca's engines with a Poly-800 voice model whose sound the author checked against that prototype by rendered measurements. PRESETS turns through bank A, the factory programs, and bank B, which starts as 64 INIT programs, and SELECT with KNOB 1 edits parameters the Poly-800 way. FX opens a phaser and a tape echo, and GLO opens global settings and a high-pass filter that the original lacks. REC records a sequence of up to 256 notes, and the sequencer runs on its own tempo or follows MIDI clock. The screen shows a sunset scene with the program name. It is a GitHub fork of Felucca that uses Felucca's hardware, display, MIDI, sequencer timing and update code, and the repository's default branch is fm1-800. The only release is marked as a pre-release.
status: active
authors:
