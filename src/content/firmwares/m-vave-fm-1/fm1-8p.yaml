source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README says GPL-3.0 and LICENSE is the GPL v3 text; the engine's source headers say GPL-3.0-or-later. fm1-dock (GPL-3.0-only), the JieLi toolchain and SDK files and fm1-emu are fetched by the build at pinned hashes and are not in the repository. data/jx8p-factory-1-32.syx is the JX-8P factory bank as downloaded from a fan site, with no stated licence.
homepage: https://ericdahl-dev.github.io/fm1-8p/
distribution: browser-installer
requires_stock: An FM-1 running fm1-dock for the .dock module; the solo .fwsc needs no particular firmware
install_notes: >-
  No release exists yet; the project page (Chrome or Edge, Web MIDI) installs the build from main with fm1-dock's own installer, which the page marks as not yet tested on hardware, and carries the .fwsc and .dock for download. CI also builds the packages as artifacts, or tools/fm1-build.sh builds them from a Linux checkout. The .dock module goes onto an FM-1 that already runs fm1-dock, over USB without flashing. The solo .fwsc has fm1-dock's safety checks and rescue modes (OCT- at power-on for USB rescue, OCT+ for a safe start). The README advises keeping the stock V15 firmware for recovery.
brick_risk: false
