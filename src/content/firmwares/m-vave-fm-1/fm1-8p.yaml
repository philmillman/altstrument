  notes: No tagged releases; this is the latest commit, which tests the MIDI clock's edge cases. Before it, commits add PG-8X's fastest amp attack on every key, step editing of bend and mod in the SEQ view with MIDI-in bend and mod taken into a written step, envelope fixes for key follow, a lazy envelope and a voice lifecycle interface, and a test that pins the screen's value text for every parameter. Before those, commits add a piano roll and step recording to the SEQ view, a boot screen with an LED sweep, and a lowpass filter modelled as two equal resonant sections. Before them, commits added per-step pitch bend and mod with jump or glide, saved with patterns, a pattern slot that loads, queues and saves from flash, a DCO-1 coarse tune, a program-change page, a key LED setting and a velocity curve for force-sensed keys. Before them, commits added a second theme called Night Panel, a settings record, a PLAY screen with the patch name and four performance knobs, a number jump that opens a parameter by typing its number after holding SEL, and user preset slots that a patch can be named and saved into and that load from flash. Before that the envelope curves, LFO rate and vibrato depth, chorus and high-pass positions are matched to PG-8X 2.0.13, and the filter envelope can follow envelope 2. Later commits match the oscillator sync and cross-modulation to PG-8X, set the oscillator mix levels and add output makeup gain with a soft clip, make the oscillator-pair renders cheaper, and add a script that checks a build still makes sound.
