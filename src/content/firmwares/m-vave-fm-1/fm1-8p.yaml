source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README says GPL-3.0 and LICENSE is the GPL v3 text; the engine's source headers say GPL-3.0-or-later. fm1-dock (GPL-3.0-only), the JieLi toolchain and SDK files and fm1-emu are fetched by the build at pinned hashes and are not in the repository. data/jx8p-factory-1-32.syx is the JX-8P factory bank as downloaded from a fan site, with no stated licence.
distribution: source-only
requires_stock: An FM-1 running fm1-dock for the .dock module; the solo .fwsc needs no particular firmware
install_notes: >-
  No release exists; CI builds the packages as artifacts, or tools/fm1-build.sh builds them from a Linux checkout. The .dock module goes onto an FM-1 that already runs fm1-dock, over USB without flashing. The solo .fwsc has fm1-dock's safety checks and rescue modes (OCT- at power-on for USB rescue, OCT+ for a safe start). The README advises keeping the stock V15 firmware for recovery.
brick_risk: false
tags: [synth-engine, oscillator, filter, lfo, fx, presets, midi]
versions:
- version: main @ 3451b2b
  date: 2026-11-14
  url: https://github.com/ericdahl-dev/fm1-8p/commit/3451b2b16153c8fa1d528e1865d10311efd4f019
  notes: No tagged releases; this is the latest commit. The latest commits add a second theme called Night Panel, a settings record, a PLAY screen with the patch name and four performance knobs, a number jump that opens a parameter by typing its number after holding SEL, and user preset slots that a patch can be named and saved into and that load from flash. Before that, since the previous row the envelope curves, LFO rate and vibrato depth, chorus and high-pass positions are matched to PG-8X 2.0.13, and the filter envelope can follow envelope 2. Later commits match the oscillator sync and cross-modulation to PG-8X, set the oscillator mix levels and add output makeup gain with a soft clip, make the oscillator-pair renders cheaper, and add a script that checks a build still makes sound.
