  notes: No tagged releases; this is the latest commit. The newest commits move the gate's clip records and cache keys to one place, make the engine's mix gain a named constant, add one output stage from the voices to the DAC with the device's gain and generate the VCF FREQ cutoff curve from a single definition. Before those, commits let SAVE delete a user patch or pattern, start a stolen voice's new note at once from the voice's levels as PG-8X does, match the JX-8P DCO envelope at byte 1 to PG-8X's 5 cents, record the CPU gate rows as their mean and range, and make the scorecard and engine checks fail closed when a tool fails. Before those, a commit added a scorecard section comparing spectra with PG-8X's at the same level, and others add portamento that glides exponentially from the last note played as PG-8X's does, make the saw oscillator fall as PG-8X's so sync and ring modulation match it, and add a CPU gate row for each mode's high-note chord. Before those, commits make the VCA level change live mid-note and glide as PG-8X's does, free voices 80 dB below the output, remove a comb effect from the synced oscillator under the CLAV patch, add a CLOCK OUT setting that sends MIDI clock, start and stop while playing and passes on a followed clock, move a voice's filter behind one seam, add KEY TRANSPOSE in the SEQ view where keys or MIDI notes held while playing set the transpose, and test the MIDI clock's edge cases. Before those, commits add PG-8X's fastest amp attack on every key, step editing of bend and mod in the SEQ view with MIDI-in bend and mod taken into a written step, envelope fixes for key follow, a lazy envelope and a voice lifecycle interface, and a test that pins the screen's value text for every parameter. Before those, commits add a piano roll and step recording to the SEQ view, a boot screen with an LED sweep, and a lowpass filter modelled as two equal resonant sections. Before them, commits added per-step pitch bend and mod with jump or glide, saved with patterns, a pattern slot that loads, queues and saves from flash, a DCO-1 coarse tune, a program-change page, a key LED setting and a velocity curve for force-sensed keys. Before them, commits added a second theme called Night Panel, a settings record, a PLAY screen with the patch name and four performance knobs, a number jump that opens a parameter by typing its number after holding SEL, and user preset slots that a patch can be named and saved into and that load from flash. Before that the envelope curves, LFO rate and vibrato depth, chorus and high-pass positions are matched to PG-8X 2.0.13, and the filter envelope can follow envelope 2. Later commits match the oscillator sync and cross-modulation to PG-8X, set the oscillator mix levels and add output makeup gain with a soft clip, make the oscillator-pair renders cheaper, and add a script that checks a build still makes sound.
