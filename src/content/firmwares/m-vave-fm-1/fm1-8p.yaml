device: m-vave-fm-1
name: fm1-8p
summary: >-
  Rights warning: ships Roland JX-8P factory tone data. Polyphonic two-oscillator analog-style synth with a 24 dB lowpass, a highpass, an LFO and a chorus, built as an fm1-dock module or a solo package; its engine is fixed-point C.
description: >-
  Rights warning: the 32 patches are the factory tones of the Roland JX-8P, converted from a SysEx bank that the repository commits unchanged; the author says only patch data and names are used, with no Roland logos or panel art. The synth engine is written from scratch in plain C99 without floating point. Each voice has two oscillators (saw, pulse, square or noise, with octave, fine tune, pulse width and a mix), a resonant 24 dB lowpass with key tracking and its own envelope, a four-position highpass, an ADSR amplifier envelope, an LFO routed to pitch and pulse width, velocity, unison, sustain pedal and pitch bend, followed by a stereo chorus with three modes. The engine supports up to eight voices, and the FM-1 module plays four. The module runs from the keys and from MIDI, starts on tone 17, shows the patch on the screen and has a VCF page on the knobs. A CPU-test firmware times the engine on the device, and a guide for running it on a real FM-1 is in the repository; the README does not say that the synth itself has been run on one, only in the fm1-emu emulator. A desktop render tool turns a MIDI file into a WAV. The project is not affiliated with Roland or M-VAVE.
