device: m-vave-fm-1
name: fm1-amy
summary: >-
  Six-voice synth that plays AMY's emulations of the 128 Roland Juno-60 factory patches, with eleven pages of knobs that
  mirror the AMYboard editor and USB MIDI in and out. Experimental; edited patches are not saved.
description: >-
  Runs AMY, the portable synthesizer library by Brian Whitman and Dan Ellis, inside the audio interrupt of a firmware
  built on X0X and Felucca. It keeps their hardware layer, USB, update loader, installer and safe mode, and replaces the
  instrument and screen. The PRESETS knob picks a patch from A11 to B88, SELECT or the panel buttons choose one of eleven
  pages, from the oscillators and LFO to the filter, envelopes, EQ, chorus, reverb and distortion, each coloured like the
  matching section of the AMYboard editor, and choosing a patch puts the knobs where that patch has them. Over USB the
  FM-1 is a MIDI instrument with velocity, pitch bend, sustain and a set of controllers, and it understands enough of the
  AMYboard editor's SysEx conversation for the editor to change its sound live while the FM-1's screen follows. The ECHO
  page does nothing for lack of RAM, AMY's DX7 patches and drum samples are left out to fit the flash, and AMY itself is
  not modified. The README says edited patches are not saved and the FM-1's own keys play at full velocity and are not
  sent out over MIDI unless built that way. It says the firmware has been built, installed and played on one FM-1. The
  repository also builds a host simulator and a browser emulator, and still carries X0X's groovebox sources.
status: active
authors:
- name: Dan Ellis (dpwe)
  url: https://github.com/dpwe
source: https://github.com/dpwe/fm1-amy
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only, the licence of X0X and Felucca; LICENSING.md lists where each part comes from. AMY is MIT and is
  compiled in from your own checkout, not kept in this tree. The tree still carries X0X's groovebox sources and
  assets under their own terms. The tests include two small flash-store fixture files (.bin) that are test data, not firmware.
homepage: https://github.com/dpwe/fm1-amy
distribution: download
requires_stock: M-VAVE V15 or X0X
install_notes: >-
  Download fm1-amy-0.1.0.fwsc from the release and install it with tools/fm1_install.py over USB; the firmware then
  reports itself as FM-1_269000100 and its MIDI port is named AMY FM-1. To build it instead, use an unmodified AMY checkout
  (needs Docker or an x86-64 Linux host, JieLi's toolchain and three AC79 SDK files). X0X's safe mode and update mode still work, and X0X's web installer can
  put M-VAVE's firmware back. Installing is at your own risk.
brick_risk: false
