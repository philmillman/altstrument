device: m-vave-fm-1
also_devices: [m-vave-smk-37, m-vave-blackbox, m-vave-pocket-amp]
name: FM-1 Backup & Restore
kind: tool
summary: >-
  Android app that backs up an M-VAVE FM-1 or SMK-37's whole flash over USB, keeps the backups in a library and restores them, and can
  rebuild a stock V15 recovery image for units that were never backed up.
description: >-
  Rights warning: the app bundles a 24 KB USB loader binary for the FM-1's WL82 chip whose origin and licence the
  repository does not state. The app restarts the FM-1 into its recovery mode, reads the full 1 MiB flash twice, checks the saved copy and adds it
  to a library where backups can be renamed, pinned, exported and restored. A restore writes the saved image back byte
  for byte except for the protected bootloader region, and cannot be cancelled once it starts; from 0.9.6 an emergency restore action also recovers the stock bootloader. Backups can also be
  imported from a .bin file. A menu option, Create recovery image, downloads M-VAVE's V15 package from the m-vave/fm1_open
  repository at a fixed commit, checks its size and SHA-256, and rebuilds a stock V15 flash layout that is added to the
  library as a backup; the app does not ship that package. From 0.10.0 the same app also handles the SMK-37 Pro and Elite and six other
  devices, which the README lists by device tag. It needs Android 8 or later, a USB OTG cable that carries data,
  and permission to run in the background so a transfer survives the screen turning off. The app checks GitHub for new
  releases at most once a day and uses no other analytics. The README says it was tested over 100 times across firmwares
  and versions, has a diagnostics menu item that verifies the bootloader's state (0.9.5), and asks for the VID/PID of any firmware it does not recognise.
status: active
authors:
- name: Chris Johnson
  url: https://github.com/workeffortwaste
source: https://github.com/workeffortwaste/fm1-backup-restore
source_status: open
license: MIT
license_notes: >-
  LICENSE (the licence was added in 0.9.3). The app bundles a 24 KB WL82 USB loader blob (app/src/main/assets/loaderblobs/usb/wl82loader.bin)
  whose origin and terms the repository does not state, and Material Symbols icons under Apache-2.0. The V15 package it
  downloads is M-VAVE's FM-1_015.fwsc from m-vave/fm1_open (Apache-2.0), fetched at run time and not stored in the
  repository.
homepage: https://github.com/workeffortwaste/fm1-backup-restore
distribution: download
requires_stock: V15 or a firmware with a compatible USB updater
install_notes: >-
  Install the APK from the latest release page on an Android 8 or later phone, connect the FM-1 with a data-capable
  USB cable and tap Connect to FM-1, which restarts it into recovery mode, then Backup FM-1. Backups live in the app's
  own storage and are lost if the app is uninstalled or its data is cleared, so export a copy. The README warns that
  flashing or restoring carries a risk of data loss or leaving the unit unusable, and that an interrupted restore can
  stop it booting normally; keep the cable and power connected until the restore is verified.
brick_risk: true
tags: [backup, flasher, android, recovery, utility]
