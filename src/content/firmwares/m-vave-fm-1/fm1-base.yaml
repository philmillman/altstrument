device: m-vave-fm-1
name: fm1-base
summary: >-
  MPL-2.0 base and template for FM-1 firmware on felucca-bsp: platform layer, host simulator, browser emulator,
  optional Bluetooth MIDI and audio and WiFi, and build, package and install tools, with a small template app to copy.
description: >-
  Provides the platform layer above the hardware (screen, drawing and fonts, panel and LEDs, audio, MIDI over USB
  and TRS, storage, a screen reader channel) so an app supplies only its own sound, screen and controls. The
  same app builds for the FM-1, a host simulator and a browser emulator. Bluetooth MIDI and WiFi are build
  options that cannot be combined, since the chip lacks the RAM for both. WiFi and the default Bluetooth stack need
  JieLi's SDK libraries; an own stack taken from Optimist (build option ble_stack = "own") links none of them and also
  offers pairing, connecting to Bluetooth MIDI devices and Bluetooth audio to headphones and speakers. The
  repository includes a skill file for moving a Felucca-based firmware onto it, which only works for firmware
  that keeps nothing of Felucca beyond what felucca-bsp and fm1-base already carry. The template is a flashable
  firmware with its own installer and emulator page, tagged as firmware rather than tool for that reason. The
  README calls it beta, says the platform interface may change before 1.0 and names CTL-1 and a WiFi radio
  firmware as the two firmwares built on it so far.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-base
source_status: open
license: MPL-2.0
license_notes: >-
  Every source file carries an MPL-2.0 header, and an app built on it may use any license (LICENSING.md). Some
  files in ble/ repeat parts of JieLi's AC79 SDK and are marked MPL-2.0 AND Apache-2.0. Fonts are SIL OFL 1.1.
  JieLi's binary Bluetooth and WiFi libraries are copied from your own SDK checkout at build time and are not in
  the repository. The own Bluetooth stack in bt/ is from Optimist by Henri David (GPL-3.0-only OR MPL-2.0, taken under
  MPL-2.0); it also carries Apache-2.0 SBC encoder code from Android and BSD-2-Clause micro-ecc, and a firmware built with it
  ships those licence texts.
homepage: https://charlesvestal.github.io/fm1-base/
distribution: source-only
install_notes: >-
  Clone with --recursive and build the template with tools/build.py (JieLi toolchain and AC79 SDK needed), then
  install with tools/fm1_install.py. The template's site also has a Chrome or Edge installer, a browser emulator
  and the template package, which that installer can replace with M-VAVE's V15 file that you download yourself.
  Back up before flashing.
brick_risk: true
