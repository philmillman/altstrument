device: m-vave-fm-1
name: FM1 Bass Station
summary: >-
  Port of a Novation Bass Station-style monosynth to the FM-1 with an integrated 303-style pattern sequencer, a 100-program
  factory bank, a 128-slot user bank and a USB Web MIDI editor.
description: >-
  Rights warning: the firmware embeds patch data recovered from Novation's Bass Station plug-in, its 100-program factory
  bank, and 38 patches from two Rekkerd community banks, and the repository keeps the plug-in preset file it was recovered
  from. Novation's executable and source are not included, and the notes say the engine and sequencer are clean-room code.
  The synth has two oscillators with modulation, a mixer and filter, with cutoff and resonance on the SELECT and ALGO
  knobs and four-control pages. The sequencer has a piano roll with gate, octave, accent and slide views, generate and
  mutate pages, and live octave transpose. Notes are declicked, the first boot fills empty user slots once, and the editor
  runs in Chrome over USB-C.
status: active
authors:
- name: Kayman18
  url: https://github.com/Kayman18
source: https://github.com/Kayman18/FM1-NovationBassStation
source_status: open
license: MPL-2.0
license_notes: >-
  The repository has no root LICENSE file and no licence statement. The project's own source files carry an
  SPDX-License-Identifier: MPL-2.0 header, which is what this value rests on; fm1-base, felucca-bsp and the SDK keep their
  licences in their directories. The factory programs, derived from Novation's plug-in presets, and the community patches
  (Rekkerd, said to be shared with author permission) are not covered by that header. The committed
  FM1-BassStation-RC1.fwsc (610,108 bytes) is the project's own build and matches none of M-VAVE's licensed images.
  source/reference/FM1-PolyWavetable-TEST81-M-Flasher.bin (1 MiB, blob d89dbdbe) is a full-flash M-Flasher image of the
  author's own PolyWavetable test build, not a stock image.
homepage: https://github.com/Kayman18/FM1-NovationBassStation/releases/tag/RC1
distribution: download
install_notes: >-
  Download the .fwsc package from the release (FM1-BassStation-RC1.fwsc, later FM1-BassStation-1.0.fwsc) for normal updates, which
  update the application region and keep the per-device user bank. The README gives no step-by-step install. From RC2 the
  releases also attach a clean-install M-Flasher image that writes the full flash, including the user bank and settings,
  and the notes keep it for clean installations or recovery. Back up and keep M-VAVE's updater at hand.
brick_risk: false
tags: [synth-engine, sequencer, generative, editor, usb-midi, midi]
versions:
- version: v1.0
  date: 2026-11-20
  url: https://github.com/Kayman18/FM1-NovationBassStation/releases/tag/v1.0
  notes: Adds shaded knobs with position markers, cutoff in hertz on Home and Filter, and CC74 for cutoff and CC71 for resonance over USB or TRS MIDI, plus the Bass Station plug-in's CC105 and CC106. The release also attaches a clean-install M-Flasher image that writes the full flash, which erases the USER bank.
- version: RC3
  date: 2026-11-20
  url: https://github.com/Kayman18/FM1-NovationBassStation/releases/tag/RC3
  notes: Starts presets at 50% cutoff when recalled, shows cutoff and resonance below the page title when SELECT or ALGO turns, and shows cutoff as a percentage and in hertz. Attaches a clean-install M-Flasher image beside the .fwsc.
- version: RC2
  date: 2026-11-20
  url: https://github.com/Kayman18/FM1-NovationBassStation/releases/tag/RC2
  notes: Redraws Home with a header and a larger preset-name panel, opens Presets with SEL, and gives the sequencer's Generate, Mutate and piano-roll editors larger grids with live values. The notes say the build and simulator tests ran without a physical unit.
- version: RC1
  date: 2026-11-06
  url: https://github.com/Kayman18/FM1-NovationBassStation/releases/tag/RC1
  notes: Makes SELECT the filter cutoff and ALGO the resonance on every page except the preset browser, uses a four-control layout on all parameter pages and lengthens the splash.
