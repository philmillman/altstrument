based_on: m-vave-fm-1/sloop
distribution: download
install_notes: >-
  The README is SLOOP's: install over USB from SLOOP's browser installer, and go back to M-VAVE's firmware with M-UPGRADE and the official V16 package. The battle mode is built in with BATTLE_MODE, and docs/BATTLE_PROTOCOL.md describes the commands. The repository publishes no releases.
