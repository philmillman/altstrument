device: m-vave-fm-1
name: FM-1 Battle
summary: >-
  SLOOP 2.8.5 with a battle mode for timed online beat competitions: the editor's SysEx protocol gains commands to arm, lock, run, submit and score a battle, with the player's own song left untouched.
description: >-
  The battle mode adds SysEx commands 100 to 111 to SLOOP's editor protocol, screens for the waiting room and the submit step, and locks that hold the pack's three synth sounds, the kit and the tempo while a battle runs. During a battle the player's song is not written to flash: the battle plays in RAM, uses one spare flash sector for its record, and the song is read back at the end. PLAY held for two seconds opens the submit screen, and a battle can be left from the waiting screens. The repository also carries a simulated FM-1 and a renderer that the site uses to render a submitted song. Everything else, including the README and guides, is SLOOP's. The repository is not a GitHub fork, its default branch is battle, and the changes are a few days of commits on top of SLOOP 2.8.5.
