device: m-vave-fm-1
name: FM-1 Big Screen +/Minus
kind: tool
summary: >-
  Logic, Ableton Live and FL Studio plug-in for macOS that shows the FM-1's screen, with Big Screen builds of Hortator and MNM-1 that send it and a host-clock sync button; the README is in French.
description: >-
  The repository builds three things in GitHub Actions: a Hortator and an MNM-1 firmware package, each made from the original project at a pinned commit with Big Screen code added, and a plug-in for macOS 10.15 on Intel, as an Audio Units MIDI effect for Logic, a VST3 audio effect for Ableton Live and FL Studio, and a standalone app. The Big Screen code is Patrick Kellogg's screen-over-SysEx protocol, so the plug-in also reads ChoralRoot, JIANT FM, Sloop and Melodee builds that carry it. The firmware patch only adds lines, and a later one adds remote editing, so the plug-in can place sequencer steps, solo and mute tracks, drag track levels and undo up to 12 edits from the screen. The plug-in has two skins, a backlit-screen look and an amber LED scoreboard. Its SYNC / HOST button sends MIDI clock from the host so the FM-1 follows the project tempo, starts on play and stops on stop, with an offset of minus 50 to plus 100 ms. The firmware packages are unofficial builds, and the README says that the Hortator and MNM-1 authors have nothing to do with them. Installation is through web installers on the repository's GitHub Pages, and the plug-in is copied into the plug-in folders from Terminal. Both releases are pre-releases.
