license: MIT
license_notes: >-
  Read in the repository's LICENSE file, which names +/Minus as the copyright holder and credits Patrick F. Kellogg for the screen_mirror and bs_mirror files. The same file says that the Hortator and MNM-1 firmware builds are GPL-3.0-only as a whole, with their source in the original repositories at the pinned commits plus firmware-patch/, and that the plug-in uses JUCE under JUCE's own licence. The skin fonts are under the SIL Open Font License and are fetched at build time. No M-VAVE firmware file is in the repository.
homepage: https://github.com/suburbbeat-hub/FM1-Big-Screen
based_on: m-vave-fm-1/fm1-big-screen
distribution: browser-installer
install_notes: >-
  Connect the FM-1 directly to the computer over USB, without a hub, open the installer page in Chrome and choose Hortator or MNM-1 with Big Screen. The README says to go back to the official firmware with M-VAVE's M-UPGRADE and the FM-1 V15 file. The plug-in zip is built for macOS 10.15 on Intel and installed with copy and quarantine-removal commands in Terminal. It has to be validated with auval, and in Logic SysEx needs to be ticked in the project's MIDI input filter.
brick_risk: false
