  title: "FM-1 Mirror + Spyglass for Android: Big Screen, MIDI Bridge & Note Spyglass, All in One"
  credit: AIKellogg
  first_party: true
  found_via: https://github.com/pfkellogg/fm1-mirror-spyglass-android#readme
