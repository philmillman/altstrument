device: m-vave-fm-1
name: FM1-Chord (TwistedGenetics)
summary: >-
  Chord-set player after the Roland J-6 and Captain Chords: a chord on each of the 27 keys, a ten-voice chord synth,
  strum, arpeggiator and latch, with a web editor that suggests what to play next.
description: >-
  Each key plays a chord that is set by root, one of 22 chord types or custom notes, inversion, voicing, slash bass and
  octave, and LEARN captures a chord from played notes. Factory content began as 18 chord sets, among them thirteen in F
  built on Phrygian progressions, and grew to 118 with the Roland J-6's 100 sets in 0.3, plus 20 empty user slots and, by 0.7, 42 sounds. The synth began with two oscillators, a
  sub and FM, a 12 dB filter, a chorus and a reverb, and since 0.6 and 0.7 adds more filter types, two LFOs, a mod matrix, wavetables and effects, and notes go to the built-in synth, to MIDI out or to both. The web
  editor works without an FM-1, previews sets with a JavaScript copy of the player, rates next-chord suggestions as
  strong, OK or far, records progressions to MIDI files and exchanges sets with the FM-1; an iPad build of it is a rolling
  pre-release, and from 0.9 each release also carries a Max for Live MIDI effect for Ableton Live that plays the sets. The release notes call it a beta that has not been tried on a real FM-1. It is a separate project from
  math0ne's fm1-chord.
status: active
authors:
- name: TwistedGenetics
  url: https://github.com/TwistedGenetics
source: https://github.com/TwistedGenetics/FM1-Chord
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and LICENSE is the GPL-3.0 text. docs/UPSTREAM.md credits X0X (as a pinned submodule),
  Felucca and DREADNOUGHT for the platform, build tools, flasher and iPad wrapper, and lists the OFL-licensed Barlow font.
homepage: https://twistedgenetics.github.io/FM1-Chord/editor/
distribution: browser-installer
install_notes: >-
  Back up the FM-1, open the project's web flasher in Chrome or Edge with the unit on USB and pick a release, or
  download FM1-Chord-0.10.fwsc from the release. Read docs/RECOVERY.md first. The update loader writes the app header
  last, so an install cut off part-way comes back in update mode.
brick_risk: false
tags: [chords, synth-engine, performance, arpeggiator, editor, flasher, web-midi]
versions:
- version: '0.10'
  date: 2026-11-22
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.10
  notes: The editor's For Ableton button saves My sets as a .fm1bank file that the Ableton device loads, and the editor opens .fm1bank files. The release page links the changelog.
- version: '0.9'
  date: 2026-11-22
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.9
  notes: Adds a Max for Live MIDI effect for Ableton Live 12 that plays the sets with the FM-1's voicings, strum and arpeggio into any instrument, attached to the release as a zip. The release page links the changelog.
- version: '0.8'
  date: 2026-11-22
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.8
  notes: Rates each chord on the FM-1's chord pages against the chord before it as strong, OK or far, shows the same in the editor, and gives the FM-1's screen and the editor a dark panel look with knobs.
- version: '0.7'
  date: 2026-11-21
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.7
  notes: Adds supersaw, noise and wavetable oscillators, osc B tuning, sync and ring modulation, a bit crusher, tape wobble and a phaser, 15 more sounds (42 in all) and a VOICES setting of 4 to 10.
- version: '0.6'
  date: 2026-11-21
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.6
  notes: A bigger synth with four filter types at 12 or 24 dB, two LFOs, a mod envelope, a six-slot mod matrix, a tempo-synced delay and four macros on a new MACRO page, plus 16 more sounds.
- version: '0.5'
  date: 2026-11-21
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.5
  notes: Fixes OCT- and OCT+ doing nothing on sets with voice leading on, the octave stopping at the bottom on low chords, and the iPad app's sound preview not changing.
- version: '0.4'
  date: 2026-11-21
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.4
  notes: Live sync between the editor and the FM-1, a SAVE prompt on the unit to overwrite, save as new or replace, an Expand my progression suggestion and pasting chord sets from text.
- version: '0.3'
  date: 2026-11-21
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.3
  notes: Adds the Roland J-6's 100 chord sets as factory sets, with the J-6's voicings.
- version: '0.2'
  date: 2026-11-16
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.2
  notes: Adds thirteen factory sets in F on Phrygian progressions and three sounds (void pad, dub chord, bell stab).
- version: '0.1'
  date: 2026-11-16
  url: https://github.com/TwistedGenetics/FM1-Chord/releases/tag/v0.1
  notes: First beta, not yet tried on a real FM-1; five factory sets, 20 user slots, the chord synth and the web editor.
