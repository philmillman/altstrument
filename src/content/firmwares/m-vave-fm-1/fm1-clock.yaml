homepage: https://joakimskurk.github.io/fm1clock/
distribution: browser-installer
install_notes: >-
  Use the installer on the project page (Chrome or Edge over USB), or build with the Makefile and JieLi's toolchain, then install build/fm1clock.fwsc over USB-MIDI with tools/fm1_install.py or through the Firmware Hub.
  A package from a CI run can be tried in the fm1-emu browser emulator. Holding OCT- while switching on reaches the USB rescue.
