device: m-vave-fm-1
name: FM1 Clock
kind: firmware
summary: >-
  Clock for the FM-1: a pendulum wall clock and a cuckoo clock that strike the hours with bells rebuilt as FM synthesis of about four hundred operators.
description: >-
  Turning ALGORITHM switches between the two clocks, which keep one time from the crystal. The wall clock ticks every half second and strikes the hours
  on a gong modelled from a recording taken apart into 742 modes, and the cuckoo clock opens a door, shows a bird and calls on two FM pipes. All sound is synthesised and no
  recording is included. SELECT and PRESETS set minutes and hours, the key lights follow the pendulum or flash the hour, and MIDI CC 20 to 22 set the time from a computer.
  The unit has no battery-backed clock, so it starts at 10:10 each time. It is a Dinghy 0.5 app from the same author as RoboSeq, SkurkyMello and Star Distroyer. The README
  calls it 0.1, tested in CI, the emulator and on a computer and not yet tried on a real FM-1. The ENV key winds the cuckoo clock by hand. The project page installs it from the browser and runs the firmware in the page.
