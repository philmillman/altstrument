device: m-vave-fm-1
name: FM-1 Companion Suite
kind: tool
summary: Linux desktop suite for the FM-1, built for the Raspberry Pi 5, with backups, firmware installs, rescue tools, preset and sample management, project export, and a simulator that runs Melodee from a device backup.
description: >-
  Rights warning: the suite installs M-VAVE's stock firmware by download, taking V15 from M-VAVE's fm1_open repository
  and V16 from M-VAVE's own server at run time. No stock image is committed to the repository.

  The app gathers device profiles, backups with search and comparison, a firmware catalog and installer, the installed
  firmware's own web editor run offline, presets with DX7 voice import, samples and kits, Melodee project viewing and export,
  composing from MIDI files, and a MIDI tool. Its Studio page runs Melodee on the computer with the full device state from a
  backup. The firmware features target the Felucca family (Melodee, Skiff, SLOOP) and the official firmware. The interface, help
  and documentation are in English from 2.4.0, with German as a translation and a kit for adding languages. From 2.7.0 the suite
  bundles M-Flasher, m-bootloader 2.4 and the SLOOP 3 application area and drives them itself, with whole-flash backups and
  write-backs onto the unit they came from, m-bootloader install and removal, firmware through download mode and SLOOP 3
  installs. The 2.7.0 notes say most of this ran on a real earlier FM-1 and list what did not in docs/UNTESTED.md.
status: active
authors:
- name: bit-wmike
  url: https://github.com/bit-wmike
source: https://github.com/bit-wmike/fm1-companion
source_status: open
license: GPL-3.0-only
license_notes: >-
  The bundled simulators are built from M-VAVE's FM1 Open source and from Melodee's source, with notices in
  fm1companion/sims/*/NOTICE. The stock V15 it fetches is M-VAVE's Apache-2.0 FM-1_015.fwsc from m-vave/fm1_open; V16 carries no
  such licence and comes straight from M-VAVE.
distribution: download
install_notes: >-
  Runs on Raspberry Pi OS and other Debian or Ubuntu systems. Install from the release's .run assistant or .deb package, or
  clone the repository and run install.sh, which asks for sudo to add system packages. From 2.7.0 every write is preceded by a whole-flash backup that cannot be skipped, and the suite offers a way back to a backup of the unit, SLOOP 3, a Felucca-family firmware or V15. Make a backup before using firmware
  installs or rescue, which the author marks as at your own risk.
brick_risk: false
tags: [backup, flasher, recovery, utility, editor, emulator, simulator, presets]
versions:
- version: v2.7.0
  date: 2026-11-23
  url: https://github.com/bit-wmike/fm1-companion/releases/tag/v2.7.0
  notes: Bundles M-Flasher 0.12.1, m-bootloader 2.4 and SLOOP 3 3.4.0 and drives them from the app, with whole-flash backups and write-backs, m-bootloader install and removal, firmware through download mode and SLOOP 3 installs, each write behind a mandatory backup. Adds a Back to dialog, asks which FM-1 it is after units are swapped and recognises FM1 Open by its USB ID. The release page lists what was not tried on hardware.
- version: v2.6.1
  date: 2026-11-19
  url: https://github.com/bit-wmike/fm1-companion/releases/tag/v2.6.1
  notes: First package since 2.4.0, covering the source-only 2.5.0 and 2.6.0 releases as well. Adds support for the newer FM-1 with the UC25HQ80 flash chip (it installs only firmware known to support that chip), recognises SLOOP 3 beta and m-bootloader's MIDI MODE, and fixes device profile handling, Raspberry Pi OS Bookworm problems and Studio export and write back crashes. Blocks firmware-update commands from web pages and removes more personal details from bug reports.
- version: v2.4.0
  date: 2026-11-05
  url: https://github.com/bit-wmike/fm1-companion/releases/tag/v2.4.0
  notes: Makes English the source language of the interface, help centre and documentation, keeps German as a translation and adds a translator kit with templates for new languages.
- version: v2.3.2
  date: 2026-11-04
  url: https://github.com/bit-wmike/fm1-companion/releases/tag/v2.3.2
