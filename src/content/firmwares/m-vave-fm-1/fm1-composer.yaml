license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only for COMPOSER and the Dinghy platform under it. The Felucca-Engines sound engines are MIT and the Terminus font is SIL OFL 1.1. The designburg logo is not under the GPL and is not part of the firmware.
homepage: https://cindulasai.github.io/fm1-composer/
based_on: m-vave-fm-1/dinghy
distribution: source-only
install_notes: >-
  The firmware is built by the repository's GitHub Actions workflow (gh run download -n composer-fwsc), and the fm1c tool pushes pieces to the unit over USB. The README says it has not been run on real hardware and that installing community firmware is at your own risk. It is built on the Dinghy platform, which keeps its update loader and writes only the firmware area, so the FM-1's ROM boot mode remains the way back.
brick_risk: false
