device: m-vave-fm-1
name: FM-1 Core platform
summary: >-
  MIT-licensed hardware platform for building FM-1 firmware: display, keys, encoders, LEDs, audio and packaging code
  derived from FM1 Open, with the GPL application and web code removed and a sine example on top.
description: >-
  The platform replaces the board layer of M-VAVE's FM1 Open with new code for the timebase, panel scanning, LCD, ALNK audio
  DMA, mixer and linker script, and a Python build and packaging path that writes a .fwsc. M-VAVE's binary FM engine,
  its C runtime and boot resources are kept in the repository under M-VAVE's own permission to link and redistribute them for
  FM-1 firmware, and the repository's SDK files are identical to the ones in m-vave/fm1_open. Applications supply a
  few hooks and can replace the render and output mixing functions. The README says the example builds, links and packages
  but has not yet been run on hardware, and that no GPL-3.0 code remains in the tree.
status: active
authors:
- name: Regroove | RGRV
  url: https://rgrv.nl/
source: https://github.com/rgrvmusic/fm1-core
source_status: open
license: MIT
license_notes: >-
  MIT covers platform/, include/, tools/ and examples/. The binary engine in sdk/lib/libfm1_engine.a carries M-VAVE's separate
  permission to link and redistribute it for FM-1 firmware, the boot and update files in sdk/tools/pack are Apache-2.0, and
  other parts keep their own notices, as THIRD_PARTY.md records. The committed SDK binaries have the same git blob hashes
  as the files in M-VAVE's fm1_open repository.
distribution: source-only
install_notes: >-
  Needs the JieLi PI32v2 toolchain 2.5.3 and Python 3.10 or newer. Run tools/build.py --package to produce build/fm1.fwsc.
  The author has not run it on hardware, so keep a stock recovery image and know how to enter the bootloader before flashing.
brick_risk: true
tags: [platform, sdk, fork]
