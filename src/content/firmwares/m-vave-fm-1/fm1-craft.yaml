device: m-vave-fm-1
name: FM-1 CRAFT
summary: >-
  Controller firmware that turns the FM-1 into a hardware panel for FigCraft, a Figma tool: keys send hotkeys, knobs send relative controllers, and the screen shows the selected layer and four values.
description: >-
  The FM-1 makes no sound in this firmware. Its 27 keys send notes on MIDI channel 16, the four knobs, SELECT, ALGORITHM and PRESETS send relative CCs, MASTER sends an absolute CC and the 14 buttons send CCs, with HOME, ENV, LFO and ARP switching between the POS, SIZE, STYLE and TEXT pages. A script on the computer, named fm1_figcraft.py in the README, talks to FigCraft and sends SysEx frames that fill the screen with the selected layer's name and four value cards; without frames for three seconds the header reads NO LINK. docs/PROTOCOL.md documents the messages. The companion script is not in this repository, and no repository for it was found on the author's account. It is built on fm1-base and felucca-bsp and has a host simulator test.
