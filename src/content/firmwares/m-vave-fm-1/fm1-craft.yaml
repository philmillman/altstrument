distribution: source-only
install_notes: >-
  Run the Build firmware workflow on GitHub (Actions, Run workflow) and take craft.fwsc from the run's packages artifact, or build locally with ./build.sh on Linux x86-64 or WSL2 with the JieLi toolchain and AC79 SDK. Install with python3 base/tools/fm1_install.py app/build/craft.fwsc. The README says M-VAVE's updater or the Felucca or CTL web installers put another firmware back. ./build.sh --host runs the host simulator.
