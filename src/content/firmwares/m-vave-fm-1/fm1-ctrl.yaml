distribution: source-only
install_notes: >-
  No release yet. After initialising the fm1-base submodule, platform/tools/build.py app needs the JieLi pi32v2
  toolchain (and the AC79 SDK for Bluetooth) and produces app/build/ctrl.fwsc, which the platform's
  fm1_install.py installs over USB. Back up first and have M-VAVE's updater ready.
