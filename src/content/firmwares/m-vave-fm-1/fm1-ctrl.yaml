device: m-vave-fm-1
name: FM-1 Ctrl
summary: >-
  Thin controller firmware that sends the FM-1's keys, encoders and buttons out as plain USB and Bluetooth MIDI,
  with aftertouch from 20 keys, so the hardware can drive a firmware's browser emulator or a DAW.
description: >-
  Contains no sound engine, sequencer or storage; the mapping lives in the receiving host. The 27 keys send notes 53
  to 79 with velocity, 20 of them also poly aftertouch, the seven encoders send relative CC 20 to 26, the 14 buttons
  CC 40 to 53 and MASTER CC 27 plus the CC 7 and CC 39 pair. The panel's LEDs and screen now show only what is held
  on this unit; MIDI coming back is counted and ignored, which replaces the earlier LED feedback on CC 54 to 67.
  The firmware was ported onto Charles Vestal's fm1-base platform, which supplies the hardware layer and Bluetooth
  MIDI, so the app is a single source file. The repository has a host simulator, a browser panel emulator that shows
  the MIDI bytes, contract tests that run the real app code on a fake platform, and a shim that drives other
  firmwares' browser emulators. A commit message says the Bluetooth heap use was measured on an FM-1; the README
  does not report a full hardware test.
