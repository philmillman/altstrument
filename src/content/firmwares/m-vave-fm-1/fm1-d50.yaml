versions:
- version: v0.95
  date: 2026-11-25
  url: https://github.com/mwedmark/fm1-d50/releases/tag/v0.95
  notes: Softer playing keeps a patch's balance, with a velocity curve setting for the FM-1's keys, a high-EQ cut that reaches the top of the range and wider chorus stereo, all checked against recordings of a real D-50. Also adds EQ and chorus edit pages, a polyphony cap, WRITE to save the current patch into bank 1, which is kept in flash, the D-50's power-on message and SysEx fixes. The release does not include Roland data.
- version: v0.9
  date: 2026-11-23
  url: https://github.com/mwedmark/fm1-d50/releases/tag/v0.9
  notes: First release, built by the project's CI from a tag. Adds MIDI controls, aftertouch from the FM-1's keys, D-50 SysEx with a Data Transfer menu, Chase Play, six patch banks of 64 (384 patches), the D-50's LCD views, Output and Chase setup pages, K1 and K2 as the tone and partial balance, and an install page that writes your own D-50 data. The package holds no Roland data.
