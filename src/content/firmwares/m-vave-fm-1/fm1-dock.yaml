versions:
- version: 0.7.1
  date: 2026-10-31
  url: https://github.com/joakimeriksson/fm1-dock/releases/tag/v0.7.1
  notes: Scintilla's synth sound is brought closer to the Elka Synthex, with band-limited hard sync, a remade resonance curve and a regenerated factory bank.
- version: '0.7'
  date: 2026-10-31
  url: https://github.com/joakimeriksson/fm1-dock/releases/tag/v0.7
  notes: >-
    Bluetooth MIDI that holds a connection with both CPU cores running, five added modules, a master EQ and MIDI options
    for every module, and a catalog and installer page. The first release built and signed on GitHub from source, with
    packages for the SMK-37 models.
- version: '0.6'
  date: 2026-10-25
  url: https://github.com/joakimeriksson/fm1-dock/releases/tag/v0.6
  notes: >-
    Adds optional BLE-MIDI, sending a file from the computer to the running module without writing flash, solo
    builds of a single module, and a safer boot (no boot firmware in a release, key reads at power-on). Installing
    over 0.4 keeps deployed modules, settings and presets.
- version: '0.4'
  date: 2026-10-25
  url: https://github.com/joakimeriksson/fm1-dock/releases/tag/v0.4
  notes: >-
    First release under the fm1-dock name, adding OberVave as a module, module banks by index and code that runs
    from RAM and from deployed modules.
