device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: fm1-dock
summary: >-
  One firmware for the FM-1 that is installed once and then hosts synths as modules in flash, switched from a
  picker on the FM-1 and deployed over USB MIDI without reflashing.
description: >-
  A fork of Dinghy that keeps its update path and USB rescue and adds a host that loads modules from flash. A
  module is a table of functions (render, note, ui, draw and others) at the start of its image, linked against
  nothing of the host's; the host checks the header, ABI version and CRC before running it. HOME opens a picker
  on the FM-1's screen, and the host starts whichever module played last. A module that crashes twice in a row
  is skipped at boot, and one that renders slower than real time is stopped in favour of the built-in sine, so
  USB and the updater stay available. Holding OCT+ at power-on starts the sine only, and holding OCT- starts the
  USB rescue. The 0.6 package ships CS-1 (twochannels), Scintilla (the author's Elka Synthex port) and OberVave
  (zvenson), plus Dinghy's four-voice sine as the built-in module. FM-1 SID, the author's Commodore 64 SID
  firmware catalogued separately, two modules by Charles Vestal, AMB-1 (a generative ambient machine) and
  FoMni (an Omnichord-style chord harp), and from 0.7 five more (PatttF's FM-106, Charles Vestal's MONK-1, FiMba-1 by
  Adam Sowers, npi3pak's GATOR and sbegueria's DUB-1) are not in the package and are added to the dock from the
  project's page or the command line. 0.7 also adds Bluetooth MIDI that holds a connection, the second core running
  with Bluetooth on, a master EQ and a module catalog on the project page, and ships separate packages for the
  SMK-37 Pro, SMK-37 Elite and MKE-P37. A module that accepts data can be sent a file over USB that is never written to flash, and
  a solo build can package one module of your own on fm1-dock with its USB, installer and rescue. Since 0.6 the
  picker's last line turns BLE-MIDI on (off by default), and OCT+ at power-on is a safe start that runs the sine
  only with the radio off. Your own modules are built with the repository's Python tools and deployed from the
  command line or by dropping a .dock file on the project's web console, which also shows the log, crash records
  and render load over WebMIDI and runs small probe programs on the chip. The same package runs in the author's
  fm1-emu emulator. The project was called harbor until
  2026-10-25 (not the Android app of that name). It is built on Dinghy and on the platform code of Felucca as
  carried by SLOOP, and its repository says it is not affiliated with M-VAVE.
status: active
