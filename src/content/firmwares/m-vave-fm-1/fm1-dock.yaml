source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE and LICENSING.md in the repository. The platform code (HAL, loader, USB, updater, recovery and tools) is
  Leo Kuroshita's Felucca code with SLOOP's changes, the base app and wiring are zvenson's Dinghy, and the key
  force sensing comes from Velo by way of CS-1; the module wrappers and host are the author's. Modules keep their
  own authors' terms inside the GPL-3.0-only whole, and the bundled reSID 0.16 is GPL-2.0-or-later. The logo is
  excluded from the GPL (copyright designburg, all rights reserved). The release package is built from this
  source with JieLi's uboot.boot, cfg_tool.bin and eq_cfg_hw.bin read from the SDK checkout at build time
  (Apache-2.0). It is a new GPL build of 610,110 bytes, not M-VAVE's stock image, so the licensed FM-1 V15
  file (699,956 bytes) is not involved.
homepage: https://joakimeriksson.github.io/fm1-dock/
distribution: download
install_notes: >-
  Download the fm1-dock .fwsc package from the releases page and install it over USB with the repository's
  tools/fm1_install.py (needs Python with mido and python-rtmidi); it asks before it writes and then restarts
  into fm1-dock. The SMK-37 models have their own packages, described in the repository's SMK37.md; an FM-1 package is
  refused on an SMK-37 and the other way round. The README says the package also answers the FM-1 Firmware Hub's updater, which is the way
  back to any other firmware or to the official one, and that installing a newer fm1-dock keeps deployed
  modules, settings and presets. The author states that installing firmware is at your own risk. OCT- held at
  power-on starts the USB rescue. Building needs Linux x86-64 (or Docker or WSL), the JieLi toolchain and files
  from the JieLi AC79 SDK. The README says the build fails on what would brick the FM-1.
brick_risk: true
tags: [platform, sdk, synth-engine, usb-midi, usb-audio, emulator]
