device: m-vave-fm-1
name: Haave
summary: >-
  Ambient instrument fork of Felucca with no menus or drums: PLAY starts a chord progression, white keys switch
  layers, black keys jump to chords and four knobs set space, echo, glow and motion. Formerly called Drift.
description: >-
  Replaces Felucca's keyboard, interface and screen with a small set of controls and keeps Felucca's engines,
  effects, USB, update loader and storage. Seven layers (pad, bass, arp, sparkle, melody, voice, shimmer) play
  notes that stay inside the chosen key, and fourteen presets called worlds, five behaviours and a tide setting
  for how much it changes by itself shape the character. Held punch-in effects and one-press moments
  (gong, breath, cascade, swell) are timed to the beat. The README says it is a work in progress that runs in
  the browser emulator and has not been flashed to an FM-1, and the install page says it is coming soon. The
  project was renamed from Drift to Haave on 2026-10-18 and the repository is now fm1-haave. The author says it is developed with AI
  coding agents. Building with FELUCCA_HAAVE=0 gives plain Felucca.
status: active
