  notes: No tagged releases; this is the latest commit. Since the previous row the repository adds the platform-based package, whose drum voices and PO-12 kit use less processing time, and the automatic save waits for STOP while the groove plays. Commits since then, up to the project's 47th test build, add a compressor mix control, a distortion send lock, a faster screen refresh, an accent row on a black key, a start with an empty pattern and a random kit, a chord board for STRINGS, live takes with held lengths for STRINGS and BASS, saving your own sounds with GLO and SAVE, a green PLAY light, fills that build over the whole bar and a longer beat that copies the pattern, and chaining of patterns.
