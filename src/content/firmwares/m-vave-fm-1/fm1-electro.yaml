device: m-vave-fm-1
name: FM1-Electro
summary: >-
  Electro groovebox built on FM1 Open: a TR-808 style drum machine and a PO-12 kit, plus MKS-50 and JP-6 style synth engines in rhythm,
  strings and bass sections, with arpeggiator, step sequencers, effects and a mix bus.
description: >-
  Four sections run on one clock, each with four pattern slots A to D. BEAT is the drum machine, built from the
  808's circuit with resonators and a trigger-height accent, and a 16-sound PO-12 kit that is synthesised, not sampled.
  RHYTHM, STRINGS and BASS use the MKS-50 or JP-6 engine with a note or chord sequencer. The mix chain has a drum bus
  compressor, kick ducking, gated reverb and a master limiter. The README is in German. The firmware is inserted into a copy of
  M-VAVE's FM1 Open, which the build script patches, and the repository has a prebuilt test package in firmware/. Its
  notes say the first build restarted in a loop on a real FM-1 because of a divide by zero, and that the current build
  is the first with the fix and has not been tried on a device.
status: active
authors:
- name: robtron-byte
  url: https://github.com/robtron-byte
source: https://github.com/robtron-byte/FM1-Electro-one
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md is GPL-3.0 only with M-VAVE's FM1 SDK linking permission. The device build links M-VAVE's closed
  binary SDK library, which is not in the repository (THIRD_PARTY.md). The DSP helpers under third_party/daisy808 are MIT.
  firmware/FM1_ELECTRO.fwsc is the author's own build, not a stock image.
distribution: download
install_notes: >-
  Back up projects and samples first, since they are lost on the switch. Send firmware/FM1_ELECTRO.fwsc with a flasher
  that accepts custom packages (fm-static, M-Flasher or tools/fm1_install.py). The original firmware can be put back
  with M-VAVE's tools, and the bootloader's download mode or FM-1 Transporter covers a unit that will not start.
brick_risk: true
