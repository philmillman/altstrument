device: m-vave-fm-1
name: FM1-Electro
summary: >-
  Electro groovebox built on FM1 Open: a TR-808 style drum machine and a PO-12 kit, plus JX-8P and JP-6 style synth engines in rhythm,
  strings and bass sections, with arpeggiator, step sequencers, effects and a mix bus.
description: >-
  Four sections run on one clock, each with four pattern slots A to D. BEAT is the drum machine, built from the
  808's circuit with resonators and a trigger-height accent, and a 16-sound PO-12 kit that is synthesised, not sampled.
  RHYTHM, STRINGS and BASS use the JX-8P engine (the MKS-50 one before 0.5.6-alpha) or the JP-6 one with a note or chord sequencer. The mix chain has a drum bus
  compressor, kick ducking, gated reverb and a master limiter. The README is in German. Two packages are in firmware/. The older one is
  inserted into a copy of M-VAVE's FM1 Open, which the build script patches; its notes say the first build restarted in a
  loop on a real FM-1 because of a divide by zero, and that the fix and later measuring builds ran too slowly with the
  groove playing. The newer FM1_ELECTRO_PLATTFORM.fwsc is built on the project's own platform, based on the Dinghy template,
  needs no M-VAVE SDK, uses both cores and has the drum voices rewritten in fixed point. Its notes say it has not been
  run on a device.
status: active
authors:
- name: robtron-byte
  url: https://github.com/robtron-byte
source: https://github.com/robtron-byte/FM1-Electro-one
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md is GPL-3.0 only with M-VAVE's FM1 SDK linking permission. The older SDK build links M-VAVE's closed
  binary SDK library, which is not in the repository (THIRD_PARTY.md). The platform folder has its own GPL-3.0 LICENSE,
  and third_party/felucca carries an MIT licence. The DSP helpers under third_party/daisy808 are MIT. Both
  .fwsc files in firmware/ are the author's own builds, not stock images.
distribution: download
install_notes: >-
  Back up projects and samples first, since they are lost on the switch. Send FM1_ELECTRO-0.5.6-alpha.fwsc from the release, or firmware/FM1_ELECTRO_PLATTFORM.fwsc (or the older FM1_ELECTRO.fwsc), with a flasher
  that accepts custom packages (fm-static, M-Flasher or tools/fm1_install.py). The original firmware can be put back
  with M-VAVE's tools, and the bootloader's download mode or FM-1 Transporter covers a unit that will not start.
brick_risk: false
tags: [groovebox, drums, sequencer, synth-engine, arpeggiator, fx]
versions:
- version: 0.5.6-alpha
  date: 2026-11-21
  url: https://github.com/robtron-byte/FM1-Electro-one/releases/tag/v0.5.6-alpha
  notes: Pre-release. Replaces the MKS-50 engine in RHYTHM, STRINGS and BASS with a JX-8P engine from fm1-synths, with 64 factory sounds by range and new INIT sounds, and drops the MKS-50 sounds and the extra MKS sounds from 0.5.4. The JP-6 sounds stay. Saves are now version 29, which 0.5.5-alpha and earlier cannot read; older grooves load, with an MKS-50 sound becoming the area's start sound. The notes are in German.
- version: 0.5.5-alpha
  date: 2026-11-20
  url: https://github.com/robtron-byte/FM1-Electro-one/releases/tag/v0.5.5-alpha
  notes: Pre-release. Fixes live recording of held chords in STRINGS, which kept only the last key pressed; keys pressed together in one step are now stored as a chord (major, minor, seventh, suspended and others) when no chord is selected. Also fixes notes recorded under transpose losing their length. The notes are in German.
- version: 0.5.4-alpha
  date: 2026-11-20
  url: https://github.com/robtron-byte/FM1-Electro-one/releases/tag/v0.5.4-alpha
  notes: Pre-release. Adds holding REC for a second to clear the pattern and record again, a transpose that moves RHYTHM, STRINGS and BASS together and is saved, single notes only in BASS, INIT+ sounds, and saving everything before an installer update. The notes are in German.
- version: 0.5.3-alpha
  date: 2026-11-20
  url: https://github.com/robtron-byte/FM1-Electro-one/releases/tag/v0.5.3-alpha
  notes: Pre-release, the 53rd build. Fixes an unsteady tempo on an external MIDI clock, where steps fired only at the start of each audio block, by following the clock with a smoothing loop. The notes are in German.
- version: 0.5.2-alpha
  date: 2026-11-14
  url: https://github.com/robtron-byte/FM1-Electro-one/releases/tag/v0.5.2-alpha
  notes: Pre-release, and the first with a version number instead of a build count (it is the 52nd test build); built by GitHub Actions on the project's own platform, with package ID FM-1_965. Adds a single drum kit shared by all four pattern slots, faintly lit beats 1, 5, 9 and 13 in BEAT, per-area INIT sounds, STRINGS and BASS takes that start with the first key, pattern chains, a RHYTHM chord that follows the sound, fills over the whole bar, saving your own sounds with GLO and SAVE and a green PLAY light. The notes are in German.
- version: main @ 7517acb
  date: 2026-11-12
  url: https://github.com/robtron-byte/FM1-Electro-one/commit/7517acb80411b39f92d08a854bc2f8a1025add39
  notes: Git commit; the 52nd test build, before the project started numbering releases. Since the previous row the repository adds the platform-based package, whose drum voices and PO-12 kit use less processing time, and the automatic save waits for STOP while the groove plays.
