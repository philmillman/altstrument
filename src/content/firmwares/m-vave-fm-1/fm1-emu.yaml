device: m-vave-fm-1
name: FM-1 Emulator
kind: tool
summary: >-
  Emulates the FM-1's CPU, screen, keys, knobs and audio so community firmwares run unchanged in a browser
  or in a native window; also builds a plugin (AU, VST3, CLAP).
description: >-
  Instruction set recovered from the firmwares themselves, with models of the chip's timers, flash, display,
  key matrix and MIDI UART. The web page fetches each community firmware package from its author's own site
  when you start it, and plays through the computer keyboard, mouse, touch or Web MIDI. The native build
  (Rust, fm1-live) runs at full clock speed with a JIT on Apple silicon Macs, 64-bit ARM Linux and, since 0.3.0,
  x86-64 Linux. Release 0.4.0 has prebuilt archives of it for those three, a plugin build (AU, VST3, CLAP) for
  Apple-silicon Macs and, new in 0.4.0, a VST3 and CLAP plugin for Windows; 0.5.1 adds a Windows build of fm1-live; the emulator runs M-VAVE's V16 firmware and
  its FM1 Open since 0.3.0. Since 0.4.0 it also models the chip's hardware DSP units and resets, and an opt-in strict mode
  uses timings measured on a real FM-1. FM-1 SID, a Commodore 64 SID
  synth firmware with a sequencer and effects, began in this repository and now lives in a repository of its own
  that is included here as a submodule.
status: active
authors:
- name: Joakim Eriksson (joakimeriksson)
  url: https://github.com/joakimeriksson
source: https://github.com/joakimeriksson/fm1-emu
source_status: open
license: MIT
license_notes: >-
  The emulator is MIT. The firmwares it runs belong to their authors and are not in the repository; the
  fm1-sid directory has files under other licences, including GPL-3.0 for its player firmware.
homepage: https://joakimeriksson.github.io/fm1-emu/
install_notes: >-
  Browser version needs nothing installed. To run M-VAVE's stock firmware, download FM-1.fwsc from M-VAVE and
  open it on the page; the emulator does not bundle or fetch it. Native build: download the fm1-live archive
  for macOS, Linux or Windows from the releases page (unsigned; macOS asks for approval), or run cargo run --release
  -p fm1-live.
brick_risk: false
tags: [emulator, research]
image:
  url: https://raw.githubusercontent.com/joakimeriksson/fm1-emu/master/docs/media/firmwares.gif
  alt: >-
    Emulated FM-1 front panel showing Felucca 1.6 on its colour screen, with four knobs either side, a
    button grid and two rows of keys, cycling through fifteen firmwares
  credit: Joakim Eriksson
  source_url: https://github.com/joakimeriksson/fm1-emu
  first_party: true
versions:
- version: 0.5.1
  date: 2026-11-14
  url: https://github.com/joakimeriksson/fm1-emu/releases/tag/v0.5.1
  notes: Adds fm1-live for Windows, plays Polly's band and Melodee's factory sounds from their packages alone, can emulate the newer FM-1 with its other flash chip, and the page lists 202 firmwares refreshed from the Hub.
- version: 0.5.0
  date: 2026-11-13
  url: https://github.com/joakimeriksson/fm1-emu/releases/tag/v0.5.0
  notes: Firmwares built on the new felucca-bsp (FRASIL 3.3, AMB-1 1.3.2, CTL-1 1.0.3, CHOPPAH 0.99, Polly 0.6.2) play again in fm1-live and the plugin after staying silent in 0.4.0, the JIT is faster on firmwares that use both cores, and fm1-live gets a sharp window on Windows.
- version: 0.4.0
  date: 2026-11-02
  url: https://github.com/joakimeriksson/fm1-emu/releases/tag/v0.4.0
  notes: Adds the plugin for Windows (VST3 and CLAP), a faster emulator (FM-1 Dock eight times faster) and models of the chip's FFT, EQ and sample-rate units and its watchdog reset. Runs more firmwares, among them the SMK-37 Pro's stock-based mods, Bubba Machine, COSMOS and Ravel, and adds a strict mode with timings measured on an FM-1.
- version: 0.3.0
  date: 2026-10-26
  url: https://github.com/joakimeriksson/fm1-emu/releases/tag/v0.3.0
  notes: Runs M-VAVE's V16 firmware and FM1 Open, adds the JIT on x86-64 Linux, 120 and 160 MHz plugin clocks and key velocity and pressure from where a key is pressed.
- version: 0.2.0
  date: 2026-10-19
  url: https://github.com/joakimeriksson/fm1-emu/releases/tag/v0.2.0
  notes: First release of the whole emulator, adding fm1-live for macOS and Linux.
