device: m-vave-fm-1
name: FM-1 Emulator (briksquared)
kind: tool
summary: >-
  Offline desktop emulator for Windows, macOS and Linux that runs FM-1 firmware with no hardware, with 115 GPL-3.0
  firmwares bundled, plus flash backup and recovery on Windows.
description: >-
  A fork of Joakim Eriksson's fm1-emu, whose Rust and WebAssembly engine does the emulation, in a desktop app. Firmware
  is picked from the bundled list or dropped in as a .fwsc, and played with the computer keyboard, mouse or a USB MIDI
  controller. The panel colours, decals and stickers can be changed. On Windows the app can also back up a real unit,
  install firmware and restore it with a bundled M-Flasher. The builds are not code-signed.
status: active
authors:
- name: briksquared
  url: https://github.com/briksquared
source: https://github.com/briksquared/fm1-emulator
source_status: open
license: MIT
license_notes: >-
  MIT covers the app (LICENSE, NOTICE.md). The 115 bundled packages are other authors' GPL-3.0 firmware, redistributed
  unchanged with credit in THIRD-PARTY.md; the README says M-VAVE's stock firmware is not bundled. vendor/M-Flasher holds
  a prebuilt M-Flasher.exe with its own LICENSE and SOURCE.md.
distribution: download
install_notes: >-
  Installers and portable builds are on the releases page. The operating system warns about an unsigned app on first
  launch; docs/Installation.md explains each one. Emulation touches no hardware, and only the flash and recovery
  features write to an FM-1.
brick_risk: false
tags: [emulator, flasher, recovery, desktop]
image:
  url: https://raw.githubusercontent.com/briksquared/fm1-emulator/main/docs/screenshot.jpg
  alt: "FM-1 Emulator window with an orange-keyed FM-1 panel, a firmware browser on the left, a firmware uplink panel on the right and MIDI, tape and scope modules below"
  credit: "briksquared"
  source_url: https://github.com/briksquared/fm1-emulator
  first_party: true
