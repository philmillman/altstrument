device: m-vave-fm-1
name: FM-1 Emulator (briksquared)
kind: tool
summary: >-
  Offline desktop emulator for Windows, macOS and Linux that runs FM-1 firmware with no hardware, with 259 open-licence
  firmwares bundled, plus flash backup and recovery on Windows.
description: >-
  A fork of Joakim Eriksson's fm1-emu, whose Rust and WebAssembly engine does the emulation, in a desktop app. Firmware
  is picked from the bundled list or dropped in as a .fwsc, and played with the computer keyboard, mouse or a USB MIDI
  controller, including a real FM-1 plugged in over USB. The panel colours, decals and stickers can be changed. On Windows the app can also back up a real unit,
  install firmware and restore it with a bundled M-Flasher. The builds are not code-signed. Version 1.1.0 adds a radar that checks for new firmware releases and a rebuilt search.
status: active
authors:
- name: briksquared
  url: https://github.com/briksquared
source: https://github.com/briksquared/fm1-emulator
source_status: open
license: MIT
license_notes: >-
  MIT covers the app (LICENSE, NOTICE.md). The 259 bundled packages are other authors' firmware under GPL, MPL or another compatible licence, redistributed
  unchanged with credit in THIRD-PARTY.md; the README says M-VAVE's stock firmware is not bundled. vendor/M-Flasher holds
  a prebuilt M-Flasher.exe with its own LICENSE and SOURCE.md.
distribution: download
install_notes: >-
  Installers and portable builds are on the releases page. The operating system warns about an unsigned app on first
  launch; docs/Installation.md explains each one. Emulation touches no hardware, and only the flash and recovery
  features write to an FM-1.
brick_risk: false
tags: [emulator, flasher, recovery, desktop]
image:
  url: https://raw.githubusercontent.com/briksquared/fm1-emulator/main/docs/screenshot.jpg
  alt: "FM-1 Emulator window with an orange-keyed FM-1 panel, a firmware browser on the left, a firmware uplink panel on the right and MIDI, tape and scope modules below"
  credit: "briksquared"
  source_url: https://github.com/briksquared/fm1-emulator
  first_party: true
versions:
- version: 1.1.3
  date: 2026-11-11
  url: https://github.com/briksquared/fm1-emulator/releases/tag/v1.1.3
  notes: Adds USB recovery guidance and a safer firmware selection on Windows.
- version: 1.1.2
  date: 2026-11-10
  url: https://github.com/briksquared/fm1-emulator/releases/tag/v1.1.2
  notes: Adds a patch bay with generative modules, presets and cable motion, a desktop MIDI link to a real FM-1, a Focus Mode, themes and a cleaned-up firmware library, and extends the recovery docs to both production flash chips.
- version: 1.1.0
  date: 2026-11-09
  url: https://github.com/briksquared/fm1-emulator/releases/tag/v1.1.0
  notes: Grows the bundled library from 115 to 259 open-licence packages, adds an in-app radar for new firmware releases and a rebuilt search, uses software rendering and the interpreter by default, and lets a real FM-1 on MIDI in play the emulator.
- version: 1.0.9
  date: 2026-11-01
  url: https://github.com/briksquared/fm1-emulator/releases/tag/v1.0.9
