device: m-vave-fm-1
name: FM-1 Emulator (w0ts fork)
kind: tool
summary: >-
  Fork of Simon Johansson's FM-1 emulator that runs Felucca, SLOOP, Melodee, X0X, Optimist and other community
  firmware in a desktop app with knobs, audio, LEDs, a web-editor bridge and an emulated SD card.
description: >-
  Adds CPU instruction forms that current community builds use, a USB-MIDI host with a local bridge to a firmware's own
  web editor, TRS MIDI input, a USB audio host, an interpreter several times faster than upstream, panel themes, remembered
  settings, flash kept between runs and an SD card on the LCD's SPI bus for Optimist's SD mod. The README says upstream
  cannot run several of these firmwares. It also ships headless tools for scripted panel sessions, benchmarks and finding
  undecoded instructions. The README says the same work was offered upstream as five pull requests, all closed unmerged on
  2026-10-09, so the fork carries it on its own. Desktop builds are published for macOS on Apple silicon, Windows and Linux. No firmware is included; you load a
  .fwsc, .elf or .bin. The repository moved from hdavid to w0ts.
status: active
authors:
- name: w0ts
  url: https://github.com/w0ts
- name: Simon Johansson (simonjohansson)
  url: https://github.com/simonjohansson
source: https://github.com/w0ts/fm1-emulator
source_status: open
license: GPL-3.0-only
license_notes: >-
  The fork's LICENSE and Cargo.toml say GPL-3.0-only. Upstream's LICENSE is GPL-2.0, and LICENSES/ holds the JieLi SDK's
  Apache-2.0 text.
distribution: download
install_notes: >-
  Download the archive for your system from the releases page, which publishes a build per commit, or build with mise.
  The macOS app is not signed or notarised. The project does not bundle firmware.
brick_risk: false
tags: [emulator, fork, research]
