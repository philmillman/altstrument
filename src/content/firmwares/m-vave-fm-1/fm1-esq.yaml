license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL-3.0 text. No Ensoniq ROM, disk or program is committed: rom/README.md says the wave ROM dumps are Ensoniq's, are
  supplied by the user and are kept out of the repository.
homepage: https://joakimeriksson.github.io/fm1-dock/
distribution: download
install_notes: >-
  Deploy esq1-0.1.0.dock from the release to a running fm1-dock with its tools/dock.py deploy, then pick ESQ-1 from the dock's list. A module
  is not a firmware, so the dock's USB rescue and updater stay in place. Building needs a fm1-dock checkout and its JieLi toolchain.
brick_risk: false
