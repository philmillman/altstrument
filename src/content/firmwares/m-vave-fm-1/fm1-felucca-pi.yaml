homepage: https://bey.jp/
distribution: source-only
install_notes: >-
  Needs pip install mido python-rtmidi, then follow the README to fetch fm1_install.py and a Felucca .fwsc from the Felucca repository and run it over USB. The guide says to turn the FM-1's audio profile off first on Home Assistant OS or Supervised so the USB connection does not drop mid-write. If a write fails, the README says to run the installer again, and the chip's boot mode shows up on the computer as WL80UBOOT.
