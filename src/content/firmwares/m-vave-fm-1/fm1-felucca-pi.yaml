device: m-vave-fm-1
kind: tool
name: FM-1 Felucca on Raspberry Pi
summary: >-
  Terminal guide and scripts for flashing Felucca onto the FM-1 from a Raspberry Pi running Home Assistant, with a fix for the USB drop-outs the audio container causes and a small server that plays melodies on the FM-1 from automations.
description: >-
  The guide is in Japanese with an English summary. It installs a Felucca package with Felucca's own tools/fm1_install.py over USB MIDI instead of the browser installer, checks the package hash first, and lists how to return to the official V15 firmware and what the chip's boot mode looks like if a write fails. On Home Assistant OS the audio container held the FM-1's sound card open and the unit disconnected every few minutes, so scripts switch the card's audio profile off, watch the USB bus for drops, and a udev rule and systemd service repeat that automatically. A second part measures what the stock firmware and Felucca send over USB MIDI, and fm1_play.py and fm1_server.py play short melodies on the FM-1 when Home Assistant calls a local HTTP endpoint, as in an example that plays a rain melody. AI_INSTRUCTIONS.md is a script for an AI assistant to carry out the installation step by step. It downloads Felucca from its own repository and does not include any M-VAVE firmware.
status: active
