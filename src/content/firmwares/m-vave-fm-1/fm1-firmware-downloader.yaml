install_notes: >-
  Install Tampermonkey or Violentmonkey, open the raw fm1-firmware-downloader.user.js link from the README, and reload The Firmware Hub. Downloads come from the hub, which mirrors packages from their authors. The recovery guide uses M-Flasher (jvitkauskas/m-flasher) with the whole-flash backup step first.
