device: m-vave-fm-1
name: FM-1 Firmware Downloader
kind: tool
summary: >-
  Userscript for The Firmware Hub that adds search, size and SHA-256 checked downloads and a Flash via Hub button to its firmware cards, plus a written recovery route through M-Flasher for units with a different flash chip.
description: >-
  A Tampermonkey or Violentmonkey script that runs on thefirmwarehub.com. It reads the hub's own catalogue, lists the community firmware packages with search and category filters, and saves a package only after its size and SHA-256 match the catalogue and the file comes from the hub's own origin. The script reads only the community firmware list, not the hub's entry for M-VAVE's stock image, and the repository contains no firmware images. Flash via Hub hands over to the hub's Web MIDI installer. The README also documents recovery with M-Flasher through the chip's ROM download mode for FM-1 units whose flash chip makes the web updater drop out, and links the experimental SLOOP build for the UC25HQ80 chip that is catalogued separately. Nothing is flashed by the script itself.
