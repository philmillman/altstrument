  date: 2026-11-15
  url: https://github.com/jasonbot/fm1-grid/releases/tag/v0.1.1
  notes: First GitHub release page. It attaches Windows x64 and ARM64 executables for the app and the terminal version, Linux x86_64 and aarch64 archives and Flatpaks, and a checksum file; the release is titled Synth Firmware Zoo. Includes an hourly update check, updates through the Windows Store and hosted MSIX and Flatpak backends, shrub.audio as a default firmware feed, an About tab with release history and licences, and Rescue writing of m-bootloader to units in ROM download mode.
