device: m-vave-fm-1
name: FM-1 Grid
kind: tool
summary: >-
  Desktop app (Rust) that runs up to four emulated FM-1s side by side with any community firmware, shares a MIDI
  clock and keyboard between them, and also detects and flashes real FM-1 units over USB.
description: >-
  Rights warning: the build downloads six firmware packages into a git-ignored folder, including M-VAVE's stock FM-1
  V16 package from M-VAVE's file server and Baud Girl's proprietary FM-1+VA 102 from baudgirl.com; the repository holds none
  of the files. V16 is not the V15 file this catalogue lists as licensed for redistribution. Each pane runs the fm1-emu
  CPU and display model with its own firmware and screen, mixes the four audio streams into one output, and shows a
  clickable FM-1 front panel that follows the selected pane. A MIDI graph routes system ports, running panes and
  connected units, and a metronome sends 24 PPQN clock with start and stop to every pane. The other four packages are SLOOP, Felucca and
  ChoralRoot from The FM-1 Firmware Hub and M-VAVE's open firmware V14, and
  a Library tab lists them and downloads more from the Hub and, as the README now lists, fm1-editor.com, Reverbose's FM-1 and SMK-37 lists and mutant.cloud, and a settings tab picks a colour theme, a light or dark mode and, for three of the themes, an accent colour. A pane can be pinned so its flash contents survive power-off.
  For live units, the app probes FM-1-named MIDI ports, and now SMK-37 and Starrykey port names too, with the M-UPGRADE handshake, shows which firmware is running,
  switches their clock and flashes a chosen package. A unit in ROM download mode is also listed, and with Rescue switched on it can be given the m-bootloader, on Linux, macOS (needs sudo) and Windows (needs administrator rights). An About tab shows the release history and licences. The repository also builds fm1-tty, a terminal version of the
  library, flashing, keyboard, metronome and MIDI routing. The emulated panes accept MIDI in only. The author calls it a local tool,
  not a distributed binary.
status: active
authors:
- name: jasonbot
  url: https://github.com/jasonbot
source: https://github.com/jasonbot/fm1-grid
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md holds the unmodified GPL-3.0 text, with no "or later" grant. Cargo.toml still declares MIT and the
  firmware README says the Rust application code is MIT, so the declarations conflict. The emulator crates are MIT;
  the firmware packages keep their authors' licences (GPL-3.0 for those from the Hub, Apache-2.0 for M-VAVE's stock
  V16 as the README records it, proprietary for FM-1+VA), recorded in firmware/README.md.
distribution: source-only
install_notes: >-
  Build with Rust 1.91 or newer using cargo run --release; Linux needs ALSA and X11 or Wayland development
  packages. The first build downloads any missing firmware packages listed in fm1-performer/firmware/firmwares.json and checks
  their hashes; scripts/firmware.sh edits the list. Flashing a connected unit uses the same update path as other
  installers, so back up first and follow the brick-risk notes on the FM-1 device page. The Rescue option writes a replacement bootloader through the chip's ROM download mode, which the build fetches from the m-bootloader release and checks by hash.
brick_risk: true
tags: [emulator, midi, flasher, utility]
