  notes: No tagged releases; this is the latest commit. Since the previous row the macOS ROM-download recovery goes through the system's SCSI task client instead of libusb, the devices pane lists units in ROM download mode and, with Rescue on, can write m-bootloader to them, and an About tab shows release history and licences. Earlier, the graphical and terminal apps share one saved record for tempo, Download All and the library device checkboxes, flashing treats Donner Starrykey 37 Play and SMK-37 packages as interchangeable, Esc clears the terminal filter, navigation keys move from the filter into the library, the terminal flash picker shows USB paths to tell identical units apart, and the sidebar screen scales to 3x and 6x. The panel's key LED windows are redrawn.
