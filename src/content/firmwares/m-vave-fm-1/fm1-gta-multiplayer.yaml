device: m-vave-fm-1
name: FM1_GTA Multiplayer
kind: firmware
summary: >-
  Multiplayer edition of the FM1_GTA crime game that links FM-1s over a home Wi-Fi router or router-free ad-hoc Wi-Fi and lets browser emulators join through a small relay program.
description: >-
  Rights warning: this is a port of the game Out on Parole by shaydex-codes, whose repository states no licence, and the port is released under the GPL-3.0-only without any statement of permission from the original author.

  The game is the 64 by 64 coastal city of FM1_GTA with vehicles, weapons, police chases with a helicopter, story missions, shops, cutscenes, a four-station synth radio and key LEDs that act as a lightbar. This edition adds a Wi-Fi menu on EDIT with three modes: a home router (WPA2 and DHCP), a router-free ad-hoc mode for FM-1 to FM-1 play in nine groups, and off. A player can be outlaw or police, and a test ping reaches the other players. Positions, vehicles, sirens and shots are sent in 28-byte UDP packets at 15 Hz, and other players show in the city and on the map as P2 to P4. A relay program in Node.js, with install scripts for Linux, macOS, Windows, Docker and iOS, connects the units on the LAN to browser emulators over WebSocket. The Wi-Fi name and password are sent to the FM-1 over USB MIDI from the project site, and each unit derives its Wi-Fi address from its flash chip id so that several units can share a router. The site has the browser emulator and the installer. This repository is a third line of the project, separate from FM1_GTA and from the earlier FM1_GTA Network entry.
