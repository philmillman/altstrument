homepage: https://mlwilki.github.io/FM1_GTA_multiplayer/
based_on: m-vave-fm-1/fm1-gta
distribution: browser-installer
install_notes: >-
  Open the project site in Chrome or Edge with the FM-1 connected by USB and use its installer, or download the .fwsc from the releases and build with build.sh from source. Playing with several units needs the Node.js relay for the browser players and a 2.4 GHz router, or the router-free mode. The README gives no recovery step; it is built on fm1-base, which keeps its update loader, so the FM-1's ROM boot mode remains the way back. The firmware identity is FM-1_107000202 for v0.2.2.
