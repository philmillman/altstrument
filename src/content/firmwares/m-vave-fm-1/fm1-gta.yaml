source: https://github.com/mlwilki/FM1_GTA
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSING.md give GPL-3.0-only, as Felucca, SLOOP and Dinghy. Platform files from fm1-base, felucca-bsp and M-VAVE's fm1_open keep the licences LICENSING.md lists for them. The game itself is a port of shaydex-codes/outonparole, which has no licence file.
homepage: https://mlwilki.github.io/FM1_GTA/
distribution: browser-installer
install_notes: >-
  The project site offers a browser emulator and installer, or ./fm1 build makes the .fwsc package and ./fm1 flash writes it over USB. The package identity is FM-1_18. It is built on the foma platform, which keeps its update loader, so the FM-1's ROM boot mode remains the way back.
