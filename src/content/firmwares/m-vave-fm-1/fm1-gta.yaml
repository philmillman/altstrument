device: m-vave-fm-1
name: FM1_GTA
kind: firmware
summary: >-
  Top-down open-world crime game, Out on Parole, with story missions, police chases, a four-station synth radio and key LEDs that act as a lightbar and speedometer.
description: >-
  Rights warning: this is a port of the game Out on Parole by shaydex-codes, whose repository states no licence, and the port is released under the GPL-3.0-only without any statement of permission from the original author.

  The player walks and drives through a 64 by 64 coastal city with a day and night cycle, traffic, pedestrians, ten vehicle types and four weapons. Five story missions start at a parking lot, and side activities include taxi fares, shop robberies, a car export dock, a gun shop, a respray garage and sixteen hidden cash stashes. Police chases run from one to five stars, with a helicopter from three stars and short cutscenes for carjackings and arrests. The 27 key LEDs flash red and blue while wanted and show speed or health otherwise, and a radio cycles through four synthesised stations and a police scanner. A browser emulator and installer are on the project site. It is built on the foma, Felucca, SLOOP and Dinghy toolchain. A Wi-Fi multiplayer build is listed separately as FM1_GTA Network.
status: active
authors:
