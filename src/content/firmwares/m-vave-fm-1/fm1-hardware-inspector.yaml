device: m-vave-fm-1
kind: tool
name: FM-1 Hardware Inspector
summary: >-
  Read-only web page that shows an FM-1 hardware report loaded from a local JSON file, identifies the two known SPI flash chips and flags
  compatibility risks, with a recovery guide for bricked FM-1 and SMK-37 units.
description: >-
  The page opens a JSON report that another inspection tool produced, shows the device details, and recognises the Puya
  P25Q80H and UCUN UC25HQ80 flash chips by their JEDEC IDs. It keeps unknown, experimental, incompatible and verified claims in separate groups, warns
  when the bootloader identity is unknown or unreadable, and explains why newer flash chips need firmware and update loaders that know them. Reports stay in the
  browser. The README says direct USB inspection is not implemented, because WebUSB cannot reliably take over the download-mode interface, and
  that a local helper could add it later. The page has no write, erase, update or bootloader controls. A second page walks through recovery for a unit
  that will not start, covering M-Flasher, m-bootloader, the chip's ROM download mode and the hard-brick routes.
