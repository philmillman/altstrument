install_notes: >-
  Clone with submodules and run build.sh --release 0.5 with the JieLi toolchain to get a .fwsc, then install it as with other fm1-base firmwares. The firmware keeps only its own settings, in its own area of the FM-1's flash. The README gives no recovery notes; the chip's ROM boot mode is the fallback for a failed install.
