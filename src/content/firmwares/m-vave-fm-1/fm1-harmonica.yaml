device: m-vave-fm-1
name: Harmonica
summary: >-
  Ten-hole diatonic harmonica for the FM-1: ten keys are the holes, one key is draw, three keys bend the note, with 29 built-in licks in four tunings.
description: >-
  White keys 1 to 10 blow holes 1 to 10, key 11 turns the breath to draw, and keys 12 to 14 bend by a half step, a whole step or a step and a half where the hole allows it. Neighbouring keys played together make a chord of up to four holes. PRESET picks the harmonica's key, ALGORITHM picks one of four tunings, SELECT and PLAY choose and loop a lick, and EDIT switches between blues, folk, Chicago and FM sounds. The four knobs set tone, breath, vibrato and drive, and ARP and SEQ held give wah and hand tremolo. The 29 licks are checked at build time against what a real harmonica can play. The sound uses samples from the FluidR3_GM SoundFont, and a browser emulator is included. It is built on fm1-base and has no release yet.
