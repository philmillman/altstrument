homepage: https://github.com/mlwilki/FM1-Hero
distribution: source-only
install_notes: >-
  ./fm1 build makes build/fm1-hero-0.1.fwsc and ./fm1 dev serves an emulator, a WebMIDI installer and a Rescue tab on localhost. Scores, settings and the custom song are saved at flash 0xFB000 and may be overwritten by another firmware using that area. The README says to hold OCT- while powering on for USB rescue, which also offers the official firmware.
