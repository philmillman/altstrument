device: m-vave-fm-1
name: FM1-Hero
kind: firmware
summary: >-
  Falling-note piano trainer and rhythm game with a six-voice two-operator FM synth: key LEDs show the next notes, with wait, game and auto modes and MIDI file import.
description: >-
  Green right-hand and blue left-hand note bars fall on the screen while the key LEDs light the keys to press next. Wait mode pauses until the notes are played, game mode scores PERFECT, GREAT, GOOD and MISS with combo multipliers and an end grade, and auto mode plays the song while the player improvises. Hands can be practised separately, an A-B loop repeats a section, and a metronome is available. There are 16 built-in songs and a custom slot filled from a MIDI file or by recording the keys, six FM patches with brightness and a ping-pong echo. The browser tools hold a larger song library and a drag-and-drop uploader. It is built with foma. It is a different project from VaveHero.
