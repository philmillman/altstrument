device: m-vave-fm-1
name: fm1-hv
summary: >-
  Virus-inspired synth for the FM-1 with two oscillators, two filters, two LFOs, unison, chorus and delay, reading Virus single patches. Version 0.0, early development; not yet run on a real FM-1.
description: >-
  A homage rather than an emulation: two oscillators with spectral waves, a sub, noise and ring modulation feed two filters with Virus-style routing and saturation, with filter and amplifier envelopes that have a sustain slope, two LFOs, unison, chorus and delay. The native patch is the classic 256-byte Virus single, so Virus A, B and C singles load as approximations, and MIDI CC 17 to 119 set the Virus page A parameter of the same number. The screen has twelve edit pages operated with the four knobs, and the status line shows the load of the audio interrupt and the voices sounding. The README says the engine runs on the host as WAV renders and that the firmware builds on GitHub, and that it has not yet run on an FM-1. The architecture notes list a browser editor and a VST3 as later goals and say the value curves are first guesses. No Access ROM, wavetable or sample data is in the repository. It is built on Dinghy.
status: active
authors:
- name: Brian McCalla
  url: https://github.com/brianmccalla
source: https://github.com/brianmccalla/fm1-hv
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for the synth and for Dinghy, and the LICENSE file is the GPL-3.0 text. The Virus single layout is treated as facts of the format, with no code taken from gearmulator. Platform code is Felucca, SLOOP and Dinghy, and the Terminus font is SIL OFL 1.1.
based_on: m-vave-fm-1/dinghy
distribution: source-only
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  No release. The JieLi toolchain build is described in the Dinghy notes in docs/, and GitHub Actions builds the package on every push to main and uploads it as the fm1-hv-fwsc artifact. The README warns against installing it on a unit you depend on, and the Dinghy platform provides a USB rescue and an update loader.
brick_risk: false
