device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: FM-1 Inspect
kind: tool
summary: >-
  Browser page that checks an FM-1 or SMK-37 .fwsc package before installing: identifies it against an index of known firmware, flags flash-chip support, networking code and USB device descriptors.
description: >-
  A package is dropped on the page and decoded locally, with nothing uploaded. The page matches it to a bundled index of community and official releases by checksum and by a code fingerprint, so renamed files and forks still resolve, and lists the closest related projects. It reports whether the build was attached to a GitHub release, built by the project's public CI or carries a build attestation, whether it recognises the newer UC25HQ80 flash chip as well as the Puya part, and whether the code contains networking, hard-coded addresses or USB keyboard, mouse or drive descriptors. A second tab takes an owner and repository name and checks the releases and committed packages through the anonymous GitHub API. The README calls the checks static and says an unknown file is not necessarily bad. It writes nothing to a unit.
