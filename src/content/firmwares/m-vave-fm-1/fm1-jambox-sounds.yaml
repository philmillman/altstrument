license_notes: >-
  The LICENSE file is the GPL-3.0 text and the README says GPL-3.0-only, as Jambox. The built packages hold JieLi SDK files as Jambox's do. The DX7 voice data comes from Dexed's SynprezFM cartridges (compiled by Jean-Marc Desprez), with no licence stated for it in this repository.
homepage: https://ceritium.github.io/fm1-jambox-sounds/
based_on: m-vave-fm-1/jambox-fm-1
distribution: browser-installer
requires_stock: V15 or FM1 Open
install_notes: >-
  Open the install page in Chrome or Edge with the FM-1 on USB and press Install next to Jambox 0.8.1-sounds1, or use the package attached to the release. The same page installs Jambox 0.8.1 as published again. No other recovery steps are documented here; M-VAVE's own V15 package and updater put the stock firmware back.
