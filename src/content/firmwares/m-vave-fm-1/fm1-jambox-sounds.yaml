device: m-vave-fm-1
name: Jambox FM-1 with sounds
summary: >-
  Patch set on Jambox FM-1 0.8.1 that builds 64 DX7 voices into the firmware, picked with two knobs on the Play page, and adds a screen-description command to the editor's SysEx.
description: >-
  Licence note: the 64 voices are taken from the SynprezFM cartridges that ship with the Dexed synthesizer, and the repository states no separate licence for that voice data. Jambox, the Omnichord-style chord harp, plays DX7 voices on its strings and chords when they are loaded from its editor. This repository adds 64 of them to the firmware itself, renamed in Spanish without accents, with levels evened out in Jambox's host simulator, so no computer is needed. KNOB 1 picks the strings' sound and KNOB 2 the chord's, the name shows beside the chord, and voices loaded from the editor come first as U1 to U32. The two harp level knobs move to the second setup page. The patch also adds a GUIDE command to the editor's SysEx that returns the screen's parts as lines of position and size, so an app can explain what the screen shows. The repository holds the patch script, the added source and the voice tables, builds Jambox 0.8.1 with them applied, and has an install page, built from Jambox's firmware switcher, that can also put Jambox 0.8.1 back. It also commits the built packages and two .syx banks of the same voices for Jambox's editor.
