source_status: open
license: GPL-3.0-only
license_notes: >-
  Follows FM1 Open: LICENSE.md is GPL-3.0-only with an additional permission to link the proprietary engine library,
  which the GitHub licence detector reports as NOASSERTION. The engine library and other SDK binaries keep M-VAVE's terms
  in THIRD_PARTY.md, which allow redistribution for FM-1 devices. The repository's sdk/firmware/FM-1_015.fwsc is git blob
  ce49cc1595b67347c68a3ac7463017f9fa8c19dd, the V15 image M-VAVE licenses for redistribution under Apache-2.0 in
  m-vave/fm1_open.
based_on: m-vave-fm-1/fm1-open
distribution: download
requires_stock: V15 or FM1 Open
install_notes: >-
  Download fm1_key_assist.fwsc from the project's GitHub Pages site (the README gives its SHA-256) or build it with the
  GitHub Actions workflow, which needs Windows and JieLi's toolchain. The README says the build has not been flashed to a
  real unit; its hardware test plan rolls back to M-VAVE's V15 image. The official updater rejects SDK-based packages
  on units running other third-party firmware, so return those to V15 first.
brick_risk: false
