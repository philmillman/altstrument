device: m-vave-fm-1
name: KEY ASSIST
summary: >-
  FM1 Open with a per-track scale lock and one-finger chords: hold SCL to pick a root, scale, chord type and key
  mapping, and the 27 keys then play in key.
description: >-
  KEY ASSIST is a modified copy of M-VAVE's FM1 Open firmware. Holding SCL for 600 ms opens a page on the 240x240 screen
  where four knobs set the root note, one of eight scales, a chord type (single note, triad, seventh or power chord) and a
  key mapping, either snapping off-scale keys to the nearest lower scale tone or making the white keys consecutive scale
  degrees. Settings are kept per track, drum tracks are left alone, and the assisted notes pass through the normal MIDI
  path, so step recording captures the chords. Three differences from stock are listed by the author: SCL now acts on
  release so a tap still opens the operator-scaling page, the settings live in RAM and reset at power-off, and the startup
  logo, the DX7 algorithm diagram and the voice-rename screen were removed to fit the size limit. The author states that
  the firmware is verified in a host simulator and an FM-1 emulator and has not been run on a physical FM-1. A browser
  replay and play-along page runs the packaged firmware in an emulator.
status: active
