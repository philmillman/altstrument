device: m-vave-fm-1
name: FM1 Keyboard Academy
summary: >-
  Learning firmware built on M-VAVE's FM1 Open: boots into an eight-chapter keyboard course that demonstrates each
  exercise, lights the keys to play, scores the attempt and includes 30 public-domain melodies.
description: >-
  A lesson plays back first, the next key lights up, a wrong note flashes the display red and the lesson repeats
  below 80 percent accuracy. The four upper knobs choose chapter, lesson, sound and help level, and an options
  screen turns the demo lights, player lights, metronome and automatic next lesson on or off. The full FM1 Open
  instrument remains behind the HOME key: 128 DX7 voices, the algorithm editor, the sequencer and project import,
  and a Standard MIDI File importer turns a melody into a project. The lessons use traditional and classical pieces
  such as Ode to Joy, Greensleeves and Can Can, and the repository calls them public domain. The author labels all
  three releases previews. The FM-1 Learn prototype it grew from replaced the 16 factory demo projects with lessons.
status: active
