license: GPL-3.0-only
license_notes: >-
  The application is GPL-3.0-only with M-VAVE's section 7 permission to link the FM1 binary SDK, as in
  m-vave/fm1_open (LICENSE.md, copyright M-VAVE). The proprietary engine library sdk/lib/libfm1_engine.a is in the
  repository; THIRD_PARTY.md permits redistributing it in binary form for FM-1 devices only. Third-party parts keep
  their own licences (Open303, DaisySP, emu2149 and SEA are MIT; MSFA is Apache-2.0). The repository holds M-VAVE's
  FM-1 V15 image (sdk/firmware/FM-1_015.fwsc), which M-VAVE licenses under Apache-2.0 in m-vave/fm1_open; the copy
  matches the licensed git blob ce49cc1. The release package keeps the first 16 KiB of that stock image, and the
  128-voice DX7 bank is extracted from it. GitHub reports the licence as NOASSERTION because LICENSE.md combines
  several texts.
homepage: https://github.com/chmess/fm1-keyboard-academy
distribution: download
requires_stock: M-VAVE FM-1 V15 (the package keeps its startup region)
install_notes: >-
  Download FM1_KEYBOARD_ACADEMY_V04.fwsc from the latest release, check it against the SHA-256 in the README,
  and install it with an FM-1 updater such as M-VAVE's workbench (the README does not name one), keeping power and
  USB connected during the two-stage update. The README warns that there is no known easy hardware recovery if an
  unofficial update fails, and that projects, voices and samples should be backed up first. To build it you need
  JieLi's PI32v2 toolchain (Windows, or Linux through QEMU) and a verified V15 package.
brick_risk: false
