device: m-vave-fm-1
name: FM-1 KEYS
summary: >-
  Physically modelled keyboard firmware: Frodhes's Rhodes engine, an exciter-and-resonator voice for strings, tubes and bodies,
  and a one-key chord engine, so far a test build that runs in a browser emulator.
description: >-
  KEYS is the Rhodes engine of Frodhes, taken over unchanged, with four types and tone, bark, bell and decay controls. PHYS plays a
  pluck, strike, bow, blow or noise exciter into a string, a reed tube or a struck body that morphs from wood to glass, metal and
  skin. One key plays the chord on that degree of a chosen key and scale, with three to six notes, close, open or voice-led
  voicings, an optional bass note and a strum. There are 15 factory patches, four pages of controls and animated screens that draw
  the tines, the delay lines or the chord. The README calls this test build 0.1-dev and says it has not been installed on an FM-1;
  it can be built from source with fm1-base, and the project site has a browser emulator.
