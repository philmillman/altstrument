device: m-vave-fm-1
name: FM1 Kids
summary: >-
  Child-friendly interface for the FM-1 built on M-VAVE's open FM1 Open: picture tiles instead of menus, a pentatonic scale on the keys,
  a drum and melody step grid on the white keys, an arpeggiator and a volume cap.
description: >-
  Replaces only the screen code of FM1 Open and keeps its sound engines. Eight instrument tiles (piano, bass, game, guitar,
  fun samples and drums) are chosen with SELECT, and melodic instruments play a C major pentatonic scale so every key
  fits. BEAT mode turns the 16 white keys into steps and the black keys pick the drum or note, with the key lights showing the
  pattern and playhead. The arpeggiator has up, down, bounce and random with speed, octave, length and swing, and four knobs
  cover loudness, brightness, sound and speed. Songs save themselves, EDIT is undo, the volume is capped and a battery
  gauge warns when charging is needed, and holding GLO opens a parent panel for Bluetooth MIDI keyboards. The firmware update
  path stays M-VAVE's own, so stock or another community firmware installs over it. The README says version 0.1
  passes the project's tests in the fm1-emu emulator but has not been confirmed on a real FM-1. The project is unofficial
  and not affiliated with M-VAVE.
status: active
