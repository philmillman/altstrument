source: https://github.com/cds879/FM1-Kids-Firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  The app is GPLv3 only with M-VAVE's FM1 SDK linking exception (LICENSE.md), as in FM1 Open. The sound engines come as M-VAVE's
  binary SDK under separate terms (THIRD_PARTY.md), which the repository carries together with M-VAVE's FM-1 V15 recovery
  image (sdk/firmware/FM-1_015.fwsc, byte-identical to the licensed file in m-vave/fm1_open).
homepage: https://cds879.github.io/FM1-Kids-Firmware/
based_on: m-vave-fm-1/fm1-open
distribution: browser-installer
install_notes: >-
  Install from the hosted page in Chrome or Edge over USB-C. The flashing guide recommends building an FM-1 Transporter recovery dongle and
  taking a full backup before the first install, then installing the original-UI build of the repository before the Kids build.
  Building from source uses Docker on macOS or Linux, or M-VAVE's scripts with the JieLi Windows toolchain.
brick_risk: false
