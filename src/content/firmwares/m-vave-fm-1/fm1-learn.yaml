  url: https://github.com/Exmachia
source: https://github.com/Exmachia/fm1
source_status: open
license: unspecified
license_notes: >-
  The repository has no licence file for the app. public/emu holds Joakim Eriksson's fm1-emu WebAssembly build with its MIT licence. Firmwares it runs belong to their authors and are fetched when used.
homepage: https://fm1-sigma.vercel.app
distribution: browser-installer
install_notes: >-
  Open the live page, or run npm install and npm run dev. It writes nothing to a physical FM-1.
brick_risk: false
