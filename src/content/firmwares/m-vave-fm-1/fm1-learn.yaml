device: m-vave-fm-1
name: FM-1 Learn to Play
kind: tool
summary: >-
  Browser replica of the FM-1 with a six-operator FM engine, guided lessons, MIDI file import, WAV and DX7 SysEx export, and a way to run community firmwares in fm1-emu.
description: >-
  The panel has the FM-1's knobs, buttons, screen and 27 keys, played with the mouse, the computer keyboard or a MIDI keyboard. Lessons show which control to press next, and
  a MIDI file can be turned into a step-by-step lesson. Sounds export as a WAV recording with effects or as a DX7 .syx bank that Dexed, a DX7 or the real FM-1 can read. A separate mode runs community firmwares
  such as sloopDX, Frodhes, X0X and CHOPPAH inside the vendored fm1-emu, each downloaded from its author's page or The Firmware Hub. The page and the README are in Spanish and English. It does not
  install anything on a physical unit.
status: active
authors:
