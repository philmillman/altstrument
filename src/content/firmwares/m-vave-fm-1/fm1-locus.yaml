based_on: m-vave-fm-1/fm1-audiobase
distribution: browser-installer
install_notes: >-
  Use the web installer in Chrome or Edge with the FM-1 on USB, or tools/fm1_install.py with the release's locus-0.2.fwsc. The README says an interrupted write resumes when Install is pressed again, two
  failed boots open USB RESCUE (or hold OCT- at power-on), the installer's Back to the official firmware takes M-VAVE's V15 file you supply, and MvaveFM1Unbricker recovers a unit that does not start.
  The 0.2 package has not been tried on a device.
