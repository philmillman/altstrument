device: m-vave-fm-1
name: FM1_Locus
kind: firmware
summary: >-
  Modal resonator feeding a granular processor on the FM-1, built on Mutable Instruments' Rings and Clouds DSP, with USB audio routing, an 8-pattern step sequencer and four chance-based trigger generators.
description: >-
  The RESONATOR has modal, sympathetic string, string, FM voice and quantized chord models with one, two or four voices, struck by an internal exciter, by routed
  audio or by that audio's onsets. LOCUS is a granular processor with granular, stretch, looper and spectral modes and a buffer of roughly 1 to 8 seconds that REC freezes. ROUTING sends the
  computer's USB audio into the resonator, into LOCUS or straight out, and the resonator into LOCUS or out, each from off to +6 dB. The sequencer has eight patterns of up to 32 steps
  with note, accent and grain per step, and CHANCE triggers come from a Geiger counter, a Lorenz attractor, a cellular automaton (rules 30, 90 and 110) or a dripping-faucet model.
  USB audio runs both ways, MIDI notes, start and stop and program change come in over USB and TRS, and settings and patterns are saved to flash. The DSP is Emilie Gillet's Rings and Clouds
  code, with no CV or audio jacks of its own, no MIDI clock yet and no string-and-reverb model. The README says it has not been tested on an FM-1 and runs in the FM-1 emulator, and
  that the 0.2 package was checked by update tests but not on a device.
