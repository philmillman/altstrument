source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3 text and the README says GPL-3.0, with no "or later" statement. The rock kit is Big Rusty Drums by Karoryfer Samples, CC0 1.0.
homepage: https://brotschuh.github.io/fm1-loopstation/
distribution: browser-installer
requires_stock: FM1 Sampler firmware on the FM-1
install_notes: >-
  The app writes nothing to the FM-1. Install FM1 Sampler first with its flash page in Chrome on a computer, with the backup box ticked, then connect the FM-1 to the phone by USB-C and open the app in Chrome on Android or a computer, allowing the microphone and MIDI. The README says M-VAVE's updater puts the original firmware back.
