homepage: https://github.com/Reytian/fm1-luogu
distribution: download
install_notes: >-
  Download luogu-1.0.2.fwsc from the releases page and run base/tools/fm1_install.py on it from a recursive clone of
  the repository, with mido and python-rtmidi installed. The release notes say M-VAVE's own firmware can be put back
  the same way. Versions up to 1.0.1 know only the Puya flash chip and cannot save or accept updates on FM-1s sold since autumn 2026 that carry the UC25HQ80; 1.0.2 handles both. The README says installing is at your own risk.
brick_risk: true
