device: m-vave-fm-1
name: LUOGU
summary: >-
  Peking opera percussion and jinghu accompaniment: 64 luogujing patterns, 18 banshi with guomen and five whole arias,
  with play-along scoring; menus in Chinese.
description: >-
  Rights warning: the five arias come from the Jingju Music Scores Collection under CC BY-NC-ND 4.0, so the firmware
  that contains them may be shared but not sold or used commercially, and a hidden easter egg carries two sung words
  from a recording of a comedy performance whose rights belong to others.


  The firmware plays luogujing percussion patterns with their syllables lighting as they sound, and plays the jinghu,
  jingerhu and yueqin parts for eighteen banshi, so a user can sing with a band. In practice mode the user plays a
  chosen instrument on the keys or a MIDI pad and each stroke is scored as on time, early or late, and a follow-along
  mode makes the music wait for each stroke. The keys can also play the percussion or the string instruments in a
  chosen key. The sounds are recorded strokes from the Beijing Opera Percussion Instrument dataset, a synthesized
  large gong and filtered sawtooth strings. The author estimates the audio load at 35 percent of one core at most and
  has not measured it on the chip.
status: active
