  notes: No tagged releases; this is the latest commit, which ships firmware v0.24 with a practice loop; v0.23 before it has a blank idle screen; v0.22 before it holds the recorded take as Standard MIDI File data and v0.21 unifies the playhead into one sound path. The repository holds v0.20 in docs/fw, which swaps the scroll roles of KNOB3 and KNOB4, stops clipping the clef and top notes, makes loops cover whole bars and fixes stop and loop at the end of a piece. Builds 0.12 to 0.16 move to a groovebox-style playhead with a tempo knob, layering, an octave shift and a corrected piano engine; 0.17 and 0.18 replace the sampled piano with DX7-style FM piano voices, and 0.19 adds presets, overdub, scrub, jump and a backlight setting.
