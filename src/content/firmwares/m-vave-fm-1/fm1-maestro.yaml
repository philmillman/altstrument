device: m-vave-fm-1
name: Maestro
summary: >-
  Music-teaching firmware for the FM-1 that plays a piano sound on the keys and draws what you play as scrolling
  sheet music, with a tape-recorder style record, rewind and playback. An early test build; no tagged releases.
description: >-
  The screen shows a staff with a clef that scrolls as notes are played, the keys sound a piano (nine
  looped samples up to 0.16, DX7-style FM piano voices from 0.17), and the later builds add recording, rewind, punch-in, erasing and playback of what was played, shown as
  notation, with an end bar and loop from 0.11. From 0.12 the sheet has a fixed playhead and a tempo knob, notes layer on top of earlier ones, OCT+ and OCT- shift the octave and the piano sound is resampled with corrected rates. Builds 0.17 to 0.19 swap in the FM piano voices, add presets, decouple the transport, and add overdub, scrub and jump; 0.20 swaps the roles of KNOB3 and KNOB4 for scrolling, among other fixes, 0.21 unifies the playhead into one sound path and 0.22 stores the take as Standard MIDI File data. The README still describes lesson files with timing and pitch grading, seeded sight-reading drills and
  stored progress, and the repository holds five plain-text lessons and a converter that turns them into C data.
  Commit messages from 4 November say scoring was dropped in favour of the sheet-music and tape-recorder design, so
  the README is ahead of or behind the code in places. It is built on Dinghy with its platform files kept out of the
  tree, so a build starts from the Dinghy template. The repository holds a browser simulator, a web installer on
  GitHub Pages and a .fwsc package for every build from 0.1 to 0.22 under docs/fw. The page calls the package a
  test build, and nothing says it was checked on a real FM-1. An SMK-37 build is described in a design note.
status: active
authors:
- name: node56
  url: https://github.com/node56
source: https://github.com/node56/fm1-maestro
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL-3.0 text and the README and LICENSING.md state GPL-3.0-only. The piano samples (used up to 0.16) are nine notes from
  the Salamander Grand Piano V3 (CC-BY 3.0), the clef and accidentals are bitmaps from the Bravura font (SIL OFL 1.1),
  and the lessons are original or public domain. The update protocol files in docs/vendor are Leo Kuroshita's, GPL-3.0.
  The committed packages are Maestro's own builds (612,222 bytes) and match none of M-VAVE's licensed images.
homepage: https://node56.github.io/fm1-maestro/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, which resumes an interrupted install. The page says it is a test
  build with the identity FM-1_990 and that M-UPGRADE or the Firmware Hub puts the stock firmware back. Building needs
  the Dinghy template, JieLi's toolchain and the AC79 SDK, as SETUP.md describes. Back up before flashing.
brick_risk: false
tags: [lessons, ear-training, piano, sampler, emulator, fork]
