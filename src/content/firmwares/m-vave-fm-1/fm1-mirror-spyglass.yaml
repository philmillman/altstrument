device: m-vave-fm-1
name: FM-1 Mirror + Spyglass
kind: tool
summary: >-
  Android app that shows the FM-1's screen on a tablet or phone over USB or Bluetooth MIDI, plays the unit from a USB
  keyboard, shows the played notes and chords in a spyglass overlay, and installs the Big Screen firmware.
description: >-
  This is the Android counterpart of FM-1 Mirror and merges it with the author's Synth Spyglass note display, because
  Android lets only one app use the FM-1 at a time. It reads the screen from the Big Screen build of M-VAVE's open-source
  firmware, plays notes from a USB keyboard on a chosen channel, passes MIDI clock through and never forwards SysEx. The
  spyglass names the note or chord, draws it on a grand staff and shows key velocity, and can show the FM-1's own keys and the
  sound name when the firmware reports it. The app installs and updates the firmware by a port of M-VAVE's updater and can
  finish an interrupted install. It needs a USB hub to connect both the FM-1 and a keyboard. The repository carries the Big Screen
  firmware package it installs.
status: active
authors:
- name: pfkellogg
  url: https://github.com/pfkellogg
source: https://github.com/pfkellogg/fm1-mirror-spyglass-android
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3 text and the README says GPL-3.0, with no "or later" statement. The committed
  firmware/ package is a build of M-VAVE's open-source firmware plus the author's screen addition, not a stock image.
distribution: download
install_notes: >-
  Download the APK from the releases page and allow installs from your browser on Android 11 or newer. A unit still on stock
  firmware first needs M-VAVE's Official Open firmware, put on with M-VAVE's FM1 Workbench page in Chrome, then the app offers
  Install Big Screen. The README says an interrupted install leaves the FM-1 waiting in its updater and the app can finish it.
brick_risk: false
tags: [usb-midi, midi, flasher, ui]
