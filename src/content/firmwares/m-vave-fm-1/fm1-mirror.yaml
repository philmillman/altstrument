device: m-vave-fm-1
name: FM-1 Mirror
kind: tool
summary: >-
  Desktop app for macOS, Windows and Linux that shows the FM-1's screen at any size over USB or Bluetooth MIDI, plays the
  unit from a MIDI keyboard, draws the played notes on a staff, and installs the Big Screen firmware that sends the screen.
description: >-
  The stock FM-1 does not send its display to a computer, so the app depends on a build of M-VAVE's open-source firmware
  with a screen-output addition, called Big Screen. The computer asks for the screen by SysEx about once a second and
  the firmware replies with the rows it has changed. The window can be full screen and has five colour looks, including
  high-contrast ones. A keyboard plugged into the computer can play the FM-1 through the app, and a spyglass overlay names
  the notes and chords played and shows the sound name when the firmware reports it. The app installs the firmware by a
  port of M-VAVE's web updater, offers updates, and can finish an install that was cut off. It also finds ChoralRoot, JIANT FM
  and Skiff builds that carry the same screen messages. The repository holds the prebuilt Big Screen package, a Rust
  source tree and a simulated FM-1 script. An Android version is a separate project.
status: active
authors:
- name: pfkellogg
  url: https://github.com/pfkellogg
source: https://github.com/pfkellogg/fm1-mirror
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3 text and the README says GPL-3.0, with no "or later" statement. The committed
  firmware/ package is a build of M-VAVE's open-source firmware plus the author's screen addition, not a stock image.
distribution: download
install_notes: >-
  Download the build for your system from the releases page. On a unit still running stock firmware, first put M-VAVE's
  Official Open firmware on it with M-VAVE's FM1 Workbench page, then use Install Big Screen in the app. The README says an
  interrupted install leaves the unit waiting in its updater and the app can finish it, and that M-VAVE's page can put
  either official firmware back. The builds are unsigned, so macOS and Windows ask for approval on first run.
brick_risk: true
tags: [usb-midi, midi, flasher, ui]
