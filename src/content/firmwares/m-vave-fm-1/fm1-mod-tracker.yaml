device: m-vave-fm-1
name: FM-1 MOD Tracker
summary: >-
  Four-channel tracker firmware for editing Amiga .MOD songs on the FM-1, with pattern editing, piano-key sample audition,
  step writing and USB .MOD load and save. Also holds the author's FM-1 hardware research.
description: >-
  An original small-screen implementation, not a port of the Amiga program: four waveform scopes, a pattern view with a fixed centre
  cursor, EDIT, PLAY, pattern and WRITE modes, sample, octave and effect parameters, and a starter sample bank generated by a script.
  The README says version 30 was flashed to the author's own FM-1 on 2026-10-04 with a full flash readback checked, while physical
  layout, knob response, audio and frame rate are still bench checks. The main branch holds that baseline. A newer branch,
  codex/20-tracker-workflow, adds undo and redo, block operations, pattern and order arranging, sample loop and volume
  controls, mute and solo, and a graphical PC workshop that runs the firmware's own renderer, and is stated not to be hardware accepted yet. The
  repository also holds long research notes on the stock V14 and V15 layout and boot, plus the sources of the author's MDX
  player and NES emulator, which are catalogued separately. Vendor SDK checkouts, device dumps, packaged firmware and
  commercial ROMs are left out of Git.
status: active
authors:
- name: Keitark
  url: https://github.com/Keitark
source: https://github.com/Keitark/fm1-tracker
source_status: open
license: unspecified
license_notes: >-
  The README says the workspace is component-based with "no blanket repository license" and tells readers to follow each
  component's notices; the tracker's own source has no licence file on the main branch. Components such as the JieLi SDK and M-VAVE
  code keep their upstream licences.
distribution: source-only
install_notes: >-
  No package or installer is published. The author builds with CMake on Windows and flashes through a protected USB serial
  session with a checked plan and a flash readback, described in docs/. Source publication is not an installation approval,
  the README says.
brick_risk: false
