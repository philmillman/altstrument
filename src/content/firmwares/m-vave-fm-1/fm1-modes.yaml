device: m-vave-fm-1
name: FM-1 Modes (FM1 Open)
summary: >-
  Extra instrument modes added to M-VAVE's FM1 Open firmware: a tekno performance mode, CR-78 and rhythm-box drum machines, a bass player, a six-voice synth, an effects rack, a loop deck and a small game. Browser emulator only so far.
description: >-
  The repository is a copy of M-VAVE's FM1 Open V14 kit with a launcher added, opened with HOME and ARP. M-VAVE's own engine and sequencer stay as they are and the new modes take over the panel while open. TEKNO is a live 90s tekno mode with kick, tom, hat and clap layers, an acid line with Devil Fish-style controls, a drone engine, effects locked to the bars and scenes. CR-78 is a 16-step drum machine with ratchets and swing, RHYTHM BOX holds 101 rhythms on two kits, and BASS PLAYER writes bass lines that follow played chords. The rest are a subtractive synth, a shared effects rack, a loop deck, a four-track groovebox experiment and STARFALL, a key game. Many sounds are ports from the author's own fantasy console. The README says it has been developed and tested in the browser emulator only and has not run on a real FM-1.
