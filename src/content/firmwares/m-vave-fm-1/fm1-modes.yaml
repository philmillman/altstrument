license_notes: >-
  LICENSE.md gives GPL-3.0-only for the application source with M-VAVE's additional permission to link the binary SDK, inherited from FM1 Open. The engine library sdk/lib/libfm1_engine.a is proprietary, with redistribution in binary form permitted for FM-1 devices by THIRD_PARTY.md. The bundled sdk/firmware/FM-1_015.fwsc is M-VAVE's licensed V15 image (Apache-2.0, blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, matching m-vave/fm1_open). Third-party code such as Open303 keeps its licence.
homepage: https://github.com/NikkiKoole/fm1-modes
based_on: m-vave-fm-1/fm1-open
distribution: source-only
install_notes: >-
  Nothing is released. The browser emulator builds on macOS or Linux with tools/build_web_mac.py and WASI SDK 27, and the firmware itself needs M-VAVE's JieLi toolchain on Windows (build.bat). Back up projects and samples before flashing; FM1 Open's bundled V15 image returns the unit to stock.
