  url: https://github.com/Ninjathune-Human/Fm1/commit/42880f6b92f1e6bcce5c914782132270daeba255
  notes: Runtime builds are published as releases; this is the latest commit. Since the previous row it adds an English interface and manual, and more firmwares (FMDj, SPAMPY, Scintilla, MNM-1 and others) among those compiled natively. Later commits add backup and restore of the browser's saved data, a tempo clock shared by the Duo page, Elixir, ECHOFIELD and GRAINE among the native firmwares, and LED brightness drawn from each firmware's own levels. Commits after that add eleven firmwares from The Firmware Hub, the native builds Argo, FRASIL, J6 and Mutable Dreams, a linked-tempo choice in the Duo page that offers only firmwares verified to follow the shared clock, and loading of a MIDI file into a SLOOP track.
