  notes: No tagged releases; this is the latest commit, which adds TOOLS rows for the flash chip and core 1's fault policy. Since the previous row the commits add stock bank extraction and Program Change probes, adopt a keyboard map contributed on 23 November, read the unit's idle reports and a first full Rec demo, and stop a drifting stick from redrawing or shortening the sleep slice.
- version: main @ 8d4adc8
  date: 2026-11-22
  url: https://github.com/joashchee/FM1-NTT/commit/8d4adc8be4218919f8a749028d5713c6d22df413
  notes: No tagged releases; this is the latest commit, which adds fuzz tests of the catalog, WAV, ADPCM, .fm1i, UI, extractor and flash-restore readers, none of which panicked. The commits before it on 22 November make the FM-1's flash chip a choice (--flash-part), add an option for the second core's fault policy, fix a panic on a word load at the end of RAM, stop a damaged .fwsc from panicking the package reader, cross-check the instruction decoder against pi32v2-isa, and add notes on FM-1 Studio, pi32v2-llvm and m-bootloader from their READMEs; on 21 November the host stops starving its UI during a firmware load and lets the sound device sleep when idle. Before them, a commit strips the builder's paths from the WebAssembly build and fails if any remain. Commits before it on 21 November add a FILES panel for recordings and slots, a compare mode on the showcase demos, a load progress splash and a Linux desktop archive built in Debian 12, and try a signed and notarized macOS build. The 24 commits before that fit the 4-operator FM engine's filter, shaper and LFO settings to OPERATOR, add glide, legato and a sustain pedal to the instrument host, add colour themes and a keymap, and add an audition and catalog to the C face and the web build. Before that, commits add a 4-operator FM engine fitted to OPERATOR 0.7 and Mighty Arp 1.5, filter, distortion and phaser effects, an arpeggiator and a 16 by 16 step sequencer, an instrument editor with a widened .fm1i package, MIDI clock sync and USB MIDI input, and emulation on its own thread so a firmware slower than real time no longer leaves the device dry. They also add a docs file compiled by Gemini that the repository marks unverified, and a stock-firmware regression test. Earlier commits add a MONITOR panel that shows the host machine, a firmware showcase with background demos and a player, notes on stock firmware's MIDI and SysEx behaviour tried in the emulator, a WebAssembly build of the web shell, a faster AArch64 JIT turned on by default, a firmware extractor, a 6-operator msfa engine port and a model of Felucca's FM6 tuning, and record R36S speed measurements of about 0.24x at best.
