device: m-vave-fm-1
kind: tool
name: fm1-orchestra
summary: >-
  Python tools for playing orchestral pieces on the FM-1 from a Mac over USB MIDI: DX7 patch loading, eight-part song modules, MusicXML score import, recording from the FM-1's USB audio and slide-show videos.
description: >-
  Rights warning: the repository bundles 228 DX7 voice banks, among them Yamaha's factory banks, taken from a collection that the source page calls public domain without giving a basis, and its SOURCE.md invites authors to ask for removal. The tool works with the stock V16 firmware, which has eight parts and 20 voices. The fm1ctl.py command loads patches into the unit, sends each instrument of a song to its own part, sets balance and effects and records the result, and the song modules are small Python files that name the parts, sounds, levels and phrasing. A score in MusicXML can be converted into a MIDI file with dynamics, and a video command builds slides over a recording. Four pieces are included as songs, Saint-Saëns' Aquarium, two Bach Brandenburg movements and an arrangement of Carol of the Bells, with MIDI files for Clair de Lune and the D minor Toccata and Fugue that have no song module yet. The author posted a video of the Aquarium rendition. It needs macOS, Python 3.12 and ffmpeg.
