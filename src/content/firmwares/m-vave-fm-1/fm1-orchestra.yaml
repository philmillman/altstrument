license: CC0-1.0
license_notes: >-
  The README dedicates the software, song modules, arrangements and documentation to the public domain under CC0 1.0, and lists exceptions that keep their own terms. The Brandenburg 3 score and MIDI derive from Chris Sawer's Mutopia edition under CC BY 3.0, the Krueger Clair de Lune MIDI is CC BY-SA 3.0 Germany, and the other scores are public domain or public-domain dedications according to each song's CREDITS.md. The fm1-orchestra/sysex folder holds DX7 patches whose public-domain status is not established, including Yamaha factory banks.
homepage: https://github.com/cmcguinness/fm1-orchestra
distribution: source-only
requires_stock: V16
install_notes: >-
  Clone the repository, create a Python 3.12 environment with uv, install requirements.txt and requirements-dev.txt and run brew install ffmpeg. docs/setup.md also covers the one-time channel and effect settings on the FM-1 and upgrading it to V16. fm1ctl.py load-bank writes DX7 voices into the unit's sound bank D and does not write firmware.
