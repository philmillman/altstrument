  notes: Fixes looping strums, where a repeated note-on for a pitch still sounding was ignored and most strums in a held punk or folk bar went silent.
- version: b1.6.1
  date: 2026-10-17
  url: https://github.com/xMagElonx/fm1-guitar/releases/tag/b1.6.1
  notes: Fixes a crash in long looping sessions caused by an unbounded write to a diagnostic buffer.
