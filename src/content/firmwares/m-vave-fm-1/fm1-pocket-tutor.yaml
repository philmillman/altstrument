device: m-vave-fm-1
name: FM1 Pocket Tutor
summary: >-
  Study firmware for the FM-1: a lessons page in Chrome sends notes over MIDI that light the keys where to play, while the FM-1 plays an FM6 six-operator sound.
description: >-
  The 27 keys light up to show where to play a note, scale, chord or chord progression, and a lessons page in Chrome guides each step as watch, play, check over Web MIDI. Guide notes go on MIDI channel 16 and only light the LEDs; the firmware does not play them. The page has an on-screen keyboard, a computer-keyboard mode, a catalogue of songs split into sections as chords only, and ChordPro import for the user's own songs. It is available in Portuguese, English and Spanish. The firmware is derived from fm1-dock and carries its FM6 six-operator module, with SAVE keeping 32 user presets. Release 0.1 has no Bluetooth MIDI. The release notes say it was tested on one FM-1 and in an emulator.
