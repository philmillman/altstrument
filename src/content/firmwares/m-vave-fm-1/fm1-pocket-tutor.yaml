license_notes: >-
  The README and LICENSE give GPL-3.0-only. Components keep their licences listed in LICENSING.md: the Bluetooth MIDI code from Optimist is GPL-3.0-only, the JieLi radio calibration is Apache-2.0, and the Terminus font is SIL OFL 1.1. No JieLi SDK files or M-VAVE firmware images are in the tree.
homepage: https://github.com/wellingtonsaam/fm1-pocket-tutor
based_on: m-vave-fm-1/fm1-dock
distribution: download
install_notes: >-
  Install fm1-pocket-tutor-0.2.fwsc from the release with the FM-1 Firmware Hub or tools/fm1_install.py over USB. The README says an FM-1 on factory firmware first needs a firmware that speaks the Felucca update protocol. The lessons page is docs/prototipo-aulas.html, opened in Chrome for Web MIDI.
