source: https://github.com/utopick/fm1-pocket
source_status: open
license: MIT
license_notes: >-
  The app in pocket/ is MIT by utopick and fm1-emu is MIT by Joakim Eriksson, with a copy in pocket/vendor. The m-bootloader files bundled for the installer are MIT by jvitkauskas. Tether in pocket/firmware is GPL-3.0-only and has its own entry. Every other firmware belongs to its author, is fetched from the Hub and is not in the repository. The page does not bundle M-VAVE's firmware; to go back to stock the user opens the FM-1.fwsc they downloaded.
homepage: https://utopick.github.io/fm1-pocket/pocket/
distribution: browser-installer
install_notes: >-
  Open the hosted page; installing it as an app is under OPTIONS. Running firmware in the emulator writes nothing to a unit. The REAL FM-1 pane needs Chrome or Edge on a computer or an Android phone, not iPhone or iPad. Its steps are connect, backup, protector and install, and install stays locked until the backup and the protector are done. The protector writes m-bootloader to the unit's boot area, and every later install needs the unit in the protector's MIDI mode, reached by holding PLAY while powering on. The README says that holding PLAY at power-on still opens the protector if a firmware fails to start.
brick_risk: false
