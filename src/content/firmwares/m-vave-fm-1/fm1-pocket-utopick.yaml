device: m-vave-fm-1
kind: tool
name: FM1.Pocket
summary: >-
  Offline-capable phone and computer web app built on fm1-emu that plays any Firmware Hub firmware on a touch FM-1, takes a MIDI keyboard, and installs firmware on a real FM-1 over USB after a backup and the m-bootloader protector.
description: >-
  FM1.Pocket is a fork of Joakim Eriksson's fm1-emu that adds one folder, pocket/, and leaves the emulator unchanged. The page draws the FM-1 for touch with several fingers at once, in the whole panel, bigger keys or top-only layouts, with piano keys, the colours the FM-1 is sold in and screen styles. A firmware list fetches community firmware from the Hub, keeps each offline with its author's manual, and can open a local file or load a DX7 voice bank. A MIDI keyboard plays it, with a drawing of the keyboard and a step-by-step map for its knobs and pads. The REAL FM-1 pane connects to a unit over Web MIDI in Chrome or Edge or on Android, saves a backup of everything on it, installs jvitkauskas' m-bootloader as a protector, which the page requires before any install, and then installs a chosen firmware through the protector's MIDI mode. It also installs Tether, which makes the real unit the panel of the page. The app can be installed as a home-screen app, has an English and Spanish interface, and the project publishes other Pocket apps beside it.
status: active
