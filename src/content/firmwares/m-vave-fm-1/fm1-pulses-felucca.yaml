device: m-vave-fm-1
name: FM-1 Pulses (Felucca)
kind: tool
summary: >-
  Browser generator that makes sixteen 64-step sequences from LFO, distribution and quantizer settings and
  writes them into Felucca's four projects of four tracks over its editor protocol.
description: >-
  A fork of the author's FM-1 Pulses, which targets the Baud Girl firmware, rewritten for Felucca. The signal
  chain runs clock, gate probability, sample and hold, LFO, distribution and quantizer into a loop buffer. A
  4x4 matrix with piano rolls selects a sequence; Write 16 loads each project, writes the changed steps and
  saves it to flash, and a single sequence can be frozen into a chosen track. Note lengths are written as ties.
  Auditioning plays through a small FM synth in the browser as well as the unit. The protocol codec was checked
  against an FM-1 running Felucca 1.5.1. Felucca refuses pattern writes while its sequencer is playing, so the
  app asks you to stop it first.
status: active
authors:
