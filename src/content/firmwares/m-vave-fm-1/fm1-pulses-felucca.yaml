homepage: https://mene311.github.io/fm1-pulses-felucca/
based_on: m-vave-fm-1/fm1-pulses
requires_stock: Felucca 1.5
install_notes: >-
  Use the hosted page, or serve the folder locally (python3 -m http.server) and open it in a Web MIDI browser.
  Set MENU > MIDI > ROUT to CH1-4 on the FM-1 for live play. Write 16 overwrites the unit's saved projects.
