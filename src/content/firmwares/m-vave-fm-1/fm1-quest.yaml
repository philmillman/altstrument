device: m-vave-fm-1
name: FM1 Quest
summary: >-
  SLOOP as a pixel-art RPG sidescroller: tracks are party heroes, lit steps are attacks, tempo sets walking
  speed, scales set biomes, and recording a loop triggers a boss fight. SLOOP functions and controls are
  unchanged.
