  notes: No tagged releases; this is the latest commit. Since the previous row the FM-1 source has its own set of 67 factory presets, a redesigned HOME screen and picture-first pages, a FUNC function-generator module, hold-EDIT undo, a LEARN mode for macros, panel shortcuts for chords, arpeggiator and effect bypass, and a STYLE setting on ARP that plays chord, bass and arpeggio layers in 32 rhythms. The firmware manual was rewritten. Updates 36 to 40 add chords and arpeggiator in two stages, MIDI controller pages on SEL, sequencer delete, lasso and copy and paste, dynamics and articulations, a click track and count-in. Updates 41 to 51 add a tap of SEL that ends the sequencer's lasso, a HUMAN feel setting for chord notes, strum on the sequencer's chords, a RHYTHM page with ring generators for bass, chord and arpeggio, reworked bass and lead presets, 26 KB less program and RAM use, and a new look with sliders in place of round dials and an Ivory theme. The committed packages in firmware/packages were last rebuilt on 9 November.
