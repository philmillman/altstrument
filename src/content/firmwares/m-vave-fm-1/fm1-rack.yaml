device: m-vave-fm-1
name: FM1 Rack
summary: >-
  Sound-design instrument that chains Mutable Instruments modules into one voice with a mod matrix and sequencer. It
  runs in a browser; a firmware port of a subset of it and a benchmark build exist for the FM-1, and the port has not yet run on one.
description: >-
  A voice is built from a fixed chain of a source, a shaper and an amp, two modulators and two effects, using
  Plaits, Braids, Elements, Rings, Warps, Clouds, Peaks, Tides 2, Marbles and Grids code, patched through a 12-row
  mod matrix and played through four macros, scale chords, a sequencer with a piano roll, parameter locks and
  ratchets, an arpeggiator, 13 tunings, a master EQ and limiter, and MIDI in and out over USB. The browser build
  runs the original module code as WebAssembly and has a manual.

  The firmware side is a port called FM1 Rack Lite. It plays 57 factory presets that use only the Lite modules from the
  keys and MIDI, with macros on K1 to K4; the source now has a set of 67 presets of its own fitted to the FM-1's CPU. Four stages of menus are now in: pages for editing each module, a save page
  with 64 user presets and a library, scales, chords, an arpeggiator and tunings, and a sequencer with patterns and a
  song. The repository also holds a benchmark firmware, and its results page records a run on a real FM-1: the FPU
  works, one core plays about two Plaits voices, and the second core now renders half the voices. The firmware README
  still says FM1 Rack Lite has not run on an FM-1, so treat the Lite build as untested. The module names of Mutable Instruments are still on screen,
  and the README lists renaming them before any public release.
