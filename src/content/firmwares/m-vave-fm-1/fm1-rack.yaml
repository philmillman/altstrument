license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL-3.0 text and the README says the project as a whole is GPL-3.0 with no later-version
  clause. The Mutable Instruments module code and stmlib are MIT, Grids and the Felucca platform are GPL-3.0, and the
  FM-1 app files in firmware/fm1 carry MPL-2.0 headers because they are adapted from fm1-base. The screen font is
  SIL OFL 1.1.
homepage: https://github.com/JoshCowley/MODFM1
distribution: download
install_notes: >-
  firmware/packages holds fm1bench.fwsc, fm1bench-os.fwsc and fm1rack.fwsc with SHA-256 sums, and INSTALL.md says to install over USB
  with fm1-base's tools/fm1_install.py. It asks you to run the recovery round trip through Felucca's web installer
  and Return to official V15 first, and to install the benchmark before the rack build. The sources fetch fm1-base,
  the Mutable code and JieLi's SDK files from JieLi's Gitee repository. Both packages are test builds.
brick_risk: false
