device: m-vave-fm-1
name: FM1 Radio
summary: >-
  Internet radio for the FM-1: joins a 2.4 GHz WiFi network, plays stations chosen from Radio Garden's map and lets
  the white keys apply punch-in effects such as stutters, tape stop and bitcrush.
description: >-
  Built on fm1-base. The four knobs pick continent, country, place and station, and the list of about 12,900
  places is fetched from Radio Garden on first use and kept in flash; no station data is stored in the firmware.
  It plays MP3 and AAC streams over HTTP or HTTPS. HTTPS connections do not check server certificates, which the
  README calls a known limit. A small four-voice synth on the keys, 16 favourites, tap-tempo for the effects and
  USB audio output are included. The author calls it a proof of concept, and every release is marked a
  pre-release; the first one was withdrawn after crashes on some units.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-radio
source_status: open
license: MPL-2.0
license_notes: >-
  MPL-2.0 for the source (LICENSING.md has the origin of each part). JieLi's AC79 SDK files, Apache-2.0, are fetched
  by the build and are not in the repository; BearSSL and the AAC decoder sit under app/third_party with their own
  licences. Nothing from Radio Garden is in the firmware or the repository.
homepage: https://charlesvestal.github.io/fm1-radio/install/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, with a browser emulator and a manual on the same site. The
  installer's Back to the stock firmware takes an M-VAVE package that you choose yourself; none is bundled. To
  build it you need the JieLi toolchain, the AC79 SDK and Docker or podman on a Mac, then
  base/tools/fm1_install.py. Favourites sit in a flash area that other firmware, such as LOOM-8's samples, can erase.
brick_risk: false
tags: [performance, fx, usb-audio, wifi, emulator]
