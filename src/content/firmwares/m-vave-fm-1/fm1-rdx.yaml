device: m-vave-fm-1
name: FM1-RDX
summary: >-
  Four-operator FM synth for the FM-1 inspired by the Yamaha Reface DX: 33 sounds, twelve algorithms, up to seven adaptive voices, two of seven effects and Reface-style SysEx, with a browser emulator.
description: >-
  Rights warning: the repository commits SysEx files of the Yamaha reface DX factory voices (DigiChord, WobbleBass, LegendEP and the rest of the factory banks) and a reface DX dump, with no statement that Yamaha allows it. It has no licence file, and its own notes say the licensing of the original RDX code and its voices is not established. It is a port of the author's ESP32 RDX synth onto fm1-base. The sounds are four banks of eight plus an init voice, editable per operator with envelopes, LFO and pitch envelope, and the FX button opens two slots chosen from distortion, touch wah, chorus, flanger, phaser, delay and reverb. Polyphony starts at four voices and rises while the measured processing headroom allows, to seven in 1.0.0 beta, where eight voices stay diagnostic-only. It takes MIDI on USB and TRS with optional Reface FM control changes, records over USB audio and answers Soundmondo's SysEx to load a voice into the edit buffer. From 1.0.1 it has 32 named user voice slots, a phrase looper with overdubbing, four draft slots that store a phrase, voice and tempo, and an audible metronome; the 1.0.0 beta had temporary edits only. The 1.0.1 notes say it is tested regularly on FM-1 hardware and that the new pixel interface still needs its own readability and seven-voice stress check.
status: active
authors:
- name: copych
  url: https://github.com/copych
source: https://github.com/copych/FM1-RDX
source_status: open
license: unspecified
license_notes: >-
  There is no LICENSE file for the project's own code. The development notes say the original RDX and voice licensing is unverified and that no release licence is invented. The pinned fm1-base and felucca-bsp sources are MPL-2.0, and the vendored USB MIDI libraries carry their own licence files.
homepage: https://copych.github.io/FM1-RDX/
distribution: browser-installer
requires_stock: V15 or another custom firmware
install_notes: >-
  Install from the project's web installer in Chrome or Edge with a USB data cable, and back up whatever you want to keep with your current firmware's tools first. The installer includes a way back to M-VAVE's stock firmware and does not offer a bootloader replacement. Close the installer tab before opening a DAW or MIDI app, since it can hold the MIDI port. The release page offers FM1-RDX-v1.0.1.fwsc and a web ZIP with the matching emulator and installer assets, and the project's install page writes the same build.
brick_risk: false
tags: [synth-engine, fm, fx, midi, sysex, usb-audio, emulator, port]
versions:
- version: 1.0.2
  date: 2026-11-24
  url: https://github.com/copych/FM1-RDX/releases/tag/v1.0.2
  notes: Adds reversible whole-loop quantization with straight and triplet grids from 1/4 to 1/32, saved with each draft (older drafts load with quantization off), tighter Looper, Store and Draft layouts with button hints, DC removal before the effects and output peak protection. Drafts saved by 1.0.2 need 1.0.2 or later.
- version: 1.0.1
  date: 2026-11-24
  url: https://github.com/copych/FM1-RDX/releases/tag/v1.0.1
  notes: Adds 32 named user voice slots, phrase recording with overdubbing and a captured voice per loop, four draft slots, an audible metronome, note, record and beat LEDs and a single monochrome bitmap interface for editing, Store, Looper and Drafts. Stop playback before saving, since flash writes briefly mute the sound.
- version: 1.0.0-beta
  date: 2026-11-22
  url: https://github.com/copych/FM1-RDX/releases/tag/v1.0.0-beta
  notes: Pre-release and the first GitHub release. Starts the second core's audio generation automatically with up to seven adaptive voices, opens the algorithm screen when ALGORITHM is turned, and attaches the firmware package, a web ZIP, SHA256SUMS and build evidence. The notes report a seven-voice sweep of 1,034 steady blocks with no underruns.
