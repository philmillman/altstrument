device: m-vave-fm-1
name: FM1-RDX
summary: >-
  Four-operator FM synth for the FM-1 inspired by the Yamaha Reface DX: 33 sounds, twelve algorithms, up to eight adaptive voices, two of seven effects and Reface-style SysEx, with a browser emulator.
description: >-
  Rights warning: the repository commits SysEx files of the Yamaha reface DX factory voices (DigiChord, WobbleBass, LegendEP and the rest of the factory banks) and a reface DX dump, with no statement that Yamaha allows it. It has no licence file, and its own notes say the licensing of the original RDX code and its voices is not established. It is a port of the author's ESP32 RDX synth onto fm1-base. The sounds are four banks of eight plus an init voice, editable per operator with envelopes, LFO and pitch envelope, and the FX button opens two slots chosen from distortion, touch wah, chorus, flanger, phaser, delay and reverb. Polyphony starts at four voices and rises while the measured processing headroom allows. It takes MIDI on USB and TRS with optional Reface FM control changes, records over USB audio and answers Soundmondo's SysEx to load a voice into the edit buffer. Edits are temporary: saving patches is not implemented. The author calls it an experimental preview and says the latest fixes still need a hardware retest.
status: active
authors:
