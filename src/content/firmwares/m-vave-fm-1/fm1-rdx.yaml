  url: https://github.com/copych
source: https://github.com/copych/FM1-RDX
source_status: open
license: unspecified
license_notes: >-
  There is no LICENSE file for the project's own code. The development notes say the original RDX and voice licensing is unverified and that no release licence is invented. The pinned fm1-base and felucca-bsp sources are MPL-2.0, and the vendored USB MIDI libraries carry their own licence files.
homepage: https://copych.github.io/FM1-RDX/
distribution: browser-installer
requires_stock: V15 or another custom firmware
install_notes: >-
  Install from the project's web installer in Chrome or Edge with a USB data cable, and back up whatever you want to keep with your current firmware's tools first. The installer includes a way back to M-VAVE's stock firmware and does not offer a bootloader replacement. Close the installer tab before opening a DAW or MIDI app, since it can hold the MIDI port. The current build is a site preview (Preview 2026.11.21-12, identity FM-1_9900) with no GitHub release or tag.
brick_risk: false
