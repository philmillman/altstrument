device: m-vave-fm-1
kind: tool
name: FM-1 Relay Studio
summary: >-
  Browser control centre for up to eight FM-1s on open-source firmware: clock master, piano-roll sequencer, sound editor,
  mixer, remote control and multitrack recorder in one static page.
description: >-
  A larger sibling of FM-1 Relay by the same author. With SLOOP, Felucca, Skiff or JIANT it reads and writes sounds, mix,
  patterns, presets and projects over their SysEx editor protocol, and with other firmware it uses the documented MIDI
  channels, CCs and Program Change. It detects the firmware on each unit and lists the menu settings that unit needs. A
  demo mode runs a virtual SLOOP with no hardware. It needs Web MIDI with SysEx, so Chrome or Edge on a computer.
status: active
