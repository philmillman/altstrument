device: m-vave-fm-1
kind: tool
name: FM-1 Relay
summary: >-
  MIDI clock master for up to four FM-1s on any open-source firmware: a browser web app and a native iPad app that
  send one tempo and start every unit on the same downbeat.
description: >-
  It sends 24 PPQN clock with start and stop to four hot-plug slots, schedules each clock byte ahead with Web MIDI
  timestamps from a worker thread so background tabs stay steady, and starts a unit that joins mid-song at the next
  bar or beat. It recognises SLOOP, Felucca, Skiff, JIANT, X0X and ECHOFIELD from the port name or an INFO reply and
  shows which menu setting each needs to follow USB clock. It also sends ECHOFIELD's start and stop as CC messages and
  follows tempo with its delay time. Other controls are tap tempo, a ping note to identify a unit, keyboard shortcuts
  and demo units for trying it without hardware. The web app installs as an offline app and needs Web MIDI, so Safari and
  iOS browsers cannot run it; the iPad app is a SwiftUI and CoreMIDI build from the ipad folder with Xcode 16, and keeps
  running in the background. The README says it is not affiliated with M-VAVE or the firmware authors and contains none
  of their code.
status: active
