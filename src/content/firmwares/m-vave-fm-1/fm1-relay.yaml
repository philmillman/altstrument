distribution: browser-installer
install_notes: >-
  Nothing to flash: open the web app in Chrome, Edge, Opera or Firefox on a computer or Android, allow MIDI with SysEx,
  and plug in the FM-1s, using a powered hub for three or four. The iPad app has no store build and is built from
  the repository's ipad folder. Each firmware needs its clock source set to USB, which the app shows per slot.
