device: m-vave-fm-1
name: FM-1 Rescue
kind: tool
summary: >-
  Desktop assistant for Windows, Linux and macOS that guides recovery of a hard-bricked FM-1 through an RP2040 FM-1
  Transporter, wrapping the MvaveFM1Unbricker engine with wiring steps, backups and a typed write confirmation.
description: >-
  The interface runs in a browser engine or a native macOS window and starts in simulation; hardware mode needs the --live
  option. It walks through wiring a Seeed XIAO RP2040 to the unit's D+, D- and ground lines, makes a double-read backup of
  the flash, checks that the package you supply is M-VAVE's V15 by hash, shows the write plan and asks you to type WRITE before it
  writes. It refuses V16, and the engine it wraps restricts writes to 0x4000 to 0x92FFF, so the boot area is not touched.
  The recovery code is an unmodified vendored copy of Quixotic7's MvaveFM1Unbricker pinned at commit 0edc5ad, and the
  Transporter board firmware and the JieLi loader are not included. The interface is in English and Portuguese. The prerelease
  has Windows and Linux standalone archives that bundle Python and a browser runtime. The README says these passed
  a simulated recovery in CI, and that recovery on real hardware through this interface is still to be validated. The
  repository holds no firmware; its quick-start says the macOS standalone app carries the V15 package and checks it by SHA-256.
status: active
authors:
