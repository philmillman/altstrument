distribution: download
requires_stock: Official V15 package, supplied by you
install_notes: >-
  Download the Windows or Linux archive from the release, or run the source launchers with Python 3.10 or newer and Chrome,
  Edge or Chromium; on macOS build the native app with macos/build.sh. You supply M-VAVE's V15 and a Transporter UF2 made by
  the MvaveFM1Unbricker setup command. The app writes only after a verified backup and the typed WRITE. The archives are
  unsigned, and the README asks you to charge the unit first.
brick_risk: false
