license_notes: >-
  LICENSING.md: GPL-3.0-only for RIFT's own code, inherited from Felucca. The six engines are MIT, the board support
  layer is MPL-2.0, and fonts, CC0 samples and ported DSP keep their own licences (firmware/LICENSING.md,
  firmware/LICENSES/). Packages also carry three Apache-2.0 JieLi SDK files.
homepage: https://github.com/mykeln/fm1-rift
distribution: source-only
requires_stock: Felucca installer on a V15 unit (not hardware-validated)
install_notes: >-
  Clone recursively, since the engine and board-support submodules are missing from GitHub's archives, then build with
  rift.sh and the JieLi toolchain and AC79 SDK and install with tools/fm1_install.py. Installing may replace stored
  data that Felucca's formats do not match. The README tells readers to set up a backup and recovery route first and
  to read the hardware trial guide, and says full device validation is pending. Installing is at your own risk.
brick_risk: true
