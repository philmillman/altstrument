device: m-vave-fm-1
name: RIFT
summary: >-
  Experimental nine-mode drone synth built on a modified Felucca: oscillator pairs and clusters, phase and ring
  modulation, filtering, stereo delay feedback and frequency translation. Source only, with hardware validation pending.
description: >-
  RIFT adds an instrument to Felucca that owns the stereo output while it is active. Its nine modes are PAIR, FOLD,
  SINES, WAVES, CHORD, CLUSTER, PARTIAL, CROSS and CAVERN, with three sounds stored per mode. SELECT sets the root
  pitch, ALGORITHM chooses the mode, and the ENV, FX and LFO buttons open three macro pages edited with K1 to K4.
  ARP switches between drone and keyed play. Felucca supplies the hardware layer, USB MIDI and audio, storage and the
  updater. The README says it is inspired by the sound of the Forge TME VHIKK-X and that no VHIKK-X code or
  wavetables were used. The repository builds against Felucca commit 7435517 with its history retained. No
  installable release exists, and the author's hardware guide says the first install had not yet been run.
