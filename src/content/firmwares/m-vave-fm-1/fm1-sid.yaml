device: m-vave-fm-1
name: FM-1 SID
summary: >-
  Turns the FM-1 into a Commodore 64 SID synth with twelve instruments, a three-track step sequencer and stereo
  effects, and also plays C64 tunes and GoatTracker songs by running their own code.
description: >-
  Built on Felucca's hardware layer, with the SID chip rendered by reSID 0.16 or by the author's own integer
  model and a driver that plays it the way C64 music does. In synth mode the note keys play twelve instruments,
  the knobs set cutoff, resonance, attack and release, and a three-track, 16-step sequencer and a chorus, delay
  and reverb sit on top. In player mode it runs PSID tunes on an emulated 6502 and RSID tunes on a whole emulated
  C64, plays GoatTracker 2 songs, has a song editor on the FM-1, and draws the voices, sync, ring modulation and
  filter on the screen. Tunes are appended after the firmware image as a pack. The same code runs as a web page that plays tunes from the HVSC archive, and the FM-1
  emulator entry names it as one of the firmwares it runs. On a real FM-1 it runs on the fm1-dock firmware, which keeps USB, the installers
  and the rescue: release 0.3 is a package of fm1-dock with FM-1 SID and a plain sine synth, starting in FM-1 SID, and the same code can be
  deployed as a module into an fm1-dock that holds other synths. The README reports it playing on a real FM-1 both ways (as a module on
  2026-10-24, as its own package on 2026-10-25) and says the older standalone builds on Felucca's and Dinghy's update code are not for a real FM-1,
  because their USB replies never reach a computer. Any .sid file can be sent to the FM-1 over USB from the project page and plays at once without
  writing flash. Your own tunes can be packed into the package or the module. The project moved out of the fm1-emu repository into a repository
  of its own on 2026-10-25.
status: active
authors:
- name: Joakim Eriksson (joakimeriksson)
  url: https://github.com/joakimeriksson
source: https://github.com/joakimeriksson/fm1-sid
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md in the repository: the firmware, the fm1-dock module and the web app are GPL-3.0-only because
  they build on Felucca's HAL and effects code, and the build fetches reSID 0.16 (GPL-2.0-or-later). The
  author's own SID model and the PSID/RSID player are BSD-2-Clause, and the GoatTracker 2 player and editor
  files are GPL-2.0-or-later. A file without a licence line is MIT.
homepage: https://joakimeriksson.github.io/fm1-emu/fm1-sid/
distribution: download
install_notes: >-
  Install the release package, fm1-sid-0.3.fwsc, over USB with fm1-dock's installer script or from the install page
  on the fm1-dock site; or install fm1-dock first and deploy FM-1 SID into it as a module, then pick it with HOME.
  fm1-dock answers other installers and the Firmware Hub, so going back to another firmware is an ordinary install;
  OCT- held at power-on starts fm1-dock's USB rescue, and the FM-1's own recovery (OCT- and OCT+ held) is the last
  resort. The release notes say 0.3 was verified on a real FM-1. The older standalone sidplayer.fwsc build is not
  for a real FM-1. Build scripts need JieLi's Linux toolchain and fetch their GPL dependencies on demand.
brick_risk: false
tags: [synth-engine, sequencer, fx, emulator, research]
versions:
