device: m-vave-fm-1
name: FM-1 Studio (browser)
kind: tool
summary: >-
  Browser workstation at fm1studio.com that compiles C or C++ in the page and plays it on a simulated FM-1, and loads and runs nine open FM-1 firmwares from their GitHub sources.
description: >-
  Everything runs in the page: clang as WebAssembly in a worker compiles a project written against an fm1.h API, and the module plays on an AudioWorklet next to a
  panel with the 240 x 240 screen, 27 keys, buttons, encoders and the master pot. Web MIDI input is supported. A gallery fetches the source of nine community firmwares at fixed tags or commits,
  compiles them and runs them with their own browser emulators. A FIRMWARE button compiles a project for the FM-1's own processor with a second in-page compiler (about 52 MB, loaded on first use) and downloads a .fwsc package, and an INSTALL button writes it to an FM-1 over USB MIDI in Chrome or Edge using fm1-base's installer; it installs fm1.h projects and, per the README, the nine gallery firmwares that the page can build for the FM-1 (CS-1, FM-106, AURORA, FMINI-1, GR!MM, Felucca, SLOOP, Skiff and JIANT). The package's update loader writes only the program area, not the boot loader, and the install dialog does not offer M-VAVE's own firmware, which the README says to put back with another tool. The README says it was tested, with all its features, on one FM-1 with the newer flash chip and m-bootloader 2.4, and not on the first chip or under the boot loader of V15 or V16. Code that runs in the simulator is not guaranteed to run on a real FM-1. The first load downloads about 60 MB of compiler. Not the same project as thingsapart's Android FM-1 Studio.
status: active
authors:
- name: Tim Samshuijzen
  url: https://github.com/TimSamshuijzen
source: https://github.com/TimSamshuijzen/fm1studiocom
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is GPL-3.0 and the README states GPL-3.0-only. The gallery firmwares are their authors' work under their own licences, which load with each project;
  the generated files in src/extras are made from that code and carry its licences. The compiler is binji's wasm-clang, loaded from its demo site.
homepage: https://fm1studio.com
distribution: browser-installer
install_notes: >-
  Open fm1studio.com in a browser, or serve the src folder with any static server. The page keeps nothing between visits, so SAVE a project as a zip before closing it. Simulating writes nothing to an FM-1. To install, press FIRMWARE or INSTALL in Chrome or Edge with the FM-1 on USB and follow the dialog; the README advises making a whole-flash backup and installing m-bootloader with M-Flasher first, and keeping M-VAVE's FM-1.fwsc to put the stock firmware back with fm1_install.py or M-UPGRADE.
brick_risk: false
tags: [emulator, web, sdk, synth-engine, flasher]
