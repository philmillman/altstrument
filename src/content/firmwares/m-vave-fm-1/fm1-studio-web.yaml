  notes: No tagged releases; this is the latest commit. The commits since the previous row add a VIBE dialog that gives an AI chat a prompt, with the rules for an FM-1 program and all of fm1.h, so that C code pasted on the page or a dropped main.c becomes a new project. They also add three example projects (a synth, a piece and a game) and a fourth demo card, GAME-2, which loads an arcade shooter. All of them are commits titled update. Before that, the earlier commits of 17 November, all titled update, rewrite the README and the page, which now says the nine gallery firmwares install and were tested on a real FM-1. Earlier commits add two demo projects, take the return to M-VAVE's firmware out of the INSTALL dialog and add the README's report of a test on a real FM-1.
