device: m-vave-fm-1
name: FM-1 Switch
kind: tool
summary: >-
  Windows and Mac desktop app that installs any FM-1 firmware package in either direction and runs a guided check and
  rescue for an FM-1 that seems bricked; unrelated to the iOS and Mac app FM-SWITCH.
description: >-
  M-VAVE's own updater accepts only a higher firmware number than the installed one. This tool takes any
  Felucca-based package for the FM-1 model, such as Wild, NB303, n001se or FiMba-1, lists the .fwsc files in its
  firmware folders and shows what the FM-1 currently runs. Check and unbrick listens for the unit in each of its modes
  and offers Install, Finish the install or a rescue through the chip's own update mode. The rescue reads the whole
  flash twice, saves a backup with a SHA-256 beside it and reads it back before writing. Version 1.3.2 hears the
  SMK-37 keyboards and installs firmware made for that model, which the author says has not been tried on a keyboard.
  Rescue is limited to the FM-1. Version 1.4.0 adds a Hardware / backup report that names the flash chip and saves a verified backup, and it writes to the UC25HQ80 chip of newer units only after an explicit experimental opt-in over direct USB. Version 1.4.1 reads which flash chips a chosen package accepts, refuses it in Rescue when the measured chip is not among them and warns before an install. The repository holds Python source and build scripts, and no application binaries.
status: active
