device: m-vave-fm-1
name: FM1 Tape
summary: >-
  Fork of M-VAVE's FM1 Open V14 that swaps the panel for a tape-deck interface: tracks as reels, splice editing,
  scrubbing, an album of saved slots and an OP-1-style button layout.
description: >-
  The change is an alternative interface in app/ui_op1.c, switched on by a define in app/version.h; deleting the define
  gives M-VAVE's own interface back. Tracks 1 to 4 show as tape reels with a length knob, a scrub knob and splice edits
  such as lift, drop, cut, erase, undo and loop, and the SAVE button opens an album of factory and user slots. Later
  commits add a setup page with Bluetooth, BLE MIDI host and clock options, a quicker way to start a new tape, and
  presets for the engines. The README is still M-VAVE's FM1 Open V14 text. Four extra browser-only synth engines (wavetable,
  pad, granular cloud and electric keys) run in the web preview but are hidden on the device, whose sound engine is the
  sealed binary library. The repository adds a GitHub workflow that builds the package on Windows.
status: active
authors:
