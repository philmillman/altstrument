  url: https://github.com/bryanf2311
source: https://github.com/bryanf2311/fm1-tape
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md is M-VAVE's FM1 Open file, byte for byte (git blob f1b1738...): GPL-3.0-only with the FM1 SDK linking
  permission. The binary engine library keeps M-VAVE's separate terms (THIRD_PARTY.md). sdk/firmware/FM-1_015.fwsc is
  M-VAVE's licensed V15 recovery image, Apache-2.0, git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, the same file as
  in m-vave/fm1_open. Third-party parts keep their own licences.
distribution: source-only
install_notes: >-
  No release or installer page. The workflow builds the package and a browser workbench on a Windows runner and keeps them
  as a workflow artifact; building locally needs Windows, PowerShell and JieLi's PI32v2 toolchain 2.5.3, as FM1 Open does.
  M-VAVE's recovery image is in the repository for returning to stock.
brick_risk: true
