  url: https://github.com/doohinkus
source: https://github.com/doohinkus/fm1-tilt-controller
source_status: open
license: unspecified
license_notes: No LICENSE file or license statement in the repository.
distribution: source-only
requires_stock: FM1 Open V14
install_notes: >-
  Serve the folder over HTTPS (localhost works on a computer), open it in MIDIWeb Browser on the phone, set the FM-1's Bluetooth page to on with the role set to device, then use the app's Bluetooth MIDI setup button and Connect MIDI. The FM-1 accepts one Bluetooth MIDI connection at a time. The app writes nothing to the unit.
