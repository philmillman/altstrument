device: m-vave-fm-1
name: FM1 Tilt Controller
kind: tool
summary: >-
  Web app that turns an iPhone or iPad into a Bluetooth MIDI controller for an FM-1 running FM1 Open V14, with a touch keyboard, an XY pad and device tilt mapped to effect controllers.
description: >-
  The phone sends notes and controller messages to the FM-1 and makes no sound itself. A track selector uses MIDI channels 1 to 7 for tracks 1 to 7 and channel 10 for the drum track, a keyboard shifts by octave, and an XY pad sends CC 10 and CC 11 by default. Tilt from the phone's orientation sensors can drive the same controllers, with a calibrated baseline, a dead zone and smoothing, and a panic button sends all-notes-off. It is a small static page of plain JavaScript with tests for the mapping and MIDI code, and it runs on iOS in the MIDIWeb Browser app, which supplies Web MIDI over Bluetooth. The README says it targets FM1 Open V14, M-VAVE's open-source firmware, not the factory firmware. The repository also holds a plan document.
status: active
authors:
