device: m-vave-fm-1
name: FM1 Tonic
summary: >-
  Drum machine for the FM-1 with eight synthesised drum voices, a sequencer of up to 64 steps with accents, fills, chance
  and parameter locks, patterns chained into songs, an 8-track mixer and effects.
description: >-
  Each of the eight tracks has an oscillator, pitch modulation, a noise source with its own filter and envelope,
  distortion, EQ, level and pan. The sequencer has accents, fills at 2x, 4x and 8x, chance per step, 16 patterns per
  preset, chains and a song mode. The mixer has sends, low and high cuts, choke groups, a sidechain, reverb, delay and a
  master compressor, and there are performance, mute and solo pages, copy and paste, undo and redo and 40 project
  slots. Presets use the .mtpreset format. The unit is a MIDI device and an audio input over USB. It is inspired by
  Sonic Charge's Microtonic with its own sound engine, which the README says is not the same engine. The code grew from
  X0X, with a drum synthesis starting point from libpo32 (MIT), a 909 voice and cymbal samples ported from 9W9 and ER-99
  (GPL-3.0), and a break generator used with its author's permission. A browser emulator runs the same code, with a backup
  page for projects. The README says to use it at your own risk and describes a safe mode for an FM-1 that keeps
  crashing, and says that a very dense pattern can push the FM-1 to its limit.
status: active
