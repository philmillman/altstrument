license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and LICENSING.md says GPL-3.0-only. It lists the ER-99 cymbal samples as
  GPL-3.0, the break generator as GPL-3.0-only by its author's permission, and the unbuilt Bluetooth stack parts under
  MPL-2.0, Apache-2.0 and BSD-2-Clause.
homepage: https://luigirossi-music.github.io/fm1-tonic/emu/
based_on: m-vave-fm-1/x0x
distribution: browser-installer
install_notes: >-
  Use the web installer page in Chrome or Edge with the FM-1 on USB, or build with the JieLi toolchain and install the
  package with tools/fm1_install.py. The README says the web installer can put M-VAVE's firmware back. Each release carries one .fwsc
  package, and the repository commits none.
