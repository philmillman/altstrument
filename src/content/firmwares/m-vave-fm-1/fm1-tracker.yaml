device: m-vave-fm-1
name: FM-1 TRACKER
summary: >-
  Felucca 1.4 fork aiming at a tracker workflow: a section-by-track matrix screen, a looping arrangement and a
  vertical row view of the step page. Simulator-ready in its own words; not yet flashed to an FM-1.
description: >-
  The work so far, from the repository's docs/tracker notes, is a looping song arrangement, a MATRIX page that
  draws sections against tracks with slot letters, mutes and repeat counts (GLO opens it first), and a STEP page
  that lists the current pattern as rows of step, note, flags, hex velocity and locks, with the drum lanes as
  columns on drum tracks. The piano roll stays in the tree. Later stages in the roadmap are hex command columns,
  a per-step instrument, a larger pattern pool and longer divisions. The notes list row reordering and a
  hardware test of a three-and-a-half minute song as still to do. Felucca's README is unchanged and the
  fork publishes no package or installer, so it has to be built from source.
status: active
authors:
- name: mene311
  url: https://github.com/mene311
source: https://github.com/mene311/felucca
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca; docs/tracker/README.md says the fork stays GPL-3.0.
distribution: source-only
install_notes: >-
  Build it as Felucca is built (BUILDING.md) and install the resulting package with tools/fm1_install.py; the
  docs/tracker notes describe a flash safety protocol and say the hardware milestone has not been reached.
  Felucca's own installer and its return to official V15 apply to anything installed from this fork.
brick_risk: false
