license: unspecified
license_notes: >-
  The repository has no licence file and the README gives no licence. The embedded screens and clips are captures of M-VAVE's stock V16 firmware running in fm1-emu; the README says it is not affiliated with M-VAVE and shows the firmware screens for teaching purposes. No firmware file is in the repository.
distribution: source-only
install_notes: >-
  Open index.html from the repository in a browser. It writes nothing to a physical FM-1.
