device: m-vave-fm-1
name: FM-1 Walkthrough
kind: tool
summary: >-
  Single-page trainer that teaches four songs' sounds on the FM-1 step by step, with the stock V16 screen, a panel diagram and an audio clip for each setting.
description: >-
  Four songs, Hide, the Twin Peaks theme, Take On Me and Closer, each build one sound from a blank voice, one setting at a time. Every step shows the screen that M-VAVE's stock V16 firmware produced after that change, a diagram of the controls to touch and a clip of the result, and a fifth section covers moving patches into GarageBand through the fm1-emu Audio Unit. The screens and clips were captured by running the stock firmware headless in fm1-emu with the scripts in tools/, whose paths point at the author's machine. The whole site is one index.html with the media embedded, and progress is kept in the browser. A phone version, fm1-trainer-mobile (FM-1 Pocket Trainer, https://github.com/considrew/fm1-trainer-mobile), is a separate repository with the same four songs rebuilt from the same step definitions: lessons are in a JSON file and the screens and clips are separate files, it works offline after the first visit, can be added to a phone's home screen, and uses swipe or a bottom bar to move between steps and a button that keeps the screen awake. Both sites are served on GitHub Pages and loaded when checked on 2026-11-26. It does not install anything on a physical unit.
