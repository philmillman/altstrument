device: m-vave-fm-1
name: FM1-TRAX
summary: >-
  Sega Mega Drive music tracker: emulates the YM2612 FM chip and the SN76489 PSG, with a Deflemask and Furnace style
  pattern editor on the FM-1's keys and knobs, a browser emulator and installer, and a VGM-capable web editor.
description: >-
  The project was called FM1-DRIVE until October 2026. It emulates six four-operator FM channels with the eight
  algorithms, SSG-EG, the global LFO, FM3 extended mode and the DAC on FM6, plus three PSG tone channels and noise.
  The tracker has up to 256 patterns per channel, up to 256 order positions, Genesis effect columns, 128 FM presets,
  32 PSG presets, a 48-sample drum kit and 256 song slots in about 258 KB of flash. The demo song is "Sunset Beach
  Galaxy" by Tobikomi, taken from the GPL-3.0 YM2017 music cart. The project site runs the firmware in the browser and
  installs it over Web MIDI, and its editor imports Mega Drive VGM files, exports VGM and WAV, and reads and writes the
  songs on a connected FM-1. The platform layer comes from the author's FM1-GM, itself from Felucca, X0X and FoMni;
  the chip emulation, tracker, presets, song store and screens are new. The firmware cannot read other firmwares'
  data, and its song store may overwrite data they left in flash.
status: active
