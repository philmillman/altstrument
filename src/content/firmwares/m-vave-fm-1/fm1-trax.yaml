source: https://github.com/jartificer/fm1-trax
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL-3.0 text and the README states GPL-3.0-only. The Terminus font is SIL OFL 1.1. The YM2612 reference
  Nuked-OPN2 (LGPL-2.1) is downloaded for the tests only and is not part of the firmware.
homepage: https://jartificer.github.io/fm1-trax/
distribution: browser-installer
install_notes: >-
  Open the project site in Chrome, Edge or Opera, connect the FM-1 and press Install, or run tools/fm1_install.py on
  fm1trax.fwsc from the release. It installs from stock or from Felucca-based firmware, and M-VAVE's stock package
  brings the unit back. After two failed starts the firmware comes up in a safe mode with USB on, and after four it
  enters the chip's own update mode, from which tools/fm1_rescue.py writes the stock firmware back. OCT- and OCT+ held
  for five seconds enters update mode. The author reports testing on a real FM-1. Back up other firmwares' data first.
brick_risk: true
