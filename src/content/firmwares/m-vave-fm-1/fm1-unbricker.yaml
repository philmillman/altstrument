device: m-vave-fm-1
name: FM-1 Unbricker
kind: tool
summary: >-
  Python scripts that restore a soft-bricked FM-1 from the chip's ROM boot mode over a plain USB cable, and
  through an FM-1 Transporter board when the unit shows no USB device at all.
description: >-
  fm1_unbrick.py automates a community procedure for a unit with a black screen that appears as a WL82 UBOOT
  disk. Its restore command reads the whole 1 MiB flash twice and compares the reads, writes only the firmware
  region from 0x4000 and verifies it byte for byte. That command refuses to write below 0x4000 and has no chip-erase. It takes a
  package you supply, either the official V15 file, checked against its known hash, or a Felucca-family
  package, and refuses the official V16, whose firmware runs past the region it writes. fm1_transporter_recover.py does the same through the FM-1 Transporter and includes a guided wizard
  for flashing the XIAO RP2040 and wiring it. The repository has a guide for each route, mock-device tests and
  a prebuilt Transporter placeholder firmware, and does not contain M-VAVE's firmware. Windows and Linux are
  supported for the USB route, and since version 1.4.0 so is macOS, through a USB bulk-only back end the project includes. Version 1.2.0 adds a softkey command that drops a unit that still runs
  into ROM boot mode over USB-MIDI, and a repair-settings command that returns the settings areas to factory state. Version 1.2.1 accepts the second
  flash chip (ID 0xB36014) found in 2026 units with the logo on the front. Version 1.3.0 adds a full-restore command that rewrites every differing sector of the flash, boot head included, from an official V15 or V16 package or a full backup, for a unit whose replacement bootloader no longer starts; it checks the head and asks you to type FULL. Version 1.4.0 adds the macOS support, and the repository now has a GitHub Pages site with the steps.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/MvaveFM1Unbricker
source_status: open
license: MIT
license_notes: >-
  jl-uboot-tool (MIT, by kagaimiq) is downloaded by the setup command at a pinned commit and is not part of the
  repository.
distribution: source-only
install_notes: >-
  Python 3.9 or newer. Windows needs an administrator PowerShell; Linux needs root and the sg driver; macOS needs root. Run setup,
  then restore with your package. A --dry-run option rehearses against a mock unit, a backup is mandatory
  and the tool asks you to type WRITE. If verification fails, do not power the unit off and run restore again. restore never writes the boot area
  (0x0000 to 0x3FFF); full-restore does, and rewrites the whole flash image of the package you give it.
brick_risk: true
