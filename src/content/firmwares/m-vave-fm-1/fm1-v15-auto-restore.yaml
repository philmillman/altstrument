device: m-vave-fm-1
name: FM1 V15 Auto Restore
kind: tool
summary: >-
  Standalone Seeed XIAO RP2040 recovery box that puts the FM-1's ROM boot mode into effect, backs up the flash, writes
  M-VAVE's V15 over the application area and starts it, with no computer involved.
description: >-
  The RP2040 is wired to the FM-1's USB D+, D- and ground lines and powered separately. After power-up it sends the
  key that makes the chip enter its ROM download mode, uploads the WL82 loader to RAM, saves a twice-read 1 MiB backup in its own
  flash, writes only the differing 4 KiB sectors between 0x4000 and 0x92FFF, verifies the whole flash and starts V15. A
  status LED shows the stages. It makes one attempt per power-up, leaves the boot head and the data above 0x93000 untouched
  and refuses an unexpected chip. It restores V15 on a working unit too. The repository holds the C source, the vendored PIO USB
  library, tests and a prebuilt UF2 that embeds the V15 package and the loader. The README says version 0.4 was tested on
  one XIAO RP2040 and one FM-1.
status: active
authors:
- name: SikkenWorks
  url: https://github.com/SikkenWorks
source: https://github.com/SikkenWorks/FM1-RP2024-Auto-Restore
source_status: open
license: MIT
license_notes: >-
  The MIT LICENSE covers the installer code and says it does not relicense the M-VAVE firmware. The repository's
  assets/FM-1.fwsc is M-VAVE's V15 package, git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, the file M-VAVE publishes under
  Apache-2.0 in m-vave/fm1_open, and the prebuilt UF2 embeds it. The WL82 loader comes from jl-uboot-tool and the USB host
  code from FM-1 Transporter, both MIT.
distribution: download
install_notes: >-
  Needs a Seeed XIAO RP2040 with 2 MB flash and a USB cable cut open to expose D+, D- and ground, with the red 5 V wire left
  unconnected. Copy the UF2 to the board in BOOT mode, power the board, connect it to the switched-off FM-1, then switch the FM-1
  on without holding keys. A solid green LED means the flash was verified and V15 started. This returns the unit to V15 even if it
  works, and custom-firmware settings outside the application area stay.
brick_risk: true
tags: [flasher, loader, utility, backup]
versions:
- version: '0.4'
  date: 2026-11-05
  url: https://github.com/SikkenWorks/FM1-RP2024-Auto-Restore/releases/tag/V0.4
  notes: Fixes a sparse UF2 packaging fault that could corrupt the embedded V15 assets when the file was loaded.
