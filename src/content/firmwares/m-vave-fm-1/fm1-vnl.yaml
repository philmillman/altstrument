device: m-vave-fm-1
name: VNL-1
summary: >-
  Generative lo-fi hip hop radio: plans whole songs of two to three and a half minutes, then a pause and a new
  song, on placeholder voices; built on fm1-base.
description: >-
  Each song has a chord loop, groove, bass, melody and a map of layers entering and leaving in four and
  eight-bar blocks, and the next song is meant to differ in key, tempo and texture. Controls are minimal: PLAY
  stops and starts, K1 to K4 set key, tempo, motion and mood, each taking effect at the next four-bar boundary.
  It has no MIDI or Bluetooth. The author's status note says the voices are placeholders, the firmware passes in the
  host simulator and the browser emulator, and it has not yet been installed on a real FM-1. The repository
  includes the design spec and the lo-fi music research behind the rules.
status: active
authors:
