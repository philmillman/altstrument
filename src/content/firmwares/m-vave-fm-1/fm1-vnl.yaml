  url: https://github.com/pianomansam
source: https://github.com/pianomansam/fm1-vnl
source_status: open
license: MPL-2.0
license_notes: >-
  Inherited from fm1-base, which is a git submodule; the app's own files may use any licence and carry the repository's
  MPL-2.0. Building needs JieLi's AC79 SDK, which is not in the repository.
homepage: https://github.com/pianomansam/fm1-vnl
distribution: source-only
install_notes: >-
  No prebuilt package is published. Clone with submodules, then ./build.sh (JieLi toolchain in Docker, AC79 SDK
  and a Python venv with Pillow, mido and python-rtmidi) writes app/build/vnl.fwsc, installed with
  base/tools/fm1_install.py. Holding OCT- and OCT+ for 5 s enters update mode, and base/bsp/tools/fm1_rescue.sh
  restores stock firmware on a unit that shows up as 4C4A:8057 on USB. The README says installing is at your own
  risk.
brick_risk: false
