source_status: open
license: GPL-3.0-only
license_notes: >-
  The repository has no top-level licence file or licence statement. The firmware folder carries FM1 Open's LICENSE.md (GPL-3.0-only with M-VAVE's SDK linking exception) and THIRD_PARTY.md, and the README says the pinned SDK's licence and binary SDK terms apply to the firmware. That is the basis for the licence given here, which covers the firmware only; the Python companion and tools state no licence.
homepage: https://github.com/Eaglegor/fm1-vocal-trainer
based_on: m-vave-fm-1/fm1-open
distribution: download
requires_stock: Any FM-1; installed with M-Flasher 0.12.1
install_notes: >-
  Back up the whole flash with M-Flasher 0.12.1, decline its optional bootloader prompt, then install firmware/vocal-trainer.fwsc after checking that the proposed write range starts at 0x04000 or above and ends before 0x73000. The README gives a command to compare the first 0x4000 bytes of the backups before and after, and says to roll back from your own backup while keeping the unit's bootloader. It says first boot, LCD, sound, later updates and recovery are untested on a physical unit. The Windows companion needs Python 3.13 and a microphone or ASIO interface.
brick_risk: false
