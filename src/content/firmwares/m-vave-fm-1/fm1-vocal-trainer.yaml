device: m-vave-fm-1
name: FM1 Vocal Trainer
summary: >-
  Vocal practice firmware for the FM-1 with scale, arpeggio, interval and melody exercises that play reference notes and score sung pitch, fed by a Windows microphone companion over USB MIDI. Early; first hardware test pending.
description: >-
  The FM-1 runs the practice session. K1 picks freestyle, major scale, minor scale, arpeggio, melodic or harmonic intervals, or a seven-note melody, K2 sets the root, K3 the tempo, and PLAY sounds the root and fifth before the exercise starts. A Windows companion app listens to one microphone or audio interface, detects the pitch and sends it to the FM-1 over USB MIDI, raised an octave for the display. The FM-1 shows the target and the sung note and finishes with a score, the share of target-note time within 50 cents. A script swaps the embedded melody for another monophonic MIDI track, and command-line sessions can run from the PC instead. The firmware is a small patch against M-VAVE's FM1 Open V14, and the README documents the USB MIDI messages so another controller could replace the companion. The author calls it an attempt at vibe coding, and the README says the build has passed static SDK checks only and has not been run on an FM-1.
status: active
