  url: https://github.com/ograndebe
source: https://github.com/ograndebe/fm1wheel
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  LICENSING.md states GPL-3.0-or-later for the combined firmware; the LICENSE file is the GPL v3 text. The setBfree-derived
  DSP is GPL-2.0-or-later, fm1-base and felucca-bsp are MPL-2.0, and JieLi SDK files are Apache-2.0 and not in the tree.
  The site's firmware folder also carries the MIT-licensed m-bootloader 1.2 package.
homepage: https://ograndebe.github.io/fm1wheel/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, with a separate installer page for the SMK-37 Pro, or
  make install from source. The SMK-37 Pro has a protected factory calibration, so make a full flash backup before the
  first install. If an install is interrupted, the unit stays in update mode and the installer finishes the write. The
  README advises keeping M-VAVE's firmware and the rescue tools at hand.
brick_risk: false
