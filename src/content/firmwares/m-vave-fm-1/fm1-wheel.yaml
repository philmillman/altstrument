device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: fm1-wheel
summary: >-
  Tonewheel organ for the FM-1 and SMK-37 Pro, ported from setBfree: 91 shared wheels, drawbars, percussion, scanner
  vibrato and chorus, preamp, reverb and a Leslie rotor, with a drawbar-key mode on the 27 keys.
description: >-
  The tone generator is a shared wheel set rather than one oscillator per voice, with the contact matrix, crosstalk,
  scanner V1 to V3 and C1 to C3, tube preamp, reverb and rotary speaker taken from setBfree's models and rewritten for the
  unit. The 27 keys play the upper manual, and an external MIDI controller can play upper, lower and pedal on channels 1 to
  3. Pressing GLO turns the keys into drawbar controls while MIDI keeps sounding. The same code runs on the device,
  in a host simulator and in a browser emulator, and the site has English and Portuguese manuals and a web installer
  that can also put M-VAVE's own firmware back from a file you download yourself. The SMK-37 Pro build adds pad,
  fader and 37-key support. The README says neither build has been flashed to hardware yet, and that the code was
  developed with an AI coding assistant under human review. It builds on fm1-base and felucca-bsp and is a separate
  project from OrganVave-1.
status: active
authors:
