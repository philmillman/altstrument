device: m-vave-fm-1
name: fm1-zero
kind: tool
summary: Python app for the M5Stack CardputerZero that browses The Firmware Hub, downloads packages from their makers, backs up the FM-1's flash and installs or restores over one USB cable, with no computer needed.
description: >-
  fm1-zero is a Python program for the CardputerZero, a small Linux computer built on a Raspberry Pi CM0, and not
  firmware for the FM-1. It lists The Firmware Hub's firmwares as a list or a grid with search, sorting and
  favourites, downloads a package from its maker's GitHub release and checks its size and SHA-256, and also accepts
  .fwsc files copied on by hand. Through the FM-1's flash download mode it reads the whole 1 MiB flash twice and
  compares the reads for a backup, installs a package or restores a backup, reads each sector back, shows sector
  progress on both screens and retries an interrupted install up to three times. It reports which bootloader the unit
  has and whether it would be recoverable, and holds Enter for two seconds to confirm a write.

  The README says it was run on one real FM-1, where backup matched M-Flasher's byte for byte and a real install
  worked. SMK-37 keyboards, the newer flash chip, the recovery paths and a partly finished install are untested.
  The CardputerZero itself had not reached general sale when this entry was written; M5Stack's documentation lists it
  with a Kickstarter edition. The bundled flash loader is fm1buddy's build of m-bootloader's loader, under the MIT
  licence of its author.
status: active
authors:
