    url: https://github.com/Clinteastman
source: https://github.com/Clinteastman/fm1-zero
source_status: open
license: GPL-3.0-only
license_notes: >-
  Read from the README, which names GPL-3.0-only, and the LICENSE file. fm1zero/data/mflr-loader.bin, a small flash
  loader built from m-bootloader, carries its own MIT licence file.
distribution: source-only
requires_stock: Any FM-1 firmware that answers the download-mode message, or an m-bootloader unit held at REC on power-up
install_notes: >-
  Copy the folder to a CardputerZero and run setup-on-zero.sh, which installs Pillow, numpy, evdev and pyusb and a udev
  rule. A .deb can be built on the device with packaging/build-deb.sh. The README says the tool never writes the bootloader and
  refuses writes below 0x4000 and from 0xFF000 up, which hold the boot area and the chip key and MAC. The FM-1's
  mask-ROM download mode cannot be overwritten, and the README advises installing M-Flasher first as the recovery
  tool and making a backup before the first install. On a stock bootloader, a failed install can need a USB_KEY
  dongle, so the app stops on a "No easy way back" screen before it asks.
brick_risk: false
tags: [flasher, backup, librarian, usb-midi, cardputer]
