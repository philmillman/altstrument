device: m-vave-fm-1
name: FM1amp
kind: tool
summary: >-
  Windows app in the style of Winamp that keeps several FM-1 firmwares on one unit and switches between them, saving and restoring each one's projects and settings as a snapshot.
description: >-
  A playlist lists firmwares and saved states, and Flash writes the chosen one through M-Flasher, which ships inside the app and is checked by hash. Before every write the app saves a full snapshot of what the FM-1 holds, firmware together with its projects and settings, and the first one is kept as Original with the date as the way back to the stock firmware. Restoring a snapshot passes M-Flasher's keep-bootloader option, and firmware packages go to the app area only. It downloads firmwares from The Firmware Hub catalog or from other catalog.json files and author repositories on GitHub, refuses any download that has no sha256, and offers updates for the firmwares in the library. A badge shows whether the unit is ready, needs REC held at power-on to enter download mode, or is not found. There are four skins and English and Russian interfaces. The README warns that a snapshot is the unit's whole 1 MiB flash with its unit id and calibration, and says not to share it.
status: active
authors:
