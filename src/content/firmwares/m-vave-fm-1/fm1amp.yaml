source: https://github.com/0n4a1n/fm1amp
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text. THIRD_PARTY.md lists the bundled M-Flasher 0.12.1 (MIT), Python, pywebview and other libraries under their own licences. No firmware is bundled.
distribution: download
requires_stock: Any FM-1 firmware
install_notes: >-
  Unzip FM1amp-0.2.0-windows.zip from the release and run FM1amp.exe on Windows 10 or 11 64-bit; the app asks for administrator rights and the unsigned exe may trigger SmartScreen, so the README tells you to compare the zip with the published sha256 file. A firmware that cannot enter download mode itself needs REC held while the unit is switched on. The README says flashing is at the user's own risk and describes the stock return through the Original snapshot; M-Flasher also keeps its own backups.
brick_risk: false
