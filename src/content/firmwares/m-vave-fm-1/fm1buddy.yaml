device: m-vave-fm-1
name: fm1buddy
kind: tool
summary: >-
  Firmware for a Freenove ESP32-S3 2.8-inch touch screen board that installs FM-1 firmware packages from its SD
  card or from mutant.cloud, and connects USB and Bluetooth MIDI controllers to the FM-1 and SMK-37 without a
  computer.
description: >-
  The board lists the .fwsc packages on its SD card and in the mutant.cloud catalogue (the FM-1 Firmware Hub's catalogue
  before 0.1.19), downloads them over Wi-Fi after checking size and SHA-256, and installs them on the FM-1 through a USB
  hub. The README says it also switches the firmware of the SMK-37 Pro, Elite and MKE-P37 keyboards, which use the
  FM-1's chip, and can put back M-VAVE's stock firmware. Its USB-C port
  acts as a USB host for up to four MIDI devices, which all hear each other, and Bluetooth MIDI devices can
  join; Bluetooth is off while Wi-Fi is on. Version 0.1.0 rebuilt the project around this board and dropped the
  earlier Feather RP2040, OLED and CYD variants. The repository also holds a printable case and a browser
  installer page. Later releases add a clock, arpeggiator and chords, a mapping editor, backups of SLOOP projects
  and samples and recording of the FM-1's USB audio. No FM-1 firmware is bundled.
status: active
authors:
- name: David Konsumer (konsumer)
  url: https://github.com/konsumer
source: https://github.com/konsumer/fm1buddy
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md names GPL-3.0-only; the FM-1 update code is a port of Leo Kuroshita's from foma. Third-party
  libraries fetched at build time (LVGL, TFT_eSPI, Arduino-ESP32, ArduinoJson) keep their own licenses.
homepage: https://konsumer.js.org/fm1buddy/
distribution: download
install_notes: >-
  Flash the board from the installer page in Chrome or Edge, or write the release .bin with esptool. The board
  then needs a USB-C OTG adapter that passes charging and data, a small hub and a charger. The installer page
  warns that installing firmware on the FM-1 is at your own risk, and that holding OCT- while switching on
  starts its USB rescue mode.
brick_risk: true
tags: [flasher, usb-midi, midi, utility]
