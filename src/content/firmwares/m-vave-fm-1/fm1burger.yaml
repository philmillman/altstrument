    url: https://github.com/perawoga2-coder
source: https://github.com/perawoga2-coder/fm1burger
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README gives no licence statement.
distribution: download
install_notes: >-
  Download the debug APK from the latest release (burgerstudio-lab-v3.20-debug.apk) and install it on an Android phone; a new version installs over the old one and keeps your work. To use it with an FM-1, connect the FM-1 to the phone over USB. Nothing is written to the FM-1.
brick_risk: false
tags: [groovebox, sequencer, drums, synth-engine, midi, usb-midi, android]
