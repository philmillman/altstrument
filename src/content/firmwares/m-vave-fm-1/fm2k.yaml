device: m-vave-fm-1
name: FM2K
summary: >-
  Early prototype song maker after Music 2000 on the PlayStation: short riffs placed on a timeline of up to 128 bars across three synth tracks and a drum track. Runs in the browser simulator only; not yet tried on an FM-1.
description: >-
  The arrangement comes first, as in a DAW: each track has a pool of up to 32 riffs of 1 to 64 steps, edited in a
  small piano roll or recorded from the keys, and the arrangement screen shows the whole song with its notes. Working
  now are playback with a loop and metronome, riff repeats, eight project slots and an autosave, and a basic synth
  with seven presets plus three drum kits. Planned items include real sound engines from the Felucca family and
  mixer and sound screens. The README says it has no release, has not been built or tried on an FM-1, and should
  not be installed on one yet. It starts from Dinghy and the Felucca platform layer, and the repository is still named
  FM2000.
