license: GPL-3.0-only
distribution: source-only
install_notes: >-
  Build with ./build.sh, then use the local installer page described in the README. Keep V15 (FM-1.fwsc)
  from M-VAVE to roll back.
brick_risk: false
tags: [sequencer, synth-engine, performance]
