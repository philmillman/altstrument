device: m-vave-fm-1
name: FM80S
summary: >-
  Synthwave synth-looper by Floydus: play a loop on the keys, layer another instrument over it, or step-program
  it, then chain loops into a song. Version 0.1 is SLOOP 2.5 under a new name, with a browser FM-1 and
  8 tracks planned.
description: >-
  Documentation is in French. The roadmap lists a virtual FM-1 in the browser, then eight tracks, then
  the synthwave theme and sounds. The fm1-editor.com directory lists it on its watch list rather than
  as installable.
status: active
