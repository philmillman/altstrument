versions:
- version: 0.6.4
  date: 2026-11-20
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.6.4
  notes: Refines the screen reader. A held section button reads that page's knob names without values, REC held plus a knob says the value, an unassigned knob says NOT ASSIGNED, the FM-1's own voice announces the firmware version at power-on, and patch cables are spoken as linked to their input.
- version: 0.6.3
  date: 2026-11-19
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.6.3
  notes: The screen reader says the octave again for OCT- and OCT+, and continuous knobs glide to a new value in about 12 ms instead of stepping, in the sound and on the screen.
- version: 0.6.2
  date: 2026-11-19
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.6.2
  notes: Adds an OUTPUT choice to the screen reader's voice (MAIN, HEADPHONES or USB audio only), keeps it in the settings and shortens what the reader says.
- version: 0.6.1
  date: 2026-11-18
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.6.1
  notes: Small fix to the screen reader, which now says a centred mix as "50 50"; the reader's audit finds no errors.
- version: '0.6'
  date: 2026-11-18
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.6
  notes: Adds screen reader support, either with FM-1 Screen Reader on a computer or with the FM-1's own voice, switched on by holding PLAY for two seconds. It says the program, the page, the touched knob and the cables.
- version: 0.5.2
  date: 2026-11-18
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.5.2
  notes: Moves the ATTACK, DECAY and RELEASE knob positions, with saved programs keeping their times, shows each knob's MIDI CC while REC is held, and makes CC 7 the track's mixer LEVEL.
- version: 0.5.1
  date: 2026-11-16
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.5.1
  notes: Moves KEYBOARD to a second page of SELECT, adds a GATE patch source that is high while a note is held, renames PRESS to AFTERTC, and gives the external sources' cables one colour.
- version: '0.5'
  date: 2026-11-16
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.5
  notes: Recalibrates every knob, the ladder filter and the envelopes against the author's reference instrument, rebuilds the 90 factory programs from INIT, reorganises the panel buttons and removes the CLOCK output that 0.3 added as a patch source.
- version: 0.4.1
  date: 2026-11-14
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.4.1
  notes: Adds a GLOBAL CLOCK source setting (internal, USB or TRS) so a clock sent on both ports is no longer doubled.
- version: '0.4'
  date: 2026-11-14
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.4
  notes: Adds a white noise generator and patchbay output, and the sample and hold samples the noise when its input has no cable.
- version: 0.3.1
  date: 2026-11-14
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.3.1
  notes: DUMMY becomes the last choice in each input's list, MIDI channel 1 is the default, and SEQ shows the patchbay and the inputs.
- version: '0.3'
  date: 2026-11-13
  url: https://github.com/wootr0p/fmav1/releases/tag/v0.3
  notes: Takes the name FMav-1 and its own identity, and adds the MIDI clock as a patch source and REC to switch effects.
