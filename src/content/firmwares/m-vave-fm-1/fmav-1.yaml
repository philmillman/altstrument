device: m-vave-fm-1
name: FMav-1
summary: >-
  Semi-modular monophonic synth with a patchbay of 12 inputs and their normals, a self-oscillating ladder filter, wave folder, sample and
  hold, four tracks, 90 programs and note gate and velocity as patch sources.
description: >-
  Each track has one oscillator with pulse width modulation, a four-pole ladder filter that self-oscillates, an LFO, an ADSR, a VCA, a wave
  folder, a sample and hold on white noise, a two-channel mixer, an attenuator and a noise source, wired through a patchbay where
  an input can take any source and a dummy plug breaks its normal. The MIDI clock from USB, TRS or the internal tempo can sync the LFO,
  drive the arpeggiator and a tempo-synced delay. Velocity, mod wheel, aftertouch and a note gate are patch sources, and the 90 factory programs are built from an INIT patch modelled on a reference instrument's panel and recordings. Chorus, delay and a plate reverb are shared
  sends. There is no sequencer; the four tracks answer on MIDI channels, with a CC for every parameter, the cables included, and NRPN.
  It is built on OberVave 3.3.2, with the ladder filter and the knob decoder following FMini-1. The README says it comes with no warranty
  and the full guide is in Italian. Version 0.6 adds screen reader support, on a computer or in the FM-1's own voice.
status: active
authors:
- name: wootr0p
  url: https://github.com/wootr0p
source: https://github.com/wootr0p/fmav1
source_status: open
license: GPL-3.0-only
license_notes: >-
  README and LICENSING.md give GPL-3.0-only, and the repository's LICENSE is the GPL v3 text. The platform is Leo Kuroshita's Felucca with
  SLOOP's changes, the base is zvenson's OberVave and Dinghy, and the ladder model and encoder decoder follow Ruppert's FMini-1 (GPL-3.0). The
  Terminus font is SIL OFL 1.1.
based_on: m-vave-fm-1/obervave
distribution: browser-installer
install_notes: >-
  Install from the FM-1 Firmware Hub in Chrome or Edge, or write the release's fmav1-0.6.3.fwsc over USB with tools/fm1_install.py. The
  README says it installs over most Felucca, SLOOP and OberVave based firmwares and keeps their stored programs, and that an FM-1 which
  does not start comes back by holding OCT- at power-on (update mode) and running the installer again. DISCLAIMER.md says installing is
  at your own risk.
brick_risk: false
tags: [synth-engine, synth, oscillator, fx, chorus, delay, reverb, midi, usb-midi, fork]
