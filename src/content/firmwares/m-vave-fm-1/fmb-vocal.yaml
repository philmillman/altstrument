device: m-vave-fm-1
name: FMB Vocal
summary: >-
  Physically modelled singing voice for the FM-1, a variation of FM-1 Chimera Vocal with a Bestiary that adds a dubstep robot, a babbling squid and a cat, a beatbox sequencer and a melody page. Pre-release.
description: >-
  FMB stands for Flying Mythical Beast. The sound comes from a simulated airway of lungs, vocal folds, throat, mouth and nose, ported from Jameson Hodge's CHIMERA, with no samples. In WORDS mode each key sings the next syllable of a line, VOWEL and TONGUE modes let the knobs move the mouth, and ALGORITHM picks a male, female, child or blended body. ENV sings a word slot on one of six tunes, SEQ is a beatbox with ten mouth-made drum sounds and a 16-step editor, and a second SEQ press opens a 32-step melody page that the voice or a creature plays. The Bestiary on LFO holds the robot, Squidlad, a cat, a songbird, a seal, an alligator and an elephant, each with its own calls. A web Studio prepares words with the CMU Pronouncing Dictionary and sends them over USB, and words can also be typed on the unit. It uses both processor cores and accepts both FM-1 flash chips. The package has its own identity, FM-1_043, so it is kept apart from FM-1 Chimera Vocal. The project uses CHIMERA's name and head with its author's permission.
