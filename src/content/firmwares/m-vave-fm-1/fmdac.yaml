device: m-vave-fm-1
name: Fmdac
summary: >-
  Drum firmware built on Dinghy: four kit tracks that each play a built-in drum machine or send MIDI using chart maps for hardware and apps, a step grid with song chain, a take recorder and DAC-flavoured headphone effects, with a browser installer.
description: >-
  Each of the four tracks is a kit of eight lanes. A kit plays one of seven drum sets (808, 909, CR-78, SDS and original synthesised PCM sets for DMX, 707 and Linn styles, with no sample ROMs) or is a MIDI kit that stays silent locally and sends notes on its own channel using maps for drum machines and a long list of drum apps. The keys follow Skiff's General MIDI drum layout, SEQ is a step grid followed by a chain of four patterns, and REC while stopped quantises a take of one, two or four bars. The FX page runs the headphone mix through converter models named after a Prophet VS, DX7, SP-1200, Emulator II and S950. Computer audio streamed over USB is mixed into the headphones and resampled from 48 kHz when needed. The installer page also offers to reinstall Skiff, SLOOP or M-VAVE's own FM-1 package, each downloaded from its publisher after a size and SHA-256 check; none of them is stored in the repository.
