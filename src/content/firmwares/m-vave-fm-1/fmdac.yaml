license_notes: >-
  fw/LICENSING.md states GPL-3.0-only for the tree, which is Dinghy at commit 22acb91 renamed and extended. The update protocol in docs/vendor is adapted from Skiff and Felucca (GPL-3.0-only).
homepage: https://chinotto1.github.io/Fmdac/
distribution: browser-installer
install_notes: >-
  Open the page in Chrome or Edge on a computer, connect the FM-1 by USB data cable and install; the page checks the package identity FM-1_973, its size and its SHA-256 first. Its other tab restores Skiff 1.3.2, SLOOP 2.7.1 or M-VAVE's FM-1.fwsc, downloaded from their publishers (the M-VAVE file from M-VAVE's own download host). Installing replaces the firmware, and the README warns the FM-1 can be left unable to start until it is recovered. An interrupted write leaves the FM-1 in update mode.
