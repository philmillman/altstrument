license: GPL-3.0-only
license_notes: >-
  Original FMER firmware, Companion and default instruments are GPL-3.0-only (LICENSING.md). Felucca code is
  GPL-3.0-only, MSFA is Apache-2.0, and the V15 voice catalog keeps its Apache-2.0 terms. Third-party fonts,
  samples, vendor SDKs and toolchains are not relicensed.
homepage: https://github.com/Nacsez/FMER/releases
distribution: download
requires_stock: V15, or V16 through Companion's separate guided migration
install_notes: >-
  Extract the Companion ZIP from the release on a Windows 10/11 x64 PC, run FMER Companion.exe, connect one
  FM-1 over USB and use its Firmware page, which checks the memory layout and rejects unknown ones. Export a
  backup first; installing a profile replaces the sounds in that bank. For an original V16 unit the 736 notes describe a
  guided workflow that makes two matching full-ROM backups and archives V16 projects without converting them; the
  project says a direct hardware write from V16 to the final 736 image was not exercised. The .fwsc is also published on its own
  for other compatible installers, whose handling the project does not qualify. The app is unsigned. Saves from
  735 do not downgrade to 733 or 734 without a migration.
brick_risk: true
