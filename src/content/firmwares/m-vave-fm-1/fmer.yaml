device: m-vave-fm-1
name: FMER
summary: >-
  Firmware with six-operator FM and virtual analog engines, six-voice or four-track playing, two editable
  64-instrument banks, effects, an arpeggiator and songs, installed through a Windows companion app.
description: >-
  Uses Felucca for board support and the MSFA core for FM, with the SLOOP updater as the install path. It plays
  either as one six-voice synth, a one-voice glide synth, or as four mono parts, and holds 16 projects of 16
  patterns each, with four song lanes. Effects are a reorderable chain of filter, reverb, delay, chorus, phaser
  and drive, shared across tracks. The 224 original instruments are grouped into five profiles that can be put
  into either bank. From build 736 two FMER units can exchange MIDI notes and clock over Bluetooth, and the unit keeps
  its working state in a startup checkpoint. FMER Companion is a portable Windows 10/11 x64 program that opens in the browser. It
  organises instruments, projects and backups, imports and exports DX7 data, and runs a guided firmware
  installer; it also carries 128 voices taken from M-VAVE's Apache-2.0 V15 data. The project calls its builds
  pre-1.0 test releases and does not take outside pull requests without permission.
status: active
