device: m-vave-fm-1
name: FMini-1
summary: >-
  Minimoog emulation for the FM-1, monophonic or with 12 voices: three oscillators, 24 dB/octave ladder filter,
  two contours, 200 factory presets, an arpeggiator, a sequencer and MIDI.
description: >-
  Replaces the FM-1's engines with a model of the Minimoog, organised in pages for oscillators, mixer, filter,
  filter and amplifier envelopes and effects, with preset, arpeggiator and sequencer pop-ups. It plays monophonically
  like the original or with up to 12 voices, and has 200 factory presets in twenty groups of ten, any of which you can
  overwrite. The project site also offers a browser emulator and a patch editor. It is a fork of
  Felucca and keeps Felucca's platform layer, USB, update loader and storage. The author says it was developed
  with the assistance of Claude.
status: active
authors:
- name: Guilherme Ruppert (ruppert)
  url: https://github.com/ruppert
source: https://github.com/ruppert/fmini-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, inherited from Felucca. The ANALOG, LOFI, TRIO, WHEEL and NOISE engines
  in the firmware/engines submodule are MIT; ported DSP, fonts and CC0 samples keep their own licences
  (LICENSES/).
homepage: https://ruppert.github.io/fmini-1/
distribution: browser-installer
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the
  releases page. The installer can return the FM-1 to stock if you supply M-VAVE's unmodified V15 file, which you
  download from M-VAVE yourself.
brick_risk: false
tags: [synth-engine, sequencer, midi, performance]
