device: m-vave-fm-1
name: FMLarynx
summary: >-
  Formant synth firmware with a 16-step 303-style sequencer: a saw wave through a three-formant vowel filter, a
  resonant low-pass, drive and a ping-pong delay, with a screen that draws a throat opening.
description: >-
  A port of the FormantSynth VST3 plugin, built on Dinghy. A Tongue and Jaw plane blends between the vowels i, e, a,
  o and u, Voice and Size move the formants from adult male to child or giant, and an envelope with accent opens the
  cutoff and formant size. The sequencer has vowel, accent and slide per step, a randomizer with root and scale, and
  16 stored patterns; it follows MIDI clock, and notes arrive over USB MIDI. The FM-1 also appears as a stereo USB
  audio input. It stores patterns and settings in the settings sector that Felucca, SLOOP and Dinghy use, so it
  starts from defaults after one of them has run and the reverse. Its README credits MouthTowel for the formant
  filter design.
