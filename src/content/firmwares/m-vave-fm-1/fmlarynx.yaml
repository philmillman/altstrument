requires_stock: V15
install_notes: >-
  Install from the FM-1 Firmware Hub in Chrome or Edge, or flash the .fwsc from the release with tools/fm1_install.py.
  The release notes report installs from official V15, Dinghy and Unholy Union. Hold OCT- while switching on for USB
  rescue mode, which the firmware also enters after two crashes at boot.
