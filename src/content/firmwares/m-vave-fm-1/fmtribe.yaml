device: m-vave-fm-1
name: FMtribe
summary: >-
  Clean-room recreation of a Korg monotribe for the FM-1: one oscillator, a two-pole MS-style filter, an LFO, three drums and an eight-step sequencer with the panel's step row on the keys.
description: >-
  The sound is synthesised from published filter papers and fitted to public recordings of real units, with no Korg code or data and no samples. The oscillator has saw, triangle and square, noise and a self-oscillating filter, and the amplifier has the monotribe's three fixed envelopes. The LFO moves pitch, filter or both. Bass drum, snare and hi-hat have decay controls. The sequencer runs eight steps for each part, sixteen for the synth, with active steps, gate time, swing, motion volume, drum rolls and recording, and it follows MIDI clock. MIDI uses the monotribe's channel and controller map over USB, Bluetooth and TRS. It is built on fm1-base. The README calls it an early test build, and the release notes call each alpha untested on hardware; the author asks for help measuring a real unit.
status: active
authors:
- name: GuinanNo1
  url: https://github.com/GuinanNo1
source: https://github.com/GuinanNo1/FMtribe
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSING.md states MPL-2.0 file by file. It builds on fm1-base and felucca-bsp (MPL-2.0). Fonts are SIL OFL 1.1 and the JieLi SDK files that go into each package are Apache-2.0 and are not committed. The project says it is clean-room and does not use code from GPL-3.0 monotribe emulations.
homepage: https://guinanno1.github.io/FMtribe/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge, or tools/fm1_install.py with the .fwsc from a release. The release notes describe a way back to M-VAVE's firmware in the installer and say to install at your own risk.
brick_risk: false
