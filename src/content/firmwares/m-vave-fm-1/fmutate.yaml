versions:
- version: 0.3.1
  date: 2026-11-24
  url: https://github.com/GenericJam/fmutate/releases/tag/v0.3.1
  notes: Installs over 0.2.x and 0.3.0 and keeps layouts, sounds and saves. Adds MIDI out, so XY pads, motion tiles, knobs, sliders, pads and keys can drive other apps on the phone or a computer over USB as a MIDI controller, with a Synth, Out or Both choice in each control's binding. Sends note offs and all notes off when the instrument is left, and a native firmware from the library gets pitch bend and per-note level when its signed release declares them. Signed with the same release key.
- version: 0.3.0
  date: 2026-11-23
  url: https://github.com/GenericJam/fmutate/releases/tag/v0.3.0
  notes: Installs over 0.2.x and keeps layouts and saves. Adds named layouts that can be saved, loaded, exported and imported as JSON, with undo and redo for layout changes, named sounds that save a synth's whole memory and load it back later, and a balance knob for the synth's stereo output in FMutate's mixer. The mixer's crossfade commands no longer race the audio thread. Signed with the same release key as 0.2.0.
- version: 0.2.1
  date: 2026-11-22
  url: https://github.com/GenericJam/fmutate/releases/tag/v0.2.1
  notes: Installs over 0.2.0 and keeps layouts and saves. With OberVave a strike at the top of a key is now clearly quieter than one at the bottom (about 20 dB at the softest default), held and arpeggiated notes keep their key's level, the Opling menu button has larger eyes, quitting saves a firmware's settings more reliably and bundled libraries get security updates. Signed with the same release key as 0.2.0.
- version: master @ 98e6d4c
  date: 2026-11-21
  url: https://github.com/GenericJam/fmutate/commit/98e6d4cb5699c2c807f1dfca5374388394cad34e
  notes: Commit on the master branch after v0.2.0 and before 0.2.1. The newest commits add an iOS build 6 with a velocity fix and poly-aftertouch fixes for OberVave, and a CI tests workflow for Elixir, Android and Swift.
- version: 0.2.0
  date: 2026-11-20
  url: https://github.com/GenericJam/fmutate/releases/tag/v0.2.0
  notes: Signed with a new release key, so 0.1.0 must be uninstalled first, which removes its saved data. Adds native builds of Hub firmwares (130 at release, from FMutate cartridges), a page for each firmware with its README, MIDI learn and automap profiles for the MPK mini mk2 and mk3, velocity from the strike position and per-note level on by default, a quit action on the notification and pairing with sibling apps by QR code.
- version: 0.1.0
  date: 2026-11-13
  url: https://github.com/GenericJam/fmutate/releases/tag/v0.1.0
  notes: First sideloadable release, a signed APK for Android 9 and later with OberVave 3.3.2 and Shine On 3.0.1 built in. It adds motion controls (tilt, twist, shake and proximity), strike-position velocity, a long-release sustain, MIDI clock and playback with the screen off.
