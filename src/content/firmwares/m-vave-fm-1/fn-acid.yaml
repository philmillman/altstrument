install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, or build with ./build.sh and install with
  tools/fm1_install.py. The package uses a test identity, FM-1_956. The installer's return to stock asks you to
  pick M-VAVE's own V15 file, which it checks by hash. A Chinese test guide is in TEST-ZH.md.
