device: m-vave-fm-1
name: FN ACID
summary: >-
  Test-build firmware where each track is a function drawn on one pair of axes and played as drawn: a 303-style
  16-step line, a formula mode, dotted-eighth ping-pong delay, a small room and curve-editing punch-in effects.
description: >-
  The author's own words call it a test build of Function Acid, after a post on turning mathematics into acid
  music, ported from a browser prototype. The ACID track plays sixteen steps written 303-style with decay, or a
  formula, through a four-pole ladder filter by default (the two-pole filter stays as an option). Eight patterns
  each carry a line and its sound, and holding FX with a key gives punch-in effects, some of which operate on the
  curve itself, such as shifting it, mirroring it or halving its rate. Turning the cutoff, resonance, envelope or
  decay knobs while recording writes four bars of motion that plays back smoothly. Later test builds add a 909 drum machine on track 3 and USB-MIDI clock and note output. Versions step by 0.01 and the
  FM-1 shows the number at power-on. Built on Dinghy, SLOOP and Felucca, using a copy of SLOOP's web installer.
