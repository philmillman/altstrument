device: m-vave-fm-1
name: FNTSMG-1
summary: >-
  Eight-track groovebox on a Felucca fork with purpose-written engines and a SAMPLE engine on every track, a
  32-step sequencer with locks, probability and ratchets, a sound saved per pattern, and eight-channel USB audio. Its README is in Spanish.
description: >-
  The tracks are kick, snare, metal, percussion and four synths, played by engines that include subtractive,
  acid, FM, strings, texture, drone, dub and resonator voices, and any of the eight can play samples. The README
  counts 17 engines; the latest commit adds twelve more (among them a 909-style snare, claps, metallic, swarm and organ voices) and removes three, and stores
  the engines, knobs, mix, LFO and arpeggiator settings in each pattern. The screen
  can be set to Spanish, English or Portuguese. Each track has a 32-step pattern, 16 patterns can be
  chained, and steps take sound and mix locks, conditions, probability, ratchets and micro-timing. There are 16 live
  effects, an arpeggiator, random sound and random pattern functions, and undo. USB audio carries eight tracks at 44.1
  kHz, and MIDI works over USB and TRS. The engine code is plain fixed-point C that does not depend on the device, with a
  browser version of the box (the real 0.10 firmware compiled to WebAssembly, no longer a JavaScript reimplementation)
  and a visuals mirror in the repository, and a host simulator that writes screenshots and
  WAV files. The repository also holds Estación, a web app for Chrome or Edge that talks to the FM-1 over SysEx
  (mirror, sequence, sound, mix, samples, projects and recording). The platform layer is a fork of Felucca on a groovebox branch. The sample bank is built into the
  firmware as C arrays; the latest bank list has 20 entries, 14 of them excerpts from the author's own sample library and 6 generated
  by the project's engines. Eleven further textures are WAV files in the repository that Estación loads into the user slots.
status: active
