source: https://github.com/fantasmogenesis/fntsmg-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0 like Felucca and the LICENSE file is the GPL v3 text with no "or later" grant. The README
  says the sample bank belongs to fantasmogenesis or is generated by the engines and ships under the same licence; the
  bank's list (firmware/samples/banco.json) names pack folders of a personal sample library as the source of 14
  samples, and the list for the loadable textures (texturas-tuyos.json) does so for 4 of 11. The Manrope font is SIL OFL 1.1. A note in the repository (motores/PORTABILIDAD.md) says the author may
  later move the engines to a separate private repository under proprietary terms; this repository's code is
  GPL-3.0.
homepage: https://fantasmogenesis.art/fm1/guia
based_on: m-vave-fm-1/felucca
distribution: source-only
requires_stock: M-VAVE stock firmware or Felucca
install_notes: >-
  The README names the author's web installer, a beta at fantasmogenesis.art/fm1/instalar whose page code asks for an
  invitation code, and Felucca's fm1_install.py for installing the built package. To build it, clone with
  submodules (the Felucca fork on its groovebox branch) and run firmware/build.sh mt, after pointing the paths in build.sh
  at your JieLi toolchain and AC79 SDK. The README says installing third-party firmware is at your own risk, that you should
  back up your projects, and that M-VAVE's Workbench puts the stock firmware back.
brick_risk: false
tags: [groovebox, sequencer, drums, synth-engine, fx, arpeggiator, usb-audio, midi, emulator]
versions:
- version: 0.10.3
  date: 2026-11-24
  url: https://github.com/fantasmogenesis/fntsmg-1/releases/tag/v0.10.3
  notes: The first release on GitHub. It gives the package its own identity, FM-1_368764, where 0.10.2 and earlier answered with Felucca's FM-1_900, and is otherwise the same firmware as 0.10.2. It works with the newer UC25HQ80 flash chip. Updating from an earlier FNTSMG-1 keeps projects, and M-VAVE Workbench takes the unit back to stock.
- version: main @ 126965c
  date: 2026-11-20
  url: https://github.com/fantasmogenesis/fntsmg-1/commit/126965c18fe8fa5b14f330ab9d9262c276f7b805
  notes: No tagged releases; this is the latest commit, FNTSMG-1 0.10.2, which drops the USB serial console so macOS 13 to 15 sees the audio input and adds a crash screen with the version and battery. Before it, a commit updates the Estación page for 0.10.1 so its knob and page names match the device and its backup keeps the slot. Before that, a commit removes an internal portability document, and before that, FNTSMG-1 0.10.1 gives saving and erasing a single gesture (SAVE plus a key saves, REC plus a key erases after two presses), starts a new project from an empty slot twice pressed, makes knobs step by one when turned slowly, renames about 70 labels and adds low-battery warnings. The firmware before that is FNTSMG-1 0.10 (b1f4f44), which adds a sound per pattern, twelve new engines with presets and a new button map; the browser box runs that firmware built to WebAssembly. Recent commits stop HOME plus a white key on the PATTERNS page from erasing the pattern, make erasing ask for confirmation, and rebuild the browser box with the fix; another adds an Ableton Live template, with steps and a download, to Estación's recording page, and the newest makes saving work on newer FM-1 units with the UC25HQ80 flash chip.
