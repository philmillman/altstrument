device: m-vave-fm-1
name: foma
kind: tool
summary: >-
  Docker-based framework for writing FM-1 firmware in a single C file, with a browser emulator that rebuilds on save, a
  USB installer and a rescue page, on Felucca's platform or M-VAVE's SDK.
description: >-
  An Arduino-style API of setup, loop and audio functions covers keys, buttons, encoders, LEDs, the screen, USB and TRS
  MIDI, MIDI clock, settings and sound helpers. `./fm1 dev` builds in the toolchain container, serves a page with the
  emulator, the installer and the rescue tools, and the build rejects code the chip cannot run, such as floating point or
  64-bit division. The default platform is Felucca's via SLOOP and Dinghy, with an optional Bluetooth MIDI link in and
  out that can also connect to a Bluetooth MIDI controller or another FM-1 (the stack comes from Optimist). An optional
  platform runs on M-VAVE's FM-1 SDK to add Bluetooth audio and USB audio both ways at the cost of most of the flash
  space; the README says that platform has only been tested in an emulator. FOMAJAM is built with it. The repository doubles as a template: `./fm1 new` renames
  it for a new firmware.
status: active
authors:
- name: David Konsumer (konsumer)
  url: https://github.com/konsumer
source: https://github.com/konsumer/foma
source_status: open
license: GPL-3.0-only
license_notes: >-
  The platform/mvave directory is from M-VAVE's FM-1 Open kit: GPLv3 with M-VAVE's SDK linking exception, plus the binary
  engine library under M-VAVE's terms for FM-1 devices only (platform/mvave/LICENSE.md and THIRD_PARTY.md). The Felucca
  parts and the USB audio code ported from felucca-bsp are credited in LICENSING.md.
homepage: https://konsumer.js.org/foma/
distribution: source-only
install_notes: >-
  Needs Docker; run ./fm1 dev (fm1.cmd dev on Windows) and open http://localhost:8000. The page installs the build, or any
  .fwsc, over USB from Chrome or Edge, and its Rescue tab goes back to M-VAVE's V15, checked by hash. `./fm1 flash`
  installs a build from the command line on the computer (not in Docker).
brick_risk: true
