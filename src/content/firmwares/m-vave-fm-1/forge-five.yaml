device: m-vave-fm-1
name: Forge Five
summary: >-
  Clipper fork that trims its 23 engines to four and adds five new synth engines (LADDER, CHORD-D, BRASS, RIBBON,
  WAVE-P), two layerable parts and a USB-MIDI screen mirror; still in development.
description: >-
  Built on Clipper, which grew out of SLOOP and Felucca. Each of the five new engines imitates one style of synth:
  LADDER (three oscillators into a ladder filter), CHORD-D (one oscillator, sub, chorus and chord memory), BRASS (two
  oscillators with sync and a sweeping filter), RIBBON (layered voices with a pitch ribbon on a knob) and WAVE-P
  (formula-made wavetables with a stepped mode). Two parts can layer or split the keyboard, voices share a budget set
  from CPU measurements on a unit, and each engine has four macros. The step sequencer, recording, song mode and drum
  track of Clipper are not included, and the unit is meant to be played from Ableton Move or another MIDI source. Version
  FF 0.1.1 DEV adds a screen mirror: the FM-1's screen is sent over the same USB-MIDI port so an iPad or computer app can
  display it, using a protocol extension described in the repository's web/EDITOR_PROTOCOL.md. The README calls the
  project in development; its latest published build is an untested development build that has not been tried on an FM-1,
  though earlier measurements were made on a unit. An earlier Felucca-based Forge Five (FF 0.2) is kept on a branch and tag.
status: active
