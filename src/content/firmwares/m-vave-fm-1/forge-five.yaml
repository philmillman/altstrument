source_status: open
license: GPL-3.0-only
license_notes: >-
  Code is GPL-3.0-only, with the web editor included. Fonts and ported DSP keep their own licences (LICENSES/,
  LICENSING.md). The README says no ROMs, wavetables or samples of real instruments are used.
homepage: https://github.com/kkasemsa/Forge-Five/blob/main/docs/INSTALL.md
distribution: download
requires_stock: >-
  FM-1 on V15 stock; the install guide asks you to keep M-VAVE's own FM-1.fwsc (V15) as the way back.
install_notes: >-
  Download the .fwsc from a green GitHub Actions run or the dev-main prerelease and check it against SHA256SUMS, then
  send it with tools/fm1_install.py (needs mido and python-rtmidi) over USB-MIDI; it takes two to three minutes and the
  screen goes dark meanwhile. Close any program holding the FM-1's MIDI port first. The guide says Forge Five had not
  run on hardware yet when written, and that a failed install can leave the unit in its boot loader, recoverable with
  FM-1-transporter hardware. Settings, presets and projects live outside the firmware image, and a Forge Five install over
  Clipper keeps Clipper's, so sounds of engines it leaves out load silent; back up with the web editor first.
brick_risk: false
