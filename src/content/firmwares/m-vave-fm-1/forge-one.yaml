device: m-vave-fm-1
name: FORGE ONE
summary: >-
  Felucca 1.6.1 fork that writes melodies, basslines, pads and beats from a seed, with 54 song starters in 16 genres,
  a four-part Song Mode and live mute, scene and throw controls.
description: >-
  Adds the FORGE generator on the SEQ TOOLS F5 key (seed, density, evolve and eight styles, for melodic and drum tracks),
  a STARTER that fills all four tracks with sounds, tempo and swing for a chosen genre, SONG mode with parts A to D and a
  chain, a PERFORM layer, favourites, a mixer, tap tempo and a visual click, with each key and knob action named on the
  screen. Everything else is Felucca 1.6.1, and projects stay compatible with stock Felucca 1.6 and 1.6.1. The work is on
  the repository's forge branch, while its main branch is an unchanged copy of Felucca. Called Felucca-FORGE before 0.5.1.
  The project site lists each version as tested on the author's FM-1.
status: active
authors:
- name: Khantipol Kasemsant
  url: https://github.com/kkasemsa
source: https://github.com/kkasemsa/FORGE-ONE/tree/forge
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only, as Felucca; the source files are headed with FORGE ONE contributors. Parts keep their own licences: the
  Hügelton Sample Pack is CC0 1.0, Felucca-Engines is MIT, and fonts and ported DSP carry MIT, Apache-2.0 and SIL OFL
  texts (LICENSES/).
homepage: https://forge.kktp.net/one/
distribution: browser-installer
install_notes: >-
  Install page on the project site in Chrome or Edge over USB, where you pick 0.18.1, 0.18, 0.17 or 0.16, or fm1_install.py
  with a forge-one-X.Y.fwsc download. Its Return to official V15 takes the unmodified FM-1.fwsc that you download from
  M-VAVE; no stock file is bundled. The README says an interrupted install can leave the FM-1 unable to start and need
  extra hardware to recover. Back up with the Felucca web editor first, and keep your FM6 .syx file, which that backup
  leaves out.
brick_risk: false
tags: [generative, sequencer, performance, fx, fork]
