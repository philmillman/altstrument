device: m-vave-fm-1
name: FORMALFRED
summary: >-
  Self-playing generative instrument for the FM-1: four lanes of Euclidean, cellular-automaton and ratchet rhythms
  with Braids, FM and 808 voices, filter, reverb and delay. Its sequencer and voice code is Lean 4 with over 300 proved theorems.
description: >-
  Each lane divides the clock into a rhythm and picks a note at every hit from one of eleven note sources, snapped
  to a scale and optionally to a chord progression. The voices are all 48 Braids shapes, eight four-operator FM
  sounds and ten 808-style drums, each through a state-variable filter, with a plate reverb and a delay on the
  sends. A punch page on REC gives momentary effects such as stutter, roll, freeze and fill, and an arpeggiator
  and 142 factory patches are included. The sequencer, the voice arithmetic, the effects and the patch format are
  written in Lean 4 and compiled for the chip, and the repository checks theorems about them on every build. A
  pixel-art butler on the screen is the project's mascot. The same firmware code is compiled to WebAssembly
  for a browser simulator on the project site, which also hosts the installer. It is built on Dinghy, and the
  build instructions list Linux on x86-64 as the only supported build host. The README says the hardware facts
  were not tested by the authors.
status: active
