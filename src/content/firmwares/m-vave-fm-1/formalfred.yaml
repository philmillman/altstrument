  code in voices/ and fx/ is MIT.
homepage: https://mpancia.github.io/fmfm/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Use the installer page on the project site in Chrome or Edge, or fw/tools/fm1_install.py. The package keeps the
  update loader and the OCT- USB rescue, so another firmware can be installed over it. The hardware notes say to back
  up the full flash first and to install over stock V15 rather than over another custom firmware.
brick_risk: true
