license: GPL-3.0-only
license_notes: >-
  The README says FOUROBOROS is built on SLOOP and Felucca (GPL-3.0) and the manual page carries an SPDX GPL-3.0-only header. There is no LICENSE file, and the firmware source is not in the repository.
homepage: https://ignignot.github.io/fouroboros-v1-installer/installer/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15 (FM-1_015)
install_notes: >-
  Open the install page in Chrome on a computer or Android, or Edge, connect an FM-1 running stock V15 and press Install; the page checks the package SHA-256 and the device identity first. It refuses V16. The restore section at the bottom installs V15 and does not bundle M-VAVE's file: it fetches the exact V15 from m-vave/fm1_open, or accepts your own copy of FM-1.fwsc, and checks its size and SHA-256. Back up SLOOP projects first. An interrupted install resumes by pressing Install again.
brick_risk: true
