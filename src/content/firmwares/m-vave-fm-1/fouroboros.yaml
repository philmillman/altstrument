device: m-vave-fm-1
name: FOUROBOROS
summary: >-
  SLOOP-based firmware where four snakes on a board write bass, lead, chords and drums into SLOOP's four tracks as they eat, with 16 levels, three sound groups per level and a hosted install page. Binary only; hardware verification pending.
description: >-
  FOUROBOROS appears as visualiser style 13 inside SLOOP. Each snake owns one part, steered with K1 to K4, and the colour of the food it eats decides what it writes next, so the length of a snake is the song. Snakes cannot die, the board wraps and an idle snake steers itself for about five seconds. There are 16 levels with their own tempo and key, some with arpeggio or note-hold layers, three sound groups per level and white-key chord playing with black-key transforms. Leaving the game restores SLOOP's state. The repository holds the install page and its package, not the firmware source, which is stated to come from a private repository at commit 04d0e62, so it is listed as binary only. The page marks the build as a smoke candidate that has not yet run on a physical FM-1, and installs only from official V15.
