device: m-vave-fm-1
name: FrankenTribe OS
summary: >-
  Experimental groovebox on Dinghy with a four-operator FM synth, drum kits, a genre-driven pattern generator,
  live effects and MIDI clock, built around several hundred patches and kits taken from vintage ROM dumps.
description: >-
  Rights warning: the factory sounds come from other people's products. The README and INFLUENCES.md say the FM
  voice banks are decoded from Yamaha TX81Z and FB-01 ROM dumps, a Kawai K1 wave ROM and its factory programs, and a
  Casio CZ-101 preset table, with further waves mined from EPROM dumps of other synths and drum machines, and drum kits
  taken from an iOS drum app and classic drum machines. The screen palettes, mascot and font sheets come from the
  DOS game Abuse. No permission or licence for any of this is recorded, and the repository holds the generated sample
  and patch tables.

  The firmware has a four-operator FM engine with eight algorithms, hard sync, ring and AM, phase distortion and
  vector modes, a COMPOSE page that fills bass, chord and lead rows from a chosen genre, key and scale with
  repeatable seeds and per-bar drift, Euclidean rhythm fill, a per-part arpeggiator, a live effects layer for
  stutter, tape stop, reverse and filter sweeps, quick mutes, and MIDI clock as master or slave over USB or the TRS
  jack. It is built on Dinghy, which carries the Felucca and SLOOP platform, and reuses Dinghy's update loader. The
  site has a browser emulator and an installer page. The repository documents no hardware test, and the Dinghy
  SMK-37 build option is inherited and not claimed here.
status: active
authors:
- name: MarcoCasanova00
  url: https://github.com/MarcoCasanova00
source: https://github.com/MarcoCasanova00/franken...ribe-os
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file at the root is the GPL-3.0 text with a header that says "or any later version" and names
  "The FrankenTribe contributors". main/LICENSING.md, carried over from Dinghy, says the platform and app code are
  GPL-3.0-only, and this entry follows that stricter statement. The Terminus font is SIL OFL 1.1, the FXCore effect
  programs are vendored with the original author's permission as the changelog states, and the Nokia-style bitmap
  fonts are taken from the GPL-3.0 M17_3310-fw. The README lists where the ROM-derived sounds came from but states no
  licence or permission for them.
homepage: https://marcocasanova00.github.io/franken...ribe-os/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Install page in Chrome or Edge over USB, with the FM-1 on a data cable; it installs over M-VAVE's V15 or over
  FrankenTribe and resumes after an interruption. Back up first. Hold OCT- while switching on to start the update
  loader only. The README says rescue mode cannot brick the hardware, which this entry does not verify.
  Python tools/build.py builds the package with JieLi's toolchain and SDK.
brick_risk: true
tags: [groovebox, synth-engine, sequencer, drums, fm, generative, fx, fork, emulator]
