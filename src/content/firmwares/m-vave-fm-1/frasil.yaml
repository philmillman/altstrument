device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: FRASIL
summary: >-
  Ambient drone and texture instrument: tapped keys latch layered drones that swell with pressure, into a
  freezable reverb with tails up to a minute, with an arpeggiated bell voice on top.
description: >-
  Up to eight drone voices have three layers each: detuned saws, drifting additive partials and tuned noise. They
  feed an eight-line reverb with shimmer and a freeze control. A second voice, GLINT, plays two-operator FM bells
  by hand, through an arpeggiator that follows MIDI clock or through a 32-step sequencer, and a BASS voice holds a
  deep note under the drones. Since 3.0 the tracks (DRONE, GLINT and BASS, with a fourth LEAD track for live melodies added in 3.3) each have their own keys, sound,
  arpeggiator and sequence, picked with SEL, so the drone's chords and the bass's notes can be sequenced in steps of
  up to 32, and there are sixteen saved sounds per track. There are twelve scales, chords built in the scale, three LFOs, a master filter, lofi tape and master EQ (from 2.5), from 3.1 a tape speed control, an ANCHOR snapshot that morphs back to a held sound, an amount for each LFO target and a tuning setting, sixteen scene slots
  with eight factory scenes, and MIDI over USB and TRS that sends incoming notes through the harmony. Three web
  tools go with it: the FRASIL River for backing up the unit and sharing scenes, an Editor and a Perform second screen
  over Web MIDI. A fifth MIDI track, added in 3.3.1, sends the keys, an arpeggiator and a sequencer to a DAW over USB. It is built on fm1-base and felucca-bsp. From 3.3.1 it also runs on the SMK-37 Elite, with packages for the Pro and MKE-P37 that the release says are untested.
