distribution: browser-installer
install_notes: >-
  Install it from FRASIL's page on The FM-1 Firmware Hub in Chrome or Edge, or download a frasil-X.Y.fwsc from the
  releases page and install it with base/tools/fm1_install.py from a recursive clone. To build
  it yourself, run ./build.sh (Docker and the JieLi toolchain and AC79 SDK are needed). To go back, install
  M-VAVE's V15; if the unit does not start, hold OCT- while switching it on for update mode. On an SMK-37, back up the keyboard with the backup tool first, because its calibration belongs to that keyboard, then install the matching frasil-smk37-elite, -pro or -mke package from a terminal.
brick_risk: false
tags: [ambient, synth-engine, fx, reverb, chords, scales, midi, performance]
