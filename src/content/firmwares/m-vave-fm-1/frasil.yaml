versions:
- version: 3.3.1
  date: 2026-11-14
  url: https://github.com/styvesgoupil/frasil/releases/tag/v3.3.1
  notes: Adds a fifth MIDI track whose keys play instruments in a DAW over USB, with velocity curves, aftertouch, its own arpeggiator and sequencer, MIDI clock out and a RETURN fader for audio coming back. Adds packages for the M-VAVE SMK-37 Elite, with the Pro and MKE-P37 included but untested, and an .rfm1 file for RemoteFM1. A 3.3.1 backup does not restore on 3.3 or earlier.
- version: '3.3'
  date: 2026-11-12
  url: https://github.com/styvesgoupil/frasil/releases/tag/v3.3
  notes: Adds LEAD, a fourth track for live melodies, mono or up to six notes, with two oscillators, a 24 dB filter, its own delay, 20 presets and 22 LFO targets. Also adds FRASIL Learn, interactive lessons at learn.frasilsynth.com, a CPU load line, screen reader support and fixes for tape speed crackle and BASS pulse clicks.
- version: '3.2'
  date: 2026-11-09
  url: https://github.com/styvesgoupil/frasil/releases/tag/v3.2
  notes: Recognises the flash chip in FM-1 units sold since autumn 2026, where 3.1 lost scenes and settings at power-off and refused backup, restore and Hub updates. Adds LIVE, which streams a performance to listeners from the Perform web page, a redesigned River with featured songs, LFO targets for the rest of the tape effect, an external-clock tempo readout, a battery indicator and a darker, higher-contrast screen.
- version: '3.1'
  date: 2026-11-07
  url: https://github.com/styvesgoupil/frasil/releases/tag/v3.1
  notes: Adds ANCHOR, which holds a sound and glides back to it in an 8-second morph, a TAPE SPEED control from x0.25 to x2.00 on a new LOFI TAPE II page, an amount control for every LFO target, 32-character scene names, an A4 tuning setting from 415 to 466 Hz and a choice of header looks. Earlier scenes keep their sound.
- version: '3.0'
  date: 2026-11-03
  url: https://github.com/styvesgoupil/frasil/releases/tag/v3.0
  notes: Redesigns the controls around three tracks (DRONE, GLINT, BASS), each with its own keys, sound, arpeggiator and sequence. Adds sixteen saved sounds per track, simpler recording, a sequenced drone and bass, an arpeggiator on the bass, BASS TONE, ARP SNAP, STACK and a screensaver, plus the River, Editor and Perform web tools. Earlier scenes and backups convert on their own.
- version: '2.6'
  date: 2026-10-31
  url: https://github.com/styvesgoupil/frasil/releases/tag/v2.6
  notes: Adds a SOFT page that rounds off the choir's wave, draws the choir's wave on screen and adds the DREAM view to the PERFORM web page.
- version: 2.5.1
  date: 2026-10-31
  url: https://github.com/styvesgoupil/frasil/releases/tag/v2.5.1
  notes: Stops a new chord glitching on heavy scenes while the last one rings out.
- version: '2.5'
  date: 2026-10-30
  url: https://github.com/styvesgoupil/frasil/releases/tag/v2.5
  notes: Adds a master filter, LOFI TAPE and a master EQ with routing, per-track pan, PLAY and CUT gestures, a speaker and jack switch that keeps USB audio running, and the PERFORM web page. Fixes crackle when recording over USB.
- version: 2.0.1
  date: 2026-10-25
  url: https://github.com/styvesgoupil/frasil/releases/tag/v2.0.1
  notes: Fixes bass timing, so PULSE strikes on the beat, and stops a MIDI clock being assumed for half a second after startup.
- version: '2.0'
  date: 2026-10-24
  url: https://github.com/styvesgoupil/frasil/releases/tag/v2.0
  notes: Major upgrade with a second sequencer for the bass, buttons reworked, scenes with names and tempo, drawn envelopes, an OCTAVE control per voice and a web library for scenes.
- version: '1.1'
  date: 2026-10-24
  url: https://github.com/styvesgoupil/frasil/releases/tag/v1.1
  notes: Adds a 16-step bass sequencer, PULSE, ADSR envelopes for the bass and GLINT, named scenes and USB backup and restore.
- version: '1.0'
  date: 2026-10-23
  url: https://github.com/styvesgoupil/frasil/releases/tag/v1.0
  notes: First release, with layered drones, the freezable reverb, GLINT with arpeggiator and 32-step sequencer, BASS, three LFOs and 16 scenes.
