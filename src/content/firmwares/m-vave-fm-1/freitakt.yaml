distribution: source-only
install_notes: >-
  The README describes installing FREITAKT-installer.html from a release in Chrome or Edge, but no release exists, so
  build it with ./build.sh and JieLi's toolchain as in BUILDING.md. To go back, hold SEQ while powering on to reach
  SAFE START and install M-VAVE's V15 with its M-UPGRADE updater; docs/RECOVERY.md covers a crashed unit, using the
  chip's boot mode.
