device: m-vave-fm-1
name: FREITAKT
summary: >-
  Hortator fork with a Model:Cycles-style workflow: six tracks of drum and synth machines plus a chord machine, free
  polymeter, parameter and machine locks, per-track arpeggio and retrigger, patterns with chains and MIDI out.
description: >-
  Hortator's sound engine, loader and recovery tools are kept while the sequencer and interface are reworked in an
  orange theme. Six tracks (down from eight) use the same machines plus CHORD, which plays four-voice chords one at a
  time. The grids, resonator, slicer, sample layer, song mode and ten-channel USB audio are removed and each track has
  one LFO. Polymeter adds FIT divisions such as 5:4 and 7:8 and a master length up to 1024 steps, parameter locks work
  on any page and a held step takes a machine lock. Each track and step can be set to OFF, RTRG, ARP1 or ARP2, live on
  the keys. Patterns are four banks of eight variations with an Elektron-style chain, copy and paste use button combos,
  and MIDI covers sequencer out, a MIDI keyboard mode and .mid export from the web editor. Projects saved by the
  eight-track Hortator do not load. The README says a release carries an installer page, the package and a manual in
  English and Russian, but no release is published yet.
