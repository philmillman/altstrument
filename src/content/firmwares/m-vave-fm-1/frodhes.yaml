versions:
- version: 0.9.11
  date: 2026-11-12
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.11
  notes: Shortens the delay from a note to sound on the two-core FM-1 package from about 9.6 ms to 6.5 ms, with the same sound and 14 voices.
- version: 0.9.10
  date: 2026-11-10
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.10
  notes: Gives the electric piano a softer touch at low velocity, adds a two-core FM-1 package (frodhes-c1.fwsc) with 14 voices and reverb at the full sample rate next to the default one-core image, gives RESPONSE a FULL and a LIGHT setting, lets the SMK-37 play 10 voices, and adds CLAP, VST3 and Audio Unit plugin builds for computers.
- version: 0.9.9
  date: 2026-11-08
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.9
  notes: Adds a per-step CHANCE setting to the sequencer, a switch for PLAY's beat light, support for newer FM-1s with another flash chip, and cleaner USB audio recording on phones and tablets.
- version: 0.9.8
  date: 2026-11-05
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.8
  notes: Adds an EQ page with low and high shelves and a movable mid band, knobs that move several steps on a fast turn, and cleaner drive, wah, chorus, delay and note endings. The emulator page also installs on the SMK-37 Pro, Elite and MKE-P37. The release also holds the first build for the Ableton Move.
- version: 0.9.7
  date: 2026-10-27
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.7
  notes: The emulator page installs Frodhes over WebMIDI in Chrome or Edge. The USB name now carries the model (Frodhes FM-1, Frodhes SMK-37 Pro) with new product ids, so a computer sees a new device. Fixes clipping in 48 kHz USB recording, swapped CHORD and PARA keys on the SMK-37 and faint distortion under a dying held note.
- version: 0.9.6
  date: 2026-10-26
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.6
  notes: Moves the saved settings, presets and pattern to new flash locations that stock firmware does not use, copying 0.9.5's on first start; holding one OCT button and pressing the other resets the octave; fixes dropped notes and clicks when effect settings change under ringing sound.
- version: 0.9.5
  date: 2026-10-25
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.5
  notes: Ten voices on every instrument, a livelier Rhodes, release velocity, pitch bend, more drive types and a tape delay. The release also attaches experimental SMK-37 packages.
- version: 0.9.4
  date: 2026-10-20
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.4
  notes: Adds a concert marimba type, a display page for screen colour, brightness and key lights, and keys that light for incoming MIDI notes.
- version: 0.9.3
  date: 2026-10-19
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.3
  notes: Adds a vibraphone type with a motor, a filter with its own LFO, a battery indicator and MIDI clock sync.
- version: 0.9.2
  date: 2026-10-16
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.2
  notes: ENV and SEL open the phaser and delay pages; the compressor threshold doubles as its switch; the emulator is redesigned.
- version: 0.9.1
  date: 2026-10-16
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.1
  notes: TRS MIDI in, a MIDI page, the pattern recorder and chord mode.
- version: 0.9.0
  date: 2026-10-15
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.9.0
  notes: PERFORM page, arpeggiator and a USB volume setting.
- version: 0.8.1
  date: 2026-10-15
  url: https://github.com/leonardoMirabal/frodhes/releases/tag/v0.8.1
  notes: Compressor gain-reduction meter.
