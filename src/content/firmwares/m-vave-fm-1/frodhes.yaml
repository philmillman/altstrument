device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: Frodhes
summary: >-
  Physically modelled electric piano, vibraphone and marimba computed live with no samples: four Rhodes types, a compressor-to-reverb effects chain, arpeggiator, chord mode and a pattern recorder.
description: >-
  The Rhodes has four types (Stage 77, Suitcase, Early Felt, Bell Dyno), adjustable in tone, bark, bell, hammer,
  decay and noise. The effects are compressor, a three-band EQ, drive, tremolo or wah, phaser, chorus, delay and reverb, with a
  PERFORM page that puts effect amounts on the four knobs. Also included are tap tempo with MIDI clock sync,
  scales, chord mode, an arpeggiator, a 1 to 16 bar pattern recorder with quantise and overdub, a sustain pedal,
  12 factory and 16 user presets, and MIDI over USB and TRS. The README describes it as built on Dinghy and the Felucca
  platform layer, and the project site has a browser emulator and a manual. Hardware test scripts are
  in the repository. Since 0.9.5 each release also carries experimental builds for the SMK-37 Pro, Elite and MKE
  from the same code. From 0.9.8 the project also builds a module that runs it on the Ableton Move under Schwung, and from 0.9.10 it also builds CLAP, VST3 and Audio Unit plugins for computers and a two-core FM-1 package with 14 voices.
