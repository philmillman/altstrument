license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md; the platform code is Felucca's, with changes by SLOOP and Dinghy, and the font is SIL OFL 1.1.
homepage: https://leonardomirabal.github.io/frodhes/
distribution: browser-installer
install_notes: >-
  The emulator page installs the latest release in Chrome or Edge over WebMIDI, or download the .fwsc from a
  release and install it with tools/fm1_install.py over USB (Python with mido and python-rtmidi). Holding OCT- at power-on gives the USB rescue. The README points to the Official firmware section of
  The Firmware Hub, with M-VAVE's V15 from m-vave.com, to go back to stock.
brick_risk: false
