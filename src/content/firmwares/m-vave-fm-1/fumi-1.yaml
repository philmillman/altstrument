device: m-vave-fm-1
name: FuMi-1
summary: >-
  Shigin accompaniment instrument forked from FoMni, inspired by Suikohsha's ST-50: koto, sho, shakuhachi,
  flute and taiko voices on a 6-op FM engine, in equal temperament or the ST-50's just tuning.
status: active
authors:
- name: Duncan Macneil (cartesive)
  url: https://github.com/cartesive
source: https://github.com/cartesive/fumi-1
source_status: open
license: GPL-3.0-only
homepage: https://cartesive.github.io/fumi-1/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer and emulator on the project page. Releases also ship a FuMi-X.Y.Z.sf2 SoundFont.
brick_risk: false
tags: [chords, synth-engine, fm, performance]
