device: m-vave-fm-1
name: GABBERKIX
summary: >-
  Hardcore kick designer: a synthesized 909 through two EQ and distortion stages, a punch layer and a sub, with a randomizer, 16 presets, resampling and MIDI clock.
description: >-
  A kick is built in three layers. The midbody is a synthesized 909 passed through four-peak EQs and two distortions
  (tanh, hard clip or gabber), the punch is the first milliseconds of this or another preset's kick, and the sub is split
  off the lows with a crossover. Group and total clippers press the layers into one kick, and PERF and ENV pages shape it
  while it plays. The kick plays on every beat or pitched from the keys and MIDI. ARP throws a random gabber kick with undo,
  sixteen presets sit on the white keys, and RESAMPLE uses a saved preset as the source of a new kick. It follows or sends
  MIDI clock and works over USB, TRS and Bluetooth MIDI. A browser page reads the presets over USB and renders them to WAV
  or AIFF with the firmware's own engine. Every sound is synthesized, with no samples. It runs on both the original and the newer flash chip.
