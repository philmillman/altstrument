  the release carries the Apache-2.0 JieLi SDK licence text. No M-VAVE stock image is committed.
homepage: https://ejtb76.github.io/gabberkix/
distribution: browser-installer
install_notes: >-
  The project page installs in Chrome or Edge over USB, and the release also attaches gabberkix-1.0.0.fwsc for other
  installers such as The Firmware Hub. An interrupted install carries on when you press Install again, and the page's
  Back to the stock firmware option puts M-VAVE's firmware back. The 16 presets live outside the firmware area and
  survive updates, but another firmware may erase them, so save a backup file from the render page first.
