license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0-only with retained third-party notices; Peanut-GB is MIT. The bundled homebrew ROMs
  each carry their own licence (MIT, GPL-3.0 with source zip, Zlib, WTFPL, BSD-3-Clause, CC-BY-4.0 for Tobu
  Tobu Girl's assets); NOTICE.txt lists them. Includes M-VAVE's FM-1 V15 image (FM-1_015.fwsc), which M-VAVE
  licenses under Apache-2.0 in m-vave/fm1_open; the copy at web/firmware/fm1-original.fwsc has the matching git
  blob ce49cc1. The README says the file keeps its own ownership and is not GPL; the repository does not carry
  an Apache-2.0 notice for it. For the SMK-37 the installer downloads M-VAVE's Pro and Elite V16 packages (SMK-37_Pro_016.fwsc,
  SMK-37_Elite_016.fwsc) from the jonathaslacerda/smk-37-pro-docs mirror; both match the git blobs of the copies
  M-VAVE licenses for redistribution on SMK-37 Pro and Elite devices in m-vave/smk37_open (ad5ff6a, 821236a).
homepage: https://chancethemaker.github.io/gamedude-fm1-smk/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15 (or a firmware with a compatible USB updater); SMK-37 Pro or Elite 016
install_notes: >-
  Chrome or Edge over USB. In the Install firmware tab choose FM-1 or the exact SMK-37 model and install; the
  page checks the restart identity afterwards. On Windows, SMK-37 Pro installs go through the project's local USB
  helper, because Chrome's MIDI backend can hang when the SMK reappears as its updater. Then use the Add games tab to send a cartridge over USB or Bluetooth. A Restore M-VAVE
  firmware button reinstalls V15. Without a working USB updater on the device you need the recovery adapter.
  Cartridge save RAM on the device is lost at restart.
brick_risk: false
