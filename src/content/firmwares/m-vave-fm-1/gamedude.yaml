device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: GameDude
summary: >-
  Game Boy emulator for the FM-1 and the SMK-37 Pro and Elite: the keys are the d-pad and buttons, and games are
  added to an on-device library over USB or Bluetooth. Browser site with a player, game uploader and installer.
description: >-
  Built on Peanut-GB and the Felucca hardware layer, with the second CPU core scaling the picture. The site
  plays a dropped .gb file or ZIP in the browser. Release 2.0 changed the FM-1 firmware from one embedded
  cartridge to a library: the core is installed once and games of up to 256 KiB each are then sent from the
  site's Add games tab, with 360 KiB of library space on the FM-1 and 392 KiB on the SMK-37. Games stay across power cycles, can be picked
  and deleted on the device, and installing the firmware again clears the library. Nine licensed homebrew games
  and an original diagnostic cartridge are bundled; no commercial ROMs or Nintendo boot ROM are. Game Boy (DMG)
  cartridges only. The author tested earlier FM-1 builds on hardware, and the current package has host and
  simulated-flash tests. The same release builds for the SMK-37 Pro and Elite, where Fader 1 sets the volume and
  Fader 2 the pad brightness; the SMK pad-light build 953 was checked on an SMK-37 Pro. The simulator shows all
  three layouts.
