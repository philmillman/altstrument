device: m-vave-fm-1
name: GAMELAN
summary: >-
  Self-playing gamelan firmware for the FM-1 that generates Javanese and Balinese-inspired pieces in pelog and slendro and draws each gong cycle as a mandala.
description: >-
  Pieces follow the gong cycles lancaran, ketawang, ladrang and gilak, marked by gong, kempul, kenong and ketuk, with the balungan on saron and slenthem and peking, bonang and interlocking kotekan around it. A kendang leads tempo changes between irama levels, and some presets add a suling. Slendro and pelog are tuned in cents, paired instruments beat against each other as ombak, and each piece ends by slowing to the gong. The screen draws the cycle as a mandala with the gong at the top, strokes that bloom, the balungan in cipher numbers and a lotus of the five tones at the centre. Fourteen presets each keep their own settings, EDIT ends the piece at the next kenong or gong and REC stays in the current piece. The README calls it an homage to gamelan traditions and not a reproduction of any repertoire.
status: active
