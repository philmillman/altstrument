device: m-vave-fm-1
name: GARDEN
summary: >-
  Self-playing ambient firmware for the FM-1 where each key plants a melody seed that sprouts, grows a phrase, flowers with bells, seeds and withers, tended by a gardener with bees, a rabbit and weather.
description: >-
  A seed planted at a key's pitch sprouts, grows a short loop in the garden's scale, flowers with a full phrase and bells an octave up, scatters related seeds on nearby plots, withers and leaves a low compost drone. Every plant has a name and parents listed in a ledger page. A named gardener with a mood waters, prunes and replants, bees cross two flowers into a hybrid, a rabbit nibbles sprouts, and rain and frost speed up or end growth. A day is 15 minutes, and fuller gardens sound brighter and denser while sparse ones lean on the pad and reverb. The garden saves about once an hour, or at once with SAVE, and it builds on AMB-1's engine.
status: active
authors:
