device: m-vave-fm-1
name: GARGOYLE
summary: >-
  Drone synth for the FM-1 with 16 algorithms modelled on old console, home computer and PC sound chips, one knob per parameter, a chiptune dungeon-noise groove and a dungeon scene on every page.
description: >-
  Each of the 16 algorithms follows the principles of an old sound chip: the NES pulse pair and noise register, the Game Boy's two pulse channels and 4-bit wave channel, C64 arpeggio chords and ring or sync modulation, Atari POKEY polynomial counters, AdLib-style FM and the 1-bit PC speaker. The four knobs set the curse, horde, rune and alchemy of the selected algorithm, and a WRATH macro moves everything at once for live play. Further pages cover an 8-bit echo with a feedback that turns into a fog, filters and attack and release, glide and drifting pitch, timbre and level, bit depth and sample rate reduction, a resonator, and four LFOs with twelve shapes. A GROOVE adds ten styles of dungeon noise, such as footsteps and a heartbeat, tuned to the drone and following MIDI clock. Snapshots are stored on the 27 keys, and a long hold of SEQ resets the sound or everything to its INIT state. The README says all sounds are synthesised in the firmware, with no code or sound taken from any chip or game, and that the room pictures were made by the author with ChatGPT. The manuals are in English and German, and the project site has a browser emulator.
