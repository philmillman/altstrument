install_notes: >-
  Download the .fwsc from the Releases page and install it like any FM-1 firmware, with The Firmware Hub or the M-Flasher. The README describes no recovery path; the FM-1's ROM boot mode applies. The release notes say existing sounds and snapshots stay after an update.
