device: m-vave-fm-1
name: GATOR Call/Answer
summary: >-
  GATOR fork that adds a call and answer generator on the SEQ page: a short figure and its reply play on two Plaits voices, follow incoming MIDI clock and roll their own sounds, with delay, room and scale controls.
description: >-
  GATOR is the Plaits-based macro-oscillator firmware for the FM-1 by npi3pak, catalogued separately. This fork keeps its engines and installer and adds a generator that writes a call and an answer, one octave apart, in 8 or 16 steps. White keys set step pairs, the sounds are drawn at random from curated sets of Plaits models so that each family comes up once before any repeats, and the generator has its own length, effects (delay and room), movement and scale pages on the ENV, FX, LFO and SCL buttons. PLAY starts and stops it, and it follows MIDI clock. Later releases add a soft attack control and a limiter in place of a clipper to remove clicks at the start of notes. Eleven GitHub releases, 0.2 to 1.2, were published between 28 October and 1 November 2026.
status: active
