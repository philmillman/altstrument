license: GPL-3.0-only
license_notes: >-
  LICENSING.md as in upstream GATOR. Plaits and stmlib DSP are MIT (Emilie Gillet), the Terminus font is SIL OFL 1.1, and three JieLi AC79 SDK files in each package are Apache-2.0.
homepage: https://maggismo.github.io/fm1-gator/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with a .fwsc from the releases page (a single
  48 kHz package). The installer has a way back to the official firmware, which asks you to download M-VAVE's own file
  and select it. Same recovery notes as upstream GATOR.
