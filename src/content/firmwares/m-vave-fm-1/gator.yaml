device: m-vave-fm-1
name: GATOR
summary: >-
  Monophonic macro-oscillator synth with 24 synthesis models, a low-pass gate, two LFOs and an 8-slot
  modulation matrix; its sound engine is Mutable Instruments' open-source Plaits code.
description: >-
  The 24 models sit in three banks and include virtual analog, waveshaping, FM, formant, harmonic, wavetable,
  chord, speech, granular, noise, physical-model and drum voices, with the module's CV inputs replaced by a
  modulation matrix fed by the LFOs, an ADSR, velocity, note, mod wheel, aftertouch, random and gate. It has
  GATE, TRIG and DRONE play modes, hold, glide and legato, 16 presets in flash, USB and TRS MIDI input, and a
  48 kHz output package. The DSP is Emilie Gillet's Plaits and stmlib (MIT), used with the changes listed
  in the repository. The platform layer comes from Felucca by way of SLOOP and ORBIT. It is independent of
  Mutable Instruments.
status: active
authors:
- name: npi3pak
  url: https://github.com/npi3pak
source: https://github.com/npi3pak/fm1-gator
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md. Plaits and stmlib DSP is MIT (Emilie Gillet), the Terminus font SIL OFL 1.1, and three JieLi AC79
  SDK files in each package Apache-2.0.
homepage: https://npi3pak.github.io/fm1-gator/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with a .fwsc from the releases page (a
  single 48 kHz package since 0.6; 0.5 and earlier also had a 44.1 kHz one). The installer has a Back to the official firmware
  option, which asks you to download M-VAVE's own V15 file from M-VAVE and select it. The README says an
  interrupted write resumes, an FM-1 that fails to start twice opens USB rescue, and one that does not start
  at all can be recovered with MvaveFM1Unbricker.
brick_risk: false
tags: [synth-engine, oscillator, wavetable, lfo, midi, usb-midi]
