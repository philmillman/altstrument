device: m-vave-fm-1
name: Gen-FM1
summary: >-
  Felucca fork that adds a generative chord and melody machine: four tracks of 6-operator FM, each on its own USB MIDI
  channel, driven by one harmony engine with progression sources, mutation and eight saved setups.
description: >-
  The tracks are two chord dyads, a bass that follows the chords and a melody built from chord and scale tones. Every
  power-on can draw a fresh key, scale, tempo, progression, sounds and rhythms, or resume the last session or a saved
  setup. Progressions come from fixed, random-walk, rule, functional, circle-of-fifths, voice-leading, pendulum or pedal
  sources, with per-track rate multipliers, density modulation, chance, drift and swing. A control page in the browser
  talks to the FM-1 over USB, and Felucca's own sequencer plays the notes the generator writes ahead of it. The README
  says it has run in the browser emulator and its tests and has not yet been flashed to a real FM-1.
status: active
