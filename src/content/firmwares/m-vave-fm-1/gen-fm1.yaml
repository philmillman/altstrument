  licences.
homepage: https://jose-no.github.io/Gen-fm1/
distribution: browser-installer
install_notes: >-
  Open the installer at /webapp/installer/ on the project page in Chrome or Edge with the FM-1 on USB. It is Felucca's
  installer with this package and works from M-VAVE's firmware or Felucca; its Return to official V15 option needs the
  M-VAVE file you download yourself. The README notes that installing other firmware is at your own risk.
brick_risk: true
