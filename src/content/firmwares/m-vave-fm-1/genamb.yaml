source: https://github.com/Kayman18/FM1-genAMB
source_status: open
license: GPL-3.0-only
license_notes: >-
  source/LICENSING.md states that the combined executable is GPL-3.0-only, with the complete corresponding source
  supplied beside it; the repository has no separate root LICENSE file. AMB-1 and fm1-base files are MPL-2.0, Rings is MIT
  (Emilie Gillet), the msfa core is Apache-2.0, and the Zen-1 tables, patches and FM adapter are GPL-3.0-only. The
  Hallucigenia and UNIT-D ports are GPL-3.0-or-later and Proteus is MIT. The committed .fwsc is genAMB's own build
  (610,108 bytes) and matches none of M-VAVE's licensed images. The reverb code under source/app/monumatic has no
  licence header and LICENSING.md does not mention it; the README says only that the reverb comes from Knobula Monumatic.
distribution: download
install_notes: >-
  The package is genAMB-DUSK-Monumatic-Reverb-TEST2.fwsc in the repository root, with SHA256SUMS.txt beside it. The
  README calls it a test build. Build from source/ with build-test.sh; the repo carries the boot assets and fonts but
  the JieLi compiler toolchain comes separately. Back up first and have M-VAVE's updater
  ready.
brick_risk: false
