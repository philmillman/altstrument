based_on: m-vave-fm-1/amb-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  source/LICENSING.md states that the combined executable is GPL-3.0-only, with the complete corresponding source
  supplied beside it; the repository has no separate root LICENSE file. AMB-1 and fm1-base files are MPL-2.0, Rings is MIT
  (Emilie Gillet), the msfa core is Apache-2.0, and the Zen-1 tables, patches and FM adapter are GPL-3.0-only. The
  Hallucigenia and UNIT-D ports are GPL-3.0-or-later and Proteus is MIT. The committed .fwsc packages are genAMB's own builds
  (741,286 bytes each) and match none of M-VAVE's licensed images. The source tree still holds reverb code under source/app/monumatic with no
  licence header, which LICENSING.md does not mention, and LICENSING.md still describes the earlier v17.99 FM test distribution; the current README no longer credits either.
distribution: download
install_notes: >-
  Download genAMB-Nature-1.0-512.fwsc or genAMB-Nature-1.0-256.fwsc from the v1.0 release and install it with the FM-1 firmware updater; the package is about 741 KB and the release has a SHA256SUMS.txt. The release also has M-Flasher images for a clean install, each writing the whole 1 MiB flash including the settings and calibration region taken from a clean-install reference; the README says to back up the device first, so treat them as optional. The offline web editor ships as a zip in the repository and runs from start-editor.bat or start-editor.sh. Build from source/ with build-rc.sh; the JieLi compiler toolchain comes separately. Have M-VAVE's updater ready.
brick_risk: false
tags: [synth-engine, ambient, generative, sequencer, physical-modeling, reverb, fm, fork, mutable-instruments-port]
