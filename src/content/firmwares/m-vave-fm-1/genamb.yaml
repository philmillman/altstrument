device: m-vave-fm-1
name: genAMB
summary: >-
  Generative fork of AMB-1 for the FM-1 that adds a Mutable Instruments Rings port, a six-voice FM engine with 16
  presets from Zen-1, three ported sequencers, independent pad filters and a stereo reverb. The repo's current package is a test build, 17.99.31.
description: >-
  Starts in PIANO mode, where the keys play Rings or the FM synth and only the two pad synths run, and turning the
  Algorithm knob switches to scale mode with the sequencers triggering notes. Pad 1 is a vintage and electric-piano
  style sound with a chorus, and pad 2 is strings and glass with a stereo width setting that the author says maxes out
  the CPU. Rings keeps four voices and its modal, sympathetic-string and string modes, and the FM engine comes with
  16 mallet, plucked and bass presets taken from Zen-1. The sequencers are AMB-1's own plus ports of Hallucigenia from
  Extratone, Proteus from Seaside Modular and UNIT-D from Animatek's VCV Rack plugins. Other additions are a burst setting
  for strummed chords, a delay on Rings, a four-channel mixer, a redrawn 240 by 240 interface and, in the latest
  package, a filter for each pad and a stereo reverb with decay, tone, motion and dry/wet controls that took over from
  the earlier ten reverb modes. The repository holds the package, a browser editor archive and the expanded source tree.
  The README says worst-case CPU load, dropouts and listening with both pad filters on still need a run on a real FM-1.
status: active
authors:
