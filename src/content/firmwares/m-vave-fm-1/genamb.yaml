device: m-vave-fm-1
name: genAMB
summary: >-
  Generative fork of AMB-1 for the FM-1, released as genAMB Nature 1.0: two pads, a Rings port, a virtual analog synth, a layer of rain, river and animal calls, three ported sequencers and a stereo reverb, in 256 and 512 sample builds.
description: >-
  Starts in piano mode, where the keys play Rings or the virtual analog synth and the two pad synths run, and turning the Algorithm knob switches to scale mode with the sequencers triggering notes. Pad 1 is a vintage and electric-piano style sound with a chorus and pad 2 is strings and glass, each with its own filter and slow movement from LFOs. Rings has modal, sympathetic-string and string modes. The virtual analog voice blends saw, pulse and triangle with a sub oscillator, a resonant filter and separate amplitude and filter envelopes, and the modulation page assigns M7 to M9 to its destinations. The Nature layer blends river and rain with a choice of ten animal calls kept in the FM-1's second storage area, the wave partition. The sequencers are AMB-1's own plus ports of Hallucigenia from Extratone, Proteus from Seaside Modular and UNIT-D from Animatek's VCV Rack plugins. A four-channel mixer feeds a shared stereo reverb, and eight piece slots store and recall a setup. Two buffer sizes carry the same instruments: 512 samples for more CPU headroom and 256 for lower latency. The repository holds the packages, M-Flasher images, an offline web editor and the source. The README says physical flashing and timing of the 1.0 images are unverified.
