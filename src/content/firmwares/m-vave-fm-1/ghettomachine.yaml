device: m-vave-fm-1
name: GhettoMachine
summary: >-
  Four-track groovebox for the FM-1: a 909 or 808 drum track, three mono, poly or sampler tracks, a 64-step sequencer with 16 patterns, a scene grid, a 303 pattern generator and per-track stems over USB.
description: >-
  Every drum pad is editable, and the three instrument tracks each take a mono synth, a poly synth or a sampler with FM, ring modulation, a wave shaper, a modulation matrix and macro knobs. It adds an LFO on every track, an arpeggiator and chord mode, a reverb, a tempo delay and a master bus with EQ, compressor, tape saturation, width and limiter. For live use there is a scene grid, perform keys, follow actions and MIDI clock, and a computer can record the master and each track on its own pair of USB inputs. The firmware was called fm1-eight until 0.4. The project also publishes a browser build of the same firmware. The drum engines are ported from X0X and the 9W9 project, and the synth voice comes from Felucca-Engines.
