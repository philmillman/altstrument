license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and LICENSE is the GPL-3.0 text. It builds on fm1-base and felucca-bsp (MPL-2.0), Felucca-Engines (MIT), X0X and ER-99 (GPL-3.0), whose 909 cymbal samples ship in app/assets/909, and the IBM Plex Mono and Sedgwick Ave Display fonts (OFL 1.1), which the firmware carries only as rendered pixels.
homepage: https://groovebox.bongcult.com
distribution: source-only
requires_stock: An FM-1 already running an fm1-base or Felucca firmware
install_notes: >-
  Build the package with fm1-base's tools (Docker for the device build) and install it over USB-MIDI with fm1_install.py, while an fm1-base or Felucca firmware is running on the FM-1. Tap SAVE first; an install restarts the unit and the saved project comes back. Only the firmware area is written, never the boot code, and a cut-off install is recovered with fm1-base's recovery route, described in the manual's Installing it, and getting back. The manual says the first install over M-VAVE's own firmware went through an ESP32-S3 adapter, and that this route still restores M-VAVE's firmware. Back up first.
brick_risk: false
