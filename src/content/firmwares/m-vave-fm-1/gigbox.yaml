source: https://github.com/jazzcat007/GigBox
source_status: open
license: MIT
license_notes: >-
  Read in the repository's LICENSE file. m-flasher, which does every read and write, is a separate MIT-licensed program that the repository does not bundle.
homepage: https://github.com/jazzcat007/GigBox
distribution: source-only
install_notes: >-
  Needs a Raspberry Pi running 64-bit Raspberry Pi OS Lite, the m-flasher package and a clone of the repository, installed with its setup.sh script and systemd services. The udev rule's USB port paths were measured on the author's hub and must be edited for another one. The README says to back up each unit first, and the tool does so before every write. It flashes .fwsc packages through m-flasher. A unit that stays in download mode can be restarted from the panel, and a backup can be restored from it.
brick_risk: false
tags: [flasher, utility, usb-midi, backup, raspberry-pi, midi-router]
