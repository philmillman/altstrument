device: m-vave-fm-1
name: GIO-1
summary: >-
  Generative disco firmware for the FM-1, a fork of AMB-1: nine song presets with bass, strings or choir, a lead that writes phrases and answers the keys, drums and sixteen effects.
description: >-
  The instrument plays itself from power-on. Each of the nine presets is a song form with its own tempo, key and
  chord changes, such as intro, verse, chorus and break, and it loops while sections repeat, layers drop out and the key
  shifts. A bass sequencer, a pad of strings, choir or detuned saws through a phaser, a ten-voice lead and four-on-the-floor
  drums are generated from tables in the source. The white keys play the lead and the black keys are held effects;
  the Chords page rewrites a section's changes while it plays. The songs follow the tempo, key and chord shape of
  disco records, and the licence notes say none of their melodies or samples are included. It keeps AMB-1's platform, plate reverb and
  tape echo. The author describes the first release as an alpha that has been installed on a single FM-1.
status: active
