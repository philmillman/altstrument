device: m-vave-fm-1
name: Glitchbox
summary: >-
  Felucca 1.5.1 fork for harsh, distorted performance: a self-chopping glitch synth engine, a crushed drum kit
  and extra live effects such as roll, gate and crush sweep, all synthesised with no samples.
description: >-
  The GLCH engine runs an oscillator through hard clipping and a wavefolder, a resonant filter, a bit crusher
  and a micro-stutter that loops, reverses and pitch-jumps slices of its own output. It ships with twelve
  presets and takes the slot of Felucca's WHEEL engine. The DESTROY drum kit has eight synthesised lanes with a
  drive control that clips and crushes each hit. Four tracks start with these sounds and empty patterns, and
  the other Felucca engines, sequencer, song mode and MIDI are kept. The README says it has only run in the
  host tests and the browser emulator so far, not on a real FM-1, and that CPU headroom is unmeasured. A browser
  emulator of the same firmware is hosted on GitHub Pages.
status: active
authors:
