homepage: https://erikdevos.github.io/glitchbox/
distribution: source-only
install_notes: >-
  No release is published, so build build/glitchbox.fwsc with build.sh (JieLi toolchain, which needs Docker on a
  Mac) and install it from a terminal with tools/fm1_install.py. The README says to back up the flash first and
  names the installer's Return to official V15 and M-VAVE's own updater as the ways back.
