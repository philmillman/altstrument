device: m-vave-fm-1
name: GLORY PAD
summary: >-
  Worship-style ambient pad for the FM-1: hold a key for a six-voice pad with 20 presets, open, major or minor chords,
  octave shimmer, chorus and a long reverb, written as one C file on the foma template.
description: >-
  The repository is foma's template with src/main.c replaced, and its README still describes foma, not the pad. A key
  or MIDI note sets the root and starts a pad of six sine-based voices with fifths and octaves, in open, major or minor
  voicing and crossfading between two banks when the chord changes. Twenty presets carry names such as Cathedral, Holy
  Presence, Eternal and Secret Place, each with its own reverb, tail, octave-bloom, chorus and diffusion defaults. A
  motion setting moves the chord between static, sus4, sus2 and a floating mode. The knobs and pages cover level, tone,
  fade, shimmer, chorus, space, pan, filters and eight screen colour themes. The code header calls the current version
  GLORY PAD 0.4, and the commit history goes through several "Worship" and "Celestial" editions.
status: active
authors:
