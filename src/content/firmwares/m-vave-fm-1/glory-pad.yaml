device: m-vave-fm-1
name: GLORY PAD
summary: >-
  Ambient pad for the FM-1: hold a key for a wavetable pad with ten presets, open, major, minor, sus2 or sus4 voicing, shimmer, chorus and a feedback reverb,
  written as one C file on the foma template.
description: >-
  The repository is foma's template with src/main.c replaced, and its README still describes foma, not the pad. A key
  or MIDI note sets the root and starts a pad that plays looped wavetables, with a second voice that crossfades in when the
  root or preset changes. Ten presets carry names such as Warm Cloud, Celestial Glass, Ocean of Grace and Silver Mist. A mode
  setting adds harmonic partials for open, major, minor, sus2, sus4 or both sus voicings, or steps through a sequence of them
  automatically. The knobs and three pages cover reverb, shimmer, cutoff, chorus, level, fade, decay and a flow motion with its depth and
  cycle length. The screen header reads GLORY PAD 2.2, replacing the 0.4 of earlier commits, and the file is a rewrite that
  holds the wavetable data.
status: active
authors:
- name: juampygalan93-bit
  url: https://github.com/juampygalan93-bit
source: https://github.com/juampygalan93-bit/glory-pad-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE is the GPL-3.0 and the copied LICENSING.md says GPL-3.0-only, as Felucca, SLOOP and Dinghy; the bigscreen
  folder is MIT. As in foma, the platform/mvave directory comes from M-VAVE's FM-1 Open kit, GPLv3 with M-VAVE's SDK
  linking exception, plus a binary engine library under M-VAVE's terms for FM-1 devices only.
based_on: m-vave-fm-1/foma
distribution: source-only
install_notes: >-
  Needs Docker and foma's workflow as in its README: ./fm1 dev serves a page with the emulator and an installer that
  writes the build to the FM-1 over USB from Chrome or Edge, or ./fm1 build makes the .fwsc and ./fm1 flash installs it.
  The foma README lists the OCT- hold at power-on for the USB rescue and a Rescue tab that reinstalls M-VAVE's V15
  after a hash check. No release is published.
brick_risk: false
tags: [ambient, synth-engine, reverb, chords, fx, midi, usb-audio, fork]
