source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE and LICENSING.md give GPL-3.0-only, with the Gnomad sound core and factory content granted under the same
  licence inside this firmware (the author keeps the right to use the core elsewhere under other terms). Parts that keep
  their own licences are msfa (Apache-2.0), the DaisySP and Rings ports and the adapted drum models (MIT), CC0 instrument
  samples, the SIL OFL Inter Tight font and three Apache-2.0 JieLi SDK files that go into every package.
homepage: https://gnomad.cc
distribution: download
install_notes: >-
  Download the .fwsc from the release, check it against SHA256SUMS and install it over USB with tools/fm1_install.py
  (Python 3 with mido and python-rtmidi); add --port Gnomad when updating from an earlier Gnomad build. Installing from a
  Mac is the only tested route. INSTALL.md warns that going back to M-VAVE's V15 or to Felucca has not been proven on real
  hardware, and that going back erases the songs, user sounds, projects and sample slots saved by Gnomad. The project
  states that no M-VAVE firmware is bundled. Felucca's web installer cannot load it.
brick_risk: false
