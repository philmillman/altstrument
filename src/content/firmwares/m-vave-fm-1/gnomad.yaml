device: m-vave-fm-1
name: Gnomad
summary: >-
  Firmware aimed at children and first-time synth players: a picture picker with ten sound families, four coloured
  knobs per sound, a singing Gnome voice, factory grooves and a four-track looper, with the full synth behind an advanced mode.
description: >-
  EASY mode is the default. One knob picks a picture (the Gnome, organ, bells, laser, whale, choir, cloud, piano, funny
  sounds, drums) and each of the 57 sounds gives the four coloured knobs their own jobs, named on screen in the knob's
  colour. A help band at the bottom of each screen says what the buttons do on that page. The Gnome voice gives each key a
  syllable. Five factory grooves are on keys 1 to 5 and four user songs on keys 6 to 9. A loop is recorded after a count-in,
  restarted or stopped on the bar, and undone with SAVE. Holding HOME and SAVE for two seconds switches to the advanced
  mode with four tracks, a step sequencer, effects, USB and TRS MIDI and every synth page. The sound core was written for
  the project, with an FM kernel adapted from Google's msfa and drum models adapted from Mutable Instruments code, on top of
  Felucca 1.0.1; FORK.md in the repository records every change to Felucca. Lessons are planned in a separate iPhone and iPad
  app that is not released yet, and the firmware itself has none.
status: active
