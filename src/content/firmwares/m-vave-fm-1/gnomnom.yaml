device: m-vave-fm-1
name: GNOMNOM
summary: >-
  Rhythm game for the FM-1 in which a gnome eats falling mushrooms that are the notes of public-domain tunes, over a backing band that moves from folk through house, acid and IDM across eight stages.
description: >-
  Mushrooms fall down seven lanes on the white keys, and eating one on the beat plays its note on the synth, so a clean run plays the melody. Key lights cue the lanes, the lowest black keys hold stashed power-ups, and a trip meter acts as the life bar. The tunes are Grieg, Mussorgsky, Offenbach, Chopin and other public-domain works. There are eight stages and a boss, a JAM mode, MIDI in and out over USB and Bluetooth, and a browser emulator. It is built on fm1-base. The README says it has never run on a real FM-1 and that audio load at stage 8 is the open question.
status: active
authors:
