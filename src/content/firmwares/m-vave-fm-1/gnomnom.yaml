  url: https://github.com/WisestWizard
source: https://github.com/WisestWizard/gnomnom
source_status: open
license: MPL-2.0
license_notes: >-
  The LICENSE file is the MPL-2.0 text. fm1-base and felucca-bsp keep their MPL-2.0 files, and the JieLi SDK files used by the build are Apache-2.0 and not committed. The README says the tunes are public domain.
distribution: source-only
install_notes: >-
  No release. ./build.sh builds app/build/gnomnom.fwsc with the JieLi toolchain and AC79 SDK, and base/tools/fm1_install.py installs it over USB. Holding OCT- at power-on opens update mode, the installer can put M-VAVE's firmware back, and felucca-bsp's fm1_rescue covers a unit that shows only the chip's boot disk.
brick_risk: false
