device: m-vave-fm-1
name: Golana
summary: >-
  Felucca fork that replaces the engines with one microKORG-style analog-modelling synth: two oscillators,
  multimode filter, LFOs, patch routing, arpeggiator, step sequencer and effects, with live waveform drawings.
description: >-
  A four-voice synth with poly, mono, legato and unison modes. OSC 1 has saw, pulse, triangle and sine with a
  control that changes per wave, OSC 2 adds ring and sync, and the mixer includes noise and a wavefolder. The
  filter offers 24 and 12 dB low-pass, band-pass, high-pass and a screaming MS-20-style mode. Two LFOs and four
  patch routings, a 16-step sequencer and an arpeggiator are saved with each of 32 programs. Modulation FX,
  delay and reverb can be reordered. The pages draw the wave, filter curve, envelopes and LFOs from the
  current values, and it has a USB rescue mode entered by holding OCT- at power-on. Release 1.1 added four
  arpeggiator types, 1.2 added a sub oscillator, a drift control and eight more factory sounds, and 1.3 added scale lock, a chord mode and mod wheel routing. A browser
  emulator and installer are hosted on the project site.
status: active
authors:
- name: Gadlele
  url: https://github.com/Gadlele
source: https://github.com/Gadlele/Golana
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca (LICENSING.md); ported DSP and fonts keep their own licences listed there.
homepage: https://gadlele.github.io/Golana/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with a Golana .fwsc from the releases page.
  The README says the installer can restore the official M-VAVE firmware. Hold OCT- alone at power-on for USB
  rescue. To build from source, use ./build.sh as for Felucca (JieLi toolchain and AC79 SDK, see BUILDING.md).
brick_risk: false
tags: [synth-engine, sequencer, fx, ui]
