install_notes: >-
  Install from the page at barnir-fm1.pages.dev/golf/install/ in Chrome or Edge over USB, or download the .fwsc from the
  release and install it with fm1-base's tools/fm1_install.py. The README says the install page has a button to put the
  stock firmware back. Building needs fm1-base and its Docker toolchain.
