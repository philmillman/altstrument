device: m-vave-fm-1
name: Golf
summary: >-
  Wavetable synthesizer with a 32-step sequencer for the FM-1: two oscillators morphing through 130 wavetables, a ladder
  filter, a modulation matrix, effects and 168 presets.
description: >-
  Each of the two oscillators morphs through a wavetable, with 130 tables built in and room for 32 of your own, up to
  seven unison voices and a warp (sync, bend, asym, PWM, fold or FM). A sub oscillator and noise feed a filter with
  ladder 24 dB, 12 dB, band, high and acid modes, its own envelope and key tracking. Two envelopes, two LFOs and six
  modulation routes cover sources such as velocity, key pressure, mod wheel and pitch. The sequencer has 32 steps with up
  to four notes each, velocity, gate with ties, swing, and a wavetable position and filter offset per step, and an
  arpeggiator can play its chords. Effects are drive, three-band compression, chorus, delay and reverb. Eight voices are
  spread over the FM-1's two processor cores, and 16 slots hold your own presets. The sound engine was written from
  scratch for the FM-1's chip. It uses the wavetables and 96 presets of the author's Golf plug-in, with the presets
  converted and fitted against recordings of the plug-in. The wavetables are stored as harmonics, with no recorded audio.
  A script packs your own wavetable WAV files into a bank and sends it over USB MIDI. The README is in English, with
  a Dutch version and some Dutch documentation files.
