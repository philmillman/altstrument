device: m-vave-fm-1
name: GRAIN PIANO
summary: >-
  A sampled grand piano that a granulator breaks into grains, with eight presets with two macros each, freeze, reverse grains, texture beds, a 16-bar loop and scales including ones between the piano's keys.
description: >-
  Each note plays the piano and, at the same time, sends grains out of the same sample at the note's pitch, taken from a point that moves from hammer to tail or stands still with FREEZE, which turns a held note into an endless cloud. Grain size, density, position and spray, envelope, a movement LFO, room, delay and reverb pages shape it, and REVERSE, HALO (octave, fifth and chord layers) and WIDTH add to the cloud. TEXTURE adds rain, vinyl, tape, wind, sea and room beds made inside the FM-1, MEMORY freezes the last two seconds played into a cloud of its own, PULSE puts the grains in bursts on the beat and key pressure can change density, position, vibrato or swell. A loop sequencer records one to sixteen bars of notes and knob moves, and a split plays the left keys lower. Fifteen scales include quarter tones, overtone, pelog and Bohlen-Pierce steps, with the samples retuned freely and MIDI out sending the nearest key. The README names Tonitor as its inspiration, and manuals in German and English and a browser build are provided.
