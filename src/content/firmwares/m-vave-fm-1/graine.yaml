device: m-vave-fm-1
name: GRAINE
summary: >-
  Sample-based granular synth for the FM-1: up to 128 grains on 6 voices across both cores, thirteen synthesized sources
  plus a live capture and four user sample slots, 24 knob pages, modulation recording, 16 presets and a pad mode.
description: >-
  Interface and docs are in French, with an English option for the screen. A cloud page shows the grains over the
  source waveform, and knobs keep one colour per position on every page. Holding LFO or ENV while turning a knob
  assigns that modulation, and holding REC records the knob gesture as a loop. The thirteen sources are synthesized by
  a script, so no recordings are used, and five of them evolve on their own as an arpeggio, bass, chords, pad or
  sequence. REC captures the output into a RAM source, and four flash slots hold samples that the project's browser
  importer or a Python tool loads over USB-MIDI. SEQ turns the keys into 16 positions in the sample plus 11
  performance pads. The README lists effects, a chaos control, MIDI CCs and clock sync. A browser emulator is built from
  the same code. The code builds on fm1-base and felucca-bsp; the README does not say it was tried on a real FM-1.
