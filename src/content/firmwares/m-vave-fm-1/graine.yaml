install_notes: >-
  The project site has a page that installs over Web MIDI in Chrome or Edge, and tools/fm1_install.py from the base
  submodule does the same without a browser. Going back to M-VAVE's firmware uses M-VAVE's own updater. The package the
  site serves is graine-0.2.fwsc, a later build than the only Git tag.
