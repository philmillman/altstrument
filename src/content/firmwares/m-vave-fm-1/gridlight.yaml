device: m-vave-fm-1
name: GRIDLIGHT
summary: >-
  16 by 16 lit-grid sequencer after the Yamaha TENORI-ON: 16 layers and 16 blocks, six play modes, nine scales, reverb and
  chorus, with the keyboard playing one marked grid line at a time.
description: >-
  The FM-1 has no touch grid, so one row or column of the grid is marked at the screen edge and its 16 cells are the 16
  white keys. The six modes (score, random, draw, bounce, push, solo) sit on fixed layers, as on the original, and each
  layer has its own loop length and speed. Controls cover the sound, note length, octave, loop, tempo, transposition,
  swing and volume. There are 28 synthesized sounds and four drum kits (808, 909, 606 and percussion), a demo song in
  block 1, and MIDI in and out with one channel per layer. The README (in French) calls it independent of Yamaha and
  M-VAVE. It is built on konsumer's foma framework.
