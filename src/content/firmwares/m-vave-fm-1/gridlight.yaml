homepage: https://pjac1810.github.io/gridlight/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Open the project page in Chrome or Edge with the FM-1 on USB and use its Install tab, or run tools/fm1_install.py with
  gridlight-0.1.fwsc from the release; build it with the repository's GitHub workflow or with Docker (./fm1 build). Hold OCT- at power-on for the
  rescue mode, where the page's Rescue tab puts M-VAVE's V15 back from a file you download from M-VAVE. The README says
  installing unofficial firmware is at your own risk.
