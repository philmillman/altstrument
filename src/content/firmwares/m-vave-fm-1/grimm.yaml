device: m-vave-fm-1
name: GR!MM
summary: >-
  Dark ambient, dungeon synth and drone firmware: four tracks on seven sound sources, long tape, grain, delay and
  reverb effects, a 64-step sequencer per track, one-key chords, tracks that can play by themselves, song mode and a
  browser demo and editor.
description: >-
  The seven sources are virtual analog with supersaw, six-operator FM, a sample played like a tape loop, a
  formant voice with three recorded choirs, a tonewheel organ, bowed and struck physical models and phase distortion, with 44 factory sounds
  and 64 user slots. The effects are tape wear, a granular cloud with freeze, a tape echo and a reverb that runs
  up to about 32 seconds or indefinitely, with a master filter and four kinds of drive. Each track has an envelope, LFO, filter, scale snapping, chords, an
  arpeggiator and latch for drones, and the sequencer has chance, ratchets, step locks and editing tools. Generate mode
  (DRIFT, PULSE, STORM) lets a track play by itself in its scale, and MIDI clock can be received and sent. Four
  song slots can be chained by hand or recorded live. Four factory samples (CC0) can be replaced from the web
  editor, which also edits sounds live, renames slots and backs up the FM-1. The browser demo runs the firmware
  itself. It is a modified Dinghy, so it shares Felucca's platform layer.
