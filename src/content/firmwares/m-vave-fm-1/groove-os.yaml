device: m-vave-fm-1
name: Groove OS
summary: >-
  Commercial 8-track groovebox ($29): FM and virtual-analogue engines, up to 20 voices, per-track loop
  lengths and effects, 64-step sequencer with parameter locks, sound packs.
description: >-
  Runs on top of M-VAVE's V15 (the FM engine, 128 presets and effects remain M-VAVE's) and adds a ladder-filter
  VA engine, drum kits, per-track DRIVE, CRUSH, FILTER and SLICER, shared reverb and delay, and 11 free
  sound packs. Holding OCT- and OCT+ at power-on boots stock behaviour. All 1.x updates are included in
  the price.
status: active
authors:
- name: Peter Gombos
  url: https://www.groove-os.com/
source_status: closed
license: proprietary
homepage: https://www.groove-os.com/
distribution: commercial
requires_stock: V15
install_notes: >-
  Install page works in Chrome or Edge over USB (not Safari, iOS or iPadOS). The same page reinstalls
  M-VAVE's V15, which erases saved Groove projects, so copy them off first. Browser emulator available.
brick_risk: true
tags: [sequencer, synth-engine, drums, fx, performance, fm]
