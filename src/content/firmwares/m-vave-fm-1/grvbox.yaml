device: m-vave-fm-1
name: GRVBOX
summary: >-
  Groovebox with eight parts, real-time and step (TR-REC) pattern recording, an arpeggiator and reverb, delay and
  chorus sends, in the style of the Roland MC-303 and with every sound synthesized.
description: >-
  The parts are one drum part and seven melodic parts, each with its own sound, level, pan, octave, real-time
  settings and effect sends saved with the pattern. It has 24 synth sounds, four drum kits (808, 909, 606, CR-78) of
  16 sounds, 12 shared synth voices plus 8 drum voices, and eight patterns of one, two or four bars at sixteenth-note
  resolution with shuffle, 40 to 240 BPM and tap tempo. Patterns record live over a loop or step by step on the drum
  part, there are ten arpeggio styles, and eight factory patterns (house, techno, hip hop, drum and bass, electro,
  acid, trance, breakbeat) can be saved to flash. The screen mimics the MC-303's red seven-segment readout. The
  README (in French) says it is an independent project with no link to Roland or M-VAVE and that no samples from the
  original's ROM are used; no Roland sample data or patterns were found in the repository. It is built on konsumer's
  foma framework.
