versions:
- version: 1.4.1
  date: 2026-11-26
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.4.1
  notes: Makes the glide follow its setting, up to 10 seconds, in MONO or LEG; it used to slide much faster than shown. Sounds, sequences, projects and backups carry over from 1.4.0.
- version: '1.4.0'
  date: 2026-11-24
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.4.0
  notes: Adds an EXTRAS 2 page with a high-pass filter, a sub-oscillator and white noise, a second LFO that moves pitch, pulse width, filter or volume, Poly-Mod control of oscillator A's pulse width, a choice of six or eight voices with the FM-1's second core switched on at install, and a menu switch that turns off every sound's effects at once. The editor shows the new settings and gets three panel colours and a menu to switch the FM-1 off and on. Backups from earlier versions read back as they were.
- version: 1.3.1
  date: 2026-11-19
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.3.1
  notes: Shows the value of a MIDI keyboard's knobs in large type, lets the editor follow a MIDI keyboard's notes and wheels, corrects the WHEEL (EXTRAS) direction, redraws the LFO shape switch, makes the emulator window resizable and runs the application and editor on Intel Macs from macOS 10.13. Sounds, sequences, projects and backups carry over from 1.3.0.
- version: 1.3.0
  date: 2026-11-15
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.3.0
  notes: Doubles the size of the value being changed for low-vision players, lets one knob go back to the sound's own value while ENV is held, and lets USER sounds be SOUND A or SOUND B in MORPH on the FM-1 and in the editor. Sounds, sequences, projects and backups carry over from 1.2.0.
- version: 1.2.0
  date: 2026-11-15
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.2.0
  notes: Holding ENV while turning PRESETS jumps ten sounds per detent. The screen reader announces the octave, PLAY and STOP and REC state, and uses its own words for the filter envelope and resonance. Saves carry over from 1.1.0.
- version: 1.1.0
  date: 2026-11-15
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.1.0
  notes: MIDI keyboard knobs work at once (on by default), a per-sound EQ insert is added, and screen-reader support through Charles Vestal's FM-1 Screen Reader arrives.
- version: 1.0.2
  date: 2026-11-11
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.0.2
  notes: Gives every sound a unique capitalised name, puts the guru-600.com address on the ABOUT page, makes the editor announce newer versions and offer a backup first, and adds a Mac installer disk image. Sound, sequencer and saves are unchanged from 1.0.1.
- version: 1.0.1
  date: 2026-11-11
  url: https://github.com/MarcGoudy/guru-600/releases/tag/v1.0.1
  notes: MENU, SYSTEM, ABOUT shows the Guru-600 logo, version, install-page QR code and credits, and the firmware fonts gain accented E. Sound, sequencer and saves are unchanged from 1.0.
