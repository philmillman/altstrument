versions:
- version: 0.3.2
  date: 2026-11-24
  url: https://github.com/jakehandy/h1/releases/tag/v0.3.2
  notes: Runs the screen link at the fast clock on every unit. SETUP > SCREEN AUTO now means fast, and SAFE keeps the slower 12 MHz clock for a screen that shows noise.
- version: 0.3.1
  date: 2026-11-24
  url: https://github.com/jakehandy/h1/releases/tag/v0.3.1
  notes: Fixes screen colours on FM-1s with the newer UC25HQ80 flash chip, crackle at start and dropouts caused by flash erases, and crackle with three or four looped instruments through a CPU guard on the voice count. Adds a layer view for muting, soloing and setting the volume of loop layers, a MIDI page for channel, pitch bend range, wheel and sustain pedal, loop export to a Standard MIDI File through a SysEx request and a SETUP page.
- version: 0.3.0
  date: 2026-11-20
  url: https://github.com/jakehandy/h1/releases/tag/v0.3.0
  notes: Adds the TILT and PLUNK drum machines, a HOOVER algorithm on LAVA, USB host for a keyboard (hold OCT- and OCT+) and a loop with room for 1,024 notes and up to 128 bars. A playing loop now survives a power-off, ECHO no longer goes grainy the longer the unit is on, and BARD's drone dies away instead of cutting out.
- version: 0.2.2
  date: 2026-11-19
  url: https://github.com/jakehandy/h1/releases/tag/v0.2.2
  notes: Adds a look-ahead limiter that stops chords from crackling, MIDI velocity for gain and brightness, a separate setting set for each loop layer, a loop that survives power-off, USB audio of the master output and USB MIDI out on channel 1. A downgrade to 0.2.1 or older loses the saved settings.
- version: 0.2.1
  date: 2026-11-18
  url: https://github.com/jakehandy/h1/releases/latest
  notes: Adds a held-EDIT MASTER control for each instrument's volume, records the CC0 sources in fmhub.json, and rebuilds the simulator .rfm1.
- version: 0.2.0
  date: 2026-11-18
  url: https://github.com/jakehandy/h1/releases/tag/v0.2.0
  notes: Adds BARD and TWANG based on real recordings, a quality pass over every instrument, per-instrument volume, and redraws parts of six instruments.
- version: 0.1.0
  date: 2026-11-18
  url: https://github.com/jakehandy/h1/releases/tag/v0.1.0
  notes: First public release.
