device: m-vave-fm-1
name: h1
summary: >-
  Sixteen instruments for the FM-1 that are each a full-screen animated picture you play, drawn in one ink colour, with a loop recorder, a step sequencer, an arpeggiator and a metronome.
description: >-
  The instruments are COZY lo-fi keys, ORBIT space synths, KOI struck metal and wood, HAUNT ambient, TIDE analog pad, PIP chiptune, BONK drums, URCHIN FM, TWANG plucked strings,
  LAVA wavefolder bass, KNOT additive bells, INK gliding lead, BARD medieval and TURBO eighties synths, TILT electronic drum kits and PLUNK recorded drum kits, each with eight algorithms and four knobs. Settings pages cover FX, selection, envelope, LFO, global and arpeggiator,
  and there is loop and step recording with a metronome. It takes MIDI in over USB and TRS, sends MIDI out and the master as audio over USB, can host a USB-MIDI keyboard, saves on both the original Puya P25Q80 (0x856014) and the newer UC25HQ80 (0xB36014) flash chips and works with a screen reader. The firmware core is portable C99 with no libc, built on fm1-base,
  and the same core runs in a browser simulator, which is catalogued separately.
status: active
authors:
- name: Jake Handy
  url: https://github.com/jakehandy
source: https://github.com/jakehandy/h1
based_on: m-vave-fm-1/fm1-base
source_status: open
license: MIT
license_notes: >-
  The README gives MIT. The recordings in BARD and TWANG are CC0, credited in docs/SAMPLES.md. The package also carries fm1-base by Charles Vestal and felucca-bsp from Felucca, both MPL-2.0 and unchanged, as a git submodule. dist/h1.rfm1 is the project's own WebAssembly build for the simulator.
homepage: https://jakehandy.com/h1
distribution: download
install_notes: >-
  Install from the h1 card on The Firmware Hub (https://thefirmwarehub.com/firmware/h1/), or download the .fwsc from the GitHub releases page and install it with base/tools/fm1_install.py from a clone of the repo with submodules (pip3 install mido python-rtmidi).
  It works from stock V15 and from other custom firmwares. Back up first. The README describes SAFE MODE after two failed starts, the Hub's rescue page,
  and the chip's mask-ROM update mode (hold REC while switching on). Going back uses the Hub's Back to official V15, or another firmware's own installer.
brick_risk: false
tags: [synth-engine, looper, sequencer, fx, midi, emulator, ui]
