requires_stock: V15 or another custom firmware
install_notes: >-
  Install from The Firmware Hub or an FM-1 web installer in Chrome or Edge, or run base/tools/fm1_install.py with hadal-1.0.fwsc from the release. The README says the update loader is included, so another firmware can be installed afterwards, and that the FM-1 comes up in a safe mode the installer can reach if the firmware fails to start twice. Keep M-VAVE's stock V15 file at hand.
