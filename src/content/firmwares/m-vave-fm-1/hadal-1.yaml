device: m-vave-fm-1
name: HADAL-1
summary: >-
  Generative dark ambient firmware: drones, choirs, bells and distant effects that keep changing across 15 worlds, with 40 full-screen pictures, and a keyboard that plays bells or choir voices over it.
description: >-
  The firmware plays on its own and keeps changing for as long as it stays on, steered with the knobs if wanted. Each of the 15 worlds draws on a bank of 34 drones, 29 choirs, 41 bells and 135 effects, and 40 full-screen pictures blend into each other. The keys can play bells or choir voices, latch up to four voices, or split bells and voices across the keyboard. The FX menu plays an effect once or keeps up to four running, and ENV lets everything go at once. Knob pages set darkness, activity, decay, space, levels, room, tape wear and movement, key and mood, and a short tune that returns in changed form. Four save slots hold worlds, and power-on can restore a saved world or start a new one. MIDI in over USB or TRS picks worlds with program change and moves the knob pages with CC 16 to 31, and USB MIDI out sends the notes the world plays. A seven-page guide shows at first start, with help text on each control. A speaker mode is the default, and a headphone mode is in the GLOBAL menu. It accepts both flash chips, the Puya P25Q80 and the newer UC25HQ80. It follows the design of AMB-1, and a browser page plays the engine.
