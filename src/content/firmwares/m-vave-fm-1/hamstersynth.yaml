device: m-vave-fm-1
name: HamsterSynth
summary: >-
  Port of the author's Hamster Piano web page: eight pixel-art hamsters sing the white keys, with a 16-step sequencer
  of eight patterns, a song mode and drums. The README is in Norwegian.
description: >-
  The white keys play eight hamsters, each with its own voice, and the black keys play kick, snare, hat and clap by
  hand. A 16-step sequencer holds patterns A to H with step glide, arpeggio, accent and ratchet set from the knobs in
  EDIT, swing, tempo from 50 to 220 BPM, undo and a song page that chains patterns. A Tromster page programs a drummer
  hamster's kit, and a THALL switch drops the sound an octave into distortion at double tempo. Pressing HOME makes a
  hamster say something on the screen, partly drawn from the Propanpedia wiki. All sound is synthesised, with the
  original page's voice kept as an option, and MIDI in and out cover notes, clock and start or stop. It is a Dinghy 0.5
  app with a project page that runs the firmware in the browser and installs it, and a demo recording in the repository.
  The README says it was built, tested on a computer and run in the fm1-emu emulator but not yet tried on a real FM-1.
