license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only, as Dinghy, with Felucca, SLOOP and SMK-37 board code under their own notices. The
  Terminus font is SIL OFL 1.1 and no samples are included.
homepage: https://joakimskurk.github.io/fm1hamstersynth/
distribution: browser-installer
install_notes: >-
  Use the installer on the project page (Chrome or Edge over USB), or build with build.sh and JieLi's toolchain and
  install build/hamstersynth.fwsc with tools/fm1_install.py, which asks before writing. The README says that if
  something goes wrong, holding OCT- while switching on starts the USB rescue, where an installer always works. It also
  lists ./build.sh --board smk37 for the SMK-37.
brick_risk: false
