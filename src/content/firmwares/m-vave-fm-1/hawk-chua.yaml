    url: https://github.com/Plieuw/hawk-chua/releases/tag/v2.1.3
    notes: Release page has no notes beyond install steps. Commits since 2.1.0 redraw the PSYCHEDELIC tunnel and boot screen, add oscillator knob feedback (an arc of the value round the eye, a small scope of the wave, rippling and bouncing lines) and bring the manual up to date. Releases 2.1.1 and 2.1.2 came the same day and are not listed.
  - version: 2.1.0
    date: 2026-11-10
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v2.1.0
    notes: Release page has no notes beyond install steps. Commits since 2.0.9 make the external MIDI clock strict (the BPM knob shows EXT and waits when no clock arrives), let MIDI START or CONTINUE play the arpeggiator and KARMA together, add an AUTOPLAY on or off setting to the MIDI page, measure the incoming clock over a quarter note for a steadier tempo, and lighten the PSYCHEDELIC style and the shimmer delays.
  - version: 2.0.9
    date: 2026-11-10
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v2.0.9
    notes: Release page has no notes beyond install steps. Commits since 2.0.5 rework the UI STYLE page down to the INITIAL and PSYCHEDELIC looks, with a tunnel and eye picture driven by the oscillator knobs and the sound's stereo position, a MIDI clock choice between internal and external with a clock-out pulse setting, and arpeggiator and sequencer starting alongside each other. Releases 2.0.6 to 2.0.8 came on 9 November and are not listed.
  - version: 2.0.5
    date: 2026-11-08
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v2.0.5
    notes: Release page has no notes beyond install steps. Commits since 2.0.0 add a UI STYLE page under GLO with six looks, motion and a backdrop, knobs that glide like a pot instead of stepping, MOD ENV on a parameter of your choice, sustained plucks, basses and clavs, and a lighter voice load when the firmware runs in a browser emulator. Releases 2.0.1, 2.0.2 and 2.0.4 came the same day and are not listed.
  - version: 2.0.0
    date: 2026-11-08
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v2.0.0
    notes: Release page has no notes beyond install steps. Commits since 1.9.9 add an English README and have the updaters find an FM-1 under any USB port name, so installing from or to other firmwares works more often.
  - version: 1.9.8
    date: 2026-11-08
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v1.9.8
    notes: Release page has no notes beyond install steps. Commits since 1.9.7 add ARP groove (velocity and gate step patterns with rests), LOGIC modes that combine the arpeggiator and KARMA, MOUTH, a talk-box mode in the shimmer reverb, automatic saving of the whole state, presets on the envelope and free-envelope pages, and remodelled TB-303 style acid presets. Release 1.9.9 followed the same day and is not listed.
  - version: 1.9.7
    date: 2026-11-07
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v1.9.7
    notes: Release page has no notes beyond install steps. Commits since 1.9.4 add a second part on the bank page with a layered mode in MULTI, velocity and note-off patterns for the arpeggiator groove, a longer note-quantise scale list with a root setting, tempo-synced delays in 23 presets, and new USB maker and device names. Releases 1.9.5 and 1.9.6 came the same day and are not listed.
  - version: 1.9.4
    date: 2026-11-06
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v1.9.4
    notes: Release page has no notes beyond install steps. Commits since 1.9.1 add MIDI pitch bend with a bend range setting, a softer grand piano with a level-match setting across presets and a speaker bass option, and smoother waveguide models. Releases 1.9.2 and 1.9.3 came the same day and are not listed.
  - version: 1.9.1
    date: 2026-11-06
    url: https://github.com/Plieuw/hawk-chua/releases/tag/v1.9.1
