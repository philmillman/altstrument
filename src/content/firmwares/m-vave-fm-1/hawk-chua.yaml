device: m-vave-fm-1
name: HAWK CHUA
summary: >-
  Chaotic synth firmware whose oscillator is a Chua's circuit solved per voice, with 30 noise programs, Rings-style resonators and waveguides, shimmer reverb, arpeggiator, a phrase generator and tape page. README is in Dutch.
description: >-
  Four voices, each a separate Chua's-circuit solver in fixed point, with CHAOS, SHAPE and OUTPUT controls that
  move it between a limit cycle, period doubling, spiral and double-scroll regimes, and a screen that draws
  the attractor live. Other oscillators are 30 noise programs modelled on the descriptions of Befaco's Noise
  Plethora and a BIG BANG oscillator built from the harmonic series. Sound passes through an ADSR and a low pass gate into resonators based on Mutable Instruments
  Rings and a set of waveguide models, then a shimmer reverb. Also included are four banks of 128 presets
  in General MIDI order (GM, GM variations, synth sounds and experimental sounds), chosen from a BANK menu or by MIDI bank select, a General MIDI and XG style CC map, an arpeggiator, a phrase generator (KARMA page), a free envelope recorder, a four-track tape page,
  stereo pan controls, USB MIDI and USB audio input. Later builds add a MULTI mode with two parts on two MIDI channels, tempo-synced delays, a piano oscillator and a browser version of the firmware. It is a stripped-down fork of Felucca, so the hardware
  layer, update loader and installer come from there. The README and installer are written in Dutch, with an
  English installer text. The author's repository names the FM-1 Firmware Hub entry hawk-chua and the identity
  FM-1_007.
status: active
authors:
  - name: Plieuw
    url: https://github.com/Plieuw
source: https://github.com/Plieuw/hawk-chua
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only (LICENSE, LICENSING.md). The Rings and DaisySP resonator code is MIT, the Inter Tight font is
  SIL OFL 1.1, and three JieLi SDK boot files inside each package are Apache-2.0. The repository states it
  contains no M-VAVE material.
homepage: https://plieuw.github.io/hawk-chua/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py from a terminal. The installer page can
  return to stock V15, but it asks you to select your own unmodified M-VAVE V15 file and checks it in the
  browser. Keep the update code in the firmware, otherwise the next build can only be installed through
  UBOOT, entered by holding OCT- and OCT+ for five seconds. After two failed starts the FM-1 enters UBOOT by
  itself; the README points to FM-1-transporter for recovery.
brick_risk: false
tags: [synth-engine, oscillator, physical-modeling, reverb, arpeggiator, generative, usb-midi, usb-audio, looper, fork]
versions:
