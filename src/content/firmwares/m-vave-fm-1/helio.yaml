install_notes: >-
  Needs fm1-dock installed first. The README builds helio.dock by copying the helio folder into an fm1-dock checkout with the JieLi toolchain and running tools/hbmod.py,
  or from the artifact of the GitHub workflow. No release is published, and the README gives no install steps for the .dock file beyond fm1-dock's own.
