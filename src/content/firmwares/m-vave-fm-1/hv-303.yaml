license: unspecified
license_notes: >-
  The repository has no LICENSE file and the README makes no license statement. The firmware source is not published; the release holds compiled packages only.
distribution: download
install_notes: >-
  Open the .html flash page for your device from the release in desktop Chrome or Edge with the unit on USB, tick the confirmation box and flash; the matching .fwsc can also be installed directly. The release gives each package's SHA-256. The README says to use a spare unit, because an interrupted write can leave the unit in update mode, and not to use M-VAVE's own update loader for the SMK-37 Elite build. It documents no recovery steps; M-VAVE's own updater puts the stock firmware back.
brick_risk: false
