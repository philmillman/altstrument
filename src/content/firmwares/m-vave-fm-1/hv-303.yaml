name: HV-303
summary: >-
  Bass-line machine modelled on the TB-303, with Original and Devil Fish models, a 16-pattern sequencer, a random acid pattern generator, a pad synth and the author's own 808 and 909 drum recordings. The release is a compiled package without firmware source.
description: >-
  The keyboard plays a monophonic 303-style voice with accent, slide and a switchable bass compensation, in an Original and a Devil Fish model. A sequencer holds 16 patterns with step edit and step record, including ties and rests. ACID GEN writes a new random pattern, and since v1.8 an EVOLVE page, off until switched on, moves a few notes to a neighbouring note of the scale and can do so by itself every 4, 8 or 16 bars. An eight-lane drum machine plays the author's own 808 and 909 recordings, and a six-oscillator pad follows the bass pattern in pad, stab, strum and arpeggio modes. MIDI clock runs internal, external or automatic, and two screen skins, Large and Classic, are chosen on the setup page. The repository holds only the README and two screenshots, with the packages, flash pages and a PDF manual as release assets. FM-1 and SMK-37 Elite are separate builds that must not be flashed on each other's device, and the README says the v1.8 package has been tested only in host simulation, not on a real unit. The author also makes P-Vox and FORM.
