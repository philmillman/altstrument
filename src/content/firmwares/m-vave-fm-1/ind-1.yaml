source: https://github.com/devrvega/IND-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md. Platform code is Felucca's via X0X, FoMni and AMB-1; fonts are SIL OFL 1.1. No JieLi SDK files
  are in the tree.
homepage: https://devrvega.github.io/IND-1/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or download the .fwsc from a release and run tools/fm1_install.py (needs mido
  and python-rtmidi). The installer's Back to the stock firmware and M-VAVE's M-UPGRADE restore stock. An FM-1 that fails to
  start twice comes up in a safe mode the installer can reach. Installing is at your own risk.
brick_risk: false
