device: m-vave-fm-1
name: IND-1
summary: >-
  Self-playing industrial music machine: it arranges its own songs from six layers (crushed drums, sequenced bass, two guitars,
  FM stabs, metal percussion, noise bed), with editable songs and a quest-style LCD screen.
description: >-
  Starts playing when switched on and writes songs of intros, verses, builds, choruses, breakdowns and drops in one root and one
  mode, such as Phrygian or harmonic minor. A key moves the machine to its root on the next bar, REC throws in a breakdown, build and
  drop, and any layer can be muted. Locking a piece's song lets you write its three parts step by step, its section plan
  and the metal's two Euclidean rings, and the song then plays the same each time. There are eight pieces,
  each remembering its state, a ping-pong delay, a gated plate reverb, kick-driven pumping, MIDI in and out and MIDI clock.
  The screen shows a dark LCD-style quest. A browser emulator and a manual are on the project site. It builds on AMB-1 and
  Felucca's platform layer, shares its settings area with several other firmwares of that family and keeps its songs where
  LCD-4 keeps patterns, so the first save replaces what those left there. The README calls it a young 0.x release tried on an
  FM-1.
status: active
authors:
