device: m-vave-fm-1
name: INSERT COIN
summary: >-
  Chiptune chord player for the FM-1 with ten video-game-style chord sets, 17 chip sounds, Game Boy style drums with a 16-step drum studio, an 8-bar chord looper and an arcade shooter on the screen that fires on every key played.
description: >-
  A chiptune sibling of CHORD RUN, based on Blop (OSR-1), not to be confused with the fm1-insert-coin arcade collection. Each of ten sets puts the chords of a game-tune-style progression on the black keys under a name of its own, with its own sound, chord rhythm, scale, tempo, bass riff, drum groove and effects. The white keys play a melody that follows the chord, and ASSIST lights the chord's notes or a guide melody, which for one set is the folk tune Korobeiniki. Sounds cover pulse, PWM, 4-bit wave and stepped triangle channels, a laser lead, a coin blip and FM brass, bell, piano and strings, and the FAST and CHIP arpeggio rates play chords as one fast arpeggio. Drums imitate the Game Boy's channels in five kits and 20 grooves, and DRUM STUDIO builds grooves of 16 steps on four tracks into 20 user slots. On the screen a shooter plays itself, firing on every key, with a combo for keys played on the beat, effects built from the chord sounding, faster tempo each wave, boss waves that raise the key, an attract mode and unlockable palettes and kits. Chords and bass go out as USB MIDI on channel 1 and incoming MIDI clock sets the tempo. A browser build of the same firmware is on the project site.
