license_notes: >-
  The README and LICENSE state GPL-3.0-only, as Blop (OSR-1). fm1-base and felucca-bsp stay MPL-2.0, the intro's title type is Press Start 2P (SIL OFL 1.1), and the package carries three Apache-2.0 JieLi SDK files (CREDITS.md).
