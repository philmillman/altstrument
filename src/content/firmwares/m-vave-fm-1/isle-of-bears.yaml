device: m-vave-fm-1
name: Isle of Bears
kind: firmware
summary: >-
  Two-player stacking card game, Isle of Bears, played against the computer on the FM-1's screen, keys and speaker.
description: >-
  Rights warning: the bear, isle and card artwork belongs to HEYBYE GAMING, who reserve all rights; the repository's LICENSING.md allows it only as part of this firmware and its builds.

  The player's black bears play against the computer's white bears on a grid, choosing cards from a hand and following prompts to place, leap or push. The low keys act as a pad, F5 confirms a turn and G5 takes it back, and EDIT shows the controls and then the rulebook as a QR code. The rules engine is a C port of the web game's engine, checked step by step against it in tests, and the computer's search runs in short slices so the screen keeps updating. The win and loss record is kept in flash. It is built on fm1-base with controls modelled on Mighty Arcade.
