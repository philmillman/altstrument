install_notes: >-
  Build with ./build.sh, which needs Docker and JieLi's toolchain, then install the .fwsc over USB with base/tools/fm1_install.py. The README says installing is at your own risk, that fm1-base's installer can put M-VAVE's own firmware back and that an FM-1 that fails to start twice comes up in a safe mode the installer can reach. A browser emulator builds with ./build.sh --web.
