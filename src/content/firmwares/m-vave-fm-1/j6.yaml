device: m-vave-fm-1
name: J6
summary: >-
  Six-voice polysynth firmware after the Roland JUNO-60, with a 24 dB resonant filter, stereo chorus, arpeggiator, a
  16-step recorder, 56 memories and a beta USB-host mode that plays a second FM-1.
description: >-
  Each voice has a band-limited saw, pulse with manual or LFO width, a sub square and noise, followed by a self-oscillating
  low-pass filter and a four-position high-pass, one shared ADSR and an LFO with delay. It has poly, unison and solo
  modes, portamento, hold, a 16-step recorder that follows the arpeggiator tempo, 56 factory sounds in 56 memories and MIDI
  program change. Six colour themes include a JUNO blue default. The beta LINK setting turns the FM-1's USB port into a
  host that sends the arpeggiator and sequencer notes to another FM-1, which needs a powered USB hub. A browser editor over Web MIDI sets every parameter and holds the factory sounds. The README
  describes the sound as an approximation of the JUNO-60 and says levels, chorus and filter values have not been measured
  on hardware. It is built on fm1-base and felucca-bsp and keeps only its own data in flash, not other firmwares' projects.
