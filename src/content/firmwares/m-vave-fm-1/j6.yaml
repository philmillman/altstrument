install_notes: >-
  Download the .fwsc from the releases page and install it with the FM-1 Firmware Hub or fm1-base's tools/fm1_install.py.
  The package carries the Felucca update loader, so installing any other FM-1 firmware leaves J6. Flashing is at your
  own risk.
