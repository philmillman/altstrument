license: GPL-3.0-only
license_notes: >-
  Keeps FoMni-1's and Felucca's licence (LICENSING.md). Rhythm patterns and drum sounds derive from Chordian
  (CC0-1.0); the Barlow and Terminus fonts are SIL OFL 1.1.
homepage: https://raydnoper.github.io/fm1-jambox/
distribution: browser-installer
requires_stock: V15 or FM1 Open
install_notes: >-
  Web installer in Chrome or Edge with the FM-1 on USB, or build/omni.fwsc with tools/fm1_install.py. The
  installer can write M-VAVE's firmware back, and an FM-1 that keeps crashing starts in a safe mode.
brick_risk: false
