device: m-vave-fm-1
name: Jambox FM-1
summary: >-
  Fork of FoMni-1 that adds chord sets, strum layouts, a reggae rhythm, a chord sequencer, melody generation and
  DX7 voices to the Omnichord-style chord harp, with a browser emulator, editor and firmware switcher.
description: >-
  The white keys strum a chord and the black keys pick it, as in FoMni-1. This fork adds eight chord sets that can
  be edited per key, with inversions and transposition, four strum layouts (triads, linear, fixed and
  relative to the chord's scale), a reggae rhythm and rhythms drawn in the editor, an eight-track chord
  sequencer, an auto-generated melody over the chords with a seed, and DX7 bank voices for the strings and
  chords. MIDI comes in on USB and the TRS jack and goes out over USB. The project site has a browser emulator,
  a web installer that can put M-VAVE's own firmware back, a chord and rhythm editor, and a switcher that
  keeps several .fwsc packages in the browser. Rhythm patterns come from the CC0 Chordian OM-84 emulator.
status: active
authors:
