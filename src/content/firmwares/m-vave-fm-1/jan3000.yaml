device: m-vave-fm-1
name: JAN3000
summary: >-
  Felucca fork with an OP-1 and OP-Z style workflow: 16 scenes per project, two FX tracks, J-6 style chord sets, live punch-in effects and extra engines including Plaits models, a TB-303 style ACID engine and a drum resonator.
description: >-
  Rights warning: since v0.2 the firmware bundles 108 phrases that the release notes say were recorded from a real Roland J-6; LICENSING.md does not cover them. Four instrument tracks sit beside two FX lanes of up to 64 steps that record repeat, reverse, filter, tape stop, freeze, pitch and similar effects. Scenes switch while playing and can be chained into a song, and a KEY track moves patterns through a chord progression. Chord Mode holds chord shapes and the 100 chord sets listed in the Roland J-6 manual, transcribed as note data, and plays them live, in steps and through the arpeggiator. Punch-in effects are played from the keys while FX is held. The added engines are ANALOG2, VDRUM and five engines after Mutable Instruments' Plaits, plus ACID. Version 0.2 adds an ARP > J-6 page that plays 108 phrases recorded from a real Roland J-6 over the held keys. The README calls it v0.2 alpha, the second public test version, and warns that the FM-1 has a single firmware bank and no recovery button. A manual in English and German is on the project's Vercel page. The installer zip serves a local page that talks to the FM-1 over Web MIDI and also holds M-VAVE's V15 image for the way back.
status: active
