source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only; Plaits and stmlib (MIT), msfa (Apache-2.0), DaisySP and Rings (MIT) and the CC0 sample sets keep their own licences, and the JieLi SDK files placed in each package are Apache-2.0. The installer zip and vendor/m-vave/FM-1_015.fwsc include M-VAVE's FM-1 V15 image, the file M-VAVE licenses under Apache-2.0 in m-vave/fm1_open; the git blob and the copy inside the zip both match ce49cc1. The J-6 chord sets are note data transcribed from Roland's manual, with Roland named only as the source. The 108 J-6 phrases added in v0.2 are described in the release notes as recorded from a real J-6; the LICENSING.md table lists only the chord sets.
homepage: https://jan3000-manual.vercel.app/
distribution: download
requires_stock: An FM-1 that starts and runs normally; the installer's way back needs the V15 image from the zip
install_notes: >-
  Download M-Vave-OP1-Installer.zip from the releases page, unzip it, start START-Mac.command or START-Windows.bat, and use
  Chrome or Edge to press Install; the starter serves the page on your computer and needs Python 3. If an install is
  interrupted, open the installer again and press Install to resume. The installer has a Return to official V15 option
  that backs up your music first. Recovery from a unit that no longer starts needs extra hardware (an FM-1 Transporter
  with an RP2040).
brick_risk: true
