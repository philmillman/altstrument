device: m-vave-fm-1
name: JAZZ TRIO
summary: >-
  Self-playing jazz piano trio firmware for the FM-1 that plays an endless set of generated tunes on piano, upright bass and drums, shown from a table in a small club.
description: >-
  Every tune is new, with its own key, tempo, form and title, drawn from swing, ballads, blues, rhythm changes, modal tunes and jazz waltzes. A tune goes through count-in or intro, head, piano solos that build chorus by chorus, sometimes a bass solo or fours traded with the drums, head out and a tag, ritardando or Basie ending, followed by soft applause and the next count-in. The bass walks, the ride cymbal keeps spang-a-lang, brushes take over on ballads and the piano uses rootless voicings. The screen shows the stage with a spotlight on the soloist, a candle and the tune and chord on a chalkboard. Thirteen bands each keep their own settings, EDIT calls the next tune and REC keeps the solos going.
status: active
authors:
