device: m-vave-fm-1
name: JAZZY
summary: >-
  Sound-exploration firmware with 31 engines and 1,221 factory sounds, one sound per track, a step sequencer with GEN and drum generators, an Amen and Think break machine and MIDI sidechain.
description: >-
  Rights warning: the firmware package carries two-bar drum loops made from "Amen, Brother" by The Winstons and "Think (About It)" by Lyn Collins, and 595
  presets adapted from 85 LXR-02 factory kits by Erica Synths and Hrtl. THIRD-PARTY-AUDIO.txt and LICENSING.md say authorization from the rights holders has not been obtained
  and that the GPL does not cover this data.

  The engines range from analog-style bass and poly voices through FM, wavetable and chip models to individual LXR, HORTATOR and KW KICK drum voices and a 303-style acid line. Each of the tracks
  holds one sound, with a step sequencer, automation, a GEN chord, bass and melody drafter, per-track drum generators, a break machine with slicing and rolls, USB MIDI Host for
  class-compliant controllers and a sidechain whose source can be an internal kick, a track, USB audio or MIDI notes, with a Kick Link between two FM-1s. It is a sibling of Rhythmer on the same Rhythmer and JIANT base. The release notes say target, host and mock installation checks passed
  and physical testing of the exact release is pending.
