device: m-vave-fm-1
name: JIANT LIVE DRUMS
summary: >-
  JIANT fork that turns the FM-1 into a multitimbral drum sound module: two 12-pad engines, a MIDI receive channel per track, 32-destination MIDI LEARN, 32 project MIDI CC macros and the sequencer switched off.
description: >-
  DRUM-X is extended to 12 independent sounds and a new DRUM-LAB engine adds 12 synthesized pads with ten editable parameters each and eight kit-wide controls. The SEQ, PLAY and REC buttons open an
  editable drum MIDI map, a performance page for velocity response, choke and retrigger, and a table of up to 32 project MIDI CC macros instead of starting a transport. Six tracks each take their own receive channel,
  one controller can move several parameters at once, and eight voices are shared across everything. The repository has a dedicated browser emulator, installer and editor. The README says v0.3 was installed on two physical FM-1s, one from V15 and one from JIANT, and calls these owner-reported device tests rather than a full hardware qualification. It warns against JIANT's own installer. It is a separate repository from the catalogued JIANT LIVE.
