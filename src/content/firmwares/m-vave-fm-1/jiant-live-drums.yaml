device: m-vave-fm-1
name: JIANT LIVE DRUMS
summary: >-
  JIANT fork that turns the FM-1 into a multitimbral drum sound module: two 12-pad engines, a MIDI receive channel per track, 32-destination MIDI LEARN, 32 project MIDI CC macros and the sequencer switched off.
description: >-
  DRUM-X is extended to 12 independent sounds and a new DRUM-LAB engine adds 12 synthesized pads with ten editable parameters each and eight kit-wide controls. The SEQ, PLAY and REC buttons open an
  editable drum MIDI map, a performance page for velocity response, choke and retrigger, and a table of up to 32 project MIDI CC macros instead of starting a transport. Six tracks each take their own receive channel,
  one controller can move several parameters at once, and eight voices are shared across everything. The repository has a dedicated browser emulator, installer and editor. The README says v0.3 was installed on two physical FM-1s, one from V15 and one from JIANT, and v0.4, which adds live project recall and a CLEAR SLOT action, v0.5, which adds live MIDI channel selection on CC88 to CC90, and v0.6, which adds per-track transpose of minus 24 to plus 24 semitones for MIDI and keyboard notes and a GLO page that opens on the mixer, and v0.7, which adds BRASS and INDUSTRIAL synth engines, were flashed and tested on a physical FM-1; it calls these owner-reported device tests rather than a full hardware qualification. v0.8 adds six keyboard zones and v0.9 adds per-track tuning of minus 36 to plus 36 semitones and minus 50 to plus 50 cents, a Panic Mode and an orange-accent interface; the README reports the zones and tuning tested with a Korg X5D keyboard and the interface, Panic Mode and MIDI activity circles flashed on a physical FM-1 on 18 November 2026. It warns against JIANT's own installer. It is a separate repository from the catalogued JIANT LIVE. Since November 2026 the author continues the project as MASHINA in a new repository, and this one stays online.
