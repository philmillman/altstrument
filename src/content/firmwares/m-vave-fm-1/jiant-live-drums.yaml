device: m-vave-fm-1
name: JIANT LIVE DRUMS
summary: >-
  JIANT fork that turns the FM-1 into a multitimbral drum sound module: two 12-pad engines, a MIDI receive channel per track, 32-destination MIDI LEARN and the sequencer switched off.
description: >-
  DRUM-X is extended to 12 independent sounds and a new DRUM-LAB engine adds 12 synthesized pads with ten editable parameters each and eight kit-wide controls. The SEQ and PLAY buttons open an
  editable drum MIDI map and a performance page for velocity response, choke and retrigger instead of starting a transport. Six tracks each take their own receive channel,
  one controller can move several parameters at once, and eight voices are shared across everything. The repository has a dedicated browser emulator, installer and editor. The README says a physical FM-1 installed it through
  that installer and that the drum editing, SEQ and PLAY pages were checked on the unit, calling this limited device testing, and warns against JIANT's own installer. It is a separate repository from the catalogued JIANT LIVE.
