homepage: https://mishamashinamm.github.io/jiant-live/
distribution: browser-installer
install_notes: >-
  The project site's installer sends the package built from the repository's current main commit over USB-MIDI in a
  supported browser; the README calls it experimental and says no complete recovery procedure is documented, so back
  up the FM-1 and prepare a recovery method first. It can also be built as BUILDING.md describes. The README warns
  against using JIANT's installer for this fork.
