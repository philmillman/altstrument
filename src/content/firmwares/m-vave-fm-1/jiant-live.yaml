device: m-vave-fm-1
name: JIANT LIVE
summary: >-
  JIANT fork for using the FM-1 as a live multitimbral module: a receive channel per track on six tracks, MIDI LEARN
  with 32 destinations, 12 independent DRUM-X sounds and a plainer screen.
description: >-
  Each track keeps its own MIDI receive channel, and tracks may share one. Routing is 1-4, 1-6 or the selected track. One
  incoming controller can move several parameters on different tracks at once. The browser emulator can load a JIANT backup file
  to audition saved sounds without touching a unit. The README calls this a development fork, not an official JIANT release, says
  the host tests and firmware build pass, and says the maintainer has flashed it to a physical FM-1 without testing
  features, persistence, MIDI behavior or long-term reliability. The project site has a browser emulator, a
  USB-MIDI installer for this fork and an editor, and JIANT's installer must not be used. The manual it links is
  inherited from JIANT and does not cover every new control.
