distribution: browser-installer
install_notes: >-
  Add the plugin from tuttidaw; the page is a static site that only accepts tuttidaw as its embedder. To build it you need emcc and Node (web/plugin/build.sh). Playing a hardware FM-1 from it goes through tuttidaw and needs Web MIDI.
