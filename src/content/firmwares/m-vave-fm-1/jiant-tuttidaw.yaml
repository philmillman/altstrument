device: m-vave-fm-1
name: JIANT FM for tuttidaw
kind: tool
summary: >-
  Plugin build of JIANT FM for the tuttidaw browser DAW: the firmware's WebAssembly emulator as the instrument, offline renders of the song or incoming MIDI to a mix and six part stems, and playing through a connected FM-1.
description: >-
  A repository by weavejam that mirrors JIANT FM (catalogued as the firmware) and adds a web/plugin folder wrapping its browser emulator as a tuttidaw plugin (protocol tutti-plugin/0), following the same author's plugin for Felucca. A headless renderer plays JIANT's own sequencer or MIDI from the host from the start of the song at the host's tempo, including fractional tempos, and returns the mix and one stem per part at 48 kHz. Builds with a JIANT_TUTTI flag keep the step clocks sample-accurate and split the output by part; the hardware build is unchanged. Later commits let tuttidaw play a hardware FM-1, passing its key presses and screen through. Nothing is flashed. The plugin page is hosted at jiant.plugins.tooljams.com and can only be embedded by tuttidaw.
status: active
