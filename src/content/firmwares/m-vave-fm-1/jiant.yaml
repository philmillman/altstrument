device: m-vave-fm-1
name: JIANT FM
summary: >-
  Bio-synthetic groovebox on Felucca 1.1.5.1 and SLOOP: six tracks, eleven synthesis engines plus one for external signals,
  a 64-step sequencer, songs, a generator and effects.
description: >-
  The README lists V10.7.81 as the public version offered by the installer, with a V10.8.1 beta that redesigns the song mode, and warns to back up
  flash before installing; V10.7.81 keeps 6 songs where earlier ones kept 8. The firmware has no release tags. The repository's only
  GitHub release is a preview of ports to the Akai MPC Sample, MPC plugins and Linux and Windows desktop plugins, which the notes say
  have not been tried on real hardware.
