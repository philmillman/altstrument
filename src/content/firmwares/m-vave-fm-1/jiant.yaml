device: m-vave-fm-1
name: JIANT FM
summary: >-
  Bio-synthetic groovebox on Felucca 1.1.5.1 and SLOOP: six tracks, eight engines (analog, FM6, phase,
  bytebeat/floatbeat LOFI, voice, wheel, noise, bio-percussion), a bus slicer and a thermal-camera UI.
description: >-
  Up to 8 songs of 4 sections within the flash limit. The README calls it in development (v0.6.70) with
  a warning to back up flash before installing; there are no tagged releases.
status: active
