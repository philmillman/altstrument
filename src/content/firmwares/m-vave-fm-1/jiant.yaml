  notes: Public version named by the README and CHANGELOG, committed as the public release; the firmware has no release tag. Adds DRUM-X with MATH formulas and two formula kits, MATH MORPH, a punch-in editor and a named-cell FX layer, SCL HARMONY and EUCLID ROLE, fused seeds and new genres in GENE, and heat-coloured FOCUS. Keeps 6 songs where earlier versions kept 8.
