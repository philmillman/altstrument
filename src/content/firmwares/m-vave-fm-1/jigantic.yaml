device: m-vave-fm-1
kind: tool
name: Jigantic
summary: >-
  Desktop interface for JIANT FM in the browser: clip timeline, piano roll, drum grid, mixer and generator that speak JIANT's own editor protocol over Web MIDI, with a built-in demo device.
description: >-
  A node serve.js server hosts a single page at localhost that needs Chrome or Edge for Web MIDI. The page is not an emulator or a fork: it sends JIANT's editor messages, so the sound, sequencer, songs and effects stay the firmware's. It lays out a browser for sounds, settings, presets and projects, a timeline of clips per track and chain row, a piano roll and an eight-lane drum grid with an automation lane, a six-strip mixer, a device page for every parameter and a side rail for the generator, parts, clips and song. With no FM-1 connected it falls back to a simulated device that answers every edit. The README says its parameter list was read from the running firmware, not from JIANT's documents, which disagree with the code. A path through a MIDI loopback to JIANT's desktop standalone is marked untested. JIANT's source is not copied into the repository, and BUILD.md shows how to fetch it. The code tests run with node test.js and node gen.test.js.
status: active
