license_notes: >-
  LICENSE is GPL-3.0 and the README says GPL-3.0-only, because the C tests include and link JIANT's core library and the demo's parameter tables are generated from the firmware's own replies, which makes it a derivative of JIANT.
homepage: https://github.com/larkindom/Jigantic
distribution: source-only
install_notes: >-
  Run node serve.js and open http://localhost:8777 in Chrome or Edge. Connect the FM-1 over USB and choose its ports in the top bar, or use the demo mode. The writes it sends are JIANT editor messages, not firmware.
