based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Open the install page in Chrome or Edge with the FM-1 on USB and press Install, or run fm1-base's fm1_install.py on the .fwsc from the release. The README says to back up first because installing can lose saved patches, not to unplug during the write, and that the page can put M-VAVE's own firmware back. The install page can also add m-bootloader as an optional extra, which the project's checklist treats as a recovery aid. The review notes say it was tested only in fm1-base's host simulator, and the README does not claim a test on hardware.
