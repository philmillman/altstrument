device: m-vave-fm-1
name: JUNIPER FM-1
summary: >-
  Six-voice polysynth inspired by the Roland Juno-106, with a DCO, resonant four-pole filter, stereo chorus, six voice modes, arpeggiator, Juno-106 SysEx and 128 patches, installed from a browser page. Formerly JUNO FM-1.
description: >-
  The engine is written from scratch from the Juno-106's published design, and the project says it holds no Roland or other emulation code. Each voice has one DCO with saw, pulse with PWM, sub and noise, a resonant four-pole low-pass that can self-oscillate, an ADSR and an LFO with delay, followed by a high-pass and the chorus modes I, II and I+II. Additions in the style of the superOS-106 firmware are poly, mono, chord, unison and dual voice modes, an arpeggiator, a second envelope for the filter, per-voice detune and drift, velocity routing, MIDI-clock LFO sync and an Arabic scale with user scales over SysEx. It reads and sends the Juno-106's own SysEx patch messages, so existing librarians can send patches, and answers the superOS-106 controller numbers. The bank has 128 factory patches, some with a stored arpeggio or chord. A browser player runs the package in the fm1-emu emulator, and a macOS launcher opens the installer offline. The repository's own review notes list a hardware checklist and corrective changes that are not implemented. It is built on fm1-base and was renamed from JUNO FM-1 at 0.5.1 with the same package identity.
