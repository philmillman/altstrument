  url: https://github.com/Guizmoh
source: https://github.com/Guizmoh/K-WASUB_Firmware_for_FM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, inherited from KAWA, with platform code by Leo Kuroshita (Hügelton Instruments)
  and zvenson. msfa is Apache-2.0 and the fonts are SIL OFL 1.1; the sounds are synthesized, with no recordings.
  JieLi SDK files are read from the user's own checkout at build time.
homepage: https://guizmoh.github.io/K-WASUB_Firmware_for_FM1/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Browser installer in Chrome or Edge over USB, or the install script for Windows, macOS or Linux; the package and
  its checksums are in the repository's install folder. Use a data cable and close other MIDI software. The README
  names going back to KAWA 0.5 or to M-VAVE's firmware with M-UPGRADE, and holding OCT- at power-on opens the USB
  rescue.
brick_risk: false
