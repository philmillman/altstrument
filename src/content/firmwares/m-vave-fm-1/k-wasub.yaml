device: m-vave-fm-1
name: K-WASUB
summary: >-
  Bass synth firmware for the FM-1 built from KAWA's platform: nine oscillator engines, three LFOs, an A/B and
  X/Y morph, FX pads, a four-band EQ, and a drum and bass sequencer with parameter locks.
description: >-
  Aimed at drum and bass, dub, dubstep and techno. Each oscillator has nine engines (analog, 808, CS, wavetable,
  four-operator FM, growl, additive, phase distortion and hard sync), and there are seven filters, a four-band EQ
  and an LFO page with three LFOs, the third one global. Holding LFO while turning a knob assigns the second
  LFO to that setting. The SEL windows hold performance, morph, live effects and macro pages. A bass sequencer of
  up to 64 steps with 32 patterns, copy, paste, chaining, names and a piano roll, and an eight-track drum sequencer, with kits in 808, 909, dub techno and acoustic styles, both
  support trig conditions, probability and parameter locks, and knob moves can be recorded as automation. The
  screen has several themes and fonts and a language setting for English, French or Spanish. The repository has a
  browser emulator, an illustrated manual, a web installer and install scripts for Windows, macOS and Linux. It
  is derived from KAWA and reuses its platform code. The author has marked it as a beta on the start screen, in
  the manual and on the site, and the README and site say version 1.1.01 was tested on an FM-1.
status: active
