device: m-vave-fm-1
name: KALK
summary: >-
  Beat composer for the FM-1 after the workflow of Limelite: five synthesised drum and tone voices, a three-lane sequence in four patterns, looping side lanes, 127 remix variations, an XY effect with recorded motion and a delay.
description: >-
  The screen is a ring-per-lane view in which each lane is cut into as many wedges as it has steps, so lanes of different lengths drift against each other. Kick, snare, hat, tie (FM tone) and pod (struck tone) each have sixteen synthesised variants and eight sample slots, with filter, shape, mod and extra pages, grain and speed on samples, and a random-kit button. Effects run in seven groups: XY effects with motion recording, TORSION distortion, filter, delay, reverb, a pulp stage and a master EQ with output stage. It follows MIDI clock and keeps eight project slots. The project says no Limelite code, samples or artwork are used, and all samples are synthesised in the repository and released as CC0. Every release is marked a pre-release that has not been tested on an FM-1.
