license_notes: >-
  LICENSING.md states GPL-3.0-only and LICENSE is the GPL-3.0 text. The platform files come from Felucca (Leo Kuroshita) with SLOOP's changes, genkigenki's SMK-37 layer, OberVave and Dinghy, each credited there. The sample banks are CC0 and the Terminus font is OFL 1.1.
homepage: https://github.com/ShadyBaklawa/kalk-fm1#readme
distribution: download
install_notes: >-
  Download kalk-0.7.fwsc from the release (or the dev build from an Actions run) and install it with a web installer that takes a file, or with tools/fm1_install.py. Keep stock V15, or the Firmware Hub's Return to official V15, ready. If it does not start, hold OCT- while switching on for the USB rescue and install another firmware. The releases say it has been played in the browser emulator but not yet installed on an FM-1.
