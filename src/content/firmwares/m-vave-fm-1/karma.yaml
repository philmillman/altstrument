    url: https://github.com/eatyourgreensstudio-dotcom
source: https://github.com/eatyourgreensstudio-dotcom/karma-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Code is GPL-3.0-only (LICENSE, LICENSING.md). Plaits, Elements and Clouds code from Mutable Instruments
  stays MIT. The drum voices and transient samples taken from Erica Synths' LXR-02 firmware are GPL-3.0-only
  with that project's extra terms, which include a trademark clause for the LXR names (LICENSES/LXR-NOTICE.md).
  Other parts keep their own licences listed in LICENSING.md, including msfa (Apache-2.0) and CC0 samples.
homepage: https://eatyourgreensstudio-dotcom.github.io/karma-fm1/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB. Back up projects from the editor first when coming from another
  firmware, because each FM-1 firmware reads its own flash layout and may overwrite the others' data. The
  installer page can return to stock V15, but it asks you to select your own unmodified M-VAVE FM-1 V15
  file, which it checks by hash; it does not bundle it. Holding OCT- while switching on starts the USB
  rescue if an install was interrupted.
brick_risk: true
tags: [groovebox, sequencer, synth-engine, drums, fx, generative, physical-modeling, usb-audio, midi, editor, fork]
