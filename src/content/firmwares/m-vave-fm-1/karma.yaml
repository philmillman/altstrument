device: m-vave-fm-1
name: KARMA
summary: >-
  Four-track groovebox firmware grown from SLOOP: acid or Juno track, Elements and Plaits engines, LXR-02 drum voices, 64-step sequencer, chord generators, granular send, six-stem USB audio, web installer and editor.
description: >-
  KARMA started as a fork of SLOOP and keeps the Felucca hardware layer under it. Track 1 is a TB-303 style
  acid voice (from X0X) or a Juno-106 style polysynth (from FM-106), track 2 runs Mutable Instruments
  Elements code, track 3 offers 24 synthesis models from Plaits, and the drum track plays voices ported from
  Erica Synths' open-source LXR-02 firmware. The sequencer has 64 steps per track, chords, ratchets, slides,
  chance and a song arranger, and generators write parts for the synth tracks from one key and chord
  progression. Other features are a Clouds-based granular send, reverb and delay, USB audio with a stereo or
  six-stem mode, USB MIDI in and out with DAW clock sync, dual-core rendering and pixel-art screens with a
  character per track. A browser simulator and a web editor are on the project site. KARMA reads projects
  saved by SLOOP up to 2.6 but not those of newer SLOOP releases, and after SLOOP 2.8 it starts with an empty
  project. Its firmware identity is FM-1_926.
status: active
authors:
