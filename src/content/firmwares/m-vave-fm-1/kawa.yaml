  date: 2026-11-09
  url: https://github.com/Guizmoh/Kawa-Tracker-Fm1/releases/tag/v0.9
  notes: First tagged release, on the latest commit. The release page says only that workflow was improved and the firmware stabilised. The package builds on 0.8, which recognises the flash chip fitted to newer FM-1 units so that saving and updating work there; the last commit makes the demo's first PLAY start at the beginning of its song. The README says 0.9 was tried on a real FM-1.
