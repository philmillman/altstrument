device: m-vave-fm-1
name: Ketch
summary: >-
  LSDj- and M8-style tracker for the FM-1's keys and screen: four channels on Felucca's engines, song, chain and
  phrase screens, per-row commands, instruments, effects and a mixer.
description: >-
  Four channels each play one of Felucca's sound engines. The song lists chains per channel, a chain lists
  phrases, and a phrase is 16 rows of note, instrument, velocity and commands (delay, retrigger, ramps, chance,
  hops, swing and every sound parameter). Instruments have their own pages for engine, preset, envelope, LFO,
  voice and sends, with four knob slots, and the tracker adds delay, reverb and chorus effects and a mixer with
  level, mute and solo. Notes can be entered by step or recorded live from the keys with a count-in and
  metronome. Projects save to the unit's flash, USB MIDI and USB audio work, and a browser version runs the
  firmware. It builds on Dinghy and Felucca's sound layer. The README calls it a 0.1 beta tested on one unit by
  one person and warns that songs saved in a beta may not load in the next release.
status: active
authors:
- name: Adrien Risser-Zhuang (risseraka)
