source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README, LICENSE and LICENSING.md. The platform and sound layer are Felucca by Leo Kuroshita (with
  SLOOP's changes), the wiring and emulator come from Dinghy by zvenson, and the browser emulator's faceplate is
  from sloop-web-emu (GPL-3.0). Ported DaisySP and Rings code is MIT, msfa is Apache-2.0, and the font is SIL OFL
  1.1. No JieLi SDK files are in the tree.
homepage: https://risseraka.github.io/fm1-tracker-ketch/
distribution: browser-installer
install_notes: >-
  Install from the project site in Chrome or Edge over USB, or download ketch-X.Y.fwsc from the release and run
  tools/fm1_install.py (needs mido and python-rtmidi), which asks before writing. Charge the unit and keep it on
  USB power. The site also offers a return to M-VAVE's V15. Holding OCT- while switching on starts update mode
  if an install was cut off, and the README links the MvaveFM1Unbricker dongle for a unit left dark. Installing
  is at your own risk.
brick_risk: false
