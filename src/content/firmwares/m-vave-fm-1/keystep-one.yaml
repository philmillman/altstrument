license_notes: >-
  The LICENSE file is the MPL-2.0 text, and LICENSING.md applies it to the modified CTL-1-derived application files. The
  platform (fm1-base, felucca-bsp) comes from submodules under MPL-2.0, Sonivox EAS is Apache-2.0, and the JieLi AC79 SDK
