device: m-vave-fm-1
name: keySTEP ONE
summary: >-
  Controller and arranger firmware built on CTL-1: four pattern tracks with pattern, song and album playback, a
  keyboard LIVE PLAY mode that queues patterns, USB and Bluetooth MIDI and a General MIDI engine.
description: >-
  Starts from CTL-1 and adds an arranger with four tracks, up to 512 stored patterns, and pattern, song and album
  playback. LIVE PLAY, opened with LFO, uses the 11 black keys to pick a bank and the 16 white keys to pick one of its
  patterns, so 176 patterns can be chosen from the keyboard; the choice waits for the end of the selected track's loop.
  KNOB 1 to 4 set the four tracks' volumes. The sound comes from the Sonivox General MIDI engine on the FM-1 or from
  external gear over USB (device or host), Bluetooth or TRS MIDI. The author reports LIVE PLAY and album playback in ONCE
  mode working on hardware. The first beta was packaged from a working copy with no fresh build or flash and had an
  album ONCE repeat problem; 0.5.42 is marked a beta with an identity-only rebuild and no support yet for the newer
  UC25HQ80 flash chip. The user guide is in English and German.
status: active
authors:
- name: dzwerg
  url: https://github.com/dzwerg
source: https://github.com/dzwerg/keySTEP-ONE
