distribution: download
install_notes: >-
  Download keystep-one-0.5.42.fwsc (or the older keySTEP_ONE_v0.5.35_BETA.fwsc) from the releases page, not a source ZIP, and follow docs/FLASHING.md. Back up
  music and settings first; the README calls the build a beta that is not fully tested, and the release says only the
  original Puya flash chip is supported.
brick_risk: false
