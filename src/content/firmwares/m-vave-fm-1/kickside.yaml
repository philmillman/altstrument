homepage: https://kicksidesidekick.com
distribution: browser-installer
install_notes: >-
  Download the .fwsc from the release and install it from The Firmware Hub in Chrome or Edge, or on Linux with python3 firmware/vendor/fm1-base/bsp/tools/fm1_install.py. Back up first, because it replaces the running firmware and may read songs and presets differently.
  Do not update to V16 before installing it. To go back use the Hub's Back to official V15, or hold OCT- while switching on for the USB rescue; two failed starts open a safe mode.
