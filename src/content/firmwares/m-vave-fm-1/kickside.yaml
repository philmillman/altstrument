device: m-vave-fm-1
name: KickSide
summary: >-
  Play-along firmware for the FM-1: a band plays drums, bass, harmony and melody, you mute one layer and the screen shows that part as chords, keys, ukulele or bass tab. Includes 15 songs, 42 backtracks and a synth mode. Beta.
description: >-
  SONG LEARN plays a song with its parts at levels from simple to detailed and shows the muted part on the screen. BACKTRACK offers chord loops in many styles to play or sing over, and SYNTH
  plays the FM-1 with presets, an arpeggiator, chorus and delay. Sound comes from a General MIDI set built into the firmware. The starter library of public-domain tunes and the project's own arrangements is
  inside the firmware, and songs made on a laptop from MIDI files are sent over USB with tools/fm1song.sh, whose send, delete and wipe commands write to the song area. The README says it was tested on one unit with the Puya flash chip and that the UC25HQ80 chip and V16 units are covered only by code and the emulator.
  Much of the code was written with an AI coding assistant.
