homepage: https://blackkittendevices.github.io/kitten-rack/
distribution: download
install_notes: >-
  Unzip KittenRack-instalador from the release and run KittenRack.pyw (Python 3.8 or newer, with a USB data
  cable); the window installs the firmware and can install any other .fwsc to leave. The README says to back up first with
  the editor of the firmware you run now. Hold OCT- and OCT+ at power-on for the update mode. The factory patches are
  written on the first start.
