device: m-vave-fm-1
name: Kitten Rack
summary: >-
  Modular synth inside the FM-1, a fork of Matryoshka: over 50 patchable Eurorack-style modules edited on the device or in a web editor, a recording sequencer, 33 factory patches, visuals and USB audio.
description: >-
  A patch is a rack of modules whose outputs can be cabled to any input, built and edited on the FM-1's panel
  or in the web editor, which also runs the patch and plays it in the browser. The modules include three oscillator types,
  a Minimoog-style ladder filter, a low pass gate, Turing, Marbles, Euclidean and Lorenz generators, Maths-style
  functions, a tape echo, a spring reverb and granular. The sequencer stores up to 64 patterns of 64 steps per patch
  with a piano roll, a drum grid and songs, and records live takes with or without quantizing. MIDI learn maps a
  controller's knobs in the editor and the map is saved in the patch. The device is a USB audio and MIDI
  interface, and screens are in English or Spanish. The code starts from Matryoshka 1.5.1 and so from Modular-1,
  with the VCF Muug taken from FMini-1. The repository holds M-VAVE's unmodified V15 package for the installer's way back to stock.
