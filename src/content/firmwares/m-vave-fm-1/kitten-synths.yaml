device: m-vave-fm-1
name: Kitten Synths
summary: >-
  SLOOP 2.8 groovebox with a MUUG three-oscillator ladder-filter engine ported from FMini-1 (100 factory sounds), a fourth lightweight LITE synth part, a second drum track and a cat-themed screen, shipped as patches on SLOOP.
description: >-
  Keeps SLOOP's engines, 64-step sequencer, song mode, punch-in effects and MIDI map, and sends USB audio on eight channels (the master, then each of the six tracks separately), and adds the MUUG engine, a
  Minimoog-style voice with up to eight voices, a 24 dB ladder filter and its own edit pages on the FM-1's panel, and a
  LITE track that plays only the DIGITAL, PHASE, LOFI, SAMPLE and VOICE engines so a fourth synth part costs little CPU. Since 2.8-kitten.8 there is also a second drum track with its own kit, pattern,
  mixer settings and MIDI channel 11, and the screens and web editor show six tracks. Seven SLOOP sounds and four visualisers were removed to free program
  memory, which the notes say is almost full. The repository holds no copy of SLOOP: a GitHub Actions workflow downloads a
  pinned SLOOP commit and applies the patch files. The documentation is in Spanish, the credits say development was assisted
  by Claude, and the README calls it a beta tested on one real FM-1.
status: active
authors:
- name: Black Kitten Devices
  url: https://github.com/BlackKittenDevices
source: https://github.com/BlackKittenDevices/Kitten-Synths
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENCIA.md for the patches and build flow. SLOOP and Felucca's own icon atlas and panel image are not under the
  GPL; the SLOOP sample pack is not included. Samples, fonts and the JieLi SDK files keep their own licences (CREDITOS.md).
homepage: https://github.com/BlackKittenDevices/Kitten-Synths#readme
distribution: download
install_notes: >-
  Download the installer zip from the release, unzip it and run servir.py (Python 3) to open the installer in Chrome or
  Edge, or flash the loose .fwsc with another tool. Unplug and replug the FM-1 once after installing so the computer sees the eight audio channels. Back up your projects first. The installer has no option to return to
  M-VAVE's V15; install another compatible firmware's .fwsc to leave. Hold OCT- while powering on for USB rescue.
brick_risk: true
tags: [sequencer, synth-engine, drums, fx, performance, midi, usb-audio, editor]
