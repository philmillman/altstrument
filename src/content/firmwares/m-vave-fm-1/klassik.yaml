device: m-vave-fm-1
name: KLASSIK
summary: >-
  Rack of six classic synth engines (FM6, VA, phase distortion, organ, drum kits and a 303-style acid bass) with six parts,
  a mixer, delay and reverb, a note looper with a step sequencer and a glyph-based interface.
description: >-
  Each part has its own engine, sound and octave, and MIDI channels 1 to 6 play parts 1 to 6. Every sound is drawn
  as a glyph made of its eight parameters, which reshapes as the knobs turn. FM6 is a six-operator engine ported from msfa
  with twelve own presets and no DX7 factory sounds. VA, PD and ORGAN come from Felucca-Engines, and the drum kits, with 606, 707,
  808 and 909 styles, use Plaits drum models ported to C and not samples. ACID is ported from Open303. The README is in German, says v0.6 is
  experimental, and says it was tested only in the host simulator and the browser emulator. It builds on fm1-base.
status: active
