license: MPL-2.0
license_notes: >-
  LICENSE is MPL-2.0 for the project's own files. LICENSING.md lists the ported parts, msfa as Apache-2.0, and Plaits drums, the
  Rings reverb and Open303 as MIT, with fm1-base MPL-2.0 and Felucca-Engines MIT as submodules.
distribution: source-only
install_notes: >-
  Build as the README describes (macOS steps with FriBiDi and a Python environment), after tools/setup.sh fetches the submodules, then
  install the package with the base installer tools. The README and manual describe the controls.
