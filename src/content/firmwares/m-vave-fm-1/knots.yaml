device: m-vave-fm-1
name: KNOTS
summary: >-
  Four-track groovebox for the FM-1 that ports Mutable Instruments Grids, Plaits and Rings: Grids picks the steps,
  Plaits is every voice and Rings is the effect. Pre-release; not yet run on a real FM-1.
description: >-
  Each track follows one part of a Grids groove on its own map X, map Y, chaos and fill, with 32 steps of notes or
  rests, and Plaits supplies the voices: eight synth engines and three drum engines with harmonics, timbre and morph.
  Every track has a send into Rings, in modal, sympathetic-string or string mode tuned to the last note played, then
  Rings' reverb. Buttons open pages for envelope, LFOs, arpeggiator, sequencer and effect, and the keys write steps
  after REC. Scale and root move the synth tracks onto a scale. It has eight kits named after knots and eight user
  kits that SAVE keeps, and MIDI in and out for four channels with clock. The ports are fixed-point rewrites of
  Émilie Gillet's code running at 22.05 kHz with 12 Rings partials, and the boot screen credits Gillet. The README
  and release warn that it has only been tested on a computer and in the emulator.
status: active
authors:
