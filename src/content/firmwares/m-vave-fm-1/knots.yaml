license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and the LICENSE file is the GPL-3.0 text. LICENSING.md keeps the upstream notices
  (Grids GPL-3.0; Plaits, Rings and stmlib MIT) and lists the separately licensed assets.
homepage: https://github.com/jaak-stjaaques/Knots
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Make a full backup first, then install knots_0.3.1.fwsc with M-Flasher (Install firmware, bootloader option left
  unchecked) or with tools/fm1_install.py, which asks before writing. Holding OCT- at power-on enters USB rescue, and
  the docs point to the Firmware Hub rescue guide for returning to official firmware. The README says to keep stock
  firmware or another firmware ready to flash back.
brick_risk: false
