license: GPL-3.0-only
license_notes: >-
  Each repository has its own LICENSE file with the GNU GPL version 3 text and a LICENSING.md that says the platform is GPL-3.0-only. The platform code is by Leo Kuroshita (Hügelton Instruments, Felucca) with the changes of SLOOP by isod89, Dinghy's app and wiring are by zvenson, and the KO apps are by kosmar. The Terminus font is SIL OFL 1.1. The logo of Dinghy, designburg's and not under the GPL, is in assets/ and is not part of the license. The JieLi SDK blobs that go into a package are read from the builder's SDK checkout and are not committed. The committed .fwsc files are the project's own builds, 610,131 bytes each, and are not M-VAVE stock images; restore-stock-v15.sh downloads M-VAVE's own V15 image from its file host and checks its SHA-256 before installing. The other genre repositories are ko-house, ko-hvypsy, ko-jazz, ko-idm, ko-hiphop, ko-pop, ko-funk, ko-techno, ko-triphop, ko-soul and ko-xcrash under github.com/kosmar. The GitHub license field shows GPL-3.0 and the README says GPL-3.0.
homepage: https://kosmar.github.io/ko-fm1/
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Pick a genre in the browser player and install it from Chrome or Edge over Web MIDI with SysEx, or clone a genre repository and run python3 tools/fm1_install.py dist/fm_jazz-0.1.fwsc with the package of that genre; the installer asks before it writes. The installer accepts Felucca-style packages and the stock V15 file, and the unit restarts into the new firmware. If a firmware will not start, hold OCT- while switching on for Dinghy's USB rescue, which has no sound and only the updater, and install another package from there; two crashes at boot enter it on their own. To go back to stock, each repository's restore-stock-v15.sh downloads M-VAVE's FM-1 V15 image, checks its SHA-256 and installs it. The README says installing firmware is at your own risk.
brick_risk: false
