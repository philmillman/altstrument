device: m-vave-fm-1
name: KO genre firmwares
summary: >-
  Twelve genre firmwares for the FM-1 built on one shared engine and Dinghy: DUB, HOUSE, HVYPSY, JAZZ, IDM, HIPHOP, POP, FUNK, TECHNO, TRIPHOP, SOUL and XCRASH, each with its own plates and installed as its own package.
description: >-
  The KO family is a set of groovebox firmwares for the FM-1 by kosmar, built on Dinghy. The twelve genre firmwares share one app, fm_app.c, and one plate pack format, and each build adds that genre's own configuration, plate data, sound code and screen code, so the sources differ by more than presets. Each one installs as a separate firmware with a fixed package identity, FM-1_56401 to FM-1_56412 and FM-1_56414, so the installer can tell them apart. The list is KO DUB, KO HOUSE, KO HVYPSY, KO JAZZ, KO IDM, KO HIPHOP, KO POP, KO FUNK, KO TECHNO, KO TRIPHOP, KO SOUL and KO XCRASH, whose package is named snowcrash. The project's descriptions give each its eras, for example six dub eras with SKANK presets for DUB, 60 TRAX for HOUSE, and sparse automatic fills for JAZZ. The firmwares keep Dinghy's USB update, USB rescue, USB MIDI and USB audio. Each genre has its own GitHub repository holding the same source tree and one 0.1 package in dist/, and the browser player at kosmar.github.io/ko-fm1 runs every one of them as WebAssembly. KO BASS, KO KIT and KO JET come from the same source tree and have their own entries. The README says the 0.1 files are not a fresh device pass of every genre.
