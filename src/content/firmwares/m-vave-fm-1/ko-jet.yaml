device: m-vave-fm-1
name: KO JET
summary: >-
  Work-in-progress synth and sequencer firmware for the FM-1 with its own engine, banks, preset-like patches and a new sequencer with recording; the README says it has run only in the simulator and emulator, not on hardware.
description: >-
  KO JET is a separate engine in the KO family, not a genre pack, built on Dinghy. The project describes its own banks, pseudo presets and a new sequencer, and the README marks it WIP: the sequencer and recording are new and have been tested in the simulator and emulator only, not on hardware, and breaking changes are expected. It has its own package identity, FM-1_56415, and keeps Dinghy's USB update, USB rescue, USB MIDI and USB audio. Its source is jet.c with jet_dsp.h, jet_seq.h, jet_patch.h, jet_plates.h and jet_tables.h. The repository has the whole KO source tree and a 0.1 package in dist/, and the browser player at kosmar.github.io/ko-fm1 runs it as WebAssembly. Nothing here has been confirmed on a unit.
status: active
authors:
