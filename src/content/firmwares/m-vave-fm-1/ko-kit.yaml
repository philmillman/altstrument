device: m-vave-fm-1
name: KO KIT
summary: >-
  Drum firmware for the FM-1 with sixteen synthesised drum voices, eleven performance pads, groove plates across kit eras and its own sequencer and store; it is not one of the genre packs.
description: >-
  KO KIT is its own kit and sequencer firmware in the KO family, built on Dinghy. The project describes sixteen drum voices, eleven performance pads, groove plates across kit eras, and a sequencer and store of its own. Its source is the deck.c app and the deck_*.h files. LICENSING.md says the kit is a synthesised drum kit with no third-party drum samples and no sample ROMs. It has its own package identity, FM-1_56413, and keeps Dinghy's USB update, USB rescue, USB MIDI and USB audio. The repository has the whole KO source tree and a 0.1 package in dist/, and the browser player at kosmar.github.io/ko-fm1 runs it as WebAssembly. The README says the 0.1 files are not a fresh device pass of every firmware.
status: active
authors:
  - name: kosmar
    url: https://github.com/kosmar
source: https://github.com/kosmar/ko-kit
source_status: open
license: GPL-3.0-only
license_notes: >-
  Each repository has its own LICENSE file with the GNU GPL version 3 text and a LICENSING.md that says the platform is GPL-3.0-only. The platform code is by Leo Kuroshita (Hügelton Instruments, Felucca) with the changes of SLOOP by isod89, Dinghy's app and wiring are by zvenson, and the KO apps are by kosmar. The Terminus font is SIL OFL 1.1. The logo of Dinghy, designburg's and not under the GPL, is in assets/ and is not part of the license. The JieLi SDK blobs that go into a package are read from the builder's SDK checkout and are not committed. The committed .fwsc files are the project's own builds, 610,131 bytes each, and are not M-VAVE stock images; restore-stock-v15.sh downloads M-VAVE's own V15 image from its file host and checks its SHA-256 before installing.
homepage: https://kosmar.github.io/ko-fm1/?app=deck
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install it from the browser player in Chrome or Edge over Web MIDI with SysEx, or run python3 tools/fm1_install.py dist/fm_deck-0.1.fwsc from a clone; the installer asks before it writes. The package is named fm_deck because the app is called deck in the source. If it will not start, hold OCT- while switching on for Dinghy's USB rescue and install another package from there. restore-stock-v15.sh downloads M-VAVE's FM-1 V15 image, checks its SHA-256 and installs it. The README says installing firmware is at your own risk.
brick_risk: false
