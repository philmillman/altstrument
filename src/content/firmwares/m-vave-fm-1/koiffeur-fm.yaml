  url: https://github.com/blobz1800
source: https://github.com/blobz1800/koiffeur-fm
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSE inside koiffeur-fm.zip say GPL-3.0-only, as Felucca. The GitHub repository's own top-level LICENSE file is an MIT
  text copyrighted to blobz1800 that applies to the repository wrapper, and it disagrees with the zip. The engines, hardware layer,
  fonts, icons and samples keep their own licences, listed in CREDITS.md and LICENSING.md inside the zip. The README credits the work to jemeruy.
homepage: https://blobz1800.github.io/koiffeur-fm/webapp/installer/
based_on: m-vave-fm-1/felucca
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB, or tools/fm1_install.py with the .fwsc built by the repository's
  Build Koiffeur FM workflow (the koiffeur-fm artifact). The README says the installer saves projects, sounds, samples and settings first and offers
  Return to official V15 from M-VAVE's own file; Felucca's recovery paths apply.
