device: m-vave-fm-1
name: Koiffeur FM
kind: firmware
summary: >-
  Felucca fork for the FM-1 with a frosted-glass interface, three warm colour palettes and a pixel koi pond on the home screen that drops a ripple for every note played. The sound engine is unchanged.
description: >-
  Source note: the code cannot be browsed on GitHub, because the repository commits it only as a single koiffeur-fm.zip; the
  project's own GitHub workflow unpacks that zip and builds the package the installer serves. Built on Felucca 1.8.1, so the engines, sequencer, drum grid, song mode, MIDI, USB audio and web editor are all still there. The
  GLASS style draws every screen over a water gradient with caustic light and puts frosted panels over it, leaving text, icons and gauges
  untouched, and FLAT and LINE remain in the menu. The POND home view shows three koi, lily pads and a lotus; each note drops a ripple at a
  position set by its pitch and track and a pellet of food that the nearest koi eats, and raindrops fall when nothing is played. It redraws at 15 frames
  a second while playing and 8 when idle, and an animation-off menu item stops it. The KOI, LANTERN and DUSK palettes are added to Felucca's.
  The package identity is FM-1_970, so it does not clash with Felucca's. The repository has no root README and no release; the README
  inside the zip is the project's own.
status: active
