device: m-vave-fm-1
name: KORX-M1 Hub UI
summary: Work in progress that runs the PicoFaceM1 Korg M1 engine as a WebAssembly firmware for the Firmware Hub player with a touch-style program and combination editor, plus an unflashed FM-1 build with a compressed sample bank.
description: >-
  Rights warning: the repository holds only source and no Korg data, but the .wasm and .fwsc builds it produces from your own
  M1 ROM set embed Korg's sample ROM, so such images should not be shared. The separate ROM-free .wasm release has none.

  The engine is Michi71's float re-implementation of the M1 voices, filters, envelopes and effects. The repository adds a
  Firmware Hub adapter with resampling to the host rate and a limiter, a 480 by 320 interface with page tabs, arc knobs,
  soft keys and meters for editing programs and combinations, and tools that render the screen to images and measure output
  levels. A second part ports the engine to the FM-1 with integer voices, effects and resampler and a three-bit ADPCM bank
  of 51 programs and 19 combinations; the status notes say it passes the build tool's checks but has never been flashed and
  has no interface. The README calls the project unfinished. A resampler bug that doubled playback speed was fixed on
  2026-11-07 and a tester reports the Lite build sounds much better, while the full build has not been auditioned.
  Since 2026-11-08 a ROM-free build with generated waveforms and original programs is published as a release; it plays in the Hub
  player but is not an M1 clone and has not been listened to. The
  code was written by a local language model from briefs and reviewed by an AI orchestrator, with a human tester.
status: active
authors:
