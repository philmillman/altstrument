source: https://github.com/fizzy2562/korx-m1-hub-ui
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README says the repository is GPL-3.0-or-later because src/ui/m1_params.* are copied unmodified from PicoFaceM1; the
  LICENSE file is the GPL version 3 text. The baked font is under the Ubuntu Font Licence. No Korg ROM data, firmware or
  sounds are included, and .gitignore blocks the wasm and fwsc builds, ROM archives and sample banks. THIRD_PARTY.md lists
  the engine itself as not copied.
distribution: source-only
requires_stock: Firmware Hub player or M-VAVE open firmware (FM-1 build)
install_notes: >-
  Not buildable from the repository alone. You need your own legally obtained M1 ROM set, PicoFaceM1's m1_extract tool to
  make the ROM tables and PCM, and Zig to build the engine and link the Hub .wasm. The FM-1 .fwsc has not been flashed by
  anyone; the status notes give holding OCT- while powering on as the rescue mode.
brick_risk: false
