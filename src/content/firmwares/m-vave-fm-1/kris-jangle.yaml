  url: https://github.com/doohinkus
source: https://github.com/doohinkus/kris-jangle
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSING.md puts the fm1-base platform and the app files under MPL-2.0 file by file. Parts keep their own licences: Apache-2.0 for the JieLi SDK material, BSD-2-Clause for micro-ecc, SIL OFL 1.1 for the Terminus font. The tree commits m-bootloader 1.2's installer package (web/m-bootloader/fm1-uboot-1.2.fwsc, MIT).
homepage: https://doohinkus.github.io/kris-jangle/
distribution: browser-installer
install_notes: >-
  Use the install page in Chrome or Edge with the FM-1 on USB, or download kris-jangle-0.6.fwsc from the release. The README says to back up first because firmwares share the settings sectors. The install page can also write Julius Vitkauskas's m-bootloader, which replaces M-VAVE's bootloader; that step is optional.
brick_risk: true
