device: m-vave-fm-1
name: Kris Jangle
kind: firmware
summary: >-
  Christmas carol memory game: the FM-1 plays the opening of a carol and you replay it on the keys, with three more notes each level up to the whole 32-note song.
description: >-
  Four carols (Jingle Bells, Deck the Halls, Ding Dong Merrily on High and O Christmas Tree) are chosen with SONG on the home screen. Level 1 asks for three notes and each level adds three, so level 11 is the whole song. Notes score points, a clean level adds a bonus and three misses start Grump Mode, where a recorded jeer plays before a retry. Keys sound as a sampled piano by default or as the voice picked with EDIT, and each key also goes out over MIDI. Best scores, mode and sound are saved. It is an app on the fm1-base platform with a browser emulator, an install page and a manual.
status: active
authors:
