device: m-vave-fm-1
name: LAMA FLOW
summary: >-
  Vocal-style synthesizer firmware with a monk character that shows five vowel shapes and knobs for vowel, throat, resonance and drive.
description: >-
  The screen shows a monk figure whose mouth changes for five vowels, OOO, OH, AAH, EH and EEE, with four dials for vowel,
  throat, resonance and drive. The repository holds the .fwsc package, a short README and two images, with no source code, so
  how the voice is made cannot be checked. It is the first release, version 1.0.
status: active
authors:
- name: The King Of Noise (KONStudioPro)
  url: https://github.com/KONStudioPro
source: https://github.com/KONStudioPro/LAMA-FLOW
source_status: binary-only
license: unspecified
license_notes: >-
  No licence file. The README ends with "Custom Firmware Project © 2026 The King Of Noise", a copyright notice with no terms.
homepage: https://github.com/KONStudioPro/LAMA-FLOW
distribution: download
install_notes: >-
  Download the .fwsc from the v1.0 release. The README asks you to check compatibility and back up your firmware and settings,
  and gives no install procedure of its own.
brick_risk: false
