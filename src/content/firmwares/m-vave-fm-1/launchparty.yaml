device: m-vave-fm-1
name: LAUNCHPARTY
summary: >-
  Experimental firmware that pairs playable synth sounds with interactive light shows on a Novation Launchpad
  Pro MK3, derived from Mycelium, SLOOP and Felucca.
description: >-
  Plays layered lightshow clips and keyboard-triggered overlays on a Launchpad Pro MK3 in Programmer Mode, with
  27 overlay assignments, pad effects such as rings, vortex and sparks, an Auto Party mode and live brightness,
  speed and trail controls. The FM-1 and the Launchpad are both USB devices, so it needs a computer MIDI bridge
  or an external USB-MIDI host that powers both; a passive hub is not enough. A browser companion on the
  project's site previews shows, plays them from the computer keyboard, imports and exports them, and updates the
  firmware. The public build replaces private imported shows with original procedural patterns. The README says
  that build has not been flashed or tested on hardware; an earlier 0.3.1 development version was photographed on
  a real FM-1. It is the sibling of the Mycelium firmware from the same author.
status: active
authors:
- name: megagott
  url: https://github.com/megagott
source: https://github.com/megagott/launchparty-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Firmware code is GPL-3.0-only (LICENSE, LICENSING.md); upstream notices from Mycelium, SLOOP and Felucca are
  kept. The legacy sample data is CC0 and the Terminus font is SIL OFL 1.1. Source is supplied as a zip in the
  repository.
homepage: https://mandalars.org/mandalars/launchparty/
distribution: download
requires_stock: M-VAVE FM-1 V15, or a firmware with a compatible USB updater
install_notes: >-
  Take the .fwsc from the GitHub release, check its SHA-256 against the release checksums, then install it with
  the browser updater on the project's page (Chrome or Edge) or with tools/fm1_install.py from the source zip.
  Back up work first. If USB updating stops working, recovery may need FM-1-transporter.
brick_risk: false
