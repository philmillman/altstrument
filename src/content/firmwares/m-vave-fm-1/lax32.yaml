source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md. The platform/mvave directory is from M-VAVE's FM1 Open kit: GPLv3 with M-VAVE's SDK linking
  exception, plus the binary engine library platform/mvave/sdk/lib/libfm1_engine.a under M-VAVE's terms for FM-1
  devices only. Felucca, SLOOP and Dinghy code is GPL-3.0-only, and the USB audio code ported from felucca-bsp is
  MPL-2.0 used under GPL-3.0.
  No Roland ROM or sample data was found in the repository; the sounds are parameter tables generated by tools/gen_timbres.py.
homepage: https://pjac1810.github.io/lax32/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Open the project page in Chrome or Edge with the FM-1 on USB and use its Install tab, or run tools/fm1_install.py with
  the .fwsc; build it with the repository's GitHub workflow or with Docker (./fm1 build). Hold OCT- at power-on for the
  rescue mode, where the page's Rescue tab puts M-VAVE's V15 back from a file you download from M-VAVE. The README says
  installing unofficial firmware is at your own risk.
brick_risk: true
