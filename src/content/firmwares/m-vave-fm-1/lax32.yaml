device: m-vave-fm-1
name: LAX-32
summary: >-
  Multitimbral LA-style sound module after the Roland MT-32: 8 parts plus rhythm on MIDI, 128 synthesized sounds in MT-32
  order, 30 drums, reverb, a per-part arpeggiator and a 6-track sequencer.
description: >-
  The parts sit on MIDI channels 2 to 9 with rhythm on 10, so music written for the MT-32 lands on the intended instrument
  type at each program number. Each sound combines one or two partials, an attack partial and a sustained one through a
  resonant filter, and the engine runs at 22 kHz for a darker tone. The screen copies the 20-character LCD with its MIDI
  message lamp, and the reverb has four modes. Version 0.2 adds a 14-mode arpeggiator per part and a 6-track 64-step
  sequencer modelled on Skiff's. The README (in French) and release notes say no Roland sample or ROM is used, that the
  sounds are approximations and that the project is independent of Roland and M-VAVE. It is built on konsumer's foma
  framework.
status: active
