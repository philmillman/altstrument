homepage: https://devrvega.github.io/LCD-4/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py from the release package. The installer
  has a Back to the stock firmware option, which asks you to download M-VAVE's own V15 file from M-VAVE and
  select it; M-UPGRADE also restores stock. An FM-1 that fails to start twice boots into a safe mode the
  installer can reach. Browser emulator on the project site.
brick_risk: false
