device: m-vave-fm-1
name: LCD-4
summary: >-
  Four-track groovebox with one drum track and three synth tracks, 16-step patterns with chaining, chords,
  parameter locks and 16 punch-in effects; each sound has a small animated LCD-style scene on screen.
description: >-
  Drums come in four kits of eleven parts (808, 909, arcade and rhythm box), played from the black keys with
  the white keys as steps. Sixteen circuit-modelled synth sounds cover basses, keys and leads, and any synth
  track can load any of them. It has 16 patterns chained up to 64 steps, live and step recording, slides,
  ratchets and swing, four demo songs, MIDI in and out and MIDI clock. It is built on IND-1 and AMB-1, which
  take their platform layer from Felucca, and shares its settings area with those firmwares, so the first save
  can replace data they stored.
