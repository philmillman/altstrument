device: m-vave-fm-1
name: LEDGER-4
summary: >-
  Tracker for the FM-1 in the style of Little Sound DJ and the Dirtywave M8: song, chain and phrase pages with 13 per-
  row commands.
description: >-
  The song is 64 rows by 4 tracks of chain numbers, with each track walking its own column. A chain is 16 rows of
  phrase and transpose, and a phrase is 16 rows of note, instrument, velocity, command and value. The 13 commands are
  arpeggio, chance, delay, kill, retrigger, slide, tempo, hop, filter, MIDI CC, random, groove and echo, each
  explained on the line under the grid. Grooves are two tick counts per row, as in LSDJ. There are 16 instruments
  (synth, drums or MIDI only), copy and paste, and phrase transpose. The 16 white keys type hex digits in number
  columns. It has its own 8-voice synth and drums, sends MIDI over USB and Bluetooth, and can send or follow MIDI
  clock. The README names Little Sound DJ, the Dirtywave M8 and Renoise as the models.
status: active
authors:
