device: m-vave-fm-1
name: LILA
summary: >-
  Polyphonic toy synth for a very young child: 25 animated worlds, each its own instrument and picture (animals, a
  spaceship, a robot, eight playable instruments), plus five spoken French stories played by the synth. Built on fm1-tribe.
description: >-
  Underneath it is a normal ten-voice synth with two oscillators and a sub, an FM partner, filter, envelope, LFO and
  echo, reverb, chorus and a crusher. On top are 25 worlds, each with its own knobs and an animated picture that
  changes with whatever is turned: more echo leaves ghosts, the size knob grows the animal, the robot knob makes big
  pixels. Twelve are animals and places (bird, cow, wolf, frog, a spaceship, meteors, blocks, dinosaurs, a robot, a
  whale, a fairy castle, an elephant), eight are instruments whose keys light up on screen (piano, electric piano,
  organ, xylophone, harp, ukulele, flute, kalimba) and five are stories. A mood switch sets sunny, night, magic or
  crazy. The stories are three La Fontaine fables, Goldilocks and Little Red Riding Hood, told in French by speech stored
  as LPC data and played through the synth, so its filter and effects still apply. Other pages give an arpeggiator, a
  drum beat, nineteen traditional songs that light the keys to follow, a recorder that loops a tune at another speed and
  a setting that dims or turns off the screen. The hardware layer comes from fm1-tribe by the same author, and the
  README says LILA had not been run on a real FM-1 yet.
status: active
authors:
- name: apiel
  url: https://github.com/apiel
source: https://github.com/apiel/fm1-lila
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for LILA and the fm1-tribe, X0X and Felucca code under it. The story speech was made
  with the Piper voice fr_FR-siwis-medium, trained on the SIWIS French corpus (CC BY 4.0, credited there); the songs are public domain traditional tunes, and sounds and pictures are generated by code. Fonts are SIL OFL 1.1.
homepage: https://github.com/apiel/fm1-lila
distribution: download
install_notes: >-
  Install dist/lila-1.3-beta.fwsc from the repository, or build lila.fwsc, with tools/fm1_install.py or tools/flash.sh,
  which first checks that an FM-1 answers and writes nothing without --yes. The README says installing is at your own
  risk and BUILDING.md says that a unit that only reaches the chip's update mode can be put back with the rescue tool.
brick_risk: false
