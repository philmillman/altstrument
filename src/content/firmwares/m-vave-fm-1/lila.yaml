device: m-vave-fm-1
name: LILA
summary: >-
  Polyphonic toy synth for a very young child: twelve animated worlds (animals, a spaceship, dinosaurs, a robot), each
  its own instrument and picture, plus two spoken stories played by the synth. Built on fm1-tribe.
description: >-
  Underneath it is a normal ten-voice synth with two oscillators and a sub, an FM partner, filter, envelope, LFO and
  echo, reverb, chorus and a crusher. On top are twelve worlds, each with its own knobs and an animated picture that
  changes with whatever is turned: more echo leaves ghosts, the size knob grows the animal, the robot knob makes big
  pixels. A mood switch sets sunny, night, magic or crazy. Two story worlds spread a tale across the keys, in French
  (an original story) and English (a Goldilocks retelling), with the speech stored as LPC data and played through the
  synth so its filter and effects still apply. Other pages give an arpeggiator, a drum beat, twelve traditional songs
  that light the keys to follow, a recorder that loops a tune at another speed and eight places for favourite sounds. The
  hardware layer comes from fm1-tribe by the same author, and the README says LILA had not been run on a real FM-1 yet.
status: active
authors:
- name: apiel
  url: https://github.com/apiel
source: https://github.com/apiel/fm1-lila
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for LILA and the fm1-tribe, X0X and Felucca code under it. The story speech was made
  with Piper voices trained on the LJ Speech dataset (public domain) and the SIWIS French corpus (CC BY 4.0, credited
  there); the songs are public domain traditional tunes, and sounds and pictures are generated by code. Fonts are SIL OFL 1.1.
homepage: https://github.com/apiel/fm1-lila
distribution: download
install_notes: >-
  Install dist/lila-1.2-beta.fwsc from the repository, or build lila.fwsc, with tools/fm1_install.py or tools/flash.sh,
  which first checks that an FM-1 answers and writes nothing without --yes. The README says installing is at your own
  risk and BUILDING.md says that a unit that only reaches the chip's update mode can be put back with the rescue tool.
brick_risk: false
