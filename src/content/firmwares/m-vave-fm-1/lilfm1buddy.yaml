device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: lilfm1buddy
kind: tool
summary: >-
  Tiny ESP32-S3 board that plugs into the FM-1's USB port and lets you pick a firmware or backup on the FM-1's own screen to
  install, without a computer, and can route MIDI between devices on a hub.
description: >-
  The board is the FM-1's USB host. On a button press it puts the FM-1 into its chip's ROM boot loader, loads a small menu program
  into the FM-1's RAM, shows the list of .fwsc packages and flash backups kept on the board and writes the chosen one, changing
  only the sectors that differ above the boot head. The board's flash appears as a USB drive named LILBUDDY for adding packages, a
  loader file and a theme, and a web page installs the board's own program. It also handles the SMK-37, which uses the same chip,
  keeps each image to its own device kind and never writes an SMK-37's calibration data. Its own flash loader, taken from m-bootloader,
  writes and reads the flash and draws it on the FM-1's screen as 16 by 16 sectors while it works, and the INFO button shows the chip. Optional MIDI routing and Bluetooth MIDI
  follow the rules of fm1buddy. The README reports fomajam and Baud Girl installed from the FM-1's menu on 2026-10-30. No firmware
  is bundled.
status: active
authors:
- name: David Konsumer (konsumer)
  url: https://github.com/konsumer
source: https://github.com/konsumer/lilfm1buddy
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says the rest is GPL-3.0, like fm1buddy, whose LICENSING.md names GPL-3.0-only. Files taken from felucca-bsp stay
  MPL-2.0. The flash loader in loader/ is m-bootloader's code under MIT, with that licence file beside it; the board no longer uses JieLi's wl82loader.bin.
homepage: https://konsumer.js.org/lilfm1buddy/
distribution: browser-installer
install_notes: >-
  Needs an ESP32-S3 board with PSRAM, such as a Seeed XIAO ESP32S3 Plus, and optionally a small LiPo. Install the board's program
  from the web page in Chrome or Edge, copy .fwsc files and the loader onto the LILBUDDY drive, then plug it into the FM-1 and press
  BOOT. The README says only the image area from 0x4000 is written and the ROM boot loader cannot be broken by it, but a write still
  replaces the running firmware, so make a backup first.
brick_risk: false
tags: [flasher, loader, usb-midi, midi]
versions:
