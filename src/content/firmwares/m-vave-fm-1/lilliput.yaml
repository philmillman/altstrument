device: m-vave-fm-1
name: Lilliput
summary: >-
  No-input mixer for the FM-1: six channels that feed back into themselves and each other through tube, op-amp, filter and limiter models and a seven-slot effects rack, with 25 patch recipes and large high-contrast screens.
description: >-
  Models a mixing desk with nothing plugged in, after Igor Vasiliev's NoInputMixer app, written anew in fixed point for the FM-1. Each of the six channels has an input selector, a noise source, a tube stage, an op-amp stage with overload protection, shelves or cuts, a peak, notch or band-pass filter, a brickwall limiter whose look-ahead sets the pitch of the loop, two sends, level and pan. The effects rack has seven slots (delay, flanger, chorus, tremolo, formant, bitcrusher and glitch), and the output has an equaliser, an insert and a six-space reverb. HOME draws a new patch from one of 25 recipes, every channel has two LFOs and four modulation slots, and a gesture looper, a rhythm generator and a four-voice drum section run beside the mixer. Sessions, snapshots and MIDI CCs are supported, and USB audio carries the output or six channels. It is built from Tonitor and from Felucca and SLOOP code; none of Tonitor's sound engine is in it. The screens use very large type for low vision. The README says its sound and screens were tested on a computer and that its load on the FM-1 had not been measured. The project site has a browser installer.
status: active
