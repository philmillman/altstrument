source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only for the firmware and LICENSE is the GPL v3 text. The documentation text is MIT, the two bundled fonts are SIL OFL 1.1, and the JieLi SDK files the package needs are read from the builder's own SDK checkout and are not in the tree. The repository commits built .fwsc packages, which are the author's own builds.
based_on: m-vave-fm-1/tonitor
homepage: https://nzimas.github.io/lilliput/
distribution: browser-installer
install_notes: >-
  Use the project's browser installer in desktop Chrome, Edge or Opera over USB, or run ./install.sh from a source checkout; it installs over M-VAVE's firmware, Tonitor, Bigorna or another custom firmware. Hold OCT- at power-on for USB rescue mode and install again; two failed starts also enter it, and OCT- with OCT+ held for 5 seconds enters the chip's own updater. Sessions are kept in the flash area that Tonitor, Bigorna and SLOOP use and going back to Tonitor erases them. The README names FM-1-transporter for a unit that no longer starts.
brick_risk: false
