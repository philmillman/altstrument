device: m-vave-fm-1
name: LOAF BREAKER
summary: >-
  Hardcore and breakcore break chopper for the FM-1 built on CHOPPAH: nine breaks cut into sixteen slices, a kick synth
  with its own menu, a sequencer with per-step conditions, tracks with builds and drops, and a master effects chain.
description: >-
  Rights warning: three of the nine built-in breaks are two-bar cuts of commercial records, Lyn Collins's "Think (About
  It)", the Incredible Bongo Band's "Apache" and Jimmy McGriff's "The Worm". The repository's breaks folder says their
  rights belong to the labels and artists and that the owner chose to publish them. The other six are Cyberworm's
  royalty-free Amen loops.

  Keeps CHOPPAH's layout: a break cut into sixteen slices on the white keys, effect pads on the black keys, a pattern
  generator, a four-slot master effects chain and 64 patterns. The kick has its own menu and synth with pitch drop,
  distortion, a rawstyle reverse bass, its own EQ and effects and ten memories. The sequencer runs the kick over 16, 32
  or 64 steps with a note, number of hits, condition and nudge on each step. Tracks chain patterns with loops and per-item
  breaks, and builds lead into a drop. A mix page has a compressor, ducking and a limiter, and the screen can show the
  mix scrolling past as a DJ player does. Panel pages come in tutorial, beginner and expert modes. The firmware has no
  Bluetooth, and its breaks are built in, so you cannot load your own. A browser emulator, an installer page and a manual
  are published on the project site. The README calls it a 0.2xx beta on the way to 1.0, and every push to the loaf
  branch is released.
status: active
authors:
- name: FLEXOR
  url: https://github.com/FLEXOR-R
source: https://github.com/FLEXOR-R/loaf-breaker
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSE is the MPL-2.0 text and the README gives the same licence, as CHOPPAH has. The three commercial breaks in
  breaks/classics/ are not covered by it (breaks/README.md). No M-VAVE stock image is bundled; the release .fwsc files
  are LOAF BREAKER's own builds.
homepage: https://flexor-r.github.io/loaf-breaker/
based_on: m-vave-fm-1/choppah
distribution: browser-installer
requires_stock: M-VAVE stock firmware or another fm1-base / Felucca build; not FM1 Open
install_notes: >-
  Use fm1-base's web installer on the project site (Chrome or Edge, FM-1 on USB) or run tools/fm1_install.py with the
  loaf-breaker-X.YY.fwsc from a release. An FM-1 running M-VAVE's FM1 Open only accepts M-VAVE's own packages, so put
  M-VAVE's stock firmware back first. The README says the installer can put M-VAVE's firmware back, and an FM-1 that
  fails to start twice comes up in a safe mode the installer can still reach.
brick_risk: false
