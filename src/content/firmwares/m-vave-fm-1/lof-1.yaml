device: m-vave-fm-1
name: LOF-1
summary: >-
  Experimental lofi groovebox: you play the lead on the keys and a jazz band follows, with a ghost lead when you
  stop, an answering voice, drums and a record, cassette, reel or radio texture; tested only in a simulator.
description: >-
  The engine picks out the chord your notes imply and moves the comp, bass and drums with it on the beat. It has
  twenty lead instruments, a drum sequencer on a sampled or synthesized kit, FX played from the keys with locks,
  ten presets, MIDI clock in and notes out, and five screen themes drawn like an old television. It lives in the
  lof1/ folder of the HYP-1 repository and is a fork of AMB-1 by way of HYP-1. The README says it has been built
  and tested in the simulator and browser emulator only and is numbered 0.x until it runs on a real FM-1. The
  sampled instruments are CC0 libraries.
status: active
authors:
- name: RedtailWorks
  url: https://github.com/RustyPawz
source: https://github.com/RustyPawz/fm1-HYP1/tree/main/lof1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in lof1/LICENSING.md. The platform layer is Felucca's by way of X0X and FoMni and the sound code is
  AMB-1's. Sampled instruments are CC0 1.0 and fonts are SIL OFL 1.1.
homepage: https://rustypawz.github.io/fm1-HYP1/lof/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or build from the folder (BUILDING.md). The README says it is
  untested on hardware and that HYP-1 or M-VAVE's firmware goes back on the same way. The installer can write
  M-VAVE's V15 back from a file you download yourself.
brick_risk: false
