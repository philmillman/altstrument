device: m-vave-fm-1
name: LOFI RADIO
summary: >-
  Self-playing lo-fi hip-hop firmware for the FM-1 that generates tracks with jazzy keys, swung drums and vinyl crackle, shown as a turntable with a spinning record.
description: >-
  Each generated track has its own key, tempo between 70 and 90 BPM, groove and title, with jazzy seventh and ninth chords on a Rhodes, Wurlitzer or felt piano, swung boom-bap drums, a round bass and now and then a muted lead or vibraphone melody. Vinyl crackle, tape wobble and a low-passed warmth sit over everything, and every few minutes the track fades, the needle runs out and the next record starts. The screen shows a turntable whose record changes label colour each track, with a tonearm, VU meter, track name, time and current chord. Fourteen styles each keep their own settings, EDIT calls the next track and REC keeps the current one playing. A 1.1 release was published and then reverted, so 1.0 is the current release.
status: active
authors:
- name: ashtonwallen
  url: https://github.com/ashtonwallen
source: https://github.com/ashtonwallen/fm1-firmware/tree/main/lofi-radio
source_status: open
license: MPL-2.0
license_notes: >-
  The folder's LICENSING.md and LICENSE give MPL-2.0 file by file, with AMB-1's and fm1-base's notices kept on the files
  that came from them. The Barlow Semi Condensed and Terminus fonts are SIL OFL 1.1 and the JieLi SDK files are read from
  the builder's checkout.
based_on: m-vave-fm-1/amb-1
distribution: download
install_notes: >-
  Download the .fwsc from the release and write it with M-Flasher or the FM-1 Flasher in the same repository, which backs up the whole flash first and keeps the bootloader untouched. The release says it is built on fm1-base 3ae2a65, which supports both flash chips, and has not been played on real hardware.
brick_risk: false
