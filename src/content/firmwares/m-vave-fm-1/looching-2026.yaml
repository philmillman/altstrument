distribution: download
install_notes: >-
  Install looching2026-1.0.fwsc with tools/fm1_install.py (Python with mido and python-rtmidi) or the web installer in the repository, and check the file against SHA256SUMS. The README says there is one firmware bank and no recovery button, but the platform's boot guard drops the unit into the chip's boot mode after two failed boots (OCT- and OCT+ held for 5 s does it on purpose), and the update path stays available while the firmware runs. To go back, run fm1_install.py --stock, use the installer's Return to official V15 or use M-VAVE's own updater. It lists FM-1-transporter as optional recovery hardware.
