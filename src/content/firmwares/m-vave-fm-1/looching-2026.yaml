device: m-vave-fm-1
name: Looching 2026
summary: >-
  Revival of Brad Garton's 1991 NeXT drone generator Looching: four slow wavetable voices on a lazy random scheduler, five tone rows, and a mode that keeps the original program's quirks.
description: >-
  Four voices each use two 64-sample wavetable oscillators with seven partials, the second detuned by a spread, each with its own sine vibrato, a very slow envelope and a short delay on the right channel. A scheduler wakes every 2 to 10 seconds and each free voice starts a note about half the time, with a random wave, a random pitch from the chosen tone row and a length of 5 to 20 seconds. There are five tone rows, the Original in just intonation, morning stuff, the Big Drone, Schoenberg and Bach. ORIGINAL mode keeps the bugs of the 1991 code that shaped its sound, and INTENDED plays what the code meant. Three knobs set vibrato rate limit, vibrato width limit and frequency spread, and the keys play nothing but light up with the pitches sounding. The wavetables, tone rows and icon come from the original with Garton's agreement. It speaks every page and control through fm1-reader, sends the voices as MIDI notes with pitch bend and the panel as CC and NRPN over USB, and has a device file for synthaccess MIDItoSpeech. It has no MIDI input. The README says it runs on a real FM-1, and it is built on the Felucca platform as M-Vave-OP1 carries it.
