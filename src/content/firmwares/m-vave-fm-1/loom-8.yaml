device: m-vave-fm-1
name: LOOM-8
summary: >-
  Groovebox in the manner of the OP-XY: eight instrument tracks over synth engines, a sampler, a break slicer and a
  drum kit, a 64-step sequencer with step tricks, weave, a chord conductor, throws, scenes and a song.
description: >-
  The repository is fm1-loom, its GitHub description and design notes call the project XY-1, and the README and
  licence file call it LOOM-8. It is a separate project from Loom FM-1 by Co-oscillator. Eight tracks each get a colour and an
  instrument, with seven synth engines (one is acid, a TB-303), a sample player, a break slicer, a drum kit with 909 models and MIDI out. The sequencer has
  parameter locks and step tricks, players (arpeggiator, strum, hold) and weave, which crosses two patterns bar by
  bar, step by step, or one's rhythm with the other's notes. A conductor track moves the song through a chord
  progression, throws are momentary effects, and there are two send-effect tracks (one reverb has the PlayStation
  reverbs among its modes), a mixer with EQ, a master compressor, scenes and a song. Projects and presets can be
  backed up to a computer, and user samples load from WAV files with a script. It also does Bluetooth MIDI,
  Bluetooth audio output to headphones or speakers, and USB MIDI host. It is built on the author's
  fm1-base platform repository (a git submodule) and has a browser emulator and a long manual.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-loom
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states that LOOM-8 as a whole is GPL-3.0-only: the acid engine and the 909 kit models are
  GPL-3.0-only and most other files are MPL-2.0 file by file, as are the fm1-base and felucca-bsp submodule files. The Braids engine ports, the PlayStation reverb port and the supersaw bank are MIT, the
  fonts are SIL OFL 1.1, and the package uses three Apache-2.0 JieLi AC79 SDK files at build time.
homepage: https://charlesvestal.github.io/fm1-loom/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge with the FM-1 on USB, or download the .fwsc from the releases page. The README
  says the web installer can put M-VAVE's firmware back and that a firmware which keeps crashing starts in a safe
  mode. To build it yourself, clone with git submodules and run ./build.sh (BUILDING.md; the JieLi toolchain runs
  in Docker on a Mac).
brick_risk: true
tags: [groovebox, sequencer, sampler, synth-engine, drums, chords, fx, arpeggiator, emulator, midi]
image:
  url: https://raw.githubusercontent.com/charlesvestal/fm1-loom/main/docs/img/screen-beat-playing.png
  alt: "LOOM-8 Steps page on the T1 kit, playing: sixteen step cells with kick marks on steps 1, 5, 9 and 13, a pattern, length, scale and groove knob strip below and two hint lines"
  credit: Charles Vestal
  source_url: https://github.com/charlesvestal/fm1-loom/blob/main/docs/MANUAL.md
  first_party: true
versions:
- version: 0.12.1
  date: 2026-11-01
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.12.1
  notes: Acid's filter cutoff now reaches down to 60 Hz, so acid tracks below the knob's middle sound darker than before; adds a ping width setting to the delay and fixes the install page. Projects saved by 0.12.1 do not open in 0.12 or earlier.
- version: '0.12'
  date: 2026-11-01
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.12
  notes: Adds the acid engine (a TB-303), 909 kit models, a random player, harmony following, large type and an endless setting for relative CC encoders; fixes USB audio on macOS 15. Projects and backups from 0.11 load as they were.
- version: '0.11'
  date: 2026-10-29
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.11
  notes: Fixes a sample change that could silence a looping sample track, adds a held solo on the Mix page, an on-note count-in for REC, and makes the black-and-white theme the default.
- version: '0.10'
  date: 2026-10-29
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.10
  notes: Each drum sound on a kit step gets its own chance and step tricks, so a snare can flam while the kick on the same step plays plainly; projects from earlier versions load as they were.
- version: 0.9.3
  date: 2026-10-27
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.9.3
  notes: Holding several steps on the Steps page and turning a knob, pressing a black key on a kit or opening a lock page now edits all of them at once; a note is stretched by holding a step and tapping a later one.
- version: 0.9.2
  date: 2026-10-27
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.9.2
  notes: On a kit, COPY KEY and PASTE KEY are renamed COPY DRUM and PASTE DRUM.
- version: 0.9.1
  date: 2026-10-27
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.9.1
  notes: Adds copy-to-empty-pattern, shift notes, rotate, clear bar, copy and paste of sounds and scenes, slot duplication and a separate Setup list; SEL lists open on the last-used row.
- version: '0.9'
  date: 2026-10-26
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.9
  notes: Adds Bluetooth audio to headphones and speakers alongside Bluetooth MIDI, on an open Bluetooth stack with no JieLi Bluetooth code, and gives more macOS versions the USB audio device. Devices paired with 0.8 must be paired again.
- version: 0.8.1
  date: 2026-10-26
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.8.1
  notes: Gives each FM-1 its own Bluetooth name so two units can be told apart, and makes the samples page find the unit on Windows and when another app holds a MIDI port.
- version: '0.8'
  date: 2026-10-25
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.8
  notes: Adds Bluetooth MIDI, USB MIDI host, a MIDI track engine, a flam step trick and a choice of internal, receive or send clock.
- version: '0.7'
  date: 2026-10-24
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.7
  notes: Adds ten drum models, nine factory kits and eight user kits; the four factory breaks are no longer built in and are added back from the samples page.
- version: 0.6.1
  date: 2026-10-22
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.6.1
  notes: Adds chord entry on the Steps page and a black-and-white theme, plus fixes to mute-key lighting and a drum pad that stayed lit.
- version: 0.6-beta
  date: 2026-10-21
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.6-beta
  notes: Adds 32 scenes, a shared LFO and fixed MIDI channels per track; projects saved by 0.6 do not open in older versions.
- version: 0.5.4-beta
  date: 2026-10-20
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.5.4-beta
  notes: Undo and redo now cover sound edits, the song, scenes and record takes as well as pattern edits.
- version: 0.5.3-beta
  date: 2026-10-19
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.5.3-beta
  notes: Holding REC while turning a knob during playback records the knob motion onto the steps.
- version: 0.5.2-beta
  date: 2026-10-19
  url: https://github.com/charlesvestal/fm1-loom/releases/tag/v0.5.2-beta
  notes: New kits start drier, with only the clap and the fm key sending to the reverb.
