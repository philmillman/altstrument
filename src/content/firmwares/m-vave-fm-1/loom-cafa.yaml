device: m-vave-fm-1
name: Loom CAFA
kind: tool
summary: >-
  Experimental fork of the Android app LOOM Groovebox that uses an FM-1 running Windjammer as its controller, display and USB audio output, with the eight LOOM tracks selectable from the FM-1.
description: >-
  The phone keeps running LOOM's synth engines, sampler, effects and sequencer, and the FM-1 shows the active tracks and sounds and plays and edits them from its panel. The FM1 LINK screen in the app selects the FM-1's USB MIDI endpoint and its USB audio output, and the link uses a session with acknowledged state and a lease that mutes the sound when the connection fails. The ALGORITHM encoder picks tracks 1 to 8, the keys play the selected engine, and white keys toggle steps in the selected 16-step bank. The README calls it a prototype that does not yet reproduce Skiff's native screens, so recording, arpeggiator, sample, effect and preset work stays on the phone. The app installs next to ordinary LOOM. This is a different project from Loom FM-1, the firmware by the same upstream author. The FM-1 side of the work lives on the release tag and the cafa/ branches, while the default branch still matches upstream LOOM.
status: active
authors:
