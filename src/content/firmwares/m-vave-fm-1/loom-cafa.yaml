  url: https://github.com/Co-oscillator
source: https://github.com/osleg/loom-groovebox
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md is the GPL version 3 text with a notice naming R Daniel Miller, and the FM-1 companion files carry a GPL-3.0-only SPDX header; GitHub reports the repository as NOASSERTION. Engines under instrument-demo keep their own notices, among them GPL-3.0, MIT, BSD, Apache-2.0 and CC-BY licences.
distribution: download
requires_stock: Windjammer
install_notes: >-
  Install the signed APK from the release on an Android 8.0 or newer phone. For the FM-1 link, flash Windjammer v0.9.0 on the FM-1 with its web installer and connect the phone by a USB data cable. An older development build of the same app must be uninstalled first, which removes its data, so copy projects and recordings out first. The app writes nothing to the FM-1.
brick_risk: false
