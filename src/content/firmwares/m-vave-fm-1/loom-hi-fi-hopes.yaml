device: m-vave-fm-1
name: Loom (Hi-Fi-Hopes)
summary: >-
  Wavetable groovebox test build on fm1-base: a six-voice dual-wavetable synth, four synth drums and a pattern and song sequencer, so far run only in the simulator and browser emulator.
description: >-
  Source note: the README calls this a test build 0.1 that runs in fm1-base's host simulator and browser emulator and has not been built for or run on a real FM-1, and says not to flash it.
  The synth track has six voices, each with two wavetable oscillators over six tables of eight frames with position and warp (sync, bend, PWM, mirror and FM from the other oscillator), a sub, noise, drive, a multimode filter, two envelopes, glide and an LFO. Four synth drums (kick, snare, hat and metallic percussion) have tune, decay, tone and level. The sequencer holds eight patterns of up to 16 steps over five tracks with live recording, two parameter locks per step, swing, mutes and pattern copy, plus a song of up to 16 slots, 16 factory synth presets that can be saved over, and several live visuals. Unison, a mod matrix, effects and wavetable import are listed as not done yet. It is a different project from Loom FM-1 and LOOM-8, which are built on Felucca.
