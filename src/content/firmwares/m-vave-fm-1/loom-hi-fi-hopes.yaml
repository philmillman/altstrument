install_notes: >-
  Clone with --recursive and build with fm1-base's tools/build.py: --host for the simulator, --web for the browser emulator, which needs emcc. A package for the FM-1 needs JieLi's toolchain. The README says to back up the whole flash with M-Flasher before flashing anything and not to flash this build yet. It documents no recovery steps of its own.
