device: m-vave-fm-1
name: Loom FM-1
summary: >-
  Felucca fork that turns the FM-1 into a five-track groovebox: four synth or sampler tracks plus a drum track,
  fourteen engines, a 64-step sequencer and a chord progression generator.
description: >-
  Engines include subtractive, wavetable, six-operator FM, granular, tape-scrub and slicing samplers,
  physical modelling, formant, organ, chiptune, noise and drums. The sequencer has step and pattern views in
  4x4 and 8x8 layouts with swing, humanize and parameter locks, and there is a ten-mode arpeggiator,
  assignable performance macros and drum-triggered sidechain ducking. The repository also carries Felucca's
  web editor and browser emulator sources. Much of the README is Felucca's own documentation.
status: active
authors:
- name: Daniel Miller (Co-oscillator)
  url: https://github.com/Co-oscillator
source: https://github.com/Co-oscillator/Loom-FM-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md, inherited from Felucca. Ported DSP, fonts and the Apache-2.0 SDK boot files keep their
  own licences (LICENSES/).
distribution: download
install_notes: >-
  Download loom-groovebox.fwsc from the release (identity FM-1_985) and install it with tools/fm1_install.py, or
  with the web installer in the repository's web/ folder, which has no hosted page. The README describes a
  return to official firmware through the installer and a USB boot mode recovery with an external programmer.
brick_risk: false
