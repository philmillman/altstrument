device: m-vave-fm-1
name: LOOPHEADS
summary: >-
  Four-tape note looper for the FM-1: each tape loops at its own length and plays through its own Karplus-Strong string, tube or blow voice, with scales, an arpeggiator, delay, hall and snapshots.
description: >-
  Each of the four tapes records notes, takes overdubs and has its own length, volume, pan and mute, so the loops drift in and out of alignment. The voices are Karplus-Strong physical models in string, tube and blow types with selectable pings, an envelope and an LFO per tape. A global scale can be changed after recording, momentary transposition and one-shot strums are available, and Memory Leak fades recorded notes away one by one. A 12-bit, 20 kHz delay and a hall reverb are built in, and snapshots recall whole states during playback. The release notes say version 0.1.2 passed the host tests and simulated installer checks but has not been installed on a physical FM-1. It is built on Dinghy and takes its tape timing from the earlier LOOPHEAD engine.
