install_notes: >-
  Install loopheads_0.1.2.fwsc from the release with M-Flasher, leaving the bootloader option unchecked, or with tools/fm1_install.py over USB. BUILDING.md says to make a full recovery backup first and check that the recovery tool can open it. Installation and recovery on a physical FM-1 are unverified.
