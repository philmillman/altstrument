  A package carries three JieLi SDK files under Apache-2.0, so LICENSES/Apache-2.0.txt has to ship with it.
distribution: source-only
install_notes: >-
  Build with tools/build.sh --board fm1, which produces build/fm1/lorcha-fm1.fwsc, then install the package the way felucca-bsp's tools do. It is unofficial and has no
  prebuilt release. Going back needs felucca-bsp's fm1_rescue.sh.
