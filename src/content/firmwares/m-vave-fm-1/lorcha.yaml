device: m-vave-fm-1
name: Lorcha
summary: >-
  Small on-screen hardware checker for felucca-bsp: shows the keys, buttons and knobs as they are used, steps the LEDs through brightness levels, plays a test tone and shows USB and MIDI state.
description: >-
  Not an instrument and with no update entry of its own. Each of the 14 buttons has a cell, the 27 keys a strip with each sending a USB MIDI note
  on channel 1, and the encoders, MASTER pot and battery are shown as counts and bars. REC steps every LED through off, 3%, 15%, breathing and full, PLAY toggles a 440 Hz sine at
  -12 dBFS, and the screen reports whether USB enumerated and counts MIDI in and out. The same source also builds for the SMK-37 Pro and Elite and for the
  Pocket AMP, but the FM-1 is the target and the other two are only built. The SMK-37 loader cannot be built from felucca-bsp as it stands, so the repository carries a patch for that. To leave it, a SysEx soft
  key or two quick boots return to the ROM boot mode, and then felucca-bsp's rescue script puts stock firmware back. It cannot be replaced
  over M-UPGRADE directly. Building needs the JieLi pi32v2 toolchain on Linux x86-64, the AC79 SDK and Docker.
