device: m-vave-fm-1
name: L/RRY
summary: >-
  Stereo-field morphing synth from the author of DUELL: every voice has two oscillators, a sub, noise and ring mod, two filters and two dirt stages, each with its own left-right pan, plus morphing between two versions of a sound.
description: >-
  Each note runs through one stereo chain. Two oscillators have eight models each (saw, triangle, sine, pulse, sync, a supersaw, FM and wavefold), and a sub, noise and ring modulation sit beside them. Every source has its own level, pan and filter balance. A multi filter and a twin filter run in series or parallel, two dirt stages follow, and an 8-slot mod matrix can reach every pan. MORPH glides between a patch and a randomised version of it. Other parts are chord strum, an arpeggiator, a 64-step sequencer with parameter locks, velocity and aftertouch, a chorus, a four-mode delay and six reverbs, and 128 patches. Both cores of the FM-1 play voices. The project site has a browser emulator, an installer and a web editor with a patch librarian. The author says the synth began on a Teensy before the FM-1 port and has run on one FM-1, the author's own. It is a first public beta, and until 1.0 the format of saved patches and settings may change. The name and logo artwork are reserved by the author and are not under the GPL.
