homepage: https://oscillr.github.io/LRRY/emu/
based_on: m-vave-fm-1/duell
distribution: browser-installer
requires_stock: V15 or another custom firmware
install_notes: >-
  Use the installer page at oscillr.github.io/LRRY/install/ in Chrome or Edge with a data USB cable plugged straight into the computer, save a backup first and do not unplug during the write. Its Return to official V15 and M-VAVE's own updater go back; M-VAVE's firmware is not distributed here. The README warns that the FM-1 keeps a single copy of its firmware and that backups from one beta may not restore in the next. The package is lrry-0.1.0-beta.fwsc, with a SHA-256 on the release page.
brick_risk: false
