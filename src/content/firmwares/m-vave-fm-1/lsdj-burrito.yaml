device: m-vave-fm-1
name: LSDJ Burrito
summary: >-
  Runs Little Sound Dj on the FM-1 from its keys and knobs, with per-channel effects, a master echo and compressor,
  MIDI sync and themes. You bring your own LSDj ROM; a web page builds the firmware around it.
description: >-
  Built on GameDude's Game Boy emulator and the Felucca hardware layer, with the games loader, website and
  Bluetooth removed. The FM-1's keys and knobs play and edit LSDj, and note mode and incoming MIDI notes reach it as
  keyboard input. It adds per-channel filters (including notch and 24 dB low-pass), drive, lo-fi and an LFO to
  cutoff, volume or pan, a shared echo with a compressor, MIDI clock in and out, MIDI notes and control changes,
  colour themes, and a mirror of the unit's screen on the web page. The release file contains no LSDj: installed
  as it is, the FM-1 shows a splash saying that no LSDj is present and waits for an update. The project page asks for
  your own lsdj.gb, checks it and builds the firmware in the browser, so the ROM stays on your computer; installed
  LSDj can also be read back for later updates. Johan Kotlinski's LSDj is not distributed here and keeps its own
  terms; LSDj 9.3.9 is the version the author verified, and other versions get fewer of the helpers. The project
  calls itself alpha.
status: active
