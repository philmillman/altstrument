homepage: https://dreamsofbacon.github.io/lsdj-burrito/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15 or another firmware with a compatible USB updater; your own LSDj ROM
install_notes: >-
  Open the project page in Chrome or Edge, choose your own lsdj.gb and install over USB, which builds the firmware on
  your computer. The release .fwsc alone installs without LSDj. The README says it was installed from V15 and from
  another firmware and that another firmware installs over it, and that an interrupted update is repeated with
  Install. The project calls itself experimental and unofficial, so back up your songs first.
brick_risk: true
