source_status: open
license: GPL-3.0-only
license_notes: >-
  README and the workspace manifest give GPL-3.0-only, and the repository's LICENSE is the GPL v3 text. The fm1-emu parts are MIT (THIRD-PARTY.md
  keeps the notice). The community firmwares it plays stay under their authors' licences and are not included.
homepage: https://kamil-in.github.io/luka/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge and load a firmware from the list. Nothing is installed or written to an FM-1. The README
  also covers building the web and desktop versions from source.
