device: m-vave-fm-1
name: Luka
kind: tool
summary: >-
  Browser player that runs community FM-1 firmwares in an emulator with the device's screen, keys and knobs, up to four at once, with MIDI
  controller learn.
description: >-
  The page lists 33 community firmwares, downloads each author's published build and plays it on an emulated FM-1 screen, with up to four
  loaded together and one chosen screen driven by an on-screen panel, the computer keyboard or a MIDI controller that it learns. Screens can
  be muted or stopped and started, and what a firmware saves is kept in the browser. It is built on Joakim Eriksson's fm1-emu and has a web
  client, a small local server and a Tauri desktop app. No firmware is distributed with it and nothing is written to a device. The repository
  has no tagged releases, and its notes say it is independent and not endorsed by M-VAVE or the firmware authors.
status: active
