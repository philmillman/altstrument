device: m-vave-fm-1
name: M-3rd-VAVE
summary: >-
  Wavetable polysynth module for fm1-dock with 24 voices of three wavetable oscillators each on the PPG Wave 2.2's 28 wavetables, 39 presets, a chord generator, an arpeggiator and a loop recorder.
description: >-
  Rights warning: the 28 wavetables are the PPG Wave 2.2's ROM data, taken from the avr-ppg repository's extraction of the original EPROMs. LICENSING.md says the software licence does not relicense this data.

  The module is modelled on the Groove Synthesis 3rd Wave. Each voice has three wavetable oscillators in 8 bits, band-limited per note, plus noise, a resonant 4-pole low-pass filter and amp, filter and wave envelopes. A position moves through each table in the PPG's steps under the wave envelope and a tempo-synced LFO. It plays up to four detuned voices per key in unison, adds a ping-pong delay, keeps the preset, edits and player settings over a power-off, and has 39 presets in seven types plus INIT. The chord generator, arpeggiator and loop recorder are laid out as in PRO-FM-78 and follow a DAW's MIDI clock. It runs as a module in fm1-dock, with 24 voices using fm1-dock's second core and 12 without. The release notes say it was installed and played on a real FM-1 and used at most 56 percent of an audio block with all 24 voices. Deploying over a running copy needs a power cycle afterwards because fm1-dock 0.7.1 can crash at that point.
