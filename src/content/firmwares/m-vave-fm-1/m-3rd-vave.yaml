install_notes: >-
  Needs an FM-1 already running fm1-dock. Download m3rdvave.dock from the release and deploy it with fm1-dock's tools/dock.py deploy. The module uses about 114 KiB of fm1-dock's module space, and it does not replace the firmware itself.
