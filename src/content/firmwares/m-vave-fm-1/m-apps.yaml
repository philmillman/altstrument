device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: m-apps
summary: >-
  Build kit and programs for apps that load into RAM on the FM-1 and SMK-37 without touching the flash: a hello screen, an
  SD card launcher, an MP3 player, firmware slots on the card and a mode that shows the SD card to a computer as a USB disk.
description: >-
  An app is one file that M-Flasher's run-ram command, a USB MIDI load or the bootloader's SD card item starts from RAM,
  so the firmware in flash is left alone and the unit goes back to download mode or to what started the app when the
  app ends. The repository holds the kit that builds apps for both boards (entry code, linker script, a card driver and a
  logging ring in RAM that survives crashes), a guard that arms the watchdog and installs a crash handler, and the
  apps. hello shows a screen for ten seconds. picker is a launcher that lists apps on the card, in folders with icons, and
  starts one. usbdisk exposes the card to a computer over USB, and needs a card modification. slots keeps whole flash images on
  the card and swaps between them, and mp3 plays MP3 files from the card (run on an SMK-37). The author says hello and usbdisk have run on an FM-1 and an SMK-37
  and picker on an SMK-37 only. Building needs the author's pi32v2 LLVM toolchain. The format is defined in
  m-bootloader's specification, section 11.8. The v0.1 release carries each app as a tar to unpack onto the card.
status: active
authors:
- name: Julius Vitkauskas (jvitkauskas)
  url: https://github.com/jvitkauskas
source: https://github.com/jvitkauskas/m-apps
source_status: open
license: MIT
distribution: download
install_notes: >-
  Download an app's tar from the release and unpack it into /MBOOT/APPS/ on the card, or build with make and the pi32v2
  toolchain and start an app with make run, which uses M-Flasher 0.9.2 or newer to load it into RAM from download mode. The SD
  card route needs m-bootloader's SD CARD item, which 2.3 also has on the SMK-37, and a card modification; the launcher has run
  on an SMK-37 only. Nothing is written to flash, so switching the unit off returns it to
  its installed firmware.
brick_risk: false
tags: [loader, sdk, utility, usb, platform]
versions:
- version: '0.1'
  date: 2026-11-09
  url: https://github.com/jvitkauskas/m-apps/releases/tag/v0.1
  notes: First release. Packages the hello, tone, usbdisk, slots and mp3 apps and the launcher files for both boards as tars, with SHA256SUMS. Since the earlier commit row it adds a Homebrew Channel-style launcher with apps in folders and icons, and a release workflow.
