device: m-vave-fm-1
name: m-bootloader
summary: >-
  MIT-licensed replacement bootloader for the FM-1 and SMK-37 Pro/Elite with a power-on key into USB download mode,
  a recovery menu, and the flash loader that M-Flasher uses. Formerly published as fm1-bootloader.
description: >-
  Replaces the bootloader M-VAVE ships. A key held at power-on resets the chip into its ROM USB download mode, so
  a damaged flash can be rewritten over a normal cable, and a second key opens a recovery menu that shows the
  firmware's state, boots a firmware that fails its checksum once, wipes the settings areas the firmware declares
  or enters download mode. Every firmware file's checksum is checked before it starts, the SMK-37 build keeps a
  copy of the factory calibration, and M-VAVE's stock firmware, Snoop37, SLOOP and Baud Girl run with it. It also
  carries the flash loader M-Flasher runs on the chip. The author wrote it from a specification, without code
  from JieLi's SDK or from the earlier fm1-bootloader, which is no longer online. Official M-VAVE updates and
  Baud Girl's installer put the stock bootloader back, so it has to be installed again afterwards.
status: active
authors:
- name: Julius Vitkauskas (jvitkauskas)
  url: https://github.com/jvitkauskas
source: https://github.com/jvitkauskas/m-bootloader
source_status: open
license: MIT
distribution: download
install_notes: >-
  Back up the unit with M-Flasher first. Install the .boot file for your board with M-Flasher, or use the .fwsc
  packages in the release, which M-UPGRADE installs over USB MIDI without download mode and which hold no firmware
  (M-UPGRADE then ends with a timeout error that the README says is expected). The README reports tests on
  hardware for the FM-1 and the SMK-37 Pro and, with the same build, the Elite. A broken bootloader write is not
  repaired by the bootloader itself; the USB_KEY dongle still forces download mode. Since 1.3, building needs Linux x86-64 and the author's open pi32v2 LLVM toolchain; nothing from JieLi is needed.
brick_risk: true
tags: [loader, flasher, utility]
versions:
- version: '1.3'
  date: 2026-11-04
  url: https://github.com/jvitkauskas/m-bootloader/releases/tag/v1.3
  notes: Fixes BAD CONFIG on every start on FM-1s with M-VAVE's 016 boot area, and is the first build made with the author's open pi32v2 LLVM toolchain, with flash loader 1.3. The release says it is untested on the FM-1's newer UC25HQ80 flash chip, where one unit did not start after 1.2.
- version: '1.2'
  date: 2026-10-19
  url: https://github.com/jvitkauskas/m-bootloader/releases/tag/v1.2
  notes: Adds .fwsc packages that M-UPGRADE installs; the bootloaders change only in their version text.
- version: '1.1'
  date: 2026-10-17
  url: https://github.com/jvitkauskas/m-bootloader/releases/tag/v1.1
  notes: Makes the FM-1's REC and PLAY power-on keys work.
