device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: m-card
kind: tool
summary: >-
  Open microSD add-on board for the FM-1 and SMK-37 that plugs into the LCD's ribbon connector, with Gerbers, parts list, assembly drawing and paper template.
description: >-
  A 30 by 25.2 mm two-layer board that sits under the audio jacks and connects between the LCD cable and the main
  board's J12 connector, so no soldering to the FM-1 or SMK-37 is needed. It passes all ten LCD lines through and taps four for
  the card, which shares the LCD's SPI bus; an inverter selects the card whenever the LCD is not selected. The
  repository has Gerbers, a bill of materials and placement file for JLCPCB, an assembly PDF, a 1:1 paper template and the
  Python scripts that generate the board for KiCad 9. Until 24 November 2026 the README called it an untested prototype, with fit checked on a real FM-1 using a paper template, no board made and firmware support being worked on in m-bootloader. That notice is gone and the README now names the SMK-37 too, but it still asks builders to report whether the planned cable type works. The 1.0 release notes describe the board as built and used, and say the card needs m-bootloader 2.4 or newer, whose menu then has an SD card item.
status: active
authors:
- name: Julius Vitkauskas (jvitkauskas)
  url: https://github.com/jvitkauskas
source: https://github.com/jvitkauskas/m-card
source_status: open
license: CC0-1.0
license_notes: >-
  The LICENSE file is CC0 1.0 for the scripts, board and generated files. KiCad's standard footprints are CC-BY-SA 4.0
  with an exception, and the 3D models used for the renders are downloaded, not stored.
distribution: source-only
install_notes: >-
  A hardware project: order the PCB from the Gerber zip, buy the listed parts, solder, then open the FM-1, move the LCD cable
  to the board and run a short ribbon cable back to J12. The 1.0 release notes say it needs m-bootloader 2.4 or newer on the unit, and point to m-apps for a ready card.
  Check the board and sockets with a multimeter before installing.
brick_risk: false
