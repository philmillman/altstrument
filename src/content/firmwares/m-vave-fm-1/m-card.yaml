versions:
- version: '1.1'
  date: 2026-11-26
  url: https://github.com/jvitkauskas/m-card/releases/tag/v1.1
  notes: Changes R1 from 220 to 150 ohms so the FM-1 reads the card at 12 MHz instead of 8, which raised USB disk mode from 724 to about 850 KB/s in the author's tests, and prints "for FM-1 and SMK-37" on the back. The copper is unchanged, and a 1.0 board can be fixed by swapping R1.
