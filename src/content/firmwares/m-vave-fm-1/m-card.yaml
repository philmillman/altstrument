  notes: The board as built and used, with Gerbers, assembly PDF, 1:1 paper template, and the parts and placement lists in JLCPCB format. Tagged on the commit that drops the untested-prototype notice and names the SMK-37. Needs m-bootloader 2.4 or newer.
