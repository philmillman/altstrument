  url: https://github.com/jvitkauskas/m-flasher/releases/tag/v0.8.2
  notes: Bundles m-bootloader 1.3 and its flash loader 1.3, and warns before installing an older m-bootloader on a unit where it would show BAD CONFIG. Version 0.8.1, released earlier the same day, identifies FM-1s with the newer UC25HQ80 flash chip and warns before installing m-bootloader on it.
