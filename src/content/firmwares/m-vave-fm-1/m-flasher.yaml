device: m-vave-fm-1
name: M-Flasher
kind: tool
summary: >-
  Windows, macOS and Linux app that backs up, restores and installs FM-1 and SMK-37 Pro/Elite firmware through the
  chip's USB download mode, so it also works on a unit whose firmware is broken.
description: >-
  Talks to the JieLi AC791N's built-in UBOOT1.00 download mode, reads the whole 1 MiB flash twice before
  writing, saves a backup first, writes only the 4 KiB sectors that change and reads everything back. It
  installs M-VAVE .fwsc packages as published (or custom packages in the same format), installs the author's
  open m-bootloader, and can put the stock bootloader back. A flash map shows what each sector holds and which
  ones a write will touch. Since 0.5.0 a unit that is running normally, on M-VAVE's own firmware or Felucca,
  is found over USB MIDI and a DOWNLOAD MODE button restarts it into download mode with a SysEx message, so a
  stock unit can be backed up and given the open bootloader without a USB_KEY dongle. Supports the FM-1, the Fame MiniFM (an FM-1 under
  another name, so far checked only on simulated flash) and the
  SMK-37 Pro and Elite; the author tested on an FM-1 and an SMK-37 Pro, and tried the MIDI route on Linux and macOS. A command line is included.
status: active
authors:
- name: Julius Vitkauskas (jvitkauskas)
  url: https://github.com/jvitkauskas
source: https://github.com/jvitkauskas/m-flasher
source_status: open
license: MIT
license_notes: >-
  Bundles the MIT-licensed m-bootloader builds and flash loaders from its release (see data/NOTICE.md in the
  repository). The protocol follows jl-uboot-tool, for which JieLi has published no license.
distribution: download
install_notes: >-
  Releases have an unsigned Windows zip (asks for administrator rights), a macOS dmg, .deb and .rpm packages and
  a Linux tarball that needs one udev rule; the first start needs a manual approval on Windows and macOS. A unit
  with the stock bootloader can enter download mode only through the DOWNLOAD MODE button (USB MIDI), not from its
  keys, until m-bootloader is installed. Bring your own official .fwsc files from M-VAVE; none are included.
brick_risk: true
tags: [flasher, loader, utility]
image:
  url: https://raw.githubusercontent.com/jvitkauskas/m-flasher/main/docs/screenshot.jpg
  alt: >-
    M-Flasher 0.4.1 window with an LCD panel reading FM-1 in USB download mode, firmware FM-1 015 (stock) with
    m-bootloader 1.1, four operation buttons, and a 256-square flash map coloured by region
  credit: Julius Vitkauskas
  source_url: https://github.com/jvitkauskas/m-flasher
  first_party: true
versions:
