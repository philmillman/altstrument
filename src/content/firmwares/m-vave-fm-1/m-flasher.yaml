  notes: Adds the Fame MiniFM, an FM-1 under another name, detected as an FM-1 with the DOWNLOAD MODE button. Packages of either name install on either unit, and the app warns first. Checked against both vendor packages on simulated flash, not yet on a real MiniFM.
