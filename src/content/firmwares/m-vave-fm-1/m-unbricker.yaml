device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: M-Unbricker
kind: tool
summary: >-
  Repairs a broken FM-1 or SMK-37 using a second, working unit and a USB-C cable, with no dongle: the working unit becomes a USB host that
  rewrites the broken one's bootloader. Either model can repair either.
description: >-
  A browser page guides the steps in Chrome or Edge, or in Chrome on Android, or with the MIDIWeb app on iOS. The page first starts a RAM stage of m-bootloader on the working unit through the
  firmware's own update route, leaving its firmware and settings in place, and then sends the M-Unbricker RAM app, which takes over that unit's
  USB-C port and screen. With the cable moved to the broken unit, it sends the JieLi USB_KEY and calibration pulses that put that unit's mask ROM into USB download mode
  whatever its flash holds, loads M-Flasher's flash loader over mass storage, identifies the model and writes a fresh m-bootloader to the boot
  area, erasing the rest of the firmware area up to 0xFEFFF and verifying with the chip's CRC32. The top flash page (0xFF000 onwards) and the
  SMK-37's Bluetooth pairing and calibration area are never written. With no firmware left, m-bootloader opens its MIDI mode by itself and the unit takes a firmware from that
  firmware's own browser installer. The README reports tests on an FM-1 and an SMK-37 Pro in both directions, including an FM-1 bricked by a firmware that hangs
  at start, and lists the firmwares the helper stage has started on. The same page can also be run from M-Flasher with its run-ram command.
status: active
