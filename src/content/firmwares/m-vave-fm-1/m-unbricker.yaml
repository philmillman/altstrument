license: MIT
license_notes: >-
  THIRD-PARTY.md lists the third-party parts. The repository holds m-bootloader 2.3 boot images and RAM stage packages (rescue/ and web/assets/); the SMK-37 boot image
  sits on the header and chip-key record of M-VAVE's official SMK-37 Pro 016 package. It holds no M-VAVE firmware image.
homepage: https://jvitkauskas.github.io/m-unbricker/
distribution: browser-installer
install_notes: >-
  Open the page and follow the steps with a working FM-1 or SMK-37 and a USB-C cable. Building the apps from source needs GNU Make, Python 3 and the
  author's open pi32v2 LLVM toolchain on Linux x86-64.
