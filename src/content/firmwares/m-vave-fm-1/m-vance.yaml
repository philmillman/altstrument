device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: M-vance
summary: >-
  Virtual analog synth that ports the author's JT-8000, a JP-8000-style engine, to the FM-1 in fixed point: Super Saw, a
  JP-style filter, multi-effects, delay, plate reverb, arpeggiator, two-track sequencer, split and dual layers and 64
  programs on eight voices.
description: >-
  The engine was rewritten from the floating-point JT-8000 for the FM-1's chip, which has no FPU, and the README says its
  envelope times, LFO rates, modulation depths and filter laws were measured against the JP-8000's own firmware in an
  emulator. OSC 1 has Super Saw, triangle mod, noise, feedback, square, saw and triangle waves, OSC 2 syncs to it, and the
  filter has low, band and high pass at 12 or 24 dB. Effects are tone, a multi-effect (super chorus, flanger, phaser,
  twist, freeze, distortion), delay, a plate reverb and an output limiter. Every program is a performance with an upper
  and a lower patch played single, dual or split. The arpeggiator is ported from Skiff. The sequencer records two tracks in real time,
  with a piano roll and twelve named clips in flash. Sound pages follow the JP-8080's sections, and the knobs send and
  receive its MODE2 controller numbers. A browser page loads and sends banks of JP-8000 or JP-8080 SysEx files to the
  unit. The 64 factory programs are the author's own. Builds on Dinghy's platform layer. Releases from 2.2 carry SMK-37 Pro, Elite
  and MKE-P37 builds from the same source, which the README says have not been tested with M-vance.
status: active
