source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only, and LICENSE is the GPL v3 text. The platform parts carry the
  copyright of Leo Kuroshita, genkigenki, zvenson and others as listed there, the USB audio output files are MPL-2.0
  from felucca-bsp, and the font is SIL OFL 1.1. LICENSING.md says the factory programs are the author's own and that no
  third-party bank is used. The repository holds a 64-program .syx bank, and no stock firmware image.
homepage: https://bk40-home.github.io/M-vance/
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install mvance-X.Y.fwsc from a release with tools/fm1_install.py over USB-MIDI, or from the FM-1 Firmware Hub once it is
  listed there. The release files for the SMK-37 are mvance-X.Y-smk37.fwsc for the Pro, -smk37-elite and -smk37-mke. Holding OCT-
  while switching on starts a USB rescue mode in which a working build or another firmware can be installed. The README
  says to install at your own risk.
brick_risk: false
