  date: 2026-11-26
  url: https://github.com/bk40-home/M-Vsynth2/releases/tag/v1.6
  notes: Release page lists only a changelog link. The attached packages are the FM-1 build and SMK-37 Pro, Elite and MKE-P37 builds.
