  notes: Release page lists only a changelog link. Commits since 1.3 scope the FPU flags, add an FM-1 watcher, and add patch saving and knob assignment. SMK-37 Pro, Elite and MKE-P37 packages come with it.
- version: '1.3'
  date: 2026-11-17
  url: https://github.com/bk40-home/M-Vsynth2/releases/tag/v1.3
  notes: Release page lists only a changelog link. Commits since 1.2.2 add an SH-101 filter, patch workflow improvements, a visual sequencer and a dedicated drum track. SMK-37 Pro, Elite and MKE-P37 packages come with it.
- version: 1.2.2
  date: 2026-11-15
  url: https://github.com/bk40-home/M-Vsynth2/releases/tag/v1.2.2
  notes: Release page lists only a changelog link. Commits since the last listed head add a browser firmware installer, a two-way link to the FM-1 simulator, editable banks and layered patch tools, and the tag handling for the release workflow. Older tags V1.0, V1.1, V1.2 and v1.2.1 have no release page and are not listed.
