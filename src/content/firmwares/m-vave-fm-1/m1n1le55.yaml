device: m-vave-fm-1
name: M1n1Le55
kind: tool
summary: >-
  Touchscreen firmware manager and control console for the M-VAVE FM-1, running on an M5Stack Tab5 with the FM-1 on its USB host
  port; it installs firmware from an SD card and edits parameters of supported firmwares.
description: >-
  The Tab5 has four screens: firmware management, a workbench whose pages follow the firmware currently on the FM-1, a
  voice page with optional sample transfer, and a device page for connection status, backups and a log. Installation
  uses exact catalogued packages from a FAT32 card and puts V15 in between automatically when a route needs it.
  Packages for Felucca, SLOOP, FM-1+VA, FoMni, X0X, Jangada, FM1 Open and the official V15 are supported and are not
  included; the user obtains them from their authors. The Tab5 side is an ESP-IDF application with an installer and an
  SD preparation tool for Windows in the release package. The author tested a firmware upgrade of one Tab5 and
  its connection to an FM-1 but not a first install on a new Tab5, and notes that sample transfer and Bluetooth
  have limited testing.
status: active
authors:
