license: MIT
license_notes: >-
  MIT covers the project's own code. Third-party components, including ESP-IDF, LVGL and the firmware icons (one of
  them under SLOOP's GPL-3.0), keep their own licences, whose texts are in the licenses directory.
homepage: https://github.com/ZzpsS/M1n1Le55/releases/tag/v0.31-grid-1
distribution: download
install_notes: >-
  Needs an original M5Stack Tab5 (ESP32-P4, 16 MB flash) and an FM-1; other ESP32-P4 boards are not targeted. Download
  the release zip, connect the Tab5 by USB-C and flash the bootloader, partition table and application with the commands in
  the quick-start guide. The first install leaves the Tab5's wireless chip alone. To change FM-1 firmware, prepare a FAT32
  card with the bundled Windows tool, keep USB and power connected during the install, and have a recovery route ready.
brick_risk: true
