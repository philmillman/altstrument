device: m-vave-fm-1
name: Makohai
summary: >-
  Generative groovebox in the style of early-90s PC tracker music: six lanes composed live in eighteen styles, which you
  mix instead of programming steps, with tracker effects, an editor for your own parts and a browser version.
description: >-
  Formerly called Espada. The six lanes are lead, arp, pad, bass, drums and sfx, and each has its own filter,
  FM brightness, drive and pan, plus tracker effects such as slide, vibrato, tremolo, gate, retrigger, bit crush
  and echo. A style can be queued, blended in lane by lane or launched at once, and an optional arc builds the
  piece up to a drop. The EDIT page takes your own parts of up to 512 bars per lane in scale steps, and the
  setup screens show scopes and demo-style visuals. Eight sets and MIDI in and out (notes, controllers, clock and transport) are included. It is built on
  Dinghy and carries Felucca's platform layer, and the browser version runs the firmware's own code.
status: active
authors:
- name: delirioux
  url: https://github.com/delirioux
source: https://github.com/delirioux/makohai
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md. The platform layer is Leo Kuroshita's Felucca with SLOOP's changes, and Dinghy's wiring is
  zvenson's. DotGothic16 and Terminus fonts are SIL OFL 1.1, and the JieLi SDK files read at build time are
  Apache-2.0.
homepage: https://delirioux.github.io/makohai/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Use the web installer on the homepage in Chrome or Edge, the FM-1 Firmware Hub, or tools/fm1_install.py with the
  release .fwsc. The README says to install over M-VAVE's official firmware and that installing is at your own
  risk. Holding OCT- while switching on starts the USB rescue, which the installers can still reach.
brick_risk: false
tags: [generative, sequencer, drums, synth-engine, fx, chords, arpeggiator, editor, emulator, midi, usb-midi]
