versions:
- version: '1.4'
  date: 2026-11-04
  url: https://github.com/delirioux/makohai/releases/tag/v1.4
  notes: Recognises the flash chip of newer FM-1 units, which in 1.3 and earlier could not save settings or take updates, shows the version and CPU load on SETUP and adds a guard that drops a voice when the load stays high.
- version: '1.3'
  date: 2026-10-28
  url: https://github.com/delirioux/makohai/releases/tag/v1.3
  notes: Adds eight styles (eighteen in all) and 48 sounds, MIDI notes, controllers, clock and transport in both directions, and voice settings that are saved.
- version: '1.2'
  date: 2026-10-26
  url: https://github.com/delirioux/makohai/releases/tag/v1.2
  notes: Adds three animated pictures (a turning wireframe, shadebobs and a marble bust) for the knob pages, the background and the demo mode.
- version: '1.1'
  date: 2026-10-26
  url: https://github.com/delirioux/makohai/releases/tag/v1.1
  notes: Adds autopan, a voice budget that prevents crackling, demo-style visuals and lit keys, and a new package identity.
- version: '1.0'
  date: 2026-10-25
  url: https://github.com/delirioux/makohai/releases/tag/v1.0
