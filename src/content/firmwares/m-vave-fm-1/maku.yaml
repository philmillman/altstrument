device: m-vave-fm-1
name: MAKU
summary: >-
  Always-on generative ambience machine for DJ intermissions: power on and a random in-key world plays
  across four parts (pulse, floor, haze, voice), with verb buttons and a taste memory of liked worlds.
status: active
authors:
- name: okumurari2
  url: https://github.com/okumurari2
source: https://github.com/okumurari2/maku
source_status: open
license: GPL-3.0-only
homepage: https://okumurari2.github.io/maku/
distribution: download
install_notes: >-
  Flash the prebuilt maku-X.Y.fwsc with tools/fm1_install.py. Browser emulator on the project page. An
  SMK-37 port exists (see maku37).
brick_risk: false
tags: [synth-engine, performance, granular, physical-modeling]
