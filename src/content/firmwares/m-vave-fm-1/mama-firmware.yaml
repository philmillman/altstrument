device: m-vave-fm-1
name: MAMA firmware mirror
kind: tool
summary: >-
  Mirror of 289 community FM-1 firmware packages pinned by SHA-256 for the MAMA Android app, with the source of each copyleft
  one, kept as release assets next to a manifest.
description: >-
  Rights warning: the mirror also carries open projects whose authors state no license, which the owner decided to include on 2026-11-18, and takes them down on request.

  The repository holds a README table, a manifest.json and a list of what is not mirrored, while the packages and source
  archives sit in two release pages. Each package is a byte-identical copy of the author's release, named after its Hub
  id, so that an install the app verified keeps working after the author or The Firmware Hub moves to a newer version. For GPL,
  LGPL, AGPL and MPL firmware the source of that exact version is taken from the author's tag or commit. Since 2026-11-18 every
  firmware in the MAMA library is mirrored, including seven open projects with no stated license, which the owner decided to
  include, and the 43 firmwares that send no USB audio to the phone have been removed; the list of firmware not mirrored is
  empty. No M-VAVE image appears in the manifest. The maintainer offers takedown by issue.
status: active
authors:
- name: f00br
  url: https://github.com/f00br
source: https://github.com/f00br/mama-firmware
source_status: binary-only
license: unspecified
license_notes: >-
  The repository has no license file. The README says each mirrored file keeps its author's license and nothing is relicensed.
  The manifest lists 233 GPL-3.0, 40 MPL-2.0, eight MIT, one Apache-2.0 and seven with no stated license.
homepage: https://github.com/f00br/mama-firmware/releases/tag/packages
distribution: download
install_notes: >-
  Download a .fwsc from the packages release, check it against the sha256 in manifest.json and install it with an FM-1
  installer of your choice. The packages are other people's firmware, so read each one's own notes first.
brick_risk: false
tags: [library, utility]
versions:
- version: main @ 91465ba
  date: 2026-11-18
  url: https://github.com/f00br/mama-firmware/commit/91465baf900b0f594a5640f4fe1ea69709ee33a7
  notes: No tagged releases; this is the latest commit. The latest commit mirrors every firmware of the MAMA library (289), adding eight whose authors state no license, removes the 43 that send no USB audio, and adds each firmware's note-to-sound delay to the manifest. The packages and sources releases are rolling pages.
