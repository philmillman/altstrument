homepage: https://stets43.github.io/Manifold/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Use the web installer on the project site in Chrome or Edge, or run fm1-base's tools/fm1_install.py with
  firmware/manifold-1.0.3.fwsc from the repository. Building needs fm1-base at a pinned commit with the patches in the
  repository's patches folder applied. Release 1.0.3 adds support for FM-1s with the newer UC25HQ80 flash chip; before it,
  those units kept no settings between power-ons.
