device: m-vave-fm-1
name: MANIFOLD
summary: >-
  Generative just-intonation firmware: moving points wander over a Tonnetz map of a scale and sound the notes they pass,
  with twelve motions, 41 scales, a 24-route modulation matrix, Bluetooth audio out and a browser emulator.
description: >-
  Two layers of points move over a map of a just-intonation scale, and each note they pass near sounds in proportion to
  how close the points are. The 41 scales include handpan and tongue-drum tunings, and a Temper control moves them toward
  12-tone equal temperament. There are twelve motion generators (Orbit, Lorenz, Swarm, Billiard and others) and eight
  envelope types. Voices use up to 16 exact harmonics shaped by one spectral function. The rhythm is a continuous function
  of the bar rather than a grid, and four drums place envelopes on notes the synth already plays. A 24-route matrix has six
  LFOs, the knobs and the generators as sources. Effects are fuzz, a morphing filter, tempo delay, an 8-line reverb that
  can be tuned to the scale, a bus compressor and a limiter. There are 16 patches with four scenes each, MIDI over USB and
  Bluetooth, and Bluetooth audio out to headphones and speakers. It is an app on fm1-base with small patches to fm1-base
  and felucca-bsp. The README lists 1.0 (2026-11-10) and 1.0.2 as earlier releases, but only the 1.0.3 tag and release
  page exist on GitHub.
