device: m-vave-fm-1
name: Mariotronics
summary: >-
  Guitar and piano instrument for the FM-1 built around a shared tape loop with overdubbing, reverse playback and a
  64-preset bank, in the manner of Frippertronics and Eno's tape pieces, installed from a standalone editor page.
description: >-
  Rights warning: assets/ holds images of Revox A77 tape decks (fripp.png, eno.png, Frippertronics.jpg) that the README
  describes only as supplied reference artwork, with no source or licence, and the firmware's screen art and intro are
  generated from them.

  Two engines share one recorded tape. FRIPP plays plucked guitar voices through two simulated tape decks, and ENO plays
  piano, bright piano, glass bell and tape choir, with note effects and an optional second playback head. REC records,
  overdubs or holds the loop, SEQ plays it in reverse, and the internal delay runs from 4 to 8 seconds. Pre-tape
  effects are compression, fuzz, wah, amplifier and EQ, followed by a stereo plate reverb that stays out of the
  recording. Tape character, off-tape monitoring, key backlight and MIDI or Bluetooth MIDI are on the GLO page, and
  PRESETS recall 64 stored sounds. The piano bank is synthesised in tools/piano.py. The author says it was written with
  Claude's help, and the README calls 1.1 a pre-release tested in emulation, with installation, audio performance and
  Bluetooth pairing on a physical FM-1 still to be verified. It grew out of the same author's VIRGO and GRANA
  and draws its guitar excitation from Ravel.
status: active
authors:
- name: Mario Texture
  url: https://github.com/mongio
source: https://github.com/mongio/Mariotronics-FM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL-3.0 and LICENSING.md, which was carried over from VIRGO, states GPL-3.0-only for the firmware and
  the editor, with Felucca platform code under its own notices, the Inter and Terminus fonts under SIL OFL 1.1 and the
  JieLi SDK files read from the builder's checkout. The Revox deck artwork has no stated terms.
distribution: browser-installer
install_notes: >-
  Download Mariotronics_Editor_FM1.zip from the release, extract it and open Mariotronics_1_1.html in desktop Chrome or
  Edge. Power on tries the offline emulator, and Install Mariotronics writes the firmware to a USB-connected FM-1 after
  granting MIDI SysEx access; leave power and USB connected until the page reports the install. The installation
  replaces the existing firmware, and the zip also holds mariotronics-1.1.fwsc for other installers. The README gives no
  recovery steps; M-VAVE's own firmware can be reinstalled with its updater or the FM-1 Firmware Hub.
brick_risk: false
tags: [ambient, looper, synth-engine, fx, delay, performance, midi, ble-midi, editor, web]
versions:
- version: '1.1'
  date: 2026-11-24
  url: https://github.com/mongio/Mariotronics-FM1/releases/tag/v1.1
  notes: Shows the active algorithm (FRIPP or ENO) on every page, plays the loop in reverse with one SEQ press, brings back the recorder view on SEQ and ARP, and fixes the envelope on the four ENO voices.
