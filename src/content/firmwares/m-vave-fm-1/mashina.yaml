device: m-vave-fm-1
name: MASHINA
summary: >-
  Live sound-module firmware for the FM-1 that follows JIANT LIVE DRUMS: six tracks on their own MIDI channels with keyboard zones, 32 MIDI CC macros, two 12-sound drum engines, extra synth engines and no song sequencer.
description: >-
  Each of six tracks takes its own MIDI receive channel, and tracks may share one to layer sounds. Every track has a note and velocity zone for splits, a transpose of minus 36 to plus 36 semitones and fine tuning of minus 50 to plus 50 cents. MIDI LEARN binds an incoming controller to a track's parameter as one of 32 project macros, with a range or toggle, reverse and bypass. DRUM-X has 12 independent sounds and DRUM-LAB has 12 editable synthesized pads. ATMOS, BRASS and INDUSTRIAL sit beside JIANT's synth engines, a three-band EQ comes before the effects, and eight voices are shared across all tracks. The sequencer is disabled, its buttons open live pages for macros, drum mapping and performance settings, project slots recall during play, and a panic command silences everything. The repository continues the author's JIANT LIVE DRUMS, a JIANT derivative whose repository was taken down in November 2026. The README says the build was flashed and functionally checked on a physical FM-1 without exhaustive endurance or recovery testing, and the web editor does not yet expose every new control. The project site has a browser emulator, a web installer, a web editor and a manual.
