license_notes: >-
  The README and LICENSE file give GPL-3.0-only, as Felucca. The platform comes from Felucca by Leo Kuroshita and the M-Vave-OP1 contributors, and LICENSING.md lists the third-party parts. vendor/m-vave/FM-1_015.fwsc is M-VAVE's own V15 package, Apache-2.0 in m-vave/fm1_open, and its blob hash ce49cc15 matches the licensed file.
homepage: https://vladkuznetsov404-hue.github.io/fm1-drone-synth/
distribution: source-only
install_notes: >-
  Run setup_env.sh once for the JieLi toolchain and Emscripten, then ./build.sh to make build/firmware.fwsc, and install it with tools/fm1_install.py or the web installer. The README warns that the FM-1 has one firmware bank and that a firmware that does not start needs extra hardware, naming FM-1-transporter, so back up the flash first; the platform keeps a boot guard and a USB update entry, and the way back is tools/fm1_install.py --stock, the installer's Return to official V15, or M-VAVE's updater. The FM-1's ROM boot mode also applies.
