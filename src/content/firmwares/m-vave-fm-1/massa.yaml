device: m-vave-fm-1
name: MASSA
summary: >-
  Latching drone synth for the FM-1 with detuned saw or feedback-FM layers, fuzz into a 4x12 cabinet, a tape echo and a cassette looper with wow, flutter, reverse and tape stop.
description: >-
  Keys latch, so a note drones until its key is pressed again, with up to four notes at once. Two bodies, BLACK HOLE with fuzz and cabinet and QUASAR with a softer fuzz, chorus and reverb, each have 16 sounds, their own effects page, colours and home picture. The engine is switched between detuned saws with a sub and feedback FM. Four knobs set mass, beats, dark and breath on the home page. The tape echo can bend time between repeats and freeze, and the cassette records the instrument's own output and plays it back at half speed, in reverse or with a tape-stop brake, with pitch apart from speed and 15 pads. Scales and Sunn-style chords glide between each other on the keys. Every page is a moving picture rather than a list of parameters. The spec calls it version 0.1, in development, and nothing in the repository says it has run on a real FM-1. It has host tests, a browser emulator and a web installer with a return to official V15, and the repository carries the licensed V15 package for that. The code was written with Claude Code skills that are included in the repository.
