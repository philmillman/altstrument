device: m-vave-fm-1
name: Matryoshka
summary: >-
  Modular synth framework for the FM-1: build patches from modules and nestable assemblies in a browser editor,
  send them over WebMIDI, and play them on a firmware that runs one patch at a time.
description: >-
  A fork of WiggisModular's Modular-1, which is in turn built on Felucca's hardware layer. The editor has over 50 module
  types (oscillators, filters, envelopes, sequencers, an arpeggiator, granular, delay, reverb and others), 67 factory
  assemblies, factory patches that model other synths, and a library for the FM-1's bank of patch slots (48 since 1.26.0). Patches too big
  for the FM-1's CPU budget can still be edited and heard in the browser. Patches live in flash sectors that Felucca
  also uses, so a first start erases Felucca's projects and samples there; the README says to save them first.
  Patches stored by M-VAVE's own firmware are not touched. A browser emulator view runs the firmware itself. The FM-1 sends MIDI clock over USB and, since 1.8.3, works with an iPad as a MIDI and audio device. The README reports tests on
  a real FM-1 for installing, update mode, returning to V15 and recovery.
status: active
authors:
- name: glvno
  url: https://github.com/glvno
source: https://github.com/glvno/matryoshka
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only (LICENSING.md); the flasher, loader and hardware layer are copied from Felucca, and the project derives
  from Modular-1, also GPL-3.0-only. web/public/firmware/FM-1_015.fwsc in the repository is M-VAVE's FM-1 V15 image,
  git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, the file M-VAVE licenses for redistribution under Apache-2.0 in
  m-vave/fm1_open; the editor's Return to official V15 sends it. Ported DSP and fonts keep their own licences.
homepage: https://matryoshka.lol/
based_on: m-vave-fm-1/modular-1
distribution: browser-installer
requires_stock: V15 or Matryoshka
install_notes: >-
  Install panel of the browser editor (Chrome or Edge, WebMIDI with SysEx), or tools/fm1_install.py with the package
  from a release. Return to official V15 first if the FM-1 runs Felucca, SLOOP or another build. Returning to V15 can
  fail with "update failed -5" on a unit that M-VAVE's FM1 Open set up, because its boot code differs; the README
  lists MvaveFM1Unbricker as the way back in that case. Save Felucca data first, since the first start erases its
  flash sectors. Since 1.18 the install has two steps, the firmware and then the factory sounds, which the editor installs by default.
brick_risk: false
tags: [synth-engine, modular, editor, emulator, patch, sequencer, arpeggiator, fork]
versions:
- version: 1.26.6
  date: 2026-11-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.6
  notes: Editor update only; the firmware stays at 1.26.3. Library > Palettes keeps any number of 8-sound palettes in the browser, with or without an FM-1, and a saved palette can be sent to the FM-1, or the FM-1's palette saved as one.
- version: 1.26.5
  date: 2026-11-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.5
  notes: Editor update only; the firmware stays at 1.26.3. A tweak of a sound the FM-1 already has goes into the palette as a preset of that slot instead of a new patch, a different tempo or pattern needs no new patch, and the editor says in one line why when a new patch is needed.
- version: 1.26.4
  date: 2026-11-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.4
  notes: Editor update only; the firmware stays at 1.26.3. All candidates are alike and edits go straight into the one you hear, with a tweaked marker, revert and per-candidate undo. Any candidate can be deleted and brought back, and Save preset and Add to palette sit on the candidate you hear.
- version: 1.26.3
  date: 2026-11-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.3
  notes: Firmware release; patch format moves to 66, which older firmware cannot read, and the editor syncs only with 1.26.3. Each instrument keeps its effects in an FX drawer, with an Output drawer for shared effects, and the master FX bus and MASTER FX page are gone. On the FM-1 each effect is its own device after its instrument. Old patches convert when opened in the editor and sound the same, and saving to the palette no longer drops the editor's link.
- version: 1.26.2
  date: 2026-11-23
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.2
  notes: Editor update only; the firmware stays at 1.26.1 and nothing needs installing. Adding a sound to the palette now saves everything the FM-1 needs to play it, pressing ARP after deleting an Arpeggiator puts it back, and Library presets name Hera 6 and the drum kits correctly.
- version: 1.26.1
  date: 2026-11-23
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.1
  notes: Firmware patch release; patch format stays 65. Adds halving a pattern (hold SEQ and press OCT- on the SEQ page, or the ÷2 button on a Steps card) and fixes the palette overview and quick start leaving pieces on the screen.
- version: 1.26.0
  date: 2026-11-23
  url: https://github.com/glvno/matryoshka/releases/tag/v1.26.0
  notes: Firmware release; patch format stays 65. Adds a palette of up to 8 sounds to switch between from the black keys while HOME is held, a shared pattern store with loading and keeping copies of patterns, doubling a pattern, and a screen font installed as its own step after the firmware. The factory patterns and demo sets are removed, and the bank shrinks from 60 to 48 slots, which the first start moves patches into; going back to 1.25 or older warns first and offers a bank backup.
- version: 1.25.0
  date: 2026-11-22
  url: https://github.com/glvno/matryoshka/releases/tag/v1.25.0
  notes: Firmware release; patch format stays 65. Adds copying a pattern (hold SEQ and press SAVE) and clearing every pattern and song at once on the FM-1's SEQ page, a CLOCK IN DELAY setting of 0 to 200 ms for apps whose clock runs ahead of their sound, and a fix so a song entry or pattern picked while playing starts on its first step. The 808 Kit, 909 Kit, Verona Drum 1, Scrounge and Silver Box factory patches now start with no patterns; a factory slot you never changed becomes the empty version, and a demo set (hold SEQ and press SEL) brings the old patterns back.
- version: 1.24.1
  date: 2026-11-21
  url: https://github.com/glvno/matryoshka/releases/tag/v1.24.1
  notes: Firmware patch release; patch format stays 65. A named FM-1 now appears to a Mac or iPad as a separate MIDI device under its own name, for example Matryoshka STAGE, so two units can be routed separately; unplug and replug each unit after installing or renaming.
- version: 1.24.0
  date: 2026-11-21
  url: https://github.com/glvno/matryoshka/releases/tag/v1.24.0
  notes: Firmware release; patch format stays 65, so patches from 1.23.0 load as they are. Install from the editor's Flash tab.
- version: 1.23.0
  date: 2026-11-20
  url: https://github.com/glvno/matryoshka/releases/tag/v1.23.0
  notes: Firmware release (patch format 65). Adds MIDI learn on the FM-1 (GLO > MIDI) and in the editor, with up to 16 learned controls saved in the patch, makes Briefcase 3's joystick move the filter and oscillator 1, and plays every sound of the 808 and 909 Kits from the FM-1's keys eight at a time. The 909 hi-hat LEVEL now sets both hats, and pads or keys played through a MIDI interface sound on press instead of release. Unchanged factory slots take the new patches.
- version: 1.22.0
  date: 2026-11-20
  url: https://github.com/glvno/matryoshka/releases/tag/v1.22.0
  notes: Firmware release (patch format 64). The FM-1 follows Song Position and Continue from a DAW or looper, and GLO > MIDI gets separate TRANSPORT IN and OUT switches beside the clock ones. Adds a master EQ (GLO > EQ, three bands, plus an EQ module), Drive on Hera 6 and an effects rack on the 808 Kit, and patches take less room. The release lists a known issue where Reel's loop can sit one 16th note ahead.
- version: 1.21.0
  date: 2026-11-19
  url: https://github.com/glvno/matryoshka/releases/tag/v1.21.0
  notes: New firmware that frees CPU on the FM-1 (factory patches use up to about 6 points less) and plays Expander S with eight voices. Factory patches you never changed update themselves, MIDI clock stays in step through a pause and restart, and a Start that arrives before the clock no longer puts the steps ahead. Algo Four at eight voices and Cassia 1 at five are built in. The patch format stays at 63.
- version: 1.20.3
  date: 2026-11-19
  url: https://github.com/glvno/matryoshka/releases/tag/v1.20.3
  notes: Web editor only; the firmware stays at 1.20.0. Quick patch shows where a held cable can go, envelope search finds the ADSR first, and the on-screen keys stay in place when the window is resized.
- version: 1.20.2
  date: 2026-11-19
  url: https://github.com/glvno/matryoshka/releases/tag/v1.20.2
  notes: Web editor and factory content only; the firmware stays at 1.20.0. New factory sounds give Algo Four eight voices and Cassia 1 five on an FM-1 with 1.20.0 firmware, and Elvira 2 gains eleven filter types, a longer delay with reverb, LFO sync and a per-voice sequence. Saved slots keep the old sounds until FACTORY RESET, which replaces every saved slot.
- version: 1.20.1
  date: 2026-11-18
  url: https://github.com/glvno/matryoshka/releases/tag/v1.20.1
  notes: Web editor and factory content only; the firmware stays at 1.20.0. Adds Quick patch, a keyboard-driven way to build a patch from the canvas, free panning and zooming of the canvas, velocity and aftertouch on 8 Lire's plates, and a 500 Hz LFO on Oracle V. No factory patch makes sound the moment it is selected.
- version: 1.20.0
  date: 2026-11-18
  url: https://github.com/glvno/matryoshka/releases/tag/v1.20.0
  notes: Polyphonic synths with effects stop dropping voices, because filters and effects now run on the floating-point unit and the load is split between both cores. Oracle V plays five voices and Hera 6 six. Adds ratchets and micro timing for Steps notes, a Euclid module, bar-length arpeggios with swing, and a global time signature. Patches that use the new sequencer features need this firmware (patch format 63); others still play on 1.19.
- version: 1.19.0
  date: 2026-11-18
  url: https://github.com/glvno/matryoshka/releases/tag/v1.19.0
  notes: Adds a Low pass gate module ported from KITTEN RACK, a Limiter with a ceiling for feedback patches, and a way to merge two inputs into one jack inside an assembly. Patches that use the Low pass gate or the Limiter need this firmware (patch format 62); other patches still play on 1.18. Firmware updates keep saved patches.
- version: 1.18.5
  date: 2026-11-18
  url: https://github.com/glvno/matryoshka/releases/tag/v1.18.5
  notes: Web editor only; the firmware stays at 1.18.0. While linked, the FM-1's seven lowest keys act as the Harmonizer's chord buttons in the editor, and a card's power mark follows LFO and ARP changes made on the device.
- version: 1.18.4
  date: 2026-11-17
  url: https://github.com/glvno/matryoshka/releases/tag/v1.18.4
  notes: Web editor only; the firmware stays at 1.18.0. Adds a sound design sidebar with a listening block, an output scope and candidate patches, and lets Mutate aim at a kind of sound such as lead, pluck or pad.
- version: 1.18.3
  date: 2026-11-17
  url: https://github.com/glvno/matryoshka/releases/tag/v1.18.3
  notes: Web editor only; the firmware stays at 1.18.0. Mutate no longer changes an instrument's volume or set-up switches, and editor shortcuts work while a sidebar control has focus.
- version: 1.18.2
  date: 2026-11-17
  url: https://github.com/glvno/matryoshka/releases/tag/v1.18.2
  notes: Web editor only; the firmware stays at 1.18.0. Mutate, Randomize and Make candidates leave pitch alone unless a Mutate pitch option is on, change about one row in four, and can breed from snapshots marked keep. Each card shows its share of the FM-1's CPU budget.
- version: 1.18.1
  date: 2026-11-17
  url: https://github.com/glvno/matryoshka/releases/tag/v1.18.1
  notes: Web editor only; the firmware stays at 1.18.0. Snapshots replace the A/B switch, with rank and cut of mutated candidates, test phrases, WAV export and listening to a single signal.
- version: 1.18.0
  date: 2026-11-16
  url: https://github.com/glvno/matryoshka/releases/tag/v1.18.0
  notes: Setup takes two steps, the firmware and then the factory sounds, which frees about 44 KB of firmware; without the factory sounds the FM-1 plays its built-in instruments and says FACTORY SOUNDS MISSING. Rings and tails of resonators, filters, reverb and delay now fade to silence on the FM-1, Shush 101 follows the SH-101 more closely, and the 808 and 909 kits play fill-ins while FILL is held.
- version: 1.17.0
  date: 2026-11-16
  url: https://github.com/glvno/matryoshka/releases/tag/v1.17.0
  notes: Adds the Shush 101 factory patch after the Roland SH-101, full pattern sets for the 808 and 909 kits, trig conditions on Steps notes, drive and 20 new sounds for Algo Four, and revised Verona Drum 1 and Meridian 8 controls.
- version: 1.16.0
  date: 2026-11-15
  url: https://github.com/glvno/matryoshka/releases/tag/v1.16.0
  notes: Stores patterns on the FM-1 outside the patches, with a pattern library in the editor, makes five drum and drone instruments the whole original and adds chorus, delay and reverb to the poly synths. The bank grows to 60 slots.
- version: 1.15.0
  date: 2026-11-15
  url: https://github.com/glvno/matryoshka/releases/tag/v1.15.0
  notes: Runs drum kits, monophonic instruments and effects on the second processor core too, which lowers the busiest moment of the factory patches by up to 23 points of the FM-1's time, with unchanged sound. Steps tracks, the LED and key scan, moving filters, LFOs and envelopes also cost less, and the Reverb's tail starts about 3 ms later. Saved patches are kept on update. The release says the owner's device checks were not done before publication.
- version: 1.14.0
  date: 2026-11-13
  url: https://github.com/glvno/matryoshka/releases/tag/v1.14.0
  notes: Adds a 22-patch factory bank of 110 sounds authored with effects, and an editable master FX bus (Drive, Chorus, Delay and Reverb) on melodic instruments, with a MASTER FX page on the FM-1. Algo Four, Expander S and Hera 3 play fewer notes than in 1.13.0 to make room, and their old versions stay in Community. Saved patches are kept on update. The release says the owner's own headphone, playing-feel and power-cycle checks were not done before publication.
- version: 1.13.0
  date: 2026-11-10
  url: https://github.com/glvno/matryoshka/releases/tag/v1.13.0
  notes: All 27 piano-roll keys play their own pitches outside step recording, Harmonizer chords can feed the Arpeggiator and Steps (patch format 53), and a USB RETURN setting adds computer playback to the headphone output independently of the master knob. A saved device name is applied to the USB descriptors after reconnecting.
- version: 1.12.0
  date: 2026-11-09
  url: https://github.com/glvno/matryoshka/releases/tag/v1.12.0
  notes: Adds a Harmonizer module that plays a chord from one key, raises the core supply voltages at power-on as M-VAVE's own firmware does, builds the sound engine for speed and shares signal buffers so patches use less memory. The editor keeps live edits in step with the FM-1.
- version: 1.11.1
  date: 2026-11-09
  url: https://github.com/glvno/matryoshka/releases/tag/v1.11.1
  notes: Same firmware format as 1.11.0, with lighter engine code that renders identical audio and lowers the peak load of busy patches on the test rig. Cassia 1 plays four voices again.
- version: 1.11.0
  date: 2026-11-09
  url: https://github.com/glvno/matryoshka/releases/tag/v1.11.0
  notes: Patch format 51, which needs this firmware. Hera 4 takes Hera 6's slot with the Juno-106's panel, and Wanderer and Canvas take over their XL versions. Oracle V, Algo Four, Cassia 1, 8 Lire and Expander S gain more of their originals' controls. Adds a rate row and tape mode on the Delay, up to 128 modules per patch, an option in the system menu to switch off the speaker and headphone jack while recording over USB, and an editor setting that stops the editor from connecting to a unit. Saving no longer cuts the sound.
- version: 1.10.1
  date: 2026-11-08
  url: https://github.com/glvno/matryoshka/releases/tag/v1.10.1
  notes: FM-1s with the UC25HQ80 flash chip can now store patches and install updates; before, they reported no flash ID and refused updates.
- version: 1.10.0
  date: 2026-11-06
  url: https://github.com/glvno/matryoshka/releases/tag/v1.10.0
  notes: The FM-1 now plays on both processor cores, which cuts the audio load of poly patches by about a quarter to a third with the same sound. Adds a Verona Drum 1 engine with five presets, several delays, reverbs and similar effects per patch within a memory budget, drones that hold a note or row for the length of the pattern, a mono output option and a slot list when storing from the editor. Patches with a drone use patch format 50, which needs this firmware.
- version: 1.9.1
  date: 2026-11-04
  url: https://github.com/glvno/matryoshka/releases/tag/v1.9.1
  notes: Levels every factory patch and preset to about the same loudness without clipping, and gives each FM-1 engine a level row. Cassia 1's row names are shortened to make room for its volume row. Presets you stored for 11 engines stay with your own patches and do not yet appear on the new factory patches.
- version: 1.9.0
  date: 2026-11-04
  url: https://github.com/glvno/matryoshka/releases/tag/v1.9.0
  notes: Patch format 49. Adds parameter locks that give a step its own value for any row of its track's device, a Matrix module with four inputs and outputs, Shift register, Range and Comparator modules, phase-modulation inputs on the Oscillator, a smooth random LFO wave and route depths up to plus or minus 2. The editor gains lock editing in the Steps grid and renaming of any module.
- version: 1.8.4
  date: 2026-11-03
  url: https://github.com/glvno/matryoshka/releases/tag/v1.8.4
  notes: Web editor only; the firmware stays at 1.8.3. Corrects the editor's help card so its FM-1 rows match the device's buttons.
- version: 1.8.3
  date: 2026-11-02
  url: https://github.com/glvno/matryoshka/releases/tag/v1.8.3
  notes: The FM-1 now works with an iPad as a USB MIDI device and an audio input (tested on iPadOS 26 through a hub), sends MIDI clock over USB, records notes step by step on the SEQ page and moves the piano roll 8 pitches at a time. The editor adds signal-range labels, a readable scope and comment boxes.
- version: 1.8.2
  date: 2026-11-01
  url: https://github.com/glvno/matryoshka/releases/tag/v1.8.2
  notes: Renames the Multimode module to Multimode filter and makes module search find it by its old name. Sends Cassia 1 presets to the FM-1 with all 118 rows, and stops the Delay from clicking when its time changes.
- version: 1.8.1
  date: 2026-11-01
  url: https://github.com/glvno/matryoshka/releases/tag/v1.8.1
  notes: Web editor only; the firmware stays at 1.8.0. Fixes the editor sometimes moving one device or page further than the FM-1 when Live is on.
- version: 1.8.0
  date: 2026-11-01
  url: https://github.com/glvno/matryoshka/releases/tag/v1.8.0
  notes: The FM-1 shows a quick start card and a controls sheet opened with OCT- and OCT+, and its headers say why a control cannot act. Adds a global tempo shared by all patches, a snapshot A/B switch in the editor and an in-browser sandbox mode that looks like a device page. The firmware now identifies itself as FM-1_7010800.
- version: 1.7.1
  date: 2026-10-31
  url: https://github.com/glvno/matryoshka/releases/tag/v1.7.1
  notes: Cassia 1's preset now sets all of its card rows, and the FM-1 drops a voice when the audio glitches instead of waiting for two busy blocks in a row. The editor connects when macOS shows the FM-1 under another name, and a firmware package whose first byte is a "<" is no longer refused.
- version: 1.7.0
  date: 2026-10-30
  url: https://github.com/glvno/matryoshka/releases/tag/v1.7.0
  notes: Gives every FM-1 engine five hand-written presets and removes clipping from the factory sounds. An update now also refreshes factory patches you have not edited, with no factory reset; slots you saved stay as they are. Patches from 1.6 still play.
- version: 1.6.0
  date: 2026-10-29
  url: https://github.com/glvno/matryoshka/releases/tag/v1.6.0
  notes: On the FM-1, SEL now arms the device the keys play (SEL on an environment row layers several), REC records the same way on every page, and the piano roll's black keys pick rows. Patches from 1.5 still play.
- version: 1.5.1
  date: 2026-10-27
  url: https://github.com/glvno/matryoshka/releases/tag/v1.5.1
  notes: Web editor only; the editor starts about three times faster.
- version: 1.5.0
  date: 2026-10-27
  url: https://github.com/glvno/matryoshka/releases/tag/v1.5.0
  notes: Adds pattern memory and songs to Steps, new modules such as Selector and Follower, rebuilt FM-1 factory instruments and lower CPU use, and fixes an FM-1 freeze when no app on the computer reads its MIDI.
- version: 1.4.0
  date: 2026-10-26
  url: https://github.com/glvno/matryoshka/releases/tag/v1.4.0
  notes: Adds the Spokes 6 engine, six FM tracks after the Elektron Model:Cycles, with a larger Spokes 6 XL sandbox patch in the browser; the release says it was checked on the emulator, not on a device.
- version: 1.3.1
  date: 2026-10-25
  url: https://github.com/glvno/matryoshka/releases/tag/v1.3.1
  notes: Editor only; the firmware stays at 1.3.0.
- version: 1.3.0
  date: 2026-10-25
  url: https://github.com/glvno/matryoshka/releases/tag/v1.3.0
  notes: Faster paging and knob response on the FM-1, a sandbox mode for patches too big for the device, and a Community library section.
- version: 1.2.2
  date: 2026-10-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.2.2
- version: 1.2.1
  date: 2026-10-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.2.1
- version: 1.2.0
  date: 2026-10-24
  url: https://github.com/glvno/matryoshka/releases/tag/v1.2.0
  notes: Adds an arpeggiator and pattern track to the melodic factory patches and fixes the 909 kit.
- version: 1.1.0
  date: 2026-10-22
  url: https://github.com/glvno/matryoshka/releases/tag/v1.1.0
