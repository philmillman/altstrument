  url: https://github.com/glvno/matryoshka/releases/tag/v1.3.1
  notes: Editor only; the firmware stays at 1.3.0.
- version: 1.3.0
  date: 2026-10-25
  url: https://github.com/glvno/matryoshka/releases/tag/v1.3.0
  notes: Faster paging and knob response on the FM-1, a sandbox mode for patches too big for the device, and a Community library section.
