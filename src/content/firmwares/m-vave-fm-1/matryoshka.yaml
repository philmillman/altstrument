device: m-vave-fm-1
name: Matryoshka
summary: >-
  Modular synth framework for the FM-1: build patches from modules and nestable assemblies in a browser editor,
  send them over WebMIDI, and play them on a firmware that runs one patch at a time.
description: >-
  A fork of WiggisModular's Modular-1, which is in turn built on Felucca's hardware layer. The editor has 50 module
  types (oscillators, filters, envelopes, sequencers, an arpeggiator, granular, delay, reverb and others), 67 factory
  assemblies, factory patches that model other synths, and a library for the FM-1's 64 patch slots. Patches too big
  for the FM-1's CPU budget can still be edited and heard in the browser. Patches live in flash sectors that Felucca
  also uses, so a first start erases Felucca's projects and samples there; the README says to save them first.
  Patches stored by M-VAVE's own firmware are not touched. A browser emulator view runs the firmware itself. The README reports tests on
  a real FM-1 for installing, update mode, returning to V15 and recovery.
status: active
authors:
- name: glvno
  url: https://github.com/glvno
source: https://github.com/glvno/matryoshka
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only (LICENSING.md); the flasher, loader and hardware layer are copied from Felucca, and the project derives
  from Modular-1, also GPL-3.0-only. web/public/firmware/FM-1_015.fwsc in the repository is M-VAVE's FM-1 V15 image,
  git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, the file M-VAVE licenses for redistribution under Apache-2.0 in
  m-vave/fm1_open; the editor's Return to official V15 sends it. Ported DSP and fonts keep their own licences.
homepage: https://matryoshka.lol/
distribution: browser-installer
requires_stock: V15 or Matryoshka
install_notes: >-
  Install panel of the browser editor (Chrome or Edge, WebMIDI with SysEx), or tools/fm1_install.py with the package
  from a release. Return to official V15 first if the FM-1 runs Felucca, SLOOP or another build. Returning to V15 can
  fail with "update failed -5" on a unit that M-VAVE's FM1 Open set up, because its boot code differs; the README
  lists MvaveFM1Unbricker as the way back in that case. Save Felucca data first, since the first start erases its
  flash sectors.
brick_risk: true
tags: [synth-engine, modular, editor, emulator, patch, sequencer, arpeggiator, fork]
versions:
- version: 1.7.1
  date: 2026-10-31
  url: https://github.com/glvno/matryoshka/releases/tag/v1.7.1
  notes: Cassia 1's preset now sets all of its card rows, and the FM-1 drops a voice when the audio glitches instead of waiting for two busy blocks in a row. The editor connects when macOS shows the FM-1 under another name, and a firmware package whose first byte is a "<" is no longer refused.
- version: 1.7.0
  date: 2026-10-30
  url: https://github.com/glvno/matryoshka/releases/tag/v1.7.0
  notes: Gives every FM-1 engine five hand-written presets and removes clipping from the factory sounds. An update now also refreshes factory patches you have not edited, with no factory reset; slots you saved stay as they are. Patches from 1.6 still play.
- version: 1.6.0
  date: 2026-10-29
  url: https://github.com/glvno/matryoshka/releases/tag/v1.6.0
  notes: On the FM-1, SEL now arms the device the keys play (SEL on an environment row layers several), REC records the same way on every page, and the piano roll's black keys pick rows. Patches from 1.5 still play.
- version: 1.5.1
  date: 2026-10-27
  url: https://github.com/glvno/matryoshka/releases/tag/v1.5.1
  notes: Web editor only; the editor starts about three times faster.
- version: 1.5.0
  date: 2026-10-27
  url: https://github.com/glvno/matryoshka/releases/tag/v1.5.0
  notes: Adds pattern memory and songs to Steps, new modules such as Selector and Follower, rebuilt FM-1 factory instruments and lower CPU use, and fixes an FM-1 freeze when no app on the computer reads its MIDI.
- version: 1.4.0
  date: 2026-10-26
  url: https://github.com/glvno/matryoshka/releases/tag/v1.4.0
  notes: Adds the Spokes 6 engine, six FM tracks after the Elektron Model:Cycles, with a larger Spokes 6 XL sandbox patch in the browser; the release says it was checked on the emulator, not on a device.
- version: 1.3.1
