  notes: No tagged releases at the time; this was the latest commit, which adds a scale beside every fader of the patch editor. app/VERSION reads 0.14.1, up from 0.8.1 in the previous row, with a 64-step sequencer, a stereo delay and plate reverb, distortion, Juno-6 chorus and compressor, 128 patch slots in four banks, saving to any slot with naming, and random patches.
