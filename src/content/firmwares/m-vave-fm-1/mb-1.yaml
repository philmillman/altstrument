device: m-vave-fm-1
name: MB-1
summary: >-
  Minibrute-style monophonic synth for the FM-1 with Ultrasaw, PWM and Metalizer oscillators, a resonant multimode filter with Brute Factor, two ADSRs, an LFO, an arpeggiator and a browser emulator.
description: >-
  The voice engine is portable C written from scratch and calibrated against renders of Arturia's MiniBrute V plugin; the README says no Arturia code is used and that the unofficial project is not affiliated with Arturia. It mixes a sawtooth with Ultrasaw, a square with PWM and a triangle with Metalizer, plus a sub oscillator and noise, into a 12 dB low-pass, band-pass, high-pass or notch filter with key tracking and self-oscillation. Filter and amplifier ADSRs, a six-wave LFO to pitch, filter, PWM and amplifier, vibrato, glide, vintage drift, aftertouch and a mod wheel are included. An arpeggiator arrived in 0.8.0. It is built on fm1-base, and the repository's workflow builds the package, runs the host simulator tests and publishes a site with an installer, an emulator and a manual. The README says the measured Metalizer cycles used during development are not published.
