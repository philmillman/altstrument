- version: 0.15.0
  date: 2026-11-23
  url: https://github.com/leonardolopezchavira/minibrute-fm1/releases/tag/v0.15.0
  notes: The release page has no notes. Commits say the factory bank A of 32 patches (A01 to A32) is what a new install and the emulator start with, the factory patches have their own names, and the firmware answers as identity FM-1_49 (FM-1_49001500 for 0.15.0) so The Firmware Hub can list it as MB-1. The package is mb1-0.15.0.fwsc.
