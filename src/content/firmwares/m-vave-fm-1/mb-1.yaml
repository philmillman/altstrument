  date: 2026-11-24
  url: https://github.com/leonardolopezchavira/minibrute-fm1/commit/01a7e31b7d23656eb290b3c660b77ae90dd79fed
  notes: This is the latest commit, made after the 0.15.0 release; app/VERSION moves to 0.20.0. Since the previous row the project adds a build for the M-VAVE SMK-37 Pro with its own panel mapping, step sequencer on the pads and a piano roll, lowers latency, widens the octave range to three up or down, makes REC held for a second clear the pattern, starts on patch A01 at power-on and adds backup and restore.
- version: main @ 240a7e7
  date: 2026-11-23
  url: https://github.com/leonardolopezchavira/minibrute-fm1/commit/240a7e761d8ddaa460afeccb9abbd5cbdceaad33
