device: m-vave-fm-1
name: MC-1
summary: >-
  Original 1990s-style groovebox: three melodic parts with LA- or 303-inspired engines (128 presets), a 16-lane
  synthesized drum part with eight kits, 64 patterns, song mode, effects and an arpeggiator.
description: >-
  Not an emulation of any Roland product and without Roland data. Patterns have 16 steps; parts can be
  recorded live, step-edited, accented and slid, and pattern changes queue to the next bar. A song screen
  chains up to 128 entries. It has USB MIDI, TRS MIDI in and stereo USB audio out. Hardware support is
  copied from ORBIT. The 1.0.1 release notes record an over-the-air install, reboot and identification on an
  FM-1, plus timing and USB recording captures with no missed deadlines and a worst-case headroom of 2.8
  percent; analog listening and power-loss recovery are listed as unverified. Since 1.1.0 it runs on both FM-1
  CPU cores, and 1.2.0 replaced the LA sounds with recorded attacks and synthesized sustain. The same C core runs
  in the separate MC-1 web emulator.
status: active
authors:
- name: dspaudio
  url: https://github.com/dspaudio
source: https://github.com/dspaudio/mc-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Code and generated assets are GPL-3.0-only; the instrument recordings (Meta Open Sound piano and nylon guitar,
  and 15 families from VSCO 2 Community Edition) and their converted PCM data are CC0-1.0 (NOTICE.md). The package
  carries JieLi SDK boot files under Apache-2.0. Restricted upstream artwork and sample packs are excluded.
homepage: https://dspaudio.github.io/mc-1/
distribution: browser-installer
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, or the desktop installer zip attached to the
  release (INSTALL.md, fm1_install.py). The installer checks the package's SHA-256, CRCs and product before
  writing; stop playback and keep USB and power connected until it restarts. Saves use two flash banks at
  0x99000..0xAAFFF that other firmware may share, and an update is not a backup. Hold OCT- and OCT+ for five
  seconds while stopped to reach UBOOT.
brick_risk: false
tags: [sequencer, drums, synth-engine, fx, midi, usb-audio, emulator]
