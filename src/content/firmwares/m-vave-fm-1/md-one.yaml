device: m-vave-fm-1
name: MD-One
summary: >-
  Work-in-progress drone machine built on Mutable Instruments' Braids oscillators, tuned combs and drift, played
  from the keys and recorded into a DAW over USB audio; it has run only on the host and in an emulator.
description: >-
  The firmware starts from a fork of Dinghy and has a drone engine of four always-on voices with a modulation
  system and an AHDSR envelope. The synthesis code in dsp/ is the author's own MIT-licensed
  fixed-point code plus a vendored Braids port that builds for the FM-1's CPU, with the repository's
  measurements giving four voices as roughly a fifth of the audio budget. The README says no FM-1 has been
  connected or flashed (two units were on order) and that the playable interface is not finished. The
  repository also holds notes on the chip, a survey of other FM-1 firmwares and a firmware safety plan.
status: active
authors:
- name: Nico (d0pe1)
  url: https://github.com/d0pe1
source: https://github.com/d0pe1/md-one
based_on: m-vave-fm-1/dinghy
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Dinghy (LICENSING.md). dsp/shared, dsp/host and dsp/engine are MIT, and dsp/mi is vendored
  Mutable Instruments source under Emilie Gillet's MIT headers.
distribution: source-only
install_notes: >-
  Build with the scripts in the repository (JieLi toolchain under WSL, scripts/check-all.sh), which also loads
  the result into the fm1-emu emulator. The README says nothing has been flashed to a device, and
  docs/FIRMWARE_SAFETY.md sets conditions to meet before any physical write.
brick_risk: false
tags: [synth-engine, generative, ambient, emulator, research, usb-audio]
