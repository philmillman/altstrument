install_notes: >-
  The README links the 0.5.7 .fwsc package, committed under downloads/ with its SHA-256 in the release notes, and gives no install steps; the package identity is FM-1_63620001. docs/build.md gives a build that applies the repository's patches to a Dinghy checkout, then checks the result against that checksum. Dinghy keeps its update loader and writes only the firmware area, so the FM-1's ROM boot mode remains the way back.
