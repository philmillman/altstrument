device: m-vave-fm-1
name: MDMA
kind: firmware
summary: >-
  Performance firmware with six toggled layers, four scenes for each city preset and a 16-step drum sequencer, plus a browser page that backs up and restores the cities.
description: >-
  Each city is a preset with INTRO, GROOVE, TENSION and PEAK scenes. Six layers (drums, bass, ambient, pluck, lead and sparks) are switched on and off with the black keys, while the white keys play the selected layer in the city's scale. The pages cover a mixer with volume, pan, filter and resonance, an effects bank with reverb, delay, phaser and saturation, a four-band EQ, tone controls for each layer and a scale page. The drum sequencer edits 16 steps in six lanes with velocity, timing, attack and release for each step, queued fills and a draft HAT and PERC variation. A separate HTML page backs up the cities as JSON over WebMIDI and restores them. The source is published as a patch against the Dinghy platform plus a pattern file. The release notes say installation and update transitions on 0.5.7 were not yet confirmed on hardware.
