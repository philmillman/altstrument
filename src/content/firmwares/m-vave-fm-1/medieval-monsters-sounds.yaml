device: m-vave-fm-1
name: Medieval Monsters Sounds
summary: >-
  Groovebox in progress, forked from FIZZ, in which six creatures from medieval manuscript margins each play an instrument and move on screen when their track sounds. Not yet ready to install.
description: >-
  Rights warning: the speech code in core/voice/sam, inherited from the base, is a port of the 1982 Software Automatic Mouth that has no licence, and its original rights belong to SoftVoice, Inc.; LICENSING.md says it is being removed. The design gives each track a beast and an instrument: shawm, formant chant sung in Latin, hurdy-gurdy, inharmonic bells, tabor and psaltery. The edit page is drawn as an illuminated folio with the steps on a vine, and eight effects are rooms, with a send per track into each. Per-step locks, chance, conditions, ratchets, micro-timing and MIDI effects per track come from FIZZ, as do USB and Bluetooth MIDI and USB audio. The README says the sequencer, controls and platform are in place and tested, while the medieval engines, art and screens are still being built, so today the firmware sounds and looks like its base. There is no release or package yet, only source with host tests, screen renders and a build for the FM-1, plus a mood-board site.
status: announced
authors:
