source_status: open
license: MPL-2.0
license_notes: >-
  LICENSING.md states MPL-2.0 for the firmware, a fork of Michael P Jones's FIZZ, with the fm1-base port under MPL-2.0 and test oracles that build ChoralRoot's GPL-3.0-only code used for development only. Third-party parts are plutovg (MIT with FreeType License parts), stb headers (MIT or Unlicense), the Inter Tight font (SIL OFL 1.1) and a SID model (BSD-2-Clause). The SAM speech port has no licence, as the rights warning says.
homepage: https://saulofilho.github.io/medieval-monsters-sounds/
based_on: m-vave-fm-1/fizz
distribution: source-only
install_notes: >-
  Not ready to install according to the README. To build the package, update the submodules and run firmware/build.py with Docker, the JieLi toolchain and the AC79 SDK as BUILDING.md describes. The README documents no recovery steps; M-VAVE's own V15 package and updater put the stock firmware back.
