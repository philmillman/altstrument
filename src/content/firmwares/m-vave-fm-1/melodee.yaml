versions:
- version: 1.6.1
  date: 2026-11-02
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.1
  notes: Sends MIDI clock and transport on USB, USB Host and Bluetooth, sends Song Position and follows it, fixes internal clock drift and rewrites the manual. Stored data is unchanged from 1.6.0. The author says clock output has not been tried against external gear on hardware.
- version: 1.6.0
  date: 2026-11-02
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0
  notes: Stable release of the 1.6 line (changes since 1.5.1). Adds 64 song sections, timed punch effects, a preset per block or pattern, 16 patterns per synth track, 32 projects, Bluetooth MIDI, MIDI learn, two drum kits and note editing during playback. Older firmware cannot read what 1.6 saves, so back up first.
- version: 1.6.0-rc.8
  date: 2026-11-01
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.8
  notes: Pre-release; stable stays 1.5.1. Puts the factory sounds into the firmware package, so an install through the Firmware Hub brings the presets. Updating from 1.5.1 or earlier through the Hub needs two installs, and a screen reports unfinished setup when the sounds are missing.
- version: 1.6.0-rc.7
  date: 2026-10-29
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.7
  notes: Pre-release. Fixes a song started from a later row playing a burst of earlier recorded notes, and the dim key lights shimmering.
- version: 1.6.0-rc.6
  date: 2026-10-28
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.6
  notes: Pre-release. Adds CR-78 and two-operator FM drum kits, a sound preset per pattern, note editing while the sequence plays, pattern copy to another track and nearest-degree snapping for microtonal scales; USB Host also finds audio and MIDI devices.
- version: 1.6.0-rc.5
  date: 2026-10-27
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.5
  notes: Pre-release. Sixteen patterns on each synth track, a shared storage pool of 32 projects in place of four fixed slots, the Rubik font back, and Bluetooth radio self-calibration.
- version: 1.6.0-rc.4
  date: 2026-10-26
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.4
  notes: Pre-release. Adds per-block sound copies in the song view and a visual editor for song punch effects; changes project storage and the firmware font.
- version: 1.6.0-rc.2
  date: 2026-10-26
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.2
  notes: Pre-release. Adds timed master punch effects to song sections, up to four per section.
- version: 1.6.0-rc.1
  date: 2026-10-26
  url: https://github.com/keremimo/melodee/releases/tag/v1.6.0-rc.1
  notes: Pre-release. Songs of 64 sections with a minutes-and-seconds ruler, per-track rests, block resizing, loop song and Bluetooth work.
- version: 1.5.1
  date: 2026-10-26
  url: https://github.com/keremimo/melodee/releases/tag/v1.5.1
  notes: Fixes the web editor's "Invalid favorites reply" error with 1.5 firmware; audio and stored projects are unchanged.
- version: 1.5.0
  date: 2026-10-25
  url: https://github.com/keremimo/melodee/releases/tag/v1.5.0
  notes: Adds four MIDI-only tracks (eight in all), USB Host input and output, automatic chord modes and master punch effects.
- version: 1.5.0-rc.4
  date: 2026-10-25
  url: https://github.com/keremimo/melodee/releases/tag/v1.5.0-rc.4
  notes: Pre-release. Compresses the startup code, recovers MIDI clock and quiets idle USB host handling.
- version: 1.5.0-rc.3
  date: 2026-10-25
  url: https://github.com/keremimo/melodee/releases/tag/v1.5.0-rc.3
  notes: Pre-release. Frees audio memory and flash, halves the PUNCH history length, and fixes metronome volume and FM6 SysEx reception.
