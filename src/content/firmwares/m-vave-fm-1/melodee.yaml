  date: 2026-10-24
  url: https://github.com/keremimo/melodee/releases/tag/v1.5.0-rc.2
  notes: Pre-release. Adds AUTO and AUTO2 chord modes and MIDI controller profiles for the eight panel controls.
- version: 1.5.0-rc.1
  date: 2026-10-24
  url: https://github.com/keremimo/melodee/releases/tag/v1.5.0-rc.1
  notes: Pre-release. Adds a MIDI Track engine, four extra MIDI-only tracks, USB Host, a revised master punch and more insert effects.
- version: 1.4.5
  date: 2026-10-19
  url: https://github.com/keremimo/melodee/releases/tag/v1.4.5
  notes: Renames the USB device to Melodee FM-1, steadies the displayed tempo under external MIDI clock and shares ROOT across tracks.
- version: 1.4.4
  date: 2026-10-18
  url: https://github.com/keremimo/melodee/releases/tag/v1.4.4
  notes: Adds signed build provenance; the firmware is unchanged from 1.4.3.
