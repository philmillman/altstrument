device: m-vave-fm-1
name: Melodrum
summary: >-
  Generative melody and drum firmware for the FM-1: four melody generators and the Grids drum map run on the unit
  and play out over USB or BLE MIDI, with a small preview synth voice so it also makes sound alone.
description: >-
  Melogen writes the tune with Random, Markov, Euclidean and Contour generators over twelve scales, seeded so a
  pattern can be reproduced, and a DrumMap port of the Mutable Instruments Grids pattern map plays kick, snare and
  hat underneath. Melody goes out on MIDI channel 1 and drums on channel 10 as GM notes 36, 38 and 42. Six pages
  (main piano roll, drum, step, generator, synth, system) cover density, map position, fills, levels, swing and a
  two-channel 16-step kick and snare sequencer that replaces the map for a part once a step is set. Each kick ducks
  the preview voice, which is an oscillator into a resonant low-pass filter and an ADSR. The system page chooses
  between internal tempo and MIDI clock from USB, the TRS jack or BLE MIDI. Settings autosave, and the About
  screen shows the version and seed. The README notes that the TRS jack is MIDI in only, so a computer or USB-MIDI
  bridge is needed to reach other gear. It builds with the foma toolchain. The author reports it verified on an
  original FM-1 and untested on units with the newer UC25HQ80 flash chip.
status: active
