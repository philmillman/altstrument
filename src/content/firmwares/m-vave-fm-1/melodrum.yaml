license: GPL-3.0-only
license_notes: >-
  The README says Melodrum is GPL-3.0, following the foma and Felucca platform and the Grids pattern data (Mutable
  Instruments, GPL-3.0); the repository has no LICENSE file and the statement names no version, so -only is used.
  The DrumMap applet algorithm is MIT (Ben Rosenbach, Phazerville) and Melogen is the author's own.
homepage: https://github.com/yakovkhalinsky/melodrum-fm1
based_on: m-vave-fm-1/foma
distribution: download
install_notes: >-
  The docs ask for a full backup in Tessera's web editor first, then installing melodrum-1.5.fwsc from the release with
  the foma installer page in Chrome or Edge, fm1_install.py or ./fm1 flash, without a hub. Holding OCT- while
  switching on gives USB rescue, two failed boots do the same, and stock V15 can be reinstalled with the installers.
brick_risk: false
