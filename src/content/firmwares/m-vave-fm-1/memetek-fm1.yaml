device: m-vave-fm-1
name: Memetek FM1
summary: >-
  Six-track groovebox for 8-bit memetek on the FM-1: tek kicks, hi-hats, 8-bit bass, chip arp and lead, and 96
  synthesised meme sounds, with a 16-step sequencer, four patterns and a browser emulator.
description: >-
  Written as a module for fm1-dock and also released as a standalone package. The six tracks are TEK-KICK, HI-HATS, 8BIT
  BASS, CHIP ARP, 8BIT LEAD and MEME FX. The bass, arp and lead tracks use nine waveforms including supersaw, FM, PWM, sync
  and fold, with five LFOs, a mixer with pan and echo, a bitcrusher and drive. The meme sounds sit in six banks of 16 (cartoon,
  arcade, meme, animal, sci-fi, party) and are synthesised live. The sequencer has four patterns with chaining, a random
  pattern button and tap tempo. The README, handbook and manual are in German with an English manual, and the project site hosts
  a browser emulator. Every release says it has not been tested on real hardware, and the first releases carried other
  names (MEMETEK, g0dsgift). The README credits g0dsgift777 as the inspiration.
status: active
