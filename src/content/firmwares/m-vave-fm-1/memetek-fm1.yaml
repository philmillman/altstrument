homepage: https://g0rst.github.io/memetek-fm1/
based_on: m-vave-fm-1/fm1-dock
distribution: download
install_notes: >-
  Either install fm1-dock once and drop memetek-fm1.dock from the release on its web console in Chrome or Edge, then hold HOME
  and pick MEMETEK FM1, or flash the standalone memetek-fm1.fwsc (identity FM-1_964). The README says the way back is the
  FM-1 Firmware Hub or M-VAVE's updater, and that installing is at your own risk.
