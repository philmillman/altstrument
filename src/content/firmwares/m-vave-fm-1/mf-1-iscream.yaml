device: m-vave-fm-1
name: iScream
kind: firmware
summary: >-
  Twelve-flavor FM synth for the FM-1 where the cone is the filter and the toppings are the effects, with a screen that draws the sundae being built; a C port of the MF-1 engine on fm1-base.
description: >-
  The firmware is the second mode of the MF-1 emulator, built as a real FM-1 app. Flavors are the sounds, with scoops, a cone
  filter and five toppings acting as effects, and it uses only what the FM-1 has, so the flavors export as a standard DX7 bank.
  The engine is a C port of the MF-1 engine, and a parity test checks that it renders the same samples. The latest commit adds a battery
  icon and a low-battery screen. The README says it has run on one unit, where it boots, plays and has logged no crash, and that CPU
  load, dropouts and output level have not been measured. No firmware package is attached to a release.
status: active
authors:
- name: Ian Butterworth
  url: https://github.com/IanButterworth
source: https://github.com/IanButterworth/mf-1/tree/main/firmware/iscream
source_status: open
license: MIT
license_notes: >-
  The repository LICENSE is MIT. It builds on fm1-base and felucca-bsp, which are MPL-2.0 and linked as a submodule, and the
  README says a built .fwsc contains JieLi SDK files under Apache-2.0 whose licence texts must go with any package shared.
distribution: source-only
install_notes: >-
  Build with fm1-base's build script, the JieLi toolchain and the AC79 SDK, which need Docker. The project's install notes say to back
  up the flash first, keep a rescue route ready, and go through official V15 and then TransitFM1 before iScream, since TransitFM1 writes
  the next firmware so that a cut-off install comes back in update mode. To go back, install M-VAVE's V15.
brick_risk: false
tags: [synth-engine, fm, fx, presets]
