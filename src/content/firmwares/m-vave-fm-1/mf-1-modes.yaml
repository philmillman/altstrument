source: https://github.com/IanButterworth/mf-1/tree/main/firmware/fm1-modes
source_status: open
license: MIT
license_notes: >-
  The repository LICENSE is MIT. It builds on fm1-base and felucca-bsp, which are MPL-2.0 and linked as a submodule, and the
  README says a built .fwsc contains JieLi SDK files under Apache-2.0 whose licence texts must go with any package shared.
distribution: source-only
install_notes: >-
  Build with fm1-base's build script, the JieLi toolchain and the AC79 SDK, which need Docker. The project's install notes say to back
  up the flash first, keep a rescue route ready, and go through official V15 and then TransitFM1 before this firmware, since TransitFM1 writes
  the next firmware so that a cut-off install comes back in update mode. To go back, install M-VAVE's V15.
brick_risk: false
