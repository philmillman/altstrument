device: m-vave-fm-1
name: MF-1 Modes
kind: firmware
summary: >-
  One FM-1 firmware that runs the MF-1 emulator's synth modes, iScream, Almanac, Woof, Phase, Piano, Arpeggi and Rhymes, on fm1-base, each keeping its own settings and chosen by holding a piano key at power-on.
description: >-
  The firmware ports the MF-1 emulator's extra modes to the FM-1 as a real app. Until 1.5.0 the repository built iScream on its own;
  it now builds one firmware, fm1-modes, that starts the last mode used and shows a chooser when a piano key is held at
  power-on. A shared core handles keys, the arpeggiator, MIDI, saving and the screen, and each mode keeps its own settings
  store. In iScream, flavors are the sounds, with scoops, a cone
  filter and five toppings acting as effects, and it uses only what the FM-1 has, so the flavors export as a standard DX7 bank.
  The engine is a C port of the MF-1 engine, and a parity test checks that it renders the same samples. The README says it has run on one unit, where it boots, plays and has logged no crash, and that CPU
  load, dropouts and output level have not been measured. Phase, a mode for slowly shifting process music with a ring-shaped score, was added in 1.7.0 and played on hardware at about 31 to 33 frames a second by 1.8.0. Piano, a grand piano played back from measurements, came in 1.10.0 as a fifth mode, and the README says it has run on one FM-1 with its CPU load not yet measured. Arpeggi, two arpeggiators playing one pool of notes, joined in 1.11.0 as a sixth mode chosen with D at power-on; the release says it has run on one FM-1 with its CPU load not measured. Rhymes, nursery rhymes for small children to learn on the keys, came in 1.12.0 as a seventh mode; the release says it has been installed on one FM-1 and starts there. No firmware package is attached to a release.
