device: m-vave-fm-1
name: MIAOU
summary: >-
  Toy cat keyboard after the Meowsic: five sounds including a meow voice, five beats, 20 children's songs and seven cat
  songs, a 50-note recorder, plus an arpeggiator and a 6-track sequencer.
description: >-
  A paw button makes every key meow, and the screen shows the toy's face, with a cat whose eyes follow the notes and whose
  mouth opens when it meows. The sounds are piano, bells, organ, banjo and a three-formant meow, all synthesized, and a
  toy-speaker knob thins and crushes the output. Rhythms are rock, blues, samba, techno and disco. The songs are traditional
  public-domain tunes written out note by note. The arpeggiator has 14 modes and the sequencer has six tracks of 64 steps and
  four patterns, both from the author's LAX-32. The README (in French) calls it independent of B. toys, Battat and
  M-VAVE. It is built on konsumer's foma framework.
