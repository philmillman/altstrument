  engine library keeps M-VAVE's separate terms (THIRD_PARTY.md). The repository root has no licence file.
  src/sdk/firmware/FM-1_015.fwsc matches M-VAVE's FM-1 V15 image licensed Apache-2.0 (git blob
  ce49cc1595b67347c68a3ac7463017f9fa8c19dd).
homepage: https://midihax.github.io/fm1-midi-processor/html/
distribution: browser-installer
install_notes: >-
  Flash page in desktop Chrome or Edge over USB, a stand-alone updater page attached to the release, or the .fwsc
  package with a flasher that supports FM1 Open firmware. tools/fm1_flash.py builds and flashes from source.
