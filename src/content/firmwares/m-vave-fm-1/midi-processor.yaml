device: m-vave-fm-1
name: FM-1 MIDI Processor
summary: >-
  Turns the FM-1 into a stand-alone MIDI processor that monitors, filters, remaps and re-channels messages from TRS
  and USB input, sends trigger lists, and has a metronome and 16 patches.
description: >-
  Built on M-VAVE's FM1 Open SDK. TRS and USB input each pass their own channel and message filters, then shared
  message and channel remaps, on the way to USB MIDI out. The monitor lists the last 100 messages, colours them by
  what the pipeline did, and can turn a selected message into a rule or a trigger. The knobs send CCs and the keys
  send notes and program and bank changes. Patches can be saved to and loaded from a computer over SysEx.
status: active
authors:
