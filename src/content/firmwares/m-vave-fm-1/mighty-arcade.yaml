device: m-vave-fm-1
name: Mighty Arcade
summary: >-
  Eighteen casual games for the FM-1 that each double as a generative sequencer, from chess, solitaire and pinball to golf, pool and a worm, using Mighty Arp's sound engine, with a browser emulator.
description: >-
  The menu has two pages of nine games: DRIFT, BOUNCE, SWARM, CHESS, DICE SYNTH, SOLITAIRE, WORM, CUBES, DEFUSE, GOLF, PINBALL, DODGE, DARK, DROP, POOL, ROWS, 2048 and CHECKERS. In the sequencer games the board, cards or captured pieces become notes that a playhead plays in time, with drums that enter as play progresses. DICE SYNTH rolls a new FM sound for the keys. The lowest keys act as a game pad and F5 selects. PRESET sets a scale and ALGORITHM a key shared by all games, and the four knobs set tempo, note chance, sound and effects level. CHESS, CHECKERS and ROWS play against the computer or a second player. The sound engine comes from the same author's Mighty Arp and the chord voicings from the author's Macro MIDI Pad. It is built on fm1-base and passes its words to the FM-1 Screen Reader. The README says it was developed with AI assistance.
