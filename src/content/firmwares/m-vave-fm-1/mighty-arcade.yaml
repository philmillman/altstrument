install_notes: >-
  Use the installer on the project site in Chrome or Edge with the FM-1 on USB, or build with build.sh and write app/build/mightyarcade.fwsc with base/tools/fm1_install.py. The README says fm1-base's installer can put M-VAVE's firmware back and that an FM-1 that fails to start twice comes up in a safe mode the installer can reach. Installing is at your own risk.
