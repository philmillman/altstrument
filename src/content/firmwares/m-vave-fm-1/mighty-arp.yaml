license: MPL-2.0
license_notes: The fm1-base submodule in base/ is also MPL-2.0.
distribution: source-only
install_notes: >-
  No release is published yet, and the browser installer site the README mentions is not live. Clone the repository with its
  submodule and build with build.sh; python3 base/tools/fm1_install.py then installs the package over USB and can put
  M-VAVE's firmware back. Installing is at your own risk.
brick_risk: true
