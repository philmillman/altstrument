device: m-vave-fm-1
name: Mighty Arp
summary: 4-operator FM and subtractive synth built around a chance arpeggiator with 13 modes, plus a 32-step sequencer, 50 sounds, a random sound maker, 16 user presets and MIDI over USB and TRS.
description: >-
  You hold a chord and a CHANCE control sets how likely each arpeggiator step is to play. The arpeggiator can build chords
  in a chosen key and scale, strum them, and add swing, humanize, octave jumps and velocity spread. The sequencer writes
  steps from the keys, transposes them live and uses the same chance. Sounds come from a 4-operator engine with analog-style
  waves, a filter and its envelope, followed by chorus, ping-pong delay and a reverb with shimmer. MIDI runs in and out with
  clock either way, and over USB it is also a sound card. It is built on fm1-base and felucca-bsp. The first commit landed on
  2026-11-04 and 1.0 followed the same day. It keeps its own settings and presets and does not read other firmwares' projects
  or samples. The project site has a browser emulator, an installer and a manual.
status: active
authors:
- name: NickCulbertson
  url: https://github.com/NickCulbertson
source: https://github.com/NickCulbertson/FM1-Mighty-Arp
source_status: open
license: MPL-2.0
license_notes: The fm1-base submodule in base/ is also MPL-2.0.
homepage: https://nickculbertson.github.io/FM1-Mighty-Arp/
distribution: browser-installer
install_notes: >-
  Use the installer page on the project site in Chrome or Edge with the FM-1 on USB, or write the .fwsc from a release with
  python3 base/tools/fm1_install.py, which can also put M-VAVE's firmware back; an FM-1 that fails to start twice comes up in
  a safe mode the installer can reach. Building from source needs the repository cloned with its submodule and build.sh.
  Installing is at your own risk.
brick_risk: false
tags: [synth-engine, fm, arpeggiator, sequencer, generative, midi, usb-midi, fx]
versions:
- version: '1.4'
  date: 2026-11-10
  url: https://github.com/NickCulbertson/FM1-Mighty-Arp/releases/tag/v1.4
  notes: The release notes only link a changelog. The commits since 1.3 grow the sounds to 50 in eight kinds, add a RANDOM sound maker that keeps the last eight rolls, and let a sound change leave the arpeggiator, chords and steps playing; the PARAMS knob is gone and saved settings reset.
- version: '1.3'
  date: 2026-11-05
  url: https://github.com/NickCulbertson/FM1-Mighty-Arp/releases/tag/v1.3
  notes: The release notes only link a changelog. The one commit since 1.2 changes the package identity to eight digits (FM-1_62790103) and adds a build script that leaves the patch digits out of the identity; the firmware code is not touched.
- version: '1.2'
  date: 2026-11-05
  url: https://github.com/NickCulbertson/FM1-Mighty-Arp/releases/tag/v1.2
  notes: The release notes only link a changelog. The commits since 1.1 update the fm1-base layer so the UC25HQ80 flash chip of newer FM-1 units saves, and add a Firmware Hub card.
