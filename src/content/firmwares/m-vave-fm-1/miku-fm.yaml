versions:
- version: '0.8'
  date: 2026-11-10
  url: https://github.com/MichaelAPerry/MIKU-FM1/releases/tag/v0.8
  notes: Smoother dance animation, equal outfit heights, display fixes on the bank and library pages, naming of user voices and the sustain pedal on every sound. Songs and banks from 0.7 load unchanged.
- version: '0.7'
  date: 2026-11-09
  url: https://github.com/MichaelAPerry/MIKU-FM1/releases/tag/v0.7
  notes: Adds a six-operator DX7-style engine with ten voices, a BANK page, DX7 bank import over USB, MIDI keyboard input, ten song slots with four Japanese folk songs, a lyrics page, new GEN styles and twelve outfits. Songs that use DX7 sounds need a new song format, and both flash chip versions are supported.
- version: '0.6'
  date: 2026-11-04
  url: https://github.com/MichaelAPerry/MIKU-FM1/releases/tag/v0.6
  notes: Early build. Adds the STAGE page with its syllable dial, knob banks and deeper SOURCE, FX, articulation and harmony layers, a DANCE page and the GEN song generator; songs from earlier builds still load.
