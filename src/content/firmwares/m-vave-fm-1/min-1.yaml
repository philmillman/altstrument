install_notes: >-
  Installer page in Chrome or Edge with the FM-1 connected, or tools/fm1_install.py with the .fwsc from the
  releases page. An FM-1 that fails to start twice comes up in a safe mode with USB on. The installer page
  offers a return to M-VAVE's own firmware, which you download from M-VAVE yourself.
