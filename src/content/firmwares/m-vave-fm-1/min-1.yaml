device: m-vave-fm-1
name: MIN-1
summary: >-
  Self-playing minimalist ensemble in the manner of 1960s to 1980s process music, with four models and twenty
  pieces that you can take over by playing chords, rolling new ideas and recording songs.
description: >-
  The four models are arpeggio (chord figures with additive process), phase (one figure on two parts that drift
  apart and realign), patterns (a chain of slightly changed patterns played at different paces) and bells (a
  stepwise melody answered by bells). In the default EASY key mode each white key is a chord that fits the current
  key, and a chord cycle can be learned from the chords you play. Parts can be brought in and out by hand, and
  eight songs can be recorded and played back exactly. It starts from the AMB-1 app layer and simulator, whose
  platform comes from Felucca by way of X0X and FoMni. A browser emulator and a browser installer are published
  on the project site.
