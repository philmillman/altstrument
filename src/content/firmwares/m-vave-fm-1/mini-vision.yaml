device: m-vave-fm-1
name: Mini-Vision
summary: >-
  Mini-Tone fork modelled on Roland's n/vision: a two-layer wavetable engine with ladder-style filters and a TR-808
  engine, six tracks, a 64-step sequencer and a redrawn interface.
description: >-
  Strips Mini-Tone down to two engines. WTSYNTH has two wavetable layers drawn from 63 tables in five families, a
  position control that moves through each table's frames, a sine-fold wave shaper, phase modulation, and a filter with
  twelve and twenty-four decibel types plus three ladder low passes named after Roland, Moog and Sequential designs.
  The other is the TR-808 engine of 16 voices carried over from Mini-Tone. The remaining Mini-Tone engines are removed,
  though their numbers stay reserved, so a sound that names one loads silent. The interface is redrawn after the
  n/vision's screens with graph panels over four knob cards, eleven colour palettes and new sequencer pages. The
  sequencer, songs, effects and MIDI features come from Mini-Tone and Felucca. The README lists what the n/vision has
  that this does not yet: a high-pass filter, user wave-shaper tables, a step LFO, a drawing mode, an EQ and 56 voices
  (this has 8). The bundled web editor is still Mini-Tone's.
status: active
authors:
- name: Stéphane Schmitz (eldontyrellcorp)
