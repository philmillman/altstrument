license_notes: >-
  Stated in the README, LICENSE and LICENSING.md, as for Mini-Tone and Felucca. The SID tables are GPL-2.0-or-later
  (reSID), the Braids, DaisySP and Rings ports are MIT and msfa is Apache-2.0; the fonts are SIL OFL 1.1 and the Hügelton
  Sample Pack is GPL-3.0-only.
homepage: https://github.com/eldontyrellcorp/Mini-Vision
distribution: download
install_notes: >-
  Download minivision-X.Y.Z.fwsc from the release page and write it over USB with tools/fm1_install.py from the
  repository (needs mido and python-rtmidi); the README gives no install steps of its own. If an update leaves the unit
  black, the README points to the FM-1 Transporter hardware route and writing M-VAVE's FM-1.fwsc back. Back up first.
brick_risk: false
