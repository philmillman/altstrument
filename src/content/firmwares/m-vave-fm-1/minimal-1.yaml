device: m-vave-fm-1
name: MINIMAL-1
summary: >-
  Performance-focused fork of DUB-1 for the FM-1: black keys mute six parts, white keys trigger sixteen effects that
  can be latched, plus a browser emulator built from the same source. Untested on a real FM-1.
description: >-
  The author made it as a low-attention rhythm section next to a second FM-1 playing ambient textures. The layout is
  inspired by SIX MACHINES and uses DUB-1's six parts and effects. Six black keys mute Chord, Pings, Bass, Kick, Hats
  and Noise, and holding one opens its channel strip. Sixteen white keys trigger DUB-1's sixteen effects, and holding
  a pad while tapping ARP latches it until the pad is tapped again. A seventh black key is Echo Push with the same
  latch, and the other four keep the Wail, Whoop, Hi-Lo and Laser sirens. Leaving the performance page clears latches.
  DUB-1's generative engine, pieces, patterns and project, set and cue formats are kept. The browser emulator compiles
  the same app and DSP source to WebAssembly. The README says a hardware package was built but has not been installed
  or tested on a physical FM-1.
