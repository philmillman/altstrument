device: m-vave-fm-1
name: MINIMAL MACHINE
summary: >-
  Self-playing minimal techno firmware for the FM-1 built from six loops of different lengths that phase against each other and mutate slowly, shown as rotating rings.
description: >-
  Six short loops play a deep kick, soft hats, a rim or clap, a dub chord stab into a ping-pong echo, sub bass and a small bleep. The loops have different lengths such as 16, 12, 7 and 10 steps, so the parts phase against each other, and every few bars one thing mutates by moving a hit a step, changing a note, growing a loop by a step or resting a part. The screen shows the loops as rings turning against each other with the playing step under a read head and mutations flashing white. The knobs set Density, Drift, Filter and Echo, the white keys mute each of the six parts, EDIT mutates at once and REC holds the pattern. Twelve presets each keep their own settings, and evolved loops are saved at most hourly. The README says it was inspired by DUB-1 and uses none of its code.
status: active
