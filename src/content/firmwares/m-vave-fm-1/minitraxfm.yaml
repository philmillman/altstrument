device: m-vave-fm-1
name: MiniTraxFM
summary: >-
  Cut-down LOOM-8 shaped like a Novation Circuit Tracks: four polyphonic synth tracks and four sample drum tracks, playing songs converted from Circuit Tracks packs.
description: >-
  The four synth tracks stand in for Synth 1, Synth 2, MIDI 1 and MIDI 2, with up to six voices each and sixteen in all. The four drum tracks stand in for Drum 1 to 4, each a kit of up to eleven samples with one hit at a time. A converted pack's song plays from PLAY, and each part restarts every track from step 1, as a Circuit scene does. LOOM-8's factory sounds and breaks are removed, so the sample bank holds only the pack's samples. A tool in tools/ct2mtx turns a .circuittrackspack file into a backup holding up to three projects and their samples. The README calls the project early: it runs in the host simulator, where converted songs play note for note, and has not yet been built for or run on an FM-1. Its package identity is a placeholder, and some inherited test scenarios fail.
status: active
