license: GPL-3.0-only
license_notes: >-
  Inherited from LOOM-8: LICENSING.md states that the firmware as a whole is GPL-3.0-only (COPYING), because the acid engine and 909 kit models are GPL-3.0-only, while most other files are MPL-2.0 file by file (LICENSE). Braids ports are MIT and fonts are SIL OFL 1.1.
homepage: https://guinanno1.github.io/fm1-minitrax/
based_on: m-vave-fm-1/loom-8
distribution: source-only
install_notes: >-
  Build it with fm1-base's tools (BUILDING.md) and install the package over USB with fm1-base's installer. No release is published and the README says it has not yet run on a real FM-1. The project site, which has a browser emulator that loads converted packs, has its installer held back and publishes no firmware.
brick_risk: false
