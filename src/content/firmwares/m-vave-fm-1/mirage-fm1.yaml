device: m-vave-fm-1
name: Mirage
summary: >-
  Ensoniq Mirage sampler for the FM-1 that emulates the original hardware and runs Ensoniq's own boot ROM and operating system, with the FM-1 keys as the Mirage keypad.
description: >-
  Rights warning: the repository includes the Mirage boot ROM and the OS 3.2 disk image with its sounds, which are Ensoniq's. LICENSE.md says no licence is granted for them and that they are kept for preservation, to be removed if a rights holder objects.

  The emulator is a C port of the author's mirage-remake. It models the 6809 CPU, the 6522 timers and keypad, the 6850 MIDI port, the WD1772 floppy controller, the ES5503 sound chip and the eight CEM3328 filters. The keys play the Mirage with velocity, OCT- and OCT+ move octaves, K1 and K2 edit parameters, and EDIT turns the keys into the Mirage keypad, with the display shown as its two digits. The built-in OS 3.2 disk is packed into flash and read-only, giving six sounds. The README calls it early, says the host simulator runs it and that it has not been tried on an FM-1. It is built on fm1-base. The commit for 0.2.0 moves the analog section to the second core.
status: active
authors:
