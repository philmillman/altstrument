device: m-vave-fm-1
name: Mirage
summary: >-
  Ensoniq Mirage sampler for the FM-1 that emulates the original hardware and runs Ensoniq's own boot ROM and operating system, with the FM-1 keys as the Mirage keypad.
description: >-
  Rights warning: the repository includes the Mirage boot ROM and the OS 3.2 disk image with its sounds, which are Ensoniq's. LICENSE.md says no licence is granted for them and that they are kept for preservation, to be removed if a rights holder objects.

  The emulator is a C port of the author's mirage-remake. It models the 6809 CPU, the 6522 timers and keypad, the 6850 MIDI port, the WD1772 floppy controller, the ES5503 sound chip and the eight CEM3328 filters. The keys play the Mirage with velocity, OCT- and OCT+ move octaves, K1 and K2 edit parameters, and EDIT turns the keys into the Mirage keypad, with the display shown as its two digits. The built-in OS 3.2 disk is packed into flash and read-only, giving six sounds. The README calls it early and says the host simulator runs it. On the FM-1, 0.1.0 used 228 % of the audio interrupt's time and the author's unit stopped responding; the 0.2.0 commit moves the analog section to the second core, and 0.3.0 adds a CPU-load guard and a safe start, with docs/SAFETY.md to read before installing. It is built on fm1-base.
status: active
authors:
- name: leonardolopezchavira
  url: https://github.com/leonardolopezchavira
source: https://github.com/leonardolopezchavira/mirage-fm1
source_status: open
license: MIT
license_notes: >-
  LICENSE.md puts the new code (emulator, FM-1 app, tools, documentation) under MIT, fm1-base under MPL-2.0 and MAME-derived parts of the ES5503 and memory map under BSD-3-Clause (THIRD_PARTY_NOTICES.md). The Ensoniq ROM and disk image have no licence. It states that effects and a sequencer planned from other firmwares would make the firmware as a whole GPL-3.0-only.
based_on: m-vave-fm-1/fm1-base
distribution: source-only
requires_stock: M-VAVE FM-1 V15 or later
install_notes: >-
  Build with fm1-base's tools/build.py, which the repository's firmware workflow runs with JieLi's toolchain; there is no release or installer page yet. Use M-VAVE's updater or the platform's USB rescue to return to other firmware; the project gives no recovery steps of its own, but its SAFETY.md says the build writes no flash and describes the safe start (hold HOME at power-on).
brick_risk: false
tags: [sampler, emulator, synth-engine, wavetable]
