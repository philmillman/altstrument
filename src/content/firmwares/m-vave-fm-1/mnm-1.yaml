device: m-vave-fm-1
name: MNM-1
summary: >-
  Six-track monophonic groovebox in the style of the Elektron Monomachine: a drum kit track and five synth tracks
  with their own machines, a 64-step sequencer with parameter locks, three LFOs per track and per-track delay.
description: >-
  Track 1 is an eleven-voice drum kit played from the black keys, and tracks 2 to 6 each load one of twelve synth
  machines (acid bass, supersaw, pulse, ensemble, SID, FM, wavetable, noise, plucked string, sine and others).
  The sequencer has trigless locks, slides, accents, swing, probability, an arpeggiator per track, scale snapping
  and step recording. Sixteen slots each hold a pattern and its kit, MIDI clock and USB and TRS MIDI are
  supported, and a browser emulator runs the firmware compiled to WebAssembly. The platform layer comes from
  Felucca by way of X0X, FoMni and FiMba-1. The README is in Italian and says it has not yet been tried on a
  real FM-1, only in the host simulator.
status: active
authors:
