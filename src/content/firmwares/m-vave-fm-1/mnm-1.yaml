source: https://github.com/sirpearson/fm-1-monomachine
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca (LICENSING.md); fonts are SIL OFL 1.1.
distribution: source-only
install_notes: >-
  No release is published, so build build/mnm.fwsc with build.sh (JieLi toolchain and three SDK files fetched by
  the included scripts) and install it with tools/fm1_install.py. The README advises downloading M-VAVE's own
  V15 firmware from M-VAVE first, for the included rescue script, and links FM-1 Transporter for a stuck unit.
  Pattern slots use the flash area that Felucca keeps its presets and samples in, so saved data can be lost
  when switching between the two.
brick_risk: false
