device: m-vave-fm-1
name: MNM-1
summary: >-
  Six-track synth and effects firmware forked from Hortator: seven synth machines and seven FX machines on any
  track, 8-knob pages, a resonant filter, tape delay and three LFOs per track, and parameter locks with slide.
description: >-
  Keeps Hortator's sequencer, project storage, PERFORM effects and sidechain compressor, and replaces the tracks,
  machines and pages with its own. The synth machines are named SWSAW, SWPLS, SID, FM+, DPRO, GND and VO-6, and the
  FX machines are a pass-through, reverb, chorus, dynamics, ring modulator, phaser and flanger; an FX machine takes
  the previous track or a bus as its input, as an insert or a send and return. Any machine can sit on any track.
  Audio algorithms and complete sounds are ported from MONO2K as a second set of calibrated machines. The firmware
  has 330 factory sounds, eight patterns, eight kits and 128 full user sounds after an explicit storage migration,
  up to 240 parameter locks per project, a song arranger and a web simulator that runs the real firmware compiled
  to WebAssembly. The author has tested it on one FM-1 and calls it a beta.
status: active
authors:
- name: galfaroth
  url: https://github.com/galfaroth
source: https://github.com/galfaroth/mnm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only like Hortator and Felucca. LICENSING.md lists the third-party parts: ports of Mutable Instruments
  Plaits, Streams and Grids code (Grids is GPL-3.0-or-later, the others MIT), DaisySP (MIT), CC0 instrument
  samples, ports of MONO2K code and sounds (GPL-3.0-only), the Terminus and Unifraktur fonts (SIL OFL 1.1) and JieLi SDK files read at build time (Apache-2.0).
  The LICENSING.md, carried over from Felucca, reserves Felucca's panel image and sample pack as assets outside
  the GPL.
homepage: https://galfaroth.github.io/mnm1/
based_on: m-vave-fm-1/hortator
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, or tools/fm1_install.py from a terminal (needs mido and
  python-rtmidi). M-VAVE's M-UPGRADE puts the V15 firmware back, and docs/RECOVERY.md covers an FM-1 that stops
  answering. Building needs JieLi's toolchain and the AC79 SDK on Linux x86-64.
brick_risk: false
tags: [synth, drums, sequencer, fx, lfo, delay, filter, emulator, fork]
