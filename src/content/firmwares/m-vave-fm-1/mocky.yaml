versions:
- version: 0.9.2
  date: 2026-11-05
  url: https://github.com/charlesvestal/fm1-mocky/releases/tag/v0.9.2
  notes: Works on newer FM-1 units with the UC25HQ80 flash chip, answers M-VAVE's M-UPGRADE 3.11, accepts stock V16 as well as V15 in the installer and rescue script, and makes the site's pages usable with a screen reader and keyboard.
- version: 0.9.1
  date: 2026-10-15
  url: https://github.com/charlesvestal/fm1-mocky/releases/tag/v0.9.1
  notes: Works with the FM-1 Screen Reader, which announces the picture shown and the state of the gallery.
- version: '0.9'
  date: 2026-10-10
  url: https://github.com/charlesvestal/fm1-mocky/releases/tag/v0.9
