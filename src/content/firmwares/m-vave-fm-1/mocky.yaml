device: m-vave-fm-1
name: Mocky
summary: >-
  Display-test firmware and web app for sending arbitrary bitmap pictures to the FM-1 colour screen over
  WebMIDI.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-mocky
source_status: open
license: GPL-3.0-only
homepage: https://charlesvestal.github.io/fm1-mocky/
distribution: browser-installer
install_notes: Browser WebMIDI installer.
brick_risk: false
tags: [ui, research]
image:
  url: https://raw.githubusercontent.com/charlesvestal/fm1-mocky/main/docs/img/welcome.png
