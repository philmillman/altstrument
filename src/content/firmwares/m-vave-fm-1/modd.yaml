device: m-vave-fm-1
name: modd
summary: >-
  Early-stage framework for building one FM-1 firmware from selectable modules taken from Felucca, Melodee and
  SLOOP; only a minimal preset that shows a boot screen builds so far.
description: >-
  Configuration is done with Kconfig menus, and the chosen options are turned into C definitions at build time. The
  source tree embeds Felucca, its separate engines repository, Melodee, SLOOP and fm_lab as pinned subtrees, and
  includes their code in one build. Only the minimal preset is buildable; the Melodee, Felucca and SLOOP presets and
  per-engine selection are planned, and the author says audio, engine mixing and musical workflows are still being
  integrated and that hardware testing is pending. Recent commits add a Wi-Fi station driver written from scratch for
  the radio in the FM-1's chip, a simulated Bluetooth connection for emulator tests, a modd interface theme on Melodee's
  renderer (settings menu, weather page, USB-drive file browser, debug log) and a USB host driver that can write to a drive. Builds run the JieLi compiler
  on x86-64 Linux, with Docker on macOS, and are checked in a browser emulator. The packaged image carries three small
  JieLi SDK files under Apache-2.0.
status: active
authors:
- name: DimmKirr
  url: https://github.com/DimmKirr
source: https://github.com/DimmKirr/modd
source_status: open
license: GPL-3.0-only
license_notes: >-
  Project code is GPL-3.0-only (LICENSE). THIRD_PARTY.md lists the exceptions: the Felucca-Engines subtree is MIT, and
  the boot loader, chip configuration and EQ files that the packager copies from JieLi's AC79 SDK are Apache-2.0.
distribution: source-only
install_notes: >-
  Needs mise and uv. Load a preset with `task config:generate:defconfig -- minimal`, then run `task build`, which downloads the
  SDK and compiler and writes build/modd.fwsc. A rolling pre-release
  with an older build exists on the releases page. The firmware is an early build that shows only a boot screen, so
  keep a backup and have a recovery route ready.
brick_risk: false
tags: [fork, platform, synth-engine, sdk]
versions:
- version: main @ 8fff88d
  date: 2026-11-14
  url: https://github.com/DimmKirr/modd/commit/8fff88daeae2044e58984b69d600c817cc266d61
  notes: No tagged releases; this is the latest commit. The repository's only releases are rolling CI pre-releases. The project is now called modd, and its history was rewritten for a public release, so earlier commit links no longer resolve. Since the previous row it adds the modd interface theme with settings, weather, file-browser and debug pages, USB-drive writes, and a vendor build system for comparing against the original firmwares. Later commits add USB host hub support with Apple-tethering detection, a link-agnostic network stack with an LLM client over a local proxy, prebuilt .dock instrument modules, a shared scrolling-list widget for the Files page and flash tasks for UBOOT mode.
