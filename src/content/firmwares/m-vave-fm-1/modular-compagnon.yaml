device: m-vave-fm-1
name: Modular Compagnon
summary: >-
  FM-1 firmware with sixteen Modular Town sounds on the pads, an arpeggiator that follows the DAW's MIDI clock, a gliding echo, a tape for sketches and an animated companion on the screen. Beta.
description: >-
  The FM-1 version of Modular Compagnon, which the same author also builds for the SMK-37 Elite from a separate repository. Each control has one job: the 16 pads pick sounds, K1 sets volume and K2 to K8 set cutoff, resonance, the envelope and detune, with F1 to F4 for day and night, the FM winter, echo time and echo level. The arpeggiator follows an incoming MIDI clock over USB or TRS, and a held ARP button reaches its mode, speed and tempo. The screen companion is a cat, a fox, a robot or a goldfish, which reacts to what is played and sleeps at night. The README is in French and English, and the project describes itself as a beta built on Felucca 1.6.1. Release 0.9.2 accepts M-VAVE's larger V16 package and no longer refuses units whose chip key differs.
status: active
authors:
- name: Alexis Arakis (Bungle Society)
  url: https://github.com/bunglesociety
source: https://github.com/bunglesociety/modular-compagnon-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only, and the LICENSE file is the GPL-3.0 text, inherited from Felucca. LICENSING.md and CREDITS.md (Felucca's own, kept in the tree) list the MIT engines, ported DSP code, CC0 samples and SIL OFL fonts that keep their own terms.
homepage: https://bunglesociety.github.io/modular-compagnon/fm1/
based_on: m-vave-fm-1/felucca
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Use the project's install page in Chrome or Edge over USB, or install the .fwsc from the release. The package carries its own identity (FM-1_893), so M-VAVE's M-UPGRADE can take the FM-1 back to its official firmware, V16 included from 0.9.2. The README says the installer writes only the firmware's own areas and never the boot code, identity or calibration, and BUILDING.md names FM-1-transporter as the recovery tool if a unit no longer starts.
brick_risk: false
