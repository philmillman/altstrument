device: m-vave-fm-1
name: Modular Koi
summary: >-
  Steel tongue drum for the FM-1, played with the thumbs, with eleven tongues, rolls, six scales in any key, four materials and a pond of koi that animate each note, built on Felucca 1.6.1.
description: >-
  The eleven tongues sit under each thumb, in C major at first, with the same notes in the middle. The OP3 and MONO keys play rolls on the last tongue, POLY adds the octave harmonic, PRESETS picks the scale
  and ALGORITHM picks the material: steel, a low drum, glass or wood. KNOB 1 to 3 set strike, resonance and the bounces at the pond's edge, and the sound is dry, without echo or reverb. ARP is rain, where
  the drum plays by itself and answers what is played, SELECT changes between day and night, and the screen draws the pond with koi. The sketchbook and tape player of Modular One are included, and sketches
  and songs are kept where Modular One keeps them. GLO sets the key, the number of koi, ripples, winter, MIDI channel, tuning, speaker and sleep. The README and release notes are in French and English, and the
  release says it has not been tried on the newer FM-1 with the UC25HQ80 flash chip, which the firmware recognises. It shares its source tree with Modular Compagnon for the SMK-37.
