homepage: https://bunglesociety.github.io/modular-koi/
based_on: m-vave-fm-1/felucca
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB; it reads the unit first and shows what runs on it. The package modular-koi-0.1.fwsc is also on the release page. The installer page says to go back
  to the official firmware with M-VAVE's own updater and ships no stock file.
