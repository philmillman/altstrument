device: m-vave-fm-1
name: Monades
summary: >-
  Six-voice generative firmware forked from Mutable Dreams 1.1, with 91 scales including microtonal Scala sets and ragas, Markov
  and motif generators, morphing between Worlds, and generated notes sent out over USB MIDI.
description: >-
  Each of the six voices follows its own logic while sharing one scale and tempo. On top of Mutable Dreams it adds pages that
  draw what is being set, such as meters, an oscilloscope, filter and envelope curves, a granular strip and a piano roll. There
  are 15 scale families, a custom scale, a deja vu control, section forms, step entry, two LFOs per track with 19 targets, high,
  band and notch filters, chorus, synced echo and diffusion. USB MIDI output carries the generated notes per track or by note
  zone, with clock, and each track picks its own channels. Fourteen Worlds can be randomised, morphed and left to drift.

  The README says it has been installed and running on an FM-1 since 2026-10-29, and the device checks are done apart from five
  points (clock out, pitch bend in microtonal scales, panic, saving across a restart and going back to Mutable Dreams or V15). It points to Mutable Dreams for a better proven instrument. USB audio works towards the computer only, as in Mutable
  Dreams. The site offers a browser simulator of the complete firmware, and the documentation is in French. Rhizome is a
  further fork of this project.
