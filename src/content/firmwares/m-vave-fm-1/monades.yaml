    notes: No tagged releases of its own; this is the latest commit, which the README calls version 0.1.5. It restores the saturation stage that the Plaits kick passes through and Mutable Dreams skipped, so the kick is no longer about half as loud as the other engines; the author installed it on an FM-1 on 12 November. The newest commit only adds a case-by-case user guide section on evolving notes. Version 0.1.4 fixed PRESET on an edited SATIN MORPH sound and past the last World, and no longer drops to ECO mode because of one slightly long audio block or when a World loads.
