  MPL-2.0 and font notices, listed in LICENSING-GPL.txt. The repository's v1.0 and v1.1 tags belong to Mutable Dreams.
homepage: https://dr-john-8bits.github.io/monades/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  From V15 or Mutable Dreams, use the browser installer in Chrome or Edge, or run base/tools/fm1_install.py with the .fwsc. The
  FM-1 enters update mode on its own. The README warns against installing from V16, where install problems have been reported. To
  go back, run the same tool with your V15 file.
brick_risk: false
tags: [generative, sequencer, granular, midi]
