device: m-vave-fm-1
name: MONASTERY
summary: >-
  Self-playing ambient firmware for the FM-1 in which seven monks chant the hours over a drone in a stone chapel, with a bell for each office and a novice, an abbot and a brother who sings flat.
description: >-
  Seven brothers chant slow modal lines over a drone, side answering side, through a long reverb. A bell marks each office from Matins to Compline, each with its own mode, pace and number of singers, and a day takes two hours by default. Benedict the abbot leads, Anselm the novice comes in early and misses entries but learns, Ambrose sinks flat until given the note, Gregory and Bernard argue over pitch, Columba dozes at Matins and a new novice arrives after some days. The white keys wake or cue a brother, EDIT rings the next office and OCT- and OCT+ slow or quicken the chant. The brothers' histories and the chronicle are saved about once an hour, and the engine comes from AMB-1.
status: active
authors:
