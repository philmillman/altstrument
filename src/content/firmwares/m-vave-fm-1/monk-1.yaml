device: m-vave-fm-1
name: MONK-1
summary: >-
  Formant vocal synthesizer: a port of Jonathan Taylor's MonkSynth with twelve animated singing characters,
  with velocity and aftertouch read from the FM-1's own keys.
description: >-
  Plays a single gliding voice with vowel, head size and breath controls, a unison choir of up to ten voices,
  vibrato, echo and an ADSR envelope. Each character has its own voice and stage, and its mouth follows the
  vowel on the screen. Velocity sets note level and aftertouch moves the vowel, bends pitch or both, using the key
  sensing from Velo. USB MIDI sends notes with polyphonic aftertouch and takes notes and a few CCs, and the
  firmware reports its screen to the FM-1 Screen Reader page over USB. The vocal DSP is MonkSynth's (MIT) and the
  platform layer comes from Felucca by way of FoMni and Velo.
status: active
authors:
