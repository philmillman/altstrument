  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-monk
source_status: open
license: GPL-3.0-only
license_notes: >-
  MonkSynth's DSP (MIT) is ported in firmware/src/dsp/monk.c with its notice.
homepage: https://charlesvestal.github.io/fm1-monk/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the releases page.
  Browser emulator and manual on the project site. The installer offers a return to M-VAVE stock V15, which
  you download from M-VAVE yourself.
brick_risk: false
