device: m-vave-fm-1
name: MONO2K
summary: >-
  Monomachine-style synth firmware for the FM-1: six tracks each with one mono machine, a 64-step sequencer with
  parameter locks and a lofi effects bus, on a 1-bit screen; also runs in the browser.
description: >-
  Each track has one machine (among them sine and noise, 8-bit SID-style, FM, wave, digital wave and vocal
  machines) written without floating point, with amplitude, filter, effects, distortion and
  three LFOs per track. The sequencer has 64 steps per track with accents, slides, parameter locks, trig
  conditions, ratchets, swing and live recording; a Grids drum-pattern generator can fill tracks, and PERFORM has two banks of live effects. Each track can loop at its own length, and the sound library holds 96 sounds. The bus adds a reverb, beat repeat and ADPCM
  crunch, and MIDI uses Monomachine-style channels and CC numbers. The core also runs in a browser emulator and in
  a desktop test harness. The README gives the FM-1 build as released since 1.0, installed from the project's
  installer page or the FM-1 Firmware Hub, and keeps one project of 64 patterns in its own storage area. Each track keeps its own arpeggiator
  notes and hold. The repository also releases the same core as a MONO2K module for the Ableton Move (a Schwung module with
  its own releases); this entry lists the FM-1 builds only.
status: active
authors:
- name: InigoHernandez
  url: https://github.com/InigoHernandez
source: https://github.com/InigoHernandez/mono2k
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE file and README state GPL-3.0-only. The screen's type is an adaptation of Elektron Pixel Font by savingaurora
  (CC BY-SA 3.0, with the firmware's 1-bit renderings under CC BY-SA 4.0), and the Orbitron wordmark font is SIL OFL 1.1.
homepage: https://inigohernandez.github.io/mono2k/
distribution: download
install_notes: >-
  Download mono2k-1.6.2.fwsc (identity FM-1_980) from the releases page, or install it from the project's installer
  page or the FM-1 Firmware Hub over USB in Chrome or Edge. Back up what the FM-1 holds first. Installing another
  firmware replaces it, and holding OCT- while switching on reaches the updater. The repository also holds the
  sound and sequencer core, a browser emulator (web/build.sh) and a host harness.
brick_risk: true
tags: [sequencer, synth-engine, fx, lfo, emulator, midi]
versions:
- version: 1.6.2
  date: 2026-11-01
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.6.2
  notes: Removes clicks on legato notes and accents on most machines, brings the VO-6 vowel machine up to level within about 40 ms and puts the first echo of long delay times on time. Patterns load as they played.
- version: '1.6'
  date: 2026-10-30
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.6
  notes: Adds MONO2K's own pixel font with every knob shown as a picture, a second HOME page with per-track length, speed, probability and lane, a track chance (PROB) and a CPU load readout under GLO > PLAY. Patterns that use PROB open only on 1.6 or later.
- version: '1.5'
  date: 2026-10-30
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.5
  notes: Redraws every page on a 4 px grid with a pixel font, lets each track loop at its own length, adds a library of 96 sounds, and merges the bus into one page with the tape, hiss and random glitch effects removed. Patterns that use track lengths open only on 1.5 or later.
- version: 1.4.2
  date: 2026-10-29
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.4.2
  notes: Calmer screen with no flashing on actions, a reworked FILT page, and an even split of the tracks between the two processors; the sound is unchanged.
- version: '1.4'
  date: 2026-10-28
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.4
  notes: Adds a second bank of PERFORM effects (freeze, scatter, roll, octave shifts, filter sweeps, gate, dub echo, shimmer and spin-back), reached with OCT+, and revises the first bank's STOP, KILL and DRIVE.
- version: '1.3'
  date: 2026-10-28
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.3
  notes: Adds a Grids drum-pattern generator behind ARP, mutes and solos that wait for the next bar, and four more step probabilities.
- version: '1.2'
  date: 2026-10-28
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.2
  notes: Redraws every page on one grid with bolder type and a new splash, shows all three LFOs on the LFO pages, and adds a hold for the arpeggiator.
- version: '1.1'
  date: 2026-10-27
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.1
  notes: Reworks the amp envelope and LFO knob ranges, the glitch and reverb sends and the PERFORM effects, gives each machine a starting sound, and adds a GLO > IN page and a choice of MIDI clock source.
- version: 1.0.3
  date: 2026-10-26
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.0.3
  notes: Adds a GLO + HOME key-mode switch, a workaround for a chip fault that could corrupt values at random, and sturdier MIDI clock handling over USB. Includes the 1.0.2 fixes, which had no release page.
- version: 1.0.1
  date: 2026-10-25
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.0.1
  notes: Each pad in PADS mode plays its track at the root note of that track's pattern.
- version: '1.0'
  date: 2026-10-25
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v1.0
  notes: The FM-1 appears over USB as MONO2K FM-1 instead of Felucca.
- version: '0.1'
  date: 2026-10-25
  url: https://github.com/InigoHernandez/mono2k/releases/tag/v0.1
  notes: First release, a beta .fwsc package with six mono machines, a 64-step sequencer, a lofi bus and four demo parts.
