device: m-vave-fm-1
name: MONODRONE
summary: >-
  Drone instrument with four layers of held chords from twelve engines, dirt, filter, tape delay and reverb, sixteen scenes with animated 1-bit places and no sequencer.
description: >-
  Each of four layers holds chords from one of twelve engines and runs into dirt, filter, tape delay and reverb. There is no sequencer. The player starts layers, bends them live with eight macros and twelve punch effects on the keys, and moves between sixteen scenes, each with its own animated 1-bit place drawn on the screen. It is an app on fm1-base, in a submodule with felucca-bsp. The repository has a browser emulator, an interactive manual and printable PDF manuals, a release workflow that builds, tests, attests and publishes packages, and a host simulator with scripted tests. Each release carries a .fwsc, a .rfm1 and a plain application image.
