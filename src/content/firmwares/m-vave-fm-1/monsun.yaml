device: m-vave-fm-1
name: MONSUN
summary: >-
  Monophonic synth in the spirit of the Dreadbox Typhon: two oscillators on one wave-morph knob, a 24 dB ladder filter, three modulators with 13 destinations each, three effect slots, a 32-step sequencer and a ten-style beat with sidechain pump.
description: >-
  A single WAVE knob fades through combinations of the two oscillators, including soft and hard FM, and TUNE 2 sets the second oscillator's pitch. The filter is a 24 dB ladder low-pass run at twice the sample rate, with a high-pass ahead of it, two ADSR envelopes whose times scale together, glide, legato and velocity routing. A STORM control adds a detuned copy, a slow filter wander and a moving side channel. Three modulators (LFO, envelope, random or step) each send a level to 13 destinations at once. The effects follow the Typhon's order, with six distortion types, chorus, ensemble and flanger, and delay and reverb with delay times up to one second. The sequencer has 32 steps with note, gate and velocity, can record from the keys, and is transposed by the keys while it runs. A GROOVE section adds ten drum styles with a sidechain that ducks the synth and its effects. It follows MIDI clock, start, stop and continue over USB. There are 16 presets, and the oversampling drops by itself and shows ECO when the load passes 88 percent. The README says it is not connected with Dreadbox. It is built on fm1-base and felucca-bsp, and its sound core in dsp/ is plain C.
