device: m-vave-fm-1
name: MOONDAW
summary: >-
  Tracker firmware: 8 tracks, up to four notes and three named effects per step, chip, sample and sung-syllable
  voices, and songs stored as plain-text .trk files that can be sent over USB. Beta, in daily use on an FM-1.
description: >-
  The arrangement has three levels: SONG lists phrases, SECTION shows what each track plays in a phrase, and PATTERN
  holds the steps. Voices are PULSE, NOISE and WAVE chip voices, SMPL for your own samples, VOX, which sings the
  syllables written into a step, and DRUM, which reuses Felucca's drum voices, followed by an envelope, a filter,
  reverb and delay sends and a master limiter. The device holds 31 songs and a mixer page sets volume, pan and
  sends per track. REC records played notes over a count-in, a MIDI keyboard on the TRS jack (or forwarded by a
  script from a computer) plays the instrument under the cursor, and on-device HELP has a page per screen and effect.
  Python tools send and fetch songs, convert WAV files into the sample bank and drive the device remotely. The
  project site has a browser build of the same firmware and a manual. This is not a fork of Felucca: it takes
  Felucca's hardware layer, drivers, update loader and build tools, and UPSTREAM.md lists each file and what was
  changed. The project site has a browser installer, a browser build of the same firmware and a manual, and the
  GitHub releases (0.1 and 0.2, both marked pre-releases) attach the .fwsc package.
status: active
authors:
- name: Jaeger
  url: https://github.com/jaeggerr
source: https://github.com/jaeggerr/moondaw-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only. Parts taken from Felucca keep GPL-3.0-only, the drum DSP helpers are MIT, the
  second-core code from felucca-bsp is MPL-2.0 and the band-limited step table from blip_buf is LGPL-2.1-or-later.
  The fonts are SIL OFL 1.1, and three JieLi AC79 SDK files (Apache-2.0) are read from your SDK checkout at build time.
  The name MOONDAW is reserved by the author; forks are asked to use another name.
homepage: https://moondaw.com/
distribution: browser-installer
install_notes: >-
  Use the install page on the project site (Chrome or Edge, USB), or run tools/fm1_install.py on the .fwsc from a
  release (Python 3 and python-rtmidi). To build it yourself, run ./build.sh (Docker is used if the JieLi toolchain is
  not installed) and install build/moondaw.fwsc. Installing 0.2 over 0.1 keeps songs and the sample bank. The README warns that installing is at your own risk, says to back up the stock flash
  first and keep FM-1-transporter ready to restore it, and points to docs/ARRIVEE.md for a rescue path that needs no
  extra hardware.
brick_risk: true
