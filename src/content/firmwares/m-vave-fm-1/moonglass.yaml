distribution: source-only
requires_stock: SLOOP 2.8.5 source (commit bac9c05) to patch
install_notes: >-
  Run build-moonglass.sh (macOS with Docker) to build moonglass-0.3.23.fwsc and open a local installer, or install the package
  with SLOOP's tools/fm1_install.py. The README says there is no hosted installer and that the recovery paths, taken from SLOOP,
  are untested with Moonglass: press INSTALL again after an interrupted install, or hold OCT- alone at power-on for the USB rescue.
  Going back means installing a SLOOP package or using M-VAVE's M-UPGRADE. Back up projects, presets and samples first.
