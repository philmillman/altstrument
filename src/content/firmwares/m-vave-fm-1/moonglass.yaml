device: m-vave-fm-1
name: Moonglass
summary: >-
  SLOOP-based dream pop groovebox: eight instruments with 123 sounds, vintage-style drum kits with drum-bus and variation tools, and
  one-finger chord pads.
description: >-
  Distributed as 23 patches on top of SLOOP 2.8.5 plus a build script that clones SLOOP, applies them and builds the package. It
  offers eight instruments (organ, lead, bass, FM keys, strings, synth, choir and granular cloud) while keeping SLOOP's other
  engines compiled in so older projects open. The drum track gains kits, a RHYTHM page, a drum bus with punch, compression and
  ducking, feel and motion settings, a gated reverb on snares, and VARY and MUTATE modes that change patterns from bar to bar.
  Chord PADS mode follows ChoralRoot FM-1: one root key plus quality and extension keys, with the chord named on screen. A new look
  adds pearl steps, a moon transport and visualisers. HAZE, TAPE, RHYTHM and PADS settings are not saved in projects yet, and the
  README says the chord pads and the 0.3 drum features are untested on a real FM-1.
