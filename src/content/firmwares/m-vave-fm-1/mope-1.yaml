device: m-vave-fm-1
name: MOPE-1
summary: >-
  FiMba-1 fork that turns the FM-1 into a wavetable synth with a toy-keyboard backing band of 13 minor-key drum styles, a loop recorder, an arpeggiator and a screen where a pixel-art blob shows the sound.
description: >-
  Replaces FiMba-1's kalimba with sixteen wavetables on six voices, each voice having two detuned oscillators, a sub, drift, a
  resonant filter and its own envelope, plus an LFO with nine shapes, chorus, ping-pong delay, an eight-wall reverb, tape and a distortion
  stage. The backing band has 13 drum styles with synthesised kits and an optional auto-bass that always plays minor. A
  loop recorder keeps up to four bars with a piano-roll step editor, saved with the sound, and there are 38 presets. The
  screen shows a blob whose eyes, mouth, tears and outline follow the filter, envelope, delay and wavetable, with
  each part's panel button opening a schematic. The boot code, safe mode, update loader and installer come from FiMba-1; since 0.2.0 the reverb, delay and
  browser player are MOPE-1's own. From 0.3.0 each voice also has a second oscillator with its own wavetable that can modulate, ring modulate or sync to the first, the filter can be low-pass, band-pass, high-pass, notch or comb, and there are a second LFO and a mod envelope with its own attack. From 0.4.0 holding SEL turns the black keys into punches (tape stop, reverse, stutter, gate and others), the delay follows the band's tempo, FX has four effect pages, you can save your own presets, there is MIDI clock in and out, and four sequencer patterns switch on the bar. The firmware is a beta that its author reports tested on a real FM-1.
status: active
authors:
- name: slothpallas
  url: https://github.com/slothpallas
source: https://github.com/slothpallas/mope-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md, inherited from FiMba-1, FoMni, X0X and Felucca. Fonts are SIL OFL 1.1 and three JieLi SDK files
  are read at build time and placed in the package (Apache-2.0).
homepage: https://slothpallas.github.io/mope-1/
based_on: m-vave-fm-1/fimba-1
distribution: browser-installer
requires_stock: V15 or V16
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the release. The
  README says to keep M-VAVE's stock firmware to go back; the installer's return-to-stock option accepts only an unmodified
  V15 file that you supply. MOPE-1 shares a flash slot with FiMba-1 and FoMni for its saved data, so switching between them
  overwrites it. If it crashes twice at start-up the FM-1 comes up in safe mode with USB on.
brick_risk: false
tags: [synth-engine, wavetable, sequencer, drums, fx, performance, emulator]
