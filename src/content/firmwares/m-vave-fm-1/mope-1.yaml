  url: https://github.com/slothpallas/mope-1/releases/tag/v0.4.1
  notes: Pre-release. Removes the crunchy breakup that performance punches caused with the arpeggiator, drums and bass all playing, by running the sound engine from fast memory and doing less work per sample, and smooths the end of a tape stop.
- version: 0.4.0 beta
  date: 2026-11-05
  url: https://github.com/slothpallas/mope-1/releases/tag/v0.4.0
  notes: Pre-release. Adds performance punches on the black keys, four effect pages, a tempo-following tape-style delay, saving of your own presets, MIDI clock and output settings, four switchable sequencer patterns and 16 new presets for 54 in all.
- version: 0.3.0 beta
  date: 2026-10-29
  url: https://github.com/slothpallas/mope-1/releases/tag/v0.3.0
  notes: Pre-release. Adds second pages for the oscillator (a second wavetable per voice), the mod envelope and the LFO, more filter kinds, and presets trimmed to one loudness; fixes a crash.
- version: 0.2.0 beta
  date: 2026-10-28
  url: https://github.com/slothpallas/mope-1/releases/tag/v0.2.0
  notes: Pre-release. Replaces the reverb, delay and browser player inherited from FiMba-1 with MOPE-1's own, and adds eight wavetables, four LFO shapes and seventeen presets.
- version: 0.1.0 beta
  date: 2026-10-24
  url: https://github.com/slothpallas/mope-1/releases/tag/v0.1.0
  notes: First release, marked pre-release. Forks FiMba-1 and replaces the kalimba with a wavetable synth, backing band and loop recorder.
