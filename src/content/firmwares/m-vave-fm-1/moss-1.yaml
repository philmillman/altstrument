device: m-vave-fm-1
name: MOSS-1
summary: >-
  Ambient firmware with lofi, nature and slow generative scenes that start playing when switched on, a looper that listens
  to what is played, drum kits, reverb spaces and a tape FILM control.
description: >-
  Sixteen scenes in three modes: LOFI (electric piano chords over a slow beat), SCAPES (nature sounds with a quiet pad) and
  DRIFT (pads and bells on loops of different lengths). The keys play along in key, a CHORDS page steers the harmony, and
  what is played loops by itself, with a loop library, a studio view and a picture view of each scene. The ALGORITHM encoder
  picks one of several reverb and delay spaces, a MOTION page varies the echoes over time and the FILM knob adds tape wear.
  Built on fm1-base. Releases include a .rfm1 build for RemoteFM1 as well as the .fwsc. Releases before 1.0 are marked
  beta; 1.0 is the first without that mark.
status: active
authors:
- name: theowecker
  url: https://github.com/theowecker
source: https://github.com/theowecker/fm1-moss
source_status: open
license: MPL-2.0
license_notes: LICENSE is the MPL-2.0 text.
homepage: https://theowecker.github.io/fm1-moss/manual/
based_on: m-vave-fm-1/fm1-base
distribution: download
install_notes: >-
  Install moss-X.Y.fwsc (moss-X.Y-beta.fwsc before 1.0) from the release with fm1-base's tools/fm1_install.py over USB, or build it with build.sh. The
  manual ends with a section on going back to the stock firmware and points to the Firmware Hub's rescue page.
brick_risk: false
tags: [ambient, generative, looper, synth-engine, fx, reverb, delay, drums, emulator]
