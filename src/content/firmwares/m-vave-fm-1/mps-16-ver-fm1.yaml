  notes: No tagged releases; this is the latest commit, and the README calls the build 0.24. The repository and project were renamed from ChordSmith FM to MPS-16 ver FM1 on 15 November, when the site called the build 0.16.0. Commits since then add big text on every screen, a RHYTHM control on K4 with the strum, humanize, arp and voicing settings moved to an FX page and an Earth Science colour palette (0.24), A, B and C pad groups with a MIDI channel for each, ANALYZE and PROBE views, a single SURFACE home screen with the tools opened from it, and a site that keeps every version at its own address for testing.
