device: m-vave-fm-1
name: MPS-16 ver FM1
summary: >-
  Chord builder for the FM-1 (SEED): play a few notes, pick a scale, and the 16 white keys hold its chords and progressions, the black keys play the key's notes, with a note length, strum, humanize, arp and a MIDI loop recorder, out over USB MIDI.
description: >-
  From build 0.30 the firmware is SEED, the chord builder of MPS-16. Play a few notes you like and pick a scale that fits, and the 16 white keys hold the key's
  eight chords and eight progressions (triads, sevenths, ninths, sus2, sus4 or add9). The first seven black keys play the notes of the key and light with the
  bass of the chord played, and the last four are BASS, NO BASS, NO ROOT and a tap-tempo key. Every change goes to the group played last, or to one held key.
  K3 sets a note length from 1/32 to four bars, as played or legato, and per-pad edit pages set rhythm, strum, speed, humanize, swing, inversion and an arpeggio
  direction. A LOOP recorder records a bar-quantized MIDI loop layer by layer, and COACH walks a first-time user through the keys. MIDI goes out over USB on four
  fixed channels (pads 1 to 8, pads 9 to 16, the note keys and the keyboard), and eight built-in sounds from Felucca-Engines can be heard with it or alone. The
  README calls these early test builds by BeatSmith (originally ChordSmith FM). The MIDI phrase sampler of builds up to 0.25 was dropped from the firmware; it
  stays on the sampler-0.25 branch and its builds stay on the site under /v/. It is built on fm1-base and felucca-bsp. The project site has a browser emulator that
  runs the same code and a browser installer that can put M-VAVE's own firmware back. The licence for the project's own code is still undecided.
status: active
authors:
- name: Brent Walker
  url: https://github.com/BrentWalker
source: https://github.com/BrentWalker/MPS-16-fm1
source_status: open
license: unspecified
license_notes: >-
  The README says the licence for MPS-16 ver FM1's own code is still to be chosen, and firmware.json lists it as LicenseRef-ChordSmith-TBD. The fm1-base and
  felucca-bsp files it builds on are MPL-2.0 and the Felucca-Engines voices are MIT.
homepage: https://brentwalker.github.io/MPS-16-fm1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15 or later
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB, or run tools/fm1_install.py from fm1-base with the .fwsc from the site. The page offers to
  reinstall the stock firmware from a file you downloaded from M-VAVE, and links the m-bootloader recovery for a unit that will not start.
  The site calls it a test build to install at your own risk.
brick_risk: false
