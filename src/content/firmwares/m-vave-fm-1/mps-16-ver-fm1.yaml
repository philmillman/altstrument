device: m-vave-fm-1
name: MPS-16 ver FM1
summary: >-
  MIDI phrase sampler and chord player for the FM-1: a loaded MIDI file plays on 16 A pads on the white keys, the first seven black keys play bass and lead, the last four change key, with strum, arp, humanize and MIDI out on a channel per pad group.
description: >-
  A loaded MIDI file is spread over the 16 A pads on the white keys in its own key. The B pads, the first seven black keys, play bass and lead in the key, the C pads, the last four, change key for a bridge, and MUTATE varies repeated chords. Each pad group sends MIDI on its own channel. MIDI files can be copied
  onto the FM-1 as on a USB drive or recorded into it, then cut into slices that go on pads. The README calls it early test builds by BeatSmith (originally published as ChordSmith FM) and
  the hardware version of MPS-16 ver WEB and groundwork for MPS-16. It is built on fm1-base and felucca-bsp with Felucca-Engines voices. The project site has
  a browser emulator that runs the same code, a browser installer that can put M-VAVE's own firmware back, and a .fwsc download for the command-line installer.
  The licence for the project's own code is still undecided.
status: active
authors:
- name: Brent Walker
  url: https://github.com/BrentWalker
source: https://github.com/BrentWalker/MPS-16-fm1
source_status: open
license: unspecified
license_notes: >-
  The README says the licence for MPS-16 ver FM1's own code is still to be chosen, and firmware.json lists it as LicenseRef-ChordSmith-TBD. The fm1-base and
  felucca-bsp files it builds on are MPL-2.0 and the Felucca-Engines voices are MIT.
homepage: https://brentwalker.github.io/MPS-16-fm1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15 or later
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB, or run tools/fm1_install.py from fm1-base with the .fwsc from the site. The page offers to
  reinstall the stock firmware from a file you downloaded from M-VAVE, and links the m-bootloader recovery for a unit that will not start.
  The site calls it a test build to install at your own risk.
brick_risk: false
tags: [chords, performance, sequencer, midi, synth-engine]
