  notes: No tagged releases; this is the latest commit, which redraws the FX map when a track mute or solo changes. Commits just before it make FX and GLO share track mutes, let step entry take notes out, put PRESETS on STEP, make a tap disarm REC with the LED following the selected track, and make the MRC accent colours more saturated. Before them, a commit turned the drum grid's PUMP into a real post-effect sidechain pump with a longer held release. Commits since the earlier row also make the phone remote installable as an app, add a landscape lock to it, close the PRESETS list one second after the last detent and change the palette to pure black. Before them, the remote gained an EFFECT tab and a RECORD tape deck, and a phone remote page with punch-in effects, macros, solo and mute and drum lanes was added to the site on 12 November. A commit on 11 November adjusted the FM6 engine's AMS levels to match msfa. Since the earlier entry the repository gained a project site with a landing page, an editor and a browser installer.
