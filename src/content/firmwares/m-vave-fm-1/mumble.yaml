device: m-vave-fm-1
name: MUMBLE
summary: >-
  Voice firmware for the FM-1 in which eight retro-game characters sing a typed line a syllable at a time from formant synthesis, with a choir on chords, an arpeggiator and a multitrack loop.
description: >-
  A line of text is typed on the keys and sung back by one of eight characters, each with its own voice, a face drawn from that voice and its own level in the choir. In SING mode the keys sing the next syllable and held keys make a chord shared across the choir; LOOP shows a lane per character and records what is sung; TYPE edits the line. Sound pages set the voice, feel, effects and style, and scale, auto-chord, arpeggiator and chord shape settings keep the keys in key. Voices are synthesized with no recordings, and a new voice can be rolled for one character or for all. The loop follows MIDI clock from USB or the TRS jack. The line, voices and loop are kept over power-off in the FM-1's flash, in an area other firmwares often use. The project site has a browser emulator and installer.
status: active
authors:
