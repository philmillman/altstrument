license: GPL-3.0-only
license_notes: >-
  NOTICE.md states GPL-3.0-only with the GPL-3.0 linking exception M-VAVE grants for FM1 Open code. app/paint.inc and parts of app/app.c are adapted from FM1 Open's panel code (GPL-3.0-only with the same exception); fm1-base stays MPL-2.0.
homepage: https://kdziamura.github.io/fm1-mumble/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Install from the project site in Chrome or Edge, or with any FM-1 installer that takes a .fwsc, such as M-Flasher or the Firmware Hub. The site's installer can put M-VAVE's firmware back, and the README says back up the FM-1 first. Other firmwares' saves are not read, and the first MUMBLE save overwrites what is at 0xFC000 and 0xDC000. The FM-1's ROM boot mode applies.
