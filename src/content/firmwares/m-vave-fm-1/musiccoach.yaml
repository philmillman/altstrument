device: m-vave-fm-1
name: MusicCoach
summary: >-
  Piano and drum practice firmware for the FM-1 with lessons, finger-coloured notes and Coach, Jam and
  Psychedelic modes, plus a browser practice app, device simulator and USB installer. Also builds for the SMK-37.
description: >-
  Native build on Felucca 1.5.1 with the sample voices and a lesson player for the 27-key layout, installed from
  a page on the project's hosted app. The same repository holds the browser practice app for several
  instruments with MIDI and microphone input, a song library and accounts, which is a web application rather
  than firmware. The FM-1 packages are a single-core 0.2 test build and a dual-core 0.3 candidate for
  the FM-1; the author reports screen and key sound confirmed on hardware for 0.2 and none of the others validated.
  Corresponding source archives sit next to each package. Its SMK-37 builds are not catalogued, because their installer downloads M-VAVE's SMK-37 stock package from a third-party mirror.
status: active
authors:
- name: Chance Roth (ChanceTheMaker)
  url: https://github.com/ChanceTheMaker
source: https://github.com/ChanceTheMaker/MusicCoach
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0-only; the firmware inherits Felucca's terms (LICENSING.md lists the ported DaisySP and
  Rings MIT code, msfa Apache-2.0, CC0 samples and OFL fonts). The browser app bundles FluidR3 piano, guitar, bass,
  sax and harmonica sample renders credited as CC-BY-3.0. Includes M-VAVE's FM-1 V15 image (FM-1_015.fwsc), which
  M-VAVE licenses under Apache-2.0 in m-vave/fm1_open; the copy at device/musiccoach-usb/restore-stock/ has the
  matching git blob ce49cc1. The repository describes it as vendor firmware whose rights stay with M-VAVE and
  carries no Apache-2.0 notice for it.
homepage: https://chancethemaker.github.io/MusicCoach/
distribution: browser-installer
requires_stock: M-VAVE FM-1 V15, or a firmware with a compatible USB updater
install_notes: >-
  Chrome or Edge over USB from the installer page, choosing the FM-1 and ticking the box that it is a test build
  that replaces the current firmware. A restore page reinstalls M-VAVE's V15. The author says all firmware
  candidates are labelled tests and a power loss can need the recovery adapter.
brick_risk: false
tags: [lessons, sampler]
