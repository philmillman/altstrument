source: https://github.com/stevexfer/FM1_MusiCraft
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and COPYING is the GPL v3 text. The hardware layer comes from Felucca and sloopDX.
distribution: source-only
install_notes: >-
  Build build/musicraft.fwsc with build.sh (JieLi toolchain and AC79 SDK, as for FM-1 Mario) and flash it with the same
  WebUSB installer as FM-1 Mario. The package identity is FM-1_971. The platform's USB update loader and recovery code are
  in the repository, and the project documents no other recovery path.
