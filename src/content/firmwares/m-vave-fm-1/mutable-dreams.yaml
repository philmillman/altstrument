versions:
- version: v2.1
  date: 2026-11-13
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v2.1
  notes: Adds Itinera, fourteen dreams of 30 minutes, one, two or four hours that move through Biomes with gradual changes in rhythm, harmony and effects (hold HOME to start one). Refines USB and TRS MIDI timing, keeps the chosen quality setting after temporary ECO protection, smooths the ends of the six USB mono stems and speeds up Biome browsing. On one FM-1, build 2467CC38 passed the 2.0 and stock V15 round trips; a four-hour run, the V16 round trip and UC25HQ80 validation remain open for this build.
- version: v2.0
  date: 2026-11-11
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v2.0
  notes: Adds the Journey Arranger (up to eight sections, with factory loops in three Biomes), a six-track sequencer grid, Living Links, Biome Drift, MIDI Learn, 272 Biomes including Blank and 632 tones, USB audio with six mono voices plus the stereo mix, and USB screen mirroring. Tested on an FM-1 from 1.5 and stock V15 and V16; UC25HQ80 flash checks passed offline, but this exact build is still awaiting a hardware check on a UC25HQ80 unit. FM-1 only; SMK-37 is a separate adaptation in development. Package ID FM-1_710020000.
- version: v1.5
  date: 2026-11-09
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v1.5
  notes: Adds Bluetooth MIDI reception (notes, CC, pitch bend, sustain, transport and clock, one connection at a time) on a new GLO > WIRELESS MIDI page, 12 Biomes (168 plus Blank) and 12 tones (364), brighter display colour families, corrected echo delay bounds and an updater that restarts the unit. A newer UC25HQ80 unit was not available for testing. FM-1 only, not SMK-37. Package ID FM-1_710010500.
- version: v1.4
  date: 2026-10-31
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v1.4
  notes: Adds 48 factory Biomes (156 plus Blank) and 16 tones (352), five scales, USB MIDI input routing per track, dimmed muted tracks and clearer labels. Package ID FM-1_710010400.
- version: v1.3
  date: 2026-10-29
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v1.3
  notes: Adds five Lo-Fi drum kits with 40 one-shots, 336 tones and 108 Biomes, two LFOs per synth track, five sequence directions, four more pattern generators and longer chord journeys, and button backlight settings. Package ID FM-1_710010300.
- version: v1.2
  date: 2026-10-27
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v1.2
  notes: Adds three sound families (Velvet Keys, Spectral Bloom, Breath Texture), 15 engines, 288 tones and 92 Biomes, 32-step tracks with phrase generators, keyboard and MIDI step entry and live overdub, and chord journeys. Package ID FM-1_710010200.
- version: v1.1
  date: 2026-10-25
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v1.1
  notes: Twelve engines, user banks, mixer and live browser editing. Package ID FM-1_710010100.
- version: v1.0
  date: 2026-10-18
  url: https://github.com/kidbee85-beep/mutable-dreams/releases/tag/v1.0
  notes: Package ID FM-1_710010000.
