distribution: browser-installer
install_notes: >-
  Use the project installer in desktop Chrome or Edge over USB, or the Python installer kit.
  Stock V15 and V16 installation and return are documented in Recovery-1.4.txt; M-VAVE's M-UPGRADE rejected a
  custom Mutable Dreams package, so use the project installer. For 1.0, use the documented route through 1.1 first and back up in
  1.1 before installing a later version. Follow the published instructions for other starting firmwares; not
  every route is tested. Back up first. On 1.1 and later save both .mddb for stored banks and JSON for unsaved
  live edits; 1.0 does not support the .mddb protocol. Returning to V15 erases User Banks and preferences. A
  1.2 or later patch is newer than 1.1, so keep a backup from before updating if you may downgrade.
brick_risk: true
