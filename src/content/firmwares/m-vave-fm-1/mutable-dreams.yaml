device: m-vave-fm-1
name: Mutable Dreams
summary: >-
  Six-track generative synth with 272 factory Biomes including Blank, Journey Arranger, a six-track grid
  and six mono USB voices plus the stereo mix.
description: >-
  Each of the six tracks can use any engine, or three synth tracks can share the space with one of five Lo-Fi drum
  kits. Selected Plaits, Rings and Elements algorithms sit alongside
  original voices including Choir, Round Bass, Mellow Drift and Satin Morph. Biomes combine scales,
  Euclidean rhythms, probability, swing and accents; bassline modes, glide and editable phrases of up to
  32 steps per track (note, rest, velocity, gate and probability) provide additional ways to shape a piece.
  Four phrase generators, step entry from the keyboard or USB MIDI, monophonic live recording and four
  optional chord journeys across selected tracks are included. A global mixer controls track levels and
  shared effect sends.
  The device stores sixteen named User Biomes and 64 User Sounds. The browser instrument also works as
  a bidirectional hardware editor, with live-patch JSON transfer and full .mddb saved-bank backup and restore.
  Full-bank restore requires physical SEL confirmation. Granular audio is not saved in a Biome.
  Version 1.3 adds two LFOs per synth track, five sequence directions and more generators and chord journeys. Version 1.4
  adds 48 Biomes and 16 tones, five scales (thirteen in all), per-track USB MIDI input channels and dimmed muted tracks.
  Version 1.5 adds 12 Biomes and 12 tones and receives Bluetooth MIDI from a phone, tablet or computer on a GLO > WIRELESS MIDI page. USB MIDI was tested; TRS MIDI input is implemented but its physical cable test remains outstanding.
  Version 2.0 brings 272 factory Biomes including Blank and 632 tone presets, a Journey Arranger that links up to
  eight sections, a six-track sequencer grid with individual pattern lengths and one-bar fills, Living Links,
  Biome Drift and MIDI Learn. USB audio at 44.1 kHz carries the stereo mix on inputs 1–2 and six pre-pan,
  pre-effects mono voices on inputs 3–8, and the FM-1 display can be mirrored over USB.
  Version 2.1 adds Itinera, fourteen long-form dreams of 30 minutes to four hours that move through Biomes on their own, and refines MIDI timing.
  The complete source tree is directly browsable at each release tag since 2.0, with build instructions. The 2.1
  notes report the 2.0 and stock V15 round trips passing on one FM-1, and list a four-hour run, the V16 round trip and
  the UC25HQ80 hardware check as still open for that build. These are selected algorithms and inspired functions, not full
  ports of every Mutable Instruments module.
