source: https://github.com/Enkerli/mvane-yard
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only, matching the LICENSE file, and says it is compatible with Clipper's and Coral Flower's GPL-3.0. fm1-base and felucca-bsp stay MPL-2.0, and the vendored Clipper core carries msfa (Apache-2.0) and ports of DaisySP and Rings code under their own licences (CREDITS.md). No JieLi closed libraries are linked.
homepage: https://enkerli.github.io/mvane-yard/
based_on: m-vave-fm-1/clipper
distribution: download
install_notes: >-
  Install the .fwsc from the release with M-Patcher or fm1-base's tools/fm1_install.py; the README says to back up the current firmware first. The browser page and tools/yard.py handle takes and settings over USB, and the firmware refuses files while a take is playing.
