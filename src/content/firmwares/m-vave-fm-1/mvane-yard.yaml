device: m-vave-fm-1
name: mvane yard
summary: >-
  Performance firmware: a 12-voice synth or Clipper's sounds played as notes, MPE or chords from eight pitch-class sets with voice leading, MPE out over USB, and an always-on recorder whose takes leave as MIDI files.
description: >-
  Keys play single notes or chords built from one of eight pitch-class sets, with a separate bass and voice leading between chords. MIDI in over USB and TRS is read as MPE, with per-note bend, slide and pressure, and MPE goes out over USB. The sound is either the firmware's own band-limited saw voice with a key-tracked low-pass or one of Clipper's factory sounds, whose synth core is vendored from Clipper. A recorder is always running, so a take can be kept after it was played; takes are saved in eight slots, replayed, and moved to a computer as MIDI files by a web page or a command-line tool, which can also send a MIDI file back as a take. The chord mode follows Coral Flower's design (chord qualities on the black keys, hold, quantise) without using its code. It is built on fm1-base. The release is marked as a beta.
status: active
authors:
