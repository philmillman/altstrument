device: m-vave-fm-1
name: mvane yard
summary: >-
  Performance firmware: a 12-voice synth or Clipper's sounds played as notes, MPE or chords from eight pitch-class sets with voice leading, MPE out over USB, and an always-on recorder whose takes leave as MIDI files.
description: >-
  Keys play single notes or chords built from one of eight pitch-class sets, with a separate bass and voice leading between chords. MIDI in over USB and TRS is read as MPE, with per-note bend, slide and pressure, and MPE goes out over USB. The sound is either the firmware's own band-limited saw voice with a key-tracked low-pass or one of Clipper's factory sounds, whose synth core is vendored from Clipper. A recorder is always running, so a take can be kept after it was played; takes are saved in eight slots, replayed, and moved to a computer as MIDI files by a web page or a command-line tool, which can also send a MIDI file back as a take. The chord mode follows Coral Flower's design (chord qualities on the black keys, hold, quantise) without using its code. It is built on fm1-base. Since 0.13-beta the scale can be any pitch-class set, recordings loop and overdub and an arpeggiator is included. 0.15 is the first release not marked as a beta, and it also ships a native port for the VIBE FM plugin.
status: active
authors:
- name: Enkerli
  url: https://github.com/Enkerli
source: https://github.com/Enkerli/mvane-yard
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only, matching the LICENSE file, and says it is compatible with Clipper's and Coral Flower's GPL-3.0. fm1-base and felucca-bsp stay MPL-2.0, and the vendored Clipper core carries msfa (Apache-2.0) and ports of DaisySP and Rings code under their own licences (CREDITS.md). No JieLi closed libraries are linked.
homepage: https://enkerli.github.io/mvane-yard/
based_on: m-vave-fm-1/clipper
distribution: download
install_notes: >-
  Install the .fwsc from the release with M-Patcher or fm1-base's tools/fm1_install.py; the README says to back up the current firmware first. The browser page and tools/yard.py handle takes and settings over USB, and the firmware refuses files while a take is playing.
brick_risk: false
tags: [performance, chords, midi, usb-midi, synth-engine, sequencer, looper, editor, web, fork]
versions:
- version: v0.15
  date: 2026-11-23
  url: https://github.com/Enkerli/mvane-yard/releases/tag/v0.15
  notes: First stable release, with the .fwsc. On the FM-1 it matches 0.14-beta. The release also attaches a native port of the same code for VIBE FM (mvane-yard-native.zip and .wasm), which plays notes and chords, YARD and Clipper's sounds, the recorder and the ARP in a DAW.
- version: v0.14-beta
  date: 2026-11-23
  url: https://github.com/Enkerli/mvane-yard/releases/tag/v0.14-beta
  notes: Pre-release. Overdubs from a wind controller land on their own channels and breath follows each line, the ARP gets two pages of settings, and scales are named by number from a list of 64 known ones with an editor on the project page. Listed here because the beta line between 0.9 and 0.15 is otherwise skipped.
- version: v0.13-beta
  date: 2026-11-22
  url: https://github.com/Enkerli/mvane-yard/releases/tag/v0.13-beta
  notes: Pre-release. The scale becomes any pitch-class set numbered 0 to 4095 with a list of 16 of your own, QUANT FULL snaps incoming notes to it, recordings follow key and scale changes and can loop and overdub, and an arpeggiator with eight modes arrives. Versions 0.10 to 0.12 beta are not listed separately.
- version: 0.9-beta
  date: 2026-11-22
  url: https://github.com/Enkerli/mvane-yard/releases/tag/v0.9-beta
  notes: Pre-release with the .fwsc, .rfm1, firmware.json and checksums.
