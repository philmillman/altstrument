device: m-vave-fm-1
name: MYCEL-8
summary: >-
  Generative sequencer for the FM-1: eight parts, each a Euclidean rhythm plus a Turing-machine shift register picking
  notes from a scale pool.
description: >-
  Each of eight parts has a rhythm (1 to 32 steps, pulses, rotate, division), a pitch register (length, mutate
  percentage, range, and mode: Turing, cycle, bounce, random or drone), a feel page (chance, accents, gate, ratchets)
  and a sound. The register draws notes from a pool of scale degrees lit on the white keys, so output stays in key.
  Registers can be locked, diced with a history to step back through, and DENSITY and TIDE change every part at once.
  Eight snapshots return the whole field at the next bar. It has its own 8-voice synth and drums, sends MIDI over USB
  and Bluetooth, and can send or follow MIDI clock. The README names the Music Thing Turing Machine, Euclidean rhythms
  and the Torso T-1 as the models.
