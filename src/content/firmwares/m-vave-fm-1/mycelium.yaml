device: m-vave-fm-1
name: Mycelium
summary: >-
  Forest, psytrance, goa and hi-tech themed firmware built on Felucca and SLOOP, with original drum assets,
  icons and four factory songs. Test release; a full physical listening and controls test is outstanding.
description: >-
  Published by the mandalars.org project as a package identity of its own (FM-1_900) that includes the Felucca
  update loader. The source is supplied as a zip archive in the repository. The README says a fresh
  reproducible build has not been done, and it notes that the project's browser studio uses a different sound
  engine from the hardware firmware.
status: active
authors:
