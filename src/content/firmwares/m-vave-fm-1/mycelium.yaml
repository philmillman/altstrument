  url: https://github.com/megagott
source: https://github.com/megagott/mycelium-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Firmware code is GPL-3.0-only; upstream copyright notices and asset-specific licences are kept in the
  source zip's LICENSING.md.
homepage: https://www.mandalars.org/mandalars/fm1/
distribution: download
install_notes: >-
  Download the .fwsc from the repository's releases (SHA-256 is in the README) and follow the instructions on
  the project's page. Back up your work first. Recovery may need FM-1-transporter.
brick_risk: false
