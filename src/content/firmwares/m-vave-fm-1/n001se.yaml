device: m-vave-fm-1
name: n001se
summary: >-
  Random FM drum machine with an acid line: four FM drum tracks where every hit varies around its base sound, patterns
  that generate and evolve on their own, and moving effects, meant for live sets.
description: >-
  Download note: the author hands out the built package on Patreon; the public source builds without it. A fork of FiMba-1 that keeps its platform and replaces the instrument. Each of the four drum tracks has four
  operators in eight algorithms, noise and a resonator, and a new sound is drawn from a kind such as kick, snare, hat or
  metal. The fifth track is the acid line added in 1.4.0. The README says 1.3.1 has been tested on an FM-1 and 1.4.0's
  acid line only in the simulator. The Wild firmware is built on this one.
status: active
