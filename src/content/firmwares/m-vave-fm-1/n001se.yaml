distribution: source-only
install_notes: >-
  Build from source, or get the .fwsc from the author's Patreon, then install with M-UPGRADE, FiMba-1's web page in
  Chrome or Edge, or tools/fm1_install.py. Keep M-VAVE's V15 package to go back. A failed start falls back to a safe mode.
