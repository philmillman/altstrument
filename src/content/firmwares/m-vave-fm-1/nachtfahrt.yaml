versions:
- version: 1.0.0
  date: 2026-11-01
  url: https://github.com/FartyPants/fm1-nachtfahrt/releases/tag/v1.0.0
  notes: Adds a tenth piece, Umeda, with a sampled piano on the lead and sequences, stereo rain and water atmospheres, a choir lead voice, a lead played from MIDI input and a slowly drifting Density. Saved settings are reset once on the first install over 0.9.9 because the project format changed.
- version: 0.9.9
  date: 2026-10-31
  url: https://github.com/FartyPants/fm1-nachtfahrt/releases/tag/v0.9.9
  notes: Renames the ninth piece Sakura Rain and drops its atmosphere, because the rain simulation used too much CPU on the FM-1; saved settings are kept. Builds 0.9.5 to 0.9.8, not listed separately, added FM voices for the sequences and lead, the ninth piece and a Hail atmosphere (0.9.6; it also reset saved pieces), and CPU trims.
- version: 0.9.4
  date: 2026-10-29
  url: https://github.com/FartyPants/fm1-nachtfahrt/releases/tag/v0.9.4
  notes: Reworks the wind and surf atmospheres, adds a rain atmosphere, and gives the Phaedra piece a choir drone. Builds 0.9.1 to 0.9.3, not listed separately, added drifting master actions, a lead that remembers and answers, a shimmer reverb key, a plucked-string sequence voice and a choir drone voice.
- version: 0.9.0
  date: 2026-10-28
  url: https://github.com/FartyPants/fm1-nachtfahrt/releases/tag/v0.9.0
  notes: First public build; eight pieces, two sequences, drone, lead, atmosphere and filter motion.
