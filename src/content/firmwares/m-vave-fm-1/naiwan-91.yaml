  url: https://github.com/superposition
source: https://github.com/superposition/91
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL-3.0 text and LICENSING.md states GPL-3.0-only. The FM engine is Melodee's (after Dexed and MSFA, Apache-2.0 parts), the DY voices are public-domain DX7 banks with no Yamaha ROM voices, fonts are SIL OFL 1.1 and the JieLi SDK files are read from your checkout at build time and not committed.
homepage: https://superposition.github.io/91/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge with the FM-1 on USB. The README says it checks the package against the unit, can put M-VAVE's firmware back, and that a unit failing to start twice enters a safe mode the installer can reach. Switching firmware can lose stored pieces and settings, so keep copies.
brick_risk: false
