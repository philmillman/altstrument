device: m-vave-fm-1
name: NAIWAN 91
summary: >-
  Generative groovebox for the FM-1, a PERF-1 fork with nineteen city pop and coastal genres of ten pieces each, an auto-DJ, a drum sequencer, DX7 voice loading and a honu-themed screen.
description: >-
  Each piece is a set of rules for key, mode, tempo, sounds and drum patterns, so chords move and the acid line mutates while it plays. Ten urban genres (city pop, AOR, boogie, shibuya-kei, yacht rock and others) and nine coastal ones (surf, balearic, calypso and others) share one library of donor recipes, with a row of tempo, root and mode data and five pluck sounds for each genre. Controls break the music down, build it back and drop it, and an auto-DJ can run that arc. The sequencer has six drum lanes with Euclidean fills, polymeter, ratchets and chains. A jam page turns the keys into a scale instrument, and up to 16 DX7 voices load from a .syx file. A browser emulator and editor run on the project site. It inherits PERF-1's lineage through HYP-1, AMB-1 and Felucca, and takes its FM engine from Melodee.
status: active
authors:
