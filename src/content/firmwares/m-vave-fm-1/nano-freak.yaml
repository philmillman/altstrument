license_notes: >-
  LICENSE and LICENSING.md state GPL-3.0-only, inherited from FMini-1 (Guilherme Ruppert) and Felucca (Leo Kuroshita, Hügelton
  Instruments). CREDITS.md lists the other parts, including oscillator ideas ported from Mutable Instruments Plaits (MIT), msfa
  (Apache-2.0) and fonts under SIL OFL 1.1. The repository is a GitHub fork of ruppert/fmini-1, 90 commits ahead when checked.
homepage: https://virusiinstaller.github.io/nano-freak-fm1/
distribution: browser-installer
install_notes: >-
  Use the web installer on the project site, which supports FM-1s with the newer flash chip, or install a .fwsc from a release
  with an installer such as The Firmware Hub. Install the package for your own model on the SMK-37, which has its own instructions in SMK37.md
  and is untested. The project documents no recovery steps beyond the platform inherited from FMini-1.
