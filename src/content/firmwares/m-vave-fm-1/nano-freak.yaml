device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: Nano Freak
summary: >-
  uFreak-style synth with fifteen oscillator types, a state-variable or ladder filter, two LFOs, a five-source modulation matrix, a stereo widener, an arpeggiator and a 64-step sequencer; a fork of FMini-1.
description: >-
  Nano Freak runs integer-only versions of the oscillator and screen code from the author's Nano Freak browser test bed. Its fifteen
  oscillator types each have four knobs and a picture of the sound, and the filter is either a state-variable or a Minimoog-style ladder.
  Modulation comes from an envelope, a cycling envelope that loops like an LFO, two LFOs and a matrix of five sources against eight
  destinations. Effects are reverb, delay and a Haas stereo widener. Impress and Chance add variation to the arpeggiator and
  sequencer, which has 64 steps with random and mutate. There are 58 factory presets, user slots and about 70 MIDI CC numbers. The
  README says it was built with Claude. The FM-1 build is tested, and the SMK-37 Pro, Elite and MKE-P37 builds are beta and untested on those units.
