- version: 1.0.0
  date: 2026-11-05
  url: https://github.com/Mr-Roboto/nauclerus/releases/tag/v1.0.0
  notes: First stable release. Adds the ACID triangle waveform, fourteen colour themes and a Grids WRITE track-length fix, supports both FM-1 flash chips (Puya P25Q80 and UC25HQ80), renames the USB product to Nauclerus FM-1 so installers find it, and teaches the Python and Web MIDI installers the FM-Tangram name.
