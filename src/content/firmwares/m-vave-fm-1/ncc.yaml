device: m-vave-fm-1
name: NCC (Novation Circuit Companion)
summary: >-
  Felucca fork that turns the FM-1 into a two-part companion synth for the Novation Circuit Tracks: twelve engines,
  161 sounds, the Circuit's eight macro knobs mapped on every engine, a clock-locked arp and drone chords.
description: >-
  Part L follows the Circuit's MIDI 1 track on channel 3 and part R its MIDI 2 track on channel 4, each with its own
  sound, and the two come out on the left and right channels. The FM-1 has no sequencer in this build; the Circuit
  plays the notes and sends the clock. Sounds are picked by role (bass, pad, lead, keys, pluck, beat) and then by
  engine and preset. Engines are FM6, JUNO with a chorus, PHASE, TRIO, ACID, PHYS, GRAIN, VOICE, LOFI, WHEEL, NOISE
  and SAMPLE. A Dual mode lets one Circuit track play both parts, and the Drone button stacks or replaces held
  chords. A web manager edits sounds, DX7 banks, backups and settings over USB, and a browser emulator plays a
  built-in Circuit. CREDITS.md says development used Claude Code and Codex.
status: active
