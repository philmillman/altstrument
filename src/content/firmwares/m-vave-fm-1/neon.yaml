device: m-vave-fm-1
name: NEON
summary: >-
  Felucca fork for synthwave: Juno-style, unison-saw and string-machine engines, about 220 presets, 80s drum kits, and songwriting tools that follow one chord progression, with a sunset-and-grid look.
description: >-
  NEON adds sound engines to Felucca: a Juno-106-style voice, a stacked unison oscillator engine for leads, brass and basses, a string machine with an ensemble chorus, and a supersaw and PWM voice with slow drift. About 220 presets are sorted into bass, lead, pad, arp, key and drums, many converted from patches for other synths, and ten 80s drum kits are included. HARMONY lets one chord progression drive every melodic track, WRITE creates a one-bar part for a track's sound, VARY turns a bar into a four-bar phrase, and chords move by voice leading. Patterns run to 64 steps per track, and any track can take a tempo-synced sidechain duck and a stereo chorus. The screens use a sunset palette, role colours for each kind of track and a visualizer page tied to the tempo. Felucca's own engines stay in the firmware but are not listed, and projects that use NEON's engines do not load on Felucca. The package has its own identity, FM-1_1984. The README says it was developed with the help of AI coding tools.
