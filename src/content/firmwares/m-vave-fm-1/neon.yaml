license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0, and the LICENSE file is the GPL-3.0 text. LICENSING.md keeps Felucca's terms: GPL-3.0-only overall, with Felucca-Engines MIT, felucca-bsp MPL-2.0 and some ported DSP under its own licences. The README says NEON's own engines are MIT.
homepage: https://github.com/LotionOnTheSkin/NEON#readme
distribution: download
requires_stock: Any FM-1 firmware
install_notes: >-
  Download neon.fwsc from the release and install it with the FM-1 Firmware Hub or another FM-1 installer that takes a .fwsc file; the README says to back up projects and presets first and that M-VAVE's own updater returns the FM-1 to the official firmware, which is the documented recovery. The package can be tried without an FM-1 in the browser emulator at joakimeriksson.github.io/fm1-emu.
