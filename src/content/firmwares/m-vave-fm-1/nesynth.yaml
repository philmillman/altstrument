device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: NESynth
summary: >-
  NES emulator for the FM-1 and the SMK-37 Pro and Elite: the keys are the controller, the audio runs on a second CPU core, and games are added
  to an on-device library over USB or Bluetooth. Browser site with a player, game uploader and installer.
description: >-
  Built on InfoNES and the Felucca hardware layer. Supports NTSC cartridges with mappers 0, 1, 2, 3, 4, 9 and
  11 and one controller. The site plays a dropped .nes or ZIP file in the browser. The installed core starts with
  an empty library and games are then sent from the site's Add games tab; the README's size limit is 256 KiB per
  cartridge. Three licensed homebrew games and an original diagnostic cartridge are included and no commercial
  ROMs are. The author reports about 60 emulated frames a second on the FM-1 in one game, with a lower screen
  refresh rate, and calls other games experimental. The browser simulator has FM-1 and SMK-37 layouts and a CRT
  television view. The same code builds for the SMK-37 Pro and Elite, with 392 KiB of library storage and
  Fader 1 as volume; the SMK builds have their own pre-releases, and pad-light build 971 was checked on an
  SMK-37 Pro.
status: active
