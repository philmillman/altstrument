versions:
- version: '0.3'
  date: 2026-11-13
  url: https://github.com/evanyerburgh/niagara-drift/releases/tag/v0.3
  notes: Redraws every page with a picture of the sound at the top, adds sixteen presets in two banks, eight key gestures and eleven tunings, a shimmer reverb, new delay types, cross-FM and a screen-reader output, and makes the motion loop record gestures and scenes. The installer saves your sound and scenes before installing. Updates from 0.2 or 0.2.1 keep the sound and scenes; the release was tested on an older FM-1 and also saves on the newer chip.
- version: 0.2.1
  date: 2026-11-02
  url: https://github.com/evanyerburgh/niagara-drift/releases/tag/v0.2.1
  notes: The sound is the same as 0.2. Adds support for the memory chip of some newer FM-1s, which 0.2 could not save on, and returning to either M-VAVE V16 or V15 whichever bootloader is fitted. The installer also takes V16, and the install page has a troubleshooting section.
- version: '0.2'
  date: 2026-10-21
  url: https://github.com/evanyerburgh/niagara-drift/releases/tag/v0.2
  notes: Slow movement by default, twelve fixed presets, gestures, scenes in banks with a pressure crossfade, new effects and backup options in the installer script.
- version: 0.1-beta
  date: 2026-10-14
  url: https://github.com/evanyerburgh/niagara-drift/releases/tag/v0.1-beta
  notes: First public version; marked as a pre-release.
