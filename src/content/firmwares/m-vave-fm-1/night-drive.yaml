device: m-vave-fm-1
name: NIGHT DRIVE
summary: >-
  Self-playing synthwave firmware for the FM-1 that drives an endless generated track of rolling bass, arpeggios and gated drums past a neon grid road toward a striped sun.
description: >-
  The engine generates rolling sixteenth-note bass, arpeggios, detuned pads, a punchy kick and a big gated snare, with a saw, square or FM-brass lead now and then, over minor progressions such as i VI III VII. Sections come round by themselves, from intro to drive, breakdown and build, with occasional key changes, and a limiter on the master keeps it from clipping. Everything is generated in code and no samples are used. The screen shows a grid road to a striped sun with mountains on the horizon, a grid that pulses on the kick and car tail lights that flare on the snare, in a colour scheme set by each preset. The Road page has Speed from 85 to 130 BPM, Bright, Arp density and Drift for how often sections and keys change. Fourteen presets each have their own key, speed, sounds and palette.
status: active
authors:
