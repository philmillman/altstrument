device: m-vave-fm-1
name: NIGHT TRAIN
summary: >-
  Self-playing ambient firmware for the FM-1 that rides an endless night train through generated landscapes and stations, with the wheel clacks as the beat and six regulars whose stories continue over many nights.
description: >-
  The train runs a seeded route, each stretch with its own landscape such as forest, coast, city lights, snowfields or moors, and its own key and sound. The clack of the wheels follows the train, slowing into stations and quickening away, where the music thins, a chime rings and passengers get on and off. Six regulars, among them a conductor, a night nurse, a cellist and a cat nobody owns, talk, nap and argue, and the journal page records their stories. Distance, stations, seating and stories are saved about once an hour, or at once with SAVE. PRESETS turned right sends the train express to the next station, 1.1 added 12 sound presets, and the engine comes from AMB-1.
status: active
authors:
- name: ashtonwallen
  url: https://github.com/ashtonwallen
source: https://github.com/ashtonwallen/fm1-firmware/tree/main/night-train
source_status: open
license: MPL-2.0
license_notes: >-
  The folder's LICENSING.md and LICENSE give MPL-2.0 file by file, with AMB-1's and fm1-base's notices kept on the files
  that came from them. The Barlow Semi Condensed and Terminus fonts are SIL OFL 1.1 and the JieLi SDK files are read from
  the builder's checkout.
based_on: m-vave-fm-1/amb-1
distribution: download
install_notes: >-
  Download the .fwsc from the release and write it with M-Flasher or the FM-1 Flasher in the same repository, which backs up the whole flash first and keeps the bootloader untouched. The release says it is built on fm1-base 3ae2a65, which supports both flash chips, and has not been played much on real hardware.
brick_risk: false
