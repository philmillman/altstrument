device: m-vave-fm-1
name: NIGHTFALL
summary: >-
  Independent performance firmware with its own synth, sequencer and effects, a green spectral-terrain display,
  a browser simulator and studio, a device editor and a browser updater.
description: >-
  Written from scratch on top of Felucca's FM-1 startup, hardware layer, USB-MIDI and update code, which the
  build takes from a Felucca checkout rather than vendoring. The 240 by 240 display shows a spectral terrain
  from a 20-band analysis, driven over a USB-MIDI protocol the web studio also uses. The simulator needs no
  hardware, and the editor and updater need desktop Chrome or Edge with Web MIDI SysEx. The README says the
  FM-1_999 GREEN2 package booted on one FM-1 and passed USB identity, parameter round-trip, MIDI note and
  terrain protocol tests, and that full audio regression, long-run stability, rollback to the official firmware
  and recovery without external hardware are not proven. The release is marked a pre-release.
status: active
authors:
- name: SylarPu-X
  url: https://github.com/SylarPu-X
source: https://github.com/SylarPu-X/nightfall-fm1
