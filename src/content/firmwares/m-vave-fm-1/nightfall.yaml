  optional PIANO_HD sample derives from CC0 VCSL recordings, Inter Tight is SIL OFL and Fukiai icons are MIT
  (THIRD_PARTY.md).
homepage: https://sylarpu-x.github.io/nightfall-fm1/
distribution: browser-installer
requires_stock: V15 or Felucca
install_notes: >-
  Use the browser updater on the project's site (desktop Chrome or Edge, SysEx permission), which checks the
  package SHA-256 and asks you to confirm the risk, or take the .fwsc from the release. A failed update may need
  an external recovery tool, and the USB identity is a provisional FM-1_999.
