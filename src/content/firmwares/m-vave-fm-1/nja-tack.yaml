device: m-vave-fm-1
name: NJA TACK
summary: >-
  Felucca-derived firmware that plays harmony moves: six keys pick a move, played MIDI notes are bent to the chosen scale and
  root, and a looper replays the performance with up to four recorded voices.
description: >-
  Notes whose onsets fall in an 80 ms window keep their literal pitches, including voicing, while legato and later overlaps
  follow the scale. The LOOP page replays the timing as played and APPLY writes a four-slot harmony pattern. A take that
  exceeds the four-voice or other capture limits is rejected whole instead of trimmed. Raw timing, channel and voicing
  metadata live in RAM only. The firmware sits on Felucca's engines, sounds, drums and effects. It is an experimental release
  candidate, 6.28-rc5, with identity FM-1_65262805. The author reports one controlled install on one FM-1 and lists audio,
  timing, voice-budget and recovery tests as still open.
status: active
authors:
