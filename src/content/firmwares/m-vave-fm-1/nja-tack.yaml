  url: https://github.com/NjamesZ
source: https://github.com/NjamesZ/nja-tack-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSING.md state GPL-3.0-only for the application, with MIT, Apache-2.0, OFL and CC0 components keeping
  their own terms. The repository commits the release .fwsc, an app .bin and a source archive for 6.28-rc5; none is a stock
  M-VAVE image.
based_on: m-vave-fm-1/felucca
distribution: download
install_notes: >-
  Install release/6.28-rc5/felucca-6.28-rc5.fwsc, or the same file from the release, with tools/fm1_install.py over USB, then
  check that the unit reports FM-1_65262805. Back up first and keep a known-good package; the author warns that projects and
  samples from other firmware may not carry over and that installs are at your own risk.
