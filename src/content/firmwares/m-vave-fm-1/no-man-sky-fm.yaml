license_notes: >-
  Stated in the README and the LICENSE file, as for SLOOP and Felucca. Firmware/LICENSING.md, inherited from
  Felucca, keeps the icon atlas and panel image under separate terms; sampled sounds are CC0 and the font
  is SIL OFL.
homepage: https://hericdk.github.io/nomanskyFM/
distribution: browser-installer
install_notes: >-
  Open the project site in Chrome or Edge, connect the FM-1 over USB and press install. The package is also in
  the release page. The installer can write M-VAVE's V15 back from the file you download
  from M-VAVE. To reach USB rescue mode, hold OCT- alone while switching the FM-1 on.
