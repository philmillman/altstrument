device: m-vave-fm-1
name: No Man Sky FM
summary: >-
  SLOOP 2.8.4 fork that turns the FM-1's home screen into a space game: knobs steer a ship, planets can be
  landed on and mined, robots chase you, and a warp map links star systems while SLOOP keeps playing.
description: >-
  A fan-made demake of No Man's Sky. On HOME the knobs turn and speed the ship or walk on a planet, and holding
  or double-tapping OCT-, OCT+ and HOME boosts, lands, fires the mining laser, opens the warp map and
  the radar; a quick press keeps each key's normal SLOOP function. It also adds key-light effects, a drum sound
  page and a QUANT off option on the record screen. Version 0.9 draws the planet in 3D so you land on the ground
  you flew over, adds races over planets, shows each sound change as a CD carousel, and brings in features from
  winampFM (a PARTY page and a scale arpeggio) and a small wave editor. It merges SLOOP up to 2.8.4. The
  author warns that the 3D flight and some screens can still drop frames, and that the flash is nearly full,
  so a few drum and bass samples were stored at a lower rate. The project
  site has an installer, an editor and a 3D simulator that runs the firmware compiled to WebAssembly. The author asks
  that features reused elsewhere be credited. Not affiliated with Hello Games or M-VAVE.
status: active
