homepage: https://joolo09.github.io/noct-fm/
distribution: browser-installer
install_notes: >-
  Web MIDI installer in Chrome or Edge over USB, offering the package from the latest successful CI build; the
  same page has the DAW scripts. Or build on Linux x86-64 with JieLi's toolchain and the AC79 SDK (sh build.sh
  --no-ble for the USB build). The package uses CTL-1's storage layout, so other firmware's data is not kept. The
  author asks you to save your data and check the recovery steps for your stock version before installing, and
  says the full hardware cycle is unverified.
