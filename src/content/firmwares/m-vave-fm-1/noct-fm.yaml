device: m-vave-fm-1
name: NOCT FM
summary: >-
  MIDI controller firmware for the FM-1 with an animated pixel-world screen and DAW control for FL Studio and Ableton
  Live, plus pages for chords, a phrase generator, rhythm, an arpeggiator and clock sync, with DAW scripts for both.
description: >-
  Modifies CTL-1. It is one permanent MIDI preset (the changelog's newest entry is 0.9.2, which the README's build command also names). The HOME page
  sends fixed CCs 20 to 23 on MIDI channel 16 for volume, pan and two further DAW controls, with transport, record, panic,
  sustain and modulation, and notes go out on channel 1 from a chromatic keyboard. The PRESETS knob steps through pages
  for chords, a four-bar melody and chord generator, a rhythm generator, an arpeggiator and clock sync (automatic,
  internal or external). The generator has melody, chords, both, bass and full modes, eight scales and thirteen melody
  characters plus an automatic one, and the ALGORITHM knob steps through 1000 phrase variations; the arpeggiator is always off after power-on. Feedback from the DAW updates knob values and tempo on screen, and the animated scenes react
  to the notes sent. The synth, USB audio and Bluetooth are off in this build. The repository holds an FL Studio MIDI
  script and an Ableton Live remote script, a browser installer that checks the package size, SHA-256 and identity before
  writing, and an emulator that runs the firmware's C code in a browser page served from a local Python script. The README
  is in English with a Russian copy and a separate changelog. It calls the build experimental: the USB package builds in
  GitHub Actions, and it says tests on the simulator and against mocked DAW interfaces do not replace testing on a real
  FM-1 with a DAW. It gives no hardware test result. It cannot import FM-1 factory projects.
