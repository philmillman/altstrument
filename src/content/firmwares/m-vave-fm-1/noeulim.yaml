license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3 text and LICENSING.md states GPL-3.0-only, listing the origin of each part. msfa is Apache-2.0, the modal resonator from DaisySP is MIT, Open Sans is Apache-2.0 and the nature recordings are CC0. The JieLi SDK files that go into a package are read from the vendor's own SDK checkout and are not in the repository. The repository holds no M-VAVE firmware image.
based_on: m-vave-fm-1/zen-1
homepage: https://github.com/Uendeligh/noeulim-fm1-source
distribution: browser-installer
install_notes: >-
  Use the Install page of the project site in Chrome or Edge, or download the .fwsc and source archive from the release and run tools/noeulim_install.py; the README says to back up settings, projects and samples first, since Noeulim cannot import another firmware's projects. To build instead, use ./build.sh (Docker or Linux x86-64, JieLi's toolchain and the pinned AC79 SDK; BUILDING.md) and install the package with tools/noeulim_install.py or the local install page. The project's notes say to start from stock V15, keep M-VAVE's FM-1.fwsc to go back, and hold OCT- and OCT+ for 5 s for the update mode; two failed boots start a safe mode with USB on, and tools/fm1_rescue.sh puts stock firmware back from the chip's update mode, with FM-1-transporter as a hardware fallback.
brick_risk: false
