device: m-vave-fm-1
name: Noeulim
summary: >-
  Ambient firmware that plays itself: six ink-wash landscapes whose movement (a wave, snow, rain, a bamboo leaf) becomes the notes, with five tracks, a mixer, effects and 36 instruments. Source preview; no release is published.
description: >-
  Source note: the repository is labelled a source preview for USB product ID review and private testing. It publishes no release and no package, and the firmware is built from source. The README says public distribution waits for a USB ID allocation and hardware verification, and the application uses the unassigned product ID 4601 under vendor ID 1209, with a shared test ID in the update loader.
  The six scenes are Sunset, Snow, Aurora, Rain, Willow and Grove, each with five moods and two knobs of its own. A conductor decides which events are heard, using a note budget, returning motifs, three drones, a bass that follows the chords, echoes and rests, in scales that include pentatonic, Korean Pyeongjo and Gyemyeon, church modes and just, overtone, slendro and pelog tunings. The 36 instruments are 10 FM patches and 26 from modal, noise, formant, virtual analog, plucked string and phase distortion engines. EDIT opens a track mode, LFO the effects (reverb, delay, chorus, tape colour, drift), ENV the mixer and GLO a global menu. The keys play along in the scene's scale, with one-finger chords, track mutes and effect bypass. Five scene tracks, transport, clock, program change and CC go in and out over MIDI. It is built on ZEN-1, with credits to FuMi-1, FoMni and Felucca, and the guide is in Korean.
