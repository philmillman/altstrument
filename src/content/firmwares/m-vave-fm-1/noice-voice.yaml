device: m-vave-fm-1
name: NOICE VOICE
summary: >-
  Vocal synthesizer built on a physical model of the throat and mouth, with 44 onset and 29 coda phonemes, four creature
  voices, a drawn vocal-tract view on the screen and a 16-step sequencer that speaks sentences.
description: >-
  A 44-section waveguide models the airway, with a nasal branch gated by a velum, a glottal pulse source, breath noise and a
  lip radiation filter. Four archetypes (human, troll, elf and beast) change tract length and character, with 48 presets, and
  a mouth envelope moves tongue, jaw, lips and velum between a start and an end shape on each note. Beatbox percussion sounds
  are among the onsets. Four tracks are preloaded at boot with spoken phrases for the sequencer. A mid-sagittal drawing of
  the tract is animated on the 240 by 240 screen. It forks Felucca's code, adding the tract engine and its views, and a
  browser build runs it as WebAssembly. The README documents install commands but no hardware test; no release has been
  published.
status: active
