homepage: https://mrjoshida.github.io/noice-voice/
based_on: m-vave-fm-1/felucca
distribution: source-only
install_notes: >-
  Build build/noice.fwsc with ./build.sh (JieLi toolchain through Docker) and install it with tools/fm1_install.py over USB.
  No prebuilt package is published. The README's recovery note, taken from Felucca, points to FM-1-transporter if an install
  fails and the unit no longer starts.
