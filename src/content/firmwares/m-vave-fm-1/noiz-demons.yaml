license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only, as for Felucca; LICENSING.md is Felucca's, with its bundled and ported parts
  keeping their own licences.
distribution: download
install_notes: >-
  Download noiz_demons.fwsc from the release and flash it with the FM-1 web installer or tools/fm1_install.py,
  the same way as Felucca. A Felucca web installer or M-VAVE's own updater takes the unit back.
brick_risk: false
