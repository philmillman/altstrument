device: m-vave-fm-1
name: NOIZ DEMONS
summary: >-
  Felucca mod where randomising a sound is a summoning: one of 30 Ars Goetia demons answers each roll, its rank sets how far the patch is thrown, and its sigil replaces the graphs.
description: >-
  Ritual mode is set per track and is on at every power-up. Holding EDIT and pressing the SUM key, or turning a
  knob on an ENV, LFO, FX or FM6 operator page, rerolls part of the track's sound. The 30 demons fall into seven
  ranks, from one Knight that nudges values by about 15 percent to the Kings, of which Belial can land any value
  anywhere in its range. Each demon has its own animated sigil that follows the sound's level. Holding SAVE
  undoes a summoning, FM6 patches are kept from coming out silent, and the rest of Felucca is unchanged. The
  README describes the demon names and lore as drawn from the Lesser Key of Solomon.
status: active
