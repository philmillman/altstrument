  which LICENSING.md lists.
homepage: https://nzimas.github.io/norilsk/
distribution: browser-installer
install_notes: >-
  Browser installer in desktop Chrome, Edge or Opera over USB; it installs over M-VAVE's firmware, Felucca, SLOOP,
  Tonitor or an earlier Norilsk. Sessions are written only to blank flash or to Norilsk's own retired sessions, but
  another firmware installed later may erase them, so use the backup page first. Hold OCT- while switching on for
  rescue mode, then install again; holding OCT- and OCT+ for 5 seconds starts the chip's own updater. To build,
  run setup.sh and build.sh or install.sh.
brick_risk: false
