device: m-vave-fm-1
name: Norilsk
summary: >-
  Generative firmware for dark ambient and noise: three generators drawn at random, each through its own effect lane,
  with a looper per generator, snapshots with morphing, sessions and no sequencer.
description: >-
  Sounds come from a random draw of engine family and seed, and effect chains are drawn from 38 recipes that can be
  steered toward an abrasive or a dark path; a family or recipe can also be picked from an alphabetical list, and a
  MACHINE path draws industrial percussion. Three generators share four voices, with a DISINTEGRATOR control,
  latching, 23 scales, a master delay, plate reverb and drive. Each generator has Tonitor's looper, and its settings can be stored in one of 64 preset slots. Sixteen snapshots can be morphed over up to 30 seconds, and 64 session slots are kept in flash. Notes can come from the keys or
  USB MIDI, and the FM-1 is also a USB audio interface. A LOAD page shows how busy each core is. A browser page
  backs up and restores sessions. It was called Molecular until build 17, reuses code from Tonitor and Bigorna, and
  is built on Felucca and SLOOP's hardware layer. Releases are numbered builds.
status: active
