device: m-vave-fm-1
name: NoteSorcery
summary: >-
  OP-1-style eight-track groovebox on SLOOP: ACID and WAVE engines, circuit and Machinedrum-style kits,
  visual sequencer, live USB sampling, Ableton export from the browser and Android controller integration.
description: >-
  Marked in development (0.1) and tested on the host, not yet on a device. It does not read SLOOP projects
  and has smaller sample slots. An alternate edition with its own sounds and build, BOTANICA,
  has a separate entry.
