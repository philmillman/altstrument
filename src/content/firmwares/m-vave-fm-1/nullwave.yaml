  url: https://github.com/nullwave-cc
source: https://github.com/nullwave-cc/fm1
source_status: open
license: MPL-2.0
license_notes: >-
  The LICENSE file is the MPL-2.0 text. The built-in recordings are CC0 1.0 (assets/samples-cc0), Felucca-Engines is
  MIT, fm1-base and felucca-bsp are MPL-2.0, and CREDITS.md lists the Apache-2.0 JieLi SDK files the build takes.
homepage: https://nullwave.cc/fm1/
distribution: browser-installer
install_notes: >-
  The docs ask for a full flash backup with M-Flasher first, without its bootloader option, then install from the
  project's web installer in Chrome or Edge over USB, or with base/tools/fm1_install.py. The way back is the installer's
  Back to the stock firmware button, M-UPGRADE, or restoring the backup. Holding REC at power-on enters the chip's update
  mode, two failed starts open a safe mode, and holding HOME resets settings. Installing m-bootloader is an optional
  extra the installer offers.
brick_risk: false
tags: [groovebox, sequencer, synth-engine, drums, sampler, performance]
