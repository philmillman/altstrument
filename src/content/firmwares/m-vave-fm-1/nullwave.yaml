device: m-vave-fm-1
name: nullwave
kind: firmware
summary: >-
  Six-channel groovebox for the FM-1 where any channel can be a synth, drum kit, sampler or granular voice, with
  per-channel sequencers, scenes chained into songs, punch-in effects and USB, TRS and Bluetooth MIDI.
description: >-
  All six channels share one pool of voices, so there is no fixed drum track. Each channel plays one of fourteen
  engines: ANALOG, FM6, PHASE, LOFI, SAMPLE, VOICE, TRIO, WHEEL, GRAIN, PHYS, NOISE, SLICE, DRUM and a SUPER saw-stack
  engine, with two edit pages and a list of sounds each. The ANALOG, LOFI, TRIO, WHEEL, NOISE and PHASE engines come
  from Felucca-Engines. Every channel has its own pattern sequencer, mix strip and MIDI channel; held buttons turn the
  white keys and four knobs into layers such as punch-in effects, and the keys can play scales and chords. Patterns
  go into scenes that switch live and chain into songs, with eight songs kept on the unit. The built-in samples are
  CC0 recordings of a piano, a flute and a tenor saxophone plus a generated drum break. The README lists a looper
  that records the internal mix, a web editor, user samples and a fuller engine set as the plan for 1.0, and the
  manual says user samples are not available yet. It builds on fm1-base and felucca-bsp and shares no code with
  GPL-licensed firmware.
status: active
authors:
