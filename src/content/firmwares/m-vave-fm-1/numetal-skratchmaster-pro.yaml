device: m-vave-fm-1
name: NU//METAL SKRATCHMASTER PRO
summary: >-
  Robot-turntablist firmware: a speech synthesizer says 27 words onto a virtual record that you scratch with the keys and encoder, or you scratch an endless generated record, over a drop-tuned guitar, bass and drum band, with a rap mode, an LFO and a mixer.
description: >-
  Rights warning: the speech engine is a C port of SAM, the 1982 Software Automatic Mouth, via ESP8266SAM
  (GPL-3.0); the original program has no stated licence. Built on Dinghy and Felucca's platform code, it says its
  words in eight voices and scratches them with 17 techniques scored the way turntablists notate them, plus combo
  routines, a hamster switch, crossfader curve and motor torque settings. Rap mode alternates four bars of rhyming
  verse with four bars of hook in a growled voice, over the band's grooves. The PRO edition adds a tempo-locked LFO with
  seven shapes and six destinations, a tone-play mode where the keys are a pitch fader, a mixer page and a
  larger sound chain with reverb, compressor and limiter. Version 2.1 made the TRS MIDI input play the kit from an
  e-kit, sent every drum and the deck's scratch, crossfader and platter angle out over USB-MIDI for visuals, and
  replaced the drums and guitar with an 808 kit and a drop-B guitar rendered as 16-bit samples. Version 3.0 adds SURF
  mode, which plays an endless record computed as you scratch it (seven materials and a WORLD control) instead of
  storing a record, a 7-string drop-A guitar as the default tuning, whammy dives, twelve grooves and MIDI clock over the
  TRS jack. It installs over the earlier 1.0, 2.0 and 2.1 releases, which use the same identity, FM-1_926. The README
  says 3.0 runs on the FM-1.
