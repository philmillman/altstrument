homepage: https://mhellar.github.io/numetal-skratchmaster-pro-fm1/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer on the project's page in Chrome or Edge over USB, or numetal-pro-3.0.fwsc from the releases page
  with tools/fm1_install.py. Holding OCT- at power-on enters a rescue mode with only the updater. The
  first start of 2.0 resets saved settings to defaults, 2.1 keeps 2.0's settings, and 3.0 keeps 2.x settings and sets the tuning to drop A once.
