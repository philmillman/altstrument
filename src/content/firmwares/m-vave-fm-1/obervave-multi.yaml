device: m-vave-fm-1
name: OberVave Multi
summary: >-
  OberVave 1.2 fork that makes the polysynth multitimbral: six parts on six MIDI channels sharing the eight voices, with
  per-part sends into one shared chorus, delay and reverb.
description: >-
  Each part is a complete OberVave sound with its own program. In MULTI mode, channels 1 to 6 play parts 1 to 6 and channels
  7 to 16 play the part the panel is on; a single channel or OMNI works as in 1.2. Parts take voices when they play and
  give them back, a new note stealing the oldest released voice first. GLO with white keys 9 to 14 picks the panel's part, and a
  PARTS page sets track assignments and a part volume. The three effects are shared, so each part's mixes are sends and the effect
  settings come from part 1's program. The reverb runs at half the sample rate and the output has a limiter. Patch editors can
  send a program name over CC 110 and 111. The notes put the worst-case cost about 17 percent above OberVave 1.2 in a
  host measurement. The identity is FM-1_96N. Upstream OberVave has since moved to 3.0 with four tracks on shared voices, which
  is a different design from this one.
