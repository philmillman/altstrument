device: m-vave-fm-1
name: OberVave
summary: >-
  Four-track polysynth sharing 8 analog-style voices, with two oscillators per voice, a morphing 12/24 dB filter,
  a mixer with sends and a master section, an arpeggiator and a step sequencer.
description: >-
  Modelled on late-1970s and early-1980s American 8-voice polysynths. Each voice has two oscillators with hard
  sync and cross-modulation, per-voice drift, and four voice modes. There are 32 programs, 8 patterns in flash,
  USB MIDI in and out, and a browser simulator that compiles the firmware's own C sources. Version 3.0 replaced the
  two sequencer tracks with four that share the eight voices, added a mixer with four sends and a master section
  (DJ filter, drive, compressor, limiter), and made each pattern keep its own sounds and mix. Version 3.3 makes the 24 dB low-pass a four-pole ladder and replaces hard clipping in a voice with soft stages. It is built on
  Dinghy and uses sloopDX-style panel layers. The same repository carries SMK-37 beta builds (see OberVave SMK-37).
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
source: https://github.com/zvenson/obervave
source_status: open
license: GPL-3.0-only
license_notes: >-
  Platform code carries Leo Kuroshita's Felucca copyright and SLOOP's changes; LICENSING.md lists who wrote
  each part, including the SMK-37 board layer by M. Geisler.
homepage: https://github.com/zvenson/obervave
distribution: download
install_notes: >-
  The README gives the FM-1 Firmware Hub (thefirmwarehub.com) as one install route, or run
  tools/fm1_install.py on a built or provided .fwsc over USB. The README warns not to install 1.1, whose
  USB-MIDI out is broken and which no installer can replace once it is running; 1.2 fixed this.
brick_risk: true
