license_notes: >-
  LICENSING.md states GPL-3.0-only for the whole tree, with the platform parts carrying the copyright of Leo Kuroshita, genkigenki, zvenson and others as listed there. The Terminus font is SIL OFL 1.1, and the JieLi SDK files the package needs are read from the builder's own checkout and are not in the repository. No M-VAVE firmware image is in the repository.
homepage: https://mammothcheese.github.io/obscuraline/guide.html
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install obscura-1.0.fwsc from the release the way any FM-1 firmware is installed, or from The Firmware Hub. The README gives no recovery steps and says nothing is written beyond the normal firmware install; the platform layer is Dinghy's, which keeps the update path and USB rescue. The FM-1's ROM boot mode applies.
