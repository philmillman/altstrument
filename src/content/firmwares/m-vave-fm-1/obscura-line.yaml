device: m-vave-fm-1
name: Obscura Line
summary: >-
  Railway adventure game for the FM-1 that mixes driving a train around a synthwave loop with sound puzzles, synth jams and rhythm games, with twelve stations and a story in plain text files.
description: >-
  The map shows twelve stations joined by lines. Each station has a puzzle that is solved by ear and by eye, opening with a card that lists its controls, and solving a station restores it and opens the next line. Driving uses one knob for power and brake, with speed limits, a stopping marker and a graded score for the stop, and puzzles give back train parts such as a horn, a whistle and a dimmer, each tied to a button. Once the cab's synth is restored the keys play along, and synth breaks and rhythm games are part of the lines. The story, puzzles and lines are text files in content/ that can be edited and rebuilt. It builds on the Mechanica Obscura game for the FM-1 and Dinghy's platform layer, with the train engine from DENSHA FM1. The repository carries an SMK-37 board layer, but the README and release name only the FM-1.
