device: m-vave-fm-1
name: ObsSynth FM-1
summary: >-
  Four-voice subtractive synth with STD, SUPER, wavetable and granular oscillator engines, two LFOs, delay, reverb and
  chorus, drawn after the ObsSynth desktop instruments, with a WebAssembly simulator of the same code.
description: >-
  Each of two oscillators runs one of four engines: standard waveforms, a seven-saw supersaw, wavetable banks, or granular
  playback of three samples (organ and bell from VCSL, CC0, and a generated voice). A sub oscillator, six noise colours,
  sync and ring modulation feed a 12 or 24 dB filter (low-pass, band-pass, high-pass, notch) and amp, each with its own
  ADSR. Modes are poly (4 voices), mono, legato and unison. Two LFOs have one destination each, and the effects are delay,
  room reverb and stereo chorus. There are 14 factory presets and 16 user slots, and each page draws what it edits, such as
  envelope curves, filter response and live grains. It appears as the USB-MIDI device ObsSynthFM1. The base comes from
  Hortator, itself a Felucca fork, with the drum machine removed; the HAL, update loader and simulator structure are kept.
  The README says 0.1.0 was installed from stock V15 and from another custom firmware on an FM-1 and removed again.
