homepage: https://orianbsilva.github.io/obssynth-fm1/
based_on: m-vave-fm-1/hortator
distribution: browser-installer
requires_stock: V15
install_notes: >-
  The README says the package is also on The Firmware Hub, which installs it from the browser; tools/fm1_install.py works
  from a terminal. The installer resumes an interrupted update, and holding OCT- and OCT+ for 5 seconds enters the chip's
  boot mode (docs/RECOVERY.md). Presets and settings sit in their own flash area, and other firmwares' projects and
  samples may be overwritten, so back them up first. To return to stock, use M-VAVE's M-UPGRADE with the V15 package.
brick_risk: false
