device: m-vave-fm-1
name: OCA-1
summary: >-
  Ocarina firmware for the FM-1 that plays one near-pure note at a time so the console's microphone can hear the song
  notes of the Switch 2 Ocarina of Time, with a twelve-song songbook.
description: >-
  The game's five note buttons are white keys in the middle of the keyboard (D5, F5, A5, B5 and D6) and light up, and
  the other keys play every other note. The songbook shows each of the game's twelve songs as its button sequence, the
  next key to play blinks, PLAY plays the song, and a finished song is named whichever page is open. Four knobs set
  breath, vibrato, glide and tuning up to 50 cents either way. It has MIDI in and out and USB audio both ways, and sends
  its screen for mirroring and the FM-1 Screen Reader. A browser emulator runs the same code. It is built on fm1-base and
  felucca-bsp.
