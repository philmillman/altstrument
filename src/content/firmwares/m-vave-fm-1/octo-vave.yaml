homepage: https://amacias.github.io/octo-vave/
distribution: source-only
install_notes: >-
  Clone or unzip the repository and run python server.py (or start.cmd on Windows), then open
  http://127.0.0.1:8765. It never flashes firmware. Its downloads come only from GitHub release assets and an
  allowed host list that includes M-VAVE's own file servers, which serve the stock FM-1.fwsc and M-UPGRADE.zip
  when you ask for the Official card. The repository itself contains no firmware images. The voice editor and
  effects controls target the stock firmware only. Developed and tested on Windows 11 with Chrome.
brick_risk: false
