device: m-vave-fm-1
name: Octo-Vave
kind: tool
summary: >-
  Local Python and browser app for the FM-1: ranks and downloads community firmware into a checked library, keeps
  patches and a DX7-style voice editor for the stock firmware, and has MIDI tools and guided sound checks.
description: >-
  A small Python server on 127.0.0.1 and a page in Chrome or Edge, with nothing to install beyond Python 3. The
  Firmware page rebuilds a ranking of free firmware with .fwsc releases from the awesome-fm-1 list and a GitHub
  search, tags each card (open or closed source, published checksum, return-to-stock option, installer type),
  downloads files into a local library and compares each SHA-256 with what the project publishes. A card also
  records hands-on validations, an install, a play session and a revert to stock V15, with the tested file's hash.
  The FM-1 Home page has a key bed, effects controls and a DX7-style voice editor, and the Library, Play and MIDI,
  and Sound check pages hold firmware-aware patches, a generic MIDI utility with a monitor, and listening tests.
  It does not flash anything, so each project's own installer or M-UPGRADE does that. It overlaps with this
  catalog as a firmware directory, but also edits and tests the device over MIDI. Note: when asked, it downloads
  M-VAVE's current stock firmware, the M-UPGRADE updater and the FM1 Open releases directly from M-VAVE's own
  servers into the local library; these are not limited to the Apache-licensed V15 image, and the tool itself
  redistributes none of them.
