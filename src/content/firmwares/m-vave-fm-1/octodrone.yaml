install_notes: >-
  Open the project page in Chrome or Edge with the FM-1 on USB and use its Install tab; the .fwsc is built by the
  repository's GitHub workflow, or build it with Docker (./fm1 build). Hold OCT- at power-on for the rescue mode, where
  the page's Rescue tab puts M-VAVE's V15 back from a file you download from M-VAVE.
