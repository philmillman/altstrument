device: m-vave-fm-1
name: OCTODRONE
summary: >-
  Eight-voice drone synth with paired cross-FM, a two-square hyper LFO, total feedback, a cross-feeding modulated
  delay and distortion, modelled on SOMA Laboratory's Lyra-8 and played on the keys as touch sensors.
description: >-
  The eight voices are grouped as four pairs and two quartets, each with its own tune, a triangle-to-square shape,
  slow or fast envelopes, hold and vibrato. Pairs can frequency-modulate their neighbours, a switch closes all four
  pairs into one loop, and total feedback feeds the output back in place of the LFO. The white keys act as the eight
  touch sensors (a black key touches both neighbours), a latch mode holds them, and MIDI notes play the same sensors.
  The effects are two delay lines with crossed feedback that can modulate themselves or follow the LFO, and a
  distortion with spread. Eight factory panels can be saved to flash, and a computer can play audio into the USB input.
  All sound is computed with integers. The README (in French) calls it an independent project with no link to SOMA
  Laboratory or M-VAVE. It is built on konsumer's foma framework, so it uses foma's browser page for the emulator,
  installer and rescue.
