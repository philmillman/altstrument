device: m-vave-fm-1
name: OFFWORLD
summary: >-
  Drone synth for the FM-1 in the style of 1980s sci-fi film scores: detuned saw brass, a long reverb, macro knobs that rest on named sweetspots, a low split, cues and a night-city film on the screen.
description: >-
  One engine with two detuned saws or saw and pulse per voice, a sine sub, a 24 dB filter with its own brass-style envelope, an ensemble chorus, a dark ping-pong delay and an eight-line reverb that rings up to 30 seconds or without end with FREEZE. The four knobs are macros (SWELL, DRIFT, SPACE and RAIN), and turning one slowly stops it on named sweetspots. DRONE keeps notes sounding, EPIC plays root, fifth and octave from one finger, and SPLIT, LOW HOLD and FOLLOW play the right hand in a chosen scale over a low drone. Pressing a key harder opens the filter, swells, adds vibrato or adds power, and GLIDE has poly, mono and legato modes. The screen is a film of eight night-city scenes that light up with the notes, and the WORLD page adds the scenes' own sounds, rain and a 24-minute night story. CUES save a sound and slide between up to eight of them, MEMORY freezes the last three seconds into a cloud, and the voices run on both cores. The README lists a roadmap of more pages, presets and scenes, and has manuals in English and German.
