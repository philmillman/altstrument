device: m-vave-fm-1
name: Ombak
summary: >-
  Gamelan-inspired instrument: you play the core melody on the white keys and a synthesized ensemble weaves around it
  in measured Balinese and Javanese tunings, with gongs, drums, a flute and a meditation mode.
description: >-
  Ten tunings measured from real ensembles and seven starting gamelan are included, plus four user slots. The parts are
  the core, the kotekan in four styles, the reyong, ornaments, kendang and ceng-ceng drums, a suling flute and, from 1.2,
  a selonding iron gamelan, and each can be brought in or out from a black key. Gong forms follow the cycle, a sleep
  timer ends the music, and a MIDI clock, notes and controllers work in both directions. The author calls it inspired by
  gamelan, not a gamelan. It runs on the Penumbra platform and has a browser emulator, a cheat sheet and a prototype.
status: active
authors:
- name: Lunar Eclipse Forge (MadMooneyham)
  url: https://github.com/MadMooneyham
source: https://github.com/MadMooneyham/Ombak
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only, kept from Penumbra, X0X and Felucca. The effects bus is ported from 9W9 (GPL-3.0).
  The Balinese script glyph is from Noto Sans Balinese and the fonts are SIL OFL.
homepage: https://madmooneyham.github.io/Ombak/install/
distribution: browser-installer
install_notes: >-
  Use the web installer in Chrome. The package carries M-VAVE's update loader, so the unit can switch to another
  firmware or to M-VAVE's own. Shaped sounds, loops, user slots and settings carry over from earlier versions. The
  package knows both flash chips used in FM-1s.
brick_risk: false
tags: [ambient, synth-engine, sequencer, scales, fx, reverb, midi, emulator, fork]
