device: m-vave-fm-1
name: OndaDream
summary: >-
  New synth for the FM-1 with 43 presets, animated creatures and a starfield on the screen, and pages for filter, envelope,
  LFO, arpeggio with an AI mode, effects and global settings.
description: >-
  The knobs and keys drive the pages, with colored cards at the bottom showing the four values of the current page. The
  arpeggio page has an AI mode, there are chorus, echo and reverb effects, and idle behavior lights the key LEDs at
  random with fading trails. The sequencer, with four tracks and an 808 drum part, and the SAVE and PLAY buttons are
  announced for a later version. A browser version runs the same code. The README is in Italian. The firmware is a new
  synth on felucca-bsp and an adapted copy of Felucca's web installer. The code is published but all rights are reserved.
status: active
authors:
- name: Teryox77
  url: https://github.com/Teryox77
source: https://github.com/Teryox77/ondadream-fm1
source_status: open
license: proprietary
license_notes: >-
  Licence note: LICENSE says all rights reserved. It lets you install the published firmware on your own FM-1 and make
  music with it, and forbids copying, modifying, redistributing, selling or publishing the code or derivatives without
  written permission. Parts under their own licences are excluded: felucca-bsp and two files adapted from it (MPL-2.0),
  Felucca's web installer (GPL-3.0) and the SIL OFL fonts, with JieLi SDK files (Apache-2.0) fetched at build time.
homepage: https://teryox77.github.io/ondadream-fm1/webapp/installer/
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with a USB data cable, or download the .fwsc from the release page. After
  two failed power-ons in a row the FM-1 enters update mode (UBOOT) by itself, and the installer page can reinstall
  from there or put M-VAVE's firmware back. The licence says to install at your own risk.
brick_risk: true
tags: [synth-engine, arpeggiator, fx, ui, emulator]
versions:
