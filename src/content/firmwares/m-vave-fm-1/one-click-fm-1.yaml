license: GPL-3.0-only
license_notes: >-
  NOTICE.md states GPL-3.0-only for the whole project; the platform layer is Felucca's (Leo Kuroshita, Hügelton
  Instruments). The 5x7 font is public domain. The JieLi SDK files (Apache-2.0) are added at build time and are not in
  the tree. No M-VAVE images are bundled.
homepage: https://orbitator.github.io/oneclick-fm1/
distribution: browser-installer
install_notes: >-
  Never run on an FM-1 by the author, so treat it as untested on hardware. The project's update page installs the
  latest build in Chrome or Edge over USB, and the build is also produced as a GitHub Actions artifact or with
  tools/build.py. The README tells you to have M-VAVE's V15 file ready before flashing and to return with M-VAVE's
  updater or the Felucca installer's Return to official V15. It keeps Felucca's rescue paths (OCT- and OCT+ for five
  seconds, or two crashes after power-on, enter update mode). Its data shares a flash area with Felucca's projects, so
  switching between them loses the other's saved data. Installing is at your own risk.
brick_risk: false
