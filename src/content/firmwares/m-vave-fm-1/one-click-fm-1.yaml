device: m-vave-fm-1
name: ONE CLICK FM-1
summary: >-
  Song generator for the FM-1: one press creates a key, a chord progression and six matching tracks (bass, chords,
  lead, drums, kick, loop) from seven fixed-point engines, with a step editor, recording and a browser companion app.
description: >-
  The on-device version of the author's ONE CLICK SYNTH generator, built on Felucca's platform layer. A press of
  REC held makes a whole song, and the generator page sets density, variation and style, while tools redo only the
  rhythm, notes, oscillator, filter or envelope. The engines are subtractive, acid, three-operator FM, supersaw,
  additive, noise and drums, plus an optional set of six drum voices written from scratch after the Sonic Potions LXR
  architecture; the README says no LXR code is used because its licence forbids commercial use. A kick track and a
  loop track can play eight sample slots that the companion app converts to 22 kHz mono and writes over USB, about
  11 seconds in total. There is a step editor, Euclid patterns, step and live recording with undo, 16 sounds and 4
  songs in flash, MIDI in and a browser emulator that runs the same code. The README is in German. It says the
  firmware is version 0.2, tested on a computer and in the emulator, and has never run on an FM-1, so how fast the
  engines run on the unit is unknown.
