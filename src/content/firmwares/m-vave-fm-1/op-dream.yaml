device: m-vave-fm-1
name: OP dream
summary: >-
  Skiff fork for the FM-1 that records what you play onto a six-track tape without a step grid, adds a two-wave sound designer on EDIT, and reworks the save pages, the FX list and the themes.
description: >-
  Built on Skiff 2.6 and so on Felucca, and described by its README as an OP-1-style way of working. HOME shows a tape: what is played is kept as played, with its timing, chords and note lengths, on six tracks that run one after another or are layered. Holding PLAY loops, holding REC clears the selected track and holding SAVE takes that back. EDIT opens a sound designer with two waves, each picked from a family of shapes and morphed with one knob, plus a sub, noise and a filter, and every screen says in words what the knob does. SAVE has three pages for the whole project, one sound and the list of sounds, FX opens on a list of the track's effects, and five themes are new. The sequencer, sounds, effects, arpeggiator and songs are Skiff's. To make room, the FM-1 build drops the SLICE sound type and some Skiff pages, keeps the tapes in the slot Skiff uses for its third user sample set, and Skiff's editor does not know the designer's WAVE type. The README says its changes were written with an AI assistant and marked in the sources. It has its own package identity, FM-1_673.
