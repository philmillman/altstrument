license: GPL-3.0-only
license_notes: >-
  The README and LICENSE state GPL-3.0-only, as Skiff and Felucca. LICENSING.md lists what else the firmware carries, including bundled fonts, ported DSP code and the CC0 samples and Hügelton Sample Pack kept from Skiff.
homepage: https://bertrandhustle2.github.io/skiff/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, or the .fwsc from the release with any FM-1 installer. The firmware keeps Felucca's update loader, so any FM-1 installer can put another firmware over it, and holding OCT- and OCT+ for five seconds enters update mode. The release notes record an install on a real FM-1 from official V15, then Skiff, and back.
brick_risk: false
