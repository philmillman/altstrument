license: GPL-3.0-only
license_notes: >-
  New integration code is GPL-3.0-only (LICENSE, THIRD_PARTY_NOTICES.md). The DSP derives from OpenIFW, which is
  MIT. The six factory programs in vendor/openifw/presets are credited to STUDIO-R and explicitly not relicensed
  under MIT or GPL. Dinghy, Felucca, Ghoulbox and the SLOOP changes are GPL-3.0-only, fonts are SIL OFL 1.1, and
  the AC79 SDK boot files in each package are Apache-2.0. Compiled .fwsc builds are committed in firmware-bin/.
homepage: https://rcell233.github.io/OpenIFW-fm1/
distribution: browser-installer
install_notes: >-
  Browser installer in desktop Chrome or Edge over USB, which checks the firmware's SHA-256, the package CRC and
  the device model before writing and can resume an interrupted update. Back up your music first. If the
  screen shows the OPENIFW FM1 USB RESCUE page, the installer page can reinstall the current build or the 0.4.4
  and 0.4.1 recovery packages. Holding OCT- at power-on enters the USB rescue.
