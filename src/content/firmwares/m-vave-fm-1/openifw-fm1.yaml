device: m-vave-fm-1
name: OpenIFW-fm1
summary: >-
  Port of OpenIFW, a browser wind synthesizer modelled on IFW, to the FM-1 as a monophonic synth with four
  oscillators, modulation matrix, filters and effects. Experimental release candidate, not yet accepted on hardware.
description: >-
  Rights warning: the six factory programs come from rcell233's OpenIFW, and the repository says their names and
  parameter values belong to STUDIO-R, the author of IFW, and are not relicensed under MIT or GPL. The synth
  has four oscillators at twice the internal sample rate with sine, triangle, saw and pulse-width shapes, noise, sync and FM,
  four envelopes, an eight-slot modulation matrix, two filters, two LFOs and a chain of effects. It is
  monophonic with last-note priority, takes breath, vibrato, glide and sustain over USB MIDI CCs, and holds
  three user programs. DSP was ported to fixed-point C, and the same C code runs in the browser demo. The window
  layout and user-slot operations follow Ghoulbox, and the platform is Dinghy and Felucca. The README is in Chinese,
  says the author had no FM-1 in the development environment, and reports from device feedback that 0.4.5 had
  serious problems and that 0.4.6-rc1 had distortion. The latest candidate, 0.4.7-rc11, restyles the screen after SLOOP with a Terminus Bold font, four parameter colours and eight colour themes, and is described as checked on the host and against a model rather than accepted on a device; earlier 0.4.7 candidates were withdrawn.
