device: m-vave-fm-1
name: OpenLive FM-1
summary: >-
  Live-first groovebox firmware for the FM-1: four synth or drum tracks with their own loops, a CAPTURE button that turns
  what was just played into a loop, undo, scenes with a morph knob, hold-to-play effects and a Creative Engine.
description: >-
  Each of the four tracks has its own loop length for polymeter, with a sample-accurate clock, swing and MIDI clock in
  and out. CAPTURE turns the last phrase played into a loop in time, even with the transport stopped, and eight steps
  of undo and redo cover takes, captures and creative changes. The Creative Engine mutates, humanizes, fills,
  simplifies, rotates, reverses, transposes, expands, contracts and adds chance, ratchets or Euclidean patterns to a
  loop. Eight scenes store every sound and mute and one knob morphs between two of them. Stutter, filter, delay throw and
  drive effects last while a key is held. The sound is a virtual analog engine with 17 presets and a synthesised
  808-style drum engine. A CONTROL MAP menu assigns knobs to levels, macros, effects, tempo or a MIDI CC. USB MIDI,
  a controller mode with the local sound off and USB audio are included. The code is a portable C99 synth core with a
  browser emulator and a desktop app for Windows, Linux and macOS, built on fm1-base and felucca-bsp. The
  repository was split on 17 November 2026 from a single OpenLiveSynth repository that also built SMK-37 packages; the
  SMK-37 build now has its own entry. The README says it is not affiliated with M-VAVE. Every release is marked as a
  pre-release for testing.
status: active
