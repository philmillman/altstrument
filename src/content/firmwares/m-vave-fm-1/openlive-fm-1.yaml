license: MIT
license_notes: >-
  The LICENSE file is the MIT text. docs/_EN/09-licences.md says the firmware also contains fm1-base and felucca-bsp
  files (MPL-2.0) and uses three JieLi SDK files (Apache-2.0) that are downloaded at build time and not committed. The
  committed targets/smk37 folder is GPL-3.0-only with a linking exception.
homepage: https://tom-rfid.github.io/OpenLive_FM-1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Use the project's browser installer in Chrome or Edge, or download the zip from a release and run FLASH-FM1.bat on
  Windows, or run fm1_install.py with the .fwsc. The browser installer can also write m-bootloader after the firmware,
  as an unticked option. The docs say to back up presets and projects first and to go back to M-VAVE's firmware with
  the Felucca web installer. The README says the V0.2 build was run on a real FM-1.
brick_risk: false
