device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: OpenVALive CORE
kind: tool
summary: Portable C99 synth core behind the OpenVALive FM-1 and SMK-37 firmwares, with a virtual analog engine, a drum engine, a modulation matrix and a Live Core for loops, capture and scenes. Also runs on a desktop.
description: >-
  The library holds the DSP blocks (oscillators, filter, envelopes, LFOs, delay, chorus and phaser), a virtual analog
  engine, a drum engine with five synthesised kits and a General MIDI note map, 29 sounds in seven families, a
  modulation matrix with four slots per sound and tempo-locked LFOs, and the Live Core with its clock, tracks,
  recording, capture, loop editing, undo, scenes, morph, Creative Engine, projects and MIDI. It uses no malloc and no
  C library on the device. The shared app layer with the instrument's screen and controls, a simple C API, a desktop
  app played from a computer keyboard or MIDI keyboard, a PC simulator and Daisy and Teensy templates are included.
  OpenVALive FM-1 and OpenVALive SMK-37 include it as their va/ git submodule. The documentation has a guide to
  writing an engine and a forking guide, in English and French. The project was called OpenLive VirtualAnalog until
  19 November 2026. The README says it is not a flashable image on its own.
status: active
authors:
  - name: Tom-Rfid
    url: https://github.com/Tom-Rfid
source: https://github.com/Tom-Rfid/OpenVALive_CORE
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text. The licence page lists the firmware repositories' other components separately:
  fm1-base and felucca-bsp (MPL-2.0), three JieLi SDK files (Apache-2.0) fetched at build time, and miniaudio (public
  domain or MIT-0, vendored for the desktop app). The sister SMK-37 repository is GPL-3.0.
distribution: source-only
install_notes: >-
  A library, not a flashable image. make builds an engine simulator and make demo renders a WAV file, and make
  desktop builds a desktop app for playing the instrument. The firmwares that use it are OpenVALive FM-1 and
  OpenVALive SMK-37, which carry their own installers.
brick_risk: false
