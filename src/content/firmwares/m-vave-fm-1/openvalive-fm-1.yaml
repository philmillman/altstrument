source: https://github.com/Tom-Rfid/OpenVALive_FM-1
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text. The CORE repository's licence page says the firmware also contains fm1-base and
  felucca-bsp files (MPL-2.0) and three JieLi SDK files (Apache-2.0) that are downloaded at build time and not
  committed.
homepage: https://tom-rfid.github.io/OpenVALive_FM-1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Use the project's browser installer in Chrome or Edge, or download the zip from a release and run FLASH-FM1.bat on
  Windows, or run fm1_install.py with the .fwsc. The browser installer can also write m-bootloader after the firmware,
  as an unticked option. The docs say to back up presets and projects first and to go back to M-VAVE's firmware with
  the Felucca web installer. For a unit that no longer starts, the README points to the author's jieli-usbkey-unbrick
  scripts, which open the chip's factory loader from a Raspberry Pi over the USB cable without opening the case.
brick_risk: false
tags: [groovebox, looper, sequencer, drums, synth-engine, performance, generative, emulator, controller-mode, usb-midi, usb-audio]
