device: m-vave-fm-1
name: OpenVALive FM-1
summary: >-
  Live-first groovebox firmware for the FM-1: four synth or drum tracks with their own loops, a CAPTURE button that turns
  what was just played into a loop, loop editing, undo, scenes with a morph knob, hold-to-play effects and a Creative Engine.
description: >-
  Each of the four tracks has its own loop length for polymeter, with a sample-accurate clock, swing and MIDI clock in
  and out. CAPTURE turns the last phrase played into a loop in time, even with the transport stopped, LOOP EDIT
  changes it note by note, and eight steps of undo and redo cover takes, captures, edits and creative changes. The
  Creative Engine mutates, humanizes, fills, simplifies, rotates, reverses and adds Euclidean patterns to a loop, and
  shows the amount before it is applied. Eight scenes store every sound and mute and one knob morphs between two of
  them. Stutter, filter, delay throw and drive effects last while a key is held. The sound is a virtual analog engine
  and a synthesised drum engine, with 29 presets in seven families including five drum kits, and the drum keys follow
  either the original tom layout or the General MIDI map. A CONTROL MAP menu assigns the knobs, and a SOUND EDIT page
  reaches every parameter, the modulation matrix and tempo-locked LFOs. MIDI comes in over USB and TRS and goes out over
  USB, with a controller mode and USB audio. The synth itself lives in the OpenVALive CORE repository (listed
  separately) and the target is built on fm1-base and felucca-bsp; a browser emulator runs the whole firmware. The
  project was called OpenLive until 19 November 2026, when it moved to new repositories and its release numbers
  restarted at 0.0.3. The README says it is not affiliated with M-VAVE.
status: active
