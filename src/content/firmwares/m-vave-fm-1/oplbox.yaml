device: m-vave-fm-1
name: OPLBOX
summary: >-
  Turns the FM-1 into an AdLib: OPL2 emulation playing 18 built-in SoundFX Macs Opera songs, with a tracker, scope
  screen and editor that save .CMF files to flash.
description: >-
  Rights warning: the 18 built-in songs are game soundtracks by Thomas Detert (Stone Age, Eclipse, 1992) and Michael
  Tschögl (LINEL, 1990 to 1992), kept in songs.h as game data and still under the composers' and publishers'
  copyright.


  The firmware emulates one OPL2 chip with DOSBox's dbopl core reduced to integer maths and plays the songs through
  a player that follows the SoundFX Macs Opera driver, checked register for register against DOSBox captures. Screens
  show a jukebox, a scrolling tracker, and a scope with one trace per channel, whose first nine white keys mute
  channels. Edit mode adds an order-list screen and an instrument screen, and nine flash slots hold songs as plain .CMF
  files. Getting slot files over USB is not yet implemented. It is built on Dinghy, Felucca and SLOOP, and the author
  reports 0.2 and 0.3 running at about 20 percent CPU on a real FM-1.
status: active
authors:
- name: LXXero
  url: https://github.com/LXXero
source: https://github.com/LXXero/oplbox
source_status: open
license: GPL-3.0-only
license_notes: >-
  Platform code is Dinghy, Felucca and SLOOP (GPL-3.0-only). The OPL core is derived from DOSBox (GPL-2.0-or-later),
  the Macs Opera player follows AdPlug (LGPL-2.1), and an optional Nuked-OPL3 core is LGPL-2.1. The 18 songs are not
  under the GPL and stay the composers' and publishers' copyright (LICENSING.md). The logo is all rights reserved
  by its maker.
homepage: https://github.com/LXXero/oplbox
distribution: download
install_notes: >-
  Download the .fwsc from the releases page and install it with fm1_install.py (needs mido and python-rtmidi) or the
  FM-1 Firmware Hub, from stock V14 or V15 or any firmware that has the update path. Holding OCT- before switching on
  opens a USB rescue, and a firmware that crashes twice at boot goes there by itself. Return to stock through the hub or
  M-VAVE's updater; the package identity is FM-1_96 plus the minor version.
brick_risk: false
tags: [tracker, chiptune, sequencer, synth-engine, emulator, editor]
