device: m-vave-fm-1
name: OPQuencer
summary: >-
  Felucca 1.5.1 fork that adds USB MIDI out for the sequencer, arpeggiator and ratchets with a channel per track, and
  controlled chance on pitch and ratchets, aimed at driving Eurorack through a MIDI-CV converter.
description: >-
  Merges Felucca's engines and sequencer with ideas from SLOOP's MIDI out. MENU > MIDI > MIDI OUT chooses between live keys
  and the sequencer, whose notes go out at their step velocity, with ratchets and the arpeggiator retriggering; the four track TX
  channels are FOLLOW, a fixed channel or off. SEQ > CHANCE adds pitch variation probability and range and
  ratchet probability with equal, push or drag feel, per track and lockable per step. Projects, presets, backups and the web editor
  carry over from Felucca 1.5.1, though projects saved here show the new parameters as empty on older firmware. The package
  keeps Felucca's identity. The README's roadmap names OP-style tape sections and more Eloquencer-style
  features as future work.
