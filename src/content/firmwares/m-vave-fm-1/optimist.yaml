device: m-vave-fm-1
name: Optimist
summary: >-
  Modular firmware platform derived from SLOOP, Felucca, Melodee and X0X: choose engines, kits, effects
  and sequencer features in a builder that shows the flash and RAM budget, then build your own image.
description: >-
  Marked work in progress with very limited hardware testing: it has run on one real FM-1 since 2026-10-09.
  SLOOP's interface ships today; its own interface is in progress. Compatible with SLOOP 2.4 projects
  and its web editor. The fm1-editor.com directory lists it on its watch list.
status: active
authors:
- name: w0ts
  url: https://github.com/w0ts
source: https://github.com/w0ts/optimist
source_status: open
license: GPL-3.0-only
distribution: browser-installer
install_notes: >-
  The Install tab of the project's web app (Chrome or Edge, USB) installs a release flavour, a cloud build or a
  .fwsc file, offers a backup first and can put V15 back from a file you supply. The releases page carries the
  ready-made .fwsc files; you can also build with make builder (CLI or Docker toolchain). The README lists the
  recovery paths and their limits.
brick_risk: false
tags: [platform, sdk, synth-engine, sequencer, editor]
image:
  url: https://raw.githubusercontent.com/w0ts/optimist/main/assets/screens/editor-mixer.webp
  alt: "Optimist web editor mixer with channel strips for the analog, digital and lofi tracks and the drum lanes, each with pan and send knobs, a fader and a sequence strip"
  credit: "w0ts"
  source_url: https://github.com/w0ts/optimist
  first_party: true
versions:
- version: '0.3'
  date: 2026-11-10
  url: https://github.com/w0ts/optimist/releases/tag/v0.3
  notes: Adds Ableton Link and SD card support, a USB device or host mode setting and trims the page layout for engines and drum sends. A new memory layout erases the projects stored in flash, so the release asks for a web editor backup first.
- version: '0.2'
  date: 2026-10-25
  url: https://github.com/w0ts/optimist/releases/tag/v0.2
  notes: Adds Bluetooth audio and Bluetooth MIDI and ten new synth engines, 26 in all; no single flavour holds everything, so the web builder is the way to combine them.
- version: '0.1'
  date: 2026-10-18
  url: https://github.com/w0ts/optimist/releases/tag/v0.1
  notes: First release, with six ready-made firmware flavours and a matching web editor package for each.
