distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, one for OPX and one for OPX Solo, or the opx-X.Y.Z.fwsc or opx-solo-X.Y.Z.fwsc
  from the release. Projects, user presets, samples, settings
  and MIDI learn assignments are kept. The installer's Return to official V15 goes back to M-VAVE's firmware, and
  the README says installing is at your own risk. The default branch is opx-engine.
