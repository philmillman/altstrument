device: m-vave-fm-1
name: OPX
summary: >-
  Felucca 1.5.1 fork (formerly Felucca-OPX) that adds the OPX engine, a six-operator altered-FM engine after the Korg opsix with 40 algorithms, a user matrix and 23 waveforms, plus OPX Solo, a one-part build with all 30 effects and 126 patches.
description: >-
  OPX plays up to six voices, each with six operators that have their own mode, waveform, ratio or fixed pitch, level,
  envelope and key tracking. The algorithms are the DX7's 32 plus the opsix's eight, and a USER 6 by 6 matrix sets
  how much each operator modulates each other one. A patch also carries the opsix's extra envelopes and LFOs, a
  filter, effects and a voice section (program level, bend range, glide, unison). Macros on the edit pages are
  reachable from automation, step locks and MIDI CC. The release publishes two firmwares. OPX keeps Felucca's four
  parts, plays the 13 effect types that need no buffer and ships eight factory patches. OPX Solo has one OPX part on
  track 1, plays all 30 effect types and ships 126 factory patches in categories. The opsix's arpeggiator and
  sequencer are not implemented, and Felucca's own are used. User sample slot 3 is halved to 40 KB, and a project
  with an OPX track opens only on this firmware. The project has web installers, an editor and a browser emulator.
  The README says the project was renamed from Felucca-OPX to OPX; the repository keeps its old name.
