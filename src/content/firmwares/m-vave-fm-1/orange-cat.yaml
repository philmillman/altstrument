device: m-vave-fm-1
name: Orange Cat
summary: >-
  Melodee 1.4.5 fork that swaps Melodee's engines for Plaits and Braids ports and replaces its sequencer with a
  tracker: shared phrase pool, chains, a song grid, and takes frozen to an SD card.
description: >-
  Rights warning: the repository still bundles the 64 Casio CZ-1 factory tones and the 200 Sequential
  Prophet-5/10 factory programs as sound data, as Melodee does; its licensing file says the rights stay with Casio
  and Sequential and that no licence is granted. Orange Cat takes Skiff's pattern-pool arrangement and works it
  like the M8 and LSDJ: 64 shared phrases of up to 64 steps, 16-slot chains with repeat counts, and a 64-row
  song with a chain per track. A tracker page edits a phrase as rows with four note columns, velocity and
  per-step effects (ratchet, chance, condition, nudge, slide, accent), and a performance page handles scenes and
  staged mutes. Melodee's engines were removed in stages and replaced by MACRO, fourteen models ported from
  Plaits, and SHAPES, the 47 shapes of Braids. The FM-1 reads WAV files from a USB card reader or hub on
  powered USB, so a track can be frozen to a stereo take on the card and played back from a phrase. The spec
  and build documents call the project early. Release 1, version 0.15.0, is its first GitHub release; effects
  and further engines are still listed as in progress. Melodee's own README still follows Orange Cat's in
  the repository.
status: active
authors:
