device: m-vave-fm-1
name: ORBIT DRIFT
summary: >-
  Polymetric FM synth and FM drum machine on one clock, sharing a twin delay and a reverb, with a morph pad, song chain,
  MIDI in and a mix page, built from the author's ORBITAL, Scenedrift and FM-16 firmwares.
description: >-
  The synth side has eight polymetric lanes of FM voices with a contour filter, per-step locks and trig conditions, and
  the drum side has five FM tracks with pitch sweeps and mod envelopes. An XY puck morphs between four stored sounds,
  and its path can be recorded and played back. Other features are a song chain of banks, snapshots, a transpose
  sequence, a four-tap echo field, unison, an LFO, a step modulator, held notes from the keys, MIDI note input, undo and
  a MIX page with meters and a limiter light. The README says it takes ideas from three HTML toys (ORBITAL, Scenedrift
  and FM-16) and adds fractional ratios and noise types from Fors FMS. It is built with the foma framework and ships a
  browser emulator and installer page.
