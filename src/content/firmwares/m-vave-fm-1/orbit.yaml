device: m-vave-fm-1
name: ORBIT
summary: >-
  OP-1-inspired groovebox firmware based on SLOOP: synth, drum and mixer screens, per-track inserts, sample
  tools, an event tape for rearranging what the four tracks play, and its own engines beside a 6-op FM.
description: >-
  Started from a SLOOP v2.3 snapshot rather than a fork, with later SLOOP changes merged in. Releases
  carry only the firmware file, installed with a script from the source; there is no browser installer.
  From 0.9.0 a MIDI controller mode turns the panel into a MIDI controller (a tap of OCT- and OCT+ toggles it from 0.10), and 0.9.B and 0.10.B are separate
  packages with Bluetooth MIDI that swap the melodic samples for FM voices. From 0.10 ORBIT can send MIDI clock. Extracted OP-1 tables and factory data are noted separately in LICENSING.md. From 0.8.0 the source tree also
  builds for the SMK-37 Pro, SMK-37 Elite and MKE-P37; the published binaries are for the FM-1 only.
status: active
authors:
- name: dspaudio
  url: https://github.com/dspaudio
source: https://github.com/dspaudio/orbit
source_status: open
license: GPL-3.0-only
license_notes: >-
