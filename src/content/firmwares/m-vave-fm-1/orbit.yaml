versions:
- version: 0.10.B
  date: 2026-10-31
  url: https://github.com/dspaudio/orbit/releases/tag/v0.10.B
  notes: The Bluetooth MIDI package, orbit-ble.fwsc, with all of 0.10.0 and MIDI clock and START/STOP also sent over Bluetooth. Bluetooth now starts on FM-1s whose radio calibration other firmware had erased, using the stock record, a copy ORBIT kept or built-in recovery values; the release says the recovery values are untested on such a unit.
- version: 0.10.0
  date: 2026-10-31
  url: https://github.com/dspaudio/orbit/releases/tag/v0.10.0
  notes: Adds MIDI clock out (GLO > SYSTEM > SYNC = OUT, with START and STOP over USB MIDI), silent hit editing on the drum GRID page with black-key recording, and a tap of OCT- and OCT+ together to toggle controller mode. Projects and USER banks are unchanged. The release says development builds were installed on an FM-1 and that clock jitter was not measured.
- version: 0.9.B
  date: 2026-10-30
  url: https://github.com/dspaudio/orbit/releases/tag/v0.9.B
  notes: A separate package, orbit-ble.fwsc, with Bluetooth MIDI that is off until MENU > SYSTEM > BLUETOOTH turns it on. To make room it replaces the melodic built-in samples with light FM voices and halves the delay line. Bluetooth pairing and external clock sync were confirmed on an FM-1; radio latency and worst-case audio load were not measured.
- version: 0.9.0
  date: 2026-10-30
  url: https://github.com/dspaudio/orbit/releases/tag/v0.9.0
  notes: Adds a MIDI controller mode (hold ENV and LFO for 2 seconds) that sends the keys and knobs as MIDI, plus fixes ported from SLOOP 2.8.4. The release says it was installed on an FM-1.
- version: 0.8.2
  date: 2026-10-29
  url: https://github.com/dspaudio/orbit/releases/tag/v0.8.2
  notes: Adds a stereo delay type (mono, wide or ping-pong), frees about 19 KB of static RAM and removes the full-screen visualizer; project and preset formats are unchanged. The release says it was installed on an FM-1.
- version: 0.8.1
  date: 2026-10-28
  url: https://github.com/dspaudio/orbit/releases/tag/v0.8.1
  notes: Fixes ported from SLOOP 2.8 for sample retriggers, drum voice stealing, held notes against the sequencer, lost MIDI notes after an input overflow and tempo readings under external clock; formats are unchanged. The release says it was installed on an FM-1.
- version: 0.8.0
  date: 2026-10-27
  url: https://github.com/dspaudio/orbit/releases/tag/v0.8.0
  notes: Adds resonance and a band-pass mode to the track filter, removes the built-in demo song loader and merges the SMK-37 board port into the source; project and USER bank formats change, so back up before updating.
- version: 0.7.1
  date: 2026-10-15
  url: https://github.com/dspaudio/orbit/releases/tag/v0.7.1
  notes: Drum grid shows sixteen instrument rows by sixteen steps, and sound knobs write parameter locks while recording.
- version: 0.7.0
  date: 2026-10-12
  url: https://github.com/dspaudio/orbit/releases/tag/v0.7.0
