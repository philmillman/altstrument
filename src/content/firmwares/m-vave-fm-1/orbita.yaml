based_on: m-vave-fm-1/felucca
community:
- label: Polaris Sound Lab on YouTube
  url: https://www.youtube.com/@PolarisSoundLab
distribution: browser-installer
requires_stock: Any FM-1 firmware; the firmware installer writes the package over it
install_notes: >-
  Open the firmware installer at https://drophlex.github.io/ORBITA/firmware/ in Chrome or Edge with the FM-1 on USB and press Install; the release carries the package as ORBITA-FM1.fwsc. The README says the installer saves a backup and can return the FM-1 to the official firmware, which is the documented recovery. The voices-only installer at https://drophlex.github.io/ORBITA/fm1/ writes only voice data.
