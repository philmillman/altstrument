device: m-vave-fm-1
name: ÓRBITA
summary: >-
  Generative FM instrument: FM voices play euclidean rhythms over a scale while a phase plot draws each voice as an orbit. FM-1 firmware in beta, plus a voices-only installer, a browser version and a Mac plug-in.
description: >-
  ÓRBITA 1 has three FM voices, a sub bass, a prism and a crystal, that play euclidean rhythms over a chosen scale, and each voice is drawn as an orbit on a phase plane. Density sets how many hits fall in 16 steps, phase where they fall and FM ratio moves the sound from warm to metallic. The FM-1 firmware plays the four scenes with the phase plane on the screen, using the browser app's patterns note for note and its own three voices; PLAY starts it, PRESETS and OCT change scene, knobs 1 to 4 set density, phase, FM ratio and scale, and EDIT switches between English and Spanish. A separate voices-only installer writes 32 DX7-format voices into an FM-1 running the official firmware, ANDROMEDA, Dark Funk Durcal or Felucca, and can remove them again. The repository also holds ÓRBITA 2, a browser app and Mac plug-in in VST3, AU and app form with a fourth voice (a halo), a GRAVITY knob that glides between scenes, an EVOLVE mode and a time machine that keeps every change, none of which the FM-1 firmware has. It also holds the source of a module for fm1-dock, and illustrated manuals in English and Spanish. The README says the firmware was tested on a computer but not yet on a physical FM-1.
