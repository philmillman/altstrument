source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and the README says GPL-3.0, with JUCE keeping its own terms. The FM-1 firmware tree under firmware/firmware-src carries Felucca's licensing (GPL-3.0-only overall, with its engines, board layer and ported DSP under their own licences), so the firmware is GPL-3.0-only. The tree commits .syx voice files and two small zip packages of the installers.
