device: m-vave-fm-1
name: ORBITAL
summary: >-
  Poly-rhythmic FM sequencer with eight lanes, one per scale degree, each looping at its own length of 2 to 24 steps
  against one clock, with 2-op or 4-op voices, a contour filter and a four-tap echo field.
description: >-
  Notes on each lane are FM voices with a feedback shaper and a sweeping contour filter, sent to an echo field whose
  taps are panned alternately left and right. Tapping a step cycles its note length, and holding a step locks pitch,
  velocity, FM index offset and send. Because the FM-1 has sixteen white keys, steps 17 to 24 are reached through the
  octave keys. The README says polyphony is up to 12 notes, lowered to 10, 8 or 6 by a CPU meter when the chip runs
  short. Random, clear and init actions work per lane or across all lanes, and MIDI clock sync is on the global page.
  It is built with the foma framework and ships a browser emulator and installer page.
