install_notes: >-
  Build with build.sh and JieLi's toolchain, then install build/orbitrix.fwsc over USB-MIDI with tools/fm1_install.py, or use the installer on the project page in
  Chrome or Edge. The README documents a USB rescue reached by holding OCT- while switching on, and any firmware from The Firmware Hub can be installed over it.
