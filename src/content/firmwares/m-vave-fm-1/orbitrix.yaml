device: m-vave-fm-1
name: ORBITRIX
summary: >-
  Orbital groove engine in which four rings of steps circle a sun at small ratios, so a polyrhythm is also a chord, with a Kepler-orbit voice, just-intonation tunings and 13 systems.
description: >-
  The voice is a planet on an elliptical orbit, solved from Kepler's equation by table, with moons, precession, noise and a
  pitch fall. Four rings carry steps at ratios such as 1:1, 5:4, 3:2 and 7:4, and the same ratios set the pitches above a
  movable root, in just, otonal, utonal, pentatonic or equal tunings. Further stages cover mutual phase modulation
  between voices, a merger-style chirp, a pulsar beam and a black-hole effect that redshifts and freezes the sound, plus
  macros, an orbit pad, a filter map, delay and a power-on story scored by the engine. It is built on Dinghy 0.5 and also
  builds for the SMK-37 with BOARD=smk37. The README says it is in development, not yet tested on a real FM-1, and has no
  release; a project page runs the same C in the browser and carries a web installer.
