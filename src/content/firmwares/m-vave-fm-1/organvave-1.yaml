  notes: No tagged releases; this is the latest commit, labelled v0.9.59. Commits since the previous row (v0.9.45) run the vibrato selector from V1 to C3 on K3, make LFO switch only the UP tab, enlarge the DRAWBAR PRESET pop-up, redraw HOME with wood-picture frames and drawbar heads on HOME 2, and make EDIT open only ADVANCED EDIT. The organvave-37 branch, which publishes SMK-37 Pro, Elite and MKE-P37 packages beside the FM-1 build, merged this main on 14 November. Since v0.9.40 the drive gains four types (soft tube, mid drive, hard clip and a tight tube stage modelled on a 12AX7), their gain is raised, its tone control becomes treble, middle and bass, and the CPU meter is removed from the HOME screen.
