device: m-vave-fm-1
name: OrganVave-1
summary: >-
  Tonewheel organ with nine drawbars, percussion, scanner vibrato, a rotary speaker, drive, effects and a
  lower manual and pedals over MIDI, ported from setBfree to integer C for the FM-1.
description: >-
  A fork of FMini-1, itself a fork of Felucca, that drops Felucca's other engines. The tone generator, key
  click, crosstalk, percussion, scanner and Leslie model come from setBfree and are rewritten in integer
  C. It offers 16 factory patches, upper, lower and pedal drawbar pages, two rotary models, reverb, delay, a
  three-band equaliser, an advanced page with setBfree's own tone-generator settings, split keyboard, and MIDI
  CC control with MIDI Learn. The project site has an installer, a patch editor and a browser emulator, with
  text in English and Portuguese. The README says nothing has been tested on a real FM-1 and warns against
  installing it without a way to recover the unit. The author says it was developed with Claude.
status: active
authors:
- name: Guilherme Ruppert (ruppert)
  url: https://github.com/ruppert
source: https://github.com/ruppert/organvave-1
