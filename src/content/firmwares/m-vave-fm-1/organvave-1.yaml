device: m-vave-fm-1
name: OrganVave-1
summary: >-
  Tonewheel organ with nine drawbars, percussion, scanner vibrato, a rotary speaker, drive, effects and a
  lower manual and pedals over MIDI, ported from setBfree to integer C for the FM-1.
description: >-
  A fork of FMini-1, itself a fork of Felucca, that drops Felucca's other engines. The tone generator, key
  click, crosstalk, percussion, scanner and Leslie model come from setBfree and are rewritten in integer
  C. It offers 16 factory patches, upper, lower and pedal drawbar pages, two rotary models, reverb, delay, a
  three-band equaliser, an advanced page with setBfree's own tone-generator settings, split keyboard, and MIDI
  CC control with MIDI Learn. The project site has an installer, a patch editor and a browser emulator, with
  text in English and Portuguese. A beta SMK-37 port builds from the same source (SMK37.md on the organvave-37
  branch): the keys, pads, faders and wheels are mapped to the organ, and the project site offers packages for the
  SMK-37 Pro, SMK-37 Elite and MKE-P37 at the same version as the FM-1 build. The board layer was verified on an
  SMK-37 Pro by its author; the organ's mapping has only been tested on the host. The README says nothing has been tested on a real FM-1 and warns against
  installing it without a way to recover the unit. The author says it was developed with Claude.
status: active
authors:
- name: Guilherme Ruppert (ruppert)
  url: https://github.com/ruppert
source: https://github.com/ruppert/organvave-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README, inherited from Felucca. The setBfree-derived files (GPL-2.0-or-later) keep their
  copyright notices (CREDITS.md); the MIT Felucca-Engines submodule and other bundled parts keep their own
  licences (LICENSES/).
homepage: https://ruppert.github.io/organvave-1/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, or the .fwsc package it offers. BUILDING.md
  explains recovery; the README advises against installing unless you know how to recover an FM-1. SMK-37: the
  project site's smk.html page installs the package for the connected model (organvave-1-smk37-v0.9.45.fwsc for the
  Pro, -elite- and -mke- for the others). The page warns that the keyboard's flash holds calibration and a key that
  cannot be downloaded again, advises a full flash backup first and says the firmware never writes those areas.
brick_risk: false
tags: [synth-engine, fork, editor, emulator, fx]
