  date: 2026-11-10
  url: https://github.com/ruppert/organvave-1/commit/d251b579019636bec116a93a0526bfb492110350
  notes: No tagged releases; this is the latest commit, a workflow change that publishes an SMK-37 installer from the organvave-37 branch, which now offers v0.9.45 packages for the SMK-37 Pro, Elite and MKE-P37 beside the FM-1 build; the firmware is still labelled v0.9.45. Since v0.9.40 the drive gains four types (soft tube, mid drive, hard clip and a tight tube stage modelled on a 12AX7), their gain is raised, its tone control becomes treble, middle and bass, and the CPU meter is removed from the HOME screen.
