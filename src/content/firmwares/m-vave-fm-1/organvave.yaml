  notes: No tagged releases; this is the latest commit (v0.11.1), which drops the ON/OFF rows for the drive and the equaliser (the drive is on above GAIN 0 and the equaliser when a band is off 0 dB) and widens the factory bank to 64 presets, 17 of them written. Since v0.9.80 the 0.11.0 work allows floating point in the firmware and moves parts of the engine to single precision, reworks the Leslie, adds a BENCHMARK page under GLOBAL, renames the drive types (MID DRIVE becomes SCREAMER, ORIGINAL becomes EXTREME) and changes the TUBE DRIVE gain law. v0.9.80 had made DRAWBAR PRESET MODE light the keys that have a function, weak for available and strong for the one that is on. The commit before it makes the browser emulator rebuild the organ's crosstalk, click, percussion and scanner tables as the device does (v0.9.79). Since v0.9.76 it adds a MIDI SETTINGS sub-screen with a MIDI MONITOR, renames ADVANCED EDIT to PRESET SETTINGS and adds a VOLUME row there that shows the preset's level as 0 to 127. Before that, a commit rebuilt the emulator under docs/ for v0.9.76, which gives GLOBAL TUNING, TRANSPOSE, FACTORY RESET and SUPPORT ORGANVAVE rows and lets the GLOBAL and parameter pages show eight rows at once. The extra gamma curve became the default screen setting at v0.9.71. Commits since v0.9.45 add a SCREEN row for the panel colours (normal or vivid) and gamma curves for the device, and run the vibrato selector from V1 to C3 on K3, make LFO switch only the UP tab, enlarge the DRAWBAR PRESET pop-up, redraw HOME with wood-picture frames and drawbar heads on HOME 2, and make EDIT open only ADVANCED EDIT. The organvave-37 branch, which publishes SMK-37 Pro, Elite and MKE-P37 packages beside the FM-1 build, merged this main on 14 November. Since v0.9.40 the drive gains four types (soft tube, mid drive, hard clip and a tight tube stage modelled on a 12AX7), their gain is raised, its tone control becomes treble, middle and bass, and the CPU meter is removed from the HOME screen.
