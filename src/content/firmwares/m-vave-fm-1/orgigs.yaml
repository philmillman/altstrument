device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: OrGigs
summary: >-
  Organ firmware for the FM-1 and the SMK-37 Elite: three manuals of 84 free-running tone generators, eight organ models,
  drawbars, rotary, drive, delay and reverb, 16 performance setups, three MIDI zones and Yamaha SEQTRAK control.
description: >-
  Built on Dinghy's platform layer, with the sound running in the audio interrupt and per-board code for the panel and screens. There is no voice stealing,
  because every note has its own generator. The eight models run from tonewheel and combo organs to pipe organs and free reeds, with
  drawbar and registration lists, percussion, vibrato and tremulant, a rotary speaker, per-manual drive and sends, and a shared delay
  and reverb. The three MIDI zones route, clone, harmonise in nine channels and remember chords, and a module for a Yamaha SEQTRAK
  follows that device's tracks and sounds over USB. On the FM-1 the panel's buttons and knobs reach the drawbars and effect screens,
  and a browser simulator lets you try it without the unit. The SMK-37 package is built for the Elite and puts drawbars on the knobs
  and faders and shows them on the pads; the source also builds for the Pro and the MKE-P37, but the releases carry only the FM-1 and
  Elite packages. The README says it runs on an FM-1 since 2026-10-23 and on an SMK-37 Elite since 2026-11-05.
status: active
authors:
