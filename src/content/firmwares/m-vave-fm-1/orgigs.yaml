  url: https://github.com/orgelbobo
source: https://github.com/orgelbobo/orgigs
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and the README says GPL-3.0-only, as Dinghy, Felucca and SLOOP. LICENSING.md covers the
  parts that keep their own terms; the SEQTRAK sound names come from jaeggerr/seqtrak-docs (MIT), and the repository holds
  that data file. The repository holds no firmware package; the release carries two.
based_on: m-vave-fm-1/dinghy
homepage: https://orgelbobo.github.io/orgigs/install/
distribution: browser-installer
requires_stock: SMK-37 Elite package installs over M-VAVE V016 or custom firmware
install_notes: >-
  Use the install page in Chrome, Edge or Firefox over USB, which picks the package for the connected unit, or install the
  release's .fwsc with tools/fm1_install.py. On Windows, the first install over the Elite's M-VAVE firmware needs Firefox. The
  README says settings are kept when updating, the way back is M-VAVE's updater or any firmware from the Firmware Hub, and holding
  OCT- at power-on enters USB rescue. On the SMK-37 the calibration, pairing and stock resource areas are never written.
brick_risk: false
