source: https://github.com/brotschuh/ouroloops
source_status: open
license: GPL-3.0-only
license_notes: >-
  The firmware folder keeps fm1-sampler's licence (firmware/LICENSE.md): GPL-3.0 with the FM1 SDK linking exception of M-VAVE's open firmware, whose SDK binaries have their own terms (firmware/THIRD_PARTY.md). The repository's top-level LICENSE is the GPL v3 text. The folder also carries M-VAVE's FM-1 V15 image from the FM1 Open SDK, sdk/firmware/FM-1_015.fwsc (git blob ce49cc15…, 699,956 bytes), the file M-VAVE publishes under Apache-2.0.
based_on: m-vave-fm-1/fm1-sampler
homepage: https://brotschuh.github.io/ouroloops/firmware/
distribution: browser-installer
install_notes: >-
  Open the flash page in Chrome on a computer, connect the FM-1 and use the Device update tab with the backup box ticked, or Force flash when coming from another firmware. The README says M-VAVE's M-UPGRADE puts the original firmware back.
