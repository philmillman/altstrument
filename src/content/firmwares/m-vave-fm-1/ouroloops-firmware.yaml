device: m-vave-fm-1
name: Ouroloops firmware
kind: firmware
summary: >-
  Control-surface build of fm1-sampler that turns the FM-1 into the controller, second screen and audio output of the Ouroloops web looper, with dimmable button lights added.
description: >-
  This is the firmware half of Ouroloops; the browser looper that drives it has its own entry. It is a copy of the control-surface firmware from ferluht's FM1 Sampler, itself built on M-VAVE's open firmware FM1 Open V14, so the FM-1 sends its button, key and knob presses over USB MIDI and shows what the app sends to its screen. The changes are a SysEx command that sets button lights to one of eight dimmed levels, driven by short pulses on each scan tick, and an "HMS OUROLOOPS" splash screen; a renamed source file lets M-VAVE's own build script compile it. A GitHub workflow builds it with JieLi's toolchain and publishes a flash page.
status: active
