license_notes: >-
  The LICENSE file is the GPL v3 text and the README says GPL-3.0, with no "or later" statement. The rock kit is Big Rusty Drums by Karoryfer Samples, CC0 1.0. The firmware folder's licence is covered in the Ouroloops firmware entry.
homepage: https://brotschuh.github.io/ouroloops/
install_notes: >-
  The app writes nothing to the FM-1. Install the Ouroloops firmware first with the project's flash page, then connect the FM-1 to the phone by USB-C and open the app in Chrome on Android or a computer, allowing the microphone and MIDI. The README says M-VAVE's M-UPGRADE puts the original firmware back.
