device: m-vave-fm-1
name: Ouroloops
kind: tool
summary: >-
  Boss-style three-track loop station that runs in a browser on a phone or computer, with the FM-1 as its controller, second screen and audio output through the project's own control-surface firmware.
description: >-
  The web app records from the phone's microphone and does the looping, drums and effects, while the FM-1 shows the tracks and sends the button, key and knob presses. It has three loop tracks with record, overdub, play, undo and redo, mute and clear per track, where the first take sets the loop length and tempo. A 16-step drum track offers a CC0 rock kit and two generated kits with 12 patterns and pads recorded into the pattern. Effects are tempo-synced delay, reverb, chorus, a filter, bitcrusher, sample-rate reduction, stutter and per-track reverse. On the FM-1, keys 1 to 16 show the steps of the selected drum sound, keys 17 to 27 are pads, and K1 to K4 set the page values. The project was called FM-1 Loop Station and is named HMS Ouroloops (Hardware Meets Smartphone) in the README. The FM-1 runs the project's modified copy of ferluht's FM1 Sampler control-surface firmware, which has its own entry, and the app speaks that firmware's USB MIDI protocol. The app also keeps projects in the browser, records the live output, a mix or stems as files, installs as an offline web app and has an interface in German and English. The commit messages credit Claude.
