device: m-vave-fm-1
name: Outrigger
kind: tool
summary: >-
  USB MIDI host on a Waveshare ESP32-S3 touchscreen board that lets a controller play the FM-1 with no computer, and switches the FM-1's firmware with a backup first. Beta.
description: >-
  The board sits on a powered USB hub next to the FM-1 and routes MIDI from a controller to it; its screen shows the
  signal chain. The firmware loader keeps up to ten FM-1 firmware packages on the board's flash, backs up the running firmware
  before a switch and can resume an interrupted install. A new board comes with M-VAVE's V15, Felucca and Skiff, and
  more can be added from The Firmware Hub's list. The ESP32 firmware is installed from a browser installer that
  writes four partitions without touching stored settings. M-VAVE's firmware and JieLi's loader are fetched by the
  browser at install time and checked by hash, and are not in the repository. Beta 2 adds a second supported board, the Waveshare ESP32-S3-Touch-LCD-3.5, beside the 1.69-inch one. The beta notes list Wi-Fi, a web page on the board,
  loading your own firmware files and removing a firmware as not yet done. It has been tested with one controller,
  and the hub's USB-A ports do not work on the tested hub.
status: active
authors:
