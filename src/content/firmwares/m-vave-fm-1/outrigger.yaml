  url: https://github.com/chadthornton
source: https://github.com/chadthornton/outrigger
source_status: open
license: GPL-3.0-only
license_notes: >-
  NOTICE says GPL-3.0 with no later-version wording, and the author is Chad Thornton. Vendored EspUsbHost and Arduino_GFX are MIT and BSD, esptool-js
  is Apache-2.0, and the ESP32 Arduino core is LGPL-2.1. No M-VAVE firmware or JieLi wl82loader.bin is committed.
homepage: https://outrigger.music
distribution: browser-installer
install_notes: >-
  Install the board firmware from outrigger.music in Chrome or Edge. Switching writes to the FM-1's flash, so read the
  beta guide first; the guide says to leave the FM-1 switched on if a switch stops partway, and lists a recovery kit. The
  release notes say Skiff to stock is untested.
brick_risk: false
