homepage: https://jonbenderr.github.io/fm1-p6/
based_on: m-vave-fm-1/fomni-1
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or the .fwsc from the site with tools/fm1_install.py. The installer
  has a Back to the stock firmware option, which asks you to download M-VAVE's own V15 file from M-VAVE and
  select it. An FM-1 that fails to start twice comes up in a safe mode, and after four failed starts the chip's
  own update mode, where tools/fm1_rescue.py restores stock. Browser emulator on the site.
brick_risk: false
