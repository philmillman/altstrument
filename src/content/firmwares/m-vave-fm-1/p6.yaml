device: m-vave-fm-1
name: P6
summary: >-
  Six-voice analog-style polysynth modelled on the Korg Polysix, with a 4-pole filter, chorus, phase and
  ensemble effects, unison, chord memory, an arpeggiator and 32 programs; a fork of FoMni-1.
description: >-
  Each voice has one oscillator with a sub oscillator, a resonant ladder filter, an ADSR, a shared modulation
  generator and a plate reverb, with poly, unison and chord-memory key assignment, hold and an arpeggiator that
  follows MIDI clock. The 32 programs are saved in flash, and USB and TRS MIDI are supported. It replaces the
  instrument and panel of FoMni-1 and keeps the platform layer, installer and safe mode that FoMni-1 takes from
  Felucca. A browser emulator runs the same code. The project says it has been run only in the desktop
  simulator and the browser emulator and has not yet been tried on a real FM-1. The repository holds the
  source as a zip file, and a GitHub workflow builds the firmware and the site from it.
status: active
