  url: https://github.com/fantasmoslam
source: https://github.com/fantasmoslam/Paleotone
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, inherited from SLOOP, GHOULBOX and Felucca. Fonts are SIL OFL 1.1, the instrument samples
  are CC0, and ported DSP code keeps its own licences (MIT, Apache-2.0).
homepage: https://fantasmoslam.github.io/Paleotone/
distribution: browser-installer
install_notes: >-
  Web installer on the project site in Chrome or Edge, or tools/fm1_install.py with a package built from source or taken
  from the v2.8.4 release page or the repository's paleotone-fm1-output branch. The installer accepts only an unmodified M-VAVE V15 file for a return to
  stock; you supply it. Back up first with the editor; if an install fails, the README describes USB rescue (hold OCT- while
  switching on) and M-VAVE's own updater.
brick_risk: false
