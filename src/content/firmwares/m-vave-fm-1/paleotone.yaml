device: m-vave-fm-1
name: Paleotone
summary: >-
  Dinosaur-themed fork of GHOULBOX with a SAURUS creature-voice engine, 119 prehistoric sounds, synthesised jungle and storm samples, a terminal-style screen and a browser emulator, installer and USB second-screen app.
description: >-
  Formerly called DINOBOX. Everything GHOULBOX does (composer, RING, KEYS, hall reverb, tape and crush, twelve voices) is kept,
  with new names and sounds. SAURUS is a new engine in which each note is one animal call, shaped by call type, size, pitch
  swoop, length, growl, breath and mouth, with 20 creature presets. ROAR is GHOULBOX's hurdy-gurdy engine renamed, EPOCH its
  DREAM composer. The 119 presets replace GHOULBOX's and hide Felucca's stock sounds. It adds sample material generated by
  scripts instead of recordings, a TRIBE drum kit, extra FM6 patches, four power-on scenes and three screen palettes. The
  project site hosts a browser emulator, a web installer and a USB second-screen app that mirrors the FM-1's display. The
  README labels it an early alpha, says audio and recording problems are under investigation, and records that an earlier
  experimental screen build needed a Flipper-assisted recovery.
status: active
authors:
