device: m-vave-fm-1
name: Paleotone
summary: >-
  Prehistoric-themed groovebox on SLOOP: six tracks with a SAURUS creature-call engine, ROAR drones and war drums, 200+ sounds in ten kinds, a demo song, a browser emulator and a web installer.
description: >-
  Formerly called DINOBOX. Since 2026-11-08 the main line is built on RAPTOR's base, SLOOP 2.8.4 by isod89, and no longer on
  GHOULBOX; the older GHOULBOX-based version stays in the repository history. The earlier sounds carry over: SAURUS, where each
  note is one animal call shaped by call type, size, pitch swoop, length, growl, breath and mouth with 20 creature presets, ROAR
  drones and war drums, the drum kits, samples generated by scripts and the effects. It adds presets sorted into kinds with the
  kind named on screen, a demo song that plays on first power-on, large text in a single typeface and a green-on-black
  terminal look. The project site hosts a browser emulator, a web installer, an editor and a guide. The package identity is
  FM-1_988 and the repository carries an FM-1 Firmware Hub manifest. The README advises backing up projects first and
  describes USB rescue by holding OCT- at power-on, with a Transporter needed if that fails.
status: active
authors:
