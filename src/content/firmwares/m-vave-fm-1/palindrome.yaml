device: m-vave-fm-1
name: PALINDROME
summary: >-
  Experimental looping instrument: a key strikes a four-corner morphing synth, the note is caught as a ring, grains loop it, and each new generation is made from the last.
description: >-
  A key strikes MORPH, a four-corner synth. The note is caught as a ring, SILT plays grains of the selected ring as the main instrument, and DRIFT makes each new generation from the one before. It was first published as PALIMPSEST and the old web address forwards to the new one. It lives in the instruments/palindrome folder of the STRATA repository, with its own app, sound engine, tests, manual and version file, and its releases carry a palindrome- tag prefix and are marked as pre-releases. The release notes call it experimental with hardware validation pending, and the README says nothing in the repository has been tested on a real FM-1. Its package ID prefix is project-local and the author notes it has to be checked before distribution to a firmware hub.
status: active
authors:
- name: Savageperson334
  url: https://github.com/Savageperson334
source: https://github.com/Savageperson334/strata-fm1/tree/main/instruments/palindrome
source_status: open
license: MPL-2.0
license_notes: >-
  The repository's README states MPL-2.0 and its LICENSE file is the MPL-2.0 text. It builds on fm1-base and felucca-bsp (MPL-2.0).
homepage: https://savageperson334.github.io/strata-fm1/palindrome/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Open the install page in Chrome or Edge, connect the FM-1 over USB and install; the release notes advise trying the emulator first. The README says the installer can put M-VAVE's firmware back, and that installing custom firmware is at your own risk.
brick_risk: false
