versions:
- version: '1.1'
  date: 2026-11-14
  url: https://github.com/hacha/paperlagoon/releases/tag/v1.1
  notes: The release page has only a changelog link. Commits since 1.0.1 give each world its own five-step scale ladder from dark to bright instead of five scales shared by all, make a voice sound a little different each time and rounder when high, and add a per-world room (voice distance, reverb length and brightness, echo melt and width, Hiss colour). They also lay the voice ripples flat on the water and pass each world's colour to every page, lower the fountain's answers and the letter's reading by an octave, and shape the loudness of each phrase.
