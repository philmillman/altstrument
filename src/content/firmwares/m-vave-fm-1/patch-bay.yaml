device: m-vave-fm-1
name: Patch Bay
summary: >-
  Self-patching virtual modular synth firmware for the FM-1 that draws sixteen modules with coloured cables and keeps re-patching itself to new music, always in key.
description: >-
  Sixteen modules sit on the screen as panels with jacks, a light and a live display: clock, sequencer, random, quantizer, two LFOs, two envelopes, VCO, FM pair, noise, filter, VCA, delay, mixer and reverb. Every so often one cable lifts, flies to another jack and plugs in. Each move is checked first for pitch in key, something sounding and no audio loops, and levels stay even with a soft top end. EDIT or SEL plugs, unplugs and carries cables by hand, touching the patch pauses the auto-patcher for 90 seconds, and knobs set the auto-patch rate from off to five minutes, tempo, space and the selected module's knob. Twelve starting patches include Berlin School, Krell, Plinky and Tape Choir. The README supports a screen reader.
status: active
