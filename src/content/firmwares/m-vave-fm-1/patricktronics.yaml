device: m-vave-fm-1
name: Patricktronics
summary: >-
  Felucca fork that keeps a locked palette of up to five notes and one FM sound and lets a bounded random
  generator rearrange the sequence over time, for a self-evolving ambient loop in the manner of Frippertronics.
description: >-
  Held keys set the note palette, and a new PTRX page reached from FX sets the enable switch, mutation rate and
  density and a reseed. The generator is seeded from hardware entropy at each launch, so the same setup plays
  differently every time. Sixteen rule sets can be stored and recalled, and the seed is never stored. Felucca's
  delay and reverb are used for the ambient wash. The firmware keeps its Felucca data layout, so existing
  projects, samples and presets are left alone. The only commit above Felucca 1.5.1 adds the generative layer, and
  its message says it has not yet been tried on a physical FM-1. The author is a guitarist who wants a backing
  texture to play over.
