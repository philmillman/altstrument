distribution: source-only
install_notes: >-
  No release is published, so build build/patricktronics.fwsc with build.sh and install it with
  tools/fm1_install.py. The README also points to the FM-1 Firmware Hub for installing it, and to hold OCT- at
  power-on for USB rescue and to FM-1 Transporter for a unit that will not start. It inherits Felucca's flashing
  risk.
