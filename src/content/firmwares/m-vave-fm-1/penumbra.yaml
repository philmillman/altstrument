device: m-vave-fm-1
name: Penumbra
summary: >-
  Space-drone instrument: five slowly beating drone voices held on the scene's key, a soft synth voice in a shimmer
  reverb, a looper, six journeys of scenes and eight user slots.
description: >-
  The drone starts when the unit is switched on. The black keys hold five drone voices, each steady or swelling, and
  the white keys play VOX, a four-voice synth with four sounds, a wave from saw to narrow pulse and glide. Other parts
  are a kick tuned to the key, a slow swell, a bed of wind noise, a shimmer reverb, a tape delay and a master stage.
  A looper records VOX and the kick in layers and follows the key of the current scene. Holding a key lets the knobs
  play its sound, and MORPH walks to the next scene by hand. Six preset journeys and eight user slots survive a power
  cut, and there is a sleep timer, MIDI clock in and out, USB audio and screen-reader support. Version 1.1 adds a
  slow TIDES swell that opens the drone filter and breathes the space, a room size and shimmer for each scene,
  further reverb and delay controls, an A/B comparison of two sounds and a library of eight stored sounds. Version 1.2 adds a stereo position and sway for each part, a tighter MIDI clock with song position, 44 controllers and notes and program changes in both directions, and a sound of its own for each preset journey. Version 1.3 changes HOME so that its animation follows the drones, the stereo position and the looper. Version 1.4 makes the first journey start sparse, with its drone voices drifting in and out instead of all being held. Version 1.5 adds a seventh journey, TOTALITY, that moves through its scenes by itself, an option for any journey to travel on its own, a singing VOX, loops whose notes keep their own sounds with a page for their layers, and journeys that bring their own sound. Version 1.6 gives each loop layer its own pan, drift, tone, swell and length, lets several VOX sounds sing at once, adds a BLOOM that swells by itself, and doubles the VOX voices to eight. Version 1.7 turns HOME's knobs into six pages of the sound itself, shows install progress, adds a Backup page that saves everything to one file and a USB ONLY audio option. Version 1.8 adds a hand-shaped kick held in the key, with its own DRIVE, DUCK and an option to play by itself on the clock. It carries M-VAVE's
  update loader so the unit can switch to another firmware. The author is credited as Lunar Eclipse Forge.
status: active
authors:
- name: Lunar Eclipse Forge (MadMooneyham)
  url: https://github.com/MadMooneyham
source: https://github.com/MadMooneyham/Penumbra
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md. Built on Felucca's platform layer and Charles Vestal's X0X. The JieLi SDK
  files are not in the tree.
distribution: download
install_notes: >-
  Write penumbra-1.8.fwsc from the release with an FM-1 firmware installer; BUILDING.md explains building and serving
  a web installer, and the README says it will also be offered on The Firmware Hub. Holding OCT- and OCT+ for five
  seconds puts the FM-1 in update mode if an install does not start. Installing is at your own risk.
brick_risk: false
tags: [ambient, synth-engine, looper, fx, reverb, delay, performance, midi, usb-audio, fork]
