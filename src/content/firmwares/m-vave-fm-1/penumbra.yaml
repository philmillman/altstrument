versions:
- version: '1.8'
  date: 2026-11-17
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.8
  notes: Puts the kick under the knobs while its key is held (DROP, DECAY, CLICK, TUNE), keeps it in the scene's key, adds DRIVE and a DUCK that dips the drone, VOX and wind, lets it play by itself on the clock, and plays it from MIDI. Fixes PAN 2 settings being converted on upgrade from 1.2 to 1.7. The package identity is FM-1_73010800 and journeys, slots, sounds and settings carry over.
- version: '1.7'
  date: 2026-11-17
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.7
  notes: HOME's four knobs play six pages of the sound (DRONE, VOX, MOTION, SPACE, MIX, ALIVE), every other page gets an eclipsed moon behind it, installs show their progress, and a Backup page saves everything Penumbra keeps to one file in Chrome or Edge. Adds a USB ONLY audio option that silences the FM-1's own outputs while a computer takes the audio. The package identity is FM-1_73010700 and journeys, slots, sounds and settings carry over.
- version: '1.6'
  date: 2026-11-15
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.6
  notes: Gives each loop layer its own pan, drift, tone, swell and length of 1 to 64 beats, lets each of VOX's four sounds sing on its own settings, adds a BLOOM that swells now and then, and raises VOX from four voices to eight. Fixes a looped note being cut when the same key is let go and an octave jump at DETUNE 0. The package identity is FM-1_73010600 and journeys, slots, sounds and settings carry over.
- version: '1.5'
  date: 2026-11-14
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.5
  notes: Adds TOTALITY, a seventh journey of six scenes that moves on every 16 bars, a TRAVELS setting that lets any journey advance by itself, a singing VOX option, loops whose notes keep the VOX sound they were played with and a LOOP page for the layers, and journeys that bring their own sound unless SOUND is locked. The package identity is FM-1_73010500 and journeys, slots, sounds and settings carry over.
- version: '1.4'
  date: 2026-11-13
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.4
  notes: The first journey, ECLIPSE, starts sparse, with its drone voices drifting in and out and the black keys calling each one in to swell. The other journeys keep most voices held. Fixes a missed swell at power-on, and the guides now open with the first minutes of playing. The package identity is FM-1_73010400 and journeys, slots, sounds and settings carry over.
- version: '1.3'
  date: 2026-11-09
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.3
  notes: Redraws the HOME screen to follow the sound, with the moon crossing the sun as a scene changes, drone beads sized by voice level, stars for VOX notes and echoes, and a satellite for the looper. The sound is unchanged from 1.2.1. The package identity is FM-1_73010300 and journeys, slots, sounds and settings carry over.
- version: 1.2.1
  date: 2026-11-05
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.2.1
  notes: Fixes a CPU bug on newer units, as the release page puts it; nothing else is listed.
- version: '1.2'
  date: 2026-11-04
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.2
  notes: >-
    Adds PAN, which places drone, VOX, pulse and texture in the stereo field and lets them sway at a set rate, a tighter
    MIDI clock with song position, 44 controllers, notes and program changes sent and received over MIDI, and a sound for
    each preset journey. It also fixes a noise when turning the tempo. Journeys, slots and sounds from 1.0 and 1.1 carry
    over. The package identity is FM-1_73010200.
- version: '1.1'
  date: 2026-11-02
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.1
  notes: >-
    Adds TIDES, a slow swell under everything, a room and shimmer for each scene, more reverb and delay controls,
    A/B comparison of two sounds and a library of eight sounds. Journeys, user slots, the loop and settings from 1.0
    carry over. The package identity is FM-1_73010100.
- version: '1.0'
  date: 2026-10-29
  url: https://github.com/MadMooneyham/Penumbra/releases/tag/v1.0
  notes: >-
    First stable release, with its own update identity FM-1_73010000. Journeys, user slots and settings from the
    0.13 to 0.17 betas carry over.
