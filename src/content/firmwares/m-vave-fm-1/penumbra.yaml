  url: https://raw.githubusercontent.com/MadMooneyham/Penumbra/main/assets/card.png
  alt: "Penumbra home screen: scene name ECLIPSE, a ringed logo with orange points on a dark star field, the text 1/4 A AEOLIAN and PLAYING, and DRONE, VOX, SPACE and TONE knob values at zero"
  credit: MadMooneyham
  source_url: https://github.com/MadMooneyham/Penumbra
