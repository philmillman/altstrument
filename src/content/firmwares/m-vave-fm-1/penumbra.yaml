license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md. Built on Felucca's platform layer and Charles Vestal's X0X. The JieLi SDK
  files are not in the tree.
distribution: download
install_notes: >-
  Write penumbra-1.1.fwsc from the release with an FM-1 firmware installer; BUILDING.md explains building and serving
  a web installer, and the README says it will also be offered on The Firmware Hub. Holding OCT- and OCT+ for five
  seconds puts the FM-1 in update mode if an install does not start. Installing is at your own risk.
brick_risk: true
