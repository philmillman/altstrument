device: m-vave-fm-1
name: Penumbra
summary: >-
  Space-drone instrument: five slowly beating drone voices held on the scene's key, a soft synth voice in a shimmer
  reverb, a looper, six journeys of scenes and eight user slots.
description: >-
  The drone starts when the unit is switched on. The black keys hold five drone voices, each steady or swelling, and
  the white keys play VOX, a four-voice synth with four sounds, a wave from saw to narrow pulse and glide. Other parts
  are a kick tuned to the key, a slow swell, a bed of wind noise, a shimmer reverb, a tape delay and a master stage.
  A looper records VOX and the kick in layers and follows the key of the current scene. Holding a key lets the knobs
  play its sound, and MORPH walks to the next scene by hand. Six preset journeys and eight user slots survive a power
  cut, and there is a sleep timer, MIDI clock in and out, USB audio and screen-reader support. Version 1.1 adds a
  slow TIDES swell that opens the drone filter and breathes the space, a room size and shimmer for each scene,
  further reverb and delay controls, an A/B comparison of two sounds and a library of eight stored sounds. It carries M-VAVE's
  update loader so the unit can switch to another firmware. The author is credited as Lunar Eclipse Forge.
status: active
