license_notes: >-
  The README and LICENSING.md state GPL-3.0-only, as Felucca, with copyright to R. Luke DuBois and the platform code by Leo Kuroshita (Hügelton Instruments) and the M-Vave-OP1 contributors. The STK Shakers models are under STK's MIT-style licence (LICENSING.md). The repository holds vendor/m-vave/FM-1_015.fwsc, which is the V15 image M-VAVE publishes under Apache-2.0 (git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, 699,956 bytes, identical to the one in m-vave/fm1_open).
homepage: https://github.com/rev3rend/percolator
distribution: download
install_notes: >-
  Install percolator-1.0.fwsc with tools/fm1_install.py (Python with mido and python-rtmidi) or the web installer in the repository, and check the file against SHA256SUMS. The README says there is one firmware bank and no recovery button, but the platform's boot guard drops the unit into the chip's boot mode after two failed boots (OCT- and OCT+ held for 5 s does it on purpose), and the update path stays available while the firmware runs. To go back, run fm1_install.py --stock, use the installer's Return to official V15 or use M-VAVE's own updater. It lists FM-1-transporter as optional recovery hardware.
