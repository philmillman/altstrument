device: m-vave-fm-1
name: Percolator
summary: >-
  23-track percussion sequencer on the Synthesis ToolKit's PhISEM Shakers models, with per-step locks, probability and ratchets, songs, effects, MIDI sync and screen-reader support.
description: >-
  Each of the 23 tracks is one Shakers instrument, from maraca, cabasa and tambourine to sleigh bells, bamboo chimes, rocks, a mug with coins, a wrench and water drops, with energy, decay, objects and frequency on the knobs plus level and pan. The sequencer has 16 steps per track with accents, parameter locks, probability, ratchets, A:B, FILL and FIRST conditions, nudge, per-track length and clock divide, swing, note repeat, live recording, mute and solo, and a grid view of all tracks next to a single-track view. It holds 32 patterns, 12 kits and 8 songs, with the factory ones in hand percussion, ambient, metal and industrial, and generative styles, and effects on the mix are a filter with drive, chorus, a tempo-synced ping-pong delay, a short reverb and a limiter. MIDI notes and CCs come in over USB and TRS, clock goes in and out, and hits, knob moves and pattern changes go out over USB. It speaks every screen through the fm1-reader screen reader and has a device file for synthaccess MIDItoSpeech. The sound models are Perry Cook's PhISEM from STK, and the firmware is built on the Felucca platform as M-Vave-OP1 carries it. The README says it runs on a real FM-1.
