device: m-vave-fm-1
name: PERF-1
summary: >-
  Live-performance groovebox for the FM-1: seventeen genres of self-playing pieces you
  steer live, with an auto-DJ, a drum sequencer, an acid line that answers
  itself, your own chord progressions, editable effects, MIDI control from pads and
  keyboards, and your own DX7 voices.
description: >-
  A fork of RedtailWorks' HYP-1. The pad, bass, acid line, pluck and drums play
  by themselves from power-on; one button breaks the music down, builds it and drops
  it, and an auto-DJ can run that whole arc, bring in the next piece and follow the
  chords. There are seventeen genres of ten pieces (hypnotic techno, lofi, house, dubstep,
  dub, DnB, breaks, garage, electro, trap, disco, funk, reggae, synthwave, amapiano,
  trip-hop, industrial), each with its own kits, patterns, effects, compressor and harmony: the chord
  changes every so many bars by genre, minor keys get a real dominant, and most genres loop
  a progression that starts from home, or plays your own (8 chord slots from the scale). Any piece can be stored, and a set list of 16 pieces from any genre is stepped through by hand or by the auto-DJ. A set page gives a piece
  several auto-DJ rounds with a tempo ramp, and an intro brings the parts in one by one for
  mixing in. The drum sequencer has Euclidean fills, per-lane chance, lane
  lengths for polymeter, a density control, a source pattern per lane, drum drift, a steps
  page (ratchets, push, ghost and accent on every step) and a phrase page (pattern chains,
  slices, half and double time, conditions). The acid line answers itself and can be edited
  step by step and frozen; the bass can play as a line with nine named figures; the pluck can
  remember and repeat itself (deja vu), its loop can be frozen and written step by step, and it
  plays out on MIDI. The saw pads sweep a resonant filter with every breath and stab. The pluck
  can be one of 30 DX7 voices from public-domain banks (or a built-in set of 30) or up to 16 of
  your own loaded from a .syx file. The home screen shows the chord as a turning sigil with an
  eye that follows the section. There are four banks of effects (every effect has a page
  that draws it), beat FX, 27 Flex Beat patterns and DJ snips, scenes, undo, a mood macro,
  a JAM page (with accents), punch-in filter, delay and phaser on chosen tracks, filter types for the pad, bass and acid,
  a stereo compressor and look-ahead limiter, and MIDI clock in. Over MIDI an MPC's pads, a Model:Samples or an Akai
  MPK mini (keys, pads, knobs, pitch bend, mod wheel) can play it, with velocity, and its FX knobs send CCs out. The second
  core renders the reverb, pad and DX voices, with load shedding and a USB status log. The
  project site has the installer (with backup and restore), a browser emulator with sound,
  a parameter and DX7 voice editor, and a manual that opens with a beginner's guide, with
  printable PDFs.
status: active
authors:
