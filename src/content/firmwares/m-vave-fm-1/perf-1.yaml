license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md. The platform layer is Felucca's by way of X0X and FoMni,
  the sound code is AMB-1's and HYP-1's, the six-operator FM engine is Melodee's
  (after Dexed and MSFA); the fonts are SIL OFL 1.1.
homepage: https://deamonslinky.github.io/PERF-1/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc.
  The installer can write M-VAVE's own V15 or V16 back from a file you download yourself,
  and an FM-1 that fails to start twice comes up in a safe mode the installer can
  reach. On a unit updated to V16 the installer can put V15's startup code back, since V16's
  runs the whole unit about 12% slower. A boot stub that returns a unit whose install was cut
  off to the update loader is marked experimental. The README says installing is at your own risk.
brick_risk: false
