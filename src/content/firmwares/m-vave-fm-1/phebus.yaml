device: m-vave-fm-1
name: PHEBUS
kind: firmware
summary: >-
  Groovebox firmware forked from KARMA, with three melodic voices, 16 editable drum sounds and 22 effect pads that stutter, reverse and sweep the whole mix.
description: >-
  The synth side has three voices that share the same pages: an oscillator with 31 types, including ACID, JUNO and Plaits and Elements models, three macros, a resonant filter with its own envelope, an amp envelope, three effect slots and a modulation matrix. Drums are 16 sounds with source, filter, amp and LFO pages, editable kits, velocity, conditions, chance, nudge and retrigger per step. In the perform view, 22 effect pads act on the full mix, and pads played while recording go into a fifth sequencer lane. There are four patterns with autosave, MIDI, and USB audio as a stereo mix or six stems. A browser simulator, installer and backup page are on the project site. The README calls it a personal firmware and says it has not been measured on a real FM-1, and it waits for the slower UC25HQ80 flash chip on newer units. Its package identity is FM-1_926.
