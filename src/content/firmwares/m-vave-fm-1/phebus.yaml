homepage: https://bashidrum.github.io/phebus/webapp/installer/
based_on: m-vave-fm-1/karma
distribution: browser-installer
install_notes: >-
  Back up first with the project's backup page, then install from the browser installer in Chrome or Edge over USB; updating PHEBUS keeps projects and settings. Official firmware returns through M-VAVE's M-UPGRADE updater. An FM-1 running M-VAVE's FM1 Open needs the official V15 restored first with the FM1 Workbench. Holding OCT- while switching on starts the USB rescue if an install is interrupted.
