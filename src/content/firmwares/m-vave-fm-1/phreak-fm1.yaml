device: m-vave-fm-1
name: PHREAK
summary: >-
  SLOOP 2.8.4 fork with three drum tracks, drum kits loaded from a USB stick of WAV files, envelope, filter and LFO
  shaping for those samples, and eight song sections A to H.
description: >-
  A six-track groovebox, three synth tracks and three drum tracks, built on SLOOP 2.8.4 and so on Felucca. Holding
  OCT+ at power-on opens a browser for a FAT32 USB stick plugged in through a powered OTG adapter, and a folder of WAV
  files, or one file, can be loaded into one of four user sample slots. Drum tracks D1 to D3 each have their own kit,
  pattern, length, swing and level, and a user kit gets ENV, LFO and EDIT pages with an ADSR gate, a resonant
  filter, tune, bit crush, drive and loop. Songs have sections A to H instead of A to D, and the build adds a few
  808 basses and trap kits, a new boot screen and an ABOUT page. Sample slots shrink from 80 KB to 68 KB. The
  author calls it a personal fork tested on one FM-1. Its history shares SLOOP's commits but not BoopBox's, so it is
  a separate fork of SLOOP.
