source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md is SLOOP's, carried over from Felucca: code is GPL-3.0-only, while Hügelton Instruments' icon atlas
  (assets/icons.png) and panel image are separate all-rights-reserved assets that Felucca's GPL section 7 permission
  lets you combine. Third-party parts are CC0 samples, the Terminus font (SIL OFL 1.1), the Fukiai font (MIT),
  CrispyZebra (GPL-3.0), msfa (Apache-2.0), DaisySP and Rings code (MIT), and JieLi SDK files read from your SDK
  checkout at build time (Apache-2.0). The repository commits SLOOP 2.8.4's own build under docs/firmware, not
  M-VAVE's stock firmware.
homepage: https://github.com/dagnazty/phreak-fm1
based_on: m-vave-fm-1/sloop
distribution: download
requires_stock: SLOOP, Felucca or stock FM-1 firmware
install_notes: >-
  Install phreak-1.9.fwsc from the release over USB with tools/fm1_install.py, or serve the installer page from the release's site zip (or your own build) on localhost and use Chrome or Edge. Building needs the JieLi toolchain and AC79 SDK. Take a backup in
  the editor first; projects, presets, samples and settings are kept on update. Holding OCT- alone while switching
  on enters USB rescue, SLOOP 2.8.4 can be reinstalled the same way, and M-VAVE's M-UPGRADE with the official V16
  firmware restores the stock firmware, according to the README. Installing is at your own risk.
brick_risk: false
