device: m-vave-fm-1
name: PIGEON
summary: >-
  Felucca 1.5.1 derivative that turns the FM-1 into an audio-only performance sampler: two chopped song samples
  and a 16-pad drum kit, USB audio sampling, a 64-step sequencer and piano roll, patterns and arrangement, with
  a browser emulator and sample tool.
description: >-
  PIGEON removes the synth engines and builds the instrument around samples. Two song samples (indexed mono
  MP3 or IMA ADPCM) and a 16-pad drum kit share 500 KiB of usable flash. Each song takes up to 32 chops with
  transient detection, editable boundaries and playback point, forward or reverse playback, pitch in semitones
  and cents, gain, loop crossfade, envelope, one-shot, hold, loop, latch and choke settings, plus chop queues
  and tempo sync by playback speed. Version 0.5 records digital USB audio (mono 16-bit, 22.05 kHz, stored as
  ADPCM) straight to the selected song or drum pad, with immediate or threshold start, time or bar limits, and
  audition and trimming before an unsaved take is kept. Marked chops can be kept while unused source audio is
  trimmed, and the bank compacted to reclaim space. A step grid and piano roll edit the same sequences, up to
  64 steps per track and four notes per step, with live or chord step entry, microtiming, conditions,
  probability, repeats, Euclidean fills and parameter locks, feeding patterns A to D and a 16-section
  arrangement. A three-track mixer, filter, delay, chorus, reverb, distortion and compression sit on top, with
  per-track MIDI channels, MIDI clock and screen-reader support through the FM-1 Screen Reader protocol. A
  browser sample tool prepares banks, sessions and reusable chop collections and sends them over USB; a
  separate browser emulator runs the firmware without a device and records its output to WAV or MP3. The
  installer reads the running firmware and refuses Sloop, old Felucca betas and unknown builds, and the
  package adds a recovery boot stub adapted from ChoralRoot. Tagged releases from 0.4.1 are built and attested
  by Firmware Hub's shared GitHub workflow. The 0.4 scratch decks are not part of 0.5.
status: active
authors:
- name: The Shrimp Blimp
  url: https://github.com/TheShrimpBlimp
source: https://github.com/TheShrimpBlimp/pigeon
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Felucca (LICENSING.md); bundled libmad (GPL-2.0-or-later), ported DSP, fonts and the lamejs
  encoder in the browser tool keep their own licences listed there.
homepage: https://theshrimpblimp.com/pigeon/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer on the project site (desktop Chrome or Edge, USB), or tools/fm1_install.py from the
  repository. Return to official M-VAVE V15 with your current firmware's stock-return procedure first; the
  installer refuses Sloop, Felucca 0.x betas and unrecognised firmware. Back up a complete session before
  updating: 0.3.1 cannot open 0.4 or 0.5 projects, and an older build is refused when it cannot preserve an
  expanded 0.5 bank. Release packages can be checked with gh attestation verify as described in
  docs/RELEASE_SIGNING.md. Recovery notes are in docs/PIGEON_RECOVERY.md.
brick_risk: false
tags: [sampler, sequencer, performance, drums, fx, recording, usb-audio, midi, accessibility, emulator, editor]
