source: https://github.com/PINGAUDIO/PING-OS-1
source_status: open
license: MPL-2.0
license_notes: >-
  LICENSE and the README give MPL-2.0. docs/THIRD_PARTY.md lists the ported parts: the Plaits-derived models, MIT engines from Felucca-Engines, the FM6 core after msfa (Apache-2.0) and two FM6 files used under Leo Kuroshita's MPL-2.0 grant. No M-VAVE stock image is in the repository.
homepage: https://pingaudio.github.io/PING-OS-1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Connect the FM-1 by USB, open the PING OS-1 page in Chrome or Edge, accept the terms and press Install; do not unplug while it writes. The same page puts the stock firmware back. The README warns that the firmware keeps its projects, patterns, presets and samples in its own format in the FM-1's memory, that switching firmware in either direction can overwrite what the other stored, and advises backing up first. The repository's installer builder leaves out the m-bootloader offer, which would rewrite the boot area.
brick_risk: false
