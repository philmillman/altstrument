device: m-vave-fm-1
name: PING OS-1
summary: >-
  Four-track rhythm synthesis engine with 49 synthesized drum models, 20 synth models, 23 effects, a step sequencer with parameter locks, a line generator and an autopilot that varies a playing pattern.
description: >-
  Each of the four tracks holds one sound engine, four effect slots and its own level, pan, filter, modulators and pattern, and the tracks meet in a master chain of four more effects and a limiter. The sound models are 49 synthesized drums and 20 synths, including ports of Mutable Instruments Plaits models and engines from Felucca, plus a sampler and a granular engine that play up to eight WAV files sent from the browser. The sequencer has eight note lanes a track, parameter locks, ratchets, chance, ties and micro timing, sixteen patterns a project chained in song mode, and sixteen sound presets. A line generator writes bass lines and melodies in the chosen key, the autopilot keeps varying a playing pattern, and a key lock sets one key and scale for every track. The screen shows each effect drawn live, a performance mode and a 3D spectrum view. A VST3 plugin with the same engine and a browser page to try, install, load samples and record are in the same repository. The firmware is built on fm1-base, in a fork that adds a few platform functions, and the project is not made or endorsed by M-VAVE.
status: active
authors:
