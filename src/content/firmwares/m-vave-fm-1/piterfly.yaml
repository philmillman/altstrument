  url: https://github.com/piotrwozniak
source: https://github.com/piotrwozniak/piterfly
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only for the code, as SLOOP and Felucca. Third-party parts keep their licences (msfa Apache-2.0, DaisySP, Rings and Fukiai MIT, Terminus SIL OFL 1.1, JieLi SDK Apache-2.0, some CC0 and CC-BY-3.0 material). The 86 device icons are new GPL-3.0-only work; SLOOP's icon atlas and screenshots are excluded because their terms were not established.
homepage: https://piotrwozniak.github.io/piterfly/
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB, or download piterfly-1.0.1.fwsc from the release, which also carries the source archive and SHA256SUMS. The README says to back up first: the fourth sample bank is repurposed and importing a song file replaces all pattern slots, empty ones too. Recovery is the same as for SLOOP: hold OCT- while powering on for USB rescue.
brick_risk: false
