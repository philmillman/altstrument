source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSING.md state GPL-3.0-only, as Optimist. Assets carry their own terms listed in LICENSING.md, including the Inter Tight font (SIL OFL 1.1). The repository also holds the stock V15 package that M-VAVE licenses for redistribution (git blob ce49cc15, the same file as in m-vave/fm1_open), and a small calibration dump from the Optimist author's unit.
distribution: download
requires_stock: V15 or another Felucca-family firmware
install_notes: >-
  Back up first, because installing over another firmware may erase the projects and user presets in flash. Install the .fwsc from the release with Optimist's web installer or with tools/optimist.py flash. If an install is cut off, run it again, and if the FM-1 does not start, hold OCT- while switching on for the USB rescue and flash again. The README links a guide for returning to the official firmware.
brick_risk: false
