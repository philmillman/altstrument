device: m-vave-fm-1
name: Plissken
summary: >-
  Early seven-part soundtrack sketch on fm1-base: Juno-style synth, piano, Pro One-style line, guitar, bass, LM-1 drum samples and a CS-50 voice on one clock, with a chord mode and a phrase recorder.
description: >-
  Rights warning: the release package embeds a MIDI arrangement of an Escape from New York piece. The CREDITS file says the project owner confirmed authorization to embed it and that no composer or arranger credit came with the file. The 13 drum samples are Rossf's Linn LM-1 set under Creative Commons Sampling+ 1.0, and the screen art includes user-supplied pictures and an AI-adapted splash.


  Seven parts play together on a shared clock: an eight-voice Juno-style synth with chord stabs and chorus, piano, a Pro One-style line, power-chord guitar, electric bass, the LM-1 kick, snare and hi-hat, and a CS-50-style line. The keys play the sound chosen with SELECT, which also includes a chord mode with eight chord types and a ten-patch CS-80-inspired voice family. Guitar and bass have drive, chorus, modulation and delay, and drums have chorus, reverb, compression and bass boost. REC records one phrase of up to 16 seconds and loops it, and EDIT with PLAY toggles the embedded MIDI song. The README calls it a concurrency and resource-budget prototype, says the synthesis is deliberately simple and unchecked for CPU load on a real unit, and adds a warning not to press PLAY because it sounds bad. A separate emulator-only build exists and the README says never to install it on an FM-1.
status: active
