source_status: open
license: MPL-2.0
license_notes: >-
  The LICENSE file and README give MPL-2.0 for the application code, and the README adds a line asking for credit. Third-party parts keep their terms (CREDITS.md, base/LICENSING.md): fm1-base and felucca-bsp, the Sampling+ drum samples and the user-provided artwork and MIDI file.
distribution: download
requires_stock: Flashes over official V15 or another FM-1 firmware
install_notes: >-
  Download plissken-0.1.fwsc from the release and install it with an FM-1 installer such as fm1-base's tools/fm1_install.py. Do not install the emulator-only package from the --emulator-only build. The README gives no recovery steps of its own and points to the fm1-base documentation for the build.
