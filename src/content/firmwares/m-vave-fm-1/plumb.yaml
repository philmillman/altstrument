license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only and the LICENSE file is the GPL-3.0 text. Dinghy's platform files keep their upstream notices and LICENSING.md lists the separately licensed assets, including the IBM Plex Mono font under SIL OFL 1.1. The JieLi SDK files are read from the builder's own checkout at build time.
homepage: https://github.com/jaak-stjaaques/Plumb
based_on: m-vave-fm-1/dinghy
distribution: source-only
install_notes: >-
  Build with sh build.sh (Python 3 with Pillow, the JieLi toolchain and three AC79 SDK files, through Docker on macOS); every push to main also builds a package onto the repository's build branch. The README says to keep stock firmware or another firmware ready to flash back. It says nothing has been installed on a real FM-1, so treat it as untested.
brick_risk: false
