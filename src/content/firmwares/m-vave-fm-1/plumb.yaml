device: m-vave-fm-1
name: PLUMB
summary: >-
  Pendulum-wave sequencer for the FM-1: twelve pendulums released together play their notes as they pass a strike point, with wavefolder, phase-distortion and pulsar engines. Pre-release; not yet run on a real FM-1.
description: >-
  Twelve pendulums hang in a row, each a little shorter than the last, and PLAY releases them together. Pendulum k swings a set number of times more than the first in one cycle, so they form a line, then a snake, then scatter, and meet again at the end of the cycle. Each pass of a strike point plays that pendulum's note. The cycle runs from 4 to 128 beats, a grid option snaps the strikes to note divisions, and the row of notes can be shaped by presets such as rise, arch or fifths, recorded by hand or caught pendulum by pendulum. Three oscillator engines are included: a wavefolder through a low-pass gate, Casio-style phase distortion and pulsar synthesis. The ARP lets the strikes walk through a held chord, and the LFO can also bend time. It has 48 scales, eight presets and eight user slots, and from Dinghy it has MIDI clock sync, MIDI in and out, USB audio and a backup page. The README warns that it has only been tested on a computer and not on a physical FM-1.
status: active
