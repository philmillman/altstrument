device: m-vave-fm-1
name: Pocket Poly
summary: >-
  Stereo polysynth for the FM-1 on fm1-base with a virtual analog and wavetable engine, six-operator FM with DX7
  bank import, a 12-mode arpeggiator, seeded patch discovery and full MIDI. Still in development.
description: >-
  Built as a synthesizer rather than a groovebox. The voices combine virtual analog oscillators with wavetables and
  phase distortion, plus a six-operator FM engine that imports DX7 banks. Effects are an ensemble, a tape delay, a plate
  reverb and a limiter. Dice, mutate, morph and breed functions create patches from a seed, and the arpeggiator has
  Euclidean and Turing generators, chance, ratchets and latch. MIDI covers USB, TRS in and Bluetooth in both roles, and
  clock runs in both directions. The README calls the tree a scaffold in development, and the handoff notes say the
  planned sound pass had not happened and the author found the factory sounds placeholder. The same notes record that a
  build was flashed to the author's FM-1 on 2026-10-31, where it booted cleanly and idled at 4 % CPU, with
  eight analog voices at 50 to 55 %. The repository also holds DEEP FIELD, listed separately.
