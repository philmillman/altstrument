distribution: source-only
install_notes: >-
  No release. ./build.sh builds app/build/pocketpoly.fwsc with JieLi's toolchain, run in a Linux container on a Mac,
  and the AC79 SDK; fm1_install.py installs it over USB. The package identity is FM-1_1300. Holding OCT- at power-on
  opens update mode. Back up and keep M-VAVE's updater ready.
