device: m-vave-fm-1
kind: tool
name: Pocket Synth Emulator
summary: >-
  Android app that runs FM-1 firmware packages unchanged on an emulated FM-1, lists and downloads Firmware Hub entries,
  and installs a package on a real FM-1 over USB.
description: >-
  The emulation is Joakim Eriksson's fm1-emu library, built for Android without changes. Any .fwsc package plays on it
  with the screen, twelve buttons, eight knobs and a key strip on a sideways display, with MIDI from USB, Bluetooth or the
  unit's own keys going into the emulated MIDI input and MIDI learn for the knobs. Each firmware version keeps its own
  flash. The firmware list is read from The Firmware Hub's catalogue, and a package is downloaded from its maker's GitHub
  release and kept only if its SHA-256 matches the hub's. A GitHub repository can also be added by name, which takes its
  newest release with a .fwsc and is not checked by anyone. A second part talks to a real FM-1 with Felucca's update
  protocol: it installs a package, finishes an interrupted update and returns the unit to M-VAVE's V15, downloaded from
  M-VAVE's own repository and checked against its hash. ObsSynth FM-1 is built into the app. The app began as ObsLoader (0.1.0 and 0.2.0),
  became FM1 Emulator (0.3.0 and 0.3.1), then FM-1 Pocket (0.3.2), and has been called Pocket Synth Emulator since 0.4.0,
  the name it takes on Google Play. The repository is now orianbsilva/fm1-pocket and is not the same project as Prado-Design's FM-1 Pocket web app.
status: active
authors:
- name: orianbsilva
  url: https://github.com/orianbsilva
source: https://github.com/orianbsilva/fm1-pocket
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL v3 text and the README says GPL-3.0, with no "or later" statement. The bundled fm1-emu library is MIT
  and its licence text ships in the app. The only firmware committed is ObsSynth FM-1 0.2.0, the author's own GPL-3.0 build;
  no M-VAVE image is in the repository.
distribution: download
install_notes: >-
  Needs Android 8 or newer, 64-bit. Download Pocket-Synth-Emulator-VERSION.apk from the releases page and allow installs from that source; each version up to 0.3.2 installs
  over the last, while 0.4.0 has a new app id and installs beside the earlier builds, which can then be uninstalled. Playing in the emulator writes nothing to a real unit. Installing to the FM-1 follows Felucca's update
  protocol, and the README offers the way back to M-VAVE's V15 and finishing an interrupted update from the same screen.
brick_risk: false
tags: [android, emulator, flasher, midi, usb-midi]
