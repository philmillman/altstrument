device: m-vave-fm-1
name: Polly
summary: >-
  Pocket arranger inspired by the Yamaha QY70: a style plays an eight-instrument band that follows the chords
  you play, with General MIDI sounds from Sonivox EAS and use as a GM sound module over MIDI.
description: >-
  A song is a list of sections, each playing a chord progression with one of a style's two grooves, plus two
  melody tracks. Grooves can be recorded and edited note by note. Owners of a QY70 can build its 128 preset
  styles from their own ROM image with a bundled tool; nothing of Yamaha's is included. The project has a
  browser emulator and a ten-lesson course. From 0.6 it can play through Bluetooth headphones and speakers, take MIDI
  in over Bluetooth and mix a computer's audio in over USB. From 0.6.3 a MIDI keyboard can play and record the selected instrument.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-polly
source_status: open
license: GPL-3.0-only
license_notes: >-
  Third-party parts (Sonivox EAS, Groove MIDI Dataset drum performances under CC BY 4.0) are credited in
  LICENSING.md. The shared fm1-base platform and felucca-bsp that Polly runs on from 0.5 are MPL-2.0.
homepage: https://charlesvestal.github.io/fm1-polly/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge; it also writes the factory styles, and Polly shows STYLES MISSING if they are absent. Songs are kept when updating, but 0.6 moves them to a new layout, so back them up first. QY70 styles are optional and need your own
  qy70main.bin, installed with tools/qy70_install.py.
brick_risk: false
tags: [sequencer, chords, midi, usb-midi, emulator]
image:
  url: https://charlesvestal.github.io/fm1-polly/img/manual/quickstart_song.png
  alt: "Polly Song page listing four sections of verse and chorus, with instrument tags, transpose, intro, ending and end settings"
  credit: "Charles Vestal"
  source_url: https://charlesvestal.github.io/fm1-polly/
  first_party: true
versions:
- version: 0.6.4
  date: 2026-11-13
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.6.4
  notes: The factory styles now travel inside the firmware package and the FM-1 writes them during the update, so the band also plays after an install from The Firmware Hub, M-UPGRADE or another tool, where it was silent before. USB audio recording is steadier. Songs carry over.
- version: 0.6.3
  date: 2026-11-11
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.6.3
  notes: Plays and records the selected instrument from a MIDI keyboard on the Band, Sound and Notes pages, over the MIDI jack, USB or Bluetooth. Songs carry over.
- version: 0.6.2
  date: 2026-11-06
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.6.2
  notes: Answers the installer in the way The Firmware Hub expects again, so the Hub finds the FM-1 after 0.6.1 made it report none. Nothing else changes.
- version: 0.6.1
  date: 2026-11-05
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.6.1
  notes: Works on newer FM-1s with the UC25HQ80 flash chip, which could not save songs, back up or install another firmware before. M-VAVE's M-UPGRADE 3.11 can now find it, installs write only the changed parts and resume after an unplugged cable, and the install page takes V16 as well as V15.
- version: '0.6'
  date: 2026-11-01
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.6
  notes: Adds Bluetooth audio to headphones and speakers (about 150 to 300 ms late), Bluetooth MIDI in, optional computer audio mixed in over USB and a battery indicator. Songs and slots move to a new layout on first start, so back them up first; going back to 0.5 hides them until a backup is restored.
- version: '0.5'
  date: 2026-10-17
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.5
  notes: Moves Polly onto the shared fm1-base platform; songs and settings carry over from 0.4.
- version: 0.4.3
  date: 2026-10-15
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.4.3
  notes: Works with the FM-1 Screen Reader, which speaks what the screen shows.
- version: 0.4.2
  date: 2026-10-14
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.4.2
  notes: Adds a setting to keep USB audio at full level regardless of the MASTER knob.
- version: 0.4.1
  date: 2026-10-13
  url: https://github.com/charlesvestal/fm1-polly/releases/tag/v0.4.1
  notes: Fixes the chords shown on Home after a song stops.
