device: m-vave-fm-1
name: POLY5
summary: >-
  Five-synth firmware on Dinghy: notes go round robin, at random, to all five or to one, with 24 factory patches, an
  arpeggiator, a step sequencer, lofi tape effects and eight master effects.
description: >-
  POLY5 is a subtractive synth firmware, first written as a Web Audio page and ported to the FM-1 on top of the Dinghy
  platform. Five synths with their own waves, envelopes, filters, noise and effects share the keyboard. Each note goes
  to the next synth in turn, to a random synth, to all five in unison, or to a single synth. Any synth can be silenced
  or skipped to change the rhythm of the rotation. The firmware has 24 factory patches that each carry a sequence,
  32 user slots, an arpeggiator with several styles, a step sequencer, and eight master effects including saturation,
  chorus, flanger and phaser, delay, reverb, bit reduction, a tape wow and flutter stage and a compressor. The
  repository includes a project page that runs the firmware compiled to WebAssembly, and a video manual in eleven
  chapters. Releases carry a prebuilt .fwsc, which a browser installer page puts on the FM-1; it can also be built with
  Docker, the JieLi toolchain and the AC79 SDK and installed with Dinghy's Python installer. The package id is FM-1_945.
status: active
authors:
