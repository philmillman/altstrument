source_status: open
license: GPL-3.0-only
license_notes: >-
  The repository has no top-level LICENSE file. Its README says GPL-3.0 as Dinghy does, and dinghy/LICENSE and
  dinghy/LICENSING.md state GPL-3.0-only. The Dinghy logo is all rights reserved by its designer and the Terminus font is
  SIL OFL 1.1. No stock firmware or SDK binaries are committed; the toolchain and JieLi SDK files are fetched at build time.
homepage: https://questron5000.github.io/poly5/
based_on: m-vave-fm-1/dinghy
distribution: browser-installer
install_notes: >-
  Use the install page in Chrome or Edge with the FM-1 on USB, or take poly5-1.2.fwsc from the release and install it with Dinghy's
  tools/fm1_install.py. To build it yourself, run `APP=poly5 ./build.sh` in the dinghy folder, which needs Docker, the JieLi toolchain and the AC79 SDK, then flash
  build/dinghy.fwsc with `python3 tools/fm1_install.py`. The loader checks the flash chip and refuses an unknown one before
  erasing anything; Dinghy's USB rescue (hold OCT- while switching on) restores a unit that does not start. Both the
  Puya P25Q80 and UC25HQ80 chips are supported.
brick_risk: false
