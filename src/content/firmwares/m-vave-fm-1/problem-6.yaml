device: m-vave-fm-1
name: PROBLEM 6
summary: >-
  Seven-voice analogue-style polysynth with poly mod, per-voice vintage drift, voice spread, reverbs including a long ambient one, chorus, a stereo delay, a low split, aftertouch, MIDI CC for nearly every knob and a two-track sequencer.
description: >-
  Each of the seven voices has two oscillators with a variable shape and hard sync, a triangle sub-octave, a noise source, a resonant high-pass into a four-pole ladder low-pass, and two ADSR envelopes. POLY MOD routes the filter envelope and oscillator 2 to oscillator and filter targets, VINTAGE gives every voice its own fixed detune, cutoff and envelope offsets, and VOICE SPREAD widens the chord across the stereo field. There are two tempo-syncable LFOs, an arpeggiator, unison and glide, and polyphonic aftertouch from the FM-1's keys. The effects are distortion, chorus, a stereo delay with modulation and reverbs (room, hall, plate, spring and a long ambient type with shimmer and swell). The low split and key scales come from OFFWORLD. The sequencer has two tracks of 64 steps with their own sounds, chords of up to seven notes, step and live recording, and a metronome. Nearly every knob answers a MIDI CC, using Sequential Prophet-6 numbers where that synth has the knob. The project has a browser emulator and a German manual. It is built on fm1-base and felucca-bsp. It was released as PROPHET 67 until 1.4.2 and renamed in 1.5; the README says it is unofficial and not affiliated with Sequential or Focusrite.
