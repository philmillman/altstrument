license: GPL-3.0-only
license_notes: >-
  README: GPL-3.0-only, because the updater includes attributed SLOOP and Felucca code; the original MIT parts keep
  their notices in LICENSE-MIT and THIRD_PARTY.md. Preview images keep their source repositories' licences in
  docs/licenses. No firmware package is committed; they are fetched from GitHub when asked.
homepage: https://github.com/Peeeweee/Project_FM1
distribution: source-only
install_notes: >-
  Needs Python 3.10 or newer and desktop Chrome or Edge; start it with Start.cmd and open the local address it prints.
  Blacksmith also needs Docker Desktop and a one-time tools/blacksmith/setup.py. Firmware installs go through the
  two-stage update flow with a typed confirmation, and the app saves the matching package to a local vault first. Writing
  the FM-1's firmware is at your own risk; nothing in the app touches the chip's boot area.
