install_notes: >-
  Download the .fwsc from a release and install it like any FM-1 firmware, for example with The Firmware Hub. The README says
  presets and the sequence are kept across updates. The platform's update loader is unchanged from fm1-base, and the project
  gives no further recovery steps.
