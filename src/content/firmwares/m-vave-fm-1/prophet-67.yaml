device: m-vave-fm-1
name: PROPHET 67
summary: >-
  Seven-voice analogue-style polysynth after the Sequential Prophet-6, with poly mod, per-voice vintage drift, voice spread, effects, a low split, aftertouch and a four-track sequencer.
description: >-
  Each of the seven voices has two oscillators with a variable shape and hard sync, a triangle sub-octave, a noise
  source, a resonant high-pass into a four-pole ladder low-pass, and two ADSR envelopes. POLY MOD routes the filter
  envelope and oscillator 2 to oscillator and filter targets, VINTAGE gives every voice its own fixed detune, cutoff and
  envelope offsets, and VOICE SPREAD widens the chord across the stereo field. There are two tempo-syncable LFOs, an
  arpeggiator, unison and glide, polyphonic aftertouch from the FM-1's keys, and reverbs, chorus and delay modelled in the
  Prophet-6's effect order. The low split and key scales come from OFFWORLD. Version 1.1 added four tracks of 64 steps with their own
  sounds, and 1.2 reworked them into two tracks. The project has a browser emulator and a German manual. It is built on fm1-base and felucca-bsp.
