device: m-vave-fm-1
name: PULSAR-8
summary: >-
  Drum machine firmware with a Roland TR-8S style workflow: 8 tracks on 16 step pads, 16 patterns with variations and fills, 110 drum voices, effects, snapshots with morph and MIDI clock. Not yet run on a physical FM-1.
description: >-
  The white keys act as the 16 step pads and the black keys select the instrument, with variations A to H, two fill-ins, flams, sub-steps, probability, per-track length and direction, motion recording, parameter locks and step loops. Half of the 110 voices are synthesised models in the style of classic analog drum machines, and half are vintage sample-machine kits played from CC0 recordings with a fixed sample clock and low bit depth. Two themes share every screen. It also has reverb, a tempo-synced delay, master effects, USB MIDI in and out, TRS MIDI in and USB audio input. The package can be installed over the stock firmware, over SLOOP or over itself. Installing it replaces SLOOP's saved projects, which share the same data area. The README states that this is a 1.0 beta that builds with the JieLi toolchain and passes the host tests, but that nobody has run it on a physical FM-1.
status: active
authors:
