  url: https://github.com/Nicodesy06
source: https://github.com/Nicodesy06/FM-1S---Roland-TR-8S-like-OS
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md covers the application code as GPL-3.0-only. The hardware layer and update loader come from SLOOP and
  Felucca (GPL-3.0-only). The drum recordings are CC0 (Versilian Studios VCSL) and the font is SIL OFL 1.1.
distribution: download
requires_stock: Any FM-1 firmware with the M-UPGRADE update path; the package works over stock V15, SLOOP or itself
install_notes: >-
  Install docs/firmware/pulsar-1.0-beta.fwsc with tools/fm1_install.py, or with the installer page in docs/installer/,
  which needs a secure context, so serve the docs folder locally or enable GitHub Pages for the repository (no hosted copy is live).
  The page checks the package identity and SHA-256 before writing. Hold OCT- alone while switching on to enter USB
  rescue. The README names the FM-1 Transporter with an RP2040 as the way back if even that fails. Back up SLOOP
  projects first, because the install replaces them.
brick_risk: true
tags: [drums, sequencer, groovebox, sampler, fx, midi, usb-audio]
