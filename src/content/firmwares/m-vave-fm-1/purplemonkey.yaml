device: m-vave-fm-1
name: PurpleMonkey FM-1
summary: >-
  Toddler instrument: any key plays a pentatonic FM note or a drum over a backing beat, with four animated
  animal friends on screen and no menus.
description: >-
  Rights warning: the repository bundles the 64 Casio CZ-1 factory tones as SysEx sound data, inherited from Melodee.
  Its licensing file states the rights stay with Casio and that no licence is granted.
status: active
authors:
- name: Quixotic7
  url: https://github.com/Quixotic7
source: https://github.com/Quixotic7/PurpleMonkeyFM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  The repository bundles Casio's CZ-1 factory tones (assets/cz1-factory) as sound data; LICENSING.md and the folder's
  README say no licence is granted for them by this project and that the rights stay with Casio.
homepage: https://quixotic7.github.io/PurpleMonkeyFM1/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer; update mode is OCT- + OCT+ + HOME held 5 s. Read docs/PURPLEMONKEY.md (Install,
  rollback) first. Browser emulator at /emu/.
brick_risk: false
tags: [performance, synth-engine, fm]
image:
  url: https://raw.githubusercontent.com/Quixotic7/PurpleMonkeyFM1/main/docs/img/pm_screens.png
  alt: "Collage of PurpleMonkey FM-1 screens"
  credit: "Quixotic7"
  source_url: https://github.com/Quixotic7/PurpleMonkeyFM1
  first_party: true
versions:
- version: '0.12'
  date: 2026-11-08
  url: https://github.com/Quixotic7/PurpleMonkeyFM1/releases/tag/v0.12
  notes: Marked pre-release. Accepts the second flash chip found in newer FM-1 units, so those can take updates, and fixes a crash on a slow flash erase. Playing is unchanged.
- version: '0.11'
  date: 2026-10-10
  url: https://github.com/Quixotic7/PurpleMonkeyFM1/releases/tag/v0.11
  notes: Marked pre-release; first public beta.
