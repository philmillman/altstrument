device: m-vave-fm-1
name: QChord-1
summary: >-
  Q Chord-style chord harp built on FoMni-1: the white keys are a strum plate and the black keys chord buttons, with EZ
  Play, Auto Chord and Chord Plus modes, 70 voices, chord sets, rhythms and a spring-back pitch bend.
description: >-
  Extends FoMni-1's Omnichord layout with the three play modes of the Suzuki QC-1: EZ Play (chords and strum plate
  only), Auto Chord and Chord Plus, which adds a rhythm-specific figure or, played by hand, the chord an octave up and
  the bass. The strum plate, the chord and Chord Plus each choose from 70 voices (piano, organs, guitars, strings, winds,
  synths, two sung vowels and two experimental sounds) with separate sustain, and Vibrato and Reverb switch on from the
  panel. PRESETS picks a chord set: each button's own chord, or every button as one type such as major, minor, 7th or
  blues, with roots along the circle of fifths. Thirteen rhythms are included, three of them added by this project.
  Notes arrive over USB and TRS MIDI, the chord can be played from a keyboard on channel 2, and the screen is described
  to the FM-1 Screen Reader. Both releases are betas.
status: active
authors:
