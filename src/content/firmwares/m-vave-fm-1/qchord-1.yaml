  url: https://github.com/Cyder465
source: https://github.com/Cyder465/fm1-qchord
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md, inherited from FoMni, states GPL-3.0-only and LICENSE is the GPL-3.0 text. Rhythm patterns, waves and
  drum sounds come from Chordian by Jan125 (CC0); a few files from fm1-base are MPL-2.0; the Barlow and Terminus fonts
  are SIL OFL 1.1. The release .fwsc files are the project's own builds, not M-VAVE stock images.
based_on: m-vave-fm-1/fomni-1
distribution: download
install_notes: >-
  Download qchord-0.2-beta.fwsc from the release and install it with the FM1 Manager page named in the README (Chrome or
  Edge, once it lists QChord-1) or with tools/fm1_install.py. FoMni's own installer installs only FoMni. The README says
  the FM1 Manager or FoMni's installer can put M-VAVE's firmware back, and that an FM-1 that keeps crashing starts in a
  safe mode.
brick_risk: false
