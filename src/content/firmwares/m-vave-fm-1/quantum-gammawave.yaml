device: m-vave-fm-1
name: Quantum GammaWave
summary: >-
  Fork of Pocket GammaWave with ten-voice polyphony, reworked saturation types, biquad EQ filters, a stricter
  installer and a Web Studio that falls back to a simulated device.
description: >-
  Takes the Pocket GammaWave (GW-1) firmware, itself built on JIANT FM and Felucca, and calls its own build QG-1.
  The additions in the repository's v1.4-QG notes are ten voices in place of eight with a voice-stealing rule that
  prefers quiet release tails, reworked drive types (TAPE, HEARTH, PLASMA, FLUX) in place of the older wave-shapers,
  fixed-point biquad peak and notch filters, a diagnostics window, and an installer with a SHA-256 check, a
  verify-only mode and an automatic backup, and later commits make it refuse any package without a signed build record. The synth engines, the 49-genre song generator, the TAKES reel,
  the shift deck and the Web Studio come from Pocket GammaWave. The README's later notes (v1.5 to v1.7) add a new
  power-on screen, CPU mode and visualizer-quality settings, a smooth random LFO wave, polyphonic aftertouch as a
  modulation source and a 200-sound library. The commits after that add a two-band Punch-in FX keyboard with latched mutes, flash and loader hardening, and a rebuilt project portal, Web Studio and emulator. The README now names v1.8.9 as the current build: its master EQ rounds instead of truncating, which fixes a DC offset and a shallow 20 Hz cut, and the repository gains a verified flash-backup tool and a restore tool that needs an external programmer. Many of the newer commits are authored by
  google-labs-jules[bot] and merged by the owner. The status document lists host, installer and web tests and
  records no hardware result for these changes. Like the parent it keeps songs and the FM6 user bank in the user
  sample flash, so user samples are lost.
