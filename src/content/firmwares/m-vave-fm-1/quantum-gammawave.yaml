- version: 1.8.5
  date: 2026-11-23
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.8.5
  notes: MORPH SCENES can take an end from another track (A and B from T1 to T6, copied by value) and the position is moved by CC 78, with CC 79 and CC 80 capturing the two ends. A pair made this way survives saving and power-off. The notes are in Spanish.
- version: 1.7.19
  date: 2026-11-22
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.7.19
  notes: The 1.12.18 tree republished as 1.7.19 under the numbering the author asked for, with the patch count continuing from 1.12.18 and nothing removed. The release notes say the installer offers the entry first in versions.json, which is ordered by publication, not by version string. The notes are in Spanish.
- version: 1.12.9
  date: 2026-11-22
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.12.9
  notes: Last listed of a run of releases from 1.8.0 to 1.12.9 over two days (1.12.10 to 1.12.18 follow), of which only the feature milestones are listed. It adds the TILT and LFO CURVE pages to the UI render test and regenerates the site screenshots, with no audio change. The notes are in Spanish.
- version: 1.12.6
  date: 2026-11-22
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.12.6
  notes: The ENV LOOP knob gains a ONE mode in which the envelope runs on into its release by itself at the sustain, so one key gives the whole note. Saved projects and presets sound the same. The notes are in Spanish.
- version: 1.12.5
  date: 2026-11-22
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.12.5
  notes: Adds LFO CURVE, which bends the LFO's phase so every wave changes shape (CC 77, a matrix destination and an EDIT page with a graph), and fixes the PLUK wave returning one count over full scale. It uses the last free parameter id. The notes are in Spanish.
- version: 1.12.4
  date: 2026-11-22
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.12.4
  notes: Adds TILT, a first-order high shelf on each voice with a fixed pole near 880 Hz and a range of -12 dB to +4.9 dB (CC 76, a matrix destination and an EDIT page). The notes are in Spanish and say no sample of existing sounds changes at zero.
- version: 1.7.0
  date: 2026-11-21
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.7.0
  notes: Adds MORPH SCENES, four scenes per track with STORE A and STORE B and a MORPH knob that moves the whole sound between them, outside the saved formats. Also fixes the tie between the 1 MiB flash copy and its unit when installing from an official V16. The notes are in Spanish.
- version: 1.6.0
  date: 2026-11-21
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.6.0
  notes: Gathers eight stages of work into one package. Adds a SYNC wave as the eighth PHASE wave, PEDAL and ALBERTI arpeggiator modes, HIJAZ and HUNG MINOR scales, dotted LFO divisions up to 1/64, a CHANCE view of the whole pattern's probability and a MOD MAP band showing where routes land, and fixes the audio test harness. The notes say installing from an official V16 unit is documented and tested as far as software can test it. The notes are in Spanish.
- version: 1.5.29
  date: 2026-11-21
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.5.29
  notes: Fixes the web installer rejecting every package published since 1.5.26 as damaged, because it looked for a fixed file name instead of the one in the build record. Installing from an official V16 unit now asks for the record of the 1 MiB dump with its SHA-256, and artifact names are checked as plain relative paths. Latest of a run of patch releases from 1.5.22 to 1.5.29 over two days, not listed separately, that include the installer reading M-Flasher's JSON record (1.5.26), a Web Studio EXPORT .MID of the generated song (1.5.27) and a larger text-ramp cache that stops frames rebuilding ramps (1.5.28). All the notes say no FM-1 was available, and they are in Spanish.
- version: 1.5.24
  date: 2026-11-20
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.5.24
  notes: Adds a PLUK LFO shape that falls as a pulse within each cycle, filter resonance as a modulation destination and NOTCH and SHELF filter types, without new parameter ids; saved presets load as before. The notes say it costs 196 bytes of image, were not tried on a unit, and are in Spanish.
- version: 1.5.21
  date: 2026-11-20
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.5.21
  notes: Installing from an official V16 unit now ties the required 1 MiB flash copy to the unit it came from, the installer's chip messages say whether the unit answered, and the Web Studio's sound lists match the firmware again. Last listed of a run of patch releases from 1.5.5 to 1.5.21 over two days (1.5.22 to 1.5.29 follow, see 1.5.29), not listed separately, that include a fix for GLO MONITOR rows overrunning their buffer (1.5.13), a six-track, twelve-voice load test with a fix for a load governor that cut release tails (1.5.17), and three new wavetable sounds with level matching of 11 factory presets (1.5.19). The notes are in Spanish.
- version: 1.5.18
  date: 2026-11-20
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.5.18
  notes: Adds four pattern operators to SEQ > TOOLS, EUCLID, MIRROR, THIN and CRESC, beside DUP, HALF, ROT, REV and CLEAR; they change what plays and leave each step's timing, gate and probability alone. The notes are in Spanish.
- version: 1.5.4
  date: 2026-11-19
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.5.4
  notes: Brings the 10 kHz timer interrupt back within its static budget, which had stopped the public site from being published since 18 November. The notes, in Spanish, say this work first went out as v1.6.0 and v1.6.1 and was renumbered 1.5.4 so the latest-version selection stays on one line; a different v1.6.0 release, dated 2026-11-21, now exists and is listed above. Latest of a run of patch releases from 1.5.0 to 1.5.4 over a day.
- version: 1.5.0
  date: 2026-11-19
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.5.0
  notes: Adds screen-reader support, announcing the screen, the HOME card value being turned, the loaded sound and top-bar messages over SysEx for the FM-1 Screen Reader project, silent when no reader is connected, and speeds up the monitor's note-on handling. The notes are in Spanish.
- version: 1.4.4.1
  date: 2026-11-18
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.4.4.1
  notes: Fixes MASTER > STEREO M/S, whose knob changed the selected track's FM3 release because both used parameter id 74. Latest of a run of patch releases from 1.3.7 to 1.4.4.1 over a day and a half, not listed separately, that include a MENU > EXTRA > BRIGHT panel brightness row (1.4.2), an audio test of POLY mode (1.4.4) and a flat HOME and visualizer fix (1.3.9). The notes are in Spanish.
- version: 1.4.0
  date: 2026-11-17
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.4.0
