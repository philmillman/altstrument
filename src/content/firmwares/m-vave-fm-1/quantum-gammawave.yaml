  notes: No tagged releases; this is the latest commit, which the README and changelog still call v1.8.9 (package identity FM-1_982). Since the last sha the installer identifies the flash chip and refuses to write a package that lacks a signed build record, and gains a read-only Verify only check; the HOME screen is redrawn and the master meter shows each channel. Later commits give the FX screens modules that hold real state, a delay display that reacts and a piano-shaped scale page, and make a new sound clear the latched punch-in map, the macros and the effect state; the rest is the project site, its install package and CI. The notes record host and emulator tests, not a unit.
