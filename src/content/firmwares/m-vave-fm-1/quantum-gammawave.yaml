device: m-vave-fm-1
name: Quantum GammaWave
summary: >-
  Fork of Pocket GammaWave with twelve-voice polyphony, six tracks, reworked saturation types, biquad EQ filters, a stricter
  installer and a Web Studio that falls back to a simulated device.
description: >-
  Takes the Pocket GammaWave (GW-1) firmware, itself built on JIANT FM and Felucca, and calls its own build QG-1.
  The additions in the repository's v1.4-QG notes are ten voices in place of eight (twelve voices, six tracks and eight engines in the 2.4.0 release) with a voice-stealing rule that
  prefers quiet release tails, reworked drive types (TAPE, HEARTH, PLASMA, FLUX) in place of the older wave-shapers,
  fixed-point biquad peak and notch filters, a diagnostics window, and an installer with a SHA-256 check, a
  verify-only mode and an automatic backup, and later commits make it refuse any package without a signed build record. Version 2.6.0 removed the Ed25519 signature check, and the 2.7.1 release is unsigned, checked by SHA-256 and size and a build record only. The synth engines, the 49-genre song generator, the TAKES reel,
  the shift deck and the Web Studio come from Pocket GammaWave. The README's later notes (v1.5 to v1.7) add a new
  power-on screen, CPU mode and visualizer-quality settings, a smooth random LFO wave, polyphonic aftertouch as a
  modulation source and a 200-sound library. The commits after that add a two-band Punch-in FX keyboard with latched mutes, flash and loader hardening, and a rebuilt project portal, Web Studio and emulator. Version 1.8.9 made the master EQ round instead of truncate, which fixes a DC offset and a shallow 20 Hz cut, and the repository gained a verified flash-backup tool and a restore tool that needs an external programmer. Version 1.9.0 is the first tagged release: a signed package that the installer checks against a pinned key. The release notes say a power cut during the app erase may leave the unit unable to boot and that recovery needs the chip's ROM mode and an external full-dump tool. Many of the newer commits are authored by
  google-labs-jules[bot] and merged by the owner. The status document lists host, installer and web tests; the 3.1.1 notes add an owner-reported install on two FM-1 units, which
  that environment did not observe. Like the parent it keeps songs and the FM6 user bank in the user
  sample flash, so user samples are lost.
status: active
authors:
- name: Guillel51
  url: https://github.com/Guillel51
source: https://github.com/Guillel51/Quantum-GammaWave
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, inherited from Pocket GammaWave and Felucca (copyright lines there name
  Frederic Valente and Leo Kuroshita). msfa is Apache-2.0, fonts are SIL OFL 1.1 and the Fukiai icon font is MIT.
  The repository carries no M-VAVE firmware; the installer's return to V15 asks you to pick M-VAVE's own file.
homepage: https://guillel51.github.io/Quantum-GammaWave/
based_on: m-vave-fm-1/pocket-gammawave
distribution: browser-installer
install_notes: >-
  Web installer in Chrome, Edge or Opera over USB. From another custom firmware, use its return-to-V15 option first,
  which also backs up flash. The v1.9.0 release carried a signed package; since 2.6.0 the packages are unsigned, and the installer checks the SHA-256, size and build record before it enables INSTALL. Back up
  any user samples before flashing.
brick_risk: false
tags: [synth-engine, sequencer, generative, fx, filter, editor, emulator, fork]
versions:
- version: 3.1.4
  date: 2026-11-14
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v3.1.4
  notes: The HOME bay changes from five concentric orbits to five fixed seats so that no two bodies' touch discs overlap. Latest of a run of patch releases from 3.1.1 to 3.1.4 that fix HOME animation and touch handling; the package is unsigned, checked by SHA-256 and a build record. The notes are in Spanish.
- version: 3.1.1
  date: 2026-11-14
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v3.1.1
  notes: The notes record the owner's report that this package was installed on two FM-1 units, one with a Puya and one with a UCUN flash chip. They state that this environment did not observe it and that no flash read, dump or recovery was tried.
- version: 3.0.1
  date: 2026-11-13
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v3.0.1
  notes: The release page gives one line, naming a HOME visualizer knob 1 focus and validated CPU optimizations, and carries no files.
- version: 2.9.4
  date: 2026-11-13
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.9.4
  notes: HOME has five screens, MAIN, VISUALIZER, OVERVIEW, MIX and PERFORM, and the other HOME screens' controls move to the EDIT, MOD, SYSTEM and FX pages. Patch releases 2.9.5 to 2.9.7 the same day add section backgrounds, interval names on the SCL page and a splash that runs the start-up stages one frame at a time.
- version: 2.9.3
  date: 2026-11-13
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.9.3
  notes: Adds a HOME > DYNAMICS screen that draws the selected track's envelope and each track's peak, and the repository's own icon glyphs. The release notes, in Spanish, call it a candidate package (610,959 bytes) and say 2.9.2 was published from an earlier commit without DYNAMICS.
- version: 2.9.0
  date: 2026-11-12
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.9.0
  notes: Gathers five phases of work into one package, namely measured optimisation, a redesigned HOME, WAVETABLE as an engine of its own, FLANGER as a third chorus type, a ROUTING screen and Firmware Hub readiness. The notes are in Spanish.
- version: 2.8.2
  date: 2026-11-12
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.8.2
  notes: Adds a fourth HOME screen, MIXER, with a level, pan and mute or voice row for each of the six tracks; it shows values the firmware already keeps, so saved projects load unchanged. The package is unsigned and checked by SHA-256 and a build record.
- version: 2.7.5
  date: 2026-11-12
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.7.5
  notes: Chord building for 5, 6 and 8-note scales ported from JIANT 0.8.3, a second HOME screen suite, M-WIDE power compensation, an audit of all 202 factory presets, and a fix for merge markers committed in the release checksum file. First package built from the tree with the JieLi toolchain and AC79 SDK (identity FM-1_965).
- version: 2.7.1
  date: 2026-11-11
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.7.1
  notes: Package felucca-v2.7.1.fwsc with identity FM-1_965 and a SHA-256 list; the notes say it is unsigned by design and relies on a hash and a build record, not a signature. Resolves merge-conflict markers that had broken the build of the version bump.
- version: 2.7.0
  date: 2026-11-11
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.7.0
  notes: Package felucca-2.7.0.fwsc with checksums. The notes list only a host-test change that brings the reverb reference model up to the damping curve.
- version: 2.6.0
  date: 2026-11-11
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.6.0
  notes: Splash screen cleanup and removal of the Ed25519 signature check; the release page carries no files.
- version: 2.5.0
  date: 2026-11-11
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.5.0
  notes: Merges the project's open branches, including the effects interface work. The page carries felucca.fwsc, the WebAssembly build and a manifest.
- version: 2.4.0
  date: 2026-11-10
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.4.0
  notes: Twelve voices, six tracks and eight synthesis engines, with revised DSP; the package is felucca-v2.4.0.fwsc with a signature manifest.
- version: 2.1.2
  date: 2026-11-10
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.1.2
  notes: Signed package with the project's own identity FM-1_965. The release page lists no changes beyond the comparison link; the commits since 2.0.0 add a LOFI panel, a bi-quad EQ curve readout, a 4, 5 or 6 track setting and master meters that read the master.
- version: 2.1.1
  date: 2026-11-10
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.1.1
  notes: Signed package; the release page lists only a comparison link. The commits fix the signed install channel so it accepts its own package again.
- version: 2.0.0
  date: 2026-11-10
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v2.0.0
  notes: Memory, DSP and UI optimization, installer provenance and authorization states clarified, support for the UCUN flash chip in the M-Flasher path, and releases built by CI from a tag.
- version: 1.9.0
  date: 2026-11-08
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.9.0
  notes: First release page, with the package felucca-v1.9.0.fwsc (identity FM-1_982), a signature manifest and checksums. The installer reads the flash chip, accepts only the two known chips, requires the signed record and prints its eight install states on screen. The visual pass on HOME, the punch-in map with a latch switch and the percent send display come with it. Later commits on main rework the installer's state panels and drop its browser preview; the notes record host and emulator tests, not a unit.
