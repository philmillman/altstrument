  date: 2026-11-17
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.3.6
  notes: Clears the six compiler warnings of the AC791N build without changing behaviour, re-measures the flash and RAM budget with 64 bytes of image space left, and brings the package, emulator, Web Studio, installer and README to the same version. Patch releases 1.3.1 to 1.3.5 over the same day and a half, not listed separately, add among other things see-through scope traces on the visualizer and a sound-based audit of the preset bank. The notes are in Spanish and say nothing was tried on a physical FM-1.
- version: 1.3.0
  date: 2026-11-16
  url: https://github.com/Guillel51/Quantum-GammaWave/releases/tag/v1.3.0
  notes: Redraws the first FX page across the whole panel, with larger send boxes and meters and larger EQ, DEPTH and SLICER bars. The notes are in Spanish.
