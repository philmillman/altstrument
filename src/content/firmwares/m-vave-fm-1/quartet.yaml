  others as listed in LICENSING.md.
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install quartet-X.Y.fwsc from the release with M-Flasher, after backing up the whole flash, or with tools/fm1_install.py
  over USB-MIDI. The unit then reports itself as FM-1_988. To go back, restore the M-Flasher backup or install M-VAVE's
  official firmware; songs sit in flash areas the stock firmware uses for presets, so without a backup the stock presets may
  need System, Reset Patches. Holding OCT- while switching on starts a USB rescue mode.
brick_risk: false
