device: m-vave-fm-1
name: QUARTET
summary: >-
  Four-track groovebox that plays like a four-piece band: lead, pad, bass and drums with 40 sounds, ten drum kits, five
  stompbox-style effect pedals, an arpeggiator, step and live recording and a song sequencer.
description: >-
  Each track has ten patterns of 16 to 64 steps with swing, and the lead and pad tracks have four voices each. Sounds come
  from a two-oscillator synth with a resonant filter, envelope and LFO, covering piano, brass, Hammond, theremin, strings,
  choir, handpan and several basses, and the ten synthesized drum kits range from Rock and Hip-Hop to CR-78, LM-1, 606, 808
  and 909 styles, with no samples. The pedals (reverb, delay, distortion, chorus, phaser) are drawn as stompboxes on screen.
  SUPER SEQ chains each track's patterns into ten songs, four save slots hold whole sessions and the current work is kept
  across power-off. The platform layer comes from Dinghy. The README says QUARTET has been made only for the FM-1; the
  SMK-37 board code inherited from Dinghy is untested.
status: active
authors:
