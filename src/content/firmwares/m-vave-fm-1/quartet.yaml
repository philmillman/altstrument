device: m-vave-fm-1
name: QUARTET
summary: >-
  Four-track groovebox that plays like a four-piece band: lead, pad, bass and drums with 72 sounds, 23 drum kits, 37
  stompbox-style effect pedals, an arpeggiator, step and live recording and a song sequencer.
description: >-
  Each track has ten patterns of 16 to 64 steps with swing, and the lead and pad tracks have four voices each. Version 2.0 grew the
  sounds from 40 to 72 and the drum kits from ten to 23, with your own saved sounds, and the pedals from five to a choice of
  37 (the release page says 30), four per instrument. The README lists pianos, organs, guitars, strings, choirs, basses and
  synths, and kits from Rock and Jazz to 808, 909 and a sampled Linn LM-1 (Sampling+ 1.0). Each pedal, such as drive, DJ
  filter, ring mod or a reverb, is drawn as its own boutique pedal on screen. Version 2.0 also adds beat repeat, a key
  lock, a step recorder with note length and expression, and pattern copy.
  SUPER SEQ chains each track's patterns into ten songs, four save slots hold whole sessions and the current work is kept
  across power-off. The platform layer comes from Dinghy. The README says QUARTET has been made only for the FM-1; the
  SMK-37 board code inherited from Dinghy is untested.
status: active
authors:
- name: MammothCheese
  url: https://github.com/MammothCheese
source: https://github.com/MammothCheese/quartet
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only. The platform parts carry the copyright of Leo Kuroshita, genkigenki and
  others as listed in LICENSING.md.
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  Install quartet-X.Y.fwsc from the release with M-Flasher, after backing up the whole flash, or with tools/fm1_install.py
  over USB-MIDI. The unit then reports itself as FM-1_988. To go back, restore the M-Flasher backup or install M-VAVE's
  official firmware; songs sit in flash areas the stock firmware uses for presets, so without a backup the stock presets may
  need System, Reset Patches. Holding OCT- while switching on starts a USB rescue mode.
brick_risk: false
tags: [groovebox, synth-engine, sequencer, drums, fx, arpeggiator, looper, fork]
