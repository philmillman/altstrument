versions:
- version: '0.11'
  date: 2026-11-26
  url: https://github.com/F0nski/quartz/releases/tag/v0.11
  notes: Adds a split keyboard that plays the scale's chords on white keys 1 to 7 and the melody on 8 to 16, chord modifiers on black keys 1 to 5 (7, SUS2, SUS4, ADD9, INV), chord names in the header and a STRUM on GLO KEYS. Projects from 0.10 load as they are.
- version: '0.10'
  date: 2026-11-21
  url: https://github.com/F0nski/quartz/releases/tag/v0.10
  notes: Adds PRINT, which writes a generative source's loop into steps, live transposition, Euclidean fills, x2 and NUDGE edits, SOLO, LATCH for punch-ins, FILTER and TAPE inserts, kit p-locks and PAN and INSERT as LFO destinations. Projects saved by 0.9 load, but 0.9 backups do not restore.
- version: '0.9'
  date: 2026-11-20
  url: https://github.com/F0nski/quartz/releases/tag/v0.9
  notes: Adds four projects (hold SAVE and press black key 2 to 5 twice to load one), backup and restore over USB, copy and paste of patterns and track sounds, undo and redo for CLEAR, draw and paste, FILL and !FILL trig conditions, and a LEN setting of 1 to 32 steps on ATLAS. Releases 0.8, 0.8.1 and 0.8.2 came earlier the same day.
- version: '0.8'
  date: 2026-11-20
  url: https://github.com/F0nski/quartz/releases/tag/v0.8
  notes: Adds CIPHER, a pattern source that uses bytebeat formulas (32 of them in four families) to decide each step's play, accent and note, and lets ATLAS play a chosen pad per part on a kit. Projects saved by earlier versions are not kept. Releases 0.8.1 and 0.8.2 only changed the online manual and the version number and are not listed.
- version: '0.7'
  date: 2026-11-18
  url: https://github.com/F0nski/quartz/releases/tag/v0.7
  notes: Changes voice stealing when all six voices are busy; a new note takes a released note first, then the oldest of its own track, and only then another track's held note, so a kit's hits no longer cut the chords of LATTICE, MOONS or CADENCE.
- version: '0.6'
  date: 2026-11-17
  url: https://github.com/F0nski/quartz/releases/tag/v0.6
  notes: Adds tap tempo, with GLO held and black key 1 tapped; from the second tap the tempo follows the mean of the last four gaps, from 40 to 240 BPM.
- version: '0.5'
  date: 2026-11-15
  url: https://github.com/F0nski/quartz/releases/tag/v0.5
  notes: IMPROV now starts with no phrase and stays silent until one is taught with REC, with REC TO TEACH on the screen. The package identity is FM-1_98000500.
- version: '0.4'
  date: 2026-11-15
  url: https://github.com/F0nski/quartz/releases/tag/v0.4
  notes: First GitHub release, package identity FM-1_98000400, installed with the web installer. Later commits add a random mode on REC with black keys 6 to 8 and an fmhub.json listing for The Firmware Hub.
