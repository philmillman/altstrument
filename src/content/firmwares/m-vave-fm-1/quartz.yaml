device: m-vave-fm-1
name: QUARTZ
summary: >-
  Four-track groovebox firmware with 24 sound models and a 16-pad drum kit per track, and pattern sources that write notes as
  they play: a drum map, Game of Life, polymetric lanes, chord progressions, a Tonnetz walk, orbiting moons and an improviser.
description: >-
  Each track has eight patterns and one sound, either one of 24 models (21 synths and 3 drums, built on Mutable Instruments
  Plaits code) or a kit of 16 drum pads. A pattern takes its notes from a 64-step grid you write, or from one of eight generators.
  Every page shows an animated scene that moves with the sound, and each domain is one button on the panel, in the manner of the
  OP-Z. Scenes group the four patterns and the mutes, a song is a list of scenes, and a project holds eight scenes, the tempo, the
  scale and the effects. Per-step parameter locks, punch-in effects, an arpeggiator with latch, an envelope and LFO per track, and a
  plate reverb are included. The project site has a browser emulator that runs the same code, a web installer and a manual. The
  site names version 0.2, while the repository has no tags or releases. The manual warns that an update can change the project
  format, so a project saved by an older version may not load.
status: active
authors:
- name: F0nski
  url: https://github.com/F0nski
source: https://github.com/F0nski/quartz
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README states GPL-3.0-or-later and LICENSE is the GPL-3.0 text. Mutable Instruments Grids (GPL-3.0) is included, Plaits,
  Marbles and the Clouds reverb are MIT, and fm1-base is MPL-2.0, with the files in patches/ under MPL-2.0 like the ones they
  change. The project site serves its own quartz-0.2.fwsc and a copy of the m-bootloader 1.2 package, not a stock M-VAVE image.
homepage: https://f0nski.github.io/quartz/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or fm1-base's fm1_install.py with the .fwsc from the project site. Take a backup
  first, since an install can erase what QUARTZ saved. The installer can write M-VAVE's own firmware back and offers m-bootloader
  as an optional extra. The site calls it an install at your own risk.
brick_risk: false
