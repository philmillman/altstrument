device: m-vave-fm-1
name: Quasar
summary: >-
  Six-track firmware modelled on the SOMA Pulsar-23, with 16 engine profiles over 147 sound families, internal
  routes, wreck and transform effects, a polymeter phrase generator and a performance mode, for experimental IDM.
description: >-
  Quasar models the Pulsar-23 as a whole instrument, with its bass drum, bass, snare and hi-hat circuits, shift
  register, LFO, clock dividers, effects processor and distortion, using an audio engine written from scratch for the
  FM-1 chip. Each of six tracks takes one of 16 engine profiles and draws sounds from 147 families, with four macros
  and four internal routes per sound. Pitch always follows the note played, so drums follow the scale. WRECK folds,
  rings and crushes every voice, TRANSFORM stacks drive and crush over random tracks, BREAK has ten ways of
  rearranging the pattern, and the phrase generator makes polymeters, ratchets and crossed Euclidean layers. There is
  also a looper, 16 patterns and sessions, MIDI learn and a PERFORMANCE mode.

  The control, sequencer and storage code comes from the author's Bigorna firmware, which is built on Tonitor, Felucca
  and SLOOP, and the dual-core start comes from Melodee. The README says the model follows the published behaviour of
  the Pulsar-23, uses no circuit values and has not been compared by ear with a real one. It does not state a hardware
  test, although its tools include a build that reports audio timing over USB MIDI. The second core renders about
  half of the sounding tracks.
