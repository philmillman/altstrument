source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for the firmware and its engine. Retained files keep their Felucca, SLOOP,
  Melodee and Bigorna notices. The website and logo are MIT, the fonts are SIL OFL 1.1, and the JieLi SDK files are
  read from your own SDK checkout at build time. The SOMA manual kept in the author's research copies is excluded from
  the repository.
homepage: https://nzimas.github.io/quasar/
distribution: browser-installer
install_notes: >-
  Browser installer in desktop Chrome, Edge or Opera over USB, then switch the FM-1 off and on once; or ./setup.sh and
  ./install.sh from the source on macOS or Linux. The README warns that an interrupted update can leave the FM-1 unable
  to start until it is recovered and that installing may void the warranty.
brick_risk: true
