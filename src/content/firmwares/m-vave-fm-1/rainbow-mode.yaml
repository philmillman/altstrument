device: m-vave-fm-1
name: Rainbow mode
summary: >-
  Music toy for small children, built on Felucca: every key shows its note in its own colour, 40 animal
  friends each bring a picture, sound and beat, with a volume limiter. Holding HOME and SAVE opens the
  full Felucca synth.
status: active
authors:
