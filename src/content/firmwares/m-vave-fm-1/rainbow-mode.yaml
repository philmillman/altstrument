  url: https://github.com/joshbartlettband-web
source: https://github.com/joshbartlettband-web/felucca-rainbow
source_status: open
license: GPL-3.0-only
homepage: https://joshbartlettband-web.github.io/felucca-rainbow/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer with an emulator; it can put V15 back. No numbered releases. An SMK-37 build
  exists (rainbow37).
brick_risk: false
tags: [performance, synth-engine]
