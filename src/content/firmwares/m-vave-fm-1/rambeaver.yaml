device: m-vave-fm-1
name: RAMBEAVER
summary: >-
  Side-scrolling action game for the FM-1: a beaver defends a dam, rides through a robot city and shuts down a boss, with synthesized music, effects and recorded character voices.
description: >-
  The first two white keys move left and right, and the last two jump and fire. The third white key from the right ducks or drops through a thin platform, and the black keys enter doors, call a posse and throw a firebomb. Progress saves queue until Pause or death, and the README asks for a pause before power-off. A fresh run with no damage, death or retry and every enemy defeated unlocks a golden ending. The platform descends from Felucca by way of X0X and FoMni, and only Felucca's ANALOG and NOISE DSP excerpts are used. The repository holds the firmware package FM-1_745, a source archive, a quick-start PDF and checksums. The source also includes a browser viewer that can mirror a connected unit and a macOS recorder that exports device video with USB audio. The README says the package was installed and verified on an FM-1 and that the source rebuilds it.
status: active
authors:
