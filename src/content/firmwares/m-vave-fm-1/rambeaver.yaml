  url: https://github.com/adamcharleswilsonmusic-code
source: https://github.com/adamcharleswilsonmusic-code/RAMBEAVER
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for the project source. The song score and eight voice clips come from the author, who authorized their public distribution; the song itself is not identified and no separate media licence is declared. The beaver image was generated with an image tool. Terminus and Barlow fonts keep their SIL OFL texts, and three opaque JieLi AC79 SDK package inputs in vendor/ac79 are bundled under the SDK's Apache-2.0 notice without an independent audit.
based_on: m-vave-fm-1/felucca
distribution: download
install_notes: >-
  Download the .fwsc from the release page, or clone the repository, and install with tools/fm1_install.py in a Python environment over USB-MIDI. The installer asks before writing, checks the package and verifies the restarted identity (FM-1_745). Stop any recording and the browser viewer's Follow FM-1 mode first. The release notes say the package was installed from M-VAVE V15 and from Spring Poly 1.4 and switched back to both.
brick_risk: false
