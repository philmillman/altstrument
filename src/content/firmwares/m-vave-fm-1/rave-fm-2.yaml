device: m-vave-fm-1
name: RAVE FM 2
summary: >-
  Early hardcore groovebox: six tracks of kicks, sliced breaks, a 909 kit, bass, rave leads and hoovers, with sidechain, live FX on the keys, patterns, song mode and live recording.
description: >-
  Any of the six tracks can take any machine. The kicks are presets with their own pitch, shape, distortion and envelope, and breaks are sliced and played in time. Melodies run to 128 steps, with four patterns in the current README, a song mode and live recording. Every track is sidechained to the kick, and holding FX turns the keys into risers, drops, rolls, filters, kill bass, snare bar, mutes and tape stop. Projects are saved with names, and there are colour themes and an animated character on each page. It is built on Felucca and JIANT FM. The author says the kick, 909 and break samples come from royalty-free packs found online and states holding the permission to redistribute them.
status: active
authors:
- name: MorrisKraken
  url: https://github.com/MorrisKraken
source: https://github.com/MorrisKraken/ravefm2
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSING.md state GPL-3.0-only and the LICENSE file is the GPL-3.0 text. It keeps Felucca's and JIANT FM's notices, with msfa (Apache-2.0) in the FM6 engine and font licences in LICENSES/. The sample packs are credited only as royalty-free packs found online, with the author answering for the redistribution permission.
based_on: m-vave-fm-1/jiant
distribution: download
install_notes: >-
  Install RAVEFM2.fwsc from the release like any FM-1 firmware; the update loader is in the package. The README says going back to M-VAVE's V15 or another firmware works the same way. Building on Windows needs JieLi's toolchain.
brick_risk: false
