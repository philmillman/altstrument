  notes: WEFT blocks can be moved along the patch with EDIT and KNOB 1, and their cords, settings, locks and scene copies move with them. 1.23.1 before it made KIND ask for a second turn before replacing a hand-edited sound.
- version: 1.23.0
  date: 2026-11-07
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.23.0
  notes: Black key 11, pressed twice on a WEFT patch or block page, takes every cord off a block while keeping its settings.
- version: 1.22.0
  date: 2026-11-06
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.22.0
  notes: Moves more per-sample audio work from flash into RAM, lowering the first core's audio load with the same output.
- version: 1.21.1
  date: 2026-11-06
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.21.1
  notes: Runs the track mix and sends from RAM to cut both cores' audio load, fixes a WEFT track's label, and boots and plays each release in an FM-1 emulator before it ships. 1.21.0 was tagged but not released.
- version: 1.20.0
  date: 2026-11-06
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.20.0
  notes: Adds a BUFFER SAFE setting that renders one audio block ahead so a busy block does not drop out, at the cost of about 11.6 ms of delay, and a GLO CPU 2 page with tests for finding what slows the FM-1. WEFT and the SPACE reverb do less work; the reverb differs by a small amount under the signal.
- version: 1.19.0
  date: 2026-11-05
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.19.0
  notes: Shares the effect buses between both cores and lets the BED fade out and stop computing when nothing has played for four seconds. The sound is the same.
- version: 1.18.0
  date: 2026-11-05
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.18.0
  notes: WEFT runs its blocks sixteen samples at a time and the second core takes whole tracks with their effects, for less work with the same sound. Adds a WEFT RATE page (full or half rate). WEFT's random blocks now draw their own dice.
- version: 1.17.1
  date: 2026-11-05
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.17.1
  notes: Fixes an install leaving the second core off on the first boot, and redraws the start screen as TV static that runs smoothly.
- version: 1.17.0
  date: 2026-11-05
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.17.0
  notes: Adds an overload relief that eases the delay's grains and new WEFT notes in steps instead of letting the audio crackle, a SKIP SILENT setting that stops computing muted tracks, a per-track CPU view on the GLO page, and a sidechain input for the compressor that can listen to the mix or any of tracks 1 to 7. WEFT's voice loop now runs from RAM.
- version: 1.16.2
  date: 2026-11-05
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.16.2
  notes: The release page lists only files. The commit it tags changes how voices are split between the FM-1's two cores, giving the costliest voices to whichever core would finish sooner, so one heavy WEFT patch no longer overloads the first core while the second idles. The sound is the same. Version 1.16.1 fixes an install leaving the second core off on the first boot.
- version: 1.16.0
  date: 2026-11-05
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.16.0
  notes: The release page lists only files. The commits since 1.15.0 add a RUN setting to WEFT tracks (ALWAYS keeps a voice running with no key held, for drones and self-clocking patches), move more WEFT blocks into RAM, make WEFT LIBRARY's SAVE put the patch in a free slot and mark which patches are the bank's own, and drop the hidden game for flash space.
- version: 1.15.0
  date: 2026-11-04
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.15.0
  notes: The release page lists only files. The commit it tags adds a frequency shifter block (SHIFT) and a DIODE clipper block to WEFT, and a THREE LOOPS factory patch.
- version: 1.14.0
  date: 2026-11-04
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.14.0
  notes: The release page lists only files. The commit it tags turns the FM engine into HYBRID FM, with an envelope on the modulators and formants after the Yamaha FS1R, and the commit before it adds AUDIO and SEQ OUT blocks to WEFT and puts WEFT voices on the second core.
- version: 1.13.0
  date: 2026-11-04
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.13.0
  notes: The release page lists only files. The commits since 1.12.0 give the start screen a failing-VHS-tape look and make SAVE on WEFT LIBRARY always work, with INIT and CLEAR keys added.
- version: 1.12.0
  date: 2026-11-03
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.12.0
  notes: The release page lists only files. The commits since 1.11.0 add more WEFT blocks, among them sequential switches, string, chaos, crush, edge, follow, shape, Chebyshev, formant, vocoder, ring modulation, noise, Rungler and Lissajous. Versions 1.10.0 and 1.11.0, released the same day, add the WEFT library page and a start screen that melts, and widen WEFT to twelve blocks.
- version: 1.9.0
  date: 2026-11-03
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.9.0
  notes: The release page lists only files. The commits since 1.8.0 add WEFT, a track kind whose voice is patched from blocks with two inputs each, on FM-1 pages and in the emulator's patcher, along with a looper tab in the emulator and a phone layout for its page.
- version: 1.8.0
  date: 2026-11-02
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.8.0
  notes: The release page lists only files. The commits since 1.7.0 add an animated start screen, a storm of dust that gathers into the RAVEL name.
- version: 1.7.0
  date: 2026-11-02
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.7.0
  notes: The release page lists only files. The commit it tags merges the GLITCH LOOPER, a looper with four lanes of recorded audio, into the main firmware. Voice stealing also spares lone held notes.
- version: 1.6.0
  date: 2026-11-02
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.6.0
  notes: The release page lists only files. Its commits add a MUTE / SOLO page after the mixers, a STAY option for step recording and loading of a track of an unknown kind as a blank synth.
- version: 1.5.0
  date: 2026-11-01
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.5.0
  notes: The release page lists only files. Its commits since 1.4.1 let PRESETS move the step the knobs edit on the step pages, set note length while step recording, add a help screen while HOME is held and add a TAKE function that keeps what you play in a pattern.
- version: 1.4.1
  date: 2026-10-31
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.4.1
  notes: The release page lists only files. The commit it tags makes HOLD adopt the keys already held when it is switched on, so a held note or chord keeps sounding after release.
- version: 1.4.0
  date: 2026-10-31
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.4.0
  notes: The release page lists only files. Its commits add MIDI control of the knobs (CC 70 to 73 and a MIDI LEARN page) and a panel backlight setting.
- version: 1.3.0
  date: 2026-10-30
  url: https://github.com/De-Pattern/Ravel_FM1/releases/tag/v1.3.0
  notes: Adds MIDI pitch bend as a modulation matrix source. Also carries the command to empty a project slot from 1.2.1.
