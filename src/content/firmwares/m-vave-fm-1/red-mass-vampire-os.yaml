device: m-vave-fm-1
name: RED MASS VAMPIRE OS
summary: >-
  Felucca fork with a red interface, six tracks (five instruments and drums on track 6), 256 built-in sounds, 32 song rows,
  twelve performance tools and two trap drum kits, plus a Windows editor and installer bundle.
description: >-
  Built on Felucca's platform, with a redrawn red interface and bold fonts. It has six tracks sharing eight voices, 256
  built-in sounds including eight sampled grand-piano variations, 32 editable user slots and 64 steps per track. A song mode of
  32 rows draws on four project sources, and the added tools cover automation, scenes, macros, step locks, per-pad drum chance,
  microtiming, mute groups, sound mutation and undo. Two trap drum kits, NIGHT TRAP and RAGE TRAP, are new. The 0.5.2 beta
  revoices 216 factory presets in a darker style and leaves the 32 bass and 808 sounds, the eight percussion presets and both
  kits as they were. The release carries a Windows bundle with the editor and installer. The author's notes say the physical
  FM-1 install, timing and sustained load were not yet qualified.
