install_notes: >-
  Download the .fwsc from the release, or the Windows bundle that holds the installer, editor and a rollback. Back up all
  projects, sounds and samples first: older four-track projects are migrated, and saves made in the new format need this
  firmware. Select a factory preset again after updating, since saved projects keep their old sound settings.
