device: m-vave-fm-1
name: REGENT-4
summary: >-
  Harmonic conductor for the FM-1: play chords on the keys and a pad, a bass, two arpeggiating motifs and a beat
  follow them.
description: >-
  The white keys are the degrees of the key, so every chord is in key, and the black keys colour it with 7th, sus2,
  sus4, add9, 6th, major/minor flip or flat five. A pad voice-leads through the changes, a bass plays one of eight
  figures from the root, two motifs arpeggiate the chord at their own rates and a beat with six grooves runs under
  them. Chords change at once, on the beat or at the bar. A progression of 16 chords is recorded by playing it with
  REC and then replays from SEQ, and PRESETS changes key on the fly. The screen shows the chord name and numeral large
  above the part settings. It has its own 8-voice synth and drums, sends MIDI over USB and Bluetooth, and can send or
  follow MIDI clock. The README names the Conductive Labs NDLR as a model.
status: active
authors:
