install_notes: >-
  Build it yourself with the JieLi toolchain and AC79 SDK (BUILDING.md); no package is published. The author
  installed it once with tools/fm1_install.py over stock V15, marks physical recovery as untested and points to
  Felucca's installation wiki and the FM-1 transporter for recovery.
