device: m-vave-fm-1
name: REGGAE-OS
summary: >-
  Early Felucca 1.6.1 derivative that adds a bank of 15 reggae presets (organ, bass, melodica, piano, trumpet, sirens, drums), four-knob editing and
  animated instrument screens. One install on a real FM-1 is recorded; sound and controls are still unchecked.
description: >-
  Adds a sound bank of 15 presets, including Roots Organ, Rocksteady, Deep Roots and Digital Bass, a reed melodica,
  electric piano, a sampled trumpet, three sirens and a drum kit, on top of Felucca's unchanged engines,
  with a home screen that edits four parameters per sound and animates the selected instrument. Later builds add
  loop recording and overdubbing, song arrangement, a four-track mixer, sixteen punch-in pads with persistent punch-in FX, per-step note and drum velocities, a one-key chord garden,
  automatic chord voice leading per track and an optional CC0 percussion pack. Felucca's other engines, effects, sequencing, MIDI and user presets are kept. The
  README calls it an early development build. A hardware test report dated 28 October records one successful
  install on an FM-1 that ran V15; screen, sound, controls and recovery on the unit are still listed as pending. A browser build of the emulator is hosted on GitHub Pages; the public
  Felucca installer does not install this firmware.
