device: m-vave-fm-1
name: ReplicantFM1
summary: >-
  Acid and techno groovebox on the X0X platform: a TR-909 drum kit, a modelled SH-101 mono synth, two TB-303 basslines
  with a generator, a slicing break player, song mode, parameter locks and a master pump compressor.
description: >-
  Each part has its own step length of up to 64 steps, clock rate and drift, and every step can carry a probability
  or condition. Knob movements can be recorded or locked to steps, patterns chain into songs, and the mix runs through
  a shared reverb, a tape-style delay and a master drive, filter and sidechain pump keyed from the kick. The SH-101
  engine is the project's own, while the 909, 303, generator and break engines are ports of other open projects. The
  work is split across the FM-1's two cores, and the screens use a green virus-themed look with a boot splash. Its
  LICENSING.md still describes the tree as X0X, a fork of Felucca.
