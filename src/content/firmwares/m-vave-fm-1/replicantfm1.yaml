license_notes: >-
  README and LICENSING.md give GPL-3.0-only, inherited from X0X and Felucca. Ported parts keep their own licences:
  9W9 and ER-99 (GPL-3.0), Open303 (MIT), TB-3PO (GPL-3.0), BB Gen, used with the author's permission, and MPL-2.0
  files from fm1-base. The fonts are SIL OFL 1.1. The committed ReplicantFM1-2.0.0.fwsc is the project's own build.
homepage: https://danimanx.github.io/ReplicantFM1/
distribution: browser-installer
install_notes: >-
  Open the installer page in Chrome or Edge with the FM-1 on USB, or run tools/fm1_install.py with the .fwsc from the
  repository. A backup and restore page and a break loop uploader are on the same site. The README does not describe
  a recovery path.
