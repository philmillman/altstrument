homepage: https://gggguto.github.io/ReVo/
distribution: browser-installer
install_notes: >-
  Open the Firmware page in Chrome or Edge with the FM-1 on USB; it checks the package identity and SHA-256 before updating. The release also has the .fwsc, release.json and the source zip. Samples are written from the sample editor page, with Atolls chosen first. The README says recovery instructions are on the install page.
