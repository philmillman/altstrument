device: m-vave-fm-1
name: ReVo
kind: firmware
summary: >-
  Generative soundscape instrument with two machines: Bioma, a synthesized ecosystem of birds, insects and water, and Atolls, two independent sample loops; includes a browser sample editor.
description: >-
  Bioma lets birds, insects and water answer each other while wind, drift, beam and resonance shape the scene. Atolls plays two sample loops with movable windows, played Fragments, Landing destinations and Flock and V Format moves between them. Both machines use a dual-core engine and effects pipeline. MIDI notes and CCs are mapped for Bioma on channels 1 to 7 and separately for Atolls; MIDI control starts off and clock is chosen apart from it. The sample editor crops a WAV to 7.384 seconds, previews the ADPCM result and writes it to one of four slots. The site has a field guide and a manual. Built on Felucca and SLOOP.
status: active
