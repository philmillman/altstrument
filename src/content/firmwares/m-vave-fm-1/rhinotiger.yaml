device: m-vave-fm-1
name: RhinoTiger
summary: >-
  Generative psytrance firmware for the FM-1, from dark psy to hi-tech, that plays itself on a sixteenth grid in eight worlds while four macro knobs, a mixer, one-shot keys and sixteen performance effects steer it.
description: >-
  A kick, a rolling FM bass, percussion, a repeating line, one-shot sounds and a held atmosphere play together in eight worlds, from 145 to 186 BPM, picked with the presets button. The four macro knobs on the main page are Energy, Detail, Dark and Drift, and further pages set the groove, breaks, builds and drops, each part's sound, a mixer with mutes, and an echo. The white keys throw one-shot sounds into the music, the black keys turn them into rhythms, and on the echo page the keys become sixteen effects played while held. REC loops what the keys throw for up to four bars. AUTO PLAY performs a whole set by itself, for a chosen number of minutes. The README says it reads nothing another firmware saved and advises backing up first. The project site has a browser emulator and installer, and the manual is in English and Japanese.
status: active
