homepage: https://hacha.github.io/rhinotiger/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Install from the project site in a WebMIDI browser, or with install.sh from a clone with submodules; releases attach .fwsc and .rfm1 packages and a firmware.json. The README does not describe a recovery path of its own; the FM-1's ROM boot mode applies. It advises backing up first, because projects, presets and samples from other firmwares are not read and may be gone when switching back.
