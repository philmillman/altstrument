device: m-vave-fm-1
name: Rhizome
summary: >-
  Ambient firmware derived from Monades and Mutable Dreams, built around a Kepler-style orbital sequencer, Beads
  granular synthesis, a hall reverb and a tape delay. Simulator and source only; not yet run on an FM-1.
description: >-
  Written as the companion to Monades, which handles the notes, so that Rhizome handles space and time. Up to four
  bodies orbit a star, and each time one crosses a gate on its orbit it triggers a note, a grain cloud, a chord or a
  sound change. The orbits are ellipses, so the beats speed up and slow down as a rubato, conjunctions work as
  accents, and moons add ornaments. Real planetary systems can be loaded. Around the sequencer are the Beads granular
  processor from Mutable Instruments, a large 1980s-style hall reverb and a tape delay with reels drawn on the
  screen, plus 18 scenes called Mondes, a blank nineteenth and the Monades scales. Eight Plaits-based engines (string machine, wavetable, wave terrain, six-operator FM, swarm, phase distortion, chords and formant) replace the voices inherited from Monades. The manual and the roadmap are in French.

  The README dates its state to 2 November 2026 and says the orbital sequencer, tape delay, HALL and Beads run in the
  browser simulator, that Rhizome has not been compiled or measured on an FM-1 and that it should not be installed
  yet. The commit log records five compilations for the FM-1, the last with a message calling it the version to install, but no package
  is committed and there are no releases. It is derived from Monades by the same author, which is in turn a fork of
  Mutable Dreams.
