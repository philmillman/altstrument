device: m-vave-fm-1
name: Rhizome
summary: >-
  Ambient firmware derived from Monades and Mutable Dreams, built around a Kepler-style orbital sequencer, fourteen
  synth voices, Beads granular synthesis, a hall reverb and a tape delay. The README reports it measured on an FM-1;
  there is no release package yet.
description: >-
  Written as the companion to Monades, which handles the notes, so that Rhizome handles space and time. Up to four
  bodies orbit a star, and each time one crosses a gate on its orbit it triggers a note, a grain cloud, a chord or a
  sound change. The orbits are ellipses, so the beats speed up and slow down as a rubato, conjunctions work as
  accents, and moons add ornaments. Real planetary systems can be loaded. Around the sequencer are the Beads granular
  processor from Mutable Instruments, a large 1980s-style hall reverb and a tape delay with reels drawn on the
  screen, plus 30 scenes called Mondes in nine families, and an empty thirty-first, along with the Monades scales.
  Fourteen synth voices replace the set inherited from Monades, most of them from Mutable Instruments' published code;
  two are added for pads, a six-operator FM voice that plays 96 DX7-style patches from Plaits and a string machine.
  The 0.1.0 commits add a MORPH that travels between two stored orbital systems, a DERIVE mode that lets the playing
  system drift away from a pale home system, and a start screen of a star and six bodies. The manual and the roadmap are
  in French.

  The README says the firmware was measured on an FM-1 at 61 to 78 percent of the processor at the busiest point for each
  Monde, with no dropouts and an 85 percent limit, and gives the build for version 0.1.0 (package identity
  FM-1_968000100) and a USB install command. No package is committed and there are no releases or tags. It is derived
  from Monades by the same author, which is in turn a fork of Mutable Dreams.
