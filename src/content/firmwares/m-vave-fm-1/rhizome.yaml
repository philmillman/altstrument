license: GPL-3.0-only
license_notes: >-
  LICENSING-GPL.txt states that the combined distribution is GPL-3.0-only, with the MIT notices of Mutable
  Instruments (Plaits, Rings, Elements, Clouds, Beads and stmlib), the MPL-2.0 notices of fm1-base and felucca-bsp,
  and the font notices kept. The repository still holds the Mutable Dreams 1.1 package and source archives inherited
  from its parent; they are not M-VAVE images.
homepage: https://dr-john-8bits.github.io/rhizome/
distribution: source-only
install_notes: >-
  Nothing is released. The README says not to install it for now, and BUILDING.md covers only the inherited Mutable
  Dreams build. The inherited fm1-base installer page links M-VAVE's V15 file for returning to stock. Back up the
  FM-1 first if you build it yourself.
