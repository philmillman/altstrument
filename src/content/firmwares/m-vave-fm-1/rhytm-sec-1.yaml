device: m-vave-fm-1
name: RHYTM-SEC-1
summary: >-
  Generative drum machine and bass synth built on PERF-1's drums and bass: 19 styles that draw patterns from hit probabilities, sections and fills, USB stems and MIDI clock sync.
description: >-
  Patterns are drawn from each style's hit probabilities instead of stored presets and keep evolving unless locked, with density, complexity and
  evolve controls. The bass follows a root and scale with chord moves, drums have their own level, tune, decay and kit, and breakdown, build, drop and fill buttons work on
  the next bar. USB audio carries a stereo master plus mono bass, kick, snare with clap, and hats with percussion stems, and MIDI clock sync follows a DAW's song position. It is built on fm1-dock's platform
  as a single app, and each release also ships an fm1-dock module. Bluetooth MIDI is left out of the standalone build. The release notes say the 1.1 build was tried on a real FM-1 with the UC25HQ80 flash chip.
status: active
authors:
