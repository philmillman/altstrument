  url: https://github.com/hamperj
source: https://github.com/hamperj/rhytm-sec-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only. The drum and bass engine comes from deamonSLINKY's PERF-1 (itself from HYP-1 and AMB-1), the platform from fm1-dock on Felucca and Dinghy, under their own notices.
homepage: https://hamperj.github.io/rhytm-sec-1/cheatsheet.html
distribution: download
install_notes: >-
  Download the .fwsc from a release and install it with an FM-1 flash tool; the standalone firmware identifies itself as FM-1_947. Holding OCT+ at power-on starts a safe mode, and any other firmware can be flashed
  the same way to go back. The .dock file is for fm1-dock users.
brick_risk: false
