license: GPL-3.0-only
license_notes: >-
  LICENSE.md is M-VAVE's FM1 APP licence text, with M-VAVE's copyright line. It is GPL-3.0-only with an extra
  section 7 permission to link the binary FM1 SDK, whose components keep the terms in the SDK's THIRD_PARTY.md. The
  committed dist/RIDDIM_ROOTS_v0.3.0_update.html is the SDK's offline update page and carries M-VAVE's V15 recovery
  image, which decodes to the licensed FM-1_015 package (699,956 bytes, git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd,
  Apache-2.0 from m-vave/fm1_open). The lion artwork was supplied by an unnamed user, and THIRD_PARTY.md and
  assets/lion/README.md say the supplier's rights apply, so no licence for it is recorded. fm1-emu in demo/emulator is MIT.
homepage: https://github.com/tskorbenko/riddim-roots-fm1
distribution: download
install_notes: >-
  Open dist/RIDDIM_ROOTS_v0.3.0_update.html in Chrome or Edge. The page bundles the firmware, M-VAVE's V15 for
  rolling back and the official USB-MIDI update protocol with CRC checks, and the README says it can be rebuilt with
  the SDK on Windows. Back up projects and samples first. The user manual in docs/INSTRUKTSIIA_UA.md has the safety
  rules.
brick_risk: false
