device: m-vave-fm-1
name: RIDDIM ROOTS
summary: >-
  Generative reggae and dub band on M-VAVE's FM1 Open SDK: six players, 11 styles, an evolve control, a dub effects
  lab, an animated lion screen and Alesis Vortex Wireless 2 mapping. Emulator-tested only.
description: >-
  Six players (drums and percussion, bass, skank, organ, horns or lead, piano) follow a harmony and arrangement
  that move through intro, verse, chorus, dub, break, build, drop and outro. The 11 styles run from ska and
  rocksteady to digital dancehall, ragga jungle and dub techno. EVOLVE sets how much the music changes, with
  keep, reject, mutate and recall controls, and style changes happen without stopping. Other parts are 27
  instruments built from DX7-format voices, Karplus-Strong guitars, a 303 voice and 808 kits, eight keyboard
  modes, a 24-effect dub lab with tape echo, tape stop, rewind and siren, and an animated Lion of Judah on the
  screen. A MIDI map covers the Alesis Vortex Wireless 2 with fader banks, pads and ribbon.

  It is a new implementation on the official FM1 Open SDK, not derived from earlier community firmwares, and it
  does not link M-VAVE's 128-voice DX7 bank to fit the size limit. The documents are in Ukrainian. The README and
  LIMITATIONS.md say it has not been flashed to or tested on any FM-1: all checks ran in the fm1-emu emulator, the
  sound was judged by measurement, and the MIDI wiring to the Vortex is unverified. M-VAVE's online workbench
  accepts only its own built-in firmwares, so installing needs the offline update page.
status: active
