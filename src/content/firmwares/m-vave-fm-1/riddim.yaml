license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, kept from GR!MM, Dinghy, Felucca and SLOOP. msfa is Apache-2.0, the DaisySP and Rings parts are MIT, the factory samples are CC0 1.0, and the fonts are SIL OFL 1.1. GR!MM's choir wavetables (CC BY 4.0) were removed in 0.1. tests/data holds a 24 KB binary save fixture, and no M-VAVE firmware image is in the repository.
homepage: https://saulofilho.github.io/riddim-fm1/
based_on: m-vave-fm-1/grimm
distribution: source-only
install_notes: >-
  There is no release. The README says 0.1 has not been on an FM-1, and that building it with the JieLi toolchain gives riddim.fwsc, which tools/fm1_install.py can install at your own risk. It says the FM-1 Firmware Hub's Rescue page brings a stuck unit back, with OCT- held while switching on. The browser emulator runs the firmware without a device.
