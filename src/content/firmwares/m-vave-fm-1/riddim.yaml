device: m-vave-fm-1
name: RIDDIM
summary: >-
  Roots reggae groovebox derived from GR!MM, in development: a synthesized 20-drum roots kit with eight drummer styles, band lines over a held chord and 35 roots sounds, with the dub desk planned but not built.
description: >-
  Version 0.1 replaces GR!MM's voice source with a DRUM source of 20 synthesized drums on 27 keys in four kits, with tune, decay and a HUMAN control that plays behind the beat, and nine factory kits. GROOVE is a drummer that plays eight styles by itself while the sequencer runs (one drop, rockers, steppers, flyers, rocksteady, early reggae, rub-a-dub and dub), with split parts, fills every 2, 4 or 8 bars and swing. The arpeggiator gains band lines over the chord held, namely skank, organ bubble, one-drop bass, steppers bass and horn answers, played slightly behind the beat. There are 35 roots sounds, a new boot screen with a turning record, and a HOME screen drawn as a sound system with one speaker per track. Underneath is GR!MM's groovebox with four tracks, a 64-step sequencer per track, tape, grain, delay, reverb, song mode and MIDI. The project has a browser emulator, an editor and a live view that draws a connected FM-1. The dub desk with spring reverb, tape echo, throws and an automatic VERSION is a plan in the repository. The README says it is not released and has not been tested on an FM-1, and it uses its own package identity and its own saves. It is a modified GR!MM 2.0.2 and so also descends from Dinghy, Felucca and SLOOP.
