device: m-vave-fm-1
name: RoboSeq
summary: >-
  Board-game sequencer: two robots follow programs of moves across a 5 x 5 board of belts and rails, and where they go
  becomes melody, bass and percussion, with a SID-style lead you can play over them.
description: >-
  The robots are Scout-7, which plays the melody, and Echo-3, which plays the bass. You type their programs on the
  keys, steer them while they run, build the board tile by tile and choose from six preset boards. Harmony and board
  changes follow four-step cycles, and drums, a mixer and tempo pages are included. It is a port of the author's browser
  instrument and sits on Dinghy 0.4. The README says it runs in the fm1-emu emulator and has not been tried on an FM-1,
  and that boards and programs are not yet saved to flash, though a later section says the project is kept in flash
  sectors of its own. The music has two modes, PLUS and CLASSIC, and a battle mode lets two players race on the beat.
