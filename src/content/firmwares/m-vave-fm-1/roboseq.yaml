homepage: https://joakimskurk.github.io/fm1roboseq/
distribution: browser-installer
install_notes: >-
  The project page installs the latest build of main from Chrome or Edge over USB and plays the firmware in the browser. Or build with the Makefile, then install build/roboseq.fwsc over USB-MIDI with tools/fm1_install.py on an FM-1 running
  M-VAVE's V15 or another firmware with the update loader. The README warns that any flash can brick a unit and says
  holding OCT- while switching on reaches the updater.
brick_risk: false
