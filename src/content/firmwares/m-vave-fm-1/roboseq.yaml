  The Terminus font is SIL OFL 1.1, and the designburg logo in assets/ is all rights reserved and not under the GPL.
distribution: source-only
install_notes: >-
  Build with the Makefile, then install build/roboseq.fwsc over USB-MIDI with tools/fm1_install.py on an FM-1 running
  M-VAVE's V15 or another firmware with the update loader. The README warns that any flash can brick a unit and says
  holding OCT- while switching on reaches the updater.
brick_risk: false
