device: m-vave-fm-1
name: RudimentSeq
summary: >-
  Felucca fork that adds a drum-rudiment layer: each track can play one of 174 rudiments instead of its step pattern, and
  the sequencer, rudiments and arpeggiator send USB MIDI with optional clock.
description: >-
  RUDI can be switched on for any of the four tracks, which then plays the next hit of the chosen rudiment at each step
  instead of reading its 16 steps. Right and left hands use two separate notes from the drum kit, another engine or
  external gear, each with its own probability, and accents, ghost notes and grace notes follow the sticking. A SMART
  mode cycles scenes that raise and lower density, and a feathering control softens the ghost notes. The 174 rudiments
  are the 40 PAS standard rudiments plus the extended set of the author's RudimentSeq web app. Rudiment settings save
  with the project. Unlike Felucca, it also sends the sequencer and arpeggiator output over USB MIDI on each track's
  channel and, from the CLOCK page, MIDI clock, start and stop. Everything else in Felucca is kept. The README says r0.1 is
  built on Felucca v1.9.0 and was tested on one FM-1 with the UC25HQ80 flash chip; a factory demo project and the
  rudiment list in the web editor are not there yet.
status: active
authors:
- name: RudimentSeq
  url: https://github.com/RudimentSeq
source: https://github.com/RudimentSeq/RudimentSeq-FM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md. Felucca's own licence and its bundled parts are kept: engines are MIT, the BSP is MPL-2.0, the
  Hügelton Sample Pack is CC0 and ported DSP keeps its own licences. The rudiment changes are licensed GPL-3.0-only by
  the project.
homepage: https://rudimentseq.com
based_on: m-vave-fm-1/felucca
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer at rudimentseq.github.io/RudimentSeq-FM1 (Chrome or Edge, Web MIDI), or tools/fm1_install.py with the
  package from the release. The package keeps the name of Felucca's, and the device reports FM-1_900 to installers. The
  installer's "Return to official V15" option or M-VAVE's own updater goes back to stock. The stock OTA loader is kept, as
  in Felucca.
brick_risk: false
tags: [sequencer, drums, groovebox, arpeggiator, midi, usb-midi, fork]
versions:
- version: r0.1.7
  date: 2026-11-25
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1.7
  notes: Adds PACK, a page after RUDI 3 that holds up to 16 rudiments per track, filled by tapping them as in RUDI KEYS and played in a chain with a set number of repeats, optionally reshuffled each lap. The motion recorder drops from 112 to 88 events per project to make room, and older projects load unchanged. Built on Felucca v1.9.0.
- version: r0.1.6
  date: 2026-11-25
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1.6
  notes: Adds RUDI KEYS. On the RUDI, RUDI 2 or RUDI 3 page while a track's RUDI is on, the 16 white keys from F3 to G5 pick a rudiment and the 11 black keys from F#3 to F#5 pick the bank (174 rudiments in 11 banks). A tap keeps the rudiment and a hold past half a second plays it only while held. Built on Felucca v1.9.0, and a three-page quick guide PDF is attached. Projects and sounds load unchanged.
- version: r0.1.5
  date: 2026-11-23
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1.5
  notes: PRINT can go to any track by holding SEQ and tapping T1 to T4, and MENU > DISPLAY > STYLE gains FLAT MAX and LINE MAX, which draw every label in full text colour for daylight. Built on Felucca v1.9.0. Projects and sounds load unchanged.
- version: r0.1.3
  date: 2026-11-20
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1.3
  notes: Adds PRINT, which writes a track's rudiment lane into ordinary steps (drum tracks land on lanes by note) so the step tools can edit it, and shows the RUDI note settings as note names with octaves.
- version: r0.1.2
  date: 2026-11-19
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1.2
  notes: Saving while the transport runs now shows STOP on the card and PLAY STOP TO SAVE in the footer, and the About page reads r0.1.2. Projects and sounds load unchanged.
- version: r0.1.1
  date: 2026-11-19
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1.1
  notes: Adds a RUDI 3 mode that plays random notes of the track's scale within a set range, a RUDI rate of OFF to 4X steps, and saving a user sound with its rudiment. The About page still reads r0.1 in this build.
- version: r0.1
  date: 2026-11-12
  url: https://github.com/RudimentSeq/RudimentSeq-FM1/releases/tag/r0.1
  notes: First release; adds the rudiment layer on every track, USB MIDI out from the sequencer, rudiments and arpeggiator, MIDI clock send, and a RudimentSeq splash and about page.
