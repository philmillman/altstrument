device: m-vave-fm-1
name: RUPTURE
summary: >-
  Monophonic bass synth for the FM-1 built on ETCH: a Cycle Exchange Synthesis or bandlimited saw oscillator, two sub-oscillators, a ladder filter, eight effects, a step sequencer and an arpeggiator.
description: >-
  The main oscillator is either CXS, the author's own synthesis method, or a saw from bandlimited tables, each with
  four macro knobs. Two sub-oscillators offer OFF, CXS, classic, square and saw types with octave, detune and drift. The
  rest of the voice is a resonant filter with a 24 dB ladder option, an ADSR, an LFO, a four-band channel EQ, a six-note memory
  with last, high or low priority, glide and legato. Effects are reverb, delay, chorus, MOSFET, compressor, tilt EQ, octave fuzz and
  sandpaper. The sequencer runs 4 to 128 steps with recording, and the arpeggiator has several riff modes. There are 12
  named project slots with 8 sequences each. The screen has a waveform bar that animates as a leaking dam while notes
  are held, and a screensaver of Utrecht's skyline that cracks. The release notes say a later version added recognition
  of M-VAVE's V15 package so the unit can return to stock, and that an earlier version cannot do so.
status: active
