device: m-vave-fm-1
name: RUPTURE
summary: >-
  Monophonic bass synth for the FM-1 built on ETCH: a Cycle Exchange Synthesis or bandlimited saw oscillator, two sub-oscillators, a ladder filter, eight effects, a step sequencer and an arpeggiator.
description: >-
  The main oscillator is either CXS, the author's own synthesis method, or a saw from bandlimited tables, each with
  four macro knobs. Two sub-oscillators offer OFF, CXS, classic, square and saw types with octave, detune and drift. The
  rest of the voice is a resonant filter with a 24 dB ladder option, an ADSR, an LFO, a four-band channel EQ, a six-note memory
  with last, high or low priority, glide and legato. Effects are reverb (spring, hall and room engines from V1.78), delay, chorus, MOSFET, compressor, tilt EQ, octave fuzz and
  sandpaper. The sequencer runs 4 to 128 steps with recording, and the arpeggiator has several riff modes. There are 12
  named project slots with 8 sequences each. The screen has a waveform bar that animates as a leaking dam while notes
  are held, and a screensaver of Utrecht's skyline that cracks. The LFO, ENV and SOUND SHAPE pages have animations too:
  a sinkhole, a breaking wall and a volcano that erupts while keys are held. A welcome screen at first start offers a
  storage format, which needs a three-second SAVE hold to confirm, and since V1.71 an optional 43-screen on-device tour follows it. The release notes say a later version added recognition
  of M-VAVE's V15 package so the unit can return to stock, and that an earlier version cannot do so.
status: active
authors:
- name: SikkenWorks
  url: https://github.com/SikkenWorks
source: https://github.com/SikkenWorks/RUPTURE
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states that Felucca-derived material is GPL-3.0-only and points to LICENSE and licenses/FELUCCA-LICENSING.txt; the source
  tree under vendor/etch-v1.88-source keeps the notices of its upstream parts (DaisySP, Rings, msfa and others). The repository
  also commits earlier RUPTURE and ETCH reference .fwsc builds and a 15 MB Windows executable, FM1-Recovery-by-SikkenWorks.exe,
  whose contents were not inspected for this catalog.
homepage: https://sikkenworks.github.io/RUPTURE/
distribution: browser-installer
install_notes: >-
  Use the WebInstaller on the project site in Chrome or Edge, or flash the .fwsc from a release. The README says to back
  up projects first, since M-VAVE's V15 does not read RUPTURE's storage, and that a unit still running V1.43 or earlier
  cannot take the V15 package until it is updated. The USB name is SIKKENWORKS / RUPTURE with package identity FM-1_968.
brick_risk: false
tags: [synth-engine, sequencer, arpeggiator, fx, filter, usb-audio, fork]
