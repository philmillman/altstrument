versions:
- version: V1.85.1
  date: 2026-11-06
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.85.1
  notes: The release page has only the .fwsc. The changelog describes a sequencer hotfix. LENGTH=4 showed four steps but the audio engine played sixteen. Steps past LENGTH are kept, and hardware verification is still pending. V1.85, in the changelog only, bounds USB MIDI bursts per audio block and adds an audio diagnostics page.
- version: V1.84.2
  date: 2026-11-05
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.84.2
  notes: The release page has only the .fwsc. The changelog describes a hotfix for a pop from the speaker at start-up. It stops the twelve function-button LEDs jumping to full current in protected states, and holds the amplifier enable until the LED state has been steady for 400 ms. The changelog says hardware confirmation is still needed. The function LEDs also show the active page since V1.84.
- version: V1.82
  date: 2026-11-04
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.82
  notes: The release page has only the .fwsc. The changelog says the first-run welcome and tour run again on the first boot of this version, even when an earlier version had completed them. Valid projects are not erased. Since V1.76 the changelog also adds SPRING, HALL and ROOM reverb engines (rebuilt in V1.80), SELECT opening the screen list from any ordinary page, and lighter processing for fast note bursts.
- version: V1.76
  date: 2026-11-04
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.76
  notes: The release page has only the .fwsc. The changelog says recorded notes snap to the nearest step using the key-contact time, a key pressed just before step 1 can land on the first step, and the button LEDs flicker less.
- version: V1.67
  date: 2026-11-03
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.67
  notes: The release page has only the .fwsc. The changelog says every knob page, including the eight effects and the sequencer, marks the knob last turned.
- version: V1.60
  date: 2026-11-03
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.60
  notes: The release page has only the .fwsc. The changelog says the first-run storage format now shows a formatting screen and then a result, and that physical hardware checks of this build are still to be done.
- version: V1.59
  date: 2026-11-03
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.59
  notes: The release page has only the .fwsc. The changelog adds a first-run welcome with a backup question, an optional storage format and a CRT setting; formatting is never automatic. It says formatting, start-up and V15 restore are untested on hardware.
- version: V1.58
  date: 2026-11-03
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.58
  notes: The release page has only the .fwsc. The changelog adds a small shake to the LFO, ENV and SOUND SHAPE animations.
- version: V1.57
  date: 2026-11-03
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.57
  notes: The release page has only the .fwsc. The changelog adds the SOUND SHAPE volcano animation.
- version: V1.50
  date: 2026-11-02
  url: https://github.com/SikkenWorks/RUPTURE/releases/tag/V1.50
  notes: The Utrecht screensaver crack now climbs through the streets and splits the Dom Tower.
