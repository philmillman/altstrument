versions:
- version: '1.11'
  date: 2026-10-31
  url: https://github.com/AndrewGG88/S1Vave/releases/tag/v1.11
  notes: The release page has no notes beyond a changelog link. Its commits fix sequences longer than 16 steps, add mod wheel vibrato on MIDI CC 1 and a transpose shortcut on OCT+ and ALGORITHM, convert old presets centred on 60 to 64, and show the transpose while OCT is held. The homepage installer offers 1.11.
- version: '1.1'
  date: 2026-10-30
  url: https://github.com/AndrewGG88/S1Vave/releases/tag/v1.1
  notes: The release page has no notes beyond a changelog link; the tagged commit is titled as adding arp hold, battery monitoring, key tracking and SysEx preset sync. The homepage installer offers 1.1.
