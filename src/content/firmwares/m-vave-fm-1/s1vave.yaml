device: m-vave-fm-1
name: S1Vave
summary: >-
  Eight-voice virtual analog synth modelled on the Roland S-1 and SH-101: sub-oscillator, 4-pole filter, calibrated
  envelopes, chorus, delay and reverb, a two-track sequencer and a browser simulator.
description: >-
  Built on OberVave. The voices run in mono, unison, poly or chord modes. Two wave-shaping tools, OSC DRAW (a
  16-step drawn wave) and OSC CHOP (comb slicing with overtone depth), are added to the saw, pulse, sub and noise
  sources. The filter is a cascaded state-variable design with key tracking and self-oscillation, and the LFO has a
  tempo-synced mode and an audio-rate mode. A riser and downer sweep generator, stereo chorus, ping-pong delay and
  plate reverb are included, along with a two-track sequencer with ratchets and per-step probability, 64 factory
  programs and USB audio and MIDI. The firmware's MIDI CC map follows the S-1's, and the 1.1 release adds arp hold, battery monitoring and SysEx preset sync. The repository's build script has
  an SMK-37 board option, but no SMK-37 build is published.
status: active
authors:
- name: Andrew GG
  url: https://github.com/AndrewGG88
source: https://github.com/AndrewGG88/S1Vave
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0 only. The platform layer keeps Leo Kuroshita's Felucca copyright and the
  changes of OberVave's author zvenson and of isod89's SLOOP. The Terminus font is SIL OFL 1.1, the S1Vave artwork
  is CC BY 4.0, and the JieLi SDK files read at build time are Apache-2.0.
homepage: https://andrewgg.one/s1vave/
distribution: browser-installer
install_notes: >-
  The homepage has a WebMIDI installer for Chrome, Edge, Brave or Opera that flashes the v1.11 package,
  and the README also names the FM-1 Firmware Hub. To build and flash it yourself, run build.sh and
  tools/fm1_install.py. The installer warns that flashing erases the presets and settings of the previous firmware
  and that an interrupted flash can brick the FM-1.
brick_risk: true
tags: [synth-engine, sequencer, fx, reverb, delay, filter, lfo, midi, usb-midi, usb-audio, emulator]
