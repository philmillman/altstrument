  url: https://github.com/keremimo
source: https://github.com/keremimo/saadet
source_status: open
license: MPL-2.0
license_notes: >-
  The firmware files in the fm1-base build are MPL-2.0 file by file (FM6 files with msfa portions are MPL-2.0 AND
  Apache-2.0); the web editor, build tools and tests, and the retained source of the retired platform, are
  GPL-3.0-only. Fonts, DaisySP, Rings and the uPD933 model keep their own licences (LICENSING.md, LICENSES/). The
  bundled Casio, Sequential and Roland factory sound data is under the vendors' rights, with no licence granted.
  The repository also holds JieLi's unmodified wl82loader.bin RAM recovery helper (Apache-2.0) and no M-VAVE
  firmware.
homepage: https://keremimo.github.io/saadet/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer (Chrome or Edge, USB). Back up sounds first; the optional m-bootloader 1.2 recovery
  is off by default and is written after the application. A power loss during the bootloader write can still
  need the RP2040 USB_KEY recovery. Switching between Saadet and Melodee needs backups of both, since their
  data layouts differ.
brick_risk: false
