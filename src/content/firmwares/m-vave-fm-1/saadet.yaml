versions:
- version: 1.0.5
  date: 2026-11-12
  url: https://github.com/keremimo/saadet/releases/tag/v1.0.5
  notes: Held chords at high levels no longer pump, because the limiter now holds its reduction for up to a second; the MOD ENV now moves the filter, pitch and shape on the Prophet-5, JUNO-106, FM6, CZ-1 and PPG engines; and the FM-1 Screen Reader points at Saadet's own words site. SMK-37 packages keep their identities, so the installer shows them as up to date until Reinstall is pressed.
- version: 1.0.4
  date: 2026-11-08
  url: https://github.com/keremimo/saadet/releases/tag/v1.0.4
  notes: Fixes the JUNO-106 filter, which was one to two octaves too dark, so cutoff, envelope sweep and resonance now follow the Juno-106's own control law. The notes also cover 1.0.3, which has a tag but no release page there, with a gentler output stage at high levels and a tool that restores the Bluetooth radio calibration from a flash backup. The notes say the filter change has been tested on the host only, not heard on a unit.
- version: 1.0.0
  date: 2026-11-07
  url: https://github.com/keremimo/saadet/releases/tag/v1.0.0
  notes: Adds the PPG and HYDRA engines, two parts with performances, the Saadet Studio editor, an open Bluetooth stack that frees flash, and SMK-37 beta builds. The notes say 0.2.0 was never released and that everything planned for it is in 1.0.
- version: 0.1.1
  date: 2026-10-27
  url: https://github.com/keremimo/saadet/releases/tag/v0.1.1
  notes: Fixes MIDI clock drift when the input queue overflows and arpeggiator catch-up after clock bursts, backported from Melodee; physical validation of this package is still pending.
- version: 0.1.0
  date: 2026-10-23
  url: https://github.com/keremimo/saadet/releases/tag/v0.1.0
  notes: First public release; experimental.
