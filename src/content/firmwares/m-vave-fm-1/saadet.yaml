device: m-vave-fm-1
name: Saadet
summary: >-
  Single-part synth firmware forked from Melodee: Prophet, FM6, CZ-1 and JUNO-106 engines (one at a time), 384
  shared user sound slots, arpeggiator, Bluetooth MIDI and native 24-bit audio.
description: >-
  Rights warning: the repository bundles Roland's 128 Juno-106 factory patches, Casio's 64 CZ-1 factory tones and
  Sequential's 200 Prophet-5/10 factory programs (v1.03) as SysEx sound data used for the factory presets, and its
  licensing file says the rights stay with those vendors and that no licence is granted.
  A dedicated one-part instrument: sequencing, multitrack recording and shared insert effects were left out.
  It adds HOLD, chords, strum, scales, microtonal tuning, favourites, automatic recall of the last sound and SysEx
  import and export, plus a web editor with full backups. Input is USB MIDI, TRS MIDI and Bluetooth MIDI, and the
  firmware remembers and retries the last outgoing Bluetooth device. USB audio is stereo at 44.1 kHz in 16 or 24
  bit with a synth-master capture. The author labels 0.1.0 experimental and lists final audio, timing and
  Bluetooth acceptance on hardware as still to be recorded; the 0.1.1 notes say physical validation of that
  package is still pending. Installing it over Melodee can replace Melodee's
  project A data, and Melodee backups cannot be restored as Saadet backups.
status: active
