source: https://github.com/tomorrowsman/fm1-samsara
source_status: open
license: MPL-2.0
license_notes: >-
  Stated in LICENSE and LICENSING.md, file by file as for AMB-1, with changed files carrying both copyright lines. The
  Choir pad colour embeds harmonic amplitudes derived from three Adventure Kid Waveforms single cycles, which their
  author dedicated to the public domain (CC0 1.0). fm1-base and felucca-bsp are MPL-2.0.
based_on: m-vave-fm-1/amb-1
homepage: https://tomorrowsman.github.io/fm1-samsara/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Use the web installer on the project site, or install samsara-1.0.0.fwsc (identity FM-1_108010000) from the release over USB
  with base/tools/fm1_install.py. To build it yourself, run ./build.sh on Linux or in GitHub Actions. AMB-1's browser installer also works with a built package. The manual says
  SAMSARA keeps its data in its own area, that an FM-1 failing to start twice comes up in safe mode, that OCT- and OCT+
  held for five seconds enter update mode, and that M-VAVE's firmware can be put back with the rescue script.
brick_risk: false
