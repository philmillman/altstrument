device: m-vave-fm-1
name: Sardine
summary: >-
  Club-mixing firmware built on Felucca's engines with four always-on layers (lead, chord, bass, drums), twenty styles that start as fresh grooves, held DJ moves, a style-to-style blend and MIDI out per layer.
description: >-
  Sardine plays four layers together. Sounds act at once, while patterns and modifiers wait until SEQ drops them in on
  the bar line. Each start builds a new groove in one of twenty styles, from slow and dark to gabber. Phrases run over
  four bars with a second part that evolves on its own, and a LIVE mode builds a mix from a single kick or pad. Held
  buttons give fills, breaks, filter sweeps, wash, throw, tape stop and wobble, and STYLE MIX blends into another style
  while the bass or kick plays on. It has 145 synth sounds, 24 synthesised drum kits and no samples, a pattern editor,
  eight save sets with a song mode, 3D panning, MIDI clock in and out, and USB MIDI out with each layer on its own
  channel. The project site has a browser emulator and a web installer, and a dev-branch test build. It descends from
  Sill, Daurade, Flyfish and Tuna.
