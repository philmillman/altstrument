license: GPL-3.0-only
license_notes: >-
  LICENSING.md puts the firmware changes under GPL-3.0-only on top of PERF-1 and its ancestors. Score data has its own
  terms in satie/SOURCES.txt: the Gymnopedie editions and the Ogive MIDI files are public domain, the three Gnossienne
  editions are CC BY-SA 4.0 with their notices kept, and no recordings are used. The cover is an AI-assisted adaptation
  of a public domain portrait photograph.
homepage: https://github.com/OCKM-STUDIO/SATIE-1
distribution: download
install_notes: >-
  Download satie-1-0.1.0-beta.fwsc from the release and install it with tools/fm1_install.py or a compatible FM-1 web
  installer, keeping USB connected until it finishes. The README says it does not import other firmwares' projects or
  samples and that switching firmware may overwrite shared flash storage, so back up first. The release notes say a
  Firmware Hub install check was still pending.
