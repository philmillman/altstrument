device: m-vave-fm-1
name: SATIE-1
summary: >-
  Evolving Erik Satie soundtrack for the FM-1: ten score reductions (Gymnopedies, Gnossiennes, Ogives) in five moods
  with a Solo, Duet or Trio blend, electronic drums, vinyl and tape colour and a synced delay. Fork of PERF-1.
description: >-
  Pick a tune, pick a mood and let it play. The ten pieces are Gymnopedies 1 to 3, Gnossiennes 1 to 3 and Ogives 1
  to 4, reduced from published scores to a lead, a bass and an optional inner voice and rounded to sixteenths over a
  4/4 beat, so they are simplified arrangements and not performances. The moods are After Hours, Ibiza Chill, Orbit,
  Blue Note and Ghost. Four HOME knobs set tempo, energy, evolve and a mix that blends Solo, Duet and Trio, and eight
  further pages cover the lead, bass, drums, layers, colour (clean, vinyl, tape, grit), delay and space. REC holds an
  eight-bar passage, SAVE keeps one favourite with its edits, and GLO opens a built-in guide. The release also ships a
  single-file browser preview. The base is PERF-1, with its engine and installer tooling; the Satie data, moods and
  pages are the author's. The release is a public beta whose notes say it still needed on-device listening and install
  checks.
