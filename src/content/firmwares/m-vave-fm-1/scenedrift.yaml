device: m-vave-fm-1
name: SCENEDRIFT
summary: >-
  Polyrhythmic saw and FM synth sequencer with four lanes of different lengths, per-step locks and trig conditions, a
  twin delay and an XY pad that morphs between four stored sounds.
description: >-
  The lanes (lead, bass, pluck and air) share one detuned-saw engine with light FM and each loops at its own length
  against one clock. Steps take locks for pitch, level, send and hold, and a trig condition from percentages to ratios
  such as 1:2. The XY puck blends 20 sound settings between four scenes, which can be jumped to from the keys. The
  README says the polyphony, unison width and delays were reduced from the HTML toy it was ported from to fit the chip,
  with a CPU guard that thins the unison under load. MIDI clock sync is on the system page. It is built with the foma
  framework and ships a browser emulator and installer page.
