homepage: https://github.com/joakimeriksson/scintilla-fm1
distribution: download
install_notes: >-
  Download the .fwsc from the releases page and install it with the FM-1 Firmware Hub or with
  firmware/tools/fm1_install.py over USB MIDI. Holding OCT- while switching on opens the USB rescue, and the hub
  can return the unit to the official firmware. Release builds report the identity FM-1_963 plus the version.
brick_risk: true
