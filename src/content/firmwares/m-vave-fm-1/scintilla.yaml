device: m-vave-fm-1
name: Scintilla
summary: >-
  Elka Synthex port in integer C: the 80 factory sounds, two layers of eight voices, chorus and reverb, USB and DIN
  MIDI, as a firmware of its own on Dinghy.
description: >-
  The engine is a fixed-point C port of the Synthex model in the author's synthex-web browser synth, with two
  band-limited oscillators, noise, a five-mode filter, two envelopes, two LFOs, glide, sync, ring and cross
  modulation per voice. Rendered output is compared sample by sample against the browser original, and the same
  code runs on a computer and in the author's FM-1 emulator. The firmware offers single, split and double layers,
  poly, mono and unison modes, a chorus, an algorithmic reverb, pages for each part of the voice and a joystick
  page. It takes notes, bend, a few CCs and program changes over USB and the DIN jack, and from 0.2.0 velocity and
  aftertouch from the FM-1's own keys, and the 40 PRESETS carry the values decoded from the Synthex's EPROMs. The delay and
  saving edited sounds are not in yet (the README says the unit keeps only its settings), and the author says it was
  installed and played on a real FM-1 on 2026-10-23 and again for 0.2.0 on 2026-11-01.
