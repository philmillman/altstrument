versions:
- version: 0.2.0
  date: 2026-11-01
  url: https://github.com/joakimeriksson/scintilla-fm1/releases/tag/v0.2.0
  notes: The 40 PRESETS now use the values decoded from the Synthex's EPROMs, so many sounds change. Adds a chorus built as two bucket-brigade lines, band-limited hard sync, velocity and aftertouch from the FM-1's keys on a SETTINGS page (off until turned on), and cheaper fast filter attacks; MIDI CC 7 sets the volume. Identity FM-1_96300200.
