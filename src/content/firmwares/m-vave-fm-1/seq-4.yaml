  fonts are SIL OFL 1.1.
homepage: https://devrvega.github.io/SEQ-4/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the releases page. The
  installer has a Back to the stock firmware option, which asks you to download M-VAVE's own V15 file from
  M-VAVE and select it; M-UPGRADE also restores stock. An FM-1 that fails to start twice boots into a safe mode
  the installer can reach. Browser emulator and manual on the project site.
brick_risk: false
