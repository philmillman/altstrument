device: m-vave-fm-1
name: SEQ-4
summary: >-
  Four MIDI sequencers in one firmware, each on its own channel and USB port, in six modes from melody and
  chords to eight-track drums and two generative modes; the FM-1 makes no sound of its own.
description: >-
  The screen is a 16-step grid of lit pads, with the white keys as steps and the black keys as rows. Each
  sequencer runs up to 128 steps in eight pages and 16 patterns, with per-step velocity, gate, glide, timing
  offset, repeats and conditions. The firmware also has LFOs, mod lanes, Euclidean and drum generators, a
  harmonizer, live and step recording, MIDI capture, snapshots and songs, with MIDI clock and four USB MIDI
  ports plus the TRS input. The only sound is a metronome click, so it needs synths to play. It is built on
  CRT-4, LCD-4, IND-1 and AMB-1 and the Felucca platform layer, and its first save replaces data that those
  firmwares keep in the same flash area. The README reports measurements of its timing on an FM-1.
status: active
authors:
