license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only with the FM1 SDK linking exception, as in M-VAVE's fm1_open (LICENSE.md). The binary engine library
  under sdk/ keeps M-VAVE's separate terms in THIRD_PARTY.md. The repository includes M-VAVE's stock V15
  FM-1_015.fwsc as the SDK recovery image, the same file M-VAVE licenses under Apache-2.0.
homepage: https://shed-web.vercel.app
distribution: source-only
install_notes: >-
  No package is published. Building the firmware needs Windows, PowerShell and the JieLi 2.5.3 toolchain, as
  for FM1 Open; a browser simulator builds with tools\Build-Web.ps1 -LocalPreview. Flash only a build you made
  yourself and keep the stock V15 recovery path in mind.
