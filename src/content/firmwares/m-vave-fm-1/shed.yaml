device: m-vave-fm-1
name: Shed
summary: >-
  Jazz ear-training mode added to FM1 Open: nine drills for degrees, chord qualities, intervals, tensions,
  arpeggios, scales, bass movement and dictation, plus a vamp mode to play over.
description: >-
  Built on M-VAVE's FM1 Open source. Shed lives in app/shed/ with a two-line hook in app/screen.c, and is entered
  from the panel with HOME and SCL. Each question plays a cadence to set the key, then the player answers on the
  keys or with the dial. Difficulty rises after five hits in a row and drops after three misses, and a
  spaced-repetition score brings back items that were missed. Vamp mode loops one of five progressions with bass and
  comping, lights the keys that fit the chord and can add an ear round. Progress is kept in RAM only. The spec says
  development and testing were done in the web simulator and that a hardware build with the JieLi toolchain
  was a later optional phase, and the repository has no firmware package or release. The author links Shed Web, a
  separate browser version of the exercises. The commit messages credit Claude as co-author.
status: active
