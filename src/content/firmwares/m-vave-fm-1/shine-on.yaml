- version: v3.5
  date: 2026-11-12
  url: https://github.com/zvenson/shineon/releases/tag/v3.5
  notes: Replaces auto-save with a MEMORY page of eight slots that each hold all four tracks, their sounds, the mixer and effects, with SAVE, LOAD, COPY, PASTE, INIT and SOUND actions. Shine On now keeps its own store in flash, adds a VIBE LINK controller mode and a USB backup, and newer FM-1s with the UC25HQ80 flash chip can save and update. Identity FM-1_9635.
