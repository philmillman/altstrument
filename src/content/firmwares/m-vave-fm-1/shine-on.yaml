device: m-vave-fm-1
name: Shine On
summary: >-
  String ensemble in the style of 1970s string machines, with sixteen keyers, six register filters, a
  three-line ensemble, phaser, delay and plate reverb, an arpeggiator and a four-track sequencer with a mixer. Built from
  OberVave.
description: >-
  Each key has its own keyer, and the tone comes from phase-locked 16', 8' and 4' sawtooth and 8' square footages
  run through fixed register filters (contrabass, cello, viola, violin, trumpet, horn) on the sum. Three
  bucket-brigade delay lines swayed by two LFOs 120 degrees apart make the ensemble sound. There are 32 factory
  programs in 99 slots, an arpeggiator for each sound and, since 3.0, four tracks with four sounds that share the
  sixteen keyers, each with its own registers, ensemble and phaser, mixed through delay, reverb and drive sends and a
  master section. The panel, sequencer, delay and reverb come from OberVave, and the platform from Dinghy, Felucca and
  SLOOP. Version 1.2.2 opened the FM-1's TRS MIDI IN jack, and 1.2.3 gave the update loader a progress screen. Version 3.5 replaced auto-save with eight memory slots.
  The browser simulator compiles the firmware's own C code. The same releases carry SMK-37 builds, which are not
  catalogued here and which the licensing notes say are untested on an SMK-37.
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
source: https://github.com/zvenson/shineon
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSE and LICENSING.md. The platform code is Felucca (Leo Kuroshita) with SLOOP's changes, and
  the SMK-37 board layer is by M. Geisler. The Terminus font and Inter are SIL OFL 1.1, the logo uses URW Bookman
  Demi outlines, and the AC79 SDK files are read from your own checkout at build time.
homepage: https://github.com/zvenson/shineon
distribution: download
install_notes: >-
  The README gives the FM-1 Firmware Hub (thefirmwarehub.com) as one install route, or tools/fm1_install.py
  on the .fwsc over USB (Python with mido and python-rtmidi). Use the FM-1 build, whose package identity is
  FM-1_962, not the SMK-37 files in the same release.
brick_risk: false
tags: [synth-engine, fx, reverb, delay, sequencer, arpeggiator, midi, usb-midi, emulator]
