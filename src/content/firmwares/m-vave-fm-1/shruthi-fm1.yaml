device: m-vave-fm-1
name: Shruthi FM-1
summary: >-
  Port of the Mutable Instruments Shruthi-1 voice to the FM-1 as a SHRUTHI engine for Felucca, with 12 presets, a patch step that adds it to a Felucca build and a CI-built installer page and browser demo.
description: >-
  The project ports the oscillator, envelope, LFO and modulation code of Mutable Instruments' Shruthi-1 to plain C, with 24
  oscillator shapes, a sub oscillator, a transient generator, a 12-row modulation matrix and mixing operators such as
  sync, ring, xor, fold and crush, and wraps it as a SHRUTHI engine for Felucca with two oscillators, interval, mix,
  operator, filter and 12 presets. The README says tests compare the oscillators, envelopes, LFOs and whole voice
  against the original Shruthi source built on a PC, and that the Felucca engine is integer-only. A GitHub Actions
  workflow patches the engine into Hugelton Instruments' Felucca, builds a firmware with JieLi's toolchain and
  publishes an installer page and a browser demo to the project's site. Felucca supplies the sequencer, arpeggiator and
  envelope stages, and the Shruthi sequencer, effects board and expansion filter modes are not ported. The repository's
  status file predates that workflow and says nothing has been heard on hardware and the filter is an untuned estimate.
  This entry is a test build.
status: active
