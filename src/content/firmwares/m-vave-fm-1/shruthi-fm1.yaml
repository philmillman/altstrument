source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file. The README says the Shruthi-1 firmware is GPL-3.0-or-later and that everything
  derived from it is GPL, and the patch script says a firmware built with it must be distributed under GPL terms. The
  Felucca code it builds on is read as GPL-3.0-only. The repository also holds the original source zips it was built from
  (Shruthi-1, avril, Felucca, Felucca-Engines, felucca-bsp and M-VAVE's fm1_open) unmodified.
homepage: https://bowzee303.github.io/shruthi-fm1/
based_on: m-vave-fm-1/felucca
distribution: browser-installer
requires_stock: stock V15 or any firmware that takes an update
install_notes: >-
  Run the "Build and publish the test site" workflow (it patches the engine into Felucca, builds, and publishes to GitHub
  Pages), then use the installer page the site serves in desktop Chrome or Edge over USB MIDI. The project site is
  already published, and the README says power-on parts A, B and C play the SHRUTHI engine in the test build. No release
  is published, and nothing has been reported as run on an FM-1.
brick_risk: false
