device: m-vave-fm-1
name: SID-1
summary: >-
  Two Commodore 64 SID chips as a six-voice synth, with C64-style patches, a library of 128 and a web app that
  edits them and pulls instruments and drum samples out of .sid tunes.
description: >-
  The SID core is a C port of reSID 0.16 that the README says matches it sample for sample in tests, for the
  6581 and 8580 models, with three voices per chip. A patch works like a C64 music-player instrument: ADSR and
  waveform, an eight-step wavetable for drums and arpeggios, pulse-width and filter sweeps, vibrato and hard
  restart. The 128 slots sit in four banks of 32, and the modes are single, layer, split by MIDI channel and
  voices, where channels 1 to 6 are the six voices. The web app edits patches, saves banks as JSON, and reads
  PSID and RSID files you supply on its own 6502 to extract their instruments and sampled drums, then plays
  the tune on the FM-1 as MIDI. No C64 music is included. It is built on Dinghy and Felucca with SLOOP's
  changes, and the README says much of the code was written with Claude. Not the same project as FM-1 SID.
status: active
authors:
