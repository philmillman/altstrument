source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSE and LICENSING.md. The SID core is a port of reSID, which is GPL-2.0-or-later, and the
  firmware as a whole is distributed under GPL-3.0. The repository's tests include an unmodified copy of reSID
  0.16, which is not in the firmware. Fonts are SIL OFL 1.1.
homepage: https://sid-1.putch.co.uk/
distribution: download
install_notes: >-
  Download the .fwsc from the release and install it over USB with tools/fm1_install.py (Python with mido and
  python-rtmidi); the installer asks before writing, and an interrupted install can be rerun. Holding OCT- at
  power-on starts the USB updater only. To go back to M-VAVE's firmware the README points to the FM-1 Firmware
  Hub. The README says installing is at your own risk. The library lives in flash that OPN-1 does not use.
brick_risk: false
