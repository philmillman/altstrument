device: m-vave-fm-1
name: SIDOU
summary: >-
  Commodore 64 SID instrument and GoatTracker 2 compatible tracker for the FM-1 with its own two-chip SID emulation,
  a step sequencer, live play and MIDI input. Tested on one real FM-1.
description: >-
  Plays the SID's three voices on two chips with a 6581 or 8580 model, four presets, filter and pulse-width knobs
  and MIDI over TRS and USB, and adds three stereo effect slots after the chip. Songs are written on the panel with
  a step view and a tracker, can record notes from the keys, and are saved to the FM-1's flash as GoatTracker 2 files.
  The SID core is the author's own C code and the repository carries reference tests against libresidfp. Since 0.5.0
  it also plays PSID .sid tunes from the FM-1's store, and 1.0.0 adds a LAB view for shaping and keeping sounds, which 1.1.0 extends. Version 1.5.0 sends LAB sounds to the song
  as GoatTracker instruments, lifts a sound from a playing .sid tune, and adds a browser Live Link that shows the FM-1's
  screen and a library and song editor on the project site. Version 1.6.0 adds layers of up to three oscillators and a filter envelope to LAB, and an import tool for SidStation and MIDIbox SID banks. It is built on Felucca's hardware layer, USB stack and update loader, and is also checked
  in the fm1-emu emulator. The 0.2.0 release notes say that version had run on one real FM-1 and that the earlier
  0.2.0-m2-preview could not be updated over USB. It is a separate project from FM-1 SID.
status: active
authors:
- name: Denis Sablic (dsablic)
  url: https://github.com/dsablic
source: https://github.com/dsablic/sidou
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The project's own files are GPL-3.0-or-later. The firmware image links Felucca's GPL-3.0-only hardware layer
  and USB stack, so the image as a whole is GPL-3.0-only. It also carries data derived from reSID 0.16 and
  libresidfp (GPL-2.0-or-later), an MIT port of the Rings reverb, and three unmodified JieLi AC79 SDK files
  (Apache-2.0) in each package (LICENSING.md).
distribution: download
install_notes: >-
  Install the .fwsc from the releases page with Felucca's installer (fm1_install.py sidou-1.6.0.fwsc); the README
  says to read docs/flash-day.md first and keep the way back ready. To return to stock, install M-VAVE's official
  FM-1.fwsc the same way. If the unit does not boot, hold OCT- at power-on for the chip's ROM boot mode and restore
  with the unbricker. The 1.0.0 release notes list long 48 kHz USB audio recordings as untested on a real FM-1.
brick_risk: false
tags: [synth-engine, fx, midi, emulator, research]
versions:
- version: 1.6.0
  date: 2026-11-04
  url: https://github.com/dsablic/sidou/releases/tag/v1.6.0
  notes: Adds a LAYERS page to LAB so one key can play up to three oscillators, each with its own waveform and envelope, and an envelope for the filter. On the computer, sidou-sysex import turns Elektron SidStation and MIDIbox SID V2 banks into songs. The release says it was tested on a real FM-1 over a 1.5.0 install.
- version: 1.5.0
  date: 2026-11-02
  url: https://github.com/dsablic/sidou/releases/tag/v1.5.0
  notes: Adds a song bridge from LAB (REC sends the sound to the song as an instrument, and an instrument can be pulled back), lifting a sound from a playing .sid tune, chords and drums from DICE lane roles, larger value popups and one way to confirm destructive actions. On the computer it adds Live Link, a library manager and a song editor on the site, and MIDI controller maps. The release says Live Link and the site's library and editor were tested in the emulator, not yet on a real FM-1.
- version: 1.1.0
  date: 2026-10-30
  url: https://github.com/dsablic/sidou/releases/tag/v1.1.0
  notes: Adds a filter LFO and a MACRO page to LAB, lets TABLE's arpeggio helper and held STEP steps be heard before writing, adds MUTATE and DICE to the tracker, evens out knob curves, and makes uploads wait for quiet while a song plays. Sounds kept in 1.0 load as they were. The release says uploads while a song plays, CLOCK OUT with a synced DAW and Songs to MIDI were tested in the emulator only.
- version: 1.0.0
  date: 2026-10-29
  url: https://github.com/dsablic/sidou/releases/tag/v1.0.0
  notes: Adds the LAB sound-editing view with five pages, sixteen user sounds that SAVE keeps, A/B compare, undo and randomising, and settings for the DICE generator on STEP. Dense .sid tunes now write on time.
- version: 0.5.0
  date: 2026-10-25
  url: https://github.com/dsablic/sidou/releases/tag/v0.5.0
  notes: Adds .sid tune playback (PSID, one or two chips) from the FM-1's store, a SIDS list and a now-playing screen, tune upload over SysEx and a starter pack of eleven openly licensed tunes.
- version: 0.4.0
  date: 2026-10-25
  url: https://github.com/dsablic/sidou/releases/tag/v0.4.0
  notes: Adds a SID drum kit and sampled digi drums, chance and mutate on the STEP lanes, and USB audio recording.
- version: 0.3.1
  date: 2026-10-23
  url: https://github.com/dsablic/sidou/releases/tag/v0.3.1
  notes: An install over another firmware now boots straight into SIDOU instead of stalling on the chip's USB boot screen.
- version: 0.3.0
  date: 2026-10-23
  url: https://github.com/dsablic/sidou/releases/tag/v0.3.0
  notes: Redraws the song views in larger text, speeds up SysEx transfers, steadies the MIDI clock and adds a soft limiter after the effects.
- version: 0.2.0
  date: 2026-10-22
  url: https://github.com/dsablic/sidou/releases/tag/v0.2.0
  notes: Adds on-device song writing with a step view and tracker, key recording, a second SID chip, MIDI clock and SysEx, and fixes USB-MIDI output so the unit installs and updates over USB.
