device: m-vave-fm-1
name: SIGNAL GARDEN
summary: >-
  Ear-training mode built into Felucca: hold F3 and F#3 at power-on to play back a reference C and a note, then answer on the keys. Normal power-on gives Felucca.
description: >-
  A modified Felucca that adds an ear trainer called station 88.1 NOTE ID. It plays a reference C and then a note, and the learner answers on the keys in any octave. A new note is shown and played in a Reveal before it is quizzed, each answer gets a short explanation and a hint about the next likely mistake, and the key LEDs mark the reference C and the right note. A session is ten prompts plus any misses brought back. Notes come back on a spaced-repetition schedule counted in sessions, since the unit has no clock, and the engine tracks accuracy, answer time and a confusion matrix. Normal power-on starts Felucca unchanged, and Felucca's code is touched in only a few marked places. This is version 0.1, a dev pre-release. Progress is kept in RAM and is lost at power-off, and the README says it has not yet been tested on a real unit. Half and whole steps, intervals, scales and chords are listed as planned. The README says the code was written with an AI model.
status: active
authors:
