  url: https://github.com/hvemnd
source: https://github.com/hvemnd/signal-garden
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSE, the README and docs/SIGNAL_GARDEN.md, inherited from Felucca. LICENSING.md keeps Felucca's parts: the engines are MIT, the hardware layer is MPL-2.0, and ported DSP and fonts have their own licences.
distribution: download
requires_stock: Flashes over official V15 or another Felucca-family firmware
install_notes: >-
  Download signal-garden-dev.fwsc from the dev pre-release and install it with tools/fm1_install.py, or with Felucca's installer page run from localhost (steps in docs/SIGNAL_GARDEN.md). Back up with the Felucca web editor first. Reinstalling a Felucca release or running M-VAVE's updater puts the firmware back to Felucca or V15. If the screen stays black after a failed install, the docs point to the chip's WL80UBOOT boot mode and FM-1 Transporter for recovery.
brick_risk: false
