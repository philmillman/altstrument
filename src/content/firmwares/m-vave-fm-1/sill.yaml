device: m-vave-fm-1
name: Sill
summary: >-
  Generative 90s eurodance firmware that writes a song with verse, pre-chorus, chorus and break, adds a sung choir and a
  key change for the last chorus, in ten styles. Built on Daurade, Tuna and Felucca.
description: >-
  Ten styles are split into CLUB (Eurostomp, Viking, bubblegum, heartache, rave) and RADIO (skank, piano house, party,
  ballad, Italo). Four knobs set the stab filter, the pump on each kick, a formant-synth choir and density with drive, and
  buttons trigger a break and a key-up by hand. With the arc on, a song runs from intro and verse to a pre-chorus with
  a snare roll, the chorus, a break and a last chorus a semitone or two higher. The keys play the hook, snapped to the
  scale, and their LEDs show the chord. Sixteen sounds per part run on Felucca's engines, with a piano cut from six
  notes of a Kawai grand and a drum kit and choir generated by scripts in the repository. MIDI out sends stabs, bass,
  hook and drums on separate channels. Settings and eight sets are kept in Felucca's first two song slots. A browser
  version runs the firmware.
status: active
authors:
- name: delirioux
  url: https://github.com/delirioux
source: https://github.com/delirioux/sill
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, as for Daurade, Tuna and Felucca. The piano samples are from the VCSL library
  (CC0 1.0), and the drum and choir samples and their generators are dedicated to the public domain (CC0 1.0). Felucca's
  bundled parts keep their own licences (LICENSES/).
homepage: https://delirioux.github.io/sill/
distribution: browser-installer
requires_stock: V15 or Felucca
install_notes: >-
  Web installer on the project site in Chrome or Edge over USB, which also offers a test build from the dev branch. It
  keeps settings in Felucca's first two song slots, so back up anything made in Felucca first. The README says Felucca's
  or Tuna's installer, or M-VAVE's official V15, takes the unit back, and calls the build one with no warranty.
brick_risk: false
tags: [generative, sequencer, synth-engine, drums, fx, voice, chords, midi, emulator, fork]
