  alt: "Sill styles page: four knob cards (lift, pump, vox, energy) above two columns of styles, CLUB and RADIO, with PARTY highlighted"
  credit: delirioux
  source_url: https://github.com/delirioux/sill
  first_party: true
versions:
- version: 1.0.4
  date: 2026-11-09
  url: https://github.com/delirioux/sill/releases/tag/v1.0.4
  notes: Keys now play any note pressed, including ones off the scale; a new SNAP setting in MENU (off by default, saved with the settings) snaps them to the scale again. Each build also carries Sill's own identity for The Firmware Hub.
- version: 1.0.3
  date: 2026-11-07
  url: https://github.com/delirioux/sill/releases/tag/v1.0.3
  notes: Silences Felucca's own keyboard layer, which had been playing each key's raw note beside Sill's scale-snapped hook, so keys off the scale no longer clash.
- version: 1.0.2
  date: 2026-11-04
  url: https://github.com/delirioux/sill/releases/tag/v1.0.2
  notes: Tunes the kick to each chord's root in the EURO style, so it follows the bass, and shows the processor load on the menu.
- version: 1.0.1
  date: 2026-11-04
  url: https://github.com/delirioux/sill/releases/tag/v1.0.1
  notes: Recognises the second maker's flash chip (JEDEC id 0xB36014) in newer FM-1 units, where 1.0 lost its settings and sets at power-off.
- version: '1.0'
  date: 2026-10-29
  url: https://github.com/delirioux/sill/releases/tag/v1.0
  notes: First main version. Swaps the brass sound for a soft keyboard chord and a solo trumpet hook, and shows the style on every page.
- version: 0.4.1
  date: 2026-10-29
  url: https://github.com/delirioux/sill/releases/tag/v0.4.1
  notes: Replaces the shouted crowd with a sung choir on the chord's third and fifth.
