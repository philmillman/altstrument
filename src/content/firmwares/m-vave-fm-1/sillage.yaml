versions:
- version: 2.2.2
  date: 2026-11-25
  url: https://github.com/lelacnoir-lab/Sillage/releases/tag/v2.2.2
  notes: Fixes HOME in DISPLAY > LARGE, which now shows all eight tracks in two columns of four where tracks 7 and 8 used to fall off the screen. Audio, projects and presets are unchanged from 2.2.1, and the release asks for confirmation of the new layout on a physical FM-1.
- version: 2.2.1
  date: 2026-11-23
  url: https://github.com/lelacnoir-lab/Sillage/releases/tag/v2.2.1
  notes: Keeps the 2.2 reverb and adds long-press FX latching and a dry-only live filter that does not touch the reverb and delay returns. The web editor gets larger controls grouped by module, sound families with engine search and a temporary A/B comparison that never writes to flash. The package identity is FM-1_946221.
- version: 2.2.0
  date: 2026-11-18
  url: https://github.com/lelacnoir-lab/Sillage/releases/tag/v2.2.0
  notes: Eight tracks, 16-voice polyphony, 448 presets, a 64-step sequencer, a 4-band EQ per track and master processing with stereo widening.
