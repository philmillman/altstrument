device: m-vave-fm-1
name: Simorgh
summary: >-
  Persian-flavoured fork of Felucca on a branch that adds a santur physical model, santur FM6 presets and a
  colour boot splash; dastgah scales are planned but not wired in.
description: >-
  The santur branch of a Felucca 1.6.1 fork adds a SANTR model to the physical-modelling engine (a main string,
  two slightly detuned course strings, a sympathetic octave string, mezrab strike types and controls for ring
  time, velocity, mezrab and damper, with CC 76 to 81 and CC 64), a new default SANTUR preset, three FM6
  presets and an eight-colour Simorgh boot splash. The FM6 presets shift the OWN and bank slot indexes by three,
  so saved Felucca projects that point at those slots can land on the wrong patch. The dastgah scale names
  exist in the source but are not connected yet. The default branch is plain Felucca, the project's installer
  page serves stock Felucca 1.6.1, and the plan document is in Swedish. Building needs the JieLi toolchain
  and SDK.
