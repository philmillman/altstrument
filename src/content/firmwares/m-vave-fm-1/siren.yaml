homepage: https://isod89.github.io/siren-fm1/webapp/installer/
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB without a hub; the install takes about a minute. The
  page also returns the unit to official V16 or V15, and Clipper or SLOOP can be reinstalled with their own installers.
  The .fwsc package is attached to the release.
