device: m-vave-fm-1
name: SIREN
summary: >-
  Generative rave firmware built on Clipper: it writes whole tracks in eight dance styles across seven layers, then
  starts the next, while the keys drop, build and take over layers like a DJ deck.
description: >-
  The styles are techno, trance, psy, acid, rave, hard, drum and bass and house, each with its own tempos, scales,
  grooves, drum kits and sound bank, and 201 sounds in total. The black keys trigger breaks, builds, drops, fills and
  new melodies, the white keys play any layer, and pages hold DJ effects, a mixer and 16 saved seeds that replay a track.
  Risers, a port of the OberVave synth voice and a split across both cores are included. The README credits the
  arrangement brain, screen and controls to 3dSam and the engines to Clipper and SLOOP, and calls this release
  experimental.
