device: m-vave-fm-1
name: SIX MACHINES
summary: >-
  Performance drum machine for the FM-1 with six synthesized machines (kick, snare, toms, FM, hats, clap) whose macro knobs rest on named sweetspots, a 32-step sequencer with parameter locks and trig conditions, a master section and live performance pads.
description: >-
  The README compares its approach with Elektron boxes and the Erica Synths LXR-02. Each machine has four macro knobs that each move several parameters along their own curves, and each has presets, user presets and pages for saturation, envelope and LFO modulation of a macro, mix, and ping-pong delay. A master section has a compressor with a kick-ducking mode, warmth, tilt and reverb. The white keys are the picked machine's steps, up to 32, with parameter locks, trig conditions, one to four retrigs and mutes. Scene B stores a second sound that a knob morphs towards. PERF mode turns the machine keys into mutes, the white keys into 16 pads (repeats, tape stop, build-up, throws, kills, fill, break, freeze, drop) and five black keys into held live effects. The machines are rendered on both cores. Settings, patterns and scene B save themselves. A browser build runs the same firmware.
