homepage: https://seattleuser0.github.io/skiff/
distribution: browser-installer
install_notes: >-
  Use this fork's installer page in Chrome or Edge over USB. The fork's README says the official Skiff installer
  installs only Skiff's own package, so the alternative is to download the package built by the fork's GitHub
  Actions workflow and install it with tools/fm1_install.py (Python with mido and python-rtmidi), run from the
  repository folder. Installing takes about two minutes and the FM-1 restarts on the new firmware.
