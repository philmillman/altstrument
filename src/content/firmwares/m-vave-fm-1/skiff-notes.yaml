device: m-vave-fm-1
name: Skiff Notes (per-note modes)
summary: >-
  Fork of Skiff 1.3.3 that gives each note in a step its own mode (tie, slide, accent) and lets a slide carry
  held notes on without re-striking them.
description: >-
  Each note of a step can be set to plain, accent, slide, accent plus slide or tie, from a new NOTES page after
  ROLL on the FM-1 and from note cells in the fork's own web editor. On a polyphonic track a tied note keeps
  sounding through the next step, including over a rest, and a slid note glides to the nearest note of the next
  step without a new attack, so two notes can hold while a third comes and goes. A SLIDE HOLD change does the
  same for step-level slides. To make room in flash and RAM the fork drops the USB serial console and keeps
  seven undo levels instead of eight. A block of four patterns that uses note modes is saved in a larger format
  that official Skiff cannot read, so going back to Skiff loses that block. The fork stays on Skiff 1.3.3 and does
  not include the 1.4 to 2.0 changes made upstream since. Skiff's own installer and editor load the firmware
  but cannot install this build or show its note modes, so the fork publishes its own.
