distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, or tools/fm1_install.py with the .fwsc from the releases page.
  The installer detects the connected device and picks its build. It can return the FM-1 to M-VAVE's official
  V15 or V16, whichever its start-up part needs, after saving a backup; the V16 route was tried only in the emulator at 2.0.2. An FM-1 stuck in boot mode (WL80UBOOT) can be recovered with tools/fm1_install.py or FM-1
  Transporter. SMK-37 Pro: the keyboard must already run M-VAVE's V016, which the installers enforce, and
  a backup of its flash should be made first, because the flash holds the keyboard's key and pad calibration and
  its Bluetooth pairings (SMK37.md in the repository gives the steps, using jl-uboot-tool on Windows or Linux).
  Use skiff-2.1.1-smk37.fwsc for the Pro; the -elite and -mke packages are for those models. Returning to
  M-VAVE's firmware takes your own unmodified SMK-37_Pro_016.fwsc. If an install is cut off, the keyboard waits in
  update mode and the installer resumes the write.
