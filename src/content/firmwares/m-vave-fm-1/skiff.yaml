versions:
- version: 2.1.1
  date: 2026-10-31
  url: https://github.com/illuminus5/skiff/releases/tag/v2.1.1
  notes: Fixes a click when a DRUM kit lane is struck again while it still rings; the new hit starts from where the last one was and the old one falls away over about 3 ms. Saved data is unchanged from 2.1. The release says the fix was tested on a computer, not yet on a unit, and builds for the SMK-37 Pro, Elite and MKE-P37 come with it.
- version: '2.1'
  date: 2026-10-31
  url: https://github.com/illuminus5/skiff/releases/tag/v2.1
  notes: Adds chord follow, where one track's chords move another track's notes by key, along the scale or to the nearest chord note, and QUANTIZE SOLO, which plays chords on the white keys and a tune on the black ones. Both were tried on an FM-1, not yet on an SMK-37.
- version: 2.0.3
  date: 2026-10-29
  url: https://github.com/illuminus5/skiff/releases/tag/v2.0.3
  notes: Adds KBD HOLD, which keeps played notes sounding without an arpeggio, sends whole chords into the arpeggiator on MONO sounds, and fixes song, FX-key and sampled-note bugs. The release says it was tested on a computer and in the emulator, not yet on a unit.
- version: 2.0.2
  date: 2026-10-27
  url: https://github.com/illuminus5/skiff/releases/tag/v2.0.2
  notes: Notes up to 128 steps long, a way back to V16 as well as V15 in the installer, and fixes to a latched FX key, MOD route 8 lighting, held drum steps, ARCADE pitch and the starting length of new notes.
- version: 2.0.1
  date: 2026-10-25
  url: https://github.com/illuminus5/skiff/releases/tag/v2.0.1
  notes: Fixes crackling in FM6 sounds from DX7 banks and the web editor not finding the unit on some Macs; OCT+ in the EDIT layer turns every drum lane on.
- version: '2.0'
  date: 2026-10-24
  url: https://github.com/illuminus5/skiff/releases/tag/v2.0
  notes: New sequencer pages, songs that chain, play once and change sounds, panned drum lanes and drum kits of your own, with new save formats and a converter for 1.x data.
- version: '1.4'
  date: 2026-10-20
