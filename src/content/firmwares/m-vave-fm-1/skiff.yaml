device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: Skiff
summary: >-
  Six-track groovebox forked from Felucca for the FM-1 and, since 1.4, the SMK-37 Pro: 14 synth and drum engines,
  64-step sequencer with trig conditions and parameter locks, pattern pool and songs, FM6 editing on the unit and a
  browser editor.
description: >-
  Fork of Felucca 1.1.5 that keeps its engines, sounds and file formats, so Felucca sounds and projects load.
  Each page draws what its knobs do, and holding HOME shows every control's job. Version 1.1 adds editing of
  every FM6 operator value and a graph of the operator envelopes. Version 1.3 adds an optional second processor
  core for 12 voices and MIDI learn. It has a web editor, a browser emulator and a stereo USB audio input for
  recording the master on a computer. Version 1.4 adds builds for M-VAVE's SMK-37 Pro keyboard from the same
  source, with the same tracks, engines and screens. On that keyboard the pads act as a step grid, the faders as
  a mixer, and the 37 keys and wheels add controls the FM-1 lacks. The SMK-37 build has been tried on one SMK-37
  Pro; the Elite and MKE-P37 packages are made the same way and have not been tried on a keyboard. Version 2.0 adds a new sequencer with per-note lengths, songs that chain, panned drum
  lanes and drum kits made from user samples. Version 2.1 adds chord follow and QUANTIZE SOLO.
