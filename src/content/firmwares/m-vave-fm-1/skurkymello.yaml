distribution: source-only
install_notes: >-
  Build a package with the Makefile, then install it over USB-MIDI with tools/fm1_install.py on an FM-1 running
  M-VAVE's V15 or another firmware with the update loader. Holding OCT- while switching on reaches the updater.
