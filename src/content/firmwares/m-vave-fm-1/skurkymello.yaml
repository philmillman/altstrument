device: m-vave-fm-1
name: SkurkyMello
summary: >-
  Generative melody sequencer and synth: a 16-step lead with filter and grit, a bass line, chords, a four-voice drum
  kit, samples, effects and a randomizer, ported from the author's browser instrument and built on Dinghy.
description: >-
  The sequence is split into segments A to D and held in 16 pattern slots, one per white key. A randomizer rolls the
  lead or the whole band in one of several styles, keeps three levels of undo and can lock single parts. The firmware is a
  fork of Dinghy 0.3 that now carries the FM-1 platform parts of Dinghy 0.5 (installer, update loader, USB buffers and flash map) and Dinghy 0.4's TRS MIDI input, on the Felucca and SLOOP platform. The README says every
  package has run in the fm1-emu emulator and not on a real FM-1, and the first hardware flash is described in
  docs/mello/FIRST_FLASH.md. The firmware is GPL-3.0-only, while the original browser instrument and the design notes
  in the repository are not free software.
