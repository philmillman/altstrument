  notes: No tagged releases; this is the latest commit, labelled build 0.5-f99. Since 0.5-f97 it syncs Dinghy 0.5's update loader, installer, USB buffer alignment and flash map, and the README has a new front page. Build 0.5-f97 accepts the UC25HQ80 flash chip of newer FM-1s, makes the BASS page say what plays it and the chord it follows, and rolls a new style on each tap of GROOVE with ANY. The build before it, 0.5-f94, added more punch and air to the sound, opens the styles' leads and raises the hats, and animates the start screen with a playhead over the sixteen steps.
