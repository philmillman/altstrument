  notes: No tagged releases; this is the latest commit, a documentation change on build 0.5-f133. Builds f107 to f133 add a second-core option (off by default) that moves the chords, drums and reverb network onto the second core, a SYSTEM page with CPU 2 load, an Oliverb reverb with its own knobs, and a looping delay with GLIDE, PITCH, DIFFUSE and FREEZE plus a route into the reverb. Since 0.5-f99 it adds BAND on the random mask so a tap can roll the lead alone, an UNLOCK key while a part is locked, a lit ON on the CHORD and SAMPLE pages, and a roll that lands on the loop's first step, and the project page now runs the firmware in the browser. Build 0.5-f97 accepts the UC25HQ80 flash chip of newer FM-1s and builds f94 and f97 reworked the BASS page, GROOVE and the sound.