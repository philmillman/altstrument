  notes: Pre-release engineering build; recovers a single late voice job on the second core instead of retiring it. Physical acceptance is pending. Latest of a run of testing builds from 0.1.4 to 0.1.18 over two days, not listed separately, that include four editable notes per step, held-note lengths and a worst-callback breakdown on GLO (0.1.14), and a two-core voice renderer corrected after the author's FM-1 captures showed missed deadlines (0.1.16 and 0.1.17).
