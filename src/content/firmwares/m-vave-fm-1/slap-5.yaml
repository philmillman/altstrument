  date: 2026-11-21
  url: https://github.com/CodingSlapfu/SLAP-5/releases/tag/v0.1.25-hardware-testing
  notes: Pre-release candidate; physical install, sustained audio and LCD timing for this build are pending. Adds five taller HOME track cards, a Vinyl Stop effect, independent Live FX assignments, eight new saw programs, V11 banks for FM6 operator envelopes and feedback, and Studio quick recording with drum generation, clip undo and per-bar level and pan automation. Back up V11 work before downgrading.
- version: v0.1.24-hardware-testing
  date: 2026-11-21
  url: https://github.com/CodingSlapfu/SLAP-5/releases/tag/v0.1.24-hardware-testing
  notes: Pre-release; the 0.1.25 notes record successful hardware feedback from the author for this build. Adds six-operator FM with three routings, four interpolated wavetable frames, drum generation of one to four bars and a Studio arranger with editable scenes, a mixer and clip lengths. Edited FM6 or wavetable banks need 0.1.24 or later.
