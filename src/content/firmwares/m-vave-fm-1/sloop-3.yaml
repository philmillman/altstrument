versions:
- version: v3.4.1-beta
  date: 2026-11-20
  url: https://github.com/isod89/sloop3-fm1/releases/tag/v3.4.1-beta
  notes: Pre-release. Fixes two causes of random freezes, a CPU OVERLOAD message drawn in the middle of a save and interrupts running on the bootloader's stack, and levels all 156 sounds and the 32 synthesised drum kits against each other. Saving while playing no longer cuts the sound, and the drum kits are about three times as loud.
- version: 3.4.0-beta
  date: 2026-11-17
  url: https://github.com/isod89/sloop3-fm1/releases/tag/v3.4.0-beta
  notes: Pre-release. Brings back the pages, gestures and saving of SLOOP 2.8.5, where only saved patterns change and SAVE held with a key plays a pattern, with project format 16 that 3.3.x cannot read. Lowers the DAC level by 6 dB as in SLOOP 2.8.5, keeps SPEAKER LOWCUT off the USB output and lets the web editor build a drum kit from your own samples.
- version: 3.3.7-beta
  date: 2026-11-16
  url: https://github.com/isod89/sloop3-fm1/releases/tag/v3.3.7-beta
  notes: Pre-release. Makes all tracks start a new pattern together, stops recorded loops from stacking chords, records on the steps by default and accepts the UC25HQ80 flash chip of newer FM-1s (not yet tried on such a unit).
- version: 3.3.6-beta
  date: 2026-11-16
  url: https://github.com/isod89/sloop3-fm1/releases/tag/v3.3.6-beta
  notes: Pre-release. Adds the breakbeat slicer in the web editor, key lights that guide menus, six visualisers and a guided installer page.
