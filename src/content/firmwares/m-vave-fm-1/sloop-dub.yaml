  url: https://github.com/altessproduction
source: https://github.com/altessproduction/sloop-dub-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  README and LICENSE give GPL-3.0-only, as SLOOP; the icon atlas and panel image are separate assets (LICENSING.md).
homepage: https://altessproduction.github.io/sloop-dub-fm1/dub/
distribution: browser-installer
install_notes: >-
  Open the project's web installer in Chrome or Edge with the FM-1 on USB; it checks the package's SHA-256 before writing. The .fwsc is also attached to the release for another installer. Projects, presets, samples and settings stay on update. Going back to the base SLOOP or to M-VAVE's own firmware is described in the README, and holding OCT- while switching on starts the USB rescue.
brick_risk: false
tags: [sequencer, synth-engine, drums, fx, performance, emulator, fork]
versions:
- version: 1.0.0
  date: 2026-11-10
  url: https://github.com/altessproduction/sloop-dub-fm1/releases/tag/v1.0.0
  notes: First release, a .fwsc with a web installer that checks its SHA-256 before writing. The isolator now works as a four-band crossover with real mutes, the delay TIME knob bends a looping tape-style delay, and the DLY LEVEL and SIREN LEVEL lines redraw as the knobs turn. Projects, presets, samples and settings carry over on update.
