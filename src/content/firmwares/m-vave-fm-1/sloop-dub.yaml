device: m-vave-fm-1
name: SLOOP Dub
summary: >-
  SLOOP fork that adds a reggae and dub layer: a siren, ten 64-step riddims on four tracks, skank chords, dub sound presets and a four-band isolator, with a browser emulator.
description: >-
  The additions live in separate dub source files and are off until switched on from new pages in the HOME menu. The siren has five waves,
  five sweep shapes and a delay send. A four-track dub sequencer (bass, skank, melody, drums) plays ten riddims that can be loaded whole or one
  line at a time, using the existing SLOOP engines for its sounds, and a one-key skank plays eight chord types. A DUB ISOLATOR splits the
  mix into four bands with a mute and gain on each. Everything else is SLOOP's. Version 1.0 rebuilt the isolator's crossover so each band mutes properly and added tape-style bending of a looping delay by its TIME knob. The project site has a browser installer for the 1.0 package and an emulator that runs the dub build.
status: active
authors:
