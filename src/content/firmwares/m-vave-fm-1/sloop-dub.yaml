device: m-vave-fm-1
name: SLOOP Dub
summary: >-
  SLOOP fork that adds a reggae and dub layer: a siren, ten 64-step riddims on four tracks, skank chords, dub sound presets and a four-band isolator, with a browser emulator.
description: >-
  The additions live in separate dub source files and are off until switched on from new pages in the HOME menu. The siren has five waves,
  five sweep shapes and a delay send. A four-track dub sequencer (bass, skank, melody, drums) plays ten riddims that can be loaded whole or one
  line at a time, using the existing SLOOP engines for its sounds, and a one-key skank plays eight chord types. A DUB ISOLATOR splits the
  mix into four bands with a mute and gain on each. Everything else is SLOOP's. Version 1.0 rebuilt the isolator's crossover so each band mutes properly and added tape-style bending of a looping delay by its TIME knob. The project site has a browser installer for the 1.0 package and an emulator that runs the dub build.
status: active
authors:
- name: altessproduction
  url: https://github.com/altessproduction
source: https://github.com/altessproduction/sloop-dub-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  README and LICENSE give GPL-3.0-only, as SLOOP; the icon atlas and panel image are separate assets (LICENSING.md).
homepage: https://altessproduction.github.io/sloop-dub-fm1/dub/
distribution: browser-installer
install_notes: >-
  Open the project's web installer in Chrome or Edge with the FM-1 on USB; it checks the package's SHA-256 before writing. The .fwsc is also attached to the release for another installer. Projects, presets, samples and settings stay on update. Going back to the base SLOOP or to M-VAVE's own firmware is described in the README, and holding OCT- while switching on starts the USB rescue.
brick_risk: false
tags: [sequencer, synth-engine, drums, fx, performance, emulator, fork]
versions:
- version: '1.3'
  date: 2026-11-11
  url: https://github.com/altessproduction/sloop-dub-fm1/releases/tag/v1.3
  notes: The riddim bank grows from ten to 22 (adding ska, dancehall and UK bass music) with four associated patterns each, loadable separately from the RDM page, and the original ten now play their full grooves. The notes also credit 1.1 with 158 sound-system presets and 1.2 with 37 drum kits. Package sloop-dub-1.3.fwsc; projects, presets, samples and settings are kept.
- version: 1.0.0
  date: 2026-11-10
  url: https://github.com/altessproduction/sloop-dub-fm1/releases/tag/v1.0.0
  notes: First release, a .fwsc with a web installer that checks its SHA-256 before writing. The isolator now works as a four-band crossover with real mutes, the delay TIME knob bends a looping tape-style delay, and the DLY LEVEL and SIREN LEVEL lines redraw as the knobs turn. Projects, presets, samples and settings carry over on update.
