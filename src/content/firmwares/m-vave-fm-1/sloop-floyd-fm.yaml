  date: 2026-10-06
  url: https://github.com/renebohne/sloop-fm1/releases/tag/v2.4
- version: 2.2-visual-fm
  date: 2026-10-05
  url: https://github.com/renebohne/sloop-fm1/releases/tag/v2.2-visual-fm
  notes: Adds the visual FM editor and an option to light the keys of notes that sound.
