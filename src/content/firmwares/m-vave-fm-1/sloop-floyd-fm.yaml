device: m-vave-fm-1
name: SLOOP Floyd FM
summary: >-
  SLOOP fork that adds a 4-operator FM engine with per-operator envelopes, a seven-page editor and an on-screen
  envelope and voice display.
description: >-
  Based on SLOOP, with the engine's pages for algorithm, operators 1 to 4, level and ratio. The release notes
  credit Floyd Steinberg's 4-operator FM concept video and Jonathan Zeppa's FloydFM plug-in as the inspiration.
  The tagged 2.4 release also merges SLOOP 2.3. The main branch has since been resynced with upstream SLOOP,
  and the engine's design notes are in FLOYD.md on the tag and on the feature branch.
status: active
authors:
- name: renebohne
  url: https://github.com/renebohne
source: https://github.com/renebohne/sloop-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from SLOOP and Felucca.
homepage: https://github.com/renebohne/sloop-fm1/releases/tag/v2.4
distribution: download
install_notes: >-
  Download sloop-2.4.fwsc (a felucca-2.4.fwsc package is attached as well) from the release and install it with
  the SLOOP web installer or tools/fm1_install.py. Roll back with M-UPGRADE or the installer.
brick_risk: false
tags: [synth-engine, fm, ui, sequencer]
versions:
