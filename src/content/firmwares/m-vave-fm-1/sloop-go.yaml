device: m-vave-fm-1
name: Sloop Go
kind: tool
summary: >-
  Native Android editor for SLOOP: sound, sequencer, FM6 patch, drum synth, song, sample and mixer pages
  that talk to the FM-1 over USB-MIDI.
description: >-
  Based on the SLOOP web editor, it edits tracks, synth parameters, pattern notes with a piano roll and drum
  grid, DX7 SysEx patches, the user sample slots (loading files or recording from the phone, converted in the app)
  and the song order, with undo. Version 1.8.0 adds a recorder that captures the FM-1's USB audio as WAV or FLAC. It needs a phone with USB host support and an FM-1 already running a recent
  SLOOP. The release APK is signed with a debug key, so Android and Play Protect warn on install, and the app
  checks GitHub releases for updates.
status: active
authors:
- name: jahlib
  url: https://github.com/jahlib
source: https://github.com/jahlib/sloop-fm1-go
source_status: open
license: GPL-3.0-only
license_notes: Declared in the README as version 3 of the GPL, with no later-version clause.
homepage: https://github.com/jahlib/sloop-fm1-go/releases
distribution: download
requires_stock: SLOOP 2.6 (editor protocol v10); older SLOOP hides newer features
install_notes: >-
  Download the APK on the phone and allow installs from that source; it can also be built from the repository.
  Back up the FM-1 first, since edits and sample writes can overwrite its data.
brick_risk: false
tags: [editor, sequencer, sampler, midi]
image:
  url: https://raw.githubusercontent.com/jahlib/sloop-fm1-go/main/screenshots/1.png
  alt: "Sloop Go sound page for track 1 with Global, Master, Envelope and LFO knob blocks"
  credit: jahlib
  source_url: https://github.com/jahlib/sloop-fm1-go
  first_party: true
versions:
- version: 1.8.0
  date: 2026-11-01
  url: https://github.com/jahlib/sloop-fm1-go/releases/tag/1.8.0
  notes: The release page has no notes. Its commits add a USB audio recorder (WAV or FLAC) with spectrum, pan and waveform analyzers, an FM6 algorithm diagram and compact editor, a theme setting, compressor and limiter knobs, and sampling from the FM-1's USB audio.
