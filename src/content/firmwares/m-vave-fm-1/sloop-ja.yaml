homepage: https://github.com/azsoft-jp/sloop-fm1/blob/codex/ja-localization-sloop-2.6/docs/JA_LOCALIZATION.md
distribution: source-only
install_notes: >-
  Build with tools/build_ja_site.sh, which makes the package and a local update site, then serve dist/ja-2.6 and install
  from Chrome or Edge. Its notes say to save a full project backup from the web editor first and keep an unmodified
  M-VAVE FM-1.fwsc to go back. Hardware recovery was not tested by the author. Installing is at your own risk.
