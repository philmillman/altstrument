device: m-vave-fm-1
name: SLOOP JA
summary: >-
  Japanese-language build of SLOOP 2.6: katakana UI strings on the FM-1 screen and a translated web editor and installer,
  with a hand-picked 75-glyph font that fits the app area.
description: >-
  Lives on the codex/ja-localization-sloop-2.6 branch of azsoft-jp's SLOOP fork; the fork's main branch is unmodified
  SLOOP. The 263 UI strings are kept in a table with their English originals, and a small UTF-8 decoder in the drawing code
  looks up glyphs from a Noto Sans JP subset of 75 katakana and marks, so ASCII output stays pixel-identical. Protocol
  names, saved identifiers and SysEx values are unchanged. Kanji, other languages and a language setting are out of scope, and
  engine, preset and note names stay in English. Its notes record that the build was measured on the host and not
  installed on a unit, and that it was not offered upstream or distributed publicly. The branch includes a built package
  for a local update site and a PDF report with screen captures. The 2.6 project format cannot go back to 2.5.
