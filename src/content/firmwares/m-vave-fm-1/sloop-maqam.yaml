device: m-vave-fm-1
name: SLOOP Maqam
summary: >-
  SLOOP 2.6 fork that adds a 24-note quarter-tone grid with 52 Western, Turkish makam, Arabic maqam and Indian
  raga scales, per-step pitch bends and a browser installer and emulator.
description: >-
  Starts from SLOOP 2.3 and merges upstream 2.6, so the groovebox itself is SLOOP's. The addition is microtonal
  pitch: hold SEL to open a key layer that picks the scale set, the scale and an equal or traditional tuning, with
  24 roots, ascending and descending forms, and quarter-tone keys played with OCT- or OCT+ and a key. A step's
  bend is a lockable CENT parameter, and the web editor reads and writes quarter-tone notes. The repository
  carries a visual guide to the scale screens, a Maqam splash screen with its own font, a browser emulator of the
  firmware with Web MIDI input, and a GitHub Pages workflow that builds an installer with this firmware and
  previews of pull requests. It has not followed SLOOP past 2.6.
