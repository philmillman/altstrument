device: m-vave-fm-1
name: SLOOP UC25HQ80
summary: >-
  Experimental SLOOP 2.8.4 build that also accepts the UC25HQ80 flash chip (JEDEC ID 0xB36014), so projects can be saved on FM-1 units that carry it. A five-file source patch; one user reports it installed and saves.
description: >-
  Stock SLOOP 2.8.4 checks for one flash chip ID (0x856014) in three places: when it enables project storage, in the update loader's known-chip check and in the recovery entry, so on a unit with the UC25HQ80 it installs but keeps data only in RAM. This build allows 0xB36014 as well and leaves unknown IDs refused. Five production files changed, adding 23 lines and removing 4, which grows the application by 56 bytes and the loader by 22. The SPI commands, flash layout, timeouts and project format are untouched. The firmware shows SLOOP 2.8.4 UC TEST and keeps the package identity FM-1_900. The case report records one user's install with M-Flasher on a unit that came with V16, and states that a cold power-cycle persistence test, long-term use and recovery were not established. The wider test suite did not finish fully green. The release is a pre-release with the package, the full source, test reports and hashes.
