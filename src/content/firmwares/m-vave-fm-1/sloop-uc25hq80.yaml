license: GPL-3.0-only
license_notes: >-
  The patch applies to isod89/sloop-fm1 commit 91f3018 and is GPL-3.0-only, as SLOOP is. It is not covered by the MIT licence of the downloader userscript in the same repository. No SDK files or firmware images are in the repository; the release carries the complete corresponding source.
distribution: download
requires_stock: An FM-1 that reports flash ID 0xB36014 (UCUN UC25HQ80)
install_notes: >-
  Back up the whole 1 MiB flash with M-Flasher first, install only on a unit that reports 0xB36014, and leave the bootloader replacement and settings erase options unticked, as in the case report. Then boot, check the screen reads SLOOP 2.8.4 UC TEST, save a test project, power off with USB disconnected and reload it before trusting the unit with important work. The packaged .fwsc is on the release page next to its SHA-256 list.
