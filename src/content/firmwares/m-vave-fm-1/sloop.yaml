device: m-vave-fm-1
name: SLOOP
summary: >-
  Live-performance groovebox built on Felucca: 4 tracks, 12 engines including 6-op FM with DX7 import,
  drum machine, 27 punch-in effects, user samples, song mode, USB audio, web editor.
description: >-
  Projects, patterns and songs without mandatory presets. Three synth tracks plus a drum track, TRS MIDI
  in, MIDI clock sync, physical models of strings and bells, sample chopping, and a web editor with backup
  and restore. Several forks build on it (sloopDX, zp12, ORBIT, FM1 Move, FM1 Quest, Optimist and the
  SMK-37 Snoop37 port).
status: active
authors:
- name: isod89
  url: https://github.com/isod89
source: https://github.com/isod89/sloop-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Code is GPL-3.0-only; icon atlas and panel image are separate assets (LICENSING.md). Includes msfa (Apache-2.0)
  for the FM6 engine.
homepage: https://isod89.github.io/sloop-fm1/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB. Roll back to M-VAVE stock V15 with M-UPGRADE (the browser
  installer's return-to-stock option was removed in 2.8). If SLOOP or a derivative will not start, hold OCT-
  alone while powering on to enter USB rescue (per fm1-editor.com).
brick_risk: false
tags: [sequencer, synth-engine, drums, sampler, fx, performance, usb-audio, midi, fm, physical-modeling,
  editor]
video:
  url: https://www.youtube.com/watch?v=yedcHP3jy5s
  title: "Using the M-VAVE FM-1 with SLOOP Custom Firmware | First Go"
  credit: "Darren Lock Music"
  first_party: false
versions:
- version: 2.8.5
  date: 2026-11-04
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.8.5
  notes: Recognises the UC25HQ80 flash chip (JEDEC ID 0xB36014) of FM-1s sold from late 2026 as well as the earlier Puya chip, in the app, the USB rescue and the update loader. Before this such units kept projects in RAM and the update loader refused to install.
- version: 2.8.4
  date: 2026-10-30
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.8.4
  notes: Bug-fix release. Rounds the mix properly so note tails lose their buzz, starts unison voices out of phase, tunes the physical-model strings, makes a firm press on a layer button open its pages, and clears stale engine data left by Clipper; projects and presets are kept.
- version: 2.8.3
  date: 2026-10-27
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.8.3
  notes: A held POLY note no longer stutters when other notes are recorded over it, a busy drum track stops cutting kicks, sample chops restart from silence, and the second core refuses a corrupted job instead of crashing.
- version: 2.8.1
  date: 2026-10-23
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.8.1
  notes: The per-step sheet now opens as a strip along the bottom so the piano roll and drum grid stay visible, plus a fix on the PUNCH page.
- version: '2.8'
  date: 2026-10-21
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.8
  notes: Adds a piano-roll note editor, a per-step sheet for synth and drum steps, filter resonance, MIDI Bank Select and a settable punch-in fade; USB rescue now opens reliably.
- version: 2.7.1
  date: 2026-10-16
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.7.1
  notes: Fixes a crash screen that could follow a glitch with the second core.
- version: '2.7'
  date: 2026-10-16
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.7
  notes: Runs on both processor cores; adds fifteen arp modes, keyboard hold, looping samples, drum tune and decay, favourite sounds and a LIVE editor page.
- version: '2.6'
  date: 2026-10-11
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.6
  notes: Sustain pedal and pitch bend over MIDI.
- version: '2.5'
  date: 2026-10-09
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.5
- version: 2.4.1
  date: 2026-10-07
  url: https://github.com/isod89/sloop-fm1/releases/tag/v2.4.1
