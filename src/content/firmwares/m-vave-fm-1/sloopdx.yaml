device: m-vave-fm-1
name: sloopDX
summary: >-
  SLOOP's live workflow around a 6-operator DX7 engine ported from Dexed's msfa, with a resonant filter,
  256 SysEx voices, on-device voice editing, programmable FM drums and patterns up to 128 steps.
description: >-
  Replaces SLOOP's engines with one DX7 engine (32 algorithms, 99% sample-identical to Dexed per the author),
  adds an OMNI chord-harp mode and per-effect pages. zp12 and FM-1 Doom build on its platform. Version 4.0
  computes the sound on both processor cores and brings in SLOOP 2.6 and 2.7's MIDI features. The README
  calls 4.0 a beta that has not yet run on a device; it reports 3.5 as played on a real FM-1.
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
source: https://github.com/zvenson/dxsloop
source_status: open
license: GPL-3.0-only
license_notes: Includes the Apache-2.0 msfa core from Dexed; see LICENSING.md.
homepage: https://dx7.designburgapps.com/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer from the project site, with a web editor. Keeps SLOOP-style USB rescue (hold
  OCT- while powering on).
brick_risk: false
tags: [fm, synth-engine, sequencer, drums, chords, fx, usb-audio, editor]
