homepage: https://github.com/AlexanderSeel/SloopUI
distribution: source-only
requires_stock: SLOOP firmware with editor protocol v5
install_notes: >-
  npm install, then npm run dev; use Chrome or Edge on localhost or https and allow MIDI with SysEx. Choose HARDWARE, press SCAN, select the FM-1 ports and Connect. The sample upload overwrites the chosen USR slot.
brick_risk: false
