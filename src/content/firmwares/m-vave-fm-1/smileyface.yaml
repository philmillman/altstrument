device: m-vave-fm-1
name: Smileyface
summary: >-
  Acid bass-line firmware: write a 16-step pattern or roll a random one with the LFO button, then play with 303-style
  filter, accent, slide and Devil Fish-style knob pages, with a browser simulator.
description: >-
  Built on the author's Chipbox. The screen shows the 16 steps as bars, with smileys under them that are asleep on
  a rest and awake on a note. Keys write notes, ENV sets an accent, SEL slides a step into the next, EDIT writes a
  rest, and SELECT with SEL rotates the pattern. Six knob pages follow the panel of the TD-3-MO acid box: filter
  cutoff, resonance, envelope mod and decay, then tune, accent, slide and tempo, then drive, accent decay, key
  tracking and attack, then FM, swing, length and level, and two pages of switches for wave, sub oscillator,
  muffler, sweep speed, hi-res and poles. The project site has an online player, a guide and a cheat sheet. The
  releases up to 0.0.4 are labelled beta; 1.0.0 is not, and the README says only that it has been tested. Version 1.0.1-fx adds an FX page
  that puts one effect after the bass, chosen with ALGORITHM from three delays, two crushers and two drives.
status: active
authors:
- name: Pasquale Barilla (pbarilla)
  url: https://github.com/pbarilla
source: https://github.com/pbarilla/smileyface
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md. The platform layer is Felucca's with SLOOP's changes, the wiring comes from
  Dinghy by zvenson, and the font is SIL OFL 1.1. No JieLi SDK files are in the tree.
homepage: https://ihavenocluewhatimdoing.com/smileyface/
distribution: browser-installer
install_notes: >-
  Installer page on the project site in Chrome or Edge over USB, using Felucca's installer code; do not unplug it
  until it finishes. The releases also attach the .fwsc package. The README gives no notes on returning to stock.
  Installing is at your own risk.
brick_risk: true
tags: [acid, sequencer, synth-engine, filter, fx, emulator, fork]
