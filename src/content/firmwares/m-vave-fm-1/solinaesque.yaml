device: m-vave-fm-1
name: Solinaesque
summary: >-
  Paraphonic divide-down string machine with 16', 8' and 4' registers, a shared filter and envelope, ensemble, flanger, delay and reverb, an arpeggiator and chord memory.
description: >-
  Twelve phase-locked top oscillators are divided down to every note, so any number of keys sound, with band-limited
  saws that morph towards square and a narrowing pulse. One resonant low-pass filter and one ADSR serve all notes, and an
  LFO covers vibrato, pulse width and a delayed fade-in. Effects are the three-phase string ensemble, a flanger, a stereo
  delay and reverb. It has hold, chord memory, an arpeggiator that follows MIDI clock, 16 factory sounds and 32 named user
  slots, and full MIDI over USB and TRS, with presets that can be backed up and restored over SysEx. It also works with the
  fm1-reader screen reader and has a MIDItoSpeech device file for synthaccess. The project has host tests and a browser
  emulator, and is built on the Felucca platform as M-Vave-OP1 carries it.
status: active
