device: m-vave-fm-1
name: SPELLBOX
summary: >-
  Talking spelling game after the 1978 Speak & Spell, with an LPC speech voice, an eight-character display, five word
  games on four levels, a text-to-speech page and circuit-bending controls, all synthesized.
description: >-
  The games are SPELL, LETTER, SAY IT, SECRET CODE and MYSTERY WORD (a hangman), played in English with 100 words of
  up to eight letters in four levels. The keys are lettered A to Z from F3 upwards, with the highest key as enter, and
  the screen imitates a blue-green fluorescent display. Beyond the games, SING sings a chosen word at the pitch of each
  key, LETTER SYNTH makes each key sing its letter, and SPEAK reads typed text through a 12,000-word pronunciation
  dictionary, word endings and letter-to-sound rules. Voice pitch, speed, chip clock and tone are adjustable, and BEND
  controls corrupt the coefficients, stutter frames, flatten the intonation and crush the converter. The speech data
  was made with espeak-ng and recoded to LPC frames by a script in the repository, with no data from the original's
  ROM. The README (in French) calls it an independent project with no link to Texas Instruments or M-VAVE. It is
  built on konsumer's foma framework.
