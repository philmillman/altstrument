device: m-vave-fm-1
name: SPIRALFM1
summary: >-
  Forest, goa, psytrance, hi-tech and tekk groovebox firmware built on Mycelium, SLOOP and Felucca, with
  curated grooves, four factory songs, a PSY FX page and a browser Studio.
description: >-
  Adds six 32-step factory grooves, four 240-bar songs, a dedicated PSY FX panel (shared bass and kick
  lowpass, synced echo with reverb, feedback with low-end drive, ring mod and stutter), per-track probability,
  ARP latch-roll and kick envelopes on top of the Mycelium and SLOOP layers. It carries 21 curated factory
  presets plus a 16-preset movement-bass pack and three procedurally generated drum kits, with its own mark
  and icon set. The Studio page runs the firmware's DSP compiled to WebAssembly, playable from a computer
  keyboard or MIDI keyboard without an FM-1, and a web editor with backup is included. The README calls the
  build a 1.0 beta and says the device firmware still derives from the Mycelium 1.0 build.
status: active
