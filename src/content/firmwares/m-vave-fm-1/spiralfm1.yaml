homepage: https://spiralfractalplugins.github.io/spiralfm1/
distribution: browser-installer
requires_stock: V15
install_notes: >-
  Web installer in Chrome or Edge: put the FM-1 on USB, hold POWER and B1, then press Install. Make a backup
  with the web editor first. The README says flashing never touches the boot area and that SLOOP or the official
  firmware can be installed again. fm1_install.py also works from a terminal.
