device: m-vave-fm-1
name: SPLITMILK
summary: >-
  Split-keyboard performance firmware that plays two instruments at once, CHOC on the lower keys and BERRY on the upper,
  with 24 sounds, chord and arpeggiator modes, per-instrument effects, a wave editor, a drum machine and a pad sequencer.
description: >-
  Rights warning: two of the eight drum kits use recordings that are not under the GPL. The LM-1 kit is made from
  six sounds of rossf's Freesound pack under Sampling+ 1.0, which allows noncommercial sharing of whole copies with
  credit, and the MINI POPS kit from six sounds of Drumkito's Korg Mini Pops pack, whose site reads "All Rights
  Reserved" and which states no licence.

  The split point can sit on any key. CHOC and BERRY each have their own sound, octave, volume and playing mode, which is
  single notes, one-key major, minor or seventh chords, octaves or an arpeggiator. A latch keeps held notes sounding,
  and each instrument has reverb, delay, distortion, chorus and phaser. A wave editor changes oscillators, filter,
  envelope and LFO. The drum machine has eight kits, and the pad sequencer Paddock plays up to four bars of chords along
  with the drums. Four save slots hold setups, and the current setup survives power-off. It grew out of QUARTET, whose
  synth engine and drum kits it reuses, and runs on Dinghy's platform layer. The repository also holds Dinghy's SMK-37
  board code, but the README describes the firmware for the FM-1 only.
