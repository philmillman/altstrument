based_on: m-vave-fm-1/quartet
distribution: download
install_notes: >-
  Install splitmilk-1.0.fwsc from the release with M-Flasher, after backing up the whole flash, or with
  tools/fm1_install.py over USB-MIDI. The unit then reports itself as FM-1_986. To go back, restore the M-Flasher backup or
  install M-VAVE's official firmware; settings and slots sit where the stock firmware keeps presets, so without a backup
  the stock presets may need System, Reset Patches. Holding OCT- while switching on starts a USB rescue mode.
brick_risk: false
