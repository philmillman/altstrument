distribution: source-only
requires_stock: Flashes over official V15 or another FM-1 firmware
install_notes: >-
  Run setup.sh, then build with the JieLi toolchain through build.sh on Linux x86-64, or on macOS with Docker, or push a v3.0 tag to your own GitHub repository so the workflow builds spooky-3.0.fwsc. Install with fm1_install.py from the fm1-base submodule. The README says the bootloader is not touched, so safe mode and the way back to stock remain. Back up anything on the unit first.
