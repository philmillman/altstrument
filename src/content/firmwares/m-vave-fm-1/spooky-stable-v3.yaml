device: m-vave-fm-1
name: Spooky Stable v3
summary: >-
  No-text toy firmware for a young child that adds a School mode to v2's eight unicorn toys: four learning toys on rhythm, pitch and counting, with no fail states, plus a sticker book.
description: >-
  Version 3 of hvemnd's Spooky Stable toy. Play mode is v2's, with eight buttons that each open an animated unicorn toy, every key acting at once and notes snapped to the scale of one of eight moods. Holding OCT- rings a School Bell that turns four of the toys into learning toys. Poop Parade is a three-lane step sequencer, Fart Mix-Up is a two-operator FM synth with a ratio snap, Pee Piano is a pitch ladder where height maps to pitch, and Booger Wall is a matching, counting and sorting game. Short challenges come only after some free play and never show a fail state, a timer or a score, and difficulty follows the last eight tries. A sticker book holds 24 stickers won by discoveries, and every fourth one unlocks a hat or mane. A parent's switch at power-on turns the challenges off. Settings from a v2 unit are carried over at the first v3 boot. The repository is a source snapshot with a setup script and a GitHub Actions workflow that builds the package from a pushed tag, and it has no tag or release yet. The README says the code was tested in a host simulator only and has not run on a real FM-1: the JieLi build size and the frame rate of Fart Mix-Up are the open points.
