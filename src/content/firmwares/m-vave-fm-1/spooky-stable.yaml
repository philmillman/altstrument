device: m-vave-fm-1
name: Spooky Stable v2
summary: >-
  No-text toy firmware for a young child: eight buttons open animated unicorn toys, every key triggers sound and animation, and notes snap to the scale of one of eight moods.
description: >-
  Each of the eight function buttons opens a toy with its own screen animation, sounds and four knob parameters: fart, poop, pee, burp, sneeze, a drum jam with a loop recorder, a toilet flush and a booger flick. Pressing any of the 27 keys makes the toy act at once, and notes are quantised to the current mood's scale, which also changes the sky, props and particles. Volume is capped, and a quiet mode lowers it further. Hats and manes unlock by playing, and settings are remembered across power cycles. This v2 splits the single-file v1 app into modules, with a 12-voice FM synth, 60 patches and a host-side test run. It is built on fm1-base, and the repository has no release or tag yet; the README describes unzipping the project and tagging it in one's own GitHub repository to get a package built by the workflow.
