requires_stock: Flashes over official V15 or another FM-1 firmware
install_notes: >-
  Build with the JieLi toolchain through build.sh on Linux x86-64, or on macOS with Docker, and install the package with fm1_install.py from the fm1-base submodule. The README says the bootloader is not touched, so the safe mode and the way back to stock remain. Back up anything on the unit first.
