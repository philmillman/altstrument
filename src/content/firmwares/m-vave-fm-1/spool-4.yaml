device: m-vave-fm-1
name: SPOOL-4
summary: >-
  Four-loop recorder for the FM-1: record loops by playing, overdub in layers with undo and redo, and capture the
  phrase you just played.
description: >-
  Four loops of up to 16 bars and 448 notes each, each with its own sound and MIDI channel. The first take sets a
  loop's length to the nearest bar, or to a fixed length, and later passes are overdub layers that UNDO and REDO
  remove and restore. Quantise is an amount and a grid applied at playback and never written into the notes. CAPTURE
  puts the phrase last played on the keys into the loop, whether or not recording was on. Other functions are erase
  while a loop plays, note repeat, doubling and halving a loop, half, normal or double speed, and transpose. It has
  its own 8-voice synth, drums and echo, sends MIDI over USB and Bluetooth, and can send or follow MIDI clock. The
  README names loopers, the OP-1 tape and MPC live record as the models.
status: active
