license: GPL-3.0-only
license_notes: >-
  The LICENSE file is MIT, but LICENSING.md states that the firmware as a whole is GPL-3.0-only, because the effects (from FMini-1, after Felucca) and the sequencer (from SLOOP) are GPL-3.0-only. The engine, tools and built-in waves are MIT, and fm1-base is MPL-2.0.
homepage: https://leonardolopezchavira.github.io/sq80-fm1/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge from the project page; the firmware is built by a GitHub workflow from app/VERSION. A ROM pack and program banks are loaded afterwards with the loader page. The project gives no recovery steps of its own, so M-VAVE's updater and the platform's USB rescue apply.
