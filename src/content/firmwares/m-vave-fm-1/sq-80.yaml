device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: SQ-80
summary: >-
  Ensoniq SQ-80 and ESQ-1 style wavetable synth for the FM-1 with eight voices, 75 built-in waves, SysEx program banks, effects, an arpeggiator and a step sequencer; it can play waves from your own ROM dumps.
description: >-
  The engine is written from scratch in portable C and models the SQ-80's oscillators, envelopes, LFOs, four-pole filter and amplifiers, checked against the SQ8L port by rendering the same notes and comparing spectra. Programs and 40-program banks load as ESQ-1 or SQ-80 SysEx through a loader page into up to eight banks in flash. Without a ROM pack it plays an original set of 75 waves generated by a script in the repository; a ROM pack built from the player's own SQ-80 dumps replaces them. No Ensoniq data is in the repository. The effects come from FMini-1 and the arpeggiator and sequencer from SLOOP. HOME opens an output scope and a random-program page. The site also hosts a browser program editor, a ROM pack maker and a wave pack maker. The repository also builds for the SMK-37 (Pro, Elite and MKE-P37), with built-in banks and a web installer, and the README says that build was tested on a Donner Starrykey 37 Play. The author measured eight voices at about 39 percent audio load on the device and lists hardware testing as not started in the README.
