versions:
- version: 1.1.0
  date: 2026-11-03
  url: https://github.com/hed0rah/sqrl-1/releases/tag/v1.1.0
  notes: >-
    Moves onto Felucca 1.8.0. Adds TOUCH, a SOUND page for key or channel pressure with a destination and amount, and a
    system option to run on Felucca's second core (2CORE, OFF or BETA) from the next power-on. Felucca's fixes bring
    the LFO to FM6 operators with AMS, steadier external and TRS MIDI clock, no divide by zero at 0 BPM, and an update
    loader that refuses a package made for another device. TALK is not in it.
- version: 1.0.0
