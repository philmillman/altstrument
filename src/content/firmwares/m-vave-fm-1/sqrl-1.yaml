device: m-vave-fm-1
name: SQRL-1
summary: >-
  Felucca fork with a new shell built on pairs: a SOUND engine and a NOTE engine picked on a key wheel, with eight
  sounds, eleven note engines (chords, lanes, cellular automaton, Tonnetz, acid, harp) and shared tape, reverb and chorus.
description: >-
  Forked from Felucca 1.5.6 and brought up to Felucca 1.8.0 in release 1.1.0, keeping its engines, voices, sequencer,
  effects, storage and installer, and replacing its screens. Release 1.1.0 adds a TOUCH page that routes key pressure or
  MIDI channel pressure to a destination, and an option to use Felucca's second core. Holding HOME turns the octave C4 to C5 into a wheel where a white key picks one of eight SOUNDs (FM6, LIZARD,
  SHOCK, DRUMS, MOUTH, ANALOG, PHASE, PHYS) and a black key picks a NOTE engine (KEYS, CHORD, RUDIMENT, LINES, ALIVE,
  TONNETZ, ENIGMA, S+H, CANON, ACID, HARP). Shared effects are a three-head tape echo, a reverb with pre-delay, a chorus
  and a rotating-speaker insert, and a harmony page adds intervals to the notes an engine plays. A manual in the
  repository is generated from the firmware and checked by the tests. The README lists known issues: a shared USB
  ID, untested recovery paths, possible glitches on very heavy patches, and an untested route to FM1 Open. The release
  also has printable reference sheets.
status: active
authors:
