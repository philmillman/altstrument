source: https://github.com/hed0rah/sqrl-1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, following Felucca. databurn's own engines are MIT, the FM6 core is msfa
  (Apache-2.0), PHYS ports DaisySP and Rings (MIT), the instrument sample sets are CC0 recordings from VSCO-2
  Community Edition, and the artwork (the squirrel, marks and Nibs) is CC-BY-SA-4.0. Felucca's own sample pack is not
  CC0 and is built from its GPL generator script.
homepage: https://databurn.org/sqrl/
distribution: browser-installer
install_notes: >-
  Web installer at databurn.org/sqrl/install in Chrome or Edge over USB; the package is also attached to each release.
  Back up first with Felucca's editor, which SQRL-1 can read. The installer's Return to official V15 needs M-VAVE's
  V15 file, checks it and saves a backup before writing, and the README says it has been tried on a device. M-VAVE's
  updater does not see an FM-1 running SQRL-1, and the installer refuses a unit running FM1 Open. Installing is at
  your own risk.
brick_risk: true
