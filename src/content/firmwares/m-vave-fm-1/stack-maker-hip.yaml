device: m-vave-fm-1
name: STACK (Maker Hip)
summary: >-
  Eight-track groovebox beta with 69 built-in sounds or samples sent from the Burger Studio app, DJ-style effects, a 16-step sequencer, a looper on track 8, a PERFORM mode and MIDI clock in or out over USB and Bluetooth.
description: >-
  Each track holds one sound from a single list of 69, or a sample sent from the Burger Studio Android app, and has ENV, LFO, EDIT, ARP and a DJ filter. The sequencer has 16 steps with swing, time signature and tempo, track 8 is a looper, and PERFORM applies effects to everything from the white keys. MIDI clock runs out or in over USB MIDI and Bluetooth MIDI, and the output has a limiter. SAVE keeps the song, while the loop and the app's samples are not kept at power-off. The built-in sounds are the author's own Rock kit and FM bank, CC0 sample sets and audio rendered from Felucca's presets. The maker calls it a public beta that has not been tried on many FM-1s. It is a different project from alwaro777's STACK entry. It is built on fm1-base and felucca-bsp, and the same owner's Burger Studio app is catalogued separately.
status: active
authors:
- name: perawoga2-coder
  url: https://github.com/perawoga2-coder
source: https://github.com/perawoga2-coder/stack
source_status: open
license: MPL-2.0
license_notes: >-
  The README and stack/LICENSING.md state MPL-2.0 file by file. fm1-base and felucca-bsp are MPL-2.0 and fm1-base's fonts are SIL OFL 1.1. The built-in sounds are CC0 or rendered audio from Felucca's presets, and the project says no Felucca code or preset data is shipped. The repository's default branch is ccr-94587bba-xqg4fh; its main branch holds only a stub. The repository holds no M-VAVE firmware file.
homepage: https://perawoga2-coder.github.io/stack/
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge with the FM-1 on USB, or install the .fwsc from a release. The README and release notes say it is a beta installed at your own risk and that the installer can put M-VAVE's own firmware back. Releases are built and attested by The Firmware Hub's shared workflow.
brick_risk: false
