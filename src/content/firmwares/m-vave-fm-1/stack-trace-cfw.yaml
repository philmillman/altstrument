device: m-vave-fm-1
name: Stack Trace CFW
summary: >-
  Custom firmware on M-VAVE's FM-1 Open base that adds VA poly, TR-909, C64 SID and granular engines, a 128-step
  sequencer with probability and ratchets, eight scenes, grit and punch effects and a zero-wear slicer, with a browser workstation.
description: >-
  Rights warning: the firmware carries demo songs that include a MIDI arrangement of the 20th Century Fox fanfare, and the
  repository and release hold rendered demo audio of it and of other songs. The README and the web workstation name a
  256-instrument sound bank after the Kurzweil K250 and a sample bank ships with the release, but the project does not say where
  those samples come from.
  Built on M-VAVE's FM-1 Open sources and SDK, copied into the repository rather than forked. It adds four engines to
  the stock DX7, 808 and sampler tracks: a dual-oscillator supersaw VA poly, a TR-909 kit, a C64 SID voice with an
  arpeggiator and a granular cloud. The sequencer has two 64-step banks with per-step probability, conditions and one to
  four ratchets, Euclidean and 303-style acid pattern generators, and eight scenes that store mutes, banks, engines,
  lengths and tempo. Live effects are overdrive, bitcrusher, phaser, sidechain pump and punch effects such as stutter and
  tape stop. The slicer cuts a flash sample slot into two, four or eight pads without writing flash. MIDI CC learn maps
  controllers to the sound and effect parameters, and the demo songs play from compact MIDI data on the device. A separate
  single-file browser workstation auditions 256 presets and exports audio and MIDI. The release package is built from the
  repository's tools.
status: active
