source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md and THIRD_PARTY.md, copied from M-VAVE's fm1_open: the application sources are GPL-3.0-only with an FM1 SDK
  linking exception, and the SDK's engine library is M-VAVE's, redistributable for the FM-1 only. The licensed FM-1 V15 image
  (sdk/firmware/FM-1_015.fwsc, blob ce49cc15..., Apache-2.0 in m-vave/fm1_open) is committed unchanged, as are the SDK's boot and update
  files. The Kurzweil-named sound bank, the sample bank and the demo songs have no licence statement.
based_on: m-vave-fm-1/fm1-open
distribution: download
requires_stock: FM1 Open V14 base; the README says V14 or V15 stock can be restored
install_notes: >-
  Back up projects, samples and DX7 banks in M-VAVE's FM-1 Workbench, download FM1_K250_STACKTRACE.fwsc and SHA256SUMS.txt
  from the release, check the checksum, then choose Firmware Update, Local File in the Workbench and keep the FM-1 connected
  until the splash appears. The README says the Workbench's restore option returns the official V14 or V15 firmware at any time.
brick_risk: false
