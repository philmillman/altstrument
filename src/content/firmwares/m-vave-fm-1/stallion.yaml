device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: Stallion
summary: >-
  Synthesizer firmware for the FM-1 and SMK-37 Pro grown out of Clipper, SLOOP and Felucca, with 26 engines and 819 sounds, a
  three-oscillator HYBRID voice, a 24-slot modulation matrix, key touch and a web editor.
description: >-
  One instrument, two in MULTI, with no tracks, drum machine, song mode or built-in samples. Stallion forked Clipper at 1.1 and
  merged 1.3, so it keeps SLOOP's engines, effects, arpeggiator, step sequencer, USB audio and MIDI, and Clipper's HYBRID voice
  with its modulation matrix. It adds four engines (PALOMINO, STAMPEDE, RODEO and MARE), a rebuilt PONY, a full bank of classic
  sounds on every engine, more filter models and insert effects, velocity and pressure from the FM-1's own keys, a bend lever
  and a ribbon on OCT- and SELECT, and a larger web editor. The SMK-37 Pro build plays from its 37 keys with pad and key
  aftertouch, the wheels and a pedal, and its installer never writes the keyboard's factory calibration. The README says it passes
  its test suite on a computer, that the SMK-37 builds have been flashed and played on an SMK-37 Pro, and that the newer UC25HQ80
  flash chip is covered by tests but not yet confirmed on such a unit. Multi sounds are on the SMK-37 Pro only for now.
status: active
