source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for the code and the firmware image as a whole. Third-party files keep their licences, such as
  Apache-2.0 for the FM6 core and MIT for the physical-model parts, and data files are GPL-3.0, CC0, CC BY 3.0, SIL OFL or MIT.
  The repository's docs/firmware holds Clipper Pro's own built packages, not stock M-VAVE images.
homepage: https://eberonltd.github.io/stallion-fm1/
based_on: m-vave-fm-1/clipper
distribution: browser-installer
install_notes: >-
  Web installers in Chrome or Edge over USB, one for the FM-1 (stallion-<version>.fwsc) and one for the SMK-37 Pro
  (stallion-smk37-<version>.fwsc), each reading which board a package was built for. The releases attach both packages and
  SHA256SUMS, built and attested on GitHub. Make a backup with the editor first. The installer pages go back to M-VAVE's V16 or
  V15, to Clipper or to SLOOP. The README says to install at your own risk.
brick_risk: false
