homepage: https://joakimskurk.github.io/fm1stardistroyer/
distribution: browser-installer
install_notes: >-
  The project page installs the latest build of main from Chrome or Edge over USB. Or build with build.sh and install the package with tools/fm1_install.py over USB, on an FM-1 running M-VAVE's V15 or
  another firmware with the update loader. The Dinghy README documents a USB rescue, reached by holding OCT- while
  switching on, and an automatic fall back to it after two failed boots.
