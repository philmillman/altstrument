device: m-vave-fm-1
name: Star Distroyer
summary: >-
  Vector FM synth with four banks of four oscillators, a morphing six-stage resonator and a four-band distortion
  section, plus an arpeggiator, two step sequencers and a TURING sequencer page.
description: >-
  Each bank has harmonics 1 to 32 and a vector X/Y control, with mono, duo and four-voice poly modes. A resonator stage
  offers filter models from band-pass to comb and allpass, and a four-band destroyer adds shapers, dynamics and a
  feedback loop. The README lists 33 factory patches and says the project is at its voice stage, playing from the keys,
  MIDI and a fixed 16-step loop, with the sequencer plan still being built. It is based on Dinghy 0.4 and the repository
  carries design plans for the sound and the sequencer.
status: active
authors:
