device: m-vave-fm-1
name: Star Distroyer
summary: >-
  Vector FM synth with four banks of four oscillators, a morphing resonator, a four-band distortion section and a
  delay into a room, plus a modulation matrix, an arpeggiator and two step sequencer tracks with a TURING page.
description: >-
  Each bank has harmonics 1 to 32 and a vector X/Y control, with mono, duo and four-voice poly modes. A resonator stage
  offers filter models from band-pass to comb and allpass, and a four-band destroyer adds shapers, dynamics and a
  feedback loop, and a delay and room sit after it. The README lists 33 factory patches and 32 user places, with two LFOs
  and four macros, and says the project is in development and not yet tested on a real FM-1. It is based on Dinghy 0.5
  and the repository carries engine and update-path tests and a Firmware Hub card.
status: active
