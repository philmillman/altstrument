versions:
- version: 0.1-beta
  date: 2026-11-12
  url: https://github.com/joakimskurk/fm1stardistroyer/releases/tag/v0.1-beta
  notes: Pre-release; the first beta, built and tested on the host and in the emulator only. The notes say to back up the FM-1's flash first, because the first SAVE can overwrite another firmware's projects, and that saves may change until 1.0. Package identity FM-1_96201; the release also carries SMK-37 builds, untested on that device. Commits since 33d434b add MIDI clock in, an ORBIT page, an output limiter, browsable presets, a DISTROY page, TURING as an LFO modulation source and a project page that runs the firmware in the browser. Earlier ones added patches without classic FM, a DERELICT overture, NAV and REACTOR pages, and moved the base from Dinghy 0.4 to 0.5.