  url: https://github.com/joakimskurk
source: https://github.com/joakimskurk/fm1stardistroyer
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only, as Dinghy, with Felucca, SLOOP and OberVave platform code under their own notices.
  The Terminus font is SIL OFL 1.1, and the designburg logo in assets/ is all rights reserved and not under the GPL.
distribution: source-only
install_notes: >-
  Build with build.sh and install the package with tools/fm1_install.py over USB, on an FM-1 running M-VAVE's V15 or
  another firmware with the update loader. The Dinghy README documents a USB rescue, reached by holding OCT- while
  switching on, and an automatic fall back to it after two failed boots.
brick_risk: false
