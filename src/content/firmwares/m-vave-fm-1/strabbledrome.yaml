homepage: https://savageperson334.github.io/strata-fm1/strabbledrome/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Open the install page in Chrome or Edge, connect the FM-1 over USB and install; the release notes advise trying the emulator first. The release also attaches strabbledrome-1.0.fwsc. The README says the installer can put M-VAVE's firmware back, and that installing custom firmware is at your own risk. The project says it has not been run on hardware.
