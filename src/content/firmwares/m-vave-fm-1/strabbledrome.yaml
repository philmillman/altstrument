device: m-vave-fm-1
name: STRABBLEDROME
summary: >-
  Experimental firmware that holds STRATA, PALINDROME and BabbleBeat in one install, switched from a menu opened with GLO.
description: >-
  Three instruments are built into one image: STRATA, a drone and rhythm synth; PALINDROME, a looping instrument that plays grains of recorded rings; and BabbleBeat, a speech instrument with a small robotic voice. Pressing GLO opens a system menu where the SELECT encoder picks an instrument or a help page and SEL confirms, and only one engine runs at a time. STRATA's buffers and PALINDROME's rings share one workspace that is cleared on every change, so PALINDROME's recorded rings are not kept when switching away. The instruments keep their own source and version lines in the repository, which lists STRABBLEDROME as a fourth project with its own strabbledrome- release tag prefix. The README gives the image as about 414 KB with package identity FM-1_61, and the release is marked as a pre-release. The release notes say hardware validation is pending and advise trying the emulator first.
status: active
