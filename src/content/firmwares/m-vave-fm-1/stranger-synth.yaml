device: m-vave-fm-1
name: STRANGER SYNTH
summary: >-
  Performance synth for the FM-1 in the style of 1980s analogue film scores, with detuned saws, macro knobs, a low split, arpeggiator, chords, sidechain, a heartbeat groove and eight tape-style effects.
description: >-
  An OFFWORLD derivative with 13 presets named by the author. Four macro knobs (SHAPE, DRIFT, SPACE and FILTER) rest on named sweetspots, with SIZE and TONE on the encoders. A low split plays two octaves down with a hold, and the right hand can follow the left in a scale or on its chord. The arpeggiator runs from 1/4 to 1/32 with triplets on either hand and follows MIDI clock; ten chords play from one finger. A sidechain ducks on a clock division, an outside kick or the HEART, a heartbeat groove with single, double, slow and racing patterns. Eight effects played from the keys include tape stop, VHS, rewind, gated reverb and echo throw. The USB port can host a second FM-1 running SIX MACHINES as a drummer. The screen is a night-town film of eight scenes that follows the notes. The README says all sounds are synthesized, with no samples, melodies or images from any film or show. Manuals are in English and German, and the site has a browser emulator.
