license: MPL-2.0
license_notes: >-
  The README states MPL-2.0 and the LICENSE file is the MPL-2.0 text. It builds on fm1-base and felucca-bsp (MPL-2.0).
homepage: https://savageperson334.github.io/strata-fm1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  Open the install page in Chrome or Edge, connect the FM-1 over USB, press Connect and then Install. The README says the installer can put M-VAVE's firmware back, and that installing custom firmware is at your own risk.
brick_risk: false
