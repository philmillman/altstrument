device: m-vave-fm-1
name: STRATA
summary: >-
  Drone and texture synth with no menus: six long FM voices, a slow arpeggiator, a drum groove with sidechain ducking and four Euclidean lanes, with an installer page and emulator.
description: >-
  Keys start up to six long voices, each two detuned FM pairs with feedback, a sub sine and noise band-passed at the pitch, followed by a swept resonant low-pass and a reverb that can decay almost without end. Seven knobs stay live, and holding SEL, ARP, SEQ or EDIT gives them a second set. The arpeggiator runs through the latched voices and locks to the groove's tempo. The groove has eight patterns on a synthesised kit, and the Euclidean lanes of up to 32 steps can replace a drum part or step the arpeggiator. MIDI in over USB and TRS accepts notes, sustain and 25 controllers. The repository also holds PALINDROME and BabbleBeat, which have their own source and version lines and are listed separately. The README says no firmware in the repository has been tested on a real FM-1.
status: active
