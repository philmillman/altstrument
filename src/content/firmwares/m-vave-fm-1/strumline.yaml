device: m-vave-fm-1
name: STRUMLINE
summary: >-
  Strummed guitar with a bass player: pick a key and the black keys become its chords, a pattern strums them, and a song loop
  of 1 to 12 bars plays the progression hands free.
description: >-
  A fork of Guitchordi that keeps its sixteen string instruments on Clipper's string model and adds the bass of the author's
  Bassline firmware. Chords come from a chosen major or minor key instead of guitar positions, and the screen names each one with its
  numeral and shape. The song loop is filled live, step by step, or from nine ready progressions, and 14 strum patterns, 8 bass
  patterns and 6 tunings are offered. A CPU guard reduces the string voices above 85 percent load. The platform is the
  Felucca, X0X and FoMni layer. The README says it passes the simulator tests and the browser emulator and does not report a hardware test. The
  GitHub build publishes a site with an emulator, an installer and the package.
status: active
