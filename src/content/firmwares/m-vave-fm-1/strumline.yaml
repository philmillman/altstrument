license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only, inherited from Felucca through X0X and FoMni. The string model is MIT.
distribution: browser-installer
install_notes: >-
  Run the repository's GitHub build with Pages enabled, then open the published Install page in Chrome or Edge with the
  FM-1 on USB, or use tools/fm1_install.py. The installer can restore M-VAVE's firmware, a failed start falls back to a safe mode, and OCT-
  with OCT+ held for 5 seconds enters update mode.
