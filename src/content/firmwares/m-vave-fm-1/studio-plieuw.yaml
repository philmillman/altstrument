homepage: https://plieuw.github.io/fm1-studio/webapp/installer/
distribution: browser-installer
install_notes: >-
  Open the installer page in Chrome or Edge with the FM-1 on USB and press Install, or build with studio-setup.sh on Linux
  (Docker on macOS). The README says M-VAVE's Workbench restores the original V15, and that holding OCT- and OCT+ for five
  seconds enters the update mode.
