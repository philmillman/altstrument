device: m-vave-fm-1
name: FM-1 STUDIO (Plieuw)
summary: >-
  Felucca fork with three track engines, a 6-voice Alpha Juno style synth, a TB-303 style bass and a TR-909 style drum kit,
  plus a Mackie-style gain, low-cut and EQ strip on every track. README in Dutch.
description: >-
  Each of the four tracks can run JUNO, ACID or TR909. JUNO has pulse, saw and sub oscillators, a high-pass and 24 dB filter
  and a stereo chorus, ACID has the 303 filter with accent and slide, and TR909 plays eight drum parts on the grid with
  tone controls and muting. The channel strip adds a gain stage that saturates when pushed, a 75 Hz low cut and a
  three-band EQ with a drawn curve. Holding a key while recording and turning a knob stores a per-step parameter lock. The
  303 and 909 code is ported from Charles Vestal's X0X, and the Juno synth was written by the fork's owner for M-VAVE's
  FM-1 Open SDK. Felucca's web editor does not know the new engines. The Dutch README explains the browser route through
  GitHub Actions and a Linux build.
