install_notes: >-
  Installs from the project site in desktop Chrome or Edge over USB. The page also has a return-to-stock option
  that asks you to pick your own copy of M-VAVE's unmodified V15 FM-1.fwsc and refuses any other file. The
  site marks the firmware as a beta, installed at your own risk. Build instructions are in BUILDING.md.
