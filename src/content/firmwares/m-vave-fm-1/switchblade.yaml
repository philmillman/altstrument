device: m-vave-fm-1
name: Switch Blade
summary: >-
  Felucca fork that runs four synth machines, one per track, over eight shared voices: OB-Z poly, WAVE
  wavetable, NANO (a 303 plus a subtractive poly) and JUNO with a chorus. No drums, aimed at use as an expander.
description: >-
  Each track picks one of the four machines, each with 32 presets, and each track has a drive, insert effects
  and shared chorus, delay and reverb. The home screen puts a cutoff, a resonance, an envelope and one
  machine-specific parameter on knobs 1 to 4. There is no drum engine, because the firmware is meant to sit
  beside a drum machine, for example with an Elektron Syntakt sending on MIDI channels 1 to 4. The project
  site has a browser version of the firmware with a demo song. WAVE reuses the voice of the author's Void Wave
  plugin; NANO's 303 follows Open303 by way of X0X, and JUNO's voice follows the Ultramaster KR-106.
