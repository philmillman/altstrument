versions:
- version: 0.5.0
  date: 2026-11-18
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.5.0
  notes: Replaces the factory bank with a new 256-preset selection spread over 13 categories (BASS, PAD, LEAD, KEYS, PLUCK, ARP, DRUMS, STRINGS, BRASS, ORGAN, VOCAL, FX, OTHER), of which 211 were not in the 0.4 bank, and keeps categories written from the Patch Manager. Circuit Tracks macro knobs 5 to 8 follow its default MIDI template, USB and TRS MIDI keep their timing within each audio block, and KNOB3 in GLOBAL, PART browses eight variations of a sound.
- version: 0.4.2
  date: 2026-11-17
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.4.2
  notes: Presents bitimbral mode for any setup, not only the Novation Circuit Tracks, with layer, split and two-track MIDI use. The patch's voice settings move from GLO to PLAY, and GLO becomes GLOBAL, holding only what is not stored in the patch.
- version: 0.4.1
  date: 2026-11-17
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.4.1
  notes: The factory bank shrinks from 500 to 256 presets, F001 to F256, sorted into eight categories with about the same number in each, and a preset is kept only when its name and sound agree on the category. The notes say this package had not been installed on hardware.
- version: 0.4.0
  date: 2026-11-17
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.4.0
  notes: Adds bitimbral mode, two parts L and R with their own patches, arpeggiators and effects, switched with OCT- and OCT+ together, and a SPLIT, STEREO or DOUBLE output; part R renders on the second core. The Patch Manager arranges all 1,024 user slots with staged edits and a single sync. Settings grow from 16 to 24 bytes and older ones load.
- version: 0.3.1
  date: 2026-11-16
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.3.1
  notes: Gives SY1 its own package and USB identity (FM-1_51000301) instead of one already used by another firmware; the 500 presets and the sound are unchanged.
- version: 0.3.0
  date: 2026-11-16
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.3.0
  notes: Adds the read-only FACTORY bank of 500 community presets (F001 to F500) in program flash; the 1,024 user slots are kept.
- version: 0.2.1
  date: 2026-11-16
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.2.1
  notes: Adds a choice of three screen styles, NORD, GREEN LED and GREEN LCD, under GLO.
- version: 0.2.0
  date: 2026-11-16
  url: https://github.com/fenderberg/fm1-sy1/releases/tag/v0.2.0
  notes: Adds the Patch Manager with 3,174 hosted presets in 27 banks, and a Nord-style screen and site redesign.
