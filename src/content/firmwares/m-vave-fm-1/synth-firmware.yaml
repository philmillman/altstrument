device: m-vave-fm-1
name: synth-firmware
kind: tool
summary: >-
  Claude Code plugin that guides building an FM-1 firmware on the Felucca, SLOOP and GR!MM platform, from identity to a Firmware Hub release, with chip-rule checks.
description: >-
  A bundle of one skill, one subagent, four slash commands and an advisory hook. The skill holds a phase model, the AC791N chip rules, the
  toolchain, build and test steps and the release and hub submission flow, taken from the author's COQUI firmware as the worked example.
  The commands scaffold a firmware from a theme, work a phase, lint the source and walk toward a release, stopping before anything outward-facing. The hook flags
  floating point, 64-bit division and ROM-range constants after edits to firmware C files. The README says it does not generate new DSP.
  It holds no firmware itself.
