device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: Synthesthetic
summary: >-
  SLOOP-based firmware for the FM-1 and SMK-37 that adds 30 audio-reactive visualiser modes, sent over USB as a webcam,
  in the manner of the Critter & Guitari EYESY, beside the groovebox, MIDI and USB audio. 0.3 beta.
description: >-
  The instrument side is SLOOP 2.8.3 with four tracks, twelve synth engines and a drum machine, and the visuals are new code.
  The chip's second core draws scopes, spectra, geometric figures, drum shapes and feedback-warp effects from the audio, with
  nine palettes, colour cycling, a fade between modes and an autopilot that changes the picture every 4 to 32 bars. A
  thirty-first mode, SCREEN, sends the FM-1's own display instead. The unit shows up as a UVC camera named Synthesthetic next
  to its USB MIDI and audio ports, the camera's brightness, saturation, contrast and hue controls turn the visualiser's knobs,
  and an overlay can show tempo, bar and a title card. The web editor gains a page for the visual settings, and a Play page
  runs the firmware as WebAssembly on a 3D FM-1. SLOOP is built on Felucca, and the project began on Dinghy. From 0.3 the SMK-37 Pro, Elite and MKE-P37 run it too, with the installer picking the package for the device it finds;
  the SMK-37's pads, faders and wheels are mapped in SMK37.md, and its DAW mode, TRS MIDI out and pedal input have not
  been tried on a unit. The release says it was tested on one FM-1 and one SMK-37 Elite, with macOS only, and calls
  itself a beta.
