source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for the project's own code and repeats Felucca's licensing notes, which still call the
  Hügelton Sample Pack all rights reserved with an additional permission to combine it; Felucca's current README gives it as
  CC0 1.0. msfa is Apache-2.0, the Terminus font is SIL OFL 1.1, and the sample sets in assets/samples-cc0 are CC0. The
  repository's hip-hop sample pack for the user slots is CC0 except one electric piano set under CC BY 3.0 that needs credit
  to its author. The three JieLi SDK files (Apache-2.0) are committed under vendor/ac79-sdk-min. No M-VAVE firmware image is in
  the repository.
homepage: https://michaeljsmalley.github.io/synthesthetic/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, or tools/fm1_install.py with the 0.3 package, from a unit running V15, Dinghy or
  SLOOP. On an SMK-37 the installer writes it directly over one of genkigenki's ports or M-VAVE's official V016, and the
  first start clears the previous firmware's data in the shared store. From any other firmware, go back to V15 with M-UPGRADE first. Holding OCT- while switching on opens a USB rescue
  updater, which two boot crashes also open. The handbook calls it a beta to use at your own risk.
brick_risk: false
