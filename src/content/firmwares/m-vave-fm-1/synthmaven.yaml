source: https://github.com/KingXeryus/SynthMaven
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md, carried over from Melodee, states GPL-3.0-only with ported parts under their own licences (MSFA
  Apache-2.0, DaisySP and Rings MIT, MAME uPD933 BSD-3-Clause, reSID GPL-2.0-or-later, installer code MPL-2.0, fonts
  SIL OFL 1.1), listed in LICENSES/. The CZ-1 tones (assets/cz1-factory) and the Prophet-5/10 programs
  (assets/prophet5-factory) are sound data owned by Casio and Sequential, and the DX7 files in assets/fm6 keep their
  owners' rights; the file says no licence is granted for them. The JieLi recovery helper (wl82loader.bin) and the
  optional m-bootloader package (MIT) are unmodified third-party files.
homepage: https://kingxeryus.github.io/SynthMaven/
distribution: browser-installer
install_notes: >-
  Web installer in Chrome or Edge over USB, with USB ROLE set to COMPUTER. Every flash resets user settings and
  programs, so export a full backup first. Releases also carry recovery archives for Windows, macOS and Linux. The
  installer can put M-VAVE's V15 back from a file you download yourself. M-VAVE's own updater may no longer find a
  unit running SynthMaven. Bluetooth is not part of the current build.
brick_risk: true
tags: [synth-engine, sequencer, drums, scales, midi, usb-audio, editor, performance, fork]
