device: m-vave-fm-1
name: SynthMaven
summary: >-
  Oriental groove box on the Melodee base: four layered parts with maqam microtuning, an eight-lane drum machine,
  a 64-step sequencer with a song arranger, programs with scenes and setlists, and web and iPad editors.
description: >-
  Rights warning: the repository bundles Casio's 64 CZ-1 factory tones and Sequential's 200 Prophet-5/10 factory
  programs (v1.03) as SysEx sound data compiled in as factory presets, plus two DX7 voice files (ROM1A and ARABESC)
  that its README says were supplied by the user. Its licensing file says the rights stay with Casio and Sequential
  and that no licence is granted.
  Version 4.0 plays four layers stacked or split across the keys, each with its own range, level and pan, beside an
  independent drum machine with factory grooves (Maksoom, Wahda, Baladi and Fox among them). Tuning has 46 maqam
  settings, 14 Western scales and custom offsets in 10-cent steps on the unit or 1-cent steps in the editors. The
  sequencer takes patterns up to 64 steps per track, and the arranger builds songs of up to 16 sections. Programs
  hold four scenes each, with a 32-entry setlist, and up to 16 learned pedal or controller actions. Each layer and
  the drummer can listen to its own MIDI input and channel. The engines include DX7-style FM6, CZ-1, Prophet-5, SID
  and Vital-translated HYBRID voices, with 610 melodic presets and 27 punch effects. Versions 2.x were built on
  Clipper; 3.5 moved to Melodee 1.5.1. The release notes for 4.0 say it has not been tested on FM-1 hardware, while
  the 3.5 notes describe physical tests of the USB-only build. An iPad editor exists; its latest build is a TestFlight
  build for invited testers.
status: active
