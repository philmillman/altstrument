device: m-vave-fm-1
name: Tack
summary: >-
  Seven-voice digital drum synth with a step sequencer, using the LXR-02 firmware's sound engine: seven lanes of up to
  64 steps, parameter locks, 16 patterns, a song and 128 kit slots. Also ships as CLAP, VST3 and Audio Unit plugins.
description: >-
  The FM-1 firmware replaces the unit's own synth with three drums, a snare, a cymbal and closed and open hi-hats,
  and an FX bus whose reverb the LXR-02 firmware leaves switched off. Each sequencer lane has its own length,
  direction, speed and start step, steps carry velocity, nudge, flam, chance, recurrence and up to eight parameter
  locks, and there are 16 patterns, chains and a song of up to 63 rows. Two kits can be morphed, a kit or voice can
  mutate in small steps, and kits load in the LXR-02's .SND format, with none supplied. USB gives stereo or ten channel
  audio, MIDI notes and clock in. The engine is the LXR-02 firmware by Sonic Potions and Erica Synths with the fixes and
  additions listed in the README, and the same engine runs in the plugins. This entry covers the FM-1 firmware; the
  desktop plugins are the same project but are not catalogued here.
status: active
authors:
