  url: https://github.com/oikoaudio
source: https://github.com/oikoaudio/tack
source_status: open
license: GPL-3.0-only
license_notes: >-
  GPL-3.0-only with the additional permission and terms in NOTICE.md, which Erica Synths published the LXR-02
  firmware under: Erica Synths trademarks may not be used to suggest affiliation, and modified versions must be marked
  as modified. The code also descends from Sonic Potions' LXR licence, which forbids selling the code or using it in
  a commercial product, so Tack commits to staying free and to shipping complete source with every release. The
  repository's two demo .snd kits are generated by the author. fm1-base (MPL-2.0) and felucca-bsp are pinned
  submodules.
homepage: https://oikoaudio.com/tack/
distribution: browser-installer
requires_stock: V15 or other firmware; V16 not tested
install_notes: >-
  Web installer at oikoaudio.com/tack/fm1/install in Chrome or Edge over USB, with backup and kit bank pages beside it.
  The page offers a way back to stock V15 or V16 from a file you download, and warns that V16 replaces the bootloader,
  which Tack has not run on, so V15 is the safer way back. The author's notes say a unit ran Tack and returned from stock
  V15. Building needs the JieLi toolchain and SDK. Installing is at your own risk.
brick_risk: true
