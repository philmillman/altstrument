homepage: https://mr-roboto.github.io/fm1-tangram/
distribution: download
install_notes: >-
  Install the .fwsc from the release with the repository's tools/install_firmware.py, which uses the fm1-base update protocol over USB MIDI, or with a web installer built from the site sources; the README says flashing is at your own risk and does not describe a way back. The FM-1's ROM boot mode applies.
