device: m-vave-fm-1
name: Tangram
summary: >-
  Generative MIDI sequencer and composer for the FM-1, a Berlinan fork with a Composer that shapes a performance into sections, a drum voice, MIDI delay, factory presets and USB and Bluetooth MIDI. It makes no sound itself.
description: >-
  Extends the Berlinan firmware and its musical engine with seven voice roles (two plucks, bass, pad, lead, drone and a heartbeat drum voice) on their own MIDI channels, ARP and MOTIF generators, and three starting templates. The Composer moves a performance through intro, A, development, B, breakdown, return and outro with activity ramps and tension, and respects locked voices and manual edits. Per-voice MIDI delay, density and ratcheting, a MIDI CC LFO for each voice, six snapshot slots, ten named performance presets with four factory ones and six display themes round it out. The FM-1 plays other instruments: it sends USB and Bluetooth MIDI, and the clock can run from USB, TRS or Bluetooth. The README says that the Bluetooth MIDI path was accepted on an FM-1 and that long soak tests and clock-jitter figures are not part of that. It is a GitHub fork of Berlinan with 229 commits of its own, and a browser emulator is on the project site. It builds on fm1-base and felucca-bsp.
