    url: https://github.com/Ninjathune-Human
source: https://github.com/Ninjathune-Human/fm1-plugins
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and the README says GPL-3.0. The vendored firmware keeps its own licensing (GPL-3.0-only in tastywaves/vendor/LICENSING.md, derived from Dinghy, SLOOP and Felucca).
homepage: https://ninjathune-human.github.io/fm1-plugins/
based_on: m-vave-fm-1/tastywaves
distribution: source-only
install_notes: >-
  Build with cargo xtask bundle tastywaves --release, which writes the VST3 and CLAP bundles to target/bundled. The Plugin workflow uploads the same bundles as Actions artifacts for Linux and Windows. It runs in a host on the computer and writes nothing to an FM-1.
