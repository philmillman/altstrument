device: m-vave-fm-1
name: TastyWaves plugin
kind: tool
summary: >-
  VST3 and CLAP plugin in Rust that runs the TastyWaves wavetable firmware's synth core in a DAW, with 22 automatable parameters and an interface drawn like the FM-1.
description: >-
  The repository compiles the unmodified TastyWaves firmware source (marksweiss/tastywaves at a pinned commit) into a native core and wraps it with nih-plug as a 12-voice VST3 and CLAP instrument. A replaced host layer supplies audio blocks, notes, MIDI, buttons, encoders and the screen. The plugin exposes 22 automatable parameters taken from the firmware's controllers, saves settings and patches in the host project, and draws the firmware's screen, seven encoders and 14 buttons in egui. CI builds Linux and Windows packages, checks that the sound matches a reference bench and runs pluginval at strictness level 5 without the interface tests. The README says the plugin code is not yet written and the project page says it is not yet published, which no longer matches the commits. There is no release, and the packages are only CI artifacts. The README and page are in French.
status: active
authors:
