source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and TEACHIE-BEACHIE.md says it uses the same licence as SLOOP 3. The factory sample bank
  inherited from SLOOP 3 is CC0 and its screen fonts are SIL OFL 1.1. The repository holds that sample bank
  (assets/samples.bin) and no firmware package.
homepage: https://davydegravy.github.io/teachie-beachie-fm1/
based_on: m-vave-fm-1/sloop-3
distribution: browser-installer
requires_stock: m-bootloader on the unit (the installer page explains how to set it up)
install_notes: >-
  Installs from the project page in desktop Chrome or Edge over USB MIDI, through m-bootloader. The page checks for
  m-bootloader (hold PLAY at power-on), explains how to set it up if missing, backs up the whole 1 MB flash, checks the
  package before erasing, installs, and then sends the lessons. Going back means restoring that backup with M-Flasher or
  installing SLOOP 3 from its own page. The README says m-bootloader opens a recovery menu if an install is interrupted.
  The author tested one FM-1 with the original flash chip.
brick_risk: false
