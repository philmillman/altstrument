device: m-vave-fm-1
name: Teachie Beachie
summary: >-
  SLOOP 3 with thirty guided lessons built into the FM-1: each lesson shows a card and a strip on the screen, blinks the key to press and checks the step before moving on.
description: >-
  Teachie Beachie is a build of SLOOP 3.3.7-beta that adds a lesson player to the firmware, aimed at children and beginners.
  At start a card offers a lesson with OCT+, and OCT- goes straight to SLOOP 3. A peach card explains one idea, a strip over
  SLOOP's own page says what to do, the button or key to press blinks, and the lesson moves on when the step is done. A hint
  appears after a while, and the lesson can offer to do the step itself. The course has thirty lessons in four parts (first
  beat, notes and chords, effects and sound, making a song) and works on one song written for it. The lessons are
  sent to a sample slot by the installer page, and can be resent alone later. The instrument itself is unchanged SLOOP 3,
  including its web editor. The repository description calls the project BOATSWAIN, while its README and pages say Teachie
  Beachie. The README says it has been tested on one FM-1 with the original flash chip and not on the newer UC25HQ80 chip,
  and the lessons are in English. The lessons are plain text files, and the repository includes guides for working on them
  with an AI assistant.
status: active
