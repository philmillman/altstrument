device: m-vave-fm-1
name: Tekstuur
summary: >-
  Four-layer instrument for long, slowly moving sound on the FM-1: recorded sources played as loops, grains, stretches or
  resonating strings, mixed by a self-moving vector point, with shimmer reverb and freeze.
description: >-
  Four layers (A to D) each play a source in one of four ways. LOOP runs three play heads per note over different
  lengths, GRAIN plays a cloud of short grains around one place in the source, STRETCH pulls the source out until it
  almost stands still, and RESON strikes three tuned strings with it. Nine sources are built in (strings, cello, horn,
  organ, glass, psaltery, vibes, reed and noise), and you can send up to eight recordings of your own, 8.5 seconds in
  all, with a script that reads anything ffmpeg reads. Each layer has its own filter. A vector point mixes the four layers,
  and Evolve moves that point, the position in the source and the filter on its own. Chorus, delay and a reverb with
  shimmer and freeze follow. There are 56 presets and 16 slots for your own. MIDI over USB and the TRS input carries notes,
  sustain, mod wheel on Evolve and program change. Version 2.0 is the author's own engine on fm1-base; the repository keeps
  the first version, an engine inside Felucca, for reference. The README is in English, with a Dutch version.
