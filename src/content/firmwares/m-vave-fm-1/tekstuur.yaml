install_notes: >-
  Install from the page at barnir-fm1.pages.dev/tekstuur/ in Chrome or Edge over USB, or download the .fwsc from the
  release and install it with fm1-base's tools/fm1_install.py. The README says to install at your own risk. Your own
  recordings go over USB MIDI with eigen/tools/tekstuur_samples.py, need mido and ffmpeg, and survive a firmware update.
