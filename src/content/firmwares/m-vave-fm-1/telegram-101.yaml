device: m-vave-fm-1
name: Telegram 101
summary: >-
  101-style lead synth with the Dillo acid bass and an 808 drum machine, brought together by a Band mode that plays all three from the FM-1 keys.
description: >-
  Telegram 101 combines a 101 lead voice with Dillo, the acid bass synth from Big Beat Studio BB1, and a
  single 808 drum machine. Knob pages edit cutoff, resonance, envelope amount and decay, EDIT steps through source mix,
  filter, envelope and modulator, and a knob move can be recorded and looped for one bar. Band mode plays lead, bass and
  drums together from songs chosen on the white keys, with the next section cued on the next bar. A sound library opens
  on SAVE. Dillo phrases are adapted from J. McConaghy's Acid-Tabs.com under CC BY-SA 4.0, and Acid Voice charts are
  adapted under a separate project licence. Coming from BB1, the first library save asks before it replaces BB1's
  factory sound bank. It comes from the author of BB1 and BB-BOB.
status: active
authors:
- name: TexasRADIO
  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/telegram-101-fm1-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL v3 text. THIRD_PARTY.txt says Telegram 101 and the Felucca browser updater keep their component
  licences, the Dillo phrases adapted from Acid-Tabs.com are CC BY-SA 4.0, and Acid Voice charts are adapted under a
  separate project licence. The repository holds the source, the generated build inputs and the JieLi SDK tools, and
  no M-VAVE stock image.
homepage: https://thebigbeat.app/fm1/telegram-101/
distribution: browser-installer
install_notes: >-
  The installer at thebigbeat.app runs in desktop Chrome or Edge, and the release also carries Telegram-101-FM1-857.fwsc
  and a zip of the same package for other installers such as The Firmware Hub. Back up your work first and keep the USB
  data cable connected. If a transfer is interrupted while the FM-1 is still in its MIDI updater, reconnect it and use
  Resume install. The README says factory V15 is not needed for recovery.
brick_risk: false
