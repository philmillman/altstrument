device: m-vave-fm-1
name: Telegram 101
summary: >-
  A 101-style lead, Dillo acid bass and synthesized 808 drums on the FM-1, with Band arrangements that play all three
  from the keys and one-bar knob-motion recording.
description: >-
  Telegram 101 combines a 101 lead voice with Dillo, the acid bass synth from Big Beat Studio BB1, and a
  single 808 drum machine. Knob pages edit cutoff, resonance, envelope amount and decay, EDIT steps through source mix,
  filter, envelope and modulator, and a knob move can be recorded and looped for one bar. Band mode plays lead, bass and
  drums together from songs chosen on the white keys, with the next section cued on the next bar. A sound library opens
  on SAVE. Dillo phrases are adapted from J. McConaghy's Acid-Tabs.com under CC BY-SA 4.0, and Acid Voice charts are
  adapted under a separate project licence. Coming from BB1, the first library save asks before it replaces BB1's
  factory sound bank. All FM-1 voices are synthesized. Big Beat Studio, the maker of BB1 and BB-BOB, builds it from a
  separate repository from BB–37 Telegram 101 for the SMK-37.
status: active
authors:
- name: Big Beat Studio
  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/telegram-101-fm1-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL v3 text. THIRD_PARTY.txt says Telegram 101 and the Felucca browser updater keep their component
  licences, the Dillo phrases adapted from Acid-Tabs.com are CC BY-SA 4.0, and Acid Voice charts are adapted under a
  separate project licence. The repository holds the source, the generated build inputs and the JieLi SDK tools, and
  no M-VAVE stock image.
homepage: https://thebigbeat.app/fm1/telegram-101/
distribution: browser-installer
install_notes: >-
  The installer at thebigbeat.app/fm1/telegram-101/install/ runs in desktop Chrome or Edge over WebMIDI and serves only
  the FM-1 package (identity FM-1_101857); do not install a BB–37 SMK-37 image. The release also carries
  Telegram-101-FM1-857.fwsc and a zip with the same installer for offline use. Back up your work, close other apps using
  the MIDI port and keep the USB data cable connected until the page confirms completion. The author says FM-1 flash
  acceptance currently covers the Puya 0x856014 chip and does not claim UC25HQ80 support. If a transfer is interrupted
  while the FM-1 is still in its MIDI updater, reconnect it and use Resume install. The guide says a physical return
  from build 857 to M-VAVE factory V15 is unverified and advises keeping your current firmware if you depend on it. The
  FM-1's mask-ROM rescue is the fallback.
brick_risk: false
