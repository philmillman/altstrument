homepage: https://davidpryan.github.io/terrace-8/
distribution: browser-installer
install_notes: >-
  Browser installer at davidpryan.github.io/terrace-8/install/ in Chrome or Edge (allow MIDI when asked), or build
  with ./build.sh (Docker and JieLi's toolchain, see fm1-base) and run base/tools/fm1_install.py on the .fwsc. The
  README says to keep M-VAVE's stock firmware and M-UPGRADE at hand, and the installer page has a section for putting
  the stock firmware back.
