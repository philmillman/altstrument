device: m-vave-fm-1
name: TERRACE-8
summary: >-
  Stage sequencer for the FM-1 in the manner of Metropolis and Mutable Stages: two lines of eight stages with pulses,
  gate modes, ratchets, slide and an accumulator.
description: >-
  Each of eight stages on two lines has a pitch (scale degree), a pulse count of 1 to 8, a gate mode (silent, once,
  every pulse, held, every other), ratchets of 1 to 4, slide, accent and skip. Directions are forward, backward, ping-
  pong, random and random walk, with a variable number of stages in play, so two lines of different lengths cross
  against each other. An accumulator adds scale degrees each time round and returns to zero past its limit. The screen
  draws each stage as a bar as wide as it lasts and as high as it sounds. It has its own 8-voice synth, eleven drums
  and an echo, sends MIDI over USB and Bluetooth, and can send or follow MIDI clock. The README names Intellijel
  Metropolis and Metropolix and the Moog 960 as the models.
status: active
authors:
