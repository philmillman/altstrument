device: m-vave-fm-1
name: Tessera
summary: >-
  Generative sequencing fork of Melodee, called Melodee (Tess) until 1.3.x: thirteen note generators (Turing, Euclid,
  Markov, Morph, Atlas and others) with Evolve, Form and Tweak pages for mutating phrases and building song
  sections.
description: >-
  Published as Melodee (Tess) up to 1.3.x and renamed Tessera at 2.0, when the repository moved from melodee-tess
  to tessera. Forked from Melodee (keremimo), which is itself built on Felucca. Each of the four tracks either
  stays a step sequencer, runs an arpeggio or runs one of thirteen generators, among them Turing, Euclid, Markov,
  Morph, Atlas (a drum map after Mutable Instruments Grids), Bounce, Awake, Chord and Answer. Evolve, Form and
  Tweak pages mutate phrases and build sections, and a modulation matrix routes any source to any destination.
  Version 2.0 played three engines (FM6, TRIO and DRUM), dropping the SID, PHYS, CZ-1 and Prophet engines and their
  sound banks; projects saved by 1.x do not load. Version 3.0 adds ORACLE, a polyphonic analogue-style voice with
  sounds of its own, and draws every screen in one ink on black with its own 5 x 7 font and nine colours. The README calls it experimental. A browser
  simulator, installer and editor are included.
status: active
authors:
- name: Rastapopolix
  url: https://github.com/Rastapopolix
source: https://github.com/Rastapopolix/tessera
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from Melodee; original copyright and SPDX headers are kept, and LICENSING.md lists the third-party parts.
  Releases up to 1.3.x bundled the CZ-1 factory tones and Sequential's Prophet-5/10 factory programs v1.03 as sound
  data, with the rights staying with Casio and Sequential; those banks were removed in 2.0 and were no longer in the
  repository on 2026-10-23.
homepage: https://rastapopolix.github.io/tessera/webapp/sim/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, which also offers a way back to official V15 with a backup
  first. The .fwsc is on the releases page, as a standard dual-core build and a single-core build for FM-1s that
  crash with the standard one. Do not unplug the FM-1 while it writes.
brick_risk: true
tags: [sequencer, random, euclidean, performance, editor, emulator]
