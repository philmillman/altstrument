  alt: "Tessera generator page in Turing mode with length 16, probability locked and a two-octave span above a row of step bars"
  credit: "Rastapopolix"
  source_url: https://github.com/Rastapopolix/tessera
  first_party: true
versions:
- version: 3.7.6
  date: 2026-11-26
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7.6
  notes: Page tabs show on every page and SELECT stops at a group's first and last page. A SYNC + FREE LFO stays on the bar after a Song Position jump from a DAW, and LANDSCAPE no longer flashes the keys. Projects from 3.7.5 load and play the same, and the package identity stays FM-1_837.
- version: 3.7.5
  date: 2026-11-22
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7.5
  notes: The four track dots in the header blink when the FM-1 runs out of time, and a new echo keeps to the beat. A one-core package ships beside the standard one.
- version: 3.7.4
  date: 2026-11-20
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7.4
  notes: Adds Move when and Move by rows on CHORD's GEN sheet so chords move on chosen strikes (LAST, LAST 2, ODD, CHANGE or RAND) by a chosen interval. The web editor and simulator get larger text, a light and dark button and screen-reader labels, and the editor shows grouped pages again with 3.7 firmware. A one-core package ships beside the standard one.
- version: 3.7.3
  date: 2026-11-19
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7.3
  notes: Fixes ANSWER CHORD TRUE, which answered a held chord with its first note only; every note is answered together now. Projects from 3.7.2 load and play the same.
- version: 3.7.2
  date: 2026-11-19
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7.2
  notes: Adds 2NDS, 4THS and 5THS chord kinds that stack the scale's seconds, fourths or fifths, shows ECHO's time in milliseconds, and makes printed loops take whole passes of the pattern length. The note log for capture and print grows from 128 to 256 notes, and ANSWER ends a phrase after a pause of a second and a half. The release ships a one-core package as well as the standard one, and the manual is also a PDF.
- version: 3.7.1
  date: 2026-11-18
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7.1
  notes: Adds a DRIVE effect, a soft clip with RATE as the drive, CHAR that folds the peaks back and MIX, usable in FX1 or as a send, and a readability pass on the manual. Projects from 3.7 load and play the same; a project using DRIVE plays that slot as a FILTER on 3.7 and older. The identity stays FM-1_837.
- version: '3.7'
  date: 2026-11-17
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.7
  notes: Adds capture-to-loop, where a phrase of up to 16 notes played on the keys or over MIDI becomes the seed for the TURING, EUCLID, MARKOV and MORPH generators, and gives each LANDSCAPE place a feature of its own on every shore. A project with a track set to SOURCE KEYS does not load on 3.6.2 or older.
- version: 3.6.2
  date: 2026-11-17
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.6.2
  notes: LANDSCAPE becomes a page to play, with its four knobs turning the PERF macros, and its night sky and the joins between shores are fixed. Projects load and play as on 3.6.1.
- version: 3.6.1
  date: 2026-11-17
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.6.1
  notes: Adds an IN mod source that is high while a track is heard, LFO sync of 8 to 64 bars, live marks on knobs that mods move in Mono, effect mod destinations named for the effect, and calls the harmony button SEL as printed on the FM-1.
- version: '3.6'
  date: 2026-11-17
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.6
  notes: Adds a harmonizer (HARM), 22 more mod destinations in a grouped list, QNT per track, MIDI clock at other PPQNs, HOLD for the generators, a place of its own for each project on LANDSCAPE, microtonal tunings that play with QNT off, the FM-1 as a controller for the web simulator and more room in the flash. A project saved on 3.6 does not load on 3.5.3 or older.
- version: 3.5.3
  date: 2026-11-13
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.5.3
  notes: Settles the CPU percentage on the SYSTEM page, which 3.5.2 still left jittering because of a biased running average and no buffer at whole-percent boundaries.
- version: 3.5.2
  date: 2026-11-13
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.5.2
  notes: USB audio no longer resets and goes silent when its ring runs empty or full, but pads or drops frames and crossfades back in. Also an attempt at a steadier CPU meter and consistent SELECT paging, including on MIXER.
- version: 3.5.1
  date: 2026-11-13
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.5.1
  notes: ANSWER and FOLLOW (with CANON, RHYTHM SOURCE and HOLD) react to the notes played on the keys, the GLO pages now start on the MIXER with PERF and LANDSCAPE keeping its mute, solo and fill keys, and SYSTEM gains BUDGET, CPU, A4 and TUNE; the FM-1's own panel can also play the web simulator.
- version: '3.5'
  date: 2026-11-12
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.5
  notes: Adds modular-style patching with two mod mix buses, EOC, CLOCK and PLAY destinations, a MOD DEPTH control and a MOD SCOPE view, plus a direction for each pattern (FWD, BACK, PEND, FOLD, RAND, DRUNK), per-pattern generator setups, four USER scales, chord strum, a light screen theme and one key rule (OCT+ in, OCT- back) on every page. A project that uses the new mod features does not load on 3.4.1; projects from 3.4.1 load on 3.5. Packages in standard and single-core builds.
- version: '3.4.1'
  date: 2026-11-07
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.4.1
  notes: Fixes screen reader wording so it matches what the screen shows, and the FM-1 now names itself Tessera FM-1 over USB so other firmwares' web installers can find it. Project format unchanged since 3.4; package identity stays FM-1_834.
- version: '3.4'
  date: 2026-11-07
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.4
  notes: Speaks its screen through the FM-1 Screen Reader page so the FM-1 can be played without seeing it, and drops the on-screen help cards to make room. Adds HOW and RHYTHM for a track that follows another, a PIECE that keeps real time and comes home at the end, and USB audio named the right way round. Projects from 3.3 carry over.
- version: '3.3'
  date: 2026-11-06
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.3
  notes: Adds long form, with a CHAIN that moves tracks between sections together, ENTRIES that drop tracks out and bring them back, and a PIECE with a length and a shape. Also four macros, mods of mods, CC out from mods, MIDI LEARN maps that survive power-off, TIMING SPLIT, new palettes and a new package identity (FM-1_833) that M-VAVE's M-UPGRADE 3.11 recognises. Projects from 2.x and 3.x load; a 3.3 project loses its new parts in 3.2.x. The release lists several new parts as not yet tried on many devices.
- version: 3.2.2
  date: 2026-11-01
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.2.2
  notes: Adds Snap to scale, which moves a pattern's already written notes onto the scale once, each to the nearest scale note and down when halfway; hold EDIT to undo. Projects, presets and settings from 2.x onwards carry over. The release calls it new and not yet tried on many devices.
- version: 3.2.1
  date: 2026-11-01
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.2.1
  notes: Adds up to four tunings of your own loaded from Scala .scl files in the web editor (up to 64 notes per period, saved with the project), a MIDI OUT transpose for each track, an always-visible battery indicator and a USB host that follows hubs with a second hub inside. A project saved with tunings or MIDI OUT transpose opens in an older version without them.
- version: '3.2'
  date: 2026-10-31
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.2
  notes: Brings back PHYS, the physical-modelling engine, with 17 sounds, makes live recording into STEP layer pass after pass, starts tracks you add while others play in time with them and makes MODS clearer. Projects from 2.x onwards load. The release says the 3.1 USB host and MIDI CC control were still untested on a device.
- version: '3.1'
  date: 2026-10-31
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.1
  notes: Adds a USB host mode that lets the FM-1 host one USB-MIDI device, and a fixed MIDI CC map with NRPN access to every parameter. The release says neither has been tried on a device yet. Projects, presets and settings from 2.x and 3.0 carry over.
- version: '3.0'
  date: 2026-10-30
  url: https://github.com/Rastapopolix/tessera/releases/tag/v3.0
  notes: A new screen in one ink on black with its own 5 x 7 font and nine colours; adds ORACLE, a polyphonic analogue-style voice, STEP patterns as seeds for the generators, conditional steps, a pitch accumulator and a FILTER effect; 2.x projects load.
- version: 2.1.1
  date: 2026-10-26
  url: https://github.com/Rastapopolix/tessera/releases/tag/v2.1.1
  notes: Chord names on the CHORD generator's CIRCLE progression now fit their boxes.
- version: '2.1'
  date: 2026-10-26
  url: https://github.com/Rastapopolix/tessera/releases/tag/v2.1
  notes: Adds a four-channel playable mixer, a HUMAN TIME timing knob, easier-to-read screens and steadier MIDI clock sync.
- version: 2.0.2
  date: 2026-10-25
  url: https://github.com/Rastapopolix/tessera/releases/tag/v2.0.2
  notes: Starting a new project while something plays now stops playback first instead of doing nothing.
- version: 2.0.1
  date: 2026-10-23
  url: https://github.com/Rastapopolix/tessera/releases/tag/v2.0.1
  notes: Adds a panel gamma setting for a crisper screen and fixes MORPH's playhead display; carries its own package identity.
- version: '2.0'
  date: 2026-10-23
  url: https://github.com/Rastapopolix/tessera/releases/tag/v2.0
  notes: Renamed Tessera; adds CHORD and ANSWER generators, an energy page and per-track MIDI out; drops the SID, PHYS, CZ-1 and Prophet engines, and 1.x projects do not load.
- version: 1.3.3
  date: 2026-10-19
  url: https://github.com/Rastapopolix/tessera/releases/tag/v1.3.3
  notes: Adds a TWEAK 2 page with branch, logic and bar conditions, slow organic mod sources and a modulation matrix page.
- version: 1.3.1
  date: 2026-10-18
  url: https://github.com/Rastapopolix/tessera/releases/tag/v1.3.1
  notes: Adds BOUNCE, AWAKE and POLY generators; offers only the SID, TRIO, PHYS and DRUM engines.
- version: 1.2.7
  date: 2026-10-17
  url: https://github.com/Rastapopolix/tessera/releases/tag/v1.2.7
  notes: Adds a Grids drum-map generator, per-track seeds, a 16-cord modulation bus and on-screen help for every knob.
- version: 1.1.0
  date: 2026-10-11
  url: https://github.com/Rastapopolix/melodee-tess/releases/tag/v1.1.0
