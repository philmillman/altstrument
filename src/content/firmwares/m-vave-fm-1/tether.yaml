license: GPL-3.0-only
license_notes: >-
  The pocket/firmware folder has its own LICENSE and LICENSING.md giving GPL-3.0-only, as Dinghy; the rest of the repository, including the FM1.Pocket page that talks to it over MIDI, is MIT. The platform code keeps the credits of Leo Kuroshita, isod89, M. Geisler and zvenson, and the Terminus font is SIL OFL 1.1. The logo of Dinghy, designburg's and not under the GPL, was not copied. The committed tether-1.0.fwsc is the project's own build and not an M-VAVE stock image.
homepage: https://utopick.github.io/fm1-pocket/pocket/
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  The release notes say to install it from FM1.Pocket (OPTIONS, REAL FM-1), which walks through a backup, the m-bootloader protector and then the install, or with The Firmware Hub's installer, which needs neither. It works on the first FM-1s and on the newer ones with the UC25HQ80 flash chip. Its update loader means another firmware can always be installed over it, and holding OCT- while powering on enters Dinghy's USB rescue mode. To go back to stock, open M-VAVE's FM-1.fwsc in FM1.Pocket and install it the same way. The README says Tether works as a controller and sound output on Mac and Android.
