device: m-vave-fm-1
name: Tether
summary: >-
  Turns the FM-1 into a USB MIDI controller and into the front panel of the FM1.Pocket browser emulator: keys, knobs and buttons play the page, and the page's screen and lights show on the unit.
description: >-
  With FM1.Pocket open, the unit's 27 keys, 12 buttons, encoders and MASTER knob are sent to the page as MIDI and the page sends back the emulated screen and the LED states, so any FM-1 firmware can be tried on real keys and a real screen without installing it. The package also has a protocol 2 mode in which the unit is a USB audio speaker the page can play into; the project's status notes say this speaker has not yet run on a unit. When no page is open, Tether is a plain USB MIDI keyboard: keys send notes on channel 1, the buttons send pads on notes 36 to 47 on channel 10, MASTER sends CC 7 and the encoders send CC 74 to 76 and 70 to 73. The screen shows the control last touched with its value, the tempo and bar when a program sends MIDI clock, the chord being held and a level meter for incoming USB audio, and a program can light the keys and pads by sending notes back. It is Dinghy 0.5 with the app replaced by tether.c and small changes to its MIDI, USB and storage code, and it keeps the update loader so other firmware can be installed over it. The project's other Pocket apps recognise the unit when it runs Tether.
