distribution: source-only
install_notes: >-
  There are no GitHub releases yet. A tag vX.Y builds a signed release with theory1-X.Y.fwsc, and each push to main
  builds theory1.fwsc as an Actions artifact. Install the package from a clone with python3 base/tools/fm1_install.py
  over a USB data cable, without a hub. The Firmware Hub installer does not list it. To go back, install M-VAVE's
  official V15 package the same way, or use the safe mode that appears after two failed starts. The author says it is
  not tested on every unit.
