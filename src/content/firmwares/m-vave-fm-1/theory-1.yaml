device: m-vave-fm-1
name: THEORY-1
summary: >-
  Music theory teaching firmware: lessons, quizzes answered on the keys or by ear, and a lab that names the notes,
  intervals and chords you play, in five languages.
description: >-
  Lessons cover the basics, reading notes on a staff in up to seven clefs, intervals, scales, 21 modes (the diatonic,
  melodic-minor and harmonic-minor families), a lesson on scales from other traditions, thirteen chord types, the chords
  on each scale degree with roman numerals and harmonic function, and the circle of fifths. A synthesis section of 18
  chapters teaches synth basics on a teaching synth whose knobs the K1 to K4 keys move. The quiz has eleven kinds of question at three levels, scores them and keeps best scores. The lab names
  whatever you play, including chord inversions. The keys light up with the lesson's notes and a keyboard on the screen
  repeats the colours. Text is in English, Italian, Spanish, German and French, and notes can be shown as solfege,
  letters or the German names. An outside keyboard works over USB, the TRS jack or Bluetooth MIDI. It writes only its
  own settings sector. The repository is built on fm1-base and felucca-bsp.
status: active
