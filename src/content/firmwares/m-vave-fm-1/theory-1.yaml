license_notes: >-
  The author's code in app/, docs/ and tests/ is MPL-2.0 (LICENSE). The fm1-base and felucca-bsp submodules are MPL-2.0,
  the Barlow and Bravura fonts are SIL OFL 1.1, and every package gets three unmodified JieLi AC79 SDK files
  (Apache-2.0) and binary Bluetooth libraries added at build time; none are in the repository.
distribution: download
install_notes: >-
  Download theory1-X.Y.fwsc from the GitHub releases page (each push to main also builds theory1.fwsc as an Actions
  artifact). Install the package from a clone with python3 base/tools/fm1_install.py over a USB data cable, without a
  hub. The README says the Firmware Hub installer does not list it yet. To go back, install M-VAVE's
  official V15 package the same way, or use the safe mode that appears after two failed starts. The author says it is
  not tested on every unit.
brick_risk: false
