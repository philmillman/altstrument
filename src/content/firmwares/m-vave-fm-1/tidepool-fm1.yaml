  url: https://github.com/pjh-133
source: https://github.com/pjh-133/tidepool-fm1
source_status: open
license: MPL-2.0
license_notes: >-
  The README and LICENSE give MPL-2.0 for Tidepool's own code. The fm1-base submodule and the felucca-bsp code under
  it are MPL-2.0 as well.
homepage: https://pjh-133.github.io/tidepool-fm1/
distribution: browser-installer
requires_stock: M-VAVE stock firmware
install_notes: >-
  Web installer in Chrome or Edge with the FM-1 on USB, or the .fwsc from the releases page with fm1_install.py. The
  installer's "Back to the stock firmware" step takes the M-VAVE firmware file you download from M-VAVE. To build it
  yourself, clone with submodules and build with fm1-base's tools (JieLi toolchain and AC79 SDK needed). The README
  says installing is at your own risk.
brick_risk: false
