device: m-vave-fm-1
name: Timer Tom
summary: >-
  Kitchen multi-timer firmware for the FM-1: four timers on K1 to K4 with dish icons, soft ambient-techno percussion that adds a layer per running timer, key loops and key lights that run like an hourglass. Beta.
description: >-
  Timer Tom replaces the FM-1 firmware with four countdown timers shown on one screen, each with a dish icon and a bar that empties like sand. K1 to K4 set the timers up to four hours, PRESETS picks one of twelve icons, PLAY starts or pauses the active timer or all of them, and REC resets one. While timers run, each adds a layer of soft percussion (kick, open hat, rim with dub echo, shaker), or the sound can be switched to a plain clock tick or silence. Each of the 27 keys starts its own slow melodic loop in one key, which moves to the next key after a while, and the key lights show an hourglass with a grain falling on every beat. Alarms play a three-note motif per timer. The sound engines and sequencer are those of FM1 Open, and the changes sit in the app layer. Timers and loops are not saved. The README calls it a beta that has passed testing on an original FM-1, and the project says its code was written together with Claude.
