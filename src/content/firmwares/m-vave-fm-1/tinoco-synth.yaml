install_notes: >-
  Download tinoco-synth-1.2.1.fwsc from the repository, the complete package with the app and loader, and install it like any FM-1 firmware; the README says not to install the separate .bin from the source archive. SHA-256 sums are published beside the files. Back up first: the notes state that installation and downgrade have not been tested on hardware and that a reported error 258 is not confirmed as fixed. The FM-1's ROM boot mode applies.
