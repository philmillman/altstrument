source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSING.md. The platform comes from Felucca by way of SLOOP and Dinghy, the SMK-37 board layer is from
  genkigenki's SLOOP branch, and the update loader screen is from OberVave. The Terminus font is SIL OFL 1.1.
based_on: m-vave-fm-1/dinghy
distribution: source-only
install_notes: >-
  No release exists yet. Build with ./build.sh --release 0.1 (Docker and the JieLi SDK, as described in Dinghy's
  docs), then install the .fwsc with the Firmware Hub, M-Flasher's download mode or tools/fm1_install.py. The README
  says the way back is another firmware or M-VAVE's own. Installing is at your own risk.
