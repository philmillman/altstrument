device: m-vave-fm-1
name: Tinsel
summary: >-
  Christmas music toys and games for children and adults: a tree with a bauble above every key, a carol book, an
  Advent calendar, a music box, change-ringing bells and small two-player games.
description: >-
  Switch it on and the Grotto shows a Christmas tree with a bauble above every key; a key rings its bell, and turning
  a knob sends a robin to land on something that reacts. HOME opens the Sleigh, a menu of pictures. The Carol Book
  plays eight public-domain carols in three ways, where any key plays the next note, the next key lights up and the
  band waits, or it plays itself. Other screens are Present Catch, an Advent calendar with 24 windows, a Music Box with
  a track of your own pins, a Bell Tower with Plain Bob and Grandsire, a Snow Globe, Jingle It, Cracker Pull,
  Snowball Rally and Sleigh Ride. Holding EDIT shows what the screen's controls do, and EDIT with SAVE opens a
  grown-ups' panel for the volume ceiling, game levels, the date and high scores. It is built on Dinghy and keeps its
  saved data in its own part of the flash, so switching to Melisma or Dinghy leaves their saves alone. It has no
  release yet: the README says to install tinsel-X.Y.fwsc from the releases, and none has been published. The
  repository has the source, a build script, host tests and a release workflow, and the README does not say that it
  has been tried on an FM-1.
status: active
