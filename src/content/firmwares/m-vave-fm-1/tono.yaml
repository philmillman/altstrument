versions:
- version: v0.74.2-opt
  date: 2026-11-25
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.74.2-opt
  notes: Auto Off now pauses the automatic changes to travel, sounds, layer types, Generate settings and harmony, and freezes tone and rhythm drift. Playback and manual edits continue. 0.74.1 came a few hours earlier and is not listed.
- version: v0.74-opt
  date: 2026-11-25
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.74-opt
  notes: Holding HOME and tapping GLO toggles Auto Travel, and an EQ page on FX has a live spectrum with 3-band and Isolator modes. HOME + LFO links layer FX cutoff, filter, tremolo and EQ parameters, and Auto changes are announced on screen.
- version: v0.73-opt
  date: 2026-11-25
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.73-opt
  notes: Generate changes its rules at the four-bar boundary so held notes keep their tails. Adds a band-pass filter with 6 to 24 dB/oct slopes and a Texture Voices bank of four spoken recordings.
- version: v0.72-opt
  date: 2026-11-25
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.72-opt
  notes: Adds a selectable filter slope, a layer tremolo with rate, depth, shape and left/right phase, and new texture and pad sounds (Abstract Rain, Cloud Bloom). Songs from earlier releases keep their original filter response.
- version: v0.71-opt
  date: 2026-11-25
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.71-opt
  notes: Adds sound variations, texture families, a bell filter mode, quick LFO linking, Soft Knee saturation and live EQ spectra.
- version: v0.70-opt
  date: 2026-11-24
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.70-opt
  notes: Adds two LFOs per layer, live filter response displays and a master limiter page.
- version: v0.66-opt
  date: 2026-11-24
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.66-opt
  notes: Adds the browser player and a macOS emulator bundle.
- version: v0.65-opt
  date: 2026-11-24
  url: https://github.com/pietrobolcato/tono/releases/tag/v0.65-opt
  notes: First public release.
