device: m-vave-fm-1
name: TR-707C
summary: >-
  Drum machine styled after a 1985 computer rhythm composer: 13 synthesised instruments, 16 step keys, a pattern of up to 64
  bars per instrument, eight songs and MIDI control.
description: >-
  An app on the Dinghy platform that follows the workflow of a Roland TR-707 without bundling any Roland material: the thirteen
  instruments (bass drum, snare, three toms, rim, clap, cowbell, two hi-hats, crash, ride and tambourine) are synthesised with
  integer maths and the repository contains no samples. Each instrument has its own pattern of up to 64 bars with its own loop
  length, so a short cowbell loop can run against a long kick pattern, and each step is off, on or accented. Notes, three banks of
  control changes, clock in and out and start and stop are handled over MIDI, and eight songs save to flash. The documentation
  says it is an unofficial fan firmware, tested only in host mode on a computer: it was not yet built with the JieLi
  toolchain or run on an FM-1. The README is still Dinghy's.
