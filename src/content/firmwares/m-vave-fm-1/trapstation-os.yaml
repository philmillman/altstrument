device: m-vave-fm-1
name: TRAPSTATION OS
summary: >-
  Trap and phonk groovebox with six tracks of 808, FM and sampler machines, drum, hat, bass and chord generators, a piano roll, a
  slicing sampler, a live performance page and a browser installer.
description: >-
  Each track has its own machine, sound, 64-step pattern and mix. The machines are 808 drum kits with glide and sub, an 808 bass,
  an FM synth, a mono synth, a digital engine and a sampler for up to 32 samples of about 11 seconds in total, which can be cut
  into slices played from the white keys. Four generators (LUCKY DRUMS, ACE HATS, LOW ROLLER and GOLDEN CHORDS) create drums, hats,
  bass lines and chords from one knob, and the result is ordinary notes that can be edited in the piano roll. A performance page puts
  track mutes and eight effect throws on the keys, and the master section has tape, VHS and vinyl colouring. From 1.1.0.0 the FM synth is
  a six-operator engine with 32 algorithms and twelve sound pages, and OCT- tapped twice undoes the last change. It is a fork of BBL JAM BOX,
  which is built on Felucca. A companion desktop app, Trap Station Desktop, converts audio into samples, edits the FM sounds and exports to
  Ableton Live.
status: active
authors:
