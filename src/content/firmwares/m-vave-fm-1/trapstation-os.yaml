  url: https://github.com/sog-maker
source: https://github.com/sog-maker/trapstation-os
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, with copyright lines for Leo Kuroshita (Felucca), Blair (the BBL JAM BOX changes) and the project's
  contributors. The TRAPSTATION name, logo and artwork are all rights reserved and not under the GPL. The FM6 core (msfa) is Apache-2.0, the engine
  interface and icon font from Hügelton Instruments are MIT and the fonts are SIL OFL 1.1. LICENSING.md says all sounds are synthesised or made
  by the author and that no M-VAVE material is included; the installer's Return to official V15 checks a file you download yourself.
homepage: https://sog-maker.github.io/trapstation-os/
based_on: m-vave-fm-1/bbl-jam-box
distribution: browser-installer
install_notes: >-
  Use the installer page in Chrome or Edge over a USB data cable (no hub), or install trapstation-os-1.1.0.2.fwsc with tools/fm1_install.py,
  or from the FM-1 Firmware Hub. Back up in the installer first: samples, user sounds and kits stay on the device, but 1.1.0.0 does not
  load the last jam of 1.0.0.0. The package carries its update loader, so the installer's Return to official V15 (with M-VAVE's FM-1_015.fwsc
  that you supply) or another firmware's installer takes over from it, and INSTALL.md says an interrupted update resumes when Install is pressed
  again. The README says that if an install fails and the FM-1 no longer starts, recovery needs the FM-1-transporter hardware.
brick_risk: false
tags: [groovebox, sequencer, drums, sampler, synth-engine, fm, chords, fx, midi, editor, fork]
