device: m-vave-fm-1
name: TRI-6 FM-1
summary: >-
  Six-voice polysynth in the style of the Sequential Trigon-6: three oscillators per voice with sync and poly mod, a ladder filter, a mod matrix, two effects, unison with chord memory, an arpeggiator and 128 factory patches. Pre-release, not yet tested on a real FM-1.
description: >-
  The engine is written from the Trigon-6's user guide and MIDI implementation, and the project says it holds no code or data from Sequential's firmware. Each voice has three oscillators with triangle, saw and pulse mixed together, hard sync from OSC 2 to OSC 1, noise, a feedback and drive knob and a two- or four-pole ladder filter with two envelopes and an LFO. Poly mod sends OSC 3 and the filter envelope to pitch, pulse width, feedback and cutoff, and an eight-slot mod matrix adds more routes. After the voices come distortion and two effects in series, chosen from delays, chorus, phasers, flangers, a ring modulator and four reverbs, with delays that sync to the clock. Unison stacks up to six voices, chord memory plays a stored chord from one key, and the arpeggiator has hold, ten divisions and MIDI clock sync. A MORPH macro on the ALGORITHM knob and on CC 16 is a mod matrix source. The second core renders voices four to six. The README says the sequencer, NRPN, MPE and alternative tunings are not done, and lists the Trigon-6's controller numbers it answers. The 0.4.1 release notes call it an unvalidated development build with known defects, among them SysEx that can crash the patch pages and stuck notes, and say a corrective 0.4.2 is being prepared. A browser player runs the package in the fm1-emu emulator. It is built on fm1-base.
