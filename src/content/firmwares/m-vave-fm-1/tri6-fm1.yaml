homepage: https://fergroan-sketch.github.io/tri6-fm1/
based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Download the .fwsc from a release and install it with fm1-base's web installer in Chrome or Edge over USB; the site also has a player. The README says to back up first, not to unplug during the install, and that the installer can put M-VAVE's stock firmware back. Installing over the same author's JUNIPER FM-1 (listed as juniper-fm1) replaces its saved patches, because both keep them in the same flash location. The README says it has not been tested on a real FM-1.
brick_risk: false
