device: m-vave-fm-1
name: TRIBE
summary: >-
  X0X fork with ten tracks where any engine plays on any track: two kicks, 909 and 808 drum voices and a 303,
  sixteen clips per track, scatter effects and two master effects.
description: >-
  Replaces X0X's five fixed parts with ten tracks, each assigned one of 28 engines. Every track holds up to 64
  clips in four banks of sixteen, each with its own length (16, 32 or 64 steps), rate, direction and swing, launched at
  the end of the pattern or at once. A song mode plays a track's clips one after another. Scatter effects on the keys act on a track or the whole mix, and two master effects
  take per-track sends. Four master knobs can be assigned to volume, a DJ filter, effect amounts or tempo.
  The site has a browser emulator, a manual and release notes. If it crashes twice at start it enters a
  safe mode that the web installer can reach, and a rescue script exists for a unit in the chip's boot mode.
status: active
