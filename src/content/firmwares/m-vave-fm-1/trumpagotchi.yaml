device: m-vave-fm-1
name: Trumpagotchi
summary: >-
  Virtual-pet game for the FM-1 featuring a pixel-art Donald Trump: four keys feed, praise, clean and rest the pet,
  the white keys play a pentatonic instrument, and a happy pet adds bongos.
description: >-
  The screen shows a pet with food, mood and energy bars. The first four black keys feed it, praise it, clean up
  after it and put it to bed or wake it. The white keys play a pentatonic scale without reverb or delay, and a
  happy pet joins in on bongos. A day lasts five minutes, news items lower its mood and raise its appetite, and
  when all three bars reach zero a game-over screen appears. Twelve voice clips edited from US government
  recordings play as reactions. Progress is saved manually and about once a minute, and time while powered off
  does not count. The author calls it an unofficial parody. It is built on FoMni by way of Fart Machine One.
status: active
