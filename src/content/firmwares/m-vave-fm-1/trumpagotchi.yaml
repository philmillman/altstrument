source: https://github.com/adamcharleswilsonmusic-code/Trumpagotchi
source_status: open
license: GPL-3.0-only
license_notes: >-
  Covers the code and original artwork. Rights in the voice recordings are separate; docs/VOICE-SOURCES.md lists
  the source recordings, which it describes as US government works in the public domain.
distribution: download
install_notes: >-
  Download trumpagotchi.fwsc and the source zip from the release, then run tools/fm1_install.py (Python 3 with
  the packages in requirements-install.txt). Installation replaces the current firmware, and a successful install
  reports FM-1_710. If an update is interrupted, run the same command again. The author tested the package on
  one FM-1.
brick_risk: false
