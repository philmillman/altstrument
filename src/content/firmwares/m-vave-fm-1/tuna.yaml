versions:
- version: '1.2'
  date: 2026-11-04
  url: https://github.com/delirioux/tuna/releases/tag/v1.2
  notes: Adds seeds sorted by type of work, up to 32 favourites kept across power-off, share codes that name the same piece on any FM-1 and in the browser, a radio mode that moves to another piece after 1 to 30 minutes, MIDI clock in, and a MOOD knob in place of MACRO. Flute and sax become FM patches of its own.
