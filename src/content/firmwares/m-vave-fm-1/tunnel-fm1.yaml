device: m-vave-fm-1
name: TUNNEL FM-1
summary: >-
  Detroit techno groovebox for the FM-1: eight synthesized tracks that loop at their own lengths, three decks that switch presets on the bar, delay, reverb, a DJ filter and 128 presets. First release, not yet tested on a real FM-1.
description: >-
  The eight tracks are kick, snare or clap, closed hat, open hat or ride, percussion, a slide bass, four-note chord stabs and four-voice bells, all synthesized with no samples. Each track has its own length of one to 32 steps and its own rate, so a seven-step loop rolls against a sixteen-step one, and each step has velocity, note, ratchet and chance, with slide on the bass. Three decks take drums, bass with stabs, and bells from different presets and cut between them on the next bar. Effects are a synced ping-pong delay, a reverb and a master DJ filter with drive, and the TUNNEL macro on the ALGORITHM knob and CC 1 closes the filter while the delay and reverb swell. The 128 presets are generated by a script in the repository from recipes for ten styles, and 32 user slots store edits. It follows MIDI clock or sends it, takes drum notes on channel 10, and runs over USB, Bluetooth and TRS MIDI. A browser player runs the package in the fm1-emu emulator. It is built on fm1-base.
