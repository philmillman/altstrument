based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
requires_stock: Any FM-1 firmware; the installer writes the package over it
install_notes: >-
  Use the web installer in Chrome or Edge over USB, or fm1-base's fm1_install.py with the .fwsc from the release. The README says to back up first because installing replaces the firmware and what it saved, and that the installer can put M-VAVE's own firmware back. The release notes say it has not been tested on a real FM-1.
