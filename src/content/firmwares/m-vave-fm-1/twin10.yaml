device: m-vave-fm-1
name: TWIN-10
summary: >-
  Pocket studio after the KORG DS-10: two monophonic synths with a patch panel, four synthesized drum parts, a mixer, an X/Y
  pad, an arpeggiator and a 6-track step sequencer.
description: >-
  Each synth has two oscillators with sync and ring modulation, a multimode filter with drive, an ADSR, an LFO that can follow
  the tempo, portamento and three patch cords from sources to destinations. The four drum parts are small synths with pitch
  drop, noise and filter. One effect at a time, chorus, flanger or tempo-synced delay, is fed by per-part sends, and the X/Y
  pad is Kaoss-style with each axis assignable. There are 32 factory sounds and a pattern A that plays a short techno loop at
  power-on. The screen copies the DS-10's two-screen layout, with an overview of the six parts above the touched panel. The
  arpeggiator and sequencer come from the author's LAX-32, and the README (in French) says no data from the original software
  is used and that the project is independent of KORG, Nintendo and M-VAVE. It is built on konsumer's foma framework.
