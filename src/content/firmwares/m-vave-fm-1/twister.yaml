source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only for the firmware as a whole and the LICENSE file is the GPL-3.0 text. The engine and effects files are MIT, the screen code is GPL-3.0 and uses M-VAVE's FM1 Open 5x7 font, and fm1-base and felucca-bsp are MPL-2.0 and are downloaded at build time. No stock firmware is committed.
homepage: https://8blend.github.io/twistfm-fm1/
distribution: browser-installer
install_notes: >-
  Back up projects and sounds with the M-VAVE Workbench, then open the project's installer page in Chrome or Edge with the FM-1 connected by USB. The README says the same installer can put M-VAVE's original firmware back. GitHub builds the package on every change, and the page offers the current .fwsc. The README says to install at your own risk.
