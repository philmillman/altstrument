device: m-vave-fm-1
name: TWISTER
summary: >-
  Eight-voice OPL3-style FM synth after the Twisted Electrons TWISTfm: four-operator and two-operator layers with the eight OPL3 waveforms, a four-pole filter per voice with 15 modes, a four-effect chain, an arpeggiator and a 128-step sequencer.
description: >-
  Each of the eight voices has a four-operator FM layer with 10 algorithms and a two-operator layer, using the eight OPL3 waveforms. Every voice has a four-pole filter with 15 modes, including LIQUID and MS20 flavours and a HEAT control. The effect chain is distortion, phaser, tape echo (free or tempo-synced) and reverb with room, plate and long shimmer types. The site also lists three LFOs with modulation chains, a modulation envelope, vibrato, tremolo, portamento, an arpeggiator, scales and chords, 16 user presets and two preset packs, one for drum and bass and one for dub and psychedelic techno. It takes MIDI in over USB and the TRS jack, sends MIDI and clock out over USB and syncs to an external MIDI clock. The repository calls it a development version, and its README is in Italian. The README names the firmware TWISTFM, while the project site, the build file and the on-screen name say TWISTER. The engine and effects are MIT, and it is built on fm1-base and felucca-bsp. The README says it is unofficial and not affiliated with Twisted Electrons or M-VAVE.
status: active
