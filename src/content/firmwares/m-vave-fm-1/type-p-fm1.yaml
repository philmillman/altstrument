device: m-vave-fm-1
name: Type P.fm1
summary: >-
  Two-part, four-operator phase modulation synth with per-operator feedback, many waveforms, two filters and a
  wavefolder, aimed at sound design, with a browser app and VST3 and CLAP plugins from the same engine.
description: >-
  Each of the two parts has four operators with feedback on every one, and the waveforms come from the OPL3 and OPZ
  families, with the pulse, square and saw redone to avoid aliasing. The author says the DSP was written from scratch
  with ymfm and Dexed as references. Two global multimode filters follow, the first with its own envelope and the second
  without, and a wavefolder adds harmonics and noise. A performance page, per-operator envelope views, patch save, load,
  init and copy, and a manual with MIDI and SysEx reference are included. There is no sequencer. The firmware was built
  with the umetate framework as its test case, and the author notes that they had no physical FM-1 at hand and cannot
  guarantee the install. The repository bundles the whole framework and fetched plugin dependencies, and its latest
  release is 1.0.6.
status: active
authors:
- name: P1Onken
  url: https://github.com/AkirakoSaintJust
source: https://github.com/AkirakoSaintJust/type-p-fm1
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README say GPL-3.0-only, while the LICENSE file's header allows "any later version". The plugin
  archives link JUCE 8, which is AGPL-3.0-only or commercial. The committed type-p-fm1.fwsc is the author's build, 612,216
  bytes, not M-VAVE's V15 image. M-VAVE stock firmware is not redistributed.
homepage: https://akirakosaintjust.github.io/type-p-fm1/
distribution: download
requires_stock: An FM-1 that starts normally; recovery hardware recommended
install_notes: >-
  Download type-p-fm1.fwsc from the latest release and install it with umetate flash, or with another FM-1 installer such as
  tools/fm1_install.py. The browser app at the project page lets you hear it first. The author gives no guarantee that
  installing works and asks testers to have a way to debrick the unit or return to another firmware.
brick_risk: false
tags: [synth-engine, phase-modulation, fm, filter, emulator, web, fork]
versions:
- version: 1.0.6
  date: 2026-11-08
  url: https://github.com/AkirakoSaintJust/type-p-fm1/releases/tag/v1.0.6
  notes: Adds a SINGLE PART TUNING page with per-part detune and transpose, a preset browser that asks before discarding edits, and save modes that work on both parts; the plugin's part presets must be re-saved.
- version: 1.0.5
  date: 2026-11-07
  url: https://github.com/AkirakoSaintJust/type-p-fm1/releases/tag/v1.0.5
  notes: Band-limited pulse, square and saw tables now carry far more harmonics at low notes, which removes a faint tone from the lower octaves, and the init patch lowers level key follow on two modulators.
- version: 1.0.3
  date: 2026-11-06
  url: https://github.com/AkirakoSaintJust/type-p-fm1/releases/tag/v1.0.3
  notes: Reworks the operator level to the Yamaha total-level scale of 0.75 dB per step, rescales the modulators to the OPM's four-cycle full-scale deviation, makes feedback follow the operator level and changes the ratio knob steps. The filters and wavefolder now start bypassed at power-on, and the plugin archives carry licence notices.
- version: 1.0.2
  date: 2026-11-05
  url: https://github.com/AkirakoSaintJust/type-p-fm1/releases/tag/v1.0.2
  notes: Adds a live PERFORMANCE page on HOME with cutoff, resonance, wavefolder amount and operator 1 feedback, one amplitude envelope drawn for each operator, and a confirmation before INIT PATCH.
