license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README say GPL-3.0-only, while the LICENSE file's header allows "any later version". The plugin
  archives link JUCE 8, which is AGPL-3.0-only or commercial. The committed type-p-fm1.fwsc is the author's build, 612,216
  bytes, not M-VAVE's V15 image. M-VAVE stock firmware is not redistributed.
homepage: https://akirakosaintjust.github.io/type-p-fm1/
distribution: download
requires_stock: An FM-1 that starts normally; recovery hardware recommended
install_notes: >-
  Download type-p-fm1.fwsc from the repository and install it with umetate flash, or with another FM-1 installer such as
  tools/fm1_install.py. The browser app at the project page lets you hear it first. The author gives no guarantee that
  installing works and asks testers to have a way to debrick the unit or return to another firmware.
brick_risk: false
