device: m-vave-fm-1
also_devices: [m-vave-smk-37]
name: umetate
kind: tool
summary: >-
  Python command-line framework for building custom FM-1 and SMK-37 firmware in a Docker build host, with a browser and plugin build of the same DSP, scaffolding, evidence reports and flash and recovery commands.
description: >-
  Commands check the environment, set up the JieLi toolchain in a Docker volume, build, emulate, inspect, flash and
  debrick, scaffold nodes, macros and patches, lint, and run a browser lab that compiles the generated DSP to WebAssembly.
  The same engine builds as a VST3 and CLAP plugin. The firmware side is RIB, a starter derived from Dinghy and
  Felucca that runs on both cores, with optional FPU use, SMK-37 support and hardware-accelerated DSP. Skills for
  development, safety and documentation guide an AI agent through a project, and a publish command stages a release
  with checksums. Type P.fm1 is the worked example. The README says device acceptance is blocked until hardware is
  available, and the author had not tested flashing on a physical FM-1. The standalone umetate repository was taken
  down while the author works on it before a release; Type P.fm1's README says it is not out yet, and the full
  framework source ships in that repository's framework/ directory.
status: active
authors:
- name: P1Onken
  url: https://github.com/AkirakoSaintJust
source: https://github.com/AkirakoSaintJust/type-p-fm1/tree/main/framework
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README say GPL-3.0-only. The LICENSE file's header says version 3 "or any later version", so the
  two disagree. A built plugin links JUCE 8.0.9, which is AGPL-3.0-only or commercial. The JieLi toolchain is vendor
  terms and is installed by the setup command, not stored in the repository.
distribution: source-only
install_notes: >-
  Needs Python 3.11 or newer and Docker. From the framework/ directory of the Type P.fm1 repository, install with
  pip install -e ., run umetate quick-check, then umetate setup to
  fetch JieLi's toolchain and SDK into the volume. The flash and debrick commands write the device, so back up first.
brick_risk: false
tags: [sdk, platform, emulator, web, fork, synth-engine]
versions:
- version: main @ 81ab4df
  date: 2026-11-08
  url: https://github.com/AkirakoSaintJust/type-p-fm1/commit/81ab4df4e276f5fcb40ad33cc4f1c50696c14a1c
  notes: The latest Type P.fm1 commit that touches framework/, the bundled umetate source, after the standalone repository was taken down.
- version: main @ fb3e250
  date: 2026-11-08
  notes: Last commit of the standalone repository, which is no longer public. No tagged releases. Since ff03ec7 the commits add performance work (a 12/8 split with a 64 percent worst case, 32-bit multiplies in the TL and VCA nodes, paced UI updates and system-load measurement), an experimental build that mixes open-compiler DSP with the vendor toolchain, and fixes to the Type P.fm1 example for portamento in poly mode, part delay in mono and plugin library loading. Before that the Type P.fm1 example got envelope drawing, a library menu, a preset browser that guards unsaved edits, saving of both parts in multi-patch modes and a filter envelope that retriggers on each note, while its second filter and wavefolder are removed and a worst-case benchmark is added. Before that came a command that converts OPM text banks and an operator band, a liquid filter and finer pitch-envelope steps.
