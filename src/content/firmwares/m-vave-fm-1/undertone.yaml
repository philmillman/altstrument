  The committed sdk/firmware/FM-1_015.fwsc is the file M-VAVE licenses under Apache-2.0 (git blob ce49cc1595b67347c68a3ac7463017f9fa8c19dd, 699,956 bytes).
based_on: m-vave-fm-1/fm1-open
distribution: source-only
requires_stock: FM1 Open V14 base
install_notes: >-
  No package is published. UNDERTONE.md builds it as FM1 Open is built, with JieLi toolchain 2.5.3 on Windows: sdk\Build.ps1 -FirmwareOnly for a test build, or build.bat --package with FM1_SOURCE_URL set to
  the tag's source archive. The README says the workbench or the standard FM-1 update protocol installs it and that M-VAVE's original V15 can be restored; keep a backup.
