device: m-vave-fm-1
name: Undertone
summary: >-
  Dedicated instrument firmware built on FM1 Open V14: a subharmonic polysynth, a West Coast percussion voice and an eight-voice drone module with a shared drive, delay and LFO bus.
description: >-
  The stock FM1 Open synths and screens are replaced, while M-VAVE's USB update, recovery, storage, USB audio and MIDI and Bluetooth layers stay underneath. VOICE is a four-voice
  polysynth in which each note adds up to three subharmonics, in just intonation, equal temperament or snapped to a scale, with a COAST control that moves from a filtered saw and pulse
  sound to a low-pass-gate and wavefolder sound. PERC has six West Coast percussion voices of a sine FM pair through a wavefolder and a vactrol-style gate, with a bounce retrigger. DRONE
  has eight sustained voices in four detunable pairs with cross-modulation. A shared bus adds drive, a modulated delay and a global LFO, and each module has six presets. Settings are not
  saved across power cycles, and the UNDERTONE.md notes say it has not yet run on hardware, so the CPU headroom with all modules sounding is unknown. The repository carries M-VAVE's FM1 Open
  sources and SDK, including the V15 stock image.
