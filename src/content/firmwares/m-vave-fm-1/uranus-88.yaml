device: m-vave-fm-1
name: URANUS 88
summary: >-
  Eight-voice analog-style polysynth with two oscillators, a resonant four-pole filter, two envelopes, a chorus, an arpeggiator, sequences, split
  and dual modes and an 808-style drum machine, built as a fm1-dock module.
description: >-
  Installable as its own firmware or as a module dropped onto fm1-dock. VCO-1 and VCO-2 have sync and cross modulation, and there are
  64 sound slots, 32 of them factory sounds. Key assign modes are POLY1, POLY2, UNISON, SOLO and CHORD with a voice depth setting, and
  the stereo chorus has BBD-style modes. Two sequence tracks play from the keys, and the drum machine has eight voices and eight
  patterns on the arpeggiator's clock. MIDI in covers notes, bend, aftertouch and some controllers, and channel 10 plays the drums. The
  README, in Swedish, says it has been tested on a computer and not yet run on an FM-1, and asks users to check the CPU load. It builds on
  fm1-dock and Dinghy and the repository has no releases.
status: active
