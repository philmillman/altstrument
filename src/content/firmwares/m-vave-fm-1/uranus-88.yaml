source: https://github.com/hagan66/uranus88
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README says GPL-3.0 and the repository has no LICENSE file. It is built on fm1-dock and Dinghy, which are GPL-3.0-only.
distribution: source-only
install_notes: >-
  GitHub Actions builds uranus88.fwsc and uranus88.dock with the Firmware Hub workflow and offers them as an artifact. Install the package with
  fm1_install.py from an fm1-dock checkout, or put the .dock file on fm1-dock. Holding OCT- at power-on starts the USB rescue, and the
  README names the FM-1 Firmware Hub for returning to the stock firmware.
brick_risk: true
