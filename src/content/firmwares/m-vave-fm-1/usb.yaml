homepage: https://github.com/jmfk/USB
based_on: m-vave-fm-1/dinghy
distribution: download
install_notes: >-
  The repository commits prebuilt .fwsc packages for each revision, each with a double-clickable Flash USB script that checks the package and writes it over MIDI; the README says only the owner launches these installers and that build.py and prepare_manual.py install nothing. Building needs a JieLi toolchain, the AC79 SDK and Docker. Dinghy keeps its update loader and writes only the firmware area, so the FM-1's ROM boot mode remains the way back.
