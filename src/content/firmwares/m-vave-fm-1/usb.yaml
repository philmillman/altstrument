device: m-vave-fm-1
name: USB
kind: firmware
summary: >-
  Experimental firmware that takes two stereo USB audio sources and routes USB MIDI from each input to any set of output ports.
description: >-
  The project turns the FM-1's USB host side into a small mixer and MIDI router: two stereo USB audio sources feed an output device, and each USB MIDI input can be routed to any set of output ports, with software capacity for 32 inputs and 32 outputs that the README says is not a measured throughput. The screen uses main menus for USB, MIDI and monitor, bus and shift pages, with a link page for editing a stopped route. Later revisions add a performance page and frozen SysEx diagnostic reports, which a bundled Python tool arms, fetches and compares on a computer. The README says firmware and hardware support remain experimental and that the latest prepared package, R13, is not confirmed installed or hardware-verified, though an owner-run installer of R4 reported success. Earlier packages are kept unchanged in the repository. It is built on a vendored snapshot of Dinghy and began as work extracted from a larger private project.
status: active
