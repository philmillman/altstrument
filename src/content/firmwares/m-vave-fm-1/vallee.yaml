  url: https://github.com/tammygucci
source: https://github.com/tammygucci/valee
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and the README says GPL-3.0-only, as Skiff and Felucca are. LICENSING.md lists the bundled fonts and DSP that keep their own licences.
homepage: https://tammygucci.github.io/valee/try/
based_on: m-vave-fm-1/skiff
distribution: browser-installer
requires_stock: Any FM-1 firmware (V15 or V16 stock)
install_notes: >-
  Open the installer at https://tammygucci.github.io/valee/webapp/installer/ in Chrome or Edge with the FM-1 on a direct USB cable and follow the page, or use vallee.fwsc from the release, then press Write factory samples on the editor's Samples page, or the sampled drum kits stay silent. The installer saves a full backup of the music first. The README documents going back to M-VAVE's firmware from the same page or with M-VAVE's updater, going back to Skiff, Skiff's recovery steps, and a fallback where two crashes within 30 seconds of power-on make the next start enter the chip's boot mode so it can be written again.
brick_risk: false
tags: [groovebox, generative, sequencer, synth-engine, drums, fx, performance, editor, emulator, fork]
