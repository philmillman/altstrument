versions:
- version: 1.0.2
  date: 2026-11-26
  url: https://github.com/tammygucci/valee/releases/tag/v1.0.2
  notes: Gives the master limiter more headroom and a slow levelling stage, so a loud mix pumps about a third as much for roughly 1 dB less loudness, and removes the click when a note restarts a ringing voice on five engines.
- version: 1.0.1
  date: 2026-11-26
  url: https://github.com/tammygucci/valee/releases/tag/v1.0.1
  notes: Fixes ALEMBIC MEDIUM, where the cassette, tape, VHS and vinyl settings distorted the whole song; they now only warm the loudest peaks.
- version: '1.0'
  date: 2026-11-26
  url: https://github.com/tammygucci/valee/releases/tag/v1.0
  notes: First release that is not a pre-release. Replaces every synth engine, sound and drum kit with SPAMPY's (15 engines, 35 kits, 27 FX-layer effects) and adds ALEMBIC MEDIUM. Songs from 0.9 open but move to the new sounds.
- version: 0.9.1-alpha
  date: 2026-11-23
  url: https://github.com/tammygucci/valee/releases/tag/v0.9.1-alpha
  notes: Adds a fifth GEN page, CHORDS, where up to four chords of your own, one a bar, set the parts GEN writes, and lets a verse and a chorus written in turn add up into a song in SEQ > SONG. Published as a pre-release; projects stay compatible with Skiff and 0.9.
- version: 0.9-alpha
  date: 2026-11-19
  url: https://github.com/tammygucci/valee/releases/tag/v0.9-alpha
  notes: First public test version, published as a pre-release.
