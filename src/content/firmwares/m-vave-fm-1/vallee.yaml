device: m-vave-fm-1
name: Vallée
summary: >-
  Skiff-based firmware that writes a song in one press, then lets you perform it: a twelve-style song generator, a keyboard mode that plays the song's sections, a master effects chain, SPAMPY's sound engines and its own look.
description: >-
  Vallée keeps Skiff 2.6's sequencer, editor and saves. GEN writes all six tracks in one of twelve styles from a style, a vibe and a seed, and in SONG mode a full arrangement with intro, verses, choruses, bridge and outro; the same settings give the same song. THE SPELL turns the keyboard into the song: white keys jump to sections on the next bar, spare keys hold effects, and black keys ask for a new take of a part or record the order played as a new arrangement. ALEMBIC is a master chain of drive, motion, space and grain stages, each with a blend knob. From version 1.0 every synth engine, factory sound and drum kit is SPAMPY's, built on SLOOP's engines: 15 engines with about 200 sounds, 35 drum kits, 27 effects on an FX layer, and a MEDIUM stage in ALEMBIC that plays the mix through cassette, tape, VHS or vinyl. Version 0.9.1 added a CHORDS page to GEN for writing the parts over up to four chords of your own, and lets parts written one after another add up into a song. SUMMON plays an ambient engine in the song's chords. Two screen themes and an opening animation are included. Songs from 0.9 open in 1.0, but their tracks move to the new sounds. Skiff does not have the 1.0 sounds, so projects made on 1.0 may not sound right or open there.
status: active
authors:
