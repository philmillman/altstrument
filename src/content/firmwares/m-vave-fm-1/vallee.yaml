device: m-vave-fm-1
name: Vallée
summary: >-
  Skiff-based firmware that writes a song in one press, then lets you perform it: a twelve-style song generator, a keyboard mode that plays the song's sections, a master effects chain, new sounds and its own look. Alpha.
description: >-
  Vallée keeps Skiff 2.6's engines, sequencer, editor and saves. GEN writes all six tracks in one of twelve styles from a style, a vibe and a seed, and in SONG mode a full arrangement with intro, verses, choruses, bridge and outro; the same settings give the same song. THE SPELL turns the keyboard into the song: white keys jump to sections on the next bar, spare keys hold effects, and black keys ask for a new take of a part or record the order played as a new arrangement. ALEMBIC is a master chain of drive, motion, space and grain stages, each with a blend knob. New sounds include Moog, Oberheim and Juno filters for the analog engine with 21 presets, three drum kits and SUMMON, an ambient engine that plays in the song's chords. Two screen themes and an opening animation are included. The SLICE engine is left out to fit in the FM-1's memory, so a SLICE track or preset becomes an FM6 sound. Skiff cannot open projects that use SUMMON.
