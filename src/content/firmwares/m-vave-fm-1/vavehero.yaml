device: m-vave-fm-1
name: VaveHero
kind: firmware
summary: >-
  Rhythm game for the FM-1 in the Guitar Hero style: notes fall down a highway, the white keys play the lanes and the key LEDs show what is coming, with four synthwave songs.
description: >-
  A Dinghy 0.5 app with a browser reference that fixes the rules and the sound. Songs are ordinary MIDI files with one channel per instrument, and a converter
  makes new ones. Choosing levels, voices, speed, mix and a grit setting is on the knobs, and best results are saved in flash. MIDI MODE LIVE makes the FM-1 a sound module for a
  DAW, and FREE SOLO lets you play a song's instrument without the game. A two-player link over MIDI is built in and works through a computer, while a cable between two units is still to be studied. The README says the firmware is tested on the
  host and measured in fm1-emu, using about 31 percent of the chip for audio at the heaviest spot, and not yet tried on a real FM-1.
status: active
