license: GPL-3.0-only
license_notes: >-
  LICENSING.md gives GPL-3.0-only, as Dinghy, with Felucca, SLOOP and OberVave platform code under their own notices. The Terminus font is SIL OFL 1.1.
homepage: https://joakimskurk.github.io/fm1vavehero/
distribution: browser-installer
install_notes: >-
  The project page installs the firmware from Chrome or Edge over USB and also plays the game in the browser. To build it instead, use the Makefile and JieLi's toolchain, then install build/vavehero.fwsc over USB-MIDI with tools/fm1_install.py. The browser reference runs without a device, and a
  CI package opens in the fm1-emu emulator.
