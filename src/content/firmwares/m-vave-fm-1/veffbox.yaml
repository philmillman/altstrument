versions:
- version: 0.9.0
  date: 2026-11-11
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.9.0
  notes: Adds an ARP mode that follows the playing chord or the held keys (UP, DOWN, UP-DN, RND, ORDER, one to four octaves, four rates) and an option to send every track's notes as MIDI on channels 1 to 4. The release is built on GitHub with an attestation.
- version: 0.8.0
  date: 2026-11-10
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.8.0
  notes: Adds a built-in library of 15 sources (FM, analog, kits) and 10 effect chains, applied as you turn the LIB control on SRC and FX.
- version: 0.7.0
  date: 2026-11-09
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.7.0
  notes: Adds MIDI clock in and out; a SYNC setting on GLO either sends clock with start and stop or follows an incoming one. The package identity is FM-1_62000100.
- version: 0.6.0
  date: 2026-11-08
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.6.0
  notes: Adds a CHORDS setting on GLO. Tracks set to CHORD play track 1 to 4's progression in step, each with its own sound, strum and voices, and RESAMPLE copies the chords in.
- version: 0.5.0
  date: 2026-11-07
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.5.0
  notes: Four tracks sound at once, each with its own player, mixed together, with PLAY and STOP for all and a mute per track on GLO. Also fixes a crash from audio buffers moving between tracks and puts idle players to sleep.
- version: 0.4.0
  date: 2026-11-06
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.4.0
  notes: Adds a chord pad with KEY, SCALE and INPUT DEGREE, where the keys play chords on the scale degrees and PLAY writes them into the steps, with the roman numeral on screen. The notes say releases now come daily, one finished feature each.
- version: 0.3.2
  date: 2026-11-03
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.3.2
  notes: Screens draw the OP4 algorithm, the LFO wave and the ADSR shape, and the emulator on the site gains a step-by-step tutorial.
- version: 0.3.1
  date: 2026-11-03
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.3.1
  notes: CHOP can slice evenly as well as at transients; banks from earlier versions convert automatically.
- version: 0.3.0
  date: 2026-11-03
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.3.0
  notes: Chord sequences of 16 steps with up to eight notes, 22 chord types, a bass tone and voicings, plus step editing on the play page.
- version: 0.2.2
  date: 2026-11-03
  url: https://github.com/galfaroth/veffbox/releases/tag/v0.2.2
  notes: The 64-sound bank with generation trees is kept in flash and REBUILD renders a generation bit for bit.
