device: m-vave-fm-1
name: VEGETAL
summary: >-
  Plant-process engine for the FM-1 that turns 21 processes, from phyllotaxis to root and mycorrhiza networks, into notes, with 24 timbres, MIDI note output and a browser visualiser, added to Felucca. Installs from a browser page; the text is in Spanish.
description: >-
  Each version of the project is published in its own repository, so the newest, vegetal-1.8.1-v3, is the source here and
  the earlier repositories vegetal-fm1 and AAAVEGETAL hold the first state and 1.8.1-vegetal2 of the same overlay. A
  repository holds only the files that change or add to Felucca at a pinned commit, and a GitHub Actions workflow applies
  them, builds the firmware, tests the engine on Felucca's host harness and publishes a site with an installer, a browser
  simulator and an editor. The engine runs 21 processes taken from plant growth, among
  them phyllotaxis stepping the scale at the golden angle, branching trees read by a turtle, root systems, flowering, a
  circadian clock and mycorrhiza, which listens to another track and answers it. The tempo clocks the processes, and a
  growth setting picks the step length. A load governor adds or drops nodes as the processor fills, and on the home
  screen the unit draws the selected track's plant instead of the oscilloscope. Version 1.8.1-vegetal2 adds a timbre per
  track, notes sent out over USB MIDI on channels 5 to 8, and a mirror page for Chrome that listens to the FM-1 over USB
  and draws each process as pixels, a 3D mesh or a point cloud, with controls for projection. Version 1.8.1-vegetal3
  raises the timbres to 24, adds an organ setting that gives each plant part its own sound and lets the shape control
  change each timbre from inside. The author is a university researcher, and the README says the software is experimental.
status: active
authors:
- name: Mauricio Vásquez Arias
  url: https://github.com/capitanplaneta80-create
source: https://github.com/capitanplaneta80-create/vegetal-1.8.1-v3
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL version 3 text and the README says GPL-3.0 like Felucca, with no later-version clause; the landing
  page source carries an SPDX GPL-3.0-only header; the newer repositories carry the same LICENSE. The built firmware also
  contains Felucca, which the workflow fetches at a fixed commit. No M-VAVE stock image is bundled; the .fwsc files the
  sites serve are VEGETAL builds.
homepage: https://capitanplaneta80-create.github.io/vegetal-1.8.1-v3/
distribution: browser-installer
install_notes: >-
  Open the site's installer in Chrome or Edge with the FM-1 on USB, allow MIDI with SysEx and press install, without
  unplugging during the write. If an update is cut off, pressing install again resumes the update mode. The installer's
  return to the official firmware backs up your music and writes M-VAVE's V15 file, which you choose yourself and which
  the browser checks by SHA-256; for V16 the page points to M-VAVE's own updater.
brick_risk: false
tags: [synth-engine, generative, sequencer, emulator, editor, web, fork]
