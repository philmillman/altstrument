device: m-vave-fm-1
name: Velo
summary: >-
  Experiment that reads key velocity and aftertouch from the FM-1's rubber-dome keys with no hardware changes,
  by sampling two key rows with the chip's ADC; a small FM voice and USB MIDI output show the result.
description: >-
  The FM-1 keys give only on or off, but a carbon pill's resistance falls with force. Velo samples that between
  key-scan ticks and takes velocity from the time between a touch and a press threshold. Twenty of the 27 keys
  are read; the top seven play at a fixed velocity. The screen shows each press as a curve, and a host script
  logs presses to CSV. The author parked it on 2026-10-14 with per-key calibration not yet right.
status: active
