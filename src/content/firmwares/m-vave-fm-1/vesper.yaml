versions:
- version: 2.0.1
  date: 2026-10-31
  url: https://github.com/fatcatstudios-hub/vesper-fm1/releases/tag/vesper-2.0.1
  notes: Makes notes from a MIDI keyboard (USB or the TRS jack) sound again on the focused layer's voice; 2.0.0 left them silent. VESPER's ID now matches its Firmware Hub listing. Saved presets stay when updating from 2.0.0.
- version: 2.0.0
  date: 2026-10-30
  url: https://github.com/fatcatstudios-hub/vesper-fm1/releases/tag/vesper-2.0.0
  notes: Rebuilt on fm1-base and felucca-bsp instead of M-VAVE's FM1 Open SDK, with the same scenes, sounds and screens. The piano, marimba and glockenspiel samples are built in, user presets are stepped by holding SEL and turning PRESETS, and under heavy load the oldest voices are released first. Bluetooth MIDI is not in yet and projects saved in 1.x do not carry over.
- version: 1.1.0
  date: 2026-10-30
  url: https://github.com/fatcatstudios-hub/vesper-fm1/releases/tag/vesper-1.1.0
  notes: >-
    First public release. The changelog lists a faster screen redraw, about 8 KB more free memory, five SEQ pages and
    VESPER's own update identity FM-1_8837001.
