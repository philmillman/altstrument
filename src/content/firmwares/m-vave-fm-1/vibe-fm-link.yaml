  date: 2026-11-07
  url: https://github.com/zvenson/vibe-link/releases/tag/v0.4
  notes: When the VIBE, its web player or the VST runs a converted FM-1 firmware, the FM-1 shows that firmware's own 240 x 240 screen, sent as run-length-coded changes.
