- version: v0.2
  date: 2026-11-07
  url: https://github.com/zvenson/vibe-link/releases/tag/v0.2
  notes: Gives the firmware its own package identity, adds encoder acceleration and lets the hub recognise it by its port name.
- version: v0.1
  date: 2026-11-07
  url: https://github.com/zvenson/vibe-link/releases/tag/v0.1
