device: m-vave-fm-1
name: Viber
summary: >-
  Six-track groovebox for the FM-1 derived from Skiff and Felucca, adding a wavetable engine, a two-page clips mode, round knob displays and a master level meter.
description: >-
  Viber keeps Skiff's fourteen synth and drum engines, 64-step sequencer, pattern pool and browser editor, and adds a wavetable engine (WAVE) with eight tables of sixteen single-cycle frames, scanned with a TABLE control and drawn on the screen as a 3D stack. A clips mode under SEQ shows each track's clips at double width over two pages and launches them one at a time or a whole column at once. Each page shows its four settings as round knobs, and a master VU meter sits in the header. It is not a GitHub fork: the repository starts from Skiff's tree and much of the README and the licensing file are still Skiff's text, including pages for the SMK-37 Pro. A build for the SMK-37 Pro can be compiled from the source with BOARD=smk37, but the releases ship only the FM-1 package.
status: active
