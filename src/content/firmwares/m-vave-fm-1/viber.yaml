license: GPL-3.0-only
license_notes: >-
  LICENSE is GPL-3.0-only, as the README badge states. Ported DSP, fonts and the Apache-2.0 SDK files keep their own licences (LICENSES/). The bundled instrument samples are CC0 (Versilian Studios VSCO-2 CE and VCSL), as fmhub.json states.
homepage: https://ant25fr.github.io/viber/
based_on: m-vave-fm-1/skiff
distribution: browser-installer
install_notes: >-
  Use the web installer on the project site in Chrome or Edge with the FM-1 on USB, or install viber-1.1.fwsc from the release with tools/fm1_install.py. The README says the installer also brings the official firmware back, taking a backup first, and that an install that is cut off resumes when the installer is run again. The README's install text is still Skiff's, so the Skiff installer it links is not Viber's.
