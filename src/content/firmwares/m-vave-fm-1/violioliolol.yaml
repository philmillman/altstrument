source_status: open
license: MIT
license_notes: >-
  Stated in the README ("MIT licence") and in the SPDX header of the release workflow; the repository has no LICENSE
  file. Built on fm1-base and felucca-bsp, which are pinned as the base/ submodule and keep their own licences. No
  M-VAVE stock image is bundled.
homepage: https://profikid.github.io/fm1-violioliolol/
distribution: browser-installer
requires_stock: M-VAVE stock firmware or another Felucca / fm1-base build
install_notes: >-
  The README gives a web installer on the project site (Chrome or Edge over USB) and says to download the .fwsc from
  the latest release for the Firmware Hub or fm1-base's tools/fm1_install.py. No GitHub release exists yet, since the
  workflow run for the v0.1 tag failed, so check the site or the releases page for a package; the source builds with
  sh build.sh and the JieLi toolchain. The README says the firmware does not touch the bootloader or the recovery path,
  that the stock firmware can be reinstalled the usual way, and that the installer offers the open m-bootloader as a
  separate opt-in box. docs/benchmark-procedure.md asks installers to measure CPU load and polyphony.
brick_risk: false
