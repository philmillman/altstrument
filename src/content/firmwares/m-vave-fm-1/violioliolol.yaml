device: m-vave-fm-1
name: fm1-violioliolol
summary: >-
  Physical-modelling string instrument for the FM-1 with no samples: 19 plucked and bowed instruments in four
  families, up to 12 voices, modal bodies and 16 user presets.
description: >-
  Every note is a vibrating string computed in real time. The 19 instruments cover finger, pick, slap, fretless and
  upright bass; nylon, steel, clean, driven and jazz guitar; violin, viola, cello and contrabass; and harp, mandolin,
  banjo, koto and zither. Plucked strings use extended Karplus-Strong waveguides with stiffness, pluck position, pickup
  position, buzz and five excitation styles. Bowed strings use a stick-slip waveguide with bow pressure, speed and
  position, and vibrato. A modal body is shared by all voices, followed by tone, drive and a limiter. Keys give velocity
  and pressure; MIDI covers pitch bend, mod wheel, volume, expression, sustain, pressure, the knobs on CC16-23 and
  program change. The 16 user presets store model parameters, not audio. Built on charlesvestal's fm1-base, with
  Felucca's board support code underneath. The README calls it experimental: it builds and passes the base's checks, but
  nothing has been verified on a physical FM-1, CPU load and polyphony on the unit are unmeasured, and the default
  polyphony of 8 is described as a guess. The project site has a browser emulator, a manual and a web installer.
