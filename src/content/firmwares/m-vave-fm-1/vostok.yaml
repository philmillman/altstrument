device: m-vave-fm-1
also_devices:
  - m-vave-smk-37
name: Vostok
kind: firmware
summary: >-
  Felucca-based firmware for the FM-1 and SMK-37 that adds a VOSTOK sound engine with 68 factory sounds, a Soviet space-programme theme, a pseudo-Cyrillic interface and a browser emulator.
description: >-
  Vostok builds from one source tree for both devices. It adds a VOSTOK engine (eng_vostok.c) aimed at minimal wave, coldwave, post-punk and darkwave sounds on the 6-operator FM voice, with 68 factory sounds. The interface is German or English and draws some Latin capitals as Cyrillic look-alikes, with a VOSTOK colour palette and a start screen. The SMK-37 build uses the porting kit's pad and fader layout, with four tracks, a 16-pad sequencer and extra SPUR and CHORD keys. The handbook is in German, English and Russian. The README's status table lists the baseline FM-1 build, missions and a broadcast studio as open. The repository has no release, and the project site hosts a browser emulator.
status: active
