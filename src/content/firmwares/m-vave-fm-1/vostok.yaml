source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL-3.0 text and the README says GPL-3.0-only, as Felucca. LICENSING.md and LICENSES/ keep the licences of the parts it carries: Felucca-Engines, Rings and DaisySP (MIT), msfa (Apache-2.0) and the OFL fonts.
homepage: https://g0rst.github.io/VostockFM-1/
based_on: m-vave-fm-1/felucca
distribution: source-only
install_notes: >-
  Build it with build.sh, which needs the JieLi toolchain, Docker on macOS, the AC79 SDK and a clone with submodules (BUILDING.md); BOARD=smk37 selects the SMK-37, with MODEL=elite or mke for the other models. The README says to make a full flash backup of an SMK-37 first and never to write its protected ranges, which hold calibration and keys, and that the way back to the stock firmware stays open. The browser emulator needs no install.
