license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for Dinghy and for the Wanderer app, with the platform code from Felucca, SLOOP
  and OberVave under their notices. Atkinson Hyperlegible Bold and Terminus are SIL OFL 1.1. The release file and the
  repository do not include M-VAVE firmware.
homepage: https://www.lowvisionmusic.info
distribution: download
requires_stock: M-VAVE FM-1 V15 or SLOOP (the routes the author tested)
install_notes: >-
  Download LVM-Wanderer-1.4-RC6-FM1.fwsc, or Wanderer-1.4-Release.zip with the installer, and write the package with the
  bundled tools/fm1_install.py (Python with mido and python-rtmidi) over a USB data cable. The install guide says to
  back up your work first, and it explains returning to V15 with your own original file and the OCT- rescue mode. The
  release lists a SHA-256 for the file. The source bundle carries a 0.9 rollback package.
brick_risk: false
