requires_stock: M-VAVE FM-1 V15 or SLOOP (the routes the author tested)
install_notes: >-
  Download LVM-Wanderer-0.9-FM1.fwsc, or the testing bundle with the installer, and write it with the bundled
  tools/fm1_install.py (Python with mido and python-rtmidi) over a USB data cable. The README says to back up your
  work, keep a known-working recovery package and install at your own risk. The release lists a SHA-256 for the file.
