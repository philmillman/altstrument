device: m-vave-fm-1
name: Wanderer
summary: >-
  Sixteen-step event-memory synth built for low vision: capture a phrase, protect it as an Anchor and evolve a copy
  with Melt, Drift and Decay, with 100 sounds, large symbols and audible cues.
description: >-
  A four-voice event-memory synth on the Dinghy platform, with its own storage. A phrase of note and velocity events is
  captured, the first one is kept as an immutable Anchor, and a working copy changes through Melt (timbre), Drift
  (bounded pitch variation) and Decay (velocity ageing); a second phrase can be layered and a variation committed as a
  branch. Version 1.4 has 100 sounds with a four-pole low-pass, chorus, delay and reverb, a Scatter page with eight modes
  (Size, Amount and Smooth shape the result before the effects), and an arpeggiator with 13 patterns, 12 rates, gate,
  swing, latch and octave range that follows USB or TRS clock and can record its notes into Memory or Layer. Print renders
  an evolving phrase to RAM audio with undo and redo; it is not saved. The screen uses large symbols, fixed positions and an
  adaptive or steady Zoom that HOME and EDIT toggle, with a display-hold time and optional audio cues. The 1.4 notes
  say the author, a visually impaired musician behind Low Vision Music, ran their standard physical tests on this exact
  build on 2 November 2026, and an earlier 1.2 RC2 was installed from V15 and from SLOOP and taken back to both. New saves
  use project format v8; older Wanderer projects import without overwriting their slots. The engine is 6 dB louder than 1.3, so start with the master lower. The README also announces 1.7 RC4, which
  is not yet a GitHub release.
