device: m-vave-fm-1
name: Wanderer
summary: >-
  Sixteen-step event-memory synth built for low vision: capture a phrase, protect it as an Anchor and evolve a copy
  with Melt, Drift and Decay, with 100 sounds, large symbols and audible cues.
description: >-
  A new app on the Dinghy platform, with its own storage. A phrase of note and velocity events is captured, the
  first one is kept as an immutable Anchor, and a working copy changes through Melt (timbre), Drift (bounded pitch
  variation) and Decay (velocity ageing); a second phrase can be layered and a variation committed as a branch.
  It is a four-voice synth with 100 patches in ten banks of ten, band-limited wavetable oscillators, chorus, tempo
  delay and reverb. The screen shows the one word Wanderer, large symbols, fixed positions and a zoom setting, and
  actions have short tones; the README says the screen is still needed for full information. One slot can be saved
  while stopped, and old SLOOP projects are not imported. It records note events, not audio. The author, a visually
  impaired musician behind Low Vision Music, reports installing it on their FM-1 from V15 and from SLOOP and going
  back to V15 and to SLOOP. This is a work-in-progress pre-release.
