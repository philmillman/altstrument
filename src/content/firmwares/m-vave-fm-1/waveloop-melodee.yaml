distribution: source-only
install_notes: >-
  Build the branch (BUILDING.md) and install with the Melodee tools. The fork's GitHub Pages site is a web installer, but the
  package it offers is a Melodee 1.4.1 file, and the README does not say that it contains this branch. Melodee's
  boot protection and Return to official V15 route apply. Installing is at your own risk.
