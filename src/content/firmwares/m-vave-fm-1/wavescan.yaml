device: m-vave-fm-1
name: WAVESCAN
summary: >-
  8-voice wavetable synth after the PPG Wave 2.2 and 2.3, with 20 original wavetables of 64 waves, STEP and SMOOTH wave
  modes, a 24 dB resonant filter, three envelopes, an LFO and a stereo delay.
description: >-
  Each voice has two oscillators reading a wavetable of 64 waves, with the second one offset in semitones and cents. The
  wave mode is either stepped, with jumps and aliasing in the manner of the 2.2, or smooth, with blended waves in the
  manner of the 2.3. Three envelopes drive the filter, the volume and the wave position, pitch or wave A, and the page
  shows the table as a 3D cascade with the playing position. There are eight factory and eight user presets and 40
  parameters on CC 20 to 59. The README (in French) says the tables are original, computed by a script in the
  repository rather than copied from PPG ROMs, and that the project is independent of Waldorf, PPG and M-VAVE. It is
  built on konsumer's foma framework.
