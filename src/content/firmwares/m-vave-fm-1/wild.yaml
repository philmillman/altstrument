  url: https://github.com/Saintpid/Wild/commit/0800696229eaa76f51a8344a29a9671c1aced7ae
  notes: No tagged releases; this is the latest commit, version 0.3.49. Every track now counts its place from one shared origin, so tracks of the same length no longer drift apart, and a new Banks page on EDIT adds Sync, which keeps track 1 playing through a bank change, and Switch, which waits for the next phrase round. Drum pattern length can be set as a percentage.
