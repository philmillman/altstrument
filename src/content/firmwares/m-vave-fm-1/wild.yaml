  notes: No tagged releases; this is the latest commit, version 0.3.34. Since 0.3.30, which accepts the UC25HQ80 flash chip of newer FM-1s alongside the Puya part, it removes a click on the 303 line with any drive, limits the workspace to eight banks with explicit copy and a bounded undo journal (songs using banks 9 to 12 are refused until reorganised in 0.3.29), adds copy, delete and erase-all on the song list, and adds a Rumble drum sound.
