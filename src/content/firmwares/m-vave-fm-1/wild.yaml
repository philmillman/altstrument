  notes: No tagged releases; this is the latest commit, version 0.3.37, where drum pattern fill and reduction are set as percentages. Version 0.3.35 lengthens the Rumble drum's choke fade and ducks it under the kick so cutting it off no longer clicks. Version 0.3.30 accepts the UC25HQ80 flash chip of newer FM-1s alongside the Puya part. The workspace holds eight banks with explicit copy and a bounded undo journal (songs using banks 9 to 12 are refused until reorganised in 0.3.29), and the song list has copy, delete and erase-all.