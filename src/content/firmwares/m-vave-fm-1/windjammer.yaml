    notes: Adds a remote UI profile in which a compatible app draws the screens and LEDs while Windjammer sends the panel input; FM-1 Instrument 0.8.0 uses it, and native Skiff-style sessions still work. The notes say the release passed automated firmware checks and physical-device acceptance is pending.
