homepage: https://github.com/davidpryan/witchbox
distribution: source-only
install_notes: >-
  No release yet; a version tag vX.Y makes the CI publish one with the .fwsc attached. To build, run ./build.sh with JieLi's toolchain (Docker on
  macOS and Windows) and three AC79 SDK files fetched by the tools, then install with tools/fm1_install.py over USB, which asks before writing.
  The README tells you to read docs/PLATFORM-RULES.md first and says flashing is at your own risk.
