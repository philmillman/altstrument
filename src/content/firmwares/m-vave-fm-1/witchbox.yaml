device: m-vave-fm-1
name: WitchBox
summary: >-
  Six-track groovebox for Burial-style 2-step and melodic dubstep: ghost-vocal chop sampler, sub, pads, FM keys and
  drums run through a dust, tape, echo and plate chain, with pattern generators and one-button song writing.
description: >-
  Tracks are GHOST (a three-second tape sliced into 16 chops, plus a formant singer), SUB, PADS, KEYS (4-operator FM),
  DRUMS (an eight-lane 2-step kit) and WEATHER (rain, crackle and a drone). Each track and drum lane drifts slowly, and
  a 2-step swing template, late-snare control and hand-placed micro timing keep the drums off the grid while the first-beat kick stays
  anchored for MIDI clock. A FEEL switch moves between 2-step and half-time. The fixed master chain runs
  dust, tape, echo, plate reverb, kick-keyed ducking and glue compression. Generators write patterns per
  track (a chord walk, Markov vocal phrases, a Turing machine, Euclidean hits, mutation), a 6x6 grid lets a firing
  track trigger or mute others, and SUMMON writes a whole piece in a chosen mood. The README says it builds,
  renders audio on a host simulator and builds in CI, but has not yet been run on an FM-1. It uses Dinghy's platform
  layer, which is Felucca and SLOOP based.
