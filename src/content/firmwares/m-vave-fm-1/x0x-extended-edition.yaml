device: m-vave-fm-1
name: X0X Extended Edition (Acultur8)
summary: >-
  Experimental fork of Charles Vestal's X0X with sequence copy and paste, arrangement blocks, slice playback in a
  browser emulator, a MIDI CC map and straight-time and triplet rate overrides.
description: >-
  The prerelease firmware builds add one-to-32-bar blocks with undo, copy and paste of sequences between drum rows and the
  two 303s, a RAM query command for inspecting unsaved patterns, a searchable MIDI implementation chart with CC readback,
  and a global straight-rate policy with per-sound triplet overrides. The 0.1.60 build, titled Acultur8 FM-1 Kick, adds hybrid 808 kick shaping and native preset store and recall. A browser emulator runs the X0X engine compiled to
  WebAssembly and plays imported WAV slice banks with marker files at the sequencer tempo without changing pitch. The
  releases are labelled experimental, each with known-issues and rollback notes; the notes report checks on one unit and
  list advanced remote-action and Reason clock-sync checks as open. Recorded loops and the optional REX decoder are not
  distributed. The default branch is acultur8/main.
status: active
authors:
- name: keyboy250
  url: https://github.com/keyboy250
source: https://github.com/keyboy250/fm1-x0x-acultur8
source_status: open
license: GPL-3.0-only
license_notes: >-
  Inherited from X0X (LICENSING.md); Open303 and bundled fonts keep their own licences. The README says recorded loops
  belong to their owners and are not covered.
homepage: https://keyboy250.github.io/fm1-x0x-acultur8/
distribution: download
install_notes: >-
  Download the .fwsc and installer script from a release and install with fm1_install.py (Python 3, mido, python-rtmidi);
  the expected identity is FM-1_9000xxx. Back up projects first and keep the prior firmware for rollback; the release notes say
  saves made with newer builds need compatible firmware.
brick_risk: false
tags: [drums, synth-engine, sequencer, midi, emulator, sampler, fork]
