device: m-vave-fm-1
name: X0X
summary: >-
  ReBirth-style groovebox: TR-909, TR-808, two TB-303s with an acid line generator and a breakbeat player
  playing together, with song mode, shared reverb and tape delay, master compressor.
status: active
authors:
- name: Charles Vestal
  url: https://github.com/charlesvestal
source: https://github.com/charlesvestal/fm1-x0x
source_status: open
license: GPL-3.0-only
license_notes: >-
  Open303 is MIT; some 909 samples come from ER-99 (GPL-3.0). Recorded breaks are not covered by the project
  licence.
homepage: https://charlesvestal.github.io/fm1-x0x/install/
distribution: browser-installer
install_notes: >-
  Browser WebMIDI installer; it also offers a restore to stock firmware, and since 1.2.0 it takes V16 as well as V15. Manual and browser emulator on
  the same site.
brick_risk: true
tags: [drums, synth-engine, sequencer, fx, usb-audio, performance]
video:
  url: https://www.youtube.com/watch?v=cZLYrZaLDUk
  title: "m-vave fm-1 x0x firmware higher state of consciousness"
  credit: "Charles Vestal"
  first_party: true
  found_via: https://github.com/charlesvestal/fm1-x0x
versions:
- version: 1.2.0
  date: 2026-11-01
  url: https://github.com/charlesvestal/fm1-x0x/releases/tag/v1.2.0
  notes: Adds tap tempo (hold HOME and tap SEQ), MIDI CC in for the knobs with a fixed map and optional CC out (GLO > CC OUT), ROOM, a new reverb that replaces the old one, and a PING WIDTH setting for ping-pong delay. The installer now takes V16 as well as V15, and releases are built and attested on GitHub.
- version: 1.1.0
  date: 2026-10-15
  url: https://github.com/charlesvestal/fm1-x0x/releases/tag/v1.1.0
  notes: Adds screen reader support through a browser page that reads out the FM-1's screen.
- version: 1.0.9
  date: 2026-10-15
  url: https://github.com/charlesvestal/fm1-x0x/releases/tag/v1.0.9
  notes: Adds a backup page for projects and a filter on the break.
- version: 1.0.8
  date: 2026-10-14
  url: https://github.com/charlesvestal/fm1-x0x/releases/tag/v1.0.8
  notes: Holding ENV while turning a knob resets it, and safe mode can reach update mode.
- version: 1.0.7
  date: 2026-10-14
  url: https://github.com/charlesvestal/fm1-x0x/releases/tag/v1.0.7
  notes: A setting to turn the second core on or off, and a higher processor supply voltage at start.
- version: 1.0.6
  date: 2026-10-11
  url: https://github.com/charlesvestal/fm1-x0x/releases/tag/v1.0.6
  notes: FREE PLAY, song from the SONG screen, USB audio.
