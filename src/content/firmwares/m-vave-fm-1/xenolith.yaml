source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README and app/THIRD_PARTY.md call the combined instrument GPL-3.0-or-later, taking the later-version option of the SuperCollider-derived LFNoise2 code (GPL-2.0-or-later); the LICENSE file is the GPL-3.0 text. Wrapper files from
  Charles Vestal's template stay MPL-2.0, the VT323 font is SIL OFL 1.1 and three packaging files come from JieLi's Apache-2.0 SDK.
based_on: m-vave-fm-1/fm1-base
distribution: download
install_notes: >-
  Download XENOLITH1.fwsc, or on Windows the updater ZIP, which needs Python 3.12 and its py launcher and runs Setup updater.bat once and then Update.bat. It asks before writing and resumes if stopped in update mode. The installer does not
  include M-VAVE's rescue tools, and INSTALL.md points to the Firmware Hub's rescue page. Other firmware may erase saved patches.
brick_risk: false
