device: m-vave-fm-1
name: XENOLITH
summary: >-
  Experimental cell-based FM synthesizer with up to 64 paired oscillator cells joined in parallel, serial, branching and feedback routings, up to eight-note paraphony, sequencing, a multimode filter and a stereo reverb.
description: >-
  Cells are connected by the player, with a choice of FM laws, modulation generators, a sequencer, MIDI note and clock input, a multimode filter, a VCA, a wavefolder, sample-rate and bit-depth reduction and a reverb. A load model
  mimics voltage sag and shrinks resource use under stress, and a screen-reader dictionary is kept in the repository. The synthesis comes from the author's own SuperCollider design, built on fm1-base. The repository includes
  the firmware package, a Windows updater with its checksums, a build adapter and a long operator's manual, and says the bundled package was rebuilt byte for byte from the exported source. The README says the newer UC25HQ80 flash chip is recognised
  but untested, and that no Firmware Hub listing is claimed.
status: active
