versions:
- version: 1.2.0
  date: 2026-10-30
  url: https://github.com/KotMorderca/XMOD/releases/tag/v1.2.0
  notes: >-
    The built-in xmod-theme plays on the first start after an install, and later starts load the last song, stopped.
    Held keys now play chords on the song's free channels, and MIDI in is polyphonic. Fixes songs with a row break past
    row 63 looping in one pattern and a BAD SONG IMAGE message after another firmware left songs in flash. Song space is
    604 KB, down from 608 KB, so the last 4 KB can keep the last played song.
- version: 1.1.0
  date: 2026-10-29
  url: https://github.com/KotMorderca/XMOD/releases/tag/v1.1.0
  notes: >-
    Song space grows to 608 KB, the song manager gains Reconnect and Refresh buttons, the encoder scrolls the mixer's
    channel window, and a volume overflow at full volume with hard panning is fixed.
- version: 1.0.0
  date: 2026-10-28
  url: https://github.com/KotMorderca/XMOD/releases/tag/v1.0.0
  notes: First release; the release page has no notes beyond the changelog link.
