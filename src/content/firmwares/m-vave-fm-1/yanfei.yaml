device: m-vave-fm-1
name: Yanfei
summary: >-
  Felucca fork with twelve engines and 96 factory presets, including NES, Game Boy, PSG, YM and wavetable engines,
  and a four-track tracker with phrases, chains and song sections.
description: >-
  The engines are ANALOG, NES, DMG, PSG, TRIO, FM6, YM, WAVE, PHASE, STRING, MODAL and DRUM, with eight presets each. The
  tracker opens in an ALL view of four tracks and switches to a detailed PHRASE view, with sections of up to four bars,
  shared phrases, chains, per-row instruments and repeat or wait per track. The docs keep the firmware budgets and a
  waveform review for the engines. A website offers a web editor, a browser emulator, an installer and illustrated
  guides. The package keeps the FM-1 update identity the installer needs, and the README says the fork was developed
  with AI coding assistance.
