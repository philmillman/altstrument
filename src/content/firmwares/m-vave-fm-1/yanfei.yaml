homepage: https://izumoe.github.io/yanfei/
distribution: browser-installer
install_notes: >-
  Installer on the project website in Chrome or Edge over USB, or build with ./build-yanfei.sh and install
  build/yanfei.fwsc. As with Felucca, go back to M-VAVE's firmware with its updater.
