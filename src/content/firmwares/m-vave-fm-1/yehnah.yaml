homepage: https://mello-d.github.io/yehnah/
based_on: m-vave-fm-1/jiant
distribution: browser-installer
requires_stock: M-VAVE V15, or JIANT FM or Yehnah already installed
install_notes: >-
  Browser installer in Chrome or Edge, or tools/fm1_install.py offline. The installer backs up the unit first and its
  Return to official V15 option goes back to stock. The README says to return to official V15 before moving from another
  custom firmware, because writing straight over one has bricked an FM-1, and the installer writes only over V15 or
  Yehnah. If the unit stays black after an interrupted update, it appears as WL80UBOOT (USB 4C4A:8057), the chip's boot
  mode, and running the installer again recovers it; FM-1 Transporter with an RP2040 is the fallback. Holding REC at
  power-on starts one-core mode. Installing is at your own risk.
brick_risk: false
