device: m-vave-fm-1
name: Yehnah
summary: >-
  Six-track synth, drum machine and song sequencer with 25 synthesis engines, one-key chord layouts, generative IDEAS, a
  browser installer and editor, and an emulator that runs the firmware in the browser.
description: >-
  Yehnah has six tracks (four by default) sharing a budget of eight voices, over 700 factory sounds and 32 user presets in
  one list, and no samples. The engines include analog, FM6, phase, lo-fi, voice, a Minimoog model, a Plaits port and
  several drum machines with two morphable sides. The sequencer has 64 steps per track with chords, parameter locks,
  ratchets and probability, and songs are built from sections and scenes. One-key chord pages play like an Omnichord or a
  guitar. SWARM, TRACE and XYZ move parameters from dots on screen, and IDEAS writes a pattern, sound, LFO, effect or
  texture for the selected track. USB carries MIDI, stereo audio, eight-channel stems and audio in. The README describes
  it as a development release, tested on a real FM-1 from official V15 and from JIANT FM. It is built on JIANT FM and
  credits many other FM-1 projects. The author says the code, tests and documentation are developed with AI agents.
