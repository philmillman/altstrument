device: m-vave-fm-1
name: ZENITH-1
summary: >-
  Generative ambient firmware built on AMB-1 that plays itself on power-up: breathing pads, tape-loop bells, bass, Euclidean percussion and air, travelling through eight worlds, with an FX menu on the keys and moving full-screen pictures.
description: >-
  ZENITH-1 keeps AMB-1's engine and controls and extends them. Pads bloom and fade on cycles of unequal length, bells play from tape loops of 13, 17, 23 and 29 beats, and a gliding bass, soft Euclidean percussion, a texture of air and an occasional lead voice sit around them. Everything runs through a tape echo, a long tape loop and a plate reverb. Left alone, it moves through the parts of a world, from era to era with new loops, sounds and key, and from one of eight worlds into another. An FX menu puts 27 effects on the keys, and they can also play by themselves; the keys can also strum the chord or play the lead. The Garden page shows the state of the music, and full-screen pictures change shape and colour with it. The journey, FX menu and picture follow the design of HADAL-1. A manual, a browser emulator and an install page come with it.
status: active
