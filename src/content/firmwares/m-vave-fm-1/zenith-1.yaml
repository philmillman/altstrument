source_status: open
license: MPL-2.0
license_notes: >-
  The LICENSE file is the MPL-2.0 text and LICENSING.md says MPL-2.0 file by file. Files that came from AMB-1 keep Charles Vestal's copyright line. The base/ platform is fm1-base and felucca-bsp, both MPL-2.0, and the fonts are SIL OFL 1.1. The tree commits m-bootloader 1.2's installer package (base/web/m-bootloader/fm1-uboot-1.2.fwsc, MIT).
homepage: https://sparky480v.github.io/zenith-1/install/
based_on: m-vave-fm-1/amb-1
distribution: browser-installer
requires_stock: Any FM-1 firmware
install_notes: >-
  Open the install page in Chrome or Edge with the FM-1 on a USB data cable and press Install, or build the package with build.sh from BUILDING.md; the release also carries zenith-1.0.fwsc. The manual says that "Back to the stock firmware" at the bottom of the install page returns the FM-1 to M-VAVE's firmware, that the FM-1 starts in a safe mode the installer can reach if the firmware fails to start twice, and that update mode opens with OCT- and OCT+ held for 5 seconds. The m-bootloader that the manual mentions is an optional extra of the installer.
