device: m-vave-fm-1
name: ZEUS-80
summary: >-
  8-voice analog-style polysynth module after the Roland MKS-80, with UPPER and LOWER sections, 64 tones and 64 patches,
  a 14-mode arpeggiator and a 6-track step sequencer.
description: >-
  Eight voice modules each have two oscillators, a high-pass and a 24 dB resonant low-pass filter, a VCA and two ADSR
  envelopes. The keyboard works in WHOLE, DUAL or SPLIT mode, with solo, unison and poly assignment, glide and hold. Tones
  have 47 parameters in 12 groups, are numbered 11 to 88 by bank and number as on the original, and are edited on a
  16-character LCD copy with the stored and changed values side by side. The arpeggiator and sequencer are those of the
  author's LAX-32. The README (in French) says no sample or original data is used, that the 64 tones were made for this
  firmware and that the project is independent of Roland and M-VAVE. It is built on konsumer's foma framework.
