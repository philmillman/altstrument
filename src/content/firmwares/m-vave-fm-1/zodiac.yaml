based_on: m-vave-fm-1/fm1-base
distribution: browser-installer
install_notes: >-
  The project's install page, linked from the homepage, works in Chrome or Edge with the FM-1 on USB, and the
  same page puts M-VAVE's own firmware back. The release also carries the .fwsc package. The README warns that
  Zodiac replaces the firmware while it is installed and is an early version offered with no warranty. Installing
  is at your own risk.
