device: m-vave-fm-1
name: Zodiac
summary: >-
  Self-playing ambient firmware with twelve zodiac signs, each a moving picture and a piece of music that changes by
  itself, with a browser installer and emulator.
description: >-
  Switch it on and it plays. Each of the twelve signs has its own picture and its own piece: horns for Aries, cellos
  for Taurus, two harpsichord hands for Gemini, a violin for Cancer, a march for Leo, a hurdy-gurdy jig for Virgo,
  floating violins for Libra, deep slow notes for Scorpio, a heroic theme for Sagittarius, alpine horns for Capricorn,
  falling bells for Aquarius and a torrent for Pisces. The tempo drifts and most pieces move between three and four
  beats in the bar. No numbers are shown; the picture is the readout. OCT- starts and stops the music, MASTER is the
  volume and ALGORITHM turns through the tips on the screen. After 30 minutes a sign hands over to the next. PRESETS
  steps through the signs, SELECT turns a wheel of their symbols, the twelve buttons FX to REC are the signs in order,
  and MIDI program changes 0 to 11 choose one. The bottom left button, or any MIDI note, sets off the sign's own event
  in the music and the picture together. The four knobs are low pass, high pass, echo and reverb, and the lower
  buttons hold performance effects such as Echo, Dub, Repeat, Roll, Gate, Tape stop, Drive, Crush, Phaser and Freeze.
  The pictures were made with an image-generating model and then chosen and converted by hand, and the music is
  written as code with nothing sampled. The README says the image was built once for the FM-1 and fits with about
  12 KB of memory to spare, and that it has not been run on an FM-1, so the processor load is not measured.
