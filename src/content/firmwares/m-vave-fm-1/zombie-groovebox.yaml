device: m-vave-fm-1
name: Zombie Groovebox
summary: >-
  FM-1 groovebox firmware from the Zombie Core project: five synth tracks plus a 16-sound drum kit, eight engines
  including user WAV samples, 128 presets, up to 64 steps per track, and DAW modes.
description: >-
  Part of Zombie Core, an FM-1 firmware project with Russian and English labels. Each of the five synth tracks picks
  from eight engines (analog, FM, phase, wavetable, noise, percussion and SAMPLE, which plays WAVs sent to slots
  USR1 to USR4), with filter, envelope, LFO, drive, delay, reverb and arpeggiator. The presets come in Factory, IDM
  and ZMB banks. The sequencer offers chords, scale and root, held-step editing with the knobs, Euclid and beat
  generators and eight-step undo; each drum sound has its own loop length and per-step chance, velocity and roll.
  It also has count-in live recording, USB MIDI in and out, MIDI clock out, DAW modes, a SYSTEM tab and four
  screensavers. A browser editor adds a mouse piano roll and sample loading, and an emulator runs the same C code.
  The project dropped its separate Sampler edition on 2026-11-01; the sample engine stays in Groovebox. The README
  says releases are tested in the emulator and by the automated test suite, and are not tried on a physical FM-1
  before publishing.
status: active
authors:
- name: Joolo09
  url: https://github.com/Joolo09
source: https://github.com/Joolo09/zombie-fm1-web
source_status: open
license: MIT
license_notes: >-
  Application, DSP, UI and DAW profiles are MIT; the hardware, boot and update platform is MPL-2.0 (derived from
  fm1-base and felucca-bsp, with Leo Kuroshita's and Charles Vestal's notices). The repository's source folder holds
  the code, and per-release source archives are in downloads.
homepage: https://joolo09.github.io/zombie-fm1-web/
distribution: browser-installer
install_notes: >-
  Open the project page in Chrome or Edge, connect the FM-1 with a USB data cable, find it and install. Export projects
  as JSON in the editor first. If writing stops and the screen is black, the unit is in loader mode: reload the page
  and install again. No stock-return tool is documented, and the README suggests trying a new version in the emulator
  first.
brick_risk: true
tags: [synth-engine, sequencer, drums, sampler, performance, midi, editor, emulator]
