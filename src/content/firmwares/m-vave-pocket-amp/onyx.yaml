device: m-vave-pocket-amp
name: Onyx
summary: >-
  Open firmware for the Pocket AMP with eight reorderable effect slots, a NAM A2-Lite amp capture player, cabinet
  IR loading, a tuner, a drum machine and a browser editor and installer.
description: >-
  Rights warning: the .fwsc files in the repository and its releases are assembled by a packer that needs the stock
  Pocket AMP package as a template for the container, so they probably carry M-VAVE's container header and update
  loader. NOTICE.md says no stock firmware or vendor tools are included.

  The chain defaults to dynamics, drive, amp, cabinet, EQ, modulation, delay and reverb, and its eight slots can be
  reordered and bypassed. The amp slot runs Neural Amp Modeler A2-Lite captures loaded by the user, the cabinet
  slot convolves impulse responses of up to 2048 taps, and the other blocks have several models each. Also included
  are a chromatic tuner, 80 presets, a performance bank mode, a built-in drum machine with 49 rhythm patterns and
  a kit generated by the project, Bluetooth LE MIDI through an unmodified Optimist stack, USB MIDI and SysEx, and a
  desktop emulator. A single HTML page edits patches, loads captures and IRs, and installs, verifies or removes the
  firmware over Web MIDI. The README says the clock budget still needs device measurement and that A2 full models
  and Bluetooth audio are not supported. The project states that it was written with AI assistance.
status: active
authors:
- name: 28spawn
  url: https://github.com/28spawn
source: https://github.com/28spawn/m-vave-pocket-amp-onyx
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README and NOTICE.md state GPL-3.0-or-later. The Bluetooth LE stack in third_party/optimist_ble is Optimist's
  (GPL-3.0-only OR MPL-2.0, taken under MPL-2.0) with marked changes, and its radio start-up tables are Apache-2.0.
  Test audio in the emulator is adapted from GuitarSet (CC-BY-4.0). The repository holds 40 factory preset baselines
  as plain numbers, which NOTICE.md says can be removed if a rights holder objects.
homepage: https://github.com/28spawn/m-vave-pocket-amp-onyx
distribution: download
requires_stock: The official Pocket AMP firmware
install_notes: >-
  Open Onyx_Web_Editor.html from the release in Chrome or Edge with the unit on USB and use Install; the running
  firmware checks the package and writes the app partition. The same page restores the stock firmware and verifies
  flash. HOME and PARA held for two seconds enter the ROM download mode, and RECOVERY.md describes rescue with a USB
  dongle. Back up first and follow TEST-PROTOCOL.md; flashing is at your own risk.
brick_risk: true
