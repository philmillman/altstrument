  url: https://github.com/28spawn
source: https://github.com/28spawn/Pocket-Onyx
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSING.md state GPL-3.0-only and LICENSE is the GPL version 3 text. The Bluetooth stack from
  Optimist is GPL-3.0-only OR MPL-2.0 with marked changes, the update loader and OTA session code are MPL-2.0 from
  Pendel's pendel-bsp, and the JieLi SDK configuration headers are Apache-2.0. NOTICE.md says the release package is
  built from scratch and holds no M-VAVE firmware, and that the vendor files are fetched at build time and not stored.
homepage: https://github.com/28spawn/Pocket-Onyx
distribution: browser-installer
requires_stock: The official Pocket AMP firmware
install_notes: >-
  Open custom-fw/web/Onyx_Web_Editor.html in Chrome or Edge with the unit on USB, back up with Backup Device, choose the
  release .fwsc or .bin in the Firmware tab and press Install Firmware. The same page restores the official firmware from
  your own M-VAVE file. The README says the boot sectors and the hardware partition at 0x0BF000 are write-protected.
  Holding HOME and PARA for two seconds enters the mask-ROM download mode, and RECOVERY.md describes rescue with an
  RP2040 dongle if the unit will not boot. Installing is at your own risk.
brick_risk: false
