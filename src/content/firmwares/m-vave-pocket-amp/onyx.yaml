device: m-vave-pocket-amp
name: Onyx
summary: >-
  Open firmware for the Pocket AMP with eight reorderable effect slots, a Neural Amp Modeler A2-Lite amp stage,
  cabinet impulse responses, a tuner, a drum machine and a browser editor and installer.
description: >-
  The chain defaults to dynamics, drive, amp, cabinet, EQ, modulation, delay and reverb, and the eight slots can be
  reordered and bypassed from the front panel. The amp slot runs Neural Amp Modeler A2-Lite captures, the cabinet slot
  convolves impulse responses of up to 2048 taps, and the other blocks offer several models each. The firmware also has
  a chromatic tuner, 80 preset slots, a performance bank mode and a drum machine with 49 rhythm patterns on a
  synthesized kit. Stock amp and cabinet content is not shipped; the firmware reads it at run time from the unit's own
  flash partition and falls back to synthetic placeholders without it. A single HTML page installs the firmware, backs
  up and restores presets and verifies the flash over Web MIDI, and a desktop emulator and a WebAssembly workbench run
  the same audio engine. The release builds have Bluetooth LE switched off; a BLE-MIDI build needs a source build with
  a flag. This repository replaces the earlier 28spawn/m-vave-pocket-amp-onyx, whose pre-v1.0.5 releases the project
  says were removed. The README states that the code was written with AI assistance.
status: active
authors:
