device: m-vave-pocket-amp
name: pendel-bsp
kind: tool
summary: >-
  MPL-2.0 hardware layer for custom Pocket AMP firmware: a branch of felucca-bsp with the Pocket AMP's audio link,
  buttons, 240 by 240 screen and update loader. No sound code or user interface.
description: >-
  Keeps the chip layer of felucca-bsp (clock, interrupts, flash, USB, timers, boot entry) and adds the Pocket AMP's
  board folder: the full-duplex I2S audio link at 24 bits, the knob encoder, volume knob and battery inputs, six
  debounced buttons, the SPI display and backlight, and a loader that writes the app area only. A pa-hwtest example
  firmware exercises the screen, buttons, audio and USB serial. Pendel takes it as a submodule.
status: active
authors:
- name: Leo Kuroshita (@kurogedelic), Hügelton Instruments
  url: https://github.com/kurogedelic
source: https://github.com/hugelton/pendel-bsp
source_status: open
license: MPL-2.0
license_notes: >-
  Per file (LICENSING.md, NOTICE), as in felucca-bsp: change a file and distribute it and you publish that file, while
  code on top may use any licence.
homepage: https://github.com/hugelton/pendel-bsp
distribution: source-only
install_notes: >-
  A base to build on, not an end-user firmware. Building needs JieLi's pi32v2 toolchain on Linux. Flashing is at your
  own risk. Its loader writes the app area only, and the pa-hwtest README says two boots in a row that fail drop the
  unit into UBOOT and tells you to back up the whole flash first. Pendel, which uses it, can return the unit to the
  official file.
brick_risk: false
tags: [platform, sdk]
versions:
- version: main @ 0d2e875
  date: 2026-11-07
  url: https://github.com/hugelton/pendel-bsp/commit/0d2e8755210ce4b8f3e4607bd646c0cc1ca8bdcb
  notes: No tagged releases; this is the latest commit. Since the last sha it adds BLE and BR/EDR radio drivers taken from Optimist (two Apache-2.0 files from JieLi's SDK are noted in LICENSING), a radio self-calibration at start, a rescue tool that handles M-VAVE's V16 as well as V15, and USB changes.
