device: m-vave-pocket-amp
name: pendel-bsp
kind: tool
summary: >-
  MPL-2.0 hardware layer for custom Pocket AMP firmware: a branch of felucca-bsp with the Pocket AMP's audio link,
  buttons, 240 by 240 screen and update loader. No sound code or user interface.
description: >-
  Keeps the chip layer of felucca-bsp (clock, interrupts, flash, USB, timers, boot entry) and adds the Pocket AMP's
  board folder: the full-duplex I2S audio link at 24 bits, the knob encoder, volume knob and battery inputs, six
  debounced buttons, the SPI display and backlight, and a loader that writes the app area only. A pa-hwtest example
  firmware exercises the screen, buttons, audio and USB serial. Pendel takes it as a submodule.
status: active
