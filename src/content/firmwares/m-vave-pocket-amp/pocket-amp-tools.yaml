device: m-vave-pocket-amp
name: Pocket AMP Tools
kind: tool
summary: >-
  Desktop app for Windows, macOS and Linux that installs M-VAVE's official Pocket AMP firmware over USB MIDI and edits
  the pedal's presets live, with a preset backup before each update and a resume step for an interrupted one.
description: >-
  M-VAVE's own updater runs on Windows only. This Flutter app, called Pocket AMP Upgrader until v0.2.0, does the
  update on all three desktop systems with no drivers: it downloads the official .fwsc from M-VAVE's server, or opens
  one you already have, checks the package header, directory, CRCs and target chip, and accepts only the update loader
  whose hash matches the one in M-VAVE's V1.05 package. Before writing it saves all 80 presets and their EQ, because an
  update can overwrite some of them, and afterwards it writes back only the presets that changed and reads them back
  to check. A pedal left in update mode is detected and the update can be resumed from there. Since v0.2.0 the app
  also has a preset editor for the chain, each block's model and knobs and the EQ, with live changes heard on the
  pedal, a slot for your own cabinet impulse response in any of the 20 CAB slots, a list of backups that can be
  restored or edited by hand, an optional assistant that sends a preset to an OpenAI-compatible service you configure,
  and Bluetooth access on Linux. Clones of the Pocket AMP sold under other names, such as the Coolmusic PIXIE1, New Bee
  SK17 and Donner Pocket AMP, are accepted after a separate confirmation. The README says the editor, live editing and
  backups were tried on a real pedal under Linux, the IR upload and Bluetooth only against a simulated pedal, and that
  Windows and macOS have not been tried on hardware.
status: active
authors:
- name: vitoramaral10
  url: https://github.com/vitoramaral10
source: https://github.com/vitoramaral10/pocket-amp-tools
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL v3 text and the README says GPL-3.0-only. The update protocol follows M-VAVE's GPL-3.0
  FM1 Open browser updater. No firmware is committed or bundled: the app fetches M-VAVE's own file from M-VAVE's server.
homepage: https://vitoramaral10.github.io/pocket-amp-tools/
distribution: download
install_notes: >-
  Download the build for your system from the latest release: a zip for Windows or macOS (the macOS app is unsigned),
  or an AppImage or tarball for Linux. Close other MIDI apps, connect the charged pedal with a USB data cable, then
  download or open the firmware and start the update; it takes about two minutes and the pedal restarts twice. If it
  stops halfway, reconnect the pedal and use Resume update.
brick_risk: false
tags: [flasher, updater, desktop, backup, editor, midi]
