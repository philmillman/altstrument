homepage: https://doctorsolberg.github.io/better-smc-mixer/editor/
distribution: browser-installer
requires_stock: M-VAVE firmware V012 or V013
install_notes: >-
  Open the editor in Chrome on macOS, Windows or Android, connect the mixer over USB or Bluetooth and choose Install; keep the saved backup file private, since it holds the mixer's settings and Bluetooth pairings. After the write, switch the mixer off and on with its power switch. M-VAVE's own SincoOTA updater removes this firmware and its saved configuration, so save the configuration to a file first. The recovery notes describe the chip's ROM download mode as the last resort.
