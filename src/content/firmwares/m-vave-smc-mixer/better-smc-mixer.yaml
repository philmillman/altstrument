device: m-vave-smc-mixer
name: better-smc-mixer
summary: >-
  Alternative firmware for the SMC-Mixer that runs beside M-VAVE's own and turns its faders, encoders and buttons into a configurable MIDI controller, installed and edited from a browser page.
description: >-
  Gives the mixer four presets of four pages with eight strips each. Every fader, encoder and button can send control change, 14-bit control change, NRPN, RPN, notes, program change, aftertouch or pitch bend on its own channel, with a Shift layer for every control, fader pickup and scaling modes, and encoder acceleration and fine steps. USB MIDI and Bluetooth MIDI work at the same time. A Chrome page edits the configuration live over either link, learns assignments from an instrument and fills parameter lists from the MIDI Guide. The same page installs, updates and removes the firmware over USB or Bluetooth: it saves a 512 KB backup of the mixer's memory first, checks the memory layout and every file's checksum, writes the new image beside M-VAVE's and last switches start-up to it, and Go back switches start-up to M-VAVE's firmware again without a file. The author says installation, update and going back were verified on one retail mixer running M-VAVE V012 and V013, and releases are rebuilt from source and compared byte for byte. The repository documents the ROM download-mode recovery that uses an RP2040 board.
status: active
