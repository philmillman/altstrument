device: m-vave-smc-pad
name: SMC-Pad Core
summary: Clean-slate MIDI controller firmware for the SMC-PAD with USB and BLE MIDI, baseline drift tracking, velocity curves, banks and presets, a note repeat engine and a WebMIDI configurator.
description: >-
  A rewrite that turns the pad into a plain MIDI controller with no sequencer or scale layer on the chip. The 16 pads
  send velocity and aftertouch notes with continuous baseline tracking meant to stop phantom stuck notes, the eight
  encoders send MIDI CC through a Gray-code decoder, and two pad banks and two knob banks, four presets, transpose,
  four velocity curves and a channel setting sit behind a Shift layer. A note repeat engine offers eight rates,
  swing up to 66 percent, latch, tap tempo and a tempo from 30 to 300 BPM. The unit also appears as BLE-MIDI. A single
  HTML page edits note maps, encoder assignments, velocity curves and thresholds over an open SysEx protocol and saves
  them to flash. The README credits the open-smc-pad and groovebox projects for the hardware notes and says it is not
  a fork of either. The repository has an agent workflow file, and the commit history was written with AI assistance.
