homepage: https://github.com/cmoran/smc-pad-core
distribution: source-only
install_notes: >-
  Build with make firmware and the JieLi pi32v2 toolchain, hold the PAD BANK button while powering on to enter DFU
  mode and flash build/app.bin with dfu-util for USB ID 1209:0002. That ID and the DFU mode match the bootloader that
  open-smc-pad installs over the factory firmware, which the README does not mention, and returning to stock from that
  bootloader needs the chip's ROM download mode. The README itself says the factory bootloader is untouched and the
  stock firmware can be flashed back through DFU. Nothing is released as a prebuilt file.
brick_risk: true
