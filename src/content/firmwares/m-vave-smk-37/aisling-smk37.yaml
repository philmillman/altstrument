device: m-vave-smk-37
name: AISLING SMK-37 Elite
summary: >-
  Port of the AISLING generative Irish ambient instrument to the SMK-37 Elite, with a board layer for its 37 keys,
  pads and faders. Version 1.3.1 ships a package that the author tested on one Elite.
description: >-
  Same engine, eight pieces and screens as the FM-1 version, with the FM-1 build left byte for byte unchanged and one
  compile switch selecting the Elite. A board layer covers the Elite's pins, key and button matrix, lights, display and
  flash map, which the author read from M-VAVE's V016 update package and from the makkuro and genkigenki SMK-37 ports.
  The middle 27 of the 37 keys (F3 to G5) play as the FM-1's keys do, the buttons and knobs take the FM-1's jobs, the
  16 pads act as PERFORM's effects while held, with latch and lights, and the four faders set the mix. The Elite's USB
  MIDI works; TRS MIDI is off. The firmware never writes the first 16 KiB, the Bluetooth pairings, the per-unit key
  calibration or the stock resources. The release notes say the 1.3.1 package was installed over M-VAVE's V016, removed
  again with M-VAVE's own package, installed again, and every control checked by hand on one Elite, with an hour's run
  without dropouts. The web installer has not been tried on an Elite. It is for the Elite only, not the Pro or
  MKE-P37.
status: active
authors:
- name: Stephen Cummins
  url: https://github.com/stephencummins
source: https://github.com/stephencummins/smk37-aisling
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md puts the work under GPL-3.0-only, as AISLING, NACHTFAHRT, DUB-1, AMB-1 and Felucca. The Karplus-Strong
  pluck follows M-VAVE's MIT-licensed fm1_open code, the fonts are SIL OFL 1.1, and the board layer is written again after
  genkigenki's GPL-3.0 SMK-37 ports and a CC BY-NC 4.0 guide by makkuro whose facts, not text, are cited. No M-VAVE
  package is in the repository.
homepage: https://stephencummins.github.io/smk37-aisling/
based_on: m-vave-fm-1/aisling
distribution: download
requires_stock: SMK-37 Elite on M-VAVE V016
install_notes: >-
  Take a full flash backup first, then install the release's aisling-smk37-elite-1.3.1.fwsc with the repository's
  tools/fm1_install.py and the port named SMK-37 Elite. The tools check the Elite by its USB name and refuse an FM-1
  package. They also include a rescue tool that writes only the app area from your own M-VAVE SMK-37 Elite V016
  package after checking the flash chip and that your backup holds the key calibration. docs/SMK37.md section 11
  covers installing and going back. The release notes say installing is at your own risk and that the package has run
  on one unit.
brick_risk: false
