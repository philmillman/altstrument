device: m-vave-smk-37
name: Baud Girl SMK-37+VA
summary: >-
  Closed-source port of Baud Girl's FM-1+VA to the SMK-37 Pro and Elite (and the Donner Starrykey-37 Play
  and EROK MKE-P37): VA, FM and 8-bit engines, 64-step sequencer, knob banks on K5 to K8.
description: >-
  Same feature set as FM-1+VA on the 37-key hardware: patterns up to 64 steps with per-step ratchet, chance,
  gate and length, chaining into songs. Version numbers are shared with FM-1+VA.
