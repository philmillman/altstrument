device: m-vave-smk-37
name: Big Beat Studio BB-37
summary: >-
  Firmware for the SMK-37 Pro, SMK-37 Elite and MKE-P37 with Telegram, an SH-101-style lead synth, Dillo, a TB-303-style bass synth, and a synthesized
  808, plus a library of sounds and phrases and 16-pad Band arrangements.
description: >-
  Rights warning: the phrase and Band data transcribe named songs and acid lines, such as the Acid Tracks parts, and Band presets
  are drawn from the BB1 songs. Build 799 rested this material on the project owner's own permission statement and asserted no open licence for
  the Acid Voice parts; the build 800 tree carries no file about these terms.

  BB-37 has three instruments. Telegram is a one-oscillator lead synth modelled on the SH-101, with saw, pulse, sub and noise on a mixer, a four-pole
  filter, LFO or envelope pulse-width modulation, gate and trigger modes, legato-only auto glide, an arpeggiator and a 100-step sequencer. Its
  patches include the 40 sounds charted in the SH-101 owner's manual and eight reader patches from 1980s magazines. Dillo is a TB-303-style bass
  voice with accent, slide and two Devilfish-style controls (slide time and accent decay), with 106 sounds and 1,136 patterns. The 808 has 16
  synthesized sounds. Band puts Telegram, Dillo and 808 parts on the 16 pads, each change landing on the next bar. Dillo and the 808 share their
  sound engine with Big Beat Studio and BB1 for the FM-1. Build 800 was first released for the Elite only; the same release now carries
  separate packages for the SMK-37 Pro, the SMK-37 Elite and the EROK MKE-P37.
status: active
authors:
