device: m-vave-smk-37
name: BB–37 Telegram 101
summary: >-
  A 101-style lead, Dillo acid bass, synthesized 808 drums, Band arrangements and one-bar knob-motion recording for the
  SMK-37 Elite, SMK-37 Pro and MKE-P37. The installer identifies the model and selects its exact package; 727 and LATIN
  percussion are Elite-only.
description: >-
  Rights warning: the Band and phrase data transcribe named songs and acid lines, such as 1000 Knives, 777-9311 and the
  Acid Tracks parts, and Band presets are drawn from the BB1 songs. THIRD_PARTY.txt says the Dillo phrases adapted from
  Acid-Tabs.com are CC BY-SA 4.0 and the Acid Voice charts are adapted under a separate project licence, but it states
  no terms for the other song transcriptions.

  BB–37 Telegram 101 has three instruments, made by Big Beat Studio. Telegram is a one-oscillator lead synth modelled on
  the SH-101, with saw, pulse, sub and noise on a mixer, a four-pole filter, LFO or envelope pulse-width modulation, gate
  and trigger modes, legato-only auto glide, an arpeggiator and a 100-step sequencer. Its patches include the 40 sounds
  charted in the SH-101 owner's manual and eight reader patches from 1980s magazines. Dillo is a TB-303-style bass voice
  with accent, slide and two Devilfish-style controls (slide time and accent decay), with 106 sounds and 1,136 patterns.
  The 808 has 16 synthesized sounds. Band puts Telegram, Dillo and 808 parts on the 16 pads, each change landing on the
  next bar, and one bar of a sound-knob movement can be recorded and looped while you play. On the Elite, the release
  also includes 727 and LATIN percussion, recorded TR-727 sounds from Compás and Hanan Cumbia sounds; the Pro and
  MKE-P37 keep the synthesized 808. Dillo and the 808 share their sound engine with Big Beat Studio BB1 for the FM-1, and
  Telegram 101 for FM-1 is a separate build from its own repository.

  History: build 800 (v1.0.0) was first released for the Elite only, and the same release later carried separate
  packages for the SMK-37 Pro, the SMK-37 Elite and the EROK MKE-P37. Build 826 was an Elite-only application update
  that added a foreground adapter for the Big Beat Editor.
