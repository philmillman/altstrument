license_notes: >-
  LICENSE gives GPL-3.0-only. Retained M-VAVE SMK-37 Open sources are GPLv3 with the section 7 linking permission
  (vendor/smk37/LICENSE.md), Big Beat and Felucca-derived code is GPL-3.0-only (vendor/bb/LICENSING.md), and DaisySP, Rings, msfa, Fukiai, uPD933,
  Terminus and Inter Tight keep their own terms. The music data is not all GPL; see the rights warning. At v1.0.0 the repository had no
  build script; build 851 adds BUILDING.txt and board/build.py for source builds. THIRD_PARTY.txt lists the retained
  component notices, the Apache-2.0 JieLi SDK packaging inputs and the Terminus font, and says the Picnic glyphs come
  from Taylor Rushing's Big Beat brand font with no open licence asserted. On the Elite, the TR-727 recordings from
  Compás are GPL-3.0-only and the Hanan Cumbia recordings by Oficina de Sonido are CC BY-SA 3.0. The installer bundles
  React under the MIT licence. The repository holds no M-VAVE stock image.
homepage: https://thebigbeat.app/elite/telegram-101/
based_on: m-vave-fm-1/bb1
distribution: browser-installer
install_notes: >-
  The installer at thebigbeat.app/elite/telegram-101/install/ runs in desktop Chrome or Edge over WebMIDI. Back up your
  work, connect one keyboard directly with a USB data cable, close other apps using its MIDI port and keep the cable
  connected until the page confirms completion; the release zip carries the same installer for offline use. The
  installer asks the connected unit for its model and sends the matching Pro, Elite or MKE-P37 package, which the
  keyboard's own SysEx update loader installs. On the Elite it also checks the 727 and LATIN kits and may offer a
  percussion backup to download; keep it, and use the installer's restore control before returning to factory firmware
  if you want the original percussion area back. If USB is interrupted in update mode, reconnect the same keyboard and
  install again. To return to factory firmware, use the return control on the install page with M-VAVE's version 016
  file for your exact model. The device's mask-ROM rescue and M-VAVE's updater remain the recovery route (see the
  device notes).
brick_risk: false
