  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/smk37-elite-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and LICENSE file give GPL-3.0-only. Retained M-VAVE SMK-37 Open sources are GPLv3 with the section 7 linking permission
  (vendor/smk37/LICENSE.md), Big Beat and Felucca-derived code is GPL-3.0-only (vendor/bb/LICENSING.md), and DaisySP, Rings, msfa, Fukiai, uPD933,
  Terminus and Inter Tight keep their own terms. The music data is not all GPL; see the rights warning. The repository has no build script (its
  Makefile only checks the release tree). It holds the project's own builds (firmware/BB-37-Elite, BB-37-Pro and BB-37-MKE-P37 Build 800 .fwsc
  files) and no M-VAVE stock image.
homepage: https://thebigbeat.app/elite/
based_on: m-vave-fm-1/bb1
distribution: browser-installer
install_notes: >-
  The installer at thebigbeat.app/elite/install/ runs in current desktop Chrome or Edge over WebMIDI with SysEx permission. Connect the keyboard
  directly with a USB data cable and keep it connected until the page reports the restart. The installer asks the connected unit for its model
  and sends the matching SMK-37 Pro, SMK-37 Elite or MKE-P37 package; the three packages it serves are identical to the v1.0.0 release assets.
  It installs from the stock firmware by feeding the package to the keyboard's own SysEx update loader in two stages, as M-VAVE's updater does,
  and makes no backup. The device's mask-ROM rescue and M-VAVE's updater remain the recovery route (see the device notes). The author reports
  testing build 800 on an Elite, including a return to build 797 and a reinstall; the issue thread names no test on the Pro or MKE-P37.
brick_risk: false
