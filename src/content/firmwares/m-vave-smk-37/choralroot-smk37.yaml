  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.27-smk37.1
  notes: Pre-release. Community test build with one package per model (Pro, Elite, MKE-P37) and a "1core" twin of each; the notes name no changes beyond 0.27-smk37.
