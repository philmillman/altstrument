device: m-vave-smk-37
name: ChoralRoot SMK-37
summary: >-
  Quixotic7's ChoralRoot chord instrument on the SMK-37: all 37 keys play roots, the chord types and
  extensions sit on pads, and the pads also hold strum, harp, arpeggio and pattern modes. Warning: includes Casio CZ-1 factory tones.
description: >-
  Rights warning: the build includes the 64 factory tones of the Casio CZ-1 as sound data, and the repository
  says no license is granted for them and that the rights stay with Casio, so the package is not clear for
  commercial redistribution as it stands. genkigenki's port, first kept on the smk37 branch of the genkigenki/ChoralRootFM1 fork, was merged into
  Quixotic7/ChoralRootFM1 as pull requests 14 and 22, and the upstream project now publishes SMK-37 test
  builds beside its FM-1 releases (the fork's own smk37 branch stopped at 0.21). The upstream maintainer has
  no SMK-37, so the builds are described as community-tested. Each release has one package per model (Pro,
  Elite, MKE-P37), with a "1core" twin for units that freeze with the standard one. The faders set the
  sends into the effects, and the TRS jack is a MIDI output that repeats what goes out over USB.
status: active
authors:
- name: Quixotic7 (ChoralRoot)
  url: https://github.com/Quixotic7
- name: genkigenki
  url: https://github.com/genkigenki
source: https://github.com/Quixotic7/ChoralRootFM1
source_status: open
license: GPL-3.0-only
license_notes: >-
  Same terms as the FM-1 ChoralRoot (code GPL-3.0-only; ported parts such as DaisySP, Rings and the uPD933
  emulation keep their own licences, listed in LICENSING.md). The repository bundles the 64 Casio CZ-1
  factory tones (assets/cz1-factory) as sound data, rebuilt from archived CZ-1 patch dumps and Oli Larkin's
  VirtualCZ presets; LICENSING.md and the folder's README say the tones are Casio's, that no licence is
  granted for them by this project and that the rights stay with Casio.
homepage: https://github.com/Quixotic7/ChoralRootFM1/blob/main/SMK37.md
based_on: m-vave-fm-1/choralroot
distribution: download
install_notes: >-
  Download the package for your model from the latest SMK-37 release and install it with
  tools/fm1_install.py over USB, or use the SMK-37 web installer at genkigenki.github.io/smk37. Have M-VAVE's
  package for your model and its M-UPGRADE updater ready first; installing M-VAVE's package afterwards
  restores stock firmware because the build keeps the model name. Keep the cable connected until the
  keyboard restarts. The first start clears the stock settings and other firmware's data in the shared data
  area. Unofficial; install at your own risk.
brick_risk: false
tags: [chords, synth-engine, performance]
image:
  url: https://genkigenki.github.io/smk37/assets/shot-choralroot.png
  alt: "ChoralRoot screen on the SMK-37 display showing a D major 7 chord and its notes"
  credit: genkigenki
  source_url: https://genkigenki.github.io/smk37/
  first_party: true
versions:
- version: 0.41-smk37
  date: 2026-11-12
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.41-smk37
  notes: The SMK-37 packages of 0.41, where each drum has its own sends into the chorus, delay and reverb plus its own Level, Drive and Filter, and the drums play on the second core when Dual Core is on.
- version: 0.40-smk37
  date: 2026-11-11
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.40-smk37
  notes: The SMK-37 packages of 0.40, which adds a drum beat on the metronome's keys, built from Mutable Instruments Grids patterns and a morphing drum synth with six kits. The click now follows MASTER and the beat is off at every power-on.
- version: 0.39-smk37
  date: 2026-11-11
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.39-smk37
  notes: The SMK-37 packages of 0.39, where MIDI Roots lets a whole MIDI keyboard play the chords and the Options are grouped and reopen where they were left.
- version: 0.38-smk37
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.38-smk37
  notes: The SMK-37 packages of 0.38, where Glide makes chords slide into each other over up to 30 seconds with the knob showing the real time, and two notes no longer keep sounding after LATCH or a Free copy.
- version: 0.37-smk37
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.37-smk37
  notes: The SMK-37 packages of 0.37, where Bass Solo follows the octave played, loops stay locked to an uneven incoming MIDI clock and the PERF layers keep their knobs in the same places across modes.
- version: 0.36-smk37
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.36-smk37
  notes: The SMK-37 packages of 0.36, which adds 21 more scales to Key Mode, among them the modes, pentatonics, blues, bebop, whole tone, diminished and a 6th-diminished scale.
- version: 0.35-smk37
  date: 2026-11-10
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.35-smk37
  notes: The SMK-37 packages of 0.35, where the bass can Follow the chords' performance and holding PERF in a PERF layer switches between the chords and the bass.
- version: 0.34-smk37
  date: 2026-11-09
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.34-smk37
  notes: The SMK-37 packages of 0.34, which gives the chords and the bass their own performance modes, so sustained chords can sit over an arpeggiated bass.
- version: 0.33-smk37
  date: 2026-11-09
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.33-smk37
  notes: The SMK-37 packages of 0.33, which starts the audio clocks right after power-on to remove the pop some FM-1s gave, adds MIDI CC in and out for the sounds' parameters (Options > MIDI CC, with the out side also on the TRS jack and the faders) and lets the master filter act on the chords or the bass alone. No SMK-37 owner has reported the pop. Community port by genkigenki, tested by SMK-37 owners rather than the maintainer.
- version: 0.32-smk37
  date: 2026-11-08
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.32-smk37
  notes: The SMK-37 packages of 0.32, whose flash driver waits longer for a slow erase or page write instead of giving up, which matters for units with the newer flash chip. Community port by genkigenki, tested by SMK-37 owners rather than the maintainer.
- version: 0.31-smk37
  date: 2026-11-08
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.31-smk37
  notes: The SMK-37 packages of 0.31 without the FM-1's USB Host. When USB goes away with notes held, the keyboard releases them.
- version: 0.30-smk37
  date: 2026-11-08
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.30-smk37
  notes: The SMK-37 packages of 0.30 without the FM-1's Bluetooth MIDI. Incoming MIDI start, continue and stop act like the PLAY button, and a start takes the arpeggiator back to its first step.
- version: 0.29.2-smk37
  date: 2026-11-07
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.29.2-smk37
  notes: The SMK-37 packages (Pro, Elite, MKE-P37, each with a 1core twin) of 0.29.2, where loops follow the incoming MIDI clock pulses and stay in time. Community port by genkigenki, tested by SMK-37 owners rather than the maintainer.
- version: 0.29-smk37
  date: 2026-11-02
  url: https://github.com/Quixotic7/ChoralRootFM1/releases/tag/v0.29-smk37
  notes: Pre-release; the FM-1's 0.29 on the SMK-37, a community test build with one package per model and a "1core" twin of each. The FM-1 release adds four filter types, drive before the filter, an AHD amp envelope and bit and sample-rate reduction to the FM TONE sounds.
- version: 0.27-smk37.1
