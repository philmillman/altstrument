device: m-vave-smk-37
name: Classic Tabby
summary: >-
  Fork of M-VAVE's SMK37 Open for the SMK-37 Pro that adds song mode, MIDI file import and per-row program and control change events, with a hosted workbench. It drops the sampler and the DX7 user library to make room.
description: >-
  Songs hold up to 128 rows, each pointing to one 64-step block per track, with up to four notes per step, probability, retrigger, per-row length and repeat counts, per-track output channels, queued jumps and loops. 16 songs are stored in the flash that held samples. The workbench imports Standard MIDI files (type 0 or 1) into songs, edits rows and blocks, and exports a .tabby file. Rows can carry program changes, bank selects and control changes that fire when the row starts, and the workbench holds definitions for fifteen external devices, including the FM-1 under Skiff, Melodee and Orange Cat, and a built-in rig profile, so presets can be picked by name. Version 3.0 keeps the start offset and length of each imported note in 480ths of a step, adds a track launch page that lets each of the eight tracks loop one of the song's patterns, a lead time per channel for program changes, and moves Bluetooth settings from the device to the workbench. Version 3.2 adds importer output channels taken from the file and a generated MIDI authoring guide. Version 3.3 is a diagnostic build that adds a full backup and restore of projects, songs and device settings, timing counters and a MIDI monitor script for the computer. Version 4.0 moves the storage boundary to make the user region 64 KiB smaller, removes the stock step editor and recording pages, refuses flash writes while the transport plays and keeps the timing counters in the normal build. Version 4.1 limits the 10 ms control pass to a 6 ms budget so MIDI sends and song scheduling are not delayed by screen drawing, renames the panel controls by their printed numbers and makes the update page retry a failed query. Version 4.2 turns fast MIDI on at power-up and adds a remote-control command over USB. It was built on Linux with a reproducible toolchain, byte-identical to the Windows toolchain under Wine. The release notes for 2.0 through 3.3 say it has been tested on the host and in the browser simulator only and is not yet validated on hardware, those for 4.0 say the storage layout was checked on a device with a separate probe build but 4.0 itself has not been installed on one, those for 4.1 say it has not been installed on a device yet, those for 4.2 list a known issue under investigation in which the one device tested stopped answering on USB after CLOCK was changed to MIDI with fast MIDI on, and 4.0 warns that old sample and DX7 data is erased after confirmation. Release 1.0 is SMK37 Open V01 unmodified. Written with Claude.
status: active
authors:
- name: seattleuser0
  url: https://github.com/SeattleUser0
source: https://github.com/SeattleUser0/classic-tabby
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md is M-VAVE's SMK37 Open APP license (GPL-3.0-only with an additional permission to link the binary SDK), carried over from m-vave/smk37_open. The sdk/lib/libfm1_engine.a library is the proprietary binary that THIRD_PARTY.md lets be used, linked and redistributed for M-VAVE SMK-37 Pro and Elite devices only, and its git blob matches the one in smk37_open. sdk/firmware/ holds M-VAVE's stock V16 images for both models (git blobs ad5ff6a and 821236a), the files M-VAVE licenses for redistribution on those devices.
homepage: https://seattleuser0.github.io/classic-tabby/
distribution: browser-installer
requires_stock: SMK-37 Pro (V16 factory firmware or an installed SMK37 Open); not the Elite
install_notes: >-
  Open the workbench in desktop Chrome or Edge with MIDI and SysEx permission, check the Device update tab shows the build number printed in the release notes (b926f5556483ee65 for tabby-v04.2), and confirm the device identity reads SMK-37 Pro_016 or SMK-37 Pro_8000001 before continuing. Make a full backup in the workbench first and keep the file, because tabby-v04.0 moves the storage and every project, song and device setting stays unreadable until you restore it; updating from v04.0 or later needs no restore. Back up DX7 voices too, because sample and DX7 data is erased once you confirm on first boot, and export songs as .tabby before using Restore factory V16, which overwrites the last part of song storage. The workbench has a Restore factory V16 option. An offline copy of the workbench is in the release.
brick_risk: false
tags: [sequencer, tracker, midi, fork, editor]
versions:
- version: tabby-v04.2
  date: 2026-11-12
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v04.2
  notes: Turns fast MIDI on at power-up so song notes leave the DIN output sooner, and adds a remote control over USB for status, song select, play, stop and named panel controls. The notes list a known issue, still under investigation, where changing CLOCK to MIDI with fast MIDI on left the one tested device unresponsive on USB until a power cycle; turning A2 FAST MIDI off first avoids it. Takes the same storage layout as v04.1, so no move, but the notes advise a full backup first.
- version: tabby-v04.1.1
  date: 2026-11-10
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v04.1.1
  notes: Same device firmware as tabby-v04.1; only the 32-byte build identity and package checksums differ. Updates the workbench page, the Help and the testing guide, so reinstalling is optional and no backup is needed.
- version: tabby-v04.1
  date: 2026-11-10
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v04.1
  notes: Keeps the 10 ms control pass within a 6 ms budget so MIDI waits lose the 20 ms tail, renames panel controls by their printed numbers and makes the update page retry a failed query. A normal update from v04.0 with no storage move; not yet installed on a device per the release notes.
- version: tabby-v04.0
  date: 2026-11-09
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v04.0
  notes: Moves song storage so the user region is 64 KiB smaller, so projects, songs and settings need a full restore from a backup after the install and Bluetooth pairings are lost once. Removes the stock step editor and recording pages, moves sync and MIDI settings to a SEQ page, refuses flash writes while the transport plays and puts the timing counters in the normal build. The notes say this build has not been installed on a device yet. Test release tabby-p0-probe64 is not listed.
- version: tabby-v03.3-diag
  date: 2026-11-08
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v03.3-diag
  notes: Diagnostic build with the tabby-v03.2 firmware and storage layout plus timing counters. Adds a full backup and restore in the workbench that also holds device settings, with a read-back check. Playback is unchanged and the notes say it is not yet validated on hardware. Release tabby-p0-probe64, a pre-release that moves the storage boundary, is a test build and is not listed.
- version: tabby-v03.2
  date: 2026-11-05
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v03.2
  notes: Adds a read-only Wrong Room rig profile, four more device profiles, importer output channels taken from the MIDI file, and a built-in MIDI authoring guide. The firmware is unchanged apart from the version label, and the notes say it is not yet validated on hardware. Release tabby-v03.1 only added a rewritten manual and the version on the boot screen.
- version: tabby-v03.0
  date: 2026-11-04
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v03.0
  notes: Keeps imported notes' exact timing, adds a track launch page, a lead time per channel and Bluetooth settings in the workbench, and removes the device's BLE and NAME pages. Songs from tabby-v02.0 still play.
- version: tabby-v02.0
  date: 2026-11-03
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v02.0
  notes: Adds song mode, MIDI file import, row events and a device library; removes the sampler, the DX7 user library, the operator editor pages and the factory scenes.
- version: tabby-v01.0
  date: 2026-11-02
  url: https://github.com/SeattleUser0/classic-tabby/releases/tag/tabby-v01.0
  notes: SMK37 Open V01 unmodified, built on Linux; the build ID differs from M-VAVE's only through line endings.
