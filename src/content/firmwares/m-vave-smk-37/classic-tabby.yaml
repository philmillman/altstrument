device: m-vave-smk-37
name: Classic Tabby
summary: >-
  Fork of M-VAVE's SMK37 Open for the SMK-37 Pro that adds song mode, MIDI file import and per-row program and control change events, with a hosted workbench. It drops the sampler and the DX7 user library to make room.
description: >-
  Songs hold up to 128 rows, each pointing to one 64-step block per track, with up to four notes per step, probability, retrigger, per-row length and repeat counts, per-track output channels, queued jumps and loops. 16 songs are stored in the flash that held samples. The workbench imports Standard MIDI files (type 0 or 1) into songs, edits rows and blocks, and exports a .tabby file. Rows can carry program changes, bank selects and control changes that fire when the row starts, and the workbench holds definitions for eleven external devices, including the FM-1 under Skiff, Melodee and Orange Cat, so presets can be picked by name. It was built on Linux with a reproducible toolchain, byte-identical to the Windows toolchain under Wine. The release notes say the 2.0 release has been tested on the host and in the browser simulator only, not on hardware, and warn that old sample and DX7 data is erased after confirmation. Release 1.0 is SMK37 Open V01 unmodified. Written with Claude.
status: active
