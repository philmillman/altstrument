  url: https://github.com/SeattleUser0
source: https://github.com/SeattleUser0/classic-tabby
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE.md is M-VAVE's SMK37 Open APP license (GPL-3.0-only with an additional permission to link the binary SDK), carried over from m-vave/smk37_open. The sdk/lib/libfm1_engine.a library is the proprietary binary that THIRD_PARTY.md lets be used, linked and redistributed for M-VAVE SMK-37 Pro and Elite devices only, and its git blob matches the one in smk37_open. sdk/firmware/ holds M-VAVE's stock V16 images for both models (git blobs ad5ff6a and 821236a), the files M-VAVE licenses for redistribution on those devices.
homepage: https://seattleuser0.github.io/classic-tabby/
distribution: browser-installer
requires_stock: SMK-37 Pro (V16 factory firmware or an installed SMK37 Open); not the Elite
install_notes: >-
  Open the workbench in desktop Chrome or Edge with MIDI and SysEx permission, check the Device update tab shows build 41d72747b0f68867, and confirm the device identity reads SMK-37 Pro_016 or SMK-37 Pro_8000001 before continuing. Back up projects and DX7 voices first, because sample and DX7 data is erased once you confirm on first boot, and export songs as .tabby before using Restore factory V16, which overwrites the last part of song storage. The workbench has a Restore factory V16 option. An offline copy of the workbench is in the release.
brick_risk: true
