device: m-vave-smk-37
name: Clipper Pro
summary: >-
  isod89's own SMK-37 build of the Clipper synthesizer (23 engines, 407 sounds): velocity keys, 16 RGB pads, four
  fader banks, wheels, sustain pedal and TRS MIDI out, with one package each for the Pro, Elite and MKE-P37.
description: >-
  Clipper Pro follows Clipper 1.3 for the FM-1, which has SLOOP 2.8.3's fixes, and the repository still builds the FM-1
  firmware as well. Every FM-1 control keeps a place, so the Clipper manual still applies. The middle 27 keys play as
  on the FM-1 with velocity read through the unit's factory curves, and the outer ten keys play more notes. The pads
  play the sound in the colour of its kind, or in a SOUNDS view show the sounds of a kind for a tap to load one. Four
  faders in four banks set macros, the envelope, tone (cutoff, resonance, LFO rate, glide) and mix sends. The wheels
  send pitch bend and mod wheel, a pedal jack acts as sustain, and the TRS jack sends the keys, pads, wheels,
  arpeggiator and sequencer as MIDI out. Clipper's web editor works with it, and the installer picks the package for
  the connected model. The author describes it as tested on the SMK-37 as 1.2. It credits genkigenki's fm1-to-smk37 board
  layer, and it is a separate line from the davidozz0 Clipper SMK-37 port.
status: active
authors:
- name: isod89
  url: https://github.com/isod89
source: https://github.com/isod89/clipper-pro
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, as upstream Clipper on Felucca's platform layer. Felucca's icon atlas and panel
  image are separate assets, and the CC0 samples, msfa (Apache-2.0), DaisySP and Rings ports (MIT) and the Terminus
  font (OFL) are listed in LICENSING.md. The JieLi SDK files are not in the tree. The repository holds built packages
  in docs/firmware that are Clipper Pro's own, not M-VAVE images.
homepage: https://isod89.github.io/clipper-pro/
distribution: browser-installer
requires_stock: M-VAVE V016 (older units need M-VAVE's updater first)
install_notes: >-
  Installer page in Chrome or Edge with the keyboard on a USB data cable; it reads the model, writes the matching
  package and checks the unit afterwards. On Windows, if the page stops while the unit restarts, reopen it and press
  Install, or use INSTALLER-USB-PRO.bat. The README asks for a full flash backup first and says the unit's calibration is never
  written. Holding OCTAVE- at power-on opens a USB rescue screen, and M-VAVE's updater returns the unit to stock.
  Each package refuses another model before erasing anything. Installing is at your own risk.
brick_risk: false
tags: [synth-engine, oscillator, wavetable, fm, filter, fx, midi, performance, editor, fork]
