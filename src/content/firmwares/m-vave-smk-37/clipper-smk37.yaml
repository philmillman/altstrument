license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, as upstream Clipper. msfa is Apache-2.0, the PHYS engine ports DaisySP and
  Rings (MIT), the font is Terminus (OFL) and the samples are CC0 (ATTRIBUTION.txt, LICENSES/). The JieLi toolchain and SDK
  are not in the repository.
homepage: https://davidozz0.github.io/clipper-smk/webapp/installer/
distribution: browser-installer
install_notes: >-
  The web installer (Chrome or Edge, Web Serial) checks the package's SHA-256, writes only the app area and checks
  the unit reports an SMK-37 Pro identity afterwards; the page can also restore an official package you pick from disk.
  SMK37.md says to take two identical full flash dumps before writing, and notes that Clipper cannot open the stock
  presets. A package is also at dist/clipper-smk37.fwsc for the M-VAVE or JieLi updater. The data store is
  cleared on the first start after another firmware. Flashing is at your own risk.
brick_risk: false
