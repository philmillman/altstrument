device: m-vave-smk-37
name: Clipper SMK-37
summary: >-
  Unofficial port of isod89's Clipper synth (23 engines, 407 sounds) to the SMK-37 Pro, using the 37 keys, 16 pads,
  encoders and wheels, with TRS MIDI out and a sound picker on the pads.
description: >-
  Built on Clipper 1.1, with the port's changes on the smk37 branch, which is the repository's default branch. The
  pads show 16 sounds for a few seconds when PRESETS is turned and a pad loads its sound; KNOB BANK keeps them up.
  The factory sound list is regrouped by engine, so ALGORITHM steps between the 23 engines and PRESETS walks the
  whole list. The 3.5 mm jack is used as MIDI out, the pitch and mod wheels send pitch bend and CC 1, the pad LEDs
  light only while a pad is held, and K1 shows a master volume overlay. The four faders are switched off in this build
  because the author's own unit has a broken fader. Data is kept in a CLIPPER store that other firmwares do not read.
  The README says it is tested on one unit: keys, pads, wheels, TRS out, flashing and saving. A built package
  is committed to the repository and also served by a web installer. isod89 has since published its own SMK-37 line as
  Clipper Pro, which is a separate entry whose credits do not list this port.
