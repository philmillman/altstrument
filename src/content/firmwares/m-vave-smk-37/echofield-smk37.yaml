source: https://github.com/Philip-Bos/echofield-smk37
source_status: open
license: MIT
license_notes: >-
  LICENSE is MIT, with a trailing paragraph about fonts, SDL2 and ALSA that appears to be left over from the author's
  handheld sampler, which is why GitHub reports no licence. LICENSING.md says the app, engine, companion and tools are
  MIT, the factory sounds are CC0-1.0, and fm1-base, felucca-bsp and the SMK-37 board patches to them are MPL-2.0 file
  by file. The repository commits three built packages under companion/firmware (Pro, Elite and MKE-P37), which are
  this project's own builds and not M-VAVE's files; they carry the JieLi SDK files that the build fetches, under
  Apache-2.0.
homepage: https://philip-bos.github.io/echofield-smk37/
distribution: browser-installer
install_notes: >-
  Flasher on the project site in Chrome, Edge or Opera, with the keyboard on a USB data cable; it picks the package for
  the detected model. tools/flash.py installs from the command line. The README tells you to back up the flash first
  (SMK37.md explains how) and says going back needs M-VAVE's package for your model, or M-VAVE's updater. Untested on
  a real unit, so installing is at your own risk.
brick_risk: false
