device: m-vave-smk-37
name: ECHOFIELD SMK-37
summary: >-
  Port of the ECHOFIELD granular sampler to the SMK-37 Pro, Elite and MKE-P37: six grain modes played from the 37 keys,
  pads, faders and wheels, with a companion web app and flasher. Written without an SMK-37 and untested on hardware.
description: >-
  Same grain engine as the FM-1 version: dozens of short grains at once, rendered on both cores, in six modes (CLOUD,
  DUST, TAPE, BLOOM, PULSE and DRIFT), with RANDOM and lockable knobs, RESAMPLE, LISTEN, the DRIFT ORACLE, 15 factory
  presets and 16 user ones. The SMK-37 board layer reads the keys' velocity through each unit's factory curve, uses the
  pads for the performance effects and for choosing samples and presets, sets texture, cutoff, echo and reverb on the
  faders, and maps the pitch and mod wheels to grain bend and scatter. The FM-1's controls keep their names on the
  keyboard, so the FM-1 manual applies. Samples live in 30 flash sectors, about 115 KB, as IMA ADPCM. A flash fence in
  the driver blocks writes at 0xC0000 and above, which holds the factory calibration and Bluetooth pairing, according to
  the README. The author wrote the port from community hardware documentation without a unit, and the README states
  that nobody has run it on a keyboard, so it has only been exercised in a simulator and on a computer.
status: active
