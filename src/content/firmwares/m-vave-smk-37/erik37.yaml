device: m-vave-smk-37
name: Erik37
summary: >-
  Sampled concert grand piano for the SMK-37 Pro, Elite and MKE-P37, with three velocity layers, dampers,
  half-pedal sustain, sostenuto, una corda, sympathetic resonance and four rooms. An FM-1 build is untested.
description: >-
  Plays 18 sampled notes of the Salamander Grand Piano V3 in three velocity layers, stored as block ADPCM in
  about 380 KB, with a decay measured per key, damper noise and no dampers on the top keys. Four voices (concert,
  studio, vintage, jazz) are on pads 1 to 4 and twelve user presets on pads 5 to 16. The pedal jack and the SEQ REC
  button act as sustain, the mod wheel can be set to, the CHORD and SCALE buttons are sostenuto and una corda, and the
  pitch wheel bends by two semitones. An eight-line reverb gives chamber, hall and church rooms. USB MIDI sends
  keys, pedals and bend and plays the piano from incoming notes. The README says it was played on an SMK-37 Pro
  and that the FM-1 package, for the FM-1's 27 keys, has not been tried on a unit. It is its own firmware on
  fm1-base and felucca-bsp rather than a Felucca derivative.
status: active
