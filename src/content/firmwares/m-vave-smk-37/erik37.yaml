license: MPL-2.0
license_notes: >-
  Every source file carries an MPL-2.0 header (LICENSING.md). The piano samples in the bank inside every package
  are derived from the Salamander Grand Piano V3 by Alexander Holm under CC BY 3.0, and the firmware names that on
  its ABOUT page; the fonts are SIL OFL 1.1.
homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37 in Chrome or Edge with the keyboard on USB, one package
  per model (Pro and Starrykey 37 Play, Elite, MKE-P37, FM-1). Holding OCTAVE- and OCTAVE+ for five seconds
  starts update mode. M-VAVE's updater puts the stock firmware back at any time. Unofficial; install at your own
  risk.
brick_risk: false
