device: m-vave-smk-37
name: Felucca SMK-37
summary: >-
  Felucca 1.6.1 with a board layer for the SMK-37 Pro, Elite and MKE-P37, mapping the keys, pads, faders and
  wheels onto Felucca's controls. Beta, built from source.
description: >-
  Lives on the smk37 branch of the genkigenki/Felucca fork and is offered upstream as hugelton/Felucca pull
  request 237. The 27 middle keys play like the FM-1's, the 10 outer keys add notes, the pads stand in for
  the white keys and the step grid, the faders set track level, pan and sends, and the wheels bend pitch and
  send mod wheel. The FM-1 build is unchanged and the SMK-37 code sits behind a BOARD_SMK37 switch. The
  firmware never writes the keyboard's calibration, Bluetooth pairing or key areas. The TRS jack is not used,
  so there is no MIDI input over TRS; MIDI works over USB.
