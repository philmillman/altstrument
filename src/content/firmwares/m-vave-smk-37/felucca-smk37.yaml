homepage: https://github.com/genkigenki/Felucca/blob/smk37/SMK37.md
distribution: source-only
install_notes: >-
  SMK37.md has you build a package for your model with BOARD=smk37 (MODEL=elite or MODEL=mke for the other
  two) and install it with tools/fm1_install.py over USB. The installers accept only a package for the
  connected model. Have your model's stock package and M-VAVE's updater ready first, and keep the cable
  connected until the keyboard restarts. The first start clears the stock settings and other firmware's
  data in the shared data area.
