device: m-vave-smk-37
name: FMEL-1 SMK-37
summary: >-
  AntonioAltea's Mellotron M400 firmware FMEL-1 on the SMK-37: all 37 keys play the tapes with velocity, the pads switch
  sounds, layers and effects, and the faders and wheels shape the tape.
description: >-
  Rights warning: the Mellotron M400S tape samples inside every build are Bernie Kornowicz's (Taijiguy), used under
  the sample author's terms that they are free to use but not in anything commercial, so they are not GPL and the packages must not be
  sold.

  Lives on the smk37 branch of the genkigenki/fmel-1 fork. It is FMEL-1 0.1-beta with the FM-1 build unchanged and
  the SMK-37 code behind a BOARD_SMK37 switch. Pads 1 to 4 pick the sound, pads 5 to 8 the layer, and the others
  toggle lo-fi, vibrato, Leslie, echo, reverb, half speed and tape length. Two fader banks set mix, tone, wow and
  flutter, then age, drive, echo and reverb. The pitch wheel runs the tape motor and the mod wheel sets vibrato.
  The 37 keys cover the M400's 35 notes with the pitch lowered. The TRS jack is not used, so MIDI comes in over USB only.
  This fork has not moved since 2026-10-17. AntonioAltea's own FMEL-1 releases have shipped SMK-37 Pro, Elite and MKE-P37
  packages since v1.1, so newer builds are on the FMEL-1 entry.
