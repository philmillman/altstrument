distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with tools/fm1_install.py and the package for your model
  (build with BOARD=smk37, adding MODEL=elite or MODEL=mke); the installer stops over another custom firmware unless
  told otherwise. Holding OCTAVE- at power-on gives the USB rescue. Unofficial; install at
  your own risk.
