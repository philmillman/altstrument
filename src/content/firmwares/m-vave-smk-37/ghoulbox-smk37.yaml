device: m-vave-smk-37
name: GHOULBOX SMK-37
summary: >-
  Jason Persinger's GHOULBOX dungeon-synth firmware ported to the SMK-37 Pro, Elite and MKE-P37, with the same
  sounds, drone latching and layer or split keys and the SMK-37's faders put to work.
description: >-
  Lives on the ghoulbox-smk37 branch of the genkigenki/Felucca fork and is offered upstream as
  jasonpersinger/ghoulbox-fm1-dungeon-synth pull request 5. It keeps the FM-1 version's sounds, screens and
  manual, with velocity on the middle keys, extra notes on the outer keys, pads for the white keys and four
  fader banks for level, pan, reverb and delay. The release carries one package for each of the three models.
  It is the FM-1 firmware's 2.1 release on the SMK-37.
status: active
