homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37 in Chrome or Edge, or with tools/fm1_install.py and
  the package for your model from the release page. SMK37.md on the branch asks you to keep your model's stock
  package and M-VAVE's updater ready and to leave the cable connected until the keyboard restarts. Unofficial;
  install at your own risk.
brick_risk: false
