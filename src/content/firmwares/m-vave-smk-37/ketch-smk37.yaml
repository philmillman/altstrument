device: m-vave-smk-37
name: Ketch SMK-37
summary: >-
  Adrien Risser-Zhuang's Ketch tracker on the SMK-37: the 16 pads act as an M8-style gamepad, all 37 keys play and
  record notes with velocity, and the faders set the four channel levels.
description: >-
  Lives on the smk37 branch of the genkigenki/fm1-tracker-ketch fork and is offered upstream as pull request 1 on
  risseraka/fm1-tracker-ketch, which is still open. It is Ketch 0.1, a beta tracker with song, chain and phrase screens and
  Felucca's sound engines on four channels. The FM-1 build is unchanged and the SMK-37 code sits behind a
  BOARD_SMK37 switch. K1 to K4 are the four knobs, K5 is master volume, the wheels bend pitch and
  send the mod wheel, and pad LEDs show three states. The four project slots live in the keyboard's own data areas, and the
  factory calibration, Bluetooth pairing and stock resources are never written. There is no TRS MIDI input. It
  is listed as an experimental port on the genkigenki SMK-37 site, which installs it from the browser.
