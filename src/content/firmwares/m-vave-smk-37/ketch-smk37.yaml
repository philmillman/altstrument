license: GPL-3.0-only
license_notes: >-
  Same terms as Ketch, stated in the README and LICENSING.md; the platform and sound layer are Felucca's, the wiring comes
  from Dinghy, and DaisySP and Rings ports are MIT, msfa is Apache-2.0.
homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with tools/fm1_install.py and a package built with
  BOARD=smk37 (MODEL=elite or MODEL=mke for the other two names). Each model has its own package and the installers accept
  only the connected model. Take a full flash backup first; the first start clears data other firmware left in the stock
  settings area. Holding OCTAVE- at power-on starts update mode. Unofficial; install at your own risk.
brick_risk: false
