source: https://github.com/agomezss/livegomezsynth
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSE. src/THIRD_PARTY.md and PROVENANCE.md keep the GPL-3.0-only notices of SMKSYNTH, OberVave, JIANT, Felucca, SLOOP and Clipper, and the Apache-2.0 notice of the msfa FM core. The committed package is the project's own build, not one of M-VAVE's licensed images, and the JieLi SDK boot files are read from your own checkout at build time.
homepage: https://agomezss.github.io/livegomezsynth/
based_on: m-vave-smk-37/smksynth
distribution: browser-installer
requires_stock: SMK-37 Pro already running SMKSYNTH 1.x or LiveGomezSynth
install_notes: >-
  Use the installer page in desktop Chrome or Edge over HTTPS; it reads the keyboard's identity, refuses firmware it does not know, asks you to save an identity record and the package of your current firmware, then writes and resumes an interrupted transfer. The first start re-initialises the user-data bank, so back up SMKSYNTH banks first. The firmware never writes the calibration area, and the update loader is SMKSYNTH's unchanged. Return to stock with M-VAVE's M-UPGRADE and the factory package, or hold OCTAVE- at power-on to start only the loader.
brick_risk: false
