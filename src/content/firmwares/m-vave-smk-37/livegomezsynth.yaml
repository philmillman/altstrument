device: m-vave-smk-37
name: LiveGomezSynth
summary: >-
  Live-performance firmware for the SMK-37 Pro built on SMKSYNTH, with 444 patches in 15 categories, favourite and performance banks with layers, splits and solo sounds, and a browser simulator and installer.
description: >-
  Sounds come from several engines: an analog-style OberVave voice core, two- and four-operator FM, a six-operator FM core adapted from the Android music synthesizer, a drawbar organ, a sampler, a vowel engine for choir sounds and five drum kits. Sixteen pads load favourites, and eight banks of performances combine two layers split by octave range with two solo sounds. Four knobs tweak the sound, four faders set chorus, delay, distortion and reverb sends, and there is no sequencer or song mode. The browser simulator runs the firmware's C code compiled to WebAssembly. The README says the code was written with AI assistants, that the sounds were authored from parameters and never judged by ear on hardware, and that the firmware has never run on a real keyboard. The release is an update package only: the keyboard must already run SMKSYNTH or LiveGomezSynth, and a first-install package for stock firmware is not built.
status: active
authors:
