device: m-vave-smk-37
name: Makkuro37
summary: >-
  Microtonal drone synth written for the SMK-37: pads gate eight drone voices, a CHAOS pad and fader banks.
description: >-
  A new firmware rather than a port; its sound follows Melodee's ladder filter, limiter and spring reverb.
  A browser simulator is available.
