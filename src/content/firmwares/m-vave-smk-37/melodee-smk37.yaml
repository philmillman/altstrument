device: m-vave-smk-37
name: Melodee SMK-37
summary: >-
  keremimo's Melodee synth and sequencer on the SMK-37 Pro, Elite and MKE-P37: the 16 pads as white keys or a step grid,
  four fader banks, velocity keys, wheels and TRS MIDI out.
description: >-
  Rights warning: Melodee bundles the Casio CZ-1 factory tones and the Sequential Prophet-5/10 factory programs as SysEx
  sound data compiled in as presets, and its licensing files say those rights stay with Casio and Sequential and no
  licence is granted.

  Lives on the smk37 branch of the genkigenki/melodee fork, whose latest commit is Melodee 1.4.5 with the SMK-37 target,
  and is offered upstream as keremimo/melodee pull request 63, which is open. The FM-1 build is unchanged and the SMK-37
  code sits behind a BOARD_SMK37 switch. The 27 middle keys play like the FM-1's, the outer 10 add notes, and the pads
  light in three colours and show the playing steps while the transport runs. The faders have four banks: track
  levels, the selected track's filter, its amp envelope and its FX rack. The jack is MIDI out and can be turned off in the
  HOME menu; there is no TRS MIDI in. Only project slots A and B are stored on the SMK-37.
