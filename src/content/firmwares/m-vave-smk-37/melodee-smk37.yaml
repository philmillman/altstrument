source_status: open
license: GPL-3.0-only
license_notes: >-
  Same terms as Melodee: GPL-3.0-only (LICENSING.md), with ported DSP and fonts under their own licences. The CZ-1
  factory tones (assets/cz1-factory) and the Prophet-5 programs (assets/prophet5-factory) are bundled sound data under
  their owners' rights.
homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with tools/fm1_install.py and the package for your model
  (BOARD=smk37, with MODEL=elite or MODEL=mke). The installers accept only the connected model, and the firmware refuses a
  package not laid out for the SMK-37. Have the stock package for your model and M-VAVE's updater ready, as the first start
  clears the stock settings and other firmware's data in Melodee's store. The site notes that the first SMK-37 build on
  17 October could stop part way through an update; hold OCTAVE- and OCTAVE+ at power-on for update mode. Unofficial;
  install at your own risk.
brick_risk: false
