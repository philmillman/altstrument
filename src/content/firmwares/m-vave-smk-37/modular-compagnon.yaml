device: m-vave-smk-37
name: Modular Compagnon
summary: >-
  SMK-37 Elite firmware with sixteen Modular Town sounds on the pads, an arpeggiator that follows the DAW, and an animated
  companion on the screen.
description: >-
  A sibling of Modular One on the FM-1, by the same author. Each control has one job, with no banks or submenus: the 16 pads
  pick sounds, K1 sets volume, and K2 to K8 set cutoff, resonance, envelope and detune. The screen companion is a cat, a
  fox, a robot or a goldfish. The README is in French and English.
status: active
authors:
- name: Alexis Arakis (Bungle Society)
  url: https://github.com/bunglesociety
source: https://github.com/bunglesociety/modular-compagnon
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in the README and LICENSING.md, inherited from Felucca. CREDITS.md and LICENSES/ list the other parts.
homepage: https://bunglesociety.github.io/modular-compagnon/
distribution: browser-installer
install_notes: >-
  Use the project's install page in Chrome or Edge over USB, or the .fwsc from the release. To go back, the installer's last
  section takes M-VAVE's own SMK-37 Elite version 016 file, which you supply.
brick_risk: true
