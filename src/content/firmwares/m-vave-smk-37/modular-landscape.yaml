license_notes: >-
  The code is GPL-3.0-only per the README and LICENSE file, with Felucca's third-party parts keeping their own licences (smk37/LICENSING.md and smk37/CREDITS.md). The guitar recordings (smk37/tools/archet/archet.bin and the same inside the packages) are not GPL: SOUNDS.md says they are copyright Alexis Arakis, all rights reserved, with permission to use them through the firmware and in any music, commercial included, and to share the firmware with them inside, but not to extract them.
homepage: https://bunglesociety.github.io/modular-landscape/smk37/
based_on: m-vave-smk-37/modular-compagnon
distribution: browser-installer
requires_stock: Any SMK-37 Elite firmware; the installer writes the package over it
install_notes: >-
  Use the project's SMK-37 install page in Chrome or Edge over USB, or the .fwsc from the release, whose SHA-256 the README lists. Installing replaces the M-VAVE firmware and its presets are lost. The same page puts the original firmware back, and the package keeps the unit's identity (SMK-37 Elite_894) so the stock updater still applies. Only the Elite model is supported.
