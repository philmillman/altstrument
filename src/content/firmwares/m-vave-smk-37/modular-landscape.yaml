device: m-vave-smk-37
name: Modular Landscape
summary: >-
  SMK-37 Elite firmware built around one bowed folk guitar sound recorded for it, with eight film-music effects on the pads, a screen that draws the stereo image of what is played and pad sketches. Rights warning on the recordings.
description: >-
  Rights warning: the guitar recordings are the author's own and are not under the GPL. They may be used through the firmware and in any music made with it, commercial music included, but may not be taken out as audio files, a sample pack or another instrument. The firmware has a single sound with no banks or menus. Pads 9 to 16 switch the effects sustain, breath, contra, drone, width, distance, mute and echo on and off, and the knob above each pad sets how much of its effect is applied. The faders set attack, release, reverb space and the length of the bow stroke, and the mod wheel removes the bow noise. Pads 1 to 8 record and loop short sketches. The screen shows the stereo image of the playing as a line drawing. The repository also builds an FM-1 version, which has its own entry and version line. The README is in English and French and says the SMK-37 build is built from Modular Compagnon's tree with the guitar engine switched on.
