distribution: browser-installer
install_notes: >-
  The Elite, the Pro and the MKE-P37 each have their own package. Open the project's simulator page in Chrome or Edge with the keyboard on a USB data cable, press CONECTAR to see
  the model, then INSTALAR for the matching package, or use tools/fm1_install.py with the .fwsc for your model.
  Installing clears another firmware's stored data, and installing another firmware the same way goes back.
  Holding OCT- while switching on starts the rescue. The README says installing is at your own risk.
