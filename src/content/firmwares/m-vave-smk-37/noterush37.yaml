device: m-vave-smk-37
name: NOTE RUSH 37
summary: >-
  Note-reading game for the SMK-37 built on Vector37: a note is shown as a letter, on a staff or played, you
  answer on the keys, and the score goes into a top 5 stored on the keyboard.
description: >-
  A fork of Vector37 that keeps its board layer, update path and synth engine and puts a game where the
  interface was. Three phases show the note name, the staff (C3 to C6) or play the note for you to find by ear,
  with the notes coming in by octave and a time limit from none to two seconds. A right answer builds a combo
  with lightning drawn across the screen and the pads, and a wrong key or a time-out ends the run. The keys
  always sound through nine of Vector37's sounds, and the knobs, faders and wheels shape them, with a PATCH
  screen and a moving VETOR brightness screen. The screens are in Brazilian Portuguese. It is the firmware
  version of the author's NOTE RUSH CYBERFUNK web game. The project site runs the firmware in the browser on a
  simulated SMK-37.
