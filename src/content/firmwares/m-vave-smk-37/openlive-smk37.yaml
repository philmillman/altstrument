device: m-vave-smk-37
name: OpenLive SMK-37
summary: >-
  The OpenLive live-first groovebox on the SMK-37 Elite and Pro: loops, CAPTURE, scenes and morph on a virtual analog synth
  and drum engine, with pressure pads, faders, wheels and the MIDI OUT jack.
description: >-
  The firmware runs the same four-track app as OpenLive FM-1 on M-VAVE's smk37_open SDK. All 37 keys play with the
  factory velocity calibration, which the code reads and never writes. The 16 pads are PERFORM pads for the loop,
  filter, delay, drive and crush effects, where pressure sets the depth, or PLAY pads for notes and drums. The four
  faders set track levels, macros or targets chosen in the CONTROL MAP, the mod wheel morphs between scenes by default,
  and the TRS MIDI OUT jack repeats clock, transport and notes so a Roland T-8 can follow. The app and synth come from
  the MIT OpenLive VirtualAnalog repository as a git submodule. Bluetooth is off. The README and STATUS.md say the
  firmware builds in CI for the Elite and the Pro and passes 47 host checks with a fake SDK and panel, and that it has
  not yet run on a real SMK-37. The repository has no releases yet.
status: active
authors:
- name: Tom-Rfid
  url: https://github.com/Tom-Rfid
source: https://github.com/Tom-Rfid/OpenLive_SMK-37
source_status: open
license: GPL-3.0-only
license_notes: >-
  COPYING.md states GPL-3.0-only with the linking exception of M-VAVE's smk37_open SDK, whose terms are copied in
  targets/smk37/LICENSE.md. The va/ submodule is MIT and the fm1-base files used by the build are MPL-2.0. The SDK
  binaries are not in the repository; CI fetches smk37_open at a pinned commit.
based_on: m-vave-fm-1/openlive-fm-1
distribution: source-only
requires_stock: M-VAVE's SMK-37 Open firmware tools are used to go back; one package per model, Elite or Pro
install_notes: >-
  Build with the repository's CI recipe, which needs the pinned smk37_open checkout, fm1-base and the JieLi toolchain,
  then install the package for your model with fm1_install.py --port SMK --force --no-resources or the included
  FLASH-SMK37.bat on Windows. The keyboard refuses the other model's package. OpenLive keeps its data in Open's
  project slots 6 to 16 and leaves slots 1 to 5, settings and samples alone. The way back is the Restore factory V16
  option of M-VAVE's SMK37 OPEN web workbench, which can also reinstall from update mode.
brick_risk: false
