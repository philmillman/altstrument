source_status: open
license: GPL-3.0-only
license_notes: >-
  Code is GPL-3.0-only with the msfa (Apache-2.0) exception; see LICENSING.md. The README says the extracted
  OP-1 tables and factory data (assets/op1-cluster, used by the CLUSTER engine) keep Teenage Engineering's
  rights, are not GPL or CC0, and that extraction alone does not establish distribution permission. The
  repository includes no OP-1 logo or artwork.
homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with tools/fm1_install.py and a package from the
  release or your own build (BOARD=smk37, with MODEL=elite or MODEL=mke). Back up the whole flash first as
  SMK37.md advises, and have M-VAVE's package for your model and its updater ready. The first start clears
  the stock settings and other firmware's data in the shared data area. Unofficial; install at your own risk.
brick_risk: false
