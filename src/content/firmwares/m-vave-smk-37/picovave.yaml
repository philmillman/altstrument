device: m-vave-smk-37
also_devices: [m-vave-fm-1]
name: picovave
summary: >-
  PICO-8 player firmware for the SMK-37 Pro and, since 2026-10-21, the FM-1: it maps each device's keys, buttons
  and controls onto the PICO-8 controller, with a browser simulator built from the same sources and cart upload
  over USB MIDI.
description: >-
  Rights note: the repository bundles PICO-8 cartridges (.p8.png) from community authors, each under its
  author's own terms; the page's cart gallery shows eight of them with links to their source threads. The firmware runs the
  femto8 PICO-8 engine and holds one cartridge at a time in the unit's flash. Cartridges are sent as .p8.png
  files over USB MIDI SysEx from the web page, which checks in advance, on the same allocator and arena size,
  whether the unit can run a given cart. A cart that does not fit falls back to the built-in default instead of
  freezing. The README lists several escape routes, including a power-on key that gives a headless USB rescue
  mode, and notes that it has no BLE MIDI. The simulator compiles the same application layer as the firmware. The
  release notes from 52257541 on report carts running on a real SMK-37 Pro. Since b26ac73a the same sources also
  build a package for the FM-1, tagged with the same release. The FM-1 build reads that device's key matrix, maps
  its 27 keys to the PICO-8 buttons (the release notes give E5 as O, G5 as X, and F5, F#5 or PLAY as Start) and
  reads the MASTER knob as master volume; it has no pads or faders. The README is still written around the SMK-37
  Pro and neither it nor the release notes say whether the FM-1 build was run on an FM-1 unit. The repository's
  own documentation is in Korean with an English toggle on the simulator page.
status: active
authors:
- name: LEE JAE HO (acidsound)
  url: https://github.com/acidsound
source: https://github.com/acidsound/picovave
source_status: open
license: unspecified
license_notes: >-
  No LICENSE file at the top level of the repository. It vendors femto8 (MIT), Lua and LodePNG, and its platform
  layer is copied from Makkuro37, which is GPL-3.0.
homepage: https://acidsound.github.io/picovave/
distribution: browser-installer
install_notes: >-
  Open the simulator page in Chrome or Edge to try it in the browser, then use its FLASH (USB) option to write the
  package over Web MIDI. The releases carry picovave-smk37.fwsc (also published as picovave.fwsc) for the SMK-37
  Pro and picovave-fm1.fwsc for the FM-1; choose the one for the connected device. Restoring needs your own
  official package for the device: SMK-37 Pro V016, or for the FM-1 M-VAVE's FM-1_015, which the repository does
  not include. Unofficial; install at your own risk. If the unit does not start, the README documents holding OCT-
  at power-on on the SMK-37 Pro for a USB rescue mode, and docs/RECOVERY.md covers mask-ROM recovery with
  jl-uboot-tool using tools/recover_smk37.py or tools/recover_fm1.py.
brick_risk: false
tags: [game, emulator]
