device: m-vave-smk-37
name: Polly SMK-37 (SergioBlaster)
summary: >-
  Polly arranger for the SMK-37 Pro that starts from genkigenki's port and puts the keyboard's own button names on the
  screen, adds help cards, three screen themes, a browser emulator of the SMK-37 and a local installer, with a Portuguese guide.
description: >-
  Starts from the smk37 branch of genkigenki's fm1-polly fork (Polly 0.4.1) and changes only the SMK-37 build, which sits behind
  the BOARD_SMK37 switch. The screen uses the labels printed on the keyboard (PATCH, SCALE, PARA, NOTE REPEAT, CHORD, GLOBE, BT, SEQ PLAY,
  SEQ REC, K2 to K8) instead of the FM-1's. Each knob column names its knob, holding KNOB BANK, FADER BANK or the arrow buttons for a
  second shows a help card, and there are light, dark and neon themes that are saved with the project. The repository adds an
  emulator that draws the SMK-37 panel and runs the same firmware in WebAssembly, a GitHub Actions workflow that builds and tests both
  boards, and a Windows launcher for a local web installer. The release package covers the Pro and the Starrykey 37 Play only; there is
  no Elite or MKE-P37 build and no QY70 style import. The README and guide are in Portuguese, with the English Polly README below.
