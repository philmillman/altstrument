source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only, as Polly. It also covers the Sonivox EAS synth (Apache-2.0), the Groove MIDI Dataset drum
  performances (CC BY 4.0) and the fonts (OFL 1.1). The repository commits its own built package, polly-smk37.fwsc (650,984
  bytes, git blob 180ad4643f5cefaa7892aa3a6c35b1581509fbb3), twice under smk37-extras; it is not an M-VAVE image, and the licensed
  SMK-37 Pro V16 file is not involved.
based_on: m-vave-smk-37/polly-smk37
distribution: download
install_notes: >-
  The release notes say genkigenki's web installer only writes the firmware in its own catalog, so this package goes in with the
  repository's local installer (smk37-extras on Windows, needs Python 3, in Chrome or Edge) or with tools/fm1_install.py. Turn Bluetooth
  off on the computer, unpair the SMK-37, and use a USB data cable. The README says the firmware never writes the calibration or
  Bluetooth areas and that M-UPGRADE with M-VAVE's SMK-37 Pro 016 package returns to stock. Unofficial and experimental; install at your own risk.
brick_risk: false
