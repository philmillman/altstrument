device: m-vave-smk-37
name: Polly SMK-37
summary: >-
  Charles Vestal's QY70-style pocket arranger Polly on the SMK-37: pads trigger sections, follow mode and
  16 chord progressions, faders mix the band, and the keys play chords and the selected instrument.
description: >-
  Lives on the smk37 branch of the genkigenki/fm1-polly fork and is offered upstream as
  charlesvestal/fm1-polly pull request 1, which is still open. It is Polly 0.4.1, in which a style plays an
  eight-instrument General MIDI band that follows your chords. The SMK-37 build has no QY70 style bank.
  The FM-1 build is unchanged and the SMK-37 code sits behind a BOARD_SMK37 switch. Releases carry one
  package each for the Pro, Elite and MKE-P37 names.
status: active
