license: GPL-3.0-only
license_notes: >-
  Same terms as Polly; LICENSING.md covers the Sonivox EAS synth (Apache-2.0), the Groove MIDI Dataset drum
  performances (CC BY 4.0) and the fonts (OFL 1.1).
homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with tools/fm1_install.py and a package from the
  release or your own build (BOARD=smk37, with MODEL=elite or MODEL=mke). Back up first and have M-VAVE's
  package for your model and its updater ready. The first start clears the stock settings and other
  firmware's data in the areas Polly uses. Unofficial; install at your own risk.
brick_risk: false
