device: m-vave-smk-37
name: Shine On SMK-37
summary: >-
  SMK-37 packages for the Pro, Elite and MKE-P37 in the Shine On releases: the string-machine firmware built for the
  keyboard's board layer. The licensing file says it is untested on an SMK-37.
description: >-
  The same string ensemble, register filters, phaser, delay, reverb, arpeggiator and sequencer (four sounds with a mixer from 3.0) as the FM-1
  version, built from the same repository with the SMK-37 board layer that OberVave took from genkigenki's reference port.
  Releases from 1.2.1 on each carry three packages that differ only in the model name they report, one for the SMK-37 Pro,
  one for the Elite and one for the MKE-P37, so that M-VAVE's updater still accepts that model's factory package. The
  repository's README and install text cover only the FM-1, and the SMK-37 layer is marked in LICENSING.md as untested on an SMK-37 in
  this firmware, so treat these as unverified builds. OberVave's SMK-37 page describes the same layer and its flash-safety rules.
status: active
authors:
- name: Sven Trogus (zvenson)
  url: https://github.com/zvenson
- name: genkigenki
  url: https://github.com/genkigenki
source: https://github.com/zvenson/shineon
source_status: open
license: GPL-3.0-only
license_notes: >-
  Stated in LICENSE and LICENSING.md. The SMK-37 board layer is by M. Geisler (genkigenki), from the sloop-fm1 smk37
  branch, on Felucca with SLOOP's changes, and LICENSING.md marks the SMK-37 parts of Shine On as untested on an SMK-37.
homepage: https://github.com/zvenson/shineon/releases
distribution: download
install_notes: >-
  Download the package for your model (shineon-<version>-smk37.fwsc for the Pro, -smk37-elite or -smk37-mke) from the
  release; the repository's tools/fm1_install.py is the installer for the FM-1 builds and these builds have no install
  page of their own. OberVave's SMK37.md is the closest guide: back up the whole flash first, since the SMK-37 keeps
  per-unit factory key, pad calibration and Bluetooth pairing data in flash that must not be overwritten, and install
  M-VAVE's factory package for your model with its own updater to go back. Do not use the FM-1 build.
brick_risk: false
tags: [synth-engine, fx, reverb, delay, sequencer, arpeggiator, midi, usb-midi]
versions:
- version: v3.5
  date: 2026-11-12
  url: https://github.com/zvenson/shineon/releases/tag/v3.5
  notes: Replaces auto-save with a MEMORY page of 8 slots, adds VIBE LINK and a USB backup of programs, patterns and settings. On the SMK-37, where there is no room for a second store, Shine On marks the store as its own and clears the other firmware's data instead of misreading it. The release carries packages for the SMK-37 Pro, Elite and MKE-P37.
- version: v3.0.1
  date: 2026-10-23
  url: https://github.com/zvenson/shineon/releases/tag/v3.0.1
  notes: Reports its own firmware identity so the Firmware Hub can tell it from other builds that shared 3.0's.
- version: v3.0
  date: 2026-10-23
  url: https://github.com/zvenson/shineon/releases/tag/v3.0
  notes: Four sounds with their own ensemble and phaser, a mixer with delay, reverb and drive sends and a master section, and patterns that keep their sounds and mix; 1.x settings and patterns carry over.
- version: v1.2.3
  date: 2026-10-19
  url: https://github.com/zvenson/shineon/releases/tag/v1.2.3
  notes: Packages shineon-1.2.3-smk37.fwsc, -smk37-elite.fwsc and -smk37-mke.fwsc.
- version: v1.2.2
  date: 2026-10-19
  url: https://github.com/zvenson/shineon/releases/tag/v1.2.2
- version: v1.2.1
  date: 2026-10-18
  url: https://github.com/zvenson/shineon/releases/tag/v1.2.1
  notes: First release with SMK-37 packages.
