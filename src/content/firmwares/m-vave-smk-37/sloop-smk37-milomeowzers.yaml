source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only (LICENSE, LICENSING.md), as upstream SLOOP. It lists msfa (Apache-2.0) and the Terminus
  font among third-party parts. The repository holds docs/firmware/sloop-2.8.1.fwsc, which is this project's own SLOOP
  build, not an M-VAVE image, and says no vendor material is included.
homepage: https://milomeowzers.github.io/sloop-smk37/
distribution: browser-installer
install_notes: >-
  Browser installer in Chrome or Edge over USB, where you pick your model and the matching package is written, or
  tools/fm1_install.py. The project asks for a full flash backup first, taken over the chip's mask-ROM UBOOT mode,
  because the calibration, Bluetooth pairing and key_mac are unique to each unit. The firmware and its loader write only an
  allow-list of flash ranges that excludes them. After two failed starts SLOOP opens a USB recovery screen where the
  installer can write a package again, and a third drops into UBOOT. M-VAVE's updater (M-UPGRADE) returns the keyboard to
  stock. Installing is at your own risk.
brick_risk: false
