device: m-vave-smk-37
name: SLOOP SMK-37 (multichannel audio and Mewcoder)
summary: >-
  SLOOP for the SMK-37 in two builds: one sends six stems to the DAW over USB audio with punch-in effects on each, the
  other adds a 20-channel vocoder and routed USB audio inputs.
description: >-
  This is a GitHub fork of isod89's sloop-fm1 that ports SLOOP to the SMK-37 Pro, Elite and MKE-P37, using genkigenki's
  SMK-37 board layer, and adds two builds of its own. The multichannel build is SLOOP 2.8.1 as a USB audio interface with
  six mono 24-bit channels (drums in four groups, the synths, the effects return), stem layouts, punch-in effects and
  sequencer effects (flip, loop back, ramp) on every stem, and a DAW mode with an editable CC map. Mewcoder, for the
  Elite only, is SLOOP 2.8.4 with a 20-channel vocoder modelled on the Sennheiser VSM201 and two routed USB audio
  inputs; to make room it drops the built-in samples and several engines. A pre-release, Mewcoder + Harmoniser, adds a
  three-voice harmoniser modelled on the Eventide H949 and is marked as early testing. The releases say the builds were
  tested on an SMK-37 Elite only. It is a separate line from the Snoop37 and SLOOP Pro entries.
