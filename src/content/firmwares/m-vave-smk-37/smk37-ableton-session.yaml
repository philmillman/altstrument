homepage: https://github.com/shalafidragon/smk37-ableton-session/releases/tag/v1.7
distribution: download
requires_stock: SMK-37 Pro stock firmware shown as v15 in Midi Suite (the tested version)
install_notes: >-
  Export your keyboard preset from Midi Suite first. Copy the SMK37_Custom folder from the release zip into Live's User Library
  under Remote Scripts, restart Live, and set a Control Surface row to SMK37_Custom with both input and output on SMK-37
  Pro-Private. Enable input Track for Private only, stay on pad bank 1 with the documented MIDI assignments, and keep Midi Suite
  closed during use. No keyboard firmware is changed; to stop, set the Control Surface to None or delete the folder.
brick_risk: false
