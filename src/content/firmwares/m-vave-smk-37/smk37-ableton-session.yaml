device: m-vave-smk-37
name: SMK37 Custom
kind: tool
summary: >-
  Ableton Live Remote Script that turns the SMK-37 Pro into a Session View controller on stock firmware, with clip launch, track and scene navigation, transport, selected-track faders and track-coloured RGB pads.
description: >-
  The script is a Python folder copied into Live's User Library. The top pad row launches the clip slots of eight tracks in
  the selected scene, and the bottom row holds play, stop, arrangement record, delete clip, arrangement loop, metronome,
  arm-follow-focus and undo. Knob 1 selects a track and knob 2 a scene, and the first four faders control the selected track's
  volume and sends A to C. Pad colours follow the track colour and the clip state. They are set by replaying the SysEx writes
  that M-VAVE's Midi Suite sends for the preset's RGB fields, one write per display tick, so a full repaint takes several
  seconds. The author reports that a static analysis of the stock v15 image traces these writes to RAM, and that colours reverted
  after power cycles; this is not a documented LED interface, and no save or firmware-update message is sent. It was tested on
  one SMK-37 Pro with Live 12.4.7 on macOS over USB. Windows, the Elite, other firmware versions and Bluetooth are untested. The
  author credits Codex with help in developing it.
