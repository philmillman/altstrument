install_notes: >-
  Open the page in desktop Chrome or Edge (Web MIDI with SysEx is not available in Firefox or Safari), close any DAW or MIDI monitor, and choose Connect SMK-37, or drop a backup .bin on the page. To run it locally use server.py. The tool only reads from the unit, and its Save .bin button downloads the calibration sector alone, so take a full flash backup before flashing other firmware.
