device: m-vave-smk-37
name: SMK-37 Calibration Inspector
kind: tool
summary: >-
  Browser tool that reads an SMK-37 Pro or Elite's factory calibration block over Web MIDI, or from a flash backup file, and charts the pad, key and pedal response curves against the stock defaults.
description: >-
  The calibration block, called USRTRIM, sits at 0xC1000 in the unit's flash. The page draws the 16 pad curves, the 37 key curves with a contact-delay axis and the pedal curve, each with five points, and marks curves that are not monotonic or that deviate from the stock defaults or from the other keys. It can read the block from the connected unit over USB MIDI, or open a 1 MiB backup made with M-Flasher or a 4 KiB dump, and it exports the block as a .bin, JSON, CSV or a C header. The code only sends identity, info, read and check commands and never builds erase or write frames, so it changes nothing on the keyboard. Where a firmware refuses raw flash reads, the README suggests m-bootloader's MIDI mode or loading a backup. It is served from GitHub Pages and can run from a local Python server. The author also makes NACHTBAR, FM-1 PIANO and NACHTFAHRT.
