device: m-vave-smk-37
name: smk37-firmware-custom-mod
summary: >-
  Patches to the stock SMK-37 Pro image for stable BLE-MIDI pairing with the Woovebox 3.0 (ESP32) and
  stable DAW use, plus a Windows OTA flasher and a dedicated low-latency ASIO driver.
description: >-
  v022 applies six binary patches (secondary advertising suppression, relaxed supervision timeout, Just
  Works bonding, unconditional BLE-MIDI notifications, fresh MAC key) to stock image SMK-37_Pro_016. It
  keeps USB MIDI and the official mobile app working. The repository also holds repack/unpack tools, a
  Windows ASIO driver with control panel, and a copy of the stock M-VAVE image, which this catalog does
  not link.
status: active
authors:
- name: amalahama
  url: https://github.com/amalahama
source: https://github.com/amalahama/smk37-firmware-custom-mod
source_status: patcher-only
license: MIT
license_notes: >-
  MIT covers the author's tools, driver and docs. The distributed .fwsc is a modified M-VAVE image and
  the bundled stock image is M-VAVE's.
distribution: download
requires_stock: Stock SMK-37 Pro 1.16 (SMK-37_Pro_016)
install_notes: >-
  Windows only: run flash_v022.bat or smk_ota_win.py from the release package with the keyboard on USB
  and DAWs closed. Targets the SMK-37 Pro.
brick_risk: false
tags: [patch, midi, usb-audio, flasher]
versions:
