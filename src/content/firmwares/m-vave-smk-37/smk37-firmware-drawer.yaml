source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only for the app code and the LICENSE file is GPL version 3. Re-hosted firmware keeps its authors' licences, which THIRD_PARTY_NOTICES.md says are GPL-3.0-only for Frodhes and OberVave with component notices in each LICENSING.md. The Korean porting summaries adapt material from genkigenki's fm1-to-smk37 that is CC BY-NC 4.0 and stay under that licence.
homepage: https://thegreatcjpark.github.io/SMK37-Firmware-Drawer/
distribution: browser-installer
install_notes: >-
  Open the Pages site in Chrome or Edge, or run Start-Drawer.cmd on Windows for a local copy at 127.0.0.1:4173. Pick the model, make a full backup first as the README advises, check the package and press install. The author marks USB writing, sound and Android USB as not verified on real hardware, and the +VA route needs the Windows helper and a stock V016 start.
brick_risk: false
