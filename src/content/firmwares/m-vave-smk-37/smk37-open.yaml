device: m-vave-smk-37
name: SMK37 Open (official open firmware and SDK)
summary: >-
  M-VAVE's own open-source firmware for the SMK-37 Pro and Elite: GPL application source, a binary-only sound
  engine library, build tools and a browser workbench with a simulator, editor and USB flasher.
description: >-
  SMK37 Open turns the keyboard into an eight-track instrument with DX7 FM, 303, 808, PSG, plucked-string and
  sample engines, sequences of 16 to 64 steps, arpeggiators, chords, parameter locks, effects and 16 project
  slots. It holds a 128-voice DX7 library with SysEx import and export, per-track PROJECT, LIVE or OFF modes,
  step and real-time recording, per-pad aftertouch and MIDI routing over USB, Bluetooth and DIN output. M-VAVE
  publishes it as the SMK-37 counterpart of FM1 Open and reuses its code base: the repository holds the
  application source with the board drivers in app/board/, the web build of the synth and the SDK. The sound
  engine is the binary library sdk/lib/libfm1_engine.a. Firmware builds need Windows, PowerShell and JieLi's
  PI32v2 clang toolchain, and the Pro and Elite use separate packages from the same sources. The SDK also bundles
  M-VAVE's stock V16 images for both models as recovery firmware (sdk/firmware/).
status: active
authors:
  - name: M-VAVE
    url: https://github.com/m-vave
source: https://github.com/m-vave/smk37_open
source_status: open
license: GPL-3.0-only
license_notes: >-
  GitHub reports no license for the repository because LICENSE.md is GPL-3.0-only with an additional section 7
  permission to link with the binary SDK. The engine library sdk/lib/libfm1_engine.a is proprietary with no
  source; THIRD_PARTY.md permits using, linking and redistributing it, and the stock V16 recovery images in
  sdk/firmware/ (SMK37-Pro-V16.fwsc and SMK37-Elite-V16.fwsc), in binary form for M-VAVE SMK-37 Pro and Elite
  devices only. The boot files in sdk/tools/pack/ are Apache-2.0. Third-party parts keep their own licenses
  (Open303, DaisySP, stmlib, emu2149 and SEA are MIT; MSFA/Dexed is Apache-2.0; micro-ecc is BSD-2-Clause; JieLi
  SDK material keeps its upstream terms).
homepage: https://open.m-vave.com/smk37-workbench
distribution: browser-installer
requires_stock: SMK-37 Pro or SMK-37 Elite; pick the workbench for the physical model
install_notes: >-
  The workbench page simulates the firmware in the browser, edits it, and flashes it over USB in desktop Chrome or
  Edge with MIDI and SysEx permission. Migrating from the production firmware uses a force mode, and the loader
  asks you to confirm the physical model because the Pro and Elite packages are not interchangeable. Back up
  projects, voices and samples first; the license warns that firmware defects can cause data loss or device
  malfunction. The workbench has a Restore factory V16 option that writes the unmodified stock V016 package for
  the matching model, and an offline copy of the workbench can be built from the source.
brick_risk: false
tags: [official, sdk, sequencer, sampler, fx, open-source]
