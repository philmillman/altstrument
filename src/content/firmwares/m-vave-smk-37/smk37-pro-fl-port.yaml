  date: 2026-10-15
  url: https://github.com/kritonpc/smk37-pro-fl-port/releases/tag/v0.1.2-experimental
  notes: Fixes knobs jumping to the limits by correcting the profile's encoder value; the firmware stays build 916.
- version: v0.1.1-experimental
  date: 2026-10-15
  url: https://github.com/kritonpc/smk37-pro-fl-port/releases/tag/v0.1.1-experimental
  notes: Profile and script fixes for keyboard notes, left and right buttons and SEQ PLAY; firmware unchanged.
- version: v0.1.0-experimental
  date: 2026-10-15
  url: https://github.com/kritonpc/smk37-pro-fl-port/releases/tag/v0.1.0-experimental
  notes: First release, firmware build 916.
