device: m-vave-smk-37
name: SMKSYNTH
summary: >-
  Performance firmware for the SMK-37 Pro and Elite that pairs OberVave's analog synth with the DRUM-X drum engine on four
  parts, with favourites, split and layer, a four-track sequencer, 16 scenes and a browser simulator.
description: >-
  Each of four parts plays either the OberVave ANALOG synth on eight shared voices or the DRUM-X drum engine
  adapted from JIANT with eight instruments per kit. The pads work as banks for part selection and sends, eight
  favourite sounds, split and layer setups, 16 saved patterns or scenes and drum hits with velocity. The sequencer
  has four tracks of up to 256 steps with live or step recording and keyboard transposition. The factory content is five
  patterns and eight favourites by the author, and the README says no third-party samples are included. A browser
  simulator runs the same C code, and there are pages for backup and restore. Version 1.0.2 brings back stereo USB audio at 44.1 and 48 kHz, 1.0.3 adds a SUPER oscillator type to the ANALOG engine: seven detuned saws per oscillator with separate detune and mix, adapted from the supersaw in Clipper and bypassing sync and cross-modulation while it is on. Version 1.1.0 adds MIDI output over USB and TRS with a channel per part, pitch bend and mod wheel, a sustain pedal input and a MIDI panic, and one installer for the Pro and the Elite.

  The README says ChatGPT generated and revised the adaptation code, web tools and documentation under the author's
  direction. The author reports testing the earlier DP2 build on a real SMK-37 Pro and confirming the first USB
  install of 1.0.0 on the instrument after publication. The V016 to 1.0.0 path was also tested on simulated flash
  with interruptions. The manual and pages are in Portuguese and English.
status: active
