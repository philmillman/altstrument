  notes: Adds a SUPER oscillator type to ANALOG, with seven saws per oscillator and separate DETUNE and MIX on a new page. The update package keeps the saved bank of 1.0.x and of the earlier SUPER test builds, but older firmware cannot read SUPER sounds.
- version: v1.0.2
  date: 2026-11-05
