versions:
- version: v1.1.0
  date: 2026-11-12
  url: https://github.com/4t59m4f784-creator/SMKSYNTH/releases/tag/v1.1.0
  notes: Adds MIDI output on USB and TRS with a base channel and a channel per part, pitch bend and mod wheel, a sustain pedal input and a MIDI panic (GLOBE + PLAY), and fixes notes that stuck after switching from POLY or DUAL to MONO or UNISON. One installer now covers the SMK-37 Pro and Elite, with separate first-install and update packages per model. The update packages keep the saved bank; the notes advise exporting a backup first. The MIDI output sends no clock, start or stop. The notes say the MIDI was tested on a Pro and the Elite install path by a user.
- version: v1.0.3
  date: 2026-11-05
  url: https://github.com/4t59m4f784-creator/SMKSYNTH/releases/tag/v1.0.3
  notes: Adds a SUPER oscillator type to ANALOG, with seven saws per oscillator and separate DETUNE and MIX on a new page. The update package keeps the saved bank of 1.0.x and of the earlier SUPER test builds, but older firmware cannot read SUPER sounds.
- version: v1.0.2
  date: 2026-11-05
  url: https://github.com/4t59m4f784-creator/SMKSYNTH/releases/tag/v1.0.2
  notes: Stereo 16-bit USB audio at 44.1 and 48 kHz, tested on a Mac and an iPhone. The notes warn that iPhone video recordings made over USB audio may contain clicks and dropouts.
- version: v1.0.1
  date: 2026-11-04
  url: https://github.com/4t59m4f784-creator/SMKSYNTH/releases/tag/v1.0.1
  notes: Adds a GLOBAL fader mode, JUMP or CATCH, makes relative encoders ignore invalid transitions and stale deltas, adds an update package that keeps the saved bank beside the first-install package, and removes the development diagnostics. USB carries MIDI, backup and updates, with audio from the physical output.
- version: v1.0.0
  date: 2026-11-02
  url: https://github.com/4t59m4f784-creator/SMKSYNTH/releases/tag/v1.0.0
  notes: First public release, with the SMK-37 Pro package, source archive, manuals and checksums.
