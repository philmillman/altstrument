  notes: Stereo 16-bit USB audio at 44.1 and 48 kHz, tested on a Mac and an iPhone. The notes warn that iPhone video recordings made over USB audio may contain clicks and dropouts.
- version: v1.0.1
  date: 2026-11-04
  url: https://github.com/4t59m4f784-creator/SMKSYNTH/releases/tag/v1.0.1
  notes: Adds a GLOBAL fader mode, JUMP or CATCH, makes relative encoders ignore invalid transitions and stale deltas, adds an update package that keeps the saved bank beside the first-install package, and removes the development diagnostics. USB carries MIDI, backup and updates, with audio from the physical output.
