source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md states GPL-3.0-only for the firmware and the adaptations. OberVave is GPL-3.0-only and the JIANT DRUM-X
  adapter is stated to be GPL-3.0-only with the original notices kept; the JIANT repository's licence is GPL-3.0. The SUPER
  oscillator (1.0.3) adapts the detune curve of Clipper, itself on Felucca, and the repository's CREDITS.md and LICENSING.md keep its GPL-3.0-only notices. The
  Terminus font is SIL OFL 1.1, and the JieLi SDK files are read from your own SDK checkout at build time. The
  committed packages are SMKSYNTH's own builds and match none of M-VAVE's licensed images by size or blob hash, and
  the README states that M-VAVE's firmware is not redistributed.
homepage: https://4t59m4f784-creator.github.io/SMKSYNTH/
distribution: browser-installer
requires_stock: SMK-37 Pro official V016 (identity SMK-37 Pro_016)
install_notes: >-
  A first-install package for an SMK-37 Pro running M-VAVE's official V016 only; the installer refuses the Elite,
  MKE-P37, FM-1, other versions and other firmwares. Get V016 for the Pro from M-VAVE's download page and install
  it with M-UPGRADE, then use the browser installer in Chrome or Edge over USB and wait for the new identity
  SMK-37 Pro_19618. It resets the bank to the factory content and does not keep a previous SMKSYNTH bank, so export
  it first. An interrupted transfer resumes with the same browser and package. Return to M-VAVE firmware as the
  installation guide describes.
brick_risk: false
