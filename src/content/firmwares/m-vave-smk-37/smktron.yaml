device: m-vave-smk-37
name: SMKTRON
summary: >-
  Mellotron-style tape firmware for the SMK-37 Pro, adapted from FMEL-1: flute, choir, cello and violin tapes with
  layers, chord pads, a sequencer, a granular mode, tape wear, vibrato, Leslie, echo and reverb.
description: >-
  Rights warning: the four tape banks are Mellotron recordings by Bernie Kornowicz (Taijiguy), whose own statement
  allows use but excludes commercial software for profit, so they are not GPL and the packages must not be sold.

  Derived from AntonioAltea's FMEL-1 through genkigenki's SMK-37 port, with the interface and controls reworked for
  performance on the SMK-37 Pro. Patch and layer screens show a tape machine. A GRAIN page has four modes (free,
  mist, pulses and fragments) with size, spread, density and mix, the modulation wheel opens vibrato, and a knob bank
  moves between performance controls, favourites and chord pads. The chord pads can record and hold chords, and the
  sequencer is kept while the arpeggiator is removed. The screen has light, dark and zoomed looks. The reverb is adapted
  from OberVave. The README says ChatGPT and Codex helped write the adaptations, web pages and documentation under the
  author's direction, and that native builds and simulator checks passed but no physical test is claimed for the
  V016-only installer. The site, simulator and installer are in Portuguese and English.
status: active
authors:
