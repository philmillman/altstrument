source: https://github.com/4t59m4f784-creator/SMKTRON
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only for the derived code and the root LICENSE is the GPL-3.0 text. The tape samples are
  not GPL: web/CREDITOS.md records the author's 2021 statement allowing use but excluding commercial for-profit
  software, and claims neither public domain nor a Creative Commons licence. The Violins bank comes from Taijiguy's
  MkII set. The committed packages are SMKTRON's own builds (651,266 bytes) and match none of M-VAVE's licensed
  images; the installer asks for your own V016 file and the project does not redistribute it.
homepage: https://4t59m4f784-creator.github.io/SMKTRON/
distribution: browser-installer
requires_stock: SMK-37 Pro official V016 (identity SMK-37 Pro_016)
install_notes: >-
  A first-install package for an SMK-37 Pro running M-VAVE's official V016 only; the installer checks the file you select
  and the model, and refuses other models and firmware. Use M-UPGRADE to return to V016 first, then the browser installer
  in Chrome or Edge on desktop over HTTPS with a USB data cable, with other MIDI software closed, and look for 0.3.0-gr3
  at boot. Note your settings first, since new records use a format the earlier AT2 version cannot read.
brick_risk: false
