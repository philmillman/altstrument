homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37 in Chrome or Edge, or with tools/fm1_install.py and the
  package for your model. Holding OCTAVE- and OCTAVE+ for five seconds starts update mode, and two crashes shortly
  after power-on do the same. To go back, install M-VAVE's own firmware for your model with M-VAVE's updater.
  Unofficial; install at your own risk.
