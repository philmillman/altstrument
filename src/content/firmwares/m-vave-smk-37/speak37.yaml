device: m-vave-smk-37
name: Speak37
summary: >-
  Speech synthesizer in the style of a talking toy: each key speaks the next word of a sentence at the key's pitch,
  with sung songs, a beatbox kit, an 808 rhythm section and a robot character named MOPE. It runs on the FM-1 too.
description: >-
  An LPC engine with a ten-stage lattice filter decodes TMS5220-style frames, and the word data is generated at
  build time with espeak-ng; no Texas Instruments vocabulary is used. Chords speak the same word in harmony. It
  has nine voices, sentence banks in several languages with traditional songs and jokes, a sentence editor, a
  PLAY mode that speaks the sentence in time over sixteen drum grooves, and delay and reverb. The drums are
  a fixed-point port of the 808 voices from M-VAVE's FM1 Open (MIT). MOPE comments on what you play. The platform layer is
  Felucca's. Packages are built for the Pro, Elite, MKE-P37 and the FM-1. The README asks for feedback on the
  FM-1 controls. The project site has a browser simulator.
