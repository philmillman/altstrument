device: m-vave-smk-37
name: Telegram 101 Elite
summary: >-
  Performance firmware for the SMK-37 Elite only: a Conductor that cues songs and setups on the bar, an SH-101-style lead voice, a TB-303-style bass voice and a synthesized 808 with a phrase and band library.
description: >-
  Rights warning: the Band presets and phrase data carry material from the BB1 catalogue, which names song and rhythm-box patterns, and
  the Dillo phrase bank includes 205 parts from Acid Tabs and Acid Voice. THIRD_PARTY.md and ACID-PARTS-PERMISSION.md rest the distribution on the
  project owner's own permission statement of 10 November 2026, credit Acid Tabs under CC BY-SA 4.0 where the source says so, and assert no open licence for the Acid Voice parts. The screen type is a generated subset of
  the Picnic Filled font with no licence asserted.

  The firmware has four parts. Conductor launches songs and saved setups aligned to the bar. Telegram is the lead voice, with sounds, phrases, arpeggiator and glide. Dillo is the bass voice, with
  accents, slides and phrases. One synthesized 808 offers 16 sounds, rhythms and kits. The library adds Telegram and Dillo phrases, Acid Duets and 1,056 Band preset bars, and keyboard focus can move between Telegram and Dillo while playing. The
  README says it is meant for the Elite and not for the FM-1, SMK-37 Pro or SMK-37 MKE. Its Dillo, Conductor and 808 parts share a lineage with the BB1 firmware for the FM-1. The build 799 timing figures in the release notes come from one unit.
  The README claims no procedure for first install from stock firmware.
status: active
authors:
