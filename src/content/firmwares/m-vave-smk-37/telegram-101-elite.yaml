  url: https://github.com/TexasRADIO
source: https://github.com/TexasRADIO/smk37-elite-firmware
source_status: open
license: GPL-3.0-only
license_notes: >-
  The README states GPL-3.0-only for the firmware and the LICENSE file is the GPL v3 text. Retained M-VAVE SMK-37 Open sources are GPLv3 with the section 7
  linking permission, Big Beat and Felucca-derived code is GPL-3.0-only, and JieLi package parts are Apache-2.0. DaisySP, Rings,
  msfa, Fukiai and fonts keep their own terms. The music data is not all GPL; see the rights warning. The repository holds the project's own
  builds (dist/ and packages/ .fwsc files, 651,500 bytes) and no M-VAVE stock image, and none of its files match the licensed V16 blobs.
based_on: m-vave-fm-1/bb1
distribution: download
requires_stock: An SMK-37 Elite already running a compatible Telegram or Conductor build
install_notes: >-
  Build 799 is for the SMK-37 Elite only. The supported update is the routine USB-MIDI route in INSTALL.md, run from a unit that already has
  a compatible Telegram or Conductor build: tools/elite_update.py binds to the unit's USB location, checks the package hash and recovery sector,
  and confirms the build after reboot. The README does not claim a first install from stock firmware or other custom firmware. Build 797
  is kept as a verified rollback package. The recovery route is holding FADER BANK while powering on, which the author proved on the test unit, and the
  README says to confirm it on yours first.
brick_risk: false
