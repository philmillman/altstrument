device: m-vave-smk-37
name: TLBX-1 Animate
summary: >-
  Vector wavetable synth for the SMK-37 Pro, ported from the Animate engine of the TLBX-1 desktop app and plugin: four wavetable slots, a 289-wave bank and a ten-lane 128-step sequencer.
description: >-
  Rights warning: the 289-wave bank is built from Korg MS2000 and DWGS single-cycle waves, 200 Access Virus wavetables and 15 "Spectral Growl" tables, and LICENSING.md says no licence to
  any of them is granted, that the Spectral Growl source is not yet confirmed and that the maintainer should settle it before publication. Packages built from the repository embed that bank and the stock firmware's protected bytes.

  Animate is the only engine. Each of four slots, A to D, plays a wavetable, with vector X and Y modulation between them, five filter modes, wavetable LFO sync and its own randomization. The sequencer has ten
  lanes of 128 steps over eight pages, and the keys support hold, arpeggio and repeat, scale and chord mapping, and 1 to 16 voices. Sixteen factory sounds with sequences and 16 patch slots in
  browser storage or a flash bank on the unit are included. A browser simulator runs the same C runtime as the hardware build. The sound is taken from the Melodee adaptation of Animate, and the code builds on Melodee, itself a
  modified Felucca. The README says the owner confirmed the 2026-11-07 build runs on the unit, that overload in some factory sequences is
  open, that full device project saving and TRS MIDI are missing, and that it is not complete desktop parity.
status: active
authors:
