  url: https://github.com/MMI-Studios
source: https://github.com/MMI-Studios/tlbx1-animate-smk37
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSE is the GPL v3 text and LICENSING.md names GPL-3.0-only for the firmware, which builds on Melodee (GPL-3.0-only). Melodee's own parts such as DaisySP and
  reSID keep their licences, and FunDSP code in an unbuilt reference file is MIT. The sound data listed in the rights warning is not covered.
based_on: m-vave-smk-37/melodee-smk37
distribution: source-only
requires_stock: M-VAVE SMK-37 Pro firmware V016, which the builder downloads from M-VAVE for packaging
install_notes: >-
  Build with tools/build.py after fetching the JieLi pi32v2 toolchain (Linux x86-64 or WSL, Python, Node, Zig for the simulator). Packaging needs the
  SMK-37 Pro V016 file from M-VAVE's download page, placed in assets/stock and checked by hash; it is not in the repository. Install the resulting
  update with the browser updater in web/update.html, which needs a unit already running a compatible Melodee or Animate loader. The docs say an interrupted application
  write can need a hardware recovery adapter and that no software-only recovery guarantee exists. Back up the unit first.
brick_risk: false
