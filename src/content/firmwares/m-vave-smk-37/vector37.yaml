homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with tools/fm1_install.py and a package you
  build. Installing clears another firmware's stored data on the keyboard. To go back, install the stock
  firmware the same way; holding OCT- at power-on starts a rescue mode. Unofficial; install at your own risk.
