device: m-vave-smk-37
name: Vector37
summary: >-
  Orbiting overtone synth written for the SMK-37 Pro: a sun runs along a path and a moon circles it, and the
  moon's position mixes four planets, each a pair of overtone generators with a filter.
description: >-
  Inspired by the Beetlecrab Vector. It has one orbit screen, a sound list with two factory banks and a USER bank for your own sounds, switched with the < and > keys. The pads
  and knobs act as the four planets, and the four faders set the path's family, size, speed and morph.
  The 3.5 mm jack sends the keys and wheels as MIDI out. The board layer comes from SLOOP, which is based
  on Felucca, and the master stage follows Melodee. The project site has a browser simulator, and an FM-1 build
  is listed there as an untested beta.
