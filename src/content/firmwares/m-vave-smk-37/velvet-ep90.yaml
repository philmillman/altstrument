source_status: open
license: GPL-3.0-only
license_notes: >-
  The README and docs/LICENSING.md state GPL-3.0-only for the firmware, tools, presets and demos, and LICENSE is the
  GPL-3.0 text. Skiff by illuminus5, Felucca, msfa (Apache-2.0) and the fonts keep their notices in the pinned
  source and the corresponding-source archive, and the SMK-37 port credits genkigenki. No commercial ROM, factory bank or
  song recording is used. The committed .fwsc is the project's own build (651,975 bytes) and matches none of M-VAVE's
  licensed images.
distribution: download
requires_stock: SMK-37 Pro official V016
install_notes: >-
  For the SMK-37 Pro only, not the Elite, MKE or Starrykey. The guide asks for official V016 as upstream Skiff does, a
  double read-back of the 1 MiB flash for a backup, a check against dist/SHA256SUMS, and an explicit file path with
  fm1_install.py rather than the upstream web page, which would install plain Skiff. It warns that the project did not
  try recovery, and that running M-VAVE's own loader from Skiff may disturb calibration data. Reaching the sounds is
  through the FM6 preset browser, since changing only the patch slot keeps the previous effects.
brick_risk: true
