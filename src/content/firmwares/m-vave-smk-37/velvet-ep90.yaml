device: m-vave-smk-37
name: Velvet EP 90
summary: >-
  Skiff fork for the SMK-37 Pro that swaps the FM6 bank for eight original electric-piano presets aimed at 1990s ballad
  sounds, with the sample content removed. A first alpha package; not tried on hardware.
description: >-
  Replaces Skiff's FM6 sound bank with eight presets, F1 to F8: Velvet 90, Glass Ballad, Midnight Soft, Silk Chorus,
  Studio Dry, Warm Tines, Bell Touch and Slow Jam. A new project starts on Velvet 90, while saved projects can keep their
  own patches. The FM engine is limited to six notes per track, shared with the other tracks' voices, so stacking chords
  with the pedal can cut earlier notes. The same presets are published as SysEx files without effects, and sixteen WAV
  demos are rendered from the firmware's own C code rather than recorded on a keyboard. The repository also holds the
  measurement tables behind the tuning and a list of 28 research sources, which the README says are not a statistical
  sample. The upstream recordings and AI-generated loops are removed from this build, SLICE slots are filled with silence,
  and the SAMPLE piano and wind sets and the SLICE break and funk material are not in it. The README says no real device
  was used to check installation, latency or output, and that listening comparisons and hardware tuning remain. The
  README and guide are in Korean.
