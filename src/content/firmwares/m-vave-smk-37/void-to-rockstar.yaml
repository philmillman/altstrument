distribution: download
requires_stock: Stock SMK-37 Elite firmware; Ableton Live 12
install_notes: >-
  Download smk37-kit-0.11.0.zip from the release and follow INSTALL.en.md, which covers the Max for Live device, the
  control surface folder and the Bluetooth bridge. Nothing is written to the keyboard's firmware.
