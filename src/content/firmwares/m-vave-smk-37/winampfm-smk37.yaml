- name: hericdk (winampFM)
  url: https://github.com/hericdk
source: https://github.com/genkigenki/winampFM/tree/smk37
source_status: open
license: GPL-3.0-only
license_notes: >-
  Same terms as winampFM; firmware/LICENSING.md, inherited from Felucca, keeps the icon atlas and panel image
  under separate terms and carries a section 7 additional permission.
homepage: https://genkigenki.github.io/smk37/
distribution: browser-installer
install_notes: >-
  Installs from the browser at genkigenki.github.io/smk37, or with firmware/tools/fm1_install.py and a package
  from the release or your own build (BOARD=smk37, with MODEL=elite or MODEL=mke). Back up the whole flash
  first as SMK37.md advises, and have M-VAVE's package for your model and its updater ready. The first start
  clears the stock settings and other firmware's data in the shared data area. Unofficial; install at your
  own risk.
brick_risk: false
