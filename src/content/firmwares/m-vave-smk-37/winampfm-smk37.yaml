device: m-vave-smk-37
name: winampFM SMK-37
summary: >-
  hericdk's Winamp 2.x-style SLOOP fork on the SMK-37: the pads show the selected track's loop in its colour,
  and the knob and fader banks switch between pad sounds, level, filter, reverb and delay.
description: >-
  Lives on the smk37 branch of the genkigenki/winampFM fork and is offered upstream as hericdk/winampFM pull
  request 1, which is still open. It is winampFM 0.1, built on SLOOP: a player window, a sound playlist,
  effect sliders and a visualizer. The FM-1 build is unchanged and the SMK-37 code sits behind a BOARD_SMK37
  switch. The project's 3D simulator can also be built for the SMK-37. Releases carry one package each for the
  Pro, Elite and MKE-P37 names.
status: active
authors:
