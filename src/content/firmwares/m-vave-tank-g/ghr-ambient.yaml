device: m-vave-tank-g
name: GHR AMBIENT
summary: >-
  Replacement firmware for the Tank-G v2 that turns it into an ambient instrument with a granular cloud that freezes or follows the guitar, a long reverb, a dark smear echo and tape warble. Windows installer; backs up the pedal first.
description: >-
  The firmware replaces the Tank-G's effects with one ambient engine and keeps the panel labels with new meanings. Footswitch A
  freezes the last seconds into a granular cloud or, held, makes the cloud follow live playing, while a bender occasionally adds
  half speed, reversed, double speed, tape stop or repeated clones. B sets a reverb from 1.5 seconds to a minute or, held, fades
  out the dry signal, C is a dark echo that notes swell into, and D adds tape-style pitch drift. Knobs set cloud level, grain
  size, drift, rot speed, pitch intervals, tone and input level, and a compressor, EQ and hiss reducer are always on. The
  Windows installer, a set of scripts with its C# source, downloads JieLi's USB loader at a fixed commit and checks its hash,
  reads the whole flash twice into a backup folder, writes only the firmware area and verifies every sector, and has scripts
  to restore the factory firmware from that backup and to read a status report of levels and CPU load. The repository
  holds only the project's own 24764-byte application, which the README says is built from the committed source, and none of M-VAVE's code.
  Its USB-MIDI driver derives from Felucca. The author made it on one Tank-G v2 with factory firmware 097, calls it a
  hobby project and says it is not affiliated with M-VAVE.
