license: GPL-3.0-only
license_notes: >-
  LICENSING.md and the README state GPL-3.0-only. The USB-MIDI files tg_usb.c and tg_usb_hw.h are Leo Kuroshita's, taken from
  Felucca by way of MOTES and also GPL-3.0-only. JieLi's loader is downloaded, not included, and kagaimiq's notes and
  jl-uboot-tool (MIT) were only used as references.
distribution: download
requires_stock: Tank-G v2, tested on factory firmware 097
install_notes: >-
  Windows 10 or 11 only. Download the repository ZIP, open the folder GHR AMBIENT 0.11 for Windows, connect the powered-on
  pedal over USB and run 2_INSTALL.bat, which backs up the flash into a backup folder before writing and asks you to type
  INSTALL. Keep that folder: 3_RESTORE_FACTORY.bat puts the factory firmware back from it. Only the firmware area
  (0x4000 to 0x7AFFF) is written; the bootloader is never touched, so an interrupted install leaves the pedal in its USB
  loader and the install or restore can be run again, and holding footswitch A while plugging in enters the loader by hand.
brick_risk: false
