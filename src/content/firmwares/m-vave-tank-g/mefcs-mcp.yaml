    url: https://github.com/cayocan
source: https://github.com/cayocan/mefcs-mcp
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT. The tool depends on M-VAVE's own mefcs_ks_bridge.exe from a separate M-EFCS install, which is not included.
distribution: source-only
install_notes: >-
  Clone the repository, run npm install and npm run build, and register dist/src/server.js as a stdio MCP server in the AI client, with MEFCS_BRIDGE_PATH pointing at mefcs_ks_bridge.exe in the M-EFCS folder if it is not found automatically. Close M-EFCS before using a pedal tool. Preset and slot writes overwrite stored data, so keep the automatic backups; nothing is written to the pedal's firmware.
brick_risk: false
