device: m-vave-tank-g
name: mefcs-mcp
kind: tool
summary: >-
  MCP server for Windows that lets an AI assistant read and edit the Tank-G's 36 presets, upload NAM A2 amp captures and cab impulse responses, and fetch tones from TONE3000, using the USB helper that ships with M-EFCS.
description: >-
  mefcs-mcp exposes the Tank-G to any MCP client over stdio, such as Claude Desktop, Claude Code, Cursor, VS Code Copilot agent mode, Gemini CLI or Codex. It speaks the same USB SysEx protocol as M-VAVE's M-EFCS editor, documented from reverse engineering in docs/PROTOCOL.md, by spawning the mefcs_ks_bridge.exe helper from an installed M-EFCS, so nothing is installed on the pedal. The tools read all presets or the live preset, switch presets and bypass, edit amp slot, gain, EQ, volume, gate, modulation, delay and reverb settings, cab slot and LED colour, tweak the active preset without saving, and export and import .atkg preset files. They also upload a NAM A2 .nam capture, converted to the A2 Lite format as M-EFCS does, to one of nine amp slots, and a .wav impulse response, resampled to 44.1 kHz, to one of eight cab slots, and can search and download models from TONE3000 and install one in a single step.

  Preset edits and imports back up all 36 presets first and imports are read back and verified. Firmware update, repair and factory restore are deliberately not implemented, and writes are checked against an address allow-list. The pedal accepts one program at a time, so M-EFCS has to be closed while it is in use. It needs Windows 10 or 11, Node.js 20 or newer and an installed M-EFCS. The README is in English and Portuguese and says the project is unofficial and not affiliated with M-VAVE or TONE3000.
status: active
authors:
