device: m-vave-tank-g
kind: tool
name: MultiFX Editor
summary: Linux desktop editor for the Tank G that reads and writes its 36 presets and edits the amp, mod, delay, reverb, IR cab and noise gate modules, with a tuner, LED colour and JSON import and export.
description: >-
  An Electron app that talks to the pedal through amidi over USB and keeps the editor and the pedal in sync both ways.
  It shows the 36 presets in nine banks of four slots and edits each module, with a model list for the amp and a
  cabinet list for the IR block, plus bypass, tuner and LED colour controls. Presets can be exported and imported as
  JSON, the interface is in English and Brazilian Portuguese, and a diagnostic command-line script is included. The
  README says the protocol is not documented by M-VAVE and advises backing up presets with the official app first. The
  repository includes a CLAUDE.md file for AI coding assistants. It does not flash firmware.
status: active
