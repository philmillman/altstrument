homepage: https://github.com/rmsramos/multifx-editor
distribution: download
install_notes: >-
  Download the AppImage from the release page, make it executable and run it with the pedal connected over USB. It needs
  alsa-utils for amidi and either membership of the audio group or the udev rules from scripts/setup-udev.sh. Back up
  presets with the official app first, because the editor writes to the pedal's memory.
brick_risk: false
