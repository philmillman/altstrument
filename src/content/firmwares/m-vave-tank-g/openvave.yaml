device: m-vave-tank-g
name: openvave
kind: tool
summary: Python library and command-line tool that talks to a Tank-G over Bluetooth LE, identifies it, reads its preset, global settings and status as decoded fields, backs up the stored presets, writes fields to the edit buffer and, behind an unsafe flag, saves and restores presets.
description: >-
  The project documents the pedal's Bluetooth protocol and ships a library plus an openvave command. The info command
  identifies the pedal and its firmware, preset dump prints the 21 bytes of the loaded preset with each byte named,
  ranged and marked confirmed, observed or hypothesis, and watch polls the pedal and prints every byte that changes
  while a control is moved, which is how the byte map was built. Captures of those sessions from firmware 96 are
  committed to the repository. Release 0.3.0 added a backup command for the 36 stored presets and a restricted set of
  writes to the live edit buffer (set for the knob block, block switches and the footswitch LED colour, and preset
  select), each with a dry-run option and a read-back check. Release 0.4.0 lets set change several fields over one
  connection in normal mode, adds preset reload, bypass and loopback, and adds preset save and preset restore, which
  write stored presets only with an unsafe flag and after an automatic, verified backup. The block switches and LED
  colour are marked observed rather than confirmed, so they need an experimental flag. It has been
  tested on macOS with firmware 96; Linux and Windows are untested. The project says it is not affiliated with M-VAVE.
status: active
authors:
  - name: Gustavo Marques
    url: https://github.com/gustavolima00
source: https://github.com/gustavolima00/openvave
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Needs Python 3.11 or newer and a Bluetooth adapter. Install with uv or pip from the GitHub repository, close the
  M-VAVE phone app first because the pedal accepts one BLE connection at a time, and on macOS allow Bluetooth for the
  terminal app. Firmware versions other than 96 print a warning.
brick_risk: false
tags: [research, ble, protocol, python, cli, library, presets]
versions:
  - version: v0.4.0
    date: 2026-11-18
    url: https://github.com/gustavolima00/openvave/releases/tag/v0.4.0
    notes: First release that can change stored presets. Edits work without edit mode and several fields can be set over one connection, preset reload discards edits, bypass and loopback toggle volatile state, and preset save and restore write stored presets only with an unsafe flag after a verified backup. The notes say every new message was first sent on the author's own pedal with firmware 96.
  - version: v0.3.0
    date: 2026-11-17
    url: https://github.com/gustavolima00/openvave/releases/tag/v0.3.0
    notes: First release that writes to the pedal, and only to the edit buffer. Adds preset backup of the 36 stored presets, set for one field at a time, preset select and a dry-run option, and never saves or erases a stored preset.
