distribution: browser-installer
install_notes: >-
  Open the hosted page in desktop Chrome or Edge. Connect the pedal by USB, or by Bluetooth once M-VAVE's bt_midi_Connector
  exposes it as a system MIDI device. The page cannot work from file://, so serve it locally if you self-host. Commit a tone
  with the pedal's own save.
