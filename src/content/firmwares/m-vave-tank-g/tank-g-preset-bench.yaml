device: m-vave-tank-g
kind: tool
name: Tank G Preset Bench (TANK-G-AI)
summary: >-
  Single-page browser tool that builds Tank G presets and saves them as the 21-byte .tkg files the official editor opens. It can push settings to the pedal over MIDI using frames it learns from the pedal, and builds a prompt for an AI.
description: >-
  Rights warning: index.html embeds a library of 67 presets, 91 amp profiles and 2,298 IR cabs harvested from a Tank G
  folder. The README says its reference material includes the vendor's manual and editor screenshots and .tkg presets
  from community and commercial packs, though the reference folder it describes is not in the current tree.

  The page has a replica of the pedal's panel with every knob and footswitch live, per-block locks and a view of the 21
  bytes, and FORMAT.md documents the .tkg layout, derived from 96 sample files that round-trip exactly. A text request is
  scored against the library to place the controls, or turned into a prompt to paste into an AI. It also has a
  microphone tuner. For MIDI it does not use a known message format: you move a control on the pedal, and the page
  diffs the messages to learn which byte carries the value, then replays that frame with new values. The README says storing
  to flash and reading presets are not possible this way, so sends only change the active preset. Nothing is flashed.
status: active
