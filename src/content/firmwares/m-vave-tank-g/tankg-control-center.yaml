homepage: https://github.com/CamiloFerreira/tankg-control-center-releases
distribution: download
install_notes: >-
  Download TankG-windows-x64.exe, TankG-linux-x86_64, TankG-linux-amd64.deb (Debian, Ubuntu and Mint 22.04 and newer) or TankG-android.apk from the latest release and check it
  against SHA256SUMS. The Windows build is unsigned in the latest releases, so SmartScreen may warn. Close
  M-EFCS first, since Windows lets only one program use the MIDI port. Android connects by USB-OTG or, on the
  v2, Bluetooth; the pedal accepts one Bluetooth connection at a time. Since 1.11.0 an important security fix can lock older versions behind an update screen. It can also be run from source with
  Python 3.11 or newer using run.sh or run.bat.
brick_risk: false
