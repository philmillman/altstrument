install_notes: >-
  Documentation only, nothing to install. The README warns not to write below 0x004000 or from 0x095000 of the 1 MiB flash, not to use Tank-G installers on the Tank Mini, and to take two matching full backups first, since it found no way back into the ROM bootloader by buttons.
