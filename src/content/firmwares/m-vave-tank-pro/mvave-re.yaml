source: https://github.com/unlikelytheorist/mvave-re
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT License. The repository contains no M-VAVE firmware, images or dumps; CONTRIBUTING.md asks contributors not to commit them, and FIRMWARE.md lists the official files by tag and SHA-256 only.
distribution: patch-your-own
requires_stock: Official M-VAVE .fwsc update files for your pedal, listed in FIRMWARE.md by tag and SHA-256 (Tank-PRO TANK PRO_038 and TANK PRO_040, Tank-G 097 and Tank-G v2 099); the repository does not include them.
install_notes: >-
  Run tools/setup.sh once, import your .fwsc files with tools/firmware.py import, unpack them and run build-mods to write the patched images, then install one with M-UPGRADE. The device commands are read-only; take a backup with tank_pro_tool.py device backup first. The guide says safe mode (hold footswitches A and B at power-on) only accepts an update when SAFEFIX or SAFEFIX2 is already installed, so build any further patch on top of SAFEFIX2. Flashing a patched image is at your own risk.
brick_risk: false
