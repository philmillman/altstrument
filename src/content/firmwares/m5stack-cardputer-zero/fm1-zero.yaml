    url: https://github.com/NaustudentX18
source: https://github.com/NaustudentX18/fm1-zero
source_status: open
license: Apache-2.0
license_notes: >-
  The repository has no LICENSE file; the README says Apache-2.0, as msfa is. It says the factory bank comes from M-VAVE's
  V15 image in m-vave/fm1_open, which is Apache-2.0, and that Felucca (GPL-3.0) is deliberately not used.
homepage: https://naustudentx18.github.io/fm1-zero/
distribution: source-only
requires_stock: CardputerZero Debian image
install_notes: >-
  No package is published. make builds a Linux binary that needs libasound2-dev, and tools/fetch_msfa.sh and
  tools/run_tests.sh run the engine tests on a computer. The program is started as ./fm1-zero with the library folder, which
  is found from $FM1_LIBRARY, the folder next to the executable or ~/roms. It has not been run on a Cardputer Zero.
brick_risk: false
