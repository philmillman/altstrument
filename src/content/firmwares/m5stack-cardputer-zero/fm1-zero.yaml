device: m5stack-cardputer-zero
name: fm1-zero
summary: >-
  Six-operator FM synth for the Cardputer Zero: a C port of the msfa engine with the M-VAVE FM-1's factory voices, FM-1 MIDI conventions and an effects chain, so far tested only on a computer.
description: >-
  The engine is an integer-C port of msfa, the FM core of Google's music-synthesizer-for-android, checked on a computer for
  bit-exact output against the original at 48 kHz. The program reads the 128 factory voices that M-VAVE publishes for the FM-1
  or a plain DX7 SysEx file from the SD card, follows the FM-1's documented MIDI messages including effect controllers 0 to 23,
  has an effects chain, and draws nine pages on the 320 by 170 screen. It is the Cardputer Zero follow-up to the author's
  Cardputer ADV project. The status page says the display, audio device, keypad and real-time scheduling code has not run on
  a Cardputer Zero, and the CPU load figure is a model, not a measurement. The program does not run on an FM-1; it reuses that
  instrument's voices and panel conventions.
status: active
authors:
