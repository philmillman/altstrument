distribution: source-only
requires_stock: CardputerZero Debian 13 image
install_notes: >-
  tools/build.sh builds an arm64 .deb in a Debian 13 container and runs the unit tests. Install it with sudo dpkg -i, and
  MIDI Scope appears in the launcher. It depends on libasound2t64 and writes nothing to the device's firmware.
