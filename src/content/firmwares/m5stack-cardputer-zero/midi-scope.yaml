device: m5stack-cardputer-zero
name: MIDI Scope
summary: >-
  MIDI monitor for the Cardputer Zero that lists ALSA MIDI ports with their kind and MIDI version, logs decoded MIDI 1.0 and MIDI 2.0 events and sends test messages.
description: >-
  MIDI Scope shows each port as USB, gadget, virtual, network, application or hardware, marks whether it carries MIDI 1.0,
  UMP with MIDI 1.0 or MIDI 2.0, and counts its events. A live log decodes notes, controllers, program changes, pitch bend
  and system exclusive messages, shows MIDI 2.0 values at full resolution and estimates the tempo from MIDI clock. Ports can
  be muted or isolated, and a send page transmits test notes, controllers and clock in MIDI 1.0 or UMP. Everything goes
  through the ALSA sequencer, so connections persist and new ports are followed. The build runs unit tests and includes
  synthetic MIDI sources.
status: active
