  Library (CC0 1.0), as listed in samples/CREDITS.md.
distribution: source-only
requires_stock: Official 64-bit Debian 13 CardputerZero image with SSH and passwordless sudo
install_notes: >-
  Run ./install.sh user@cardputer-ip from a computer. It copies the sources, installs libpulse-dev if needed, compiles the
  engine on the device, installs to /opt/zsynth and adds ZSynth to the launcher. ./package.sh builds a .deb for the
  CardputerZero app store tooling. It runs as an application on the Linux system and writes nothing to the device's firmware.
brick_risk: false
