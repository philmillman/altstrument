device: m5stack-cardputer-zero
name: ZSynth
summary: >-
  Pocket groovebox for the Cardputer Zero with lead and bass synths, a mic sampler and drums, eight patterns per song, a song chain and libraries of songs, samples and instruments.
description: >-
  ZSynth has four tracks (lead, bass, sampler and drums) that each play an instrument and keep their own pattern, with eight
  patterns per song of 1 to 32 steps in any time signature, and a song mode that chains them. The synths have band-limited
  oscillators, an ADSR envelope and a resonant filter; the sampler records up to five seconds from the built-in microphone or
  loads 16-bit WAV files; the drums are ten synthesised sounds. A piano roll and a drum grid edit steps, and the Sound screen
  designs instruments that are kept in a library. The first run adds 18 starter samples from the CC0 Versilian Community
  Sample Library, starter instruments and a demo song. The README says the screens are drawn with Python and pygame and
  the sound engine is C that is compiled on the device.
status: active
authors:
