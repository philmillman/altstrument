device: m5stack-cardputer
name: Audio Wiz
summary: >-
  Microphone-driven toolkit for the Cardputer and Cardputer ADV with a ten-mode audio visualizer, a metronome from 60 to 320 BPM and a recorder for short clips.
description: >-
  Audio Wiz has a visualizer with ten modes driven by an FFT of the built-in microphone, a metronome with time signatures
  from 2/4 to 6/8 and a pendulum display, and a recorder that keeps three five-second clips in memory or longer ones
  on an SD card, with waveform preview and playback. The whole program is a single source file built with PlatformIO. The
  repository has no prebuilt binary.
