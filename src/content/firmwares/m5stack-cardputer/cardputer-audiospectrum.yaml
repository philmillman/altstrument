device: m5stack-cardputer
name: m5Cardputer_audiospectrum
summary: >-
  Port of an M5StickC audio spectrum analyser, oscilloscope and tuner to the Cardputer, with a prebuilt binary for the Launcher firmware.
description: >-
  Aurélio Monteiro Avanzi ported KIRA Ryouta's M5StickC Audio Spectrum Display, Oscilloscope and Tuner to the Cardputer. The
  sketch draws a spectrum from the microphone using an integer FFT, an oscilloscope view and a pitch tuner based on the
  dywapitchtrack library. The last commit adds a binary for use with the M5Stick-Launcher.
