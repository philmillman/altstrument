device: m5stack-cardputer
name: Cardputer MidiLooper
summary: Four-channel MIDI loop recorder for the Cardputer-Adv that acts as a USB host to an M-VAVE FM-1, records its channels 1, 2, 3 and 10 into loops, overdubs, plays them back and saves them as .mid files.
description: >-
  The firmware makes the Cardputer-Adv a USB-C host for the FM-1 in its Sloop role. It records the FM-1's lead, pad,
  bass and drum channels into loops of 1 to 32 bars at 480 PPQN and plays them back to the FM-1. Overdubbing starts at
  the current phase of the loop, a loop mode starts the next pass automatically, and undo removes the last overdub.
  Settings cover tempo, bars, quantize, swing, a metronome and a count-in. Loops are saved to the SD card as Format 0
  .mid files, and files in /MidiLoop can be loaded, renamed and deleted from the FILE page. Channels can be muted
  separately. The README says v1.0.0 was checked on a unit, lists limits such as 8192 events and no lock to the FM-1's
  own sequencer, and says the main branch holds a later v1.1.0 that is not released. The repository includes a browser
  preview of the interface and a host-side test suite. README and notes are in Chinese.
