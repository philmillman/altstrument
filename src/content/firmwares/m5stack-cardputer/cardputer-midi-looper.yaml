distribution: download
install_notes: >-
  Flash the release's CardputerLooper-8MB.bin from address 0x0 with esptool, or build with PlatformIO from the firmware
  folder. Disconnect the FM-1 while flashing and do not connect the Cardputer to a computer and the FM-1 at the same
  time; the host build has no USB serial port. On the FM-1, ARP 2 HOLD must be off or notes hang after stopping.
brick_risk: false
