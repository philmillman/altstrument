    url: https://github.com/Zaratton
source: https://github.com/Zaratton/CardputerMidiMonitor
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GPL version 3 text and the README makes no "or later" statement.
distribution: source-only
install_notes: >-
  Open MidiMonitor.ino in the Arduino IDE with the M5Cardputer and MIDI libraries and upload it. No binary is published.
brick_risk: false
tags: [midi, monitor, utility, esp32-s3, open-source]
