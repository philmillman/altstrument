device: m5stack-cardputer
name: CardputerMidiMonitor
summary: >-
  Basic MIDI monitor for the Cardputer that shows the last six incoming messages from a SAM2695 MIDI module or a DIN input wired to the Cardputer.
description: >-
  The sketch reads MIDI on a serial port and lists Note On, Note Off, Control Change, Program Change, polyphonic and channel
  aftertouch, and pitch bend, keeping the last six messages on screen with pitch bend values coloured by sign. The README
  says it works with the SAM2695 MIDI module and should work with any standard DIN input built with an optocoupler.
  It is a single Arduino sketch with no other features.
status: dormant
authors:
