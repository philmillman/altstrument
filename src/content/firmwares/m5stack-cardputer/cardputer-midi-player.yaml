device: m5stack-cardputer
name: Cardputer MIDI Piano
summary: MIDI file player for the Cardputer-Adv that plays .mid files from the SD card through a 24-voice synthesized piano, with seek, speed, a piano roll and an experimental USB host mode that plays to and records from the FM-1.
description: >-
  The firmware reads Format 0 and 1 files from the SD card's midi folder and plays them on a built-in piano synthesizer
  with 24 voices and two overtones, sending 44.1 kHz audio straight to the I2S codec. Controls cover play and pause,
  seeking by one or five seconds, speed from 0.1 to 3 times, looping, volume, track browsing and a switchable animated
  piano roll, with sustain pedal handled. Version 0.8.2 adds four pages (player, piano roll, recorder, file manager) with Tab to switch, delete and rename of .mid files, and boot straight to the player. The firmware README says the normal build was checked on a real unit for start-up,
  playback and CPU load, which sits at about a fifth of one core at normal speed. Limits are about 7000 notes per file
  and synthesized sound only; a sampled piano in flash is planned. A separate experimental build drives an FM-1 Sloop
  over a USB-C cable as a USB MIDI host, mutes the local speaker while connected, follows the FM-1's MIDI clock tempo and has a recorder page that writes the FM-1's keyboard or sequencer notes (channels 1, 2, 3 or 10) to /midi/MyMIDI. The README marks the host build and the recorder as experimental and still needing hardware retests. The repository also holds a
  design write-up and interface mockups, mostly in Chinese.
