distribution: download
install_notes: >-
  Flash dist/CardputerMidiPlayer-8MB.bin from address 0x0, or build with PlatformIO and run pio run -t upload from the
  firmware folder. The USB host build is separate, has no USB serial port, and the firmware README describes its flash
  and recovery order. Put .mid files in /midi on the SD card.
brick_risk: false
