    url: https://github.com/2540825244
source: https://github.com/2540825244/CardputerModularSynth
source_status: open
license: MIT
license_notes: >-
  The LICENSE covers the project's own code. Vendored DaisySP and Plaits and
  stmlib keep their MIT notices, as THIRD_PARTY_NOTICES.md lists.
distribution: source-only
requires_stock: Cardputer-Adv with the bmorcelli Launcher installed
install_notes: >-
  Build firmware.bin with PlatformIO (pio run -e cardputer), copy it to the SD
  card and install it from the Launcher, which supplies the partition table; the
  overview says tools/release.sh also makes a full image for M5Burner at 0x0.
  Patches are saved under /modsynth/patches/ on the card.
brick_risk: false
