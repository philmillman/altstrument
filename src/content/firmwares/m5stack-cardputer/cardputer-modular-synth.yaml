device: m5stack-cardputer
name: Cardputer Modular
summary: Monophonic modular synth for the Cardputer ADV where patches are built on a 12 by 4 grid that matches the keyboard, with 68 module types, sequencers, a piano roll and over 50 presets.
description: >-
  Modules are placed on a grid whose cells map to the 12 by 4 centre of the
  keyboard, and cables are carried between module pins with the fn key, so there
  are no text menus. The 68 module types cover oscillators including a Plaits-based
  voice, filters, envelopes, LFOs, drums, effects, quantizer, Euclidean and Turing
  sequencers, a piano roll and a global transport. Signals run at audio rate with
  Eurorack-style voltages, patches are saved to the SD card and the device's tilt
  can modulate a knob. The output feeds the speaker and the line jack, and the
  author uses it to sample into a Teenage Engineering PO-33 K.O!. It installs as
  an app through the bmorcelli Launcher or as a full image. The README says the
  code and docs were written almost entirely by Claude under the owner's direction
  and calls the project a proof of concept with rough edges. There are no tagged
  releases.
status: active
authors:
