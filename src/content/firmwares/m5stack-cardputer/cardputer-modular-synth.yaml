    date: 2026-11-01
    url: https://github.com/2540825244/CardputerModularSynth/releases/tag/v1.5
    notes: First release. Adds a global transport, a 32-step piano roll, an evolving random-walk line, manual gates and three new presets; ships a Launcher app and a full flash image.
