distribution: download
requires_stock: Cardputer-ADV; M5Stack Unit MIDI (U187) for external MIDI
install_notes: >-
  The rolling release page offers CardputerSynth-app.bin, which loads from an SD-card launcher such as M5Launcher, and
  CardputerSynth-full.bin, a full image written at 0x0 with esptool, M5Burner or a web flasher that replaces what is on the
  flash. CardputerAMY has the same two files. To build, use the Arduino IDE with the M5Stack board package 3.2.2 or newer
  or run pio run -t upload; hold G0 while plugging in USB if the board does not enter download mode. Set the Unit MIDI DIP
  switch to BYPASS or the Cardputer receives no MIDI. The ESP32-S3 ROM download mode stays available for reflashing.
brick_risk: false
tags: [synth, synth-engine, midi, fm, filter, sd-card, open-source]
