device: m5stack-cardputer
name: Catputer
summary: >-
  Offline generative lofi radio for the Cardputer ADV that composes chords, bass, melody and drums in four moods
  while a pixel-art cat animates in a room that follows the mood.
description: >-
  Composes endless lofi music on the device from a seed, with Cozy, Rainy, Night and Sunny moods, six chord and lead
  tones, three bass tones, 4/4, 3/4 or 6/8 meter and an automatic or manual tempo of 40 to 180 BPM. Two sound engines
  share the same composer, a pure synthesis one and a hybrid one that adds a small bank of one-shots, and sessions can
  be saved as favorites. The screen shows a cat and a room, with a strip of part activity, and a sleep timer and
  automatic dimming are included. A desktop SDL preview and offline exports share the music engine. The README calls
  the current build, 0.1.13-dev, a development candidate; the notes record one test of a full-image install on a Cardputer ADV
  and one listening report, and say more physical verification of audio, display and install is still needed. The
  sound has a plate reverb and slow tape-style drift. From 0.1.13-dev the same image also starts on the original
  Cardputer, which the README labels untested because it was built from pin tables without a device.
status: active
authors:
