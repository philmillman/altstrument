    url: https://github.com/m0rg0t
source: https://github.com/m0rg0t/catputer
source_status: open
license: MIT
license_notes: >-
  LICENSE is the MIT text, and the README says code and documentation are MIT. Artwork and sounds are CC BY 4.0
  (LICENSE-ASSETS.md). Dependencies keep their own licences, such as MIT for the M5Stack libraries.
homepage: https://m0rg0t.github.io/catputer/
distribution: download
requires_stock: Cardputer ADV
install_notes: >-
  The project site offers a development zip with the application .bin, install notes and checksums. Install it
  with M5Apps and its Installer from the SD card. Building from source uses PlatformIO and CMake, and the build
  scripts never flash the device. Optional microSD storage keeps settings and favorites; without it they stay in
  RAM until restart. The README says the Bluetooth chip cannot stream audio to headphones directly, so use the 3.5
  mm output.
brick_risk: false
tags: [generative, lofi, ambient, synth-engine, open-source]
