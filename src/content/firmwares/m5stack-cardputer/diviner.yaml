device: m5stack-cardputer
name: Daedric Diviner
summary: >-
  Multi-purpose Cardputer ADV firmware with a generative drone box, a four-track groovebox and a bytebeat livecoder among
  its 16 modes, alongside visuals, Wi-Fi, BLE and LAN tools, and an IR remote.
description: >-
  The three music modes are drone, with five drifting voices, a resonant low-pass filter, wind, bells and delay; seq, a
  kick, snare, hat and acid groovebox with Euclidean fills, four pattern banks, song mode and save and load; and beat,
  which plays a typed C expression as bytebeat. The other 13 modes are ASCII 3D and plasma visuals, a rune oracle, a
  Gemini browser, network and Bluetooth inspection tools, a Wi-Fi CSI motion radar and an IR remote. The project's
  NOTICE limits the network and IR modes to devices you own or have permission to test. The repository also builds a
  desktop simulator.
status: active
