source_status: open
license: MIT
license_notes: >-
  The Daedric font, OMW Ayembedt, is SIL OFL 1.1 (tools/OFL.txt).
distribution: download
install_notes: >-
  Install the release .bin from an SD card through the M5Launcher, or over USB serial while the Launcher runs. The README
  says this is a full wipe from the Cardputer ADV's factory firmware and advises backing up the flash with esptool first.
brick_risk: false
