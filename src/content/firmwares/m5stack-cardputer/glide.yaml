distribution: download
install_notes: >-
  Flash bmorcelli's Launcher to the Cardputer once, copy GLIDE.bin from the latest release to the /apps/ folder of
  the microSD card, then choose SD, apps, GLIDE and Install in the Launcher menu. A newer file on the card does
  nothing until it is installed again; saved sounds and settings survive an update. Charging only works with the
  Cardputer switched on.
