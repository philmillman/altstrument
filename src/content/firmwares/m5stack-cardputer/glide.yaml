device: m5stack-cardputer
name: GLIDE
summary: >-
  Playable Cardputer synth with fretless-style glide between notes, chord mode, a loop pedal and generated sounds,
  under a noncommercial licence.
description: >-
  GLIDE tunes the key rows like strings and glides between pitches. A generative engine rolls sounds that commit to
  a character first, such as a pluck, bell, pad or acid squelch, and seeds some of the ten sound slots from a value
  only the individual unit has. Version 3.7 adds a Basic and an Advanced mode, a chord mode in which each key plays
  a diatonic triad and a loop pedal that counts in and locks to the beat. Version 3.9 adds a beta build with USB
  MIDI clock, notes and tilt-as-mod-wheel, and makes auto key land on the pentatonic of the key it hears. A tilt morph uses the gyro as a
  performance control. On the ADV a listen function uses the microphone to detect the key and tempo of music in
  the room and retunes the instrument. It supports the original Cardputer and the ADV.
