device: m5stack-cardputer
name: Grajek
summary: Cardputer-ADV instrument in just intonation that is hard to play badly, with an ageing tape loop, remembered phrases, shake and tilt gestures, and five musical worlds.
description: >-
  Grajek is a playable box in which every grid key makes music: a pentatonic just-intonation scale and
  plucked-tine sound are the default, with further scales and timbres in a settings list. The engine
  adds equal-loudness key tracking, polyphony compensation, sympathetic string resonators, chorus, a
  tape echo and reverb, and a tempo follower that locks to the player's key presses rather than a set BPM.
  It saves settings and short phrases at pauses, shaking the device replays the latest phrase, tilting
  changes brightness and depth, and laying it face down lets it play itself to sleep. A short press of
  GO changes world among meadow, ocean, cosmos, fireworks and mandala, and a held GO opens eight
  settings. The release images come in English and Polish. The same engine runs on a laptop, and the
  repository's unreleased changelog covers the worlds feature, which is newer than the v0.3.0 release.
status: active
