homepage: https://jasisz.github.io/grajek/
distribution: browser-installer
requires_stock: Cardputer-ADV
install_notes: >-
  Open the web installer in a Web Serial browser, connect the Cardputer-ADV over USB-C and choose English
  or Polish; the browser writes a full image from offset 0x0, which replaces the current firmware and
  clears saved Grajek settings and phrases. If no port appears, hold G0 while switching the device on.
  The merged .bin files from the release also install with esptool or M5Launcher 2.8 or newer. The images
  are for the Cardputer-ADV only, not the original Cardputer.
brick_risk: false
