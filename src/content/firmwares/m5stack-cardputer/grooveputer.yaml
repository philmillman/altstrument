device: m5stack-cardputer
name: GroovePuter
summary: >-
  MiniAcid-based Cardputer ADV groovebox that also generates MIDI material for external synths such as a Yamaha
  SEQTRAK and for a DAW.
description: >-
  A fork of MiniAcid that keeps its internal synths and drums and adds generation and variation of musical
  material, song and phrase editing, project handling and MIDI roles: a standalone groovebox, a companion that
  drives external instruments with the Yamaha SEQTRAK as the reference, and a source of editable MIDI material for
  REAPER. The README says it is under active development, that development happens on versioned branches and that
  main is not the source of truth for the newest behaviour. It also says a successful software build is not a claim
  that the firmware was accepted on Cardputer ADV hardware, so read the notes of the exact release before flashing.
status: active
authors:
  - name: Ostrovsky42
    url: https://github.com/Ostrovsky42
  - name: Hector Urtubia
    url: https://github.com/urtubia
source: https://github.com/Ostrovsky42/GroovePuter
based_on: m5stack-cardputer/miniacid
source_status: open
license: MIT
license_notes: The LICENSE file names Hector Urtubia, the author of the MiniAcid code this derives from.
distribution: download
install_notes: >-
  Each release has a zip with the product firmware .bin files, the ELF, a build log and per-file SHA-256 hashes;
  the release notes name the exact source commit. Flash the .bin to a Cardputer ADV, for example through
  Launcher. Check the release notes of the version first, because the README treats main as a landing branch.
brick_risk: false
tags: [groovebox, sequencer, synth-engine, drums, midi, generative, open-source]
