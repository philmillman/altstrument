    url: https://github.com/vlastimilcerveny34
source: https://github.com/vlastimilcerveny34/guitar-audio-tools
source_status: open
license: MIT
distribution: download
install_notes: >-
  The README says to install it from M5Burner (search for Guitar Audio Tools) or from the firmware list of the Launcher
  firmware, or to build it with PlatformIO using pio run -e cardputer.
brick_risk: false
