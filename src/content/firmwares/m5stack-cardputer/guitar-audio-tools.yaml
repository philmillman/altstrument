device: m5stack-cardputer
name: Guitar Audio Tools
summary: >-
  Launcher of audio tools for guitarists on the Cardputer ADV: tuner, strum tuner for six strings at once, metronome, BPM detector, chord and scale finders, spectrum analyser, sound level meter and recorder.
description: >-
  Guitar Audio Tools listens through the microphone of the Cardputer ADV and shows a precise tuner, a strum tuner that reads
  all six strings from one strum, a BPM detector, a spectrum analyser with third-octave bands, a decibel meter, a recorder,
  and chord and scale references that show shapes on the neck. A launcher screen opens each app from the keyboard. The same
  source also builds for the M5StickS3, which has two buttons instead of a keyboard. The README says the microphone does not
  work on the original Cardputer because it lacks the ES8311 codec. The latest commit is labelled 1.1.0-beta.4.
status: active
authors:
