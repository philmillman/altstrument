device: m5stack-cardputer
name: M5Tuna
summary: >-
  Instrument tuner for the Cardputer and Cardputer ADV covering guitar, ukulele and violin with auto-detection, built on ESP-IDF with its own display and microphone drivers.
description: >-
  M5Tuna detects pitch from the microphone with an autocorrelation method, filters the result to reject spikes and jitter,
  and shows an indicator that moves from red through yellow to green with a waveform view and an LED that lights when in
  tune. It supports guitar, ukulele and violin tunings, plus an automatic mode. Instead of the M5 libraries it uses a
  small hardware layer on LovyanGFX with its own drivers for the display, microphone, speaker, keyboard and the ES8311 codec.
  It is built with ESP-IDF 5.5.
