homepage: https://lebiro.studio/microgroove
distribution: download
requires_stock: Cardputer-ADV
install_notes: >-
  Flash Microgroove.bin, a merged image, to offset 0x0 with esptool or another ESP32-S3 flashing tool, or
  open the sketch from the source ZIP in the Arduino IDE with the M5Cardputer library. Copy the contents
  of the SD card ZIP to a FAT32 microSD for the demo project and samples. Without a card, holding LOAD and
  SAVE together plays a built-in demo. The firmware targets the Cardputer-ADV only.
brick_risk: false
