device: m5stack-cardputer
name: Microgroove
summary: Pocket groovebox firmware for the Cardputer-ADV with three mono or polyphonic 303-style synth tracks, eight 808, 909 or sample drum lanes, microphone sampling, a pattern sequencer and a song mode.
description: >-
  Microgroove turns the Cardputer's keys into a one-key-one-function groovebox, with a held second
  function on the orange-labelled keys and a note layout that follows a piano. Each of the three synth
  tracks switches between a mono 303-style voice with accent and slide and two- or three-voice
  polyphony. The eight drum lanes each use 808 synthesis, 909 synthesis or a sample from the SD card,
  with volume, tune, decay and choke groups. Holding a key samples the microphone onto a drum lane,
  and holding SONG while playing bounces the mix onto a pad. Patterns are 16 steps, eight of them, with
  live recording, and a song mode chains up to 64 slots. Projects are saved to eight slots on the SD
  card, and single-cycle WAV files placed on the card become extra oscillators. The synth voice, 808
  synthesis and audio task layout are derived from qwertyuu's Cardputer Tracker. A printable shell and
  keycap label sheet are listed on MakerWorld and in the repository's hardware folder.
