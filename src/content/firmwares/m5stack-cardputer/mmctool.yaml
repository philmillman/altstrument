requires_stock: M5Stack Cardputer or Cardputer ADV
install_notes: >-
  Copy MMCTool_v1.0_M5Launcher.bin to the SD card and install it from M5Launcher, which keeps Launcher on the device, or write MMCTool_v1.0_FullFlash_0x0.bin at offset 0x0 with M5Burner or a web ESP flasher, which replaces the whole flash including Launcher. Nothing in the README documents a recovery; the ESP32-S3 ROM download mode, entered by holding G0 while plugging in USB, remains available for reflashing.
