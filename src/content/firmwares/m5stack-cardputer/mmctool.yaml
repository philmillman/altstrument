device: m5stack-cardputer
name: MMCTool
summary: >-
  Pocket instrument firmware for the Cardputer and Cardputer ADV, with ten instruments including a six-voice polyphonic synth, bass, guitar, harp, piano and three drum kits, live effects and an SD card WAV recorder.
description: >-
  MMCTool plays real-time DSP instruments from a 24-pad key grid: bass, an electric guitar with three overdrive levels, a plucked-string harp, a polyphonic synth with five waveforms, a drum instrument with Amen, Tekk and Phonk kits, a pad mode with chords and matching bass, a piano, a Reese bass, a supersaw lead and an acid synth. Pads show note names, the top bar shows the current key and a chord detector, and five layouts and an octave shift change how the pads map to notes. Reverb, ping-pong echo, vibrato and tremolo, a filter and a sustain lock apply live, and the volume goes to 200 percent using the ADV's codec amplifier.

  A recorder saves stereo WAV files to the SD card and plays them back so you can play over a recording, and a guide mode highlights notes from text files, with a browser page that converts MIDI and audio files into guide files. One image runs on both the Cardputer ADV and the original Cardputer, and it needs no PSRAM. The README has a section offering custom builds for payment.
