device: m5stack-cardputer
name: S8N Synth
summary: >-
  Turns the original Cardputer and an M5 Unit Synth or Unit MIDI into a pocket groovebox, with a keyboard, an eight-lane 16-step grid, four patterns, WAV sample pads, microphone takes and project slots on the SD card.
description: >-
  S8N boots into a Live Keys page that plays General MIDI sounds from the Cardputer keys, then opens a four-page groovebox with Tab. The Step Grid has eight lanes (kick, snare, hat, bass, lead, chord and two sample lanes) over 16 steps, four patterns, swing, velocity and gate per step and live note overdub. The Sound page sets a General MIDI program, level, filter cutoff and reverb for the selected lane. Synth, chord and drum notes go out as MIDI from the Grove port to the attached Unit Synth or Unit MIDI, which makes the sound. The Sampler page records four 0.75-second pads from the built-in microphone or loads 16 kHz mono WAV files from the SD card, and a Project page saves eight project slots and records longer microphone takes as WAV files.

  The firmware targets the original 8 MB Cardputer (K132). A repository folder of host tests covers the sequencer, MIDI parsing, sampler and project recall, and a bench-test document lists the hardware checks. The repository has no licence file.
