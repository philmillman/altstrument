distribution: download
requires_stock: Original M5Stack Cardputer (K132, 8 MB); M5Stack Unit Synth or Unit MIDI on the Grove port
install_notes: >-
  Flash the merged image firmware/S8N-Synth-v0.2-Cardputer-merged.bin at address 0x0 from desktop Chrome or Edge with Espressif's serial flasher, leaving erase-all unchecked, or build with PlatformIO and upload. Installing replaces the current firmware, so save anything you need from the flash first. If the board needs manual download mode, hold G0 while applying power; the ESP32-S3 ROM download mode stays available for reflashing. Insert a FAT32 microSD for pads, projects and takes.
