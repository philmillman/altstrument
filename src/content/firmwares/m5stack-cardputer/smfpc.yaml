install_notes: >-
  Install v0.3 from M5Burner with share code ytA202BfCmxyVRkZ, or compile smfPC.ino in the Arduino IDE for the M5Cardputer board. Connect an M5Stack Unit-Synth to the Grove port and put .mid files on a FAT32 microSD card. M5Burner replaces the app image over USB, and any other image can be flashed the same way.
