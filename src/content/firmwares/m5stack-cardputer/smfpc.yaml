device: m5stack-cardputer
name: smfPC
summary: >-
  Standard MIDI File player for the Cardputer and Cardputer-Adv that plays .mid files from the microSD card to an M5Stack Unit-Synth MIDI module, with a keyboard-driven file browser.
description: >-
  smfPC is an Arduino sketch built with the M5Cardputer, M5UnitSynth, MD_MIDIFile and SdFat libraries. It lists .mid files on a FAT32 microSD card, lets you move through folders with the cursor keys and starts or stops playback with the space key, and the M key shows help. MIDI goes out over the Grove port, with GPIO1 and GPIO2 as UART, to a Unit-Synth module, so the Cardputer's own speaker is not used. On the original Cardputer the Grove 5V switch has to be set to output to power the module. Version 0.3 adds Cardputer-Adv support from the same source, and the README says playback was confirmed on both models. It lists limits of 255 files per folder, a directory depth under 10 and a path length under 255.

  The README links M5Burner share codes for v0.3 and the earlier v0.2, and a GitHub Actions workflow builds the sketch. It notes that the MD_MIDIFile 2.6.0 library needs a one-line type fix to compile with Arduino core 3.2.2.
