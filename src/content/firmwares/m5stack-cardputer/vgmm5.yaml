    url: https://github.com/Layer812
source: https://github.com/Layer812/vgmM5
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file. The README shows an MIT badge and nothing else about licensing, and the bundled
  sound-chip code was not checked for upstream terms.
distribution: download
install_notes: >-
  The README links M5Burner share codes and Web Burner pages for the Cardputer and the other boards, and says the Cardputer
  release on M5Burner is the older R6 version; the R67 build is built from the cardputer folder with PlatformIO or the
  included Windows scripts. Put VGM, VGZ or MDX files on the microSD card.
brick_risk: false
