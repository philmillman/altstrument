device: m5stack-cardputer
name: vgmM5
summary: >-
  VGM/VGZ and MDX file player for M5Stack devices. The Cardputer build lists the SD card, plays Mega Drive, arcade and X68000 music files through its own sound-chip cores and takes keyboard controls.
description: >-
  vgmM5 is a player for VGM and VGZ chip-music logs and MDX (MXDRV) files from the X68000. One shared sound-chip library
  covers FM chips such as the YM2612, YM2151 and YM2608, PSG and SSG chips, and PCM chips such as the C140 and C352. The
  repository also holds builds for the CoreS3, with or without Module Audio, the Tab5 and the AtomS3R Echo. The Cardputer R67
  build boots straight into a file list of the microSD card, shows title, chip, volume and elapsed time while playing, and
  offers a standard and a Classic output level. Its README says the earlier Cardputer release is kept on a separate branch.
status: active
authors:
