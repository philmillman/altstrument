requires_stock: M5Stack Cardputer ADV
install_notes: >-
  Build with arduino-cli and the esp32 core plus the M5Cardputer, M5Unified, M5GFX, IRremote and ESP8266Audio libraries, then run flash.sh, which saves an 8 MB backup of the current firmware the first time and then flashes. flash.sh --restore writes that backup back. If flashing fails, hold G0 while plugging in USB to enter the ESP32-S3 download mode.
brick_risk: false
