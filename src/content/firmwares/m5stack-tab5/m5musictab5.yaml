  Florestan Basic GM GS; its own licence was not checked.
homepage: https://fangbrbr.github.io/M5MusicTab5/
distribution: browser-installer
install_notes: >-
  Flash from the web flasher, or download a release .bin and write it with esptool. The full 16 MB image goes to address
  0x0 for a first install and resets settings. The app-only image goes to 0x10000 for upgrades and keeps them. The README
  says to use the full image again if a build will not boot. Flashing replaces the Tab5's factory firmware.
brick_risk: false
