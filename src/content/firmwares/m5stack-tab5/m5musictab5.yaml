device: m5stack-tab5
name: M5MusicTab5
summary: Music app suite for the Tab5 with twelve touchscreen apps, including a sequencer, ear and chord trainers, a SoundFont piano, a MIDI recorder and player, a USB, Bluetooth and UART MIDI bus and a web flasher.
description: >-
  The firmware replaces the Tab5's factory software with ESP-IDF and LVGL screens in Chinese and English. The twelve apps
  are Zen Mode, Ear Trainer, Chord Trainer with a circle of fifths, Tiny Piano, Sequencer, a file Player, an XY pad,
  Metronome, a voice assistant, Clock and Calendar, a fortune-style Fun app and a Recorder. Notes are rendered from a
  built-in General MIDI SoundFont, or from .sf2 files on the microSD card. Performances can be saved as standard MIDI
  files, and a MIDI bus takes input from USB-A host devices, Bluetooth and UART. A built-in FTP server manages the card
  over the local network with fixed, plaintext credentials that the README says should stay off the internet. The voice
  assistant needs an online account with the Xiaozhi service.
status: active
