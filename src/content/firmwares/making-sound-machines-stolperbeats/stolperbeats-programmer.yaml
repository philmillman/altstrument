    url: https://github.com/wittysalt8451
source: https://github.com/wittysalt8451/stolperbeats-programmer
source_status: open
license: unspecified
license_notes: The repository has no license file and no license statement.
homepage: https://wittysalt8451.github.io/stolperbeats-programmer/
distribution: browser-installer
requires_stock: Stolperbeats firmware 163 (the version the files were taken from)
install_notes: >-
  Press stop on the module and power it off, copy every file from the SD card to a folder as a backup,
  then open the hosted page and open the files. Save, eject the card and power the module on. The
  module rewrites the card when the sequencer stops, so edit the card only with the module off. The
  tool writes text files only and does not flash anything.
brick_risk: false
tags: [editor, web, sequencer, drums, envelope, midi]
