device: making-sound-machines-stolperbeats
name: Stolperbeats Programmer
kind: tool
summary: Browser editor for the files on the Stolperbeats SD card, covering pattern banks, envelope settings, machine config and default state, with a pattern preview and direct saving to the card in Chrome or Edge.
description: >-
  Rights warning: the repository's default_settings folder holds copies of files from the author's
  module card at firmware 163, including PatternBank000 to 004, which are Making Sound Machines' factory
  banks, and the repository also has a photo of the module panel. The repository states no permission
  to redistribute them.

  The page opens PatternBank000 to 063, EnvelopeSettings, MachineConfig and MachineState files, each in
  its own tab. It edits patterns, plays them in the browser, sets which banks are active, and edits the
  two envelope outputs and the default tempo, timing, shuffle and feeling. Info buttons explain each
  setting, and settings the author inferred rather than found in the manual are tagged. Chrome and
  Edge write back to the card directly and other browsers download the files. MIDI map files cannot be
  edited yet. The page loads nothing from the internet and uploads nothing. The repository has no
  README; a CLAUDE.md file documents the file formats, and commits credit Claude. The page does not
  change the module's firmware.
status: active
authors:
