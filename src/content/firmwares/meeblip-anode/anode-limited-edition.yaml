device: meeblip-anode
name: MeeBlip anode Limited Edition firmware
kind: firmware
summary: MeeBlip's firmware build for the Limited Edition anode, which adds a second envelope for the filter and easier access to the wavetable mode. It is published as AVR assembly source with a prebuilt hex file and the hardware files.
description: >-
  This repository is a copy of the anode project with a changed build, anode-le, whose envelope code, lookup tables, note handling,
  MIDI input and knob scanning differ from the standard firmware. The hex file, the make batch file and the board files are included. It is the
  maker's own repository. Nothing is flashed by this entry.
status: dormant
authors:
