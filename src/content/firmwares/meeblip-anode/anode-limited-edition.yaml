    url: https://github.com/MeeBlip
source: https://github.com/MeeBlip/meeblip-anode-limited-edition
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GNU GPL version 3 text. The hardware files are under CC BY-SA 4.0 and the MeeBlip name is reserved by its makers.
  The repository is the manufacturer's own, so its hex file is the maker's firmware and not a redistributed copy.
homepage: https://github.com/MeeBlip/meeblip-anode-limited-edition
distribution: download
install_notes: >-
  Program the ATmega32 through its ISP header with an AVR programmer, as for the standard anode firmware. The repository's
  make-anode-le.bat shows the avrdude command. Check that the board is a Limited Edition anode first.
brick_risk: false
