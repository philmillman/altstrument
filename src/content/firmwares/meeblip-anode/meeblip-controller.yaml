device: meeblip-anode
name: Meeblip Controller
kind: tool
summary: JUCE plug-in and standalone MIDI controller for the MeeBlip anode, with on-screen knobs and switches for every panel control and the parameters only reachable over MIDI. It runs as a VST, VST3 or Audio Unit plug-in or as an app on macOS, Windows and Linux.
description: >-
  The window mirrors the anode's panel with envelope, filter, oscillator and LFO sections and adds a section for the controls
  that have no panel knob and can only be set by MIDI, such as glide, filter envelope amount, LFO randomise and retrigger and
  the second oscillator's wave. Parameters are exposed to the plug-in host for automation, a Synchronize button runs a one-shot
  sync with the hardware, and a preset system with undo and redo is built in. MIDI events can go to the host or to a chosen
  external port. Releases are packaged builds for macOS, Windows and Linux. The artwork reuses graphics from MeeBlip's web
  editor under the GPLv3. Nothing is flashed.
status: dormant
authors:
  - name: Romain Clement
    url: https://github.com/rclement
source: https://github.com/rclement/meeblip-controller
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is the GNU GPL version 3 text and the README names the GNU General Public License v3.0, with
  no "or later" wording. The build uses the JUCE, FRUT, VST3 SDK and pluginval projects, which the README lists as GPLv3,
  and artwork from MeeBlip's web editor.
distribution: download
install_notes: >-
  Download the build for your system from the releases page, or build from source with CMake as the README describes. In a
  host, load the plug-in and pick the synth's MIDI port; the standalone app has its own port selector. The Synchronize
  button does a one-time sync with the hardware.
brick_risk: false
tags: [editor, midi, presets, utility]
