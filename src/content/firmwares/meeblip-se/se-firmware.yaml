device: meeblip-se
name: MeeBlip SE firmware
kind: firmware
summary: MeeBlip's internal sound code for its digital synths, published as AVR assembly source with prebuilt hex files for the SE on version 1 hardware, the SE on version 2 hardware and the micro board. It holds the oscillators, filter, envelopes, LFO and MIDI handling.
description: >-
  The repository has three assembly files with their hex files, one per board: meeblip-se for version 1 hardware, which has no
  patch memory and sets the MIDI channel with a DIP switch, meeblip-se-v2, which adds sixteen patch memories and a MIDI
  channel select from the panel, and meeblip-micro, which adds analog and switch inputs and loads patch 0 from EEPROM. The
  version history in the source runs from 2011 to 2.05 in 2015. Batch files program each build with avrdude and write default
  EEPROM patches. The repository has no licence file and no licence statement.
status: dormant
authors:
  - name: MeeBlip
    url: https://github.com/MeeBlip
source: https://github.com/MeeBlip/meeblip-synth
source_status: open
license: unspecified
license_notes: >-
  The repository has no LICENSE file and no licence statement in its readme or source headers. MeeBlip's triode and anode
  repositories state that MeeBlip source code is under the GPLv3 and the hardware under CC BY-SA 4.0, but this one does not say
  so. The repository is the manufacturer's own, so its hex files are the maker's firmware and not redistributed copies.
homepage: https://meeblip.com/
distribution: download
install_notes: >-
  Program the ATmega32 through its ISP header with an AVR programmer. The make-se.bat, make-se-v2.bat and make-micro.bat files
  show the avrdude commands for a USBtiny programmer, including the fuse settings and the EEPROM image. Pick the build that
  matches the board, since version 1 and version 2 hardware differ.
brick_risk: false
