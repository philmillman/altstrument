    date: 2017-03-08
    url: https://github.com/MeeBlip/meeblip-triode/releases/tag/v1.20
    notes: Makes the synth handle MIDI clock messages.
  - version: v1.11
    date: 2017-03-08
    url: https://github.com/MeeBlip/meeblip-triode/releases/tag/v1.11
    notes: Returns the filter decay envelope to following the sustain switch.
