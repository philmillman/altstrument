device: meris-enzo
kind: tool
name: Enzo Editor
summary: Browser editor for the Meris Enzo synthesizer pedal over Web MIDI. It shows every control at once, including filter and envelope types and the mono, poly and arpeggiator voices, with tap tempo, a preset bar, a browser library and expression toe values. The repository is archived.
description: >-
  The page shows the pitch, portamento, filter, ring mod, delay and modulation knobs, the filter type and envelope choices, the synth voice and oscillator buttons and a tempo control that can switch between milliseconds and BPM. It has a 16-slot preset bar that writes to the pedal's memory, INIT and RANDOMIZE commands, a printable sheet and a library kept in the browser. A second MIDI input forwards an expression pedal or controller to the Enzo. Holding shift edits the expression pedal's toe values. The author linked a demo video. They archived the repository in January 2025, and the hosted page is still served. Nothing is flashed.
