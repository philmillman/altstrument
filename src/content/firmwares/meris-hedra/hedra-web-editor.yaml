source_status: open
license: GPL-3.0-only
license_notes: The LICENSE file is the GNU GPL version 3 text; the repository gives no later-version option.
homepage: https://studiocode.dev/doc/hedra-editor/
distribution: source-only
install_notes: >-
  No hosted copy is served; the README's editor link is dead. Build it from the repository with npm, serve it over HTTPS or localhost, and open it in Chrome or Opera. Set the pedal's EXP/MIDI jack to MIDI out, pick a channel and connect it by TRS cable to a MIDI interface.
