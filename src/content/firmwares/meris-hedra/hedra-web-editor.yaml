device: meris-hedra
kind: tool
name: Hedra Editor
summary: Browser editor for the Meris Hedra pitch shifter pedal over Web MIDI, written by the author of the Mercury7 and Enzo editors. It shows the key, micro tune, mix and three pitch controls at once. The repository is archived and no hosted copy is served.
description: >-
  The source is the same editor framework as the author's other Meris editors, with the Hedra's key, micro tune, mix, three pitch knobs and dual or series routing. It has a preset bar, a library kept in the browser and global settings. The README links a demo video that is actually the author's Enzo demo, so none is listed here. The README's link to the hosted editor returns a 404, so it has to be built from source, and the documentation page on studiocode.dev is still served. The author archived the repository in January 2025. Nothing is flashed.
status: archived
authors:
