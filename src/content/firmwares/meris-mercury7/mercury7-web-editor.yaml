device: meris-mercury7
kind: tool
name: Mercury7 Editor
summary: Browser editor for the Meris Mercury7 reverb pedal over Web MIDI. It shows every control at once, sets expression toe values, saves presets to the pedal's memory and keeps a preset library in the browser. The repository is archived.
description: >-
  The page lays out all of the pedal's knobs, the Ultraplate and Cathedra choice, the Pitch Vector modes, Swell and the global settings in one view, and mirrors knob moves on the pedal. It has a 16-slot preset bar that writes to the pedal's memory, INIT and RANDOMIZE commands, a printable settings sheet and a library that is stored in the browser and can be exported. A second MIDI input forwards an expression pedal or controller to the pedal and drops messages the pedal does not support. A shift key shows the expression pedal's toe values. The author archived the repository in January 2025, and the hosted page is still served. Nothing is flashed.
