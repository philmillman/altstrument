homepage: https://studiocode.dev/mercury7-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Opera and allow MIDI access. Set the pedal's EXP/MIDI jack to MIDI and its MIDI mode to out, pick a channel, and connect it with a TRS cable to a MIDI interface such as Meris's MIDI I/O or a Disaster Area MIDI Baby. Choose the interface's input, output and channel in the editor. The Global Settings are locked until you unlock them, and they reach every Meris pedal on the same interface.
