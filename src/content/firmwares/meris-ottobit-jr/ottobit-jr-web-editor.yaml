device: meris-ottobit-jr
kind: tool
name: Ottobit Jr. Editor
summary: Browser editor for the Meris Ottobit Jr. bit-crusher pedal over Web MIDI. It shows the sample rate, filter, bits, stutter and sequencer controls at once, with a preset bar and a browser library. The repository is archived.
description: >-
  The page shows the sample rate, filter, bits, stutter, sequencer and sequencer multiplier knobs and the pitch and filter sequencer switches together, mirrors changes made on the pedal and writes the current settings to a preset slot in its memory. It has INIT and RANDOMIZE commands and a library kept in the browser. The README marks the editor link and demo video as unfinished, but the hosted page is served and credits a second contributor. The author archived the repository in January 2025. Nothing is flashed.
status: archived
