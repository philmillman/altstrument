device: meris-polymoon
kind: tool
name: Polymoon Editor
summary: Browser editor for the Meris Polymoon delay pedal over Web MIDI. It shows the time, feedback, mix, multiply, dimension and dynamics controls at once, with a preset bar and a browser library. The repository is archived.
description: >-
  The page shows the Polymoon's six knobs, its sync phase and slow options and its tap tempo, with a 16-slot preset bar that writes to the pedal's memory, INIT and RANDOMIZE commands and a library kept in the browser. A second MIDI input forwards an expression pedal or controller to the pedal. The author archived the repository in January 2025, and the hosted page is still served. Nothing is flashed.
status: archived
