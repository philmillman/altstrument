homepage: https://thekikgen.github.io/umk4x4-Configurator.html
distribution: download
requires_stock: Miditech or Midiplus 4x4 board modified for serial bootloading, or an STM32F103 Bluepill
install_notes: >-
  For the Miditech or Midiplus 4x4, open the case, remove resistor R28, add a 10 K resistor on BOOT1, temporarily wire BOOT0 to
  3.3 V, connect a TTL serial adapter and use ST's flash loader to remove read protection and write the modified bootloader. The wiki says
  there is no way back from that step, since the original firmware is erased. After that, flash the release firmware over USB with tkg-flash or the web HID updater. The
  Bluepill version needs the TKG HID bootloader flashed once first.
brick_risk: true
