device: miditech-midiface-4x4
name: USBMidiKliK4x4
summary: >-
  Replacement firmware for the Miditech and Midiplus 4x4 USB MIDI interface and for STM32F103 Bluepill boards, with 16 USB ports, a routing engine with transformation pipes, standalone mode and browser configuration. The 4x4 needs a hardware mod that erases the stock firmware.
description: >-
  The author wrote it after finding that two stock 4x4 interfaces could not be used together on one computer and that the stock firmware could not be
  updated. It handles 16 USB MIDI ports in and out, three physical jacks each way on the author's own board, eight virtual ports, four clock and
  MTC generators, and a router that can send any input to any output through chains of
  pipes, including transpose, split, channel and CC mapping, message filters and velocity curves. Standalone mode works with only a power supply, and
  up to five boards can be stacked over I2C to look like one interface. Configuration is by SysEx or a serial menu, and release 2.5.4 added three hosted browser pages:
  a graphical configurator, a SysEx utility and a serial terminal. The builds target the author's TKG HID bootloader. Separate
  builds exist for 64 KB and 128 KB Bluepills and for the Miditech board, which has an STM32F103RC.
  The author also sells a ready-made board on Tindie.
