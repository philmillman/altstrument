device: miyoo-miyoo-flip
name: Cirmolo
summary: >-
  Fork of spruceOS for the Miyoo Flip with an Italian-first interface and native music apps, among them a drum-led groovebox, a pad sampler, a General MIDI piano, a chord synth, a generative garden and a tuner, plus optional AI features.
description: >-
  Cirmolo keeps spruceOS's launcher, emulation setup and updater, and changes its updates to come from its own feed. It
  adds a complete Italian translation, two themes, one based on the author's Stame instrument, apps grouped into folders
  with Music as the first icon, and a boot logo change that copies the internal flash to the SD card first and restores
  it if the write fails. The native apps are written in C on a shared kit: Cirmolo Synth with 26 drum kits, an acid bass
  and a West Coast synth over 14 sequencer tracks, Cirmolo Sampler, Cirmolo Piano on a SoundFont, OpenOrc for the MPK mini IV, Fioritura, which
  can use a Launchpad Mini MK3 as its grid, and Diapason. An Ask AI app chats with several hosted models and adds a game
  translator, game cards and a play diary; it needs Wi-Fi and the user's own API keys. The project says it contains no
  games or BIOS files and has been tested on the Miyoo Flip only. The repository is about 5 GB and was read through the
  API, not cloned.
status: active
