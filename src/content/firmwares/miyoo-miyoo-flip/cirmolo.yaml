license: CC-BY-NC-4.0
license_notes: >-
  The LICENSE file keeps spruceOS's Creative Commons Attribution-NonCommercial 4.0 licence, so the firmware is not open
  source in the OSI sense. Third-party components keep their own licences.
homepage: https://luigismith.github.io/cirmolo/
distribution: download
requires_stock: Miyoo Flip; spruceOS-based, installed to the SD card
install_notes: >-
  Download the release .7z and copy its files to a FAT32 SD card, as for spruceOS. The firmware runs from the SD card.
  The README says the Boot Logo app checks the battery, backs up the internal flash with checksums and restores it by
  itself if the write fails, so it is the one feature that writes internal flash; the rest leaves the console's own
  firmware alone. The README says to use it at your own risk and to report problems to the Cirmolo repository.
brick_risk: false
