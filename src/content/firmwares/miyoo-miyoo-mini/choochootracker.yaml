device: miyoo-miyoo-mini
name: ChooChooTracker
summary: >-
  Multi-engine tracker forked from ChipNomad, with a MiyooPorts ARMHF build for the Miyoo Mini and Mini Plus on
  Onion OS. Alpha.
description: >-
  ChooChooTracker keeps ChipNomad's tracker workflow and adds Braids, Plaits, sample, wavetable, acid and drum
  engines, native chip and FM instruments, send reverb and delay, insert effects and MIDI mapping. Its Miyoo build
  arrived in v1.0.15-alpha as a MiyooPorts package, and the user manual's installation page describes it for the
  Miyoo Mini and Mini Plus under Onion OS. The README names the Anbernic RG353V through PortMaster as the main
  target. The manual lists the Miyoo builds as without Ableton Link, and the first Miyoo release notes ask users
  to report problems on the new Miyoo support.
status: active
authors:
  - name: Pierre-Emmanuel Surga (paiheulevrai)
    url: https://github.com/paiheulevrai
source: https://github.com/paiheulevrai/Choochootracker
source_status: open
license: MIT
license_notes: >-
  The LICENSE file names ChipNomad and paiheulevrai as copyright holders. Mutable Instruments, Airwindows, Signalsmith
  Stretch and other components keep their own licenses, listed in the repository's license folders. The manual says
  the Miyoo builds do not include Ableton Link.
homepage: https://choochootracker.pages.dev/
distribution: download
install_notes: >-
  Extract the MiyooPorts archive from the GitHub release at the root of the SD card so that its Roms/PORTS folders
  merge with Onion's existing ones, refresh the collection and start ChooChooTracker from the Ports menu. Back up the
  app's projects folder before replacing an existing installation.
brick_risk: false
tags: [tracker, synth-engine, sampler, sequencer, wavetable, fx, midi, open-source]
