    url: https://github.com/seajaysec
source: https://github.com/seajaysec/ingenue
source_status: open
license: unspecified
license_notes: No LICENSE file and no licence statement in the repository.
homepage: https://seajaysec.github.io/ingenue/
distribution: download
install_notes: >-
  From maiden's REPL run ;install https://github.com/seajaysec/ingenue, then run ingenue once from SELECT on the norns to
  finish setup, or use the install script over SSH. It installs a service and can be removed with the uninstall script.
  The page on GitHub Pages is only a demo; the real interface is served by the device.
