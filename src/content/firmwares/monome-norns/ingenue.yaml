device: monome-norns
name: ingenue
kind: tool
summary: Responsive browser interface for norns that runs as its own service on the device at port 7777, with an editor, matron REPL, live parameter and PSET editing, a script and mod browser, a file manager and themes. It sits beside maiden.
description: >-
  Installed from maiden or over SSH, it runs on the norns and is opened from any browser on the network at
  norns.local:7777. It edits scripts in an Ace editor, shows the matron REPL, edits parameters in both directions with
  browser preset slots and JSON export, installs scripts from the community catalogue with dependency handling, manages mods
  and the dust file tree, and offers a GitHub search with a user-supplied token that stays in the browser. On a 64-bit norns
  it can install 64-bit SuperCollider plugin builds. A static demo with faked device calls is hosted on GitHub Pages. The
  README says the code was written with substantial help from an AI coding assistant and tested on norns hardware, and
  lists a Web MIDI bridge for parameters as a stretch goal. The OS is not replaced.
status: active
authors:
