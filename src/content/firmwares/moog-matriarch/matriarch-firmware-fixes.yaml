device: moog-matriarch
name: Matriarch Firmware Fixes
summary: Patcher that applies fixes for the paraphonic mixer gate hold and for HOLD sending sustain while the Arp/Seq plays to your own copy of Moog's Matriarch v1.3.0 firmware, as a browser page or a Python script.
description: >-
  Two fixes from Moog's v1.3.0 known-issues list. In 2- and 4-note paraphonic modes, v1.3.0 keeps a released oscillator
  sounding for 125 ms while other keys are still held, which smears staccato playing. The mixer gate fix lets the user
  choose a hold from 0 to 125 ms (5 ms recommended, 50 ms matches v1.1.0). Its chord-aware mode keeps Moog's 125 ms
  for notes pressed together with a key that is still held, so lifted chords ring out with the release; a simple mode
  gives every released note the short hold. The second fix stops HOLD sending MIDI sustain to connected gear while
  the Arp/Seq is playing. The page offers a checkbox for each fix. The patches change a few words of the SysEx file and
  add short routines in unused flash, and the affected record's checksum is recomputed. The project documents the
  firmware's SysEx format and includes Ghidra scripts used to analyse it. The other known issues on Moog's v1.3.0 list
  are not fixed yet.
status: active
authors:
