source: https://github.com/benjamindehli/matriarch-firmware-fixes
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  Covers the tools and documentation only. The repository contains no Moog firmware, and Moog's file is not covered
  by this license.
homepage: https://benjamindehli.github.io/matriarch-firmware-fixes/
distribution: patch-your-own
requires_stock: 1.3.0
install_notes: >-
  Get Moog's official Matriarch_Firmware_v1_3_0.syx, patch it in the browser page or with tools/patch.py
  (other versions are refused), then send it with a SysEx tool using Moog's usual procedure: the invalidate file,
  the erase file, then the patched file. Sending Moog's original v1.3.0 file the same way restores stock.
brick_risk: false
tags: [bugfixes, patcher, sysex, paraphonic]
