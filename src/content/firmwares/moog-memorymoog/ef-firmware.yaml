device: moog-memorymoog
name: +EF firmware
summary: Replacement firmware for the Memorymoog Plus with faster MIDI note-on timing, SysEx send and receive, aftertouch, arpeggiator clock sync and steadier arpeggiator timing. Announced as a paid upgrade for 1 December 2026.
description: >-
  Eric Frampton's firmware replaces the Memorymoog Plus operating code. The product page lists faster note-on timing over MIDI
  and from the local keyboard, with note-ons up to 2.5 times faster over MIDI, SysEx send and receive for all patches or one
  patch, MIDI aftertouch reception and mapping, MIDI clock sync for the arpeggiator, steadier arpeggiator timing from the LFO,
  external clock and MIDI clock, and a PROG VOL setting that stays active on the panel. A longer feature list is a PDF on
  the page. It needs a Memorymoog Plus and does not work with a model without the Plus MIDI interface or with third-party MIDI
  interfaces. Pitch bend and foot control over MIDI need the hardware modifications described in dBm Technical Services'
  update. A MATRIXSYNTH post says it is delivered as custom-burned EPROMs that replace four chips, needs healthy RAM, and drops
  the cassette save and verify, the sequencer, program chains and MIDI out other than SysEx send. The page links a
  preliminary user manual (version 0.25), a RAM and DMUX test EPROM image and factory patch sets as .syx files. No price,
  source or licence terms were found.
status: announced
authors:
  - name: Eric Frampton
    url: https://ericframpton.com/
source_status: closed
license: proprietary
license_notes: Closed commercial firmware; no source repository and no licence text.
homepage: https://ericframpton.com/memorymoog/
distribution: commercial
requires_stock: Memorymoog Plus
install_notes: >-
  Per the MATRIXSYNTH post, the firmware is supplied on custom-burned EPROMs that replace four chips in the instrument;
  the product page lists availability from 1 December 2026 and gives no price or installation steps beyond a preliminary
  manual. Pitch bend and foot control over MIDI need hardware modifications from the dBm documentation.
brick_risk: false
tags: [midi, sysex, aftertouch, arpeggiator, commercial, eprom, retro]
