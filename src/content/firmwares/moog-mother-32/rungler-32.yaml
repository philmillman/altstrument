device: moog-mother-32
name: Rungler-32
summary: Unofficial firmware that turns the Mother-32 sequencer into a Rungler-style shift register and adds a tape-style digital delay on the TEMPO input.
description: >-
  Rungler-32 replaces the sequencer firmware with an 8-bit shift register clocked by the GATE input, an internal clock
  or MIDI clock, in the manner of Rob Hordijk's Rungler. The GLIDE knob sets the chance that a step flips a bit and
  locks the pattern at its ends, as on a Turing Machine. The lower-row keys set the register length, and
  KB out is quantised to C major by default. It also adds a digital delay of about 0.52 seconds, stored as 4-bit
  ADPCM, that takes audio on TEMPO and comes out on ASSIGN, with clock sync, feedback and a freeze input. MIDI notes
  play the synth with last-note priority. It is not made or supported by Moog Music, and nothing is saved between
  power cycles. The repository holds the C++ source, a build script and a panel diagram.
status: active
authors:
