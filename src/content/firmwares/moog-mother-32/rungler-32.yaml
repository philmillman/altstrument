source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The LICENSE file is the GPLv3 text; the README states "GPL-3.0-or-later".
distribution: download
install_notes: >-
  Send Moog's ERASE file twice from a SysEx tool over a MIDI interface, then send rungler32.syx from the release
  page. The ERASE file comes from Moog's own firmware package and is not included in the repository. To go back,
  send the ERASE file twice and then Moog's firmware file. If the synth does not answer ERASE, power it on holding
  RESET with TEMPO fully anticlockwise and SUSTAIN off to enter update mode.
brick_risk: false
