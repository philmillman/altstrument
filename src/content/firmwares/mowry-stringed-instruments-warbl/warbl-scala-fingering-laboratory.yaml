device: mowry-stringed-instruments-warbl
name: WARBL Scala Fingering Laboratory
kind: tool
summary: Browser app for designing WARBL and WARBL2 fingering maps for Scala microtonal tunings. It imports .scl files, proposes fingerings, plays the pitches with a built-in reed synth, reads the live sensors over Web MIDI, and exports a mapping and a preset file.
description: >-
  The lab compares a familiar fingering, a tuning-specific one and a hybrid, and offers practice, notation and listening views, scenes and a flight recorder that saves sensor traces as JSON for bug reports. It can route retuned notes to
  an external synth over MIDI or MPE. A reference preset for WARBL2 is in the repository. The whole app is one HTML file of about 8 MB, and the repository also keeps the earlier v1.0 file. It is unofficial.
status: active
