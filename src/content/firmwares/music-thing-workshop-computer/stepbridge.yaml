homepage: https://github.com/sjbrownrigg/workshop-computer/tree/main/stepbridge
distribution: download
install_notes: >-
  Hold the small button on the back of the module while connecting USB so it mounts as RPI-RP2, then copy stepbridge.uf2
  from the release onto the drive. Open stepbridge/web/index.html from a download of the repository in Chrome or Edge and
  click Connect. No hosted copy of the page was found.
