device: music-thing-workshop-computer
name: Zodiac Card
summary: >-
  Markov chain sequencer program card for the Workshop System Computer. A graph of pitch nodes with weighted links drives two chains that output scale-quantised CV, gates and sine audio, with a browser view of the graph over Web MIDI.
description: >-
  Nodes hold pitches, and each clock step walks a chain to the next node by the weights of its outgoing links. Two chains
  share the graph, each with its own pulse input, CV and gate outputs and audio channel. New nodes link to the newest node, and the main knob adds
  extra random links. There are 16 nodes, eight scales and an auto mode that adds nodes on a timer. The graph is stored in flash. A
  SvelteKit page shows a force-directed graph with the chains moving through it, lets you add, link and delete nodes, and talks to the card over USB MIDI and
  SysEx. The hosted copy also offers the UF2 files for download. The author calls it a prototype built late at night with heavy LLM use
  and little testing. No card of this name is in the Workshop_Computer releases folder at the time of writing.
