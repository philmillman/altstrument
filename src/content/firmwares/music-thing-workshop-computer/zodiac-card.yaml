install_notes: >-
  Hold the card's boot button while connecting USB so it mounts as RPI-RP2, then copy a zodiac-card .uf2 file onto it. The
  hosted page links v0.3.1, and the repository holds the UF2 builds too. Build from source with the Arduino IDE, the Earle Philhower RP2040 core 5.5.0
  or later, the Pico SDK USB stack and the Raspberry Pi Pico board. Use Chrome for the web page.
