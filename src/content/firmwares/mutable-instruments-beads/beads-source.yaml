device: mutable-instruments-beads
name: Beads (official source)
summary: Source code for the Beads firmware and its bootloader, published by Émilie Gillet in October 2026 in the pichenettes/eurorack repository. It builds on a desktop; the author has not verified module builds.
description: >-
  Beads was the one Mutable Instruments module whose code and schematics were
  not public. The beads folder in the pichenettes/eurorack repository now holds
  the application, the audio bootloader, drivers, DSP code, resources, test and
  factory-test code and the hardware design files, next to the other modules.
  The repository README says the code is provided as is, builds on a desktop
  platform and has not been verified to build and run on a module, and that
  installing it is at your own risk. The Mutable Instruments name must not be
  used on derivative works. The Drizzlet build is made from this source.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/beads
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for the STM32 code and CC BY-SA 3.0 for
  hardware; the Beads source files carry the MIT notice (Émilie Gillet, with
  credits to Frédéric Meslin and Oliver Rockstedt). The repository has no
  top-level LICENSE file.
homepage: https://github.com/pichenettes/eurorack
distribution: source-only
install_notes: >-
  Build with the makefile in the beads folder and the ARM toolchain. The module
  takes firmware updates as audio through its own bootloader. Recalibration data
  lives in a settings sector that a recovery flash can overwrite, so back it up
  first, and note the README's warning that module builds are unverified. The
  Beads manual says to repeat the update from the start if the module does not
  restart at the end of the file.
brick_risk: false
tags: [official, granular, fx, open-source]
