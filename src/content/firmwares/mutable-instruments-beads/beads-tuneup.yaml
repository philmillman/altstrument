license: MIT
license_notes: >-
  Beads source files carry the Mutable Instruments MIT notice; the release ships
  a NOTICE.txt with the collected licences. The fork has no top-level LICENSE
  file.
homepage: https://github.com/insolentconstruct/eurorack/releases/tag/beads-tuneup-2026.11.09
distribution: download
install_notes: >-
  Install by audio like any Beads update: unplug all CV cables, patch the audio
  interface to IN L, set TIME near the middle, power on with FREEZE held and
  play the WAV from the release's WAV zip at its supplied level. The combo zip
  is for an external programmer and includes the bootloader. The audio updater
  is not touched, so a stock firmware can be put back the same way. The README
  describes a SEED-at-power-up repair for a module whose calibration copies are
  both lost.
brick_risk: false
