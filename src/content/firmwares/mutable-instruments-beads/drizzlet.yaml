device: mutable-instruments-beads
name: Drizzlet
summary: Beta community build of the released Beads source. Fixes a frozen-delay crash and unsafe buffer saves, and adds a four-page options page with Clouds-style reverb and diffusion, pitch scales, a Plaits synth, Spectral processing and buffer trim.
description: >-
  Drizzlet starts from the Beads source published by Mutable Instruments and
  keeps the stock settings layout, so the stock firmware and Drizzlet can read
  each other's saved frozen buffers. Changes so far are bug fixes (an
  out-of-range read in frozen delay with negative FM, a few undefined reads, a
  division by zero on very fast clocks) and checked, interruption-safe buffer
  saves. New behaviour comes through an options page opened by holding ASSIGN:
  output limiter (stock, fast release or off) and automatic or manual
  control of the wavetable synth. Holding MEDIA and then pressing SEED toggles the original
  monophonic grain code. Beta 1 grows the options page to three pages with a
  Clouds-style reverb, pitch scales, stereo width and delay mode settings, and
  adds buffer trim. Beta 2 grows it to four pages and adds adjustable grain
  diffusion, a six-voice Plaits synth with 24 models, Spectral processing, attack
  snapping, evolving frozen feedback, scale banks edited in Hygrostat and
  quieter converter switching. The author says it has been tested only on a
  single module and calls for testers.
status: active
authors:
  - name: Insolent Construct
    url: https://github.com/insolentconstruct
source: https://github.com/insolentconstruct/eurorack
source_status: open
license: MIT
license_notes: >-
  Beads source files carry the Mutable Instruments MIT notice (Émilie Gillet,
  with credits to Frédéric Meslin and Oliver Rockstedt); the build kit in
  beads/build is MIT. The README says the manual excerpt and hardware designs
  are CC-BY-SA 3.0. The fork has no top-level LICENSE file.
homepage: https://github.com/insolentconstruct/eurorack/blob/drizzlet/beads/build/README.md
distribution: download
requires_stock: Official Beads firmware (the 2021 release was the tested baseline)
install_notes: >-
  Installed with the normal Beads audio update using the wav file from the
  release. The README gives OpenOCD commands to back up and restore the
  settings and calibration sector and to do an ST-Link recovery flash, and
  warns that holding SEED at power-on resets settings. Turn monophonic grains
  off before going back to stock firmware. A separate one-off recovery image
  for a module that no longer starts is listed as Drizzlet storage recovery.
brick_risk: true
tags: [granular, fx, bugfixes]
versions:
