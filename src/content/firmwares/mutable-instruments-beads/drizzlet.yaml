    notes: Beta 2 "Fog". Adds adjustable grain diffusion, a Plaits synth, Spectral processing, attack snapping and evolving frozen feedback, with custom scale banks through Hygrostat and fewer converter pops. Peak processor load on a heavy granular patch is 80% against 91% for stock, per the release notes.
