device: mutable-instruments-frames
name: Frames (official source)
summary: Source code for the Frames firmware and its bootloader, published by Émilie Gillet in the pichenettes/eurorack repository, with the hardware design files.
description: >-
  The frames folder in the pichenettes/eurorack repository holds the
  application for the module's STM32F103, the audio bootloader, drivers, the
  keyframer and poly LFO code, resources and the hardware design files. The
  repository README asks that the Mutable Instruments name not be used on
  derivative works.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/frames
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code, GPL 3.0 for AVR code and CC
  BY-SA 3.0 for hardware. The Frames source files carry the MIT notice (Émilie
  Gillet). The repository has no top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/frames/
distribution: source-only
requires_stock: "1.2"
install_notes: >-
  Build with the makefile in the frames folder and the ARM toolchain. The module
  takes firmware updates as audio through its own bootloader: power on with ADD
  held, feed the update file into the FRAME modulation input with the modulation
  attenuverter at maximum, and the unit reboots after the last packet. Unplug
  other CV connections first. The manual says that if the level is wrong the
  LEDs blink and the knob turns red, and that you adjust the level, press ADD
  and restart the file.
brick_risk: false
tags: [official, mixer, lfo, open-source]
versions:
  - version: master @ 1ea2d1e
    date: 2021-11-13
    url: https://github.com/pichenettes/eurorack/commit/1ea2d1e
    notes: No tagged releases; this is the latest commit touching the frames folder.
