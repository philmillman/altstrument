homepage: https://mqtthiqs.github.io/parasites/frames.html
distribution: download
install_notes: >-
  Download the latest build from the project page, unzip it and follow the
  firmware update procedure in the official Frames manual, then calibrate by
  unplugging all cables and holding Del while the module powers up. The project
  page gives no module-specific bootloader warning; the Clouds build's caution
  about faulty bootloaders applies to a different module. A failed transfer is
  retried as the Frames manual describes.
brick_risk: false
