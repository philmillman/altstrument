device: mutable-instruments-frames
name: Parasites (Frames)
summary: Frames firmware adding a quad Euclidean sequencer, a shift register sequencer, a step editing mode, an autoplay keyframer and four extra preset memory slots.
description: >-
  Five modes are selected by pressing both buttons and moving a knob: the
  keyframer, an improved quad sequencer, the shift register sequencer, the quad
  LFO and the Euclidean sequencer. The keyframer wraps around between the last
  and first frame, and its autoplay submode loops the animation at a rate set
  by CV. Presets are saved to four user slots besides the startup slot. The
  project page says to calibrate after updating (hold Del while powering up),
  because wraparound and autoplay speed depend on it. Part of the Parasites
  project; the Clouds, Tides and Warps builds are listed under their own
  modules.
status: dormant
