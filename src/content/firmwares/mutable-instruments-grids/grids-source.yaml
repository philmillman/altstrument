device: mutable-instruments-grids
name: Grids (official source)
summary: Source code for the Grids firmware and bootloader, published by Émilie Gillet in the pichenettes/eurorack repository, with the hardware design files.
description: >-
  The grids folder in the pichenettes/eurorack repository holds the AVR
  application for the module's ATmega328P, a bootloader, the pattern generator
  and clock code, the drum pattern resources and the hardware design files. It
  builds with the avrlib library and a makefile in the folder. Other projects
  have reused the pattern generator, for example Sorrow for the Daisy Patch.
  The repository README asks that the Mutable Instruments name not be used on
  derivative works.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/grids
source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The repository README gives GPL 3.0 for AVR code, MIT for STM32 code and CC
  BY-SA 3.0 for hardware. The Grids source files carry a GPL header that says
  version 3 or, at your option, any later version. The repository has no
  top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/grids/
distribution: source-only
install_notes: >-
  Build with the makefile in the grids folder and an AVR toolchain. The makefile
  has a bootstrap rule that programs the application and bootloader with avrdude
  over ISP and sets the fuses and lock bits, and a rule that encodes an audio
  update file. The documentation site gives no update procedure and only offers
  the original image, which it says reverts the module to stock, and a 5 ms
  trigger build. Keep a backup of the stock image before flashing.
brick_risk: false
tags: [official, drums, sequencer, open-source]
