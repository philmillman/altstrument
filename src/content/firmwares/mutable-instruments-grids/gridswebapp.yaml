device: mutable-instruments-grids
name: GridsWebApp
kind: tool
summary: >-
  Browser editor and sequencer for the Grids drum map: morph between the factory nodes, edit 32-step kick, snare and hi-hat patterns with velocity, listen to the result and export a patched firmware WAV.
description: >-
  GridsWebApp holds the full 25-node Grids drum map in the browser. The X and Y controls morph between nodes as on the module, and edits made on the step grid are written back into every node that contributes to the current morph. A 32-step grid sets kick, snare and hi-hat hits with per-step velocity, shows which steps are stable, which depend on Chaos and which stay silent at the current Density and Chaos, and plays through a built-in drum synth with a lookahead scheduler. The Density and Chaos behaviour follows the module's firmware, including the Chaos boost that is rolled once per bar for each instrument.

  For firmware work it decodes the bundled stock Grids 1.0 image, checks it, patches only the drum-map nodes you changed and round-trips the audio encoding before it exports a patched WAV, a full lookup_tables.py and a JSON snapshot of the editor state. The repository also holds the original Grids firmware and bootloader source for its regression checks.
status: active
