source: https://github.com/bayanisms/GridsWebApp
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is MIT. THIRD_PARTY.md says the grids/ reference firmware source, the factory drum-map tables and the bundled grids_1.0.wav are from Mutable Instruments Grids by Émilie Gillet, whose firmware files carry a GPL-3.0-or-later header; those files keep their own notices. The bundled WAV is Mutable Instruments' own Grids image, and its firmware is open source, so it is not treated as redistributed closed stock.
homepage: https://bayanisms.github.io/GridsWebApp/
distribution: browser-installer
install_notes: >-
  Open the web app and edit; nothing is installed. The export step produces a patched WAV for the module's audio update, and the README says the bootloader boundary at 0x7000 is checked so that only the application area changes. Keep a copy of the stock image, since Grids can be returned to it with the original WAV.
