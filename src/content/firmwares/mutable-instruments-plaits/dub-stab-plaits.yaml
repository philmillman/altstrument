homepage: https://narti-live.github.io/dub-base-Plaits/
distribution: download
install_notes: >-
  Unplug all cables, set FREQUENCY to noon, hold the left button while powering on and
  play the firmware WAV from the repository's downloads folder into MODEL at about 80
  percent volume, or use the flasher on the project site. A raw .bin is provided for
  SWD flashing. To go back, install the official Plaits firmware WAV the same way.
  The README warns that this is unofficial firmware and used at your own risk.
  The README puts the application at 0x08008000, above the stock audio bootloader that the WAV does not
  replace, so a failed or interrupted install is retried by powering on in bootloader mode and playing a WAV
  again.
brick_risk: false
