device: mutable-instruments-plaits
name: DUB STAB PLAITS
summary: Plaits firmware that turns the module into a clocked, generative dub techno chord sequencer in C minor, with an envelope on the FREQUENCY knob, a root-note CV on AUX and an Android app running the same code.
description: >-
  A TRIG clock plays a 16-step pattern of chord stabs, or single notes, in C minor.
  FREQUENCY sets the envelope, the three main knobs shape the chord model, and the
  small attenuverters set density, pattern length and speed, including triplets.
  The buttons step through the models, start a new pattern and switch between chords
  and notes, and a 1 V/oct CV on AUX sets the root. A second build, Cm DEEP, uses
  open voicings such as minor sevenths and ninths, stacked fourths and suspended
  chords, with no major chords. The output is dry, so delay and reverb come from
  other modules. The repository also holds an Android app that runs the same
  firmware code, and Max for Live devices. The firmware changes are a patch series
  against Mutable Instruments' Plaits source, and the README says the published
  source is an early development version, with the full source to come with the
  current beta. Commit messages credit Claude as co-author. The author tested the
  firmware in an emulator and on a Plaits clone, not on every hardware revision.
