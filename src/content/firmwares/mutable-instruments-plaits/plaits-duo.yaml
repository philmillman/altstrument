    url: https://andreasjansson.se
source: https://github.com/andreasjansson/plaits-duo
source_status: open
license: MIT
license_notes: >-
  The LICENSE file credits Emilie Gillet for the original Plaits firmware, stmlib and the audio
  bootloader, and Andreas Jansson for the duo mode, tests and tools. GitHub reports it as
  NOASSERTION because of the two copyright lines.
homepage: https://andreasjansson.github.io/plaits-duo/
distribution: download
requires_stock: Plaits with the audio bootloader (built on v1.1)
install_notes: >-
  Take the firmware update file from the web page, or build it with make wav and the Arm GNU
  toolchain. Hold the left button while powering the module on and play the WAV file into the
  MODEL CV input, as for an official update. Calibrating LEVEL against V/OCT is recommended
  after installing. The README says the original firmware can be reinstalled at any time.
  The update goes through the stock audio bootloader, which the update file does not replace, so a failed
  install is retried or reverted by powering on in bootloader mode and playing a WAV again.
brick_risk: false
tags: [ai-assisted, synth-engine, oscillator, stereo, open-source]
