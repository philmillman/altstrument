device: mutable-instruments-plaits
name: Plaits duo
summary: Plaits v1.1 firmware with a duo mode that plays two voices of one model, the second pitched by the LEVEL input, mixed in stereo on OUT and AUX or split with one voice per output.
description: >-
  Pressing both model buttons together enters or leaves duo mode, which offers eight models in a
  stereo layout (yellow LED) and the same eight in a split layout (red LED). In the stereo layout
  each model gets its own stereo treatment, such as detuned saws, an offset wavefolder, a moving
  allpass diffuser, per-harmonic phase differences, a Juno-style chorus or a string-machine
  ensemble. LEVEL sets the second voice's pitch at 1 V per octave, and with nothing patched
  there is a single voice. Holding both buttons for two seconds in duo mode starts a LEVEL
  calibration against V/OCT. The original firmware is otherwise unchanged and its output
  matches v1.1; to make room in flash the factory test mode is removed. The settings are
  compatible with stock, so you can go back to the original firmware. A web page runs the
  firmware in WebAssembly with a simulated module and offers the update file. The commit
  history shows that Claude was used in development.
status: active
authors:
