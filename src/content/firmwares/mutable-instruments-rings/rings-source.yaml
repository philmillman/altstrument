device: mutable-instruments-rings
name: Rings (official source)
summary: Source code for the Rings firmware and its audio bootloader, published by Émilie Gillet in the pichenettes/eurorack repository. The documentation site lists v1.1 as the latest release.
description: >-
  The rings folder in the pichenettes/eurorack repository holds the
  application, the audio bootloader, drivers, the modal resonator, string and
  FM voice DSP code, resource generators, a desktop test program and the
  hardware design files. Shared libraries (stmlib and the audio bootloader
  encoder) are git submodules of that repository. The repository has no
  version tags. The Mutable Instruments documentation site lists v1.1 as the
  latest official release. The Mutable Instruments name must not be used on
  derivative works. The Lyle Mills Rings alt firmware (Mini-Elements) is a
  catalogued alternate firmware for this module, and Rings Versio on the Noise
  Engineering Versio is a port to other hardware.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/rings
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code and CC BY-SA 3.0 for
  hardware. The Rings application, driver, bootloader and DSP files carry the
  MIT notice (Copyright Émilie Gillet). One file, test/rings_test.cc, carries
  a GPL notice for version 3 or any later version; it is the desktop test
  program, not module code. The repository has no top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/rings/
distribution: source-only
install_notes: >-
  Build with the makefile in the rings folder and the ARM toolchain; the wav
  target encodes the binary as an audio update file. Official updates install
  through the module's bootloader: unplug all CV, play the file into the IN
  input with the FREQUENCY knob at 12 o'clock, and power on with the polyphony
  button pressed. The LEDs blink orange while waiting and red with an
  alternating pattern if the level is wrong, and the manual says to press the
  polyphony button and retry. The manual's calibration procedure is the way to
  restore tuning if calibration data is lost.
  In the pichenettes/eurorack source the bootloader is a separate program that the update file does not
  contain; the update writes only the application above it, so a failed or interrupted install is retried by
  powering on in bootloader mode and sending the file again.
brick_risk: false
tags: [official, physical-modeling, synth-engine, open-source]
