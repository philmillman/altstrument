homepage: https://github.com/m9dfukc/sgnir-workbench#readme
based_on: mutable-instruments-rings/rings-source
distribution: download
requires_stock: Stock Rings with the audio bootloader
install_notes: >-
  Play the release's sgnir-<version>.wav into the IN jack through the audio bootloader: hold the left button at
  power-on, set FREQUENCY near noon and play the file from the start. The raw .bin is for SWD only. To build from
  source, use an Arm GNU toolchain (the README used 12.2.Rel1) and the makefile's bin target, which gives
  build/rings/rings.bin at address 0x08008000. The bootloader is not part of the application image, so a failed
  install is retried by entering bootloader mode and playing the update again, and the official Rings WAV goes
  back the same way.
brick_risk: false
tags: [physical-modeling, modes, performance, calibration, allpass, open-source]
versions:
  - version: v0.3.0
    date: 2026-11-21
    url: https://github.com/m9dfukc/eurorack-mi-sgnir/releases/tag/v0.3.0
    notes: Changes the Schliere excitation, so the noise burst becomes a mallet pulse, a pitched ping is added and the strummer runs in the bank, exciting on a V/OCT note change when STRUM and IN are unpatched. The release page itself only covers installing the WAV; this is from the tagged commits.
  - version: v0.2.0
    date: 2026-11-21
    url: https://github.com/m9dfukc/eurorack-mi-sgnir/releases/tag/v0.2.0
    notes: Adds Schliere L, a 98-stage chain as a second variant cycled with the right button, and cuts the Schliere processor load by about a quarter.
  - version: v0.1.0
    date: 2026-11-20
    url: https://github.com/m9dfukc/eurorack-mi-sgnir/releases/tag/v0.1.0
    notes: First release, with frequency locking, the stricter calibration and the Schliere bank as a third bank.
