device: mutable-instruments-rings
name: eurorack-mi-sgnir
summary: Slim source tree and audio-update releases of Rings firmware at a pinned upstream commit, with frequency locking, octave snapping on the frequency knob, a stricter calibration gesture and Schliere, a third bank built on a long chain of allpass filters.
description: >-
  A snapshot of only the folders the Rings firmware needs, with stmlib and the audio bootloader vendored, so a clone
  builds without submodules. It is not a GitHub fork of the upstream monorepo. Changes on top of the unmodified base
  are separate commits. Holding both buttons for a short time toggles frequency locking, and while locked the
  frequency knob becomes an octave switch; the idea comes from Lyle Mills's alternative firmware. Calibration now
  needs both buttons held for six seconds, and the CV zero points are applied only when calibration succeeds. The new
  settings use formerly unused bytes, so settings saved by stock firmware are kept. Schliere, a third bank, is a chain
  of second-order allpass filters with feedback ported from the author's OWL patch, in a 61-stage variant S (48 kHz
  or 96 kHz feedback path) and a 98-stage variant L, selected with the right button. The README still says the
  differences from stock are not yet tested on hardware, and reports CPU load measured on a module on 2026-11-21.
  Releases are built by GitHub Actions and include the WAV for the audio bootloader, a raw .bin for SWD and
  checksums. The author's companion repository, sgnir-workbench, holds the planning notes,
  research on Rings forks and flashing options, the Schliere reference sources and Python tools for the audio
  bootloader's encoding; it is not a firmware itself. The name avoids the Mutable Instruments module name, as the
  company asked forks to do.
