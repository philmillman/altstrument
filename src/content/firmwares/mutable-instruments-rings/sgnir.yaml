device: mutable-instruments-rings
name: eurorack-mi-sgnir
summary: Slim source tree for the Rings firmware at a pinned upstream commit, with frequency locking, octave snapping on the frequency knob and a stricter calibration gesture; a Schliere allpass-chain mode is planned.
description: >-
  A snapshot of only the folders the Rings firmware needs, with stmlib and the audio bootloader vendored, so a clone
  builds without submodules. It is not a GitHub fork of the upstream monorepo. Changes on top of the unmodified base
  are separate commits. Holding both buttons for a short time toggles frequency locking, and while locked the
  frequency knob becomes an octave switch; the idea comes from Lyle Mills's alternative firmware. Calibration now
  needs both buttons held for six seconds, and the CV zero points are applied only when calibration succeeds. The new
  settings use formerly unused bytes, so settings saved by stock firmware are kept. The README says the build is not
  yet tested on hardware and that Schliere, a chain of 61 second-order allpass filters with feedback ported from the
  author's OWL patch, is still to come. The author's companion repository, sgnir-workbench, holds the planning notes,
  research on Rings forks and flashing options, the Schliere reference sources and Python tools for the audio
  bootloader's encoding; it is not a firmware itself. The name avoids the Mutable Instruments module name, as the
  company asked forks to do.
