homepage: https://github.com/m9dfukc/sgnir-workbench#readme
based_on: mutable-instruments-rings/rings-source
distribution: source-only
requires_stock: Stock Rings with the audio bootloader
install_notes: >-
  Build with an Arm GNU toolchain (the README used 12.2.Rel1) and the makefile's bin target, which gives
  build/rings/rings.bin at address 0x08008000, then install it the usual Rings way as a WAV through the audio
  bootloader. The build is not yet tested on hardware. The bootloader is not part of the application image, so a
  failed install is retried by entering bootloader mode and playing the update again.
brick_risk: false
