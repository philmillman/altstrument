homepage: https://www.thisisbribery.com/bribestages/
based_on: mutable-instruments-stages/qiemem-multimode
distribution: download
requires_stock: Any Stages firmware; settings reset when coming from stock, and are kept from qiemem v1.3.0
install_notes: >-
  Power off, patch an audio output into the rightmost segment's CV input, hold the rightmost button while powering on, and
  play the WAV from the start at a level where three or four button lights are lit. The load takes about 80 seconds. Use
  the flipped file for an upside-down module. Recovery: the built-in audio updater cannot be damaged by a failed attempt, so
  the update can be repeated; qiemem's v1.3.0 WAV restores that firmware the same way.
brick_risk: false
tags: [lfo, envelopes, follower, clock-sync, synth-engine]
