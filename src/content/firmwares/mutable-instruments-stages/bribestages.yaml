device: mutable-instruments-stages
name: BRIBESTAGES
summary: Stages firmware built on qiemem's bipolar v1.3.0 that adds button-set segment linking, envelope follower segments and clock-locked sync LFO segments.
description: >-
  BRIBESTAGES, formerly named Qiemem Bribery Edition, keeps everything in qiemem's bipolar multi-mode firmware and adds
  three things. Segment linking lets the buttons decide which segments form an envelope group instead of the gate jacks, so
  patching a cable does not change the groups. Follow segments turn a segment into an envelope follower for audio patched
  into its CV jack, with release on the slider, attack on the pot and a selectable input gain. Sync LFO segments, once
  linked, each run their own LFO locked to one clock in the first segment's gate, with a clock division or multiple,
  waveform shape and phase per segment. Linking and the new segment types work in the three segment generator modes with
  one module. Settings from qiemem's firmware carry over, and releases come as a normal and a flipped image for an
  upside-down module. The repository holds the source for qiemem's code plus these changes, the Mutable library code it
  needs, a script that turns a firmware binary into an update WAV and host tests.
