device: mutable-instruments-stages
name: Stages (official source)
summary: Source code for the Stages firmware and its audio bootloader, published by Émilie Gillet in the pichenettes/eurorack repository. The documentation site lists v1.2 as the final release.
description: >-
  The stages folder in the pichenettes/eurorack repository holds the
  application, the audio bootloader, drivers, the segment generator, LFO,
  envelope and sequencer code, resource generators, a desktop test program and
  the hardware design files. Shared libraries (stmlib and the audio bootloader
  encoder) are git submodules of that repository. The repository has no
  version tags. The Mutable Instruments documentation site lists v1.2 as the
  latest and final official release, and says v1.2 took some ideas from a
  community fork. The Mutable Instruments name must not be used on derivative
  works. Stages multi-mode firmware (bipolar) is the catalogued alternate
  firmware for this module.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/stages
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code and CC BY-SA 3.0 for
  hardware. The Stages application, driver, bootloader and DSP files carry the
  MIT notice (Copyright Émilie Gillet). Two desktop test files,
  test/fixtures.h and test/stages_test.cc, carry a GPL notice for version 3 or
  any later version; they are not module code. The repository has no
  top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/stages/
distribution: source-only
install_notes: >-
  Build with the makefile in the stages folder and the ARM toolchain; the wav
  target encodes the binary as an audio update file (the makefile also keeps an
  older wav_old target). Official updates install through the module's
  bootloader: unplug all CV, play the file into the TIME/LEVEL CV input of the
  last segment with that slider at an intermediate position, and power on with
  the last segment's action selection button pressed. The six LEDs work as a
  level meter, the LEDs blink red if the level is wrong, and the manual says
  to press the button and retry.
  In the pichenettes/eurorack source the bootloader is a separate program that the update file does not
  contain; the update writes only the application above it, so a failed or interrupted install is retried by
  powering on in bootloader mode and sending the file again.
brick_risk: false
tags: [official, envelopes, lfo, open-source]
