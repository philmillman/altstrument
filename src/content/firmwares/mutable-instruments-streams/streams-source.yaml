device: mutable-instruments-streams
name: Streams (official source)
summary: Source code for the Streams firmware and its bootloader, published by Émilie Gillet in the pichenettes/eurorack repository, with the hardware design files.
description: >-
  The streams folder in the pichenettes/eurorack repository holds the
  application for the module's STM32F103, the audio bootloader, drivers, the
  envelope, vactrol, follower and compressor code, a Lorenz generator, resources
  and the hardware design files. The repository README asks that the Mutable
  Instruments name not be used on derivative works.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/streams
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code, GPL 3.0 for AVR code and CC
  BY-SA 3.0 for hardware. The Streams source files carry the MIT notice
  (Émilie Gillet). The repository has no top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/streams/
distribution: source-only
requires_stock: "1.01"
install_notes: >-
  Build with the makefile in the streams folder and the ARM toolchain. The
  module takes firmware updates as audio through its own bootloader: power on
  with channel 1's function button held, feed the update file into channel 1's
  EXCITE input with channel 1's SHAPE knob at its middle position, and the
  module restarts when the file ends.
  In the pichenettes/eurorack source the bootloader is a separate program that the update file does not
  contain; the update writes only the application above it, so a failed or interrupted install is retried by
  powering on in bootloader mode and sending the file again.
brick_risk: false
tags: [official, envelopes, dynamics, open-source]
versions:
  - version: master @ c5f910f
    date: 2022-01-22
    url: https://github.com/pichenettes/eurorack/commit/c5f910f
    notes: No tagged releases; this is the latest commit touching the streams folder.
