device: mutable-instruments-tides-2018
name: Tides 2018 (official source)
summary: Source code for the Tides 2018 firmware and its bootloader, published by Émilie Gillet in the tides2 folder of the pichenettes/eurorack repository, with the hardware design files.
description: >-
  The tides2 folder in the pichenettes/eurorack repository holds the
  application for the 2018 module's STM32F373, the audio bootloader, drivers,
  the poly slope generator, ramp extractor and clock-tracking code, settings
  storage, factory test code, resources, a unit test and the hardware design
  files. The repository README asks that the Mutable Instruments name not be
  used on derivative works.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/tides2
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code, GPL 3.0 for AVR code and CC
  BY-SA 3.0 for hardware. The tides2 source files carry the MIT notice (Émilie
  Gillet), except the unit test files, which carry a GPL-3.0-or-later header.
  The repository has no top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/tides_2018/
distribution: source-only
requires_stock: "1.2"
install_notes: >-
  Build with the makefile in the tides2 folder and the ARM toolchain. The
  module takes firmware updates as audio through its own bootloader: power on
  with the frequency range button held, feed the update file into the SLOPE CV
  input with the SLOPE knob at an intermediate position, and the module
  restarts when the file ends. Calibration and settings are stored on the
  module, so note them before a recovery flash.
  In the pichenettes/eurorack source the bootloader is a separate program that the update file does not
  contain; the update writes only the application above it, so a failed or interrupted install is retried by
  powering on in bootloader mode and sending the file again.
brick_risk: false
tags: [official, lfo, envelopes, open-source]
versions:
