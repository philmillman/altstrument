homepage: https://mqtthiqs.github.io/parasites/tides.html
distribution: download
install_notes: >-
  Download the latest build from the project page, unzip it and follow the
  firmware update procedure in the official Tides manual, then recalibrate
  using the Parasites method described on the project page. The project page
  gives no module-specific bootloader warning; the Clouds build's caution
  about faulty bootloaders applies to a different module.
  The update goes through the stock audio bootloader, which the update file does not replace, so a failed
  install is retried or reverted by powering on in bootloader mode and sending a firmware file again.
brick_risk: false
