device: mutable-instruments-tides-original
name: Parasites (Tides)
summary: Original Tides firmware adding a 16-harmonic Two-bumps oscillator, a Two-drunks random walk generator and a built-in quantizer with seven scales.
description: >-
  Built for the original 2014 Tides, not Tides 2018. The Parasites repository
  folder for it is the STM32F103 code with the original module's plotter easter
  egg, the last release is from 2017 and the project page names no later
  hardware. Modes are switched by pressing both buttons: the stock function
  generator, Two-bumps and Two-drunks. Two-bumps sums sine harmonics shaped by
  two spectral bumps or notches and has a sub-oscillator, a 1-bit output and a
  shuffled-harmonics output. Two-drunks runs two random walks timed by a
  jittery clock and a biased coin-toss clock. The quantizer works in every
  mode. The plotter easter egg is removed, and calibration is entered by
  powering up while holding the Range control instead of the stock method.
  Part of the Parasites project; the Clouds, Frames and Warps builds are
  listed under their own modules.
status: dormant
