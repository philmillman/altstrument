device: mutable-instruments-tides-original
name: Tides (official source)
summary: Source code for the original 2014 Tides firmware and its bootloader, published by Émilie Gillet in the pichenettes/eurorack repository, with the hardware design files.
description: >-
  The tides folder in the pichenettes/eurorack repository holds the
  application for the original module's STM32F103, the audio bootloader,
  drivers, the waveform generator and plotter code, an easter egg, resources, a
  unit test and the hardware design files. The 2018 module has its own folder,
  tides2. The repository README asks that the Mutable Instruments name not be
  used on derivative works.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/tides
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code, GPL 3.0 for AVR code and CC
  BY-SA 3.0 for hardware. The Tides source files carry the MIT notice (Émilie
  Gillet), except the unit test, which carries a GPL-3.0-or-later header. The
  repository has no top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/tides_original/
distribution: source-only
requires_stock: "1.1"
install_notes: >-
  Build with the makefile in the tides folder and the ARM toolchain. The module
  takes firmware updates as audio through its own bootloader: power on with the
  mode switch held, feed the update file into the FM input, and the unit
  reboots after the last packet. Unplug other CV connections first.
  In the pichenettes/eurorack source the bootloader is a separate program that the update file does not
  contain; the update writes only the application above it, so a failed or interrupted install is retried by
  powering on in bootloader mode and sending the file again.
brick_risk: false
tags: [official, lfo, envelopes, open-source]
versions:
