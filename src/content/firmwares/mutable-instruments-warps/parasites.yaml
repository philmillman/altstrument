device: mutable-instruments-warps
name: Parasites (Warps)
summary: Warps firmware with nine selectable modes, adding a variable-rate tape-style delay, a binaural panner with Doppler simulation, a bit-mangler and a Chebyshev waveshaper alongside the stock algorithms.
description: >-
  The stock meta-modulator function is kept as the ninth mode, so after
  updating the module starts in a different mode from the one you are used to.
  Modes are chosen by holding the button and turning the big knob, with no CV
  control over the selection. The other modes are a wavefolder, the frequency
  shifter that is an easter egg in the stock firmware, a comparator with
  Chebyshev waveshaping and a vocoder. The delay mode has an open feedback
  loop, a dual delay, an analog-modelled delay and a ping-pong topology. The
  time needed to enter calibration is extended to eight seconds so that mode
  switching does not trigger it. Part of the Parasites project; the Clouds,
  Frames and Tides builds are listed under their own modules.
status: dormant
