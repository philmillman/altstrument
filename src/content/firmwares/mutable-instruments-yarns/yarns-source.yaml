device: mutable-instruments-yarns
name: Yarns (official source)
summary: Source code for the Yarns firmware and its SysEx bootloader, published by Émilie Gillet in the pichenettes/eurorack repository. The documentation site lists v1.5 as the final release.
description: >-
  The yarns folder in the pichenettes/eurorack repository holds the
  application, the SysEx bootloader, drivers, the MIDI handling, voice
  allocation, arpeggiator, sequencer and tuning code, a Scala scale editor
  script, resource generators and the hardware design files. Shared libraries
  (stmlib) are a git submodule of that repository. The repository has no
  version tags. The Mutable Instruments documentation site lists v1.5 as the
  latest and final official release. The Mutable Instruments name must not be
  used on derivative works. Loom is the catalogued alternate firmware for this
  module.
status: dormant
authors:
  - name: Émilie Gillet
    url: https://github.com/pichenettes
source: https://github.com/pichenettes/eurorack/tree/master/yarns
source_status: open
license: MIT
license_notes: >-
  The repository README gives MIT for STM32 code and CC BY-SA 3.0 for
  hardware. The Yarns application, driver and bootloader files carry the MIT
  notice (Copyright Émilie Gillet). One file, scale_editor/music/scala/scala.py,
  carries a GPL notice for version 3 or any later version; it is a desktop
  helper script, not module code. The repository has no top-level LICENSE file.
homepage: https://pichenettes.github.io/mutable-instruments-documentation/modules/yarns/
distribution: source-only
install_notes: >-
  Build with the makefile in the yarns folder and the ARM toolchain; the syx
  target produces a SysEx file. Unlike the audio modules, Yarns updates over
  MIDI: power on with the encoder pressed, send the SysEx file to the MIDI input
  with at least 100 ms between packets, and the display counts the data
  received and shows OK before restarting. On a transmission error the display
  shows Er and the transfer has to be restarted, with longer delays if the
  MIDI interface chokes. The manual suggests Elektron's C6 tool or Snoize SysEx
  Librarian. Presets saved under a custom firmware do not load on stock
  firmware and vice versa.
  In the pichenettes/eurorack source the bootloader is a separate program below the application, and the SysEx
  update writes only the application, so a failed transfer is retried by powering on with the encoder pressed
  and sending the file again.
brick_risk: false
tags: [official, midi, sequencer, open-source]
