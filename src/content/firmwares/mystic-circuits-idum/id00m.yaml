device: mystic-circuits-idum
name: ID00M
summary: Community firmware for the IDUM based on the stock v.99, adding per-channel clock multiply and divide, a merge option that layers modes over the triggers, linear drumming, a second break bank and bug fixes.
description: >-
  ID00M is a derivative of Eli Pechman's v.99 sketch made by 00 Modular. Each of the four channels gets its own
  multiply or divide setting for bursts and bouncing balls. A MERGE option lets a mode add to or subtract from the
  incoming triggers instead of replacing them. Other changes are an optional one-voice-at-a-time filter called linear
  drumming, a reworked delay, a second bank of break patterns, a break speed multiplier, a factory reset, a menu
  toggle for freezing PARAM in split mode, and a boot indicator that shows ID00M is running. Version 1.0.4 supports
  both LED ring orders found on different IDUM hardware revisions. The repository also holds a browser updater, a
  user manual and the unmodified v.99 source. It is not affiliated with Mystic Circuits.
status: active
authors:
