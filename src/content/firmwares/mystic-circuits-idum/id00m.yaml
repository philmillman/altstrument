    url: https://github.com/Mr-V1ct0r
source: https://github.com/Mr-V1ct0r/id00m
source_status: open
license: CC-BY-SA-4.0
license_notes: >-
  CC BY-SA 4.0 (LICENSE), the same licence as the v.99 source it derives from, with the changes listed in the
  changelog. The repository also commits idum_stock_v99.hex and idum_stock_v99.5.hex so users can revert. These are
  builds of Mystic Circuits' stock firmware, which is itself published as open source under CC BY-SA 4.0, so
  including them is not redistribution of closed firmware.
homepage: https://00modular.com/id00m/resources/
based_on: mystic-circuits-idum/idum-source
distribution: browser-installer
requires_stock: v.99
install_notes: >-
  Open the 00 Modular resources page in a Chromium-based desktop browser with the IDUM connected by USB, choose ID00M
  or stock v.99 and press update. The updater retries the unreliable onboard programmer and asks for an unplug and
  replug only when stuck. The same hex files can be flashed with avrdude, or the sketch built in the Arduino IDE for
  the Nano Every. Stock v.99 can be flashed back the same way. Version 1.0.4 resets saved settings to defaults on
  first start; holding LOOP at power-on switches the LED ring order.
brick_risk: false
tags: [open-source, sequencer, trigger, eurorack, clock, drums, browser-flasher]
