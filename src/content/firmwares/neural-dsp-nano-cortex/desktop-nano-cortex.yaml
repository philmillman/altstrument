device: neural-dsp-nano-cortex
kind: tool
name: Desktop Nano Cortex
summary: Tauri desktop app for macOS and Windows that controls the Nano Cortex over USB MIDI and reads its live state, preset names and knob positions over Bluetooth, with a preset browser, footswitch deck and an experimental tone editor. Linux builds are untested previews.
description: >-
  The author wrote it because browser tools need Web MIDI or Web Bluetooth and the pedal has no public preset or parameter
  interface, so all device access runs in Rust behind a React interface. Over USB it sends the pedal's documented
  Program Change and Control Change messages: preset recall, effect slots, tap tempo, tuner and expression. The pedal sends
  nothing back over USB, so the live state comes from a Bluetooth decoder the README calls experimental and provisional. The
  app lists all 64 presets in eight banks, shows and reassigns footswitch actions, edits amp knobs and the tone chain in a
  floating Tone Studio, and exports diagnostics. It has opt-out Microsoft Clarity telemetry. Nothing is flashed. The
  project is not affiliated with Neural DSP.
status: active
authors:
  - name: Richard Sentino
    url: https://github.com/rixrix
source: https://github.com/rixrix/deskop-nano-cortex
source_status: open
license: Apache-2.0
homepage: https://github.com/rixrix/deskop-nano-cortex#readme
distribution: download
install_notes: >-
  Download the macOS DMG, Windows MSI or setup exe, or the Linux deb or AppImage from the releases page, and check them
  against the SHA256SUMS file there. The builds are unsigned, so macOS and Windows show trust prompts. Connect both USB and
  Bluetooth for full control. The Bluetooth path is not available on Linux.
brick_risk: false
tags: [controller, editor, usb-midi, bluetooth, presets, research]
