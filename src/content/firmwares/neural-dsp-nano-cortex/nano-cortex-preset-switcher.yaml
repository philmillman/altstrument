device: neural-dsp-nano-cortex
kind: tool
name: Nano Cortex Preset Switcher
summary: React web app that switches the Nano Cortex's presets 1 to 64, toggles its gate, capture, cab and effect slots, sends expression and tap tempo, and listens for changes made on the pedal, using USB Web MIDI Program Change and Control Change messages.
description: >-
  A Vite and TypeScript page with a preset grid, effect toggle buttons, an expression slider, a tap tempo button and keyboard
  shortcuts for preset selection. It sends the Control Change numbers the pedal documents for the gate, capture, cab, five
  effect slots, tap tempo, tuner and expression, and listens for Program Change and Control Change messages coming back, finding
  the pedal by its port name. An experimental Bluetooth MIDI path exists in the code but is switched off. Nothing is flashed.
status: active
