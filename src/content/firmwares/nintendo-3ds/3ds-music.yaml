    url: https://github.com/ogbabydiesal
source: https://github.com/ogbabydiesal/3ds-music
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and the README makes no licence statement.
distribution: download
install_notes: >-
  Needs a 3DS with custom firmware and the Homebrew Launcher. Copy osc3ds.3dsx and eucseq.3dsx from the release to
  /3ds/ on the SD card and launch them from the launcher. The eucseq synth also needs sdmc:/3ds/dspfirm.cdc, which the
  DSP1 homebrew creates. OSC output is off by default and is enabled in Settings with the host IP and port. These are
  homebrew apps that run from the SD card and write nothing to the console's system firmware.
brick_risk: false
tags: [osc, controller, sequencer, euclidean, synth, modular, touch, homebrew]
