device: nintendo-3ds
name: 3ds-music
summary: Two Nintendo 3DS homebrew apps, an OSC controller and a Euclidean sequencer with a touchscreen modular synth, that send OSC over Wi-Fi.
description: >-
  3ds-music holds two apps written in C with libctru and citro2d. osc3ds turns the 3DS into a wireless OSC controller,
  sending buttons, sticks, an XY pad, faders, drum pads and the motion sensors over UDP. eucseq is a polyrhythmic
  Euclidean sequencer with five shape tracks that orbit a ring on the stereoscopic top screen. Each pulse is sent as an
  OSC message, and it can also trigger patches built on the touchscreen from oscillators, noise and envelopes, with
  patches and patterns saved to eight slots on the SD card. Both apps work with any OSC host. The code was written with
  an AI assistant, and the repository lists the prompts used. The repository has no licence file or licence statement.
status: active
authors:
