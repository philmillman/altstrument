device: nintendo-3ds
name: Bard Beats
summary: >-
  Homebrew loop maker for the 3DS with a 16-step, four-track sequencer, eight built-in instruments, live play on the buttons and circle pad, and saved loops with Standard MIDI export.
description: >-
  A 3DS homebrew app that runs without a computer. It has a one-bar 16-step grid with drum, bass, melody and harmony
  tracks, eight synthesised instruments on the console's audio engine, a pad view and a rendered instrument view for
  playing live, and a jam mode that quantises played notes onto the grid with undo. Loops are saved by name to the SD
  card and can be exported as Standard MIDI files. The README lists song mode and microphone vocal recording as the
  next stage; only the first stage is built. Binaries come from the repository's CI and there are no releases, so it
  is built from source.
status: active
authors:
