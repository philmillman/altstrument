device: nintendo-3ds
name: Bard Beats
summary: >-
  Homebrew loop maker for the 3DS with a 16-step, four-track sequencer, sixteen built-in instruments, live play on the buttons and circle pad, and saved loops with Standard MIDI export.
description: >-
  A 3DS homebrew app that runs without a computer. It has a one-bar 16-step grid with drum, bass, melody and harmony
  tracks, sixteen synthesised instruments with an instrument picker on the console's audio engine, a pad view and a rendered instrument view for
  playing live, and a jam mode that quantises played notes onto the grid with undo. Loops are saved by name to the SD
  card and can be exported as Standard MIDI files. Later versions add song mode that chains saved loops
  into songs with a song shelf and WAV bounce, a vocal layer recorded with the console's microphone, two-bar loops
  with swing, a mix drawer and an optional Wi-Fi MIDI bridge script, and v0.3.0 adds a chord and arpeggiator play mode, held note lengths, a metronome, a pattern generator and root key transpose, v0.7.0 adds a master compressor and limiter, speaker or headphone voicing, per-track volume controls, selectable L/R shoulder modes, a count-in, tap tempo and undo. Each release carries a .3dsx and a .cia, and
  the repository's CI builds both on every push.
status: active
authors:
  - name: Kiyoshi
    url: https://github.com/kiyoshithekidd
source: https://github.com/kiyoshithekidd/Bard-Beats
source_status: open
license: MIT
license_notes: The LICENSE file is the MIT text, copyright 2026 Kiyoshi.
distribution: download
requires_stock: A 3DS with custom firmware and the Homebrew Launcher (.3dsx), or a build installed as a .cia
install_notes: >-
  Download BardBeats.3dsx for the Homebrew Launcher or BardBeats.cia for the HOME Menu from a release, or build with devkitPro (devkitARM, libctru and citro2d) using the Makefile: make produces BardBeats.3dsx for the
  Homebrew Launcher, and make cia produces a .cia and needs bannertool and makerom. The repository's GitHub Actions
  workflow builds both on every push. It runs as a normal homebrew app and writes only loops to the SD card.
brick_risk: false
tags: [sequencer, looper, synth-engine, handheld, homebrew, midi, open-source]
