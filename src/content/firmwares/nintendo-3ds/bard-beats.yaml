    url: https://github.com/kiyoshithekidd
source: https://github.com/kiyoshithekidd/Bard-Beats
source_status: open
license: MIT
license_notes: The LICENSE file is the MIT text, copyright 2026 Kiyoshi.
distribution: source-only
requires_stock: A 3DS with custom firmware and the Homebrew Launcher (.3dsx), or a build installed as a .cia
install_notes: >-
  Build with devkitPro (devkitARM, libctru and citro2d) using the Makefile: make produces BardBeats.3dsx for the
  Homebrew Launcher, and make cia produces a .cia and needs bannertool and makerom. The repository's GitHub Actions
  workflow builds both on every push. It runs as a normal homebrew app and writes only loops to the SD card.
brick_risk: false
