device: nintendo-3ds
name: nodeTrix
summary: Two Nintendo 3DS homebrew apps, an OSC controller and the nodeTrix Euclidean sequencer with a touchscreen modular synth, that send OSC over Wi-Fi.
description: >-
  nodeTrix, formerly 3ds-music, holds two apps written in C with libctru and citro2d. osc3ds turns the 3DS into a
  wireless OSC controller, sending buttons, sticks, an XY pad, faders, drum pads and the motion sensors over UDP.
  nodeTrix, called eucseq up to v0.3.0, is a polyrhythmic Euclidean sequencer with five shape tracks that orbit a ring
  on the stereoscopic top screen. Each pulse is sent as an OSC message, and it can also trigger patches built on the
  touchscreen from oscillators, noise, envelopes, a filter, delay, chorus, reverb and a granular node based on the
  Mutable Instruments Beads algorithm, with eight step sequencers that drive parameters. Patches and patterns are
  saved to eight slots on the SD card, with a song mode that chains them. Both apps work with any OSC host. The code
  was written with an AI assistant, and the repository lists the prompts used.
status: active
authors:
  - name: ogbabydiesal
    url: https://github.com/ogbabydiesal
source: https://github.com/ogbabydiesal/nodeTrix
source_status: open
license: MIT
license_notes: LICENSE file in the repository (Tommy Martinez, 2026), added with v0.4.0; earlier releases had no licence. Third-party notices are in THIRD_PARTY_NOTICES.md.
distribution: download
install_notes: >-
  Needs a 3DS with custom firmware and the Homebrew Launcher. Copy osc3ds.3dsx and nodeTrix.3dsx from the release to
  /3ds/ on the SD card and launch them from the launcher. The nodeTrix synth also needs sdmc:/3ds/dspfirm.cdc, which the
  DSP1 homebrew creates. OSC output is off by default and is enabled in Settings with the host IP and port. These are
  homebrew apps that run from the SD card and write nothing to the console's system firmware.
brick_risk: false
tags: [osc, controller, sequencer, euclidean, synth, modular, touch, homebrew]
