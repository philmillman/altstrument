    url: https://catbeats.life
homepage: https://littlemachines.fun/ocarina3ds/
source_status: binary-only
license: unspecified
license_notes: >-
  The page publishes no license. It calls the app an "independent fan-made toy" and describes its creed as "friendly
  freeware".
distribution: download
requires_stock: A 3DS with custom firmware (the page mentions Luma3DS) and a CIA installer such as FBI
install_notes: >-
  Download the .cia from the project page and install it with FBI or another CIA installer on a 3DS running custom
  firmware. It installs as an ordinary HOME Menu title and writes nothing to the system firmware.
brick_risk: false
