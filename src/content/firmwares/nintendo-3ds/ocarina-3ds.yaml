device: nintendo-3ds
name: Ocarina 3DS
summary: >-
  Free homebrew wind synth and looper for the 3DS and 2DS family, played with the buttons and shaped by blowing into the
  microphone, with 23 voices, scale lock and three loop bubbles.
description: >-
  A 3DS app in which the face buttons play notes of a chosen scale and root while breath into the built-in microphone
  shapes the sound like a wind instrument. It offers three button layouts, 23 voices that include ocarinas, flutes,
  reeds, synths and two drum kits, and three looper bubbles that record, loop and echo with tempo lock. A generative
  mode plays chimes, chords and wind over a nature scene that follows the console's clock through the seasons, and a
  meditation mode hides the interface after 45 seconds of inactivity. The page describes it as an independent fan-made
  toy and says the old 3DS and 2DS work too. It is distributed as a .cia file with English and Japanese manuals and
  printable box and cartridge-label artwork. No source code is published.
status: active
authors:
