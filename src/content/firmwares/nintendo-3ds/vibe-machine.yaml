device: nintendo-3ds
name: Vibe Machine
summary: >-
  Homebrew pocket synth and groovebox for the 3DS built on the AMY library, with Juno-6 and DX7 patch banks, original engines, a 16-step sequencer, performance effects and a four-track tape recorder.
description: >-
  A 3DS homebrew app that plays sound through AMY, a fixed-point synthesis library. The buttons and touchscreen play
  128 Juno-6 and 128 DX7 style patches and nine original engines, one of which is a wave drawn with the stylus, with
  chords, a drum map, an XY pad for two macro parameters per sound and an arpeggiator in a key and scale of your
  choice. An edit layer opens up any sound with a drawable envelope, filter and LFO pads, mono and glide, unison,
  morphing between two stored sounds and user presets. A sampler takes a microphone, tape or WAV source and can slice
  it across the keys. A 16-step sequencer and piano roll have eight pattern slots of one, two or four bars each, song
  chaining, swing, accents and live recording. A mixer gives every part drive, crush, tone, pan and echo and reverb
  sends, four performance effects are played on the touchscreen, and a four-track tape recorder has reverse and
  varispeed, with nine colour themes. State is saved to the SD card, and tape tracks, the microphone take and the
  mixdown are written as WAV files. Releases carry a .3dsx for the Homebrew Launcher and a .cia for the HOME Menu, built by the repository's CI.
status: active
authors:
  - name: Ronald Noble
    url: https://github.com/noble1911
source: https://github.com/noble1911/vibe-machine
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is the MIT text, copyright "the Vibe Machine authors". It bundles AMY (MIT, Brian Whitman and
  contributors) as a submodule.
distribution: download
requires_stock: A 3DS with custom firmware (Luma3DS) and the Homebrew Launcher, plus a DSP firmware dump (dspfirm.cdc) from the user's own console
install_notes: >-
  Download vibe-machine.3dsx for the Homebrew Launcher (copy it to sdmc:/3ds/) or vibe-machine.cia for the HOME Menu
  (install it with FBI) from a release, or build with devkitPro and the 3ds-dev packages (clone with --recursive, then
  make, or make cia). Sound needs dspfirm.cdc on the SD card, dumped from the user's own console with the DSP1 homebrew.
  It runs as a normal homebrew app and writes only to its own folder on the SD card. The README also describes running
  it in the Azahar emulator with an emulator-only placeholder firmware file.
brick_risk: false
tags: [synth, groovebox, sequencer, synth-engine, sampler, fx, tape, touch, handheld, homebrew, open-source]
