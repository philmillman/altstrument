device: nintendo-game-boy
name: Canvas Radio
summary: >-
  Game Boy Color ROMs that show BasePaint pixel-art canvases and play a chiptune generated from each image's measurements.
description: >-
  The eight ROMs together cover BasePaint days 1 to 1206. Each canvas gets its own tune, built by a C sequencer from eight bytes of musical controls that an import script derives from the image: edge contrast sets tempo, rhythm and layers, dominant hue the root note, brightness and color intensity the scale and lead sound, and the day and artwork hash seed the motif and chords. The sequencer drives the console's sound hardware, with a shared bank of instruments for notes, rests and percussion. A slideshow changes the picture on a musical downbeat after 4 to 256 bars, in ordered, shuffled, same-subject or similar-canvas playlists, and the gallery has subject and day browsers and a zoomable detail view. The ROMs need a Game Boy Color or ModRetro Chromatic with a writable 4 MiB MBC5 cartridge, or an emulator, and do not run on the monochrome Game Boy. It is an independent fan project, and the artwork is BasePaint's CC0 canvases.
status: active
authors:
