source: https://github.com/ryanfoxeth/canvas-radio
source_status: open
license: unspecified
license_notes: >-
  No LICENSE file in the repository. The releases include the GBDK runtime and a ZX0 decompressor, listed in THIRD_PARTY_NOTICES.md.
distribution: download
requires_stock: Game Boy Color or ModRetro Chromatic with a writable 4 MiB MBC5 flash cartridge, or a Game Boy Color emulator such as SameBoy.
install_notes: >-
  Download one of the eight .gbc editions or the archive zip from the release, check it against the published checksums and load it with the tool for your flash cartridge or open it in an emulator. The ROM contains the artwork and runs offline. To build, install GBDK 4.5.0 and run make edition; the fetch step downloads the original PNGs from BasePaint and checks each hash.
brick_risk: false
