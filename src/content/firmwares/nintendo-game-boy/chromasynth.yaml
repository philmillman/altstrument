device: nintendo-game-boy
name: ChromaSynth
summary: Synthesizer and piano-roll sequencer ROM for Game Boy Color cartridges, written for the ModRetro Chromatic, with optional Bluetooth and USB MIDI to a Mac through patched console firmware.
description: >-
  A Game Boy Color only ROM written in RGBDS assembly. It drives the four sound
  channels (two pulse, wave and noise), provides a piano roll for entering
  patterns, and saves songs to cartridge SRAM. Two builds are released: a 32 KB
  SRAM build that stores four songs and an 8 KB SRAM build that stores one. The
  Chromatic is a Game Boy Color compatible handheld with a built-in ESP32. The
  repository also holds patches to ModRetro's open console firmware for that
  ESP32 and a Mac menu-bar app, ChromaSynth Link, which together let a DAW play
  the ROM, record its sequencer and follow the DAW's transport and tempo over
  Bluetooth MIDI or USB-C. The ROM works without them. The release notes say the
  ROMs were tested in an emulator only, that the console link was tested on a
  Chromatic with an EMS 64M cartridge running a different build, and that
  Bluetooth timing can drop or delay notes. The author calls the project
  unofficial.
status: active
authors:
