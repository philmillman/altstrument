    url: https://github.com/sharuru3501
source: https://github.com/sharuru3501/ChromaSynth
source_status: open
license: MIT
license_notes: >-
  The ROM, tools and documents are MIT. The patches in chromatic-mcu/ derive
  from ModRetro's console firmware and are GPL-3.0; the repository does not
  include the original ModRetro source.
distribution: download
requires_stock: Game Boy Color cartridge, flash cartridge or emulator. The optional MIDI link needs a Chromatic running ModRetro MCU firmware v4.6.
install_notes: >-
  Download the 32 KB or 8 KB SRAM ROM from the release and load it on an
  emulator or a flash cartridge with battery RAM; MBC5 is recommended. Nothing
  needs to be flashed to the console for this. The MIDI link is optional and
  needs the patched ESP32 firmware built from chromatic-mcu/, which the project
  warns is risky. It instructs a full backup of the ESP32 flash, a restore
  rehearsal and writing only the application slot, and leaves the bootloader,
  partition table and FPGA alone, so the USB route to restore stock stays open.
  A shared SRAM on EMS cards means saving can overwrite other games' saves.
brick_risk: false
tags: [synth, sequencer, chiptune, midi, bluetooth, mac]
