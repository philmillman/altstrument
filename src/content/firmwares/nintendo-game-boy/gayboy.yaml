device: nintendo-game-boy
name: GAYBOY
summary: >-
  Game Boy ROM that combines a synth, piano-roll sequencer, ten-row sample drum machine and performance mixer, with
  MIDI input through Arduinoboy and a SameBoy-based player on the project's site.
description: >-
  GAYBOY is a 1 MiB MBC5 cartridge image with battery-backed save RAM that targets the original Game Boy and the
  Game Boy Color. Five logical tracks (two pulse, wave, noise and drums) share the four hardware sound channels, and the sample
  drums temporarily take the wave channel. It has a piano roll with note length and velocity, pattern pads, a mixer with pan and mute/solo, and
  drum kits with ten PCM rows and two noise voices. An Arduinoboy in mGB mode can play it from external MIDI gear.
  The author's page runs the ROM in a browser emulator with a tutorial. The README calls version 1.0 stable and
  says pattern-launch playback has been tested on physical hardware, while its development notes still list current
  limitations, including timing measurements. On 2026-10-27 the author froze the public repository as the final free
  demo, a build later than 1.0; the browser player and ROM download stay on that build and further development is
  not published here. The build needs GBDK 4.5.0 and audio inputs
  that are not in the repository. The GitHub owner is EvatechLTD and the README credits dpjpandone.
status: active
authors:
  - name: dpjpandone
    url: https://github.com/EvatechLTD
source: https://github.com/EvatechLTD/GAYBOY
source_status: open
license: unspecified
license_notes: >-
  The README says there is currently no project-wide license granting reuse of the code or artwork. The bundled
  SameBoy browser player is MIT and keeps its own license file.
homepage: https://y2kcrisis.com/gayboy
distribution: download
install_notes: >-
  Download GAYBOY.gb from the project's site and load it on an emulator or an MBC5 flash cartridge with battery
  save support. Back up saves, since the README warns that things will change. Playing it as a MIDI instrument needs
  an Arduinoboy set to mGB mode.
brick_risk: false
tags: [synth, sequencer, drum-machine, sampler, chiptune, midi, emulator]
