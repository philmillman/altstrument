distribution: commercial
install_notes: >-
  Try the free browser demo on the project's site, or buy the ROM there and load GAYBOY.gb on an emulator or an MBC5
  flash cartridge with battery save support. Playing it as a MIDI instrument needs an Arduinoboy set to mGB mode.
