device: nintendo-game-boy
name: GB Tracker
kind: tool
summary: >-
  Browser tracker for Game Boy and Game Boy Color music that plays through a cycle-accurate APU emulation and exports
  playable .gb and .gbc ROMs, GBS and VGM files, and a GBDK-2020 project.
description: >-
  A four-channel tracker (two pulse channels, one wave channel, one noise channel) with an order list, patterns,
  per-channel instruments with macros, drawable or imported waveforms, samples streamed into wave RAM, and Web MIDI
  input. Playback runs through an emulation of the Game Boy sound chip, and the song is exported as the register
  writes a sound driver would make. The exports are a cartridge ROM that loops the song, a GBS file, a VGM file, a C array
  with a small driver for GBDK-2020, and also XM, MOD, WAV, FLAC, Opus, stems and a video. The README says the ROM boots
  on real hardware and flash carts, and the repository's tests run the ROM and GBS drivers on an SM83 interpreter and compare
  their register writes with the reference driver. It runs in a browser, on desktop or phone, and installs as an offline web
  app, so it is listed here as a tool for the console.
status: active
