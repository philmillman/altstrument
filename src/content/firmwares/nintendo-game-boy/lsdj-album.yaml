device: nintendo-game-boy
name: lsdj-album
kind: tool
summary: Builds a stand-alone Game Boy album ROM from the songs in an LSDj save, with a custom logo, song names, a level-meter and waveform visualizer and next and previous song buttons.
description: >-
  lsdj-album records each song in a user's LSDj ROM and save with a fork of lsdpack, then builds an MBC5 ROM that
  replays the recorded sound register writes. The ROM shows a logo converted from a PNG, the song name read from the
  save, LED-style meters for the two pulse channels, wave and noise, and a scrolling waveform. A moves to the next song,
  B to the previous one, and songs advance when they end. Each song needs an HFF command at its end, or a global length
  limit can cut it. The README tests it with LSDj 9.3.9, which needed changes in lsdpack because LSDj 9 drives its
  sound engine from the timer interrupt. The repository holds no LSDj ROM and no songs. The result runs on a Game Boy
  flash cartridge or in an emulator, in DMG mode on Game Boy Color and Advance. The README credits Claude as a
  co-author.
status: active
authors:
