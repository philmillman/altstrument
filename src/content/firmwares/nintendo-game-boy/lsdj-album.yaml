    url: https://github.com/M64GitHub
  - name: Johan Kotlinski
    url: https://github.com/jkotlinski
source: https://github.com/M64GitHub/lsdj-album
source_status: open
license: GPL-2.0-only
license_notes: >-
  The LICENSE file is the GPL version 2 text with no "or later" wording, although the README says
  "GPL-2.0-or-later, like lsdpack". lsdpack's own license is GPL-2.0-only, so the file is followed here.
based_on: nintendo-game-boy/lsdpack
distribution: source-only
requires_stock: LSDj ROM and save file, supplied by the user
install_notes: >-
  Needs RGBDS 1.0, CMake, a C++ compiler, Python 3 and make. Clone with --recursive and run make SAVE=path/to/lsdj,
  which gives album.gb; flash it to a cartridge with the cartridge's own tool or play it in an emulator. The LSDj ROM
  and save are never modified, because recording runs on copies. Nothing runs on the console except the finished ROM.
brick_risk: false
tags: [recorder, player, export, visualizer, album, lsdj, open-source]
