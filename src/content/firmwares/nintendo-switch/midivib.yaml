install_notes: >-
  Build with devkitPro and the portlibs listed in the README, or take the .nro from the GitHub Actions build artifact, copy it to /switch/midivib.nro on the SD card and start it from the Homebrew Menu. This needs a console with custom firmware, which this catalog does not cover. Copy .mid files to any folder on the SD card.
