device: noise-engineering-legio
name: Jawari Legio
summary: Tanpura drone machine for Legio, a port of the Jawari VCV Rack module with four plucked strings, a bridge-shape control, formant filters and saved tuning.
description: >-
  A trigger on the strum jack plucks the next of four strings in a cycle, tuned by default to G2, C3, C3 and C2. The
  top encoder tunes the drone, with a push-and-turn for coarse steps, and a v/oct signal on jack A adds to it. The
  middle knob sets the shape of the bridge, which changes how buzzy the strings sound. The bottom knob is a low-pass
  cutoff or, with the left switch down, the semitone of the first string. The right switch turns on formant filters.
  Output is mono on both jacks. Pitch settings are saved across power cycles. The release assets are named
  TanpuraLegio.bin.
