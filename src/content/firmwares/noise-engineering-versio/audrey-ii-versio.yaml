device: noise-engineering-versio
name: Audrey II Versio
summary: Port of the Audrey II Karplus-Strong feedback synth to the Versio, with the extra controls folded onto fewer knobs and switches.
description: >-
  A port of Synthux's Audrey II to the Versio's Daisy Seed. Versio has fewer knobs than Audrey II, so the author shared
  some pins between functions, which the README lists in a table of pin assignments. The repository holds the source, a
  Makefile and a built versio_audrey.bin. The README says to install the bin through Noise Engineering's website.
status: active
authors:
  - name: Konstantin Svechtarov
    url: https://github.com/KoSv
source: https://github.com/KoSv/DaisyVersio_Audrey_II
source_status: open
license: MIT
license_notes: >-
  The licence file names Infrasonic Audio, LLC as copyright holder, from the Daisy example it started from. The synth is a
  port of Synthux Academy's Audrey II, which is also MIT.
distribution: download
install_notes: >-
  Select versio_audrey.bin as a custom file on Noise Engineering's firmware page, as for other Versio firmwares. The Versio
  can be restored from Noise Engineering's firmware page.
brick_risk: false
tags: [synth, feedback, karplus-strong, drone, open-source, daisy-seed]
