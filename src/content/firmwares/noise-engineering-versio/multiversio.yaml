device: noise-engineering-versio
name: MultiVersio
summary: Multi-effect firmware for Versio modules by Paolo Ingraito, with spectral resonators and filters derived from Emilie Gilliet's work. Build files and a prebuilt MultiEffect.bin are in the repository.
description: >-
  The README names the Desmodus Versio as the target and credits Emilie Gilliet for the spectrings and many of the filters. A diagram of the controls by another forum user and a Modwiggler thread are linked. The repository holds one commit, which includes the Visual Studio Code project and the compiled .bin, .hex and .elf files. There is no license file.
