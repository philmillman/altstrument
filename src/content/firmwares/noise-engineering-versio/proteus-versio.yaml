device: noise-engineering-versio
name: Proteus Versio
summary: Generative melody sequencer for Versio that plays its own voice, switchable between a formant oscillator and a Karplus-Strong string.
description: >-
  Proteus writes a melody, loops it for a while, then replaces it with a new one. During the loop it can shift notes
  by an octave or change single notes, steered by the knobs and CV. Versio has no CV or gate output, so this build
  plays the melody through its own voice, chosen with the bottom switch. The repository holds the C++ source and a
  prebuilt ProteusVersio.bin in its build folder. The author's video manual is linked from the README.
