device: noise-engineering-versio
name: Repetita Versio
summary: Looper firmware for Versio modules with an 80-second stereo buffer, independent left and right loop controls, three trigger modes, a delay mode, a feedback filter and stored settings.
description: >-
  The core is two circular buffers, one per channel, with controls for loop start, length, speed, freezing, decay and stereo width. A note mode tracks four octaves and the firmware can also work as a comb filter, stutter or oscillator. The looper engine lives in a separate submodule. The README gives control names using the Antri Versio panel labels, and the project includes a changelog.
status: dormant
