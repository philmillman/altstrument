license: MIT
license_notes: >-
  Code, tools and docs are MIT per LICENSE. The firmware adds libDaisy (MIT), the STM32 HAL (BSD-3-Clause) and CMSIS
  (Apache-2.0), with no JUCE or Noise Engineering code. The macOS plugin binaries are AGPL-3.0 because they are built with
  JUCE.
homepage: https://sublustris-versio.vercel.app
distribution: download
install_notes: >-
  Download sublustris-versio-firmware.bin from the release and install it with Noise Engineering's Firmware Swap page in
  Chrome, with the module powered from USB only. The release notes warn never to connect USB and Eurorack power at the same
  time. Firmware Swap restores any Noise Engineering firmware. The release lists a known crackle after unfreezing in the
  canyon space when SIZE was moved while frozen.
