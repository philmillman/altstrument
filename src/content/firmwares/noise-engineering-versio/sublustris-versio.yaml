device: noise-engineering-versio
name: Sublustris Versio
summary: Long-tail reverb for the Versio with plate, hall and canyon spaces, an endless decay setting, a freeze you can play over, and tape or AM-radio style motion. Also released as a macOS AU/VST3 plugin.
description: >-
  Seven knobs each have a CV input, with two switches, a button and a gate. SPACE chooses a plate, a hall or a canyon, and
  turning DECAY past about three o'clock makes the tail endless while it holds a played chord. The button freezes the tail
  into a pad, and holding it while frozen paints what is being played into the pad. WEAR adds tape saturation, bucket-brigade
  delay movement, grit and hiss to the reverb only, MOTION moves the tail either way from noon, and ONSET picks natural,
  bloom or octave-up shimmer entry. The Versio's printed panel labels do not match the controls, so the release notes list
  which knob is which. The same DSP core runs in the firmware, an offline renderer and the plugin. The README says the author
  set the sound goals and chose every sound, and that Claude wrote the DSP, firmware and tools. It reports timing runs on the
  module itself for the busiest moments. A sibling project of Resilio Versio by the same author.
status: active
