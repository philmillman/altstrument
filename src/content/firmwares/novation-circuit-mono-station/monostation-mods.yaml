homepage: https://meukmachine.github.io/monostation-hacks/
distribution: browser-installer
requires_stock: "1.2 (build 800)"
install_notes: >-
  The easy route is the flasher page (Firefox): choose the stock 1.2 update file, monostation-firmware-800.syx, which
  ships inside Novation Components 1.72.5, and the page builds the modded firmware from it. To build it yourself you need Linux or macOS, Python 3 and
  arm-none-eabi-gcc: put the stock file into private/firmware/, run the build commands in the README to produce mods-751.syx,
  then run tools/flash.py with the Mono Station off and Scales + Note + Velocity held while switching it on. The
  bootloader is never touched. To go back, flash the stock file the same way or accept the update in Novation
  Components. Back up your patches and sessions first.
brick_risk: false
tags: [sequencer, generative, flasher, python]
