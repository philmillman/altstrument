device: novation-circuit-mono-station
name: Mono Station Mods
summary: Source-built modifications of Novation's Circuit Mono Station 1.2 firmware, with reverse-engineering tools. The mods make Mutate randomise one note property per view or nudge the patch, and add live transpose from the keys.
description: >-
  The repository holds tools that decode Novation's 1.2 update file, turn it into assembly that rebuilds byte for byte,
  and let overlays replace stock functions by name with C, C++ or assembly, plus a flasher and notes on the bootloader,
  update protocol, patch and session SysEx formats and sequencer. Novation's code is not included: you unpack the stock
  update from Novation Components yourself and build locally with arm-none-eabi-gcc. The Randomise mod
  changes Mutate on the Osc 1 and Osc 2 tracks so that in the Velocity, Gate, Glide and Expand views it randomises
  only that property of steps that already hold a note, leaving the rhythm alone. Pressing Mutate in the Patches view
  takes a small random step from the current patch, within playable ranges. The Note and Pattern Settings views
  and the Mod Seq track behave as stock. A second mod, live transpose, moves both Osc patterns by scale degrees when
  Shift is held and a key is tapped in the Note or Expand view, without changing the pattern. The Randomise build
  reports itself as version 750, live transpose alone as 751 and both together as 752, all below the stock 800, so that
  Novation Components should offer to reinstall stock; the README says this has not been tried yet. The repository
  also holds a drive overlay, added after the README's quick start was written, that widens the Overdrive and
  Distortion range so the effect reaches full strength at full Level; it is tuned by ear and not yet described there. The README says the work was
  done with Claude Code.
