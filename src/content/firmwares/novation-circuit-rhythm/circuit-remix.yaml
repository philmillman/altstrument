device: novation-circuit-rhythm
name: Circuit Remix
summary: Alpha patches for the Circuit Rhythm 2.0.1 firmware (build 5706) that port CIRCUIT-HACKS features and add a sample arpeggiator, track copy and a pitch envelope and LFO, applied in the browser to your own Novation update file.
description: >-
  Applies patches to Novation's official 5706 update file with a browser page or a Python script, and checks the
  result against published SHA-256 hashes. It ports features from CIRCUIT-HACKS (the Circuit Tracks mod by the
  same author), including a metronome with count-in, quantize, mixer mutes and scene repeats, pattern chains with
  rules, sidechain and FX views, an arpeggiator and custom scales. It adds a track copy and reset, a sample and
  note arpeggiator, per-track scales, a pitch envelope and LFO page for the track knobs, and on-device pack
  delete and sample copy. Later alphas add a track menu, granular playback on up to four tracks, line input as a
  track's sound, a two-oscillator synth and an envelope page for the synth and granular sounds. The newest alphas add
  the Stock+ page and a waveshaper to granular and synth tracks, a count-in that follows the tempo or MIDI clock,
  knob automation on steps with snapshots, and stereo link with per-knob offsets. Alpha 0.11 adds a modulation matrix of
  eight sources to 32 destinations per track, lanes with their own destination, automation ramps, arpeggio modifiers and
  a proof-of-concept loader for Arrhythmia .mod modules, which are third-party and not included; alpha 0.10 is the same
  without the module code. Alpha 0.12 is built on alpha 0.10, without the module code, and adds engines selectable in
  Sample mode, the CIRCUIT-HACKS virtual-analog synth and eight-operator FM, voice modes and polyphony of up to four
  synth voices. Alpha 0.13 builds on alpha 0.12 and adds an effects sequencer that plays the Grid FX slots from a
  track, delay and reverb throw effects, a live looper and resampler, Pattern Mutate, 64 saved patches per pack,
  two-times oversampling for the virtual-analog synth and more modulation destinations. Each version has an "S" variant without the features that create, change or delete SD
  card files by themselves. The repository holds the builders, an assembler, manuals in Spanish and English and
  per-version manifests, and no Novation code. The README says the features were checked mostly in emulation and
  partly on the device, and that the project was developed with Claude.
status: active
authors:
  - name: Ghillermo
    url: https://github.com/Ghillermo
source: https://github.com/Ghillermo/CIRCUIT-REMIX
source_status: open
license: MIT
license_notes: >-
  Covers the project's own tools, patches and documentation. It does not cover Novation's firmware, which is not
  included, or third-party dependencies (Capstone).
distribution: browser-installer
requires_stock: "5706 (2.0.1)"
install_notes: >-
  Download Novation's official 5706 update yourself (the README links Novation Components' own download), open
  rm_uploader.html from the release zip in Chrome or Edge, pick the official file and a version, and send it over
  Web MIDI, or build the .syx with tools/patch_official.py. The page checks the stock file's hash and refuses other
  devices. Back up the SD card first; the S variants never write to the card by themselves. The
  bootloader is not touched: Sample Rec + Samples + Note at power-on returns to the official firmware.
  The README also covers a unit that does not start: enter Novation's bootloader mode the same way and send the
  Official option from the page, or use Novation Components.
brick_risk: false
tags: [sampler, sequencer, drums, fx, midi, arpeggiator, performance]
versions:
  - version: alpha-0.13
    date: 2026-11-11
    url: https://github.com/Ghillermo/CIRCUIT-REMIX/releases/tag/alpha-0.13
    notes: Pre-release, built on alpha-0.12. Adds an effects sequencer on a track that plays the Grid FX slots, delay and reverb throws, a live looper and resampler in the Grid FX view, Pattern Mutate, 64 saved patches per pack with starters, oversampling for the virtual-analog synth and more modulation destinations. The release notes say the effects sequencer, Grid FX sends and looper were tried on the device and the rest mostly in emulation; they name alpha-0.10 as the fallback.
  - version: alpha-0.12
    date: 2026-11-07
    url: https://github.com/Ghillermo/CIRCUIT-REMIX/releases/tag/alpha-0.12
    notes: Pre-release, built on alpha-0.10 without the Arrhythmia loader. Adds engines in Sample mode (sample, line input, virtual-analog, granular and FM), the CIRCUIT-HACKS virtual-analog and eight-operator FM synths, voice modes with up to four-voice polyphony, latch in the Note view and per-project sound storage on the card. Checked only in emulation; the release notes name alpha-0.10 as the fallback.
  - version: alpha-0.11
    date: 2026-11-03
    url: https://github.com/Ghillermo/CIRCUIT-REMIX/releases/tag/alpha-0.11
    notes: Pre-release. Fixes the alpha-0.09 boot loop and adds a modulation matrix, lanes with their own destination, an extra automation lane with ramps, arpeggio modifiers, save on stop and a proof-of-concept loader for Arrhythmia modules. It boots cold and after a restart on the device; most new features were checked only in emulation.
