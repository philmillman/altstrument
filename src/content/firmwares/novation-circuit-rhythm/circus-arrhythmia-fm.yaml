device: novation-circuit-rhythm
name: Circus Arrhythmia FM
summary: Browser-installed patch of Novation's Circuit Rhythm 5706 firmware that fixes parameter-lock carry-over and a sound-processor hang, and adds an SD-card FM synth engine for track 8 with chords and an arpeggiator, scales, and a module loader.
description: >-
  Arrhythmia, renamed Circus Arrhythmia FM in 0.2.2, does not ship Novation's firmware. The installer page reads the
  5706 update file you supply, checks its SHA-256, patches it in the browser and
  sends it to the unit over USB MIDI, and the user confirms on the unit. Two
  builds are offered. With the FM engine file fm.dse selected for a card pack, the firmware build turns track 8 into a four-voice FM synth that
  plays one to four notes per pad or step, also from MIDI on track 8's channel; without it track 8 plays the pack's samples.
  Sixteen sounds are chosen in the Sample view or per step, and eight macros set
  feedback, the envelope, FM depth, cutoff and resonance, with tune on the synth page, and a step can
  hold a chord of up to four notes. Earlier 0.1.x releases had
  a fixed saw sound instead. It also adds eight scales on tracks 1 to 7 (the devkit build keeps ten) and a
  loader for small programs on the microSD card. Ten example modules, among them
  Euclidean rhythms, Game of Life, snake and a puzzle, are published on the
  project site, and a module page writes them to the card over USB. Version 0.2.2
  moves the chord and scale settings to a synth page opened with Shift and Track 8. Version 0.3.0 moves the FM synth out of the firmware
  into an engine file on the microSD card that each pack selects, adds an arpeggiator on the synth page, a 32-step four-row Euclid
  module, FM feedback up to 8x on macro 1, and a combined loader page for engines and modules. Its notes say the final Euclid revision
  was tested only in an emulator and the hardware run was waived.
  The devkit build adds a DSP load meter and module tools and has no synth. Both
  fix parameter locks so that a step without a lock returns to the knob's value,
  and limit how long the unit waits for the sound processor before flagging a
  fault with the Rec button. The 0.2.1 release notes say the synth's processing time
  has not been measured on the unit and that the conversion of projects saved by
  0.2.0 and most modules were checked only in emulation; the 0.2.0 notes add that
  the fault handling and the devkit build are untested on hardware, and the 0.2.2 notes say the published image itself was not run on a unit. The DSP voice source is
  now published, so the image rebuilds from the repository. Novation Components cannot restore stock; the
  installer has a Back to stock option.
status: active
authors:
  - name: llcoolkm
    url: https://github.com/llcoolkm
source: https://github.com/llcoolkm/arrhythmia
source_status: open
license: MIT
license_notes: >-
  Covers the code and documentation in the repository, including the synth's DSP
  voice source. Novation's firmware is not included and is not covered.
homepage: https://llcoolkm.github.io/arrhythmia/web/
distribution: browser-installer
requires_stock: "5706"
install_notes: >-
  Back up the microSD card first. From 0.3.0 the FM synth is a separate file: add fm.dse with the loader page, choose it for a pack
  and load that pack, or track 8 plays samples. Download Novation's 5706 update file yourself,
  close Novation Components and other MIDI software, open the installer page in
  Chrome, connect the unit, choose the file and press Install, then press Play
  on the unit when it flashes. The unit needs bootloader 4799. To go back, use
  Back to stock on the installer page or tools/flash.py on Linux. The README
  advises stopping and reporting if the unit does not start after an install.
  macOS is untested.
  The author's notes say the unit can be put into Novation's bootloader mode (Sample Rec + Samples + Note at
  power-on) and flashed again with tools/flash.py, and add that this route is untested for an image that does
  not boot.
brick_risk: false
tags: [synth, chords, scales, sequencer, parameter-locks, modules]
versions:
  - version: v0.3.0
    date: 2026-11-07
    url: https://github.com/llcoolkm/arrhythmia/releases/tag/v0.3.0
    notes: Moves the FM synth into an engine file, fm.dse, on the microSD card, chosen per pack, so updating the firmware alone leaves track 8 on samples. Adds an arpeggiator, FM feedback up to 8x, a scale switch for track 8, a four-row 32-step Euclid module that can write patterns, and a loader page for engines and modules. Hardware testing of the final Euclid revision was waived.
  - version: v0.2.2
    date: 2026-11-01
    url: https://github.com/llcoolkm/arrhythmia/releases/tag/v0.2.2
    notes: Adds a synth page opened with Shift and Track 8 for chords, scales and keys, writing module files to the card over USB from a web page, and a synth output 3 dB louder; the firmware build drops Phrygian and Lydian. The project is renamed Circus Arrhythmia FM.
  - version: v0.2.1
    date: 2026-10-30
    url: https://github.com/llcoolkm/arrhythmia/releases/tag/v0.2.1
    notes: Macro 1 on track 8 now sets FM feedback and tune moves to the synth page; adds chords of up to four notes per step, a startup pulse on the pads and a Modules folder on the card with ten example modules. Projects saved by 0.2.1 do not load in 0.2.0.
  - version: v0.2.0
    date: 2026-10-27
    url: https://github.com/llcoolkm/arrhythmia/releases/tag/v0.2.0
    notes: Replaces track 8's saw synth with a four-operator FM synth with 16 sounds, eight macros, sustain and release; the devkit build is unchanged.
  - version: v0.1.1
    date: 2026-10-20
    url: https://github.com/llcoolkm/arrhythmia/releases/tag/v0.1.1
    notes: Adds attack and decay to the track 8 synth on macros 2 and 3; the devkit build is unchanged.
  - version: v0.1.0
    date: 2026-10-20
    url: https://github.com/llcoolkm/arrhythmia/releases/tag/v0.1.0
    notes: First release.
