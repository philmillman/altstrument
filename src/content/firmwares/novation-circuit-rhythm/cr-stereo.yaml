device: novation-circuit-rhythm
name: cr_stereo
summary: Patch sources and build tools that turn the Circuit Rhythm's 5706 firmware into a build with stereo sampling, paired tracks, key groups and an auto-sampler.
description: >-
  cr_stereo does not ship firmware. You supply Novation's build 5706 update file, the build script checks it by
  SHA-256 and patches it locally, and the result is sent to the Rhythm's bootloader with a Web MIDI page that is part
  of the repository. A stereo recording is stored as two mono samples in neighbouring slots, and two adjacent tracks
  can be paired so one plays the left half and the other the right, with pan, FX sends, volume and sidechain coupled.
  Version 0.2.0 adds key groups, where samples tagged with root notes play as one multi-sample instrument, and an
  auto-sampler on the Sample Rec page that records C2 to C6 from an external synth over MIDI, one note per slot. It
  also refuses recording and stops a take when sample memory runs low. The patches are written in Rust and DSP56300
  assembly, and the build instructions given are for Windows with PowerShell 7, Python and a Rust toolchain. The
  project's notes record the v0.2.0 build as confirmed on hardware.
status: active
authors:
  - name: Jake Smith
    url: https://github.com/jsmith13
source: https://github.com/jsmith13/cr_stereo
source_status: open
license: MIT
license_notes: >-
  MIT (LICENSE) for the repository contents. The repository holds no Novation code or firmware and the license does
  not cover Novation's update file, which the user downloads from Novation Components and which the build verifies
  by hash. The README says images built from it should not be redistributed, and nothing in the repository serves a
  patched image.
distribution: patch-your-own
requires_stock: "5706"
install_notes: >-
  Get circuitrhythm-firmware-5706.syx from Novation Components, decode it and run the build script as described in
  the README, which lists the expected SHA-256 of the stock file and of the v0.2.0 output. Enter the bootloader by
  holding Sample Rec, Samples and Note while powering on, serve tools/firmware_sender.html over localhost and send
  the built .syx from Chrome or Edge, which takes about 25 seconds. To go back, send the official .syx the same way
  or use Novation Components.
  The README says the official firmware can always be reinstalled through the bootloader.
brick_risk: false
tags: [sampler, stereo, sequencer, key-groups]
