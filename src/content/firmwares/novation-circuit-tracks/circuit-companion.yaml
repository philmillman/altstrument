device: novation-circuit-tracks
kind: tool
name: Circuit Companion
summary: React patch editor and librarian for the Circuit Tracks over Web MIDI SysEx. It reads the active patch or all 64, edits oscillators, the mod matrix and macros with draggable envelopes, and writes patches back to slots. Not the Python CircuitCompanion for the original Circuit.
description: >-
  The app reads the unit's patch dumps with a parser built for the Circuit Tracks 348-byte payload, shows oscillator, filter,
  envelope, FX and drum tabs, and offers full read and write access to the 20-slot mod matrix and the 32-slot macro matrix
  with drag-and-drop routing. CC and NRPN changes go both ways, so knob moves on the unit update the page. Patches can be
  fetched one at a time or in bulk from device memory, queued and sent to chosen slots. Patches and projects, including
  sequencer sketches and step locks, are kept in browser storage and can be exported and imported as JSON. The README does not
  name a licence. Nothing is flashed.
