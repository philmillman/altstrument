source_status: open
license: unspecified
license_notes: There is no LICENSE file and the README states no licence.
homepage: https://circuit-tracks-buddy-3w89g.ondigitalocean.app/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, connect the Circuit Tracks over USB and accept the MIDI pop-ups. The page loads the
  WebMidi.js library from a CDN.
brick_risk: false
