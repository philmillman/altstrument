device: novation-circuit-tracks
kind: tool
name: Circuit Tracks Buddy
summary: One-page Web MIDI display that shows the names and categories of the patches loaded on the Circuit Tracks' two synth tracks. It requests a patch dump at start and after each program change, and reads the name out of the reply.
description: >-
  Meant as a sidecar screen on a phone or laptop plugged into the unit's USB port. The page sends the patch dump request
  described in the Circuit Tracks programmer's guide when it loads and on every program change, then decodes the patch name
  and category from the reply. The author hosts the page on a DigitalOcean app that deploys from the repository and says they
  built it with little web experience. The README does not name a licence. Nothing is flashed.
status: dormant
