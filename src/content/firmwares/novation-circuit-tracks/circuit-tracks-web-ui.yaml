device: novation-circuit-tracks
kind: tool
name: Circuit Tracks Web UI
summary: Vue app with a Node.js MIDI bridge that tries to replace Novation Components, with a patch editor, sample browser, step sequencer, mixer and session export. The author marks it deprecated and archived in favour of CircuitTracksPro.
description: >-
  The front end talks to the unit over Web MIDI for CC and notes, while SysEx patch dumps and bank transfers go through a
  local Node.js server using easymidi and a WebSocket. Tabs cover the synth editor with macro and mod matrix pages, drum
  sample upload converted with ffmpeg, a step grid with velocity and probability, a mixer, MIDI settings, sessions, and a
  device page. A standalone MIDI tester page is included. The README lists limits: no firmware query, CC-based tempo is
  approximate, and only one session should control the unit. A Vercel copy of the front end answered when checked, but patch
  transfer needs the Node server running on the machine the synth is plugged into. Nothing is flashed.
status: archived
