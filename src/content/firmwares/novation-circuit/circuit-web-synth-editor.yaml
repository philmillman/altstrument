device: novation-circuit
kind: tool
name: Circuit Web Synth Editor
summary: Browser patch editor for the original Circuit over Web MIDI SysEx. It edits the current synth patch, loads one from the Circuit, and exports SysEx files that Novation Components accepts. Listed here is the GitHub Pages copy; the framagit original was unreachable.
description: >-
  Rights warning: the repository includes a PDF of Novation's Circuit Programmer's Reference Guide in its resources folder.

  The editor shows the synth engine (voice, oscillators, filter, envelopes, LFOs, effects and EQ), the mod matrix and the
  macro controls as sliders and menus. It finds the Circuit by port name, plays a short note on connect, and sends each
  change to the unit. It can request the patch currently selected on a synth, edit it, start a new patch, and save patches
  as .syx files. The README says it was written because other editors did not run on GNU/Linux. It also documents the LFO
  and session byte layout. The project began at framagit.org/pumpkin/circuit-web-synth-editor, which redirected to a
  sign-in page and returned not found from its API on 2026-11-03. This entry follows the copy by cgoehl, which adds a more
  compact layout and a GitHub Pages site. The copies by ewe2 (a 2020 backup) and Jihuxa (an older snapshot that keeps the
  original author's commits) hold the same code. Nothing is flashed.
