homepage: https://cgoehl.github.io/circuit-web-synth-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a browser with Web MIDI and allow MIDI with SysEx access. Plug in the Circuit first, or reload the
  page after connecting it. Close Novation Components and other editors while editing, because two programs talking to the
  unit can overwrite your edits. The README says to use it at your own risk.
