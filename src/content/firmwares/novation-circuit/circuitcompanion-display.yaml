device: novation-circuit
kind: tool
name: CircuitCompanion
summary: Python and pygame display that listens to a Circuit over USB MIDI, requests patch dumps, and shows the current patch name, macro knob assignments and a 64-slot patch library. It is built for an 800x480 screen on a Raspberry Pi.
description: >-
  Rights warning: the macro destination table was recovered from the GPL-3.0 Circuit Web Synth Editor, while this repository
  is licensed MIT.

  circuit_patch.py decodes Circuit patch dumps, macro destinations and the mod matrix from the layout in Novation's
  programmer's reference guide. circuit_display.py watches channels 1 and 2, follows knob moves and patch changes, and
  re-reads the patch when Components edits it. A library view lays the 64 slots out like the two pages of pads. Scanning the
  library loads every patch on the selected synth in turn, so it changes the sound while it runs and is never automatic;
  results are cached in library.json. A demo mode simulates knobs without a Circuit. The author plans a standalone build on a
  Pi with a 7-inch touchscreen and a wiring diagram is included. The project notes say Novation's guide is not included in the
  repository. Nothing is flashed.
status: active
authors:
