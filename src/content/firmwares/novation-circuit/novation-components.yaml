device: novation-circuit
also_devices: [novation-circuit-tracks, novation-circuit-rhythm, novation-circuit-mono-station, novation-launchpad]
kind: tool
name: Novation Components
summary: Novation's own browser app over Web MIDI for patches, samples, packs, sessions and settings on the Circuit range and the Launchpad X, Mini MK3 and Pro MK3. It also runs Novation's firmware updater, so it serves official firmware. Closed source.
description: >-
  Components is Novation's official software for its hardware, run from a web page and signed in with a Focusrite or Google
  account. Its code carries models for the Circuit, Circuit Tracks, Circuit Rhythm, Circuit Mono Station and the Launchpad
  Pro MK3, X and Mini MK3 listed here, and also for Launchkey, Peak, Summit and Bass Station II models that are not in this
  catalog. Which functions need the sign-in was not tested. The app includes a firmware updater that fetches Novation's own
  firmware files for the connected unit. This is first-party software, not custom firmware, and no source is published.
status: maintained
authors:
  - name: Novation
    url: https://novationmusic.com/
source_status: closed
license: proprietary
license_notes: No licence text is published on the page. It is Novation's product software.
homepage: https://components.novationmusic.com/
distribution: browser-installer
install_notes: >-
  Open the page in a browser with Web MIDI, connect the unit by USB and allow MIDI access. The page offers sign-in through
  a Focusrite or Google account; the firmware updater inside the app is Novation's and flashes the unit.
brick_risk: false
