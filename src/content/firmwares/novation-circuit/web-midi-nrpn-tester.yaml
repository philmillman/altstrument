device: novation-circuit
kind: tool
name: Web MIDI NRPN Tester
summary: Small browser app for building NRPN test controllers (slider, select or radio) and sending the messages over Web MIDI. It looks for an output named Circuit, and its guide uses the Circuit's session FX Bypass NRPN as the worked example.
description: >-
  The user enters an NRPN's MSB, LSB, value range and MIDI channel and picks a control type, then moves the control to send
  the resulting CC 99, 98, 6 sequence. A status window shows the last message sent. The README walks through the Circuit's FX
  Bypass parameter from Novation's programmer's reference guide, and the code only selects a MIDI output whose name is
  exactly Circuit, ignoring case. The controllers themselves are generic NRPN senders. Nothing is flashed.
status: dormant
