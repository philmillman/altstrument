homepage: https://github.com/chchatham/neptune-groovebox
distribution: patch-your-own
requires_stock: Novation Launchkey Mini MK4 firmware 1563 (.syx update file, from Novation)
install_notes: >-
  Download the 1563 update file from Novation, put it in the git-ignored firmware folder, run tools/build_neptune_fw.py
  with a three-character tag and flash the result with tools/flash_confirmed.py, then check the tag in the USB HID
  string. The update is staged and installed only after a verified transfer. The rules document says a build that
  transfers but cannot run USB and the update handler needs Oct + and Oct - held while plugging in, by hand, to reach
  the hardware bootloader, which the patches never touch. The app builds with CMake on macOS and expects a Launchkey
  Mini 25 MK4 running the patched firmware.
brick_risk: false
tags: [groovebox, sequencer, synth-engine, sampler, midi, reverse-engineering, patcher, performance]
versions:
