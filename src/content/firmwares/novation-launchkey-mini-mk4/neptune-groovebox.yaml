    date: 2026-11-11
    url: https://github.com/chchatham/neptune-groovebox/releases/tag/v0.9
    notes: First public release; source only, with no app binary or Novation firmware image. Seven sound engines, a step sequencer with parameter locks and trig conditions, song mode, per-track arpeggiator, help cards, undo and redo, and a display running at about 22 frames a second.
