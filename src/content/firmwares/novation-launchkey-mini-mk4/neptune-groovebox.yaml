device: novation-launchkey-mini-mk4
name: Neptune Groovebox
summary: Patched Launchkey Mini MK4 firmware that hands the display and every button to a macOS groovebox app, with a documented map of Novation's 1563 firmware and the host tools used to build and flash it.
description: >-
  The project has two parts. The firmware part is a small set of patches applied to Novation's own 1563 update file for
  the Launchkey Mini 25 MK4. The patched build lets the host draw on the OLED display, reports the Settings, Arp and
  Scale buttons to the host as MIDI CCs instead of acting on them, sends polyphonic pad aftertouch in the DAW pad
  layout, confirms firmware updates without a button press and exposes a debug SysEx command for calling functions and
  reading memory. The Python tools in the repository decode and re-encode the update file, check each patch against the
  stock bytes it replaces, flash with per-packet acknowledgement and read the display back. The app part is a C++ and
  JUCE program for macOS that turns the controller into a groovebox played without looking at a screen, with a
  step sequencer with parameter locks, eight sound engines, a sampler, effects and an arpeggiator per track. The
  documents include a map of the stock firmware checked on hardware, the update-file format and a control map. The
  The first release, v0.9, is source only.
