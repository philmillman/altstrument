device: oberheim-matrix-1000
name: Matrix 1000 Editor
kind: tool
summary: Single-page Web MIDI editor for the Oberheim Matrix 1000 that edits all 100 parameters and the ten-slot modulation matrix live over SysEx, selects banks and patches, reads the current patch and stores to user banks.
description: >-
  Sliders, dropdowns and toggles are grouped by signal flow and every change is sent as SysEx with a minimum gap of ten
  milliseconds so the V1.11 firmware is not overloaded. Get Patch reads the edit buffer back, which needs a MIDI cable
  from the synth to the interface, and Store writes to user banks 0 and 1 after unlocking them; factory banks are
  protected. A MIDI monitor and a channel selector are included. The README warns that SysEx sent while notes sound can
  cause glitches on V1.11 and that the project was built with Claude Code. Nothing is flashed.
status: active
authors:
