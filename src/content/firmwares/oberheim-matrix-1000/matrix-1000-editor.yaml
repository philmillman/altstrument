    url: https://github.com/dirkk0
source: https://github.com/dirkk0/oberheim-matrix1000-editor
source_status: open
license: MIT
homepage: https://dirkk0.github.io/oberheim-matrix1000-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page, or index.html from a clone, in Chrome or another Web MIDI browser and allow SysEx. Choose the
  interface for MIDI Out and, for Get Patch, MIDI In, and set the synth's MIDI channel.
brick_risk: false
