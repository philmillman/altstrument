    url: https://github.com/gprmusicproject
source: https://github.com/gprmusicproject/mtrx-1k
source_status: open
license: GPL-3.0-only
license_notes: >-
  Read from LICENSE.txt and the README. It is based on Retromulator by discoDSP, also GPL-3.0. The Matrix-1000 firmware is not in the repository and must be supplied by the user.
homepage: https://www.gprmusic.com/product/mtrx-1k/
distribution: source-only
requires_stock: Your own copy of the Matrix-1000 v1.20 system EPROM image (32 KB), and optionally the 64 KB patch EPROM; put both in Documents/GPR Music Project/MTRX-1K/ROM.
install_notes: >-
  Build on Windows with Visual Studio and run build_win.bat, then copy MTRX-1K.vst3 into the VST3 folder, or buy the maker's package that includes an installer. Nothing is written to a Matrix-1000.
