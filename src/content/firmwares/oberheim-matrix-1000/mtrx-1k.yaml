device: oberheim-matrix-1000
name: MTRX-1K
kind: tool
summary: >-
  Windows VST3 instrument and standalone app that runs the Matrix-1000's v1.20 firmware on an emulated 6809 board with six voice-chip models, with a rack panel and a full patch editor.
description: >-
  A modified version of discoDSP's Retromulator reduced to its Matrix-1000 core. It runs the original firmware on an emulated 6809 board with timers, UART, sample-and-hold DAC and latches, and drives six models of the CEM3396 voice chip with band-limited oscillators and the three voice-board sync modes. The firmware calibrates the voices on first start and reads the factory banks from the patch EPROM. It adds a rack panel in a black or white finish, an editor with all patch parameters and the ten modulation buses on one page, MIDI learn profiles, an effects chain of ensemble, delay and reverb, and 12 or 24 voices by running more instances. The firmware is not included: you supply the 32 KB v1.20 system EPROM and, optionally, the 64 KB patch EPROM. The source is GPL-3.0 and the maker sells a package with an installer, manual and a 41-preset bank; the repository has no releases. It is not affiliated with Oberheim and was tested on Windows 11 only.
status: active
authors:
