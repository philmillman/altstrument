versions:
  - version: '2026-11-24'
    date: 2026-11-24
    url: https://github.com/eh2k/squares-and-circles/releases/tag/2026-11-24
    notes: Adds TR-909 bass drum, snare, rim shot, clap and toms engines and a TB-303 model, SYNTH/VA-303, that replaces XX-303. Insert effects get a section and their own trigger and CV inputs, loading an engine no longer interrupts the other tracks' audio, and on the Teensy 4.0 module the audio runs in an interrupt. A patch saved with the new inputs is not read by older firmware.
  - version: '2026-11-14'
    date: 2026-11-14
    url: https://github.com/eh2k/squares-and-circles/releases/tag/2026-11-14
    notes: Adds insert effects on a track's I/O page, a silent mode, USB audio playback without loading an engine and MIDI output from the 303-Patterns and EuclidArp sequencers. The notes list fixes for accent inputs and chord levels over MIDI, and an overload now stops the engine loaded last instead of freezing the module.
  - version: '2026-10-31'
    date: 2026-10-31
    url: https://github.com/eh2k/squares-and-circles/releases/tag/2026-10-31
    notes: Summarises over 600 commits. Adds a DRUMKITS category, Plaits models in one synth engine, compressor, drive, ducker and tuner engines, multi-page parameters, MIDI polyphony and USB audio on the Teensy 4.0 module, and fixes MIDI clock timing, levels and calibration. Existing setups may need more level and a fresh CV calibration.
  - version: '2026-04-08'
    date: 2026-04-14
    url: https://github.com/eh2k/squares-and-circles/releases/tag/2026-04-08
    notes: Calibration page, O_C T4.1 aux input and TR707 pitch fixes; sequencer engines stop when length is 0.
  - version: '2026-02-24'
    date: 2026-02-27
    url: https://github.com/eh2k/squares-and-circles/releases/tag/2026-02-24
    notes: Merges the TR-909 ride into the hi-hat engine and fixes DxFM stereo and a MIDI CC crash.
