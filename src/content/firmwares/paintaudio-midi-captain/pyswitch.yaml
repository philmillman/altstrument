    notes: Replaces the Adafruit MIDI library with a minimal MIDI buffer to save RAM, so the MIDI handlers in communication.py no longer take channel arguments. The channel for CC and PC messages is now set per action and display callback, defaulting to channel 1 so existing configurations keep working.
