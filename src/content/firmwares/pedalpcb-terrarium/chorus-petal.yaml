device: pedalpcb-terrarium
name: Labrador (ChorusPetal)
summary: Chorus echo pedal for the Terrarium with a delay of up to one second, a lo-fi tone control, tap tempo and a switchable sine or triangle modulation wave.
description: >-
  Labrador is a chorus and echo effect written for a Daisy Seed on the Terrarium board. The knobs set mix, lo-fi tone, delay time, density (feedback), rate and depth. One footswitch bypasses and the other taps tempo, and one toggle switch selects the modulation wave while another adds a high-pass filter to the wet signal. The README lists a stereo PCB design as a to-do. There is no license file.
