device: pedalpcb-terrarium
name: Ironpedal
summary: Multi-effect firmware for a Daisy Seed in a Terrarium pedal with an added OLED display, 16 effects, 20 saved profiles in external flash, a five-minute looper and a Moog ladder input filter.
description: >-
  Effects are selected with the toggle switches, which also act as a four-bit effect number, and the knobs change meaning per effect. The list includes overdrive, chorus, compressor, reverb, resonator, autowah, tremolo, looper, decimator, phaser, delay, flanger and pitch. Settings are saved and loaded through the Seed's QSPI flash, and the screen can be turned off to reduce interference. The README gives build and wiring notes for the display and a case.
status: dormant
authors:
  - name: Snail
    url: https://github.com/snail23
source: https://github.com/snail23/ironpedal
source_status: open
license: MIT
distribution: download
install_notes: >-
  Erase the QSPI flash once, then copy ironpedal.bin to the drive the Daisy Seed presents, which flashes it. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
tags: [fx, reverb, delay, looper, lfo, platform]
