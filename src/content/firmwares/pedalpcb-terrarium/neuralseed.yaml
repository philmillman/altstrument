device: pedalpcb-terrarium
name: NeuralSeed
summary: Neural-network amp and overdrive emulation for a Daisy Seed in a Terrarium pedal, with built-in GRU models, level and mix knobs and three parameter knobs. Prebuilt neuralseed.bin on the release page.
description: >-
  Runs a small recurrent network through the RTNeural engine. The release notes list input and output level, wet/dry mix, up to three parameterised knobs, EQ boost switches, bypass on the left stomp and model cycling on the right stomp. The README says it suits amps and distortion pedals and not time-based effects, and points to a Colab script for training models.
status: dormant
