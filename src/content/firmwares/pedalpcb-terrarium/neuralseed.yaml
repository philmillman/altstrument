license: MIT
homepage: https://guitarml.com/
distribution: download
install_notes: >-
  Flash neuralseed.bin from the v0.1 release with the Electrosmith web programmer or DFU. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
