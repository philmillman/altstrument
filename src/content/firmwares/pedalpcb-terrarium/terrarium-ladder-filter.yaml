device: pedalpcb-terrarium
name: Terrarium Ladder Filter
summary: Moog-style ladder filter pedal for the Terrarium with an LFO on the cutoff, adjustable resonance and intensity, and a sine or triangle LFO wave switch.
description: >-
  A single-file Daisy Seed program using the DaisySP ladder filter. The knobs set LFO speed, filter intensity, resonance frequency, cutoff frequency and output volume, one toggle selects the LFO waveform and footswitch 1 bypasses. The repository carries a GitHub Actions build and two tagged releases from February 2021.
status: dormant
authors:
