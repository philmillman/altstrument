    url: https://github.com/fxwiegand
source: https://github.com/fxwiegand/terrarium-pitch-shifter
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Build with the Daisy toolchain and flash with the Electrosmith web programmer or DFU. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
