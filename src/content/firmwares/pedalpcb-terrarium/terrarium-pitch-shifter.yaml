device: pedalpcb-terrarium
name: Terrarium Pitch Shifter
summary: Dual pitch shifter for the Terrarium with separate pitch and mix controls for each voice, an octave-up switch per voice and a dry level control.
description: >-
  Two pitch shifters run in parallel on the Daisy Seed. Knobs set the mix of each shifted signal, the dry mix and a pitch for each shifter, with a toggle switch adding an octave to either voice. The only release is marked as a pre-release, and the last commit only changed the ignore file.
status: dormant
authors:
