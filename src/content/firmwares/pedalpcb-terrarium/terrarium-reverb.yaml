device: pedalpcb-terrarium
name: Terrarium Reverb
summary: Basic reverb for the Terrarium adapted from the Daisy Petal examples, with time, damping and send controls and optional modulation with a sine or triangle LFO.
description: >-
  The README describes it as the Daisy Petal reverb example converted to the Terrarium's controls. Knobs set reverb time, damping, send amount, modulation speed and modulation intensity, and toggles enable modulation and pick the LFO wave. Two releases from February 2021 are tagged, and the README says a reverb.bin is attached to the releases page.
status: dormant
authors:
  - name: Felix Wiegand
    url: https://github.com/fxwiegand
source: https://github.com/fxwiegand/terrarium-reverb
source_status: open
license: MIT
distribution: download
install_notes: >-
  Flash reverb.bin from a release with the Electrosmith web programmer, or build with the Daisy toolchain. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
tags: [fx, reverb, lfo]
