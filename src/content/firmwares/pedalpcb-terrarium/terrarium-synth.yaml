device: pedalpcb-terrarium
name: Terrarium Synth
summary: Monophonic pitch-tracking synth pedal for the Terrarium that plays a pulse-to-saw oscillator or noise from the guitar's pitch, with a filter, saved preset and tap-tempo modulation between settings.
description: >-
  Knobs set the dry level, synth level, trigger threshold, wave shape, filter and resonance. Toggles switch the oscillator to noise, choose whether the synth copies the dry envelope, and set how the preset footswitch behaves. Holding that footswitch saves the current settings to the pedal, and in modulate mode each played note blends over time between the saved preset and the knob settings at a tap-tempo rate. The README links a demo video.
