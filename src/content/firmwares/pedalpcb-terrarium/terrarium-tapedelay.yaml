license: GPL-3.0-only
license_notes: LICENSE is the standard GPL version 3 text with no "or later" statement.
distribution: source-only
install_notes: >-
  Build with the Daisy toolchain (a CMake project) and flash with the Electrosmith web programmer or DFU. The Daisy Seed's ROM DFU mode stays available if a flash goes wrong.
brick_risk: false
