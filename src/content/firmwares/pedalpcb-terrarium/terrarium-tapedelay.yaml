device: pedalpcb-terrarium
name: terrarium-tapedelay
summary: Tape delay for the Terrarium using a hysteresis model from CHOWTape, with delay time, feedback, tape age, wow and flutter and a switch between Studio, Space Echo and Echorec models.
description: >-
  The knobs set delay time, feedback, level, tape age, wow and flutter and the tape model. Footswitch 1 bypasses, and holding it clears the delay line, while footswitch 2 taps tempo. The README credits Jatin Chowdhury's CHOWTape for the hysteresis model and gives GPLv3 as the license. The repository has a GitHub Actions build and no releases.
status: dormant
