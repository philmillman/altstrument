device: plinky-plinky
name: Plinky Editor
kind: tool
summary: The project's browser patch editor for Plinky, a Svelte app that reads and writes presets over WebUSB. It lists the synth's parameters by category, randomizes by category and loads and saves one patch at a time.
description: >-
  The page connects to Plinky over its WebUSB interface and reads or writes a preset using the six-command protocol described in the source. It
  was published as a WebUSB playground and has not changed since 2022, so it does not know about parameters the newer firmware added. Nothing is flashed.
status: dormant
