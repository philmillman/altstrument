    url: https://github.com/miunau
source: https://github.com/plinkysynth/editor
source_status: open
license: CC-BY-NC-SA-4.0
license_notes: The LICENSE file says all Plinky-contributed material is under CC BY-NC-SA 4.0.
homepage: https://plinkysynth.github.io/editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a WebUSB browser such as Chrome or Edge and connect Plinky over USB in its normal mode. On Linux, a udev rule may be needed for USB access.
brick_risk: false
