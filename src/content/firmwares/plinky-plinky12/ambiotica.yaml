device: plinky-plinky12
name: Ambiotica
summary: A generative ambient panel for Plinky12 for the Chords faceplate. Played notes feed a looper, a granular cloud, a plate reverb and tuned resonators, with an 8-track drum machine underneath.
description: >-
  Ambiotica ports the author's ambiotica-plugin ambient engine to a Plinky12 panel. Plinky's own voices pass through a rolling loop bed, a scattered
  grain cloud, a short delay that can freeze into a pad, a modulated plate reverb and a bank of resonators that sing a chord out of the wash.
  The left half of the grid is a diatonic play surface, seven sliders set the stages' levels, and two macro gestures collapse the engine into a
  drone or drain it back to silence. An 8-track step sequencer with Euclidean patterns, synthesised drums, sampled kits and sliced breaks
  runs after the chain. The author notes that coding agents helped build the panel. The repository's latest release is an automatically built
  single-file plinky_ambiotica.cpp for the IDE.
status: dormant
