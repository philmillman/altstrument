device: plinky-plinky12
name: plinky-life
summary: A Conway's Game of Life sequencer panel for Plinky12. Columns are steps, rows are scale degrees, and four voices walk through the living grid.
description: >-
  The 16 by 16 grid is a field that a Conway world rewrites on its own clock. Four voices travel through it at their own speeds and play the
  notes they find alive, and an empty column is a rest, so the shape of the world becomes rhythm. The panel has selection rules, four column
  traversal orders, 29 scales, conditional triggers derived from the world and a MIDI CC block, and it lays itself out for the Blocks, Chords,
  Drums and Toadstep faceplates. The musical logic is split into plain headers that are tested on a desktop; build/amalgamate.sh joins them
  into the single life.cpp that the IDE accepts. A manual with pad maps is in docs/manual.md.
status: dormant
