distribution: browser-installer
install_notes: >-
  Open the maker's Plinky12 web IDE in Chrome, start a blank panel, paste the panel source, pick the faceplate, test it in the emulator, then connect the Plinky12 over USB and press Flash. Panels are built together with Plinky's own firmware, so flashing a panel replaces the previous custom panel firmware. Use at your own risk.
