device: polyend-endless
name: Polyend Endless Effects
summary: >-
  Three effects for the Endless with source and prebuilt files: an envelope-controlled stereo tremolo, a clean preamp
  with soft saturation and tilt EQ, and a bucket-brigade-style delay into spring reverb.
description: >-
  Tremvolope lets playing dynamics set the tremolo's rate, depth and stereo spread. Preamp is a boost with tanh
  saturation and a tilt EQ. Necessary Delay darkens its repeats as they feed into a spring reverb, and holding the
  footswitch sustains them. Each effect has its own folder with the source and a README covering its controls.
status: active
authors:
  - name: Camilo Landau
    url: https://github.com/camilolandau
source: https://github.com/camilolandau/polyend-endless-effects
source_status: open
license: MIT
distribution: download
install_notes: >-
  Download an .endl file from the releases page and copy it to the Endless drive over USB. To change one, copy its
  PatchImpl.cpp into Polyend's FxPatch SDK and build it there.
brick_risk: false
tags: [fx, tremolo, delay, reverb]
