    url: https://github.com/rotabeast
source: https://github.com/rotabeast/MedusaControl
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file and no license statement.
distribution: source-only
install_notes: Copy the files into your Max for Live search path, as PATCHER-ASSEMBLY.md describes. Needs Ableton Live with Max for Live.
brick_risk: false
