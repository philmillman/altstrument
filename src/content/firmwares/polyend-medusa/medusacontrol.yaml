device: polyend-medusa
kind: tool
name: MedusaControl
summary: Max for Live device for Ableton Live with a 64-step sequencer and a parameter controller that drives the Polyend Medusa over MIDI CC.
description: >-
  The repository holds the .amxd device, its Max patcher, JavaScript for the sequencer engine, grid, parameter editor and
  pattern storage, a Medusa CC map and scale data, and an assembly guide for rebuilding the patcher. It has no README.
status: active
authors:
