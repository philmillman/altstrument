license: MIT
license_notes: >-
  The LICENSE file is MIT, with an exception for cfw/presets/cc_presets.csv and cfw/src/ccpresets.h, which hold CC numbers
  from the MIDI Guide project and are shared under CC BY-SA 4.0. The file says Polyend's firmware is not part of the
  project, and the repository contains no .ppf files.
homepage: https://sloppyjoo.github.io/freeplay/
distribution: patch-your-own
requires_stock: Play+ 1.3.0 or Play 1.6.0 (RT)
install_notes: >-
  Download PlayPlus_v1.3.0.ppf or PolyendPlay_v1.6.0.ppf from Polyend, drop it on the installer page or run
  patcher/freeplay_patch.py, and copy the result and the official file into the Firmware folder of the SD card. Start the
  update from Settings, Firmware. Back up the card first. The README says only the main application changes and the
  bootloader stays, so pressing the reset button with only the official file in the Firmware folder reinstalls it. K66
  Plays are not supported yet; the README says to flash the official file if the Slice row is missing.
brick_risk: false
