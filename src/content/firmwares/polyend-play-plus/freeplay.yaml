device: polyend-play-plus
also_devices: [polyend-play]
name: FreePlay
summary: Patch for Polyend's Play+ 1.3.0 and Play 1.6.0 (RT) update files that adds a sample slicer, two LFOs with a modulation matrix, sustain and release on samples, a moving playhead, MIDI CC presets and a start and end editor.
description: >-
  A browser page or Python script takes your own copy of Polyend's update file,
  checks that it is the exact expected version, adds the compiled mod and checks
  the result against the tested build byte for byte, giving a .ppf for the
  device's firmware menu. The slicer cuts a track's sample into 2 to 64 slices
  and writes trigs in time, on every step or onto existing trigs. Two LFOs with
  seven shapes have separate amounts per track and parameter, shown in a matrix.
  Other additions are a moving playhead, sustain and release on sample tracks, a
  sample start and end editor with a waveform, eight user slots and 43 synth
  presets for MIDI CC numbers, extra knob-page displays, folder colours, tap
  tempo, brightness settings, project deletion and a synth randomizer on the
  Play+. The README says it has run on a real Play+ and only on a virtual
  original Play. It targets the Play with the RT processor, and a build for
  K66 units is in progress. The author credits Claude, an AI assistant, with
  much of the work, and the repository includes an emulator for testing.
