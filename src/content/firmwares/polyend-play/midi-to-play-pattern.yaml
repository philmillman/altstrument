device: polyend-play
name: MIDI converter to Polyend Play .pattern files
kind: tool
summary: Single-page browser app that loads a MIDI file, lets you pick a start point, up to four bars and a bass or chords melody mode, and exports Polyend Play .pattern files built from two bundled templates.
description: >-
  Rights warning: the repository includes two binary pattern templates, one for
  beats and one for melodies, with no statement of where they come from and no
  licence file.


  Runs entirely in the page, which includes short usage steps and an audio
  preview of each bar. The page says the chords mode is work in progress and the
  code limits export to four bars. The repository has no README, so the page
  itself is the documentation. All commits are from one day in March 2026.
status: active
authors:
  - name: max-baranov101
    url: https://github.com/max-baranov101
source: https://github.com/max-baranov101/polyend_play_pattern_generator
source_status: open
license: unspecified
license_notes: No LICENSE file or licence statement in the repository.
homepage: https://max-baranov101.github.io/polyend_play_pattern_generator/
distribution: browser-installer
install_notes: >-
  Open the hosted page, drop in a MIDI file and export; copy the .pattern files
  into a project on the Play's microSD card after backing it up. The repository
  gives no install steps, so where the files go is not documented.
brick_risk: false
tags: [web, converter, midi, utility]
