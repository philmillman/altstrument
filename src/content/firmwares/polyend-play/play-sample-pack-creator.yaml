device: polyend-play
also_devices: [roland-sp-404-mkii]
name: Sample Pack Creator
kind: tool
summary: Closed browser tool that turns dropped-in audio files into sample packs for the Polyend Play and Play+ and the Roland SP-404 MK2, with slicing, trimming, mono conversion and effects, exported as a ZIP or written straight to an SD card or USB drive.
description: >-
  Files and folders are dropped onto a sample grid in folders such as kick, snare and hats, which the page tells users to
  keep for Beat Fill. It trims, levels and slices samples, can apply a vintage sampler effect, converts everything to mono
  with a note about memory limits, and shortens names for the TR-1000. Packs go out as a ZIP to unzip on the card, or are
  written to a connected drive through the browser, with project files that can be reopened. Its device profiles set sample
  counts and export steps for each target. Processing stays in the browser. The page names no author and states no licence. Nothing
  is flashed.
status: active
authors:
  - name: Sample Pack Creator
    url: https://spcreator.app/
source_status: closed
license: proprietary
license_notes: No licence terms are published; the page names no author. Closed source.
homepage: https://spcreator.app/
distribution: browser-installer
install_notes: >-
  Open the site in a Chromium browser, drop in samples, pick the target device and export a ZIP for the SD card or choose
  the drive to write to directly.
brick_risk: false
tags: [sample-transfer, sampler, utility, web]
