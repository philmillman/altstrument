device: polyend-tracker-mini
name: Alpaca
summary: Tracker Community Edition build for the Tracker Mini that adds a chord-machine panel in the style of the Conductive Labs NDLR, with chord buttons, pad, drone and two motif parts driving the internal synths.
description: >-
  Licence note: the README says the project follows Tracker CE's PolyForm Noncommercial terms, and the repository has no
  LICENSE file yet.

  The panel opens from Config, then Info, and is played with the Mini's d-pad, which highlights one of eight on-screen
  encoders or seven chord buttons. A Pad part, a Drone part and two Motif parts (one arpeggiating up, one down) play
  through the Mini's synth channels, with tempo, key, mode and octave settings and a panic control. The repository holds
  only the source files that go over a tracker-ce checkout, three new ones and six modified. Its install notes list strum,
  spread, rhythm patterns, the mod matrix and LFOs as not yet implemented, and the author calls the project fan-made and
  unofficial. The Mini build of Tracker CE 1.0.0 with these changes is attached to the v0.1 release.
status: active
