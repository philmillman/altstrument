    url: https://github.com/5ckmmz97rw-svg
source: https://github.com/5ckmmz97rw-svg/Alpaca
source_status: open
license: PolyForm-Noncommercial-1.0.0
license_notes: >-
  The README states "same as Tracker CE, PolyForm Noncommercial" and tells the reader to add the licence text as LICENSE;
  no LICENSE file is in the repository. The v1.0.0 tag of polyend/tracker-ce carries the PolyForm Noncommercial 1.0.0 terms
  with Polyend's additional permissions, and the release file is named for Tracker CE 1.0.0.
homepage: https://5ckmmz97rw-svg.github.io/Alpaca/
based_on: polyend-tracker/tracker-ce
distribution: download
requires_stock: Tracker CE 1.0.0 base
install_notes: >-
  Copy TrackerMini_CE_1.0.0_NDLR4.ptf from the release to /Firmware on the microSD card, then choose Config > Firmware
  update, or build it from a tracker-ce checkout with the Make target given in the README. Back up projects first, because
  Community Edition firmware saves patterns in a format older firmware cannot read. The Mini's recessed reset button starts
  the bootloader, which flashes a known-good .ptf from the card, so a build that does not boot can be replaced.
brick_risk: false
