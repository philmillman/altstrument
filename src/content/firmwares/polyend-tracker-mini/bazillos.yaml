license_notes: >-
  The root LICENSE is Polyend's Tracker Community Edition licence, PolyForm Noncommercial 1.0.0 with Polyend's additional
  permissions: commercial music and monetised content are allowed, selling the firmware or derivatives is not. Polyend's
  precompiled libPolySynth and libPolyDSP libraries ship unmodified under Polyend's own licence. Mutable Instruments code
  is MIT, the QUAD FM core derives from MIT-licensed track3r code, and the Spore fonts derive from BSD-2-Clause Spleen;
  the README says this is not a blanket MIT release. The matching source is the bazillOS-09-Source.zip archive in the
  repository and the release.
homepage: https://kidbee85-beep.github.io/bazillOS/
distribution: download
install_notes: >-
  Back up the whole SD card first, then extract the Mini firmware pack from the release and merge its Firmware folder
  into the card's Firmware folder, adding Themes and Fonts if wanted. Insert the card in the powered-off Mini, choose Config,
  Firmware and select TrackerMini_bz090c.ptf; the startup screen should then show 0.9.0 bazillOS / bz090c. Projects saved
  on Community Edition firmware are not converted back for Polyend's stock firmware. Reinstalling Polyend's official
  firmware from Polyend's downloads page returns the software, and original projects must be restored from the backup.
