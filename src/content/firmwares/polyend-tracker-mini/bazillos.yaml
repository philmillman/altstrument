device: polyend-tracker-mini
name: bazillOS
summary: Independent Tracker Mini firmware built on Polyend's Tracker Community Edition, adding a restyled interface, a drum and chop workspace, a Composer, eleven synth engines, two musical games, Punch recipes and Step FX.
description: >-
  Version 0.9 changes the menu layout and adds a four-track detail view and an eight-track overview. Drum Lab writes ready
  percussion kits into patterns, and one Chop workspace combines slicing recipes, cutting controls and pattern variations.
  Composer writes patterns from musical roles, scales and motif locks, and Fill adds random-memory and slope-generator
  variations. The eleven synth engines include adaptations of Mutable Instruments Plaits, Tides, Warps and Rings code, a
  four-operator FM engine, and the author's own voices; they are selected algorithms, not complete module ports. Pulse Pong
  and Virus Breaker are games whose play is captured as phrases, Punch Deck has 64 performance recipes, and there are twelve
  added Step FX and Master presets. The release also offers fifty starter projects, a 62-page handbook and an
  installation and rollback guide. It supports the Mini only, with 48 sample slots and two Step FX columns. The author
  reports testing on a Mini, including a return to Polyend's 2.2.1, and the film shows host-rendered screens, not a
  capture of the unit.
