device: polyend-tracker-plus
name: Modular-Trackular Plus
summary: Fork of Polyend's Tracker Community Edition for the Tracker+ that adds a framework of mods switched on per project, such as note humanizing, project-wide swing, song looping, per-track length, other master reverbs and delays and two extra synth models.
description: >-
  The successor to Modular-Trackular, which stays on stock firmware 1.2.0. The mods here are compiled into the firmware
  rather than patched into a stock file. Which mods are on is saved with each project, Config > Mods holds the defaults for
  new projects, and a project with no mod data opens with every mod off. Humanize adds small random changes to the
  micro-move and volume of the selected notes, Global Swing makes every take and pattern start use the project's swing
  amount, Color Song colours song blocks by their content, Song Loop repeats a block of song positions, and Variable Track Length gives each track of a pattern its own length, looping a short track until the pattern ends. Master FX replaces CE's reverb and delay with other types (Freeverb, plate, spring, shimmer, gated or reverse reverb; tape or BBD delay) chosen on the Master screen, and Copy to New on page 3 of the Pattern screen copies the current pattern into the next empty one. Synths adds two synth models to the picker, WAVE (wavetable) and PHASE (phase distortion), each with a chorus, flanger or phaser and a distortion page, and Synth FX puts the same effects on Community Edition's own synth models. The earlier Chords mod was retired because Community Edition
  now has those chord inversions itself. The mods get 1 MiB of sample memory, so the longest stereo recording is slightly
  shorter. A script copies a project saved on Community Edition into a form 1.2.0 can open. Commits report each step
  tested on hardware. Builds name themselves 1.0.0 MT in Config, Original Tracker and Tracker Mini builds stay plain
  Community Edition, and the project states it is not affiliated with Polyend.
status: active
authors:
  - name: FatRodzianko
    url: https://github.com/FatRodzianko
source: https://github.com/FatRodzianko/Modular-Trackular-Plus
source_status: open
license: MIT
license_notes: >-
  The LICENSE is Polyend's "MIT License with Wholesale Commercial Clone Restriction", so the complete firmware and .ptf builds
  cannot be sold. The precompiled synth libraries stay Polyend's proprietary code. The files in core/mods carry MIT
  identifiers.
distribution: source-only
install_notes: >-
  No prebuilt firmware is published; the mods live on the modular branch, and main is an unchanged copy of Polyend's repository.
  Build the Tracker+ target, copy the resulting .ptf to /Firmware/ on the microSD card and run Config > Firmware > Firmware
  update. Back up first: saving a project on Community Edition firmware moves its patterns to a format older firmware cannot
  read. Recovery follows Polyend's route, with a known-good .ptf and the recessed reset button.
  The repository README says the bootloader sits in a protected region below the application, apart from the
  .ptf. Polyend's tracker-ce README documents the recessed reset button as an emergency bootloader that flashes
  a known-good .ptf from /Firmware, so a build that does not boot can be replaced from the SD card.
brick_risk: false
tags: [fork, platform, midi, sequencer, tracker]
