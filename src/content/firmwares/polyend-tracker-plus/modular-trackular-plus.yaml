    notes: No tagged releases; this is the latest commit. Adds the Synth FX plugin runtime, default pack and SDK in four phases, with WAVE and PHASE moved onto the plugin slots, and merges newer Tracker CE changes with many bug fixes to the Pattern, Song, File, Sample and Instrument screens.
  - version: modular @ d5403b2
    date: 2026-11-11
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/commit/d5403b2fd9ac29432970a6e52b1360cf5fa8b964
    notes: No tagged releases; this is the latest commit. Merges the Synths and Synth FX mods into the modular branch, and the README says every mod is tested on hardware.
  - version: modular @ c13601f
    date: 2026-11-09
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/commit/c13601fa5f1ae84d647c8e1745f2162731fa4158
    notes: No tagged releases, with the Humanize, Global Swing, Color Song, Variable Track Length, Master FX, Copy to New and Song Loop mods on top of Polyend's main. The README says all seven are tested on hardware. It merges newer Tracker CE changes, among them USB audio mapping and buffer drift fixes, composite USB enumeration and a revert of the pad LED logic, with beat-slice pads lit in record mode.
