device: polyend-tracker-plus
name: Modular-Trackular Plus
summary: Fork of Polyend's Tracker Community Edition for the Tracker+ that adds a framework of mods switched on per project, such as note humanizing, project-wide swing, song looping, per-track length, other master reverbs and delays and two extra synth models.
description: >-
  The successor to Modular-Trackular, which stays on stock firmware 1.2.0. The mods here are compiled into the firmware
  rather than patched into a stock file. Which mods are on is saved with each project, Config > Mods holds the defaults for
  new projects, and a project with no mod data opens with every mod off. Humanize adds small random changes to the
  micro-move and volume of the selected notes, Global Swing makes every take and pattern start use the project's swing
  amount, Color Song colours song blocks by their content, Song Loop repeats a block of song positions, and Variable Track Length gives each track of a pattern its own length, looping a short track until the pattern ends. Master FX replaces CE's reverb and delay, and adds a limiter slot, with plugins from /MasterFX/ on the card (Freeverb, plate, spring, shimmer, gated or reverse reverb; tape or BBD delay; a Compressor, and a Glue bus compressor that can work on chosen tracks, with ducking of chosen tracks), chosen on the Master screen, and Copy to New on page 3 of the Pattern screen copies the current pattern into the next empty one. Synths adds three synth models to the picker, WAVE (wavetable), PHASE (phase distortion) and, since synths-1.1, DCO6 (a Juno-106-style virtual analog with Unison), each with a chorus, flanger or phaser and a distortion page, and Resample, since resample-1.0, adds Trk Audio and Trk Record buttons to the Sample Recorder so the tracker's own sound can be heard and recorded with Line In or a mic, and Synth FX gives each synth part two effect slots, on Community Edition's seven engines as well as WAVE and PHASE, that load plugins from /SynthFX/ on the card; the firmware writes a default pack of overdrive, distortion, bit crusher, chorus, flanger and phaser there and the repository holds an SDK for building more. The earlier Chords mod was retired because Community Edition
  now has those chord inversions itself. The mods get 1 MiB of sample memory, so the longest stereo recording is slightly
  shorter. A script copies a project saved on Community Edition into a form 1.2.0 can open. Commits report each step
  tested on hardware. Builds name themselves 1.0.0 MT in Config, Original Tracker and Tracker Mini builds stay plain
  Community Edition, and the project states it is not affiliated with Polyend.
status: active
authors:
  - name: FatRodzianko
    url: https://github.com/FatRodzianko
source: https://github.com/FatRodzianko/Modular-Trackular-Plus
source_status: open
license: MIT
license_notes: >-
  The LICENSE is Polyend's "MIT License with Wholesale Commercial Clone Restriction", so the complete firmware and .ptf builds
  cannot be sold. The precompiled factory .psyn synth plugins, which the release's Synths zip carries, stay Polyend's proprietary code under their own licence file. The files in core/mods carry MIT
  identifiers.
distribution: download
install_notes: >-
  Download TrackerPlus_MT_resample-1.0.ptf and PolyendTracker_CE_Synths.zip from the latest release, or TrackerPlus_MT_modular-1.2.ptf, or the CE_20261120 .ptf, with PolyendTracker_CE_Words.zip (needed from CE_20261118 on, also with resample-1.0), whose Words folder goes to the card's root as well. Copy the Synths folder from the
  zip to the card's root, since CE's synth engines are plugins loaded from it, and delete Synths/GRAIN.psyn if an older release
  left it there, then copy the .ptf to /Firmware/ on the
  microSD card and run Config > Firmware > Firmware update. PolyendTracker_CE_Effects.zip is optional and holds CE's Sample
  Editor effects. The mods live on the modular branch, and main is an unchanged copy of Polyend's repository, so the Tracker+
  target can also be built from source. Back up first: saving a project on Community Edition firmware moves its patterns to a format older firmware cannot
  read. Recovery follows Polyend's route, with a known-good .ptf and the recessed reset button.
  The repository README says the bootloader sits in a protected region below the application, apart from the
  .ptf. Polyend's tracker-ce README documents the recessed reset button as an emergency bootloader that flashes
  a known-good .ptf from /Firmware, so a build that does not boot can be replaced from the SD card.
brick_risk: false
tags: [fork, platform, midi, sequencer, tracker]
versions:
  - version: resample-1.0
    date: 2026-11-21
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/resample-1.0
    notes: Adds the Resample mod, switched on in Config > Project Settings > Mods. With Line In or a mic as the Sample Recorder's source, Trk Audio lets you hear the tracker while the recorder is open and start the pattern with the take, and Trk Record (stereo Line In only) records the tracker's sound together with the input, without the metronome. Based on Tracker CE main at cf8bd7b. The notes list Trk Audio with a mic or mono Line In, switching to Radio or USB, and Song Loop or Synth FX running while recording as not yet checked on a Tracker+.
  - version: CE_20261120
    date: 2026-11-20
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/CE_20261120
    notes: Rebased on Polyend's Tracker CE main at cf8bd7b. A sample import that fails partway frees its memory, project saves stop cleanly before the Sample Loader, exports and the Firmware list open, and exported project samples no longer overrun a buffer. File lists sort numbers by value. The mods needed no changes, and the notes list a failing import or save and exports as not yet checked on a Tracker+.
  - version: CE_20261119
    date: 2026-11-20
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/CE_20261119
    notes: Rebased on Polyend's Tracker CE main at 422e0ed. Previewing .wav files in the Sample Loader no longer uses memory the audio needs, notes at the top and bottom of the range with Tune or Fine Tune stay in tune, granular mode works on long samples and empty instruments, and the firmware takes about 125 KB less flash. The mods needed no changes.
  - version: modular-1.2
    date: 2026-11-19
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/modular-1.2
    notes: No new features. Moves 1 KB from CE's heap to the fast memory the mods use, to make room for later mods, and the notes report a lowest free heap of about 60 KB on a Tracker+. Based on Tracker CE main at f25fb89.
  - version: CE_20261118
    date: 2026-11-19
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/CE_20261118
    notes: Rebased on Polyend's Tracker CE main at 922bba0, which plays mono samples on one voice channel, adds a Note display setting, takes Auto Name words from /Words on the card, lets the Sample Recorder pick the line-in channel and adds a Convolution Reverb sample effect. The mods are unchanged and a Words zip joins the release.
  - version: synths-1.1
    date: 2026-11-18
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/synths-1.1
    notes: Adds DCO6, a Juno-106-style virtual analog synth model with saw, pulse, sub and noise, a sweepable high-pass and resonant low-pass filter, an LFO and a Unison mode that stacks up to eight voices. Needs DCO6.psyn from the new Synths zip. The notes say DCO6 with Synth FX or Master FX plugins and saving a project with DCO6 parts were not yet checked on a Tracker+.
  - version: synthfx-1.1
    date: 2026-11-17
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/synthfx-1.1
    notes: The firmware can update the default Synth FX plugins on the card when a release fixes one, leaving files you changed alone, and writes plugin files as a checked copy so a power cut cannot leave a broken plugin. No sound or screen changes.
  - version: masterfx-2.1
    date: 2026-11-17
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/masterfx-2.1
    notes: Adds Glue, a bus compressor for the Limiter slot that can work on chosen tracks only; the earlier Glue is renamed Compressor. Plugin limiter pages take the plugin's name, plugins update on the card at first start, and plugins can have up to five knobs and work on chosen tracks. Based on Tracker CE main at f25fb89.
  - version: CE_20261116
    date: 2026-11-16
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/CE_20261116
    notes: Rebased on Tracker CE main at f25fb89, which stops silent tracks, effects and synth parts from using processor time, hardens project and sample loading and sends USB audio only while a computer listens. Master FX echo tails and Synth FX tails are no longer cut.
  - version: CE_20261115
    date: 2026-11-16
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/CE_20261115
    notes: Rebased on Polyend's Tracker CE main at ed51301, which builds display lists in the unit. CE's GRAIN engine is gone, so the Synths zip carries nine engines, and the mods are unchanged.
  - version: masterfx-2.0
    date: 2026-11-15
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/masterfx-2.0
    notes: Master FX gains a Limiter slot, and its reverb, delay and limiter slots can play .ptmfx plugins from the card's MasterFX folder, with a default pack, an SDK and track ducking.
  - version: CE_20261113
    date: 2026-11-14
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/releases/tag/CE_20261113
    notes: First GitHub release, for the Tracker+ only and based on Polyend's Tracker CE main at 9cb0964. CE's engines are now .psyn plugins loaded from the card's Synths folder, as are WAVE and PHASE. Synth FX works on every engine, and a Synth FX plugin that exceeds CE's synth time limit is bypassed. The release carries the .ptf, a Synths zip and an optional Effects zip.
  - version: modular @ d7a853c
    date: 2026-11-13
    url: https://github.com/FatRodzianko/Modular-Trackular-Plus/commit/d7a853ce3fc9c3b12a3764137f8ba75c559365bc
    notes: No tagged releases; this is the latest commit. Documentation only, recording the first device results of the simulator's card guard.
