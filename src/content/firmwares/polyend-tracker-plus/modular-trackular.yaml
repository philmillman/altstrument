homepage: https://fatrodzianko.github.io/Modular-Trackular/
distribution: patch-your-own
requires_stock: "1.2.0"
install_notes: >-
  Download Polyend's TrackerPlus_1.2.0.ptf yourself and check its SHA-256 against
  docs/PATCHING.md. Pick the mods in the web patcher, or run tools/patch_ptf.py
  with Python 3 on that file; both refuse any other firmware. Name the result
  TrackerPlus<anything>.ptf, keep the name short, copy it to /Firmware on the SD
  card and install it from Config, Firmware. Install the stock file the same way
  to return, and read the repository's notes on the emergency reflash before
  flashing. Do not share patched files.
brick_risk: true
