device: polyend-tracker-plus
name: Modular-Trackular
summary: Patches for Tracker+ firmware 1.2.0 built on your own .ptf file, adding colored Song blocks, Humanize, CC and macro ramps, master effects and swing per project, extra synths, live resampling, per-track lengths, Song Loop and conditional trigs, with a browser patcher.
description: >-
  Reverse-engineering notes, an emulator and a set of mods for the Tracker+.
  Each mod can be applied alone or combined into one firmware. colorsong colors
  the Song screen's track blocks by their content. Humanize adds small random
  micro-move and volume changes to the selected notes. interpolate ramps CC and
  macro values between steps. masterfx picks the master reverb and delay per
  project from several alternatives, including Freeverb, plate, spring, shimmer,
  tape, BBD and gated types. swing sets a global swing per project. The
  visualizer shows animation on the pads during playback. condtrig turns Chance
  FX values above 100 into conditions on the pass count, such as first pass or
  the A-th pass of every B; the idea comes from Psygoo's CT6. The synths mod
  adds a wavetable synth (WAVE) and a Casio CZ-style phase distortion synth
  (PHASE), each in place of one synth model per project, with a mod matrix and
  chorus. Other mods add MIDI legato with a Glide FX, copying the current
  pattern to the next empty one, a Beat Slice Thru play mode that plays each
  slice to the end of the sample and can loop it, live resampling in the
  Sample Recorder, Variable Track Length, which gives each track in a pattern
  its own length, and Song Loop, which loops a selected block of Song positions. Recent commits make the per-project mods survive Save As. The
  patcher checks the stock file's hash and original bytes at every patched
  address, and the repository contains no Polyend code. The README reports each
  mod and the all-in-one build tested on hardware, and a web patcher produces
  the same files as the Python tool.
