homepage: https://psygoo.github.io/TrackerPlus-CT-Web/
distribution: patch-your-own
requires_stock: "1.2.0"
install_notes: >-
  Open the web patcher, choose your own TrackerPlus 1.2.0 .ptf from Polyend and
  save the verified result. Back up the whole SD card first, then install it from
  Config, Firmware as the Tracker+ manual describes. For recovery, keep only the
  stock .ptf in /Firmware, because the emergency flash picks a file at random.
  The README says the project is unofficial, not every playback mode has been
  validated on hardware and recovery is not guaranteed.
brick_risk: true
tags: [patch, sequencer, web, midi]
