source: https://github.com/semierendonmez-commits/polyend-tracker-lab/tree/main/firmwares/bulut
source_status: open
license: GPL-3.0-only
license_notes: >-
  The folder's LICENSE is the Apache-2.0 text, but its THIRD_PARTY.md says code derived from GPL-3.0 sources (forsitan
  modulare's artifex and rete) makes the BULUT image a GPL-3.0 combined work, distributed under GPL v3 with the MIT notices
  kept. It gives no "or later" wording, hence GPL-3.0-only. Mutable Instruments Clouds, Beads and stmlib files are copied
  unchanged under MIT, and the OpenTracker base is Apache-2.0. OpenTracker had no LICENSE file when the work began; upstream
  added Apache-2.0 on 2026-10-28, which the README's credits do not yet reflect.
distribution: download
requires_stock: Polyend stock firmware or OpenTracker; keep a stock image in /Firmware
install_notes: >-
  Copy PolyendTrackerBULUTG.ptf into /Firmware on the SD card, keeping its 24-character name, and install it from Config,
  Firmware update on stock or OpenTracker. Every lab firmware can list and install other .ptf files from its own Config,
  Firmware page, and OpenTracker's ot_restore.txt escape hatch works too. Keep only one lab image plus stock in /Firmware,
  since the rear reset button installs a random .ptf from the folder. The README says the set has not been tested on a real
  unit.
brick_risk: true
