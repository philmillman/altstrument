device: polyend-tracker
name: BULUT
summary: >-
  Granular workstation with four channels that each turn a live input, the radio, the firmware's own output, a card WAV or
  a generator into grains through one of four engines: Granular, Quanta, Beads or Tape.
description: >-
  There is no pattern grid. Each channel reads its source through an adjustable region and plays it as grains on the 48
  pads: the columns choose the position inside the region and the rows choose the density. The engines are a Clouds-style
  granulator, a Quanta engine of microsound particles (glissons, pulsars and others), a Beads-style engine with its four
  recording media, and a Tape engine with a moving playhead and separate speed and pitch. Each channel has its own drive,
  filter, one of seven effect modes (Texture, Shifter, Flanger, Panner, Crusher, Slicer, Freezer), an LFO and delay and
  reverb sends. Pad and encoder moves can be recorded as looping gestures, a moment can be frozen into a spectral loop and
  kept in a library, the output can be resampled into a channel, and eight scenes morph along a timeline. A browser with
  preview loads WAVs from the card, and a CPU guard bypasses effects before a channel overloads. The firmware uses the
  shared LABKIT navigation of the lab: parameter pads on I.Param, a map of every page, macros, modulation routes and MIDI
  learn. A recorder writes the master and optional stems to the card. The repository README calls the whole set v0.1: every
  image passed the author's simulator and QEMU checks, and none has been tested on a real Tracker.
status: active
authors:
