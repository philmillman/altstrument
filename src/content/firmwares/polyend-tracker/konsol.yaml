device: polyend-tracker
name: KONSOL
summary: >-
  Clip and scene workstation with eight tracks and sixteen scenes, sixteen sound engines including Plaits and a 303, ten
  note players, a kit builder, time-stretching and streaming of long WAVs, mixed on a console with sends and a compressor.
description: >-
  The pads are the clip grid and the screen is laid out like a mixing desk; there is no tracker pattern. Each track has one
  of sixteen engines: Mutable Instruments Plaits with all 24 models, a TB303 built on Open303, neuro-bass models, QUANTA
  microsound particles, a makam synth, an Ikeda-style engine, OpenTracker's ACD, VAP, FAT and WTFM synths, drum voices
  from the author's FLOATER plug-in, analog-style and percussion kits, a 16-pad kit, and stereo sampler and grain players. A
  clip's notes are written by hand, on a piano roll or live, or by one of ten players: notes, Euclid, Usul, Pinball, Markov
  and generators for acid lines, call and response, BBCut cuts, turnarounds, genotype variations and a station mode. Clips
  have trig conditions, per-clip quantise and 16-level undo. Samples can be warped to the tempo live, stretched offline by
  WSOLA, phase vocoder or repitch, and sliced by onset detection, and the kit builder turns a break's slices into 16 pads
  sorted into kick, snare and hat. WAVs of 30 seconds or more play straight from the card instead of memory. The mixer has
  Hall, Shimmer and Gated reverbs, Tape and Lo-fi delays, a master compressor and four stem groups. The firmware uses the
  shared LABKIT navigation of the lab: parameter pads, a map of every page, macros, modulation routes and MIDI learn. The
  repository README calls the whole set v0.1: every image passed the author's simulator and QEMU checks, and none has been
  tested on a real Tracker.
status: active
