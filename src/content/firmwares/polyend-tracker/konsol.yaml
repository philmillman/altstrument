source_status: open
license: Apache-2.0
license_notes: >-
  The folder's LICENSE is the Apache-2.0 text. Its THIRD_PARTY.md copies Plaits and stmlib under MIT, uses Open303 and a
  call-and-response generator under MIT, and calls the ports of the author's own plug-ins (FLOATER, NEUROSTACK, QUANTA,
  schwung-303 mappings) "GPL-3 approved" without listing any third-party GPL source. The BBCut player follows Nick Collins'
  BBCut procedures through the bencodec/BBenCut port, rewritten for the Tracker; MAKAM's THIRD_PARTY.md calls BBCut
  GPL and the BBenCut repository has no licence file, so the terms of that part are unclear. OpenTracker had no LICENSE file when
  the work began; upstream added Apache-2.0 on 2026-10-28, which the README's credits do not yet reflect.
distribution: download
requires_stock: Polyend stock firmware or OpenTracker; keep a stock image in /Firmware
install_notes: >-
  Copy PolyendTrackerKONSOL.ptf into /Firmware on the SD card, keeping its 24-character name, and install it from Config,
  Firmware update on stock or OpenTracker. Every lab firmware can list and install other .ptf files from its own Config,
  Firmware page, and OpenTracker's ot_restore.txt escape hatch works too. Keep only one lab image plus stock in /Firmware,
  since the rear reset button installs a random .ptf from the folder. The README says the set has not been tested on a real
  unit.
brick_risk: true
