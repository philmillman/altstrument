source: https://github.com/semierendonmez-commits/polyend-tracker-lab/tree/main/firmwares/platform
source_status: open
license: Apache-2.0
license_notes: >-
  The folder's LICENSE is the Apache-2.0 text. Its THIRD_PARTY.md copies Lua 5.4.7 under MIT with one guarded define changed,
  and the rest follows published algorithms. The seven .papp station apps in release/Apps are separate files built from the
  sibling firmwares' own source under those firmwares' licences, which for BULUT and GRAF is GPL-3.0 as noted on their
  entries, plus TILT's MIT-licensed Plaits code, so the Apache-2.0 of the PLATFORM image does not cover them. OpenTracker had
  no LICENSE file when the work began; upstream added Apache-2.0 on 2026-10-28, which the README's credits do not yet reflect.
distribution: download
requires_stock: Polyend stock firmware or OpenTracker; keep a stock image in /Firmware
install_notes: >-
  Copy PolyendTrackerPLATFM.ptf from firmwares/platform/release/ in the repository into /Firmware on the SD card, keeping its
  24-character name, and install it from Config, Firmware update on stock or OpenTracker. To get the station apps, also copy
  the release/Apps folder to /Firmware/Apps; PLATFORM installs any missing or changed .papp at boot. Every lab firmware can
  list and install other .ptf files from its own Config, Firmware page, and OpenTracker's ot_restore.txt escape hatch works
  too. Keep only one lab image plus stock in /Firmware, since the rear reset button installs a random .ptf from the folder.
  The README says the set has not been tested on a real unit.
brick_risk: true
