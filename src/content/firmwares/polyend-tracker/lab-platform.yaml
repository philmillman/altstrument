device: polyend-tracker
name: PLATFORM
summary: >-
  Runs Lua scripts and native C++ apps from the SD card, in the manner of monome norns, with a launcher, a norns-style API, a
  16-voice sound engine and a crash-safe runner; seven apps host the other lab firmwares.
description: >-
  PLATFORM is not an instrument. Its launcher lists the scripts and apps on the card with icons, descriptions and a source
  preview, reopens the last one at power-on, and offers a safe boot; holding Shift and F8 returns to it from anywhere. Lua
  5.4 scripts use a norns-like API (init, redraw, key, enc, pad, screen drawing, clocks, MIDI, metros and params). The
  parameters a script adds get the shared LABKIT navigation of the lab: parameter pads, a map, macros, modulation routes
  and MIDI learn, all saved per script. Scripts play a built-in voice engine of 16 voices (anti-aliased waves, noise, FM,
  samples, grains, clicks) with filter, envelopes, delay and reverb, and notes from Lua clocks land on exact samples. The
  runner logs a failing callback and stops a script after repeated errors, endless loops or running out of memory, and a
  LOG view with a small REPL typed on the pads is available. Native apps (.papp) are C or C++ built against an SDK and
  loaded from the card. Eight example scripts are written to a fresh card, among them a pinball Markov walker, an Ikeda-style
  bit register and a makam scale player. Seven station apps in release/Apps run BULUT, DATAMATICS, FLIPPER, GRAF, KONSOL,
  MAKAM and TILT inside PLATFORM, and PLATFORM installs them at boot from /Firmware/Apps. The repository README calls the
  whole set v0.1: every image passed the author's simulator and QEMU checks, and none has been tested on a real Tracker.
status: active
authors:
