device: polyend-tracker
name: MAKAM
summary: >-
  Turkish makam at jungle tempo: a break, built in or from the card, is cut on the strokes of an usul rhythm cycle, with
  bass and lead voices tuned to 24-tone or 53-TET makam scales and a seyir melody generator.
description: >-
  The screen draws the usul as a clock dial and the makam as a ring of pitches on the 53-comma circle. The firmware has 25
  makams and 13 usuls; dum strokes cut kick slices, tek strokes cut snare slices and ke strokes cut ghost notes. Breaks are
  one of three synthesised built-in ones or a card WAV of up to 12 seconds, which is sliced at its onsets. Each section
  has one of four cut modes (Usul, BBCut, Warp, DNA), and phrase-end fills run at 4, 8 and 16 cycles. The bass voices are
  Reese, Sub, Growl, Talk, FM and Hoover over a clean sine sub, and the leads are Ney, Kanun, Saz and Zurna at microtonal
  pitch, in the Arel-Ezgi-Uzdilek 24-tone tuning by default or 53-TET, with an optional practice intonation. The seyir
  generator writes phrases that start where the makam starts, rest on the dominant and cadence to the tonic, live or into an
  editable phrase, and has a call and response form. Sends are a delay (Clean, Tape, Lo-fi, Ping-pong) and a reverb (Plate,
  Hall, Gated), eight scenes morph over a set time, and MIDI out carries pitch bend. The firmware uses the shared LABKIT
  navigation of the lab: parameter pads, a map of every page, macros, modulation routes and MIDI learn, with four macros
  ready on first boot. The repository README calls the whole set v0.1: every image passed the author's simulator and QEMU
  checks, and none has been tested on a real Tracker.
status: active
authors:
