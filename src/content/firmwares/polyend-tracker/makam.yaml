source: https://github.com/semierendonmez-commits/polyend-tracker-lab/tree/main/firmwares/makam
source_status: open
license: Apache-2.0
license_notes: >-
  The folder's LICENSE is the Apache-2.0 text. Its THIRD_PARTY.md says the break cutting, fills and bass models were
  rewritten from the author's own plug-ins and OpenTracker semi fork (called "GPL-3.0 approved") with no code copied
  verbatim, that the BBCut procedures follow Nick Collins' GPL SuperCollider library via the bencodec/BBenCut port, and
  that the AGPL and commercial JUCE parts of the plug-ins were not used. That file still says upstream OpenTracker has no
  licence file; upstream added Apache-2.0 on 2026-10-28.
distribution: download
requires_stock: Polyend stock firmware or OpenTracker; keep a stock image in /Firmware
install_notes: >-
  Copy PolyendTrackerMAKAMJ.ptf into /Firmware on the SD card, keeping its 24-character name, and install it from Config,
  Firmware update on stock or OpenTracker. Every lab firmware can list and install other .ptf files from its own Config,
  Firmware page, and OpenTracker's ot_restore.txt escape hatch works too. Keep only one lab image plus stock in /Firmware,
  since the rear reset button installs a random .ptf from the folder. The README says the set has not been tested on a real
  unit.
brick_risk: true
