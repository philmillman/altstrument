device: polyend-tracker
name: OpenTracker semi fork
summary: >-
  Fork of OpenTracker that adds pattern generators (acid, call and response, BBCut, Grids, Marbles), Performance
  scenes and MIDI learn, master dynamics, sidechain and reverb models, extra Sample Editor effects and many display themes.
description: >-
  Follows upstream OpenTracker releases and adds its own on top, with a separate image name so it does not collide
  with upstream's on the SD card. The Pattern screen gains generators that write ordinary steps and step FX, so the
  patterns still play on stock firmware: a TB-3PO-style acid line, call and response, BBCut cuts, turnarounds, Grids
  and Marbles, and Track Link. The Performance screen adds BBCut and TILT-style play modes, generator controls as
  effects, scenes with morphing and MIDI learn with CC out. The master section adds dynamics, two sidechains,
  more reverb and delay models and colour stages. The Sample Editor gains a tuner, Paulstretch, granular and several
  degradation effects and loads Sample Editor plugins (.ptfx) from an Effects folder, with the fork's own effects also offered as a plugin pack, and there are more LFO shapes, two Plaits-style synth models, a theme editor on the device
  and about thirty display themes. Since 2.2.3-semi.6 it also opens projects, themes and Chance conditions written by Polyend's Tracker Community Edition. The full parameter guide is FORK.md. The README reports a
  USB transfer speed measured on a real Tracker, and notes that the 16-track patterns of 2.x projects are read by stock
  firmware only for tracks 1 to 8, not yet confirmed on a stock unit.
status: active
authors:
  - name: semierendonmez-commits
    url: https://github.com/semierendonmez-commits
source: https://github.com/semierendonmez-commits/polyend-tracker-re-semi
source_status: open
license: Apache-2.0
license_notes: >-
  Apache-2.0 (LICENSE), which upstream OpenTracker added on 2026-10-28. The README describes the Grids generator as
  using Mutable Instruments Grids' drum map, which is GPL-3.0, and other ports keep their own terms, so the combined
  image may carry GPL obligations; no per-component notice file was found.
distribution: download
requires_stock: Polyend stock 1.9.2 kept on the card as the way back
install_notes: >-
  Copy PolyendTrackerOTs2232.ptf from the release into /Firmware on the SD card and install it from Config, Firmware
  update, as with upstream. Keep Polyend's stock PolyendTracker_1.9.2.ptf on the card as well, and keep only one other
  image there, because the rear reset button installs a random .ptf from the folder. To go back, install the stock
  file the same way or write its name into /Firmware/ot_restore.txt and power-cycle. Projects saved by 2.x use the
  Mini's 16-track patterns.
  Polyend's Community Edition README says the Tracker's bootloader is separate from the application firmware and that
  the recessed reset button reflashes a .ptf from /Firmware, so a build that will not boot can be recovered.
brick_risk: false
tags: [sequencer, generative, sampler, fx, fork, ui]
