source: https://github.com/syamajala/polyend-tracker-re
source_status: open
license: Apache-2.0
license_notes: >-
  The repository's LICENSE file is Apache-2.0, as in upstream OpenTracker. The DX7
  core is a port of Google's msfa, also Apache-2.0.
homepage: https://syamajala.github.io/polyend-tracker-re/
distribution: source-only
requires_stock: Polyend stock 1.9.2 kept on the card as the way back
install_notes: >-
  Build with make VERSION=<x.y.z> and the Arm GNU toolchain, or use an image from
  the fork's Releases page once one is published (none was listed at the time of
  writing). Copy the .ptf into /Firmware on the SD card and install it from
  Config, Firmware update. Keep Polyend's stock PolyendTracker_1.9.2.ptf on the
  card too, and keep only one other image there, because the rear reset button
  installs a random .ptf from the folder. To go back, install the stock file the
  same way or write its name into /Firmware/ot_restore.txt and power-cycle.
brick_risk: true
tags: [sequencer, sampler, synth-engine, fm, fx, fork]
