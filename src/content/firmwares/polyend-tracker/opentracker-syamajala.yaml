homepage: https://syamajala.github.io/polyend-tracker-re/
distribution: download
requires_stock: Polyend stock 1.9.2 kept on the card as the way back
install_notes: >-
  Download the .ptf from the fork's Releases page, or build with make
  VERSION=<x.y.z> and the Arm GNU toolchain. Image names must be exactly 24
  characters. Copy the .ptf into /Firmware on the SD card and install it from
  Config, Firmware update. Keep Polyend's stock PolyendTracker_1.9.2.ptf on the
  card too, and keep only one other image there, because the rear reset button
  installs a random .ptf from the folder. To go back, install the stock file the
  same way or write its name into /Firmware/ot_restore.txt and power-cycle.
  Polyend's Community Edition README says the Tracker's bootloader is separate from the application firmware and that
  the recessed reset button reflashes a .ptf from /Firmware, so a build that will not boot can be recovered.
brick_risk: false
