device: polyend-tracker
name: OpenTracker syamajala fork
summary: Fork of OpenTracker for the original Polyend Tracker that adds a DX7 FM synth model, Performance scenes with a crossfader and master FX, song repeat counts and scene ramps, a MIDI instrument LFO, chord entry and a piano pad layout.
description: >-
  Follows upstream OpenTracker's 2.x line (2.2.3 for the first release) and keeps
  the extra data in separate files next to project.mt, so stock firmware and
  upstream OpenTracker still open the projects. The DX7 model is a sixth synth
  engine that plays Yamaha DX7 voices from .syx banks, built on Google's msfa
  core, with panel controls for brightness, feedback, envelope rates and
  detune. Performance mode gets a bank of 16 scenes with an A/B crossfader, a
  DJ filter and a tape stop on the master mix, and the columns and scenes can be exported to and imported from text files. The Song list adds a repeat count
  per slot, a scene per slot and ramps between scenes, and song exports can
  render them. Smaller additions are a tempo-locked LFO for MIDI instruments,
  sharps or flats note names, a piano layout for the pads, chord step entry and
  a USB remote-control mode with a desktop simulator for testing. The built-in
  games are off by default to free memory. The README says the synth sound is
  close to the Tracker Mini's but not identical, and that projects saved by 2.x
  read as tracks 1 to 8 only on stock firmware, not yet confirmed on a stock unit.
  The first release also adds multisample instruments from SFZ files, slices to pattern and USB audio on Linux and Windows. Documentation is on a separate site.
