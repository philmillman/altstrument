versions:
  - version: "2.2.5"
    date: 2026-11-04
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.2.5
    notes: Reworks the Performance screen so tracks start with FX off and its filters, panning and sends also act on synth notes, makes synth release tails follow the Track Mixer, and adds note-name display options, Delete to reset Start, End and Zoom in Sample Playback and Master held with the Jog for master volume.
  - version: "2.2.4"
    date: 2026-11-02
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.2.4
    notes: Adds a piano pad layout and chord entry in step entry (both contributed by syamajala), chords on synth pads up to the slot's polyphony, a sharper 44.1 kHz export, and fixes for Sample Loader preview dropouts, accented sample names and busy screens that faulted.
  - version: "2.2.3"
    date: 2026-10-30
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.2.3
    notes: Adds colour theme files read from the card with a theme export, optional streaming of long samples from the SD card, MIDI keyboard pitch bend and a stereo width setting for the synths, and steadies the MIDI clock on the DIN jack.
  - version: "2.2.2"
    date: 2026-10-26
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.2.2
    notes: Opens the instrument under the pattern cursor from the module keys, speeds up Sample Editor effects, exports at 44.1 kHz, and fixes long names in the Sample Loader, the pop at power-on, the power button and a firmware update image that could leave old bytes behind.
  - version: "2.2.1"
    date: 2026-10-24
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.2.1
    notes: Adds the WTFM two-operator FM synth engine with 30 presets, envelope-style sample waveforms with a preview playhead, and a fix for a crack in the headphones at power-on.
  - version: "2.1.2"
    date: 2026-10-23
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.1.2
    notes: Adds live resampling while the pattern plays, Delay Send, Reverb Send and Panning step FX on synth notes, and fixes for silent zero-length notes and sample loading into an existing instrument.
  - version: "2.1.1"
    date: 2026-10-22
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.1.1
    notes: Fixes bit-depth hiss on quiet sounds, Ping-pong delay tails, MIDI keyboard note entry and the Song page track names; holding Instr on a synth page opens the instrument chooser.
  - version: "2.1.0"
    date: 2026-10-21
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.1.0
    notes: Adds a FAT synth engine inspired by the Tracker Mini's, a separate preset pack, and fixes for Instrument Automation, the Pattern column view and the cursor after Stop.
  - version: "2.0.7"
    date: 2026-10-20
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.0.7
    notes: Fixes a screen freeze when a page exceeds the display chip's limit, Track Mixer volume, mute, solo and meters for synth tracks, and Global Mixer meters; Open Project and Import Mod lists grow to 200 entries.
  - version: "2.0.6"
    date: 2026-10-19
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.0.6
    notes: Fixes screen brightness and thin lines, streaming preview of long files in the Sample Loader, and several list and theme issues.
  - version: "2.0.5"
    date: 2026-10-18
    url: https://github.com/sandlbn/polyend-tracker-re/releases/tag/2.0.5
