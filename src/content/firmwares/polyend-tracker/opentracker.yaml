device: polyend-tracker
name: OpenTracker
summary: Clean-room replacement firmware for the original Polyend Tracker; the 2.x line brings Tracker Mini features to it, with 16 tracks, the Mini's five synth models, stereo samples, live resampling and Mini-compatible projects.
description: >-
  Written from the author's own specifications of the stock firmware, without
  Polyend code, and built for the Tracker's MK66 processor. It reads and writes
  Tracker projects and adds changes to the stock behaviour: MOD and IT import
  and export are rewritten and MIDI CC handling and several performance-mode edge
  cases are fixed. From 2.0 it saves projects in the Tracker Mini format with
  16-track patterns, three synth slots and the Mini's .patch files, and 2.1 and
  2.2 complete the Mini's ACD, VAP, PERC, FAT and WTFM synth models and add live
  resampling and stereo samples. 2.2.3 adds user colour themes loaded from the
  card and optional streaming of long samples from the SD card. An NES game player written for the project is
  no longer built in by default. Fonts and icons are open substitutes for
  Polyend's. Every built image is checked for the stock flash-security bytes and
  file name length, and the boot code looks for /Firmware/ot_restore.txt first
  so the stock image can be put back from the SD card. A desktop SDL simulator
  and host tests are included. The README shows screenshots taken on a real unit
  and says some codec and power-saving behaviour is not yet compared with stock.
  The author also uses this code base as the hardware layer of SIDTracker.
status: active
authors:
  - name: Marcin Spoczynski (sandlbn)
    url: https://github.com/sandlbn
source: https://github.com/sandlbn/polyend-tracker-re
source_status: open
license: Apache-2.0
license_notes: >-
  The repository added an Apache-2.0 LICENSE file on 2026-10-28 (commit f977f2f);
  the README earlier described OpenTracker's own code as MIT. Third-party code keeps
  its own licence.
distribution: download
install_notes: >-
  Download Polyend's stock PolyendTracker_1.9.2.ptf yourself and keep it on the
  card as the way back. Copy the OpenTracker .ptf from the release into
  /Firmware on the SD card and install it from Config, Firmware update, or write
  its name into /Firmware/ot_restore.txt and power-cycle. To return to stock, do
  the same with the stock file. Image names must be exactly 24 characters. The
  project can also be built with arm-none-eabi-gcc and make.
brick_risk: true
tags: [sampler, sequencer, emulator, research]
