source: https://github.com/AndrisK-hub/Polyend-tracker-firmware-project
based_on: polyend-tracker/tracker-ce
source_status: open
license: MIT
license_notes: >-
  The LICENSE file is Polyend's Community Edition licence, titled MIT License with Wholesale Commercial Clone Restriction.
  It puts the source and SDKs under MIT, bars selling .ptf builds, commercial clone hardware and a port or substantially
  unmodified derivative of the whole application, and allows commercial music and reuse of single components. The
  precompiled libPolySynth.a and libPolyDSP.a under synth/lib stay Polyend's proprietary code, licensed for free builds for the
  Tracker+ and Tracker Mini and for non-commercial DIY use. The README is Polyend's own, unchanged.
distribution: download
install_notes: >-
  Download the Tracker Mini .ptf from the firmware-builds branch, copy it to /Firmware/ on the microSD card and choose
  Config, Firmware, Firmware update. Other models need a build from source. Back up the Projects folder first, since saving
  a project in 512-step mode writes pattern files older firmware cannot open. Polyend's README for the upstream project
  describes an isolated bootloader and a recessed reset button that reflashes a known-good .ptf from the card.
brick_risk: false
tags: [fork, sequencer, tracker, midi, fx]
