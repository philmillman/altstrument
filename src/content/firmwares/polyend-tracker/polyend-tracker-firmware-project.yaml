device: polyend-tracker
also_devices: [polyend-tracker-plus, polyend-tracker-mini]
name: Polyend Tracker firmware project
summary: Fork of Polyend's Tracker Community Edition source that adds 512-step patterns on the Tracker Mini, note-length recording and pass-based Chance conditions such as pass A of B, first pass and not first pass, with a prebuilt Tracker Mini image on a branch.
description: >-
  The repository starts from an unmodified import of polyend/tracker-ce and
  adds changes on top. The Tracker Mini can hold patterns of up to 512 steps
  instead of 128, which moves the pattern files to a new format version that
  stock and Community Edition firmware cannot read once a project is saved,
  and takes about 2 MB of the sample pool. A Config option makes live
  recording and note entry in edit mode store how long each note was held,
  using a Gate length effect or an OFF step with Micro-move. The Chance effect
  gains pass A of B, first pass and not first pass values. The other two models
  keep 128 steps and share the other changes. The changelog lists these under
  Unreleased and the commit history shows the work was done with Claude, an AI
  assistant. A workflow copies each built Tracker Mini .ptf to a firmware-builds
  branch; no builds for the other two models are published and there is no README
  of its own.
status: active
authors:
