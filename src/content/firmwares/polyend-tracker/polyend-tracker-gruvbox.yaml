    url: https://github.com/brachkow
source: https://github.com/brachkow/polyend-tracker-gruvbox
source_status: open
license: unspecified
license_notes: No license file in the repository; the README states no terms.
distribution: download
requires_stock: Polyend Tracker Community Edition
install_notes: >-
  Copy the Themes folder to the root of the SD card, or the .json files into an existing Themes folder, then choose one under
  Display theme in Config. Themes need the Community Edition firmware.
brick_risk: false
