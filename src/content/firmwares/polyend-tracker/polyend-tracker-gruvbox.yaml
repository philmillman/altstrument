device: polyend-tracker
also_devices: [polyend-tracker-plus, polyend-tracker-mini]
kind: tool
name: Gruvbox for Polyend Tracker
summary: Six Gruvbox colour themes for Tracker Community Edition firmware, dark and light in hard, medium and soft contrast, as .json files for the SD card, with the Node script that generates them from the Gruvbox palette.
description: >-
  Each theme is a JSON file in the format the Community Edition firmware reads from a Themes folder on the SD card, and the six
  appear in the Display theme setting of the Config screen. Dark themes use the bright Gruvbox accents and light themes the
  faded ones. The README says the firmware indexes up to 29 custom themes and that any file can be previewed in Polyend's
  browser theme editor. The files are generated by build.mjs, which maps the palette to the Tracker's theme keys.
status: active
authors:
