license: CC-BY-NC-4.0
license_notes: >-
  The LICENSE file is the Creative Commons Attribution-NonCommercial 4.0 text and
  names no licensor; the README states CC BY-NC 4.0 for the project and MIT for
  tracker-lib. It is a fork of tracker-pti-editor, which carries the same licence.
homepage: https://simoianni.github.io/polyend-tracker-studio/
distribution: browser-installer
install_notes: >-
  Open the hosted editor in a browser, then unzip an exported project into the
  /Projects folder of the SD card. Back up the card first; the README asks for
  an issue if pattern names do not show on the device. To run it locally, use
  npm install and npm run dev.
brick_risk: false
