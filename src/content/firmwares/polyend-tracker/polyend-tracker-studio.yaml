device: polyend-tracker
also_devices: [polyend-tracker-plus, polyend-tracker-mini]
name: Polyend Tracker Studio
kind: tool
summary: Browser editor for Tracker patterns and instruments that imports and exports whole SD-card projects as zip files, plays patterns in the browser and exports MIDI and Ableton Live projects. A fork of Sandroid's instrument editor.
description: >-
  Combines a step-sequencer pattern editor with an instrument editor that has a
  waveform view, sample editing, a recorder and the Tracker's play modes. It
  imports .pti instruments, .mtp patterns and project folders, and exports a
  zip laid out like a project folder for /Projects on the card, as well as .pti,
  .mtp, .mid, WAV and an Ableton Live 12 project. Re-exporting a project that
  was imported from the device keeps its song structure and track names, and the
  code reads older 8- and 12-track patterns. The README credits Sandro
  Ducceschi's instrument editor as the base and lists the pattern editor, beat
  slice mode, Ableton and MIDI export, project import and export and the tests as the additions. Its
  README warns that the pattern names file is not part of the older public format
  documentation.
status: active
authors:
