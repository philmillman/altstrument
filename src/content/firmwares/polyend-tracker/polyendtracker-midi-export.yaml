device: polyend-tracker
kind: tool
name: Polyend Tracker MIDI Export
summary: Python command line tool and library that converts Tracker project and pattern files to MIDI, with a hosted web service for converting without installing anything.
description: >-
  Point it at a project directory or file to export the project's song or patterns as MIDI. It can also be imported as a
  library in other Python projects. It dates from 2022 and predates the 12-track format of firmware 1.9; a later fork that
  adds that format is catalogued as a separate entry. Not affiliated with Polyend.
status: dormant
authors:
