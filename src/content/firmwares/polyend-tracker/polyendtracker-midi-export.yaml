    url: https://github.com/DataGreed
source: https://github.com/DataGreed/polyendtracker-midi-export
source_status: open
license: MIT
homepage: https://polyend-tracker-midi-export.onrender.com/
install_notes: Install with pip install polyendtracker-midi-export, then run polymidiexport on a project directory or file.
brick_risk: false
