device: polyend-tracker
name: PTSDJ
summary: LSDJ-style Game Boy music tracker firmware for the original Polyend Tracker, with two linked Game Boy sound engines, drum kits, WAV export and export of songs and ROMs for a real Game Boy.
description: >-
  PTSDJ runs two emulated Game Boy sound engines side by side, eight tracks in all, and follows the page structure and
  commands of LSDJ: Song, Chain, Phrase, Instrument, Table, Groove, Synth, Wave and Project pages, with the Tracker's pads
  playing notes. It ships 272 instrument presets and a drum and bass demo pair with two drum kits, and kits can be made from
  WAV files or recordings. Master volume and a limiter page shape the output. Songs and a ROM with the drum kits inside can
  be exported for a real Game Boy, a flash cartridge or an emulator, and audio exports as WAV. The author states that it
  contains no LSDJ code, no Polyend firmware code and none of the proprietary Polyend libraries. Drum kits, the Synth page
  and ROM export need the user's own LSDJ ROM saved as GB/LSDJ.GB, which is not included. It is built on the MIT-licensed
  OpenTracker hardware layer and SIDTracker code. The README calls it experimental and says it was tested on one Tracker
  of hardware version 2.
status: active
authors:
