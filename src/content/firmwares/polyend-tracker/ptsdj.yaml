  repository license as undetermined because of these several files.
distribution: download
install_notes: >-
  Format the SD card as FAT32, put your own LSDJ ROM at GB/LSDJ.GB, and copy the release .ptf and ot_restore.txt into the
  Firmware folder, then power the Tracker off and on. The image name must be exactly 24 characters, start with PolyendTrac
  and end in .ptf. To return to stock, put Polyend's stock .ptf in the Firmware folder and name it in ot_restore.txt. Back up
  the card first; the README says the ways back are not guaranteed in every situation.
brick_risk: false
