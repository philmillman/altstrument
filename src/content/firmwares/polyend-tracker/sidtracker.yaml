    url: https://github.com/sandlbn
source: https://github.com/sandlbn/SidTracker
source_status: open
license: MIT
license_notes: >-
  Third-party code keeps its own licence, recorded in src/platform/PROVENANCE.md.
distribution: download
requires_stock: "1.9.2"
install_notes: >-
  Back up the SD card, unzip the release onto its root and leave Polyend's stock
  PolyendTracker_1.9.2.ptf (which you download from Polyend) in /Firmware. On the
  stock firmware choose Config, Firmware update and the SIDTracker .ptf. To go
  back, choose the stock file from SIDTracker's Config, F7 FIRMWARE page, or put
  /Firmware/ot_restore.txt containing the stock file's name on the card and
  power on. Image names must be exactly 24 characters and start with PolyendTrac.
  The README disclaims responsibility for damage to the unit.
  Polyend's Community Edition README says the Tracker's bootloader is separate from the application firmware and that
  the recessed reset button reflashes a .ptf from /Firmware, so a build that will not boot can be recovered.
brick_risk: false
tags: [chiptune, synth-engine, sequencer, drums, fx, emulator, sid]
