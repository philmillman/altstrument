device: polyend-tracker
name: SIDTracker
summary: Replacement firmware that turns the original Polyend Tracker into a two-chip Commodore 64 SID tracker with six voices, GoatTracker import and export, .sid file export, a drum column and effects.
description: >-
  Emulates two MOS 6581 or 8580 sound chips in software, three voices each, and
  drives them from a pattern editor with an order list, sixteen commands and
  GoatTracker-style wave, pulse and filter tables. Instruments can be edited as
  tables, shaped on a designer page or loaded from a library of 49 presets.
  Songs are stored on the SD card and can be exported to GoatTracker files or to
  .sid files with the project's own player routine for two chips. An extended
  engine outside those exports adds a PCM drum kit, delay, chorus, reverb, LFOs
  and voice panning. Release 0.2 adds a player for C64 .sid files, MIDI
  keyboard input and clock, ASID output to drive real SID chips, undo and redo,
  and a track mixer. The hardware layer is taken from OpenTracker, the same
  author's clean-room Tracker firmware (see the polyend-tracker-re repository).
  The README says boot, SD card, playback, effects, themes and firmware update
  are confirmed on a unit and points to a hardware test plan for the rest. It
  contains no Polyend code, and the release zip holds the firmware and example
  songs, not the stock image.
status: active
authors:
