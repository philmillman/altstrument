license_notes: >-
  The LICENSE file is byte for byte the Polyend Tracker Community Edition License: PolyForm Noncommercial 1.0.0 with
  Polyend's additional permissions. Commercial music production is allowed, selling the firmware or derivatives is not,
  and the precompiled libPolySynth and libPolyDSP libraries stay Polyend's proprietary code. The README says the project is
  not affiliated with or endorsed by Polyend.
distribution: download
requires_stock: Polyend Tracker Community Edition 1.0
install_notes: >-
  Back up the Projects folder of the SD card, copy the .ptf for your model (TrackerMini_CE, TrackerPlus_CE or
  PolyendTracker_CE) into /Firmware and run Config > Firmware > Firmware update. Saving a project with any Community
  Edition firmware converts its patterns to a format older firmware cannot read. Recovery uses a known-good .ptf and the
  bootloader route in Polyend's Community Edition documentation.
brick_risk: true
