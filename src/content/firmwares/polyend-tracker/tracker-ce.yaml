homepage: https://polyend.com/
distribution: download
install_notes: >-
  Copy the device's .ptf from the release to /Firmware/ on the microSD card, then choose Config > Firmware > Firmware
  update. Back up first: saving a project on this firmware moves its patterns to a format older firmware cannot read. The
  README calls experimenting safe because the bootloader is isolated. A build that will not boot is recovered with a
  known-good .ptf on the card and the recessed reset button (bottom of the Tracker and Tracker+, next to USB-C on the
  Mini). Polyend's disclaimer still leaves flashing, including the risk of bricking, at your own risk.
brick_risk: true
