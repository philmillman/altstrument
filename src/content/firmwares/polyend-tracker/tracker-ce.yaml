source: https://github.com/polyend/tracker-ce
source_status: open
license: MIT
license_notes: >-
  LICENSE is titled "MIT License with Wholesale Commercial Clone Restriction". Parts 1 and 2 put the source, SDKs and open
  synth engines under MIT, but bar selling .ptf builds, selling commercial clone hardware, and selling a port or substantially
  unmodified derivative of the complete application. Commercial music, paid .ptfx plugins and reuse of individual components
  are expressly allowed. synth/lib/libPolySynth.a and libPolyDSP.a stay proprietary, usable on authentic Polyend hardware and
  in personal or DIY non-commercial projects, with commercial embedding barred. Third-party parts are listed in NOTICE.md.
  The v1.0.0 tag predates this change and carries the PolyForm Noncommercial 1.0.0 terms with Polyend's additional permissions.
homepage: https://polyend.com/
distribution: download
install_notes: >-
  Copy the device's .ptf from the release to /Firmware/ on the microSD card, then choose Config > Firmware > Firmware
  update. Back up first: saving a project on this firmware moves its patterns to a format older firmware cannot read. The
  README calls experimenting safe because the bootloader is isolated. A build that will not boot is recovered with a
  known-good .ptf on the card and the recessed reset button (bottom of the Tracker and Tracker+, next to USB-C on the
  Mini). Polyend's disclaimer still leaves flashing, including the risk of bricking, at your own risk.
brick_risk: true
