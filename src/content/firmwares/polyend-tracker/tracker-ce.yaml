device: polyend-tracker
also_devices: [polyend-tracker-plus, polyend-tracker-mini]
name: Tracker Community Edition
summary: Polyend's official community firmware for the Tracker, Tracker+ and Tracker Mini, built from its own firmware source, adding sample editor plugins, wavetable envelopes and LFOs, custom themes and fonts, per-step micro-move and volume columns, and open synth engines.
description: >-
  Licence note: since 2026-11-03 the repository's main branch uses an MIT-based licence with a clone restriction, so
  the complete firmware or a re-skin of it cannot be sold, on hardware or as paid software, while individual parts can be
  reused commercially. Polyend expressly allows commercial music made with it, and the two precompiled synth libraries stay
  closed.

  One codebase builds all three devices. Sample editor effects and generators load as .ptfx files from the SD card, with
  an MIT-licensed SDK and six reference plugins. The Tracker+ and Tracker Mini gain an Open Synth SDK and the CHIP and DIRT
  engines. Wavetable envelopes and LFOs can modulate seven instrument parameters, themes and fonts load from the card,
  and Performance Mode can page between sample and MIDI or synth tracks. Samples of 256 KB and larger
  stream from the SD card after their attack, Slice and Beat Slice instruments gain a Play Thru
  option, the Chance FX gains conditions such as group with last and play N skip M, and a granular length FX
  and automation target are added. Polyend offers the code as is and says it has no
  obligation to support it; community help is on its Backstage forum. Custom firmware is not covered by the standard
  warranty, though Polyend offers paid repairs.
status: active
authors:
