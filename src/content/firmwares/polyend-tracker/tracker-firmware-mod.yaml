distribution: patch-your-own
requires_stock: "1.9.2"
install_notes: >-
  Bring your own PolyendTracker_1.9.2.ptf from Polyend, build the patched .ptf with
  the repository's Python tools (clang with the ARM target is needed to rebuild the
  patch; prebuilt patch binaries are included), and copy it to the Firmware folder
  of the SD card. Keep the patched file name under 32 characters. For recovery,
  Polyend's emergency flash picks a random .ptf from that folder, so leave only the
  stock file there when recovering. Do not share built files; they contain Polyend's
  firmware.
  The README says Polyend's emergency updater runs on a separate chip that firmware updates do not overwrite.
brick_risk: false
