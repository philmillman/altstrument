device: polyend-tracker
name: Tracker Firmware Mod
summary: Patches for Tracker firmware 1.9.2 built on your own .ptf file, adding a software master EQ, a DJ filter on Shift + Master + jog, Braids synth instruments, and experimental plate reverb, tape delay and conditional trigs, plus an emulator and notes on the audio engine.
description: >-
  Three parts share the repository. Reverse-engineering notes and a Unicorn-based
  emulator run only the 1.9.2 audio engine on a computer, so patches can be tested
  before they reach hardware. A patch adds a five-band master EQ and a DJ low-pass
  and high-pass filter, with the filter driven by holding Shift and Master and
  turning the jog wheel. A second patch compiles Mutable Instruments Braids for the
  Tracker's processor and plays it from instruments named BR-, up to four tracks at
  once, with 48 template instruments provided as a project. The builder rewrites
  six places in the stock image and appends the patch code; it will not build
  unless re-encoding the unmodified file reproduces it byte for byte. The README
  reports hardware tests of the filter, EQ and Braids builds on one unit on
  2026-10-13, and lists WAV export, CPU stress and the percussion models at 96 kHz
  as untested on hardware. Earlier builds with a gap in the file hung at boot.
  Two further patches are marked experimental in the README: a swappable master
  reverb and delay that offers a plate reverb and a tape delay, selected with
  Shift + Master and another button, and conditional trigs on the Chance effect
  (ratios 1:2 to 4:4 past 100 percent).
