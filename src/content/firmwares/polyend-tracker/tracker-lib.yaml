device: polyend-tracker
also_devices: [polyend-tracker-plus, polyend-tracker-mini]
name: tracker-lib
kind: tool
summary: Polyend's TypeScript library for reading, writing and creating Tracker instrument (.pti), pattern (.mtp) and project (.mt) files in Node.js or the browser.
description: >-
  Covers instrument data including sample audio, slice markers, playback modes,
  filters, LFOs, envelopes and granular or wavetable settings, plus pattern
  tracks, steps and step effects, and project and song headers. It works with
  Node file paths or browser File and Blob objects and ships type definitions
  and generated API docs. The README names the Tracker, Tracker Mini and Tracker+
  as supported and links third-party browser editors for instruments and
  patterns built on it.
