device: polyend-tracker
name: Tracker Instrument Editor (tracker-pti-editor)
kind: tool
summary: Vue web app for creating, editing and auditioning Tracker instrument (.pti) files, with a sampler, sample editing, slicing helpers and a Web Audio playback engine, built on Polyend's tracker-lib.
description: >-
  Records or loads audio, edits it with cut, fades, normalise, compress and
  equaliser functions and exposes instrument parameters such as filter, tuning,
  envelopes, LFOs, volume, panning, overdrive and bit-depth reduction. It
  supports the one-shot, loop, wavetable and granular playback modes and plays
  instruments from a MIDI or computer keyboard. The README says the granular
  engine, reverb and delay are approximations of the hardware and that some
  auto-sampling work was never finished. The author wrote it as an example of what
  tracker-lib allows and does not expect to continue it.
status: active
