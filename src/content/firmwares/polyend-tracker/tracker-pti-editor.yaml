homepage: https://polyend.sandroid.xyz/instrumented/
distribution: browser-installer
install_notes: >-
  Open the hosted editor in a browser, build or edit an instrument and save the
  .pti file, then copy it to the Tracker's SD card. To run it locally, use npm
  install and npm run dev.
