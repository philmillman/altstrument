name: Tracker Theme and Font Editor
summary: Polyend's official browser editor for Tracker Community Edition, which designs .json colour themes and converts TrueType and OpenType fonts into .ptfont packages, with a live 800 by 480 simulation of the device's screens.
description: >-
  Previews the Pattern, Song, Sample Loader, Sample Editor, Notes Grid and Config screens, along with overlays such as
  Record Mode. The output loads from the SD card on Community Edition firmware. Polyend provides it as is, with no
  obligation to support it.
