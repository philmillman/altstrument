device: portmaster-compatible-handhelds
name: ChooChooTracker
summary: >-
  Eight-track tracker forked from ChipNomad that adds Braids, Plaits, sample, wavetable and drum engines, reverb and
  delay sends and insert effects, packaged for PortMaster handhelds. Alpha.
description: >-
  ChooChooTracker keeps ChipNomad's LSDj-style tracker workflow and AY chip instruments and adds a wide set of other
  engines: Braids and Plaits ports from Mutable Instruments, additional Plaits engines, PCM sample and wavetable
  playback with a sample editor and slicing, an acid engine, drum synths, and native chip and FM instruments. It has
  three effect columns per row, tracker tables, per-track filters, modulation sources, a Clouds-style reverb send, a
  ping-pong delay, insert effects, MIDI in and out and import of LSDj and M8 files. The README calls it an alpha
  and says the main target is the Anbernic RG353V through PortMaster, tested so far on ArkOS and on a TrimUI. The
  same release also carries Android, Windows, Linux, Raspberry Pi and web builds, which are not covered here. The
  repository includes an AGENTS.md file with notes for AI coding agents.
status: active
authors:
  - name: Pierre-Emmanuel Surga (paiheulevrai)
    url: https://github.com/paiheulevrai
source: https://github.com/paiheulevrai/Choochootracker
source_status: open
license: MIT
license_notes: >-
  The LICENSE file names ChipNomad and paiheulevrai as copyright holders. Mutable Instruments, Airwindows, Signalsmith
  Stretch and other components keep their own licenses, listed in the repository's license folders. The README says
  official releases may include Ableton Link under a separate authorization from Ableton that does not extend to
  forks or other distributors, and the PortMaster build lists Link as supported.
homepage: https://choochootracker.pages.dev/
based_on: portmaster-compatible-handhelds/chipnomad
distribution: download
install_notes: >-
  Download the PortMaster zip from the latest GitHub release and install it through PortMaster, or extract it into the
  console's ports folder. The package targets ARM64 devices and was developed mainly on ArkOS on an RG353V. The
  README warns to save often and not to get attached to projects.
brick_risk: false
tags: [tracker, synth-engine, sampler, sequencer, wavetable, fx, midi, open-source]
