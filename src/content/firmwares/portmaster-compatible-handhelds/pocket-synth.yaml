device: portmaster-compatible-handhelds
name: Pocket Synth
summary: Gamepad instrument for PortMaster handhelds such as the R36S, with guitar, flute and violin, piano and electric piano and drum modes plus a four-track loop recorder; also builds for macOS.
description: >-
  Pocket Synth turns the sticks and buttons of a handheld or a game controller into an instrument. The Guitar mode picks
  chords with the left stick and strums with the right stick, and a second layout picks the six strings one by one.
  Expressive plays synthesized flute and violin with a scale wheel or continuous pitch, Keys plays piano and electric
  piano on eight scale buttons with pitch bend and vibrato, and the Drum Machine has eight pads. A loop recorder with
  four synchronized tracks supports a count-in, overdubbing, undo, quantization and one or two bars, and settings and
  recordings are saved when the app exits. The R36S is the only tested handheld; the app runs as a PortMaster package
  on ARM64 Linux with SDL2 and two analog sticks, and a macOS app for Apple Silicon lets a controller connected to a
  Mac use the same controls. The sounds are generated in code with DaisySP. The README documents building on macOS and
  cross-compiling for the handheld with Zig.
status: active
authors:
