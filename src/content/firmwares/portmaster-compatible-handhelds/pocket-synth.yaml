    url: https://github.com/FrostMiKu
source: https://github.com/FrostMiKu/pocket-synth
source_status: open
license: MIT
license_notes: >-
  Read from the LICENSE file, which names "Pocket Instrument contributors" as the holder. The README says bundled
  third-party components, including DaisySP and SDL, keep their own licenses in the vendor folder.
homepage: https://github.com/FrostMiKu/pocket-synth
distribution: download
requires_stock: A Linux handheld with PortMaster support, 64-bit ARM, SDL2 and two analog sticks (tested on the R36S)
install_notes: >-
  Extract the PortMaster zip from the release into the ports folder and launch Pocket Synth from the Ports menu. The app
  and its generated sounds live in their own folder, and nothing is flashed to the device. On macOS, unzip the Apple
  Silicon build; it is signed locally and not notarized by Apple.
brick_risk: false
