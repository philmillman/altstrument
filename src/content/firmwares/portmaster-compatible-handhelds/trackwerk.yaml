    url: https://github.com/kidbee85-beep/TrackWerk/releases/tag/v0.9.0-beta
    notes: Pre-release. Renames the project to TrackWerk and adds an independent look, a Studio and Archive workflow, and a Miyoo Mini Plus HTTPS fix.
