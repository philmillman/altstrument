device: portmaster-compatible-handhelds
also_devices: [miyoo-miyoo-mini]
name: TrackWerk (Pocket Tracker Extreme)
summary: Independent fork of PocketTracker that adds synthesis engines, 64 punch-in effects, a drum generator, Internet Archive sampling and a new look, with builds for the TrimUI Brick on KNULLI, Miyoo Mini and Android.
description: >-
  TrackWerk, published until 0.9 as Pocket Tracker Extreme, is a fork of conanizer's PocketTracker that the author
  develops separately. It keeps the eight-track tracker, sampler and editor and adds synthesis engines with live
  editing and 2,048 instrument presets, 64 momentary punch effects in eight banks, resampling of the post-effects
  signal, a drum generator built from the user's own sounds, search and import of Internet Archive audio, an import
  subset for Dirtywave M8 files, reverb, delay and mastering presets, and new themes and typefaces. Selected
  Mutable Instruments DSP is included. Packages cover Android 8 and later, the TrimUI Brick on KNULLI, and the Miyoo
  Mini and Mini Plus on Onion. The releases are marked as betas and the author says device testing is still going
  on; an earlier note on a news site said the download had been pulled, but the releases are listed in the
  repository.
