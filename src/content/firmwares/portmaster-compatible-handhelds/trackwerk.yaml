  third-party components keep their own licenses, listed in the credits.
homepage: https://kidbee85-beep.github.io/TrackWerk/
based_on: https://github.com/conanizer/pockettracker
distribution: download
requires_stock: KNULLI on the TrimUI Brick, or Onion on the Miyoo Mini; Android 8 or later
install_notes: >-
  Brick: extract the KNULLI first-install zip onto a working KNULLI card, or apply the program update zip to an existing install.
  Miyoo Mini and Mini Plus: extract the matching Onion zip at the top of the SD card. RGB20S: the AmberELEC zip carries its own update instructions. Android: install the APK,
  which has its own app identity and sits beside earlier Pocket Tracker Extreme installs, so export app-private
  work to a shared folder first. Updates on Linux keep samples, projects and presets. Nothing is flashed to the
  device.
brick_risk: false
