name: TrackWerk (Pocket Tracker Extreme)
summary: Independent fork of PocketTracker that adds synthesis engines, 64 punch-in effects, a drum generator, Internet Archive sampling and a new look, with builds for the TrimUI Brick on KNULLI, Miyoo Mini, Powkiddy RGB20S and Android.
description: >-
  TrackWerk, published until 0.9 as Pocket Tracker Extreme, is a fork of conanizer's PocketTracker that the author
  develops separately; the GitHub repository was renamed to match. It keeps the eight-track tracker, sampler and editor and adds synthesis engines with live
  editing and 2,048 instrument presets, 64 momentary punch effects in eight banks, resampling of the post-effects
  signal, a drum generator built from the user's own sounds, search and import of Internet Archive audio, an import
  subset for Dirtywave M8 files, reverb, delay and mastering presets, and new themes and typefaces. Selected
  Mutable Instruments DSP is included. Packages cover Android 8 and later, the TrimUI Brick on KNULLI, the Miyoo
  Mini and Mini Plus on Onion, and, from 1.0, the Powkiddy RGB20S on AmberELEC. Version 1.0 is the first release not
  marked as a beta, and the README says audio input, display and controller behaviour depend on the device and points
  to the release notes for tested hardware.
