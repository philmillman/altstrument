versions:
  - version: v1.2.0
    date: 2026-11-16
    url: https://github.com/kidbee85-beep/TrackWerk/releases/tag/v1.2.0
    notes: Adds a sound browser with 2,048 instrument presets in twelve tabs, an interactive First Beat tutorial, clearer source selection with progressive preview for supported MP3 downloads, MIDI Panic and USB output fixes, and native Linux desktop packages for ARM64 and x86-64. The notes say the checks ran on host and emulated guests and on the author's four cards, and that final desktop UI checks and physical USB recording remain open.
  - version: v1.1.0
    date: 2026-11-15
    url: https://github.com/kidbee85-beep/TrackWerk/releases/tag/v1.1.0
    notes: Adds 40 complete scenes with 54 palettes and optional motion, 123 synth models including SID Chip, DCO Poly and FM SysEx voices, sampling and resampling tools, a drum generator and harmony templates, track mute and solo, and an English handbook. Builds for Android, the Brick on KNULLI, the Miyoo Mini and Mini Plus on Onion, and the RGB20S on AmberELEC; the notes say no physical device was modified while preparing the release, and the host checks and emulated guests are what was run.
  - version: v1.0.0
    date: 2026-11-11
    url: https://github.com/kidbee85-beep/TrackWerk/releases/tag/v1.0.0
    notes: First release not marked as a beta. Adds a Powkiddy RGB20S build for AmberELEC.
  - version: v0.9.0-beta
