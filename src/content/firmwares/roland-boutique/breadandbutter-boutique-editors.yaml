device: roland-boutique
kind: tool
name: Bread and Butter Boutique editors
summary: Free closed-source browser editors for the JP-08, JU-06 and JU-06A, and JX-03 modules, with every panel parameter, an arpeggiator and a shared patch library. They talk to the module over Web MIDI SysEx. Hosted on data.dynareg.se.
description: >-
  Each page mirrors the module's panel (oscillators, filter, envelopes, LFO, chorus, delay, portamento and assign mode),
  sends edits to the unit by SysEx, and can resend the current patch. The JP-08 page adds the hidden chorus settings the site's news mentions, and
  the JU-06 page has a switch between the JU-06 and JU-06A. A browser-side arpeggiator sends MIDI out to the module. Patches
  can be kept in a My patches list with a name, description, credits and category, and shared to a public library; the page
  loads Google's sign-in script for that. Page footers show copyright 2016 (JP-08, JX-03) and 2016 to 2020 (JU-06) Breadandbuttersounds.com,
  and the site's news says it moved to a new server in June 2024. The same site also lists a D-05 editor and a Behringer Model-D editor.
  Nothing is flashed.
status: dormant
authors:
  - name: Bread and Butter Sounds
    url: https://breadandbuttersounds.com/
source_status: closed
license: proprietary
license_notes: The pages carry only a copyright notice for Breadandbuttersounds.com; no licence text is published.
homepage: https://breadandbuttersounds.com/
distribution: browser-installer
requires_stock: JP-08, JU-06 or JU-06A, JX-03
install_notes: >-
  Open https://data.dynareg.se/breadandbutter/JP08.html, JU06.html or JX03.html in Chrome or Edge, connect the module
  by USB, allow MIDI with SysEx access and press Update Connections. The site's news says the JP-08 chorus settings
  need a recent firmware from Roland. Saving and sharing patches uses a sign-in.
brick_risk: false
tags: [editor, librarian, arpeggiator, web-midi, sysex, usb-midi, presets, web]
