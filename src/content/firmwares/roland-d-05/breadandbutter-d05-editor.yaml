device: roland-d-05
also_devices: [roland-d-50]
kind: tool
name: Bread and Butter D-05 editor
summary: Free closed-source browser editor for the D-05, labelled D-05/D-50 patch editor, with every tone and patch parameter, a patch library and an arpeggiator, sent to the unit over Web MIDI SysEx. Hosted on data.dynareg.se by Bread and Butter Sounds.
description: >-
  The page mirrors the unit's parameters across patch, upper and lower tone, partial, LFO, envelope, equaliser, chorus and reverb
  sections, requests the current patch from the unit and sends edits as SysEx. It can transmit a patch on a chosen MIDI channel,
  has key mode, split point and tone balance settings, and keeps a My patches list with names, categories and credits that can
  be shared to a public library, for which the page loads Google's sign-in script. The footer reads copyright 2017
  breadandbuttersounds.com, and the site's news announced it on 31 December 2017 as an editor, librarian and sharing tool for
  the D-05 and the D-50. It sits beside the same author's JP-08, JU-06 and JX-03 editors. Nothing is flashed.
status: dormant
authors:
  - name: Bread and Butter Sounds
    url: https://breadandbuttersounds.com/
source_status: closed
license: proprietary
license_notes: The page carries only a copyright notice for breadandbuttersounds.com; no licence text is published.
homepage: https://data.dynareg.se/breadandbutter/D05.html
distribution: browser-installer
install_notes: >-
  Open https://data.dynareg.se/breadandbutter/D05.html in Chrome or Edge, connect the unit by USB, allow MIDI with SysEx
  access and select the unit's MIDI ports and channel. Saving and sharing patches uses a sign-in. The page shows advertising.
brick_risk: false
tags: [editor, librarian, arpeggiator, web-midi, sysex, usb-midi, presets, web]
