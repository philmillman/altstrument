    url: https://github.com/yuyoi
source: https://github.com/yuyoi/D110-rosetta-OS-v11
source_status: open
license: MIT
license_notes: Covers the repository only. The README says no Roland code or ROM data is included and asks that patched or baked files are not shared.
distribution: patch-your-own
requires_stock: "1.10"
install_notes: >-
  Read IC19 (a 27C256-type EPROM) and IC15 (an LH5310 mask ROM) from your own
  unit and keep them. Run the baking script, burn IC19 to a 27C256 or 27C512 and
  IC15 to an SST39SF040 on an adapter, compare the MD5 sums and fit the chips.
  With a stock IC15 only the Quick-screen changes apply. Putting the original
  chips back returns the unit to stock.
tags: [eprom, arpeggiator, sequencer, midi, synth-engine, ui, research]
