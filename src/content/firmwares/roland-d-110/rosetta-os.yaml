device: roland-d-110
name: D-110 Rosetta OS
summary: Patch kit for the D-110's OS v1.10 that adds an arpeggiator, step sequencer, MIDI out of arp notes, chords, unison, a mod matrix and wave sequencing, built from dumps of your own ROM chips.
description: >-
  A baking script takes your dumps of the OS EPROM (IC19) and the control ROM
  (IC15), runs simulator tests and writes burn files. A menu on the front panel
  holds the settings, which are kept in battery RAM. The arpeggiator has several
  directions, ratchets, accents and Euclidean patterns and can follow MIDI clock;
  the step sequencer holds up to 32 steps. Other additions are chord and scale
  playing, unison with detune, mono and glide, a four-slot modulation matrix,
  wave sequencing that steps each note through PCM waves, slow pitch and cutoff
  drift, and a Lab page that pushes the sound chip beyond the stock limits. A
  smaller IC19-only build adds a Quick screen with MIDI CC knobs, plain parameter
  names and a boot banner. The author credits Claude, an AI assistant, with the
  code and reverse engineering, including an assembler, disassembler and
  simulator for the CPU. A companion project replaces the wave ROMs with flash.
status: active
authors:
