kind: tool
name: Synthworks editors
summary: Free closed-source browser editors and librarians by Ian Dixon for the Roland D-50 and D-110, Korg DW-8000, DW-6000, MS2000 and KARMA, and the Kawai K1 family. Each is a single page that reads and sends SysEx over Web MIDI and saves libraries locally. Several are marked beta.
description: >-
  Every editor is its own page on thedigitallifestyle.com, listed on one index, and all share the same approach. You drop .syx
  files into a library or read the patches from the hardware, edit them on screen, send them back, and save the whole library as a
  .tdllib file. The author says SysEx files are processed in the browser and not uploaded. The D-50 page is Beta 2 and edits
  upper and lower tones and their partials. The D-110 page, marked beta, covers patches, tones, rhythm setup and system settings.
  The DW-8000 and DW-6000 pages are version 1.5 with real-time parameter edits and 64-program reads. The MS2000 page reads all
  128 programs and edits both timbres, and the K1 page edits four-source patches and reads the 64 internal patches. The KARMA
  page is marked beta and handles programs, PCM editing and the EXB-MOSS buffer. The index also lists NX5R, DX100 and TX7 pages,
  and further tools that were not live when checked. The pages were last modified at the end of October 2026. Nothing is flashed.
status: active
authors:
  - name: Ian Dixon
    url: https://thedigitallifestyle.com/w/
source_status: closed
license: proprietary
license_notes: >-
  The pages carry a copyright line for Ian Dixon and Synthworks; no licence text is published.
homepage: https://thedigitallifestyle.com/w/TDL-editors.html
distribution: browser-installer
install_notes: >-
  Open the page for your model from the index, in Chrome or Edge over HTTPS, connect the instrument by MIDI in both directions
  and allow MIDI with SysEx access. Page addresses are TDL-D50.html, TDL-D110.html, TDL-DW8000.html, TDL-DW6000.html,
  TDL-MS2000.html, TDL-KARMA.html and TDL-K1.html under /w/. Each instrument needs SysEx reception enabled, and the DW-8000
  and DW-6000 readers step through the unit's programs, which changes the selected program while reading. On the K1, turn
  memory protect off before writing. Keep a backup of the unit first.
brick_risk: false
tags: [editor, librarian, web-midi, sysex, midi, presets, web]
