device: roland-d-70
kind: tool
name: BHD-70
summary: macOS AUv3 plug-in and standalone app that runs the D-70's original firmware in a patched MAME build from dumps of your own unit, with the firmware's own display, panel editing and MIDI learn.
description: >-
  The engine is MAME with a D-70 driver patch and custom-chip emulation from the gearmulator project, so the sound comes from the
  unit's own program rather than a model of it. On first launch the app asks for two firmware EPROM dumps (versions 1.10, 1.12,
  1.14, 1.16 or 1.19), the six PCM wave ROMs and, optionally, a SysEx bulk dump of sounds, recognises each by size and checksum and
  keeps them on the computer. It has 30 voices and six parts, the Tone Palette sliders, a 240 by 64 pixel display drawn by the
  firmware, a SysEx loader, patch memory that persists between sessions and a MIDI learn function that the hardware lacks. Start-up
  takes about 20 seconds, as on the unit, and offline bounce is silent because the engine runs in real time. The repository holds
  the app and plug-in code in Swift, the engine bridge, the MAME patch against a named upstream commit and a build script; the
  README and some docs are partly in Polish. The README says the project contains no Roland code or data. It requires macOS 13 or
  later.
