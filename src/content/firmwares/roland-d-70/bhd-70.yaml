homepage: https://www.bronislawhonca.pl
distribution: download
requires_stock: Dumps from your own D-70 (firmware 1.10, 1.12, 1.14, 1.16 or 1.19, plus the six wave ROMs)
install_notes: >-
  Download BHD-70-0.9.dmg from the v0.9 release (signed and notarised, Apple Silicon and Intel), drag it to Applications and
  launch it once so your DAW sees the Audio Unit. The release also carries a zip of the source. It can be built with Xcode,
  XcodeGen and a MAME build, following build.sh and mame/README.md. Take the EPROM and wave ROM dumps with a programmer and send
  a SysEx bulk dump of your sounds if you want them. The app writes nothing to the D-70. The author calls the release a beta.
brick_risk: false
