device: roland-ef-303
kind: tool
name: EF-303 Editor (stylus)
summary: Browser editor for the Roland EF-303 Groove Effects over Web MIDI. It sets the effect type and parameters, programs the 16-step modulator and assigns the C1 to C8 knobs, sending edits to the temporary patch as Roland SysEx or control changes. Stored patches are never overwritten.
description: >-
  The page is laid out like the front panel. Edits go to the temporary patch as single-parameter SysEx writes, or optionally as
  control changes for the parameters that have a mapping, so they are heard at once. It reads the temporary patch back when an
  input is selected and can push the whole editor state. Saving to a user patch is left to the unit's own STORE button. Outgoing
  messages are queued with a minimum gap and rapid edits to one parameter are merged. The parameter tables were transcribed
  from Roland's MIDI implementation, and the author's note says the owner's manual is not included. It was made as a companion to
  the same author's Lexicon Reflex editor. Nothing is flashed.
status: active
authors:
