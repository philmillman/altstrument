homepage: https://plentyofnam.es/stylus/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, connect the EF-303's MIDI IN, and its MIDI OUT if you want to read patches back, to
  your interface, and allow MIDI with SysEx access. Choose output, input, channel and device ID (default 0x10) to match the unit.
  Control change mode needs the unit's Receive Control Change set to MODE2.
brick_risk: false
