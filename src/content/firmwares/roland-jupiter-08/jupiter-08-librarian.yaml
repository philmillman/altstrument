homepage: https://ryanmgilmore.github.io/jupiter-08-librarian/
distribution: browser-installer
requires_stock: Firmware 1.00 (decoding verified only on that version)
install_notes: >-
  Back up the unit first by holding MENU at power-on and copying BACKUP/JUPITER08Backup.svd off its USB drive, and keep that
  original. Drop it on the hosted page, build a new backup and keep the file name. To restore, hold MENU at power-on, delete
  BACKUP/ on the drive, copy the new file into RESTORE/, eject and press PAGE/TIE. The live MIDI features need Chrome or Edge
  and Roland's USB driver. Files from other firmware versions are likely to be refused.
brick_risk: false
tags: [librarian, editor, web-midi, usb-midi, presets, backup, web]
