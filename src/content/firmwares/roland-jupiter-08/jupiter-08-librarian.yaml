device: roland-jupiter-08
kind: tool
name: Jupiter-08 Librarian
summary: Browser patch librarian for the Roland JUPITER-08. It edits the unit's whole-memory backup file so a restore brings in exactly the patches and presets you chose, and adds viewers that can follow panel edits and send a patch to the unit's edit buffer over Web MIDI.
description: >-
  The JUPITER-08 accepts no SysEx, so patches only move in bulk through a backup and restore over its USB drive mode. The page
  opens JUPITER08Backup.svd, shows every patch and preset slot, and lets you bring in patches from other backups or from .j08set
  sets, move, copy and swap slots, rename them and build a new backup file. It checks that no byte outside the edited slots has
  changed before offering the download, and it never modifies the original file. A patch viewer shows each control's stored value
  and, in Chrome or Edge, follows knob moves on the unit over MIDI and pushes a patch's panel controls to the edit buffer. A
  preset viewer shows sequences, part settings and effects. The README says it was tested on one unit on firmware 1.00 and was
  written with AI assistance. Restoring a backup replaces everything on the unit, including system settings.
status: active
