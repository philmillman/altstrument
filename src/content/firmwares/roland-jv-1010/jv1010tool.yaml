    url: https://github.com/Ahlzen
source: https://github.com/Ahlzen/jv1010tool
source_status: open
license: MIT
license_notes: The LICENSE.md file is the MIT text, copyright 2015 Lars Ahlzen.
distribution: source-only
install_notes: >-
  Serve the repository folder with any static web server and open it in Chrome or another browser with Web MIDI, then allow
  SysEx access. The README says the tool targeted Chrome 43 or Opera 30 and later and suggests a polyfill and the Jazz plugin
  for other browsers. Back up the module's user patches before sending anything.
brick_risk: false
