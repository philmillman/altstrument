device: roland-jv-1010
kind: tool
name: JV-1010 Tool
summary: Small 2015 browser utility for the JV-1010. It requests the user patches and loads .syx files, lists the patches it holds, and can send an identity request. Run it from the repository, because the page published on the author's site is an older build.
description: >-
  The page uses Web MIDI with SysEx permission. It has buttons to fetch one user patch or all user patches from the module,
  a drop zone for .syx files, and an identity request, and it lists the user, preset A to E, GM and session patches by name. A
  second MIDI input can be chosen for a controller. The code is plain JavaScript with jQuery. Opening the repository's page from
  a local web server shows the interface, while the copy at ahlzen.github.io/jv1010tool is an August 2015 snapshot that lacks
  one of its scripts. Nothing is flashed.
status: dormant
authors:
