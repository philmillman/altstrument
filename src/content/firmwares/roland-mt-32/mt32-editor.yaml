device: roland-mt-32
name: MT-32 Editor
kind: tool
summary: Windows desktop editor and librarian for the MT-32, CM-32L and CM-64 and for the Munt emulator. It edits system, timbre, patch and rhythm data, loads and saves .syx and .mid files and previews timbres over a MIDI port. There is a modern build and one for older Windows.
description: >-
  A C# program with two builds: the main one for .NET on Windows 10 and 11, and a legacy build for .NET Framework 2.0, which runs on Windows 98
  and later. It shows the 64 memory timbres, 128 patches and the rhythm keys, edits all timbre partials with envelope diagrams, has undo
  and redo, saves single timbres as its own .timbre files and exports Cakewalk instrument definitions. It can add a delay between large messages
  for real hardware, show text on the unit's display and flag sounds that need the CM-32L's PCM set. SysEx files made with it can be sent with other tools. Linux use is through Wine. It
  bundles no ROM images. Nothing is flashed.
status: active
