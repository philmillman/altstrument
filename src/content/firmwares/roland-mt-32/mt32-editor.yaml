homepage: https://github.com/sfryers/MT32Editor/releases
distribution: download
install_notes: >-
  Download MT32Edit.exe from the releases page, or the legacy build for older Windows, and run it from a folder you can write to. The
  settings file MT32Edit.ini is created next to it. An MT-32 compatible output is needed to hear sounds, either hardware or the Munt
  emulator with ROM images you supply.
