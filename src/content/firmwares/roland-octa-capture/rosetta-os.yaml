device: roland-octa-capture
name: OCTA-CAPTURE Rosetta OS
summary: Reverse-engineered patches for the OCTA-CAPTURE system program. The build adds a custom boot screen; test builds add a per-channel strip (EQ, tube, compressor) and a PC editor app, with update-file tools and a SysEx lab backend.
description: >-
  Build scripts read your own copy of Roland's 1.51 update, unpack its compressed
  program, patch it and pack it back into an UpdOcta.dat with the checksums
  fixed. The one finished patch replaces the boot picture with a pixel-art
  Rosetta screen and moves the boot bar; the README reports it running on two
  units. The repository also holds notes on the Blackfin DSP code, the audio
  path, the update format and which flash areas each update mode writes, and a
  Rosetta Lab backend that lets a computer read, write and run code on a live
  unit over the control USB-MIDI port. Newer commits add a CPU-load meter and a
  per-input channel strip (gain, high-pass, tube, three-band EQ, compressor and
  limiter) on the unit's DSP, a STRIP page and a new Channel page on the LCD,
  and Rosetta Octa Control, a Python PC editor that sets the strip, preamp gain
  and 48 V and shows meters. The README says the strip runs on lab test builds
  only; the one-command build still produces the boot-screen file. The newest
  commits add Rosetta Dual, a Windows ASIO driver that presents two
  OCTA-CAPTUREs as one device without a coax cable, a one-tap recorder in the
  PC app that uses the project's own USB path, USB monitoring of the other
  unit through the PC (about 15 ms, needs the libusbK driver on the playing
  unit) and a guitar amp mode on the unit's DSP, which the README now lists as
  running on hardware, with an amp head in the PC app and six factory tones.
  Hard clip, a noise gate, echo and reverb, and a bank of 16 scenes on the
  box are built and host-tested only, in test build strip10. The README says
  sample-exact sync between two units is not yet proven. The
  author credits Claude, an AI assistant, with the reverse engineering and
  tools.
status: active
