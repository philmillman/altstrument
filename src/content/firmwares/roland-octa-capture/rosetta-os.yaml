license: MIT
license_notes: >-
  Covers the repository only. The README says no Roland code is included and
  the build starts from Roland's own update file; the built UpdOcta.dat
  contains Roland's code and should not be shared.
homepage: https://yuyoi.github.io/octa-capture-rosetta-OS/
distribution: patch-your-own
requires_stock: "1.51"
install_notes: >-
  Needs Roland's OCTA-CAPTURE System Program 1.51 zip, which you supply. Run
  tools/build_rosetta.py on it, then use Roland's update procedure: hold the
  pre-amp [>] button and push the cursor/value knob while powering on, check
  that the header shows no [ALL], and copy UpdOcta.dat to the disk that
  appears. Flash Roland's original UpdOcta.dat the same way to go back. The
  author warns that a patched main program that freezes before the button scan
  cannot be recovered with buttons and would need JTAG or a flash programmer;
  the boot screen patch was checked offline and boots on hardware. Never hold
  any other power-on combination, since one writes the boot sector too.
brick_risk: true
