license: MIT
license_notes: >-
  The README states MIT, with re/boss_reverb.py excepted as a port of the MT-32
  reverb interpreter that stays LGPL-2.1 or later. It also says the repository
  holds no Roland ROM data, dumps, card images or song MIDI files.
homepage: https://yuyoi.github.io/Rosetta-E-Style-studio-and-Pro-E-mods/
distribution: patch-your-own
requires_stock: "2.00"
install_notes: >-
  Dump your own chips first: IC7 (style ROM) and IC4 (OS EPROM) are needed, and
  the voice board chips IC28 and IC13 for the synth and effect changes. IC7 is
  soldered and has to be socketed. Build in the app, burn W27C040 or W27C512
  chips and fit them with the notch the same way round; the SYNTH EDIT build also
  needs the pin-31 wire mod. Keep your original chips, since putting them back
  returns the unit to stock.
