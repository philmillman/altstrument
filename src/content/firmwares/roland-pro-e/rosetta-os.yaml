device: roland-pro-e
name: PRO-E Rosetta OS and E-Style Studio
summary: Work-in-progress mod kit for the PRO-E that builds new ROM images from your own dumps, adding styles made from MIDI files, hidden style banks, panel synth editing, a Juno mode and new effect programs on the reverb chip.
description: >-
  A Windows app builds images for replacement chips from dumps of your own PRO-E
  ROMs and burns them with a T48 programmer. It puts styles from TN-SC1 card
  dumps or converted MIDI files into the internal style slots, makes eight style
  banks the stock ROM held but had no button for selectable, and changes the boot
  banner and version text. A modified voice board ROM adds a SYNTH EDIT mode on
  the front panel, opened with CURSOR, that edits the tone on 19 pages while you
  play, a Juno mode that builds a saw, pulse and sub oscillator tone with detune,
  and a live filter. New programs for the Boss reverb chip give a Juno-style
  chorus, delay, bit crush, drive and flanger. Some of this needs a one-wire
  address mod so the style ROM can be replaced by a 512 KB chip. Only the PRO-E
  has been tested; the author expects the style output to suit other E-series
  models through a card adapter that does not exist yet. The author credits
  Claude, an AI assistant, with the code and reverse engineering, and the
  reverse engineering notes are marked as partly unverified.
