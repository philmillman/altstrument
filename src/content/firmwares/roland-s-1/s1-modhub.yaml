device: roland-s-1
kind: tool
name: S-1 ModHub
summary: Browser modulation hub for the S-1. Four LFOs, a note envelope, velocity, key tracking and clocked trigs go through a mod matrix to the synth's MIDI CCs, rate-limited and following the S-1's MIDI clock. The page must stay open.
description: >-
  The modulation engine runs in the page on a worker timer and sends only the resulting CC stream to the S-1 over Web MIDI.
  Sources include four LFOs, an AD or ASR note envelope, velocity, key tracking and trigs with probability, swing and
  ratchets; the matrix routes them to any CC the S-1 accepts. Output uses change detection and an echo filter, and settings
  save in browser storage with preset file export. The engine is pure TypeScript with unit tests and the interface is Svelte
  5. The README says it is deployed on Netlify, but gives no address, so no hosted copy is linked here. The repository has no licence file.
  Nothing is flashed.
