device: roland-sc-55
name: SoundPalette
kind: tool
summary: Browser tool for building and reading Roland GS SysEx messages for the SC-55 and SC-55mkII, and Roland SC-7 messages, with a collection that exports to a MIDI file. It sends messages and test notes to a connected MIDI device. Written in Rust and compiled to WebAssembly.
description: >-
  Drop-down menus pick the manufacturer, model, address block and parameter and then the value, and the page writes the SysEx bytes
  with a checksum. A pasted message is decoded into names and values, messages can be collected and exported as a
  standard MIDI file, and a MIDI file can be inspected for the SysEx it contains. A button sends the message to a connected device,
  and a sound test sends notes and controllers to hear the effect. Version 1.1.0 added GS drum setup messages, and SC-88 Port B
  parameter blocks were added after it. The author says it is not affiliated with Roland. Nothing is flashed.
status: dormant
