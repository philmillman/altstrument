device: roland-sp-404-mkii
kind: tool
name: 404 Busdriver
summary: Single HTML page that controls the SP-404MKII over Web MIDI. It drives the five effect buses with named parameters, snapshots, an XY pad and beat-synced LFOs, and adds play surfaces, pattern switching and a looper remote. Unofficial.
description: >-
  The page sets each bus's effect and six faders using parameter names taken from Roland's reference manual, and follows
  moves of the unit's encoders. It keeps eight snapshots that export as JSON, a freely mappable XY pad, and four LFOs that
  follow incoming MIDI clock or tap tempo. Play surfaces include a chromatic keyboard on channel 16, scale pads, a vocoder
  keyboard on channel 11 and a pad board. A pattern grid switches patterns by program change, and a looper remote sends the
  record command. Effect control works in MIDI mode A and B; pattern switching needs mode B with program change receive on.
  On iPhone and iPad the README points to the MIDIWeb Browser app. The latest commit carries a Claude co-author line.
  Settings stay in browser storage. Nothing is flashed.
