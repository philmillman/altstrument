device: roland-sp-404-mkii
kind: tool
name: 404jam
summary: Fork of 404 Busdriver that adds tablet-friendly faders, a JAM tab of pinned custom MIDI controls, a recipe library, XY presets, punch and motion recording, and an Android wrapper. Controls the SP-404MKII over Web MIDI. Unofficial.
description: >-
  Rights warning: the app ships six factory FX recipes taken from ElectroNoir's FX Recipe cards, which are sold on Gumroad.

  It keeps Busdriver's bus control, snapshots, XY pad, LFOs, play surfaces and pattern grid. New in this fork are a recipe
  library that takes a five-bus chain typed in using the effects' own units, XY presets built from real parameter names, and a
  Perf bar with Punch (hold a snapshot and let go to revert) and Motion (record a bus's knob moves over one to eight bars and loop
  them). The JAM tab pins SP-404 bus parameters, raw MIDI controls for another connected device, or captured bus scenes, and
  has a preset for a Roland MC-101 knob layout. The README says the look and some ideas come from the author's 404tui
  project. An Android app that wraps the live site is on the releases page as an APK to sideload. Nothing is flashed.
