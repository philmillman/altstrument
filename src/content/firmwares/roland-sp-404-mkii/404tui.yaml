device: roland-sp-404-mkii
kind: tool
name: 404tui
summary: Go terminal UI and command-line tool for the SP-404MKII over its USB serial link, a port of SparkyMK2. It manages pads, samples, patterns, projects and files, slices samples, and has a Perform dashboard that reads MIDI. Not yet verified on real hardware.
description: >-
  The program works through the unit's USB serial protocol as documented by the SparkyMK2 project. Tabs cover pads, a file
  browser for the unit and SD card, projects, a slicer that renders slices onto pads, a pattern sequencer, and a Perform
  dashboard that counts the bar from the unit's MIDI clock, shows pad hits and effect state, and can record the unit's USB
  audio to a WAV file through ffmpeg or sox. It can also serve Perform as a phone page from the host computer, and a
  separate page at the project site runs over Web MIDI. A handheld front end for an R36S was added in the latest commit. The README
  says the protocol and interface were tested against a simulated device only, not yet against a real unit. It does not
  change the unit's firmware.
