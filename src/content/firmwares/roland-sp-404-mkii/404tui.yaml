homepage: https://moahbeatlab.github.io/404tui/
distribution: download
install_notes: >-
  Each release has builds for macOS (universal), Linux and Windows on x86-64 and ARM64, with a SHA256SUMS file. The
  Windows build is unsigned. Run sp404 -sim to try it without a unit. Recording needs ffmpeg or sox installed. Work on a copy
  of your project data, since sending whole projects has been tried on a unit only in part; run sp404 doctor first.
brick_risk: false
