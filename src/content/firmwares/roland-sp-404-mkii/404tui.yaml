install_notes: >-
  The v0.1-alpha release has builds for macOS (universal), Linux and Windows on x86-64 and ARM64, with a SHA256SUMS file. The
  Windows build is unsigned. Run sp404 -sim to try it without a unit. Recording needs ffmpeg or sox installed. Work on a copy
  of your project data, since the tool has not been tested on real hardware.
