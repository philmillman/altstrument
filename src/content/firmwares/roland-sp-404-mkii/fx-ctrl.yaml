device: roland-sp-404-mkii
kind: tool
name: SP-404MKII FX CTRL
summary: Closed-source browser effect controller for the SP-404MKII over Web MIDI, free to use. It adds randomise, morph, LFO and envelope modulation across the buses, presets, undo, and swapping effects between buses. Version 1.4.3 was live.
description: >-
  Each bus column has an effect menu and up to six parameter controls that send and receive CCs in real time. The percent
  buttons randomise effect types, parameters or both, per-bus include switches choose which buses take part in randomise,
  morph and envelope modulation, and a morph pad, an LFO and an envelope module modulate parameters. Presets are kept in
  browser storage on the device. A Panic button turns all effects and MIDI off, and the help warns that randomising can cause silence,
  feedback or very hot levels. It needs the unit in MIDI mode B with pad channels 1 and 2 and clock out on; the help says OS
  5.x gives knob control and 4.x works without it. The page states that all rights are reserved by Waft Soft and that it is
  independent of Roland. Nothing is flashed.
status: unknown
authors:
