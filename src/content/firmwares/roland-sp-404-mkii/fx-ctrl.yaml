    url: https://wftlrd.uk/
source_status: closed
license: proprietary
license_notes: The page says "Copyright © Waft Soft 2026. All rights reserved." and offers it free of charge, with a donation link.
homepage: https://wftlrd.uk/sp404mk2fxctrl/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge on a desktop computer, connect the SP-404MKII by USB and choose it for both MIDI
  ports. Turn on MIDI mode B, set pad channels to 1 and 2, and enable clock out. Monitor quietly before randomising.
