device: roland-sp-404-mkii
name: Side-Piece
summary: Free open-beta OS layer for the SP-404MKII, built by a browser patcher from your own Roland 5.52 update file. Adds a four-bus FX stack screen, four LFOs, Euclidean lanes, frequency chop, per-bus EQ, a ducker and a replacement time-stretch.
description: >-
  Runs on top of Roland's own system and is built in the browser from the
  official 5.52 update file you supply. A new FX screen opens with SHIFT and
  PATTERN EDIT. Each of BUS 1 to 4 and DRY holds four effect slots (filter,
  lo-fi, EQ, chorus, phaser, delay, transient shaper) that a pad can switch on
  and off. Four LFOs, including pressure-following and chaotic shapes, can
  target any stack setting. The rest of the beta covers four Euclidean lanes
  that play a pad while a pattern runs, a frequency chop that splits one pad
  across four pads, a ducker and tempo pump, a time-stretch with tempo and pitch
  overrides, and custom opening pictures from the SD card. The changelog lists
  known issues, among them that effect settings are not yet saved over a
  restart and that chop has no undo. A browser simulator with lessons is
  available.
status: active
authors:
  - name: Freakier Firmware Labs LLC
    url: https://freakierfirmware.com
source_status: patcher-only
license: proprietary
