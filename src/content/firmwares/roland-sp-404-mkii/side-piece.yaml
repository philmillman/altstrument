homepage: https://freakierfirmware.com/sp-404mk2/
distribution: patch-your-own
requires_stock: Roland system 5.52
install_notes: >-
  Back up in the unit's BACKUP/RESTORE menu and keep your official update file.
  Build SP404MKII_APP1.bin in the browser patcher, copy it to the SD card, hold
  SHIFT while powering on and press VALUE. Never put SP404MKII_APP0.bin on the
  card. The authors' recovery guide covers returning to the official firmware.
  Reverting repeats the same update with Roland's official APP1.bin. The recovery guide warns that APP0.bin reflashes
  the sound chip with no known way back, which is why it stays off the card.
brick_risk: false
