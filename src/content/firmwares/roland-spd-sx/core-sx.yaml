source: https://github.com/Agi0411/core-sx
source_status: open
license: MIT
distribution: source-only
install_notes: >-
  Needs macOS, Node.js 20 or newer and the Xcode Command Line Tools, because the
  MIDI module is a native add-on compiled during npm install. Clone the
  repository, run npm install and npm run dev, or build an unsigned Apple
  silicon installer with npm run dist:mac:arm64:unsigned. There are no prebuilt
  downloads. For Editor mode set the unit's USB mode to WAVE MGR, and back up the
  unit's contents first, since the editor changes its kit and wave files. To send
  sound into a DAW the README suggests a virtual audio device such as BlackHole
  or Loopback.
