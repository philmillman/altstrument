device: roland-spd-sx
name: electronicdrums
kind: tool
summary: Python scripts that upload kit definitions from JSON files to an SPD-SX, download kits back to JSON, diff against a backup and generate random kits, with a serial-controlled USB switch to avoid replugging.
description: >-
  The SPD-SX stores its drum kit configurations, signal routing and effects
  settings as XML files. With the unit in WAVE MGR mode and mounted as a drive,
  these scripts write kits there from JSON descriptions of the kit sounds,
  and the author has checked their own kit files into the repository. kitToJson.py
  goes the other way and builds a JSON file from an existing kit, and diffKits.py
  compares the unit's kits with a local backup. upload.py can also generate a
  set of random kits for a tempo, including polyrhythmic dual delays and
  routing of the audio input through the effects.

  While mounted as a drive the unit cannot be played, so the upload scripts can
  switch the USB connection through a serial port, which can be a USB serial
  adapter, using a switchable USB connector. The README says this needs some
  specific hardware and that the wiring is still to follow. The repository also
  holds an HTML demo and per-session setup scripts.
status: active
authors:
