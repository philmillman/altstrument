    url: https://github.com/andrewbooker
source: https://github.com/andrewbooker/electronicdrums
source_status: open
license: unspecified
license_notes: No LICENSE file in the repository and none stated in the README.
distribution: source-only
install_notes: >-
  Clone the repository, copy py/exampleConfig.json to py/config.json and set
  mediaLoc to the SPD-SX drive or to a local copy of it, then run upload.py from
  the py directory, for example ./upload.py mab, or ./upload.py gen for random
  kits. The scripts write into the Roland/SPD-SX folder, so the README advises
  copying the whole unit contents (up to 4 GB) to a local disk and putting it
  under git as a backup and test area, without the wav files. The automatic
  mounting needs the serial-controlled USB hardware, which is not documented
  yet; without it, connect and disconnect the unit by hand. The README gives
  Linux style paths and does not mention other platforms.
