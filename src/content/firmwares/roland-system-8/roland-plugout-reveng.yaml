distribution: source-only
requires_stock: SYSTEM-8 1.32 (tested); SYSTEM-1 1.30 or later
install_notes: >-
  Needs Python 3.8 or later and python-rtmidi on Windows and macOS. python3 tools/plugout_tool.py install <plugout folder> --slot N
  sends a PLUG-OUT to one slot and overwrites what is in it; the SYSTEM-1 has one slot, so a custom build replaces the
  Roland PLUG-OUT there. The tools write only PLUG-OUT slots and never the OS, bootloader or updater. The project's way
  back is to reinstall Roland's PLUG-OUT into the slot, so brick_risk is false. A heavy wavetable can need a power cycle, and the
  author lists an experimental JX-3P build for the SYSTEM-1 as one that still hangs the device. Building s1cc needs LLVM 19. Only
  one program may use the MIDI port at a time.
brick_risk: false
