device: roland-tr-8
name: tr8-re
summary: Reverse engineering notes, a Python patcher and a browser patcher for Roland TR-8 system program 1.61, with patches for motion recording of knob and fader moves, a separate pattern length per instrument and a bar chain of up to eight bars per pattern.
description: >-
  The patcher reads Roland's own TR8_UPD.BIN for version 1.61, refuses any other file, and writes a modified update that the
  TR-8's updater accepts, with the size and byte sums recomputed. The motion patch records a knob or fader move at the current
  step while TR-REC is held with the sequencer running, plays it back on later passes, and erases a control's motion
  while CLEAR is held. All 49 controls can record, for 16 steps and two variations each. The motion is kept in RAM in one
  buffer shared by all patterns and is lost at power-off. A second patch gives each instrument its own pattern length for
  polyrhythms, stored with the pattern; the LAST STEP button blinks in TR-REC while the selected instrument has its own
  length. A third patch, the bar chain written by Andrei Dabrakou, lets each pattern play up to eight bars, each with its
  own A and B step set, and the three patches can be combined in any set. The README reports each patch and the combined
  builds working on a real TR-8. A web page runs the same patcher in the browser on Roland's file, with output
  that the repository's tests check against the Python tool byte for byte. The repository also
  documents the update file format, the boot loader and updater, the sequencer and control handling, and a developer
  guide for writing further patches, with emulation tests that need Ghidra and Unicorn. It holds no Roland code, and its
  .gitignore excludes the firmware and analysis folders.
