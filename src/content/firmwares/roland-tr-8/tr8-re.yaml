homepage: https://yo1frenchtoast.github.io/tr8-re/
distribution: patch-your-own
requires_stock: System program 1.61 (tr8_sys_v161.zip from Roland's support page; the patcher accepts only this file)
install_notes: >-
  Use the web patcher at yo1frenchtoast.github.io/tr8-re (tick any of the patches and drop in Roland's file), or run python3 -I tools/tr8patch.py TR8_UPD.BIN TR8_UPD_motion.BIN on the unzipped Roland file, back up patterns and kits over
  USB, then flash it by Roland's procedure: hold step button 1 at power-on, copy the file as TR8_UPD.BIN to the TR-8 drive and
  press step button 2 after ejecting. The update never writes the boot loader or the updater, and holding step button 1 at
  power-on always reaches the updater, so reinstalling the original file recovers a bad build. Do not cut the power during the
  write; the README says Roland then requires service. The build keeps version number 161.
brick_risk: false
tags: [patch, sequencer, motion-recording, reverse-engineering, drums]
