distribution: source-only
install_notes: >-
  Needs Python 3 with mido on macOS, two Launchpad Mini MK3 and the TR-8S on USB. Close Roland's TR-EDITOR first, because two programs
  reading the TR-8S CTRL port get each other's replies. Run lp_tr8s.py learn once, then run. Edit a copy of a pattern first
  and back the unit up.
