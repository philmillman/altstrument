name: TR-8S Grid
summary: Python tool that turns two Launchpad Mini MK3 into a 16x8 step grid editing the TR-8S's own pattern over SysEx, live. It rests on a reverse-engineered pattern layout, documented in the repository, and includes a local web page. macOS-oriented; no licence.
description: >-
  Rights warning: the repository's capturas folder holds ToneDetailsConfigTable.dat, a data table from Roland's software, next to
  the author's MIDI Monitor captures.

  Pad presses on the Launchpads become SysEx writes to the TR-8S's pattern memory while LED colours show velocity, so a
  variation can be edited while another plays. The author says the machine's pattern format was not published and decoded it
  with hardware tests, listing step layout, velocity, flam, sub-steps, probability, ALT, accents, last step, track mute and the
  current step in REFERENCIA.md, which separates what is proven from what is guessed. Pattern scale writing was not yet tested
  on hardware. Scripts list ports, learn the Launchpad layout, run the grid, snapshot and diff machine state, and listen to
  the unit. A LaunchAgent and a small app wrapper serve a web UI on localhost. The README is in Portuguese and warns that
  requests to invalid addresses can drop the unit's control port. The README says no licence is defined and to ask before reuse.
  Nothing is flashed.
