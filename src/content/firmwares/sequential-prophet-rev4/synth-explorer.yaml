device: sequential-prophet-rev4
also_devices: [sequential-prophet-6, oberheim-ob-6]
name: Synth Explorer
kind: tool
summary: Closed browser editor and librarian for the Prophet-5/10 Rev4, Prophet-6, OB-6 and TEO-5 that edits programs live, saves to the hardware, imports and downloads SysEx and converts sounds between the four synths in one shared library.
description: >-
  Connected over USB, the page lets every program on the synth be browsed and edited with a real-time panel editor kept in sync
  with the hardware. Imported SysEx banks from any of the four supported synths are converted to the connected one so
  sounds can be auditioned on hardware. The free tier needs no account and allows saving to the first 20 user slots and 20
  sounds in the library, with 20 built-in factory backup programs. A paid Pro licence raises the library limit to 2,000,
  saves to every user and factory slot, backs the library up across computers and covers all four synths. The site states it
  is not affiliated with Sequential or Oberheim. Nothing is flashed.
status: active
authors:
  - name: Synth Explorer
    url: https://synth-explorer.com/
source_status: closed
license: proprietary
license_notes: >-
  Hosted commercial software with a free tier. At the time of checking, Pro was a one-time USD 119 lifetime licence. The
  site shows a 2026 copyright and no named author.
homepage: https://synth-explorer.com/prophet-rev4
distribution: browser-installer
install_notes: >-
  Open the site in a Web MIDI browser such as Chrome or Edge, connect the synth over USB, allow MIDI and SysEx access and
  choose the Prophet-5/10 page. Back up the synth's programs before saving to hardware slots.
brick_risk: false
tags: [editor, librarian, web-midi, sysex, usb-midi, midi, presets, web]
