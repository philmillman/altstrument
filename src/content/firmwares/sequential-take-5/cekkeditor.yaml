device: sequential-take-5
name: CekkEditor
kind: tool
summary: Installable browser app of hand-written Web MIDI editors and librarians, with a Take 5 editor that sets parameters over NRPN and reads and saves programs and banks as SysEx. Korg microKORG XL and Moog Little Phatty editors sit beside it.
description: >-
  The app finds each synth's ports by name, opens the chosen editor full screen and shares the MIDI ports with it. The
  Take 5 page changes parameters live through NRPN, reads and sends single programs and banks as .syx files and keeps a
  library in the browser, with confirmation before anything is written to the synth's memory. It is an early version: the
  commit history shows the author still working out which bytes of a program dump hold which parameter, and that the synth
  stopped answering after several quick SysEx reads. The interface is in Italian. Rights warning: the repository also
  holds PDF copies of Sequential's Take 5 MIDI implementation and user guide, a Korg microKORG XL manual and MIDI chart, and
  a Moog Little Phatty manual. Nothing is flashed.
status: active
authors:
