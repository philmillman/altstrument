    url: https://github.com/cekkomusic
source: https://github.com/cekkomusic/CekkEditor
source_status: open
license: unspecified
license_notes: >-
  No LICENSE file and no licence statement. The docs folder redistributes manufacturers' manuals and MIDI documents
  (Take-5-MIDI-Implementation-1.2.pdf, Take-5-Users-Guide-v2_3.pdf, microKORG_XL_MIDIChart_E1.pdf and others) that are not
  covered by any licence in the repository. The default branch is ccr-650e1c9a-a8zli2, from which GitHub Pages publishes.
homepage: https://cekkomusic.github.io/CekkEditor/
distribution: browser-installer
install_notes: >-
  Open the hosted app in Chrome or Edge, or install it from the browser menu on Android with the synth on a USB OTG
  cable, and allow MIDI and SysEx access. The Take 5 editor also opens on its own at /take5/.
