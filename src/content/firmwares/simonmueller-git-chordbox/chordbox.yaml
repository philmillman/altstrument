device: simonmueller-git-chordbox
name: ChordBox
summary: Arduino firmware for a DIY ESP32-S3 instrument that plays chord progressions from 16 pads and a bassline that follows them, synced to the Ableton Move's MIDI clock.
description: >-
  The pads play 317 progressions grouped into 24 banks by mood and style, and
  chords sound the instant a pad is pressed, with inversions, voicings, strum,
  arp, echo, latch and a loop recorder. The bass side holds 214 hand-written lines
  in 16 genres, written as roles such as root, fifth and approach note so they
  follow the chord being played. Harmony modes find the chords of a sample by ear,
  work them out from incoming MIDI, build and extend a 16-slot loop, add a
  melody, and print the loop into a Move clip. Chords go out on MIDI channel 1,
  bass on 2 and melody on 3. A phone page served over Wi-Fi works as a remote.
  The repository also has 672 MIDI files of the progressions, a printable
  reference sheet and host-side tests that run the UI logic on a computer. The
  progressions derive from the free-midi-chords project. The commit credits an AI
  assistant as co-author, and the README calls it a one-person build shared as it
  is, not affiliated with Ableton.
status: active
authors:
