source: https://github.com/simonmueller-git/ChordBox
source_status: open
license: MIT
license_notes: >-
  The code is MIT. The wiring diagram and documentation are CC BY-SA 4.0, and the
  chord progression data derives from free-midi-chords by Ludovic Drolez (MIT),
  as THIRD_PARTY.md lists.
distribution: source-only
requires_stock: The ESP32-S3 N16R8 build in BOM.md
install_notes: >-
  Build the instrument from BOM.md and docs/WIRING.md, install the esp32 board
  package and the libraries named in THIRD_PARTY.md, and run ./build.sh esp32
  flash with the board's COM USB port attached to a computer. On first boot, press
  the four OLED buttons when asked, then connect the board's native USB-C port to
  the Move. The default hotspot password is public, so set your own in
  local_config.h before using the Wi-Fi page. Only the ESP32-S3 build is tested.
brick_risk: false
