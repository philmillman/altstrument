device: sonic-potions-lxr
name: LXR-OWL
summary: Fork of LXR firmware 0.37 that adds 72 preset patterns per voice, pattern and sound randomisers, a loop and divide performance effect and eight sample-rate and distortion effects.
description: >-
  Stephane Ribas built it on the PLD/Rudeog branch and the official 0.37 code,
  and took some of its effects from the OWL project. Under the OSC menu of a
  voice it offers preset pattern selection and randomisation of steps and of
  sound parameters. In PERF mode, step buttons 9 to 16 set loop ranges in the
  style of a loop and divide effect, and a second PERF page selects effects
  including a simple compressor, a bit rotator, a decimator, bit reversal and two
  wave shapers. The author warns that the effects add heavy overdrive unless
  the kick track is muted. The last commit rebased it on 0.37 in January 2016.
