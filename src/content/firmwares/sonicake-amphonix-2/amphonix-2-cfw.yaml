device: sonicake-amphonix-2
name: Amphonix 2 CFW
summary: >-
  Rights warning: unofficial firmware for the Amphonix 2 built from Sonicake's V1.0.2 code, with scenes on the A, B and C keys, a USB tuner, 10 + 10 IR and NAM slots and MIDI control. Binary only, with no named author.
description: >-
  Rights warning: the image is Sonicake's V1.0.2 firmware with changes made by the community, the page says, and no source is published. It is the Amphonix 2 version of the Pocket Master CFW and Smart Box CFW, from the same site and on the same platform. The firmware adds scenes (BASE, SC1 and SC2) that a held key steps through, a choice of three or five presets per A, B or C key with the key LED blinking for the scene, 10 + 10 User IR and NAM slots with 30-character names, the IR block after a NAM capture, a DSP load meter, a tuner that also works over USB, MIDI control over USB and Bluetooth with configurable maps, two STOMP groups switched by MIDI, tap tempo and tempo sync, Global EQ, MIDI expression pedals A to D, and the Pocket Master and Smart Box amps, delays, reverbs and modulations. The site also offers a manual and the Sonicake CFW app, shared with the other two units, which can update the firmware over USB and runs in the browser, on Windows and on Android. The page does not name the author, who says the firmware was tested on one unit only and may not work on other hardware revisions. It is credited to Sonicake's own code plus the SonicMaster, gp150-htfw and Linux flash projects. The page asks that derived builds credit the site and link to it. The project says it is not affiliated with Sonicake.
