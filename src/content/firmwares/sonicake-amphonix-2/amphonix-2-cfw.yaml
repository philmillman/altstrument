homepage: https://amphonix2-cfw.guitar-training-generator.com/
distribution: download
requires_stock: Sonicake firmware V1.0.2 (the Sonicake CFW app shows Amphonix 2 CFW 1.0 for the unit after the update, since the pedal has no display)
install_notes: >-
  Use a USB cable, not Bluetooth, and flash the .bin from Firmware update in the Sonicake CFW app (web, Windows or Android), or put the unit in update mode and load it in Sonicake Manager's firmware update, after checking its SHA-256 against the release notes. Update mode is entered by unplugging USB, then holding volume +, volume - and the power key until all lights are on and only the power key's LED stays on, white or light blue. Back up IRs and NAM captures first: on the first start the five of each move into the new 10 + 10 slots, and going back to stock shows the slots empty, though installing the CFW again brings the data back. To go back, flash Sonicake's V1.0.2 with Sonicake Manager in update mode. The page says update mode lives in the boot loader, so the same key combination recovers a unit whose image does not boot.
brick_risk: false
