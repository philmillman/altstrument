device: sonicake-matribox-ii-pro
name: Matribox II Pro Effects Lab
summary: >-
  Experimental full firmware for the Matribox II Pro, built from Sonicake's V1.2.2, adding 29 effects, amps and 9 cabinets ported from the Valeton GP-200, integrated cabinet mic filters, a DSP meter and looper state reporting over SysEx.
description: >-
  Rights warning: the release is a complete firmware image that contains Sonicake's V1.2.2 code modified by the author,
  plus effect and cabinet data taken from Valeton's GP-200 V1.8.2 firmware and the microphone filter layer taken from
  Hotone's Ampero Mini V2.2 firmware. The MIT licence covers the author's own code and documentation only, as the
  README states, and none of the three manufacturers has licensed the image for redistribution. The git repository
  itself holds no firmware.

  Lab 5 (2026-10-20) adds 29 GP-200 models, including overdrives, a pitch shifter, delays, reverbs and amps, nine ported
  cabinets next to the 61 factory ones, a Cab Match entry for some of the new amps, a DSP load meter on screen, and
  a microphone type and X/Y/Z position control on every cabinet and user IR slot. It keeps the looper state reporting
  over SysEx from Lab 4, including undo and redo events, which the author's monitor tool reads. Four models from
  earlier tests are retired but keep their IDs so that old presets load without another effect in their place. The
  author reports hardware tests on one unit and says the final navigation fix is confirmed only in an emulator.

  The repository also holds Python tools to inspect and compare firmware files the user supplies, a documented
  reconstruction of the Penesas library block, notes on the FRMW file format, USB protocol and memory, and
  Portuguese documentation. The README and release notes are in Portuguese.
status: active
authors:
  - name: hurricaneabel
    url: https://github.com/hurricaneabel
source: https://github.com/hurricaneabel/matribox-ii-pro-effects-lab
source_status: binary-only
license: MIT
license_notes: >-
  The LICENSE file is the MIT text for the author's own code and documentation. The README says the licence gives no
  rights over third-party firmware or algorithms, which the release image contains.
distribution: download
requires_stock: Matribox II Pro V1.2.2
install_notes: >-
  Download the Lab 5 ZIP from the release and check SHA256SUMS.txt. Back up presets, IR and NAM files and your
  confirmed previous firmware, put the pedal into firmware mode, and flash the BIN with Sonicake's official updater.
  On Windows 11 the author documents a driver change for both normal and firmware mode. The author calls it an
  experimental pre-release for the Matribox II Pro only, not for the Matribox II or other models.
  The author's notes say to return by flashing the full original firmware with the official updater in firmware mode,
  and the repository documents no bricked unit.
brick_risk: false
