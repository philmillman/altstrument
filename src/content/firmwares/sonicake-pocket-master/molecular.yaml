device: sonicake-pocket-master
name: Molecular
summary: Replacement application for the Pocket Master that plays a random FM generator through up to five effect atoms, with motion that rearranges the sound over time, twelve patch slots and a browser installer.
description: >-
  Rights warning: the source includes the settings of one Sonicake factory preset,
  read from Sonicake's 1.3.3 firmware, and a linker script and start-up code from
  MVsilicon's BP10xx SDK, which states no licence. The installed build also links
  the SDK's driver library, which is not in the repository.

  Each sound is a molecule: an FM generator with patches from 40 families, bonded
  to as many as five effects drawn from 25, plus delay and reverb. The engine and
  the effects come unchanged from the author's Tonitor and Norilsk projects. The
  controls ask for a new molecule, rewire it or draw new values rather than set
  parameters one by one, and a motion mode drifts the atoms and rewires the
  molecule at a set rate, with the sound morphing instead of jumping. Twelve patches
  are stored in the pedal's flash. The screen uses very large type and high
  contrast. The page installs only the application section of a Sonicake update; the
  effects processor's firmware, the factory presets and Sonicake's loader stay as
  shipped. The author states it is unofficial, not endorsed by Sonicake, and may
  void the warranty.
status: active
