source: https://github.com/nzimas/molecular
source_status: open
license: GPL-3.0-only
license_notes: >-
  LICENSING.md puts the firmware, installer and tools under GPL-3.0-only and the
  website and documentation text under MIT. Vendored Tonitor and Norilsk code is
  GPL-3.0-only, the FM core is msfa under Apache-2.0, and the MVsilicon SDK files
  and the Sonicake preset data keep their owners' terms.
homepage: https://nzimas.github.io/molecular/
distribution: browser-installer
requires_stock: Sonicake firmware 1.3.3
install_notes: >-
  Use desktop Chrome, Edge or Opera with the pedal on a data USB cable and no other
  MIDI program open, and allow MIDI access. The install page restarts the pedal
  into Sonicake's update mode, writes Molecular in under a minute and the pedal
  restarts into it. The loader is never written, so an interrupted install can be run
  again from the same page. Holding both side buttons for three seconds from
  Molecular returns to update mode. To go back, install a Sonicake firmware file
  downloaded from Sonicake on the same page.
brick_risk: false
tags: [synth-engine, fm, fx, generative, ui, usb-midi]
