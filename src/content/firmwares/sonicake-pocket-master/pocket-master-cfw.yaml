device: sonicake-pocket-master
name: Pocket Master CFW
summary: >-
  Rights warning: unofficial firmware for the Pocket Master built from Sonicake's 1.3.3 code, with scenes, a STOMP mode, extra delays, reverbs, Clone and IR slots and MIDI maps. Binary only, with no named author.
description: >-
  Rights warning: the images are Sonicake's V1.3.3 firmware with changes made by the community, the page says, and no source is published. The firmware adds scenes, a STOMP mode, ten Clone and ten User IR slots, further delays and reverbs, a global EQ, a screen saver, themes and configurable MIDI maps, including drum and delay tempo sync. The site also hosts a browser editor that can be installed as an app, built on SonicMaster, with Windows and Android versions, a manual and a NAM converter. The page does not name the author, who says the firmware was made from October 2026 and tested on one unit, and that it may not work on every unit. It is credited to Sonicake's own code plus the SonicMaster, interoperability guide, gp150-htfw and Linux flash projects. The page asks that derived builds credit the site and link to it. The project says it is not affiliated with Sonicake.
status: active
