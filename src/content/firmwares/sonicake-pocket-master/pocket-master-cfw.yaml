source_status: binary-only
license: proprietary
license_notes: >-
  No licence is stated. The firmware contains Sonicake's code, which stays under Sonicake's rights, and the page provides it as is, without warranty.
homepage: https://pocketmaster-cfw.guitar-training-generator.com/
distribution: download
requires_stock: Sonicake firmware V1.3.3 (the pedal shows V1.3.3-CFW1.0 in Settings, About, after the update)
install_notes: >-
  Use a USB cable and Chrome, Edge or Opera, with Sonicake Manager closed. Flash the .bin through the Sonicake CFW app's firmware update or through Sonicake Manager's firmware update, after checking its SHA-256 against the release notes. The project recommends first backing up the MCU flash with a CH341A programmer, because the bootloader is not part of the update file. Moving from stock deletes user IRs and Clones on the first start, while presets and settings are kept, so keep the .wav, .nam and .clo files. To go back, set the tuner to MUTE and flash Sonicake's V1.3.3 with Sonicake Manager. If the pedal does not start, power it on while holding footswitch 1, footswitch 2 and VOL/VALUE to enter update mode.
brick_risk: false
tags: [multi-effects, guitar, midi, ir, web-midi, ui, scenes]
