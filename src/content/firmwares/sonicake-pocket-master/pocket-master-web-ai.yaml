device: sonicake-pocket-master
kind: tool
name: Pocket Master Web-AI
summary: >-
  Portuguese and English browser editor for the Pocket Master over Web MIDI or Web Bluetooth, with preset read and save, full backups, user IR upload, setlists, stage mode and an AI tone builder that uses your own API key and the pedal's own models.
description: >-
  The editor has a side menu with Presets, Create with AI, Pedalboard, Tuner, IRs and NAM, Drums, Looper and Play with music areas, and shows the nine blocks and chain order as a signal chain, with undo, A and B comparison and live changes on the pedal. It reads
  and saves presets with names, copies and imports or exports .prst files, makes a ZIP backup of all 50 presets and the
  settings and asks for one before a factory reset. A WAV can be sent to user IR slots 1 to 5, and captures from TONE3000
  are checked against the pedal's limits. The tone builder sends a text request to Gemini, Groq, Claude or OpenAI with a
  key you enter, or lets you copy the request to any AI. Other parts are the pedal's tuner, drums and looper controls, a
  stage mode for page-turner pedals and setlists shared by code or QR. The page is installable and works offline. The
  author tested firmware 1.3.3 and the page does not run on Safari or iOS.
