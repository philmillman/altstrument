    url: https://github.com/vahr76
source: https://github.com/vahr76/PocketEdit
source_status: open
license: unspecified
license_notes: The repository has no LICENSE file; the upstream project listed here has none either.
distribution: source-only
install_notes: >-
  Pair the pedal with bluetoothctl, run python linux/ble_midi_bridge.py with its address, then open index_linux.html in
  Chrome or Brave. Install bleak and websockets first. For the original editor, use the upstream hosted page instead.
brick_risk: false
