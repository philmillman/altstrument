device: sonicake-pocket-master
kind: tool
name: PocketLab
summary: >-
  Editor for the Pocket Master as a hosted Web MIDI and Web Bluetooth page and an Electron app for Windows, Linux and macOS. It edits the nine-block chain live, loads NAM captures and IRs into user slots, and manages the 100 presets.
description: >-
  The signal chain view shows the fixed drive, amp, IR and EQ core with free placement of the other blocks, with knobs and
  faders that send SysEx as they move. The user NAM and IR slots take .nam and .wav files, and the page locks cabinet
  processing when a full-rig capture is loaded. Preset tools cover the 50 user and 50 factory slots, renaming, JSON export
  and import of banks, and fetching names from the pedal. A global panel sets volumes and USB and Bluetooth levels, and
  a tuner and keyboard shortcuts are included. It connects over USB MIDI or Bluetooth LE. The README includes Windows and
  Linux guides for MIDI permissions and says the project is not affiliated with Sonicake. It names the QME-20 as the
  supported model. Nothing is flashed.
status: active
