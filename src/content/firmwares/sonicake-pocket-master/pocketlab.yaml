install_notes: >-
  Open the hosted page in Chrome, Edge or Brave, press Connect and allow MIDI with SysEx, or pair Bluetooth. Close any DAW
  using the pedal's MIDI port. On Linux, add your user to the audio group; the repository's LINUX_GUIDE.md has the details.
