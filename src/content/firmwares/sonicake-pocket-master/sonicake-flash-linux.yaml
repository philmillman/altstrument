  Sonicake's 5868USB.dll, which is not included.
homepage: https://github.com/MigueLesPaul/sonicake-pocket-master-linux-flash
distribution: source-only
requires_stock: A Pocket Master HTFW firmware file of your own, such as a community build for base 1.3.3
install_notes: >-
  Needs Linux with ALSA rawmidi, Python 3.10 or newer or uv, and membership in the audio group. Inspect a file with
  htfw.py, dry-run upload.py to see the frame plan, probe with the init frame to confirm update mode, then run
  flash-firmware.sh. The upload is about 112,000 acknowledged frames, so keep the pedal powered and connected. The
  README warns that a wrong image or an interrupted upload can brick the pedal and suggests keeping the stock firmware
  and Sonicake's official manager as a fallback.
brick_risk: false
