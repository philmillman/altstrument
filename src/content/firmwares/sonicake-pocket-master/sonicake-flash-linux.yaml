device: sonicake-pocket-master
kind: tool
name: sonicake-flash
summary: Python tools that parse a Pocket Master HTFW firmware file and send it to the pedal over USB MIDI SysEx from Linux, using a protocol the author reconstructed from Sonicake's Windows DLL.
description: >-
  The repository has an HTFW container parser, a SysEx frame codec, an ACK-paced uploader with a dry-run default and a
  probe mode, a shell wrapper around the uploader and a write-up of the container layout and upload sequence. The tools
  flash a firmware file you supply, such as a community build made for base version 1.3.3, and the repository contains
  no firmware image. The pedal has to be put into Sonicake's update mode by hand, by holding the first two footswitches
  and the VOL/VALUE knob while powering on. The README says the container, frame format and first acknowledgement are
  verified on hardware, and that a full multi-segment upload has not yet been completed. It reads ALSA rawmidi nodes
  directly because rtmidi did not receive the pedal's replies.
status: active
