kind: tool
name: Universal MIDI Controller
summary: >-
  Next.js PWA that turns a browser into a pedalboard controller with preset and FX pads. It has built-in profiles for the Sonicake Pocket Master, with CC numbers and tap delay by SysEx, the Pocket Master CFW and the Valeton GP-5, plus a looper, songbook and setlists.
description: >-
  Rights warning: docs/ holds two PDF MIDI tables, one for the Pocket Master and one for the Valeton GP-5, which look like
  the makers' own documents.

  The page sends Program Change and CC messages to a chosen Web MIDI output, with pads that select presets and pads
  that toggle effects on and off. A setup wizard fills the pads from the chosen pedalboard profile. The Pocket Master
  profile maps the effect blocks, tuner, looper and drum to CC numbers, and its tap delay sends SysEx using data from
  suckyble's PocketEdit research, stored as a delay table. Other parts are a looper timed from the page, a songbook with
  chord sheets and setlists, keyboard bindings and JSON export. It can drive other devices with generic messages. A separate Pocket Master CFW profile, for a pedal running the community custom firmware with its MIDI map left on Stock, sends the tap delay's tempo and note by CC instead of SysEx, adds shortcuts for Freeze, Global EQ, Drum play and DLY Sync, keeps a tempo per preset pad and gives each preset Solo, Scenes and STOMP modes.
