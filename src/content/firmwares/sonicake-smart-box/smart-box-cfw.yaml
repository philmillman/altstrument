homepage: https://smartbox-cfw.guitar-training-generator.com/
distribution: download
requires_stock: Sonicake firmware V1.0.6 (the pedal shows V1.0.6-CFW1.0 in Settings, About, after the update)
install_notes: >-
  Use a USB cable, not Bluetooth, with the pedal on a charged battery (turn on Batt Only) and flashed from a USB-C port that has not tripped an overcurrent warning. Flash the .bin from the Sonicake CFW app's firmware update, or load it in Sonicake Manager's firmware update, after checking its SHA-256 against the release notes. Back up User IRs and Tone Catches first: on the first start the five of each move into the new 10 + 10 slots, and going back to stock erases all of them, while presets are kept. To go back, flash Sonicake's V1.0.6 with Sonicake Manager, which the page also names as the recovery route. The page warns that other hardware revisions may not work.
brick_risk: false
