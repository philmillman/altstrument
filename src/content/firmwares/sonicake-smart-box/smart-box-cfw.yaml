device: sonicake-smart-box
name: Smart Box CFW
summary: >-
  Rights warning: unofficial firmware for the Smart Box built from Sonicake's V1.0.6 code, with STOMP and scene modes, extra delays, reverbs and EQ models, 10 + 10 IR and Tone Catch slots and MIDI maps. Binary only, with no named author.
description: >-
  Rights warning: the image is Sonicake's V1.0.6 firmware with changes made by the community, the page says, and no source is published. It is the Smart Box version of the Pocket Master CFW, from the same site and on the same platform. The firmware adds STOMP and SCENE modes on the footswitches, a Pocket Master-style screen with a DSP load meter, 10 + 10 User IR and Tone Catch slots with 30-character names, a lighter looper, six further delays and five reverbs that follow the tempo, further EQ models, themes, English menus on Chinese-market units, MIDI expression pedals A to D and configurable MIDI maps. The site also offers a manual and the Sonicake CFW web app, with Windows and Android versions that are shared with the Pocket Master. The page does not name the author, who says the firmware has been made since October 2026 and tested on one unit only, and that Sonicake may have shipped hardware revisions on which it fails. It is credited to Sonicake's own code plus the SonicMaster, gp150-htfw and Linux flash projects. The page asks that derived builds credit the site and link to it. The project says it is not affiliated with Sonicake.
