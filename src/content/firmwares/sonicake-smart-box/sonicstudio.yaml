distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or Brave, connect by USB or Bluetooth and allow MIDI with SysEx. On iPad or iPhone
  the README suggests the Bluefy or WebBLE browsers with Bluetooth. Back up the presets from the page before saving.
  Self-hosting uses Docker and needs the vendor library files described in backend/README.md.
