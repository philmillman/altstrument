name: SonicStudio
summary: >-
  Progressive web app that edits Sonicake multi-effects pedals over Web MIDI or Web Bluetooth. It manages the 100 presets, signal chain, user NAM and IR slots, with a TONE3000 library browser, share links, setlists and tools, plus a Flask service that converts NAM files.
description: >-
  The repository description names the Smart Box (QME-20); STRUCTURE.md says the web app is for the Sonicake multi-effects
  range, with the QME-20 and the Pocket Master as the reference hardware. The page edits the nine-block chain with A and
  B comparison and undo, reads and writes the 50 user and 50 factory presets, exports and imports .prst and JSON banks
  and sends NAM and IR files into the pedal's five NAM and five IR slots. TONE3000 captures come through that service's
  public API after you sign in, and shared bundles carry only a reference to a capture. A Flask backend converts a NAM
  file to the clone amp model the pedal accepts; it needs Sonicake's proprietary library, which the repository does not
  contain and which you extract from the vendor's own app. The site also has a tuner, drum machine, backing track
  player and a live stage mode. The author's testing is on a QME-20. docs/PROTOCOL.md documents the framing and
  commands. Nothing is flashed.
