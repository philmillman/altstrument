device: sonicware-liven-bass-and-beats
name: Wavetable Converter (official)
kind: tool
summary: Sonicware's browser page that converts a WAV into a named wavetable .syx file for the LIVEN BASS&BEATS. Closed source.
description: >-
  The page takes a dropped WAV and a wavetable name and offers a SysEx file to download, which is then sent to the synth with a general
  SysEx tool. This is first-party software, not custom firmware. A community script in this directory does the reverse conversion.
