    url: https://github.com/alarky
source: https://github.com/alarky/liven-bassandbeats-wavetable-alt-converter
source_status: open
license: unspecified
license_notes: The repository has no licence file or statement. The files under original/ are Sonicware's.
distribution: source-only
install_notes: >-
  Clone the repository and run node deconvert.js with an input .syx and an output path.
brick_risk: false
