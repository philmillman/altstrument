device: sonicware-liven-xfm
name: XFM Web Editor
kind: tool
summary: Browser patch editor for the LIVEN XFM that receives the current patch over MIDI SysEx and sends changes back. It has knobs and envelope graphs for all four operators, JSON and SYX import, a randomizer, copy and paste between operators and MIDI CC mapping.
description: >-
  After the XFM is put in Edit mode and its MIDI export is triggered, the page receives the patch and shows each operator's level, ratio,
  detune, feedback, modulation inputs and envelope, with draggable envelope points, a pitch envelope switch and scaling
  controls. Changes are sent to the synth as SysEx, and a patch can be saved as JSON, or a JSON, single-patch SYX, bank or full
  backup file dropped on the page to load a patch from it. A mapping view assigns MIDI controller CCs to on-screen controls
  and saves the mappings as JSON. The author converted parts of Cliff Lawson's Python XFM editor to TypeScript and reads and writes the same JSON structure.
  Undo and the randomizer are marked as unfinished. Nothing is flashed.
status: dormant
authors:
