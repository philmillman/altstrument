    url: https://github.com/aesqe
source: https://github.com/aesqe/sonicware-liven-xfm-web-editor
source_status: open
license: MIT
homepage: https://aesqe.github.io/sonicware-liven-xfm-web-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in a browser with Web MIDI, connect the XFM's MIDI IN and OUT ports to the computer, choose them in the
  header and switch the XFM to Edit mode. Changes made on the synth only appear in the editor after MIDI EXPORT is pressed on it.
brick_risk: false
