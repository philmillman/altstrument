distribution: download
install_notes: >-
  Copy the update file for your device to the root of the SD card, keeping its name, put an app package at
  /ENAGA/APPS/<NAME>/APP.ENA, hold the fourth key of the upper function row (F4) while switching on to reach BOOT MODE and
  choose SYSTEM UPDATE. F1 + POWER opens the Enaga menu. The README says the Lofi-12 XT and CyDrums files are untested and
  should only be tried by someone prepared to restore the unit with its official update. To go back, install an official
  system update the same way.
brick_risk: false
tags: [app-platform, sdk, dsp, synth, sampler, midi, cpp]
versions:
  - version: 0.3.0
    date: 2026-11-24
    url: https://github.com/seawaffle/enaga/releases/tag/v0.3.0
    notes: Adds a USB DRIVE mode that shows the SD card to a computer and USB audio in and out with no driver, plus battery support, SYNC polarity settings and more UI toolkit parts. USB drive, audio and MIDI were tested on a SmplTrek with Windows 11; battery, SYNC polarity and the new screens on the emulator only. USB now connects at full speed, and apps must be rebuilt for 0.3.0.
  - version: 0.2.0
    date: 2026-11-21
    url: https://github.com/seawaffle/enaga/releases/tag/v0.2.0
    notes: Adds MIDI on the DIN jacks and over USB with test USB IDs, clock and sync in and out, input selection, pad pressure, a UI toolkit, app icons and an SDK zip with a Linux toolchain. The notes say everything new was tested on the emulator only, that update files again cover the SmplTrek, Lofi-12 XT and CyDrums with only the SmplTrek tested, and that apps must be rebuilt for 0.2.0.
  - version: 0.1.0
    date: 2026-11-20
    url: https://github.com/seawaffle/enaga/releases/tag/v0.1.0
    notes: Update files for the SmplTrek, Lofi-12 XT and CyDrums; only the SmplTrek has been tested.
