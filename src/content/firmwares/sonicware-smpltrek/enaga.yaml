device: sonicware-smpltrek
also_devices: [sonicware-lofi-12-xt, sonicware-cydrums]
name: Enaga
summary: Unofficial replacement firmware for the SmplTrek that runs apps written in C++ from the SD card, with a DSP library, file, MIDI and clock services and a synth example. Update files are also built for the Lofi-12 XT and CyDrums but untested there.
description: >-
  Enaga replaces the system software and starts an app from the SD card, handing it the pads, keys, encoders, the 128 x 128
  grey display, a real-time audio callback, MIDI over DIN and USB, a tempo clock and SD card access. An app is a C++20 program
  built with a TI C6000 cross-compiler; a crash or a stuck call is caught by a watchdog and the Enaga menu stays available.
  The menu switches between installed apps and holds volume, brightness, pad sensitivity, auto-off and speaker settings. The
  repository includes a DSP library with oscillators, filters, envelopes, delay, chorus and reverb, a minimal tone example and
  an eight-voice virtual analogue synth example. The Lofi-12 XT and CyDrums are described as the same board with different
  panels, and the build makes an update file for each, but the README says it has only run on a SmplTrek and the other two
  files are untested. The app interface is provisional until 1.0. The author states that the project contains no Sonicware code
  and does not modify the bootloader or the original sounds in flash. Hardware facts come from the author's separate
  smpltrek-re project.
status: active
