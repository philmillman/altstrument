device: sony-hr-gp5
name: HR-GP5 Rosetta OS
summary: Patch kit that adds a Hex girl boot animation, a ROSETTA menu and a 15-voice polyphonic synth and sampler on the TMS57002 DSP to the HR-GP5 and HR-MP5, built from a dump of your own EPROM.
description: >-
  The tools take a dump of the unit's firmware EPROM, patch it on a PC and write
  an image for a new chip. The boot patch plays a 45-frame animation of the
  project's mascot on the LCD before the stock screen. The fuller Rosetta OS strips
  the factory presets to free page 0, adds a ROSETTA menu with settings kept in
  battery RAM, an LFO that can drive any parameter of any block, and input
  meters, and replaces Sony's DSP program while its sampler page is open. That
  page plays 8 interpolated or 15 nearest-sample voices from a synthesised
  oscillator or a 1.5 second recording, with bit depth, sample rate and glitch
  controls, and can be driven over MIDI. A separate HR-MP5 build is made from the
  same source. A boot animation of your own can be made from any 228 by 40 GIF.
  The README says the project has no Sony code, includes an H8/500 emulator that
  boots the real firmware for tests, and credits Claude, an AI assistant, with
  the reverse engineering and tool code. Some items are marked as tested only in
  the emulator or still being researched.
