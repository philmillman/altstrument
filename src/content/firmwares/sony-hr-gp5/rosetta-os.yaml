license: MIT
license_notes: >-
  The GitHub licence field shows NOASSERTION because the LICENSE file is MIT plus
  a note that tools/h8500dis.py, a port of MAME's H8/500 disassembler, stays under
  BSD-3-Clause. The README says the repository holds no Sony code or ROM data.
homepage: https://yuyoi.github.io/Sony-HR-GP5-Rosetta-OS/
distribution: patch-your-own
requires_stock: Ver1.03E
install_notes: >-
  Dump the 128 KB EPROM of your own unit; the tools accept only Ver1.03E and
  check the MD5. Run the build script, burn the resulting image to a 27C1001
  or an SST39SF040 (the four-times image), and swap the chip in the stock
  socket with the notch the same way round. Keep your original EPROM, since
  putting it back returns the unit to stock. A second audio input on the HR-GP5
  needs extra wiring changes.
