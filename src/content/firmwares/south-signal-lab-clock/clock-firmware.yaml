device: south-signal-lab-clock
name: CLOCK firmware
summary: South Signal Lab's source-available firmware for its CLOCK module, with clock, Euclidean and sequencer channels, grooves with a custom editor and TAP recording, pre-count, assignable inputs, presets and a desktop simulator.
description: >-
  Licence note: the source is under PolyForm Noncommercial 1.0.0, so the README calls it source-available and not open source.

  The firmware runs three topologies: One Clock, Independent channels, and a Divider Bank. Each of the eight channels can be
  off, a clock, a Euclidean pattern of up to 64 steps, or a sequencer. Tempo ranges from 20 to 999 BPM by default, and the module always starts
  stopped. Version 1.1.0 adds factory swing and pocket grooves, a custom groove editor with ten named slots and TAP
  recording, an optional pre-count and configurable roles for the two inputs. State is kept as one current setting
  plus eight presets with checks, in a flash layout that normal updates leave alone. The repository also holds a native
  SDL simulator, host tests, a manual and an experimental VCV Rack build of the same runtime. Five release images differ only
  in the Easter-egg game shown at boot.
