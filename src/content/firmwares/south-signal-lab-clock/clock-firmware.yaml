homepage: https://southsignallab.com/hardware/clock/
distribution: download
install_notes: >-
  Download a .dfu image from the release for a module that already runs CLOCK, and update it over USB DFU as described in
  docs/FIRMWARE_UPDATE.md; settings and presets are kept. A new or non-booting Black Pill is programmed through an ST-LINK on
  the SWD pins, which the guide gives as the recovery route. Disconnect the Eurorack ribbon cable before connecting USB, because
  the two power sources must not be joined.
brick_risk: true
