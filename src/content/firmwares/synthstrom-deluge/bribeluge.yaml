distribution: download
install_notes: >-
  Copy the .bin from the repository's firmware folder to the SD card root,
  remove any other .bin files there, then hold Shift while powering on. Install
  an official firmware the same way to go back. Optional Cycles and LXR kit
  presets are copied into KITS folders on the card. Back up the SD card first.
brick_risk: false
