    notes: No tagged releases; this is the latest commit, which the README and commit message call v1.29. Since v1.24 it adds the BRIBERING MODE resonator engine, a synth browser, selectable crush types, the BROPHET poly engine and knob button LEDs for shortcut pads. The BRIB synth type is renamed BRINGS, so its preset folder is now SYNTHS/BRINGS.
