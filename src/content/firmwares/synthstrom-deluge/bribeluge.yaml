device: synthstrom-deluge
name: BRIBELUGE
summary: Fork of the community firmware 1.3.0 that adds alternative swing styles, kit pattern mode, autofill, a mono sequencer, Endless Record and drum synth engines (LXR-02, Model:Cycles-style, GIN and a 303 voice), plus delay feedback and tone, saturation and sample start offset.
description: >-
  Built on the Deluge Community Firmware, moved from its 1.3 beta to the final
  1.3.0 in v1.23, with the changes shipped as one patch in the repository and a
  prebuilt .bin.
  Besides the sequencing additions, it adds drum synth engines selectable per
  kit row, taken from the LXR-02 firmware, an open-source Model:Cycles engine
  set, GIN and Open303, with preset kits for the LXR and Cycles voices. The
  sample start offset is ported from the Owlet fork. Songs saved with the new
  features may not load the same elsewhere. The README calls the build
  experimental and says it was tested on a 7-segment Deluge, with the OLED
  screens written but not tried on hardware. The repository was a few days old
  when this entry was written; by v1.22.2 the README also lists an Affect all
  snapshot for LXR, Cycles and GIN kits, Pad Guides that light up each drum
  synth's setting pads, a synth picker offering Deluge, DLFM or DX7, a
  setting for the kit and synth that new tracks start as, ULTRAKIK, a kick
  engine with sixteen presets, a DIRT filter for the 303 voice, and Gate out,
  which plays a kit's bottom four rows from the Deluge's gate outputs. v1.23
  adds MIDI kits, a CV 2 lock per step, an Elektron-style parameter lock
  setting and track-type animations in song view. v1.24 adds a LOOP track type
  for using the Deluge as a MIDI looper, and an ECHO setting on MIDI tracks that
  stops received notes being sent straight back out. v1.25 to v1.29 add
  BRIBERING MODE, a resonator engine after Mutable Instruments Rings, a synth
  browser with wavetable presets, a Feedback control on every synth, selectable
  crush types for Bitcrush and Decimation, BROPHET, a two-oscillator poly engine
  from the Pro-54 port of Pro-53 with its filter available as an LPF type, and
  shortcut pads that blink the button LED of the matching gold knob.
