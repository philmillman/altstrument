device: synthstrom-deluge
name: Deluge Community Firmware
summary: Community-developed Deluge firmware, hosted by Synthstrom Audible. Adds a DX7-style FM engine, compressor, audio export, velocity view, chord keyboards, custom scales and many UI and sequencer changes.
description: >-
  Synthstrom Audible open-sourced the Deluge firmware and this repository is
  where development continues. Stable releases are named after composers and
  musicians; the latest is 1.3.0 (Derbyshire), published on 2026-11-04 after
  three release candidates. It adds two more LFOs and envelopes, new effects
  such as a warbler and a dimension effect, an expanded arpeggiator, note
  probability and iteration editing, pattern save and load, horizontal OLED
  menus and tighter MIDI clock. Version 1.2.0 added DX7 emulation, a compressor
  blend control, multi-track audio export, velocity automation and a velocity
  view, chord keyboard layouts, custom scales and tempo automation in arranger
  view. Nightly beta builds are published on the repository's beta release
  page; they may contain bugs.
