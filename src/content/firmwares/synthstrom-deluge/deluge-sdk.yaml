device: synthstrom-deluge
name: deluge-sdk
kind: tool
summary: Rust SDK and board support package for writing your own async apps for the OLED Deluge on Embassy. Gives access to the display, pads, buttons, encoders, LEDs, audio, CV/gate, MIDI and SD card, with cargo deluge tooling and a desktop simulator.
description: >-
  Apps are ELF files loaded into RAM by an on-device app loader. The loader is
  installed through the normal firmware update path and can be replaced by the
  official or community firmware again. Apps load from /APPS/ on the card or
  are pushed over USB in development. The repository also has Wren scripting,
  USB audio and Overbridge classes, and a controller firmware. 7-segment
  units are not supported. The first developer preview, v0.1.0, shipped a
  prebuilt app loader that does not boot on a Deluge with the stock bootloader; v0.1.1 fixes this.
  The API may change in minor releases before 1.0. An earlier experiment
  by another developer, m-m-adams/deluge-rs, stopped at hello-world stage.
status: active
authors:
  - name: Katherine Whitlock
    url: https://github.com/stellar-aria
source: https://github.com/FirestormAudio/deluge-sdk
source_status: open
license: MIT
license_notes: >-
  SDK and core crates are MIT OR Apache-2.0. The OLED UI toolkit, fonts and
  pad-grid crates are GPL-3.0-or-later.
distribution: download
tags: [sdk, rust, alternative-os, simulator]
versions:
  - version: v0.2.0
    date: 2026-11-09
    url: https://github.com/FirestormAudio/deluge-sdk/releases/tag/v0.2.0
    notes: Rebuilds the app loader on the SDK so it can run from a boot slot behind a stage-0 loader as well as from the stock bootloader, with a self-update from the card. Adds a watchdog and fast-read driver, a stage-0 install image, and a breaking change to the boot-slot layout; boot-region protection is off by default.
  - version: v0.1.1
    date: 2026-11-08
    url: https://github.com/FirestormAudio/deluge-sdk/releases/tag/v0.1.1
    notes: Fixes the app loader, which crashed at every power-on with the stock bootloader in v0.1.0. Also fixes MIDI 2.0 on Linux and black encoder counting, and adds clock output control, support for more than one USB-MIDI device and a flash-protection crate.
  - version: v0.1.0
    date: 2026-11-06
    url: https://github.com/FirestormAudio/deluge-sdk/releases/tag/v0.1.0
    notes: First developer preview; its app-loader.bin does not boot with the stock bootloader, so use v0.1.1. Covers the async SDK, cargo deluge tooling, the app loader with an optional bootloader write protection, board support, USB classes, the RZ/A1 chip crates and the desktop simulator; the API is not stable before 1.0.
