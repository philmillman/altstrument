device: synthstrom-deluge
name: DelugeLite
summary: Early performance-focused fork of community firmware main that aims for more voices and samples by freeing RAM and CPU. So far adds a voice-stealing crash fix, a configurable audio block size and a 7-segment-only build.
description: >-
  The 7-segment-only build compiles out the OLED code to gain fast heap, and
  shows nothing on an OLED unit. The repository also carries notes on the
  Deluge hardware and firmware architecture. It is based on upstream main from
  2026-10-08. There are no releases or prebuilt files, and the project's own
  change ledger lists every change as not yet verified on hardware. The
  default branch is a Claude Code session branch and commits are authored by
  the assistant.
