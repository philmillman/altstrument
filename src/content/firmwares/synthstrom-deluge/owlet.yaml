device: synthstrom-deluge
name: Owlet
summary: Sound-design fork of the community firmware's 1.3 development line. Adds bounce in place, a lookback sampler, resampling source selection, new oscillators and effects such as Scatter, Featherverb and a multiband OTT, plus macros.
description: >-
  Owlet tracks the upstream community firmware main branch and merges it
  regularly. Its own additions include sound cloning, gate sample mode, loop
  crossfade and ping-pong, a plockable sample start offset, a unison-index
  modulation source, MIDI Follow CC presets, the Phi family and other new
  oscillators, and effects including Disperser, Eroder, a sine shaper and a
  table shaper. Horizontal menus must be turned on. Songs that use Owlet
  features are not expected to load the same way on other firmware. The README
  says new feature work has moved to a separate repository, DelugeFirmware-talon,
  which was not public when this entry was written; this repository still gets
  releases and fixes.
status: active
