device: synthstrom-deluge
name: patch-press
kind: tool
summary: Command-line pipeline that renders VST and CLAP plugin presets, or takes sample libraries and Bitwig multisample archives, and writes ready-to-load Deluge SYNTH and KIT XML with a SAMPLES tree. Also exports Polyend Tracker and 1010music Bento formats.
description: >-
  Detects loop points and handles velocity layers and round robins. Deluge
  output uses the 4.1.x XML format that community firmware also reads, and WAV
  headers are rewritten into a form the firmware accepts. It needs Python 3.14
  and a C++/JUCE toolchain for the companion patch-render tool, on Linux or
  macOS, and is installed from a clone. The repository includes AI assistant
  configuration.
status: active
