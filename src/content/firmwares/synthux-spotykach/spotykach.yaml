device: synthux-spotykach
name: Spotykach (official firmware)
summary: "Synthux's open-source firmware for the Spotykach: two stereo looper decks with reel, slice and drift modes, grit and flux effects, SD card tapes, clock sync and USB MIDI."
description: >-
  The firmware that ships on the Spotykach. Each deck records into a buffer of
  about 42 seconds and plays it back in reel, slice or drift mode, with grit and
  flux effects at the end of the deck chain. Tapes can be saved to and loaded
  from the SD card. Releases have added USB MIDI control (1.2.0), MIDI CC for
  play, reverse and record (1.1.0) and a clocked delay for the flux effects
  (1.3.0). Version 1.4.0 adds USB file transfer, used by the project's web-based
  Spotykach Manager, and a setting for the default grit mix. Early pre-release
  builds are kept in the archived spotykach-firmware repository, and newer
  builds, including betas, are published in the main repository's releases.
status: active
