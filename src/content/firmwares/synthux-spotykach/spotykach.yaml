source: https://github.com/Synthux-Academy/Spotykach
source_status: open
license: MIT
homepage: https://synthux.academy/spotykach/manual
distribution: download
install_notes: >-
  Download the .bin from the releases page (or build it with make) and flash it
  over the rear USB-C port of the main PCB, not the Daisy Seed's port. Hold
  Reset for about three seconds until the lights under the bottom pads breathe
  white, then run make program-dfu or use dfu-util. The repository README warns
  that a failed flash can temporarily brick the unit and require reinstalling
  the bootloader, the firmware or both. Synthux's firmware page also lists
  the releases.
tags: [official, looper, granular, sampler, midi, open-source, daisy-seed]
