source: https://github.com/Synthux-Academy/AudreyTouch
source_status: open
license: MIT
homepage: https://www.synthux.academy/firmware
based_on: synthux-audrey-ii/audrey-ii
distribution: download
install_notes: >-
  Flash AudreyTouch.bin from the latest release with the Daisy Seed web
  programmer (flash.daisy.audio) or Synthux's firmware page. The README
  advises starting with the knobs fully counter-clockwise and raising the
  excitation amount and input gain slowly.
