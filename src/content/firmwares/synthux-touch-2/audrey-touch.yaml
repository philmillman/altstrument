device: synthux-touch-2
name: Audrey II Touch
summary: "Port of the Audrey II feedback horrorscape synth to the Touch 2: a Karplus-Strong feedback loop excited from the pads or external audio, with an official faceplate and MIDI CC map."
description: >-
  Audrey II Touch excites a feedback loop to create drifting drones, and it
  can also be driven by external audio (left input channel) as an effect on
  drum loops, melodies or voice. Knobs set the excitation threshold, input
  gain, dry/wet, reverb size and low-pass and high-pass filters, and pads
  P03 to P09 excite different frequencies. The repository includes a manual
  with the MIDI CC map and a faceplate design, and Synthux sells the matching
  Audrey II Touch faceplate separately.
status: active
