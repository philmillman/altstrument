device: synthux-touch-2
name: Simple Touch labels
kind: tool
summary: >-
  Browser library of control maps and manuals for Simple Touch firmwares, with a panel-diagram designer, a Play mode that runs a firmware in the page or connects to a real Simple Touch over Web MIDI, and an Upload to device page that flashes a release to a Daisy over WebUSB.
description: >-
  Rights warning: the LICENSE says the original Simple Touch panel artwork stays with Synthux Academy and is outside the MIT terms. The shipped
  panel_blank.svg is described as the Synthux panel drawing with a blank faceplate.

  The library lists reference control maps with Synthux, libDaisy and Pd names, manuals for TouchBass, Touch FX, Touch String,
  Audrey II Touch and TouchBloop, and the Simple Touch entries of the Synthux community directory, whose labels are read from each firmware's
  repository README, grouped under Official, Community and DIY wiring tabs. The designer sets labels, modifier layers, switch modes, notes, MIDI assignments and a theme,
  saves a JSON label file, and exports a repository kit, a standalone manual page or a Pages site. Play runs a firmware built for the simple-touch-web runtime
  inside the page, with Web MIDI input and output attached to the emulated device. The Connect to Simple Touch mode reads and
  writes a real board over Web MIDI instead, with no firmware in the page: a label file with a device block gets settings
  and presets, and a live section draws the board's pads, knobs, OLED and mode labels on the panel diagram, with the
  drawing's knobs and pads moving the board. Newer commits also add held-together modifiers such as P10 and P11, all-caps and
  OLED placement per layout, and a desktop faceplate. Upload to device pulls the .bin of a firmware repository's latest release, reads where it runs from, checks which DFU mode the Daisy is in and writes it with the vendored Electrosmith Programmer code over WebUSB; for firmware that needs the Daisy bootloader it can also write libDaisy's v6.4 bootloader to internal flash. No Simple Touch has to be connected to use the library and designer.
status: active
authors:
  - name: Jon Waterschoot
    url: https://github.com/jonwaterschoot
source: https://github.com/jonwaterschoot/simple-touch-labels
source_status: open
license: MIT
license_notes: >-
  The LICENSE text excludes the original Simple Touch panel illustrations (assets/panel_full_bartali*.svg) by Roey Tsemah of Synthux
  Academy, adapted from Fabio Bartali's web manual. Those files are not in the repository's current tree.
homepage: https://jonwaterschoot.github.io/simple-touch-labels/
distribution: browser-installer
install_notes: >-
  The library and designer write nothing to a device. Open the hosted page in a browser; the Connect mode needs Web MIDI and a Simple Touch plugged in. Upload to device flashes a chosen firmware's release .bin, and optionally the libDaisy bootloader, over WebUSB in Chrome or Edge with the Daisy in the matching DFU mode; the page reads the mode first and writes nothing if it does not fit the firmware. The Daisy's built-in system DFU stays available for recovery. The pages need to be served over HTTP, so use a local server when running a copy.
brick_risk: false
tags: [editor, reference, web, web-midi, emulator]
