device: synthux-touch-2
name: TouchTemplate
kind: tool
summary: >-
  C++ hardware library and starter project for writing Daisy Seed firmware for the Synthux Touch 2. It wraps the pads, knobs, faders and switches in one Touch class, and has four examples including a USB MIDI controller with a browser debugger.
description: >-
  The library reads the twelve capacitive pads as pressure values, the six knobs and two faders with smoothing and pickup, and the two three-position
  switches, using the Touch 2 pin layout from the README's board diagram. The repository includes a blank template and four examples:
  a hardware test, a simple synth, a USB MIDI controller with CC and aftertouch output, and an audio effect. The
  USB MIDI example comes with a single-page Web MIDI viewer that shows the controls and logs events. libDaisy and DaisySP are
  git submodules, and the build and DFU flash use the usual make targets.
status: active
authors:
  - name: Vincent Maurer
    url: https://github.com/vincentltm
source: https://github.com/vincentltm/TouchTemplate
source_status: open
license: MIT
homepage: https://github.com/vincentltm/TouchTemplate#readme
distribution: source-only
install_notes: >-
  Clone with submodules, run make libs and make, then flash with make program-dfu after putting the Daisy Seed in DFU
  mode (hold BOOT, tap RESET, release BOOT). The Web MIDI viewer is a local file that needs Chrome or Edge.
brick_risk: false
