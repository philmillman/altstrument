install_notes: >-
  Open the hosted editor in a Web MIDI browser and allow MIDI with SysEx access, then pick the FireworX input and output
  ports if automatic discovery cannot. Only one program should control the unit at a time. Treat storing as unproven: the
  author lists full qualification as pending.
