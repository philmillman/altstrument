device: tc-electronic-fireworx
kind: tool
name: FireworX Studio
summary: Browser editor and librarian for the TC Electronic FireworX over Web MIDI SysEx, built on the MIDI Studio platform. It edits blocks, routing and modulation links, keeps a preset library and can store to the User bank or card. It is an alpha for OS 2.00 and newer.
description: >-
  The editor reads the unit's live status with two matching reads before it allows editing, then offers a hardware-style and
  a modern view, the routing and signal matrix, block settings, decoded modulation links and MIDI Learn. It has a local
  librarian with progressive bank reads and JSON and SysEx export, seeded random variations with a rough DSP budget estimate, and temporary
  writes that are compared with a read-back. Storing to the User bank or card backs up the destination and verifies it, but the
  author says hardware qualification and retention after a restart are still pending. Some data is preserved without being decoded, including packed User
  dumps. The repository is a clean snapshot with no vendor manuals, and its test dumps are synthetic. English and French,
  with an illustrated manual. Nothing is flashed.
