device: tc-electronic-m-one
name: M-One Rack Screen and OS Mod
summary: An ESP32-S3 wired to the M-One's DSP debug port loads its own effects into DSP RAM and drives a colour screen as the front panel, with distortion, reverse delay, vocal effects, amp and pedal models and a synth.
description: >-
  The ESP32-S3 connects to the DSP56362's JTAG and OnCE header, halts the core,
  reads and writes its memory and starts new programs placed in internal P RAM.
  The programs are Python scripts that generate DSP machine code, and a reload
  takes about ten seconds without flashing anything. A kernel holds each effect as
  a subroutine and routes one or two of them in single, double or series mode.
  The ESP32 draws a 240 by 240 screen with a 3D mode ring, FX, tuner and system
  pages, takes the panel's buttons, pots and encoder, and supports WiFi serial and
  OTA updates. The README marks passthrough, distortion, heavy distortion, reverse
  delay and the pedal board as heard on hardware, most vocal effects, presets and
  the amp as run with the outputs muted, and the synth as simulated only. If a
  program crashes, a power cycle returns the unit to TC's firmware. The author
  credits Claude, an AI assistant, with the code and reverse engineering.
status: active
authors:
