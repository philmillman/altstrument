    url: https://github.com/yuyoi
source: https://github.com/yuyoi/M-one-rack-screen-and-os-mod-
source_status: open
license: MIT
license_notes: Covers the repository only. The README says no TC Electronic code or ROM data is included; the DSP opcode table is fetched at build time from a separate GPL-3.0 project.
distribution: source-only
install_notes: >-
  Needs opening the unit and wiring six wires from an ESP32-S3 to the DSP's J8
  header, plus the display and panel wiring in the user guide. Flash the
  repository's sketch, fetch the opcode table, power the M-One on normally and load
  an effect from a PC or the ring menu. The tools write nothing to the unit's own
  flash, and TC's firmware still does the clock setup. Power-cycling returns the
  unit to stock. The README asks that dumps and listings of your unit's flash are not shared.
brick_risk: false
tags: [fx, esp32, ui, synth-engine, research]
