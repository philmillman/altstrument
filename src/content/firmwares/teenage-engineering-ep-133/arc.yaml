install_notes: >-
  Open the hosted app in Chrome or Edge and allow MIDI; adding ?demo to the
  address uses a simulated device. Safari and iOS browsers cannot reach the
  device. Keep the tab in front during transfers. The Android build is made from
  source or from CI artefacts.
