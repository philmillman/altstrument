device: teenage-engineering-ep-133
also_devices: [teenage-engineering-ep-40]
name: ep-133-project-export
kind: tool
summary: Independent fork of the EP-133 Export to DAW browser app that adds Ableton Live 10 export, recorded fader automation and a hybrid Drum Rack layout. No hosted copy; it is built from source.
description: >-
  A copy of phones24's EP-133 Export to DAW, listed in this directory as EP-133
  Export to DAW, with its own commits. It reads projects from an EP-133, EP-1320
  or EP-40 over Web MIDI, or from a .pak or .ppak backup, and exports Ableton
  Live, DAWproject, REAPER or MIDI files with samples. The changes described in
  its README are native Live 10 project output beside Live 11 and later,
  decoded recorded fader automation (except time, attack and release), and
  Ableton export that builds one Drum Rack per group for single-pitch pads while
  keeping chromatic pads as MIDI tracks. Its README no longer lists the
  upstream FastTracker 2 export. It still points to the upstream hosted site for
  trying the app.
