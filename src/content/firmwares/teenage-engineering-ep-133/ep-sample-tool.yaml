device: teenage-engineering-ep-133
also_devices: [teenage-engineering-ep-40]
name: EP Sample Tool
kind: tool
summary: Teenage Engineering's own browser app for uploading, downloading and deleting samples on the K.O. II, and for restoring the factory sounds. It talks to the device over Web MIDI. Closed source.
description: >-
  First-party software hosted on Teenage Engineering's site. The page text
  describes sample management and factory sound restore, and the app's bundle
  recognises the EP-133, EP-1320 and EP-40 by product code and draws each
  panel. Several tools in this directory document its SysEx file protocol, and
  they read the .pak and .ppak backups it makes. This is first-party software, not
  custom firmware, and no source is published.
status: unknown
authors:
  - name: Teenage Engineering
    url: https://teenage.engineering/
source_status: closed
license: proprietary
license_notes: No licence terms were found on the page.
homepage: https://teenage.engineering/apps/ep-sample-tool
distribution: browser-installer
install_notes: >-
  Open the page in a Chromium browser with Web MIDI, connect the device over USB
  and allow MIDI access. Community tools that use the same ports cannot run at the
  same time.
brick_risk: false
tags: [official, librarian, sample-transfer, web-midi, samples, web]
