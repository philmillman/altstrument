device: teenage-engineering-ep-133
name: EP-133 K.O.II MIDI CTRL
kind: tool
summary: Single-file web page that detects an EP-133 over Web MIDI and offers a pitch bend and mod wheel panel, a MIDI clock monitor, a 16-step sequencer, a pad keyboard for note groups A to D and a MIDI log. A settings sheet is reference only. A SysEx protocol document sits alongside.
description: >-
  One index.html with no dependencies. The Live tab sends pitch bend and mod
  wheel and shows the BPM and beat grid of clock from the device; the sequencer
  plays 16 steps on a chosen channel; Keys mode plays the device's pads as a
  chromatic keyboard across the four groups (notes 36 to 83). The Config tab only
  lists settings to change on the hardware itself. The page requests MIDI access
  without SysEx and does not transfer files. PROTOCOL.md separately documents the
  file-transfer SysEx format with command tables. The README is in Spanish and
  credits punk_bit, while the repository belongs to drullandev.
status: active
