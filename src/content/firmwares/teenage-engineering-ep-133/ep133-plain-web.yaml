license: unspecified
license_notes: The repository has no LICENSE file and the README states no terms.
distribution: source-only
install_notes: >-
  Download or clone the repository and open index.html in Google Chrome, then
  allow MIDI access. No hosted copy was found. Set MIDI clock to Clock Out on the
  device if you want the clock panel to show tempo.
brick_risk: false
