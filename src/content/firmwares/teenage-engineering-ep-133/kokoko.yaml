device: teenage-engineering-ep-133
also_devices: [teenage-engineering-ep-40]
name: kokoko
kind: tool
summary: Native SwiftUI sample manager for iPad and Mac that talks to an EP-133 over USB-C through CoreMIDI. It lists, previews, adds, renames, moves, edits and deletes sounds with a recycle bin, and backs up and restores sounds and projects. A text-style interface.
description: >-
  Built for iPadOS, which has no Web MIDI. It finds the device, shows its serial
  and OS version, lists sounds by slot, converts audio to the device format,
  draws waveforms with loop points, edits root note, pitch, envelope and play
  modes, and moves, swaps or bulk-moves slots. Deleted sounds go to a recycle
  bin before removal. Projects download and upload as .tar archives. The wire
  protocol is documented in docs/protocol.md from published tool bundles and
  probing of a device. The README says only device discovery, listing, metadata
  reading and sending, reading back and deleting a file were checked on an
  EP-133 on OS 2.5.1, and that the EP-1320 and EP-40 it lists are unchecked.
