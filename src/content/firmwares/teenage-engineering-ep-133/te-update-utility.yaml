device: teenage-engineering-ep-133
also_devices: [teenage-engineering-ep-40, teenage-engineering-op-xy]
name: update utility
kind: tool
summary: Teenage Engineering's own browser firmware updater. It finds a connected device over Web MIDI and installs TE's firmware from TE's site. Closed source.
description: >-
  First-party software hosted on Teenage Engineering's site. The app's bundle
  lists the EP-133, EP-1320, EP-40, EP-35, EP-127, EP-136, OP-XY, TP-7, TX-6 and
  CM-15 by product code, and the OP-XY downloads page points to it as the MIDI
  updater. This only installs Teenage Engineering's stock firmware, and no source
  is published.
status: active
authors:
  - name: Teenage Engineering
    url: https://teenage.engineering/
source_status: closed
license: proprietary
license_notes: No licence terms were found on the page. The firmware it installs is Teenage Engineering's own, served from its own site.
homepage: https://teenage.engineering/apps/update
distribution: browser-installer
install_notes: >-
  Open the page in a Chromium browser with Web MIDI, connect the device over USB
  and allow MIDI access with SysEx. Teenage Engineering's support site has a setup
  guide for the EP-133 on Windows 11.
brick_risk: false
tags: [official, web-midi, sysex, usb-midi, updater, web]
