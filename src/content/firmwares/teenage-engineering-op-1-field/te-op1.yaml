install_notes: >-
  On Windows, unzip the Potion release anywhere and run potion.exe with mondo.exe
  beside it; the app is unsigned, so SmartScreen may warn. Or build mondo with
  build.bat (MSVC) or the repository's master-control.sh build script, and
  Potion with desktop/build.bat. The device-copy and backup subcommands are Windows only; the OP-1
  Field appears over USB as an MTP device.
