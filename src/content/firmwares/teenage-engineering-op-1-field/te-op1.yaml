device: teenage-engineering-op-1-field
name: te-op1
kind: tool
summary: Patch file format reference for the OP-1 Field with mondo, a C toolkit that dumps, builds, checks and sorts patch files and backs up or restores the device on Windows, Potion, a Windows desktop app for the same jobs, plus a web patch library and editor.
description: >-
  Documents the OP-1 Field preset .aif format and its knob layouts, and ships
  mondo, a single-source C program with subcommands to dump a patch to JSON,
  build a loadable .aif from JSON, test a file against the format, diff two
  patches, tag and sort them, and wrap audio as a sampler patch. On Windows,
  mondo can also copy files to a connected OP-1 and pull or push a full device
  project folder. Potion, a Windows desktop app that grew out of mondo's GUI, does
  this without a terminal in six tabs for projects, a patch editor, packs,
  transfers between archive, project and pack folders, mixdowns and search, and
  runs mondo for backups and restores. The same repository contains the source of a web patch
  library and in-browser patch editor. Written against OP-1 Field firmware 1.7.3,
  so it targets the OP-1 Field rather than the original OP-1.
