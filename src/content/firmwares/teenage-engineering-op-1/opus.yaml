device: teenage-engineering-op-1
name: Opus
summary: Mod suite for the original OP-1's R246 firmware, built in a browser patcher from the user's own image, with new synth engines and effects, scales and chords, tape undo, a menu, themes and 100 sampler presets.
description: >-
  Opus 1 adds a dimension synth engine and a guitar amp engine with a tuner, bitcrush, chorus, plate reverb and
  overdrive effects, pitch bend, scale and chord modes, undo and redo on tape, preset renaming and overwrite saving, user
  colours, themes and a start-up picture, and a menu with a CPU meter, diagnostics and a MIDI monitor. A cleaner in the
  menu prepares saved sounds for stock firmware or another mod and keeps a copy of what it changes. Opus 2 is in public beta
  as a pre-release: a small core that loads plugins, .opmod files copied to a mods folder on the OP-1's disk, with a
  starter pack of 25 plugins that includes Opus 1's features and a bridge for op1r and Hundekraft engines and sequencers. The
  patcher runs in the browser and checks the input and output hashes. The GitHub repository holds documentation and
  the plugin kit, and the update file, the plugins and the patcher's data are not published as source. The project is hobby work, independent of Teenage Engineering.
status: active
authors:
  - name: LizardMan
    url: https://github.com/LizardMan245
source: https://github.com/LizardMan245/opus
source_status: patcher-only
license: proprietary
license_notes: >-
  The repository (documentation and the plugin kit with four example plugins) is GPL-3.0. The Opus 1 firmware
  update and the patcher's data are stated to be copyright LizardMan, all rights reserved for now, with a request not to
  share them and to link to the site instead.
homepage: https://opus-op1.pages.dev/
distribution: patch-your-own
requires_stock: R246
install_notes: >-
  Make the update in the browser patcher from your own official op1_246.op1; nothing is uploaded. Switch the OP-1 off,
  hold COM while switching on, press 1 in the TE-BOOT menu, then copy op1_246_opus.op1 onto the OP-1 disk and eject. The
  bootloader is not changed, so flashing the stock image restores the original. Run the menu's cleaner before going
  back to stock or another mod, because stock stops on a sound that names an unknown effect. The known issues list says
  a custom start-up picture only shows on one of the three screen types.
brick_risk: false
tags: [platform, synth-engine, fx, ui, chords, scales, tape, web]
versions:
  - version: 2.0-beta.4
    date: 2026-11-08
    url: https://github.com/LizardMan245/opus/releases/tag/v2.0-beta.4
    notes: >-
      Pre-release. Plugins can add LFOs, and a Matrix plugin gives an LFO and envelope matrix. Saved synth presets and drum
      kits become .aif files on the USB disk, moved out of the OP-1's database at the first start. Adds a physics-based
      drum engine, a cost monitor, preset delete and a starter pack of 25 plugins.
  - version: 2.0-beta.3.2
    date: 2026-10-30
    url: https://github.com/LizardMan245/opus/releases/tag/v2.0-beta.3.2
    notes: >-
      Pre-release. Adds crash logs that the OP-1 writes to a crash folder on its USB disk, a log reader in the plugin kit,
      and a fix for bridged op1r and Hundekraft effects that stopped the OP-1 when their page showed. Includes
      beta 3.1, which lifts the start-up limit of 100 own synth presets to 300.
  - version: 2.0-beta.3
    date: 2026-10-30
    url: https://github.com/LizardMan245/opus/releases/tag/v2.0-beta.3
    notes: >-
      Pre-release. Adds a trigger guard plugin for worn keys, sampling for plugin engines, no fixed limit on the number
      of plugins, messages when a plugin was not installed, and a start-up progress bar.
  - version: 2.0-beta.2
    date: 2026-10-29
    url: https://github.com/LizardMan245/opus/releases/tag/v2.0-beta.2
    notes: >-
      Pre-release. Lowers the plugins' audio load, fixes the plate reverb lagging or switching off, and adds op1r and
      Hundekraft sequencers through the bridge plugin (now 0.8.0).
  - version: 2.0-beta.1
    date: 2026-10-27
    url: https://github.com/LizardMan245/opus/releases/tag/v2.0-beta.1
    notes: >-
      Pre-release of Opus 2: a plugin core built in the browser patcher from the user's own op1_246.op1, plus a
      20-plugin starter pack and a bridge plugin for op1r and Hundekraft users. Tested in an emulator and on the
      author's OP-1.
  - version: "1.0.1"
    date: 2026-10-14
    url: https://opus-op1.pages.dev/changelog/
    notes: Fixes missing Opus screens on OP-1s with two of the three display types.
  - version: "1.0"
    date: 2026-10-13
    url: https://opus-op1.pages.dev/changelog/
    notes: First release.
