device: teenage-engineering-op-xy
also_devices: [elektron-tonverk]
name: Kit Constructor
kind: tool
summary: Hosted web tool for building 24-slot drum kits for the OP-XY, and 8-slot kits for Elektron's Tonverk, from a sample library. It exports plain audio files or a zip with a .preset folder and patch.json. Closed source; no repository was found.
description: >-
  Drag samples from a filterable library onto numbered slots, rename and lock
  slots, auto-fill, trim with a cut wizard and save or load kit presets. Export
  settings cover sample rate, bit depth, normalisation, mono or stereo and a short
  suffix for naming variations. It is a sibling of Multisample Architect by the
  same author, and the two link to each other. The page shows version 0.73 and a
  support link. Nothing is sent to the OP-XY.
status: unknown
authors:
  - name: metropolis border
    url: https://github.com/metropolisborder
source_status: closed
license: proprietary
license_notes: No source or licence terms are published; the author's GitHub account has no public repositories.
homepage: https://metropolisborder.github.io/kit-constructor/
distribution: browser-installer
install_notes: >-
  Open the page in a browser, build a kit, export in the OP-XY format and copy the
  .preset folder to the device's presets directory in disk mode.
brick_risk: false
tags: [sampler, presets, converter, samples, web]
versions:
  - version: "0.73"
    url: https://metropolisborder.github.io/kit-constructor/
    notes: Version shown on the page; no release page or date.
