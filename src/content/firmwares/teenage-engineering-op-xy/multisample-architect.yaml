device: teenage-engineering-op-xy
also_devices: [elektron-tonverk]
name: Multisample Architect
kind: tool
summary: Hosted web tool that processes and organises multisample files into OP-XY presets, with a beta mode for Elektron's Tonverk. It normalises, cuts at loop end, re-encodes and exports a zip. Closed source; no repository was found.
description: >-
  Drop files or a folder, choose OP-XY or Tonverk as the target, set normalisation,
  one-shot behaviour, an experimental sample-start option and the output format
  (48 kHz 24-bit down to 11 kHz 16-bit), then edit the preset and generate a ZIP.
  Names can take a global prefix and a note separator style, and sessions can be
  saved as a config file. It is a sibling of Kit Constructor by the same author.
  The page shows version 0.79. Nothing is sent to the OP-XY.
status: unknown
authors:
  - name: metropolis border
    url: https://github.com/metropolisborder
source_status: closed
license: proprietary
license_notes: No source or licence terms are published; the author's GitHub account has no public repositories.
homepage: https://metropolisborder.github.io/multisample-architect/
distribution: browser-installer
install_notes: >-
  Open the page in a browser, generate the ZIP and copy the .preset folder to the
  device's presets directory in disk mode.
brick_risk: false
tags: [sampler, presets, converter, samples, web]
versions:
