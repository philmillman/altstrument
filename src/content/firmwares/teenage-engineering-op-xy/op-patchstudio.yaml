device: teenage-engineering-op-xy
name: OP-PatchStudio
kind: tool
summary: Hosted preset creator for the OP-XY. Drop samples to build 24-slot drum kits and multisample presets, edit waveforms and settings, and download the preset. Free in the browser; the author sells paid desktop tools for other devices. The GitHub repository now returns 404.
description: >-
  The page has drum, multisample and library tabs. The drum tab maps 24 named
  slots to a pad keyboard, with per-preset playmode, transpose, velocity, volume
  and width, audio processing for sample rate, bit depth, channels and
  normalisation, an OP-1 preset import, a patch.json import and an estimate of
  preset size. Presets download as WAV or AIFF with a preset name. The page
  states that the OP-XY tools are always free, that a Pro tier adds a tape editor
  for the OP-1 Field and memos, and that sibling desktop apps exist for the
  EP-40, K.O. II and PO-32. The footer says it was inspired by opxy-drum-tool by
  zeitgeese, listed here, and that it is provided as is for educational and
  personal use. The earlier repository joseph-holland/op-patchstudio returns 404.
status: active
authors:
  - name: Joseph Holland
    url: https://github.com/joseph-holland
source_status: closed
license: proprietary
license_notes: >-
  No source is published. The page says it is provided as is, with no warranty,
  for educational and personal use only.
homepage: https://op-patch.studio/
distribution: browser-installer
install_notes: >-
  Open the page in a browser. Copy the downloaded preset to the device's presets
  directory in disk mode. Nothing is sent to the device.
brick_risk: false
tags: [sampler, converter, presets, samples, web]
