device: teenage-engineering-op-xy
name: OP-XY Agent
kind: tool
summary: Browser app with a playable replica of the OP-XY and a chat agent that explains the instrument and writes patterns and sounds into it. Over Web MIDI it mirrors and drives a connected unit; over MTP it moves projects. Also a preset maker. Needs your own Anthropic key.
description: >-
  The replica draws the panel and screen from TE's published guide and camera
  captures of a real unit on OS 1.1.33, with synth engines fitted to recordings
  of the device, a sequencer and effects. The agent answers from its own manual,
  tries key sequences on a copy of the replica first, and writes patterns,
  scenes and songs; changes can be undone and anything touching a device asks
  first. With a unit connected over USB it can play notes, start and stop, change
  tracks, tempo, mutes and sounds, and load or save projects in the device's MTP
  mode. A separate preset maker turns samples into drum, loop and multisample
  presets and can install them over USB, which the README says has not been tried
  on a unit. Every byte sent goes through one filter that blocks firmware-update
  messages. The README calls it pre-production. Nothing is flashed.
status: active
