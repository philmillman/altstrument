device: teenage-engineering-op-xy
name: OP-XY Conductor
summary: >-
  Generative sequencer on the OP-XY's CV track (12) that plays eight lanes of drums, bass, chords, pads, arps and leads
  live on instrument tracks 1 to 8 from one shared chord progression and groove, written on the Open-XY SDK.
description: >-
  Conductor sits on aux track 12 and makes no sound itself. It plays notes into the machines on tracks 1 to 8 while the
  sequencer runs, without writing anything into those tracks' steps. All eight lanes follow one key, scale, chord
  progression and groove, and the song changes a little every four bars as far as an evolve control allows. Notes are a
  fixed function of the song, the controls and the bar, so it replays the same until something changes, and a freeze
  holds the current phrase. Four pages cover the song, the lanes, the selected lane's role controls and the routing of
  lanes to tracks, and the project saves the lanes, roles, routes and seed. Presets are Pop, Night and Jazz.

  The README calls it experimental and says it runs on an OP-XY on OS 1.2.1 with a development build of the SDK. The SDK
  changes it needs (notes played on other tracks, the machine's own encoders and sixteen display words) were not on
  the SDK's main line when the repository was written, and an Open-XY issue tracks them. Timing was measured against a
  recording of the device there, with notes starting up to 17 ms late, while the README lists timing as not yet measured. The
  README adds that roles are set by hand per lane, that lanes cover instrument tracks 1 to 8 only and that it has no MIDI
  routing of its own. Found Motive's kit 031 for the OP-XY lists a Conductor by the same author. This repository does not
  mention the kit and the kit publishes no source, so they are probably the same sequencer, which is not confirmed.
status: active
authors:
