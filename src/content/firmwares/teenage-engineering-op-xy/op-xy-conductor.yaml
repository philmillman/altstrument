source: https://github.com/mmockett/OP-XY-Conductor
source_status: open
license: MIT
license_notes: >-
  The licence file names "Open-XY contributors". The repository holds source, tests and screenshots only, with no OP-XY
  OS file. Builds link the machine into a modified copy of the user's own OP-XY OS.
homepage: https://github.com/mmockett/OP-XY-Conductor#readme
distribution: source-only
requires_stock: "1.2.1"
install_notes: >-
  Needs the Open-XY SDK with the changes the README lists, which sit on the author's fork branch sdk/control-notes until
  they are merged, and the SDK's toolchain. Build with sdk.py against your own stock 1.2.1 os.ldr, then install the
  build's candidate files as the SDK's build guide describes, which ends with writing the OS from the device's boot
  menu. The SDK's authors say a faulty image may not be recoverable, and the stock update restores the original. On
  track 12, Shift and M1 opens the engine list, where you choose Conductor.
brick_risk: true
tags: [machines, sequencer, generative, chords, sdk]
