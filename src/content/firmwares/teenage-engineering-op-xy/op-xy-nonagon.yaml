device: teenage-engineering-op-xy
name: OP-XY Nonagon
summary: >-
  Nine experimental sound engines for the OP-XY, each modelled on a physical phenomenon (Chladni sand, hot-chocolate
  pitch, binaural phantom tones, Euler's disk, Arnold's cat map and others), with outline screens and levels matched to
  Hexagon, built on the Open-XY SDK.
description: >-
  Nonagon is a set of nine machines. Sand bows or strikes a plate with bouncing grains of sand, Cocoa taps a mug whose
  pitch climbs as bubbles clear, Coin spins a disk that rings faster as it falls, Fermi rings a chain of nonlinear springs
  whose energy flows between modes, Mach plays a supersonic flyby with a sonic boom and Doppler sweep, Butterfly rings a
  chain whose spectrum is the Hofstadter butterfly, and Drop floats a liquid drop on a hot pan. Ghost and Recur are sample
  engines on the sampler page. Ghost splits breath and hum between the ears for headphones and plays without a sample, and
  Recur cuts a sample into tiles, opening on a four-bar break of its own, and shuffles them with a chaotic map until they return to the original. On both, Shift edits the stock sampler's markers and gain and the screen draws the sample as a waveform. Each has
  eight controls on two pages, with the OP-XY's own envelopes, filter, LFOs and effects on top, and a screen drawing one
  object in outline. The synths run on their own time units rather than locking to the tempo, since the SDK gives synths no
  tempo, note-off or velocity.

  The README calls the set experimental and says all nine run on the OP-XY, with their screens checked against how it
  draws them and CPU use measured on OS 1.2.1: one voice costs 1.2% to 5.0% of the audio block, and several tracks of heavy
  chords with effects can run out of processing. The repository is about 100 MB because its history keeps many re-rendered
  GIFs and contact sheets. The current tree holds source, presets, generated tables and images, and no samples, recordings
  or vendor data. The Open-XY machine catalog lists all nine.
status: active
authors:
  - name: mmockett
    url: https://github.com/mmockett
source: https://github.com/mmockett/OP-XY-Nonagon
source_status: open
license: MIT
license_notes: >-
  The repository holds source, tests, presets, tables generated by its own scripts and rendered screens, with no OP-XY OS
  file, sample or third-party data. Builds link the machines into a modified copy of the user's own OP-XY OS.
homepage: https://github.com/mmockett/OP-XY-Nonagon#readme
distribution: source-only
requires_stock: "1.2.1"
install_notes: >-
  Check out the Open-XY SDK's staging branch beside this repository, fetch its toolchain and run its tests. The seven
  synths build together on SDK 1.4 and Ghost and Recur, the sample engines, build in a second pass on SDK 1.10, and Recur's own sample needs an SDK branch with a further change that was still in review. Build
  with sdk.py against your own stock 1.2.1 os.ldr, passing your last build's layout.json so machines already on the
  device keep their numbers, then install the build's candidate files as the SDK's build guide describes, which ends
  with writing the OS from the device's boot menu. The SDK's authors say a faulty image may not be recoverable, and the
  stock update restores the original.
brick_risk: true
tags: [machines, synth-engine, sampler, generative, sdk]
