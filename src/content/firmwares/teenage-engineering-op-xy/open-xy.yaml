device: teenage-engineering-op-xy
name: Open-XY
summary: C++ SDK and browser builder that compile extra synth, effect and sample machines (2-op FM, a Braids port, Karplus, ring mod, ping pong, timestretch) into a modified copy of your own OP-XY OS 1.2.1 file.
description: >-
  Machines are folders of C++ for a sound engine, display code and a JSON
  definition, built once to WebAssembly for browser previews and once for the
  device's Blackfin processor. The SDK repository holds a catalog of machines
  that each live in their own repository, pinned by commit; Open-XY's own
  machines are in open-xy-core-machines. The builder at open-xy.com takes the
  stock os.ldr, lets the player choose from the catalog's machines and produces
  the files to copy to the device. The OS is linked statically with a fixed
  collection, so there is no loading of arbitrary engines, and the firmware
  reserves about 2 MiB of heap shared by the selected machines. A build can
  hold up to 256 machines, and the builder has an optional step for extensions
  such as Capture.

  The SDK and most machines are MIT. The timestretch machine is AGPL-3.0, so
  builds that include it, as the default collection does, are distributed
  under the AGPL. The authors call the project experimental and say native
  code is not sandboxed and recovery from a faulty image is not guaranteed.
status: active
authors:
  - name: etcetc000
    url: https://github.com/etcetc000
source: https://github.com/etcetc000/open-xy
source_status: open
license: MIT
license_notes: >-
  The SDK and most machines are MIT. The Braids port carries Mutable
  Instruments' notices, and the timestretch machine is AGPL-3.0, which applies
  to firmware and builder kits that include it. No stock firmware image or
  artwork is included, but the README says the repository holds one stock file,
  the instrument catalog op1_factory.json, which the builder also distributes.
homepage: https://open-xy.com
distribution: browser-installer
requires_stock: "1.2.1"
install_notes: >-
  Needs the decrypted stock os.ldr from OS 1.2.1, read from the device in
  file-transfer mode, and the OP-XY dev menu enabled. The builder, in desktop
  Chrome, Edge or Opera, reads the file, builds in the browser and, on a Mac
  with WebUSB, sends the files; on Windows it downloads a ZIP to copy by hand.
  The OS write step on the device is manual. Firmware builds from the command
  line need Windows x86_64, Apple-silicon macOS or Linux x86_64 and the
  project's compiler toolchain. Back up device content first and keep the stock OS for recovery.
brick_risk: true
tags: [machines, synth-engine, sdk, web, fx, sampler, patch]
versions:
  - version: v0.0.5
    date: 2026-11-04
    url: https://github.com/etcetc000/open-xy/releases/tag/v0.0.5
    notes: Adds a Chords note player machine, search, sort and favourites for builder machines, named machine-selection presets, a master processor interface for SDK machines and the Timestretch slicing and preset fixes from the untagged 0.0.4.
  - version: v0.0.3
    date: 2026-10-30
    url: https://github.com/etcetc000/open-xy/releases/tag/v0.0.3
    notes: A build can hold up to 256 machines, and projects reopen with the machines they were saved with. Adds a Capture extension, SDK 1.6 and new catalog machines, among them seven synths from OP-XY MNMD.
  - version: v0.0.2
    date: 2026-10-28
    url: https://github.com/etcetc000/open-xy/releases/tag/v0.0.2
    notes: First versioned release, built for OS 1.2.1. Adds the catalog of pinned community machines, SDK 1.0 and 1.1, Linux firmware builds and 2 MiB of reserved module heap. The other release, toolchain-1, is the compiler toolchain.
