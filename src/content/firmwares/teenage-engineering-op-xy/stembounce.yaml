device: teenage-engineering-op-xy
name: stembounce
kind: tool
summary: Browser app that bounces an OP-XY's eight tracks to separate WAV stems by muting them over MIDI, starting the transport and recording the device's USB audio, then aligns each stem to beat one from MIDI clock. Output is individual WAVs or a ZIP.
description: >-
  For each selected track the app mutes all tracks with CC 9, unmutes one, sends
  MIDI start, records the audio input for the song length and stops. It reads
  tempo from the device's clock, trims pre-roll so stems start on the downbeat,
  can add a full-mix pass, and writes 24-bit 48 kHz or 16-bit 44.1 kHz files with
  the BPM in the file names. A diagnostics panel shows raw MIDI. The device must
  have clock send, CC receive and transport receive switched on in its COM
  settings. Nothing is flashed. It can be installed as a PWA. Opxy-stems in this
  directory does the same job as a single HTML file.
status: active
authors:
