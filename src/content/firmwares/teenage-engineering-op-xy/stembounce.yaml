    url: https://github.com/om3opr
source: https://github.com/om3opr/stembounce
source_status: open
license: MIT
homepage: https://stembounce.vercel.app
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, connect over USB-C with a data cable and allow
  MIDI and audio input. On the device, press COM then M3 and turn on clock send,
  CC receive and, on the second page, transport receive.
brick_risk: false
