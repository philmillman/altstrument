device: teenage-engineering-op-z
name: Galax-z
kind: tool
summary: >-
  Dot-matrix companion app for the OP-Z on Mac, iPad and iPhone that follows the unit over USB or Bluetooth and shows its tracks, effects, notes and load, with pages that play it, a sampler, backups and the installer hub for Galax-z OS.
description: >-
  The app follows the OP-Z over USB-C, or over Bluetooth on iPad and iPhone, and draws what it sends on a dot-matrix screen
  with pages for tracks with animations, effects, played notes over a keyboard, a sky view with each track as an arm, a
  sixteen by sixteen step grid, a mixer, song overview, a load meter and settings. Touching a control sends MIDI that changes the OP-Z the way
  its own knob would. PLAY has pads with scales, chords and grooves, PERFORM has gates, sweeps and stops held on a pad, CHOPS
  cuts a sound up for the module track and a sampler plays the OP-Z's USB audio through the device. The app learns MIDI
  controllers, backs up projects by reading only, and on a Mac its hub installs Galax-z OS and writes TE's original back. A
  demo OP-Z needs no hardware. The author calls it a work in progress; the status page says only volume and mute touch controls
  have been seen on a real unit, iPad and iPhone builds have run on the author's own devices only, and the Mac test build is
  not notarized by Apple. The code was written with Claude. It includes Swift ports of parts of OP-FREE.
status: active
authors:
