source: https://github.com/Luisga521/Galax-z
source_status: open
license: MIT
license_notes: >-
  LICENSE is MIT, for what is Galax-z's own. OP-FREE parts are MIT, the piano sample pack is CC BY 3.0, and OWNERSHIP.md and
  THIRD_PARTY.md list the notices.
based_on: teenage-engineering-op-z/op-free
distribution: download
install_notes: >-
  The Mac test build, Galax-z-mac.dmg, is on the releases page: drag it to Applications and allow it once under System
  Settings, Privacy and Security, since it is not notarized. It needs macOS 15 or newer. iPad and iPhone builds are made
  with Xcode following docs/BUILDING.md, and there is no App Store release. The app and its screens only read the unit; the
  hub that installs Galax-z OS replaces the OS, which the Galax-z OS entry covers.
brick_risk: false
tags: [companion-app, visualizer, midi, sampler, backup, ios, mac, bluetooth]
