license: MIT
license_notes: >-
  LICENSE is MIT, with the copyright line naming Lourens Smit and the op-z-engines contributors. The README says engines that
  port DSP from other projects credit them and that only MIT, BSD, ISC or public-domain sources are accepted. The README
  states that the project is not affiliated with teenage engineering.
homepage: https://mutlisensor.github.io/op-free/
distribution: browser-installer
install_notes: >-
  Open the site in Chrome or Edge, accept the risk notice, pick engines, connect the OP-Z over USB and let the site back up
  settings/plugs.json and slotConfiguration.json before installing. Close teenage engineering's app first, since two clients
  break the session. Try engines in a spare project, not the one the unit starts with, and keep your own samples in a slot
  before using content mode. SAFETY.md lists the recovery ladder, which ends with the official firmware in update mode.
tags: [synth-engine, fx, sdk, loader, drums, research, web-midi]
