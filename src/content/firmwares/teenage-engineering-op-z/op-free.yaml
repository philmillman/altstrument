device: teenage-engineering-op-z
name: OP-FREE
summary: Community synth, drum and effect engines for the OP-Z, with a browser lab to audition them, a Web MIDI loader that installs them over USB, a C SDK with a host simulator, and research notes on the OS.
description: >-
  Engines are small DSP modules that the OP-Z OS loads as user plugs and runs in sound slots beside the stock ones. The repository
  holds 31 of them, including a 32-patch six-operator FM voice, a granular effect, phase distortion, wavetable, modal, mallet and
  vowel voices, a synthesized drum kit and reverbs, delays and a shimmer effect. The website lets you play each engine in the
  browser, tick what to install, back up the unit's settings, install over the same file protocol the official app uses and
  write presets into the on-device preset store, with a restore that puts the backup back. Nothing is flashed. The SDK has the
  engine header, templates and linker script, and the simulator renders scenarios and checks the engine rules on a computer.
  Firmware modifications are only research and proposals so far, and the folder for them is empty. The repository says it holds
  no teenage engineering firmware, keys or code, and its safety notes warn that a faulty engine can crash the OS because
  engines run without memory protection. The roadmap says the author's private lab does the hardware tests and publishes what
  has been checked; the committed .wasm files are builds of the engines for the website.
