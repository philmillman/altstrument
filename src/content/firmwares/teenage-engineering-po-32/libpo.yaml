    date: 2026-11-05
    url: https://github.com/ericlewis/libpo/releases/tag/2.0.0
    notes: Removes the in-tree Go module and its generated C bundle, so Go users must pin an earlier revision. PO-32 capture decoding accepts extensible WAV input, and the parser reads the one-byte pattern-slot record found in older backups.
  - version: 1.0.0
    date: 2026-11-05
    url: https://github.com/ericlewis/libpo/releases/tag/1.0.0
    notes: Adds support for the PO-33, PO-133, PO-35 and PO-137, a single Go module for all model families, and corrected drum synth parameter maps.
