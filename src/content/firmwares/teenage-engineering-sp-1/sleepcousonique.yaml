    url: https://github.com/femifleming
source: https://github.com/femifleming/sleepcousonique
source_status: open
license: MIT
license_notes: >-
  The root LICENSE is the MIT text, copyright 2026 femifleming. It states that the SP-1 firmware builds on Wakes (Worldwave,
  MIT) and the code Wakes credits, whose licences are in firmware/. GitHub reports the licence as unrecognised because of the
  added paragraph.
based_on: teenage-engineering-sp-1/wakes
distribution: download
install_notes: >-
  Turn the SP-1 off, hold T1 and T4 while plugging in USB, and flash sleepcousonique-sp1.bin from the release with the
  Solderless web updater in Chrome or Edge. This is needed once; later patches go over USB from the editor. FLASHING.md says
  the bootloader is never touched, so holding T1 and T4 again always allows flashing another .bin, and that reflashing can
  clear the five stored patch slots. The macOS app is not notarised, so open it from the context menu the first time.
brick_risk: false
