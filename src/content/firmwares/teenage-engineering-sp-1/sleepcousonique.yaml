device: teenage-engineering-sp-1
name: Sleepcousonique
summary: Patch language, desktop editor and SP-1 firmware that play modular-style patches written as dated journal entries, with the SP-1's faders, buttons and rocker mapped into the patch.
description: >-
  A patch is text: each dated entry names modules, such as slope, sine, delay or folder, and connects them with arrows,
  and the SP-1's four faders, four track buttons, rocker and LEDs appear as a source module that can be wired into it. The
  macOS and Windows editor shows the same patch as boards and cords, plays it on the computer and sends it over USB to the
  SP-1. The language has 129 module types taken from modular history and a quantizer with 38 scales plus Scala files. The
  engine is shared C code in the editor and the firmware, and the firmware's hardware layer comes from Wakes. A load meter
  in the editor warns when a patch is too heavy for the SP-1. The README states that the project is unofficial and not
  affiliated with Teenage Engineering.
status: active
authors:
