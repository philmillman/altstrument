device: teenage-engineering-sp-1
name: SP-66
summary: Recreation of the Roland TR-66 Rhythm Arranger for the SP-1, with synthesized drum voices, 27 factory rhythms, A/Auto/B arrange phrases and USB MIDI clock sync.
description: >-
  A C engine synthesizes the drum voices at 48 kHz without samples and plays the TR-66's 27 rhythms. The faders set
  tempo, the bass drum against hi-hat balance, the rhythm and a preset within the variation bank. The track buttons
  pick Rock, 2 Beat or 4 Beat and toggle the variation. An arrange rocker moves between the A, Auto and B phrases, and
  rhythms can be pinned to play together. The Function button adds one fill, which is not on the original, and the
  SP-1 follows MIDI clock and transport over USB. The author fitted the voices and patterns against recordings of a
  real TR-66, and the same engine renders WAV files on a computer. The README says hardware testing is still under
  way and lists startup diagnostics for the unit.
