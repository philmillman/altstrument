homepage: https://github.com/dustMason/sp-66
distribution: source-only
install_notes: >-
  Build firmware/ with Zephyr 4.3.1 and the SDK 0.17.4 ARM toolchain for the stem_player board, then flash the
  resulting tr66-sp1.bin with the Solderless utility: with the SP-1 off, hold Track 1 and Track 4 while connecting
  USB-C in Chrome or Edge. The README calls replacing the factory firmware one-way.
