device: teenage-engineering-sp-1
name: SP-1 Tape Looper
summary: Four-track, tape-style looper firmware for the SP-1 with sixteen songs, stereo recording, effects pages, bounce and a browser tool for transferring loops.
description: >-
  Audio is fed in over USB-C, recorded to the four tracks with the track
  buttons and played back layered, with the rocker changing speed and pitch
  together like tape. Version 3 records in stereo and adds eight effect pages,
  per-track reverse and isolate and a beat grid. Version 4 adds several takes
  per track, recording of Bluetooth audio mixed with USB input, eight rocker
  modes, playback up to 2x, 3, 4, 5 or 7 beats per bar and more effects. Loops
  and settings are stored per song on the SP-1's internal storage. A browser
  page connects over USB serial to download or upload tracks, and a browser
  library handles batch imports. The 3.0 update changed the storage format, so
  existing songs must be backed up first; the 4.0 image keeps existing storage.
status: active
authors:
  - name: chattock
    url: https://github.com/chattock
  - name: marcabisamra
    url: https://github.com/marcabisamra
source: https://github.com/chattock/sp1-tape-looper
source_status: open
license: MIT
homepage: https://sp1-tape-looper.vercel.app/
distribution: download
install_notes: >-
  Flash the .bin from the release page (TAPE-LOOPER-V4.bin for version 4;
  earlier releases used sp1_looper.bin) with the Solderless utility; hold Track
  1 and Track 4 for 3 seconds while the looper runs, or while plugging in USB,
  to reach the bootloader. Version 4 then asks you to run its setup page, which
  checks the filesystem and Bluetooth. Updating from 2.x to 3.x reformats loop
  storage on first boot, so use the transfer page's Download all first, and the
  4.0 setup's Start empty option erases existing storage.
brick_risk: false
tags: [looper, fx, usb-audio, performance]
