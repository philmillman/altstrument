device: trash80-ym2149-synth
name: YM2149 Synth Web Editor
kind: tool
summary: Chrome-based patch editor for trash80's YM2149 synth that loads and saves its presets over Web MIDI. It is a Vue app served from GitHub Pages and works over the synth's USB MIDI connection.
description: >-
  The editor connects to the synth after Chrome grants MIDI access and edits the synth's parameters and presets through its
  MIDI controller map. The README warns not to use another MIDI program with the synth while loading or saving patches, because
  it can corrupt the data, and points to Catskull Electronics for built units and to the designer's repository for the schematic and code. Nothing is flashed.
status: dormant
authors:
