    url: https://github.com/2xAA
source: https://github.com/2xAA/ym2149synth-web-editor
source_status: open
license: GPL-3.0-only
license_notes: The LICENSE file is the GNU GPL version 3 text, and the README states that it is under the GPL v3.0.
homepage: https://2xaa.github.io/ym2149synth-web-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, accept the MIDI permission prompt and plug the synth in over USB. Do not use other MIDI
  software with the synth while loading or saving patches.
brick_risk: false
tags: [editor, web-midi, usb-midi, midi, presets, chiptune, web]
