device: trash80-ym2149-synth
name: Ym2149Synth firmware
kind: firmware
summary: The synth's own open firmware for a Teensy 3.1, by its designer. It plays the YM2149F's three voices, one per MIDI channel, with CC control of synth type, glide, vibrato and envelopes, and stores 16 presets. The repository also has the schematic, board files and a Max editor.
description: >-
  The sketch reads MIDI from USB and from a serial port and drives the chip's registers, with eight synth types that mix the
  square voice, the hardware envelope voice, a software PWM voice and noise. A CC map sets detune, glide, vibrato, a pitch
  envelope, a volume envelope, noise delay and transpose, and further CCs load, save and dump the 16 presets. The repository includes the
  schematic as a PDF, KiCad board files, the chip's datasheet and a Max patch editor. Its documentation section is marked as not written.
