device: trimui-brick
name: Amalthea
summary: >-
  Replaces the TrimUI Brick's operating system with a minimal Linux for music apps: a generative 12-track Tracker, an FX rack for an M-VAVE FM-1's USB audio and the LIFEBLOOD effect network, sharing a set of synth engines and over seventy effects.
description: >-
  Rights warning: the installer and boot image keep a small, listed set of TRIMUI's stock firmware 1.0.6 files, including the kernel and a few board helpers and kernel modules, redistributed unmodified. Their rights remain with the owner.

  Amalthea is a whole operating system rather than an app. The installer writes a new boot partition and root filesystem, and removes the stock gaming frontend, emulators and services until the restore script puts the stock system back. Underneath sit twelve synthesis engines, more than seventy effects, random generators for notes, rhythms and parameters, a master chain, session banks and low-latency ALSA output. The Brick also acts as a class-compliant USB audio device when it is not hosting an FM-1.

  Three instruments ship so far. TRACKER is a 12-track generative tracker with five independently clocked columns per track, 19 playback directions, conditional events and 38 scales. FX is a twelve-slot effect rack for the separate USB tracks of an M-VAVE FM-1 running Bigorna, Tonitor, Lilliput or Norilsk, with a parameter sequencer on each slot clocked from the FM-1. LIFEBLOOD sends those tracks through a generated, self-mutating network of effects. The README says it was developed and tested on one Brick on stock firmware 1.0.6 and that other stock versions are untested.
status: active
authors:
