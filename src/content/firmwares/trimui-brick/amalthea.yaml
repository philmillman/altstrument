source: https://github.com/nzimas/amalthea
source_status: open
license: GPL-3.0-only
license_notes: >-
  The LICENSE file is GPL-3.0 with no "or later" statement. The README says the code contains ports of many open-source projects, each credited in its source files and docs. The vendor components in the images are listed in installer/VENDOR-COMPONENTS.txt and remain the property of their owners; they are not committed to the repository.
homepage: https://nzimas.github.io/amalthea/
distribution: download
requires_stock: TRIMUI Brick (TG3040) stock firmware 1.0.6
install_notes: >-
  Download the installer zip from the release page, connect the charged Brick over a USB-C data cable while the stock system is running, and run install.sh (macOS, Linux) or install.bat (Windows). The installer first saves a SHA-256 checked backup of the stock boot and root partitions on the computer, then writes only those two partitions; the bootloader, partition table and SD card are untouched. restore.sh or restore.bat writes the backup back, and a RAM recovery shell over ADB takes over if a write is interrupted. Running a newer installer updates in place and copies saved sessions off first.
brick_risk: false
tags: [tracker, generative, sequencer, synth-engine, fx, os, usb-audio, handheld]
