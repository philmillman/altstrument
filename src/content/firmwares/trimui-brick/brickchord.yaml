homepage: https://michaeltietjen.github.io/brickchord/
distribution: download
requires_stock: Knulli beta build for the Brick Pro (tested on knulli-a133-trimui-brick-pro-beta-20260921)
install_notes: >-
  Download the Knulli zip for the app you want from the release page, copy its folder, launcher script and images folder into roms/ports on the SD card, then choose Update Gamelists and start it from Ports. On first launch press each button and push each stick once so the app learns the controls. Nothing is written to the console's internal firmware. The optional factory_render.py pre-renders the stock sounds on a computer, about 355 MB, so they open instantly.
