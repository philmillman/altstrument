versions:
  - version: v0.5.0
    date: 2026-11-25
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.5.0
    notes: Adds a no-sticks mode for handhelds without analog sticks, such as the original TrimUI Brick, with F1 and F2 standing in for the sticks and chord types that latch. It also fixes the stick setup on R36 handhelds with short-throw sticks and a dArkOS RE screen problem, adds Python 3.13 support and ships PortMaster builds that are not yet tested on NextUI or NX Redux hardware.
  - version: v0.4.3-r36
    date: 2026-11-23
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.4.3-r36
    notes: Pre-release. Fixes the stick setup on R36 handhelds whose sticks reach only about half their range, scales the saved stick back to full range and finds sticks on a second input device. Re-run Settings > Global > Learn sticks after updating.
  - version: v0.4.2-r36
    date: 2026-11-23
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.4.2-r36
    notes: Pre-release. The apps switch to the firmware's own SDL when the bundled one cannot reach the screen, which fixes a blank screen on dArkOS RE. Not yet confirmed on an R36S.
  - version: v0.4.1-r36
    date: 2026-11-22
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.4.1-r36
    notes: R36 package now bundles NumPy and pygame for Python 3.13 next to the older ones; the apps are the same as in v0.4.0-beta.
  - version: v0.4.0-beta
    date: 2026-11-06
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.4.0-beta
    notes: Adds the first release of the new Brickglide with progression play, strum and arp on the left stick, USB MIDI input, user samples, scrubbing and moves, alongside Brickchord and Bricklab.
  - version: v0.3.0
    date: 2026-11-04
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.3.0
    notes: Adds Bricklab as a full pocket groovebox with looper, machines per track, a macro oscillator and a granular Cloud effect.
  - version: v0.2.0-alpha
    date: 2026-11-01
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.2.0-alpha
    notes: Adds synth bass, four-octave arpeggiators, 27 beats, eight reverbs and six delays, a redesigned right stick and near-instant sound loading.
  - version: v0.1.0-alpha
    date: 2026-10-31
    url: https://github.com/michaeltietjen/brickchord/releases/tag/v0.1.0-alpha
    notes: First public alpha with chord buttons, analog-style synth, strums and arps, drum beats and reverb and delay.
