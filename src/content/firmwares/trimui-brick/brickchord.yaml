device: trimui-brick
also_devices: [portmaster-compatible-handhelds]
name: Brickchord
summary: >-
  Alpha chord-machine apps for the TrimUI Brick Pro on Knulli, written in Python: Brickchord plays diatonic chords from the buttons over a synth and drum engine, Bricklab adds a groovebox and looper, and Brickglide is an ambient glide machine.
description: >-
  Brickchord maps seven chord buttons to the diatonic chords of a chosen key, with modifiers for sevenths, sus4 and ninths, left-stick chord bends and right-stick reverb, delay and filter. It has 23 sounds across analog-style, FM, plucked, organ and vocal engines, a sound editor, a stackable effects rack, 15 play styles with strums, harps, arpeggiators and repeats, a drum machine with 27 beats, a synth bass and a six-track pattern recorder with a song page. Bricklab is the groovebox edition on the same engine, with a layered looper, sixteen patterns of six tracks that each hold a chord, lead, bass, drone or sample machine, per-track effects, a step-grid drum machine and sample playback from WAV files. Brickglide is an ambient machine in which chord voices slide into the next chord over seconds, with scrubbing, melody over the changes, USB MIDI input and texture beds.

  Each app runs as a Ports entry on Knulli, using a bundled NumPy and pygame, and also ships as PortMaster packages for NextUI, muOS, ROCKNIX and ArkOS and as an R36 build. Since v0.5.0 a no-sticks mode turns on by itself when no analog sticks are found, so the apps can also be played on handhelds like the original TrimUI Brick. The README marks the project alpha and says it was tested on a Brick Pro with a Knulli beta build. It reports the other firmwares and the R36 package as untested on hardware. The project is not affiliated with TrimUI, Knulli or the makers of the chord instruments that inspired it.
