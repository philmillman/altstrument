device: trimui-brick
name: BrickPad
summary: >-
  Source-visible sampler, synth and clip sequencer for the TrimUI Brick on Knulli, with twelve pads, sixteen scenes, four sound engines, effects and MIDI, played from the d-pad and buttons. Beta.
description: >-
  Licence note: the source is published to read and to build for personal use on your own devices, but the licence
  forbids redistributing the program, modified or not, outside the project's own releases, and forbids selling it.
  BrickPad runs as a native program from the Ports menu. A project has twelve pads, each holding an instrument and
  sixteen patterns, and sixteen scenes that switch every pad at once on the bar. The four engines are a sampler with
  slicing, tempo warp and loops, GRAND (a two-oscillator synth with a patch bay), ACID (a 303-style line) and CLOUD
  (a granular player). Patterns are written as steps with chance, ratchets and sub-steps, in a piano roll or as chord
  slots. Each pad has two insert effects, with reverb and delay sends, four LFOs, ducking, automation and a freeze
  function that renders a pad to audio. There is a mixer, WAV export of scenes or pads, a simple large view for
  children, themes, and USB MIDI with clock out, clock in, note input and MIDI learn. The author describes it as a
  beta whose project file format may still change, and it was written for the Brick running Knulli.
