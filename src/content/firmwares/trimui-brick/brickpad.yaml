distribution: download
requires_stock: Knulli on a TrimUI Brick
install_notes: >-
  Download the brickpad zip for the Brick from the latest release, unpack it and copy the launcher script and the
  brickpad folder into roms/ports/ on the SD card (or /userdata/roms/ports/ on the Brick), refresh the game list and
  start BrickPad from Ports. Each version has its own folder, so an older one stays in place; to update, replace the
  launcher and the program file only. Put your own WAV or OGG samples in the version's samples folder. Hold MENU for
  three seconds to quit. Nothing is written to the console's firmware.
brick_risk: false
