source_status: open
license: GPL-3.0-or-later
license_notes: >-
  The README says BrickRack is GPL-3.0-or-later, and the LICENSE file is the GPL v3 text. The bundled Eurorack firmware is MIT for the STM32 code and GPL-3.0-or-later for the AVR code, and the hardware designs used as reference are CC-BY-SA-3.0. THIRD_PARTY_NOTICES lists these and the Barlow Condensed font (SIL OFL).
based_on: https://github.com/pichenettes/eurorack
distribution: download
requires_stock: NextUI on the TrimUI Brick Pro
install_notes: >-
  Download BrickRack-tg5040.zip from the release page, copy Tools/tg5040/BrickRack.pak to /Tools/tg5040/ on the SD card and start BrickRack from the Tools menu. Patches are stored under /.userdata/tg5040/BrickRack/ and survive updates. A Docker script builds the device package. Nothing is written to the console's internal firmware.
brick_risk: false
