device: trimui-brick
name: BrickRack
summary: >-
  Open-source pocket modular synthesizer for the TrimUI Brick Pro on NextUI that patches 29 modules with cables, among them ports of Émilie Gillet's open Eurorack firmware such as Plaits, Braids, Rings, Clouds and Marbles. Not yet run on hardware.
description: >-
  BrickRack shows a rack of module panels on the 1024 by 768 screen and lets you connect jacks with virtual cables. Its 29 modules include oscillators, resonators, texture and modal synthesizers, random and segment generators, a drum sequencer, filters, VCAs and utilities, plus a step sequencer, a Brick Control module that turns the sticks and shoulder buttons into voltages and gates, and a microphone input. Most digital modules run the original Eurorack firmware DSP from pichenettes/eurorack, included as a submodule, at each module's own sample rate; the analog modules are digital models, and three 8-bit AVR modules are reimplemented. Panels use descriptive names rather than the Mutable Instruments names, and the README asks readers to treat it as unaffiliated. Patches autosave and example patches are installed on first launch.

  The v0.1.0 notes and README say it builds and runs on desktop but has not been run on real hardware, and that the L2, R2, L3 and R3 mappings are unverified. It targets the Brick Pro's analog sticks; the original Brick can use the D-pad editing mode.
status: active
