device: trimui-brick
name: BRIXEQ
summary: >-
  Free, closed-source five-track step sequencer and groovebox for the TrimUI Brick on NextUI, in which every step carries its own full instrument snapshot, with eight synth and drum engines, scenes, song mode and WAV recording.
description: >-
  BRIXEQ has five tracks of sixteen patterns each, and each step stores its own engine, envelope, filter, chord stack of up to five voices, effect sends, probability and trigger logic, so neighbouring steps can sound like different instruments. Eight engines cover virtual analog, two-operator FM, a physical-model string, phase distortion, bass drum, snare, cymbal and noise. Sixteen scenes per project hold pattern pointers, scale, transpose strips and master effects, and a 128-row song mode references scenes with per-track overrides. The master bus has a tempo-synced ping-pong delay, a stereo reverb and a compressor with optional sidechain, and the master output records to 16-bit stereo WAV files on the SD card.

  It is a NextUI pak that installs from the PAK Store or by copying the release's BRIXEQ.pak folder. The repository holds the manual, the pak metadata and a screenshot, with no source code, and the README does not state a licence.
status: active
authors:
