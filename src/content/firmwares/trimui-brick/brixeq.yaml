    url: https://github.com/boorch
homepage: https://github.com/boorch/brixeq-pak#readme
source_status: binary-only
license: unspecified
license_notes: >-
  The repository has no licence file and the README gives no licence statement; only the compiled pak is published.
distribution: download
requires_stock: NextUI on the TrimUI Brick
install_notes: >-
  Open PAK Store from NextUI's Tools menu with the Brick on Wi-Fi and install BRIXEQ, or download BRIXEQ.pak.zip from the release page and copy the BRIXEQ.pak folder to Tools/tg5040 on the SD card. Projects and WAV recordings are kept in a BRIXEQ folder at the root of the card, outside the pak, so updates leave them alone. Nothing is written to the console's internal firmware.
brick_risk: false
