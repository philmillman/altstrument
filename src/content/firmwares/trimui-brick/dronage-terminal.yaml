homepage: https://github.com/boorch/dronage-terminal-pak#readme
source_status: binary-only
license: unspecified
license_notes: >-
  The repository has no licence file and the README gives no licence statement; only the compiled pak is published.
distribution: download
requires_stock: NextUI on the TrimUI Brick
install_notes: >-
  Install Dronage Terminal from NextUI's PAK Store with the Brick on Wi-Fi, or download Dronage.Terminal.pak.zip from the release page, rename the unzipped folder to Dronage Terminal.pak if needed and copy it to Tools/tg5040 on the SD card. Presets, recordings and tuning files are kept in a DronageTerminal folder at the card root and survive updates. Nothing is written to the console's internal firmware.
