device: trimui-brick
name: Dronage Terminal
summary: >-
  Free, closed-source ambient drone synthesizer for the TrimUI Brick on NextUI with four macro oscillators, a modulation matrix, eight LFOs, a modulation sequencer, delay and shimmer reverb, Scala tuning and WAV recording.
description: >-
  Dronage Terminal has four oscillators that each pick from 32 synthesis engines, with per-voice filter, drive, envelope and pan, feeding a stereo delay with a granular mode, a shimmer reverb and a dirt section. A modulation matrix with per-slot attenuverters connects eight LFOs and a five-track modulation sequencer to the voice parameters, and Scala files give microtuning. It has presets, WAV recording, 20 colour themes with user-editable theme files, a spectrum analyser and a text-style interface that R1 and Select turn into a help screen.

  This is the NextUI pak of the author's Dronage Terminal desktop synth, built separately from the Dronage Move module for Ableton Move listed under that device, and it has its own version line. The repository holds the README, pak metadata and screenshots, with no source code, and the README gives no licence.
status: active
