source_status: binary-only
license: unspecified
license_notes: >-
  The repository has no licence file and the README gives no licence statement; only the compiled pak is published. The MANUAL says the operator set derives from Orca-c and bOrca.
distribution: download
requires_stock: NextUI on the TrimUI Brick
install_notes: >-
  Install Grampus from NextUI's PAK Store with the Brick on Wi-Fi, or download Grampus.pak.zip from the release page and copy the Grampus.pak folder to Tools/tg5040 on the SD card. Projects, recordings and demo projects are kept in a Grampus folder at the card root; the bundled demos are refreshed on each launch and your own saves are not touched. Nothing is written to the console's internal firmware.
brick_risk: false
