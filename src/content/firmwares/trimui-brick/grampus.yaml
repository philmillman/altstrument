device: trimui-brick
name: Grampus
summary: >-
  Free, closed-source ORCA-style grid sequencer for the TrimUI Brick on NextUI, paired with nine polyphonic synth engines, eight tracks, scenes, per-track LFOs and effects, and WAV recording.
description: >-
  Grampus runs a terminal-style grid where letter operators trigger notes and move values, with an operator set derived from Orca-c and its bOrca fork, plus a chord strum operator. Its nine polyphonic engines are a dual-oscillator analog voice, a wavetable engine, a six-operator FM voice, a Karplus string, a sample rompler with 17 kits, tape-replay instruments, a two-dimensional wavetable morpher, a drum synth and a SuperSaw. It has eight tracks with per-track filters including three Polivoks-inspired modes, drive, chorus and three LFOs, master delay, reverse delay and shimmer reverb, and eight scenes per project that switch on tick-quantised boundaries. Bundled demo projects and WAV recording are included, and a full manual is in the repository.

  The TrimUI build is developed and tested only on the Brick; the README says other devices on the same platform may map the buttons wrongly and offers a script to remap the gamepad, with no support. Desktop builds for macOS, Linux and Windows are sold or shared separately on itch.io and are not covered here. This repository holds the manual, pak metadata and a screenshot, with no source code, and no licence is stated.
