license: GPL-3.0-only
license_notes: >-
  The LICENSE file and README state GPL-3.0-only. NOTICE.md lists the included code: Mutable Instruments modules (MIT), Grids drum maps (GPL-3.0-or-later, used under GPL-3.0), stb_vorbis (public domain), the fm1-base platform layer (MPL-2.0, distributed under GPL-3.0), SDL2 headers (zlib) and the Barlow and Nunito fonts (SIL OFL 1.1).
based_on: m-vave-fm-1/mutable-dreams
homepage: https://kidbee85-beep.github.io/mutable-dreams-handheld/
distribution: download
install_notes: >-
  Download the zip for the device from the release page, unpack it and copy the launcher script and the mutabledreams folder into roms/ports on the SD card. Then update the game lists in Knulli and start it from Ports. The Miyoo packages are for Onion OS and the RGB20S package for AmberELEC. A package can be removed by deleting those files, and nothing is written to the console's internal firmware.
brick_risk: false
