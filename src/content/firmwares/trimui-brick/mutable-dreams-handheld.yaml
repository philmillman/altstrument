device: trimui-brick
also_devices: [anbernic-rg35xx, miyoo-miyoo-mini, miyoo-miyoo-flip]
name: Mutable Dreams for handhelds
summary: >-
  Port of the Mutable Dreams generative instrument to handhelds, with six tracks, 128 worlds, a Sound Lab with Mutable Instruments-based modules and musical toys. It runs as a Ports app on the Brick under Knulli, and has builds for other handhelds, Android and Linux.
description: >-
  Mutable Dreams for handhelds takes the six-track generative instrument that began on the M-VAVE FM-1 and runs it as a native SDL program. Six tracks play by themselves, four dials act as weather, and hundreds of Biomes, 128 worlds in 20 families, ten musical toys and a Sound Lab with modules after Plaits, Rings, Elements, Clouds, Beads, Marbles, Grids and Tides shape what is heard. The interface is in English, German, French and Spanish.

  On the TrimUI Brick it is copied into the Ports folder of the SD card and started under Knulli; nothing is flashed. The release also carries packages for the Trimui Smart Pro and Anbernic H700 and RG35XX handhelds under Knulli, the Miyoo Mini, Mini Plus and Mini Flip under Onion OS, the Powkiddy RGB20S under AmberELEC, Android and Linux on x86_64 and aarch64. The author marks the Smart Pro, H700 and RG35XX packages as community tests that have not been run on real hardware, and says the 1.6.2 checks were made on a Mac only.
