versions:
  - version: v0.9.2
    date: 2026-11-14
    url: https://github.com/Manticorees/OZMA/releases/tag/v0.9.2
    notes: >-
      SONG rows now play all tracks together and empty cells are silent, an OZMA/Samples folder at the top of the SD
      card for your own WAVs, safer Wi-Fi updates with rollback only on real crashes, MIDI clock and stuck-note fixes,
      and new untested Knulli, muOS and ports-folder packages. Tested on a physical Brick running spruce.
  - version: v0.9.1
    date: 2026-11-13
    url: https://github.com/Manticorees/OZMA/releases/tag/v0.9.1
    notes: Clearer Wi-Fi update errors with its own certificate list, USB audio with an iPad, steadier MIDI clock, and experimental NextUI, MinUI and Knulli support.
  - version: v0.9
    date: 2026-11-12
    url: https://github.com/Manticorees/OZMA/releases/tag/v0.9
    notes: Adds the MORPH instrument and MORPH LOOP, MAKE LOOP, LOAD LOOP with smarter warp, the EFFECTS route map, DUCK MATTER sidechain, recording from a computer over USB and 25 in-app lessons.
  - version: v0.8.2
    date: 2026-11-09
    url: https://github.com/Manticorees/OZMA/releases/tag/v0.8.2
    notes: Adds updates over Wi-Fi, USB host mode for MIDI keyboards and class-compliant grooveboxes on the top port, USB sound card and MIDI device mode on the bottom port, MIDI clock in and out, and in-app lessons.
  - version: v0.8-beta.1
    date: 2026-11-08
    url: https://github.com/Manticorees/OZMA/releases/tag/v0.8-beta.1
    notes: First open beta for the TrimUI Brick.
