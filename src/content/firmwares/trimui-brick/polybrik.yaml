device: trimui-brick
name: PolyBrik
summary: >-
  Port of Polyend's open Tracker Community Edition firmware, built with the Tracker Mini feature set, to the TrimUI Brick and Brick Pro as a NextUI pak, with a button map, on-screen action list and Linux audio and display layer.
description: >-
  Licence note: PolyBrik follows the Tracker Community Edition licence, an MIT licence that bars selling the complete application, a port of it or firmware builds, while allowing commercial music made with it. The Polyend synth libraries it bundles are proprietary and free to redistribute unmodified.

  PolyBrik runs the Tracker CE source, vendored in the repository with its changes listed in PATCHES.md, as the Tracker Mini variant with the ACD, FAT, VAP, WTFM, PERC, DIRT and CHIP synth engines, stereo samples, the sample editor and effects, export and render, and projects on the SD card. A new layer maps the Brick's buttons to the Tracker's keys, shows an action list in place of the Mini's eight screen keys and adds a legend strip naming each button. It ships with a factory sample pack and 82 synth presets from OpenTracker.

  The README says it was tested on a Brick Pro with NextUI; the plain Brick has a key map but has not been tried on hardware. MIDI, USB audio, USB storage and audio input are not supported, so the sample recorder records silence. The project is not affiliated with Polyend or TrimUI. The 32-bit binary is built from source with the scripts in the repository.
status: active
authors:
