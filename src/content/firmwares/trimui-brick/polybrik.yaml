source: https://github.com/boorch/polybrik-public
source_status: open
license: MIT
license_notes: >-
  The LICENSE file reproduces the Polyend Tracker Community Edition licence, titled MIT License with Wholesale Commercial Clone Restriction, for the vendored firmware and the PolyBrik platform code. It bars selling the application, a port of it as a whole or firmware builds and allows commercial music. libPolySynth.a and libPolyDSP.a stay under Polyend's proprietary library licence: free to redistribute unmodified, no fee for builds containing them, no decompiling. The factory samples have their own licence (free in music, not to be sold or repackaged), the OpenTracker presets are Apache-2.0, and statically linked SDL is zlib and alsa-lib and glibc are LGPL-2.1.
based_on: polyend-tracker/tracker-ce
distribution: download
requires_stock: NextUI on the Brick or Brick Pro
install_notes: >-
  Install NextUI, unzip PolyBrik-1.0.0.zip at the root of the SD card so that Tools/tg5040/PolyBrik.pak exists, and start PolyBrik from the Tools menu. Projects, samples, patches and settings live in a PolyBrik folder at the card root and survive updates, except the app-owned Samples/PolyBrik Factory folder, which updates replace. Hold Select and Start for about two seconds to quit. Nothing is written to the console's internal firmware.
brick_risk: false
