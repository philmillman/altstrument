requires_stock: GP-200 firmware 1.8.0 (the tested version)
install_notes: >-
  Download the executable for your system from the rolling release page, or run gp200.py with Python. On Linux make it
  executable, and on macOS remove the quarantine flag. Close Valeton's editor first. Back up before any upload.
