device: valeton-gp-200
kind: tool
name: GP-200 Patch Manager
summary: >-
  Command-line Python tool for bulk backup and restore of GP-200 patches over USB MIDI. It exports slots to .prst or ZIP, uploads files, applies one template across a range and has diagnostics for the link, with prebuilt executables.
description: >-
  It moves whole .prst patches between the pedal and files. Commands list ports and slot names, export one slot, a range or
  all 256, upload files or a ZIP from a starting slot, and apply a template across a range. Reads match the web version's
  backups byte for byte on the author's pedal. The default flash upload method is confirmed on hardware, and a live method
  has a known bug for some effect parameters. PROTOCOL.md and PROTOCOL_NOTES.md document the messages and the author's
  timing tests. The README steers most people to the web version, which restores far faster, and keeps this one for scripts.
  A full restore here takes about eight minutes. It also warns that a patch stores only the number of the IR or NAM slot
  it uses. Prebuilt files for Windows, Linux and macOS are attached to a rolling release. The macOS build is unsigned and unverified.
status: active
