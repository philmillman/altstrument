  license is what the repository states for the release downloads.
homepage: https://github.com/Kaprrrr/GP-200-Tone-Desk/releases/latest
distribution: download
requires_stock: GP-200 firmware 1.8
install_notes: >-
  Unzip the Windows or Mac download, connect the pedal by USB and open the app in Chrome or Edge, then use Connect on the Pedal
  tab. Close the official editor first. The Windows launcher is not signed, so Windows may warn. Do not use releases before
  1.2.4 to send patches.
brick_risk: false
