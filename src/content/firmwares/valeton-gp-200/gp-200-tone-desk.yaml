device: valeton-gp-200
kind: tool
name: GP-200 Tone Desk
summary: >-
  Single-page Web MIDI app for the GP-200 that stores songs and a library of your SnapTone and IR slots, builds a complete patch from a Claude reply you paste in, and writes it to a preset over USB with backup, read-back and undo.
description: >-
  The Songs tab keeps a title, artist, part and guitar for each song with its patch, and the SnapTones tab lists what is in
  each capture and user IR slot. The app builds a prompt from the song, your captures and every GP-200 model for you to
  paste into Claude on claude.ai, then loads the JSON reply as a patch. Sending backs up the destination preset, writes
  every knob and block state, and reads it back to check it, with an undo of the last send and a patch file for the official
  editor. A per-song output level adjusts the volume block. Songs are kept in the browser with backup export and sharing
  by file. Releases are a Windows launcher that opens the page in Edge or Chrome and a Mac HTML file. The repository
  holds only the README, a LICENSE and screenshots; the app is in the release zips. The README says version 1.2.4 fixed
  parameter mappings that could swap delay time and feedback.
status: active
