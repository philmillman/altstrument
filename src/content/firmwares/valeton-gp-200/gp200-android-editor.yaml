device: valeton-gp-200
kind: tool
name: GP-200 Editor for Android
summary: Kotlin and Jetpack Compose preset editor for the GP-200 on Android over USB MIDI, with a 256-slot library, .prst import and export, drum patterns and CTRL assignments; source only.
description: >-
  An independent app with the interface text in Portuguese. It edits the eleven effect blocks, volume, pan
  and tempo, keeps a searchable local copy of the 256 slots, imports and exports .prst files and plays and
  adjusts the pedal's drum patterns. It also assigns the three knobs and CTRL 1 to 4, each of which can
  drive several blocks. Saving reads the slot back and compares it with what was sent before confirming. An
  offline mode lets the interface be explored without a pedal. It also keeps favourite effects, lets user IR and SnapTone slots be named and
  saved to another slot, and syncs the library on the first connection of each day. The project version is 1.0.8; no APK is
  published, so the app has to be built with Gradle on JDK 21. Parts of the preset and protocol code are
  adapted from Preset Forge, and the pedal artwork comes from GP200 Studio. The author notes that the CTRL
  assignment tests passed on a real pedal without recording its model or firmware. Not affiliated with
  Valeton.
