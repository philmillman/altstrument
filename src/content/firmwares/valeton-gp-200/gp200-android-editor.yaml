license_notes: >-
  The LICENSE file covers the repository's own code. Material adapted from Preset Forge and GP200 Studio
  keeps its original notices, and the author's THIRD_PARTY_NOTICES.md flags an unresolved question about
  the licence file in Preset Forge.
distribution: source-only
install_notes: >-
  Needs JDK 21 and the Android SDK 35. Build with ./gradlew :app:assembleDebug and install the debug APK
  with adb. The phone needs Android 8.0 or newer with USB host support and a data cable or OTG adapter. Back
  up your presets before saving anything to the pedal.
brick_risk: false
