device: valeton-gp-200
name: GP200 Custom Editor
kind: tool
summary: Windows desktop editor for the GP-200 with Stock and Custom firmware profiles, built to use the features of the GP-200 Firmware Mods build, such as scenes, NAM loading and the parallel chain.
description: >-
  Rights warning: the repository includes Editor/Data/algorithms.json, which its docs say is
  compatibility metadata derived from Valeton's official editor XML, and the effect catalogs and a
  conversion stimulus WAV are shipped the same way. The docs state this is not a claim that
  Valeton's material was relicensed under the GPL. Valeton's original editor images, chain icons and
  firmware images are left out, and the README tells users to copy the official images themselves if
  they want them, which this entry does not endorse. The 306 MB release ZIP was not downloaded or opened.

  The editor is a .NET 10 WPF application for Windows that talks to the pedal over USB MIDI. Its device
  profile setting chooses Stock, for the unmodified firmware, or Custom, for the GP-200 Firmware Mods
  build, and the Custom profile relies on the capabilities the pedal reports over USB. It edits effect
  parameters, bypass and block order live, with undo and redo, and has a preset library with save, save as,
  import, export, backups and readback checks after writes. For Custom firmware it also manages the signal
  chain with parallel paths, scenes A to D, and loading Neural Amp Modeler models into 32 stored slots with
  at most one selected NAM block per preset. A converter built from the repository's own source turns
  NAM models into CLO SnapTones, and the editor loads impulse responses. Firmware updates and factory
  reset are outside its scope, and the docs list that multi-position writes are not atomic. The author says
  it was largely written with AI assistance.
