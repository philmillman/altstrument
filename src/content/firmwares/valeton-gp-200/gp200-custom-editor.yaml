source_status: open
license: GPL-3.0-only
license_notes: >-
  COPYRIGHT states that project-owned code is GPL-3.0-only. Bundled third-party code keeps its own
  licences: the NAM-to-CLO converter sources, NeuralAmpModelerCore, AudioDSPTools and r8brain (MIT),
  Eigen (mostly MPL-2.0) and SoXR FFT support headers (LGPL-2.1). The catalog files derived from
  Valeton's editor are not relicensed.
homepage: https://github.com/Goaltoday/GP200_Custom_Editor#readme
distribution: download
requires_stock: GP-200 on stock firmware (Stock profile) or on the GP-200 Firmware Mods build (Custom profile)
install_notes: >-
  Download the release ZIP, unzip it with the Data, Converter and runtime folders kept beside the
  executable, run it on Windows x64 and choose the Stock or Custom device profile in Settings. It can also
  be built with scripts/build-app.ps1 and the .NET 10 SDK. Back up the presets first, because device writes
  can persist before a later verification error and are not rolled back automatically. The Custom
  profile needs a pedal running the Firmware Mods build.
brick_risk: false
