  the build source is in a private repository. Bundled fonts are under the SIL Open Font License 1.1.
homepage: https://asheers.github.io/gp200-librarian-web/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge, connect the GP-200 by USB and press Connect. The live and test pages share one
  browser storage, so use only one at a time and close any other editor or controller before writing. Keep the confirmed
  before-image files the page makes.
brick_risk: false
