device: valeton-gp-200
kind: tool
name: GP200 Librarian
summary: >-
  Browser librarian for the GP-200 over Web MIDI with SysEx. It reads all patches, backs them up, compares backups, and copies, moves and swaps patches with a before-image saved and a read-back check on every write, plus an undo and a journal.
description: >-
  The pedal view shows the banks, a bank map and a patch panel. It reads the pedal, makes backups to ZIP files, opens a
  backup or .prst file read-only and compares a backup with the pedal or two backups byte by byte, including backups made
  by GP-200 Patch Manager. Writes go one patch at a time: the destination is read first and saved as a file confirmed on disk,
  read again to check it has not changed, written, then read back to verify. Copy, move and swap patches have a single-level
  undo, and templates of whole patches are kept in the browser. A log can record every MIDI message, and a demo mode uses a
  simulated pedal. The published repository holds only the built pages, which include the readable source modules, and
  the README says they were built from a private repository. ATTRIBUTION.md lists the code adapted from GP-200 Patch Manager
  Web, GP200 Studio and its own parts. A test copy is published separately as asheers/gp200-librarian-preview.
status: active
