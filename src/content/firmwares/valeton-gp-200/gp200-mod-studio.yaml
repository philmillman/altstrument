requires_stock: Goaltoday's Custom0.7.5.html patcher page, placed in the patchers folder or fetched by the app from the Goaltoday repository, for the firmware builder only; the editor works without it.
install_notes: >-
  On Linux, clone the repository and run launch.sh to start the server and open it in a browser; on Android, install GP200-Mod-Studio.apk from the repository, which is unsigned by any store and not built from a release. The firmware builder writes images to ~/Documentos/GP200/firmware/mod and flashing them is a separate step that this tool does not perform; use Valeton's own updater and keep the stock image for rollback.
