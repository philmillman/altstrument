kind: tool
name: Preset Forge
summary: Browser editor for GP-200 presets that loads and saves .prst files in any browser and edits the pedal live over USB when Web MIDI with SysEx is available, with a shared preset gallery.
description: >-
  A Next.js web app hosted at preset-forge.com that also publishes its reverse-engineering notes. It opens
  and writes the 1224-byte .prst files, shows the eleven-block chain as a pedalboard with 305 effects and
  their parameters, and handles EXP and controller assignments and the effects loop position. With the
  pedal connected over USB it sends changes as they are made, can push a whole loaded preset to the unit,
  and reconnects after a dropped cable. Live editing needs a desktop Chromium browser or Firefox 108 or
  newer, because the whole protocol is SysEx; file editing works anywhere. Other parts are an
  experimental importer for Line 6 HX Stomp files, timed setlists with a count-in, and an account-based
  gallery where presets can be shared and searched by effect. The repository documents the .prst layout
  and the SysEx message set, and the site is self-hostable with Docker, PostgreSQL and an S3-compatible
  store. Not affiliated with Valeton.
