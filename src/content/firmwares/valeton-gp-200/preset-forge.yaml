homepage: https://preset-forge.com
distribution: browser-installer
requires_stock: GP-200 firmware 1.8.0
install_notes: >-
  Open preset-forge.com. For live editing use desktop Chrome, Edge or another Chromium browser, or Firefox
  108 or newer (it offers a one-time MIDI add-on), allow the SysEx permission, connect the pedal with a USB
  data cable and close Valeton's editor and any DAW first. Safari and mobile browsers can only edit files.
  Back up presets before pushing a loaded file to the unit.
