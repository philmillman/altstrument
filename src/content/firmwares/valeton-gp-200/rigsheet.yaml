homepage: https://rigsheet.rocks
distribution: browser-installer
requires_stock: GP-200 firmware 1.8.0 and editor 1.8.1 (the data source)
install_notes: >-
  Open the hosted page. File editing works in any modern browser; the USB connection needs a browser with Web MIDI
  (not Safari). A backup ZIP is downloaded before anything is written. Close Valeton's editor first.
