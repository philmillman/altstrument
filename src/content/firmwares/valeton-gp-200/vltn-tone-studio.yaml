device: valeton-gp-200
also_devices: [valeton-gp-200lt]
kind: tool
name: VLTN Tone Studio
summary: Desktop editor and librarian for Valeton pedals including the GP-200, GP-200LT and GP-200JR, with live editing over USB, backups, .prst import and export, and NAM captures and IRs sent to the pedal.
description: >-
  An Electron and React app for Windows, macOS and Linux, and a browser build for Chrome and Edge. It
  identifies the connected model, edits the chain live, manages the 256-slot library with automatic
  backups and restore, and handles CTRL assignments, patch settings, tempo and the global EQ. It converts
  Neural Amp Modeler captures into SnapTones and uploads user IRs over USB, with TONE3000 browsing, and
  includes a song splitter that proposes a preset from a recording's guitar part, which can work on a chosen section of the song. A chromatic tuner, a metronome that follows the preset's tempo, setlists with a stage mode, tags and star ratings, and randomize and morph controls are built in. The same app covers the
  GP-5, GP-50, GP-150 and GP-180, which are not separate catalog devices. The GP-200 effect list was
  generated from GP200 Studio, and Valeton's own algorithm.xml can be imported to add units. It has
  simulated pedals for trying it without hardware. Not affiliated with Valeton.
status: active
authors:
- name: Grzegorz Mołdawa
  url: https://github.com/grzmol
source: https://github.com/grzmol/VLTN-Tone-Studio
source_status: open
license: GPL-3.0-only
distribution: download
install_notes: >-
  Download the installer for your system from the latest release. The Windows and macOS builds are
  unsigned, so Windows SmartScreen and macOS Gatekeeper need a manual override. Close Valeton's editor and
  other MIDI apps first, since only one can hold the pedal's port; on Windows 11 the USB MIDI 2.0 driver
  can leave the pedal silent until it is switched back to USB Audio Device. The app backs up a slot before
  overwriting it.
brick_risk: false
tags: [editor, librarian, presets, midi, usb-midi, web-midi, nam, ir, sysex]
