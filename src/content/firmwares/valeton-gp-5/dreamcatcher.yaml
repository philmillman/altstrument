  alt: A Valeton GP-5 running Dreamcatcher, with CLOCK 8.3K on the screen and the foot switch glowing violet
  credit: the Dreamcatcher contributors
  source_url: https://github.com/OpenGP5/Dreamcatcher#readme
  first_party: true
versions:
  - version: v1.5.0
    date: 2026-11-26
    url: https://github.com/OpenGP5/Dreamcatcher/releases/tag/v1.5.0
    notes: >-
      Adds Bluetooth MIDI and USB audio, on OpenGP5 1.0.0. The pedal is now called OpenGP5 over USB, so use Launchpad 0.4.0 or the web flasher; Launchpad 0.3 and earlier do not find it.
  - version: v1.4.0
    date: 2026-11-20
    url: https://github.com/OpenGP5/Dreamcatcher/releases/tag/v1.4.0
    notes: Adds tempo sync on the main page, with a Free or Sync switch and a BPM setting that make time, rate, length and grain follow note values, saved with each preset. The loop level also sets how much of the loop reaches the effects. Built on OpenGP5 0.8.0-alpha, whose audio link restarts itself.
  - version: 1.2.0
    date: 2026-11-16
    url: https://github.com/OpenGP5/Dreamcatcher/releases/tag/v1.2.0
    notes: Adds a grain-based delay with pitch, reverse and stutter, overdub and freeze from the foot switch, a TONE control, a hall reverb section, preset names and live settings changes from OpenGP5 Launchpad. The sound moves to the pedal's control processor for longer loops and delays. Built on OpenGP5 0.5.5-alpha.
  - version: 1.1.0
    date: 2026-11-13
    url: https://github.com/OpenGP5/Dreamcatcher/releases/tag/v1.1.0
    notes: New lettering in Atkinson Hyperlegible Next and a value bar without a stray pixel at its tip. Built on OpenGP5 0.3.0-alpha, where foot switch and PARA presses are debounced and flashing from a running firmware reliably reaches update mode.
  - version: 1.0.1
    date: 2026-11-12
    url: https://github.com/OpenGP5/Dreamcatcher/releases/tag/v1.0.1
    notes: Same firmware as 1.0 on OpenGP5 0.2.1-alpha, which fixes the swapped red and blue on the screen.
  - version: 1.0.0
    date: 2026-11-12
    url: https://github.com/OpenGP5/Dreamcatcher/releases/tag/v1.0.0
