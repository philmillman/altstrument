homepage: https://freelender.github.io/frost-gp5/
based_on: valeton-gp-5/opengp5
distribution: browser-installer
requires_stock: Valeton GP-5
install_notes: >-
  Back up your sounds first: with Valeton's editor for the stock firmware, or with Presets, Back up everything in Frost
  Studio for an existing Frost install. Open Frost Studio in desktop Chrome or Edge, connect the pedal over a USB data cable,
  choose the downloaded .bin on the Firmware page and confirm; the image takes about 90 seconds and Frost storage is kept
  across updates. To recover from an interrupted update, disconnect power, hold the foot switch and PARA while reconnecting
  to enter the factory update mode, and install again. To go back to stock, install Valeton's own GP-5 image with the same
  installer. The guide describes a fault in the DSP updater of some pedals that blocks every update, Valeton's included, and
  can only be fixed with an FT232H adapter wired to the J7 header, following OpenGP5's recovery guide; the guide says the
  fault belongs to the pedal and not to Frost.
brick_risk: true
