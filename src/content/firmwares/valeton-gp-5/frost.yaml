device: valeton-gp-5
kind: firmware
name: Frost
summary: Alternative firmware for the Valeton GP-5 with a six-slot editable signal chain, 62 effect and amp types, converted NAM captures, cabinet IRs, setlists, USB audio and MIDI, and a browser editor and installer. Built on OpenGP5.
description: >-
  Frost replaces the GP-5's application firmware with a six-block chain whose effects can be chosen, reordered and
  bypassed from the pedal or from the Frost Studio website. It has 62 effect and amp types, 60 presets (20 factory sounds on
  first use), a built-in cabinet plus 63 custom cabinet slots, and up to 64 model positions for capture models converted
  from Neural Amp Modeler A2 files. The README states that these play as approximations and that Frost does not run native
  NAM. There are Chain, Stomp, Preset and Setlist home screens, song and part setlists advanced with the foot switch, a
  tuner and global settings. The 0.1.0 image adds USB MIDI, stereo 16-bit 44.1 kHz USB audio and Bluetooth MIDI reception,
  and Frost Studio edits live, manages models, cabinets and presets, makes backups and installs the firmware over WebMIDI.
  The release notes describe it as a preview: USB audio and Bluetooth are experimental, preset changes cut effect tails and
  heavy chains can exceed the DSP budget. The project states it is independent of Valeton.
