homepage: https://helvecioneto.github.io/gp5-wc/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or Opera, choose Bluetooth or USB and press Connect. The page can also be served
  locally with python3 -m http.server. Close Valeton's app first, as the pedal accepts one Bluetooth connection.
