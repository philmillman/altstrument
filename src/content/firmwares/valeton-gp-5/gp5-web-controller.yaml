device: valeton-gp-5
kind: tool
name: GP-5 Web Controller
summary: Single-page control surface for the Valeton GP-5 with two modes. Over Web Bluetooth and SysEx it shows patch names, switches blocks and effects and sets parameters. Over USB Web MIDI it sends the pedal's documented Control Change commands.
description: >-
  A static page with a connection selector. In Bluetooth mode it uses the pedal's own service and SysEx commands, listed in a
  JSON file, to sync with the pedal, load the patch list and names, toggle the ten effect blocks, pick effects and change
  parameters, and it follows changes made on the pedal. In USB mode it sends the Control Change numbers
  from Valeton's MIDI table to select presets, step banks, toggle blocks, move patch volume and call the tuner, and the mapping can be
  edited as JSON. Nothing is flashed.
status: active
