    notes: Redesigns the Tones page for NAM Loader 1.3 with one list of captures and IRs, play-on-pedal, rename, replace and gate and EQ controls, and retries a MIDI service that is not ready at start-up. Bundles Dreamcatcher 1.4.0 and NAM Loader 1.3.1.
  - version: v0.2.0
    date: 2026-11-20
    url: https://github.com/OpenGP5/Launchpad/releases/tag/v0.2.0
    notes: Works with any OpenGP5 firmware, with a Live settings page, backups, the firmware catalog and a developer page for firmware authors. Adds NAM Loader 1.3's cab IR bank and Dreamcatcher 1.4's tempo sync.
  - version: 0.1.0
    date: 2026-11-16
    url: https://github.com/OpenGP5/Launchpad/releases/tag/v0.1.0
    notes: First release, with desktop builds for macOS, Windows and Linux.
