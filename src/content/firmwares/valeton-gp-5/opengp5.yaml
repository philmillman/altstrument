homepage: https://opengp5.github.io/OpenGP5/flasher/
distribution: browser-installer
install_notes: >-
  Open the browser flasher in Chrome, Edge or Opera, connect the pedal over USB and choose a firmware or upload a .bin.
  Alternatively run python3 tools/gp5tool.py flash <file>.bin --sections all. To recover, unplug the pedal, hold the foot
  switch and the PARA knob while plugging it in, and flash again; the README suggests Valeton's own firmware flashed with
  gp5tool.py as the way back, as Valeton Suite is not reliable for that. The README warns that in some cases, such as a pedal whose DSP updater stalls, USB recovery is not enough and an FT232H adapter wired to the internal debug pads is needed.
brick_risk: true
tags: [platform, sdk, fx, usb-midi, web, flasher]
