license: MIT
license_notes: >-
  The repository has an MIT LICENSE. It also holds reverse-engineering notes and Ghidra scripts for Valeton's desktop
  app and firmware format, a decoded model catalogue and sample NAM files; no firmware image is committed.
distribution: source-only
install_notes: >-
  The hosted copy now shows a retirement notice, so run it locally with ./run.sh from the repository (a Python FastAPI
  server on 127.0.0.1:8756) and use Chrome or Edge with the pedal on USB. Chrome 152 corrupts SysEx and cannot talk to
  the pedal; use Chrome 153 or newer. The author no longer has hardware to test fixes.
brick_risk: false
