name: Valeton GP-50 Editor
summary: Browser editor for the Valeton GP-50 and GP-5 over Web MIDI, built on a reverse-engineered SysEx protocol. It reads every preset, edits blocks live, reorders and renames slots, browses SnapTone captures and IRs, and converts .prst files. The hosted copy is retired.
description: >-
  Rights warning: the repository holds effect and model tables decoded from Valeton's own software, notes that quote names
  from Valeton's firmware and editor, and two GP-5 .prst files used as test fixtures that may be Valeton factory presets.

  The page connects to the pedal over Web MIDI with SysEx, scans all presets one by one, and shows each signal chain with
  block names from Valeton's catalogue. Edits to blocks, models and parameters go to the pedal as you make them, and the
  page can rename, reorder, copy, swap and clear preset slots, and show which presets use a given SnapTone capture or user
  IR. It can wrap a saved effects chain around a capture and write the result to a slot, and convert .prst files between
  the GP-5 and GP-50 layouts in the browser. A local Python server is only used for development and for an older NAM
  converter that has moved to its own project. Writes are verified against a GP-50; GP-5 writes reuse the same commands. The
  author sold their pedal in September 2026, stopped testing against hardware and, on 26 October 2026, replaced the hosted
  site with a notice that the project is not maintained. Nothing is flashed.
