distribution: browser-installer
install_notes: >-
  Open the hosted page in a recent Chrome, Edge or Firefox and connect the amp by USB. On Android use a USB-OTG adapter;
  Firefox on Android and Safari on iOS do not work. Close ToneRoom and other MIDI software first. Saving to a slot
  overwrites that program, so export your programs to a file first.
brick_risk: false
