device: vox-valvetronix-vtx
kind: tool
name: VOX VTX Amp Librarian
summary: Browser librarian and live editor for Vox VT20X, VT40X and VT100X amps over Web MIDI, written as a replacement for Vox's ToneRoom app. It edits parameters on the amp, copies programs to and from files, imports ToneRoom .VTXPROG files and keeps a library.
description: >-
  A Kotlin/JS web app, installable as a PWA, that talks to the amp's USB MIDI port with the SysEx protocol the author recorded
  from ToneRoom on a VT20X and wrote up in the repository. It shows the eight program slots and the amp model, pedal,
  modulation, delay and reverb settings with their knobs, applies edits to the amp live, saves programs to a slot or to a
  file and loads them back, applies a whole saved set to the amp, and reads ToneRoom's .VTXPROG files. The protocol code is
  kept separate from the interface so other programs can reuse it. Only one program may use the amp at a time, so close
  ToneRoom first. It was made because ToneRoom's file import and export stopped working on Android 12. The last commit is from
  September 2024. Nothing is flashed.
status: dormant
authors:
