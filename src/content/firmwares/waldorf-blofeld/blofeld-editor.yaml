device: waldorf-blofeld
name: Blofeld Editor
kind: tool
summary: Single-file browser editor for the Blofeld in Sound mode over Web MIDI. It covers oscillators, filters, envelopes, LFOs, effects, the arpeggiator, modifiers and the modulation matrix, sends edits live and saves or loads the edit buffer as a SysEx dump.
description: >-
  The whole app is one HTML file. It follows version 1.04 of the Blofeld SysEx specification, sends each parameter change as it
  is made, asks the synth for its edit buffer and can save that buffer, or load one, as a .syx sound dump. It handles
  Sound mode only, not Multi mode. The author added touch controls and a fix for the file picker on iPad, though iOS browsers
  have no Web MIDI. Nothing is flashed.
