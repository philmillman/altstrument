  the README reserves sales of TŒRN hardware to the author.
homepage: https://toern.live/
distribution: source-only
install_notes: >-
  Build with PlatformIO using the pinned teensy41 environment and USB type Serial + MIDI + Audio, then upload through the
  Teensy loader, or use the repository's browser flasher. The Teensy 4.1's separate bootloader chip stays available, so a bad
  upload can be replaced by holding the program button. Units bought from the author arrive with firmware installed.
brick_risk: false
