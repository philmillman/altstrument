device: warft-ctrl-toern
name: TŒRN
summary: Open-source firmware for the TŒRN sampler and sequencer, with eight sample voices, three synth parts, a 32-step by 8-page grid sequencer, song mode, effects and MIDI, plus browser tools for flashing and SD cards.
description: >-
  The sequencer holds 32 steps on each of eight pages, or 16 by 16 on the smaller panel, and stores up to 999 patterns. Eight
  voices play samples from the SD card with trim, reverse and independent time stretch, and can record from the built-in mic,
  line in or mic in. A three-voice, three-oscillator poly synth with presets and two mono synths with LFO and arpeggiator share
  the grid. Each channel has an ADSR, bitcrusher, filter and reverb, steps can carry probability and conditions, and patterns
  chain into songs. The device sends and receives MIDI clock over TRS, and its USB port carries audio and serial. The
  repository also has browser tools for flashing the Teensy, managing the SD card, converting samples and simulating the unit, and the
  README describes the firmware as under very active development. It builds on the author's earlier NI404 design.
status: active
authors:
