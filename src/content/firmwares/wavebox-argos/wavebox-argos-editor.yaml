device: wavebox-argos
kind: tool
name: Wavebox Argos Editor
summary: React web app that sends parameter changes and Program Change messages from knobs on screen to a Wavebox Argos over Web MIDI and keeps a preset library in the browser. It cannot read the pedal's presets back, because the manual documents no SysEx.
description: >-
  Rights warning: the repository includes Wavebox's Argos manual as a PDF and as an .mht page.

  The page connects to a MIDI port, selects presets 1 to 40 with Program Change and sends knob changes, with value limits
  taken from the manual and a MIDI monitor. Presets 1 to 10 are treated as factory presets and cannot be overwritten, so edits to them
  go to a Save As step that offers slots 11 to 40. The library is stored in the browser with Zustand. The functions that would read
  and write a whole preset on the pedal are stubs, which the author says would need SysEx captured from the hardware. It
  was built in March 2026 and has a few unit tests. Nothing is flashed.
