device: xiphonics-picotracker-advance
name: picoTracker Advance firmware
summary: Official firmware for the picoTracker Advance, a tracker with eight stereo tracks, a voice architecture with filters and LFOs, SID, FM and macro-oscillator synths, sample slicing and USB host control surfaces.
description: >-
  The firmware shares the song, chain and phrase workflow of the RP2040 picoTracker and adds features that depend
  on the Advance hardware, such as audio recording, a master reverb and delay, and mixdown or stem rendering of
  selected song rows. Version 3 introduced a new voice architecture with per-voice filters, envelopes and LFOs and
  a sampler instrument with waveform editing, and added SID, six-operator FM (with DX7 SysEx import), a macro
  oscillator and a multi-saw synth. USB host mode accepts some pad controllers, and the device can also be mirrored
  to the remote UI.


  The Advance adapter source was part of the public picoTracker repository through tag v2.3.0, and the image
  attached to that release is pTAdvance-v2.3.0.bin. The adapter was removed in April 2026 when the projects were
  split. Since October 2026 the xiphonics/advance-firmware repository holds a source snapshot for each stable
  release from v3.0.0 onward, and the images are still distributed from the xiphonics website.
status: active
authors:
