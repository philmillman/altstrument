device: xiphonics-picotracker
name: copingTracker
summary: Fork of picoTracker 2.3 by nILS Podewski that adds a stack multi-saw instrument, a General MIDI bank, chiptune drum and lead instruments, EQ, delay and a CPU load display.
description: >-
  copingTracker keeps the picoTracker song structure of eight channels, 256 chains and 128 phrases and raises the
  instrument count to 32. Its additions include a stack instrument that builds chord wavetables from multiple saws,
  an internal 135-instrument General MIDI bank, chiptune drum and lead instruments, a modulation page on the
  instrument screen, a delay effect, 3-band EQ on the master and per channel, a compressor and a CPU load readout. Version 0.5.0 adds a piano roll for phrases and nudging of steps in the phrase, song and table views.
  It targets the RP2040 and RP2350, and the README says there is no manual yet and points to a Discord server for
  discussion.
status: active
authors:
  - name: nILS Podewski
    url: https://github.com/n1LS
source: https://github.com/n1LS/copingTracker
source_status: open
license: BSD-3-Clause
license_notes: Carries the picoTracker license text with an added 2026 copyright line, followed by a list of bundled third-party components under their own licenses.
homepage: https://github.com/n1LS/copingTracker
based_on: xiphonics-picotracker/picotracker
distribution: source-only
install_notes: >-
  Clone with submodules and run build.sh, which expects environment variables for the Pico CMake toolchain file and a
  General MIDI SoundFont. The repository has no release downloads and does not document the installation step.
brick_risk: false
tags: [tracker, fork, sequencer, synth-engine, chiptune, eq, delay, open-source]
