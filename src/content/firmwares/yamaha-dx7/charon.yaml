device: yamaha-dx7
also_devices: [korg-volca-fm]
name: Charon
kind: tool
summary: Desktop app that sends DX7 and Volca FM SysEx files to a real MIDI port, checking each checksum first, and builds new 32-voice banks from two source banks without re-encoding the voices. It is not a browser tool; it runs from source with uv.
description: >-
  Charon lists the system's MIDI ports with hot-plug tracking, takes .syx files from a file picker or drag and drop, splits files
  that hold several messages, and recognises DX7 32-voice bulk dumps and single voices. It checks the checksum before sending,
  can force the MIDI channel and spaces messages with an adjustable delay, and never splits one message. The bank workshop loads two banks,
  picks voices from them and writes or sends a third, copying the 128-byte voice blocks unchanged and recalculating the
  checksum. It was written because the author's earlier Web MIDI loader needs a secure page, which is awkward in a studio. The
  interface is in French. Nothing is flashed.
status: active
