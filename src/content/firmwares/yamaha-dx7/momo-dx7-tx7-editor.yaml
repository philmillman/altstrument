    url: https://momo-editors-home.jimdofree.com/
source_status: closed
license: proprietary
license_notes: >-
  Commercial software sold for USD 7 (6.90 EUR on the shop page), with the download link sent after payment. No source or
  licence text is published.
homepage: https://dx7-tx7editor.jimdofree.com/
distribution: commercial
install_notes: >-
  Buy it on the Momo Editors Yamaha page at momomoter.jimdofree.com/yamaha/, then use the link sent after payment. Install the
  plugin in the DAW's plugin folder or run the standalone app, and choose the MIDI ports for the synth. It writes sound data
  through MIDI only.
brick_risk: false
tags: [editor, midi, sysex, presets, fm, randomizer]
