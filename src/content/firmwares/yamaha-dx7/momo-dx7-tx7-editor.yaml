device: yamaha-dx7
name: Momo DX7 / TX7 Editor
kind: tool
summary: Paid, closed MIDI editor for the DX7 and TX7 that runs as a standalone app or as a VST2, VST3 or Audio Unit plugin, with a DAW-automatable panel, an X-Y pad, a randomiser and SysEx file load and save.
description: >-
  The panel shows all six operators, the algorithm, pitch envelope and LFO, and sends changes to the synth over MIDI. As a
  plugin it exposes many controllers to DAW automation and records their movements into the project, so the synth can serve as
  a sound module inside it. Two X-Y pads can be assigned to four parameters each, a random function generates variations, and
  sounds can be sent to the synth or saved and loaded as SysEx files. A bank of factory sounds is included. Builds exist for
  Windows (32 and 64 bit) and for macOS on Intel and Apple Silicon. It is one of several hardware editors sold under the Momo
  Editors name, and the synth's own firmware is not touched.
status: active
authors:
