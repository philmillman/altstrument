homepage: https://yuyoi.github.io/Pss-270-MegaDX/
distribution: source-only
install_notes: >-
  Needs a WiFi Mega board, a MIDI shield, an SSD1306 OLED and a 5 V supply, wired to the YM2413 pins and the 15 key leads, with one CPU-to-chip jumper cut and a wire added to the CPU reset
  transistor. Flash both chips over USB with the Arduino CLI, then learn the key matrix from the web page and update over WiFi afterwards. Nothing is written to the keyboard's own
  chips; undoing the wiring and the cut jumper returns it to stock.
