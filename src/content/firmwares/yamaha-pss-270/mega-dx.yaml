device: yamaha-pss-270
name: PSS-270 Mega DX
summary: Hardware mod that replaces the PSS-270's CPU with an Arduino Mega and ESP8266 board driving the YM2413 and the keys, adding MIDI in and out, an arpeggiator, a menu and a web FM tone editor.
description: >-
  A WiFi Mega board (ATmega2560 with an ESP8266) holds the stock CPU in reset and takes over the YM2413 sound chip and the 49-key matrix, with a MIDI shield and a small OLED added.
  The firmware plays the 100 PSS voices and the chip's 15 ROM instruments with nine-note polyphony, and adds MIDI in and out, an arpeggiator with Euclidean rhythms, software vibrato, glide, detune,
  tunings, chord memory and a filter simulated from the FM operator levels. Settings are saved and edited from a key-driven menu. The ESP serves a web page with a live editor for the chip's user tone
  that has draggable envelopes, and both chips can be updated over WiFi. The README says 68 of the 100 voices are complete and 32 are simplified, and that rhythms, auto accompaniment and
  the panel buttons are not yet supported. The Yamaha voice data is not included; the voice table is a placeholder to fill from your own keyboard. The author credits Claude, an AI assistant, with most of the code.
