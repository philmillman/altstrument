device: yamaha-pss-480
name: PortaSound JS
kind: tool
summary: Browser SysEx editor for the Yamaha PSS-480, with sliders for its two-operator FM voice. The author says it also handles the PSS-580, 680 and 780 and the PortaTone DSR-1000 and DSR-2000. It talks to the keyboard over Web MIDI.
description: >-
  Rights warning: the repository holds Yamaha product photographs, a screenshot of a Yamaha SysEx specification, a PortaSound logo
  and two DSR-2000 voice dumps, none of which comes with a stated licence.

  The app, written in React, shows the FM voice parameters as sliders and buttons, with algorithm drawings, and sends parameter messages to
  the keyboard as they change. A separate DSR-2000 page and a test bench are included. The README lists the supported models and the browsers with
  Web MIDI, and the hosted copy is on Cloudflare Pages. Nothing is flashed.
status: dormant
