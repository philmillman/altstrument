homepage: https://privatepublic-de.github.io/reface-dx-editor/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, Edge or Firefox, connect the reface DX over USB and allow MIDI access. Firefox offers a
  site permission add-on for SysEx. Turn on MIDI Control on the synth to see its knob moves. The README also describes
  an offline launcher that serves the editor from a local Node.js server. Add ?demo to the address to try it without a synth.
