device: yamaha-reface-dx
kind: tool
name: reface DX Editor
summary: Browser voice editor and librarian for the reface DX over Web MIDI. It shows every voice parameter on one screen, reads all 32 locations, converts DX7 voices to four operators, and has a demo mode with a simulated synth. Built with Claude from tests on a real unit.
description: >-
  Edits go to the synth's current voice as parameter changes. The panel draws the algorithm, four operators with envelopes and
  keyboard scaling, the LFO, pitch EG and effects, with undo and redo, and also edits the synth's own settings such as MIDI
  channels, local control and auto power-off. A Style view builds a voice from a wheel of twelve tonalities or from 41 DX7
  instruments converted to four operators, and the README says imported DX7 voices are approximations. The library reads the 32
  locations, keeps voices in browser storage, and imports and exports .syx files. The synth stores only from its own panel, so
  the editor guides the STORE step and reads the location back. The README says the code was written with Claude from Yamaha's
  data list and tests on a reface DX; each commit carries a Claude co-author line. Everything runs in the browser and nothing
  is flashed.
