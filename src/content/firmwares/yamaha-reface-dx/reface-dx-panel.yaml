device: yamaha-reface-dx
kind: tool
name: Reface DX Control Panel
summary: Single HTML file that edits a reface DX voice over Web MIDI with CC and Yamaha SysEx. It covers algorithm, four operators with draggable envelopes, pitch EG, LFO and global settings, follows changes made on the synth, and syncs with a full voice dump.
description: >-
  The page selects ports whose names contain reface, sends CC for real-time controls and SysEx for the rest, and parses
  incoming CC, parameter changes and bulk voice dumps so the controls follow the hardware. A Sync button requests a full patch
  dump, and program changes and bank-change bursts trigger a fresh request. It has no dependencies and no build step. There is no
  hosted copy; open index.html in Chrome or Edge, or serve the folder locally if SysEx is blocked on file addresses. The
  README says MIT, but the repository has no LICENSE file. Nothing is flashed.
status: active
authors:
