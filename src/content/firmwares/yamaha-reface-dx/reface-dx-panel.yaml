    url: https://github.com/lucian-labs
source: https://github.com/lucian-labs/reface-dx-panel
source_status: open
license: MIT
license_notes: The README states MIT in a License heading; there is no LICENSE file.
distribution: source-only
install_notes: >-
  Download index.html, or clone the repository, and open it in Chrome or Edge with the synth connected over USB. If file
  access causes SysEx permission problems, run npx serve . and open the local address.
brick_risk: false
