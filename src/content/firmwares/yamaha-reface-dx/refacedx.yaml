device: yamaha-reface-dx
kind: tool
name: RefaceDX
summary: Plain browser editor for all voice parameters of the reface DX over Web MIDI, from 2018. A Sync button reads the current voice, fields and menus change it, and the voice can be saved to and loaded from a text file.
description: >-
  The page shows form fields for the part mode, portamento, effects, algorithm, pitch EG, LFO, and for each of the four
  operators the frequency, level, feedback, envelope, LFO and key scaling settings, with a name box. After choosing MIDI
  input and output ports, Sync requests the voice from the synth, and edits are sent back as SysEx. It is one of a set of
  Web MIDI experiments by the author, listed at mikatahara.github.io, which has no other reface DX page. The code is on the
  gh-pages branch; the master branch holds only the README and licence. Nothing is flashed.
status: dormant
