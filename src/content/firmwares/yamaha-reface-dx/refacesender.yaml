homepage: https://normaldotcom.github.io/refacesender/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome or Edge and allow MIDI with SysEx access, with the reface DX connected over USB. If voices
  arrive garbled, raise the inter-message gap in Settings. Safari and iOS browsers have no Web MIDI.
