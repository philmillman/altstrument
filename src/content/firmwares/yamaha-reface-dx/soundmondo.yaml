device: yamaha-reface-dx
name: Soundmondo
kind: tool
summary: Yamaha's own web service for sharing reface and Montage voices, where visitors browse, rate and play user-made sounds and use Web MIDI to sync voices with a connected synth. Closed, run by Yamaha.
description: >-
  The front page has Browse, Create and Sync sections, featured users, a monthly ranking by instrument and a list of
  compatible products, among them the reface DX, the CK series and the Montage, MODX and Montage M families. Voices
  can be rated, named and given an image, and the page asks for Web MIDI permission to talk to the instrument. An
  iOS app stores and recalls reface and Montage voices and shares them to the site. Signing in is needed to share. This is
  first-party software; no source is published. Nothing is flashed.
status: active
authors:
  - name: Yamaha Corporation
    url: https://soundmondo.yamahasynth.com/
source_status: closed
license: proprietary
license_notes: >-
  Operated by Yamaha, whose page states all rights reserved and links Terms and Conditions of Use. Free to browse; the terms
  were not reviewed for this entry.
homepage: https://soundmondo.yamahasynth.com/
distribution: browser-installer
install_notes: >-
  Open the site in a Web MIDI browser, allow MIDI access with the synth connected over USB, and sign in to share voices.
  The iOS app handles voices on iPhone and iPad.
brick_risk: false
tags: [official, librarian, presets, web-midi, midi, web]
