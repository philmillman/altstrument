    url: https://github.com/philmillman
source: https://github.com/philmillman/zoom-l6-companion
source_status: open
license: MIT
homepage: https://zooml6.webmidi.cc
distribution: browser-installer
install_notes: >-
  Open the hosted app in a browser with Web MIDI (Chrome, Edge or Firefox), connect the mixer over USB and allow MIDI access.
  On iPhone and iPad, use the free MIDIWeb Browser app. Windows may need Zoom's MIDI driver. Turn off the Editor link in
  Device Settings before using the official Zoom L6 Editor.
brick_risk: false
