device: zoom-livetrak-l6
also_devices: [zoom-livetrak-l6max]
kind: tool
name: Zoom L6 Companion
summary: Browser control surface and settings editor for the LiveTrak L6 and L6max over Web MIDI. It mirrors the mixer's channels, adds an LFO to any knob, and changes the settings that otherwise need Zoom's L6 Editor, through a reverse-engineered SysEx protocol.
description: >-
  The main view has a strip per channel with EQ, sends, pan, level and mute, plus effect type and parameters, the compressor,
  scenes and the sound pads. Any knob can get its own LFO, with a choice of waveform, rate, depth and direction. Over the mixer's editor port the app reads the current settings on connect and writes
  MIDI mode and channel, battery type, auto power off, recorder mode, AUX send points, and each pad's play mode, level and
  note. It can also mount the SD card as a USB drive. It detects an L6max and adds the extra channels, scenes and send, plus
  monitor and sub-out points, USB audio settings and per-pad clock sync. CC mappings can be changed and are kept in the
  browser. A debug drawer logs MIDI and has a SysEx explorer for sweeping and diffing parameters, and docs/PROTOCOL.md
  documents the commands found so far. Nothing is flashed. The project is not affiliated with Zoom.
status: active
authors:
