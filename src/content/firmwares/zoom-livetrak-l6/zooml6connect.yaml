device: zoom-livetrak-l6
kind: tool
name: ZOOM L6 Connect
summary: >-
  Touch-first PWA mixer surface for the LiveTrak L6 over USB MIDI, built for an iPad. It sends and reads the documented Mixer Control CC mapping, adds LFOs per knob and meters USB audio, with an optional Xcode wrapper for native CoreMIDI.
description: >-
  The app shows channel strips for EQ, pan, AUX 1 and 2, EFX send and level, with mute, mono and USB routing toggles, the
  compressor and scenes A to C. It connects to the mixer's Mixer Control port and rejects the editor-only port, mirrors
  changes made on the mixer, and keeps a MIDI log. Any control can get a sine LFO whose output is rate-limited. The AUDIO
  button opens the mixer's multichannel USB audio input and drives channel and master meters with Web Audio, which the
  author checked on an iPad with 12 channels. Mixer state is stored in the browser and never sent back to the mixer on load.
  Phantom power and the master level are not in the documented mapping, so those controls send nothing. An Xcode project in
  ios/ wraps the same page in a web view and replaces Web MIDI with CoreMIDI and AVAudioEngine, because Safari has no Web
  MIDI. The repository's AGENTS.MD says the design is inspired by Zoom L6 Companion but has its own interface and
  architecture. Unlike that tool, it uses only the documented CC mapping, not SysEx, so it does not change the mixer's
  device settings or sound pads. It names the L6 only, not the L6max. Nothing is flashed.
