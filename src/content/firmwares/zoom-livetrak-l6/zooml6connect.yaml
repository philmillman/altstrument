distribution: browser-installer
install_notes: >-
  Open the hosted page in a browser with Web MIDI and connect the mixer's top USB-C port. On iPad, use Safari's Add to Home
  Screen for the PWA or build the Xcode wrapper from ios/ with a personal team; the README says Safari alone has no Web
  MIDI, and a later commit points iOS users to the MIDIWeb Browser app. Choose AUTO CONNECT L6 and check that the selected
  ports say Mixer Control.
