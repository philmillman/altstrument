device: zoom-livetrak-l6max
also_devices: [zoom-livetrak-l6]
kind: tool
name: L6 / L6max Emulator
summary: Emulator, firmware package tools and patch builder for the LiveTrak L6 and L6max. It runs Zoom's 1.10 firmware in a custom QEMU machine and repacks patched images, including a knob value display and a MIDI state sync request.
description: >-
  The project runs a firmware package you supply in a custom QEMU machine with a native mixer window that shows the
  firmware's display, indicator lights and controls. Audio processing and USB audio are not emulated; USB MIDI is bridged
  to the host. A package tool unpacks and repacks the L6 and L6max 1.10 packages and can recompute the checksum after
  edits. A patch builder compiles Rust patches into the main image, validates the original hashes first and writes a new
  update package. The two patches are a timed on-screen value popup when a channel encoder turns, for the L6max, and a
  MIDI request that makes the mixer send back its full state as Control Change messages, for both models. The patches
  run in the emulator and the knob patch has been tried on an L6max; the L6 patch has not been tested on hardware. Zoom
  firmware is not included in the repository or the release, and the project is not affiliated with Zoom.
status: active
