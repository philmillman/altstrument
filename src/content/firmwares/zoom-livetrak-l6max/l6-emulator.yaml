source: https://github.com/derekstavis/zoom-l6-hacks
source_status: open
license: GPL-3.0-or-later
license_notes: The QEMU board model under emulator/qemu is GPL-2.0-or-later, and bundled icons keep their own licenses (see NOTICE.md).
homepage: http://l6-patches.stavis.me/
distribution: patch-your-own
requires_stock: "1.10"
install_notes: >-
  Supply your own L6.BIN or L6max.bin from Zoom's 1.10 release. Build a patched package with the l6patch tool or the
  browser patcher on the project page, copy it to the SD card and install it through the mixer's normal update
  prompt. The release also has a macOS (Apple silicon) emulator app. The project notes that acceptance of arbitrary
  modified packages by the physical bootloader is unverified, so use only the supported patches on the 1.10 image.
brick_risk: false
