install_notes: >-
  Open the hosted page in Chrome or Edge, connect the pedal by USB, allow MIDI with SysEx and press CONNECT, then READ ALL.
  The README still shows a placeholder address for the page; the GitHub Pages address above is the live one. Make a JSON
  backup before writing.
