device: zoom-multistomp
kind: tool
name: HYBRID IR
summary: Free desktop app that prepares cabinet impulse responses, fits shorter FIR and IIR models and packages them as a selectable ZDL effect bank for the MS-50G, MS-60B, MS-70CDR, G1on, G1Xon and B1on. Experimental.
description: >-
  You import a WAV, choose a conventional IR or a shorter FIR with supporting IIR filters, and export a bank of one to
  eight IR slots plus OFF. The standard patcher needs no TI compiler and uses the project's own synthetic template.
  The README says hardware validation varies by model and bank, that new banks need checking on the pedal, and that two
  long IRs plus an amp can overload it. The resulting ZDL is transferred with Zoom Effect Manager. Ready-made
  effects from the same author are catalogued as Zoom ZDL FX.
