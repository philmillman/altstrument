device: zoom-multistomp
name: MIDISTOMP
summary: Patched OS for the Zoom MS-50G, MS-60B and MS-70CDR, built from your own MS-70CDR 2.10 updater, that adds MIDI program change, CC and clock, effect chain routing, Perform mode, a looper, meters and footswitch hold options.
description: >-
  A builder program writes a patched updater from Zoom's official MS-70CDR 2.10
  updater, which you then run with the pedal in update mode. One build runs on the
  MS-50G, MS-60B and MS-70CDR and updates a pedal from stock or earlier MIDISTOMP
  firmware. The README says the updater never rewrites the bootloader, so update
  mode stays available for recovery. Added features include program change for
  loading patches, CC control of the six effect slots and every knob, a MIDI menu
  for per-message receive and channel, tempo set by clock, knob or tap with a tempo
  lock across patches, and a HOLD FOR footswitch option for tuner, tempo or
  momentary use. Version 2.0 adds routing that splits the effect chain into two
  parallel buses, a Perform mode that assigns knobs and the footswitch to targets
  with beat-quantised moves, a tempo-synced looper that works with the GRDLOOP
  effect, metering pages, a visual that follows the MIDI clock and a higher DSP
  limit of 300. Tested on an MS-70CDR and an MS-60B (v1.2) and an MS-50G (v2.0).
  It pairs with the author's custom effects, which follow its tempo and Start and
  Stop. The repository also holds a parser and build tool for the pedals' updaters.
status: active
authors:
  - name: Luca Matturro (matujuice)
    url: https://github.com/matujuice
source: https://github.com/matujuice/zoom-ms-midistomp
source_status: open
license: MIT
distribution: patch-your-own
requires_stock: "MS-70CDR 2.10 updater"
install_notes: >-
  Download Zoom's official MS-70CDR 2.10 updater, which is also the file to use for
  the MS-50G and MS-60B, drag it onto MIDISTOMP-builder-Windows.exe from the
  releases page and run the updater it writes with the pedal in update mode. On a
  Mac use the Apple Silicon or Intel builder with Zoom's Mac updater. Set Settings,
  Input to stereo on an MS-70CDR and mono on the others. Zoom's own updater takes
  the pedal back to stock. The author warns that flashing modified firmware can
  brick a pedal and points to docs/safety.md in the repository.
  The README says the updater never rewrites the bootloader, so update mode (Up and Down held while plugging in USB)
  always works and the pedal can be flashed again.
brick_risk: false
tags: [midi, performance, fx, ui, patch]
