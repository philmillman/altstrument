    url: https://github.com/jiriartem
source: https://github.com/jiriartem/MidiToZoomMs
source_status: open
license: MIT
license_notes: The LICENSE file is the MIT text inherited from zoom-ms-utility, with no copyright holder name.
distribution: source-only
install_notes: >-
  No hosted copy. Serve the folder from a local web server and open it in Chrome, because the page cannot run from file://.
  The relay depends on the input and output names listed in js/sketch.js, so edit them for your MIDI interface.
brick_risk: false
