device: zoom-multistomp
kind: tool
name: MultistompMidi
summary: Python functions that add external effect switching, tap tempo control and parameter editing to the Zoom MultiStomp over MIDI, with expression pedal modules as a starting point.
description: >-
  msmidi_fx_edit.py edits parameters on the first three effects, switches the focused effect and reads or sets tap
  tempo. Switching and tap tempo work by copying the patch data, changing the relevant bits and sending it back, so the
  README warns that effect tails are cut off. The author says the expression pedal modules are a basis at most, having
  been written for the HX Stomp first.
