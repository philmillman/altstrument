device: zoom-multistomp
kind: tool
name: Zoom Effect Manager
summary: Free closed-source desktop app that chooses which effects are on a Zoom MultiStomp, G-series or B-series pedal, writes effects from any supported model, offers compressed versions to save memory, and can change a pedal's firmware to another model's.
description: >-
  Rights warning: ELynx's Zoom FX Modding instructions say the program has all stock effects prepared, and it writes
  effects from other Zoom models and converts a pedal's firmware to another model's, so it appears to carry Zoom's own
  files. Its site does not say where they come from.

  Supports the MS-50G, MS-60B, MS-70CDR, G1on, G1Xon, B1on, B1Xon, G1on-AK, G1Xon-K, G1 Four, G1X Four, B1 Four, B1X
  Four, A1 Four, A1X Four, G3n, G3Xn, B3n and G5n. It writes a selected list of effects, including custom ones, reads
  the list from a pedal and saves lists to files. The compressed effects are said to save 15 to 20 percent of memory. The
  site says writing effects only overwrites effect data, so the firmware is unchanged and the pedal still works if a
  write is interrupted. That statement does not cover the firmware change.
status: active
authors:
  - name: Pavel
    url: https://zoomeffectmanager.com/en/
source_status: binary-only
license: unspecified
license_notes: >-
  The site calls the program "absolutely free" with optional donations and states no licence or terms. No source is
  published. It names no author; Pavel comes from a third-party resources page.
homepage: https://zoomeffectmanager.com/en/
distribution: download
install_notes: >-
  Installers for Windows 7 or newer and a dmg for macOS 10.13 or newer are on the download page. There is no native Linux
  build; the site says it works in Wine.
brick_risk: true
