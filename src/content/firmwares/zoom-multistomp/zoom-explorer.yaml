device: zoom-multistomp
kind: tool
name: Zoom Explorer
summary: Browser-based patch manager and editor for Zoom MS and MS Plus pedals, hosted at sym.bios.is, with a separate explorer page and notes on the MS Plus MIDI protocol.
description: >-
  The patch manager syncs with the pedal, loads and saves patches as files, and has undo and redo. The repository's
  README documents what the author found about MIDI communication with the MS Plus series, including device IDs and
  message types. Nothing is flashed.
