device: zoom-multistomp
kind: tool
name: zoom-ms-utility
summary: >-
  Browser patch editor for the Zoom MS-50G, MS-60B and MS-70CDR over Web MIDI. It reads and writes the six-effect patches by SysEx, selects patches and the tuner, and ships with its own notes on the pedals' MIDI messages.
description: >-
  The page talks to the pedal's MIDI port named ZOOM MS Series, requests the patch data, lets you change effects and
  parameters and rename patches, and writes them back to the pedal. Its midimessage.md lists the SysEx, program change and
  tuner messages the author worked out by experiment, which the author says are not guaranteed. The README calls it a
  tentative version for checking the MIDI functions. It also describes standalone builds made with NW.js and local web
  server options, since Chrome blocks the page from file:// URLs. The repository keeps the 1.0.2 Windows and Mac
  packages only as small placeholder files in dist/. A fork by Alex Radinsky (github.com/radinsky/zoom-ms-utility, hosted at
  radinsky.github.io/zoom-ms-utility) keeps the web version only, restyles the page and turns off auto-save at start; the
  editing code is otherwise the same, so it is not listed separately.
status: dormant
authors:
