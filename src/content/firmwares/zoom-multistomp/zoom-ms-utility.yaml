homepage: https://g200kg.github.io/zoom-ms-utility/
distribution: browser-installer
install_notes: >-
  Open the hosted page in Chrome, connect the pedal by USB, accept the MIDI prompt and choose the port ZOOM MS Series.
  Opening index.html from disk does not work; use a local server or the standalone builds described in the README.
brick_risk: false
