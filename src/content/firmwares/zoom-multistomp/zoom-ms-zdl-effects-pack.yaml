    url: https://github.com/matujuice/zoom-ms-zdl-effects-pack/releases/tag/v2.0.2
    notes: Stock delays and reverbs no longer go silent or burst with noise after a pack effect has run, because every effect now cleans up the memory it shares with the pedal. Choral and GRDLOOP fit within the largest file size proven on the pedal.
