device: zoom-multistomp
name: Matujuice Zoom MS ZDL effects pack
summary: "Seventeen free custom ZDL effects for Zoom MultiStomp pedals, aimed at synths and drum machines, with source: wavefolder, pitch shifters, choir, Euclidean gate, dub siren, glitch, delay, looper, limiter, DJ filter, compressor and sweep."
description: >-
  The effects are loaded onto the pedal with Zoom's Effect Manager and are built
  from source with the free TI C6000 compiler on a linker toolchain taken from
  ZoomMultistompZDL. The tempo effects are written for the MIDISTOMP custom
  firmware, where they take tempo from MIDI clock, restart on MIDI Start and keep
  running after Stop; on stock firmware they run at 120 BPM. Release v1.5 keeps
  older builds with their own Tempo knob. Release v2.0 has seventeen effects, among
  them a bar-synced looper (GRDLOOP), a mastering limiter, a DJ filter, a mix bus
  compressor and risers, and makes several of them stereo on the MS-70CDR. Tested on an MS-60B running
  MS-50G firmware; the MS-50G, MS-70CDR and other models are untested.
status: active
authors:
  - name: Luca Matturro (matujuice)
    url: https://github.com/matujuice
source: https://github.com/matujuice/zoom-ms-zdl-effects-pack
source_status: open
license: MIT
license_notes: Copyright is shared with Roman Rusinov for the build toolchain and docs taken from ZoomMultistompZDL.
distribution: download
install_notes: >-
  Download a release, unzip it and load the .ZDL files with Zoom Effect Manager
  using Read Effects from folder. Effects with IDs in the 480 to 496 range can
  collide with other custom effects; the README explains how to change an ID and
  rebuild.
tags: [fx, wavefolder, delay, midi, synth-engine]
