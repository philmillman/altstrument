license: MIT
license_notes: >-
  The LICENSE file is MIT, copyright 2026 Roman Rusinov and 2024 Jannik Assfalg. Its scope section says the grant covers
  the original effects, browser tools, notes and artwork, still describes the upstream toolchain as unlicensed, and keeps
  Airwindows-derived DSP (MIT, Chris Johnson), Dustbox (MIT, Marcelo Fuentes) and the Matujuice pack (MIT) under their
  own terms. Built ZDLs other than the own-runtime builds embed small pieces of Zoom runtime code that the licence does not
  cover. The README says no Zoom or TI code is committed and a check script looks for stock code in a build.
homepage: https://themanro.github.io/ZoomMultistompZDL/tools/patch_editor.html
distribution: download
install_notes: >-
  Back up your patches and effect list, then install effects from the dist folder with Zoom Effect Manager 2.3.3 or newer,
  or with the Patch Editor's Effects page over USB on an MS-70CDR, which refuses name and effect-ID clashes and reads back
  every write. Power-cycle the pedal after a change. Never install two effects with the same effect ID: swapping Spool
  and TEcho4, which shared an ID, left one MS-70CDR unbootable until its ROM was reprogrammed. The NAM and cab loader is
  marked beta, and its guide has a section on what to do if the pedal freezes.
brick_risk: true
