device: zoom-multistomp
name: Zoom MultiStomp ZDL
summary: >-
  Custom .ZDL effects for ZDL-based Zoom MultiStomp pedals: a pack of 22 effects with their own screen artwork, a NAM amp and cab loader, a browser Patch Editor that can also install effects over USB, and a reverse-engineered Python and TI C6000 build toolchain.
description: >-
  The repository ships about forty ready-made effects in dist/: 22 originals and Airwindows ports, twelve effects from
  Luca Matturro's Matujuice pack, a looper and live screen effects. It also holds a loader that fits Neural Amp Modeler
  A2 Lite captures and short cabinet filters into 216 amp and 216 cab effect slots, a Web MIDI Patch Editor with a DSP
  meter, and a cover editor for the 128 by 64 pedal screen. Effects are installed with Zoom Effect Manager or, on the
  MS-70CDR, from the Patch Editor over USB. The build scripts need the TI C6000 compiler, and the docs map the ZDL
  wrapper, runtime ABI, safe DSP rules and an effect-ID registry. In November 2026 the project merged Roman Rusinov's fork
  (themanro/ZoomMultistompZDL) back into this repository and began building effects with their own
  runtime instead of code taken from Zoom's effects; the first such release was a single effect, Loop 0.03, and Manro's Scope, Spectrum, Scorch, Stasis, Mangle and Microloom followed as separate per-effect releases. Testing is
  narrow: the primary target is the MS-70CDR on firmware 2.10, the MS-50G on 3.10 is reported working for NAM and cab
  effects by a user, other ZDL pedals are unconfirmed and ZD2-based pedals are unsupported. Two effects with the same
  effect ID once left a pedal unable to boot until its ROM was reprogrammed.
