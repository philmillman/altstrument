device: zoom-multistomp
name: Zoom ZDL FX
summary: Collection of ready-made custom ZDL effects for the MS-50G, MS-60B, MS-70CDR, G1on, G1Xon and B1on, with NAM amps, IR cabinets, modified guitar amps, a synth with a Windows MIDI controller and a one-button runner game. Experimental.
description: >-
  Rights warning: the Modified Guitar Amps set is built on Zoom's own effects (the catalogue names ALIEN, FD COMBO, MS
  1959 and MS CRUNCH as bases), and the repository distributes those ZDL files under its MIT licence.

  The other sets are NAM drive effects, dual and hybrid IR cabinets made with the author's HYBRID IR, the SYNTHESIS
  SYNx2 synth with its Windows controller, and LM_DINO, a dinosaur runner game installed as an effect. The README says
  behaviour depends on the pedal, firmware, effect chain and DSP load, and that compatibility varies by effect; LM_DINO
  needs MS-70CDR firmware.
status: active
authors:
  - name: Leemuzhko
    url: https://github.com/Leemuzhko
source: https://github.com/Leemuzhko/Zoom-ZDL-FX
source_status: open
license: MIT
license_notes: >-
  LICENSE is the MIT text, copyright 2026 Leemuzhko. It cannot grant rights in the Zoom effects that the Modified Guitar
  Amps are based on; see the rights warning above.
distribution: download
install_notes: >-
  Download a single effect or the all-effects package from the releases page and install it with Zoom Effect Manager,
  keeping each ZDL with its JSON and image. Check each project's model notes first.
brick_risk: false
tags: [fx, zdl, nam, ir, synth-engine, game]
