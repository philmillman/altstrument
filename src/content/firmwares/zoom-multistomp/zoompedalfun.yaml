device: zoom-multistomp
name: ZoomPedalFun
kind: tool
summary: Collection of tips, reverse-engineering notes and scripts for Zoom B1On, B1XFour and G1XFour pedals, later extended to G5, G3n, G5n and MS-70CDR, with Ctrlr panels. Use at your own risk.
description: >-
  The README also links to related projects: Zoom Firmware Editor, zoom-zt2,
  g200kg's zoom-ms-utility, Johnny Marnell's zoom-stomp, SysExTones g1on,
  PiPedalController, zdownload, the zoom-dev MIDI docs and MultistompMidi.
