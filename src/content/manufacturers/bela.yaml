name: Bela
website: https://bela.io/
notes: Bela grew out of the Augmented Instruments Laboratory at Queen Mary University of London, where Andrew McPherson's group released the first Bela cape on Kickstarter in 2016. It now makes the Bela Gem boards, the Gliss and Trails Eurorack modules and the Trill touch sensors. Its core software, IDE, SD-card images and hardware designs are published on GitHub (github.com/BelaPlatform).
