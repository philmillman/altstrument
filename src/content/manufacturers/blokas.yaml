name: Blokas
website: https://blokas.io/
notes: Blokas (Vilniaus Blokas UAB) is a Lithuanian company that makes the Pisound and Pimidi Raspberry Pi add-on boards, the Midihub MIDI processor, the Midiboy kit and the Patchbox OS image for the Raspberry Pi. It publishes its board definitions, libraries and Midiboy sketches on GitHub (github.com/BlokasLabs).
